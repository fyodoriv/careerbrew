name: Gate part

# One part of the hosted gate: `scripts/setup.sh`, then `scripts/check.sh` with
# CHECK_STEPS (and E2E_SHARD for an e2e share). ci.yml runs the parts in
# parallel. Read docs/ci.md before you change it. The safety rules of ci.yml
# apply here too: no secrets, no artifact, read-only token, pinned actions.

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      steps:
        description: the gate steps this part runs (CHECK_STEPS)
        type: string
        required: true
      shard:
        description: the e2e share i/n (E2E_SHARD), empty when the part runs no e2e
        type: string
        default: ""
      gitleaks_asset:
        type: string
        required: true
      gitleaks_sha256:
        type: string
        required: true
      cold:
        description: run with every dependency cache off, to re-measure cache gains (docs/ci.md, "Dependency caches")
        type: boolean
        default: false
      rust_cache:
        description: trial of Swatinem/rust-cache for the Rust steps (docs/ci.md, "Dependency caches")
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Never send usage data from a runner: an empty key means nothing is sent.
  # Not DO_NOT_TRACK: the telemetry story tests that switch itself.
  CAREERBREW_POSTHOG_KEY: ""
  # The Linux part compares the pictures drawn on its own image; the darwin pictures stay local (docs/ci.md).
  CAREERBREW_VISUAL_PICTURES: hosted
  UNIT_JOBS: "2"
  E2E_JOBS: "2"
  GITLEAKS_VERSION: "8.30.1"
  # A Linux runner has `gh` in /usr/bin, so one readiness test cannot hide it; the test asks for this switch.
  PUBLIC_READINESS_TESTS_ALLOW_SYSTEM_GH: "1"

jobs:
  part:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate compares the branch with origin/main.
          fetch-depth: 0
          persist-credentials: false

      # A pull request checkout is detached. One story bundles the local `main` branch.
      - name: Local main branch
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: ${{ !inputs.cold }}
          # The frozen HTTP reference (xtask/tests/fixtures/capture) holds this exact
          # version in its Server header; tests/unit/test_hosted_ci.py keeps them equal.
          python-version: "3.12.16"

      # A Rust capture test runs uv with a cleared environment, so uv must find
      # its cache at the default place.
      - name: Put the uv cache at its default path
        run: |
          # With the cache off (a cold run), setup-uv sets no UV_CACHE_DIR.
          [ -n "${UV_CACHE_DIR:-}" ] || exit 0
          mkdir -p "$UV_CACHE_DIR" "$HOME/.cache"
          [ -e "$HOME/.cache/uv" ] || ln -s "$UV_CACHE_DIR" "$HOME/.cache/uv"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ !inputs.cold && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json

      - name: Rust toolchain (the pin in rust-toolchain.toml)
        run: |
          pin="$(sed -nE 's/^channel = "([0-9.]+)"$/\1/p' rust-toolchain.toml)"
          [ -n "$pin" ] || { echo "no Rust pin found in rust-toolchain.toml" >&2; exit 1; }
          rustup toolchain install "$pin" --profile minimal --component clippy --component rustfmt --no-self-update
          # Put the real tools first on PATH, not the rustup proxies: a proxy sets
          # RUSTUP_TOOLCHAIN, and the supervisor tests refuse that override.
          dirname "$(rustup which --toolchain "$pin" rustc)" >> "$GITHUB_PATH"
          rustc --version

      - name: Cache Rust build (trial)
        if: ${{ inputs.rust_cache && !inputs.cold }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: gitleaks (pinned release, checked SHA-256)
        env:
          ASSET: ${{ inputs.gitleaks_asset }}
          SHA256: ${{ inputs.gitleaks_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/gitleaks"
          file="gitleaks_${GITLEAKS_VERSION}_${ASSET}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks/$file" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/$file" -C "$RUNNER_TEMP/gitleaks" gitleaks
          mv "$RUNNER_TEMP/gitleaks/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Cache Playwright browsers
        if: ${{ !inputs.cold }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Setup (scripts/setup.sh)
        # Keep the launcher out of the runner's real bin folder. The doctor
        # needs `careerbrew` on PATH.
        run: |
          PATH="$RUNNER_TEMP/bin:$PATH" CAREERBREW_BIN_DIR="$RUNNER_TEMP/bin" scripts/setup.sh

      - name: Playwright browser (Chromium)
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Gate part (scripts/check.sh)
        env:
          CHECK_STEPS: ${{ inputs.steps }}
          E2E_SHARD: ${{ inputs.shard }}
        run: scripts/check.sh
