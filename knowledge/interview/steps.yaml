# Generated by scripts/import-research.py from knowledge/research/interview-research.yaml. Edit the research file, then rerun.
steps:
  recruiter-screen:
    name: Recruiter screen
    description: A short phone or video call with a recruiter. It checks basic fit, motivation, logistics, and pay range. The recruiter also explains the next steps and who you will meet.
    evaluated:
    - Why you want this company and role.
    - Fit of your skills with the job description.
    - Logistics such as location, work permit, and notice period.
    - Whether your pay expectations fit the role's range.
    - Clear, concise communication about your background.
    typical_minutes: 15-40
    tips:
    - text: Prepare a short, tailored self-introduction. Cover background, one or two highlights with numbers, and why this role.
      sources: &id001
      - handbook-gitlab-candidate-handbook-scree
      - google-google-careers-our-hiring-process
      - techinterviewhandbook-tech-interview-han
      - interviewing-interviewing-io-stripe-inte
      - kalzumeus-patrick-mckenzie-salary-negoti
    - text: Prepare a specific answer to 'Why this company?'.
      sources: *id001
    - text: Do not give a salary number first. Deflect or ask for the role's range.
      sources: *id001
    - text: Ask who you will meet and what technical exercises to expect.
      sources: *id001
    - text: Be on time. GitLab waits only 5 minutes before it marks a no-show.
      sources: *id001
    - text: Be honest about location, visa needs, and notice period.
      sources: *id001
    traps:
    - text: Giving a specific salary number or your pay history early.
      sources: *id001
    - text: A chronological 'history lesson' instead of a focused pitch.
      sources: *id001
    - text: A generic 'why us' answer that could fit any company.
      sources: *id001
    - text: Not asking about the process, so you prepare for the wrong rounds.
      sources: *id001
    prep:
    - 'You practiced this: Prepare a short, tailored self-introduction. Cover background, one or two highlights with numbers, and why this role.'
    - 'You practiced this: Prepare a specific answer to ''Why this company?''.'
    sources: *id001
  hiring-manager:
    name: Hiring manager interview
    description: A conversation with the manager of the team you would join. It mixes behavioral questions, a review of past projects, and a check of team fit. The manager often also sells the role.
    evaluated:
    - Teamwork and how you work with others.
    - How fast you learn and adapt.
    - Proactive ownership of problems.
    - Depth on your past projects and decisions.
    - Fit with the team's needs and the company's values.
    typical_minutes: 30-60
    tips:
    - text: Prepare 3-5 high-impact project stories that you can adapt to many questions.
      sources: &id002
      - levels-levels-fyi-how-to-prepare-for-a-s
      - techinterviewhandbook-tech-interview-han-2
      - techinterviewhandbook-tech-interview-han-3
    - text: Explain your own actions and reasons, not only what the team did.
      sources: *id002
    - text: Research the company's values and recent products before the call.
      sources: *id002
    - text: Prepare questions for the manager, such as the most important problem you would solve and how success is measured.
      sources: *id002
    - text: Ask about management style, 1:1s, and how the team decides what to work on.
      sources: *id002
    traps:
    - text: Having no questions, which can look like low interest.
      sources: *id002
    - text: Describing the project but not your role in it.
      sources: *id002
    - text: Blaming former teammates or managers.
      sources: *id002
    - text: Skipping the result and the lesson learned.
      sources: *id002
    prep:
    - 'You practiced this: Prepare 3-5 high-impact project stories that you can adapt to many questions.'
    - 'You practiced this: Explain your own actions and reasons, not only what the team did.'
    sources: *id002
  technical-phone-screen:
    name: Technical phone screen
    description: A live coding interview with an engineer, usually over video in a shared editor. It filters candidates before the onsite. Some companies turn off code execution in this round.
    evaluated:
    - 'Communication: clarifying questions and narrating your approach.'
    - Problem solving and choice of an optimal approach.
    - Working, clean code.
    - Testing with normal and edge cases.
    - Time and space complexity analysis.
    typical_minutes: 45-60
    tips:
    - text: Ask 2-3 clarifying questions and work a small example before coding.
      sources: &id003
      - techinterviewhandbook-tech-interview-han-4
      - techinterviewhandbook-tech-interview-han-5
      - techinterviewhandbook-tech-interview-han-6
      - interviewing-interviewing-io-google-inte
    - text: Outline approaches and their trade-offs, then code after the interviewer agrees.
      sources: *id003
    - text: Practice coding without running code or an IDE, because some screens do not allow it.
      sources: *id003
    - text: Use a headset, test your setup, and keep both hands free to type.
      sources: *id003
    - text: Trace your code with test inputs before you say you are done.
      sources: *id003
    traps:
    - text: Jumping into code before explaining the plan.
      sources: *id003
    - text: Saying 'done' while obvious bugs remain.
      sources: *id003
    - text: Going silent or ignoring the interviewer's hints.
      sources: *id003
    - text: Missing details in the prompt, such as a sorted input.
      sources: *id003
    prep:
    - 'You practiced this: Ask 2-3 clarifying questions and work a small example before coding.'
    - 'You practiced this: Outline approaches and their trade-offs, then code after the interviewer agrees.'
    sources: *id003
  online-assessment:
    name: Online assessment (OA)
    description: A timed, often unproctored coding test on a platform such as CodeSignal or HackerRank. Some include system design or work-style questions. Companies use it to filter before human interviews.
    evaluated:
    - Correct code that passes hidden test cases.
    - Coverage of edge cases and detailed rules.
    - Speed within a fixed time window.
    - Work style or values fit, in some OAs (for example Amazon's Work Style Survey).
    typical_minutes: 70-120
    tips:
    - text: Read the invitation for the exact format and time limit. Companies can customize it.
      sources: &id004
      - prachub-prachub-codesignal-oa-guide
      - amazon-amazon-sde-ii-interview-prep-oa-f
    - text: Scan all questions first and choose an order that fits your strengths.
      sources: *id004
    - text: Submit working progress often. Partial credit counts on CodeSignal.
      sources: *id004
    - text: Turn long prompts into explicit rules before coding.
      sources: *id004
    - text: Run full-length timed mock sessions before the real test.
      sources: *id004
    traps:
    - text: Perfecting one question while others stay blank.
      sources: *id004
    - text: Waiting until the end to submit, then losing work to a timeout.
      sources: *id004
    - text: Using outside help or AI against the test rules.
      sources: *id004
    - text: Missing specification details in data-manipulation questions.
      sources: *id004
    prep:
    - 'You practiced this: Read the invitation for the exact format and time limit. Companies can customize it.'
    - 'You practiced this: Scan all questions first and choose an order that fits your strengths.'
    sources: *id004
  take-home:
    name: Take-home assignment
    description: A project or review task you do on your own time and then submit. Some companies follow it with a live discussion. It shows how you plan, build, test, and document real work.
    evaluated:
    - Meeting all stated requirements.
    - Code quality, naming, and structure.
    - Tests and handling of edge cases.
    - Clear README and setup steps.
    - Clear written communication of decisions (for example GitLab's async merge request review).
    typical_minutes: varies (GitLab suggests up to 60 minutes for its async review)
    tips:
    - text: Read the brief carefully and ask about unclear requirements early.
      sources: &id005
      - freecodecamp-freecodecamp-the-essential-
      - handbook-gitlab-handbook-technical-inter
      - careers-datadog-the-candidate-experience
    - text: Plan first. List decisions, sketch the design, and break work into small tasks.
      sources: *id005
    - text: Get it working first, then polish, then optimize.
      sources: *id005
    - text: Write tests even if not required.
      sources: *id005
    - text: Write a README with setup steps, versions, and how each requirement is met. Test the steps yourself.
      sources: *id005
    - text: Remove debug logging and commented-out code before you submit.
      sources: *id005
    traps:
    - text: 'Scope creep: adding many extra features and not finishing.'
      sources: *id005
    - text: Learning several new technologies at once.
      sources: *id005
    - text: Making silent assumptions instead of asking or documenting them.
      sources: *id005
    - text: Coding right away without a plan.
      sources: *id005
    prep:
    - 'You practiced this: Read the brief carefully and ask about unclear requirements early.'
    - 'You practiced this: Plan first. List decisions, sketch the design, and break work into small tasks.'
    sources: *id005
  coding-onsite:
    name: Onsite coding round
    description: One or more live coding rounds in the final loop, now often virtual. Formats range from algorithm problems to practical work such as debugging a codebase or integrating an API.
    evaluated:
    - Communication while solving.
    - Problem solving and optimization.
    - 'Technical competency: clean, working code.'
    - Testing and bug fixing.
    typical_minutes: 45-60
    tips:
    - text: 'Use the same routine every round: clarify, discuss approaches, code, then test.'
      sources: &id006
      - techinterviewhandbook-tech-interview-han-4
      - techinterviewhandbook-tech-interview-han-7
      - techinterviewhandbook-tech-interview-han-5
      - amazon-amazon-sde-ii-interview-prep-oa-f
    - text: Draw diagrams for trees, graphs, and matrices.
      sources: *id006
    - text: Split big problems into helper functions.
      sources: *id006
    - text: State the time and space complexity when done.
      sources: *id006
    - text: Ask your recruiter which formats to expect, such as debugging or integration rounds.
      sources: *id006
    traps:
    - text: Arguing with the interviewer or interrupting hints.
      sources: *id006
    - text: Writing pseudocode or too many comments instead of working code.
      sources: *id006
    - text: Poor variable names and repeated code.
      sources: *id006
    - text: Ending without asking any questions.
      sources: *id006
    prep:
    - 'You practiced this: Use the same routine every round: clarify, discuss approaches, code, then test.'
    - 'You practiced this: Draw diagrams for trees, graphs, and matrices.'
    sources: *id006
  system-design:
    name: System design interview
    description: An open-ended discussion where you design a real-world system with several components. It is common for mid and senior roles and often affects your level.
    evaluated:
    - 'Problem navigation: requirements, priorities, and a working design.'
    - 'Solution design: core concepts, scaling, and performance.'
    - 'Technical excellence: current technologies and common patterns.'
    - Communication and collaboration with the interviewer.
    typical_minutes: 45-60
    tips:
    - text: Start with a short list of top functional requirements and quantified non-functional requirements.
      sources: &id007
      - hellointerview-hello-interview-system-de
      - hellointerview-hello-interview-system-de-2
      - techinterviewhandbook-tech-interview-han-8
      - interviewing-interviewing-io-google-inte
    - text: Define core entities and the API before the high-level design.
      sources: *id007
    - text: Reach a complete working design first, then deep-dive on bottlenecks.
      sources: *id007
    - text: Discuss trade-offs out loud and leave room for interviewer probes.
      sources: *id007
    - text: Ask clarifying questions about dependencies and SLAs.
      sources: *id007
    - text: Practice the drawing tool before the interview.
      sources: *id007
    traps:
    - text: Adding complexity too early and never finishing a working design.
      sources: *id007
    - text: Vague requirements such as 'low latency' with no target.
      sources: *id007
    - text: Capacity estimates that never change the design.
      sources: *id007
    - text: Talking over the interviewer or getting defensive about feedback.
      sources: *id007
    prep:
    - 'You practiced this: Start with a short list of top functional requirements and quantified non-functional requirements.'
    - 'You practiced this: Define core entities and the API before the high-level design.'
    sources: *id007
  behavioral:
    name: Behavioral interview
    description: Questions about how you acted in past situations, such as conflict, failure, or leadership. Companies use past behavior to predict future behavior. It also helps set your level.
    evaluated:
    - Communication and collaboration.
    - Leading and influencing others.
    - Conflict resolution.
    - Ownership, learning from mistakes, and growth.
    - Fit with the company's published values or principles.
    typical_minutes: 45-60
    tips:
    - text: 'Answer with STAR: Situation, Task, Action, Result. Add a Reflection to show growth.'
      sources: &id008
      - techinterviewhandbook-tech-interview-han-3
      - amazon-amazon-sde-ii-interview-prep-oa-f
      - aboutamazon-amazon-interview-tips-from-b
    - text: Build a story bank of 3-5 rich projects. One story can answer several questions.
      sources: *id008
    - text: Map your stories to the company's values before the loop.
      sources: *id008
    - text: Use bullet-point outlines, not scripts, and practice out loud.
      sources: *id008
    - text: Include metrics and data in results.
      sources: *id008
    traps:
    - text: Memorizing word-for-word answers.
      sources: *id008
    - text: Under-preparing because coding gets more attention. Weak behavioral rounds do cause rejections.
      sources: *id008
    - text: Talking about the team's work instead of your own actions.
      sources: *id008
    - text: Hiding mistakes or blaming others.
      sources: *id008
    prep:
    - 'You practiced this: Answer with STAR: Situation, Task, Action, Result. Add a Reflection to show growth.'
    - 'You practiced this: Build a story bank of 3-5 rich projects. One story can answer several questions.'
    sources: *id008
  pair-programming:
    name: Pair programming interview
    description: You build or fix code together with an engineer, as you would on the job. The focus is on collaboration and reasoning, not only on a correct final answer. Some companies now allow or expect
      AI tools in this round.
    evaluated:
    - How you think and explain your reasoning.
    - How you take suggestions and collaborate.
    - Incremental, working progress on a multi-part problem.
    - Code quality and testing as you go.
    typical_minutes: 60-90
    tips:
    - text: Clarify requirements, then agree on an approach before typing.
      sources: &id009
      - designgurus-design-gurus-tips-for-pair-p
      - handbook-gitlab-handbook-technical-inter
      - interviewing-interviewing-io-stripe-inte
      - interviewing-interviewing-io-amazon-inte
    - text: Think out loud so your partner can follow and help.
      sources: *id009
    - text: Build the core feature first, then edge cases and optimizations.
      sources: *id009
    - text: Test small pieces as you go.
      sources: *id009
    - text: Structure code so new requirements can be added without a rewrite.
      sources: *id009
    - text: Ask the recruiter if AI tools are allowed. Some companies expect them; Stripe and Amazon forbid them.
      sources: *id009
    traps:
    - text: Coding silently.
      sources: *id009
    - text: Ignoring or dismissing your partner's input.
      sources: *id009
    - text: Perfecting edge cases before the core works.
      sources: *id009
    - text: Losing track of time.
      sources: *id009
    prep:
    - 'You practiced this: Clarify requirements, then agree on an approach before typing.'
    - 'You practiced this: Think out loud so your partner can follow and help.'
    sources: *id009
  bar-raiser:
    name: Bar Raiser interview (Amazon)
    description: An interview in the Amazon loop led by a trained interviewer from outside the hiring team. The Bar Raiser acts as an objective third party and steward of the Leadership Principles. They
      help run a fair debrief.
    evaluated:
    - Long-term success at Amazon, not only fit for this one role.
    - Leadership Principles shown through real stories.
    - Data-driven results and clear decision reasons.
    - Whether you raise the bar. Amazon's stated goal is that each hire beats 50 percent of people in similar roles.
    typical_minutes: '55'
    tips:
    - text: Prepare one or two stories for each Leadership Principle.
      sources: &id010
      - aboutamazon-amazon-exploring-amazon-s-un
      - aboutamazon-amazon-interview-tips-from-b
      - amazon-amazon-sde-ii-interview-prep-oa-f
      - interviewing-interviewing-io-amazon-inte
    - text: Show the principles through your actions; do not just name them.
      sources: *id010
    - text: End every answer with a measurable result.
      sources: *id010
    - text: Explain technical points more fully. The Bar Raiser may come from another field.
      sources: *id010
    - text: Be honest about your mistakes.
      sources: *id010
    traps:
    - text: Force-fitting principle names into answers.
      sources: *id010
    - text: Blaming others for failures.
      sources: *id010
    - text: Answers that end without a result.
      sources: *id010
    - text: Oversharing or negative talk about past employers.
      sources: *id010
    prep:
    - 'You practiced this: Prepare one or two stories for each Leadership Principle.'
    - 'You practiced this: Show the principles through your actions; do not just name them.'
    sources: *id010
  team-match:
    name: Team matching
    description: After you pass the loop, you talk with managers of teams that have openings. Both sides must opt in. At Google this step can decide whether and when you get an offer.
    evaluated:
    - Mutual fit between your skills and the team's needs.
    - Your interest in the team's problems.
    - Fit with the manager's working style.
    typical_minutes: varies (several conversations over days or weeks)
    tips:
    - text: Ask the recruiter to send an updated, tailored resume to managers or the hiring committee.
      sources: &id011
      - interviewing-interviewing-io-google-inte
      - techinterviewhandbook-tech-interview-han-2
    - text: Prepare questions about team structure, day-to-day work, and the most important problem you would solve.
      sources: *id011
    - text: Talk to several teams if you can, then choose deliberately.
      sources: *id011
    - text: Expect this to take days to weeks and plan other offers around it.
      sources: *id011
    traps:
    - text: Assuming a passed onsite means a guaranteed offer. The offer can depend on a successful match.
      sources: *id011
    - text: Going in with no questions for the manager.
      sources: *id011
    - text: Being surprised by a short decision window. Ask the recruiter how long you have to decide.
      sources: *id011
    prep:
    - 'You practiced this: Ask the recruiter to send an updated, tailored resume to managers or the hiring committee.'
    - 'You practiced this: Prepare questions about team structure, day-to-day work, and the most important problem you would solve.'
    sources: *id011
  offer-negotiation:
    name: Offer and negotiation
    description: The recruiter presents an offer and you negotiate the package. Pay usually has base salary, bonus, equity, and sometimes a signing bonus. This is often the highest-value hour of the whole
      search.
    evaluated:
    - Your clarity about what you want and your timeline.
    - Credible alternatives, such as competing offers.
    - Reasons that the recruiter can take to the decision-maker.
    typical_minutes: varies
    tips:
    - text: Negotiate every offer. Harvard PON reports negotiators gained about 5,000 USD in starting pay on average.
      sources: &id012
      - techinterviewhandbook-tech-interview-han-9
      - techinterviewhandbook-tech-interview-han-10
      - kalzumeus-patrick-mckenzie-salary-negoti
      - pon-harvard-pon-salary-negotiation-how-t
    - text: Get every detail in writing, including vesting schedule and signing bonus conditions.
      sources: *id012
    - text: Give a reason for each request.
      sources: *id012
    - text: Compare total compensation, not only base salary.
      sources: *id012
    - text: Tell other companies you have an offer and ask them to speed up.
      sources: *id012
    - text: Negotiate beyond money too, such as team, start date, or learning budget.
      sources: *id012
    traps:
    - text: Revealing your current pay or a number first.
      sources: *id012
    - text: Accepting on the spot under time pressure.
      sources: *id012
    - text: Sounding negative about the company while negotiating.
      sources: *id012
    - text: Bluffing about offers you do not have.
      sources: *id012
    prep:
    - 'You practiced this: Negotiate every offer. Harvard PON reports negotiators gained about 5,000 USD in starting pay on average.'
    - 'You practiced this: Get every detail in writing, including vesting schedule and signing bonus conditions.'
    sources: *id012
  reference-check:
    name: Reference check
    description: The company contacts people who worked with you, usually late in the process. It confirms your story and how you work. GitLab lists references as a formal stage before the offer.
    evaluated:
    - Consistency between your references and your resume.
    - Your strengths and working style from people who saw your work.
    - Recent, relevant performance.
    typical_minutes: varies
    tips:
    - text: Pick people who worked closely with you in the last five years.
      sources: &id013
      - connect-informs-career-center-how-to-pre
      - handbook-gitlab-candidate-handbook-scree
    - text: Ask permission first and confirm their title and contact details.
      sources: *id013
    - text: Send each reference your resume and the job description.
      sources: *id013
    - text: Tell them who will call and when, and remind them of a few key wins.
      sources: *id013
    - text: Thank them and tell them the outcome.
      sources: *id013
    traps:
    - text: Listing someone without asking.
      sources: *id013
    - text: Stale contact details.
      sources: *id013
    - text: Short-notice requests.
      sources: *id013
    - text: References whose story contradicts your resume.
      sources: *id013
    prep:
    - 'You practiced this: Pick people who worked closely with you in the last five years.'
    - 'You practiced this: Ask permission first and confirm their title and contact details.'
    sources: *id013
