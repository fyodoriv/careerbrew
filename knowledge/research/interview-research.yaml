        url: "https://interviewing.io/datadog-interview-questions"

claims:
  - claim_id: retrieval-practice
    claim: "Testing yourself (retrieval practice) improves long-term retention more than restudying."
    sources:
      - title: "Roediger & Karpicke (2006), Test-Enhanced Learning, Psychological Science"
        url: "https://doi.org/10.1111/j.1467-9280.2006.01693.x"
      - title: "Roediger & Butler (2011), The critical role of retrieval practice in long-term retention, Trends in Cognitive Sciences"
        url: "https://doi.org/10.1016/j.tics.2010.09.003"

  - claim_id: worked-examples
    claim: "Novices learn problem solving faster from studying worked examples than from solving problems unaided; examples work best when their steps are clearly structured."
    sources:
      - title: "Atkinson, Derry, Renkl, Wortham (2000), Learning from Examples: Instructional Principles from the Worked Examples Research, Review of Educational Research"
        url: "https://doi.org/10.3102/00346543070002181"

  - claim_id: self-explanation
    claim: "Explaining to yourself why a step or answer is right is a useful learning technique (rated moderate utility); practice testing and distributed practice rate highest."
    sources:
      - title: "Dunlosky, Rawson, Marsh, Nathan, Willingham (2013), Improving Students' Learning With Effective Learning Techniques, Psychological Science in the Public Interest"
        url: "https://doi.org/10.1177/1529100612453266"

  - claim_id: effective-feedback
    claim: "Feedback strongly affects learning, positively or negatively; it helps most when it says where the learner is going, how they are doing, and what to do next, at the level of the task and process rather than the self."
    sources:
      - title: "Hattie & Timperley (2007), The Power of Feedback, Review of Educational Research"
        url: "https://doi.org/10.3102/003465430298487"

  - claim_id: spacing-effect
    claim: "Spaced practice beats massed practice. The best gap between sessions grows with how long you need to remember."
    sources:
      - title: "Cepeda, Pashler, Vul, Wixted, Rohrer (2006), Distributed practice in verbal recall tasks, Psychological Bulletin"
        url: "https://doi.org/10.1037/0033-2909.132.3.354"

  - claim_id: fsrs-scheduler
    claim: "FSRS models each card with difficulty, stability, and retrievability. Its docs report about 20-30% fewer reviews than SM-2 for the same retention, based on simulations."
    sources:
      - title: "ABC of FSRS (open-spaced-repetition wiki)"
        url: "https://github.com/open-spaced-repetition/awesome-fsrs/wiki/ABC-of-FSRS"
      - title: "free-spaced-repetition-scheduler (GitHub)"
        url: "https://github.com/open-spaced-repetition/free-spaced-repetition-scheduler"

  - claim_id: structured-interviews-predict-performance
    claim: "Structured interviews are among the most valid predictors of job performance. A 2022 re-analysis ranks them first."
    sources:
      - title: "Schmidt & Hunter (1998), The validity and utility of selection methods in personnel psychology, Psychological Bulletin"
        url: "https://doi.org/10.1037/0033-2909.124.2.262"
      - title: "Sackett, Zhang, Berry, Lievens (2022), Revisiting meta-analytic estimates of validity in personnel selection, Journal of Applied Psychology"
        url: "https://doi.org/10.1037/apl0000994"
      - title: "Google Careers: Our hiring process (structured interviewing with clear rubrics)"
        url: "https://www.google.com/about/careers/applications/how-we-hire/"

  - claim_id: practice-interviews-before-target-companies
    claim: "Practice interviews are linked to higher pass rates. interviewing.io reports that after 5 mock interviews, chances of passing real interviews double on average. This is observational platform data, not a controlled trial."
    sources:
      - title: "interviewing.io: We analyzed 100K technical interviews"
        url: "https://interviewing.io/blog/we-analyzed-100k-technical-interviews-to-see-where-the-best-performers-work-here-are-the-results"
      - title: "interviewing.io: How do I know if I'm ready to interview at FAANG?"
        url: "https://interviewing.io/blog/how-know-ready-interview-faang"

  - claim_id: company-cooldown-periods
    claim: "Companies often ask rejected candidates to wait 6-12 months before reapplying. Google says at least a year; GitLab says 6 months."
    sources:
      - title: "Google Careers: Our hiring process (FAQ on reapplying)"
        url: "https://www.google.com/about/careers/applications/how-we-hire/"
      - title: "GitLab Candidate Handbook (reapplying)"
        url: "https://handbook.gitlab.com/handbook/hiring/candidate-faq/"

  - claim_id: wsjf-prioritization
    claim: "Weighted Shortest Job First ranks work by cost of delay divided by job duration. SAFe credits the cost-of-delay idea to Don Reinertsen."
    sources:
      - title: "SAFe: Weighted Shortest Job First (WSJF)"
        url: "https://framework.scaledagile.com/wsjf"

  - claim_id: planning-fallacy
    claim: "People underestimate how long their own tasks will take (the planning fallacy)."
    sources:
      - title: "Buehler, Griffin, Ross (1994), Exploring the 'planning fallacy', Journal of Personality and Social Psychology"
        url: "https://doi.org/10.1037/0022-3514.67.3.366"

  - claim_id: brag-document
    claim: "Keep a running brag document of your work and impact, so you and your manager do not rely on memory at review or interview time."
    sources:
      - title: "Julia Evans: Get your work recognized, write a brag document"
        url: "https://jvns.ca/blog/brag-documents/"

  - claim_id: goal-question-metric
    claim: "Define measurement top-down. Set goals first, derive questions, then pick metrics that answer them."
    sources:
      - title: "Basili, Caldiera, Rombach (1994), The Goal Question Metric Approach"
        url: "https://www.cs.umd.edu/~mvz/handouts/gqm.pdf"

  - claim_id: salary-negotiation
    claim: "Negotiate every offer, avoid naming a number first, and give reasons. Harvard PON reports negotiators gained about 5,000 USD in starting pay on average."
    sources:
      - title: "Patrick McKenzie: Salary Negotiation"
        url: "https://www.kalzumeus.com/2012/01/23/salary-negotiation/"
      - title: "Harvard PON: Salary negotiation, how to ask for a higher salary"
        url: "https://www.pon.harvard.edu/daily/salary-negotiations/salary-negotiation-how-to-ask-for-a-higher-salary/"
      - title: "Tech Interview Handbook: Negotiation rules"
        url: "https://www.techinterviewhandbook.org/negotiation-rules/"

  - claim_id: star-method
    claim: "Structure behavioral answers with STAR (Situation, Task, Action, Result). Amazon recommends it."
    sources:
      - title: "Amazon: SDE II interview prep (STAR)"
        url: "https://www.amazon.jobs/content/en/how-we-hire/sde-ii-interview-prep"
      - title: "Tech Interview Handbook: Behavioral interview"
        url: "https://www.techinterviewhandbook.org/behavioral-interview/"
