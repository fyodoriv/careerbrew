      - step: technical-phone-screen
        notes: "Third-party: about 1 hour, two coding questions in CoderPad."
      - step: coding-onsite
        notes: "Face-to-face interviews, possibly several rounds or panels (official). Third-party: 1-2 coding rounds, medium problems with practical twists."
      - step: system-design
        notes: "Third-party: 1 hour with a narrower scope than 'design Twitter'; used for leveling."
      - step: take-home
        notes: "Some roles get a take-home project, scoped by the recruiter (official)."
      - step: hiring-manager
        notes: "Third-party: behavioral round led by a hiring manager or director. For some roles, a final executive interview (official)."
      - step: team-match
