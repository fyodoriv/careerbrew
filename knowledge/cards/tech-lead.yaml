- id: kb-3967c7dd0344
  question: How do you keep a team's code easy to maintain?
  answer: Agree on shared conventions and automate them with formatters and linters, keep a strong test
    suite and CI, review every change, write clear modules with small interfaces, document decisions,
    and continuously refactor and pay down debt instead of saving it for a rewrite.
  topic: tech lead
  tags:
  - maintainability
  - code-quality
  - refactoring
  - engineering-practices
  explanation: '## In plain words

    Maintainable code is code that a teammate, or you in six months, can understand and change safely.
    It comes from shared habits applied every day, not from one big clean-up.


    ## How it works

    - **Conventions**: style guide enforced automatically (formatter, linter) so reviews focus on logic.

    - **Tests and CI**: fast automated tests on every change; tests make refactoring safe.

    - **Code review**: every change reviewed; small PRs.

    - **Design**: clear module boundaries, small interfaces, low coupling; good names.

    - **Documentation**: README, architecture overview, and decision records explaining why.

    - **Refactoring**: the "boy scout rule" (leave code a bit cleaner than you found it); reserve capacity
    for debt.

    - **Dependencies**: keep them updated in small steps.

    - **Ownership**: clear owners for each module.


    ## Example

    Fictional team agreement:

    ```text

    - All code formatted by the formatter; CI fails on lint errors.

    - New logic needs tests; coverage must not drop.

    - PRs under 400 lines; one reviewer minimum.

    - Architecture decisions get a one-page record in docs/decisions/.

    - 20% of each sprint for refactoring and upgrades.

    ```


    ## Common mistakes

    - Relying on one expert''s memory instead of docs and tests.

    - Waiting for a big rewrite.

    - Style debates in review that a tool could settle.

    - Clever code that only the author understands.


    ## In the interview

    As a tech lead, show that maintainability is a team habit you build and protect. Expect "how do you
    convince product to give time for refactoring?" (tie it to delivery speed and incident data).

    '
