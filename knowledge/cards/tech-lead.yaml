- id: kb-0b9ce24bb6fb
  question: What does TEMPLE stand for in observability?
  answer: 'TEMPLE is a proposed extension of the "three pillars" of observability to six kinds of telemetry:
    Traces, Events, Metrics, Profiles, Logs, and Exceptions. The idea is that each signal answers different
    questions and they are most useful when correlated.'
  topic: tech lead
  tags:
  - observability
  - telemetry
  - tracing
  - monitoring
  explanation: '## In plain words

    Observability is how well you can understand a system''s internal state from the data it emits. The
    classic "three pillars" are metrics, logs, and traces. TEMPLE is an acronym some practitioners use
    to argue for six signal types instead of three.


    ## How it works

    - **Traces**: the path of one request across services, with timing per step.

    - **Events**: structured records of something that happened (a deploy, a user action), often rich
    in context.

    - **Metrics**: numbers aggregated over time (request rate, error rate, latency percentiles).

    - **Profiles**: where CPU time or memory is spent inside code, sampled continuously.

    - **Logs**: timestamped text or structured lines from code.

    - **Exceptions**: errors with stack traces, grouped by type.

    Key point: correlate them using shared identifiers (trace IDs, service names) so you can jump from
    a metric spike to traces, logs, and profiles. Open standards such as OpenTelemetry help collect several
    signals consistently.


    ## Example

    Fictional investigation: a latency metric spikes at 14:00. A deploy event at 13:58 is the suspect.
    Traces show the slow part is the pricing service. Its continuous profile shows a new JSON parser using
    most CPU. Exceptions show timeouts in callers. The team rolls back.


    ## Common mistakes

    - Collecting everything with no way to connect signals.

    - High-cardinality metrics that explode cost.

    - Logs with no structure or trace IDs.

    - Treating the acronym as a strict standard; it is a framing, not a specification.


    ## In the interview

    As a tech lead, focus on what each signal is for and how you correlate them. Mention OpenTelemetry,
    SLOs on user-facing metrics, and cost control. Expect "where would you start in a system with no observability?"
    (structured logs plus RED metrics: rate, errors, duration).

    '
