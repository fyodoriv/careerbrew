- id: kb-a16acf0ab4af
  question: How should a team handle production incidents?
  answer: Detect quickly, declare an incident, assign clear roles such as an incident commander and a
    communications lead, mitigate first to restore service, then find root cause. Communicate status regularly,
    and afterwards run a blameless postmortem with tracked action items.
  topic: tech lead
  tags:
  - incident-management
  - on-call
  - postmortem
  - reliability
  explanation: '## In plain words

    An incident is an unplanned event that hurts users or the business, such as an outage. Good handling
    is calm and structured: restore service first, understand later, and learn so it does not happen again.


    ## How it works

    **During**

    - **Detect**: alerts on user-facing symptoms (error rate, latency).

    - **Declare**: open an incident channel; set severity.

    - **Roles**: incident commander (coordinates, decides), operations lead (hands-on fixes), communications
    lead (status updates).

    - **Mitigate first**: roll back, fail over, disable a feature flag, add capacity.

    - **Communicate**: regular updates to stakeholders and status page.

    - **Keep a timeline** of actions.

    **After**

    - **Blameless postmortem**: what happened, impact, contributing causes, what went well, action items
    with owners.

    - **Track actions** to completion; look for patterns across incidents.


    ## Example

    Fictional timeline:

    ```text

    10:02 alert: checkout error rate 12%

    10:05 incident declared, IC assigned

    10:11 recent deploy suspected; rollback started

    10:17 errors back to 0.3%; monitoring

    10:45 resolved; postmortem scheduled

    ```

    Postmortem finds a missing test for a config change; action: add a config validation step to CI.


    ## Common mistakes

    - Debugging root cause while users are still down.

    - Everyone jumping in with no coordinator.

    - Blaming individuals, which hides future problems.

    - Postmortem actions that are never done.


    ## In the interview

    As a tech lead, show calm structure, prioritisation of mitigation, and a learning culture. Mention
    severity levels, roles, and blameless postmortems. Expect "tell me about an incident you led" and
    "how do you reduce repeat incidents?"

    '
