- id: kb-6d87e07917fd
  question: Tell me about a time you drove an operational excellence improvement on your team.
  answer: Pick a measurable operational problem such as noisy alerts, slow incident recovery, or flaky
    deploys, show how you quantified it, got the team on board, made systemic fixes, and measured the
    result. End with how you made the improvement stick.
  topic: tech lead
  tags:
  - operational-excellence
  - reliability
  - behavioral
  - on-call
  explanation: '## In plain words

    Operational excellence means running systems reliably and efficiently: good monitoring, smooth deploys,
    fast recovery, and few repeat incidents. This question tests whether you improve the system, not just
    fight fires.


    ## How it works

    Shape (STAR plus learning):

    - **Situation**: the pain, with numbers (pages per week, time to restore, failed deploys).

    - **Task**: your role and goal.

    - **Action**: analyse root causes; prioritise fixes; change practices (alert review, runbooks, postmortems,
    SLOs); get time on the roadmap.

    - **Result**: before and after metrics.

    - **Sustain**: a recurring review or ownership so it does not decay.


    ## Example

    Fictional sample answer: "Our on-call averaged 45 pages a week, and most were not actionable. I tagged
    every page for two weeks: 70% came from five alerts with bad thresholds. With the team, we deleted
    or tuned them, added runbooks for the rest, and set a rule that every page gets a follow-up ticket.
    Pages fell to 8 a week, and time to restore dropped from 50 to 20 minutes. We now review alerts monthly."


    ## Common mistakes

    - Describing heroic firefighting rather than prevention.

    - No metrics.

    - Fixing it alone, so knowledge stays with you.

    - No mechanism to keep the improvement.


    ## In the interview

    Scored signals: data-driven diagnosis, systemic fixes, team involvement, and sustained results. Expect
    "how did you get roadmap time for this?" (show cost in engineer hours and customer impact).

    '
