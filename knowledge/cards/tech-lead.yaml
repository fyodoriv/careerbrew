  question: What is a tech lead, and what do they do?
  answer: 'A tech lead is an engineer responsible for the technical direction and delivery of a team:
    they guide architecture and design, set quality standards, break down and coordinate work, mentor
    engineers, and partner with product and the engineering manager. They usually still write code, but
    less on the critical path.'
  topic: tech lead
  tags:
  - tech-lead
