- id: kb-3bd17bb00967
  question: What is mob programming?
  answer: 'Mob programming is when the whole team works on the same task, at the same time, on one computer
    or shared screen: one driver types while the others navigate, and roles rotate every few minutes.
    It spreads knowledge and improves quality, at the cost of individual parallel throughput.'
  topic: tech lead
  tags:
  - mob-programming
  - pairing
  - collaboration
  - knowledge-sharing
  explanation: '## In plain words

    Mob programming (also called ensemble programming) extends pair programming to the whole team. Everyone
    works on one problem together, like a group of chefs cooking one dish with one person holding the
    knife.


    ## How it works

    - **Driver**: types, but does not decide alone; follows the navigators.

    - **Navigators**: discuss and direct what to write.

    - **Rotation**: driver changes every few minutes (often 5 to 15), using a timer.

    - **Rule** (strong-style pairing): "for an idea to go from your head into the computer, it must go
    through someone else''s hands", so ideas are spoken aloud.

    - **Setup**: one shared screen or remote tool, breaks, and a retro at the end.

    Benefits: fast knowledge sharing, fewer handoffs and reviews, better decisions on hard problems, quick
    onboarding.

    Costs: fewer parallel tasks, tiring, can be dominated by loud people without facilitation.


    ## Example

    Fictional session: a team of four mobs on a tricky data migration for two hours. A timer rotates the
    driver every ten minutes. The new hire drives in the first rotation and learns the codebase quickly.
    They finish with no separate review needed, since four people already checked the code.


    ## Common mistakes

    - Using it for simple tasks where it wastes effort.

    - No rotation, so one person does all the work.

    - Skipping breaks.

    - Forcing it on the team without trying it first.


    ## In the interview

    As a tech lead, explain when you would use it: complex or risky changes, onboarding, spreading knowledge
    on a bus-factor-one area. Expect "isn''t it inefficient?" (compare total time including reviews, rework,
    and handoffs).

    '
