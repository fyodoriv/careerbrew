- id: kb-6f46e9cc252d
  question: How do you make your team more productive?
  answer: 'Find and remove the biggest bottlenecks: unclear priorities, too much work in progress, slow
    builds and reviews, interruptions, and manual toil. Measure flow, fix one constraint at a time, protect
    focus time, and ask the team what slows them down.'
  topic: tech lead
  tags:
  - productivity
  - flow
  - developer-experience
  - tech-lead
  explanation: '## In plain words

    Productivity rarely improves by pushing people to work harder. It improves by removing friction, so
    the same effort turns into more delivered value.


    ## How it works

    - **Ask and measure**: developer surveys plus data such as lead time, review wait, build time, and
    time in meetings.

    - **Clarity**: clear priorities and well-defined work reduce waste.

    - **Limit work in progress**: finish before starting new things.

    - **Fast feedback**: speed up CI, tests, and local setup.

    - **Fast reviews**: small PRs and a review time norm.

    - **Protect focus**: meeting-free blocks; rotate interrupt duty for support.

    - **Automate toil**: repetitive manual tasks.

    - **Theory of constraints**: improve the slowest step first; improving others does little.


    ## Example

    Fictional sample answer: "Our lead time was six days. A breakdown showed PRs waited three days for
    review. We set a same-day review norm, capped PRs at about 300 lines, and added a daily ''review hour''.
    Lead time dropped to two days in a month without anyone working longer."


    ## Common mistakes

    - Measuring hours or lines of code.

    - Adding process or tools without finding the bottleneck.

    - Ignoring developer experience.

    - Pushing for overtime.


    ## In the interview

    Scored signals: systems thinking, measurement, and people focus. Mention DORA metrics and the theory
    of constraints. Expect "how do you balance productivity with quality?"

    '
