- id: kb-e333a4e01285
  question: How do you give effective feedback?
  answer: 'Give feedback soon, privately for criticism, and specifically: describe the situation, the
    behaviour, and its impact, then listen and agree on next steps. Give positive feedback often and sincerely,
    adapt to the person, and follow up.'
  topic: tech lead
  tags:
  - feedback
  - communication
  - sbi
  - coaching
  explanation: '## In plain words

    Feedback is information about how someone''s actions affect results or people, given so they can grow.
    It works when it is specific, timely, and delivered with care for the person.


    ## How it works

    - **Timely**: within days, not at review time.

    - **Private for corrective feedback**, public or private for praise depending on the person.

    - **SBI model**: Situation (when and where), Behaviour (what they did, observable), Impact (the effect).

    - **Ask**: "How did you see it?" Listen before concluding.

    - **Next step**: agree on what to try differently.

    - **Balance**: give positive feedback often so corrective feedback is not the only kind.

    - **Radical candour** (a popular framing): care personally and challenge directly at the same time.

    - **Follow up** and notice improvement.


    ## Example

    Fictional SBI feedback:

    "In yesterday''s design review (situation), you interrupted Sam twice while he was explaining his
    proposal (behaviour). He stopped contributing for the rest of the meeting, and we lost his input on
    the database choice (impact). What was going on for you? ... Next time, could you note your questions
    and raise them after he finishes?"


    ## Common mistakes

    - Vague feedback ("be more proactive").

    - The "feedback sandwich" that hides the message.

    - Judging intent or character instead of behaviour.

    - Waiting until the problem is big.


    ## In the interview

    Scored signals: clarity, empathy, and habit of giving feedback regularly. Expect "how do you give
    feedback to your manager or a peer?" (same model, framed as your perspective) and "how do you receive
    feedback?"

    '
