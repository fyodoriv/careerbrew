- id: kb-bc081c262aee
  question: How is a staff engineer different from a senior engineer?
  answer: 'A senior engineer delivers complex work independently and leads within a team. A staff engineer
    has impact across teams: they set technical direction, solve ambiguous organisation-wide problems,
    align people through influence, and multiply others, often writing less code themselves.'
  topic: tech lead
  tags:
  - staff-engineer
  - career-ladder
  - technical-leadership
  - roles
  explanation: '## In plain words

    The step from senior to staff is a change in scope, not just skill. A senior engineer owns hard problems
    in a team; a staff engineer owns problems that span teams and makes many engineers more effective.


    ## How it works

    **Senior engineer**

    - Delivers large features or systems end to end.

    - Makes sound design decisions; mentors teammates.

    - Scope: one team or system.

    **Staff engineer**

    - Scope: several teams or an organisation.

    - Finds and frames the important problems, often ambiguous ones.

    - Sets technical strategy, writes and reviews key design docs.

    - Aligns people across teams with influence, not authority.

    - Raises the bar through standards, mentoring, and sponsorship.

    Common archetypes (popularised by a well-known book on the topic): tech lead, architect, solver, and
    right hand.


    ## Example

    Fictional contrast: a senior engineer redesigns the team''s caching layer and cuts latency 40%. A
    staff engineer notices five teams each built their own caching, writes a proposal for a shared approach,
    gets agreement from four tech leads, and guides the migration over two quarters.


    ## Common mistakes

    - Thinking staff is just "a better coder".

    - Doing more work alone instead of multiplying others.

    - Avoiding ambiguous problems and organisational work.

    - Assuming the title comes with authority.


    ## In the interview

    Show you know the difference is scope and leverage. Give an example of cross-team impact if you are
    aiming for staff. Expect "what does a staff engineer do in a week?" (design reviews, mentoring, strategy
    docs, unblocking, some coding).

    '
