cards:
- id: kb-9be2e2f8a1a4
  question: How do you avoid over-engineering?
  answer: Solve the problem you have now with the simplest design that meets known requirements, keep
    it easy to change, and add complexity only when real data or needs demand it. Use YAGNI, clear requirements,
    design reviews that ask "what if we did less?", and fast feedback from users.
  topic: tech lead
  tags:
  - over-engineering
  - yagni
  - simplicity
  - design
  explanation: '## In plain words

    Over-engineering is building more than needed: extra layers, generic frameworks, or scale for traffic
    that never comes. It costs time now and makes change harder later.


    ## How it works

    - **Clarify requirements**: real numbers for load, data size, and change frequency.

    - **YAGNI** ("you aren''t gonna need it"): do not build for speculative futures.

    - **Simplest thing that works**: then refactor when patterns appear (often after the third similar
    case).

    - **Design for change**: clear boundaries and tests make later growth cheap, which removes the urge
    to over-build.

    - **Reversible decisions**: favour choices easy to undo.

    - **Review questions**: "What is the smallest version? What would we lose by doing less?"

    - **Measure**: optimise when profiling or usage data shows the need.


    ## Example

    Fictional example: a team plans microservices, a message queue, and sharding for an internal tool
    used by 50 people. In review, the lead asks for expected load: under 10 requests per second. They
    ship a single service with one database in two weeks, with clear modules so it can be split later
    if needed.


    ## Common mistakes

    - Building a plugin system for one plugin.

    - Premature optimisation without measurements.

    - Copying big-company architectures.

    - Swinging to under-engineering: ignoring known requirements such as security.


    ## In the interview

    As a tech lead, show judgment: you balance simplicity with known needs. Expect "give an example where
    you did build ahead, and why" (for example, a hard-to-change data schema or a public API).

    '
