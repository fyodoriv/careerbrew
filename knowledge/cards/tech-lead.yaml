- id: kb-3354d591e7a9
  question: Why are deadlines important in software teams?
  answer: Deadlines coordinate work that others depend on, such as launches, contracts, and marketing,
    force prioritisation and scope decisions, and create focus. They work best when they are realistic,
    explain their reason, and allow scope to flex rather than quality.
  topic: tech lead
  tags:
  - deadlines
  - planning
  - prioritization
  - delivery
  explanation: '## In plain words

    A deadline is a date by which something must be delivered. Even though software is hard to estimate,
    deadlines are useful because businesses run on coordinated plans, and time limits help teams decide
    what really matters.


    ## How it works

    Why they matter:

    - **Coordination**: sales, marketing, support, partners, and other teams plan around dates.

    - **External constraints**: regulations, contracts, events, or seasonal peaks.

    - **Focus**: a time box forces scope choices and reduces endless polishing (Parkinson''s law: work
    expands to fill the time available).

    - **Feedback**: shipping sooner gets real user data.

    Making them healthy:

    - Distinguish hard deadlines (external) from target dates (internal).

    - Set them with estimates from the team.

    - Fix the date, flex the scope; protect quality.

    - Track progress and raise risk early.

    - Avoid constant artificial urgency, which causes burnout and distrust.


    ## Example

    Fictional case: a new tax rule takes effect on a fixed date. The team lists required and optional
    changes, ships the required calculation changes two weeks early, and moves a reporting improvement
    to the following month.


    ## Common mistakes

    - Treating every date as a hard deadline.

    - Imposing dates without input from engineers.

    - Cutting testing to meet the date.

    - Hiding risk until the last moment.


    ## In the interview

    As a tech lead, show you respect deadlines and manage them with scope and communication. Expect "what
    do you do when a deadline is clearly unrealistic?" (present data, offer options with smaller scope
    or a later date).

    '
