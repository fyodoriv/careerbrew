  - technical-leadership
  - team
  explanation: '## In plain words

    A tech lead (TL) is the person who makes sure the team builds things the right way technically. The
    role is about leadership through technical judgment, not about being the fastest coder.


    ## How it works

    - **Technical direction**: architecture, design reviews, technology choices, decision records.

    - **Quality**: standards for tests, reviews, reliability, and security.

    - **Execution**: break projects into tasks, identify risks, coordinate dependencies with other teams.

    - **People**: mentor, pair, delegate interesting work, grow future leads.

    - **Partnership**: work with the product manager on scope and feasibility, and with the engineering
    manager on staffing and process.

    - **Coding**: stays hands-on, but avoids being a bottleneck on critical tasks.

    Differences: an engineering manager owns people management (reviews, hiring, careers); a staff engineer
    often works across several teams. In some companies the TL and EM roles are combined.


    ## Example

