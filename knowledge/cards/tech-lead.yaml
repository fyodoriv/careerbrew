- id: kb-b60d3b2145e5
  question: What is an error budget?
  answer: An error budget is the amount of unreliability a service may have in a period, equal to 100%
    minus its SLO. For example, a 99.9% availability SLO over 30 days allows about 43 minutes of downtime.
    Teams spend it on releases and experiments; when it is used up, they shift effort to reliability.
  topic: tech lead
  tags:
  - error-budget
  - slo
  - sre
  - reliability
  explanation: '## In plain words

    An error budget turns reliability into a shared, measurable number. Instead of arguing "move fast"
    versus "be stable", product and engineering agree how much failure is acceptable, then use that allowance.


    ## How it works

    - **SLI** (service level indicator): a measured signal, such as the share of successful requests.

    - **SLO** (service level objective): the target for the SLI, such as 99.9% over 30 days.

    - **Error budget** = 1 - SLO. At 99.9%, 0.1% of requests may fail, or about 43.2 minutes of full downtime
    in 30 days (30 x 24 x 60 x 0.001).

    - **Policy**: if budget remains, ship features and take risks; if it is exhausted, freeze risky releases
    and fix reliability until it recovers.

    - **Burn rate alerts**: page when the budget is being consumed much faster than planned.

    This practice comes from Site Reliability Engineering (SRE) as described in Google''s public SRE books.


    ## Example

    Fictional month: SLO 99.9%, budget about 43 minutes. A bad deploy causes 25 minutes of outage on day
    10, and smaller issues use 15 more. With 3 minutes left, the team pauses feature releases, adds a
    canary stage, and fixes the flaky dependency. Next month starts with a fresh budget.


    ## Common mistakes

    - Setting 100% as the goal, which is impossible and blocks change.

    - SLOs on internal metrics users do not feel.

    - A budget policy nobody follows.

    - Choosing SLOs without product input.


    ## In the interview

    As a tech lead, explain SLI, SLO, budget, and the policy, and show the arithmetic. Expect "how do
    you choose an SLO?" (based on user expectations and current performance, slightly below what dependencies
    offer).

    '
