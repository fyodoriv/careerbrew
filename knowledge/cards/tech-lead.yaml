- id: kb-87471583e135
  question: How do you lead a team that is new to you?
  answer: 'Spend the first weeks listening and learning: 1:1s, the system, the backlog, past incidents,
    and stakeholders. Then share what you heard, agree on a few priorities with the team, deliver an early
    win, and introduce changes gradually with the team''s input.'
  topic: tech lead
  tags:
  - new-team
  - onboarding
  - trust
  - leadership
  explanation: '## In plain words

    Joining a team as its leader is a transition for everyone. Moving too fast loses trust; moving too
    slowly loses momentum. A simple 30-60-90 day approach balances both.


    ## How it works

    - **Days 1 to 30, learn**: 1:1s with each person (goals, pains, ideas); architecture walkthroughs;
    read docs, incidents, and the roadmap; meet stakeholders; ship a small change yourself to learn the
    workflow.

    - **Days 31 to 60, align**: share a summary of what you heard; agree two or three priorities with
    the team; deliver a quick win on a shared pain.

    - **Days 61 to 90, improve**: make bigger changes (process, architecture plans) with the team''s input;
    set goals for the next quarter.

    Throughout: keep promises, give credit, ask before changing what works.


    ## Example

    Fictional sample answer: "On my new team, every 1:1 mentioned slow code reviews. In week five I shared
    the themes I heard, and we agreed on a one-day review norm and smaller PRs. Review wait time halved
    within a month. That gave me credibility to propose a bigger change later: splitting a large service."


    ## Common mistakes

    - Changing processes in week one.

    - Criticising predecessors or past decisions.

    - Learning only the code and not the people.

    - Waiting months before taking any action.


    ## In the interview

    Scored signals: listening, prioritisation, and early credibility. Expect "what if the team resists
    your changes?" and "how do you handle someone who wanted your role?"

    '
