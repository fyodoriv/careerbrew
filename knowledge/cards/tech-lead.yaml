- id: kb-764d5ae5c5f8
  question: What is progressive delivery?
  answer: Progressive delivery releases changes gradually to a growing share of users while monitoring
    metrics, so problems affect few people and can be rolled back fast. Common techniques are feature
    flags, canary releases, blue-green deployments, and percentage rollouts with automated analysis.
  topic: tech lead
  tags:
  - progressive-delivery
  - feature-flags
  - canary
  - deployment
  explanation: '## In plain words

    Progressive delivery builds on continuous delivery: instead of releasing to everyone at once, you
    widen the audience step by step, watching for trouble. It separates deploying code from releasing
    features.


    ## How it works

    - **Feature flags**: switch a feature on or off for chosen users without a deploy.

    - **Canary release**: route a small percentage of traffic to the new version first.

    - **Blue-green deployment**: run old (blue) and new (green) environments; switch traffic over and
    back instantly.

    - **Percentage rollout**: 1% to 10% to 50% to 100%, with pauses.

    - **Automated analysis**: compare error rate and latency of the new version against the old; roll
    back automatically if they get worse.

    - **Targeting**: internal users first, then a region, then everyone.

    Benefits: smaller blast radius, faster recovery, safer experiments.


    ## Example

    Fictional rollout plan:

    ```text

    Stage 1: employees only (1 day)

    Stage 2: 5% of users, auto-rollback if error rate > baseline + 0.5%

    Stage 3: 25% for 4 hours

    Stage 4: 100%; remove flag in next sprint

    ```


    ## Common mistakes

    - Flags never removed, causing complex, dead code.

    - Rolling out without watching metrics.

    - Incompatible database changes that block rollback.

    - Treating it as a substitute for testing.


    ## In the interview

    As a tech lead, explain how you would set it up: flag tooling, metrics, rollback rules, and schema
    changes done in backward-compatible steps (expand then contract). Expect "how do you handle database
    migrations with progressive delivery?"

    '
