- id: kb-5c2ba77d1e22
  question: What is a canary release?
  answer: A canary release deploys a new version to a small subset of servers or users first, compares
    its health metrics with the current version, and then gradually rolls it out to everyone or rolls
    it back if it misbehaves. It limits the blast radius of bad changes.
  topic: tech lead
  tags:
  - canary
  - deployment
  - progressive-delivery
  - reliability
  explanation: '## In plain words

    The name comes from miners who carried canaries to detect toxic gas early. In software, a small slice
    of traffic acts as the early warning: if the new version is bad, only a few users notice and you roll
    back.


    ## How it works

    - **Deploy** the new version alongside the old.

    - **Route** a small share of traffic (for example 1 to 5 percent), or specific users or regions, to
    the canary.

    - **Compare** canary versus baseline: error rate, latency, saturation, business metrics.

    - **Decide**: promote in steps (5%, 25%, 100%) if healthy; roll back automatically if worse beyond
    a threshold.

    - **Tools**: load balancers, service meshes, or deployment tools with automated canary analysis.

    Requirements: good metrics, enough traffic for meaningful comparison, and backward-compatible data
    changes so old and new versions can run together.


    ## Example

    Fictional canary check:

    ```text

    Version  Traffic  Error rate  p95 latency

    v41      95%      0.20%       180 ms

    v42      5%       1.10%       190 ms   -> error rate 5.5x baseline: auto rollback

    ```


    ## Common mistakes

    - Canary too small or too short to detect problems.

    - Comparing to a baseline with different traffic.

    - Database schema changes that break the old version.

    - Not watching business metrics such as checkout success.


    ## In the interview

    Explain the process, the metrics, and the rollback rule. Compare with blue-green deployments (instant
    full switch) and feature flags (release per feature, not per build). Expect "what if the problem only
    shows up after hours?" (longer bake times, monitoring after full rollout).

    '
