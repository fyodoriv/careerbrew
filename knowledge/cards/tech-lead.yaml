- id: kb-004885bd5361
  question: How do you manage and reduce technical debt?
  answer: Make debt visible in a register with its cost to the business, prioritise the items that slow
    delivery or cause incidents most, and pay them down continuously with reserved capacity or alongside
    related features. Prevent new debt with standards, reviews, and conscious, documented shortcuts.
  topic: tech lead
  tags:
  - tech-debt
  - refactoring
  - prioritization
  - maintainability
  explanation: "## In plain words\nTechnical debt is the extra future cost created by shortcuts or outdated\
    \ designs, like interest on a loan. Some debt is a smart trade-off; unmanaged debt slows every change\
    \ and causes incidents.\n\n## How it works\n- **Identify**: ask the team where work is slow or risky;\
    \ look at incident causes, hot spots that change often, and slow tests.\n- **Register**: list items\
    \ with impact (hours lost per month, incident risk) and rough cost to fix.\n- **Prioritise**: high\
    \ interest (frequently touched, risky) first; ignore debt in code nobody touches.\n- **Pay down**:\n\
    \  - reserve a share of capacity (often 15 to 25 percent);\n  - fix debt in areas you are already\
    \ changing;\n  - larger items become planned projects with goals.\n- **Prevent**: reviews, tests,\
    \ decision records for intentional shortcuts with a payback date.\n- **Communicate** in business terms:\
    \ speed, risk, cost.\n\n## Example\nFictional register entry:\n```text\nItem: legacy order module\
    \ with no tests\nInterest: 3 incidents last quarter; features take ~2x longer\nFix: add tests, split\
    \ into 3 modules (~4 weeks, 2 engineers)\nPriority: high (touched in 60% of roadmap items)\n```\n\n\
    ## Common mistakes\n- Calling every disliked code \"debt\".\n- Asking for a big rewrite instead of\
    \ incremental fixes.\n- Explaining it in technical terms only, so product says no.\n- Never reserving\
    \ capacity, then halting features for a crisis.\n\n## In the interview\nScored signals: prioritisation\
    \ by impact, business communication, and sustainable habits. Expect \"how do you convince a PM to\
    \ fund debt work?\" and \"when is a rewrite justified?\" (rarely: when incremental change costs more\
    \ and risk is controlled).\n"
