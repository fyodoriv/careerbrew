- id: kb-0d5a14103700
  question: How do you onboard new engineers effectively?
  answer: Prepare before day one, give a clear 30-60-90 day plan, assign a buddy, make local setup fast
    and documented, and get a small change into production in the first week. Explain the system and the
    team's norms, check in often, and improve the process with each new hire's feedback.
  topic: tech lead
  tags:
  - onboarding
  - ramp-up
  - documentation
  - mentoring
  explanation: '## In plain words

    Good onboarding turns a new hire into a confident, productive teammate quickly. Weak onboarding wastes
    months and makes people feel lost, which raises early attrition.


    ## How it works

    - **Before day one**: access, hardware, accounts ready; a welcome note with the first week''s plan.

    - **Buddy**: a peer who answers questions and pairs.

    - **Setup**: one-command or well-documented local environment.

    - **First week**: ship a small real change to production.

    - **Learning**: architecture overview, key flows, team norms, on-call basics.

    - **Plan**: 30-60-90 day goals (for example first small feature, first on-call shadow, owning a component).

    - **Check-ins**: frequent 1:1s early; ask what is confusing.

    - **Improve**: new hires fix docs they find wrong; collect feedback at 30 and 90 days.


    ## Example

    Fictional first-week plan:

    ```text

    Day 1: setup, meet team, read architecture overview

    Day 2: pair with buddy on a bug fix

    Day 3: ship a small "good first issue" to production

    Day 4: walk through main request flow with the tech lead

    Day 5: 1:1 with manager: goals for first 30 days

    ```


    ## Common mistakes

    - Throwing people a wiki and leaving them alone.

    - Setup taking days.

    - No clear first goals.

    - Assuming senior hires need no onboarding.


    ## In the interview

    Scored signals: structure, empathy, and measurement (time to first PR, time to independent work).
    Expect "how do you onboard someone remotely?" (more scheduled pairing and explicit check-ins).

    '
