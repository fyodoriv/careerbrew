- id: kb-afb6f872ea7a
  question: Tell me about a time you inspired or motivated colleagues to get excited about a project.
  answer: Show how you connected the project to something people cared about, such as user impact, learning,
    or removing a pain they felt, involved them in shaping it, made progress visible, and recognised contributions.
    Give a concrete result.
  topic: tech lead
  tags:
  - motivation
  - influence
  - behavioral
  - leadership
  explanation: '## In plain words

    Excitement rarely comes from a pep talk. It comes from people seeing why the work matters, having
    a say in it, and seeing progress. This question tests influence, often without formal authority.


    ## How it works

    Shape (STAR plus learning):

    - **Situation**: a project people were lukewarm about, and why.

    - **Task**: your role.

    - **Action**: explain the purpose with evidence (user stories, data); involve people in design; give
    ownership of pieces; show quick wins; celebrate milestones.

    - **Result**: engagement plus project outcome.

    - **Learning**: what you would repeat.


    ## Example

    Fictional sample answer: "Nobody wanted to work on our test infrastructure. I collected numbers: engineers
    spent about four hours a week waiting for flaky builds. I shared that in a team meeting and asked
    who wanted those hours back. Three volunteers designed the fix with me, each owning a part. We posted
    weekly build-time charts. Builds went from 30 to 9 minutes, and two other teams copied the approach."


    ## Common mistakes

    - Relying on authority or deadlines.

    - Taking all the credit.

    - No measurable outcome.

    - Motivation that fades because nothing changed visibly.


    ## In the interview

    Scored signals: influence, empathy, and results. Expect "what about the people who still weren''t
    interested?" (find other motivations, or accept and staff differently).

    '
