- id: kb-5b0807534d95
  question: What is trunk-based development?
  answer: Trunk-based development is a branching model where everyone integrates small changes into one
    main branch (the trunk) at least daily, using short-lived branches or direct commits, with strong
    automated tests. Unfinished work is hidden behind feature flags, so the trunk is always releasable.
  topic: tech lead
  tags:
  - trunk-based-development
  - git
  - continuous-integration
  - branching
  explanation: '## In plain words

    In trunk-based development, there is one main branch and everyone merges into it often. It avoids
    long-lived feature branches that drift apart and cause painful merges. It is a core practice of continuous
    integration.


    ## How it works

    - **One trunk** (often `main`) that is always in a releasable state.

    - **Short-lived branches**: hours to a day or two, then merged after review.

    - **Small changes**: easier to review, test, and revert.

    - **CI on every merge**: fast automated tests guard the trunk.

    - **Feature flags**: merge incomplete features switched off.

    - **Branch by abstraction**: for big refactors, introduce an interface, build the new implementation
    behind it, then switch.

    - **Release** from trunk, or from short-lived release branches cut from it.

    Contrast: GitFlow uses long-lived develop and feature branches, which suits scheduled releases but
    slows integration.


    ## Example

    ```bash

    git switch -c fix-tax-rounding main

    # small change, tests pass locally

    git commit -am "fix: round tax per line item"

    git push -u origin fix-tax-rounding

    # open PR, review same day, merge to main, branch deleted

    ```


    ## Common mistakes

    - Branches that live for weeks, which is just feature branching.

    - Merging without good tests, which breaks trunk for everyone.

    - No feature flags, so people wait to merge.

    - Leaving trunk red (broken) for hours.


    ## In the interview

    As a tech lead, explain the benefits (fewer merge conflicts, faster feedback, enables continuous delivery)
    and prerequisites (fast CI, flags, review norms). Expect "how would you move a team from GitFlow to
    trunk-based?" (shorten branch life step by step, invest in CI first).

    '
