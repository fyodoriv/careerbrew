- id: kb-dc83db4c583f
  question: Tell me about the best hire you have made. What qualities do you look for most?
  answer: Describe a hire, the signals in the process that made you confident, any risk you took, and
    the impact they had. Then name the qualities you value, such as learning ability, ownership, collaboration,
    and communication, and explain how you test for them.
  topic: tech lead
  tags:
  - hiring
  - behavioral
  - interviewing
  - team-building
  explanation: "## In plain words\nThis question checks your hiring judgment: what you look for, how you\
    \ test it, and whether your hires succeed. Keep the person anonymous and describe them by role.\n\n\
    ## How it works\nShape:\n- **Context**: the role and what the team needed.\n- **Signals**: what you\
    \ saw in the interviews (for example, how they handled an unknown problem, how they talked about past\
    \ teammates).\n- **Decision**: any risk or debate, and why you said yes.\n- **Impact**: what they\
    \ achieved.\n- **Qualities you look for**, each with how you test it:\n  - learning speed: a problem\
    \ in an unfamiliar area;\n  - ownership: past examples of following through;\n  - collaboration: how\
    \ they credit others and handle disagreement;\n  - communication: clarity in explaining trade-offs;\n\
    \  - craft: work-sample tasks close to the job.\n\n## Example\nFictional sample answer: \"I hired\
    \ an engineer with less experience than other candidates. In the design interview she asked sharp\
    \ questions about users before designing, and in the behavioural round she described a failure honestly.\
    \ Within a year she led our search migration. I look most for curiosity, ownership, and clear communication;\
    \ skills can be taught faster than those.\"\n\n## Common mistakes\n- Naming real people or details.\n\
