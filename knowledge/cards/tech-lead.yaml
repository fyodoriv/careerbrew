- id: kb-0edbf47831fd
  question: How do you manage high performers?
  answer: 'Keep high performers challenged and growing: give them ambitious, visible problems, autonomy,
    and honest feedback, sponsor their next step, and recognise them fairly. Watch for burnout and for
    behaviours that hurt the team, and do not let them become a single point of failure.'
  topic: tech lead
  tags:
  - high-performers
  - retention
  - growth
  - management
  explanation: '## In plain words

    High performers are easy to neglect because they seem fine, yet they are often the first to leave
    when bored or underpaid. Managing them well means investing as much in them as in people who struggle.


    ## How it works

    - **Challenge**: stretch problems with real impact; avoid giving them every fire to fight.

    - **Autonomy**: agree outcomes, let them choose methods.

    - **Feedback**: still give it; they want to grow, so name the next level''s gaps.

    - **Sponsorship**: put them forward for visible work and promotions.

    - **Recognition and pay**: fair, timely, matched to impact.

    - **Multiplication**: ask them to mentor and share knowledge.

    - **Watch for**: burnout, overload, arrogance, or hoarding work.


    ## Example

    Fictional sample answer: "My strongest engineer started finishing tasks quickly and looked bored.
    I asked what excited her; she wanted to lead design work. I gave her ownership of a new service''s
    architecture, with a design review I would sponsor in front of senior leaders. She also mentored a
    junior engineer on it. A year later she was promoted to staff."


    ## Common mistakes

    - Ignoring them because they need "no management".

    - Rewarding good work with more of the same work.

    - Tolerating bad behaviour because of output.

    - Letting them become the only person who knows key systems.


    ## In the interview

    Scored signals: growth mindset for all levels, sponsorship, and team balance. Expect "what if they
    want a promotion you cannot give yet?" (be honest, show the gap and a path, and advocate).

    '
