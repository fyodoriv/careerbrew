- id: kb-4747d359a05f
  question: Tell me about a time you formed a team to fix a problem in your organization. How did you
    choose the people and lead them?
  answer: Describe the problem and its cost, how you chose members for the skills and perspectives needed
    plus willingness and influence, how you set a clear goal and scope, and how you ran the group to a
    measurable outcome. Highlight leading people who did not report to you.
  topic: tech lead
  tags:
  - cross-functional
  - initiative
  - behavioral
  - influence
  explanation: '## In plain words

    This question tests whether you can spot an organisational problem, assemble the right people, and
    lead them without formal authority. It is common in staff and tech lead interviews.


    ## How it works

    Shape (STAR plus learning):

    - **Situation**: the problem, who it affected, and its cost.

    - **Choosing members**: needed skills, people closest to the pain, people with influence in their
    teams, and volunteers who care; keep the group small.

    - **Setup**: written charter with goal, scope, time box, and how decisions are made.

    - **Running it**: short regular syncs, clear owners, visible progress, updates to sponsors.

    - **Result**: metrics and adoption.

    - **Learning**.


    ## Example

    Fictional sample answer: "Deploys failed often because each team had its own scripts. I proposed a
    six-week working group to leadership and picked four engineers: two from the teams with the most failures,
    one infrastructure expert, and one respected senior who could champion adoption. We wrote a one-page
    charter, met twice a week, and built a shared pipeline. Deploy failure rate fell from 15% to 3%, and
    five teams adopted it within a quarter."


    ## Common mistakes

    - Picking only friends or only experts.

    - No clear goal or end date.

    - Delivering a solution nobody adopts.

    - Leaving out the sponsor and stakeholders.


    ## In the interview

    Scored signals: problem framing, people selection, influence without authority, and outcome. Expect
    "what conflict came up in the group?" and "how did you get managers to release their people''s time?"

    '
