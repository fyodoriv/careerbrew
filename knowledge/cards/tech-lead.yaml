- id: kb-8f9cf9552871
  question: What does it take to be a good technical leader?
  answer: A good technical leader sets clear technical direction, makes and explains sound decisions,
    raises the team's skills and standards, protects quality and delivery, and earns trust by listening
    and giving credit. They measure success by the team's results, not their own code.
  topic: tech lead
  tags:
  - tech-lead
  - leadership
  - influence
  - qualities
  explanation: '## In plain words

    Good technical leadership is about making the whole team effective technically. The best leaders stay
    close enough to the code to make good calls, while spending most energy on direction, people, and
    alignment.


    ## How it works

    - **Direction**: a clear technical vision and roadmap tied to product goals.

    - **Decisions**: involve the team, write down trade-offs (for example in decision records), decide
    in time, explain why.

    - **Quality**: standards for testing, review, and reliability; lead by example.

    - **People**: mentor, delegate interesting work, give credit, create psychological safety.

    - **Communication**: translate between engineering and product or business.

    - **Execution**: unblock, manage risks and dependencies.

    - **Humility**: listen, admit mistakes, change your mind with evidence.


    ## Example

    Fictional sample answer: "When our team had to choose a new queue system, I did not pick one myself.
    I asked two engineers to prototype the top options, we compared them against written criteria, and
    the team agreed. I wrote the decision record and presented it to other teams. I learned that a decision
    the team owns gets implemented faster."


    ## Common mistakes

    - Being the bottleneck for all decisions or code reviews.

    - Taking the most interesting tasks.

    - Avoiding decisions to keep everyone happy.

    - Neglecting communication outside the team.


    ## In the interview

    Scored signals: decision-making, people focus, and impact through others. Expect "how much do you
    code as a lead?" (enough to stay credible, usually not on the critical path) and "how do you handle
    a teammate who disagrees with your technical decision?"

    '
