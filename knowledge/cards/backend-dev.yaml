- id: kb-deccf149a46f
  question: What is strong consistency in databases?
  answer: Strong consistency means every read returns the result of the most recent completed write, as
    if there were a single copy of the data. In distributed systems this usually means linearisability,
    achieved with a single leader, synchronous replication, or quorum and consensus protocols, at the
    cost of latency and availability during network partitions.
  topic: backend dev
  tags:
  - strong-consistency
  - distributed-systems
  - replication
  - cap
  explanation: "## In plain words\nWith strong consistency there are no stale reads: once a write is confirmed,\
    \ everyone who reads afterwards sees it, no matter which server they ask. The system behaves like\
    \ one machine even though the data lives on many.\n\n## How it works\n- **Linearisability:** every\
    \ operation appears to happen at a single instant between its start and end, in one global order consistent\
    \ with real time.\n- **Ways to achieve it:**\n  - read and write through one leader;\n  - synchronous\
    \ replication before acknowledging writes;\n  - consensus protocols (Raft, Paxos) where a majority\
    \ must agree;\n  - quorum reads and writes with W + R > N, plus extra care for concurrent operations.\n\
    - **Cost:** extra round trips to replicas (higher latency), and during a network partition the minority\
    \ side must refuse requests. This is the C versus A choice in CAP.\n- Examples: etcd, ZooKeeper, Google\
    \ Spanner (using synchronised clocks), single-node relational databases.\n\n## Example\nA ticket system\
    \ sells the last seat. Two users click \"buy\" on different continents. With strong consistency, both\
    \ requests go through consensus on the seat's record; one wins, the other sees \"sold out\". With\
    \ eventual consistency, both might be accepted by different replicas and the conflict found later.\n\
    \n## Common mistakes\n- Confusing it with ACID consistency.\n- Assuming reading from any replica is\
    \ safe in a leader-based system with async replicas.\n- Requiring strong consistency everywhere, paying\
    \ latency where stale data would be fine.\n- Ignoring clock problems when ordering by timestamps.\n\
    \n## In the interview\nDefine it as \"reads see the latest write\", then name linearisability. Discuss\
    \ the cost in latency and availability using CAP and PACELC (even without partitions, you trade latency\
    \ for consistency). Give an example where you need it (payments, inventory) and one where you do not\
    \ (likes).\n"
