- id: kb-46cd3c796216
  question: What is process.nextTick in Node.js?
  answer: '`process.nextTick(cb)` schedules a callback to run right after the current operation finishes,
    before the event loop continues and before promise callbacks (microtasks) and timers. It is used to
    defer work while still running it as soon as possible, for example to emit events after a constructor
    returns.'
  topic: backend dev
  tags:
  - nodejs
  - event-loop
  - async
  - javascript
  explanation: '## In plain words

    `process.nextTick` says "run this as soon as the current piece of code is done, before anything else".
    It is a way to defer work slightly without waiting for the next turn of the event loop.


    ## How it works

    - Node keeps a **nextTick queue** separate from the event loop phases.

    - After each JavaScript operation from the stack completes, Node drains the entire nextTick queue,
    then the promise microtask queue, then moves on to the event loop (timers, I/O callbacks, `setImmediate`,
    and so on).

    - Order of priority: synchronous code, `process.nextTick`, promise callbacks (`.then`, `await` continuations),
    then `setTimeout` / `setImmediate`.

    - Because the queue is drained fully, recursively calling `nextTick` can starve I/O.

    - Common uses: making an API consistently asynchronous, emitting events after listeners are attached,
    deferring cleanup.

    - Node''s docs recommend `queueMicrotask` or `setImmediate` for most new code.


    ## Example

    ```javascript

    console.log("1 sync");

    setTimeout(() => console.log("5 timeout"), 0);

    setImmediate(() => console.log("6 immediate"));

    Promise.resolve().then(() => console.log("4 promise"));

    process.nextTick(() => console.log("3 nextTick"));

    console.log("2 sync");

    // 1 sync, 2 sync, 3 nextTick, 4 promise, 5 timeout, 6 immediate

    // (timeout vs immediate order can swap when run from the main module)

    ```

    This order holds for a CommonJS file (`node app.js`). In an ES module (`.mjs` or `"type": "module"`),
    the module body itself runs as a promise job, so `4 promise` prints before `3 nextTick`.


    ## Common mistakes

    - Thinking `nextTick` runs on the next event loop iteration; it runs before it.

    - Recursive `nextTick` calls that block timers and I/O.

    - Confusing it with `setImmediate`, whose name suggests the opposite timing.

    - Relying on exact timer versus immediate order outside I/O callbacks.


    ## In the interview

    Explain the queues and priority order with the example. Mention the starvation risk and when to prefer
    `setImmediate`. Interviewers use this to test event loop understanding, so describe the phases briefly.

    '
