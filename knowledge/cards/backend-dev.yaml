- id: kb-2029fed4bfa6
  question: What is blob storage?
  answer: Blob (binary large object) storage, also called object storage, keeps unstructured files such
    as images, videos, backups, and logs as objects in flat containers, each addressed by a key and carrying
    metadata. Services such as Amazon S3, Azure Blob Storage, and Google Cloud Storage offer cheap, durable,
    nearly unlimited capacity over HTTP.
  topic: backend dev
  tags:
  - blob-storage
  - object-storage
  - cloud
  - storage
  explanation: '## In plain words

    Databases are poor places for big files. Blob storage is a huge, cheap, durable warehouse for files:
    you put an object under a name, and later fetch it by that name over HTTP. You do not get folders
    or partial in-place edits, just whole objects.


    ## How it works

    - **Buckets or containers** hold objects. Keys look like paths (`users/42/avatar.png`), but the namespace
    is flat.

    - Each object has data, a key, and metadata (content type, custom tags).

    - Operations are simple: PUT, GET (including byte ranges), DELETE, LIST by prefix.

    - **Durability:** data is copied across disks and often across zones; providers advertise many nines.

    - **Storage classes:** hot, cool, archive, with lower price but slower or costlier reads for colder
    tiers. Lifecycle rules move objects automatically.

    - **Access:** private by default; share with signed URLs that expire. Put a CDN in front for public
    content.

    - **Large uploads** use multipart upload.


    ## Example

    A photo app stores only metadata in PostgreSQL: `photo_id`, `owner_id`, `blob_key`. The image itself
    goes to `photos/2026/10/abc123.jpg` in a bucket. The API returns a signed URL valid for 10 minutes,
    and the browser downloads the image directly from storage or a CDN, so app servers never stream the
    bytes.


    ## Common mistakes

    - Storing large files as database columns, bloating backups and slowing queries.

    - Making buckets public by accident.

    - Treating it like a file system with frequent small edits or renames.

    - Forgetting egress costs and archive retrieval delays.


    ## In the interview

    Explain the metadata-in-database, bytes-in-blob pattern and signed URLs. Mention storage tiers and
    lifecycle rules, CDN caching, and consistency (major providers now give strong read-after-write consistency).
    Contrast with block storage (disks for VMs) and file storage (shared file systems).

    '
