- id: kb-541ab74896aa
  question: What is an ACID database transaction?
  answer: A transaction is a group of operations treated as one unit. ACID means Atomicity (all or nothing),
    Consistency (constraints hold before and after), Isolation (concurrent transactions do not see each
    other's partial work), and Durability (committed data survives crashes).
  topic: backend dev
  tags:
  - acid
  - transactions
  - databases
  - sql
  explanation: '## In plain words

    A transaction is a bundle of database changes that must succeed or fail together, like a bank transfer:
    money leaves one account and arrives in another, never just one of the two. ACID is the set of four
    guarantees that make such bundles safe.


    ## How it works

    - **Atomicity:** if any step fails, every change in the transaction is rolled back.

    - **Consistency:** the transaction moves the database from one valid state to another, respecting
    constraints such as foreign keys and checks. The application also defines what "valid" means.

    - **Isolation:** transactions running at the same time behave as if they ran one after another, to
    a degree set by the isolation level (read committed, repeatable read, serializable).

    - **Durability:** once commit returns, the data is on stable storage, typically via a write-ahead
    log, and survives a crash.


    Databases implement these with logs, locks, and multiversion concurrency control (MVCC).


    ## Example

    ```sql

    BEGIN;

    UPDATE accounts SET balance = balance - 100 WHERE id = 1;

    UPDATE accounts SET balance = balance + 100 WHERE id = 2;

    -- if either fails, or a CHECK (balance >= 0) is violated:

    -- ROLLBACK;

    COMMIT;

    ```

    Other sessions never see the money missing from both accounts, and after `COMMIT` a power cut does
    not undo it.


    ## Common mistakes

    - Mixing up the C in ACID with the C in CAP (which means all nodes see the same data).

    - Assuming the default isolation level is serializable; in most databases it is not.

    - Holding transactions open during slow network calls, causing lock contention.

    - Thinking ACID applies across multiple services automatically.


    ## In the interview

    Define each letter with a one-line example. Expect follow-ups on isolation anomalies (dirty read,
    non-repeatable read, phantom), isolation levels, and how distributed systems handle transactions across
    services (two-phase commit, sagas). Contrast with BASE.

    '
