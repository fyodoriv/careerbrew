- id: kb-7ea091107f5c
  question: What are the pros and cons of Node.js for backend development?
  answer: 'Pros: non-blocking I/O handles many concurrent connections efficiently, one language across
    front end and back end, a huge npm ecosystem, and fast iteration. Cons: CPU-heavy work blocks the
    single event loop thread, callback and async complexity, uneven package quality, and less built-in
    structure than some frameworks.'
  topic: backend dev
  tags:
  - nodejs
  - javascript
  - backend
  - trade-offs
  explanation: "## In plain words\nNode.js runs JavaScript on the server with an event loop: one main\
    \ thread hands slow I/O (network, disk) to the operating system and picks up results when they are\
    \ ready. That makes it great at juggling many waiting requests, but a long calculation on the main\
    \ thread makes everyone wait.\n\n## How it works\n**Pros**\n- Event-driven, non-blocking I/O: thousands\
    \ of open connections with little memory, ideal for APIs, real-time chat, and streaming.\n- Same language\
    \ and sometimes shared code with the browser; TypeScript adds types.\n- npm has a package for almost\
    \ everything.\n- Fast startup and good fit for microservices and serverless.\n\n**Cons**\n- CPU-bound\
    \ tasks (image processing, big JSON parsing, crypto loops) block the event loop. Workarounds: worker\
    \ threads, child processes, or another service.\n- Async code is easy to get wrong: unhandled rejections,\
    \ race conditions.\n- Dependency sprawl and supply-chain risk in npm.\n- Fewer conventions than opinionated\
    \ frameworks, so architecture varies a lot between teams.\n\n## Example\n```javascript\n// Bad: blocks\
    \ every other request for seconds\napp.get(\"/fib\", (req, res) => res.json(fib(45)));\n\n// Better:\
    \ move CPU work to a worker thread\nconst { Worker } = require(\"node:worker_threads\");\napp.get(\"\
    /fib\", (req, res) => {\n  const w = new Worker(\"./fib-worker.js\", { workerData: 45 });\n  w.once(\"\
    message\", (n) => res.json(n));\n});\n```\n\n## Common mistakes\n- Calling Node.js \"single-threaded\"\
    \ without nuance: libuv uses a thread pool for some I/O, and worker threads exist.\n- Using it for\
    \ heavy number crunching without offloading.\n- Installing many tiny packages without auditing them.\n\
    - Ignoring error handling in async code.\n\n## In the interview\nFrame the answer around I/O-bound\
    \ versus CPU-bound workloads. Mention clustering or multiple processes to use all cores, worker threads,\
    \ and the ecosystem. Compare briefly with Go or Java when asked, focusing on concurrency model rather\
    \ than hype.\n"
  match:
