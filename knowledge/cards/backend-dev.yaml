- id: kb-eccd10014afb
  question: What is the dead-letter queue pattern?
  answer: 'A dead-letter queue (DLQ) is a separate queue where messages go when they cannot be processed:
    after too many failed attempts, when rejected, when expired, or when malformed. It keeps poison messages
    from blocking the main queue and preserves them for inspection, alerting, and later replay.'
  topic: backend dev
  tags:
  - dead-letter-queue
  - messaging
  - reliability
  - queues
  explanation: '## In plain words

    Sometimes a message can never succeed, for example because it has bad data. If the consumer keeps
    retrying it, it blocks or wastes resources forever. A dead-letter queue is the "problem mail" tray:
    failed messages are set aside so normal work continues, and humans or tools deal with them later.


    ## How it works

    - A consumer reads a message and tries to process it.

    - On failure it retries, ideally with exponential backoff.

    - After a maximum number of attempts (for example 5), or on certain errors, the message moves to the
    DLQ, with metadata such as error reason and attempt count.

    - Brokers support this natively: SQS redrive policy (`maxReceiveCount`), RabbitMQ dead-letter exchanges,
    Azure Service Bus DLQ. In Kafka, consumers usually publish failures to a separate topic themselves.

    - Monitoring alerts when the DLQ grows.

    - After a fix, messages are replayed back to the main queue; or discarded if invalid.


    ## Example

    An order-processing queue receives a message with a currency code `XXX` that the payment service does
    not support. Processing fails 5 times, so SQS moves it to `orders-dlq`. An alarm fires, an engineer
    finds a mapping bug, deploys a fix, and redrives the message to the main queue, where it now succeeds.
    Meanwhile, thousands of normal orders were processed without delay.


    ## Common mistakes

    - No DLQ, so poison messages loop forever or are silently dropped.

    - A DLQ nobody monitors, which becomes a silent data graveyard.

    - Sending transient failures (a short outage) to the DLQ too quickly.

    - Replaying without fixing the cause or without idempotent consumers.


    ## In the interview

    Describe the flow: retries, threshold, DLQ, alert, replay. Distinguish transient from permanent errors.
    Mention ordering concerns (moving a message aside can break per-key order) and that consumers must
    be idempotent because replays create duplicates.

    '
