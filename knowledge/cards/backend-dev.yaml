- id: kb-11062702edfa
  question: What is isolation in ACID?
  answer: 'Isolation means concurrent transactions do not interfere with each other: each behaves as if
    it ran alone. Databases offer isolation levels (read uncommitted, read committed, repeatable read,
    serializable) that trade strictness for performance by allowing or preventing anomalies like dirty
    reads, non-repeatable reads, and phantoms.'
  topic: backend dev
  tags:
  - acid
  - isolation
  - transactions
  - concurrency
  explanation: '## In plain words

    Many users change the database at the same time. Isolation decides how much one transaction can see
    of another''s unfinished or newly committed work. Full isolation makes it look like transactions ran
    one at a time; weaker levels are faster but allow some surprises.


    ## How it works

    **Anomalies**

    - *Dirty read:* reading another transaction''s uncommitted change.

    - *Non-repeatable read:* reading the same row twice and getting different values.

    - *Phantom read:* rerunning a query and getting new rows.

    - *Lost update / write skew:* two transactions read, then write based on stale data.


    **Levels (SQL standard)**

    - *Read uncommitted:* allows dirty reads.

    - *Read committed:* no dirty reads. Default in PostgreSQL, Oracle, SQL Server.

    - *Repeatable read:* rows you read do not change. Default in MySQL InnoDB.

    - *Serializable:* result equals some one-at-a-time order.


    **Mechanisms:** locks (two-phase locking) or multiversion concurrency control (MVCC), where readers
    see a snapshot and do not block writers. Serializable snapshot isolation detects conflicts and aborts
    one transaction.


    ## Example

    Two doctors are on call; the rule is "at least one on call". Under snapshot isolation, both transactions
    read "2 on call", each removes itself, and both commit, leaving zero. This is write skew. Under serializable
    isolation, one transaction is aborted and must retry.


    ## Common mistakes

    - Assuming the default level is serializable.

    - Not handling serialization failures with retries.

    - Believing repeatable read prevents every anomaly.

    - Using `SELECT` then `UPDATE` without `SELECT ... FOR UPDATE` or an atomic update, causing lost updates.


    ## In the interview

    List anomalies and which levels prevent them. Give the write skew example to show depth. Discuss the
    trade-off: stronger isolation means more locking or aborts. Mention practical tools: atomic updates,
    row locks, optimistic version checks.

    '
