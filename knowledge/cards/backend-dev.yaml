- id: kb-177b43b4a204
  question: What are Server-Sent Events (SSE)?
  answer: Server-Sent Events are a standard way for a server to push a stream of text events to the browser
    over one long-lived HTTP response with the `text/event-stream` content type. The browser's `EventSource`
    API reconnects automatically. SSE is one-way, server to client, which makes it simpler than WebSockets
    for feeds and notifications.
  topic: backend dev
  tags:
  - sse
  - http
  - real-time
  - web
  explanation: "## In plain words\nNormally the browser asks and the server answers once. With SSE the\
    \ browser opens one request and the server keeps it open, writing new messages whenever something\
    \ happens: live scores, progress bars, notifications. It is like subscribing to a radio station instead\
    \ of calling to ask for news.\n\n## How it works\n- The client creates `new EventSource(\"/events\"\
    )`.\n- The server responds with `Content-Type: text/event-stream` and keeps the connection open.\n\
    - Each event is plain text lines such as `event:`, `data:`, `id:`, ending with a blank line.\n- If\
    \ the connection drops, the browser reconnects and sends `Last-Event-ID`, so the server can resume.\n\
    - The server can suggest a delay with `retry:`.\n- It works over normal HTTP, so proxies, load balancers,\
    \ and HTTP/2 multiplexing generally help rather than hurt.\n- Limits: text only, one direction, and\
    \ on HTTP/1.1 browsers allow about six connections per domain.\n\n## Example\n```javascript\n// Server\
    \ (Express)\napp.get(\"/events\", (req, res) => {\n  res.set({ \"Content-Type\": \"text/event-stream\"\
    , \"Cache-Control\": \"no-cache\" });\n  res.flushHeaders();\n  const t = setInterval(() => res.write(`data:\
    \ ${Date.now()}\\n\\n`), 1000);\n  req.on(\"close\", () => clearInterval(t));\n});\n\n// Browser\n\
    const es = new EventSource(\"/events\");\nes.onmessage = (e) => console.log(\"tick\", e.data);\n```\n\
    \n## Common mistakes\n- Choosing WebSockets when only the server needs to push.\n- Forgetting to disable\
    \ proxy buffering, so events arrive in batches.\n- Not sending heartbeat comments, so idle connections\
    \ time out.\n- Ignoring the per-domain connection limit on HTTP/1.1.\n\n## In the interview\nCompare\
    \ SSE, WebSockets, and long polling: direction, protocol, reconnection, binary support. A good answer\
    \ picks SSE for one-way feeds (including streaming AI responses) and WebSockets for chat or games.\
    \ Mention scaling concerns: many open connections per server and fan-out through a pub/sub system.\n"
