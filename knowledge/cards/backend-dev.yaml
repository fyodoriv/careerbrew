- id: kb-bf1cde1017c5
  question: How do you handle errors in Node.js?
  answer: Use try/catch with async/await, handle rejected promises, pass errors to centralized middleware
    in frameworks like Express, and distinguish expected operational errors from programmer bugs. Log
    unhandled rejections and uncaught exceptions, then restart the process cleanly rather than continuing
    in an unknown state.
  topic: backend dev
  tags:
  - nodejs
  - error-handling
  - javascript
  - async
  explanation: "## In plain words\nNode.js runs your code on a single thread, so one unhandled error can\
    \ crash the whole server. Good error handling means catching problems where you can act on them, reporting\
    \ them in one place, and failing safely when something truly unexpected happens.\n\n## How it works\n\
    - **Synchronous code:** `try/catch`.\n- **Promises and async/await:** `try/catch` around `await`,\
    \ or `.catch()` on the promise. An unhandled rejection crashes the process in modern Node versions.\n\
    - **Callbacks:** the error-first convention `(err, result) => {}`; check `err` first.\n- **Event emitters\
    \ and streams:** listen for the `'error'` event, otherwise it is thrown.\n- **Operational vs programmer\
    \ errors:** a timeout or invalid input is expected and handled; a `TypeError` from a bug means the\
    \ process state may be broken.\n- **Last resort:** `process.on('uncaughtException')` and `process.on('unhandledRejection')`\
    \ should log and exit, letting a supervisor (systemd, Kubernetes, PM2) restart the process.\n\n##\
    \ Example\n```javascript\nconst express = require(\"express\");\nconst app = express();\n\napp.get(\"\
    /users/:id\", async (req, res, next) => {\n  try {\n    const user = await findUser(req.params.id);\n\
    \    if (!user) return res.status(404).json({ error: \"not found\" });\n    res.json(user);\n  } catch\
    \ (err) {\n    next(err); // hand off to the central handler\n  }\n});\n\napp.use((err, req, res,\
    \ next) => {\n  console.error(err);\n  res.status(500).json({ error: \"internal error\" });\n});\n\
    ```\n\n## Common mistakes\n- Swallowing errors with an empty `catch`.\n- Forgetting that Express 4\
    \ does not catch rejected promises from async handlers on its own.\n- Keeping the process alive after\
    \ an uncaught exception.\n- Leaking stack traces or internal messages to API clients.\n\n## In the\
    \ interview\nExplain the two error types and the layered approach: local handling, central middleware,\
    \ process-level safety net plus restart. Mention custom error classes with HTTP status codes, structured\
    \ logging, and graceful shutdown (stop accepting requests, finish in-flight ones, then exit).\n"
  match:
