- id: kb-3a380512bb2d
  question: What is data redundancy?
  answer: Data redundancy means the same data is stored in more than one place. It can be deliberate,
    through replicas, backups, or denormalised copies that improve availability and read speed, or accidental,
    which wastes space and causes inconsistent copies.
  topic: backend dev
  tags:
  - data-redundancy
  - databases
  - replication
  - normalization
  explanation: '## In plain words

    Keeping copies of data is like having spare keys: helpful if one is lost, but you must remember where
    they all are. In system design, redundancy is a tool for reliability and speed, and a risk when copies
    get out of sync.


    ## How it works

    **Deliberate redundancy**

    - **Replication:** copies on several servers or regions so one failure does not lose data or stop
    service.

    - **Backups and snapshots:** point-in-time copies to recover from mistakes or corruption.

    - **RAID and erasure coding:** redundancy at the disk level.

    - **Denormalisation and caches:** copies shaped for fast reads.


    **Accidental redundancy**

    - The same customer address typed into three tables. Updating one leaves the others stale: an *update
    anomaly*.

    - Normalisation removes it by storing each fact once and linking with keys.


    **Managing it:** one source of truth, automated sync (change data capture, events), and checks for
    drift.


    ## Example

    An `orders` table that stores `customer_email` on every row duplicates data. When a customer changes
    email, 500 order rows must change or reports disagree. Storing `customer_id` and joining fixes this.
    In contrast, a read replica holding a full copy of the database is intentional redundancy that keeps
    the site up if the primary fails.


    ## Common mistakes

    - Treating all redundancy as bad or all as good.

    - Calling replicas a backup; they copy deletions and corruption too.

    - Denormalising without a plan for keeping copies consistent.

    - Keeping redundant copies in the same failure domain (same rack or region).


    ## In the interview

    Distinguish intentional from accidental redundancy and give one example of each. Discuss the trade-off:
    availability and performance versus storage cost and consistency effort. Follow-ups may lead to normalisation,
    replication types, or backup strategy.

    '
