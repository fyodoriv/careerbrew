- id: kb-8bafce69d19c
  question: When should you use SQL and when NoSQL?
  answer: Choose SQL when data is relational, you need ACID transactions across entities, strong integrity,
    and flexible ad-hoc queries. Choose NoSQL when access patterns are simple and known, the schema varies,
    or you need massive horizontal scale, very high write throughput, or a specialised model like documents,
    wide columns, or graphs.
  topic: backend dev
  tags:
  - sql
  - nosql
  - databases
  - trade-offs
  explanation: '## In plain words

    SQL databases are general-purpose and protective of correctness. NoSQL databases are specialised tools
    that trade some guarantees or flexibility for scale or a better fit to one data shape. The right choice
    comes from your data, your queries, and your consistency needs, not from fashion.


    ## How it works

    **Lean towards SQL when**

    - Entities have many relationships (orders, customers, invoices).

    - You need multi-row transactions and constraints (finance, inventory).

    - Queries are varied or unknown in advance (reporting, admin tools).

    - Data size fits a primary plus replicas, which covers most products.


    **Lean towards NoSQL when**

    - Access is key-based and predictable (sessions, carts, feeds).

    - Write volume or data size exceeds a single primary (event logs, IoT).

    - The structure varies per record (catalogues, user-generated content).

    - The model is naturally a graph, time series, or search index.

    - You need multi-region writes with high availability and can accept eventual consistency.


    **Often both:** PostgreSQL for core records, Redis for caching, a search engine for text, a time series
    store for metrics.


    ## Example

    A food delivery app: orders, payments, and restaurants in PostgreSQL (transactions, reporting). Courier
    GPS pings in a wide-column or time series store (huge write volume, queries by courier and time).
    Restaurant menus in a document store or JSONB column (varied structure). Sessions in Redis.


    ## Common mistakes

    - Choosing NoSQL "because it scales" without a scale problem.

    - Choosing SQL and then storing everything as untyped JSON blobs.

    - Ignoring operations: running many database types costs time and skills.

    - Forgetting that modern SQL databases have JSON support and distributed versions.


    ## In the interview

    Ask about access patterns, consistency, scale, and team skills before answering. Give a decision with
    reasons and a fallback. Interviewers value nuance: SQL as a strong default, NoSQL for specific needs,
    and polyglot persistence when justified.

    '
