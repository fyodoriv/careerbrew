  question: What is sharding in databases?
  answer: Sharding splits one large dataset horizontally across multiple database servers, each holding
    a subset of rows chosen by a shard key. It scales storage and write throughput beyond one machine,
    but makes cross-shard queries, transactions, and rebalancing harder.
  topic: backend dev
  tags:
  - sharding
  - databases
  - scalability
  - partitioning
  explanation: "## In plain words\nWhen one database server can no longer hold all the data or handle\
    \ all the writes, you split the rows among several servers. Users A to M on one server, N to Z on\
    \ another is the simplest picture. Each server is a shard, and together they act like one big database.\n\
    \n## How it works\n- **Shard key:** the column that decides where a row lives, e.g., `user_id`.\n\
    - **Strategies:**\n  - *Range:* key ranges per shard; good for range scans, risks hotspots.\n  - *Hash:*\
    \ hash of the key modulo shards or consistent hashing; even spread, poor range queries.\n  - *Directory:*\
    \ a lookup table maps keys to shards; flexible, but the directory is critical.\n  - *Geographic:*\
    \ by region, for latency and data residency.\n- **Routing:** the application, a proxy (Vitess), or\
    \ the database itself (MongoDB, Cassandra, CockroachDB) sends each query to the right shard.\n- **Rebalancing:**\
    \ moving data when adding shards; consistent hashing and many small virtual shards reduce movement.\n\
    - **Costs:** cross-shard joins and transactions, global unique ids, and uneven load.\n\n## Example\n\
    A chat app shards messages by `conversation_id` hash across 16 shards. Loading one conversation hits\
    \ one shard. A query like \"all messages containing 'hello' across all users\" must fan out to all\
    \ 16 shards and merge results, so it is moved to a separate search index.\n\n## Common mistakes\n\
    - Sharding too early, before trying indexes, caching, replicas, and bigger hardware.\n- A shard key\
    \ with low variety or skew (e.g., country), creating hot shards.\n- Choosing a key that does not match\
    \ the main query, forcing scatter-gather.\n- `hash % N` without a plan for changing N.\n\n## In the\
    \ interview\nExplain the shard key choice as the central decision, then strategies and their trade-offs.\
    \ Distinguish sharding (across servers) from partitioning within one server and from replication.\
    \ Interviewers like hearing what you would try before sharding.\n"
