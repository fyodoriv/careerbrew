- id: kb-7f58645b3372
  question: What are the pros and cons of NoSQL databases?
  answer: 'Pros: flexible schemas, data models that match specific access patterns, easy horizontal scaling,
    and high write throughput and availability. Cons: weaker or more limited transactions and joins, often
    eventual consistency, data duplication, and less standardised query languages and tooling than SQL.'
  topic: backend dev
  tags:
  - nosql
  - databases
  - trade-offs
  - scalability
  explanation: '## In plain words

    "NoSQL" covers databases that do not use the classic table-and-SQL model: key-value stores, document
    stores, wide-column stores, and graph databases. They give up some of the general-purpose guarantees
    of relational databases to be faster or easier to scale for particular workloads.


    ## How it works

    **Pros**

    - **Flexible schema:** store records with different fields without migrations.

    - **Scale out:** most are built to spread data across many machines (sharding) and replicate it.

    - **Performance for a pattern:** a key-value lookup or a time-ordered partition read is very fast.

    - **Availability:** many accept writes during network partitions.

    - **Natural models:** documents for nested objects, graphs for relationships.


    **Cons**

    - **Consistency:** often eventual by default; you must reason about stale reads.

    - **Transactions:** limited scope (single key or partition) in many systems.

    - **Joins and ad-hoc queries:** weak or absent; you design tables per query.

    - **Duplication:** denormalised copies must be kept in sync.

    - **Variety:** each product has its own API and operational quirks.


    ## Example

    A shopping cart service with millions of users can store each cart in a key-value store keyed by user
    id: one fast read, one fast write, easy to shard. The finance team''s monthly revenue report joining
    orders, refunds, and taxes is much easier in SQL.


    ## Common mistakes

    - Treating NoSQL as one technology; a graph database and a key-value store have little in common.

    - Assuming NoSQL is always faster.

    - Picking NoSQL to skip schema design, then struggling with queries you did not plan for.

    - Saying none support transactions; several now do.


    ## In the interview

    Structure the answer as trade-offs and tie each to a workload. Mention CAP and the BASE model as background.
    Interviewers like hearing that you would start from access patterns and consistency needs, and that
    many systems use both SQL and NoSQL.

    '
