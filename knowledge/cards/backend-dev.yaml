- id: kb-8c511c87da6c
  question: What is RabbitMQ?
  answer: RabbitMQ is an open-source message broker that implements AMQP 0-9-1. Producers publish messages
    to exchanges, which route them to queues based on bindings and routing keys; consumers receive messages
    from queues and acknowledge them, after which they are removed. It suits task queues and flexible
    routing.
  topic: backend dev
  tags:
  - rabbitmq
  - amqp
  - messaging
  - queues
  explanation: "## In plain words\nRabbitMQ is a post office for services. A sender drops a message off\
    \ without knowing who will handle it. RabbitMQ sorts it into the right mailbox (queue), and a worker\
    \ picks it up, processes it, and confirms so the message can be thrown away.\n\n## How it works\n\
    - **Producer** publishes to an **exchange**, never directly to a queue.\n- **Exchange types:**\n \
    \ - *direct:* routes by exact routing key;\n  - *topic:* by pattern such as `order.*.created`;\n \
    \ - *fanout:* to every bound queue;\n  - *headers:* by message headers.\n- **Bindings** connect exchanges\
    \ to queues.\n- **Consumers** receive messages; an **ack** removes them, a **nack** or connection\
    \ loss returns them to the queue.\n- **Prefetch** limits unacknowledged messages per consumer for\
    \ fair load balancing.\n- **Durability:** durable queues plus persistent messages survive restarts;\
    \ quorum queues replicate with Raft.\n- **Dead-letter exchanges** catch rejected or expired messages.\n\
    \n## Example\nAn `orders` topic exchange. The email worker's queue binds with `order.created`; the\
    \ audit queue binds with `order.#`. Publishing `order.created` reaches both queues; `order.cancelled`\
    \ reaches only the audit queue. With three email workers and prefetch 10, messages are shared among\
    \ them, and a worker that crashes before acking has its messages redelivered.\n\n## Common mistakes\n\
    - Auto-ack mode, losing messages if the consumer crashes mid-processing.\n- Unbounded queues growing\
    \ until memory alarms block publishers.\n- Expecting replay of old messages like Kafka; acknowledged\
    \ messages are gone.\n- Non-idempotent consumers, since redelivery can cause duplicates.\n\n## In\
    \ the interview\nExplain exchanges, queues, bindings, and acknowledgements. Compare with Kafka: smart\
    \ broker with routing and per-message acks versus a replayable partitioned log. Mention delivery guarantees\
    \ (at-least-once) and dead-letter handling.\n"
