- id: kb-6fbdd2ebea50
  question: What is an inner join in SQL?
  answer: An inner join returns only the rows where the join condition matches in both tables, combining
    their columns. Rows without a partner on the other side are left out. It is the default `JOIN` in
    SQL.
  topic: backend dev
  tags:
  - sql
  - joins
  - databases
  explanation: '## In plain words

    An inner join keeps only the pairs that belong together. If you join customers with orders, you get
    one row per order with its customer, and customers who never ordered do not appear at all. It is the
    overlap of two circles in a Venn diagram.


    ## How it works

    - Syntax: `SELECT ... FROM A INNER JOIN B ON A.key = B.key` (`INNER` is optional).

    - Conceptually, the database pairs every row of A with every row of B and keeps pairs where the condition
    is true. In practice it uses nested loops with indexes, hash joins, or merge joins.

    - One-to-many relations produce one output row per match, so a customer with three orders appears
    three times.

    - Multiple joins chain: `A JOIN B ON ... JOIN C ON ...`.

    - NULLs never match with `=`, so rows with a NULL key are dropped.


    ## Example

    ```sql

    -- customers: (1,''Ana''), (2,''Bo'')

    -- orders: (100, 1, 30.00), (101, 1, 12.50)


    SELECT c.name, o.id, o.total

    FROM customers c

    JOIN orders o ON o.customer_id = c.id;


    -- name | id  | total

    -- Ana  | 100 | 30.00

    -- Ana  | 101 | 12.50

    -- (Bo has no orders, so he is not in the result)

    ```


    ## Common mistakes

    - Using an inner join when you need all rows from one side (use a left join).

    - Forgetting the `ON` condition and producing a huge cross product.

    - Being surprised by duplicated rows from one-to-many joins, then hiding it with `DISTINCT`.

    - Missing indexes on join keys.


    ## In the interview

    Explain with a two-table example and mention how duplicates arise. Expect a comparison with left,
    right, and full joins, and possibly how the database executes joins (hash, merge, nested loop) and
    why indexes on foreign keys matter.

    '
