- id: kb-a4b397eb02f4
  question: What is service discovery?
  answer: Service discovery is how services find the network addresses of other services when instances
    start, stop, and move dynamically. Instances register with a registry (or the platform tracks them),
    and clients look up healthy instances through DNS, a client library, or a load balancer.
  topic: backend dev
  tags:
  - service-discovery
  - microservices
  - networking
  - architecture
  explanation: "## In plain words\nIn a cloud or container setup, servers come and go and their IP addresses\
    \ change. Hard-coding addresses breaks. Service discovery is a live phone book: instead of remembering\
    \ a number, you ask for \"payments\" and get the addresses of the payments instances that are currently\
    \ healthy.\n\n## How it works\n- **Registration:** an instance registers itself on start (self-registration),\
    \ or the platform registers it (Kubernetes does this from pod labels).\n- **Health checks:** the registry\
    \ removes instances that stop answering.\n- **Lookup patterns:**\n  - *Client-side discovery:* the\
    \ client queries the registry and picks an instance itself, with its own load balancing.\n  - *Server-side\
    \ discovery:* the client calls a load balancer or proxy, which queries the registry.\n- **Mechanisms:**\
    \ DNS (Kubernetes Services, Consul DNS), registries like Consul, etcd, ZooKeeper, Eureka, cloud load\
    \ balancers, and service meshes such as Istio or Linkerd.\n- **Caching:** clients cache results briefly;\
    \ short TTLs balance freshness and load.\n\n## Example\nIn Kubernetes, a Service named `payments`\
    \ in namespace `shop` gets the DNS name `payments.shop.svc.cluster.local`. The orders service calls\
    \ `payments.shop:8080/charge`. When a payments pod crashes and is rescheduled with a new IP, endpoints\
    \ update automatically and the orders service never changes configuration.\n\n## Common mistakes\n\
    - Hard-coding IPs or hostnames of individual instances.\n- Long DNS caching, sending traffic to dead\
    \ instances.\n- A registry that is a single point of failure.\n- Ignoring health checks, so unhealthy\
    \ instances keep getting traffic.\n\n## In the interview\nContrast client-side and server-side discovery\
    \ with their trade-offs (smarter clients versus an extra hop). Mention Kubernetes DNS as the most\
    \ common modern answer and service meshes for advanced routing. Connect to load balancing and health\
    \ checking.\n"
