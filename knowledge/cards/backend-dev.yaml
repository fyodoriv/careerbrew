- id: kb-467556a929c9
  question: What is Redis?
  answer: Redis is an in-memory key-value data store known for sub-millisecond latency. It supports rich
    data structures (strings, hashes, lists, sets, sorted sets, streams), optional persistence, replication,
    and clustering, and is used for caching, sessions, rate limiting, leaderboards, queues, and pub/sub.
  topic: backend dev
  tags:
  - redis
  - caching
  - key-value
  - nosql
  explanation: '## In plain words

    Redis keeps data in RAM, so reading and writing is extremely fast. Unlike a plain cache that only
    stores strings, it understands data structures, so you can increment counters, push to lists, or rank
    scores directly on the server.


    ## How it works

    - **Data types:** strings (with atomic `INCR`), hashes, lists, sets, sorted sets (ranked by score),
    streams, bitmaps, HyperLogLog, and geospatial indexes.

    - **Single-threaded command execution:** each command is atomic. Lua scripts and `MULTI/EXEC` group
    commands.

    - **Expiry:** `EXPIRE` or `SET key value EX 60` makes keys disappear, ideal for caches and sessions.

    - **Persistence:** RDB snapshots and/or an append-only file (AOF); can be turned off for pure caching.

    - **Eviction policies** such as `allkeys-lru` when memory is full.

    - **High availability:** replicas with Sentinel for failover, or Redis Cluster for sharding across
    16,384 hash slots.

    - **Pub/sub and streams** for messaging.


    ## Example

    A game leaderboard with a sorted set:

    ```text

    ZADD leaderboard 3100 "ana"

    ZADD leaderboard 2800 "bo"

    ZINCRBY leaderboard 500 "bo"

    ZREVRANGE leaderboard 0 9 WITHSCORES

    1) "bo"   2) "3300"

    3) "ana"  4) "3100"

    ```

    Rank updates and top-10 reads are O(log n) and fast even with millions of players.


    ## Common mistakes

    - Using it as the only copy of important data without understanding persistence settings.

    - Running slow commands like `KEYS *` in production, which blocks the server.

    - Storing huge values or collections in one key, creating latency spikes and hot keys.

    - No memory limit or eviction policy.


    ## In the interview

    Lead with in-memory speed plus data structures, then give two use cases with the matching type. Discuss
    durability trade-offs, eviction, and scaling with Cluster. Interviewers may ask how you would implement
    a rate limiter or distributed lock with Redis.

    '
