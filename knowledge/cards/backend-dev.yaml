- id: kb-1b9b11883675
  question: What is partitioning in databases?
  answer: Partitioning divides a large table or dataset into smaller pieces by a key, such as date ranges,
    value lists, or a hash. Queries that filter on the key can skip irrelevant partitions, maintenance
    like dropping old data becomes cheap, and when partitions live on different servers it is called sharding.
  topic: backend dev
  tags:
  - partitioning
  - databases
  - scalability
  - performance
  explanation: "## In plain words\nA huge table is like one giant drawer. Partitioning adds dividers:\
    \ by month, by region, or by a hash. When you ask for October data, the database only opens the October\
    \ section.\n\n## How it works\n- **Horizontal partitioning:** rows are split into partitions with\
    \ the same columns.\n  - *Range:* by ranges such as months.\n  - *List:* by explicit values such as\
    \ country.\n  - *Hash:* by hash of a key for even spread.\n  - *Composite:* range then hash, for example.\n\
    - **Vertical partitioning:** columns are split into separate tables (rarely used columns or large\
    \ blobs moved out).\n- **Partition pruning:** the planner skips partitions whose key range cannot\
    \ match the query.\n- **Maintenance:** drop or archive an old partition instantly instead of a slow\
    \ `DELETE`.\n- **Partitioning versus sharding:** partitions can be on one server; sharding puts them\
    \ on different servers.\n\n## Example\n```sql\n-- PostgreSQL declarative range partitioning\nCREATE\
    \ TABLE events (\n  id bigint, created_at timestamptz NOT NULL, payload jsonb\n) PARTITION BY RANGE\
    \ (created_at);\n\nCREATE TABLE events_2026_09 PARTITION OF events\n  FOR VALUES FROM ('2026-09-01')\
    \ TO ('2026-10-01');\nCREATE TABLE events_2026_10 PARTITION OF events\n  FOR VALUES FROM ('2026-10-01')\
    \ TO ('2026-11-01');\n\n-- Partition pruning: only events_2026_10 is scanned:\nSELECT count(*) FROM\
    \ events WHERE created_at >= '2026-10-15';\n\n-- Remove September instantly:\nDROP TABLE events_2026_09;\n\
    ```\n\n## Common mistakes\n- Partitioning on a column queries do not filter by, so every partition\
    \ is scanned.\n- Creating thousands of tiny partitions, slowing planning.\n- Expecting partitioning\
    \ alone to speed up every query.\n- Forgetting to create future partitions ahead of time.\n\n## In\
    \ the interview\nDefine the types and pruning, give the time-series retention example, and distinguish\
    \ from sharding and replication. Mention choosing the key from query patterns and the risk of skew\
    \ with uneven keys.\n"
