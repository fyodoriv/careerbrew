- id: kb-a1ce4f735adb
  question: Does MongoDB support ACID transactions?
  answer: Yes. Every single-document write in MongoDB is atomic, and since version 4.0 (replica sets)
    and 4.2 (sharded clusters) it supports multi-document ACID transactions. They cost more than single-document
    writes, so good schema design keeps most changes inside one document.
  topic: backend dev
  tags:
  - mongodb
  - transactions
  - acid
  - databases
  explanation: "## In plain words\nACID is a promise that a group of changes happens completely or not\
    \ at all, leaves data valid, does not interfere with other work, and survives a crash. MongoDB always\
    \ gave this promise for one document. Modern versions also give it across many documents, much like\
    \ a relational database, but you pay for it in speed.\n\n## How it works\n- **Single document:** an\
    \ update to one document, including its nested arrays and subdocuments, is atomic. Readers never see\
    \ half of it.\n- **Multi-document transactions:** you start a session, begin a transaction, run reads\
    \ and writes, then commit or abort. Under the hood MongoDB uses snapshot isolation and the WiredTiger\
    \ storage engine's multiversion concurrency control.\n- **Durability:** controlled by the *write concern*.\
    \ `w: \"majority\"` waits until most replica set members have the write; `j: true` waits for the on-disk\
    \ journal.\n- **Limits:** transactions have a default 60-second runtime limit, hold locks and cache,\
    \ and on sharded clusters need a two-phase commit across shards.\n\n## Example\n```javascript\nconst\
    \ session = client.startSession();\nawait session.withTransaction(async () => {\n  await accounts.updateOne({\
    \ _id: \"a\" }, { $inc: { balance: -50 } }, { session });\n  await accounts.updateOne({ _id: \"b\"\
    \ }, { $inc: { balance: 50 } }, { session });\n}, { writeConcern: { w: \"majority\" } });\nawait session.endSession();\n\
    ```\nBoth balance changes commit together or neither does.\n\n## Common mistakes\n- Saying MongoDB\
    \ has \"no transactions\": that was true only before version 4.0.\n- Using multi-document transactions\
    \ everywhere instead of embedding data that changes together.\n- Forgetting to pass the `session`\
    \ to each operation, so it runs outside the transaction.\n- Ignoring write concern and assuming a\
    \ write acknowledged by one node is durable.\n\n## In the interview\nLead with \"single-document writes\
    \ are always atomic; multi-document transactions exist since 4.0.\" Then add the design point: model\
    \ data so that most updates touch one document. Expect follow-ups on write concern, read concern (`majority`,\
    \ `snapshot`), retrying on transient errors, and how transactions behave on sharded clusters.\n"
  match:
  - d6de13e1b57b
  prompt: 1f344914
- id: kb-f9033e30cf1c
  question: How can a Node.js application use multiple CPU cores?
  answer: Node.js runs JavaScript on one main thread, so one process uses one core for your code. To use
    more cores, run several processes with the `cluster` module or a process manager such as PM2, run
    multiple containers behind a load balancer, or move CPU-heavy work to `worker_threads`.
  topic: backend dev
  tags:
  - nodejs
  - multicore
  - cluster
  - worker-threads
  explanation: "## In plain words\nA single Node.js process is like one very fast cashier. On an 8-core\
    \ server, seven cores sit idle unless you open more cash registers. You either start more Node processes\
    \ or hand heavy work to helper threads.\n\n## How it works\n- **`cluster` module:** a primary process\
    \ forks workers (usually one per core); incoming connections on a shared port are distributed among\
    \ them. Each worker has its own memory and event loop.\n- **Process managers:** PM2 (`pm2 start app.js\
    \ -i max`) does clustering, restarts, and zero-downtime reloads.\n- **Containers:** in Kubernetes,\
    \ run one process per container and scale replicas instead of clustering inside.\n- **`worker_threads`:**\
    \ threads with their own event loop in the same process, for CPU-bound tasks; communicate via messages\
    \ or shared memory (`SharedArrayBuffer`).\n- **`child_process`:** run separate programs or scripts.\n\
    - **State:** workers do not share memory, so sessions and caches go to Redis or a database.\n\n##\
    \ Example\n```javascript\nconst cluster = require(\"node:cluster\");\nconst http = require(\"node:http\"\
    );\nconst os = require(\"node:os\");\n\nif (cluster.isPrimary) {\n  for (let i = 0; i < os.availableParallelism();\
    \ i++) cluster.fork();\n  cluster.on(\"exit\", () => cluster.fork()); // replace crashed workers\n\
    } else {\n  http.createServer((req, res) => res.end(`pid ${process.pid}\\n`)).listen(3000);\n}\n```\n\
    \n## Common mistakes\n- Storing sessions in process memory, so users lose them when routed to another\
    \ worker.\n- Using worker threads for I/O, which Node already handles asynchronously.\n- Clustering\
    \ inside containers and also scaling containers, oversubscribing CPUs.\n- Forgetting that each worker\
    \ needs its own database connection pool.\n\n## In the interview\nExplain the single-threaded event\
    \ loop, then the two tools: processes for scaling request handling, worker threads for CPU work. Mention\
    \ the libuv thread pool (for file system, DNS, crypto) as a nuance. In production, scaling via containers\
    \ is common.\n"
  match:
  - deb2d2c67e87
