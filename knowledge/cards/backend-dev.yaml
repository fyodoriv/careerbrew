- id: kb-59d8e43ce015
  question: What are the pros and cons of MongoDB?
  answer: 'Pros: flexible JSON-like documents, fast development, natural mapping to objects, built-in
    replication and horizontal sharding, and rich queries and aggregation. Cons: joins and multi-document
    transactions are costlier than in relational databases, duplicated data can drift, and schema freedom
    can lead to messy data without discipline.'
  topic: backend dev
  tags:
  - mongodb
  - nosql
  - databases
  - trade-offs
  explanation: '## In plain words

    MongoDB is a document database: each record is a JSON-like document that can hold nested objects and
    arrays. It shines when data is naturally hierarchical and the shape changes often, and it is weaker
    when you need many relationships and complex transactions across them.


    ## How it works

    **Pros**

    - Flexible schema: add fields without migrations.

    - Documents map directly to objects in code, so less mapping layer work.

    - High availability with replica sets and automatic failover.

    - Horizontal scaling with sharding.

    - Powerful aggregation pipeline, secondary indexes, text and geospatial search.


    **Cons**

    - Joins (`$lookup`) and multi-document transactions are slower and less natural than in SQL.

    - Denormalised data must be updated in several places.

    - No enforced schema by default, so data quality depends on discipline or validators.

    - Choosing a bad shard key is hard to undo.

    - Memory and storage use can be higher because field names are stored in every document.


    ## Example

    Good fit: a product catalogue where each product type has different attributes (a shirt has sizes,
    a laptop has CPU specs). One collection holds them all without dozens of nullable columns.


    Poor fit: a double-entry accounting ledger with many cross-table constraints and reports joining five
    tables. A relational database is simpler there.


    ## Common mistakes

    - Saying MongoDB "does not scale" or "has no transactions"; both are outdated.

    - Choosing it just to avoid schema design.

    - Ignoring the shard key until data is huge.

    - Comparing it to SQL on features instead of on the workload.


    ## In the interview

    Give a balanced list, then tie it to a use case. Follow-ups: how you would model a specific domain,
    how sharding works, and when you would pick PostgreSQL (with JSONB columns) instead. Show you choose
    tools based on access patterns.

    '
  match:
