- id: kb-86c19fd1d232
  question: What are the types of database replication?
  answer: 'By topology: single-leader (primary-replica), multi-leader, and leaderless replication. By
    timing: synchronous, asynchronous, or semi-synchronous. Each trades consistency, write availability,
    and latency differently.'
  topic: backend dev
  tags:
  - replication
  - databases
  - distributed-systems
  - high-availability
  explanation: '## In plain words

    Replication keeps copies of the same data on several machines. The key questions are who may accept
    writes, and whether a write waits for the copies before it is confirmed.


    ## How it works

    **Who accepts writes**

    - **Single-leader:** one primary takes writes and streams changes to read replicas. Simple, no write
    conflicts; failover needed if the primary dies. PostgreSQL and MySQL default.

    - **Multi-leader:** several nodes take writes, often one per data centre, and sync with each other.
    Lower write latency across regions, but concurrent writes conflict and need resolution.

    - **Leaderless:** clients write to several nodes and read from several, using quorums (W + R > N).
    Highly available. Dynamo-style systems such as Cassandra.


    **When a write is confirmed**

    - **Synchronous:** the leader waits for replicas. No data loss on failover, but slower and blocked
    if a replica is down.

    - **Asynchronous:** confirm immediately, replicate later. Fast, but recent writes can be lost and
    replicas lag.

    - **Semi-synchronous:** wait for at least one replica.


    **How changes are shipped:** statement-based, write-ahead log shipping, or logical (row-based) replication.


    ## Example

    An online shop runs PostgreSQL with one primary and two async replicas. Reads for product pages go
    to replicas; checkout writes go to the primary. A customer who just changed their address might read
    the old one from a lagging replica, so "read your own writes" queries are routed to the primary.


    ## Common mistakes

    - Calling replication a backup; a bad delete replicates too.

    - Ignoring replication lag in read-after-write flows.

    - Choosing multi-leader without a conflict plan.

    - Not testing failover.


    ## In the interview

    Draw the three topologies and discuss sync versus async. Expect follow-ups on failover and split brain,
    quorum math, and read-your-writes consistency. Tie choices to requirements: global writes, durability,
    or read scaling.

    '
