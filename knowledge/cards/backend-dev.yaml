- id: kb-11d0c2f769a0
  question: What is a right join in SQL?
  answer: A right (outer) join returns every row from the right table plus matching rows from the left
    table, with NULLs for left columns when there is no match. It is the mirror of a left join, and most
    people rewrite it as a left join by swapping table order for readability.
  topic: backend dev
  tags:
  - sql
  - joins
  - databases
  explanation: '## In plain words

    A right join keeps everything from the second table you name and attaches data from the first table
    where it exists. It answers questions like "show all departments, with their employees if any".


    ## How it works

    - Syntax: `FROM A RIGHT JOIN B ON condition`.

    - Every row of B appears at least once.

    - Matching A rows fill in A''s columns; unmatched B rows get NULL for A''s columns.

    - `A RIGHT JOIN B` gives the same rows as `B LEFT JOIN A`; only the column order of `SELECT *` differs.

    - Most teams standardise on left joins because reading "main table first" is clearer, especially with
    several joins.

    - SQLite added `RIGHT JOIN` only in version 3.39.


    ## Example

    ```sql

    -- employees: (1,''Ana'',10)

    -- departments: (10,''Sales''), (20,''Legal'')


    SELECT d.title, e.name

    FROM employees e

    RIGHT JOIN departments d ON e.dept_id = d.id;

    -- Sales | Ana

    -- Legal | NULL


    -- Equivalent and more common:

    SELECT d.title, e.name

    FROM departments d

    LEFT JOIN employees e ON e.dept_id = d.id;

    ```


    ## Common mistakes

    - Mixing left and right joins in one query, making it hard to follow.

    - Filtering left-table columns in `WHERE`, which removes the NULL rows.

    - Forgetting which side is preserved.

    - Assuming every database supports it.


    ## In the interview

    Explain it as the mirror of a left join and mention that you would usually write the left-join form.
    Interviewers mostly check that you know which side is preserved and that NULLs appear on the other
    side.

    '
