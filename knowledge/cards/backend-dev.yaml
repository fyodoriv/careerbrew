- id: kb-43b937926e5e
  question: What is GraphQL?
  answer: GraphQL is a query language and runtime for APIs where the client sends a query describing exactly
    the fields it needs, and the server returns just that shape from a single endpoint. A strongly typed
    schema defines types, queries, mutations, and subscriptions, and resolvers fetch the data.
  topic: backend dev
  tags:
  - graphql
  - api
  - web
  - backend
  explanation: "## In plain words\nWith a typical REST API you call several endpoints and get fixed responses,\
    \ often with too much or too little data. With GraphQL the client writes one query listing the fields\
    \ it wants, even across related objects, and receives exactly that. It is like ordering a custom meal\
    \ instead of fixed combo menus.\n\n## How it works\n- **Schema:** types and fields, e.g. `type User\
    \ { id: ID!, name: String, posts: [Post] }`, plus root `Query`, `Mutation`, and `Subscription` types.\n\
    - **Query:** the client asks for a tree of fields; the response JSON mirrors that tree.\n- **Resolvers:**\
    \ server functions that load each field from databases or other services.\n- **Single endpoint:**\
    \ usually `POST /graphql`.\n- **Introspection:** clients and tools can read the schema, enabling autocomplete\
    \ and type generation.\n- **Challenges:** the N+1 query problem (solved with batching tools like DataLoader),\
    \ HTTP caching is harder, and expensive queries need depth or cost limits.\n\n## Example\n```graphql\n\
    query {\n  user(id: \"42\") {\n    name\n    posts(last: 2) { title }\n  }\n}\n```\nResponse:\n```json\n\
    { \"data\": { \"user\": { \"name\": \"Ana\", \"posts\": [ { \"title\": \"Hello\" }, { \"title\": \"\
    Indexes\" } ] } } }\n```\nOne request replaces `GET /users/42` plus `GET /users/42/posts`.\n\n## Common\
    \ mistakes\n- Assuming GraphQL is a database; it is an API layer.\n- Ignoring N+1 queries in resolvers.\n\
    - No limits on query depth or complexity, allowing denial-of-service queries.\n- Expecting standard\
    \ HTTP caching to work out of the box.\n\n## In the interview\nCompare with REST: flexibility and\
    \ fewer round trips versus caching, complexity, and security work. Mention schema evolution by adding\
    \ fields and deprecating old ones instead of versioning. Good fits: many client types and nested data;\
    \ REST may be simpler for public, cacheable resources.\n"
