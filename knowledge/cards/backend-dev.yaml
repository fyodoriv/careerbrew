- id: kb-4192e43d024b
  question: What are best practices for organizing data in MongoDB?
  answer: 'Design the schema around your queries: embed data that is read and written together, reference
    data that is large, shared, or unbounded, and avoid arrays that grow without limit. Add indexes for
    common queries, keep documents well under the 16 MB limit, and use known patterns such as bucketing
    and subsets.'
  topic: backend dev
  tags:
  - mongodb
  - schema-design
  - data-modeling
  - databases
  explanation: "## In plain words\nIn a relational database you design tables first and write queries\
    \ later. In MongoDB you do the opposite: look at how the app reads and writes data, then shape documents\
    \ so the common operations touch as few documents as possible.\n\n## How it works\n- **Embed** one-to-one\
    \ and one-to-few data that is read with the parent (an address inside a user).\n- **Reference** one-to-many\
    \ or many-to-many data that grows large or is shared (orders pointing to a customer id).\n- **Avoid\
    \ unbounded arrays:** a document is capped at 16 MB and big arrays make updates slow.\n- **Patterns:**\n\
    \  - *Bucket:* group time-series points by hour in one document.\n  - *Subset:* keep the 10 newest\
    \ reviews embedded, the rest in another collection.\n  - *Extended reference:* copy a few fields (customer\
    \ name) to avoid a lookup.\n  - *Schema versioning:* a `schemaVersion` field for gradual migrations.\n\
    - **Indexes** for every frequent filter and sort; compound indexes follow the equality, sort, range\
    \ rule.\n- **Validation** rules to keep shape consistent.\n\n## Example\nA blog post document:\n```json\n\
    {\n  \"_id\": \"p1\",\n  \"title\": \"Indexes 101\",\n  \"author\": { \"id\": \"u7\", \"name\": \"\
    Ana\" },\n  \"tags\": [\"db\", \"mongodb\"],\n  \"recentComments\": [ { \"user\": \"Bo\", \"text\"\
    : \"Nice\" } ],\n  \"commentCount\": 342\n}\n```\nAll 342 comments live in a `comments` collection\
    \ with `postId`; only the newest few are embedded.\n\n## Common mistakes\n- Copying a normalised SQL\
    \ schema and relying on `$lookup` everywhere.\n- Embedding everything until documents hit size limits.\n\
    - Duplicating data without a plan for keeping copies in sync.\n- No indexes, or too many unused ones\
    \ slowing writes.\n\n## In the interview\nStart with \"model for your access patterns\" and give one\
    \ embed and one reference example. Mention the 16 MB limit, the bucket and subset patterns, and indexing.\
    \ Interviewers like hearing the trade-off: read speed versus write complexity and duplication.\n"
  match:
  - 5bce93ee4b85
  prompt: 1f344914
- id: kb-d4e540139501
  question: What are best practices for using multiple CPU cores in a backend service?
  answer: Run work in parallel across cores with multiple processes or threads, sized to the core count,
    and keep shared mutable state to a minimum. Offload CPU-heavy tasks to worker pools or queues, keep
    I/O asynchronous, avoid lock contention, and measure with profiling before and after.
  topic: backend dev
  tags:
  - concurrency
  - multicore
  - performance
  - scalability
  explanation: "## In plain words\nA modern server has many CPU cores, but a program only uses them if\
    \ it gives each core its own work. The goal is to split work into independent pieces, run them side\
    \ by side, and avoid having the pieces wait on each other.\n\n## How it works\n- **Pick the unit of\
    \ parallelism:** processes (isolated, safer, more memory) or threads (shared memory, cheaper, need\
    \ synchronisation).\n- **Size pools to the hardware:** about one worker per core for CPU-bound work;\
    \ more for I/O-bound work that mostly waits.\n- **Share little:** pass messages or use immutable data;\
    \ shared state needs locks, which create contention.\n- **Separate CPU and I/O work:** async I/O for\
    \ network and disk, worker pools or background queues for heavy computation.\n- **Batch and partition:**\
    \ give each worker a chunk of data to reduce coordination.\n- **Watch the hidden limits:** memory\
    \ bandwidth, cache misses, false sharing, garbage-collection pauses, and global locks such as Python's\
    \ GIL.\n- **Measure:** CPU utilisation per core, latency percentiles, and throughput under load.\n\
    \n## Example\n```python\nfrom concurrent.futures import ProcessPoolExecutor\nimport os\n\ndef heavy(n:\
    \ int) -> int:\n    return sum(i * i for i in range(n))\n\nif __name__ == \"__main__\":\n    with\
    \ ProcessPoolExecutor(max_workers=os.cpu_count()) as pool:\n        print(sum(pool.map(heavy, [2_000_000]\
    \ * 8)))\n```\nProcesses sidestep Python's GIL, so the eight tasks run on separate cores.\n\n## Common\
    \ mistakes\n- Starting far more threads than cores for CPU work, causing context-switch overhead.\n\
    - One global lock around everything, so only one core does useful work.\n- Assuming more cores always\
    \ mean linear speed-up (Amdahl's law limits it).\n- Parallelising before profiling.\n\n## In the interview\n\
    Mention Amdahl's law, the CPU-bound versus I/O-bound distinction, and the process-versus-thread trade-off.\
    \ Give a language-specific note: Node.js cluster or worker threads, Python multiprocessing, Go goroutines,\
    \ Java thread pools. Horizontal scaling across machines is the next step.\n"
