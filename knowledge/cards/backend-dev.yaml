- id: kb-41f0c0591cad
  question: How do you join data from two collections in MongoDB?
  answer: Use the `$lookup` stage in an aggregation pipeline, which performs a left outer join from one
    collection into another by matching fields or by a sub-pipeline. Because joins are costlier than in
    SQL, MongoDB designs often embed related data instead.
  topic: backend dev
  tags:
  - mongodb
  - aggregation
  - lookup
  - joins
  explanation: "## In plain words\nMongoDB stores documents, not tables, and has no `JOIN` keyword. When\
    \ you need data from two collections together, the aggregation framework offers `$lookup`, which attaches\
    \ matching documents from another collection as an array field.\n\n## How it works\n- **Simple form:**\
    \ `localField` in the current collection is matched with `foreignField` in the other collection; matches\
    \ go into the `as` array.\n- **Pipeline form:** `let` passes variables and `pipeline` can filter,\
    \ project, or match on several conditions.\n- It behaves like a **left outer join**: documents without\
    \ matches get an empty array.\n- `$unwind` turns the array into one document per match, which feels\
    \ like an inner join if you drop empties.\n- Index the `foreignField`, or each lookup scans the other\
    \ collection.\n- On sharded clusters `$lookup` is supported from version 5.1 for the joined collection,\
    \ but it is still more expensive than reading one document.\n\n## Example\n```javascript\ndb.orders.aggregate([\n\
    \  { $match: { status: \"paid\" } },\n  { $lookup: {\n      from: \"customers\",\n      localField:\
    \ \"customerId\",\n      foreignField: \"_id\",\n      as: \"customer\"\n  } },\n  { $unwind: \"$customer\"\
    \ },\n  { $project: { total: 1, \"customer.name\": 1 } }\n]);\n```\nEach paid order now carries its\
    \ customer's name.\n\n## Common mistakes\n- Modelling MongoDB like a normalised SQL database and joining\
    \ on every request.\n- Missing an index on the foreign field.\n- Forgetting that `$lookup` returns\
    \ an array, then reading it as an object.\n- Doing joins in application code with one query per row\
    \ (the N+1 problem).\n\n## In the interview\nAnswer with `$lookup`, then pivot to design: embed data\
    \ that is read together, reference data that is large, shared, or changes independently. Mention denormalisation\
    \ trade-offs (faster reads, harder updates) and when a relational database would be the better tool.\n"
  match:
  - 885144ae1008
  prompt: 1f344914
- id: kb-b0e5ac54a55c
  question: How do you validate data in MongoDB?
  answer: MongoDB can enforce rules at the database level with a JSON Schema validator on a collection,
    set via `validator` with `validationLevel` and `validationAction`. Most applications also validate
    in code, for example with Mongoose schemas, to give clear errors before data reaches the database.
  topic: backend dev
  tags:
  - mongodb
  - validation
  - schema
  - databases
  explanation: "## In plain words\nMongoDB is schema-flexible: by default any document can go into any\
    \ collection. That freedom is handy, but bad data creeps in. Validation adds rules such as \"email\
    \ is a required string\" so the database rejects documents that break them.\n\n## How it works\n-\
    \ **Schema validation:** attach a `$jsonSchema` (or query-operator) validator when creating a collection\
    \ or later with `collMod`.\n- **`validationLevel`:** `strict` checks every insert and update; `moderate`\
    \ checks all inserts and updates to documents that are already valid, but skips updates to existing\
    \ invalid documents, which helps when adding rules to old data.\n- **`validationAction`:** `error`\
    \ rejects bad writes; `warn` allows them but logs a warning.\n- **Application layer:** ODMs like Mongoose\
    \ define schemas, types, required fields, and custom validators in code. Libraries such as Joi or\
    \ Zod validate API input.\n- Use both: app validation for friendly messages, database validation as\
    \ the final guard against any client.\n\n## Example\n```javascript\ndb.createCollection(\"users\"\
    , {\n  validator: {\n    $jsonSchema: {\n      bsonType: \"object\",\n      required: [\"email\",\
    \ \"age\"],\n      properties: {\n        email: { bsonType: \"string\", pattern: \"^.+@.+$\" },\n\
    \        age: { bsonType: \"int\", minimum: 0, maximum: 150 }\n      }\n    }\n  },\n  validationLevel:\
    \ \"strict\",\n  validationAction: \"error\"\n});\n\ndb.users.insertOne({ email: \"a@example.com\"\
    , age: -3 }); // fails validation\n```\n\n## Common mistakes\n- Assuming MongoDB has no validation\
    \ at all.\n- Relying only on Mongoose, so scripts and other services bypass the rules.\n- Turning\
    \ on `strict` for an existing messy collection and breaking writes in production.\n- Forgetting that\
    \ some clients send numbers as `double` (for example `30.5`, or any number from tools that do not\
    \ convert whole numbers to integers), so a strict `bsonType: \"int\"` rule rejects them; use `bsonType:\
    \ [\"int\", \"long\", \"double\"]` or `\"number\"` when any numeric type is fine.\n\n## In the interview\n\
    Explain the two layers and when each helps. Mention rolling out rules with `moderate` or `warn` first,\
    \ then tightening. Trade-off: flexibility versus data quality. Follow-ups may cover unique indexes\
    \ (another kind of constraint) and schema versioning fields for migrations.\n"
  match:
  - 8aa1da4b5dc5
  prompt: 1f344914
- id: kb-58dc86017c11
  question: How does caching with Nginx work in front of an Express app?
  answer: Nginx sits in front of Express as a reverse proxy, stores responses on disk keyed by the request,
    and serves later identical requests from that cache without touching Node. You configure a cache zone,
    which responses to keep and for how long, and Express can steer it with Cache-Control headers.
  topic: backend dev
  tags:
  - nginx
  - caching
  - express
  - reverse-proxy
  explanation: "## In plain words\nNginx is a fast web server that can stand between users and your Node.js\
    \ app. When it has already seen a request, it can answer from its own saved copy, so Express does\
    \ no work and the response arrives sooner. It is like a receptionist who answers common questions\
    \ without bothering the expert.\n\n## How it works\n- **Reverse proxy:** clients talk to Nginx; Nginx\
    \ forwards to Express with `proxy_pass`, pointing at the Express port (for example 127.0.0.1:3000)\
    \ or an `upstream` block.\n- **Cache zone:** `proxy_cache_path` sets the disk location, a shared memory\
    \ zone for keys, and size limits.\n- **Cache key:** by default the scheme, host, and URI. You can\
    \ add headers or cookies.\n- **Validity:** `proxy_cache_valid 200 10m;` keeps successful responses\
    \ for 10 minutes. Nginx also honours `Cache-Control` and `Expires` from Express.\n- **Bypass:** skip\
    \ caching for logged-in users or POST requests with `proxy_cache_bypass` and `proxy_no_cache`.\n-\
    \ **Resilience:** `proxy_cache_use_stale` can serve old content if Express is down, and `proxy_cache_lock`\
    \ lets only one request refill a missing entry.\n- Static files are often served directly by Nginx,\
    \ never reaching Node.\n\n## Example\n```nginx\nproxy_cache_path /var/cache/nginx keys_zone=api:10m\
    \ max_size=1g inactive=60m;\n\nserver {\n  listen 80;\n  location /api/ {\n    # plus a proxy_pass\
    \ line pointing at the Express port\n    proxy_cache api;\n    proxy_cache_valid 200 5m;\n    proxy_cache_use_stale\
    \ error timeout updating;\n    add_header X-Cache-Status $upstream_cache_status;\n  }\n}\n```\nIn\
    \ Express, `res.set(\"Cache-Control\", \"public, max-age=300\")` signals that a response may be cached.\n\
    \n## Common mistakes\n- Caching personalised responses and showing one user's data to another.\n-\
    \ Forgetting that `Set-Cookie` responses are not cached by default, then wondering why nothing caches.\n\
    - No way to purge or version content after a deploy.\n- Caching error pages for a long time.\n\n##\
    \ In the interview\nDescribe the request path, the cache key, TTLs, and how to check hits (the `X-Cache-Status`\
    \ header). Trade-offs: speed and lower Node load versus stale data and the risk of caching private\
    \ content. Compare with in-app caching (Redis) and a CDN in front of Nginx.\n"
  match:
  - 8d3c3b78fb0d
  prompt: 1f344914
- id: kb-1bbd84136769
  question: How should a system store and protect user passwords?
  answer: Never store passwords in plain text or with fast hashes. Hash each password with a slow, salted
    algorithm built for passwords, such as Argon2id, bcrypt, or scrypt, compare hashes in constant time,
    and add rate limiting, breached-password checks, and multi-factor authentication.
  topic: backend dev
  tags:
  - security
  - passwords
  - hashing
  - authentication
  explanation: "## In plain words\nIf your database leaks, attackers should not be able to recover users'\
    \ passwords. You store a one-way, deliberately slow fingerprint of each password instead of the password\
    \ itself. When a user logs in, you compute the fingerprint again and compare.\n\n## How it works\n\
    - **Hash, do not encrypt:** encryption can be reversed with the key; a hash cannot.\n- **Use a password\
    \ hashing function:** Argon2id (current first choice), scrypt, or bcrypt. They are slow and, for Argon2\
    \ and scrypt, memory-hard, which makes guessing billions of passwords expensive.\n- **Salt:** a unique\
    \ random value per user, stored with the hash, so identical passwords produce different hashes and\
    \ precomputed tables are useless. The libraries handle this.\n- **Tune the cost** so one hash takes\
    \ tens to hundreds of milliseconds on your hardware, and raise it over time; rehash on next login.\n\
    - **Optional pepper:** a secret kept outside the database and mixed in.\n- **Around the hash:** TLS\
    \ in transit, rate limiting and lockouts, checks against known breached passwords, MFA, and secure\
    \ reset flows with short-lived single-use tokens.\n\n## Example\n```python\nfrom argon2 import PasswordHasher\
    \  # pip install argon2-cffi\n\nph = PasswordHasher()\nstored = ph.hash(\"correct horse battery staple\"\
    )\n\ndef login(attempt: str) -> bool:\n    try:\n        return ph.verify(stored, attempt)\n    except\
    \ Exception:\n        return False\n\nprint(login(\"correct horse battery staple\"))  # True\nprint(login(\"\
    wrong\"))                          # False\n```\n\n## Common mistakes\n- Using MD5, SHA-1, or even\
    \ plain SHA-256: they are far too fast.\n- One global salt for all users.\n- Writing your own crypto\
    \ instead of using a vetted library.\n- Logging passwords in request logs or error messages.\n\n##\
    \ In the interview\nSay \"salted, slow, adaptive hash such as Argon2id or bcrypt\" in the first sentence.\
    \ Then cover the surrounding defences. Follow-ups: why slowness matters (offline brute force), how\
    \ to migrate old hashes, and password reset security. Mention that delegating to an identity provider\
    \ is often the best option.\n"
  match:
  - '122679650804'
  prompt: 1f344914
- id: kb-83bfc707c901
  question: How would you design caching for a video streaming service?
  answer: Split videos into small segments and serve them from a CDN close to users, caching popular content
    at the edge and long-tail content in regional or origin storage. Cache metadata and manifests separately
    with short lifetimes, and pre-warm caches for content you expect to be popular.
  topic: backend dev
  tags:
  - caching
  - cdn
  - video
  - system-design
  explanation: '## In plain words

    Video files are huge and watched by many people at once, so you want copies close to viewers instead
    of sending every byte from one data center. It is like a chain of local shops stocking best-sellers
    while rare items are ordered from the central warehouse.


    ## How it works

    - **Segment the video:** adaptive streaming formats such as HLS and DASH cut each video into chunks
    of a few seconds at several bitrates. Chunks are small, immutable files, which are ideal for caching.

    - **Layers of cache:** the player buffer on the device, CDN edge servers near users, a regional or
    mid-tier cache, then origin object storage.

    - **What to cache where:** hot titles and the first segments of every video live at the edge; rarely
    watched content stays at origin and is cached on demand.

    - **Cache keys and lifetime:** segments are immutable, so give them long time-to-live (TTL) values
    and versioned URLs. Manifests (the playlist of segments) and live streams need short TTLs.

    - **Pre-warming:** push a new release to edges before launch to avoid a flood of misses hitting origin.

    - **Eviction:** least recently or least frequently used, weighted by file size and popularity.


    ## Example

    A new episode launches at 20:00. At 18:00 the system pushes the first 5 minutes of each bitrate to
    every edge location. A viewer in Paris fetches `ep1/720p/seg001.ts` from a Paris edge server in a
    few milliseconds. A viewer of an obscure 2009 documentary gets a miss at the edge, which fetches from
    the regional cache, then origin, and keeps the segment for the next viewer.


    ## Common mistakes

    - Caching whole video files instead of segments.

    - Using the same TTL for immutable segments and changing manifests.

    - Forgetting the thundering herd: many simultaneous misses for one new segment should collapse into
    one origin request.

    - Ignoring cost: egress from origin is often the largest bill.


    ## In the interview

    Start with requirements (on-demand vs live, global audience, catalog size), then draw the cache layers.
    Mention adaptive bitrate, request coalescing, cache hit ratio as the key metric, and the trade-off
    between storage cost at the edge and origin load. A follow-up may ask how live streaming changes things:
    much shorter segments and TTLs.

    '
  match:
