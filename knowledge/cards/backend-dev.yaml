- id: kb-5fac09a8d507
  question: What are consensus algorithms?
  answer: Consensus algorithms let a group of machines agree on one value or one ordered log of operations
    even when some machines crash or messages are delayed. Paxos and Raft are the classic examples; they
    need a majority (quorum) of nodes to make progress and power systems like etcd, ZooKeeper, and distributed
    databases.
  topic: backend dev
  tags:
  - distributed-systems
  - consensus
  - raft
  - paxos
  explanation: '## In plain words

    Several servers need to act like one reliable server, for example to decide who the leader is or the
    order of writes. Because any server can crash and the network can be slow, they need a voting protocol
    that still reaches one agreed answer as long as most of them are healthy.


    ## How it works

    Using Raft as the easier-to-explain example:

    - Nodes are **followers**, **candidates**, or one **leader**.

    - If a follower hears nothing from a leader before a randomised timeout, it becomes a candidate and
    asks for votes for a new **term**.

    - A candidate with votes from a **majority** becomes leader.

    - Clients send commands to the leader, which appends them to its log and replicates them to followers.

    - An entry is **committed** once a majority stores it; then every node applies it in the same order.

    - With 2f + 1 nodes the system tolerates f crashes. Five nodes survive two failures.

    - Safety: two leaders cannot both commit in the same term because two majorities always overlap.


    Paxos gives the same guarantees with a different structure. Byzantine fault tolerant algorithms (PBFT)
    also handle lying nodes, at higher cost.


    ## Example

    A 3-node etcd cluster stores configuration. Node A is leader. A client writes `feature=on`. A writes
    it to its log and sends it to B and C. B confirms; A plus B is a majority, so the entry commits and
    A replies success. If A then crashes, B or C wins an election and still has the entry.


    ## Common mistakes

    - Thinking consensus works with an even split: a 4-node cluster still only tolerates one failure.

    - Confusing replication with consensus; replication alone does not decide ordering under failures.

    - Ignoring that a minority partition must stop accepting writes.

    - Assuming crash-tolerant algorithms also handle malicious nodes.


    ## In the interview

    Explain leader election, log replication, and majority quorums. Mention the FLP result (no guaranteed
    consensus in a fully asynchronous system with even one faulty process), which is why timeouts are
    used. Trade-offs: strong consistency versus latency of a majority round trip and reduced availability
    during partitions.

    '
