- id: kb-7cbc3799e37a
  question: What is eventual consistency in databases?
  answer: Eventual consistency means that if no new writes happen, all replicas of a piece of data will
    converge to the same value after some time, but a read in the meantime may return stale data. It favours
    availability and low latency over always-current reads.
  topic: backend dev
  tags:
  - eventual-consistency
  - distributed-systems
  - replication
  - databases
  explanation: '## In plain words

    When data is copied to many servers, updates take a moment to reach all of them. With eventual consistency,
    the system answers right away from whatever copy is nearby, even if that copy has not heard the latest
    news yet. Given a little quiet time, every copy catches up.


    ## How it works

    - A write is accepted by one or a few replicas and confirmed quickly.

    - Other replicas receive it asynchronously through replication, gossip, or anti-entropy repair.

    - Reads may hit a replica that is behind and return an old value.

    - Conflicting concurrent writes need a rule: last-writer-wins, version vectors with merge, or CRDTs.

    - Tunable systems (such as Cassandra) let you choose quorum reads and writes (R + W > N) to read the
    latest write when needed.

    - Useful session guarantees on top: *read-your-writes*, *monotonic reads* (never go back in time),
    and *consistent prefix*.


    ## Example

    You change your profile photo. You refresh and still see the old one because your read went to a replica
    in another zone that is 200 ms behind. A second refresh shows the new photo. For a "like" counter
    this is fine; for a bank balance used to approve a withdrawal it is not.


    ## Common mistakes

    - Thinking "eventual" means "maybe never"; it does converge, usually within milliseconds.

    - Not planning for conflicts from concurrent writes.

    - Using eventual consistency for invariants such as stock counts or unique usernames.

    - Forgetting read-your-writes, which confuses users who just saved something.


    ## In the interview

    Contrast with strong consistency, relate to CAP and BASE, and give a good and a bad use case. Mention
    quorum tuning and session guarantees. Interviewers like hearing that consistency can be chosen per
    operation rather than for the whole system.

    '
