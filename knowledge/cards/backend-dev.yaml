- id: kb-dd5ed1bbfc88
  question: What is a JOIN in SQL databases?
  answer: A JOIN combines rows from two or more tables based on a related column, usually a foreign key.
    The main kinds are inner (only matches), left and right outer (all rows from one side), full outer
    (all rows from both), and cross (every combination); there are also self-joins.
  topic: backend dev
  tags:
  - sql
  - joins
  - databases
  - relational
  explanation: '## In plain words

    Relational databases store each kind of thing in its own table to avoid duplication. A JOIN puts the
    pieces back together for a query, like matching customer ids on orders with the customer table to
    show names next to orders.


    ## How it works

    - **INNER JOIN:** rows that match in both tables.

    - **LEFT (OUTER) JOIN:** all rows from the left table, matched data from the right or NULLs.

    - **RIGHT (OUTER) JOIN:** the mirror image.

    - **FULL (OUTER) JOIN:** all rows from both, NULLs where there is no match.

    - **CROSS JOIN:** every row paired with every row (Cartesian product).

    - **SELF JOIN:** a table joined with itself, for example employees and their managers.

    - **Execution:** the optimiser chooses nested-loop (good with an index on the inner side), hash join
    (large unsorted inputs), or merge join (both inputs sorted).


    ## Example

    ```sql

    SELECT e.name AS employee, m.name AS manager

    FROM employees e

    LEFT JOIN employees m ON e.manager_id = m.id;

    ```

    A self-join with `LEFT JOIN` so the CEO, who has no manager, still appears with `manager = NULL`.


    ## Common mistakes

    - Forgetting the join condition and creating a cross product.

    - Filtering the optional side of an outer join in `WHERE` (the right table of a `LEFT JOIN`, for example
    `WHERE m.name = ''Ana''`), which drops the NULL rows and silently turns it into an inner join. Put
    such conditions in `ON` instead.

    - Joining on columns without indexes.

    - Not expecting row multiplication in one-to-many joins.


    ## In the interview

    Draw the Venn diagrams quickly and give a short example. Mention join algorithms and index use for
    depth. In design discussions, connect joins to normalisation and explain when denormalising to avoid
    joins is worth it.

    '
