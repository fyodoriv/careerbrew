- id: kb-b1268ebb1edc
  question: What is durability in ACID?
  answer: Durability means once a transaction is committed, its changes survive crashes and power loss.
    Databases achieve this by writing changes to a write-ahead log on stable storage and flushing it before
    confirming the commit, often also replicating to other machines.
  topic: backend dev
  tags:
  - acid
  - durability
  - transactions
  - databases
  explanation: '## In plain words

    When the database says "saved", it must really be saved, even if the server loses power a millisecond
    later. Durability is that promise.


    ## How it works

    - **Write-ahead log (WAL):** before changing data files, the database appends a description of the
    change to a log.

    - **Flush on commit:** the log is forced to disk with `fsync` before the commit is acknowledged. Data
    files can be updated later.

    - **Recovery:** after a crash, the database replays the log to redo committed changes and discard
    uncommitted ones.

    - **Checkpoints** periodically write data files so the log does not grow forever.

    - **Beyond one disk:** replicate to other machines (synchronously for strongest guarantees) and keep
    backups, because a single disk can fail.

    - **Tuning trade-offs:** settings like PostgreSQL `synchronous_commit = off` or batching (group commit)
    trade a small risk of losing recent commits for speed.


    ## Example

    A user places an order and sees "Order confirmed". The database had already written the order''s WAL
    record and flushed it to disk. Seconds later the server crashes. On restart, recovery reads the WAL,
    finds the committed order, and restores it. A second order that was mid-transaction at crash time
    is rolled back, and that user never got a confirmation.


    ## Common mistakes

    - Assuming the operating system writes data immediately; without `fsync` it may sit in memory.

    - Disk caches that lie about flushing (consumer drives without power-loss protection).

    - Treating one durable disk as enough; durability against machine loss needs replication.

    - Turning off sync settings in production without understanding the risk.


    ## In the interview

    Mention the WAL and fsync, then the replication layer. Follow-ups: group commit, synchronous versus
    asynchronous replication, and the cost of durability on write latency. Tie it back: durability covers
    committed data only.

    '
