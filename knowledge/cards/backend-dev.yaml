- id: kb-06d08e26d36d
  question: What is database indexing?
  answer: An index is an extra data structure, usually a B-tree, that keeps chosen column values sorted
    with pointers to rows, so the database can find matching rows without scanning the whole table. Indexes
    speed up reads, filters, joins, and sorts, but use storage and slow down writes.
  topic: backend dev
  tags:
  - indexing
  - databases
  - performance
  - b-tree
  explanation: '## In plain words

    An index works like the index at the back of a book: instead of reading every page to find "replication",
    you look it up and jump to the right pages. Without an index the database reads every row, which is
    fine for 100 rows and painful for 100 million.


    ## How it works

    - **B-tree index** (the default in most databases): a balanced tree of sorted keys. Lookups, range
    queries (`BETWEEN`, `<`), and `ORDER BY` take about O(log n).

    - **Hash index:** fast equality lookups, no ranges.

    - **Composite index** on `(a, b)`: helps queries filtering on `a`, or on `a` and `b`, but not on `b`
    alone (leftmost prefix rule).

    - **Covering index:** includes every column the query needs, so the table is not touched.

    - **Unique index:** also enforces uniqueness.

    - **Clustered index:** the table rows themselves are stored in index order (one per table).

    - Other kinds: full-text, geospatial, bitmap, GIN for JSON and arrays.

    - **Cost:** each insert, update, or delete must also update every index.


    ## Example

    ```sql

    -- Slow: full scan of 50 million rows

    SELECT * FROM orders WHERE customer_id = 42 ORDER BY created_at DESC LIMIT 20;


    CREATE INDEX idx_orders_customer_created ON orders (customer_id, created_at DESC);


    -- Now the database jumps to customer 42 and reads 20 entries in order.

    EXPLAIN SELECT * FROM orders WHERE customer_id = 42 ORDER BY created_at DESC LIMIT 20;

    ```


    ## Common mistakes

    - Indexing every column, slowing writes and wasting memory.

    - Wrong column order in composite indexes.

    - Wrapping the column in a function (`WHERE LOWER(email) = ...`) so the index cannot be used, unless
    you create an expression index.

    - Never checking the query plan with `EXPLAIN`.


    ## In the interview

    Explain the B-tree, the read-versus-write trade-off, and composite index ordering. Show you would
    use `EXPLAIN` to verify. Common follow-ups: selectivity (indexes on low-variety columns help little),
    covering indexes, and why a query did not use an index.

    '
