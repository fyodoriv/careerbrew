- id: kb-0a347687f749
  question: What is Google Bigtable?
  answer: Bigtable is Google's distributed wide-column NoSQL database, built for petabyte-scale data with
    low-latency reads and writes. Data is a sparse, sorted map keyed by row key, column family and qualifier,
    and timestamp, split into tablets across servers and stored on Google's distributed file system. It
    inspired HBase and Cassandra's data model.
  topic: backend dev
  tags:
  - bigtable
  - nosql
  - wide-column
  - gcp
  explanation: '## In plain words

    Bigtable is a giant sorted table spread across many machines. Each row has a key, and rows are stored
    in key order, so reading a range of related rows is fast. It is built for huge volumes of data such
    as time series, logs, and user events, not for joins or complex queries.


    ## How it works

    - **Data model:** `(row key, column family:qualifier, timestamp) -> value`. Rows are sparse: empty
    cells take no space. Multiple timestamped versions per cell.

    - **Sorting:** rows are kept sorted lexicographically by row key, so prefix and range scans are efficient.

    - **Tablets:** the key space is split into ranges called tablets, served by tablet servers and rebalanced
    automatically.

    - **Storage:** data is written to a commit log and memory, then flushed to immutable SSTable files
    on Colossus (Google''s file system), and compacted in the background.

    - **Atomicity:** single-row operations are atomic; there are no multi-row transactions.

    - **Row key design** is the most important decision: avoid hotspots (e.g., keys starting with the
    current timestamp).


    ## Example

    Storing sensor readings: row key `sensor#4711#2026-10-19T12:00`. All readings for one sensor sit together,
    so "last 24 hours for sensor 4711" is one range scan. Using only the timestamp as key would send every
    new write to the same tablet, creating a hotspot.


    ## Common mistakes

    - Treating it like a relational database with secondary indexes and joins; it has neither natively.

    - Monotonically increasing row keys that hotspot one server.

    - Using it for small datasets, where its minimum cost is not justified.

    - Confusing it with BigQuery, which is an analytics warehouse with SQL.


    ## In the interview

    Describe the data model, sorted row keys, and tablets, then focus on row key design. Mention its lineage
    (the 2006 paper, HBase) and good fits: time series, IoT, ad tech, personalisation. Contrast with BigQuery
    and Spanner when asked.

    '
