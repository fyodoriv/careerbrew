- id: kb-584081724127
  question: What is consistency in ACID?
  answer: 'Consistency means a transaction takes the database from one valid state to another: every declared
    rule such as primary keys, foreign keys, unique and check constraints, and the application''s own
    invariants must hold after commit. If a transaction would break a rule, it is rejected and rolled
    back.'
  topic: backend dev
  tags:
  - acid
  - consistency
  - transactions
  - databases
  explanation: "## In plain words\nThe database has rules: an order must point to a real customer, a balance\
    \ cannot go below zero, an email is unique. Consistency in ACID promises that a committed transaction\
    \ never leaves these rules broken. It is the guarantee that data stays valid, not that every server\
    \ agrees.\n\n## How it works\n- **Database-enforced rules:** data types, `NOT NULL`, `UNIQUE`, `CHECK`,\
    \ foreign keys, and triggers. The database checks them during or at the end of the transaction and\
    \ aborts on violation.\n- **Application-defined rules:** \"total debits equal total credits\" is not\
    \ something the database knows. The application must write transactions that preserve it, relying\
    \ on atomicity and isolation to keep it true.\n- Some constraints can be **deferred** to commit time,\
    \ so intermediate steps may break them temporarily.\n- The other three letters support this one: atomicity\
    \ avoids half-applied changes, isolation avoids interference, durability keeps the valid state.\n\n\
    ## Example\n```sql\nCREATE TABLE customers (id INT PRIMARY KEY);\nCREATE TABLE orders (\n  id INT\
    \ PRIMARY KEY,\n  customer_id INT NOT NULL REFERENCES customers(id),\n  total NUMERIC CHECK (total\
    \ >= 0)\n);\n\nINSERT INTO orders VALUES (1, 999, 20);  -- fails: no customer 999\nINSERT INTO orders\
    \ VALUES (2, 1, -5);    -- fails: CHECK violated\n```\nNeither invalid row is ever stored.\n\n## Common\
    \ mistakes\n- Confusing ACID consistency with CAP consistency (linearisability across replicas).\n\
    - Assuming the database enforces business rules it was never told about.\n- Skipping foreign keys\
    \ \"for speed\" and then fighting orphaned rows.\n- Forgetting that race conditions under weak isolation\
    \ can still break application rules.\n\n## In the interview\nStart by separating ACID's C from CAP's\
    \ C; interviewers often probe this. Give a constraint example and an application invariant example.\
    \ Mention that some argue C is mostly the application's job, with the database providing tools.\n"
