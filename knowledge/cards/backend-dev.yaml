- id: kb-60693e2f3480
  question: What is a multilevel index?
  answer: 'A multilevel index is an index on top of an index: when a single sorted index is too large
    to search quickly, an outer index points to blocks of the inner one, repeating until the top level
    fits in one block. B-trees and B+ trees are the dynamic, self-balancing form of this idea.'
  topic: backend dev
  tags:
  - indexing
  - databases
  - b-tree
  - storage
  explanation: '## In plain words

    A big phone book has an index of letters on its spine, then each letter section has headers per page.
    You do not scan every name; you narrow down level by level. A multilevel index works the same way
    to keep the number of disk reads small.


    ## How it works

    - A **single-level index** is a sorted file of `(key, pointer)` entries. For millions of rows it spans
    thousands of disk blocks, and binary search still needs many block reads.

    - Build a **second level** with one entry per block of the first level (its first key and the block
    address). This is far smaller.

    - Repeat until the top level fits in one block.

    - A lookup reads one block per level. If each block holds f entries (the fan-out), levels ≈ log_f(n).

    - **B+ trees** make this dynamic: nodes split and merge on inserts and deletes, all leaves are at
    the same depth, and leaves are linked for range scans.

    - The top levels are usually cached in memory, so a lookup often costs one or two actual disk reads.


    ## Example

    100 million keys, 4 KB blocks holding 200 entries each:

    - Level 1: 100,000,000 / 200 = 500,000 blocks.

    - Level 2: 500,000 / 200 = 2,500 blocks.

    - Level 3: 2,500 / 200 = 13 blocks.

    - Level 4: 1 block.

    A lookup reads about 4 index blocks plus the data block, versus about 19 block reads for binary search
    over the 500,000-block single-level index.


    ## Common mistakes

    - Thinking it is a different structure from a B-tree; a B+ tree is the practical multilevel index.

    - Forgetting the cost of keeping a static multilevel index sorted on inserts.

    - Ignoring fan-out; small keys mean more entries per block and fewer levels.


    ## In the interview

    Explain the motivation (disk block reads), show the level calculation, and connect it to B+ trees.
    Mention why databases prefer wide, shallow trees over binary trees: fewer disk or page reads.

    '
