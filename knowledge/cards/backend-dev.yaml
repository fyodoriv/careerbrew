- id: kb-c857e2d190da
  question: What is event-driven architecture (EDA)?
  answer: In event-driven architecture, services communicate by publishing events that describe something
    that happened, such as OrderPlaced, and other services react to them asynchronously through a broker.
    Producers do not know their consumers, which loosens coupling and improves scalability, at the cost
    of eventual consistency and harder debugging.
  topic: backend dev
  tags:
  - event-driven
  - architecture
  - messaging
  - microservices
  explanation: "## In plain words\nInstead of service A calling B, C, and D directly, A announces \"an\
    \ order was placed\" and anyone interested listens. A does not wait for them and does not even need\
    \ to know they exist. Adding a new feature often means adding a new listener rather than changing\
    \ A.\n\n## How it works\n- **Event:** an immutable fact in past tense with data, e.g., `OrderPlaced\
    \ {orderId, total, time}`.\n- **Producers** publish to a **broker** (Kafka, RabbitMQ, SNS/SQS, EventBridge).\n\
    - **Consumers** subscribe and react independently, at their own pace.\n- **Styles:**\n  - *Event notification:*\
    \ small event, consumers fetch details if needed.\n  - *Event-carried state transfer:* the event includes\
    \ the data consumers need.\n  - *Event sourcing:* the event log is the source of truth and state is\
    \ rebuilt from it.\n- **Patterns:** choreography (services react to each other's events) versus orchestration\
    \ (a coordinator directs steps), sagas for multi-step transactions, the outbox pattern to publish\
    \ reliably with database writes.\n\n## Example\nCheckout publishes `OrderPlaced`. Inventory reserves\
    \ stock, email sends a receipt, analytics updates dashboards, and a new loyalty-points service subscribes\
    \ later without any change to checkout. If the email service is down, events wait in the broker and\
    \ are processed when it recovers.\n\n## Common mistakes\n- Using events for queries that need an immediate\
    \ answer.\n- No schema versioning for events, breaking consumers.\n- Assuming exactly-once delivery;\
    \ consumers must be idempotent.\n- Losing track of the overall flow; invest in tracing and documentation.\n\
    \n## In the interview\nExplain decoupling, asynchrony, and the broker. Compare with request-response\
    \ calls. Discuss trade-offs: resilience and extensibility versus eventual consistency, ordering, duplicates,\
    \ and observability. Mention the outbox pattern and sagas.\n"
