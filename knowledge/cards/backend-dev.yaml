- id: kb-e80d6d974bbc
  question: What is normalization versus denormalization in databases?
  answer: Normalization organises tables so each fact is stored once, removing redundancy and update anomalies
    by following normal forms (1NF, 2NF, 3NF, BCNF). Denormalization deliberately duplicates or pre-joins
    data to make reads faster, at the cost of more storage and more complex writes.
  topic: backend dev
  tags:
  - normalization
  - denormalization
  - databases
  - data-modeling
  explanation: '## In plain words

    Normalising is like keeping one master contact list and referring to people by id everywhere else:
    change an address once and it is correct everywhere. Denormalising is copying the address into each
    letter so you do not have to look it up, which is faster to read but harder to keep in sync.


    ## How it works

    **Normal forms (simplified)**

    - **1NF:** each column holds a single value; no repeating groups.

    - **2NF:** every non-key column depends on the whole primary key, not part of it.

    - **3NF:** non-key columns depend only on the key, not on other non-key columns.

    - **BCNF:** a stricter 3NF where every determinant is a candidate key.


    **Denormalization techniques**

    - Copying columns (customer name on orders), summary tables, cached counters, materialized views,
    or embedding in document databases.


    **Trade-offs**

    - Normalised: smaller, consistent, easy writes; more joins for reads.

    - Denormalised: fast reads; risk of inconsistent copies; heavier writes.


    ## Example

    Unnormalised: `orders(order_id, customer_name, customer_city, product, price)` repeats customer data
    on every order. Normalised to 3NF:

    ```sql

    customers(id, name, city)

    products(id, name, price)

    orders(id, customer_id, created_at)

    order_items(order_id, product_id, quantity, unit_price)

    ```

    For a dashboard, a nightly `daily_sales(day, total)` table is a deliberate denormalization.


    ## Common mistakes

    - Denormalising early "for performance" before measuring.

    - Over-normalising tiny lookup data, adding joins with no benefit.

    - Forgetting that some copies are correct history, not redundancy (price at time of sale).

    - No process to keep denormalised copies in sync.


    ## In the interview

    Explain anomalies (update, insert, delete) as the reason for normalisation. Then describe when you
    denormalise: read-heavy paths, analytics, NoSQL modelling. Interviewers like "normalise first, denormalise
    where measurements demand it".

    '
