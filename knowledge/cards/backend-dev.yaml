- id: kb-3ce2690f132b
  question: What is a time series database?
  answer: 'A time series database is optimised for data points indexed by time, such as metrics, sensor
    readings, and prices. It handles very high write rates of mostly appended data, compresses it well,
    supports time-window queries and aggregation, and applies retention and downsampling. Examples: InfluxDB,
    TimescaleDB, Prometheus.'
  topic: backend dev
  tags:
  - time-series
  - databases
  - monitoring
  - iot
  explanation: "## In plain words\nSome data is a stream of measurements over time: CPU usage every 10\
    \ seconds, temperature every minute. You rarely update old points; you append new ones and ask questions\
    \ like \"average per hour over the last week\". A time series database is built for exactly that pattern.\n\
    \n## How it works\n- **Data model:** a series is identified by a metric name plus tags or labels (`cpu{host=\"\
    web-1\"}`), and holds `(timestamp, value)` points.\n- **Writes:** append-heavy; data is buffered in\
    \ memory and written in time-ordered blocks.\n- **Compression:** delta-of-delta for timestamps and\
    \ XOR-style encoding for floats shrink data dramatically.\n- **Queries:** time ranges, aggregations,\
    \ rates, percentiles, and grouping into windows.\n- **Retention and downsampling:** keep raw data\
    \ for days, roll up to hourly averages for months, delete afterwards.\n- **Watch out for cardinality:**\
    \ each unique tag combination is a new series; tags like `user_id` can explode the count.\n\n## Example\n\
    ```sql\n-- TimescaleDB (PostgreSQL extension)\nSELECT time_bucket('1 hour', ts) AS hour,\n       device_id,\n\
    \       avg(temperature) AS avg_temp\nFROM readings\nWHERE ts > now() - interval '1 day'\nGROUP BY\
    \ hour, device_id\nORDER BY hour;\n```\n\n## Common mistakes\n- High-cardinality labels that create\
    \ millions of series.\n- Using it for data that is frequently updated or joined like business records.\n\
    - Keeping raw data forever without downsampling.\n- Storing events that need exact per-item lookups\
    \ where a log store fits better.\n\n## In the interview\nDescribe the workload (append-mostly, time-range\
    \ queries) and the features that serve it. Mention cardinality as the classic pitfall and retention\
    \ as a cost lever. Compare with using a general database plus partitioning by time.\n"
