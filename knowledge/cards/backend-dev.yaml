- id: kb-0200c0ad51c7
  question: What is a spatial database?
  answer: A spatial database stores and queries geometric and geographic data such as points, lines, and
    polygons. It provides spatial types, functions like distance, contains, and intersects, and spatial
    indexes such as R-trees so queries like "restaurants within 2 km" run fast. PostGIS is the best-known
    example.
  topic: backend dev
  tags:
  - spatial-database
  - gis
  - indexing
  - databases
  explanation: "## In plain words\nNormal indexes sort values along one line, which does not help with\
    \ questions about places on a map. A spatial database understands shapes and coordinates and has indexes\
    \ built for two-dimensional space, so it can quickly answer \"what is near here\" or \"which area\
    \ contains this point\".\n\n## How it works\n- **Types:** `POINT`, `LINESTRING`, `POLYGON`, and collections,\
    \ with a coordinate reference system (for example WGS 84, the GPS system).\n- **Functions:** distance,\
    \ within distance, contains, intersects, area, buffer, nearest neighbour.\n- **Indexes:**\n  - *R-tree*\
    \ (PostGIS uses GiST): groups nearby shapes into bounding boxes, nested like folders.\n  - *Geohash,\
    \ quadtree, S2, H3:* split the world into cells with ids, letting ordinary indexes find nearby items.\n\
    - **Query pattern:** use the index to filter by bounding box, then compute exact geometry on the few\
    \ candidates.\n- **Products:** PostGIS for PostgreSQL, MySQL spatial, Oracle Spatial, MongoDB geospatial\
    \ indexes, Redis GEO.\n\n## Example\n```sql\n-- PostGIS: cafes within 2 km of a point, nearest first\n\
    SELECT name\nFROM cafes\nWHERE ST_DWithin(\n  location::geography,\n  ST_MakePoint(2.3522, 48.8566)::geography,\
    \  -- longitude, latitude\n  2000)\nORDER BY location::geography <-> ST_MakePoint(2.3522, 48.8566)::geography\n\
    LIMIT 10;\n```\nA GiST index on `location` keeps this fast with millions of rows.\n\n## Common mistakes\n\
    - Swapping latitude and longitude (most libraries expect longitude first).\n- Computing distances\
    \ in degrees instead of metres.\n- Scanning every row with a distance function instead of using a\
    \ spatial index.\n- Ignoring the earth's curvature for long distances.\n\n## In the interview\nExplain\
    \ spatial types, functions, and indexes. Expect a design follow-up such as \"find nearby drivers\"\
    : discuss geohash or S2 cells, update frequency, and in-memory stores for fast-moving points. Mention\
    \ trade-offs between precision and speed.\n"
