- id: kb-91739c1ccefb
  question: What are the pros and cons of relational (SQL) databases?
  answer: 'Pros: a well-defined schema, ACID transactions, powerful joins and ad-hoc queries in standard
    SQL, strong integrity constraints, and mature tooling. Cons: schema changes need migrations, horizontal
    scaling of writes is harder, and object-to-table mapping adds friction for deeply nested or rapidly
    changing data.'
  topic: backend dev
  tags:
  - sql
  - relational
  - databases
  - trade-offs
  explanation: '## In plain words

    A relational database stores data in tables of rows and columns and links tables through keys. It
    is the general-purpose default: you can ask almost any question of the data with SQL, and the database
    protects correctness with transactions and constraints.


    ## How it works

    **Pros**

    - **ACID transactions** across many rows and tables.

    - **Integrity:** primary keys, foreign keys, unique and check constraints stop bad data.

    - **Flexible querying:** joins, aggregates, window functions; new questions do not need new tables.

    - **Normalisation:** each fact stored once, so updates are simple.

    - **Maturity:** decades of tooling, query optimisers, backups, and people who know SQL.


    **Cons**

    - **Rigid schema:** changes require migrations, which can be slow on huge tables.

    - **Scaling writes:** one primary handles writes; sharding is possible but manual or product-specific.

    - **Impedance mismatch:** nested objects in code become several tables and joins.

    - **Performance at extreme scale** may need denormalisation, caching, or read replicas.


    ## Example

    ```sql

    SELECT c.name, SUM(o.total) AS spent

    FROM customers c

    JOIN orders o ON o.customer_id = c.id

    WHERE o.created_at >= ''2026-01-01''

    GROUP BY c.name

    ORDER BY spent DESC

    LIMIT 10;

    ```

    A new business question answered in one query, with no schema change.


    ## Common mistakes

    - Claiming relational databases "cannot scale"; read replicas, partitioning, and distributed SQL systems
    scale far.

    - Over-normalising so every page needs ten joins.

    - Ignoring indexes and then blaming SQL for slowness.

    - Forgetting modern features such as JSON columns in PostgreSQL.


    ## In the interview

    Present the trade-offs and tie them to workloads: transactional business data favours SQL. Mention
    vertical versus horizontal scaling, replicas, and distributed SQL (CockroachDB, Spanner). Good candidates
    say SQL is a strong default unless a specific need points elsewhere.

