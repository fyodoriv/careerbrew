- id: kb-ab2f71a33ebc
  question: What is an API gateway?
  answer: An API gateway is a single entry point in front of backend services that routes each request
    to the right service and handles cross-cutting concerns such as authentication, rate limiting, TLS
    termination, request transformation, caching, and logging.
  topic: backend dev
  tags:
  - api-gateway
  - microservices
  - architecture
  - networking
  explanation: "## In plain words\nWith many microservices, clients should not need to know every service's\
    \ address and rules. An API gateway is like a hotel front desk: guests talk to one place, and the\
    \ desk checks who they are and sends each request to the right department.\n\n## How it works\n- Clients\
    \ call one public host, for example `api.example.com`.\n- The gateway matches the path, method, or\
    \ header to a route and forwards to a backend service.\n- Along the way it can:\n  - verify tokens\
    \ or API keys (authentication) and check permissions;\n  - enforce rate limits and quotas;\n  - terminate\
    \ TLS;\n  - rewrite requests and responses, or translate protocols (REST to gRPC);\n  - aggregate\
    \ several backend calls into one response (backend-for-frontend pattern);\n  - cache responses;\n\
    \  - emit logs, metrics, and traces.\n- Examples: Kong, AWS API Gateway, Apigee, Envoy-based gateways,\
    \ NGINX.\n\n## Example\nA mobile app calls `GET /v1/orders/42`. The gateway checks the JWT, applies\
    \ a limit of 100 requests per minute per user, forwards to the `orders` service on the internal network,\
    \ adds a correlation id header, and records latency. A request to `/v1/users/me` goes to the `users`\
    \ service instead.\n\n## Common mistakes\n- Putting business logic in the gateway, turning it into\
    \ a new monolith.\n- Making it a single point of failure without redundancy.\n- Confusing it with\
    \ a load balancer (which spreads traffic across copies of one service) or a service mesh (which handles\
    \ service-to-service traffic inside the cluster).\n- Adding latency with heavy transformations.\n\n\
    ## In the interview\nExplain routing plus cross-cutting concerns, then the trade-offs: simpler clients\
    \ and central policy versus an extra hop and a critical component. Mention running it highly available\
    \ and the backend-for-frontend variant for different client types.\n"
