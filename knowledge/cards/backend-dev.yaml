- id: kb-af1004859181
  question: What is RPC (Remote Procedure Call)?
  answer: RPC lets a program call a function on another machine as if it were a local function call. A
    client stub serialises the arguments, sends them over the network, the server runs the procedure,
    and the result comes back. gRPC, Thrift, and JSON-RPC are common frameworks.
  topic: backend dev
  tags:
  - rpc
  - networking
  - distributed-systems
  - api
  explanation: '## In plain words

    Instead of building URLs and parsing responses by hand, you write `user = users.get(42)` and the RPC
    framework turns that into a network message and back. The call looks local, but it travels to another
    service.


    ## How it works

    - **Interface definition:** the procedures and message types are declared, often in an interface definition
    language (IDL) such as a `.proto` file.

    - **Stubs:** generated client and server code. The client stub marshals (serialises) arguments; the
    server stub unmarshals them and calls the real function.

    - **Transport:** HTTP/2 for gRPC, raw TCP for some frameworks, HTTP with JSON for JSON-RPC.

    - **Return:** the result or error is serialised back to the caller.

    - **Important differences from a local call:** the network can fail, be slow, or deliver twice. So
    RPCs need timeouts (deadlines), retries for idempotent calls, and clear error codes.

    - **RPC vs REST:** RPC models actions (`CreateOrder`), REST models resources (`POST /orders`).


    ## Example

    A JSON-RPC 2.0 call over HTTP. The client library turns `inventory.get_stock("A1")` into this request
    body:

    ```json

    {"jsonrpc": "2.0", "method": "get_stock", "params": ["A1"], "id": 7}

    ```

    The server runs the function and replies:

    ```json

    {"jsonrpc": "2.0", "result": 12, "id": 7}

    ```

    To the caller it looks like a normal function returning `12`.


    ## Common mistakes

    - Treating remote calls as free and calling them in tight loops (chatty APIs).

    - No timeouts, so one slow service freezes its callers.

    - Retrying non-idempotent operations and creating duplicates.

    - Breaking clients by changing interfaces without versioning.


    ## In the interview

    Define RPC, then the "fallacies of distributed computing" angle: the network is not reliable. Compare
    with REST and messaging (asynchronous). Mention gRPC as the modern default for internal service-to-service
    calls.

    '
