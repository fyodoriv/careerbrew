- id: kb-9b0694fff34f
  question: What is the BASE model for databases?
  answer: BASE stands for Basically Available, Soft state, and Eventual consistency. It describes many
    distributed NoSQL systems that stay available and fast by allowing replicas to be temporarily inconsistent,
    in contrast with ACID's strict guarantees.
  topic: backend dev
  tags:
  - base
  - eventual-consistency
  - nosql
  - distributed-systems
  explanation: '## In plain words

    ACID promises that data is always correct and up to date, which is hard and slow across many servers.
    BASE relaxes that: the system always answers, the data may be changing in the background, and replicas
    agree eventually. It is a deliberate trade for scale and availability.


    ## How it works

    - **Basically Available:** the system responds to requests even when parts are failing, possibly with
    stale or partial data.

    - **Soft state:** the state of replicas can change over time without new input, as replication catches
    up.

    - **Eventual consistency:** if writes stop, all replicas converge to the same value.

    - **Techniques:** asynchronous replication, quorum tuning, conflict resolution (last-writer-wins,
    version vectors, CRDTs), read repair and anti-entropy.

    - BASE is a design philosophy, not a strict standard, and many systems let you choose per operation
    between BASE-like and stronger behaviour.


    ## Example

    A social network''s like counter is stored in a leaderless database across three regions. A like in
    Tokyo is accepted locally and replicated to Europe within a second. For that second, a viewer in Paris
    sees one fewer like. Nobody is harmed, and the site stays up even if a region is cut off.


    ## Common mistakes

    - Thinking BASE means "no guarantees"; it guarantees convergence.

    - Using BASE storage for operations that must not double-spend or oversell.

    - Forgetting conflict resolution for concurrent updates.

    - Presenting ACID and BASE as the only two options; many systems sit in between.


    ## In the interview

    Define each letter and contrast with ACID in one table-like sentence each. Tie to CAP: BASE systems
    usually choose availability under partitions. Give an example of when you would accept BASE and when
    you would not.

    '
