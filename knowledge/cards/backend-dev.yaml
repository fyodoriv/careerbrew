- id: kb-85330cd712bc
  question: What is a left join in SQL?
  answer: A left (outer) join returns every row from the left table and the matching rows from the right
    table; where there is no match, the right-side columns are NULL. It is used when you want all records
    from one table whether or not related data exists.
  topic: backend dev
  tags:
  - sql
  - joins
  - databases
  explanation: '## In plain words

    A left join says: "give me everything from my main list, and attach extra details where they exist".
    Customers with no orders still appear, just with empty order columns.


    ## How it works

    - Syntax: `FROM A LEFT JOIN B ON condition`.

    - Every row of A appears at least once.

    - If several B rows match, the A row appears once per match.

    - If none match, the B columns are NULL.

    - **Anti-join pattern:** `WHERE B.id IS NULL` finds A rows that have no match ("customers who never
    ordered").

    - Conditions on B belong in the `ON` clause if you want to keep unmatched A rows; putting them in
    `WHERE` removes the NULL rows.


    ## Example

    ```sql

    -- customers: (1,''Ana''), (2,''Bo'')

    -- orders: (100, 1, 30.00)


    SELECT c.name, o.id AS order_id

    FROM customers c

    LEFT JOIN orders o ON o.customer_id = c.id;

    -- Ana | 100

    -- Bo  | NULL


    SELECT c.name

    FROM customers c

    LEFT JOIN orders o ON o.customer_id = c.id

    WHERE o.id IS NULL;

    -- Bo

    ```


    ## Common mistakes

    - Filtering the right table in `WHERE` (`WHERE o.status = ''paid''`), which drops customers without
    orders.

    - Using `COUNT(*)` instead of `COUNT(o.id)`, so customers with no orders show a count of 1.

    - Confusing which table is "left": it is the one written first.

    - Expecting one row per left row when the right side has many matches.


    ## In the interview

    Explain with a small example and show the anti-join. Interviewers often test the `ON` versus `WHERE`
    subtlety and the `COUNT` trap. Mention that `NOT EXISTS` is an alternative for anti-joins and is often
    clearer.

    '
