- id: kb-1f1f5113bb5f
  question: What is hot and cold data storage?
  answer: Data storage is tiered by how often data is accessed. Hot data is used often and lives on fast,
    expensive storage such as memory or SSDs; cold data is rarely used and moves to cheap, slower storage
    such as archive object tiers or tape. Warm sits in between, and lifecycle policies move data between
    tiers.
  topic: backend dev
  tags:
  - storage
  - tiering
  - cost-optimization
  - data-lifecycle
  explanation: '## In plain words

    You keep today''s documents on your desk, last year''s in a cabinet, and old tax records in the basement.
    Storage systems do the same: frequently used data stays fast and close, older data moves to cheaper
    places where fetching it takes longer.


    ## How it works

    - **Hot:** active data needing low latency. In-memory caches, SSD-backed databases, standard object
    storage.

    - **Warm:** accessed occasionally. Cheaper disks, infrequent-access storage classes.

    - **Cold / archive:** kept for compliance or rare analysis. Archive object classes or tape; retrieval
    can take minutes to hours and may cost per read.

    - **Moving data:** lifecycle rules by age (e.g., move to cold after 90 days), access-based automatic
    tiering, or partitioning tables by time.

    - **Trade-offs:** cost per GB stored versus cost and time to read, plus minimum storage durations
    in archive tiers.


    ## Example

    A video platform keeps the last 30 days of uploads and anything popular on SSD-backed storage and
    CDNs (hot). Videos older than 30 days with few views move to an infrequent-access tier (warm). Raw
    upload originals older than a year go to an archive tier (cold), costing a fraction as much per GB,
    with retrieval in hours if ever needed.


    ## Common mistakes

    - Putting everything on the fastest tier and overpaying.

    - Archiving data that is still read often, then paying large retrieval fees.

    - Forgetting retrieval latency in user-facing features.

    - No lifecycle automation, so tiers depend on manual cleanup.


    ## In the interview

    Define the tiers with examples and talk about lifecycle policies. Show cost awareness with a simple
    calculation if asked. Mention access patterns, compliance retention, and how time-partitioned databases
    make tiering easy.

    '
