- id: kb-c69c71b889fe
  question: What is Google Colossus?
  answer: Colossus is Google's internal distributed file system and the successor to the Google File System
    (GFS). It stores data for services like Bigtable, Spanner, YouTube, and Cloud Storage, using a scalable
    metadata layer and Reed-Solomon encoding across many disk servers for durability and efficiency.
  topic: backend dev
  tags:
  - distributed-file-system
  - google
  - storage
  - gfs
  explanation: '## In plain words

    Google needs one storage layer that spreads exabytes of files over many thousands of machines while
    hiding disk failures. Colossus is that layer. Applications see files; Colossus decides which machines
    hold the bytes and keeps enough redundant pieces to survive failures.


    ## How it works

    Public details are limited, but the main ideas are:

    - **Evolution from GFS:** GFS had a single master holding all metadata in memory, which limited the
    number of files. Colossus spreads metadata across a scalable store (reported to be built on Bigtable).

    - **Client library:** applications use a library that talks to metadata services and directly to storage
    servers (called D servers) for data.

    - **Erasure coding:** instead of keeping three full copies, data is split into pieces plus parity
    (Reed-Solomon), so lost pieces can be rebuilt with less storage overhead than triple replication.

    - **Mixed hardware:** hot data is placed on flash, colder data on disks, to balance cost and speed.

    - **Shared infrastructure:** many services and users share the same clusters.


    ## Example

    Erasure coding in short: with a (6, 3) scheme, a file is cut into 6 data chunks and 3 parity chunks
    on 9 different servers. Any 6 of the 9 chunks rebuild the file, so 3 servers can fail. Storage cost
    is 9/6 = 1.5x, compared with 3x for three full copies.


    ## Common mistakes

    - Claiming detailed internals that Google has not published.

    - Confusing Colossus with Google Cloud Storage; Cloud Storage is a product built on top of it.

    - Thinking erasure coding is free; rebuilding lost chunks costs network and CPU.


    ## In the interview

    Use it to show you understand distributed file system design: metadata scaling, separating control
    from data paths, and replication versus erasure coding. Relate it to open-source analogues such as
    HDFS. Be honest about what is public.

    '
