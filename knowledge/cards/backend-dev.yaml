- id: kb-783451221647
  question: What is a graph database?
  answer: A graph database stores data as nodes (entities) and edges (relationships), both with properties,
    and is optimised for traversing relationships. Following connections is cheap because edges are stored
    directly, so multi-hop queries like friends-of-friends or fraud rings are much faster than many SQL
    joins. Neo4j and Amazon Neptune are examples.
  topic: backend dev
  tags:
  - graph-database
  - nosql
  - data-modeling
  - neo4j
  explanation: '## In plain words

    Some data is mostly about connections: who follows whom, which accounts share a device, which product
    is bought with which. A graph database treats those connections as first-class data, so walking from
    one item to its neighbours is as natural as reading a row.


    ## How it works

    - **Property graph model:** nodes with labels (`:Person`), edges with types (`:FOLLOWS`), and key-value
    properties on both.

    - **Index-free adjacency:** each node points directly to its edges, so a traversal costs roughly the
    number of edges visited, not the table size.

    - **Query languages:** Cypher (Neo4j, and the basis of the GQL standard), Gremlin, SPARQL for RDF
    graphs.

    - **Good at:** variable-length paths, shortest paths, recommendations, fraud detection, access-control
    graphs, knowledge graphs.

    - **Weaker at:** large aggregate scans and simple tabular reporting; sharding a highly connected graph
    is hard.


    ## Example

    ```cypher

    // People that Ana''s friends follow, but Ana does not, ranked by count

    MATCH (a:Person {name: "Ana"})-[:FOLLOWS]->(:Person)-[:FOLLOWS]->(s:Person)

    WHERE NOT (a)-[:FOLLOWS]->(s) AND s <> a

    RETURN s.name, count(*) AS score

    ORDER BY score DESC LIMIT 5;

    ```

    In SQL this needs self-joins that grow with every extra hop.


    ## Common mistakes

    - Choosing a graph database when relationships are simple and shallow.

    - Forgetting indexes on the starting node property, so the query scans all nodes.

    - Unbounded variable-length paths (`*`) that explode on dense graphs.

    - Assuming it scales horizontally as easily as key-value stores.


    ## In the interview

    Explain nodes, edges, and why traversals are fast. Give a recommendation or fraud example and compare
    with recursive SQL. Trade-offs: expressive relationship queries versus a smaller ecosystem and harder
    scaling.

    '
