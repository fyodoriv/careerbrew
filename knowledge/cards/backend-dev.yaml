- id: kb-4243a05d2fb8
  question: What is pessimistic locking in databases?
  answer: Pessimistic locking assumes conflicts are likely and locks data before changing it, so other
    transactions must wait until the lock is released. In SQL this is typically `SELECT ... FOR UPDATE`
    inside a transaction. It prevents lost updates but reduces concurrency and can cause deadlocks.
  topic: backend dev
  tags:
  - pessimistic-locking
  - concurrency
  - databases
  - transactions
  explanation: '## In plain words

    Pessimistic locking is like taking a library book home: while you have it, nobody else can borrow
    it. It guarantees nobody changes the record under you, but others must wait.


    ## How it works

    1. Begin a transaction.

    2. Read the rows with a lock: `SELECT ... FOR UPDATE` (exclusive) or `FOR SHARE` (others may read-lock
    but not write).

    3. Other transactions trying to lock or update those rows block until you commit or roll back.

    4. Update and commit; locks are released.

    - **Options:** `NOWAIT` fails immediately if locked; `SKIP LOCKED` skips locked rows, perfect for
    job queues.

    - **Deadlocks:** two transactions each waiting for the other''s lock. Databases detect them and abort
    one; avoid them by locking in a consistent order and keeping transactions short.

    - Fits hot rows with frequent conflicts and short transactions.


    ## Example

    ```sql

    BEGIN;

    SELECT stock FROM products WHERE id = 1 FOR UPDATE;  -- row locked

    -- application checks stock > 0

    UPDATE products SET stock = stock - 1 WHERE id = 1;

    COMMIT;                                              -- lock released

    ```

    A second checkout for product 1 waits at its `SELECT ... FOR UPDATE` until the first commits, then
    sees the new stock.


    Worker queue pattern:

    ```sql

    SELECT id FROM jobs WHERE status = ''new''

    ORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED;

    ```


    ## Common mistakes

    - Holding locks during slow work such as HTTP calls or user input.

    - Locking rows in different orders in different code paths, causing deadlocks.

    - Forgetting autocommit, so the lock is released right after the `SELECT`.

    - Using it where a single atomic `UPDATE ... WHERE stock > 0` would do.


    ## In the interview

    Contrast with optimistic locking and explain when each fits: high contention and short transactions
    versus low contention and long think time. Mention deadlocks, `SKIP LOCKED` for queues, and distributed
    locks when data spans systems.

    '
