- id: kb-47fb6d529677
  question: What are the main types of NoSQL databases?
  answer: The four main types are key-value stores (Redis, DynamoDB), document stores (MongoDB), wide-column
    stores (Cassandra, HBase), and graph databases (Neo4j). Time-series and search engines are often listed
    too. Each is optimised for a different access pattern.
  topic: backend dev
  tags:
  - nosql
  - databases
  - data-modeling
  explanation: '## In plain words

    NoSQL is not one thing. It is a family of databases, each shaped around one way of storing and fetching
    data. Picking the right type is about matching the shape of your data and your queries.


    ## How it works

    - **Key-value:** a giant dictionary. Get and put by key, extremely fast. Use for caches, sessions,
    carts. Examples: Redis, DynamoDB, Memcached.

    - **Document:** values are JSON-like documents with nested fields, queryable by any field with indexes.
    Use for content, catalogues, user profiles. Examples: MongoDB, Couchbase.

    - **Wide-column:** rows grouped into partitions, each row with many columns, sorted within a partition.
    Use for huge write-heavy data such as events and messages. Examples: Cassandra, HBase, Bigtable.

    - **Graph:** nodes and edges with properties; queries follow relationships. Use for social networks,
    recommendations, fraud rings. Examples: Neo4j, Amazon Neptune.

    - **Also:** time-series (InfluxDB, TimescaleDB) and search engines (Elasticsearch).


    ## Example

    One app, several stores:

    - User sessions in Redis (key-value).

    - Product pages in MongoDB (document).

    - Click events in Cassandra partitioned by user and day (wide-column).

    - "Friends of friends who bought this" in Neo4j (graph).


    ## Common mistakes

    - Treating "NoSQL" as a single choice.

    - Using a key-value store and then needing complex queries on values.

    - Confusing wide-column stores with columnar analytics databases (like Parquet or ClickHouse).

    - Forgetting the operational cost of running several databases.


    ## In the interview

    List the four types with one use case each. Expect a follow-up asking which you would pick for a given
    feature; justify with access patterns and consistency needs. Mentioning that one system may combine
    several (polyglot persistence) shows maturity.

    '
  match:
