- id: kb-0ab2f99cf535
  question: What is a full outer join in SQL?
  answer: 'A full outer join returns every row from both tables: matching rows are combined, and rows
    without a match on the other side appear with NULLs for the missing columns. It is the union of a
    left join and a right join.'
  topic: backend dev
  tags:
  - sql
  - joins
  - databases
  explanation: '## In plain words

    Imagine two guest lists, one from invitations and one from the door. A full outer join shows everyone
    who appears on either list: people on both lists in one row, and people on only one list with blanks
    for the other side.


    ## How it works

    - Syntax: `A FULL OUTER JOIN B ON condition` (the word `OUTER` is optional).

    - For each pair that matches the condition, output the combined row.

    - For each row of A with no match, output it with NULLs for B''s columns.

    - For each row of B with no match, output it with NULLs for A''s columns.

    - Filtering `WHERE A.id IS NULL OR B.id IS NULL` keeps only the unmatched rows, which is handy for
    finding differences.

    - MySQL does not support `FULL JOIN`; emulate it with `LEFT JOIN ... UNION ... RIGHT JOIN`.


    ## Example

    ```sql

    -- employees(id, name, dept_id)   departments(id, title)

    -- employees: (1,''Ana'',10), (2,''Bo'',NULL)

    -- departments: (10,''Sales''), (20,''Legal'')


    SELECT e.name, d.title

    FROM employees e

    FULL OUTER JOIN departments d ON e.dept_id = d.id;


    -- name | title

    -- Ana  | Sales

    -- Bo   | NULL     (employee without a department)

    -- NULL | Legal    (department without employees)

    ```


    ## Common mistakes

    - Expecting it to work in MySQL.

    - Putting a filter on one table in `WHERE` (for example `WHERE d.title = ''Sales''`), which drops
    every row where that table''s columns are NULL, so the full join silently behaves like a left or right
    join. Filter each table in a subquery before joining if you want to keep the unmatched rows.

    - Confusing it with a cross join (every combination).

    - Forgetting duplicates multiply when keys are not unique.


    ## In the interview

    Draw the two-circle picture, then show a tiny example with NULLs. Mention practical uses: reconciling
    two data sources or comparing snapshots. Follow-ups often ask you to contrast it with inner, left,
    and right joins.

    '
