- id: kb-01eb861ffb09
  question: What is a gossip protocol?
  answer: 'A gossip protocol spreads information through a cluster the way rumours spread: each node periodically
    picks a few random peers and exchanges what it knows. Updates reach all nodes in about O(log n) rounds,
    with no central coordinator, which makes it robust for membership, failure detection, and replica
    repair.'
  topic: backend dev
  tags:
  - gossip-protocol
  - distributed-systems
  - membership
  - failure-detection
  explanation: '## In plain words

    In a big cluster, telling every node about every change directly is expensive and fragile. Instead,
    each node chats with a couple of random neighbours every second. News spreads quickly, like gossip
    at a party, and no one node has to talk to everybody.


    ## How it works

    - Every round (say each second), a node selects k random peers.

    - It sends a digest of its state: member list, heartbeat counters, versions.

    - Peers merge the information, keeping the newest version of each item, and may reply with what they
    know (push-pull).

    - Because infected nodes multiply each round, a message reaches all n nodes in about O(log n) rounds.

    - **Failure detection:** if a node''s heartbeat counter stops increasing for a while, others mark
    it suspect, then dead (SWIM-style protocols add indirect probing to reduce false alarms).

    - **Uses:** cluster membership (Cassandra, Consul via Serf), spreading metadata, and anti-entropy
    repair of replicas.


    ## Example

    A 1,000-node cluster, each node gossiping with 3 peers per second. Round 1: 1 node knows a change,
    then about 4, then about 16, 64, 256, and by around round 6 or 7 nearly all nodes know. If a node
    crashes, its heartbeat stops increasing, and within a few seconds every node has learned it is suspect.


    ## Common mistakes

    - Expecting immediate, guaranteed delivery; gossip is probabilistic and eventually consistent.

    - Gossiping large payloads instead of small digests.

    - Using it where strict agreement is required; that needs consensus.

    - Ignoring network partitions that split the gossip graph.


    ## In the interview

    Explain the spreading pattern, the logarithmic convergence, and a real use. Contrast with consensus
    (Raft) and with central registries. Trade-offs: scalable and fault-tolerant versus probabilistic timing
    and some redundant messages.

    '
