- id: kb-d5218a1b51b7
  question: What is optimistic locking in databases?
  answer: Optimistic locking lets transactions proceed without locks and checks for conflicts only at
    write time, usually with a version number or timestamp column. The update succeeds only if the version
    is unchanged since it was read; otherwise the application retries or reports a conflict.
  topic: backend dev
  tags:
  - optimistic-locking
  - concurrency
  - databases
  - transactions
  explanation: '## In plain words

    Optimistic locking assumes conflicts are rare. Everyone reads freely, and when you save, the database
    checks whether someone else changed the record in the meantime. If they did, your save is rejected,
    like a wiki telling you "this page was edited while you were editing".


    ## How it works

    1. Read the row together with its `version` (for example 7).

    2. Do your work in the application, maybe while the user edits a form.

    3. Update with a condition: `WHERE id = ? AND version = 7`, and set `version = 8`.

    4. If one row was updated, you won. If zero rows were updated, someone else changed it first: reload
    and retry, merge, or show an error.

    - HTTP uses the same idea with `ETag` and `If-Match` headers.

    - ORMs support it (JPA `@Version`, Rails `lock_version`, Django packages).

    - Fits low-contention data and long user think-time, since no locks are held while waiting.


    ## Example

    ```sql

    -- both users read: id=1, stock=10, version=7

    UPDATE products

    SET stock = 9, version = 8

    WHERE id = 1 AND version = 7;   -- user A: 1 row updated


    UPDATE products

    SET stock = 9, version = 8

    WHERE id = 1 AND version = 7;   -- user B: 0 rows updated -> conflict, reload

    ```


    ## Common mistakes

    - Forgetting to check the affected-row count, so conflicts pass silently.

    - Using it on very hot rows, where constant retries waste work.

    - Not incrementing the version on every write path, including scripts.

    - Retrying without limit or backoff.


    ## In the interview

    Compare with pessimistic locking: no blocking and good for read-heavy, low-conflict cases versus retries
    under contention. Mention ETags for REST APIs and where you would choose each.

    '
