- id: kb-9e058688183d
  question: What is fault tolerance?
  answer: Fault tolerance is a system's ability to keep working correctly, possibly at reduced capacity,
    when some of its components fail. It relies on redundancy, failure detection, isolation of failures,
    and automatic recovery such as failover and retries.
  topic: backend dev
  tags:
  - fault-tolerance
  - reliability
  - distributed-systems
  - high-availability
  explanation: '## In plain words

    In a large system something is always broken: a disk, a server, a network link. A fault-tolerant system
    expects this and is built so a single failure does not become an outage. Think of a plane with several
    engines that can still land if one stops.


    ## How it works

    - **Redundancy:** run multiple instances, replicas, and zones so there is no single point of failure.

    - **Detection:** health checks, heartbeats, and timeouts notice when a component is down.

    - **Failover:** traffic moves to healthy instances; a replica is promoted to primary.

    - **Isolation:** bulkheads and circuit breakers stop one failing dependency from exhausting threads
    or connections everywhere.

    - **Graceful degradation:** serve cached or partial results instead of an error.

    - **Safe retries:** retries with exponential backoff and jitter, on idempotent operations.

    - **Data protection:** replication and backups.

    - **Testing:** chaos engineering deliberately kills components to prove the design works.


    ## Example

    A web service runs six instances across three availability zones behind a load balancer. When one
    zone loses power, health checks fail for two instances, the balancer stops sending them traffic, and
    autoscaling starts replacements in the other zones. Users see slightly higher latency for a few minutes,
    not an outage. The recommendation widget''s backend times out, so the page shows a default list instead.


    ## Common mistakes

    - Confusing fault tolerance with high availability (closely related) or with disaster recovery (bigger,
    rarer events).

    - Redundant components that share one hidden dependency, such as the same power supply or DNS provider.

    - Retrying without backoff, causing retry storms.

    - Never testing failure paths.


    ## In the interview

    List the techniques and ground them in one example. Mention failure domains, the cost of redundancy,
    and how you would measure success (availability SLOs, error budgets). Byzantine faults (malicious
    or corrupted nodes) are a stretch topic.

    '
