- id: kb-0ba58834e011
  question: What are Protocol Buffers (Protobuf)?
  answer: Protocol Buffers are Google's language-neutral format for serialising structured data. You define
    messages in a `.proto` schema with numbered fields, generate code for many languages, and get compact
    binary encoding that is faster and smaller than JSON, with rules for evolving the schema compatibly.
    gRPC uses it by default.
  topic: backend dev
  tags:
  - protobuf
  - serialization
  - grpc
  - data-formats
  explanation: "## In plain words\nJSON repeats field names as text in every message and has loose types.\
    \ Protobuf agrees on a schema up front, then sends only field numbers and compact binary values. Both\
    \ sides use generated code, so a message written in Go can be read in Java or Python safely.\n\n##\
    \ How it works\n- **Schema:** `.proto` files define `message` types with typed fields, each with a\
    \ unique number.\n- **Code generation:** `protoc` creates classes with getters, setters, serialise,\
    \ and parse methods.\n- **Encoding:** each field is written as a tag (field number plus wire type)\
    \ and a value. Integers use variable-length encoding, so small numbers take one byte. Missing fields\
    \ cost nothing.\n- **Evolution rules:**\n  - Add new fields with new numbers; old readers ignore unknown\
    \ fields.\n  - Never reuse or change the number or type of an existing field; mark removed ones `reserved`.\n\
    - **proto3** defaults: all fields optional with zero defaults; `optional` keyword restores presence\
    \ tracking.\n\n## Example\n```protobuf\nsyntax = \"proto3\";\n\nmessage User {\n  int64 id = 1;\n\
    \  string name = 2;\n  repeated string emails = 3;\n  reserved 4;           // old field, never reuse\n\
    }\n```\nA user with id 150 and name \"Ana\" encodes to about 8 bytes, versus 23 bytes for the JSON\
    \ `{\"id\":150,\"name\":\"Ana\"}`.\n\n## Common mistakes\n- Renumbering fields, which breaks every\
    \ existing reader.\n- Assuming it is human-readable or easy to debug without tools.\n- Using it for\
    \ public browser APIs where JSON's simplicity matters more.\n- Forgetting that proto3 cannot tell\
    \ \"not set\" from \"zero\" unless you use `optional` or wrapper types.\n\n## In the interview\nCompare\
    \ with JSON (readability, size, speed) and mention gRPC. The schema evolution rules are the most likely\
    \ follow-up; explain forward and backward compatibility. Alternatives: Avro, Thrift, FlatBuffers.\n"
  match:
