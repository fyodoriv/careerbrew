- id: kb-e78a76312d3f
  question: What is database replication?
  answer: Replication keeps copies of the same data on multiple database servers. Changes made on one
    node are shipped to the others, which improves availability, lets reads scale across replicas, and
    reduces latency for distant users, at the cost of replication lag and conflict handling.
  topic: backend dev
  tags:
  - replication
  - databases
  - high-availability
  - scalability
  explanation: "## In plain words\nIf your only database server dies, your app stops and data may be lost.\
    \ Replication keeps live copies on other machines. One can take over if the main one fails, and copies\
    \ can answer read queries to spread the load.\n\n## How it works\n- **Leader (primary):** accepts\
    \ writes and records them in a log.\n- **Followers (replicas):** receive the log and apply the same\
    \ changes in order.\n- **Synchronous vs asynchronous:** wait for replicas before confirming a write\
    \ (safer, slower) or not (faster, may lose recent writes on failover).\n- **Failover:** when the leader\
    \ fails, a replica is promoted, manually or automatically.\n- **Read scaling:** send read-only queries\
    \ to replicas.\n- **Geographic replicas:** place copies near users or in another region for disaster\
    \ recovery.\n- Other topologies: multi-leader and leaderless (quorum) replication.\n\n## Example\n\
    ```text\n           writes\n app ---> [primary]  --WAL stream-->  [replica A]  (same zone)\n   \\\
    \                  --WAL stream-->  [replica B]  (other region)\n    \\--- reads ----> replica A or\
    \ B\n```\nIf the primary fails, replica A is promoted. With asynchronous replication, the last few\
    \ hundred milliseconds of writes may be missing on A.\n\n## Common mistakes\n- Treating replicas as\
    \ backups; deletions replicate too.\n- Ignoring replication lag, so a user does not see the change\
    \ they just made.\n- Split brain: two nodes both believe they are the leader. Use fencing and consensus-based\
    \ failover.\n- Sending writes to replicas by mistake.\n\n## In the interview\nExplain why (availability,\
    \ read scaling, latency) and how (leader log shipping). Discuss sync versus async and lag. Follow-ups:\
    \ failover, split brain, read-your-writes, and the difference between replication and sharding.\n"
  match:
  - 6c40bca27971
  prompt: 1f344914
- id: kb-72daaee53bd8
  question: What is disaster recovery?
  answer: 'Disaster recovery is the plan and infrastructure for restoring a system after a major failure
    such as a region outage, data corruption, or ransomware. It is defined by two targets: RPO (how much
    data you can afford to lose) and RTO (how long you can be down), and uses backups, replication to
    another site, and practised runbooks.'
  topic: backend dev
  tags:
  - disaster-recovery
  - reliability
  - backups
  - high-availability
  explanation: "## In plain words\nHigh availability handles small failures like one server dying. Disaster\
    \ recovery handles the big ones: a whole data centre lost, a bad deploy deleting data, or an attack.\
    \ It answers \"how do we get the business running again, and how much will we lose?\"\n\n## How it\
    \ works\n- **RPO (Recovery Point Objective):** maximum acceptable data loss, measured in time. RPO\
    \ of 5 minutes means backups or replication must be at most 5 minutes behind.\n- **RTO (Recovery Time\
    \ Objective):** maximum acceptable downtime.\n- **Strategies, cheapest to fastest:**\n  - *Backup\
    \ and restore:* copies in another region; hours to recover.\n  - *Pilot light:* minimal core services\
    \ running elsewhere, scaled up during a disaster.\n  - *Warm standby:* a smaller full copy running\
    \ and receiving data.\n  - *Multi-site active-active:* full capacity in several regions; near-zero\
    \ RTO.\n- **Ingredients:** off-site and immutable backups, infrastructure as code to rebuild, DNS\
    \ or traffic failover, and documented runbooks.\n- **Testing:** regular restore tests and failover\
    \ drills; an untested backup is a hope, not a plan.\n\n## Example\nA payments company sets RPO = 1\
    \ minute and RTO = 15 minutes. It replicates the database asynchronously to a second region, keeps\
    \ a warm standby of all services there, and stores daily immutable backups for 35 days. Every quarter\
    \ it fails over production traffic to the standby region for an hour to prove the plan works.\n\n\
    ## Common mistakes\n- Confusing high availability with disaster recovery.\n- Backups in the same region\
    \ or account as production.\n- Never testing restores.\n- Forgetting that replication copies corruption\
    \ and deletions; point-in-time backups are still needed.\n\n## In the interview\nDefine RPO and RTO\
    \ first, then match a strategy to business needs and budget. Mention testing and immutable backups\
    \ against ransomware. Interviewers look for cost-awareness: active-active is expensive and not always\
    \ justified.\n"
  match:
  - 72daaee53bd8
  prompt: 1f344914
- id: kb-fad0dcf7115f
  question: What is distributed caching?
  answer: A distributed cache spreads cached data across several servers' memory so many application instances
    share one large, fast cache. Keys are assigned to nodes, usually with consistent hashing, and examples
    include Redis Cluster and Memcached. It reduces database load and latency but adds invalidation and
    consistency concerns.
  topic: backend dev
  tags:
  - caching
  - distributed-systems
  - redis
  - scalability
  explanation: "## In plain words\nOne server's memory is too small and is not shared with other servers.\
    \ A distributed cache pools the memory of many machines into one big lookup table that every app server\
    \ can use, so a value computed once is reused everywhere.\n\n## How it works\n- **Partitioning:**\
    \ each key maps to a node. Consistent hashing (or Redis Cluster's 16,384 hash slots) means adding\
    \ a node moves only a fraction of keys.\n- **Replication:** a replica per partition keeps the cache\
    \ warm if a node fails.\n- **Read pattern (cache-aside):** read from cache; on a miss, read the database,\
    \ then write to the cache with a TTL.\n- **Write patterns:** write-through (write cache and database\
    \ together), write-behind (write cache, flush later), or invalidate on write.\n- **Eviction:** LRU\
    \ or LFU when memory fills.\n- **Hot keys:** a single very popular key can overload one node; use\
    \ local caches or key replication.\n\n## Example\n```python\nimport json, redis\nr = redis.Redis(host=\"\
    cache\", port=6379)\n\ndef get_product(pid: int) -> dict:\n    key = f\"product:{pid}\"\n    hit =\
    \ r.get(key)\n    if hit:\n        return json.loads(hit)\n    product = db_load_product(pid)    \
    \      # slow database read\n    r.set(key, json.dumps(product), ex=300)  # cache for 5 minutes\n\
    \    return product\n```\n\n## Common mistakes\n- No TTL or invalidation, so stale data lives forever.\n\
    - Cache stampede: a popular key expires and thousands of requests hit the database at once. Use locks,\
    \ early refresh, or jittered TTLs.\n- Treating the cache as the source of truth.\n- Caching per-user\
    \ data with keys that collide.\n\n## In the interview\nCover partitioning, replication, a caching\
    \ pattern, and invalidation. Mention hit ratio and stampede protection. Compare with local in-process\
    \ caches (faster, not shared) and CDNs (for static content near users).\n"
  match:
  - fad0dcf7115f
  prompt: 1f344914
- id: kb-c10fda2e6194
  question: What is distributed locking?
  answer: A distributed lock lets processes on different machines agree that only one of them works on
    a shared resource at a time. It is usually built on a coordination service such as ZooKeeper or etcd,
    or on Redis with expiring keys, and should use leases with timeouts plus fencing tokens to stay safe
    when a lock holder stalls.
  topic: backend dev
  tags:
  - distributed-systems
  - locking
  - concurrency
  - coordination
  explanation: "## In plain words\nA normal mutex only works inside one program. When several servers\
    \ might process the same job or update the same file, they need a lock that lives outside all of them.\
    \ The tricky part is that a server can pause or crash while holding it.\n\n## How it works\n- **Acquire:**\
    \ create a lock entry that only one client can create, for example Redis `SET key value NX PX 30000`\
    \ or an ephemeral node in ZooKeeper.\n- **Lease:** the lock expires after a timeout so a crashed holder\
    \ does not block others forever. Long tasks renew the lease.\n- **Release:** delete the lock only\
    \ if you still own it (compare the random value you stored).\n- **Fencing tokens:** the lock service\
    \ hands out an increasing number with each grant. The protected resource rejects writes with an older\
    \ number, so a holder that paused past its lease cannot do damage.\n- **Consensus-backed services**\
    \ (etcd, ZooKeeper, Consul) are safer than a single Redis node, which can lose a lock on failover.\n\
    \n## Example\n```python\nimport uuid, redis\nr = redis.Redis()\ntoken = str(uuid.uuid4())\n\nif r.set(\"\
    lock:report\", token, nx=True, px=30_000):\n    try:\n        generate_report()\n    finally:\n  \
    \      # delete only if we still hold it (atomic check-and-delete)\n        r.eval(\n            \"\
    if redis.call('get', KEYS[1]) == ARGV[1] then \"\n            \"return redis.call('del', KEYS[1])\
    \ end return 0\",\n            1, \"lock:report\", token)\n```\n\n## Common mistakes\n- No expiry,\
    \ so a crash leaves the lock held forever.\n- Deleting someone else's lock after your lease expired.\n\
    - Assuming the lock is safe without fencing when processes can pause (garbage collection, network\
    \ delays).\n- Using locks where an idempotent design or a database constraint would be simpler.\n\n\
    ## In the interview\nExplain leases, ownership checks, and fencing tokens. Mention the debate around\
    \ Redis-based Redlock versus consensus systems. Good answers also suggest alternatives: database row\
    \ locks, unique constraints, or partitioning work so no lock is needed.\n"
