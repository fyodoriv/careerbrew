- id: kb-f74c6d822191
  question: What is MapReduce?
  answer: MapReduce is a programming model for processing huge datasets in parallel across a cluster.
    A map function turns input records into key-value pairs, the framework shuffles and groups them by
    key, and a reduce function combines each key's values. The framework handles distribution, retries,
    and data locality.
  topic: backend dev
  tags:
  - mapreduce
  - big-data
  - distributed-systems
  - batch-processing
  explanation: "## In plain words\nCounting words in one book is easy. Counting words in a billion web\
    \ pages needs many machines. MapReduce splits the job: many workers each process a slice and emit\
    \ partial results, then other workers combine the partial results for each word.\n\n## How it works\n\
    1. **Split:** input files are divided into chunks, usually stored on a distributed file system.\n\
    2. **Map:** each mapper reads a chunk and emits `(key, value)` pairs. It runs near the data to avoid\
    \ network transfer.\n3. **Combine (optional):** a mini-reduce on the mapper's output to shrink it.\n\
    4. **Shuffle and sort:** pairs are partitioned by key, sent across the network, and sorted so each\
    \ reducer gets all values for its keys.\n5. **Reduce:** each reducer aggregates values per key and\
    \ writes output.\n- **Fault tolerance:** a failed task is simply rerun, because map and reduce are\
    \ deterministic functions of their input.\n- Introduced by Google; Hadoop is the famous open-source\
    \ version. Spark later generalised it with in-memory processing.\n\n## Example\n```python\nfrom collections\
    \ import defaultdict\n\ndef mapper(line):\n    for word in line.lower().split():\n        yield word,\
    \ 1\n\ndef reducer(word, counts):\n    return word, sum(counts)\n\nlines = [\"the cat\", \"the dog\"\
    ]\ngroups = defaultdict(list)          # the \"shuffle\"\nfor line in lines:\n    for k, v in mapper(line):\n\
    \        groups[k].append(v)\nprint([reducer(k, v) for k, v in groups.items()])\n# [('the', 2), ('cat',\
    \ 1), ('dog', 1)]\n```\n\n## Common mistakes\n- Using it for low-latency or interactive queries; it\
    \ is batch processing.\n- Skewed keys (one very common key) overloading one reducer.\n- Forgetting\
    \ combiners, sending far too much data through the shuffle.\n- Writing many chained jobs to disk where\
    \ Spark would keep data in memory.\n\n## In the interview\nWalk through word count and the shuffle\
    \ phase, then fault tolerance. Mention its legacy: Hadoop, Spark, and modern data warehouses. Trade-off:\
    \ simple, scalable, and fault-tolerant, but disk-heavy and slow for iterative or real-time work.\n"
