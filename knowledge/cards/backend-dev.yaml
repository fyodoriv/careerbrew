- id: kb-641500b6a050
  question: What are Conflict-free Replicated Data Types (CRDTs)?
  answer: CRDTs are data structures designed so that replicas can be updated independently without coordination
    and still converge to the same state when they exchange updates. Their merge operation is commutative,
    associative, and idempotent, so the order or duplication of messages does not matter.
  topic: backend dev
  tags:
  - distributed-systems
  - crdt
  - replication
  - eventual-consistency
  explanation: "## In plain words\nImagine several people editing the same shopping list offline on different\
    \ phones. When the phones sync, you want everyone to end up with the same list without a central server\
    \ deciding. A CRDT is a data type with built-in merge rules that guarantee this, no matter in which\
    \ order the updates arrive.\n\n## How it works\n- Each replica applies local changes immediately (fast,\
    \ works offline).\n- Replicas exchange either full states (**state-based**, merged with a join function)\
    \ or operations (**operation-based**, which need reliable delivery).\n- The merge must be **commutative**\
    \ (order does not matter), **associative** (grouping does not matter), and **idempotent** (applying\
    \ twice is harmless). Then all replicas that saw the same updates reach the same state: *strong eventual\
    \ consistency*.\n- Common types:\n  - **G-Counter:** each node has its own counter; the value is the\
    \ sum; merge takes the max per node.\n  - **PN-Counter:** two G-Counters for increments and decrements.\n\
    \  - **OR-Set:** add and remove with unique tags so concurrent add wins.\n  - **LWW-Register:** last\
    \ writer wins by timestamp.\n  - Sequence CRDTs for collaborative text editing.\n\n## Example\n```python\n\
    def merge(a: dict, b: dict) -> dict:\n    return {k: max(a.get(k, 0), b.get(k, 0)) for k in a.keys()\
    \ | b.keys()}\n\nphone = {\"phone\": 3}            # 3 likes counted offline\nlaptop = {\"laptop\"\
    : 2}          # 2 likes counted elsewhere\ns = merge(phone, laptop)\nprint(sum(s.values()))      \
    \    # 5, same result whichever merges first\nprint(merge(s, phone) == s)     # True: merging again\
    \ changes nothing\n```\n\n## Common mistakes\n- Thinking CRDTs resolve every conflict \"correctly\"\
    ; they resolve it deterministically, which may not match user intent.\n- Ignoring metadata growth\
    \ (tombstones for deleted elements).\n- Using them where strong invariants are required, such as \"\
    balance never below zero\".\n\n## In the interview\nDefine convergence and the three merge properties,\
    \ then give the G-Counter example. Mention real uses: collaborative editors, offline-first apps, and\
    \ distributed databases such as Riak and Redis Enterprise. Trade-offs: no coordination and high availability\
    \ versus limited semantics and metadata overhead.\n"
  match:
