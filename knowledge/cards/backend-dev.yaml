- id: kb-d9520666f855
  question: What is gRPC?
  answer: gRPC is an open-source RPC framework from Google that uses HTTP/2 for transport and Protocol
    Buffers for schemas and serialisation. It generates typed client and server code in many languages
    and supports unary calls plus client, server, and bidirectional streaming, with deadlines and cancellation
    built in.
  topic: backend dev
  tags:
  - grpc
  - rpc
  - protobuf
  - microservices
  explanation: "## In plain words\ngRPC lets one service call another's functions over the network with\
    \ strongly typed messages and very little hand-written code. It is fast because messages are compact\
    \ binary and many calls share one HTTP/2 connection.\n\n## How it works\n- **Define** services and\
    \ messages in a `.proto` file.\n- **Generate** stubs with `protoc` for each language.\n- **Call types:**\
    \ unary (one request, one response), server streaming, client streaming, and bidirectional streaming.\n\
    - **HTTP/2:** multiplexes many calls over one connection, with header compression and flow control.\n\
    - **Deadlines** propagate across services, and cancellation stops work early.\n- **Status codes**\
    \ such as `NOT_FOUND`, `UNAVAILABLE`, `DEADLINE_EXCEEDED`.\n- **Interceptors** add auth, logging,\
    \ and metrics.\n- **Browsers** cannot call gRPC directly; use gRPC-Web with a proxy, or a JSON gateway.\n\
    - Load balancing needs care: long-lived HTTP/2 connections defeat simple connection-level balancers.\n\
    \n## Example\n```protobuf\nsyntax = \"proto3\";\n\nservice Inventory {\n  rpc GetStock (StockRequest)\
    \ returns (StockReply);\n  rpc WatchStock (StockRequest) returns (stream StockReply);\n}\n\nmessage\
    \ StockRequest { string sku = 1; }\nmessage StockReply  { string sku = 1; int32 quantity = 2; }\n\
    ```\nA Go service implements `Inventory`; a Python client calls `stub.GetStock(StockRequest(sku=\"\
    A1\"), timeout=0.2)`.\n\n## Common mistakes\n- Exposing gRPC directly to browsers or third parties\
    \ who expect REST and JSON.\n- Not setting deadlines, letting calls hang.\n- L4 load balancers that\
    \ pin all traffic to one backend.\n- Breaking compatibility by changing field numbers in protos.\n\
    \n## In the interview\nCompare with REST: performance, typed contracts, and streaming versus human\
    \ readability and browser support. Mention it is a common choice for internal microservice calls.\
    \ Expect questions on deadlines, retries, and load balancing.\n"
