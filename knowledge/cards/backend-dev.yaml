- id: kb-74db4aed3b4f
  question: When is a REST API not the best choice?
  answer: REST is a weaker fit when clients need flexible, nested data in one request (GraphQL), when
    services need fast, typed internal calls or streaming (gRPC), when the server must push real-time
    updates (WebSockets or SSE), or when work is asynchronous and decoupled (message queues and events).
  topic: backend dev
  tags:
  - rest
  - api-design
  - graphql
  - grpc
  explanation: '## In plain words

    REST is a great default for public, resource-shaped HTTP APIs. But it models data as resources fetched
    by request and response. When the shape of communication is different, such as constant updates, streams,
    or highly varied queries, other styles fit better.


    ## How it works

    - **Over-fetching and under-fetching:** mobile screens needing data from many resources make many
    calls or receive too much. GraphQL or a backend-for-frontend helps.

    - **High-performance internal calls:** JSON over HTTP/1.1 is verbose. gRPC with Protobuf is faster
    and typed, with streaming.

    - **Real-time:** chat, live dashboards, and games need server push. Use WebSockets, SSE, or MQTT.

    - **Asynchronous workflows:** long jobs, fan-out to many consumers, or spikes. Use queues or event
    streams (RabbitMQ, Kafka) instead of synchronous calls.

    - **Action-heavy domains:** operations like "approve", "recalculate" fit awkwardly into resources;
    RPC-style endpoints may be clearer.

    - **Very constrained devices:** lightweight protocols such as MQTT or CoAP.


    ## Example

    A ride-sharing app:

    - Public partner API for booking rides: **REST**.

    - Driver location updates to the rider every second: **WebSocket**.

    - Pricing service called by dispatch 5,000 times per second: **gRPC**.

    - Trip completed, then receipts, payouts, and analytics: **events on Kafka**.


    ## Common mistakes

    - Treating REST as the only option, or picking a trendy alternative without a reason.

    - Polling a REST endpoint every second instead of pushing.

    - Ignoring that REST''s HTTP caching and simplicity are real advantages.

    - Building chatty REST calls between microservices on hot paths.


    ## In the interview

    Frame it by communication pattern: request-response, flexible queries, streaming, push, async. Give
    one concrete example for each alternative and acknowledge REST''s strengths: simplicity, caching,
    tooling, broad client support.

    '
