- id: kb-32672ad4e92a
  question: What is Apache Kafka?
  answer: 'Kafka is a distributed event streaming platform: a durable, append-only log split into topics
    and partitions, replicated across brokers. Producers write events, and consumers in consumer groups
    read them at their own pace by tracking offsets, which enables high-throughput messaging, event sourcing,
    and stream processing.'
  topic: backend dev
  tags:
  - kafka
  - messaging
  - event-streaming
  - distributed-systems
  explanation: '## In plain words

    Kafka is like a set of very long, shared notebooks. Services write events at the end, and any number
    of readers can read through the pages at their own speed, even re-reading old pages. Events stay for
    a configured time instead of disappearing once read.


    ## How it works

    - **Topic:** a named stream, such as `orders`.

    - **Partition:** each topic is split into ordered logs. Order is guaranteed only within one partition.
    The message key (e.g., `orderId`) decides the partition, so events for one key stay in order.

    - **Brokers:** servers holding partitions. Each partition has a leader and follower replicas; `acks=all`
    waits for in-sync replicas.

    - **Consumer groups:** each partition is read by one consumer in a group, so partitions set the maximum
    parallelism. Different groups read independently.

    - **Offsets:** a consumer''s position; committing offsets lets it resume after restarts.

    - **Retention:** by time or size, or log compaction that keeps the latest value per key.

    - **Delivery:** at-least-once by default; idempotent producers and transactions enable exactly-once
    processing within Kafka.

    - Metadata coordination now uses KRaft (Raft-based) instead of ZooKeeper.


    ## Example

    An `orders` topic with 6 partitions. The checkout service produces `OrderPlaced` events keyed by order
    id. The email service (group `email`) and the analytics service (group `analytics`) each consume all
    events independently. If analytics is down for an hour, it resumes from its last committed offset
    and catches up.


    ## Common mistakes

    - Expecting global ordering across partitions.

    - Too few partitions, capping consumer parallelism.

    - Committing offsets before processing, losing messages on a crash.

    - Using Kafka as a simple task queue where per-message acknowledgements and routing (RabbitMQ) fit
    better.


    ## In the interview

    Explain topics, partitions, consumer groups, and offsets with an example. Compare with RabbitMQ: log
    retention and replay versus per-message routing and deletion on acknowledgement. Mention delivery
    semantics and how to make consumers idempotent.

    '
