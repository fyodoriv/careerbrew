- id: kb-741dbe68e3b0
  question: What is BSON?
  answer: BSON (Binary JSON) is the binary format MongoDB uses to store documents and send them over the
    network. It encodes JSON-like data with length prefixes and extra types such as dates, 64-bit integers,
    decimals, binary data, and ObjectId, making it fast to traverse at some cost in size.
  topic: backend dev
  tags:
  - mongodb
  - bson
  - serialization
  - data-formats
  explanation: '## In plain words

    JSON is text and only knows strings, numbers, booleans, null, arrays, and objects. BSON is a binary
    cousin of JSON that MongoDB uses internally. It adds types databases need, such as real dates and
    exact decimals, and it is quick for a machine to scan.


    ## How it works

    - A BSON document starts with its total length, then a list of elements, then a null byte.

    - Each element is: a type byte, the field name, then the value.

    - Strings and embedded documents also carry their length, so a reader can skip fields without parsing
    them.

    - Extra types include `ObjectId` (12-byte id), `Date`, `Int32`, `Int64`, `Decimal128`, `Binary`, `Timestamp`,
    and regular expressions.

    - Drivers convert between BSON and your language''s objects. Tools show it as Extended JSON, such
    as `{"$date": "2026-01-01T00:00:00Z"}`.

    - Maximum document size in MongoDB is 16 MB.


    ## Example

    The document `{"hello": "world"}` in BSON is 22 bytes:

    ```text

    \x16\x00\x00\x00            total length = 22

    \x02 hello\x00               type 0x02 = string, field name

    \x06\x00\x00\x00 world\x00   string length 6, value

    \x00                        end of document

    ```


    ## Common mistakes

    - Assuming BSON is always smaller than JSON; with field names and length prefixes it is often larger.

    - Losing type information when exporting to plain JSON (dates become strings).

    - Mixing `int` and `double` types accidentally and breaking queries or validation.

    - Thinking BSON is only for MongoDB; other tools use it, but it is MongoDB''s core format.


    ## In the interview

    Explain why it exists: richer types and fast traversal. Compare with JSON, MessagePack, and Protobuf
    (which needs a schema). Mention the 16 MB document limit as a practical consequence.

    '
