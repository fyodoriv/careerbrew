- id: kb-520e5403bfa2
  question: How can version counters tell concurrent writes apart from writes that happened one after
    another?
  answer: 'Each replica keeps a version vector: one counter per node. If every counter in version A is
    less than or equal to the matching counter in B, then A happened before B and B can replace it. If
    each has a counter greater than the other, the writes are concurrent and must be kept as siblings
    or merged.'
  topic: backend dev
  tags:
  - distributed-systems
  - version-vectors
  - concurrency
  - replication
  explanation: "## In plain words\nIn a distributed database two clients can update the same key on different\
    \ nodes at almost the same time. Wall clocks are not reliable enough to order these writes. Instead,\
    \ each write carries a small set of counters that record what the writer had already seen, so the\
    \ system can tell \"this update built on that one\" from \"these two updates did not know about each\
    \ other\".\n\n## How it works\n- Every node keeps a counter. A **version vector** is a map like `{A:\
    \ 2, B: 1}`.\n- When node A accepts a write, it increments its own counter and attaches the vector\
    \ to the value.\n- A client reads a value with its vector and sends that vector back on its next write,\
    \ saying \"I have seen this\".\n- To compare vectors V and W:\n  - V ≤ W for every node: V happened\
    \ before W, so W overwrites V.\n  - W ≤ V for every node: W is older and can be discarded.\n  - Neither:\
    \ the writes are **concurrent**. Keep both as siblings and resolve later (application merge, last-writer-wins,\
    \ or a CRDT).\n\n## Example\n- Value starts with `{A:1}`.\n- Client 1 reads it and writes through\
    \ node A: `{A:2}`.\n- Client 2 also read `{A:1}` and writes through node B: `{A:1, B:1}`.\n- Compare\
    \ `{A:2}` and `{A:1, B:1}`: A is greater in the first, B in the second. Concurrent, so both are kept.\n\
    - Client 3 reads both siblings, merges them, and writes `{A:2, B:2}` via B, which dominates both.\n\
    \n## Common mistakes\n- Using timestamps and assuming clocks agree across machines.\n- Confusing version\
    \ vectors (per replica, for data) with vector clocks (per process, for events). They are related but\
    \ used differently.\n- Silently dropping one concurrent write and losing data.\n- Letting vectors\
    \ grow without bound when many clients act as nodes.\n\n## In the interview\nExplain the happens-before\
    \ comparison with a small example on the whiteboard. Mention that Dynamo-style stores use this idea\
    \ and expose siblings to the client. Trade-offs: no lost writes, but more metadata and merge logic\
    \ in the application. Compare with last-writer-wins, which is simpler but lossy.\n"
  match:
  - d08c9f787543
  prompt: 1f344914
- id: kb-fbf64b14d6b2
  question: How do you decide whether a backend function belongs in your main service or in a serverless
    function?
  answer: Serverless fits short, stateless, event-driven or spiky workloads where you want zero idle cost
    and no server management. Keep code in the main service when it is latency-sensitive, long-running,
    needs steady high throughput, shared in-memory state, or tight coupling with other backend logic.
  topic: backend dev
  tags:
  - serverless
  - architecture
  - cloud
  - trade-offs
  explanation: '## In plain words

    Serverless platforms such as AWS Lambda run a function only when an event arrives and bill you per
    call. That is great for bursts and occasional jobs, but a poor fit for work that runs all the time
    or needs to be very fast on every request. The decision is about traffic shape, latency, run time,
    and coupling.


    ## How it works

    Ask these questions:

    - **Traffic pattern:** rare or spiky traffic favours serverless; steady high traffic is usually cheaper
    on long-running servers or containers.

    - **Latency:** cold starts add delay when a new instance spins up. Tight latency budgets favour an
    always-on service.

    - **Duration and resources:** platforms cap run time (for example 15 minutes on Lambda) and memory.

    - **State:** functions are stateless; anything shared must live in a database or cache.

    - **Coupling:** if the code shares models, transactions, or connection pools with the main service,
    splitting it adds network calls and deployment complexity.

    - **Team and operations:** serverless removes patching and scaling work but adds vendor lock-in and
    harder local testing.


    ## Example

    - Resize uploaded images: triggered by a storage event, bursty, independent. **Serverless.**

    - Nightly export of a report: runs once a day for 2 minutes. **Serverless** or a scheduled job.

    - Checkout API handling 2,000 requests per second with a 100 ms budget and a shared database pool.
    **Main service.**

    - A websocket chat server holding open connections. **Main service.**


    ## Common mistakes

    - Treating serverless as always cheaper; at constant high load it often is not.

    - Ignoring database connection limits when hundreds of functions each open their own connection.

    - Splitting tightly related logic into many functions, creating a distributed monolith.

    - Forgetting observability: tracing across many functions needs extra work.


    ## In the interview

    Frame it as a checklist and give one example of each choice. Mention cold-start mitigations (provisioned
    concurrency), connection pooling proxies, and that the choice can change as traffic grows. Interviewers
    look for cost and latency reasoning, not a one-size answer.

    '
