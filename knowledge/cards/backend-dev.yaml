- id: kb-3ab3434a9787
  question: What is atomicity in ACID?
  answer: 'Atomicity means a transaction is all or nothing: either every operation in it takes effect,
    or none do. If anything fails midway, the database rolls back the changes already made, so no partial
    state is ever committed.'
  topic: backend dev
  tags:
  - acid
  - atomicity
  - transactions
  - databases
  explanation: "## In plain words\n\"Atomic\" comes from \"indivisible\". A transaction can contain many\
    \ steps, but to the outside world it acts as one step. If the power fails or a rule is broken halfway,\
    \ the database pretends the transaction never started.\n\n## How it works\n- The database records\
    \ changes in a **write-ahead log** (or keeps old row versions) before applying them.\n- On **commit**,\
    \ it writes a commit record; only then is the transaction considered done.\n- On **error or explicit\
    \ rollback**, it uses the log or old versions to undo the partial work.\n- After a **crash**, recovery\
    \ replays committed transactions and undoes uncommitted ones.\n- Atomicity is about failure, not concurrency:\
    \ hiding partial work from other sessions is isolation.\n\n## Example\n```python\nimport sqlite3\n\
    db = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE acct(id INT PRIMARY KEY, bal INT CHECK\
    \ (bal >= 0))\")\ndb.executemany(\"INSERT INTO acct VALUES (?, ?)\", [(1, 50), (2, 0)])\ndb.commit()\n\
    try:\n    with db:  # one transaction\n        db.execute(\"UPDATE acct SET bal = bal + 100 WHERE\
    \ id = 2\")\n        db.execute(\"UPDATE acct SET bal = bal - 100 WHERE id = 1\")  # violates CHECK\n\
    except sqlite3.IntegrityError:\n    pass\nprint(db.execute(\"SELECT * FROM acct\").fetchall())  #\
    \ [(1, 50), (2, 0)]\n```\nThe first update was undone because the second failed.\n\n## Common mistakes\n\
    - Confusing atomicity with isolation.\n- Confusing it with \"atomic operations\" in multithreaded\
    \ code; related idea, different context.\n- Committing after each statement by accident (autocommit),\
    \ losing all-or-nothing behaviour.\n- Assuming atomicity spans several databases or services; it does\
    \ not without extra protocols.\n\n## In the interview\nGive the bank transfer example and mention\
    \ the write-ahead log. Follow-ups: how to get all-or-nothing across services (two-phase commit, sagas\
    \ with compensating actions, the outbox pattern). Showing you know the limits of atomicity scores\
    \ points.\n"
