  question: What is salting in cryptography?
  answer: A salt is a unique random value added to each password before hashing and stored next to the
    hash. It makes identical passwords produce different hashes and defeats precomputed tables, forcing
    attackers to crack each hash separately. Use it with a slow password hash such as Argon2 or bcrypt.
  topic: security
  tags:
  - salting
  - password-hashing
  - cryptography
  explanation: '## In plain words

    Without salt, everyone who picks "password123" gets the same hash, so an attacker cracks one and finds
    them all, or simply looks it up in a precomputed table. Adding a random salt to each password is like
    giving every user a unique lock design: the attacker has to pick each one separately.


    ## How it works

    - On sign-up, generate a random salt (16 bytes or more) for that user.

    - Compute `hash = slowHash(password, salt)` and store both. The salt is not secret.

    - On login, read the stored salt, hash the given password with it, and compare in constant time.

    - **What it stops**: rainbow tables and spotting users with the same password.

    - **What it does not stop**: guessing a single user''s weak password. That is why the hash must also
    be slow and tunable (Argon2id, bcrypt, scrypt).

    - A **pepper** is an extra secret kept outside the database (for example in a secret manager), which
    helps if only the database leaks.

    - Modern libraries create and embed the salt for you.


    ## Example

    ```python

    import bcrypt

    hashed = bcrypt.hashpw(b"correct horse", bcrypt.gensalt(rounds=12))

    print(hashed[:7])                                   # b''$2b$12$'' (salt is embedded)

    print(bcrypt.checkpw(b"correct horse", hashed))     # True

    ```


    ## Common mistakes

    - Using one global salt for all users.

    - Thinking the salt must be secret.

    - Salting a fast hash such as SHA-256 and calling it safe.

    - Writing your own scheme instead of using a vetted library.


    ## In the interview

    Explain the attack salts prevent, then pair salting with slow hashing. Follow-ups: what a pepper adds,
    how to raise the work factor over time (rehash on next login), and why constant-time comparison matters.

    '
