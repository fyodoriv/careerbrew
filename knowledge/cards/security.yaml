  question: What is the Content Security Policy (CSP) header?
  answer: Content-Security-Policy is an HTTP response header that tells the browser which sources of scripts,
    styles, images, frames and connections a page may use. A strict policy, such as nonce-based scripts
    with no inline code, greatly limits the damage of XSS. Report-only mode lets you test it first.
  topic: security
  tags:
  - csp
  - xss
  - web-security
  - http-headers
  explanation: "## In plain words\nCSP is an allow-list the browser enforces for your page. Even if an\
    \ attacker manages to inject a script tag, the browser refuses to run it because it did not come from\
    \ a source you approved.\n\n## How it works\n- The server sends `Content-Security-Policy: <directive>\
    \ <sources>; ...`.\n- Common directives:\n  - `default-src`: fallback for the others.\n  - `script-src`,\
    \ `style-src`, `img-src`, `connect-src` (fetch and WebSocket), `font-src`, `frame-src`.\n  - `frame-ancestors`:\
    \ who may embed your page (clickjacking defence).\n  - `object-src 'none'`, `base-uri 'self'`.\n-\
    \ Source values: `'self'`, host names, `'nonce-<random>'`, `'sha256-<hash>'`, `'strict-dynamic'`.\
    \ `'unsafe-inline'` and `'unsafe-eval'` weaken it a lot.\n- **Nonces**: the server generates a fresh\
    \ random value per response and puts it on its own script tags; injected scripts lack it.\n- **Rollout**:\
    \ start with `Content-Security-Policy-Report-Only` plus reporting, fix the violations, then enforce.\n\
    \n## Example\n```http\nContent-Security-Policy: default-src 'self'; script-src 'self' 'nonce-r4nd0m';\
    \ object-src 'none'; base-uri 'self'; frame-ancestors 'none'\n```\n```html\n<script nonce=\"r4nd0m\"\
    \ src=\"/app.js\"></script>   <!-- runs -->\n<script>alert(1)</script>                         <!--\
    \ blocked -->\n```\n\n## Common mistakes\n- Adding `'unsafe-inline'` to make errors go away, which\
    \ removes most of the XSS benefit.\n- Long host allow-lists that include CDNs hosting attacker-controlled\
    \ files.\n- Reusing the same nonce on every response.\n- Treating CSP as a replacement for output\
    \ encoding.\n\n## In the interview\nExplain it as defence in depth against XSS, name key directives\
    \ and the nonce approach, and describe a safe rollout with report-only mode. Trade-off: strict policies\
    \ need changes to inline scripts and third-party tags.\n"
