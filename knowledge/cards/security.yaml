- id: kb-ed7507250692
  question: What is hashing in cryptography?
  answer: A cryptographic hash function maps any input to a fixed-size digest that is deterministic, fast
    to compute, and practically impossible to reverse or to find two inputs with the same output. It is
    used for integrity checks, signatures and content addressing; passwords need special slow, salted
    hashes.
  topic: security
  tags:
  - hashing
  - cryptography
  - integrity
  explanation: "## In plain words\nA hash is a fingerprint for data. The same input always gives the same\
    \ fingerprint, a tiny change gives a completely different one, and you cannot rebuild the data from\
    \ the fingerprint.\n\n## How it works\n- **Properties**:\n  - Deterministic and fixed length (SHA-256\
    \ always gives 256 bits).\n  - Pre-image resistance: given a hash, you cannot find an input that produces\
    \ it.\n  - Second pre-image and collision resistance: you cannot find two inputs with the same hash.\n\
    \  - Avalanche effect: one changed bit flips about half the output bits.\n- **Uses**: file integrity\
    \ checks, digital signatures (sign the hash), HMAC for message authentication, Git object IDs, deduplication.\n\
    - **Choices**: SHA-256, SHA-3 and BLAKE2/3 are current. MD5 and SHA-1 are broken for collisions and\
    \ should not be used for security.\n- **Passwords** need slow, salted algorithms built for the job\
    \ (Argon2, bcrypt, scrypt), because fast hashes let attackers try billions of guesses per second.\n\
    - Hashing is not encryption: there is no key and no way back.\n\n## Example\n```python\nimport hashlib\n\
    print(hashlib.sha256(b\"hello\").hexdigest()[:16])   # 2cf24dba5fb0a30e\nprint(hashlib.sha256(b\"\
    hellp\").hexdigest()[:16])   # completely different\n```\n\n## Common mistakes\n- Calling hashing\
    \ \"encryption\".\n- Using MD5 or SHA-1 for anything security related.\n- Storing passwords with a\
    \ plain fast hash, even with a salt.\n- Using a plain hash where you need a keyed MAC to stop tampering.\n\
    \n## In the interview\nDefine the properties, then give uses and good algorithm choices. Follow-ups:\
    \ hashing versus encryption versus encoding, why password hashing must be slow, HMAC, and how collisions\
    \ in MD5 enabled real attacks.\n"
  match:
  - ed7507250692
  prompt: 1f344914
- id: kb-700bb892c258
  question: What is HTTPS?
  answer: HTTPS is HTTP sent inside a TLS-encrypted connection. It gives confidentiality (others cannot
    read the traffic), integrity (they cannot change it unnoticed) and server authentication through certificates
    signed by trusted certificate authorities.
  topic: security
  tags:
  - https
  - tls
  - web-security
  explanation: '## In plain words

    Plain HTTP is a postcard: anyone handling it can read or change it. HTTPS puts the postcard in a locked
    box that only you and the real server can open, and it checks the server''s ID before you hand anything
    over.


    ## How it works

    - The browser connects to port 443 and runs a TLS handshake.

    - The server presents a certificate binding its domain to a public key, signed by a certificate authority
    (CA) the browser trusts.

    - The browser checks the chain, the host name and the expiry date. If anything fails, it shows a warning.

    - Both sides derive symmetric session keys (via ephemeral Diffie-Hellman in modern TLS) and encrypt
    all HTTP data: URL path, headers, cookies and body.

    - Still visible to the network: the server IP, usually the host name (SNI), and traffic size and timing.

    - **HSTS** (`Strict-Transport-Security`) tells browsers to always use HTTPS for the site, blocking
    downgrade attacks.

    - Certificates are free and automated through ACME (for example Let''s Encrypt).


    ## Example

    ```http

    Strict-Transport-Security: max-age=31536000; includeSubDomains

    ```

    Without HSTS, a user typing `example.com` first makes an HTTP request that an attacker on café Wi-Fi
    could intercept and keep on HTTP. With HSTS, the browser upgrades to HTTPS before sending anything.


    ## Common mistakes

    - Saying HTTPS hides which site you visit; the domain is usually visible.

    - Thinking the padlock means the site is trustworthy; it only means the connection is secure.

    - Mixed content: loading scripts over HTTP on an HTTPS page.

    - Forgetting certificate renewal.


    ## In the interview

    Name the three guarantees and walk briefly through the handshake and certificate check. Follow-ups:
    HSTS and preload lists, certificate transparency, TLS termination at a load balancer and whether to
    re-encrypt to backends, and the low performance cost of TLS 1.3.

    '
