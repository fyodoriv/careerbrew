- id: kb-3f4a3864731b
  question: How would you prepare for and respond to a DDoS attack?
  answer: Prepare by putting a CDN or DDoS protection service and a web application firewall in front,
    keeping origins hidden, rate limiting, autoscaling, caching heavily and having a runbook and alerts.
    During an attack, confirm it, identify the traffic pattern, block or challenge it at the edge, shed
    non-critical load, and communicate.
  topic: security
  tags:
  - ddos
  - availability
  - incident-response
  - infrastructure
  explanation: "## In plain words\nA distributed denial of service (DDoS) attack floods your service with\
    \ traffic from many machines so real users cannot get in. You cannot out-muscle a botnet alone, so\
    \ the plan is to absorb traffic at a huge edge network and make your own servers hard to reach directly.\n\
    \n## How it works\n- **Kinds**: volumetric (fill the pipe, for example UDP amplification), protocol\
    \ (exhaust connection tables, for example SYN floods), application layer (expensive HTTP requests\
    \ such as search).\n- **Prepare**:\n  - Use a CDN or scrubbing service with anycast capacity; allow\
    \ origin traffic only from it.\n  - WAF rules, rate limits per IP, token or route, and bot challenges.\n\
    \  - Cache aggressively; make expensive endpoints cheap or queued.\n  - Autoscaling with sensible\
    \ limits, and graceful degradation (turn off heavy features).\n  - Dashboards and alerts on request\
    \ rate, error rate and latency; a written runbook with contacts at your provider.\n- **Respond**:\
    \ confirm it is an attack (not a launch or a bug), find the pattern (paths, user agents, regions,\
    \ ASNs), apply targeted blocks or challenges, enable \"under attack\" modes, scale or shed load, update\
    \ the status page, and review afterwards.\n\n## Example\nA login page suddenly receives 200,000 requests\
    \ per second from 30,000 IPs. Steps: turn on a challenge for `/login`, rate limit to 10 requests per\
    \ minute per IP, block the two hosting providers sending 70% of the traffic, and serve the marketing\
    \ site from cache only. Error rates fall within 15 minutes.\n\n## Common mistakes\n- Exposing the\
    \ origin IP, so attackers bypass the CDN.\n- Relying only on autoscaling, which can turn an attack\
    \ into a huge bill.\n- Blocking whole countries or ranges without checking real users.\n- Having no\
    \ runbook, so the response is improvised.\n\n## In the interview\nSplit the answer into prepare, detect,\
    \ respond and learn. Mention the three attack layers and where each is stopped. Signals interviewers\
    \ look for: calm process, measurement, communication, and trade-offs between blocking attackers and\
    \ hurting real users.\n"
