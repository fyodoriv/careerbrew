- id: kb-b472e61e1f58
  question: What are cookies?
  answer: Cookies are small name-value pairs a server asks the browser to store with Set-Cookie; the browser
    sends them back on matching requests. They hold session IDs, preferences and tracking IDs, and attributes
    such as Secure, HttpOnly, SameSite, Domain, Path and Max-Age control their scope and safety.
  topic: security
  tags:
  - cookies
  - http
  - web-security
  - sessions
  explanation: "## In plain words\nHTTP has no memory. A cookie is a small note the server hands to the\
    \ browser: \"show me this next time\". The browser automatically attaches it to later requests to\
    \ that site, which is how you stay logged in.\n\n## How it works\n- **Set**: the response sends `Set-Cookie:\
    \ name=value; attributes`. JavaScript can also set non-`HttpOnly` cookies with `document.cookie`.\n\
    - **Sent**: the browser adds a `Cookie` header to requests that match the cookie's domain and path.\n\
    - **Attributes**:\n  - `Expires` / `Max-Age`: lifetime; without them it is a session cookie that dies\
    \ when the browser closes.\n  - `Secure`: only over HTTPS.\n  - `HttpOnly`: hidden from JavaScript,\
    \ which limits theft through XSS.\n  - `SameSite=Strict|Lax|None`: whether to send it on cross-site\
    \ requests, a key CSRF defence. `None` requires `Secure`.\n  - `Domain` and `Path`: scope.\n- **Limits**:\
    \ about 4 KB per cookie; every matching request carries them, so big cookies slow down every request.\n\
    - **Privacy**: third-party cookies enable cross-site tracking and are increasingly blocked; consent\
    \ laws apply to non-essential cookies.\n\n## Example\n```http\nHTTP/1.1 200 OK\nSet-Cookie: sid=7b1e9c;\
    \ Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=3600\n\nGET /account HTTP/1.1\nCookie: sid=7b1e9c\n\
    ```\n\n## Common mistakes\n- Storing sensitive data in the cookie value itself instead of an opaque\
    \ ID.\n- Forgetting `HttpOnly` and `Secure` on session cookies.\n- Setting `Domain` too broadly, so\
    \ every subdomain receives it.\n- Confusing cookies with `localStorage`, which is never sent automatically.\n\
    \n## In the interview\nExplain the round trip and each security attribute. Follow-ups: cookies versus\
    \ tokens in headers, how `SameSite` affects CSRF, third-party cookie deprecation, and session fixation\
    \ (rotate the ID on login).\n"
  match:
  - b472e61e1f58
  prompt: 1f344914
- id: kb-eafe7f162963
  question: What are JWTs (JSON Web Tokens)?
  answer: 'A JWT is a compact, URL-safe token with three base64url parts: a header, a JSON payload of
    claims, and a signature. The server verifies the signature to trust the claims without a database
    lookup. It is signed, not encrypted, so anyone holding it can read the payload.'
  topic: security
  tags:
  - jwt
  - authentication
  - tokens
  explanation: '## In plain words

    A JWT is like a tamper-evident wristband at a festival. It states facts about you (who you are, when
    it expires), and a seal proves the organiser issued it. Staff can check the seal without calling the
    office. Anyone can read what is printed on it, though.


    ## How it works

    - Format: `header.payload.signature`, each part base64url-encoded.

    - **Header**: algorithm, for example `HS256` (HMAC with a shared secret) or `RS256`/`ES256` (public-key
    signature).

    - **Payload claims**: `sub` (subject), `exp` (expiry), `iat` (issued at), `iss` (issuer), `aud` (audience),
    plus custom ones such as roles.

    - **Signature**: computed over header and payload. Changing any byte breaks it.

    - **Verification**: check the signature with an allow-listed algorithm, then `exp`, `iss` and `aud`.

    - **Trade-offs**: stateless and easy to verify across services, but hard to revoke before expiry.
    Common pattern: short-lived access tokens (minutes) plus a revocable refresh token.


    ## Example

    ```python

    import jwt, time  # PyJWT

    token = jwt.encode({"sub": "42", "exp": int(time.time()) + 900}, "secret", algorithm="HS256")

    claims = jwt.decode(token, "secret", algorithms=["HS256"])

    print(claims["sub"])  # 42

    ```


    ## Common mistakes

    - Putting secrets or personal data in the payload; it is only encoded.

    - Accepting the `none` algorithm or letting the token choose the algorithm.

    - Long-lived tokens with no revocation plan.

    - Storing them in `localStorage`, exposed to XSS.


    ## In the interview

    Explain structure, signing, and verification steps, then the revocation trade-off against server sessions.
    Follow-ups: symmetric versus asymmetric signing (asymmetric lets many services verify without the
    signing key), refresh token rotation, and where to store tokens in a browser.

    '
  match:
