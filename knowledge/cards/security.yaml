- id: kb-7c59027a413b
  question: How do you secure a Node.js application?
  answer: Validate all input, use parameterised queries, encode output, keep dependencies patched and
    audited, store secrets outside the code, set security headers, use secure cookies and strong password
    hashing, rate limit, run with least privilege, and avoid blocking or dangerous APIs such as eval on
    user data.
  topic: security
  tags:
  - nodejs
  - web-security
  - owasp
  - dependencies
  explanation: "## In plain words\nSecuring a Node.js app is mostly the same as securing any web app,\
    \ plus a few Node-specific risks: a huge npm dependency tree, a single-threaded event loop that can\
    \ be stalled, and dynamic JavaScript features that can run attacker input.\n\n## How it works\n- **Input**:\
    \ validate with a schema (types, lengths, formats) at every boundary. Reject unknown fields.\n- **Injection**:\
    \ parameterised SQL or an ORM; never build shell commands with user input (`execFile` with an argument\
    \ list, not `exec`); avoid `eval`, `new Function` and `vm` on untrusted data.\n- **Output**: escape\
    \ HTML in templates, set a Content Security Policy.\n- **Headers**: use `helmet` for CSP, HSTS, `X-Content-Type-Options`\
    \ and others.\n- **Auth**: bcrypt or Argon2 for passwords, `HttpOnly` `Secure` `SameSite` cookies,\
    \ CSRF protection for cookie sessions.\n- **Dependencies**: lock files, `npm audit` or a scanner,\
    \ automated update PRs, few and well-known packages.\n- **Availability**: rate limiting, body size\
    \ limits, timeouts, and avoiding regexes vulnerable to catastrophic backtracking (ReDoS) or big synchronous\
    \ work that blocks the event loop.\n- **Runtime**: secrets in environment variables or a secret manager,\
    \ non-root user, current LTS Node version, and errors that do not leak stack traces.\n\n## Example\n\
    ```js\nconst express = require(\"express\");\nconst helmet = require(\"helmet\");\nconst app = express();\n\
    app.use(helmet());\napp.use(express.json({ limit: \"100kb\" }));\napp.get(\"/users/:id\", async (req,\
    \ res) => {\n  const id = Number(req.params.id);\n  if (!Number.isInteger(id)) return res.status(400).end();\n\
    \  const { rows } = await db.query(\"SELECT id, name FROM users WHERE id = $1\", [id]);\n  res.json(rows[0]\
    \ ?? null);\n});\n```\n\n## Common mistakes\n- Trusting `req.body` shape without validation (including\
    \ prototype pollution via `__proto__` keys).\n- Installing packages without checking maintenance or\
    \ install scripts.\n- Returning full error objects to clients.\n- Running CPU-heavy work on the main\
    \ thread, which turns into a denial of service.\n\n## In the interview\nOrganise your answer by the\
    \ OWASP Top 10 and then add Node specifics (event loop, npm supply chain, prototype pollution). Mention\
    \ tooling (linters, audits, dependency bots) and process (threat modelling, security review in CI).\
    \ Trade-off: more dependencies speed up delivery but widen the attack surface.\n"
  match:
  - ab28fa5f1e7f
  prompt: 1f344914
- id: kb-17ded5c6bfc2
  question: How does authentication work in web applications?
  answer: 'Authentication proves who a user is: they present credentials such as a password, a passkey
    or a one-time code, the server verifies them, then issues a session cookie or token that later requests
    carry. Authorization is a separate step that decides what that identity may do.'
  topic: security
  tags:
  - authentication
  - sessions
  - tokens
  - web-security
  explanation: "## In plain words\nAuthentication answers \"who are you?\". Think of a hotel: you show\
    \ your ID at the desk once (login), and you get a key card (a session or token) that you use for the\
    \ rest of your stay, instead of showing your ID at every door.\n\n## How it works\n- **Factors**:\
    \ something you know (password), something you have (phone, security key), something you are (biometrics).\
    \ Multi-factor combines two or more.\n- **Verify**: compare a password with a stored slow, salted\
    \ hash (bcrypt, scrypt, Argon2); check a TOTP code; or verify a passkey's signature with WebAuthn.\n\
    - **Keep the user logged in**:\n  - Server sessions: a random session ID in an `HttpOnly`, `Secure`,\
    \ `SameSite` cookie, mapped to data on the server.\n  - Tokens: a signed token (often a JWT) sent\
    \ in a header; usually short-lived with a refresh token.\n- **Delegated login**: OAuth 2.0 with OpenID\
    \ Connect lets an identity provider (for example \"Sign in with ...\") authenticate the user and return\
    \ an ID token.\n- **Then authorize** each request: roles, permissions, ownership checks.\n\n## Example\n\
    ```text\nPOST /login {email, password}\n-> server checks bcrypt hash, then 2FA code\n<- Set-Cookie:\
    \ sid=9f2c...; HttpOnly; Secure; SameSite=Lax\nGET /orders  (Cookie: sid=9f2c...)\n-> server looks\
    \ up session -> user 42 -> checks user 42 may see /orders\n```\n\n## Common mistakes\n- Storing passwords\
    \ with a fast hash such as MD5 or plain SHA-256.\n- Confusing authentication with authorization.\n\
    - Putting tokens in `localStorage`, where any XSS can steal them.\n- Not rotating the session ID after\
    \ login, which allows session fixation.\n\n## In the interview\nSeparate authentication from authorization,\
    \ describe the login flow and how state is kept, and compare sessions with tokens (easy revocation\
    \ versus stateless scaling). Follow-ups: MFA and passkeys, OAuth versus OIDC, rate limiting and lockouts\
    \ against credential stuffing, and logout and revocation.\n"
  match:
