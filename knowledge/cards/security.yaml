- id: kb-1cfae3def904
  question: What is UI redressing (clickjacking)?
  answer: UI redressing, or clickjacking, tricks a user into clicking something different from what they
    see, usually by loading your site in an invisible iframe over a decoy page. The fix is to forbid framing
    with Content-Security-Policy frame-ancestors or X-Frame-Options, plus confirmation for sensitive actions.
  topic: security
  tags:
  - clickjacking
  - web-security
  - http-headers
  explanation: "## In plain words\nAn attacker lays a transparent sheet with your real \"Delete account\"\
    \ button over a fake \"Win a prize\" button. The user thinks they click the prize; they actually click\
    \ your button while logged in.\n\n## How it works\n- The attacker's page loads the target site in\
    \ an `iframe` with opacity near zero.\n- They position the frame so a sensitive button lines up with\
    \ a tempting decoy.\n- The victim's browser sends their cookies with the framed request, so the click\
    \ acts as them.\n- Variants: tricking drags, keystrokes, or permission prompts (camera, microphone).\n\
    - **Defences**:\n  - `Content-Security-Policy: frame-ancestors 'none'` (or a list of trusted origins).\
    \ This is the modern way.\n  - `X-Frame-Options: DENY` or `SAMEORIGIN` for older browsers.\n  - `SameSite`\
    \ cookies, so framed cross-site requests may lack the session.\n  - Re-authentication or confirmation\
    \ dialogs for critical actions.\n\n## Example\n```http\nContent-Security-Policy: frame-ancestors 'none'\n\
    X-Frame-Options: DENY\n```\nWith these headers, the browser refuses to render your page inside the\
    \ attacker's iframe, so there is nothing to click.\n\n## Common mistakes\n- Relying on JavaScript\
    \ \"frame-busting\" scripts, which can be bypassed.\n- Allowing framing site-wide when only one widget\
    \ needs it.\n- Forgetting that `X-Frame-Options` cannot list several allowed origins; use `frame-ancestors`.\n\
    \n## In the interview\nExplain the trick in one sentence, then give the header fix. Follow-ups: how\
    \ it differs from CSRF (the user really clicks), how to allow trusted embedding safely, and other\
    \ UI deception such as cursor spoofing.\n"
