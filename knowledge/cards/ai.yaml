- id: kb-b34d21ae5816
  question: How can AI solve customer problems?
  answer: AI helps when a customer problem involves understanding unstructured data, predicting outcomes,
    personalising, or automating repetitive judgment, such as support triage, search, summarisation or
    fraud detection. Start from a measured pain point, pick the simplest approach that works, keep humans
    in the loop where errors are costly, and measure the outcome.
  topic: ai
  tags:
  - ai
  - product
  - customer-value
  - llm
  explanation: "## In plain words\nAI is a tool, not a goal. It shines where people currently spend time\
    \ reading, sorting, guessing or searching, and where an occasional mistake can be caught. The best\
    \ answers start with the customer's problem and only then ask whether AI is the right fix.\n\n## How\
    \ it works\n- **Find the pain**: where do customers wait, repeat work, or fail to find things? Measure\
    \ it (time to resolve, conversion, churn).\n- **Match the capability**:\n  - Language models: answering\
    \ questions over docs, summarising, drafting, extracting fields from text.\n  - Classic ML: prediction\
    \ (churn, demand), ranking and recommendations, anomaly and fraud detection.\n  - Vision and speech:\
    \ document scanning, transcription, quality inspection.\n- **Design for errors**: confidence thresholds,\
    \ human review for risky cases, easy correction, clear disclosure that AI is involved.\n- **Evaluate**:\
    \ offline test sets, then A/B tests on the business metric, plus monitoring for drift, cost and latency.\n\
    - **Respect constraints**: privacy, data rights, fairness and regulation.\n\n## Example\nA software\
    \ company's support team is overloaded. A model classifies incoming tickets and routes them; a retrieval-augmented\
    \ assistant drafts replies from the help centre, which agents approve. Fictional results: first response\
    \ time falls from 8 hours to 1 hour, and agents handle 30% more tickets, with a weekly review of wrong\
    \ answers.\n\n## Common mistakes\n- Starting with \"we need AI\" instead of a problem.\n- No baseline\
    \ metric, so success cannot be shown.\n- Ignoring failure modes such as made-up answers.\n- Forgetting\
    \ cost per request and latency at scale.\n\n## In the interview\nStructure your answer as problem,\
    \ approach, safeguards, and measurement. Interviewers look for product sense, realism about limits,\
    \ and data and privacy awareness. Be ready to say when AI is the wrong tool, for example when simple\
    \ rules or better UX would solve it.\n"
  match:
  - b34d21ae5816
  prompt: 1f344914
- id: kb-5a98eb35e5ae
  question: How would you describe integrating AI into a project you worked on?
  answer: 'Use a project story: the problem and why AI fit, the approach you chose (model, retrieval,
    prompts, fine-tuning or classic ML), how you evaluated quality and handled failures, what it cost
    and how it performed, and what you learned. Concrete metrics and trade-offs matter more than buzzwords.'
  topic: ai
  tags:
  - ai
  - behavioral
  - llm
  - product
  explanation: "## In plain words\nThis is a behavioural question with a technical core. The interviewer\
    \ wants to see that you can ship AI features responsibly: pick the right tool, measure quality, and\
    \ handle the ways models fail. Tell one focused story rather than listing every tool you have touched.\n\
    \n## How it works\nA strong answer follows STAR (situation, task, action, result) plus lessons:\n\
    - **Situation and task**: the user problem and the success metric.\n- **Action**:\n  - Why AI and\
    \ which kind (a hosted language model, an open model, a classifier).\n  - The architecture: retrieval\
    \ over your data, prompt design, structured outputs, tool calls, caching.\n  - Evaluation: a labelled\
    \ test set, automatic checks, human review.\n  - Safety and privacy: what data leaves your systems,\
    \ guardrails, fallbacks.\n  - Cost and latency control: smaller models for easy cases, batching, caching.\n\
    - **Result**: numbers on quality, adoption, time saved or cost.\n- **Learning**: what you would do\
    \ differently.\n\n## Example\nA fictional sample answer: \"Our users struggled to find answers in\
    \ long product docs. I built a search assistant that retrieves the most relevant sections and asks\
    \ a language model to answer with citations. I created a set of 200 real questions with expected answers\
    \ and ran it on every prompt change. Early versions invented details, so we required citations and\
    \ returned 'I don't know' below a relevance threshold. Support tickets on covered topics fell by about\
    \ a quarter, and the cost stayed under a cent per query. Next time I would build the evaluation set\
    \ before the first prototype.\"\n\n## Common mistakes\n- Listing tools without a problem or a result.\n\
    - Claiming success without an evaluation method.\n- Ignoring hallucinations, privacy or cost.\n- Taking\
    \ credit for team work without saying what you personally did.\n\n## In the interview\nSignals interviewers\
    \ score: problem framing, technical judgment, evaluation rigour, ownership, and honest reflection.\
    \ Expect follow-ups such as \"how did you measure quality?\", \"what failed?\", and \"how did you\
    \ handle sensitive data?\". Prepare one story ahead of time with real numbers.\n"
  match:
  - 411df5ad2238
  prompt: 1f344914
- id: kb-990e6f216d38
  question: What are the key considerations when building AI-driven features in a front-end application?
  answer: 'Design for latency and uncertainty: stream responses, show progress and allow cancelling; make
    outputs easy to verify, edit and undo; never expose API keys in the browser, so call models through
    your backend; handle errors, rate limits and cost; protect privacy; render model output safely; and
    measure quality with feedback and analytics.'
  topic: ai
  tags:
  - ai
  - frontend
  - ux
  - llm
  explanation: "## In plain words\nAI features feel different from normal UI: answers are slow, sometimes\
    \ wrong, and change from run to run. The front end's job is to make that uncertainty manageable for\
    \ users, while keeping secrets and data safe.\n\n## How it works\n- **Latency**: stream tokens as\
    \ they arrive, show skeletons or progress, support cancel (`AbortController`), and debounce requests\
    \ triggered by typing.\n- **Trust and control**: label AI content, show sources, let users edit, retry,\
    \ undo and give feedback (thumbs up or down).\n- **Security**: keep API keys on the server; a backend\
    \ endpoint adds auth, rate limits and logging. Treat model output as untrusted: render it as text\
    \ or sanitised Markdown to avoid XSS.\n- **Errors**: timeouts, rate limits and partial responses need\
    \ clear messages and fallbacks.\n- **Cost**: cache results, limit request size, avoid calling on every\
    \ keystroke.\n- **Privacy**: tell users what is sent, avoid sending sensitive fields, respect consent.\n\
    - **Accessibility**: announce streamed updates politely with ARIA live regions, keep focus stable.\n\
    - **Measure**: track acceptance rate, edits, retries and latency.\n\n## Example\n```js\nconst controller\
    \ = new AbortController();\nconst res = await fetch(\"/api/summarize\", {\n  method: \"POST\",\n \
    \ body: JSON.stringify({ text }),\n  signal: controller.signal,\n});\nconst reader = res.body.getReader();\n\
    const decoder = new TextDecoder();\nfor (;;) {\n  const { done, value } = await reader.read();\n \
    \ if (done) break;\n  output.textContent += decoder.decode(value, { stream: true });  // text, not\
    \ HTML\n}\n```\nA \"Stop\" button calls `controller.abort()`.\n\n## Common mistakes\n- Calling the\
    \ model provider directly from the browser with a secret key.\n- Inserting model output with `innerHTML`.\n\
    - Blocking the UI with a spinner for 20 seconds instead of streaming.\n- No way to correct or report\
    \ a bad answer.\n\n## In the interview\nGroup your answer into UX, security, performance and cost,\
    \ and measurement. Interviewers like concrete details (streaming, abort, sanitising) and product sense\
    \ (when to show confidence or sources). Follow-ups: offline or on-device models, and how to test non-deterministic\
    \ UI.\n"
  match:
  - 3f8159205ec5
  prompt: 1f344914
- id: kb-0d469d1ee3fe
  question: What is AutoML (automated machine learning)?
  answer: 'AutoML automates parts of building a machine learning model: data preprocessing, feature engineering,
    choosing among algorithms, tuning hyperparameters and sometimes designing neural architectures, then
    picks the best model by validation score. It speeds up baselines and helps non-experts, but still
    needs good data, sound evaluation and human judgment.'
  topic: ai
  tags:
  - automl
  - machine-learning
  - hyperparameter-tuning
  explanation: '## In plain words

    Building a model normally means a lot of trial and error: which algorithm, which settings, which features.
    AutoML is a robot assistant that runs those experiments for you and reports the best one, so people
    can focus on the problem and the data.


    ## How it works

    - **Search space**: candidate pipelines (preprocessing steps, model types such as gradient-boosted
    trees or linear models, and their hyperparameters).

    - **Search strategy**: random search, Bayesian optimisation, evolutionary methods, or early stopping
    of weak candidates (successive halving).

    - **Evaluation**: cross-validation or a holdout set picks the winner; ensembles of top models are
    common.

    - **Neural architecture search** extends this to network designs, at high compute cost.

    - **Tools**: open-source libraries (for example auto-sklearn, AutoGluon, FLAML) and managed cloud
    services.

    - **Limits**: it cannot fix bad or leaky data, define the right target, or judge fairness; results
    can be hard to explain, and compute costs add up.


    ## Example

    A team predicts customer churn from a table of 50 columns. They give an AutoML tool one hour and an
    AUC metric. It tries about 200 pipelines and returns a gradient-boosted model with AUC 0.86, versus
    0.79 for their hand-tuned logistic regression. The team then checks for leakage (a column recorded
    after customers left), removes it, and reruns to get an honest 0.83.


    ## Common mistakes

    - Trusting the leaderboard without checking for data leakage.

    - Thinking AutoML removes the need for domain knowledge.

    - Ignoring inference cost and latency of complex ensembles.

    - Overfitting to the validation set through very long searches.


    ## In the interview

    Define it, list what it automates, and be clear about its limits. Good follow-ups: hyperparameter
    search methods, when you would still hand-build a model (strict latency, explainability), and how
    you would validate an AutoML result before shipping.

    '
  match:
  - 0d469d1ee3fe
  prompt: 1f344914
