- id: kb-9c77ff0c78c2
  question: What is the difference between a Boolean wrapper object and a boolean primitive in JavaScript?
  answer: A boolean primitive is just `true` or `false`. `new Boolean(x)` creates an object that wraps
    a boolean, and since every object is truthy, `new Boolean(false)` is truthy. Calling `Boolean(x)`
    without `new` converts a value to a primitive boolean, which is the useful form.
  topic: web development
  tags:
  - javascript
  - types
  - primitives
  - coercion
  explanation: '## In plain words

    `true` and `false` are simple values. `new Boolean(false)` is a box with `false` written inside it,
    and in an `if` statement JavaScript only checks whether there is a box, not what is written in it.
    So the box always counts as true.


    ## How it works

    - `typeof true` is `"boolean"`; `typeof new Boolean(true)` is `"object"`.

    - Objects are always truthy, regardless of what they wrap.

    - `Boolean(value)` (no `new`) returns a primitive using truthiness rules; equivalent to `!!value`.

    - Falsy values: `false`, `0`, `-0`, `0n`, `""`, `null`, `undefined`, `NaN`. Everything else is truthy,
    including `"false"`, `[]` and `{}`.

    - Primitives get temporary wrapper objects automatically when you call methods on them, such as `true.toString()`.

    - `==` unwraps: `new Boolean(false) == false` is `true`, but `===` gives `false`.


    ## Example

    ```javascript

    const p = false;

    const o = new Boolean(false);


    console.log(typeof p, typeof o);   // "boolean" "object"

    if (o) console.log("runs!");       // runs!, objects are truthy

    console.log(o === false);          // false

    console.log(o.valueOf());          // false


    console.log(Boolean("false"));     // true (non-empty string)

    console.log([0, "", "a"].filter(Boolean));   // ["a"]

    ```


    ## Common mistakes

    - Using `new Boolean` and being surprised by truthiness.

    - Thinking the string `"false"` is falsy.

    - Comparing wrapper objects with `===`.


    ## In the interview

    Explain primitives versus wrapper objects, the truthiness trap, and recommend never using `new Boolean`,
    `new String` or `new Number`. Show `Boolean` as a conversion function, for instance `array.filter(Boolean)`
    to drop falsy items.

    '
