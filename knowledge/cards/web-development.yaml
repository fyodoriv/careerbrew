  question: What are CORS preflight requests?
  answer: A preflight is an automatic `OPTIONS` request the browser sends before a cross-origin request
    that is not "simple", for example one using `PUT`, a JSON content type or custom headers. The server
    must answer with matching `Access-Control-Allow-*` headers, or the browser blocks the real request.
  topic: web development
  tags:
  - cors
