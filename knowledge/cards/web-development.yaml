  question: What is a closure in JavaScript?
  answer: A closure is a function together with the variables from the scope where it was created. The
    function can keep reading and updating those variables even after the outer function has returned.
    Every function in JavaScript forms a closure.
  topic: web development
  tags:
  - javascript
  - closures
  - scope
  - functions
  explanation: "## In plain words\nWhen a function is created, it carries a backpack holding the variables\
    \ that were around it. Wherever the function goes, even long after the outer code has finished, it\
    \ can open the backpack and use them.\n\n## How it works\n- JavaScript uses lexical scope: what a\
    \ function can see depends on where it is written.\n- A function keeps a reference to its outer environment,\
    \ not a copy of the values. Changes are shared.\n- As long as the inner function is reachable, the\
    \ captured variables stay in memory.\n- Each call to the outer function creates a fresh environment,\
    \ so each returned function has its own private state.\n- Uses: private state, function factories,\
    \ callbacks and event handlers, memoisation, partial application, React hooks.\n\n## Example\n```javascript\n\
    function createCounter() {\n  let count = 0;                    // private: not reachable from outside\n\
    \  return {\n    increment: () => ++count,\n    current: () => count,\n  };\n}\n\nconst c1 = createCounter();\n\
    const c2 = createCounter();\nc1.increment();\nc1.increment();\nconsole.log(c1.current(), c2.current());\
    \   // 2 0\n\n// Classic loop puzzle\nfor (var i = 0; i < 3; i++) setTimeout(() => console.log(i));\
    \  // 3 3 3\nfor (let j = 0; j < 3; j++) setTimeout(() => console.log(j));  // 0 1 2\n```\n\n## Common\
    \ mistakes\n- Thinking the closure copies values at creation time; it holds live references.\n- The\
    \ `var` loop bug, where all callbacks share one variable.\n- Stale closures in React: an effect or\
    \ callback that captured an old state value.\n- Accidental memory retention when a long-lived callback\
    \ captures a large object.\n\n## In the interview\nGive a one-line definition, show a counter example,\
    \ then explain the loop puzzle. Mention practical uses (module pattern, debounce, memoisation) and\
    \ the memory and stale-value pitfalls.\n"
