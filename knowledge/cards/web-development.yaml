- id: kb-afec8ee0e253
  question: What are the falsy values in JavaScript?
  answer: The falsy values are false, 0, -0, 0n, the empty string, null, undefined, and NaN (plus the
    legacy document.all in browsers). Everything else, including '0', 'false', [], and {}, is truthy.
  topic: web development
  tags:
  - javascript
  - truthiness
  - type-coercion
  - booleans
  explanation: '## In plain words

    When JavaScript needs a yes-or-no answer, for example in an `if`, it converts the value to a boolean.
    A short fixed list of values turns into `false`; these are called falsy. Every other value turns into
    `true`.


    ## How it works

    - The list: `false`, `0`, `-0`, `0n` (BigInt zero), `''''`, `null`, `undefined`, `NaN`.

    - Conversion happens in `if`, `while`, the ternary operator, `!`, `&&`, and `||`.

    - `Boolean(x)` or `!!x` shows the result explicitly.

    - `||` returns the first truthy operand, so it replaces every falsy value, including valid ones like
    `0`.

    - `??` (nullish coalescing) only replaces `null` and `undefined`.


    ## Example

    ```javascript

    const values = [0, '''', ''0'', [], {}, null, NaN, ''false''];

    console.log(values.map(Boolean));

    // [false, false, true, true, true, false, false, true]


    const count = 0;

    console.log(count || 10); // 10, probably a bug

    console.log(count ?? 10); // 0

    ```


    ## Common mistakes

    - Thinking empty arrays or empty objects are falsy; check `arr.length` or `Object.keys(obj).length`.

    - Using `||` for defaults when `0` or `''''` are valid values.

    - Writing `if (x)` to mean ''x is defined'', which also rejects `0` and `''''`.

    - Forgetting `NaN` is falsy, which can hide a failed parse.


    ## In the interview

    List the values confidently, then show why it matters with the `||` versus `??` default. Interviewers
    like asking about `[]` and `''0''`. Mention that explicit checks (`x !== undefined`, `arr.length >
    0`) are clearer in code reviews than relying on truthiness.

    '
