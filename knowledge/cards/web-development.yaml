- id: kb-b31ee6071f07
  question: What are the differences between client-side rendering and server-side rendering?
  answer: With client-side rendering the browser downloads JavaScript and builds the HTML itself, so first
    paint is slower but later navigation feels app-like. With server-side rendering the server sends ready
    HTML, giving faster first content and better SEO, at the cost of server work and hydration.
  topic: web development
  tags:
  - web
  - rendering
  - ssr
  - csr
  - performance
  explanation: '## In plain words

    Rendering means turning data into the HTML a user sees. In client-side rendering (CSR), the server
    sends an almost empty page plus a JavaScript bundle, and the browser builds the page. In server-side
    rendering (SSR), the server builds the HTML for each request and sends it complete, then JavaScript
    makes it interactive.


    ## How it works

    - CSR: request, empty shell, download and run the bundle, fetch data, render. Content appears late;
    subsequent route changes are fast and need no full reload.

    - SSR: request, server fetches data and renders HTML, browser shows it at once, then hydration attaches
    event handlers. Good First Contentful Paint and crawlability.

    - Static site generation (SSG) renders at build time, so pages are served from a CDN.

    - Hybrid approaches: incremental regeneration, streaming SSR, and server components send less JavaScript.

    - Key metrics: Time to First Byte, Largest Contentful Paint, Interaction to Next Paint.


    ## Example

    A product page with prices that change often fits SSR: users and search engines see content immediately.
    An internal dashboard behind a login fits CSR: SEO does not matter and rich interactivity does. A
    blog fits SSG: content changes rarely and pages can be cached globally.


    ## Common mistakes

    - Saying SSR is always faster; slow server data fetching can make Time to First Byte worse.

    - Forgetting hydration cost: the page can look ready but not respond to clicks yet.

    - Hydration mismatches when server and client render different output, for example from dates or random
    values.

    - Ignoring caching, which often matters more than the rendering mode.


    ## In the interview

    Compare on first load, interactivity, SEO, server cost, and complexity. Then pick per page, not per
    app: most modern frameworks mix modes. Expect follow-ups on hydration, streaming, CDN caching, and
    how you would measure the difference with Core Web Vitals.

    '
