  question: What is NaN in JavaScript?
  answer: '`NaN` ("Not a Number") is a special value of type `number` that represents the result of an
    invalid numeric operation, such as `0 / 0` or `Number("abc")`. It is the only value not equal to itself,
    so you test for it with `Number.isNaN(x)`.'
  topic: web development
  tags:
  - javascript
  - numbers
  - types
  - equality
  explanation: "## In plain words\n`NaN` is how JavaScript says \"this calculation has no meaningful numeric\
    \ answer\". Oddly, it is still a number type, and it spreads: any arithmetic with `NaN` gives `NaN`.\n\
    \n## How it works\n- Comes from IEEE 754 floating-point, the number format JavaScript uses.\n- Produced\
    \ by: `0 / 0`, `Math.sqrt(-1)`, `parseInt(\"x\")`, `Number(undefined)`, `\"a\" * 2`.\n- `typeof NaN\
    \ === \"number\"`.\n- `NaN === NaN` is `false`, and so is `NaN == NaN`.\n- Checking:\n  - `Number.isNaN(x)`:\
    \ true only for the actual `NaN` value. Preferred.\n  - Global `isNaN(x)`: converts first, so `isNaN(\"\
    hello\")` is `true`. Misleading.\n  - `Object.is(x, NaN)`: also correct.\n- `[NaN].includes(NaN)`\
    \ is `true` (uses SameValueZero), but `[NaN].indexOf(NaN)` is `-1`.\n- Comparisons with `NaN` (`<`,\
    \ `>`, `<=`) are always `false`.\n\n## Example\n```javascript\nconst n = Number(\"12px\");\nconsole.log(n);\
    \                    // NaN\nconsole.log(typeof n);             // \"number\"\nconsole.log(n === NaN);\
    \            // false\nconsole.log(Number.isNaN(n));      // true\nconsole.log(isNaN(\"hello\"));\
    \       // true (coerced)\nconsole.log(Number.isNaN(\"hello\"));// false\nconsole.log(NaN <= 0, NaN\
    \ > 0);    // false false\n```\n\n## Common mistakes\n- Checking with `=== NaN`.\n- Using global `isNaN`\
    \ on strings.\n- Validating input with `x <= 0` and letting `NaN` through, since every comparison\
    \ is false. Use `Number.isFinite`.\n\n## In the interview\nDefine it, explain the self-inequality,\
    \ and recommend `Number.isNaN` and `Number.isFinite`. Mention where it hides in real code: parsing\
    \ form input and dividing by a zero count when averaging.\n"
