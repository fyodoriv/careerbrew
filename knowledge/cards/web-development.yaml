  question: How does Array.prototype.sort work in JavaScript?
  answer: sort orders the array in place and returns it. Without a comparator it converts elements to
    strings and compares UTF-16 code units, so [10, 9, 1].sort() gives [1, 10, 9]. Pass a comparator returning
    negative, zero, or positive, such as (a, b) => a - b. Since ES2019 the sort must be stable.
  topic: web development
  tags:
  - javascript
  - arrays
  - sorting
  - comparators
  explanation: "## In plain words\n`sort` rearranges the array itself. By default it treats every element\
    \ as text, which is right for words but wrong for numbers. A comparator function tells it how to compare\
    \ two items: return a negative number if `a` should come first, positive if `b` should, and zero if\
    \ they tie.\n\n## How it works\n- Default order: convert to strings, compare by UTF-16 code units.\
    \ `undefined` values go to the end.\n- Comparator contract: `compare(a, b) < 0` means `a` before `b`.\
    \ It must be consistent, or results are unspecified.\n- Numbers ascending: `(a, b) => a - b`. Descending:\
    \ `(a, b) => b - a`.\n- Strings with locale rules: `a.localeCompare(b)` or `Intl.Collator`.\n- Stable:\
    \ equal items keep their original order, which allows multi-key sorting.\n- Engines use O(n log n)\
    \ algorithms (V8 uses TimSort).\n- `toSorted` (ES2023) returns a sorted copy without mutating.\n\n\
    ## Example\n```javascript\nconsole.log([10, 9, 1].sort());              // [1, 10, 9]\nconsole.log([10,\
    \ 9, 1].sort((a, b) => a - b)); // [1, 9, 10]\n\nconst people = [\n  { name: 'Bo', age: 30 },\n  {\
    \ name: 'Al', age: 25 },\n  { name: 'Cy', age: 30 },\n];\npeople.sort((a, b) => b.age - a.age || a.name.localeCompare(b.name));\n\
    console.log(people.map(p => p.name)); // ['Bo', 'Cy', 'Al']\n```\n\n## Common mistakes\n- Sorting\
    \ numbers without a comparator.\n- Returning a boolean like `a > b`, which breaks the contract.\n\
    - Forgetting that `sort` mutates, for example sorting props or state in React.\n- Using `a - b` on\
    \ values that can be `NaN` or strings.\n\n## In the interview\nState the default string comparison,\
    \ the comparator contract, in-place mutation, and stability. Mention `toSorted` and `localeCompare`.\
    \ If asked about complexity, say O(n log n) time; space depends on the engine (TimSort uses up to\
    \ O(n) extra).\n"
