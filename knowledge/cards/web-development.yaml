  question: How do you sort the characters of a string in JavaScript?
  answer: 'Split the string into characters, sort the array, and join it: [...str].sort().join('''').
    Spread splits by Unicode code points, which is safer than split(''''). Use localeCompare in the comparator
    for language-aware order. It runs in O(n log n).'
  topic: web development
  tags:
  - javascript
  - strings
  - sorting
  - unicode
  explanation: "## In plain words\nStrings are immutable and have no `sort` method, but arrays do. So\
    \ you turn the string into an array of characters, sort that, and glue the characters back together.\
    \ This is a common building block, for example to check whether two words are anagrams.\n\n## How\
    \ it works\n- `[...str]` or `Array.from(str)` splits by code points, so emoji and other characters\
    \ outside the basic plane stay whole. `str.split('')` splits by UTF-16 code units and can break them.\n\
    - Default `sort()` compares by UTF-16 code units: uppercase letters come before lowercase, and accented\
    \ letters come after `z`.\n- `sort((a, b) => a.localeCompare(b))` uses language rules.\n- Combined\
    \ characters (letter plus accent mark) or emoji sequences are several code points; use `Intl.Segmenter`\
    \ to split by what users see as one character.\n- Time O(n log n), space O(n).\n\n## Example\n```javascript\n\
    const sortChars = (s) => [...s].sort().join('');\n\nconsole.log(sortChars('banana')); // 'aaabnn'\n\
    console.log(sortChars('bBa'));    // 'Bab', uppercase first\n\nconst isAnagram = (a, b) =>\n  a.length\
    \ === b.length && sortChars(a) === sortChars(b);\nconsole.log(isAnagram('listen', 'silent')); // true\n\
    \nconst locale = [...'éaz'].sort((x, y) => x.localeCompare(y)).join('');\nconsole.log(locale); //\
    \ 'aéz'\n```\n\n## Common mistakes\n- Calling `str.sort()`, which does not exist.\n- Forgetting `join('')`;\
    \ `join()` alone adds commas.\n- Using `split('')` on text with emoji.\n- Using sort for anagram checks\
    \ on long strings when an O(n) character count would do.\n\n## In the interview\nShow the one-liner,\
    \ mention Unicode safety, and state complexity. Then offer the faster anagram approach: count characters\
    \ with a `Map` or a 26-slot array in O(n). Interviewers appreciate hearing about case and locale:\
    \ ask whether 'A' and 'a' should be treated the same.\n"
