  question: How do the increment (++) and decrement (--) operators work in JavaScript?
  answer: x++ (postfix) returns the old value and then adds one; ++x (prefix) adds one and returns the
    new value. Both convert the operand to a number (or keep it a BigInt) and need a variable or property,
    not a literal.
  topic: web development
  tags:
  - javascript
  - operators
  - increment
  - numbers
  explanation: '## In plain words

    `++` adds one to a variable and `--` subtracts one. The position matters only when you use the result
    of the expression. Postfix (`i++`) means ''give me the current value, then bump it''. Prefix (`++i`)
    means ''bump it, then give me the new value''.


    ## How it works

    - Both modify the variable in place, so the operand must be assignable: `5++` is a SyntaxError.

    - The value is converted with `Number()` first (BigInts stay BigInts): `''5''` becomes 5, then 6.
    A non-numeric string becomes `NaN`.

    - Using `++` on a `const` throws a `TypeError`.

    - On their own line (`i++;`) prefix and postfix behave the same.

    - `x += 1` is equivalent to `++x` for numbers but does string concatenation if `x` is a string.


    ## Example

    ```javascript

    let a = 5;

    const b = a++; // b = 5, a = 6

    const c = ++a; // c = 7, a = 7


    let s = ''5'';

    s++;

    console.log(s, typeof s); // 6 ''number''


    let t = ''5'';

    t += 1;

    console.log(t); // ''51''


    const arr = [10, 20];

    let i = 0;

    console.log(arr[i++], i); // 10 1

    ```


    ## Common mistakes

    - Mixing up prefix and postfix inside larger expressions.

    - Using `++` several times on the same variable in one expression, which is legal but hard to read.

    - Expecting `++` to concatenate strings like `+=`.

    - Relying on automatic semicolon insertion: a line break before `++` attaches it to the next line.


    ## In the interview

    Explain prefix versus postfix with a two-line example, and mention the number conversion. Many style
    guides discourage `++` outside simple loops because of readability; you can say you prefer `+= 1`
    in complex expressions. Be ready to predict the output of a short snippet.

    '
