- id: kb-074f3c5db192
  question: What does rel="preconnect" do in HTML?
  answer: '`<link rel="preconnect" href="https://cdn.example.com">` tells the browser to open a connection
    to another origin early, doing the DNS lookup, TCP handshake and TLS negotiation before any request
    needs it. When the request comes, it can start immediately.'
  topic: web development
  tags:
  - performance
  - html
  - resource-hints
  - networking
  explanation: "## In plain words\nConnecting to a new server takes several round trips before a single\
    \ byte of content flows. Preconnect does that setup work in advance, like warming up a car before\
    \ you need to drive.\n\n## How it works\n- Performs DNS resolution, the TCP handshake and, for HTTPS,\
    \ the TLS handshake.\n- Downloads nothing by itself.\n- Add `crossorigin` when the resources will\
    \ be fetched in CORS mode (fonts, `fetch` with CORS), because browsers keep separate connections for\
    \ credentialed and anonymous requests.\n- Browsers close unused connections after roughly 10 seconds,\
    \ so only preconnect to origins used early in the page load.\n- Each open connection costs CPU and,\
    \ on mobile, battery; limit it to the two to four most important origins.\n- Can also be sent as an\
    \ HTTP header: `Link: <https://cdn.example.com>; rel=preconnect`.\n- `dns-prefetch` is the cheaper\
    \ fallback that only does DNS.\n\n## Example\n```html\n<head>\n  <!-- Fonts are requested by CSS later;\
    \ set up the connection now -->\n  <link rel=\"preconnect\" href=\"https://fonts.example.com\" crossorigin>\n\
    \  <link rel=\"preconnect\" href=\"https://api.example.com\">\n  <link rel=\"stylesheet\" href=\"\
    /styles.css\">\n</head>\n```\nOn a mobile network with a 100 ms round trip, DNS plus TCP plus TLS\
    \ can take 300 ms or more, which preconnect moves off the critical path.\n\n## Common mistakes\n-\
    \ Preconnecting to many origins, wasting connections that time out unused.\n- Forgetting `crossorigin`\
    \ for fonts, so the warmed connection is not reused.\n- Preconnecting to your own origin, which is\
    \ already connected.\n\n## In the interview\nExplain what work it saves, compare it with `dns-prefetch`,\
    \ `preload` and `prefetch`, and describe how you would verify the effect in a waterfall chart. Mention\
    \ it pays off most for third-party origins on the critical path, such as font or image CDNs.\n"
