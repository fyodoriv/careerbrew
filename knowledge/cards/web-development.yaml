    \ same function can see a different `this` each time it is called.\n\n## How it works\nRules, from\
    \ highest to lowest priority:\n- `new F()`: `this` is the brand-new object.\n- Explicit: `f.call(obj)`,\
    \ `f.apply(obj)`, or a function from `f.bind(obj)` (bind wins over call later).\n- Method call: `obj.f()`\
    \ sets `this` to `obj`.\n- Plain call `f()`: `undefined` in strict mode and modules, the global object\
    \ in sloppy scripts.\n- Arrow functions skip all rules and use the `this` of the enclosing scope.\n\
    - In classes, method bodies are strict, so a detached method gets `undefined`.\n- DOM event handlers\
    \ set `this` to the element (for regular functions).\n\n## Example\n```javascript\n'use strict';\n\
    const counter = {\n  n: 0,\n  inc() { this.n++; return this.n; },\n};\ncounter.inc();            //\
    \ 1, this = counter\n\nconst inc = counter.inc;\n// inc();                 // TypeError: this is undefined\n\
    \nconst bound = counter.inc.bind(counter);\nbound();                  // 2\n\nsetTimeout(() => counter.inc(),\
    \ 0); // safe: arrow calls it as a method\n```\n\n## Common mistakes\n- Passing `obj.method` as a\
    \ callback and losing `this`.\n- Using arrow functions as object methods.\n- Thinking `this` refers\
    \ to the function itself or to its lexical scope for regular functions.\n- Forgetting that `bind`\
    \ creates a new function, so it cannot be removed with the original reference in `removeEventListener`.\n\
    \n## In the interview\nList the four call-site rules plus arrows, in priority order, and show the\
