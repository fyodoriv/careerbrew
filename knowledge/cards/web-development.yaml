  question: What is the difference between server-side rendering (SSR) and static site generation (SSG)?
  answer: SSR builds the HTML on the server for each request, so content is always fresh and can be personalised,
    at the cost of server work and slower time to first byte. SSG builds the HTML once at build time and
    serves it as static files from a CDN, which is fast and cheap but stale until the next build.
