- id: kb-5698033d16f8
  question: What does "use strict" change in JavaScript?
  answer: 'Strict mode turns silent mistakes into errors and removes confusing features: assigning to
    undeclared variables throws, writes to read-only properties throw, `this` is `undefined` in plain
    function calls, duplicate parameter names and `with` are banned. ES modules and class bodies are strict
    automatically.'
  topic: web development
  tags:
  - javascript
  - strict-mode
  - best-practices
  explanation: "## In plain words\nStrict mode is an opt-in, stricter version of JavaScript. Code that\
    \ would quietly do the wrong thing in normal (\"sloppy\") mode fails loudly instead, which catches\
    \ bugs early and lets engines optimise better.\n\n## How it works\n- Enable it with `\"use strict\"\
    ;` as the first statement of a script or a function. Modules and classes are always strict.\n- Main\
    \ changes:\n  - Assigning to an undeclared variable throws `ReferenceError` instead of creating a\
    \ global.\n  - Assigning to read-only or getter-only properties, or adding properties to frozen objects,\
    \ throws `TypeError`.\n  - `this` is `undefined` in functions called without an object, instead of\
    \ the global object.\n  - Duplicate parameter names are a syntax error.\n  - `with` is forbidden;\
    \ `eval` gets its own scope.\n  - `delete` on a plain variable is a syntax error.\n  - Octal literals\
    \ like `010` are forbidden.\n  - `arguments` no longer stays in sync with named parameters.\n  - Future\
    \ reserved words (`implements`, `package`, `private`...) cannot be used as names.\n\n## Example\n\
    ```javascript\n\"use strict\";\n\nfunction show() { return this; }\nconsole.log(show());         \
    \     // undefined (sloppy mode: global object)\n\nconst frozen = Object.freeze({ a: 1 });\ntry {\
    \ frozen.a = 2; } catch (e) { console.log(e.name); }   // TypeError\n\ntry { total = 5; } catch (e)\
    \ { console.log(e.name); }      // ReferenceError\n```\n\n## Common mistakes\n- Placing the directive\
    \ after other statements, where it is ignored.\n- Concatenating a strict file with sloppy files and\
    \ changing behaviour unexpectedly.\n- Adding it in modules, where it is redundant.\n\n## In the interview\n\
    List the most important changes, explain the benefit (fail fast, safer `this`, optimisable code) and\
    \ note that modern code written as ES modules or classes is already strict. Mention that linters and\
    \ TypeScript catch many of the same problems.\n"
