- id: kb-a366bd43e915
  question: How do you optimize a website's performance, and what are the most common JavaScript performance
    issues?
  answer: 'Measure first (Lighthouse, the browser Performance panel, real-user Core Web Vitals), then
    fix the biggest cost: ship less JavaScript (code splitting, tree shaking), optimize images and fonts,
    cache and compress assets, and avoid long main-thread tasks and layout thrashing. Common JS issues
    are large bundles, unnecessary re-renders, memory leaks, and expensive work on every scroll or input
    event.'
  topic: web development
  tags:
  - web
  - performance
  - core-web-vitals
  - javascript
  - optimization
  explanation: "## In plain words\nA fast site sends less, sends it sooner, and keeps the main thread\
    \ free so the page responds quickly. The browser has one main thread for JavaScript, layout, and painting;\
    \ anything that blocks it makes the page feel frozen. Always measure before changing anything, so\
    \ you fix the real bottleneck.\n\n## How it works\n- Measure: Largest Contentful Paint (loading),\
    \ Interaction to Next Paint (responsiveness), Cumulative Layout Shift (visual stability), using lab\
    \ tools and real-user monitoring.\n- Network: compress (gzip or Brotli), set long cache lifetimes\
    \ on hashed files, use a CDN, preload critical resources, and lazy-load below-the-fold images.\n-\
    \ Assets: modern image formats, correct sizes, `width` and `height` attributes to prevent layout shift,\
    \ and fewer, subset fonts.\n- JavaScript: code-split by route, remove unused dependencies, defer non-critical\
    \ scripts, and break long tasks into chunks or move them to a Web Worker.\n- Rendering: avoid reading\
    \ layout (such as `offsetHeight`) right after writing styles in a loop; debounce or throttle scroll\
    \ and input handlers; virtualize long lists.\n- Memory: remove listeners and timers you no longer\
    \ need.\n\n## Example\n```javascript\n// Throttle expensive work to one call per animation frame\n\
    let scheduled = false;\nwindow.addEventListener('scroll', () => {\n  if (scheduled) return;\n  scheduled\
    \ = true;\n  requestAnimationFrame(() => {\n    updateHeader(window.scrollY);\n    scheduled = false;\n\
    \  });\n}, { passive: true });\n\n// Load a heavy module only when needed\nbutton.addEventListener('click',\
    \ async () => {\n  const { openEditor } = await import('./editor.js');\n  openEditor();\n});\n```\n\
    \n## Common mistakes\n- Optimizing without measuring.\n- Micro-optimizing loops while shipping megabytes\
    \ of JavaScript.\n- Only testing on a fast laptop; test on a mid-range phone with a throttled network.\n\
    - Adding caching without a plan to invalidate it.\n\n## In the interview\nStructure the answer as\
    \ measure, find the bottleneck, fix, re-measure. Name Core Web Vitals and one fix for each. A strong\
    \ answer includes a fictional but concrete story, such as cutting a bundle in half by lazy-loading\
    \ a chart library, with before and after numbers.\n"
