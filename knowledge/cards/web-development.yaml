- id: kb-84eff4695596
  question: Can you add a method to objects that were already created from a prototype in JavaScript?
  answer: Yes. Objects look up missing properties on their prototype at access time, so adding a method
    to the prototype makes it available to every existing and future instance immediately.
  topic: web development
  tags:
  - javascript
  - prototypes
  - inheritance
  - objects
  explanation: "## In plain words\nObjects do not copy methods from their prototype; they keep a link\
    \ to it. When you call `obj.method()`, the engine looks on the object first and then follows the link.\
    \ So if you add a method to the prototype later, old objects find it too, because the lookup happens\
    \ at call time.\n\n## How it works\n- Each object has an internal `[[Prototype]]` link, set by `new`,\
    \ `Object.create`, or a class.\n- Property access walks the chain: own properties, then the prototype,\
    \ then its prototype, up to `Object.prototype` and `null`.\n- Adding to `Constructor.prototype` or\
    \ `Class.prototype` affects all instances sharing it.\n- An own property with the same name shadows\
    \ the prototype one.\n\n## Example\n```javascript\nclass Point {\n  constructor(x, y) { this.x = x;\
    \ this.y = y; }\n}\nconst p = new Point(3, 4);\n\nPoint.prototype.length = function () {\n  return\
    \ Math.hypot(this.x, this.y);\n};\n\nconsole.log(p.length()); // 5, though p was created earlier\n\
    ```\n\n## Common mistakes\n- Thinking methods are copied into each instance at creation.\n- Patching\
    \ built-in prototypes like `Array.prototype` in shared code; it can clash with future standard methods\
    \ and other libraries.\n- Replacing the whole `prototype` object after instances exist; old instances\
    \ keep pointing to the old one.\n- Using an arrow function for the method, which breaks `this`.\n\n\
    ## In the interview\nExplain the live prototype link and lookup at access time. Interviewers may ask\
    \ about the risks of monkey-patching built-ins; mention name collisions and why polyfills check `if\
    \ (!Array.prototype.x)` first. Mention memory: shared prototype methods are stored once, while methods\
    \ created in a constructor are created per instance.\n"
  match:
