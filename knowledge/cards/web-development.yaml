  question: What is the best way to serve a static-site-generated website to users?
  answer: Build the HTML, CSS and JavaScript once at deploy time, upload them to object storage or a static
    host, and serve them through a CDN. Use long-lived cache headers for fingerprinted assets, short or
    revalidated caching for HTML, and invalidate or redeploy when content changes.
  topic: web development
  tags:
  - ssg
  - cdn
  - caching
  - deployment
  - performance
  explanation: "## In plain words\nA static site is just files. The fastest way to deliver files is to\
    \ copy them to many servers around the world (a CDN) so each user downloads from one close by, and\
    \ to let browsers keep them as long as possible.\n\n## How it works\n1. **Build**: the generator fetches\
    \ content (Markdown, a CMS) and writes HTML plus assets. Asset file names include a content hash,\
    \ such as `app.3f9a1c.js`.\n2. **Store**: upload to object storage or a static hosting platform.\n\
    3. **Serve via CDN**: edge servers cache files close to users and handle TLS, HTTP/2 or HTTP/3, and\
    \ compression (Brotli or gzip).\n4. **Cache headers**:\n   - Hashed assets: `Cache-Control: public,\
    \ max-age=31536000, immutable`.\n   - HTML: `max-age=0, must-revalidate` or a short CDN TTL, so new\
    \ deploys show up quickly.\n5. **Updates**: a content change triggers a CI build and deploy, then\
    \ a CDN purge for changed HTML. Incremental regeneration rebuilds only changed pages for large sites.\n\
    6. **Extras**: atomic deploys with instant rollback, preview deploys per branch, edge functions for\
    \ redirects or small dynamic bits.\n\n## Example\n```http\nGET /blog/post-1/           -> Cache-Control:\
    \ public, max-age=0, must-revalidate\nGET /assets/app.3f9a1c.js   -> Cache-Control: public, max-age=31536000,\
    \ immutable\n```\nA user in Sydney gets both from a Sydney edge in about 20 ms instead of 250 ms from\
    \ a single origin server in Europe.\n\n## Common mistakes\n- Caching HTML for a long time, so users\
    \ see stale pages after a deploy.\n- Not fingerprinting assets, which forces short caching everywhere.\n\
    - Full rebuilds of thousands of pages for one small change.\n\n## In the interview\nWalk through build,\
    \ storage, CDN and caching, and explain the HTML versus asset caching split. Mention deployment safety\
    \ (atomic deploys, rollbacks) and when the content changes too often for SSG, pointing to incremental\
    \ regeneration or SSR.\n"
