  question: How do you check whether a value is null or undefined in JavaScript?
  answer: Use value == null (loose equality), which is true only for null and undefined. The explicit
    form is value === null || value === undefined. The ?? and ?. operators also treat exactly these two
    values as missing.
  topic: web development
  tags:
  - javascript
  - 'null'
  - undefined
  - equality
  - nullish
  explanation: "## In plain words\n`null` and `undefined` both mean 'no value', and you often want to\
    \ treat them the same. Loose equality has a special rule: `null` and `undefined` equal each other\
    \ and nothing else. That makes `x == null` a short, safe check for both.\n\n## How it works\n- `x\
    \ == null` is true for `null` and `undefined` only; `0`, `''`, `false`, and `NaN` give `false`.\n\
    - `x === null || x === undefined` says the same thing explicitly; some lint configs require it.\n\
    - `x ?? fallback` uses the fallback only for these two values.\n- `x?.prop` returns `undefined` instead\
    \ of throwing when `x` is null or undefined.\n- `typeof x === 'undefined'` is useful for variables\
    \ that may not be declared at all, such as browser globals in server code.\n- TypeScript narrows `x`\
    \ after `x != null` to exclude both.\n\n## Example\n```javascript\nconst isNil = (v) => v == null;\n\
    \nconsole.log([null, undefined, 0, '', false].map(isNil));\n// [true, true, false, false, false]\n\
    \nconst config = { port: 0 };\nconst port = config.port ?? 8080; // 0, keeps a valid zero\nconst host\
    \ = config.server?.host ?? 'localhost';\n\nif (typeof window === 'undefined') {\n  console.log('not\
