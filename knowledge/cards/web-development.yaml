  question: What is a WeakMap in JavaScript?
  answer: 'A WeakMap is a key-value collection whose keys must be objects (or non-registered symbols)
    and are held weakly: if nothing else references a key, the garbage collector can remove it and its
    value. Because of that it is not iterable and has no `size`.'
  topic: web development
  tags:
  - javascript
  - weakmap
  - memory
  - data-structures
  explanation: "## In plain words\nA normal `Map` holds on to its keys forever, so anything you store\
    \ keeps living. A WeakMap is like sticking a note on an object: when the object is thrown away, the\
    \ note goes with it. It is ideal for attaching extra data to objects you do not own.\n\n## How it\
    \ works\n- Methods: `set`, `get`, `has`, `delete`. No `keys`, `values`, `forEach`, `clear` or `size`.\n\
    - Keys must be objects (since ES2023 also non-registered symbols); primitives throw a `TypeError`.\n\
    - The reference from the WeakMap to the key does not keep it alive. When the key becomes unreachable\
    \ elsewhere, the entry disappears at some later garbage collection.\n- It cannot be iterated because\
    \ its contents depend on when garbage collection runs, which is non-deterministic.\n- Relatives: `WeakSet`\
    \ (objects only, membership), `WeakRef` and `FinalizationRegistry` (lower-level, rarely needed).\n\
    \n## Example\n```javascript\nconst clicks = new WeakMap();\n\nfunction track(element) {\n  clicks.set(element,\
    \ (clicks.get(element) ?? 0) + 1);\n}\n\nlet btn = document.createElement(\"button\");\ntrack(btn);\n\
    track(btn);\nconsole.log(clicks.get(btn));   // 2\n\nbtn = null;   // once nothing else holds the\
    \ button, its entry can be collected\n```\n\n## Common mistakes\n- Using strings or numbers as keys.\n\
    - Expecting to list or count entries.\n- Assuming entries vanish immediately after you drop the reference.\n\
    \n## In the interview\nUse cases to mention: caching computed results per object (memoisation keyed\
    \ by object), storing private data for class instances (before `#private` fields), and metadata on\
    \ DOM nodes without leaks. Contrast with `Map` on key types, iteration and memory behaviour.\n"
