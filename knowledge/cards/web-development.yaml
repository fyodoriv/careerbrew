  question: How do you check whether a property exists on an object in TypeScript?
  answer: Use the in operator ('key' in obj), which also narrows union types, or Object.hasOwn(obj, 'key')
    for own properties only. Checking obj.key !== undefined tests the value, not existence. For optional
    properties, TypeScript then narrows the type after the check.
  topic: web development
  tags:
  - typescript
  - objects
  - type-narrowing
  - in-operator
  explanation: "## In plain words\nThere are two different questions: 'does this object have this key\
    \ at all?' and 'does this key hold a real value?' TypeScript adds a third concern: after you check,\
    \ the compiler should know the more specific type. The `in` operator answers the first question and\
    \ helps the compiler.\n\n## How it works\n- `'key' in obj` is true for own and inherited properties,\
    \ even if the value is `undefined`. For a union like `Cat | Dog`, it narrows to the members that declare\
    \ that key.\n- `Object.hasOwn(obj, 'key')` (or the older `Object.prototype.hasOwnProperty.call`) ignores\
    \ inherited properties. It does not narrow types on its own.\n- `obj.key !== undefined` checks the\
    \ value and narrows optional properties to their non-undefined type.\n- For `unknown` values, first\
    \ check `typeof v === 'object' && v !== null`, then use `in`.\n- Optional chaining `obj.a?.b` reads\
    \ safely without a separate check.\n\n## Example\n```typescript\ntype Cat = { meow: () => void };\n\
    type Dog = { bark: () => void };\n\nfunction speak(pet: Cat | Dog) {\n  if ('meow' in pet) pet.meow();\
    \ // pet is Cat\n  else pet.bark();               // pet is Dog\n}\n\ninterface Options { retries?:\
    \ number }\nfunction run(o: Options) {\n  if (o.retries !== undefined) {\n    const r: number = o.retries;\
    \ // narrowed\n    console.log(r);\n  }\n}\n```\n\n## Common mistakes\n- Using `if (obj.key)`, which\
    \ also rejects `0`, `''`, and `false`.\n- Forgetting that `in` sees inherited properties, such as\
    \ `'toString' in {}` being true.\n- Using `in` on a primitive, which throws at runtime.\n- Expecting\
    \ `hasOwnProperty` to narrow a union.\n\n## In the interview\nSeparate existence from value and own\
    \ from inherited, then show how `in` narrows unions. Mention discriminated unions with a `kind` field\
    \ as the cleaner design when you control the types. Follow-ups may involve the `unknown` type and\
    \ writing a type guard.\n"
