  question: How would you serve static pages for A/B testing in Next.js?
  answer: Pre-render one static page per variant, then use a request interceptor (proxy.ts in Next.js
    16+, formerly Middleware) to assign each visitor to a variant, store it in a cookie for stickiness,
    and rewrite the request to that variant's static page. Users keep the same URL, pages stay cached
    on the CDN, and there is no flicker.
  topic: web development
  tags:
  - nextjs
  - ab-testing
  - middleware
  - proxy
  - ssg
  explanation: "## In plain words\nClient-side A/B tests often show the original page first and then swap\
    \ content, which flickers and hurts performance. The edge approach decides the variant before the\
    \ page is served, and both variants are ordinary static files, so it stays fast.\n\n## How it works\n\
    1. Build each variant as a static route under `/home/`, one per bucket: `a` and `b`.\n2. Add a request\
    \ interceptor: `proxy.ts` in Next.js 16 and later (it was called `middleware.ts` before; the old name\
    \ is deprecated). It runs before routing, and many hosts run it close to the user.\n3. In the proxy,\
    \ read a cookie such as `bucket`. If missing, assign one randomly (or with a feature-flag service)\
    \ according to the traffic split.\n4. Rewrite (not redirect) the request to the variant path, so the\
    \ browser URL stays `/home`.\n5. Set the cookie on the response so the user stays in the same bucket.\n\
    6. Log exposure and conversion events with the bucket to analyse results.\n\n## Example\n```typescript\n\
    // proxy.ts (Next.js 16+; in older versions: middleware.ts with `export function middleware`)\nimport\
    \ { NextResponse, type NextRequest } from \"next/server\";\n\nexport const config = { matcher: \"\
    /home\" };\n\nexport function proxy(req: NextRequest) {\n  const bucket = req.cookies.get(\"bucket\"\
    )?.value ?? (Math.random() < 0.5 ? \"a\" : \"b\");\n  const url = req.nextUrl.clone();\n  url.pathname\
    \ = `/home/${bucket}`;\n  const res = NextResponse.rewrite(url);\n  res.cookies.set(\"bucket\", bucket,\
    \ { maxAge: 60 * 60 * 24 * 30 });\n  return res;\n}\n```\n\n## Common mistakes\n- Redirecting instead\
    \ of rewriting, which changes the URL and adds a round trip.\n- Not making the assignment sticky,\
    \ so users see both variants.\n- Caching a single shared HTML response that ignores the cookie.\n\
    - Calling the experiment early without enough traffic for statistical significance.\n\n## In the interview\n\
    Compare the options: client-side swap (simple, flicker), SSR per request (flexible, costs server time)\
    \ and a proxy (middleware) rewrite to static variants (fast and flicker-free). Mention stickiness,\
    \ exposure logging, SEO (canonical URL) and cleaning up the losing variant afterwards.\n"
