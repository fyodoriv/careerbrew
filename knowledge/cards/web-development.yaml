  question: How does authentication work with Firebase Authentication?
  answer: The client signs the user in through the Firebase Auth SDK (password, email link, phone, or
    an OAuth provider). Firebase returns a short-lived ID token (a signed JWT) plus a refresh token; the
    SDK refreshes the ID token automatically, and your backend or security rules verify the token to identify
    the user.
  topic: web development
  tags:
  - web
  - authentication
  - firebase
  - jwt
  - security
  explanation: "## In plain words\nFirebase Authentication is a hosted sign-in service. Your app asks\
    \ it to sign a user in; Firebase checks the credentials and gives the app a signed token that says\
    \ 'this is user X'. Anything that needs to know who the user is, such as your API or Firebase's own\
    \ database rules, checks that token instead of a password.\n\n## How it works\n- The client SDK runs\
    \ the sign-in flow: email and password, email link, phone with SMS code, anonymous, or federated providers\
    \ via OAuth popup or redirect.\n- On success the SDK holds an ID token (a JWT, valid for about an\
    \ hour) and a long-lived refresh token, and it renews the ID token in the background.\n- `onAuthStateChanged`\
    \ notifies the app when the user signs in or out.\n- Firestore and Storage security rules read the\
    \ token through `request.auth`.\n- Your own server receives the ID token in an `Authorization: Bearer`\
    \ header and verifies it with the Admin SDK, which checks the signature, expiry, and project.\n- Custom\
    \ claims (set by the Admin SDK) add roles to the token.\n\n## Example\n```javascript\nimport { getAuth,\
    \ signInWithEmailAndPassword, onAuthStateChanged } from 'firebase/auth';\n\nconst auth = getAuth();\n\
    onAuthStateChanged(auth, async (user) => {\n  if (!user) return;\n  const token = await user.getIdToken();\n\
    \  await fetch('/api/profile', {\n    headers: { Authorization: `Bearer ${token}` },\n  });\n});\n\
    \nawait signInWithEmailAndPassword(auth, 'demo@example.com', 'secret-pass');\n```\n\n## Common mistakes\n\
    - Trusting the user id sent from the client without verifying the token on the server.\n- Thinking\
    \ a signed-out state on the client revokes tokens already issued; revocation needs server checks.\n\
    - Leaving security rules open because 'the app has a login'.\n- Putting large or sensitive data in\
    \ custom claims.\n\n## In the interview\nExplain the token flow end to end: sign-in, ID and refresh\
    \ tokens, verification on the backend. Mention trade-offs: fast to adopt and handles OAuth and MFA,\
    \ but you depend on a vendor and its pricing and data location. Follow-ups may cover session cookies\
    \ for SSR, role-based access with custom claims, and token revocation.\n"
