  question: How does Object.fromEntries work in JavaScript?
  answer: Object.fromEntries takes an iterable of [key, value] pairs, such as an array of pairs or a Map,
    and builds a plain object from them. It is the inverse of Object.entries and is often used to transform
    an object by mapping or filtering its entries.
  topic: web development
  tags:
  - javascript
  - objects
  - object-fromentries
  - transformation
  explanation: "## In plain words\nObjects do not have `map` or `filter`, but arrays do. The common trick\
    \ is to turn an object into a list of pairs with `Object.entries`, transform the list, and turn it\
    \ back with `Object.fromEntries`.\n\n## How it works\n- Input: any iterable whose items are two-element\
    \ array-like values `[key, value]`.\n- Keys are converted to property keys (strings or symbols); later\
    \ duplicates overwrite earlier ones.\n- Works with `Map`, so `Object.fromEntries(map)` converts a\
    \ Map to an object.\n- Works with `URLSearchParams`, turning a query string into an object (repeated\
    \ keys keep only the last value).\n- Output is a new plain object; the input is not changed.\n- Time\
    \ is O(n) in the number of entries.\n\n## Example\n```javascript\nconst prices = { apple: 2, pear:\
    \ 3, plum: 1 };\n\nconst cheap = Object.fromEntries(\n  Object.entries(prices).filter(([, p]) => p\
    \ < 3)\n);\nconsole.log(cheap); // { apple: 2, plum: 1 }\n\nconst m = new Map([['a', 1], ['b', 2]]);\n\
    console.log(Object.fromEntries(m)); // { a: 1, b: 2 }\n\nconst q = new URLSearchParams('page=2&sort=asc');\n\
    console.log(Object.fromEntries(q)); // { page: '2', sort: 'asc' }\n```\n\n## Common mistakes\n- Passing\
    \ an array of objects instead of an array of pairs.\n- Expecting non-string keys such as objects to\
    \ stay as objects; they become strings. Keep a `Map` for that.\n- Losing repeated query parameters\
    \ when converting `URLSearchParams`.\n\n## In the interview\nDescribe it as the inverse of `Object.entries`\
    \ and show the entries-map-fromEntries pattern. Mention it is ES2019, so very old environments need\
    \ a polyfill or `reduce`. Follow-ups may ask how you would write it yourself with `reduce`, or when\
