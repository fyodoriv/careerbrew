  explanation: "## In plain words\nScope answers \"from where can I use this name?\". A variable declared\
    \ inside a function is like a note on your desk: you can read it, colleagues in other rooms cannot.\
    \ A global variable is a sign in the lobby that everyone sees.\n\n## How it works\n- **Global scope**:\
    \ names declared at the top level, visible everywhere. Convenient but risky: anything can change them.\n\
    - **Module scope**: top-level names in a module file, visible only inside that file unless exported.\n\
    - **Function scope**: parameters and locals of a function.\n- **Block scope**: names inside `{ }`,\
    \ for languages and keywords that support it (`let`/`const` in JavaScript, most variables in Java\
    \ or C).\n- **Name resolution**: look in the current scope, then each enclosing scope (the scope chain);\
    \ an inner name with the same spelling shadows an outer one.\n- **Lexical versus dynamic scoping**:\
    \ most languages, including JavaScript and Python, are lexical (decided by where code is written).\n\
    - Scope (where a name is visible) is related to but different from lifetime (how long the value exists);\
    \ closures can extend lifetime.\n\n## Example\n```javascript\nconst appName = \"demo\";          \
    \  // global/module scope\n\nfunction render(user) {            // user: function scope\n  if (user)\
    \ {\n    const label = \"Hi \" + user;    // block scope\n    return appName + \": \" + label;\n \
    \ }\n  // label is not visible here\n  return appName;\n}\nconsole.log(render(\"Ada\"));        //\
    \ demo: Hi Ada\n```\n\n## Common mistakes\n- Relying on globals for shared state.\n- Accidental shadowing\
    \ that hides the variable you meant.\n- Confusing scope with `this` or with object properties.\n\n\
    ## In the interview\nName the levels, explain lookup through the scope chain and shadowing, and say\
