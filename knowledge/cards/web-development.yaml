- id: kb-828adcf90ad3
  question: How can you iterate over the properties of a JavaScript object?
  answer: Use Object.keys, Object.values, or Object.entries with for...of or array methods; they return
    own enumerable string keys. for...in also visits inherited enumerable properties. Reflect.ownKeys
    includes non-enumerable and symbol keys.
  topic: web development
  tags:
  - javascript
  - objects
  - iteration
  - enumerable
  explanation: "## In plain words\nPlain objects are not directly iterable like arrays, so you first ask\
    \ for a list of their keys, values, or pairs and loop over that. Different methods include different\
    \ kinds of properties, so the choice matters.\n\n## How it works\n- `Object.keys(obj)`: own, enumerable,\
    \ string keys.\n- `Object.values(obj)` and `Object.entries(obj)`: same set, as values or `[key, value]`\
    \ pairs.\n- `for (const k in obj)`: own and inherited enumerable string keys; guard with `Object.hasOwn(obj,\
    \ k)` if needed.\n- `Object.getOwnPropertyNames`: own string keys including non-enumerable ones.\n\
    - `Reflect.ownKeys`: all own keys, including symbols.\n- Order: integer-like keys ascending, then\
    \ other strings in insertion order, then symbols.\n\n## Example\n```javascript\nconst prices = { apple:\
    \ 1.2, pear: 0.8 };\n\nfor (const [name, price] of Object.entries(prices)) {\n  console.log(`${name}:\
    \ ${price}`);\n}\n\nconst doubled = Object.fromEntries(\n  Object.entries(prices).map(([k, v]) =>\
    \ [k, v * 2])\n);\nconsole.log(doubled); // { apple: 2.4, pear: 1.6 }\n```\n\n## Common mistakes\n\
    - Using `for...of` directly on a plain object, which throws because it is not iterable.\n- Using `for...in`\
    \ without realizing it includes inherited properties.\n- Expecting keys like `'10'` and `'2'` to stay\
    \ in insertion order; integer-like keys are sorted.\n- Mutating the object while iterating over it.\n\
    \n## In the interview\nName the methods and what each includes: own versus inherited, enumerable versus\
    \ not, strings versus symbols. Recommend `Object.entries` with destructuring for most code. If keys\
    \ are dynamic and order or non-string keys matter, suggest a `Map`, which is iterable and keeps insertion\
    \ order.\n"
  match:
