  question: How do IIFEs (immediately invoked function expressions) work, and how do they interact with
    scope?
  answer: An IIFE is a function expression that is defined and called at once, like (function () { ...
    })(). Its variables live in a new function scope, so they do not leak into the surrounding or global
    scope, and it can return a value or closures that keep private state.
  topic: web development
  tags:
  - javascript
  - iife
  - scope
  - closures
  explanation: "## In plain words\nAn IIFE is a function you write and run in the same breath. Its main\
    \ job was to create a private room for variables before JavaScript had block scope and modules. Whatever\
    \ you declare inside stays inside, unless you return it.\n\n## How it works\n- Wrap the function in\
    \ parentheses so the parser treats it as an expression, not a declaration, then call it with `()`.\n\
    - Each call creates a new function scope; `var`, `let`, and `const` inside are invisible outside.\n\
    - Returned functions are closures: they keep access to the IIFE's variables after it finishes. This\
    \ is the classic module pattern.\n- Arrow IIFEs work: `(() => { ... })()`. Async IIFEs let you use\
    \ `await` where top-level await is not available.\n- Today ES modules and block scope cover most of\
    \ these needs.\n\n## Example\n```javascript\nconst counter = (function () {\n  let count = 0; // private\n\
    \  return {\n    inc: () => ++count,\n    value: () => count,\n  };\n})();\n\ncounter.inc();\nconsole.log(counter.value());\
    \ // 1\nconsole.log(typeof count);    // 'undefined'\n\n(async () => {\n  const data = await Promise.resolve(42);\n\
    \  console.log(data);\n})();\n```\n\n## Common mistakes\n- Forgetting the wrapping parentheses, which\
    \ causes a syntax error.\n- Missing a semicolon on the line before, so the IIFE is parsed as a call\
    \ on the previous expression.\n- Thinking the IIFE's variables are recreated on every use of the returned\
    \ functions; they are created once.\n\n## In the interview\nDefine it, show the syntax, and explain\
    \ the closure-based module pattern. Mention why it mattered historically (avoiding global pollution,\
    \ fixing `var` in loops) and what replaces it now: modules and `let`/`const` blocks. Expect questions\
    \ about closures and the leading-semicolon trap.\n"
