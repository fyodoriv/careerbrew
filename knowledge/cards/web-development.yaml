  question: How do you check whether a value is a boolean in JavaScript?
  answer: Use typeof value === 'boolean'. It is true only for the primitives true and false. A Boolean
    wrapper object made with new Boolean() has typeof 'object', and such wrappers should be avoided anyway.
  topic: web development
  tags:
  - javascript
  - types
  - typeof
  - booleans
  explanation: '## In plain words

    JavaScript has a primitive boolean type with exactly two values, `true` and `false`. The `typeof`
    operator reports the type of a primitive as a string, so checking for `''boolean''` is the simplest
    and most reliable test.


    ## How it works

    - `typeof true` and `typeof false` return `''boolean''`.

    - `typeof new Boolean(false)` returns `''object''`; that wrapper is also truthy, which is a classic
    trap.

    - To accept both primitives and wrappers (rarely needed), use `Object.prototype.toString.call(v) ===
    ''[object Boolean]''`.

    - Do not confuse ''is a boolean'' with ''is truthy''; `Boolean(v)` converts any value and is not a
    type check.

    - In TypeScript, `typeof v === ''boolean''` narrows `unknown` to `boolean`.

    - Parsing input such as `''true''` from a query string needs an explicit comparison, not `Boolean(''false'')`,
    which is `true`.


    ## Example

    ```javascript

    const isBool = (v) => typeof v === ''boolean'';


    console.log(isBool(false));             // true

    console.log(isBool(0));                 // false

    console.log(isBool(''true''));            // false

    console.log(isBool(new Boolean(true))); // false


    console.log(Boolean(''false''));          // true, non-empty string

    const parsed = ''false'' === ''true'';      // false

    ```


    ## Common mistakes

    - Using `Boolean(v)` or `!!v` as a type check.

    - Using `v === true || v === false`, which works but is longer and easy to get wrong when edited.

    - Creating `new Boolean(...)` objects, which are always truthy.

    - Parsing `''false''` with `Boolean()`.


    ## In the interview

    Answer with `typeof` and explain the wrapper-object exception in one sentence. Interviewers may extend
    it to a general `getType` helper; mention `typeof` for primitives, `Array.isArray` for arrays, `null`
    checked separately, and `Object.prototype.toString` for built-ins like `Date`.

    '
