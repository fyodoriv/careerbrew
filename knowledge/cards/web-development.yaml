  tags:
  - javascript
  - arrays
  - objects
  - data-structures
  explanation: "## In plain words\nUse an object when each value has a name (\"this user's email\"). Use\
    \ an array when you have a sequence of similar things in order (\"the list of users\"). Under the\
    \ hood an array is a special object whose keys are indexes.\n\n## How it works\n- **Object**: keys\
    \ are strings or symbols; no meaningful length; iterate with `Object.keys`, `Object.values`, `Object.entries`.\n\
    - **Array**:\n  - Keys are indexes `0, 1, 2...` (stored as strings, optimised by engines).\n  - `length`\
    \ is one more than the highest index and updates automatically.\n  - Inherits from `Array.prototype`:\
    \ `push`, `pop`, `map`, `filter`, `reduce`, `find`, `sort`.\n  - Iterable with `for...of` and spread.\n\
    - `typeof` returns `\"object\"` for both; use `Array.isArray(x)`.\n- Performance: arrays are fast\
    \ for index access and adding or removing at the end (`O(1)`); inserting at the front is `O(n)`. Object\
    \ property lookup is close to `O(1)` on average.\n\n## Example\n```javascript\nconst user = { id:\
    \ 1, name: \"Ada\" };        // record\nconst users = [user, { id: 2, name: \"Grace\" }];  // ordered\
    \ list\n\nconsole.log(typeof users, Array.isArray(users));  // \"object\" true\nconsole.log(users.length);\
    \                        // 2\nconsole.log(users.map((u) => u.name));            // [\"Ada\", \"Grace\"\
    ]\n\nconst byId = Object.fromEntries(users.map((u) => [u.id, u]));\nconsole.log(byId[2].name);   \
    \                     // \"Grace\": object as a lookup table\n```\n\n## Common mistakes\n- Using `typeof`\
    \ to detect arrays.\n- Looping over arrays with `for...in`.\n- Searching an array repeatedly by id\
    \ (`O(n)` each time) instead of building a lookup object or `Map`.\n\n## In the interview\nExplain\
    \ that arrays are specialised objects, list the practical differences, and give the rule of thumb:\
