- id: kb-f18db7d20b81
  question: How does setTimeout work in JavaScript?
  answer: setTimeout asks the host (browser or Node.js) to run a callback after at least the given delay.
    When the timer expires, the callback is queued as a task, and the event loop runs it only once the
    call stack is empty and earlier work, including all pending microtasks, has finished. It returns an
    id for clearTimeout.
  topic: web development
  tags:
  - javascript
  - event-loop
  - timers
  - async
  explanation: '## In plain words

    JavaScript runs one piece of code at a time. `setTimeout` does not pause anything; it leaves a note
    with the environment saying ''put this function in the queue after N milliseconds''. Your code keeps
    running, and the callback runs later when the engine is free.


    ## How it works

    - The timer is managed by the host, not the JavaScript engine.

    - When the delay passes, the callback goes to the task (macrotask) queue.

    - The event loop takes one task, runs it to completion, then drains all microtasks (promise callbacks),
    then may render, then takes the next task.

    - So the delay is a minimum, not a guarantee. A busy main thread delays it further.

    - Browsers clamp nested timers to at least about 4 ms after several levels, and throttle timers in
    background tabs.

    - Extra arguments after the delay are passed to the callback. `clearTimeout(id)` cancels it.


    ## Example

    ```javascript

    console.log(''A'');

    setTimeout(() => console.log(''timeout''), 0);

    Promise.resolve().then(() => console.log(''microtask''));

    console.log(''B'');

    // A, B, microtask, timeout


    const id = setTimeout(() => console.log(''never''), 1000);

    clearTimeout(id);


    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    ```


    ## Common mistakes

    - Thinking `setTimeout(fn, 0)` runs immediately.

    - Expecting precise timing; long tasks delay timers.

    - Using `setInterval` for work that may take longer than the interval; chained `setTimeout` avoids
    overlap.

    - Forgetting to clear timers when a component unmounts, which leaks memory and causes updates to stale
    state.


    ## In the interview

    Draw the event loop: call stack, task queue, microtask queue. Predicting the output of a mixed snippet
    is a classic question, so explain why promises run before timeouts. Mention practical uses: debounce,
    retries with backoff, and yielding to the browser so it can render during long work.

    '
