- id: kb-e2bebfea173b
  question: How do you get the number of elements in a JavaScript Set?
  answer: 'Read the size property: mySet.size. It is a getter, not a method and not length, and it counts
    unique values in O(1) time. Map has the same size property.'
  topic: web development
  tags:
  - javascript
  - set
  - collections
  - es2015
  explanation: '## In plain words

    A `Set` is a collection of unique values. Unlike arrays, which use `length`, sets and maps report
    their element count through a property called `size`. Because duplicates are dropped when added, `size`
    tells you how many distinct values there are.


    ## How it works

    - `set.size` is a read-only accessor on `Set.prototype`; assigning to it does nothing (or throws in
    strict mode).

    - It updates automatically after `add`, `delete`, and `clear`.

    - Equality for uniqueness uses SameValueZero: `NaN` equals `NaN`, and `+0` equals `-0`. Objects are
    compared by reference.

    - A common trick: `new Set(arr).size` counts distinct values in an array in O(n).

    - `WeakSet` has no `size`, because its contents can be collected at any time.


    ## Example

    ```javascript

    const tags = new Set([''js'', ''ts'', ''js'']);

    console.log(tags.size);   // 2

    console.log(tags.length); // undefined


    tags.add(''css'');

    tags.delete(''ts'');

    console.log(tags.size);   // 2


    const hasDuplicates = (arr) => new Set(arr).size !== arr.length;

    console.log(hasDuplicates([1, 2, 2])); // true


    console.log(new Set([{}, {}]).size); // 2, different objects

    ```


    ## Common mistakes

    - Using `length` or calling `size()` as a function.

    - Expecting objects with the same contents to be deduplicated.

    - Expecting `WeakSet` to expose a count.

    - Converting to an array just to count, which wastes memory.


    ## In the interview

    Say `size`, note that it is O(1), and show the duplicate-check trick. Interviewers may move to Set
    operations; mention the newer `union`, `intersection`, and `difference` methods, or show how to write
    them with spread and `filter`. Compare `Set` with an object used as a lookup.

    '
