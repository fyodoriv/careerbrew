  question: What is dynamic dispatch in JavaScript?
  answer: Dynamic dispatch means which method implementation runs is decided at runtime from the actual
    object receiving the call, not from the code's declared type. In JavaScript, `obj.method()` looks
    up `method` on the object and then along its prototype chain, so subclasses or other objects can override
    it.
  topic: web development
  tags:
  - javascript
  - oop
  - polymorphism
  - prototypes
  explanation: "## In plain words\nWhen you write `shape.area()`, you do not choose which `area` function\
    \ runs; the object does. A circle answers with its own formula, a square with its own. That runtime\
    \ choice is dynamic dispatch, and it is the engine behind polymorphism.\n\n## How it works\n- A method\
    \ call `obj.m()` does two things: find property `m` on `obj`, then call it with `this` set to `obj`.\n\
    - Lookup checks the object's own properties first, then its prototype, then the prototype's prototype,\
    \ until it finds `m` or reaches `null`.\n- A subclass method with the same name shadows the parent\
    \ method, so it wins.\n- `super.m()` explicitly calls the parent's version.\n- Because JavaScript\
    \ is dynamically typed, any object with the right method works (\"duck typing\"); no shared base class\
    \ is required.\n- Engines speed this up with inline caches, which remember lookup results for objects\
    \ of the same shape.\n\n## Example\n```javascript\nclass Shape {\n  area() { return 0; }\n  describe()\
    \ { return `${this.constructor.name}: ${this.area().toFixed(1)}`; }\n}\nclass Circle extends Shape\
    \ {\n  constructor(r) { super(); this.r = r; }\n  area() { return Math.PI * this.r ** 2; }\n}\nclass\
    \ Square extends Shape {\n  constructor(s) { super(); this.s = s; }\n  area() { return this.s ** 2;\
    \ }\n}\n\nfor (const shape of [new Circle(1), new Square(2)]) {\n  console.log(shape.describe());\
    \   // Circle: 3.1, Square: 4.0\n}\n```\n\n## Common mistakes\n- Thinking the base class's `area`\
    \ runs inside `describe`; `this.area()` dispatches to the subclass.\n- Losing `this` when passing\
    \ a method as a callback (`setTimeout(obj.m)`), which breaks dispatch to the right object.\n- Confusing\
    \ it with overloading by argument types, which JavaScript does not have.\n\n## In the interview\n\
    Define it, show it with a small class hierarchy, and explain the prototype chain lookup. Contrast\
    \ with static dispatch in languages like C++ for non-virtual methods, and connect it to polymorphism\
    \ and the open-closed principle.\n"
