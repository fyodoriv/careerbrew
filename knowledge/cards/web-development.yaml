  question: In JavaScript, how do you create an array from an iterable or array-like value and transform
    each element at the same time?
  answer: Use Array.from(source, mapFn). It builds a new array from any iterable or array-like object
    and applies mapFn(element, index) to each item in one pass, without an intermediate array.
  topic: web development
  tags:
  - javascript
  - arrays
  - array-from
  - iterables
  explanation: '## In plain words

    `Array.from` converts things that look like lists, such as a `Set`, a string, a `NodeList`, or `{
    length: 3 }`, into a real array. Its optional second argument is a mapping function, so conversion
    and transformation happen together.


    ## How it works

    - Signature: `Array.from(source, mapFn?, thisArg?)`.

    - Source can be iterable (`Set`, `Map`, string, generator) or array-like (has `length` and indexed
    keys).

    - `mapFn(value, index)` is called for each element; the return values form the new array.

    - It is like `Array.from(source).map(fn)` but avoids building the intermediate array.

    - Spread `[...source].map(fn)` works only for iterables, not array-likes such as `{ length: 3 }`.

    - O(n) time and space.


    ## Example

    ```javascript

    const squares = Array.from([1, 2, 3], x => x * x); // [1, 4, 9]


    const codes = Array.from(''abc'', ch => ch.charCodeAt(0)); // [97, 98, 99]


    const ids = new Set([3, 1]);

    console.log(Array.from(ids, id => `user-${id}`)); // [''user-3'', ''user-1'']


    const grid = Array.from({ length: 2 }, () => Array(3).fill(0));

    console.log(grid); // [[0, 0, 0], [0, 0, 0]]


    // In a browser:

    // const texts = Array.from(document.querySelectorAll(''li''), li => li.textContent);

    ```


    ## Common mistakes

    - Writing `Array(3).map(fn)`, which skips the empty slots and returns empty slots.

    - Using `Array(2).fill([])` for a grid, which shares one inner array across rows.

    - Expecting `mapFn` to receive the source collection as a third argument like `map` does; it only
    gets value and index.

    - Passing an async function and expecting values instead of promises.


    ## In the interview

    Explain the two arguments and what counts as a valid source, then show a real case: converting a `NodeList`
    or building a 2D grid. Contrast with spread plus `map`. Follow-ups may ask about the empty-slot behaviour
    of `Array(n)` and why `Array.from({ length: n })` avoids it.

    '
