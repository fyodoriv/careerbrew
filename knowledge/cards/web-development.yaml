  question: What is lexical (static) scope in JavaScript?
  answer: Lexical scope means the variables a function can see are decided by where the function is written
    in the source code, not by where or how it is called. Nested functions can read variables of the functions
    that contain them.
  topic: web development
  tags:
  - javascript
  - scope
  - closures
  explanation: "## In plain words\n\"Lexical\" means \"about the text\". To find out what a variable inside\
    \ a function refers to, you only need to read the code around the function's definition. Who calls\
    \ it, and from where, does not matter.\n\n## How it works\n- Scopes nest like boxes: global, then\
    \ module, then functions, then blocks.\n- When code uses a name, the engine looks in the current scope,\
    \ then the one that encloses it in the source, and so on outward (the scope chain).\n- This chain\
    \ is fixed when the function is created, which is what makes closures possible.\n- The opposite, dynamic\
    \ scope, would look up names in the caller's scope. JavaScript does not do that for variables.\n-\
    \ The one dynamic thing in JavaScript is `this` in regular functions, which depends on how the function\
    \ is called. Arrow functions take `this` lexically.\n\n## Example\n```javascript\nconst level = \"\
    global\";\n\nfunction outer() {\n  const level = \"outer\";\n  function inner() {\n    return level;\
    \            // looks where inner is written\n  }\n  return inner;\n}\n\nfunction caller() {\n  const\
    \ level = \"caller\";\n  return outer()();          // called from here, but...\n}\n\nconsole.log(caller());\
    \       // \"outer\"\n```\n\n## Common mistakes\n- Expecting a function to see variables from its\
    \ caller.\n- Mixing up scope (variables) with `this` (call-site dependent).\n- Thinking scope is decided\
    \ at runtime for each call.\n\n## In the interview\nDefine it, show an example where the call site\
    \ differs from the definition site, and connect it to closures and to arrow functions capturing `this`.\
    \ Mention that because scope is static, tools like bundlers and linters can analyse it without running\
    \ the code.\n"
