  question: What is the difference between cookies, localStorage, and sessionStorage?
  answer: Cookies are small (about 4 KB), sent to the server with every matching request, and can have
    expiry and security flags like HttpOnly. localStorage and sessionStorage hold more (around 5 MB),
    stay in the browser, and are read only by JavaScript; localStorage persists, sessionStorage lasts
    for one tab session.
  topic: web development
  tags:
  - web
  - browser-storage
  - cookies
  - security
  explanation: '## In plain words

    All three save small pieces of data in the browser, but for different jobs. Cookies are for things
    the server needs to see on every request, like a session id. Web storage (localStorage and sessionStorage)
    is a simple key-value store for the page''s own JavaScript.


    ## How it works

    - Cookies: set by the server (`Set-Cookie`) or JavaScript; sent automatically with requests to matching
    domains and paths; size about 4 KB each; options include `Expires`/`Max-Age`, `Secure`, `HttpOnly`
    (hidden from JavaScript), and `SameSite` (limits cross-site sending).

    - localStorage: about 5 MB per origin, strings only, synchronous API, no expiry, shared across tabs
    of the same origin.

    - sessionStorage: same API, but scoped to one tab and cleared when that tab closes.

    - For large or structured data, use IndexedDB.


    ## Example

    ```javascript

    localStorage.setItem(''theme'', ''dark'');

    const theme = localStorage.getItem(''theme'');


    sessionStorage.setItem(''draft'', JSON.stringify({ text: ''hi'' }));

    const draft = JSON.parse(sessionStorage.getItem(''draft''));


    // Server response header for a login session:

    // Set-Cookie: sid=abc123; HttpOnly; Secure; SameSite=Lax; Path=/

    ```


    ## Common mistakes

    - Storing auth tokens in localStorage, where any injected script (XSS) can read them; an `HttpOnly`
    cookie is safer against XSS.

    - Forgetting cookies need CSRF protection because the browser sends them automatically.

    - Storing objects without `JSON.stringify`.

    - Putting large data in cookies, which bloats every request.


    ## In the interview

    Compare on capacity, lifetime, scope, who can read it, and whether it travels to the server. Then
    discuss security trade-offs: XSS versus CSRF, and the flags that mitigate each. Expect a follow-up
    on where to store a JWT and how `SameSite` works.

    '
