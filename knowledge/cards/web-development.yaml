  explanation: "## In plain words\nBoth read and write the same properties. Dot notation is for when you\
    \ know the name while writing code and it looks like a normal variable name. Brackets are for everything\
    \ else: odd characters, numbers, symbols, or a name stored in a variable.\n\n## How it works\n- **Dot**:\
    \ `obj.prop`. The name must be a valid identifier (letters, digits, `_`, `$`, not starting with a\
    \ digit). Reserved words are allowed in modern JavaScript (`obj.class`).\n- **Bracket**: `obj[expression]`.\
    \ The expression is evaluated and converted to a string (or kept as a symbol).\n  - Keys with spaces\
    \ or dashes: `obj[\"content-type\"]`.\n  - Dynamic keys: `obj[field]`.\n  - Symbols: `obj[Symbol.iterator]`.\n\
    \  - Array indexes: `arr[0]` (really the key `\"0\"`).\n- Computed keys in literals use brackets too:\
    \ `{ [key]: value }`.\n- Optional chaining works with both: `obj?.a` and `obj?.[key]`.\n\n## Example\n\
