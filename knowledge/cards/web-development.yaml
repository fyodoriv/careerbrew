- id: kb-b698652027d3
  question: How does garbage collection work in JavaScript?
  answer: 'JavaScript engines free memory automatically by finding objects that are no longer reachable
    from roots like globals and the current call stack. Modern engines use a generational, mark-and-sweep
    style collector: frequent cheap collections of young objects and rarer full collections, mostly done
    incrementally or concurrently.'
  topic: web development
  tags:
  - javascript
  - memory
  - garbage-collection
  - performance
  explanation: "## In plain words\nYou never free memory by hand in JavaScript. The engine regularly asks\
    \ 'which objects can the program still reach?' Anything it cannot reach is garbage and its memory\
    \ is reused. So the question is never 'is this object used?' but 'is there still a path to it?'\n\n\
    ## How it works\n- Roots: global objects, variables in active function frames, and internal references\
    \ like pending callbacks.\n- Mark: start from roots and mark every object you can reach by following\
    \ references.\n- Sweep (or compact): reclaim everything unmarked. Reachability handles cycles, unlike\
    \ plain reference counting.\n- Generational idea: most objects die young, so new objects live in a\
    \ small young space collected often and cheaply (a scavenger). Survivors are promoted to an old space\
    \ collected less often.\n- Engines like V8 do much of the work incrementally and on helper threads\
    \ to shorten pauses.\n- `WeakMap`, `WeakSet`, and `WeakRef` hold references that do not keep objects\
    \ alive.\n\n## Example\n```javascript\nlet cache = new Map();\nfunction remember(el) {\n  cache.set(el,\
    \ { clicks: 0 }); // keeps el alive forever\n}\n\nconst meta = new WeakMap();\nfunction rememberWeak(el)\
    \ {\n  meta.set(el, { clicks: 0 }); // freed once el is unreachable\n}\n\nconst big = new Array(1e6).fill(0);\n\
    const handler = () => console.log(big.length); // closure keeps big alive\n```\n\n## Common mistakes\n\
    - Thinking setting a variable to `null` frees memory immediately; it only removes one reference.\n\
    - Common leaks: forgotten event listeners and timers, growing caches or global arrays, closures capturing\
    \ large objects, and detached DOM nodes still referenced from JavaScript.\n- Saying JavaScript uses\
    \ reference counting; modern engines use tracing.\n\n## In the interview\nExplain reachability, mark-and-sweep,\
    \ and the generational design. Then show practical knowledge: how to find a leak with heap snapshots\
    \ in browser developer tools (compare snapshots, look for growing detached nodes) and how to avoid\
    \ one (remove listeners, use `WeakMap`, bound caches).\n"
