  question: How do you extend a class in JavaScript?
  answer: Use class Child extends Parent. In the child constructor, call super(...) before using this;
    methods can call super.method() to reuse parent logic. extends also works with built-ins like Error
    and with any constructor function.
  topic: web development
  tags:
  - javascript
  - classes
  - inheritance
  - super
  explanation: "## In plain words\n`extends` creates a new class that starts with everything the parent\
    \ has and adds or changes behaviour. The child must let the parent build the object first, which is\
    \ what calling `super()` in the constructor does.\n\n## How it works\n- `class B extends A` sets `B.prototype`'s\
    \ prototype to `A.prototype` (instance methods) and `B`'s prototype to `A` (static methods).\n- If\
    \ `B` defines a constructor, it must call `super(...)` before touching `this`; otherwise a `ReferenceError`\
    \ is thrown. If `B` has no constructor, a default one forwards all arguments.\n- Override a method\
    \ by defining it with the same name; call the parent version with `super.name()`.\n- `extends null`\
    \ and extending any expression that evaluates to a constructor are allowed.\n- Extending `Error`,\
    \ `Array`, or `Map` works with class syntax.\n\n## Example\n```javascript\nclass Shape {\n  constructor(name)\
    \ { this.name = name; }\n  describe() { return `I am a ${this.name}`; }\n}\n\nclass Circle extends\
    \ Shape {\n  constructor(r) {\n    super('circle');\n    this.r = r;\n  }\n  describe() {\n    return\
    \ `${super.describe()} with radius ${this.r}`;\n  }\n}\n\nclass HttpError extends Error {\n  constructor(status,\
    \ msg) {\n    super(msg);\n    this.name = 'HttpError';\n    this.status = status;\n  }\n}\n\nconsole.log(new\
    \ Circle(2).describe()); // I am a circle with radius 2\n```\n\n## Common mistakes\n- Using `this`\
    \ before `super()`.\n- Forgetting to pass arguments the parent needs.\n- Building deep hierarchies\
    \ where composition would be simpler.\n- Forgetting to set `name` on custom errors, which makes logs\
    \ less clear.\n\n## In the interview\nShow the syntax, the `super` rules, and a custom `Error` subclass,\
    \ which is the most common real use. Mention that classes are built on prototypes. Discuss the trade-off:\
    \ inheritance shares behaviour but couples classes tightly; prefer composition when the relationship\
