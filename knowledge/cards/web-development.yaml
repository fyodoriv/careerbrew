  question: What is DNS prefetch in HTML?
  answer: '`<link rel="dns-prefetch" href="//cdn.example.com">` hints the browser to resolve a third-party
    domain''s IP address early, before any resource from it is requested. It saves the DNS lookup time
    later and is very cheap.'
  topic: web development
  tags:
  - performance
  - html
  - resource-hints
  - dns
  explanation: "## In plain words\nBefore the browser can download anything from a domain, it has to look\
    \ up that domain's IP address, which can take tens to hundreds of milliseconds. DNS prefetch says\
    \ \"you will need this address soon, look it up now while you are idle\".\n\n## How it works\n- Add\
    \ a `link` element in the `head`: `<link rel=\"dns-prefetch\" href=\"https://fonts.example.com\">`.\n\
    - The browser performs only the DNS lookup and caches the result. No connection is opened and nothing\
    \ is downloaded.\n- Useful for cross-origin domains you will hit later: font hosts, analytics, image\
    \ CDNs, APIs.\n- Pointless for your own origin, which is already resolved.\n- Related hints, in increasing\
    \ cost:\n  - `dns-prefetch`: DNS only.\n  - `preconnect`: DNS, TCP and TLS.\n  - `preload`: fetch\
    \ a resource needed for this page.\n  - `prefetch`: fetch a resource likely needed for the next page.\n\
    - A common pattern is `preconnect` plus `dns-prefetch` as a fallback for older browsers.\n\n## Example\n\
    ```html\n<head>\n  <link rel=\"preconnect\" href=\"https://cdn.example.com\" crossorigin>\n  <link\
    \ rel=\"dns-prefetch\" href=\"https://cdn.example.com\">\n  <link rel=\"dns-prefetch\" href=\"https://analytics.example.net\"\
    >\n</head>\n```\n\n## Common mistakes\n- Prefetching dozens of domains; each still costs a lookup\
    \ and some are never used.\n- Expecting it to open a connection or download files.\n- Adding it for\
    \ the page's own origin.\n\n## In the interview\nExplain what it saves (the DNS round trip), compare\
    \ it with the other resource hints, and say when you would choose each. Mention measuring the effect\
    \ with the Network panel or Navigation Timing rather than adding hints blindly.\n"
