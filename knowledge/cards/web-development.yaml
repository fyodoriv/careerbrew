  question: Implement a calculator using curried functions
  answer: Return a chain of functions, each taking one argument and returning the next function, with
    the last call computing the result. For example add(2)(3) returns 5. A flexible version keeps returning
    functions until it is called with no arguments, or uses a method-chaining object.
  topic: web development
  tags:
  - javascript
  - currying
  - closures
  - functional-programming
  explanation: "## In plain words\nCurrying turns a function that takes several arguments into a series\
    \ of functions that each take one. `add(2, 3)` becomes `add(2)(3)`. Each inner function remembers\
    \ earlier arguments through a closure. A curried calculator is a common interview task to test closures.\n\
    \n## How it works\n- Fixed arity: `const add = a => b => a + b`.\n- Generic `curry(fn)`: collect arguments\
    \ until there are `fn.length` of them, then call `fn`.\n- Open-ended chain: return a function that\
    \ adds to a running total and returns itself; calling it with no arguments returns the total.\n- Fluent\
    \ calculator: an object whose methods return a new calculator with the updated value, ending with\
    \ `.value()`.\n- Each call is O(1); a chain of k calls is O(k) time and keeps O(k) closures alive\
    \ at most.\n\n## Example\n```javascript\nconst curry = (fn) => function next(...args) {\n  return\
    \ args.length >= fn.length\n    ? fn(...args)\n    : (...more) => next(...args, ...more);\n};\nconst\
    \ add3 = curry((a, b, c) => a + b + c);\nconsole.log(add3(1)(2)(3), add3(1, 2)(3)); // 6 6\n\nfunction\
    \ sum(a) {\n  return (b) => (b === undefined ? a : sum(a + b));\n}\nconsole.log(sum(1)(2)(3)()); //\
    \ 6\n\nconst calc = (v = 0) => ({\n  add: (x) => calc(v + x),\n  sub: (x) => calc(v - x),\n  mul:\
    \ (x) => calc(v * x),\n  div: (x) => calc(v / x),\n  value: () => v,\n});\nconsole.log(calc(10).add(5).mul(2).sub(4).value());\
    \ // 26\n```\n\n## Common mistakes\n- Relying on `fn.length` when the function has default or rest\
    \ parameters, which are not counted.\n- Mutating a shared total, so two chains interfere.\n- Forgetting\
    \ how the chain ends, so the caller gets a function instead of a number.\n- Not handling division\
    \ by zero in the calculator.\n\n## In the interview\nClarify the expected call style first, since\
    \ there are several. Write the simple version, then the generic `curry`. Explain closures as the mechanism\
    \ and mention uses: partial application, configuring a function once and reusing it. Trade-off: elegant\
    \ composition, but long curried chains can be harder to debug and read.\n"
