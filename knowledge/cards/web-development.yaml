- id: kb-43a816822676
  question: What is the difference between const and let in JavaScript?
  answer: 'Both are block-scoped and live in the temporal dead zone until declared. let allows reassignment;
    const does not and must be initialized. const does not make the value immutable: object contents can
    still change.'
  topic: web development
  tags:
  - javascript
  - variables
  - const
  - let
  - scope
  explanation: '## In plain words

    `let` and `const` are the modern ways to declare variables. Think of a variable as a label stuck on
    a value. With `let` you can move the label to a new value later. With `const` the label is glued in
    place, but if it is stuck on a box (an object), you can still change what is inside the box.


    ## How it works

    - Both are scoped to the nearest `{ }` block.

    - Both are hoisted but not initialized, so using them before the declaration throws a `ReferenceError`
    (the temporal dead zone).

    - Neither can be redeclared in the same scope.

    - `const` must be initialized at declaration and cannot be reassigned.

    - In `for (let i ...)` each iteration gets a fresh binding; `for (const x of list)` works because
    each iteration declares a new `x`, but `for (const i = 0; ...; i++)` throws.


    ## Example

    ```javascript

    const user = { name: ''Ann'' };

    user.name = ''Bo'';   // fine, mutation

    // user = {};       // TypeError: assignment to constant


    let total = 0;

    for (const n of [1, 2, 3]) total += n;

    console.log(total); // 6


    const frozen = Object.freeze({ a: 1 });

    ```


    ## Common mistakes

    - Believing `const` makes objects immutable; use `Object.freeze` or immutable patterns for that.

    - Using `const` as a loop counter in a classic `for` loop.

    - Declaring with `let` everywhere ''just in case'', which hides which values actually change.


    ## In the interview

    A common team rule is ''default to `const`, use `let` only when you reassign''; explain that it signals
    intent to readers. Mention the temporal dead zone and block scope, and contrast both with `var`, which
    is function-scoped and initialized to `undefined`. Expect a snippet asking whether a mutation on a
    `const` object throws.

    '
