    \ is numeric; `isNaN('')` is `false` because `''` becomes 0.\n- Comparing with `x === NaN`, which\
    \ is always false.\n- Forgetting that `Infinity` is not `NaN`, so a NaN check alone does not prove\
    \ a usable number.\n\n## In the interview\nExplain coercion as the root difference and show one surprising\
