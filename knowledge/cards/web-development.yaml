    \ a function, it builds a new function object and remembers where it was born, so the function can\
    \ later reach the variables around it.\n\n## How it works\n- Functions are objects: `typeof fn ===\
    \ \"function\"`, and `fn instanceof Object` is `true`.\n- Each creation produces a new object with:\n\
