  question: What is function scope in JavaScript?
  answer: Function scope means variables declared inside a function are only visible inside that function
    and anything nested in it. `var` is limited by function scope alone, while `let` and `const` are further
    limited by blocks; parameters are also function-scoped.
  topic: web development
  tags:
  - javascript
  - scope
  - functions
  - variables
  explanation: "## In plain words\nA function is a room with one-way glass: code inside can look out and\
    \ use outer variables, but code outside cannot look in. Variables you create inside belong to that\
    \ room and disappear when it is no longer needed.\n\n## How it works\n- Every call creates a new local\
    \ environment for parameters and local variables.\n- Lookup goes from inner to outer scopes (the scope\
    \ chain) until the global scope; if the name is not found, you get a `ReferenceError`.\n- An inner\
    \ variable with the same name shadows the outer one.\n- `var` declarations ignore blocks such as `if`\
    \ and `for` but stop at the function boundary.\n- `let` and `const` inside a function are function-local\
    \ too, and additionally block-local.\n- An IIFE (immediately invoked function expression) was the\
    \ old way to create a private scope before modules and block scoping.\n\n## Example\n```javascript\n\
    const greeting = \"hi\";\n\nfunction greet(name) {\n  var punctuation = \"!\";\n  if (true) {\n  \
    \  var shout = true;       // function-scoped, visible below\n    let quiet = false;      // block-scoped\n\
    \  }\n  console.log(greeting, name, punctuation, shout);   // hi Ada ! true\n  // console.log(quiet);\
    \    // ReferenceError\n}\ngreet(\"Ada\");\n// console.log(punctuation);  // ReferenceError: not visible\
    \ outside\n```\n\n## Common mistakes\n- Assuming `var` inside an `if` stays in that block.\n- Accidentally\
    \ shadowing an outer variable and editing the wrong one.\n- Forgetting that each call gets new local\
    \ variables, not shared ones.\n\n## In the interview\nDefine it, contrast it with block and global\
    \ scope, and mention the scope chain and shadowing. Link it to closures: an inner function keeps access\
    \ to its parent function's scope after the parent returns.\n"
