    \ two identical-looking functions are equal.\n- Creating new callbacks on every React render and breaking\
    \ memoisation (`useCallback` exists for this).\n- Thinking arrow functions have a `prototype` or their\
    \ own `this`.\n\n## In the interview\nSay \"functions are first-class objects\", describe what the\
