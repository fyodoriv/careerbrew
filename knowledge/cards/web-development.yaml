- id: kb-fb9f33a1e831
  question: How does export * work in JavaScript modules?
  answer: export * from './mod.js' re-exports every named export of another module from the current one,
    without importing them locally. It does not re-export the default export. export * as ns from './mod.js'
    re-exports them grouped under one namespace name.
  topic: web development
  tags:
  - javascript
  - modules
  - esm
  - exports
  explanation: '## In plain words

    `export *` lets one file act as a front door for others. Instead of importing from five files, consumers
    import from one ''barrel'' file that forwards everything. The forwarded names are not available inside
    the barrel itself unless it imports them too.


    ## How it works

    - `export * from ''./a.js''`: forwards all named exports of `a.js` as live bindings.

    - The default export is skipped; forward it explicitly with `export { default } from ''./a.js''` or
    `export { default as A } from ''./a.js''`.

    - `export * as utils from ''./a.js''` exports one name, `utils`, holding the namespace object.

    - If two `export *` sources export the same name, that name is ambiguous and is silently left out;
    importing it is an error.

    - Local explicit exports win over names coming from `export *`.


    ## Example

    ```javascript

    // math/add.js

    export const add = (a, b) => a + b;

    export default ''add-module'';


    // math/index.js (barrel)

    export * from ''./add.js'';

    export { default as addName } from ''./add.js'';

    export * as strings from ''./strings.js'';


    // app.js

    import { add, addName, strings } from ''./math/index.js'';

    console.log(add(1, 2)); // 3

    ```


    ## Common mistakes

    - Expecting the default export to come through.

    - Not noticing name collisions between two `export *` sources.

    - Building huge barrel files that slow down bundling and tests and can create circular imports.

    - Assuming the names are usable inside the barrel file.


    ## In the interview

    Explain the syntax, the default-export exception, and the namespace form. Then discuss trade-offs
    of barrel files: a tidy public API versus slower builds, weaker tree shaking in some tools, and circular
    dependency risk. Mention that CommonJS has no direct equivalent; it uses `module.exports = { ...require(''./a'')
    }`.

    '
