- id: kb-bf1997b11617
  question: What is hoisting in JavaScript and how does it affect variables and functions?
  answer: Hoisting means declarations are processed when a scope is entered, before any code in it runs.
    Function declarations are fully available early; `var` exists early with value `undefined`; `let`,
    `const` and `class` exist but throw if used before their declaration line (the temporal dead zone).
  topic: web development
  tags:
  - javascript
  - hoisting
  - scope
  - variables
  explanation: '## In plain words

    Before running a block of code, JavaScript first scans it and registers every declaration. That makes
    it look as if declarations were "lifted to the top". Only declarations move, never assignments, and
    the rules differ by keyword.


    ## How it works

    - **Function declarations**: the whole function is ready at the start of the scope, so you can call
    it above where it is written.

    - **`var`**: the name is created and set to `undefined`; the assignment stays where it is.

    - **`let` / `const` / `class`**: the name is created but uninitialised; access before the line throws
    a `ReferenceError`.

    - **Function expressions and arrow functions** follow the rules of the variable that holds them: `var
    f = () => {}` gives `undefined` early, so calling it throws `TypeError: f is not a function`.

    - Hoisting is per scope: function-level for `var`, block-level for `let` and `const`.


    ## Example

    ```javascript

    console.log(sayHi());     // "hi": declaration is hoisted

    function sayHi() { return "hi"; }


    console.log(a);           // undefined

    var a = 1;


    // console.log(b);        // ReferenceError (TDZ)

    let b = 2;


    // greet();               // TypeError: greet is not a function

    var greet = () => "hello";

    ```


    ## Common mistakes

    - Saying the engine physically moves code; it registers declarations during a setup phase.

    - Thinking assignments are hoisted.

    - Saying `let` and `const` are not hoisted at all.

    - Calling a function expression before its line.


    ## In the interview

    Describe the two phases (creation, then execution), list the behaviour per declaration type, and finish
    with a short output-prediction example. Recommend declaring before use and preferring `const` and
    `let` so mistakes fail loudly.

    '
