  question: What is a sitemap?
  answer: A sitemap is a file, usually `sitemap.xml`, that lists the URLs of a site you want search engines
    to crawl, optionally with the last modification date. It helps crawlers discover pages, especially
    new, deep or poorly linked ones; it does not guarantee indexing.
  topic: web development
  tags:
  - seo
  - sitemap
  - web
  - search-engines
  explanation: "## In plain words\nA sitemap is a table of contents for search engine crawlers. Instead\
    \ of hoping a crawler finds every page by following links, you hand it a list.\n\n## How it works\n\
    - Format: XML following the sitemaps.org protocol. Each `<url>` has a `<loc>` and optionally `<lastmod>`.\
    \ (`changefreq` and `priority` exist but major search engines largely ignore them.)\n- Limits: 50,000\
    \ URLs or 50 MB uncompressed per file; larger sites use a sitemap index file pointing to several sitemaps.\n\
    - Submit it via `robots.txt` (`Sitemap: https://example.com/sitemap.xml`) or the search engine's webmaster\
    \ tools.\n- Include only canonical, indexable URLs that return 200; leave out redirects, duplicates\
    \ and `noindex` pages.\n- Specialised extensions exist for images, video, news and alternate languages\
    \ (`hreflang`).\n- Frameworks and static site generators can generate it at build time.\n- Distinct\
    \ from an HTML sitemap page meant for human visitors.\n\n## Example\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n  <url>\n\
    \    <loc>https://example.com/</loc>\n    <lastmod>2026-01-15</lastmod>\n  </url>\n  <url>\n    <loc>https://example.com/blog/first-post</loc>\n\
    \    <lastmod>2026-01-10</lastmod>\n  </url>\n</urlset>\n```\n\n## Common mistakes\n- Listing URLs\
    \ blocked by `robots.txt` or marked `noindex`.\n- Setting every `lastmod` to today, which teaches\
    \ crawlers to ignore it.\n- Thinking a sitemap improves ranking; it helps discovery, not position.\n\
    \n## In the interview\nExplain the purpose, the format and limits, and how you would generate and\
    \ keep it fresh automatically. Mention related SEO basics: `robots.txt`, canonical tags and server\
    \ rendering for crawlable content.\n"
