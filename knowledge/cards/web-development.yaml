- id: kb-ecd6f3f2dde0
  question: How do you handle errors in nested JavaScript promises?
  answer: 'Flatten the nesting: return inner promises from then callbacks so rejections flow down one
    chain, and put a single catch at the end (or use async/await with try/catch). A rejection skips every
    then until it reaches a catch. Nested promises that are not returned create errors no one handles.'
  topic: web development
  tags:
  - javascript
  - promises
  - async-await
  - error-handling
  explanation: "## In plain words\nA promise chain is like a pipeline: when one step fails, the failure\
    \ skips the remaining steps until it reaches a handler. That only works if every step returns its\
    \ promise. If you start a promise inside a callback and do not return it, it leaves the pipeline and\
    \ its errors are lost.\n\n## How it works\n- Inside `.then`, return the inner promise; the outer chain\
    \ then waits for it and adopts its result or error.\n- A throw inside `.then` becomes a rejection.\n\
    - `.catch` handles any earlier rejection in the chain; after it, the chain continues with the value\
    \ the handler returns.\n- With `async/await`, write `await` on every inner call inside one `try/catch`.\n\
    - For parallel work, `Promise.all` rejects on the first error; `Promise.allSettled` reports each result.\n\
    - Add a global `unhandledrejection` handler as a safety net for logging.\n\n## Example\n```javascript\n\
    // Bad: inner promise not returned, its error escapes\ngetUser(1).then(user => {\n  getOrders(user.id).then(show);\n\
    }).catch(console.error);\n\n// Good: flat chain\ngetUser(1)\n  .then(user => getOrders(user.id))\n\
    \  .then(show)\n  .catch(err => console.error('load failed', err));\n\n// Good: async/await\nasync\
    \ function load() {\n  try {\n    const user = await getUser(1);\n    show(await getOrders(user.id));\n\
    \  } catch (err) {\n    console.error('load failed', err);\n  }\n}\n```\n\n## Common mistakes\n- Not\
    \ returning inner promises.\n- Putting `.catch` in the middle and accidentally turning a failure into\
    \ success with `undefined`.\n- Forgetting `await`, so `try/catch` does not see the rejection.\n- Using\
    \ `forEach` with async callbacks; it ignores the promises.\n\n## In the interview\nExplain the 'return\
    \ to keep it in the chain' rule and show the flat version. Then discuss where to catch: at the boundary\
    \ where you can show a message or retry. Mention `Promise.all` versus `allSettled`, and adding context\
    \ with `new Error('msg', { cause })` when rethrowing.\n"
