  question: How do Symbols work in JavaScript?
  answer: A Symbol is a primitive value that is always unique, created with Symbol('description'). Symbols
    are used as property keys that cannot clash with other keys and are skipped by Object.keys and JSON.stringify.
    Symbol.for creates shared, registry-wide symbols, and well-known symbols like Symbol.iterator customize
    language behaviour.
  topic: web development
  tags:
  - javascript
  - symbols
  - primitives
  - iterators
  explanation: "## In plain words\nA Symbol is a value that is guaranteed to be different from every other\
    \ value, even another Symbol with the same description. That makes it a safe name for a property:\
    \ no other code can accidentally use the same key.\n\n## How it works\n- Create with `Symbol('label')`;\
    \ the label is only for debugging. `new Symbol()` throws.\n- `Symbol('a') === Symbol('a')` is `false`.\n\
    - As object keys, symbols are skipped by `for...in`, `Object.keys`, and `JSON.stringify`; find them\
    \ with `Object.getOwnPropertySymbols` or `Reflect.ownKeys`. They are hidden, not private.\n- `Symbol.for('app.id')`\
    \ returns the same symbol for the same string across the whole runtime (the global registry).\n- Well-known\
    \ symbols hook into the language: `Symbol.iterator` (for...of), `Symbol.asyncIterator`, `Symbol.toPrimitive`,\
    \ `Symbol.hasInstance`.\n\n## Example\n```javascript\nconst id = Symbol('id');\nconst user = { name:\
    \ 'Ann', [id]: 42 };\nconsole.log(Object.keys(user)); // ['name']\nconsole.log(user[id]);        \
    \  // 42\n\nclass Range {\n  constructor(n) { this.n = n; }\n  *[Symbol.iterator]() {\n    for (let\
    \ i = 0; i < this.n; i++) yield i;\n  }\n}\nconsole.log([...new Range(3)]); // [0, 1, 2]\n```\n\n\
    ## Common mistakes\n- Treating symbols as truly private; use `#private` class fields for that.\n-\
    \ Expecting symbol keys to survive `JSON.stringify`.\n- Converting a symbol with string concatenation\
    \ (`'x' + sym` throws); use `String(sym)` or `sym.description`.\n\n## In the interview\nExplain uniqueness,\
    \ the main use (collision-free keys and metadata), and the well-known symbols, with `Symbol.iterator`\
    \ as the best example. Contrast `Symbol()` with `Symbol.for()`. Follow-ups may ask how to make a custom\
    \ object iterable or how libraries add hidden metadata safely.\n"
