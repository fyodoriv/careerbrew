- id: kb-c1f2cbf86e34
  question: In what order do ES module imports and CommonJS require calls run in JavaScript?
  answer: 'Static `import` declarations are hoisted: the whole module graph is parsed, linked and executed
    before any code in the importing module runs. `require()` is an ordinary function call, so it loads
    and runs the module synchronously at the exact line where it appears.'
  topic: web development
  tags:
  - javascript
  - modules
  - esm
  - commonjs
  - node
  explanation: '## In plain words

    ES modules (`import`) are planned ahead: the engine reads every import first, builds a map of all
    the files, and runs dependencies before your file starts. CommonJS (`require`) is improvised: a module
    is loaded only when execution reaches the `require` line.


    ## How it works

    - **ES modules** go through three phases: parse (find all `import` statements), link (connect exported
    names to imports as live bindings) and evaluate (run modules depth-first, dependencies first).

    - Because of that, an `import` written at the bottom of a file still runs before the top line of code.

    - Imports are live bindings: if the exporting module changes a `let`, importers see the new value.

    - **CommonJS** `require()` runs the file the first time it is called, caches `module.exports`, and
    returns a copy of that object reference.

    - `require` can be called conditionally or inside a function; static `import` cannot. Dynamic `import()`
    returns a promise and loads later.


    ## Example

    ```javascript

    // a.mjs

    console.log("a runs");

    export const x = 1;


    // main.mjs

    console.log("main starts");

    import { x } from "./a.mjs";

    // Output: "a runs", then "main starts"


    // main.cjs

    console.log("main starts");

    const a = require("./a.cjs");

    // Output: "main starts", then "a runs"

    ```


    ## Common mistakes

    - Thinking import order follows the line where you wrote `import`.

    - Expecting CommonJS exports to be live bindings.

    - Forgetting that circular dependencies behave differently: with ESM you may hit a temporal dead zone
    error, with CommonJS you get a partially filled exports object.


    ## In the interview

    Explain the static, hoisted, three-phase nature of ESM versus the synchronous, on-demand nature of
    `require`. Mention tree shaking (only possible because imports are static), top-level `await` in ESM,
    and dynamic `import()` for lazy loading.

    '
