  question: How do you convert a string into a number in JavaScript?
  answer: Number(str) or unary +str convert the whole string and return NaN if any part is invalid (an
    empty or whitespace string becomes 0). parseInt(str, 10) and parseFloat(str) read a leading number
    and stop at the first invalid character. Always check the result with Number.isFinite or Number.isNaN.
  topic: web development
  tags:
  - javascript
  - numbers
  - parsing
  - type-coercion
  explanation: "## In plain words\nThere are two styles. Strict conversion (`Number`, unary `+`) says\
    \ 'the whole string must be a number'. Lenient parsing (`parseInt`, `parseFloat`) says 'read as much\
    \ number as you can from the start'. Pick based on how forgiving you want to be, and validate either\
    \ way.\n\n## How it works\n- `Number(s)` and `+s`: trim whitespace, accept decimals, exponents, and\
    \ `0x`/`0b`/`0o` prefixes; `''` becomes 0; anything invalid becomes `NaN`.\n- `parseInt(s, radix)`:\
    \ reads leading digits in the given base and ignores the rest. Always pass the radix, usually 10.\n\
    - `parseFloat(s)`: like `parseInt` for decimals; no radix.\n- `BigInt(s)` for integers beyond 2^53;\
    \ it throws on invalid input instead of returning `NaN`.\n- `Number` does not accept thousands separators\
    \ or locale formats such as `'1,5'`.\n\n## Example\n```javascript\nconsole.log(Number('42'));    \
    \  // 42\nconsole.log(Number('42px'));    // NaN\nconsole.log(parseInt('42px', 10)); // 42\nconsole.log(parseFloat('3.5kg'));\
    \  // 3.5\nconsole.log(Number(''));        // 0, beware\nconsole.log(+'1e3');            // 1000\n\
    console.log(parseInt(0.0000005)); // 5, number becomes '5e-7'\n\nfunction toNumber(s) {\n  const n\
    \ = Number(s);\n  if (s.trim() === '' || !Number.isFinite(n)) throw new Error('not a number');\n \
    \ return n;\n}\n```\n\n## Common mistakes\n- Forgetting that `Number('')` is 0.\n- Omitting the radix\
    \ in `parseInt`.\n- Passing numbers to `parseInt`, which converts them to strings first and can give\
