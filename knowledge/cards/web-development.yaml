  question: What is a sparse array in JavaScript?
  answer: 'A sparse array has holes: indexes inside its `length` that have never been assigned, such as
    `[1, , 3]` or `new Array(5)`. Reading a hole gives `undefined`, but many methods like `forEach` and
    `map` skip holes, while `for...of` and spread treat them as `undefined`.'
  topic: web development
  tags:
  - javascript
  - arrays
  - edge-cases
  explanation: '## In plain words

    A normal array has a value in every slot. A sparse array has missing slots, not slots holding `undefined`
    but slots that simply do not exist. They look the same when you read them, yet behave differently
    in loops and methods.


    ## How it works

    - Ways to create holes: `[1, , 3]`, `new Array(3)`, `arr[10] = x` on a short array, `delete arr[0]`,
    or setting `arr.length` larger.

    - `length` counts holes; `Object.keys` does not list them; `1 in [1, , 3]` is `false`.

    - **Skip holes**: `forEach`, `map` (keeps the hole in output), `filter`, `reduce`, `some`, `every`,
    `for...in`.

    - **Treat as `undefined`**: `for...of`, spread, `Array.from`, `find`, `includes`, `join` (empty string).

    - Engines store very sparse arrays as dictionaries, which is slower than packed arrays.


    ## Example

    ```javascript

    const a = [1, , 3];

    console.log(a.length);               // 3

    console.log(a[1]);                   // undefined

    console.log(1 in a);                 // false: a hole

    a.forEach((x) => console.log(x));    // 1, 3 (hole skipped)

    console.log([...a]);                 // [1, undefined, 3]


    console.log(new Array(3).map(() => 0));        // [ <3 empty items> ]

    console.log(Array.from({ length: 3 }, () => 0)); // [0, 0, 0]

    ```


    ## Common mistakes

    - Calling `new Array(n).map(...)` and getting holes instead of values. Use `Array.from({ length: n
    }, fn)` or `new Array(n).fill(x)`.

    - Using `delete arr[i]` to remove items; use `splice`.

    - Assuming a hole and an explicit `undefined` behave the same.


    ## In the interview

    Show how holes appear, how different methods treat them, and how to avoid them. Mention the performance
    angle: engines optimise packed arrays of one element kind, and holes can downgrade them.

    '
