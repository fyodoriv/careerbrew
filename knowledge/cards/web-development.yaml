  question: What is the difference between objects and arrays in JavaScript?
  answer: Both are objects, but a plain object maps named keys to values and is meant for records, while
    an array is an ordered list indexed by numbers with a self-updating `length` and list methods like
    `map`, `filter` and `push`. Check for arrays with `Array.isArray`.
