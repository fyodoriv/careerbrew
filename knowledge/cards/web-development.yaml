  question: Why do var and let behave differently in a loop with setTimeout?
  answer: var is function-scoped, so every callback closes over the same variable and sees its final value.
    let creates a new binding per iteration, so each callback captures its own value. for (var i = 0;
    i < 3; i++) setTimeout(() => console.log(i)) prints 3 3 3; with let it prints 0 1 2.
  topic: web development
  tags:
  - javascript
  - closures
  - scope
  - event-loop
  explanation: "## In plain words\n`setTimeout` callbacks run later, after the loop has finished. With\
    \ `var` there is only one `i` for the whole loop, so by the time the callbacks run, `i` has its final\
    \ value. With `let`, each turn of the loop gets its own copy of `i`, and each callback remembers its\
    \ own.\n\n## How it works\n- Callbacks are closures: they keep a reference to variables, not a copy\
    \ of values.\n- `var` creates one binding per function. All three callbacks share it.\n- `let` in\
    \ a `for` header creates a fresh binding for each iteration, initialized from the previous one.\n\
    - The loop runs synchronously; the timers fire afterwards from the event loop, even with a 0 ms delay.\n\
    - Pre-ES2015 fixes: an IIFE that takes `i` as a parameter, or passing `i` as the third argument to\
    \ `setTimeout`.\n\n## Example\n```javascript\nfor (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log('var',\
    \ i), 0);\n} // var 3, var 3, var 3\n\nfor (let j = 0; j < 3; j++) {\n  setTimeout(() => console.log('let',\
    \ j), 0);\n} // let 0, let 1, let 2\n\nfor (var k = 0; k < 3; k++) {\n  setTimeout((n) => console.log('arg',\
    \ n), 0, k);\n} // arg 0, arg 1, arg 2\n```\n\n## Common mistakes\n- Saying the delay causes the problem;\
    \ it happens with 0 ms too.\n- Saying closures copy values.\n- Thinking `let` fixes it only because\
    \ of block scope; the key is the per-iteration binding in `for` loops.\n\n## In the interview\nExplain\
    \ three ideas in order: closures capture variables, `var` has one shared variable, and timers run\
    \ after the loop. Then give the `let` fix and one pre-ES2015 fix. Interviewers use this to test event\
    \ loop and closure understanding, so be ready to draw the timeline.\n"
