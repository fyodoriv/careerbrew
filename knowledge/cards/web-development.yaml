- id: kb-7f0f01aa46a9
  question: How do you check whether a value is a number in JavaScript?
  answer: typeof value === 'number' tells you it is a number primitive, but that includes NaN and Infinity.
    For a usable numeric value, use Number.isFinite(value), which is false for NaN, Infinity, and non-numbers
    without converting. Number.isInteger and Number.isSafeInteger check for whole numbers.
  topic: web development
  tags:
  - javascript
  - numbers
  - typeof
  - validation
  explanation: '## In plain words

    In JavaScript, `NaN` and `Infinity` are technically numbers, so `typeof` alone is not enough when
    you want a value you can do math with. The `Number.is...` helpers answer stricter questions and never
    convert strings.


    ## How it works

    - `typeof v === ''number''`: any number primitive, including `NaN` and `Infinity`.

    - `Number.isFinite(v)`: a number that is not `NaN`, `Infinity`, or `-Infinity`. No coercion, so `''5''`
    gives `false`.

    - Global `isFinite(''5'')` converts first and gives `true`; avoid it for type checks.

    - `Number.isInteger(v)`: finite with no fractional part (`5.0` counts).

    - `Number.isSafeInteger(v)`: integer between -(2^53 - 1) and 2^53 - 1, where integer math is exact.

    - BigInt values have `typeof ''bigint''` and fail all these checks.

    - To validate a numeric string, convert with `Number(s)` and then test with `Number.isFinite`, rejecting
    empty strings.


    ## Example

    ```javascript

    const isNum = (v) => Number.isFinite(v);


    console.log(typeof NaN);              // ''number''

    console.log(isNum(NaN));              // false

    console.log(isNum(42));               // true

    console.log(isNum(''42''));             // false

    console.log(isFinite(''42''));          // true, coerces

    console.log(Number.isInteger(5.0));   // true

    console.log(Number.isSafeInteger(2 ** 53)); // false

    ```


    ## Common mistakes

    - Relying on `typeof` and then crashing later on `NaN`.

    - Using global `isNaN` or `isFinite`, which coerce.

    - Using `parseFloat` for validation; `parseFloat(''12abc'')` returns 12.

    - Forgetting BigInt.


    ## In the interview

    Give `typeof` first, then point out `NaN` and `Infinity`, then recommend `Number.isFinite`. Mention
    safe integers if ids or money come up, and suggest BigInt or decimal libraries for values beyond 2^53
    or for exact decimals.

    '
