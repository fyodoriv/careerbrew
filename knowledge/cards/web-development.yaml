    \ interactive parts; a purely static page with no client JavaScript needs none.\n\n## Example\nA blog\
    \ post or marketing page: SSG (or ISR with a 10-minute revalidate). A dashboard showing a user's orders:\
    \ SSR or client rendering behind auth. A product page with price changes: ISR with on-demand revalidation\
    \ when the price changes.\n\n## Common mistakes\n- Choosing SSR for content that rarely changes and\
