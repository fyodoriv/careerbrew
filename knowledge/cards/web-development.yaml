  question: Why would you create an array with a predefined length in JavaScript?
  answer: 'Mostly to then fill it, for example `new Array(n).fill(0)` or `Array.from({ length: n }, fn)`
    to build a grid, a lookup table or a dynamic programming table of known size. On its own, `new Array(n)`
    creates holes, so it should be filled before use; any speed benefit is engine-dependent and small.'
  topic: web development
  tags:
  - javascript
  - arrays
  - performance
  explanation: "## In plain words\nSometimes you know exactly how many slots you need: 26 letter counters,\
    \ a row of `n` cells, a table for dynamic programming. Creating the array with that size up front\
    \ makes the intent clear and lets you write by index without pushing.\n\n## How it works\n- `new Array(5)`\
    \ creates `length: 5` with five holes, not five `undefined` values. `map` and `forEach` skip holes.\n\
    - Fill it right away:\n  - `new Array(n).fill(0)`: same primitive in each slot.\n  - `Array.from({\
    \ length: n }, (_, i) => i)`: computed values.\n- `new Array(3)` and `new Array(\"3\")` differ: the\
    \ second creates `[\"3\"]`. `Array.of(3)` always creates `[3]`.\n- Engines may preallocate, but holey\
    \ arrays can also be slower than packed ones; push-based building is usually just as fast. Prefer\
    \ clarity.\n- Typed arrays (`new Int32Array(n)`) are truly fixed size, zero-filled and compact, which\
    \ suits numeric work.\n\n## Example\n```javascript\nconst counts = new Array(26).fill(0);\nfor (const\
    \ ch of \"hello\") counts[ch.charCodeAt(0) - 97]++;\nconsole.log(counts[11]);              // 2 (\"\
    l\")\n\nconst rows = 3, cols = 4;\nconst grid = Array.from({ length: rows }, () => new Array(cols).fill(0));\n\
    grid[0][0] = 1;\nconsole.log(grid[1][0]);              // 0: rows are separate arrays\n\n// Bug: every\
    \ row is the same array\nconst bad = new Array(rows).fill(new Array(cols).fill(0));\nbad[0][0] = 1;\n\
    console.log(bad[1][0]);               // 1\n```\n\n## Common mistakes\n- Calling `map` on `new Array(n)`\
    \ and getting holes back.\n- Using `fill` with an object or array, so every slot shares one reference.\n\
    - Overstating the performance benefit.\n\n## In the interview\nGive the practical use cases, show\
