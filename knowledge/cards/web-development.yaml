    \ are hoisted: the function object is created when the scope is entered. Expressions are created when\
    \ that line runs.\n- Defining a function inside a loop or render function creates a new object every\
    \ time.\n\n## Example\n```javascript\nfunction makeCounter() {\n  let count = 0;\n  return function\
    \ next() { return ++count; };\n}\nconst a = makeCounter();\nconst b = makeCounter();\nconsole.log(a\
