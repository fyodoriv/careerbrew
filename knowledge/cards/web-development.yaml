    \ user = { name: \"Ada\", age: 36 };\nfor (const key in user) console.log(key);                  \
    \   // name, age\nfor (const [k, v] of Object.entries(user)) console.log(k, v); // name Ada, age 36\n\
    // for (const v of user) {}  // TypeError: user is not iterable\n```\n\n## Common mistakes\n- Using\
    \ `for...in` on arrays and getting string indexes or extra keys.\n- Expecting `for...of` to work on\
    \ plain objects.\n- Forgetting that `for...in` includes inherited properties; use `Object.hasOwn`\
    \ or `Object.keys` instead.\n\n## In the interview\nState the keys versus values rule, mention the\
    \ iterable protocol behind `for...of`, and say you use `for...of` with `Object.entries` for objects.\
