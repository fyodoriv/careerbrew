- id: kb-b384394e6afe
  question: Can a JavaScript array have a fixed, limited size?
  answer: 'Not by default: arrays grow when you write past the end, and setting length truncates or extends
    them but sets no limit. To block growth, use Object.seal or Object.freeze, or use a typed array, whose
    length is fixed when it is created.'
  topic: web development
  tags:
  - javascript
  - arrays
  - typed-arrays
  - immutability
  explanation: "## In plain words\nA normal JavaScript array is elastic: writing past the end makes it\
    \ longer. There is no built-in 'max size' option. If you need a hard limit, you either lock the array\
    \ object or choose a different structure whose size is fixed from the start.\n\n## How it works\n\
    - `new Array(5)` creates length 5 with empty slots, but you can still push more.\n- `Object.seal(arr)`\
    \ stops adding or removing elements; existing ones can still change.\n- `Object.freeze(arr)` stops\
    \ all changes.\n- Typed arrays such as `Int32Array` or `Float64Array` have a fixed length and a fixed\
    \ numeric element type, backed by an `ArrayBuffer`.\n- For a bounded buffer (for example 'keep the\
    \ last 100 logs'), write a small wrapper that drops old items when full.\n- The spec maximum length\
    \ is 2^32 - 1, which is not a practical limit.\n\n## Example\n```javascript\nconst sealed = Object.seal([1,\
    \ 2, 3]);\nsealed[0] = 9;        // allowed\n// sealed.push(4);    // TypeError: cannot add property\
    \ 3\n\nconst t = new Int8Array(3);\nt[5] = 1;             // silently ignored, out of range\nconsole.log(t.length);\
    \ // 3\n\nfunction pushCapped(arr, item, max) {\n  arr.push(item);\n  if (arr.length > max) arr.shift();\n\
    }\n```\n\n## Common mistakes\n- Thinking `new Array(5)` limits the size.\n- Forgetting that a direct\
    \ write such as `sealed[5] = 1` fails silently outside strict mode; methods like `push` throw a `TypeError`\
    \ in any mode.\n- Using `shift` for large capped buffers; it is O(n). A ring buffer is O(1).\n\n##\
    \ In the interview\nSay 'no by default', then give the three tools: seal or freeze, typed arrays,\
    \ or a wrapper. Mention the trade-off: typed arrays are fast and fixed but only hold numbers. A follow-up\
    \ could be implementing a ring buffer with a head index and modulo arithmetic.\n"
  match:
