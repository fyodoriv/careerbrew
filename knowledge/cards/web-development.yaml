- id: kb-41abc5d69f35
  question: What is the difference between primitives and objects in JavaScript?
  answer: 'Primitives (string, number, bigint, boolean, undefined, null, symbol) are immutable values
    copied by value. Everything else is an object: a mutable collection of properties that variables hold
    by reference, so two variables can point to the same object.'
  topic: web development
  tags:
  - javascript
  - types
  - primitives
  - references
  explanation: '## In plain words

    A primitive is a simple value like `42` or `"hi"`; you can replace it but never change it in place.
    An object is a container. A variable holding an object holds a reference to it, like an address written
    on a note; copying the variable copies the note, not the house.


    ## How it works

    - Seven primitive types: `string`, `number`, `bigint`, `boolean`, `undefined`, `null`, `symbol`.

    - Primitives are compared by value: `"a" === "a"` is `true`.

    - Objects (including arrays, functions, dates) are compared by reference: `{} === {}` is `false`.

    - Assigning or passing an object shares the same object, so mutations are visible everywhere.

    - When you call a method on a primitive, like `"hi".toUpperCase()`, JavaScript briefly wraps it in
    a wrapper object (`String`) and discards it.

    - `typeof null` is `"object"`, a historical bug; `null` is still a primitive.


    ## Example

    ```javascript

    let a = 5;

    let b = a;

    b++;

    console.log(a, b);            // 5 6


    const p = { score: 5 };

    const q = p;

    q.score++;

    console.log(p.score);         // 6, same object


    console.log([1] === [1]);     // false

    ```


    ## Common mistakes

    - Assuming `const obj` makes the object immutable; it only fixes the binding. Use `Object.freeze`
    for a shallow freeze.

    - Believing JavaScript passes objects "by reference"; it passes the reference by value, so reassigning
    a parameter does not affect the caller.

    - Comparing arrays or objects with `===` to check equal content.


    ## In the interview

    List the seven primitives, explain value versus reference semantics with a short example, and mention
    auto-boxing. Good follow-ups: how to copy an object (spread for shallow, `structuredClone` for deep)
    and why React state updates need new object references.

    '
