  - security
  - browser
  explanation: "## In plain words\nBefore a web page sends a potentially risky request to another origin\
    \ (another domain, port or scheme), the browser first asks the server for permission. That question\
    \ is the preflight. If the server says yes, the browser sends the real request; if not, the request\
    \ never goes out.\n\n## How it works\n- A \"simple\" request uses `GET`, `HEAD` or `POST`, only safe\
    \ headers, and a `Content-Type` of `text/plain`, `multipart/form-data` or `application/x-www-form-urlencoded`.\
    \ It skips the preflight.\n- Anything else triggers an `OPTIONS` request with:\n  - `Origin`\n  -\
    \ `Access-Control-Request-Method`\n  - `Access-Control-Request-Headers`\n- The server replies with\
    \ `Access-Control-Allow-Origin`, `Access-Control-Allow-Methods`, `Access-Control-Allow-Headers`, and\
    \ optionally `Access-Control-Max-Age` so the browser can cache the answer.\n- With cookies, the server\
    \ also needs `Access-Control-Allow-Credentials: true` and a specific origin, not `*`.\n\n## Example\n\
    ```http\nOPTIONS /api/items HTTP/1.1\nOrigin: https://app.example.com\nAccess-Control-Request-Method:\
    \ PUT\nAccess-Control-Request-Headers: content-type\n\nHTTP/1.1 204 No Content\nAccess-Control-Allow-Origin:\
