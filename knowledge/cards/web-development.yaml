  question: How do var, let and const differ in scope in JavaScript?
  answer: '`var` is function-scoped (or global), is hoisted and initialised to `undefined`, and can be
    redeclared. `let` and `const` are block-scoped, sit in a temporal dead zone until their declaration
    runs, and cannot be redeclared in the same scope; `const` also cannot be reassigned.'
  topic: web development
  tags:
  - javascript
  - scope
  - variables
  - hoisting
  explanation: "## In plain words\nScope is where a variable is visible. A `var` ignores curly braces\
    \ and belongs to the whole function. `let` and `const` stay inside the nearest pair of braces, which\
    \ is almost always what you want.\n\n## How it works\n- **`var`**: scope is the enclosing function,\
    \ or the global object at top level (where it becomes a property of `window`). Hoisted: usable before\
    \ the declaration line, with value `undefined`. Redeclaring is allowed.\n- **`let`**: block scope\
    \ (`if`, `for`, `{}`). Hoisted but uninitialised: touching it before the declaration throws a `ReferenceError`\
    \ (the temporal dead zone). Can be reassigned.\n- **`const`**: like `let`, but must be initialised\
    \ and cannot be reassigned. The value itself is not frozen: an object held in a `const` can still\
    \ be mutated.\n- In `for (let i ...)` loops, each iteration gets a new `i`, which fixes the classic\
    \ closure-in-a-loop bug.\n\n## Example\n```javascript\nfunction demo() {\n  if (true) {\n    var a\
    \ = 1;\n    let b = 2;\n  }\n  console.log(a);          // 1\n  // console.log(b);       // ReferenceError:\
    \ b is not defined\n}\ndemo();\n\nfor (var i = 0; i < 3; i++) setTimeout(() => console.log(\"var\"\
    , i));  // 3 3 3\nfor (let j = 0; j < 3; j++) setTimeout(() => console.log(\"let\", j));  // 0 1 2\n\
    \nconst list = [];\nlist.push(1);              // fine: mutation, not reassignment\n```\n\n## Common\
    \ mistakes\n- Believing `let` and `const` are not hoisted at all.\n- Thinking `const` makes objects\
    \ immutable.\n- Using `var` in loops with async callbacks.\n\n## In the interview\nCompare the three\
    \ on scope, hoisting, redeclaration and reassignment. Say your default: `const` everywhere, `let`\
    \ when the value must change, `var` never in new code. Expect a loop-with-`setTimeout` puzzle as a\
    \ follow-up.\n"
