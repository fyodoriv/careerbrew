- id: kb-16ec32a1cb97
  question: How do errors propagate through the call stack?
  answer: When code throws, the current function stops and the runtime unwinds the call stack, frame by
    frame, until it finds an enclosing try/catch. If none catches it, the error reaches the top level
    and becomes an uncaught exception. Async errors propagate through promise rejections instead of the
    synchronous stack.
  topic: web development
  tags:
  - javascript
  - errors
  - call-stack
  - exceptions
  - async
  explanation: "## In plain words\nThe call stack is the list of functions currently running, each waiting\
    \ for the one it called. When an error is thrown, the runtime walks back up that list looking for\
    \ someone who said 'I will handle errors here' with `try/catch`. Every function in between stops immediately.\n\
    \n## How it works\n- `throw` creates a jump: the rest of the current function is skipped.\n- The runtime\
    \ checks each caller in turn. The nearest `catch` gets the error; `finally` blocks run on the way\
    \ out.\n- If nothing catches it, the program reports an uncaught error (in Node.js the process exits\
    \ by default; in browsers it is logged and the current task ends).\n- `Error` objects record a `stack`\
    \ trace when created, showing the path of calls.\n- Async code: an error inside a `setTimeout` callback\
    \ is not caught by a `try` around the `setTimeout` call, because the original stack is gone. With\
    \ promises, a throw becomes a rejection that flows to the next `.catch` or to an `await` inside `try`.\n\
    \n## Example\n```javascript\nfunction parse(s) { return JSON.parse(s); }\nfunction load(s) { return\
    \ parse(s).value; }\n\ntry {\n  load('{bad json');\n} catch (e) {\n  console.log('caught', e.name);\
    \ // caught SyntaxError\n} finally {\n  console.log('cleanup');\n}\n\nasync function main() {\n  try\
    \ {\n    await Promise.reject(new Error('net'));\n  } catch (e) {\n    console.log('async caught',\
    \ e.message);\n  }\n}\nmain();\n```\n\n## Common mistakes\n- Wrapping an async call in `try` without\
    \ `await`.\n- Swallowing errors with an empty `catch`.\n- Throwing strings instead of `Error` objects,\
    \ which loses the stack trace.\n- Catching too low, where the function cannot do anything useful about\
    \ the error.\n\n## In the interview\nDescribe unwinding, `finally`, and what happens when nothing\
    \ catches. Then cover async: promise rejections, `await` in `try`, and global handlers like `unhandledrejection`.\
    \ Mention a design principle: catch where you can recover or add context, and rethrow otherwise, possibly\
    \ with `new Error('msg', { cause })`.\n"
