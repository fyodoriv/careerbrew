- id: kb-9df4d0600a68
  question: What are enumerable properties in JavaScript?
  answer: An enumerable property is one whose internal `enumerable` flag is true, so it shows up in `for...in`,
    `Object.keys`, `Object.entries`, spread and `JSON.stringify`. Properties created by normal assignment
    are enumerable; built-in methods and properties added with `Object.defineProperty` default to non-enumerable.
  topic: web development
  tags:
  - javascript
  - objects
  - property-descriptors
  explanation: '## In plain words

    Every property has a few hidden settings. One of them, `enumerable`, decides whether the property
    is listed when you ask an object "what keys do you have?". A non-enumerable property still exists
    and can be read; it is just hidden from listings.


    ## How it works

    - Each property has a descriptor: `value`, `writable`, `enumerable`, `configurable` (or `get`/`set`
    for accessors).

    - `obj.x = 1` or an object literal creates an enumerable property.

    - `Object.defineProperty(obj, "x", { value: 1 })` creates a non-enumerable one unless you pass `enumerable:
    true`.

    - Built-ins like `Array.prototype.map` are non-enumerable, which is why `for...in` over an array does
    not list them.

    - `for...in` lists enumerable string keys, including inherited ones; `Object.keys` lists only own
    enumerable string keys.

    - `Object.getOwnPropertyNames` lists own string keys whether enumerable or not.

    - Check with `obj.propertyIsEnumerable("x")` or `Object.getOwnPropertyDescriptor`.


    ## Example

    ```javascript

    const user = { name: "Ada" };

    Object.defineProperty(user, "id", { value: 7 });


    console.log(user.id);                          // 7

    console.log(Object.keys(user));                // ["name"]

    console.log(JSON.stringify(user));             // {"name":"Ada"}

    console.log(Object.getOwnPropertyNames(user)); // ["name", "id"]

    ```


    ## Common mistakes

    - Thinking a non-enumerable property is private; anyone can still read it.

    - Forgetting that `for...in` also walks inherited enumerable properties.

    - Being surprised that a property added with `defineProperty` is missing from JSON output.


    ## In the interview

    Define it via property descriptors, list which APIs respect the flag, and give a use case: libraries
    hide helper or metadata properties so they do not appear in loops or serialisation. Symbols are a
    related tool: symbol keys are skipped by `Object.keys` regardless of enumerability.

    '
