  question: What is the difference between for...in and for...of loops in JavaScript?
  answer: '`for...in` loops over the enumerable property keys of an object (as strings), including inherited
    ones. `for...of` loops over the values produced by an iterable such as an array, string, Map or Set,
    and does not work on plain objects.'
  topic: web development
  tags:
  - javascript
  - loops
  - iterators
  explanation: "## In plain words\n`in` gives you the names (keys); `of` gives you the contents (values).\
    \ Use `for...in` to inspect an object's keys and `for...of` to walk through the items of a collection.\n\
    \n## How it works\n- **`for...in`**:\n  - Works on any object.\n  - Yields enumerable string keys,\
    \ own and inherited.\n  - On arrays it yields indexes as strings (`\"0\"`, `\"1\"`), plus any extra\
    \ properties someone added.\n- **`for...of`**:\n  - Works on iterables: objects that implement `Symbol.iterator`,\
    \ such as arrays, strings, `Map`, `Set`, `arguments`, `NodeList` and generators.\n  - Yields values\
    \ in order and supports `break`, `continue` and `await` (with `for await...of`).\n  - A plain object\
    \ is not iterable; use `Object.keys`, `Object.values` or `Object.entries` with it.\n\n## Example\n\
    ```javascript\nconst arr = [\"a\", \"b\"];\narr.extra = \"x\";\n\nfor (const k in arr) console.log(k);\
