- id: kb-81fdd8384dae
  question: What is the JavaScript event loop and how does it work?
  answer: JavaScript runs on one thread with a call stack. The event loop repeatedly takes one task from
    the task queue (a timer, an event, an I/O callback), runs it to completion, then drains all microtasks
    such as promise callbacks, and lets the browser render. Long-running work therefore blocks everything
    else.
  topic: web development
  tags:
  - javascript
  - event-loop
  - async
  - concurrency
  explanation: "## In plain words\nThink of a single chef with an order queue. The chef finishes one dish\
    \ completely, then checks the \"urgent notes\" pile (microtasks) and clears it, then takes the next\
    \ order. Slow I/O like network requests is handed to helpers (the browser or Node), who put a new\
    \ order in the queue when they are done.\n\n## How it works\n- **Call stack**: functions currently\
    \ executing. Only one thing runs at a time.\n- **Web APIs / Node APIs**: timers, `fetch`, DOM events\
    \ and file I/O are handled outside the JS thread.\n- **Task queue**: callbacks from those APIs waiting\
    \ to run.\n- **Microtask queue**: promise reactions, `await` continuations, `queueMicrotask`.\n- **The\
    \ loop**:\n  1. Take the oldest task and run it until the stack is empty.\n  2. Run every microtask,\
    \ including new ones added meanwhile.\n  3. If it is time, render (style, layout, paint; `requestAnimationFrame`\
    \ runs here).\n  4. Repeat.\n- Because tasks run to completion, a 2-second loop freezes clicks and\
    \ painting for 2 seconds.\n\n## Example\n```javascript\nconsole.log(\"A\");\nsetTimeout(() => console.log(\"\
    D\"), 0);\nPromise.resolve().then(() => console.log(\"C\"));\nconsole.log(\"B\");\n// A B C D\n```\n\
    \n## Common mistakes\n- Thinking `async` code runs in parallel threads.\n- Believing a `setTimeout`\
    \ delay is exact; it is a minimum.\n- Ignoring that heavy synchronous work blocks rendering.\n\n##\
    \ In the interview\nDraw the stack, the queues and the loop, then trace a snippet. Mention ways to\
    \ avoid blocking: split work into chunks, use Web Workers for CPU-heavy tasks, and `requestAnimationFrame`\
    \ for visual updates. In Node, mention its phases (timers, poll, check) and `process.nextTick`.\n"
