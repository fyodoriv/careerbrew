    );\n\nconst proto = { greet() { return \"Hi \" + this.name; } };\nconst c = Object.create(proto);\n\
    c.name = \"Linus\";\n\nconst makePerson = (name) => ({ name, greet: () => \"Hi \" + name });\nconsole.log(a.greet(),\
    \ b.greet(), c.greet(), makePerson(\"Kay\").greet());\n```\n\n## Common mistakes\n- Forgetting `new`\
