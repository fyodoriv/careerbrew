    \ is about checking what you caught and making expected failures visible in the types.\n\n## How it\
    \ works\n- With `useUnknownInCatchVariables` (on in `strict` mode), `catch (e)` gives `e: unknown`;\
    \ narrow with `e instanceof Error` or a custom guard.\n- Custom error classes (`class NotFoundError\
    \ extends Error`) let callers branch with `instanceof`.\n- Function signatures do not declare thrown\
    \ types, so for expected failures some teams return a result union such as `{ ok: true, value } |\
    \ { ok: false, error }`. The compiler then forces callers to handle both cases.\n- Async code: `await`\
    \ inside `try`, or `.catch` on promises; the error is also untyped.\n- Use `never` in exhaustive `switch`\
    \ statements to catch unhandled cases at compile time.\n\n## Example\n```typescript\nclass NotFoundError\
    \ extends Error {\n  constructor(public id: string) {\n    super(`Not found: ${id}`);\n    this.name\
