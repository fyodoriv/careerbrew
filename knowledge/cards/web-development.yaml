  question: How do you narrow a value of type unknown to a specific interface or type in TypeScript?
  answer: 'Use runtime checks that TypeScript understands: typeof, instanceof, the in operator, discriminant
    fields, or a user-defined type guard function returning value is MyType. For external data, validate
    with a schema library and derive the type from the schema.'
  topic: web development
  tags:
  - typescript
  - type-narrowing
  - type-guards
  - unknown
  explanation: "## In plain words\n`unknown` means 'some value, but I will not let you use it until you\
    \ prove what it is'. Narrowing is that proof: you write a normal runtime check, and TypeScript updates\
    \ the type inside the branch where the check passed. Interfaces do not exist at runtime, so you must\
    \ check the shape yourself.\n\n## How it works\n- Primitives: `typeof x === 'string'`.\n- Classes:\
    \ `x instanceof Date`.\n- Objects: first `typeof x === 'object' && x !== null`, then `'name' in x`.\n\
    - Discriminated unions: check a literal field like `x.kind === 'circle'`.\n- User-defined type guard:\
    \ a function with return type `value is User`. TypeScript trusts it, so the check must really be complete.\n\
    - Assertion functions: `asserts value is User` narrow by throwing on failure.\n- For API data, schema\
    \ validators produce both the runtime check and the static type.\n\n## Example\n```typescript\ninterface\
    \ User { id: number; name: string }\n\nfunction isUser(v: unknown): v is User {\n  return (\n    typeof\
    \ v === 'object' && v !== null &&\n    'id' in v && typeof (v as { id: unknown }).id === 'number'\
    \ &&\n    'name' in v && typeof (v as { name: unknown }).name === 'string'\n  );\n}\n\nconst data:\
    \ unknown = JSON.parse('{\"id\":1,\"name\":\"Ann\"}');\nif (isUser(data)) {\n  console.log(data.name.toUpperCase());\
    \ // data is User here\n}\n```\n\n## Common mistakes\n- Using `as User`, which silences the compiler\
    \ without checking anything.\n- Forgetting that `typeof null === 'object'`.\n- Writing a type guard\
    \ that checks only one field, so bad data passes.\n- Using `any` instead of `unknown` for untrusted\
    \ input.\n\n## In the interview\nExplain that types are erased at runtime, so narrowing needs real\
    \ checks. Walk through the tools from simplest to strongest, and recommend schema validation at system\
    \ boundaries such as API responses. Trade-off: hand-written guards have no dependency but drift from\
    \ the type; schema-derived types stay in sync.\n"
