  question: What happens if one of the promises passed to Promise.all rejects?
  answer: '`Promise.all` rejects immediately with the reason of the first promise that rejects, and the
    results of the others are discarded. The other operations are not cancelled; they keep running. Use
    `Promise.allSettled` to get every outcome.'
  topic: web development
  tags:
  - javascript
  - promises
  - async
  - concurrency
  explanation: "## In plain words\n`Promise.all` is all-or-nothing. It gives you an array of results only\
    \ if every promise succeeds. The moment one fails, the whole thing fails with that error, and you\
    \ do not get the successful results.\n\n## How it works\n- Input: an iterable of promises or values.\
    \ Output: one promise.\n- Fulfils with an array of values in input order (not finish order) when all\
    \ fulfil.\n- Rejects as soon as any input rejects (\"fail fast\"), with that first reason.\n- Later\
    \ rejections are ignored silently, and nothing is aborted: requests and timers continue. Use an `AbortController`\
    \ to actually cancel.\n- Relatives:\n  - `Promise.allSettled`: waits for all and returns `{status,\
    \ value | reason}` for each.\n  - `Promise.any`: first fulfilment wins; rejects with an `AggregateError`\
    \ only if all fail.\n  - `Promise.race`: first to settle, success or failure.\n\n## Example\n```javascript\n\
    const wait = (ms, v, fail) =>\n  new Promise((res, rej) => setTimeout(() => (fail ? rej(new Error(v))\
    \ : res(v)), ms));\n\nPromise.all([wait(100, \"a\"), wait(50, \"b\", true), wait(200, \"c\")])\n \
    \ .then(console.log)\n  .catch((e) => console.log(\"failed:\", e.message));    // failed: b (after\
    \ 50 ms)\n\nPromise.allSettled([wait(10, \"a\"), wait(20, \"b\", true)])\n  .then((r) => console.log(r.map((x)\
    \ => x.status)));   // [\"fulfilled\", \"rejected\"]\n```\n\n## Common mistakes\n- Assuming the other\
    \ requests are cancelled.\n- Expecting results in completion order.\n- Using `Promise.all` for independent\
    \ tasks where partial success is fine.\n\n## In the interview\nExplain fail-fast semantics, then compare\
    \ the four combinators and when you would use each. Mention limiting concurrency for large batches\
    \ (a pool of N at a time) and cancelling with `AbortController` when the first failure makes the rest\
    \ useless.\n"
