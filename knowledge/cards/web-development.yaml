  question: How does Array.prototype.reduce work in JavaScript?
  answer: reduce walks through the array and calls a reducer (accumulator, current, index, array) for
    each element, passing the returned value as the next accumulator. It returns the final accumulator.
    Always pass an initial value; without one it uses the first element and throws on an empty array.
  topic: web development
  tags:
  - javascript
  - arrays
  - reduce
  - functional-programming
  explanation: "## In plain words\n`reduce` folds a list into one value. You keep a running result (the\
    \ accumulator) and, for each item, decide how the item changes that result. Summing numbers, counting\
    \ words, and grouping records are all reductions.\n\n## How it works\n- Signature: `arr.reduce((acc,\
    \ item, index, array) => newAcc, initialValue)`.\n- With an initial value, the first call gets `acc\
    \ = initialValue` and `item = arr[0]`.\n- Without one, `acc = arr[0]` and iteration starts at index\
    \ 1; an empty array then throws a `TypeError`.\n- The callback must return the new accumulator every\
    \ time.\n- `reduceRight` processes from the end.\n- Time is O(n) as long as each step is O(1); spreading\
    \ the accumulator each step makes it O(n^2).\n\n## Example\n```javascript\nconst nums = [3, 1, 4];\n\
    const sum = nums.reduce((acc, n) => acc + n, 0); // 8\n\nconst words = ['a', 'b', 'a'];\nconst counts\
    \ = words.reduce((acc, w) => {\n  acc[w] = (acc[w] ?? 0) + 1;\n  return acc;\n}, {});\nconsole.log(counts);\
    \ // { a: 2, b: 1 }\n\nconst max = nums.reduce((m, n) => Math.max(m, n), -Infinity); // 4\n```\n\n\
    ## Common mistakes\n- Forgetting to return the accumulator, so it becomes `undefined`.\n- Omitting\
    \ the initial value and crashing on empty input or getting the wrong type.\n- Writing `{ ...acc, [k]:\
    \ v }` inside reduce over large arrays, which copies each time.\n- Using `reduce` where `map`, `filter`,\
    \ or a plain loop would read better.\n\n## In the interview\nDescribe the accumulator idea, the initial\
    \ value rule, and show a sum and a group-by. Interviewers may ask you to implement `map` or `filter`\
    \ with `reduce`, or to write `reduce` itself. Mention readability: for complex logic a `for...of`\
    \ loop is often clearer.\n"
