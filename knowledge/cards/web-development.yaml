    \ or a hero image set by JavaScript. The browser only finds them after downloading and reading something\
    \ else. Preload points at them up front so the download starts right away.\n\n## How it works\n- Requires\
    \ the `as` attribute (`style`, `script`, `font`, `image`, `fetch`) so the browser sets the right priority,\
    \ headers and caching.\n- Fonts need `crossorigin`, even from the same origin, because fonts are fetched\
    \ in CORS mode.\n- The file is fetched and held in memory; it is used when the page actually requests\
    \ it with matching attributes.\n- If a preloaded resource is not used within a few seconds, browsers\
    \ warn in the console.\n- Can also be sent as a `Link` HTTP header, or with `103 Early Hints` before\
    \ the main response is ready.\n- `modulepreload` is the variant for ES modules and also parses them.\n\
    - `fetchpriority=\"high\"` on an `img` is a lighter alternative for the main image.\n\n## Example\n\
