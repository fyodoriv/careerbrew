  question: How do you remove duplicates from an array in JavaScript?
  answer: 'For primitive values, use [...new Set(arr)], which keeps the first occurrence and runs in O(n).
    For objects, dedupe by a key: keep a Set or Map of seen keys while filtering. Avoid filter with indexOf
    on large arrays because it is O(n^2).'
  topic: web development
  tags:
  - javascript
  - arrays
  - set
  - deduplication
  explanation: "## In plain words\nA `Set` only stores each value once, so passing an array through a\
    \ set and back removes repeats. That works for numbers and strings. Objects are compared by reference,\
    \ so two objects with the same content are not duplicates to a set; for them you pick a field that\
    \ identifies each item.\n\n## How it works\n- Primitives: `[...new Set(arr)]` or `Array.from(new Set(arr))`.\
    \ Insertion order is kept, so the first occurrence wins. O(n) time and space.\n- Equality is SameValueZero,\
    \ so `NaN` is deduplicated too, which `indexOf` cannot do.\n- Objects by key: iterate once, track\
    \ seen keys in a `Set`, keep items whose key is new.\n- Keep the last occurrence instead: build a\
    \ `Map` from key to item; later items overwrite earlier ones.\n- `arr.filter((x, i) => arr.indexOf(x)\
    \ === i)` works but is O(n^2).\n\n## Example\n```javascript\nconst nums = [3, 1, 3, 2, 1];\nconsole.log([...new\
    \ Set(nums)]); // [3, 1, 2]\n\nconst users = [\n  { id: 1, name: 'Ann' },\n  { id: 2, name: 'Bo' },\n\
    \  { id: 1, name: 'Ann again' },\n];\n\nfunction uniqueBy(items, key) {\n  const seen = new Set();\n\
    \  return items.filter(item => {\n    const k = item[key];\n    if (seen.has(k)) return false;\n \
    \   seen.add(k);\n    return true;\n  });\n}\nconsole.log(uniqueBy(users, 'id').map(u => u.name));\
    \ // ['Ann', 'Bo']\n\nconst lastWins = [...new Map(users.map(u => [u.id, u])).values()];\n```\n\n\
    ## Common mistakes\n- Expecting `Set` to dedupe objects by content.\n- Using `JSON.stringify` as a\
    \ key without thinking: property order changes the string.\n- Using the O(n^2) `indexOf` version on\
    \ big inputs.\n- Forgetting to say which duplicate is kept.\n\n## In the interview\nGive the `Set`\
    \ one-liner, state its complexity, and then handle objects by key. Ask the clarifying questions an\
    \ interviewer wants to hear: keep first or last, is order important, and how are two items considered\
    \ equal? Mention that sorting first and skipping equal neighbours also works in O(n log n) time if\
    \ the original order does not matter.\n"
