  question: What is the Set-Cookie HTTP header?
  answer: '`Set-Cookie` is a response header that tells the browser to store a cookie, which the browser
    then sends back in the `Cookie` request header to matching URLs. Attributes control its lifetime (`Expires`,
    `Max-Age`), scope (`Domain`, `Path`) and security (`Secure`, `HttpOnly`, `SameSite`).'
  topic: web development
  tags:
  - http
  - cookies
  - security
  - web
  explanation: "## In plain words\nHTTP is stateless: each request stands alone. A cookie is a small note\
    \ the server asks the browser to keep and show again on each later request, which is how sites remember\
    \ who is logged in. `Set-Cookie` is how the server hands over that note.\n\n## How it works\n- Syntax:\
    \ `Set-Cookie: name=value; Attribute; Attribute=value`. One header per cookie.\n- **Lifetime**: without\
    \ `Expires` or `Max-Age` it is a session cookie, deleted when the browser session ends. `Max-Age=0`\
    \ deletes it.\n- **Scope**: `Domain` (omit it to limit the cookie to the exact host) and `Path`.\n\
    - **Security**:\n  - `Secure`: only sent over HTTPS.\n  - `HttpOnly`: hidden from JavaScript (`document.cookie`),\
    \ which limits theft through XSS.\n  - `SameSite=Strict | Lax | None`: controls whether it is sent\
    \ on cross-site requests, a defence against CSRF. Chromium-based browsers treat a cookie with no `SameSite`\
    \ as `Lax`, but other browsers differ, so set it explicitly; `None` requires `Secure`.\n- Prefixes\
    \ `__Host-` and `__Secure-` enforce secure settings.\n- Size limit is about 4 KB per cookie, and every\
    \ matching request carries all cookies, adding bytes.\n\n## Example\n```http\nHTTP/1.1 200 OK\nSet-Cookie:\
    \ __Host-session=abc123; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=3600\nSet-Cookie: theme=dark;\
    \ Path=/; Max-Age=31536000\n\nGET /account HTTP/1.1\nCookie: __Host-session=abc123; theme=dark\n```\n\
    \n## Common mistakes\n- Session cookies without `HttpOnly` and `Secure`.\n- Storing sensitive data\
    \ in the cookie value itself instead of an opaque id.\n- Setting `SameSite=None` without `Secure`,\
    \ so browsers reject it.\n- Forgetting cookies are sent with every request, including static assets\
    \ on that domain.\n\n## In the interview\nExplain the request-response cycle, then the security attributes\
    \ and which attack each one mitigates. Expect follow-ups on cookies versus `localStorage` for tokens,\
    \ CSRF tokens, and third-party cookie restrictions.\n"
