- id: kb-75bd8758b931
  question: Can you change the value of an imported binding in a JavaScript module?
  answer: 'No. ES module imports are read-only live bindings: assigning to an import throws a TypeError.
    The exporting module can change the value, and importers will see the update. If the export is an
    object, its properties can still be mutated.'
  topic: web development
  tags:
  - javascript
  - modules
  - esm
  - imports
  explanation: '## In plain words

    An ES module import is not a copy of a value; it is a read-only window onto a variable that lives
    in the other module. You can look through the window but not reassign what is behind it. The owning
    module can change it, and you will see the new value.


    ## How it works

    - `import { count } from ''./m.js''` creates a live binding to `count` in `m.js`.

    - Assigning `count = 5` in the importer throws `TypeError: Assignment to constant variable`.

    - If `m.js` does `count++`, importers see the new value on their next read.

    - If the export is an object, the binding is read-only but the object is not frozen, so `config.debug
    = true` works and every importer sees it.

    - CommonJS `require` is different: it returns a snapshot of `module.exports`, so primitive values
    do not update live.


    ## Example

    ```javascript

    // counter.js

    export let count = 0;

    export function inc() { count++; }

    export const settings = { debug: false };


    // main.js

    import { count, inc, settings } from ''./counter.js'';

    inc();

    console.log(count);    // 1, live binding

    settings.debug = true; // allowed, mutates the shared object

    // count = 10;         // TypeError

    ```


    ## Common mistakes

    - Expecting an import to behave like a local variable.

    - Mixing up ESM live bindings with CommonJS copies.

    - Mutating shared exported objects by accident, which creates hidden global state.


    ## In the interview

    Use the phrase ''read-only live binding'' and contrast with CommonJS. A good design point: expose
    setter functions instead of letting importers mutate shared objects. Follow-ups may cover circular
    imports, where live bindings explain why a value can be `undefined` or in the temporal dead zone during
    startup.

    '
