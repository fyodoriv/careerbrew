- id: kb-c2dae450e00b
  question: What happens if a Promise is resolved with another Promise?
  answer: 'The outer promise adopts the state of the inner one: it waits for it and settles with the same
    value or rejection. You never get a promise of a promise; `Promise.resolve(p)` even returns `p` itself
    when `p` is a native promise.'
  topic: web development
  tags:
  - javascript
  - promises
  - async
  explanation: '## In plain words

    Promises flatten automatically. If you resolve a promise with another promise (or any "thenable",
    an object with a `then` method), the first one simply follows the second and ends up with its final
    result.


    ## How it works

    - `resolve(x)` inside `new Promise` checks whether `x` is thenable. If so, it subscribes to it and
    copies its outcome, which costs extra microtask ticks.

    - If the inner promise rejects, the outer one rejects with the same reason, even though you called
    `resolve`.

    - `Promise.resolve(p)` returns `p` unchanged when `p` is a native promise of the same constructor.

    - Returning a promise from a `then` callback works the same way, which is why chains flatten.

    - `await` also unwraps nested thenables until it reaches a plain value.


    ## Example

    ```javascript

    const inner = Promise.resolve(42);

    console.log(Promise.resolve(inner) === inner);   // true


    const outer = new Promise((resolve) => resolve(inner));

    outer.then((v) => console.log(v));               // 42, not a Promise


    const failing = new Promise((resolve) => resolve(Promise.reject(new Error("no"))));

    failing.catch((e) => console.log(e.message));    // "no"

    ```


    ## Common mistakes

    - Expecting the value of the outer promise to be a promise object.

    - Assuming "resolved" means "fulfilled"; a resolved promise can still reject if it was resolved with
    a rejecting promise.

    - Relying on exact tick ordering between adopted and plain promises; adoption adds extra microtask
    steps.


    ## In the interview

    Use the precise vocabulary: resolved means "locked in to an outcome", fulfilled and rejected are the
    final states. Explain thenable assimilation and why it lets libraries interoperate. A good follow-up:
    what happens when you resolve a promise with itself (it rejects with a `TypeError`).

    '
