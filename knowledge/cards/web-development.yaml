  - rendering
  - nextjs
  - performance
  explanation: "## In plain words\nBoth send ready-made HTML to the browser. The difference is when it\
    \ is cooked: SSG cooks everything in advance and keeps it on the shelf; SSR cooks to order for each\
    \ visitor.\n\n## How it works\n- **SSG**\n  - At build time, fetch data and render every page to HTML.\n\
    \  - Deploy to a CDN; requests are served from the nearest edge.\n  - Pros: very fast, cheap, robust,\
    \ easy to cache. Cons: stale data, long builds for many pages, no per-user content in the HTML.\n\
    - **SSR**\n  - On each request, the server fetches data and renders HTML.\n  - Pros: fresh and personalised\
    \ (cookies, auth, location). Cons: server cost, latency, needs scaling and careful caching.\n- **Hybrids**\n\
    \  - Incremental static regeneration (ISR): serve static pages and rebuild them in the background\
    \ after a time or on demand.\n  - Static shell plus client-side fetching for personal parts.\n  -\
