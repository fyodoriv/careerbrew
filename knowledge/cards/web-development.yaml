  question: How do tagged template functions work in JavaScript?
  answer: A tag is a function placed before a template literal, like tag`Hello ${name}`. It receives an
    array of the literal string parts and then each interpolated value as separate arguments, and can
    return anything. It is used for escaping, i18n, styling, and query builders.
  topic: web development
  tags:
  - javascript
  - template-literals
  - tagged-templates
  - strings
  explanation: "## In plain words\nA normal template literal glues strings and values together automatically.\
    \ A tagged template hands both pieces to your function first, so you decide how to combine them. That\
    \ is useful when values need special treatment, such as escaping HTML or passing SQL parameters safely.\n\
    \n## How it works\n- Call shape: `` tag`a${x}b${y}c` `` calls `tag(['a', 'b', 'c'], x, y)`.\n- The\
    \ strings array always has one more element than there are values (it can contain empty strings).\n\
    - `strings.raw` holds the text without escape processing, which is how `String.raw` works.\n- The\
    \ strings array is the same frozen object each time the same call site runs, so libraries can cache\
    \ by it.\n- The tag can return any type, not only a string.\n\n## Example\n```javascript\nfunction\
    \ escapeHtml(s) {\n  return String(s).replace(/[&<>\"']/g, c => `&#${c.charCodeAt(0)};`);\n}\n\nfunction\
    \ html(strings, ...values) {\n  return strings.reduce(\n    (out, str, i) => out + str + (i < values.length\
    \ ? escapeHtml(values[i]) : ''),\n    ''\n  );\n}\n\nconst name = '<script>';\nconsole.log(html`<p>Hello\
    \ ${name}</p>`);\n// <p>Hello &#60;script&#62;</p>\n\nconsole.log(String.raw`C:\\new`); // C:\\new\n\
    ```\n\n## Common mistakes\n- Forgetting the extra string at the end and dropping the last part.\n\
    - Calling it with parentheses, `tag(`...`)`, which passes one finished string instead.\n- Assuming\
    \ the tag escapes values automatically; only your code does that.\n\n## In the interview\nExplain\
    \ the argument shape, then give a real use: safe HTML, SQL parameterization, CSS-in-JS, or GraphQL\
    \ queries. Mention `String.raw` as a built-in tag. A follow-up might be implementing a tag; use rest\
    \ parameters and `reduce` as above.\n"
