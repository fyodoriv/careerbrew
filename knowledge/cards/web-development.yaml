  question: What is the difference between dot notation and bracket notation for accessing object properties
    in JavaScript?
  answer: Dot notation (`obj.name`) is shorter and works when the key is a fixed, valid identifier. Bracket
    notation (`obj["first-name"]`, `obj[key]`) accepts any string or symbol, including keys with spaces
