- id: kb-38e256e3871e
  question: How can you cache API responses in the browser?
  answer: 'Use HTTP caching first: set Cache-Control and ETag on the server so the browser reuses or revalidates
    responses. For more control, cache in memory or with a data library, use the Cache API from a service
    worker for offline support, or store data in IndexedDB. Always define how stale data is refreshed.'
  topic: web development
  tags:
  - web
  - caching
  - http
  - service-workers
  - performance
  explanation: "## In plain words\nCaching means keeping a copy of a response so the next request is faster\
    \ or does not hit the network at all. The browser already has a powerful HTTP cache that follows headers\
    \ the server sends. On top of that, the app can keep its own copies in memory or in storage.\n\n##\
    \ How it works\n- HTTP cache: `Cache-Control: max-age=60` lets the browser reuse a response for 60\
    \ seconds. `ETag` or `Last-Modified` allow a cheap revalidation that returns `304 Not Modified`. `stale-while-revalidate`\
    \ serves the old copy while fetching a new one.\n- In-memory cache: a `Map` keyed by URL, or a data-fetching\
    \ library that deduplicates requests and refetches on focus.\n- Service worker plus Cache API: intercept\
    \ `fetch` and choose a strategy such as cache-first, network-first, or stale-while-revalidate. Survives\
    \ reloads and works offline.\n- IndexedDB: structured data for offline-first apps.\n- Invalidation:\
    \ time-based expiry, version keys, or clearing after a mutation.\n\n## Example\n```javascript\nconst\
    \ memo = new Map();\nconst TTL = 60_000;\n\nasync function getJson(url) {\n  const hit = memo.get(url);\n\
    \  if (hit && Date.now() - hit.at < TTL) return hit.data;\n  const res = await fetch(url);\n  if (!res.ok)\
    \ throw new Error(`HTTP ${res.status}`);\n  const data = await res.json();\n  memo.set(url, { data,\
    \ at: Date.now() });\n  return data;\n}\n```\n\n## Common mistakes\n- Building a custom cache while\
    \ the server sends `no-store`, or ignoring HTTP caching entirely.\n- Caching user-specific data in\
    \ shared caches; use `Cache-Control: private`.\n- No invalidation plan, so users see stale data after\
    \ edits.\n- Caching error responses.\n- Storing sensitive data in persistent storage on shared devices.\n\
    \n## In the interview\nStart with the layers: HTTP cache, app memory, service worker, IndexedDB. Pick\
    \ based on freshness needs, offline needs, and data sensitivity. Discuss invalidation, which is the\
    \ hard part, and how you would measure hit rate and load time.\n"
  match:
