- id: kb-a63a5865ba0f
  question: What does rel="prefetch" do in HTML?
  answer: '`<link rel="prefetch" href="/next-page.js">` asks the browser to download a resource at low
    priority while it is idle, because it will probably be needed for a future navigation. The file goes
    into the HTTP cache so the next page loads faster.'
  topic: web development
  tags:
  - performance
  - html
  - resource-hints
  - caching
  explanation: "## In plain words\nPrefetch is guessing ahead. If most users who read page A go to page\
    \ B next, you can quietly download page B's files while they are still reading A, so B feels instant.\n\
    \n## How it works\n- The browser fetches the resource with the lowest priority, after the current\
    \ page's needs.\n- The response is stored in the HTTP cache (it must be cacheable); nothing is executed\
    \ or applied.\n- It is a hint: the browser may skip it, for example on slow connections or when data\
    \ saver is on.\n- Contrast:\n  - `preload`: high priority, needed for this page now.\n  - `prefetch`:\
    \ low priority, likely needed later.\n  - `preconnect` and `dns-prefetch`: only set up the connection.\n\
    - Frameworks use it automatically: Next.js prefetches linked routes when links scroll into view.\n\
    - The newer Speculation Rules API can prefetch or even prerender whole pages in supporting browsers.\n\
    \n## Example\n```html\n<!-- On a product list page, prefetch what the detail page needs -->\n<link\
    \ rel=\"prefetch\" href=\"/assets/product-detail.js\">\n<link rel=\"prefetch\" href=\"/api/featured.json\"\
    \ as=\"fetch\" crossorigin>\n```\n\n```javascript\n// Prefetch on hover intent\nlink.addEventListener(\"\
    mouseenter\", () => {\n  const hint = document.createElement(\"link\");\n  hint.rel = \"prefetch\"\
    ;\n  hint.href = link.href;\n  document.head.appendChild(hint);\n}, { once: true });\n```\n\n## Common\
    \ mistakes\n- Prefetching resources the current page needs; use `preload` for that.\n- Prefetching\
