- id: kb-ad5965618017
  question: When should you use an Object versus a Map in JavaScript?
  answer: 'Use a plain object for records with a fixed, known set of string keys, such as a user with
    name and email. Use a Map for a dynamic dictionary: keys of any type, frequent adds and deletes, a
    built-in `size`, guaranteed insertion order and easy iteration.'
  topic: web development
  tags:
  - javascript
  - map
  - objects
  - data-structures
  explanation: '## In plain words

    Both store key-value pairs. An object is best thought of as a record: a thing with named fields. A
    Map is a real dictionary: a collection you add to, look up in and remove from while the program runs.


    ## How it works

    - **Keys**: object keys are strings or symbols (numbers are turned into strings). Map keys can be
    anything, including objects and functions.

    - **Prototype**: a plain object inherits keys like `toString` from `Object.prototype`, which can clash
    with user data. A Map starts empty.

    - **Size**: `map.size` is instant; for an object you call `Object.keys(obj).length`.

    - **Iteration**: a Map is directly iterable with `for...of` in insertion order. Objects need `Object.entries`
    and order integer-like keys first.

    - **Performance**: engines optimise Maps for frequent additions and deletions; objects are optimised
    for fixed shapes.

    - **JSON**: objects serialise with `JSON.stringify`; Maps do not without converting them.


    ## Example

    ```javascript

    const user = { name: "Ada", role: "admin" };      // record: object


    const visits = new Map();                          // dictionary: Map

    const button = { id: 1 };

    visits.set(button, 3);                             // object as a key

    visits.set("home", 10);

    console.log(visits.get(button), visits.size);      // 3 2

    for (const [key, count] of visits) console.log(key, count);

    ```


    ## Common mistakes

    - Using an object as a dictionary of user-supplied keys and hitting `__proto__` or `constructor`.

    - Expecting `obj[someObject]` to work as a key; it becomes `"[object Object]"`.

    - Trying to `JSON.stringify` a Map and getting `{}`.


    ## In the interview

    Give the rule of thumb (record versus dictionary), then list the concrete differences: key types,
    size, order, prototype and serialisation. Mention `Object.create(null)` as a prototype-free object,
    and `WeakMap` when keys are objects whose lifetime you do not control.

    '
