- id: kb-047badf53dc9
  question: How does the JavaScript substring() method work?
  answer: '`str.substring(start, end)` returns a new string with the characters from `start` up to but
    not including `end`; without `end` it goes to the end of the string. It never changes the original
    string, and it swaps the arguments if `start` is larger than `end`.'
  topic: web development
  tags:
  - javascript
  - strings
  - string-methods
  explanation: '## In plain words

    `substring` cuts a piece out of a string, like cutting a slice out of a ribbon between two marks.
    You give it where to start and, optionally, where to stop. Strings in JavaScript are immutable (they
    can never change), so you always get a brand-new string back.


    ## How it works

    - `start` is included, `end` is excluded, so the length of the result is `end - start`.

    - If `end` is left out, the slice runs to the end of the string.

    - Negative numbers and `NaN` are treated as `0`; numbers past the length are clamped to the length.

    - If `start > end`, the two arguments are swapped, so `substring(4, 1)` equals `substring(1, 4)`.

    - Compare with `slice(start, end)`: same idea, but `slice` treats negative numbers as counting from
    the end and does not swap.

    - `substr(start, length)` is a legacy method; avoid it in new code.


    ## Example

    ```javascript

    const word = "keyboard";

    console.log(word.substring(0, 3));   // "key"

    console.log(word.substring(3));      // "board"

