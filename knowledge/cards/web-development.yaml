  question: What is block scope in JavaScript?
  answer: Block scope means a variable declared with let, const, or class exists only inside the nearest
    pair of curly braces, such as an if, for, or plain block. var ignores blocks and is scoped to the
    whole function.
  topic: web development
  tags:
  - javascript
  - scope
  - let
  - const
  - var
  explanation: "## In plain words\nScope is where a name can be seen. A block is any code between `{`\
    \ and `}`. With block scope, a variable created inside a block disappears when the block ends, which\
    \ keeps temporary values from leaking into the rest of the function.\n\n## How it works\n- `let`,\
    \ `const`, and `class` declarations are block-scoped.\n- `var` is function-scoped (or global); it\
    \ is visible in the whole function even if declared inside an `if`.\n- Block-scoped names are in a\
    \ temporal dead zone from the start of the block until the declaration line; reading them earlier\
    \ throws `ReferenceError`.\n- An inner block can shadow an outer name.\n- In strict mode, function\
    \ declarations inside blocks are block-scoped too.\n\n## Example\n```javascript\nfunction demo(flag)\
    \ {\n  if (flag) {\n    var a = 1;\n    let b = 2;\n  }\n  console.log(a);          // var is visible\
    \ here\n  // console.log(b);       // ReferenceError: b is not defined\n\n  {\n    const tmp = 'only\
    \ here';\n  }\n}\ndemo(true);   // 1\ndemo(false);  // undefined (hoisted, never assigned)\n\nlet\
    \ x = 'outer';\n{\n  let x = 'inner'; // shadows\n  console.log(x);  // inner\n}\nconsole.log(x);\
    \    // outer\n```\n\n## Common mistakes\n- Assuming `var` respects `if` or `for` blocks.\n- Forgetting\
    \ the temporal dead zone and reading a `let` before its line.\n- Accidental shadowing that hides an\
    \ outer variable you meant to update.\n\n## In the interview\nDefine scope, then contrast block and\
    \ function scope with a short snippet. Mention the temporal dead zone and that `let` in loops creates\
    \ a fresh binding each iteration. Trade-off: block scope makes code easier to reason about, which\
    \ is why modern style avoids `var`.\n"
