- id: kb-b271dbf296dd
  question: Are properties defined with Object.defineProperty listed by Object.keys in JavaScript?
  answer: 'Only if you set enumerable: true. Object.defineProperty defaults enumerable, writable, and
    configurable to false, so such a property is hidden from Object.keys, for...in, and JSON.stringify
    unless you ask otherwise.'
  topic: web development
  tags:
  - javascript
  - objects
  - property-descriptors
  - enumerable
  explanation: '## In plain words

    Every property has hidden flags called a descriptor. A normal assignment like `obj.x = 1` turns all
    flags on. `Object.defineProperty` lets you choose the flags, and anything you leave out is off. A
    property that is not enumerable still exists; it just does not show up when you list keys.


    ## How it works

    - A data descriptor has `value`, `writable`, `enumerable`, and `configurable`.

    - With `defineProperty`, missing flags default to `false`.

    - `Object.keys`, `Object.entries`, `for...in`, spread `{...obj}`, and `JSON.stringify` only see enumerable
    own properties (`for...in` also walks the prototype chain).

    - `Object.getOwnPropertyNames` lists non-enumerable string keys too; `Reflect.ownKeys` adds symbols.

    - `Object.getOwnPropertyDescriptor(obj, ''x'')` shows the flags.


    ## Example

    ```javascript

    const o = { a: 1 };

    Object.defineProperty(o, ''b'', { value: 2 });

    Object.defineProperty(o, ''c'', { value: 3, enumerable: true });


    console.log(Object.keys(o));                // [''a'', ''c'']

    console.log(o.b);                           // 2

    console.log(Object.getOwnPropertyNames(o)); // [''a'', ''b'', ''c'']

    ```


    ## Common mistakes

    - Assuming the defaults match normal assignment; they are the opposite.

    - Forgetting that `b` above is also read-only and cannot be deleted.

    - Thinking non-enumerable means private; anyone can still read it by name.


    ## In the interview

    State the default flags clearly, then name the APIs that respect enumerability. Expect a follow-up
    on why built-in methods like `Array.prototype.map` do not appear in `for...in` loops: they are non-enumerable.
    Mention `Object.getOwnPropertyNames` and `Reflect.ownKeys` for full listings.

    '
  match:
