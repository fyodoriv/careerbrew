- id: kb-ca300e436344
  question: What are the main accessibility best practices in web development?
  answer: Use semantic HTML, make everything work with a keyboard with a visible focus, give images and
    controls text alternatives and labels, keep enough colour contrast, and add ARIA only when native
    elements cannot do the job. Test with automated tools, a keyboard and a screen reader, against WCAG.
  topic: web development
  tags:
  - accessibility
  - a11y
  - html
  - wcag
  explanation: '## In plain words

    Accessibility (a11y) means people with disabilities can use your site: someone who is blind and uses
    a screen reader, someone who cannot use a mouse, someone with low vision or colour blindness. Most
    of it comes for free if you use the right HTML elements.


    ## How it works

    - **Semantic HTML**: `button`, `a`, `nav`, `main`, headings in order, `label` for inputs. Assistive
    tech understands these without extra work.

    - **Keyboard**: every action reachable with Tab, Enter and Space; a visible focus outline; no keyboard
    traps; logical focus order.

    - **Text alternatives**: `alt` on informative images, empty `alt=""` on decorative ones, captions
    for video.

    - **Contrast and colour**: WCAG AA asks for at least 4.5:1 for normal text; never use colour alone
    to convey meaning.

    - **ARIA**: the first rule is not to use it if a native element works. Use it for custom widgets (`aria-expanded`,
    `role="dialog"`) and live updates (`aria-live`).

    - **Forms and errors**: clear labels, error messages linked with `aria-describedby`.

    - Respect user settings like zoom up to 200% and `prefers-reduced-motion`.


    ## Example

    ```html

    <!-- Inaccessible -->

    <div onclick="save()">Save</div>


    <!-- Accessible: focusable, announced as a button, works with Enter/Space -->

    <button type="button" onclick="save()">Save</button>


    <label for="email">Email</label>

    <input id="email" type="email" aria-describedby="email-err">

    <p id="email-err" role="alert">Enter a valid email address.</p>

    ```


    ## Common mistakes

    - Clickable `div`s instead of buttons.

    - Removing focus outlines with `outline: none` and no replacement.

    - Placeholder text used as the only label.

    - Adding ARIA roles that contradict the element.


    ## In the interview

    Mention WCAG and its four principles (perceivable, operable, understandable, robust), then give concrete
    practices. Describe how you test: axe or Lighthouse in CI, manual keyboard passes, and a screen reader
    check. Note that automated tools catch only part of the issues.

    '
