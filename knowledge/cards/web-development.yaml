- id: kb-6c208d3fe975
  question: How do default parameter values work in JavaScript functions?
  answer: A default is used when the argument is missing or explicitly undefined; null and other falsy
    values do not trigger it. Defaults are evaluated at call time, left to right, so a later default can
    use earlier parameters.
  topic: web development
  tags:
  - javascript
  - functions
  - default-parameters
  - es2015
  explanation: "## In plain words\nDefault parameters let you write `function f(x = 10)` so that `x` gets\
    \ 10 when the caller leaves it out. The rule is simple: only `undefined` triggers the default. Any\
    \ other value, even `null` or `0`, is used as given.\n\n## How it works\n- The default expression\
    \ runs on every call where the argument is `undefined`, so `f(list = [])` gets a fresh array each\
    \ time.\n- Parameters are initialized left to right; a default can refer to earlier parameters but\
    \ not later ones.\n- Defaults work with destructuring: `function f({ size = 1 } = {})`.\n- Parameters\
    \ with defaults are excluded from `f.length`, along with all parameters after them.\n- Default parameters\
    \ create their own scope between the outer scope and the function body.\n\n## Example\n```javascript\n\
    function greet(name = 'guest', greeting = `Hi ${name}`) {\n  return greeting;\n}\nconsole.log(greet());\
    \          // Hi guest\nconsole.log(greet(undefined)); // Hi guest\nconsole.log(greet(null));    \
    \  // Hi null\n\nfunction draw({ width = 100, height = width } = {}) {\n  return [width, height];\n\
    }\nconsole.log(draw());             // [100, 100]\nconsole.log(draw({ width: 5 })); // [5, 5]\n```\n\
    \n## Common mistakes\n- Expecting `null` to trigger the default.\n- Referring to a later parameter\
    \ in a default, which throws a `ReferenceError`.\n- Forgetting `= {}` after a destructured parameter,\
    \ so calling with no argument throws.\n- Using the old `x = x || 10` pattern, which also replaces\
    \ `0` and `''`.\n\n## In the interview\nState the `undefined`-only rule, evaluation at call time,\
    \ and left-to-right order. Show the destructuring-with-defaults pattern for option objects, which\
    \ is common in real code. Mention the contrast with Python, where defaults are evaluated once at definition\
    \ time.\n"
