- id: kb-36f1e51332bb
  question: Besides Core Web Vitals, which browser performance metrics and events are worth knowing?
  answer: The network timing phases (DNS lookup, TCP connect, TLS, Time to First Byte, content download),
    rendering milestones like First Contentful Paint, and page lifecycle events such as `DOMContentLoaded`
    and `load`. Total Blocking Time and long tasks describe main-thread health.
  topic: web development
  tags:
  - performance
  - browser
  - web-vitals
  - navigation-timing
  explanation: "## In plain words\nCore Web Vitals (LCP, INP, CLS) tell you how the page feels to a user.\
    \ The other metrics explain why: they split loading into stages so you can see whether time went to\
    \ the network, the server, or the browser's main thread.\n\n## How it works\n- **DNS lookup**: turning\
    \ the domain into an IP address.\n- **TCP connect and TLS handshake**: opening a connection and setting\
    \ up encryption.\n- **Time to First Byte (TTFB)**: from the start of the navigation until the first\
    \ byte of the response arrives, so it includes redirects, DNS, connection setup, and server time.\n\
    - **First Contentful Paint (FCP)**: the first moment any text or image is drawn.\n- **DOMContentLoaded**:\
    \ the HTML is parsed and deferred scripts have run; images may still be loading.\n- **load**: everything,\
    \ including images and iframes, has finished.\n- **Total Blocking Time (TBT)** and **long tasks**:\
    \ a long task is main-thread work over 50 ms; TBT sums the part of each long task beyond 50 ms during\
    \ loading. Both delay input handling; a lab proxy for INP.\n- The Navigation Timing and Resource Timing\
    \ APIs expose these numbers; `PerformanceObserver` reports paints and long tasks.\n\n## Example\n\
    ```javascript\nconst [nav] = performance.getEntriesByType(\"navigation\");\nconsole.log({\n  dns:\
    \ nav.domainLookupEnd - nav.domainLookupStart,\n  connect: nav.connectEnd - nav.connectStart,\n  ttfb:\
    \ nav.responseStart,              // ms since navigation start\n  serverWait: nav.responseStart -\
    \ nav.requestStart,\n  domContentLoaded: nav.domContentLoadedEventEnd,\n  load: nav.loadEventEnd,\n\
    });\n```\n\n## Common mistakes\n- Optimising only the `load` event, which users barely notice.\n-\
    \ Measuring only in the lab on a fast laptop instead of collecting real-user data.\n- Confusing TTFB\
    \ with total server time; it also includes network round trips.\n\n## In the interview\nWalk through\
    \ the timeline from DNS to `load`, name the API you would use to measure each piece, and connect each\
    \ stage to a fix: CDN and `preconnect` for network, caching for TTFB, less JavaScript for TBT. Mention\
    \ real-user monitoring versus synthetic tests.\n"
