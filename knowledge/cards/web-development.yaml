- id: kb-41ec04ba9161
  question: Can you delete properties and methods from JavaScript objects?
  answer: Yes, with the delete operator, as long as the property is an own, configurable property. It
    returns true on success, cannot remove inherited properties from the prototype through the instance,
    and cannot delete variables.
  topic: web development
  tags:
  - javascript
  - objects
  - delete
  - property-descriptors
  explanation: '## In plain words

    The `delete` operator removes a property from an object completely, so the key no longer exists. It
    is not the same as setting the value to `undefined`, which keeps the key. Some properties are protected
    and cannot be deleted.


    ## How it works

    - `delete obj.key` removes an own property and returns `true`, including when the key did not exist.

    - Non-configurable properties (from `defineProperty`, `Object.seal`, `Object.freeze`, or built-ins
    like `Math.PI`) cannot be deleted; this returns `false`, or throws in strict mode.

    - Deleting a method on an instance only removes the own copy; if the prototype has one, it becomes
    visible again.

    - To remove a method for all instances, delete it from the prototype.

    - For an immutable style, use rest destructuring: `const { key, ...rest } = obj`.

    - On arrays, `delete` leaves a hole and keeps `length`; use `splice` instead.


    ## Example

    ```javascript

    const user = { name: ''Ann'', age: 30 };

    delete user.age;

    console.log(''age'' in user); // false


    const { name, ...noName } = user; // copy without name


    const arr = [1, 2, 3];

    delete arr[1];

    console.log(arr, arr.length); // [1, <empty>, 3] 3

    ```


    ## Common mistakes

    - Using `delete` on array items instead of `splice`.

    - Expecting `delete` to free memory directly; it only removes a reference.

    - Trying `delete someVariable`; it does nothing for declared variables.

    - Using `delete` in hot code paths; it can make engines switch the object to a slower shape.


    ## In the interview

    Explain own versus inherited and configurable versus not. Mention `undefined` assignment versus `delete`
    and the effect on `in` and `Object.keys`. Trade-off: rest destructuring creates a new object and fits
    immutable state, as in React reducers, while `delete` mutates in place.

    '
