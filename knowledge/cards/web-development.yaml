  question: What is the difference between bind, call and apply in JavaScript?
  answer: All three set the `this` value of a function. `call(thisArg, a, b)` invokes it immediately with
    arguments listed one by one, `apply(thisArg, [a, b])` invokes it immediately with an array of arguments,
    and `bind(thisArg, a)` returns a new function with `this` (and optionally some arguments) fixed for
    later.
  topic: web development
  tags:
  - javascript
  - this
  - functions
  - bind
  explanation: "## In plain words\nIn a regular function, `this` depends on how the function is called.\
    \ These three methods let you choose `this` yourself. `call` and `apply` run the function right now;\
    \ `bind` prepares a version of it to run later.\n\n## How it works\n- `fn.call(thisArg, arg1, arg2)`:\
    \ run now, arguments separated by commas.\n- `fn.apply(thisArg, [arg1, arg2])`: run now, arguments\
    \ as an array. Mnemonic: Apply takes an Array.\n- `fn.bind(thisArg, arg1)`: returns a new bound function;\
    \ `this` is fixed permanently and leading arguments are pre-filled (partial application).\n- A bound\
    \ function ignores later `call`/`apply`/`bind` attempts to change `this`, except when used with `new`.\n\
    - Arrow functions have no own `this`, so these methods cannot change it.\n- Modern code often uses\
    \ spread (`fn(...args)`) instead of `apply`.\n\n## Example\n```javascript\nconst user = { name: \"\
    Ada\" };\nfunction greet(greeting, punctuation) {\n  return `${greeting}, ${this.name}${punctuation}`;\n\
    }\n\nconsole.log(greet.call(user, \"Hi\", \"!\"));       // Hi, Ada!\nconsole.log(greet.apply(user,\
    \ [\"Hello\", \"?\"])); // Hello, Ada?\n\nconst hiAda = greet.bind(user, \"Hey\");\nconsole.log(hiAda(\"\
    .\"));                         // Hey, Ada.\n\n// Common use: keeping this in a callback\nclass Timer\
    \ {\n  constructor() { this.ticks = 0; this.tick = this.tick.bind(this); }\n  tick() { this.ticks++;\
    \ }\n}\nconst t = new Timer();\nsetTimeout(t.tick, 0);   // works because tick is bound\n```\n\n##\
    \ Common mistakes\n- Using `bind` and expecting the function to run immediately.\n- Trying to rebind\
    \ an arrow function or an already bound function.\n- Binding inside a render loop, creating a new\
    \ function each time.\n\n## In the interview\nExplain the three in one sentence each, show a callback\
    \ where `this` is lost and fixed with `bind` or an arrow function, and mention partial application.\
    \ A common follow-up is writing a simple `bind` polyfill using a closure and `apply`.\n"
