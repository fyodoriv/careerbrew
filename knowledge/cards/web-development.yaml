  question: What are objects in JavaScript and how can you create them?
  answer: An object is a collection of key-value properties that groups related data and behaviour and
    has a prototype it inherits from. You can create one with an object literal, a constructor function
    or class with `new`, `Object.create(proto)`, or a factory function that returns a literal.
  topic: web development
  tags:
  - javascript
  - objects
  - prototypes
  - classes
  explanation: "## In plain words\nAn object is a labelled box of values: each label (key) points to a\
    \ value, and values can be functions, which we call methods. Every object also has a hidden link to\
    \ another object, its prototype, where it looks up anything it does not have itself.\n\n## How it\
    \ works\n- **Object literal**: `{ name: \"Ada\" }`. The most common and fastest to read.\n- **Constructor\
    \ or class with `new`**: creates an object, links its prototype to `Constructor.prototype`, runs the\
    \ constructor with `this` set to it, and returns it.\n- **`Object.create(proto)`**: creates an empty\
    \ object with an explicit prototype; `Object.create(null)` has none.\n- **Factory function**: a plain\
    \ function returning a literal; no `new`, and closures can keep data private.\n- Read with `obj.key`\
    \ or `obj[\"key\"]`; add or change by assigning; remove with `delete`.\n\n## Example\n```javascript\n\
    const a = { name: \"Ada\", greet() { return \"Hi \" + this.name; } };\n\nclass Person {\n  constructor(name)\
