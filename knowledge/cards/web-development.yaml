- id: kb-3c7b61d8f13c
  question: How does Array.prototype.slice work in JavaScript?
  answer: arr.slice(start, end) returns a new shallow copy of the elements from start up to, but not including,
    end. It does not change the original array. Negative indexes count from the end, and with no arguments
    it copies the whole array.
  topic: web development
  tags:
  - javascript
  - arrays
  - slice
  - immutability
  explanation: '## In plain words

    `slice` cuts a piece out of an array and gives you that piece as a new array, leaving the original
    untouched. Think of photocopying pages 2 to 4 of a book: the book is unchanged and you hold a copy.


    ## How it works

    - `start` is inclusive, `end` is exclusive. Missing `end` means ''to the end''.

    - Negative values count from the end: `-1` is the last element.

    - Out-of-range values are clamped, so `slice` never throws for bad indexes.

    - The copy is shallow: nested objects are shared, not cloned.

    - It runs in O(k) time and space for k copied elements.

    - Strings have a `slice` method with the same rules.

    - Contrast with `splice(start, deleteCount, ...items)`, which mutates the array in place and returns
    the removed items.


    ## Example

    ```javascript

    const a = [''a'', ''b'', ''c'', ''d'', ''e''];

    console.log(a.slice(1, 3));  // [''b'', ''c'']

    console.log(a.slice(-2));    // [''d'', ''e'']

    console.log(a.slice());      // full copy

    console.log(a);              // unchanged


    const nested = [{ n: 1 }];

    const copy = nested.slice();

    copy[0].n = 99;

    console.log(nested[0].n);    // 99, shallow

    ```


    ## Common mistakes

    - Mixing up `slice` and `splice`.

    - Expecting `end` to be included.

    - Assuming the copy is deep.

    - Using `slice` in a loop to create many subarrays in hot code, which allocates a lot; passing indexes
    can be cheaper.


    ## In the interview

    State the signature, inclusive and exclusive bounds, negatives, and immutability. Contrast with `splice`
    and with newer non-mutating methods such as `toSpliced` and `toSorted`. Interviewers may also ask
    about shallow versus deep copies; mention `structuredClone` for deep copies.

    '
