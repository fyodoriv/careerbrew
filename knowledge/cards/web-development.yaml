- id: kb-79aa23db1cc0
  question: What does event.stopPropagation() do?
  answer: It stops the event from travelling further through the DOM, so handlers on ancestor elements
    (in the bubbling phase) or descendants (in the capture phase) do not run. It does not cancel the browser's
    default action; that is `preventDefault()`.
  topic: web development
  tags:
  - dom
  - events
  - javascript
  - event-propagation
  explanation: "## In plain words\nWhen you click a button inside a card, the click is first seen by the\
    \ button and then \"bubbles\" up to the card, the page and the window. `stopPropagation()` tells the\
    \ event to stop climbing, so outer elements never hear about it.\n\n## How it works\nDOM events travel\
    \ in three phases:\n1. **Capture**: from `window` down to the target.\n2. **Target**: handlers on\
    \ the element itself.\n3. **Bubble**: from the target back up to `window`.\n\n- `stopPropagation()`\
    \ ends the journey after the current element; other handlers on the same element still run.\n- `stopImmediatePropagation()`\
    \ also skips the remaining handlers on the same element.\n- `preventDefault()` is independent: it\
    \ cancels default behaviour such as following a link or submitting a form, while the event keeps propagating.\n\
    \n## Example\n```html\n<div id=\"card\">\n  <button id=\"like\">Like</button>\n</div>\n<script>\n\
    \  document.getElementById(\"card\").addEventListener(\"click\", () => {\n    console.log(\"open card\"\
    );\n  });\n  document.getElementById(\"like\").addEventListener(\"click\", (e) => {\n    e.stopPropagation();\n\
    \    console.log(\"liked\");          // only this logs\n  });\n</script>\n```\n\n## Common mistakes\n\
    - Confusing it with `preventDefault()`.\n- Overusing it: it breaks event delegation and analytics\
    \ or \"click outside to close\" handlers higher in the tree.\n- Expecting it to stop other listeners\
    \ on the same element.\n\n## In the interview\nDescribe the three phases, then the difference between\
    \ the three methods. Mention that a better alternative is often to check `event.target` in the parent\
    \ handler, which keeps delegation working. In React, events are delegated at the root, so `stopPropagation`\
    \ affects React handlers but native listeners can behave differently.\n"
