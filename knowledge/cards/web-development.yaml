  question: What is the temporal dead zone (TDZ) in JavaScript?
  answer: The TDZ is the time from the start of a scope until a `let`, `const` or `class` declaration
    in it is executed. The binding exists (it is hoisted) but is uninitialised, so reading or writing
    it throws a `ReferenceError`.
  topic: web development
  tags:
  - javascript
  - hoisting
  - scope
  - let-const
  explanation: "## In plain words\n`let` and `const` variables are registered when their block starts,\
    \ but they are locked until the line that declares them runs. Trying to use one during that locked\
    \ period is an error, rather than quietly giving `undefined` like `var` does.\n\n## How it works\n\
    - On entering a scope, the engine creates bindings for all declarations in it (this is hoisting).\n\
    - `var` bindings are initialised to `undefined` immediately.\n- `let`, `const` and `class` bindings\
    \ stay uninitialised. Any access throws `ReferenceError: Cannot access 'x' before initialization`.\n\
    - The zone is about time (execution order), not position in the code: a function declared above can\
    \ use the variable if it is only called after the declaration ran.\n- Even `typeof x` throws inside\
    \ the TDZ, while `typeof` on an undeclared name returns `\"undefined\"`.\n- Default parameters have\
    \ their own TDZ: `function f(a = b, b) {}` fails when `a` uses `b`.\n\n## Example\n```javascript\n\
    {\n  const read = () => value;   // fine to define\n  // console.log(value);      // ReferenceError:\
    \ in the TDZ\n  let value = 10;             // TDZ ends here\n  console.log(read());        // 10:\
    \ called after initialisation\n}\n\nlet x = 1;\n{\n  // console.log(x);          // ReferenceError:\
    \ inner x shadows outer x and is in its TDZ\n  let x = 2;\n}\n```\n\n## Common mistakes\n- Saying\
    \ `let` is not hoisted; it is, but uninitialised.\n- Expecting the outer variable to be used when\
    \ an inner one with the same name is still in its TDZ.\n- Circular ES module imports that read a `const`\
    \ before the other module initialised it.\n\n## In the interview\nDefine the TDZ in terms of hoisting\
    \ and initialisation, show the shadowing example, and explain why it is useful: it turns use-before-declare\
    \ bugs into immediate errors. Contrast with `var`.\n"
