  question: What is a function in JavaScript, and what happens each time one is created?
  answer: 'A function is a callable object: an instance of `Function` with properties like `name` and
    `length`. Each time a function expression or declaration is evaluated, a new function object is created
    that captures a reference to its surrounding scope (a closure), and regular functions also get their
    own `prototype` object.'
