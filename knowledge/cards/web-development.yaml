  question: How do you check whether a value is a Symbol in JavaScript?
  answer: Use typeof value === 'symbol'. It is true for every symbol primitive, including registered ones
    from Symbol.for and well-known ones like Symbol.iterator. Rare Symbol wrapper objects report 'object'.
  topic: web development
  tags:
  - javascript
  - symbols
  - typeof
  - types
  explanation: '## In plain words

    Symbols are their own primitive type, added in ES2015, and `typeof` was extended to report them as
    `''symbol''`. So the check is a single, reliable comparison, just like checking for a string or a
    boolean.


    ## How it works

    - `typeof Symbol(''x'')` returns `''symbol''`.

    - It works for global registry symbols (`Symbol.for(''app'')`) and well-known symbols.

    - `Object(sym)` creates a wrapper object whose `typeof` is `''object''`; you almost never meet these.

    - `instanceof Symbol` is `false` for primitives, so do not use it.

    - To tell a registered symbol from a local one, use `Symbol.keyFor(sym)`: it returns the key or `undefined`.

    - In TypeScript, the check narrows `unknown` to `symbol`.


    ## Example

    ```javascript

    const isSymbol = (v) => typeof v === ''symbol'';


    const local = Symbol(''id'');

    const shared = Symbol.for(''id'');


    console.log(isSymbol(local));            // true

    console.log(isSymbol(Symbol.iterator));  // true

    console.log(isSymbol(''id''));             // false

    console.log(local instanceof Symbol);    // false

    console.log(Symbol.keyFor(shared));      // ''id''

    console.log(Symbol.keyFor(local));       // undefined

    ```


    ## Common mistakes

    - Using `instanceof Symbol`.

    - Calling `new Symbol()`, which throws a `TypeError`.

    - Converting a symbol implicitly, such as in `''key: '' + sym`, which throws; use `String(sym)` or
    `sym.description`.

    - Forgetting symbols when writing a generic `typeof`-based switch, so they fall into a default branch.


    ## In the interview

    Answer with `typeof` and add one detail that shows depth: `instanceof` fails for primitives, or `Symbol.keyFor`
    identifies registered symbols. If the conversation moves to a general type-check helper, list all
    `typeof` results: `undefined`, `boolean`, `number`, `bigint`, `string`, `symbol`, `function`, and
    `object` (which includes `null`).

    '
