  explanation: "## In plain words\nA function's `prototype` property is the object that becomes the parent\
    \ of instances created with `new`. Only functions meant to be constructors get one. Note this is different\
    \ from the function's own parent, which every function has.\n\n## How it works\n- **Has `prototype`**:\n\
    \  - `function f() {}` and `const f = function () {}`.\n  - `class C {}`.\n  - Generator functions\
    \ (`function*`) have one too, but it is used for the generator objects they return, and they cannot\
    \ be called with `new`.\n- **No `prototype`**:\n  - Arrow functions.\n  - Method shorthand: `{ m()\
    \ {} }` and class methods.\n  - `async function` and async arrow functions.\n  - Most built-in functions\
    \ such as `Math.max`.\n- Calling `new` on a function without a `prototype` (non-constructor) throws\
    \ a `TypeError`.\n- Do not confuse `fn.prototype` with `Object.getPrototypeOf(fn)`, which is `Function.prototype`\
    \ for all functions.\n\n## Example\n```javascript\nfunction Regular() {}\nconst arrow = () => {};\n\
