  question: What is the difference between == and === in JavaScript?
  answer: === (strict equality) compares type and value with no conversion. == (loose equality) first
    converts operands to a common type using coercion rules, which gives surprising results like '' ==
    0 being true. Prefer === except for the x == null idiom.
  topic: web development
  tags:
  - javascript
  - equality
  - type-coercion
  - operators
  explanation: "## In plain words\n`===` asks 'are these the same type and the same value?' `==` asks\
    \ 'could these be equal after I convert them?' The conversions follow a fixed but surprising table,\
    \ so `==` often says yes when a human would say no.\n\n## How it works\n- `===`: different types give\
    \ `false`. Objects are equal only if they are the same reference. `NaN === NaN` is `false`.\n- `==`\
    \ rules in short:\n  - `null == undefined` is `true`, and neither equals anything else.\n  - Number\
    \ versus string: the string is converted to a number.\n  - Boolean versus anything: the boolean becomes\
    \ 0 or 1 first.\n  - Object versus primitive: the object is converted with `valueOf` or `toString`.\n\
    - `Object.is` is like `===` but treats `NaN` as equal to itself and `+0` and `-0` as different.\n\n\
    ## Example\n```javascript\nconsole.log(0 == '');          // true\nconsole.log('0' == false);    \
    \ // true\nconsole.log([] == false);      // true\nconsole.log(null == 0);        // false\nconsole.log(null\
    \ == undefined); // true\nconsole.log(0 === '');         // false\nconsole.log(Object.is(NaN, NaN));\
    \ // true\n```\n\n## Common mistakes\n- Thinking `==` only ignores type; it actively converts, sometimes\
    \ several times.\n- Expecting `===` to compare object contents.\n- Checking for `NaN` with `===`;\
    \ use `Number.isNaN`.\n- Assuming `null == 0` is true because `null` is 'falsy'.\n\n## In the interview\n\
    Recommend `===` by default and explain why: predictable and easier to review. Mention the one accepted\
    \ use of `==`: `value == null` catches both `null` and `undefined`. Interviewers like quick quizzes,\
    \ so know a few classic cases and the rule behind each instead of memorizing a table.\n"
