  question: How do you swap two elements in a JavaScript array?
  answer: 'Use destructuring assignment: [arr[i], arr[j]] = [arr[j], arr[i]]. It swaps in place without
    a temporary variable you write yourself. A classic temp variable works too and avoids creating a small
    array; for an immutable swap, use arr.with or copy first.'
  topic: web development
  tags:
  - javascript
  - arrays
  - destructuring
  - swap
  explanation: "## In plain words\nSwapping means exchanging two values. Modern JavaScript lets you do\
    \ it in one line by building a two-item array on the right and unpacking it into the two positions\
    \ on the left.\n\n## How it works\n- Destructuring swap: `[arr[i], arr[j]] = [arr[j], arr[i]]`. The\
    \ right side is evaluated first, so both old values are captured before any assignment.\n- Temp variable:\
    \ `const t = arr[i]; arr[i] = arr[j]; arr[j] = t;` Equally correct and avoids the throwaway array,\
    \ which can matter in tight loops.\n- Both are O(1) and mutate the array.\n- Immutable version: `arr.with(i,\
    \ arr[j]).with(j, arr[i])` (ES2023) or copy with `slice` and swap the copy. Useful for React state.\n\
    - The XOR trick only works for integers and is less readable; avoid it.\n\n## Example\n```javascript\n\
    const a = [1, 2, 3, 4];\n[a[0], a[3]] = [a[3], a[0]];\nconsole.log(a); // [4, 2, 3, 1]\n\nfunction\
    \ swap(arr, i, j) {\n  const t = arr[i];\n  arr[i] = arr[j];\n  arr[j] = t;\n}\n\nconst b = [1, 2,\
    \ 3];\nconst swapped = b.with(0, b[2]).with(2, b[0]);\nconsole.log(b, swapped); // [1, 2, 3] [3, 2,\
    \ 1]\n```\n\n## Common mistakes\n- Forgetting a semicolon on the previous line; a line starting with\
    \ `[` can be parsed as indexing the previous expression.\n- Assigning `arr[i] = arr[j]; arr[j] = arr[i];`,\
    \ which loses the first value.\n- Mutating arrays held in state when the framework expects a new array.\n\
    \n## In the interview\nWrite the destructuring swap and explain why it works. Mention the temp variable\
    \ as the performance-neutral classic and the semicolon gotcha. Swaps appear inside larger tasks such\
    \ as reversing in place, partitioning in quicksort, or a Fisher-Yates shuffle, so be ready to use\
    \ one there.\n"
