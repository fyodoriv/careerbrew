  - nan
  - type-coercion
  explanation: "## In plain words\n`NaN` means 'Not a Number', a special number value produced by failed\
    \ math like `0 / 0`. The old global `isNaN` really asks 'would this become NaN if I converted it to\
    \ a number?' The newer `Number.isNaN` asks the precise question 'is this value NaN right now?'\n\n\
    ## How it works\n- `isNaN(x)` runs `Number(x)` first. Strings that are not numeric, `undefined`, and\
    \ most objects become `NaN`, so they return `true`.\n- `Number.isNaN(x)` returns `true` only if `x`\
    \ is the number `NaN`.\n- `NaN` is the only value not equal to itself, so `x !== x` is another precise\
    \ check.\n- `Object.is(x, NaN)` also works.\n- To validate user input, combine conversion with `Number.isFinite`.\n\
    \n## Example\n```javascript\nconsole.log(isNaN('hello'));        // true, 'hello' -> NaN\nconsole.log(Number.isNaN('hello'));\
