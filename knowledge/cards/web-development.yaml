  question: How does Object.freeze work in JavaScript?
  answer: 'Object.freeze makes an object''s own properties read-only and non-configurable and prevents
    adding or removing properties. It is shallow: nested objects stay mutable. Writes fail silently in
    sloppy mode and throw a TypeError in strict mode.'
  topic: web development
  tags:
  - javascript
  - objects
  - immutability
  - freeze
  explanation: "## In plain words\nFreezing an object locks it: you cannot add, remove, or change its\
    \ properties. It is like laminating a sheet of paper. But only the top sheet is laminated; if a property\
    \ points to another object, that other object is still editable.\n\n## How it works\n- `Object.freeze(obj)`\
    \ marks the object non-extensible and sets every own property to `writable: false` and `configurable:\
    \ false`.\n- It returns the same object, not a copy.\n- Accessor properties (getters and setters)\
    \ still run; freezing does not stop a setter from changing other state.\n- `Object.isFrozen(obj)`\
    \ checks it.\n- Weaker options: `Object.seal` (no add or remove, but values can change) and `Object.preventExtensions`\
    \ (no add only).\n- For deep immutability, freeze recursively or use an immutable data library.\n\n\
    ## Example\n```javascript\n'use strict';\nconst config = Object.freeze({ port: 80, db: { host: 'local'\
    \ } });\n\ntry {\n  config.port = 8080; // TypeError in strict mode\n} catch (e) {\n  console.log(e.name);\n\
    }\nconfig.db.host = 'remote'; // allowed: shallow\nconsole.log(config.db.host); // remote\n\nfunction\
    \ deepFreeze(o) {\n  Object.values(o).forEach(v => {\n    if (v && typeof v === 'object') deepFreeze(v);\n\
    \  });\n  return Object.freeze(o);\n}\n```\n\n## Common mistakes\n- Assuming freeze is deep.\n- Expecting\
    \ an error in non-strict code, where writes fail silently.\n- Confusing `const` with freeze; `const`\
    \ only stops reassigning the variable.\n- Freezing large objects in hot paths without need.\n\n##\
    \ In the interview\nExplain what freeze changes (extensibility and property flags), that it is shallow,\
    \ and how it differs from seal and `const`. Mention practical uses: protecting shared configuration,\
    \ and catching accidental mutations in development. A typical follow-up is writing `deepFreeze`, including\
    \ handling cycles with a `WeakSet`.\n"
