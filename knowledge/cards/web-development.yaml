  prompt: 1f344914
- id: kb-8e8a6f73c640
  question: How do arrow functions differ from regular functions in JavaScript?
  answer: Arrow functions have no own this, arguments, super, or new.target; they use the ones from the
    surrounding scope. They cannot be used as constructors, have no prototype property, and offer a shorter
    syntax with implicit return.
  topic: web development
  tags:
  - javascript
  - functions
  - arrow-functions
  - this
  explanation: "## In plain words\nA regular function decides what `this` is at the moment it is called.\
    \ An arrow function does not decide anything: it borrows `this` from the code around it, like a variable.\
    \ That makes arrows handy for callbacks and awkward for object methods.\n\n## How it works\n- Lexical\
    \ `this`: inside an arrow, `this` is whatever it was where the arrow was written. `call`, `apply`,\
    \ and `bind` cannot change it.\n- No `arguments` object; use rest parameters `(...args)` instead.\n\
    - Not constructible: `new` on an arrow throws a `TypeError`, and there is no `prototype` property.\n\
    - Concise body: `x => x * 2` returns the value; to return an object literal, wrap it: `() => ({ a:\
    \ 1 })`.\n- Regular function declarations are hoisted; arrows assigned to `const` are not usable before\
    \ that line.\n\n## Example\n```javascript\nconst timer = {\n  seconds: 0,\n  start() {\n    setInterval(()\
    \ => {\n      this.seconds++; // arrow uses start()'s this\n    }, 1000);\n  },\n};\n\nconst bad =\
    \ {\n  name: 'x',\n  hello: () => this.name, // this is the outer scope, not bad\n};\nconsole.log(bad.hello());\
    \ // CommonJS: undefined (this is module.exports)\n                          // ES module: throws\
    \ TypeError (this is undefined)\n```\n\n## Common mistakes\n- Using an arrow as an object or prototype\
    \ method and expecting `this` to be the object.\n- Writing `() => { a: 1 }` and getting `undefined`\
    \ because braces start a block.\n- Using arrows as event handlers when you need `this` to be the element.\n\
    \n## In the interview\nLead with lexical `this`, then list the other differences. Interviewers often\
    \ show a snippet and ask what it logs. Trade-off: arrows are great for callbacks and closures; regular\
    \ functions (or method shorthand) are right for methods, constructors, and generators (arrows cannot\
    \ be generators).\n"
  match:
