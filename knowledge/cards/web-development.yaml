  question: How do you get the integer quotient of a division in JavaScript?
  answer: 'Divide and then truncate: Math.trunc(a / b) rounds toward zero and pairs with the % remainder
    operator. Math.floor(a / b) rounds down, which differs for negative numbers. For BigInt, a / b already
    returns the truncated integer.'
  topic: web development
  tags:
  - javascript
  - numbers
  - math
  - division
  explanation: '## In plain words

    JavaScript has no integer division operator; `/` always gives a floating-point result. To get the
    whole-number part (the quotient), you round the result. Which rounding you choose matters only for
    negative numbers.


    ## How it works

    - `Math.trunc(a / b)` drops the fraction, rounding toward zero. Together with `%`, it satisfies `a
    === b * Math.trunc(a / b) + a % b`.

    - `Math.floor(a / b)` rounds toward negative infinity. That matches Python''s `//` and is what you
    want for things like bucketing.

    - Bitwise tricks such as `(a / b) | 0` truncate too, but only work for results within 32-bit signed
    range.

    - BigInt division truncates automatically: `7n / 2n` is `3n`.

    - Division by zero gives `Infinity` or `NaN` for numbers and throws a `RangeError` for BigInt.


    ## Example

    ```javascript

    console.log(Math.trunc(7 / 2));  // 3

    console.log(7 % 2);              // 1

    console.log(Math.trunc(-7 / 2)); // -3

    console.log(Math.floor(-7 / 2)); // -4

    console.log(-7 % 2);             // -1


    console.log((3e9 / 1) | 0);      // -1294967296, overflow

    console.log(7n / 2n);            // 3n

    ```


    ## Common mistakes

    - Using `Math.floor` and `%` together on negative numbers, which breaks the identity.

    - Using `| 0` on large numbers.

    - Using `parseInt(a / b)`, which converts to a string first and fails on values like `1e21`.

    - Expecting `%` to be a true modulo; it keeps the sign of the dividend.


    ## In the interview

    Name `Math.trunc` and explain why it pairs with `%`. Mention `Math.floor` for negative-number semantics
    and the true modulo pattern `((a % b) + b) % b`. Interviewers ask this to see if you think about negatives
    and limits, so mention both.

    '
