    \   // \"object\"\nconsole.log(arrow.prototype);            // undefined\nconsole.log(obj.method.prototype);\
    \       // undefined\nconsole.log(typeof Klass.prototype);     // \"object\"\nconsole.log(load.prototype);\
    \             // undefined\n\n// new arrow();   // TypeError: arrow is not a constructor\nconsole.log(Object.getPrototypeOf(arrow)\
    \ === Function.prototype);   // true\n```\n\n## Common mistakes\n- Mixing up `fn.prototype` with the\
    \ function's own `[[Prototype]]`.\n- Using arrow functions as constructors.\n- Adding methods to `prototype`\
