  question: In JavaScript, do a[0] and a['0'] return the same value?
  answer: Yes. Property keys in JavaScript are strings (or symbols), so the number 0 is converted to the
    string '0' before the lookup. Both expressions read the same property.
  topic: web development
  tags:
  - javascript
  - arrays
  - property-keys
  - type-coercion
  explanation: '## In plain words

    Arrays in JavaScript are objects whose property names happen to look like numbers. Every ordinary
    property name is a string, so when you write `a[0]` the engine turns `0` into `''0''` and looks that
    up. That means `a[0]` and `a[''0'']` point to exactly the same slot.


    ## How it works

    - The bracket operator evaluates the expression inside, then converts it to a property key with `ToPropertyKey`.

    - Numbers become their string form: `0` becomes `''0''`, `1.5` becomes `''1.5''`.

    - An array index is a property whose key is a canonical numeric string from `''0''` up to `''4294967294''`.
    Only those keys update `length`.

    - Engines store arrays efficiently in practice, but the language semantics are still string keys.

    - Symbols are the only other key type; they are never converted.


    ## Example

    ```javascript

    const a = [''x'', ''y''];

    console.log(a[0] === a[''0'']); // true

    console.log(Object.keys(a));  // [''0'', ''1'']


    a[''01''] = ''z'';                 // not canonical, so not an index

    console.log(a.length);         // 2

    console.log(a[''01'']);          // ''z''

    ```


    ## Common mistakes

    - Thinking arrays store numeric keys internally, so `Object.keys` should return numbers.

    - Assuming `a[''01'']` or `a[''1.0'']` is the same as `a[1]`; only canonical strings match.

    - Using objects as keys: `obj[{}]` becomes `obj[''[object Object]'']`, so different objects collide.


    ## In the interview

    Say that property keys are strings or symbols and that the index is coerced. A good follow-up is why
    `Map` exists: it keeps keys of any type without coercion. You can also mention that typed arrays and
    engine optimizations do not change these rules; they only make access fast.

    '
