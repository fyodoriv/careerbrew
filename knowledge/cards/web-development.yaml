- id: kb-e043c57ba81c
  question: Can a JavaScript function have more parameters after a rest parameter?
  answer: No. The rest parameter must be the last one in the list, and there can be only one; anything
    after it is a SyntaxError. It also cannot have a default value.
  topic: web development
  tags:
  - javascript
  - functions
  - rest-parameters
  - syntax
  explanation: "## In plain words\nA rest parameter, written `...args`, scoops up every remaining argument\
    \ into a real array. Because it takes 'everything that is left', nothing can come after it. The parser\
    \ rejects any parameter that follows it.\n\n## How it works\n- Syntax: `function f(a, b, ...rest)\
    \ {}`; `rest` is an `Array`, unlike the old `arguments` object.\n- Rules: only one rest parameter,\
    \ it must be last, and it cannot have a default (`...rest = []` is a SyntaxError).\n- Trailing commas\
    \ after a rest parameter are also not allowed.\n- `f.length` counts only the parameters before the\
    \ rest (and before the first default).\n- Destructuring follows the same rule: `const [first, ...others]\
    \ = arr` works, `[...others, last]` does not.\n- To get the last argument, take it from the array:\
    \ `rest.at(-1)`.\n\n## Example\n```javascript\nfunction log(level, ...messages) {\n  console.log(`[${level}]`,\
    \ messages.join(' '));\n}\nlog('info', 'server', 'started'); // [info] server started\nconsole.log(log.length);\
    \         // 1\n\n// function bad(...items, last) {} // SyntaxError\n\nfunction lastOf(...items) {\n\
    \  return items.at(-1);\n}\n```\n\n## Common mistakes\n- Confusing rest parameters with spread in\
    \ a call; spread can appear anywhere in a call, rest only at the end of a definition.\n- Expecting\
    \ `arguments` inside an arrow function; arrows only have rest parameters.\n- Trying to give the rest\
    \ parameter a default.\n\n## In the interview\nGive the rule and the reason: the rest collects all\
    \ remaining arguments, so a later parameter could never receive one. Contrast with spread syntax,\
    \ which can appear in the middle of calls and array literals. Mention `length` and arrow functions\
    \ as small but telling details.\n"
