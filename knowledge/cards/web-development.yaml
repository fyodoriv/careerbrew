- id: kb-bc1f7761694c
  question: What happens when you type a URL into the browser and press Enter, up to the page being rendered?
  answer: The browser resolves the domain with DNS, opens a TCP (or QUIC) connection with TLS, sends an
    HTTP request and receives HTML. It then parses HTML into the DOM and CSS into the CSSOM, runs scripts,
    builds the render tree, computes layout, paints and composites pixels on screen.
  topic: web development
  tags:
  - browser
  - networking
  - rendering
  - http
  - dns
  explanation: '## In plain words

    Two big halves: first the browser has to fetch the page from a server across the internet, then it
    has to turn text (HTML, CSS, JavaScript) into pixels. Interviewers use this question to see how deep
    you can go in each half.


    ## How it works

    **Network**

    1. Parse the input: URL or search term. Check for HSTS (force HTTPS).

    2. Check caches (browser, OS), then DNS resolution to an IP address.

    3. TCP handshake and TLS handshake (HTTP/3 uses QUIC over UDP, merging both).

    4. Send the HTTP request with headers and cookies; follow redirects; the server (often via a CDN and
    load balancer) returns a response.


    **Rendering (critical rendering path)**

    5. Parse HTML into the DOM, streaming as bytes arrive. Discover CSS, scripts and images and fetch
    them.

    6. Parse CSS into the CSSOM. CSS blocks rendering; classic scripts block parsing unless `defer` or
    `async`.

    7. Combine into the render tree (visible nodes with computed styles).

    8. Layout: compute size and position of each box.

    9. Paint: fill in pixels into layers. Composite: the GPU combines layers.

    10. JavaScript runs, events fire (`DOMContentLoaded`, `load`), and later changes may trigger re-layout
    or repaint.


    ## Example

    A rough budget for a first visit on a mobile network: DNS 50 ms, TCP plus TLS 150 ms, server response
    200 ms, HTML download 100 ms, CSS fetch 150 ms, then first paint. A CDN, `preconnect` and inlined
    critical CSS each cut a piece of that.


    ## Common mistakes

    - Skipping TLS or caching entirely.

    - Saying the DOM is built only after the whole HTML downloads.

    - Mixing up layout (geometry) and paint (pixels).


    ## In the interview

    Give the whole outline first in 30 seconds, then ask which part to deepen. Be ready for follow-ups
    on DNS caching, HTTP/2 versus HTTP/3, render-blocking resources and reflow costs.

    '
