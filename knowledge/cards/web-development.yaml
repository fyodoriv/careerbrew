  question: What can a constructor function return in JavaScript?
  answer: Normally it returns nothing and `new` hands back the freshly created `this` object. If the constructor
    explicitly returns an object, that object replaces `this`; if it returns a primitive, the return value
    is ignored and `this` is still returned.
  topic: web development
  tags:
  - javascript
  - constructors
  - new
  - objects
  explanation: "## In plain words\nWhen you call a function with `new`, JavaScript builds an empty object\
    \ for you and gives it to the function as `this`. At the end it returns that object automatically.\
    \ You can override this only by returning another object; returning a number or string has no effect.\n\
    \n## How it works\n`new F(args)` does roughly this:\n1. Create an empty object whose prototype is\
    \ `F.prototype`.\n2. Call `F` with `this` bound to that object.\n3. If `F` returned an object (including\
    \ arrays and functions), use it as the result.\n4. Otherwise return the object from step 1.\n\nIn\
    \ a derived `class` constructor, returning a primitive other than `undefined` throws a `TypeError`,\
    \ and you must call `super()` before using `this`.\n\n## Example\n```javascript\nfunction Point(x)\
    \ {\n  this.x = x;\n  return 42;            // primitive: ignored\n}\nconsole.log(new Point(1)); \
    \       // Point { x: 1 }\n\nfunction Cached(id) {\n  if (Cached.cache[id]) return Cached.cache[id];\
    \   // object: replaces this\n  this.id = id;\n  Cached.cache[id] = this;\n}\nCached.cache = {};\n\
    console.log(new Cached(5) === new Cached(5));      // true\n```\n\n## Common mistakes\n- Expecting\
    \ `return 42` to make `new` produce `42`.\n- Returning a plain object and losing the prototype, so\
    \ `instanceof` checks fail.\n- Calling the constructor without `new`, so `this` is `undefined` in\
    \ strict mode.\n\n## In the interview\nDescribe the four steps of `new`, then the return rule. Give\
    \ a legitimate use: returning a cached instance (a simple singleton or flyweight) or a proxy. Point\
    \ out it makes code surprising, so a static factory method is usually clearer.\n"
