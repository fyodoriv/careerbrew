  question: What is hydration in React?
  answer: Hydration is the step where React, running in the browser, attaches event handlers and state
    to HTML that was already rendered on the server, instead of rebuilding the DOM. The client render
    must produce the same markup as the server, otherwise React reports a hydration mismatch.
  topic: web development
  tags:
  - react
  - ssr
  - hydration
  - frontend
  explanation: "## In plain words\nWith server-side rendering, the user first receives finished HTML,\
    \ so they see content fast, but nothing is clickable yet. Hydration is React \"waking up\" that static\
    \ page: it walks the existing DOM, matches it to its components and plugs in the interactivity.\n\n\
    ## How it works\n1. The server renders components to HTML and sends it with the JavaScript bundle.\n\
    2. The browser shows the HTML immediately.\n3. The bundle loads and calls `hydrateRoot(container,\
    \ <App />)`.\n4. React renders the component tree in memory and compares it with the existing DOM,\
    \ reusing nodes and attaching event listeners.\n5. Effects (`useEffect`) run, and the page is interactive.\n\
    - **Mismatch**: if the client output differs (for example, using `Date.now()`, `Math.random()` or\
    \ `window` during render), React warns and may re-render that part on the client.\n- **Cost**: the\
    \ time between seeing content and being able to interact. Fixes include streaming SSR with selective\
    \ hydration (React 18 hydrates `Suspense` boundaries independently) and React Server Components, which\
    \ send no JS for server-only components.\n\n## Example\n```jsx\nimport { useEffect, useState } from\
    \ \"react\";\nimport { hydrateRoot } from \"react-dom/client\";\nimport App from \"./App\";\n\nhydrateRoot(document.getElementById(\"\
    root\"), <App />);\n\n// Mismatch-prone component, and the fix\nfunction Clock() {\n  const [now,\
    \ setNow] = useState(null);\n  useEffect(() => setNow(new Date().toLocaleTimeString()), []);\n  return\
    \ <span>{now ?? \"--:--\"}</span>;\n}\n```\n\n## Common mistakes\n- Reading `window` or `localStorage`\
    \ during render.\n- Calling `createRoot` instead of `hydrateRoot`, which throws away the server HTML.\n\
    - Assuming SSR alone makes a page fast; a large bundle still delays interactivity.\n\n## In the interview\n\
    Explain the flow from server HTML to interactive page, the mismatch rule and how to avoid it, and\
    \ the performance trade-off. Mention selective hydration, partial or \"islands\" hydration in other\
    \ frameworks, and server components as ways to ship less JavaScript.\n"
