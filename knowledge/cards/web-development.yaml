- id: kb-5d667e5db288
  question: What causes memory leaks in JavaScript?
  answer: A leak happens when memory you no longer need stays reachable, so the garbage collector cannot
    free it. Common causes are forgotten timers and event listeners, ever-growing caches or global variables,
    closures holding large data, and references to DOM nodes that were removed from the page.
  topic: web development
  tags:
  - javascript
  - memory
  - garbage-collection
  - performance
  explanation: "## In plain words\nJavaScript frees memory automatically, but only for things nothing\
    \ can reach any more. A leak is not memory the engine forgot; it is memory your code is still, accidentally,\
    \ pointing to. Over time the page gets slower and can crash.\n\n## How it works\nThe garbage collector\
    \ uses mark-and-sweep: starting from roots (globals, the current call stack), it marks everything\
    \ reachable and frees the rest. Leaks come from unwanted reachability:\n- **Accidental globals**:\
    \ assigning to an undeclared variable in sloppy mode creates a global that lives forever.\n- **Timers**:\
    \ a `setInterval` that is never cleared keeps its callback and everything it closes over.\n- **Event\
    \ listeners**: listeners added on `window` or long-lived elements and never removed, especially in\
    \ components that mount and unmount.\n- **Detached DOM nodes**: removed from the page but still referenced\
    \ from a JS array or map.\n- **Unbounded caches**: a `Map` that only grows. A `WeakMap` or an LRU\
    \ limit fixes this.\n- **Closures**: a small callback that captures a large object keeps it alive.\n\
    \n## Example\n```javascript\nfunction mount(el) {\n  const big = new Array(1e6).fill(\"*\");\n  const\
    \ onResize = () => console.log(big.length);\n  window.addEventListener(\"resize\", onResize);\n  //\
    \ Fix: return a cleanup function\n  return () => window.removeEventListener(\"resize\", onResize);\n\
    }\nconst unmount = mount(document.body);\nunmount();   // without this, big stays in memory forever\n\
    ```\n\n## Common mistakes\n- Blaming the garbage collector instead of looking for references.\n- Forgetting\
    \ cleanup in React `useEffect` or framework destroy hooks.\n- Using a `Map` keyed by DOM nodes where\
    \ a `WeakMap` belongs.\n\n## In the interview\nExplain reachability, list the usual causes, then describe\
    \ how you would find one: Chrome DevTools Memory panel, take heap snapshots before and after an action,\
    \ compare, and look at retainers. Mention `AbortController` to remove many listeners at once.\n"
