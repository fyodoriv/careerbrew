  question: How does prototypal inheritance work in JavaScript?
  answer: Every object has a hidden link to another object, its prototype. When a property is not found
    on the object, the engine looks it up on the prototype, then that prototype's prototype, until it
    reaches null. Classes are syntax on top of this chain.
  topic: web development
  tags:
  - javascript
  - prototypes
  - inheritance
  - classes
  explanation: "## In plain words\nInstead of copying behaviour from a blueprint, JavaScript objects delegate.\
    \ Each object points to a 'parent' object. If you ask for something the object does not have, it asks\
    \ its parent, and so on up the line. Shared methods live once on the parent and every child can use\
    \ them.\n\n## How it works\n- The link is the internal `[[Prototype]]` slot; read it with `Object.getPrototypeOf(obj)`.\n\
    - Lookup: own property first, then up the chain to `Object.prototype`, whose prototype is `null`.\n\
    - Writing a property always creates or updates an own property (unless a setter exists up the chain);\
    \ it does not change the prototype.\n- Ways to set the link: `Object.create(proto)`, `new F()` (uses\
    \ `F.prototype`), and `class B extends A` (sets both `B.prototype` and `B` itself to inherit).\n-\
    \ `this` inside an inherited method refers to the object the method was called on.\n\n## Example\n\
    ```javascript\nconst animal = {\n  speak() { return `${this.name} makes a sound`; },\n};\nconst dog\
    \ = Object.create(animal);\ndog.name = 'Rex';\nconsole.log(dog.speak()); // Rex makes a sound\nconsole.log(Object.getPrototypeOf(dog)\
    \ === animal); // true\n\nclass Cat {\n  speak() { return 'meow'; }\n}\nconst c = new Cat();\nconsole.log(Object.getPrototypeOf(c)\
    \ === Cat.prototype); // true\n```\n\n## Common mistakes\n- Confusing `F.prototype` (the object instances\
    \ will link to) with an object's own prototype.\n- Thinking `class` introduces classical inheritance;\
    \ it still uses prototypes.\n- Long chains or `__proto__` mutation at runtime, which hurt performance.\n\
    - Putting mutable shared state such as arrays on the prototype, so all instances share it.\n\n## In\
    \ the interview\nExplain delegation and the lookup chain, then show that `class` desugars to it. Expect\
    \ follow-ups: what `new` does in four steps (create object, link prototype, run constructor with `this`,\
    \ return it), how `instanceof` walks the chain, and composition versus inheritance trade-offs.\n"
