- id: kb-68fb71c2f563
  question: What are logarithms?
  answer: 'A logarithm is the inverse of exponentiation: log_b(x) is the power you raise b to in order
    to get x, so log_2(8) = 3. In computing, log n counts how many times you can halve n, which is why
    binary search and balanced trees take O(log n) steps.'
  topic: math
  tags:
  - math
  - logarithms
  - complexity
  explanation: "## In plain words\nExponents ask \"what is 2 multiplied by itself 3 times?\" (8). Logarithms\
    \ ask the reverse: \"how many times must I multiply 2 to reach 8?\" (3). Another way to see it: how\
    \ many times can you cut something in half before you reach 1?\n\n## How it works\n- Definition: `log_b(x)\
    \ = y` means `b^y = x`, for `b > 0`, `b ≠ 1` and `x > 0`.\n- Common bases: 2 in computer science,\
    \ 10 in engineering, `e` (about 2.718) for the natural log `ln`.\n- Rules:\n  - `log(a · b) = log\
    \ a + log b`\n  - `log(a / b) = log a − log b`\n  - `log(a^k) = k · log a`\n  - Change of base: `log_b(x)\
    \ = ln(x) / ln(b)`. Since bases differ by a constant factor, Big O ignores the base.\n- Growth: `log\
    \ n` grows very slowly; `log_2` of a billion is about 30.\n- Where it appears: binary search, balanced\
    \ binary search trees, heaps, divide-and-conquer sorts (`n log n`), the number of bits needed to store\
    \ `n` values.\n\n## Example\n```python\nimport math\nprint(math.log2(8))           # 3.0\nprint(math.log10(1000))\
    \       # 3.0\nprint(math.ceil(math.log2(1_000_000)))  # 20 halvings to find one item among a million\n\
    ```\nBinary search over 1,000,000 sorted items needs at most about 20 comparisons, while a linear\
    \ scan may need 1,000,000.\n\n## Common mistakes\n- Mixing up `log n` and `n log n`.\n- Thinking the\
    \ base matters in Big O.\n- Taking the log of zero or a negative number.\n- Forgetting floating-point\
    \ error when using logs to test exact powers.\n\n## In the interview\nExplain it as \"inverse of a\
    \ power\" and as \"number of halvings\", then connect it to algorithm complexity. Follow-ups: why\
    \ a balanced tree has height `O(log n)`, why comparison sorting needs `Ω(n log n)`, and estimating\
    \ `log_2` of common sizes quickly.\n"
