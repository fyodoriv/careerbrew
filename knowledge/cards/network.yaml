- id: kb-4bacea4bbcae
  question: What is a server-selection strategy in load balancing?
  answer: 'A server-selection strategy is the rule a load balancer uses to pick a backend for each request:
    round robin, weighted round robin, least connections, least response time, random or power of two
    choices, or hashing on IP or a key for affinity. The right choice depends on request cost, server
    capacity and whether state must stick to one server.'
  topic: network
  tags:
  - load-balancing
  - system-design
  - scalability
  explanation: '## In plain words

    A load balancer is a host at a restaurant, and the strategy is how the host decides which table each
    new guest goes to: take turns, pick the least busy waiter, or always seat regulars at the same table.


    ## How it works

    - **Round robin**: next server in turn. Simple; fine when requests are similar.

    - **Weighted round robin**: bigger servers get proportionally more.

    - **Least connections**: pick the server with the fewest open connections; good for long or uneven
    requests.

    - **Least response time**: favour the fastest recent responders.

    - **Random / power of two choices**: pick two random servers and send to the less loaded one; works
    well with many balancers and stale information.

    - **Hash-based** (client IP, user ID, or consistent hashing on a key): the same client or key goes
    to the same server, useful for caches and sessions, but can create hot spots.

    - All of these should skip servers that fail health checks.


    ## Example

    Three servers, one twice as big: weighted round robin with weights 2, 1, 1 sends the sequence A, A,
    B, C, A, A, B, C. If some requests are video exports that take minutes, least connections avoids piling
    them onto one server.


    ## Common mistakes

    - Using round robin when request costs vary wildly.

    - Using IP hashing behind a corporate NAT, which sends a whole company to one server.

    - Forgetting health checks, so traffic keeps flowing to a dead server.


    ## In the interview

    List a few strategies and say when each fits. Mention health checks, slow start for new servers, and
    sticky sessions as a trade-off against even load. Interviewers like the "power of two choices" idea
    and consistent hashing for caches.

    '
