- id: kb-df230ffcaf8a
  question: What is the TLS (Transport Layer Security) handshake?
  answer: The TLS handshake is the start of a secure connection where client and server agree on a protocol
    version and cipher, the server proves its identity with a certificate, and both derive shared session
    keys through an ephemeral Diffie-Hellman exchange. TLS 1.3 does this in one round trip.
  topic: network
  tags:
  - tls
  - security
  - https
  - networking
  explanation: '## In plain words

    Before two strangers can whisper secrets in a crowded room, they need to check each other''s ID and
    agree on a secret code without anyone overhearing it. The TLS handshake is that short ritual at the
    start of every HTTPS connection.


    ## How it works

    TLS 1.3, simplified:

    1. **ClientHello**: supported versions and ciphers, a random value, the server name (SNI), and a Diffie-Hellman
    key share.

    2. **ServerHello**: the chosen cipher and the server''s key share. Both sides can now compute the
    same secret; everything after this is encrypted.

    3. The server sends its **certificate** and a **CertificateVerify** signature proving it owns the
    private key, then **Finished**.

    4. The client checks the certificate chain up to a trusted certificate authority, checks the host
    name and expiry, verifies the signature, and sends **Finished**.

    5. Application data flows, encrypted with symmetric keys (for example AES-GCM or ChaCha20-Poly1305).

    Ephemeral keys give forward secrecy: a stolen long-term key cannot decrypt past sessions. TLS 1.2
    needed two round trips; resumption can make TLS 1.3 zero round trips.


    ## Example

    ```bash

    openssl s_client -connect example.com:443 -servername example.com

    ```

    The output shows the negotiated version (TLSv1.3), the cipher, and the certificate chain.


    ## Common mistakes

    - Saying the session data is encrypted with the server''s RSA public key; modern TLS uses it only
    to authenticate, and derives keys with Diffie-Hellman.

    - Forgetting that the client must check the host name, not only the chain.

    - Calling it SSL; SSL versions are obsolete and insecure.


    ## In the interview

    Walk through the steps and name the three goals: authentication, key agreement and encryption. Follow-ups:
    forward secrecy, certificate pinning, 0-RTT replay risk, mutual TLS for service-to-service traffic,
    and handshake latency as a reason for connection reuse.

    '
