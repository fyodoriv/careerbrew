- id: kb-2eb571c335c0
  question: Which URLs have the same origin?
  answer: Two URLs have the same origin only when the scheme, host and port all match exactly. Paths,
    query strings and fragments do not matter, but http versus https, a different subdomain, or a different
    port each make a different origin.
  topic: network
  tags:
  - web-security
  - same-origin-policy
  - cors
  - browser
  explanation: "## In plain words\nBrowsers isolate websites from each other using the \"origin\": a triple\
    \ of scheme, host and port. Pages from the same origin can read each other's data freely; pages from\
    \ different origins cannot, unless the server opts in (for example, with CORS).\n\n## How it works\n\
    - Origin = `scheme://host:port`. The default ports (80 for http, 443 for https) are implied when absent.\n\
    - Compare all three parts exactly:\n  - `https` versus `http`: different.\n  - `example.com` versus\
    \ `www.example.com` or `api.example.com`: different.\n  - `:443` versus `:8443`: different.\n- The\
    \ path, query and fragment are ignored.\n- The **same-origin policy** blocks scripts from reading\
    \ cross-origin responses, DOM and storage. Loading cross-origin images, scripts and form posts is\
    \ allowed; reading the results is what is restricted.\n- \"Same site\" is a looser idea (same registrable\
    \ domain, used for cookies' `SameSite`), so `a.example.com` and `b.example.com` are same-site but\
    \ cross-origin.\n\n## Example\nCompared with `https://example.com/app`:\n| URL | Same origin? | Why\
    \ |\n|---|---|---|\n| `https://example.com/other?x=1` | yes | only the path differs |\n| `https://example.com:443/`\
    \ | yes | 443 is the default port |\n| `http` instead of `https`, same host | no | scheme |\n| `https://www.example.com/`\
    \ | no | host |\n| `https://example.com:8080/` | no | port |\n\n## Common mistakes\n- Thinking subdomains\
    \ share an origin.\n- Forgetting that the port counts.\n- Confusing \"same origin\" with \"same site\"\
    .\n- Believing CORS protects the server; it controls what browsers let pages read.\n\n## In the interview\n\
    State the rule, then walk through a few tricky cases. Follow-ups: how CORS relaxes the policy (`Access-Control-Allow-Origin`,\
    \ preflight requests), `postMessage` between frames, and how `SameSite` cookies relate to CSRF protection.\n"
