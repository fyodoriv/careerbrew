- id: kb-24386f0a3634
  question: How does HTTP/3 differ from HTTP/2?
  answer: HTTP/3 keeps HTTP semantics but runs over QUIC on UDP instead of TCP. QUIC builds TLS 1.3 into
    the transport, sets up connections in fewer round trips, has independent streams so one lost packet
    does not stall the others, and supports connection migration when a device changes networks.
  topic: network
  tags:
  - http
  - http3
  - quic
  - performance
  explanation: '## In plain words

    HTTP/2 put many requests in one TCP pipe, but if one packet is lost the whole pipe waits. HTTP/3 replaces
    the pipe with QUIC, which is like many small independent pipes inside one connection: a loss on one
    does not hold up the rest.


    ## How it works

    - **Transport**: QUIC over UDP, implemented in user space, so it can evolve faster than TCP in operating-system
    kernels.

    - **Handshake**: transport and TLS 1.3 setup are combined, so a new connection takes one round trip;
    a resumed one can send data immediately (0-RTT), with replay risks for non-idempotent requests.

    - **No transport head-of-line blocking**: each stream is delivered independently.

    - **Connection migration**: connections are identified by a connection ID, not the IP and port pair,
    so a phone switching from Wi-Fi to mobile keeps its connection.

    - **Header compression**: QPACK, a variant of HPACK designed for out-of-order delivery.

    - **Discovery**: servers advertise HTTP/3 with the `Alt-Svc` header or DNS records; clients fall back
    to HTTP/2 if UDP is blocked.


    ## Example

    On a mobile network with 2% packet loss, an HTTP/2 page stalls all downloads whenever a packet is
    lost. Under HTTP/3 only the affected stream waits, so images and scripts keep arriving and the page
    finishes sooner. On a clean wired network the difference is small.


    ## Common mistakes

    - Saying HTTP/3 is "HTTP over UDP" without mentioning that QUIC adds reliability and encryption.

    - Assuming it always wins; some networks block or throttle UDP, and QUIC can cost more CPU.

    - Forgetting the replay risk of 0-RTT data.


    ## In the interview

    Explain it as fixing the problem HTTP/2 left: TCP head-of-line blocking. Mention faster handshakes
    and connection migration. Trade-offs: UDP blocking in firewalls, CPU cost, and newer tooling. Say
    that the benefits are largest on lossy mobile networks.

    '
