- id: kb-4481c5ccb195
  question: What is a checksum?
  answer: A checksum is a small value computed from data and sent or stored with it. The receiver recomputes
    it and compares; a mismatch shows the data was corrupted. Simple checksums and CRCs catch accidental
    errors, while cryptographic hashes or MACs are needed against deliberate tampering.
  topic: network
  tags:
  - networking
  - data-integrity
  - error-detection
  explanation: "## In plain words\nA checksum is like counting the items in a parcel before sending it\
    \ and writing the number on the label. The receiver counts again; if the numbers differ, something\
    \ went wrong on the way.\n\n## How it works\n- The sender runs a function over the bytes and attaches\
    \ the result.\n- The receiver runs the same function and compares. Equal values mean the data is very\
    \ probably intact; different values mean it is damaged.\n- Kinds:\n  - **Simple sums**, such as the\
    \ 16-bit one's-complement checksum in IP, TCP and UDP headers: cheap, but weak.\n  - **CRC** (cyclic\
    \ redundancy check), used by Ethernet, ZIP and PNG: very good at catching burst errors.\n  - **Cryptographic\
    \ hashes** such as SHA-256, used to verify downloads.\n  - **MACs** such as HMAC, which use a secret\
    \ key so an attacker cannot forge a matching value.\n- A checksum detects errors; it does not fix\
    \ them. Error-correcting codes are a different tool.\n\n## Example\n```python\nimport zlib, hashlib\n\
    data = b\"hello world\"\nprint(zlib.crc32(data))                    # 222957957\nprint(hashlib.sha256(data).hexdigest()[:16])\n\
    ```\nA download page lists the SHA-256 of a file; after downloading, you compute it yourself and compare.\n\
    \n## Common mistakes\n- Treating a CRC or simple checksum as protection against attackers; anyone\
    \ can recompute it after editing the data.\n- Assuming a match is a mathematical proof; collisions\
    \ are possible, just unlikely.\n- Confusing detection with correction.\n\n## In the interview\nDefine\
    \ it, give the network example (TCP and Ethernet) and the download example. The key trade-off is cost\
    \ versus strength: CRC is fast and fine for noise, SHA-256 resists collisions, and HMAC adds authenticity.\
    \ Interviewers like hearing that you match the tool to the threat.\n"
  match:
  - 5ec0aaae7bbb
