- id: kb-32ab58d4569a
  question: What are the common DNS record types?
  answer: DNS records map a name to data. The common ones are A and AAAA (IPv4 and IPv6 addresses), CNAME
    (alias to another name), MX (mail servers), TXT (free text such as SPF or domain verification), NS
    (authoritative name servers) and SOA (zone metadata).
  topic: network
  tags:
  - dns
  - networking
  - infrastructure
  explanation: '## In plain words

    DNS is a giant phone book for the internet, and each entry has a type that says what kind of information
    it holds. Asking for the address of a website uses one type; asking where to deliver email for a domain
    uses another.


    ## How it works

    - **A**: name to IPv4 address, for example `203.0.113.10 (a documentation-only address)`.

    - **AAAA**: name to IPv6 address.

    - **CNAME**: this name is an alias of another name; the resolver then looks up the target. A name
    with a CNAME cannot hold other records, so it is not allowed at the zone apex.

    - **MX**: mail exchangers for the domain, each with a priority (lower is preferred).

    - **TXT**: arbitrary text; used for SPF, DKIM, DMARC and ownership checks.

    - **NS**: which servers are authoritative for the zone.

    - **SOA**: start of authority: primary server, admin contact, serial number and timers.

    - **PTR**: reverse lookup from an IP address to a name.

    - **SRV** and **CAA**: service location (host and port) and which certificate authorities may issue
    certificates.

    Every record also has a TTL, the number of seconds resolvers may cache it.


    ## Example

    ```text

    example.com.      3600 IN A     203.0.113.10

    www.example.com.  3600 IN CNAME example.com.

    example.com.      3600 IN MX    10 mail.example.com.

    example.com.      3600 IN TXT   "v=spf1 include:_spf.example.net ~all"

    ```

    `dig www.example.com` follows the CNAME and returns the A record.


    ## Common mistakes

    - Putting a CNAME at the root domain; many providers offer ALIAS or ANAME records as a workaround.

    - Forgetting TTLs, then wondering why a change takes hours to spread.

    - Confusing NS records (who answers for the zone) with A records.

    - Thinking MX points to an IP address; it points to a host name.


    ## In the interview

    List the main types with one line each, then mention TTL and caching. A good follow-up is how you
    would migrate a site with low downtime: lower the TTL a day ahead, switch the record, then raise it
    again. You can also mention that DNS is often used for load balancing and failover by returning different
    A records.

    '
