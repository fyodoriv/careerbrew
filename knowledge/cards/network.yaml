- id: kb-d20c7aaf66a0
  question: How does the internet work?
  answer: The internet is a network of independent networks that agree on common protocols. Data is split
    into IP packets that routers forward hop by hop toward a destination address, while TCP or QUIC add
    reliability and DNS turns names into addresses.
  topic: network
  tags:
  - networking
  - tcp-ip
  - dns
  - routing
  explanation: '## In plain words

    Think of the internet as the world''s postal system for data. Every device has an address (an IP address),
    messages are cut into small envelopes (packets), and many independent sorting offices (routers run
    by different networks) pass the envelopes along until they arrive. Nobody owns the whole thing; it
    works because everyone follows the same rules, called protocols.


    ## How it works

    - **Layers.** Each layer does one job: the link layer (Ethernet, Wi-Fi) moves frames between neighbouring
    devices; IP moves packets between networks; TCP or UDP deliver data between programs; application
    protocols such as HTTP give it meaning.

    - **Addressing.** Every host has an IP address. DNS translates a name like `example.com` into that
    address.

    - **Routing.** Routers look at the destination address and pick the next hop using routing tables.
    Between large networks (autonomous systems), BGP announces which address ranges each network can reach.

    - **Reliability.** IP is best effort: packets can be lost or reordered. TCP numbers the bytes, acknowledges
    them and resends lost ones.

    - **Security.** TLS encrypts the application data on top of TCP (or inside QUIC).


    ## Example

    Opening `https://example.com`:

    1. The browser asks a DNS resolver for the IP address.

    2. It opens a TCP connection (three-way handshake) to port 443.

    3. It runs a TLS handshake to agree on keys and check the certificate.

    4. It sends an HTTP request; packets travel through your router, your ISP and several other networks.

    5. The server replies, and the browser reassembles and renders the page.


    ## Common mistakes

    - Treating "the internet" and "the web" as the same thing; the web is one application on top of it.

    - Saying DNS carries the page data; it only resolves names.

    - Forgetting that IP alone gives no delivery guarantee.

    - Skipping the TLS step when describing an HTTPS request.


    ## In the interview

    Walk through "what happens when you type a URL" layer by layer and keep it crisp. Expect follow-ups
    on DNS caching, the TCP handshake, TLS, CDNs or HTTP/2 versus HTTP/3. Show judgment by naming where
    latency comes from (DNS lookup, round trips for handshakes, distance) and how caching and CDNs cut
    it.

    '
