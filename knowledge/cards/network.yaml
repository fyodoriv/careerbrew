- id: kb-f43db6850a0a
  question: What is a forward proxy?
  answer: A forward proxy sits in front of clients and sends their requests to the internet on their behalf.
    Servers see the proxy, not the client. It is used for filtering, caching, logging, anonymity and controlling
    outbound traffic.
  topic: network
  tags:
  - proxy
  - networking
  - security
  explanation: '## In plain words

    A forward proxy is like an assistant who makes calls for you: you tell the assistant who to call,
    and the person on the other end only hears the assistant. It works for the client side, unlike a reverse
    proxy, which works for the server side.


    ## How it works

    - Clients are configured to use the proxy (browser settings, environment variables such as `HTTPS_PROXY`,
    or transparent interception by the network).

    - For plain HTTP, the client sends the full URL to the proxy, which fetches it.

    - For HTTPS, the client sends `CONNECT host:443`; the proxy opens a TCP tunnel and passes encrypted
    bytes through without seeing the content, unless the organisation installs its own certificate to
    inspect traffic.

    - Uses: blocking sites, enforcing company policy, caching shared downloads, audit logging, hiding
    client IPs, and giving a fixed outbound IP for allow-lists.


    ## Example

    ```bash

    export HTTPS_PROXY=proxy.corp.local:3128

    curl https://example.com   # curl sends CONNECT example.com:443 to the proxy

    ```

    The web server logs the proxy''s IP address, not the laptop''s.


    ## Common mistakes

    - Mixing it up with a reverse proxy; ask "whose side is it on?"

    - Assuming the proxy can read HTTPS traffic by default; with `CONNECT` it cannot.

    - Treating it as strong anonymity; the proxy operator still sees everything it can log.


    ## In the interview

    Contrast forward and reverse proxies in one sentence each, then give a corporate example. Follow-ups:
    how HTTPS works through a proxy (`CONNECT`), the privacy and trust cost of TLS inspection, and the
    latency and single-point-of-failure risks of putting a proxy in the path.

    '
