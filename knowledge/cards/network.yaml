- id: kb-ba5372a2dafb
  question: What is a top-level domain (TLD) name server?
  answer: A TLD name server is responsible for one top-level domain such as .com or .org. During resolution
    it does not know the final address; it replies with the NS records of the authoritative name servers
    for the second-level domain, such as example.com.
  topic: network
  tags:
  - dns
  - networking
  - name-servers
  explanation: '## In plain words

    DNS is a tree. At the top are the root servers, below them the servers for each top-level domain (the
    last label of a name, like `.com`, `.org` or `.uk`), and below those the servers that each domain
    owner runs. A TLD server is the middle layer: it knows who is in charge of every domain under its
    TLD, but not their addresses.


    ## How it works

    - A recursive resolver that has nothing cached first asks a root server, which points it to the servers
    for the TLD.

    - It then asks a TLD server: "where is `www.example.com`?"

    - The TLD server answers with a referral: the NS records for `example.com` and, when needed, their
    IP addresses (glue records).

    - The resolver then asks those authoritative servers for the actual record.

    - TLD servers are run by a registry (for example, the operator of `.com`). When you buy a domain at
    a registrar, the registrar tells the registry which name servers to list for it.


    ## Example

    ```text

    resolver -> root:  www.example.com?   -> "ask the .com servers"

    resolver -> .com:  www.example.com?   -> "example.com is served by ns1.example-dns.net"

    resolver -> ns1:   www.example.com?   -> A 203.0.113.10 (a documentation-only address)

    ```

    `dig +trace www.example.com` prints each of these steps.


    ## Common mistakes

    - Thinking the TLD server stores the website''s IP address.

    - Confusing the registry (runs the TLD) with the registrar (sells the domain).

    - Forgetting that resolvers cache TLD referrals, so most lookups never reach the root or TLD servers.


    ## In the interview

    Place the TLD server in the full lookup chain: root, TLD, authoritative. Mention caching and TTLs
    as the reason this scales. A common follow-up is what happens when you change your domain''s name
    servers: the TLD update can take time to be seen because resolvers cache the old NS records.

    '
