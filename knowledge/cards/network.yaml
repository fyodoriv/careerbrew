- id: kb-dc7f1dc50021
  question: What is TCP (Transmission Control Protocol)?
  answer: TCP is a connection-oriented transport protocol that gives applications a reliable, ordered
    byte stream over unreliable IP. It uses a three-way handshake, sequence numbers and acknowledgements
    with retransmission, flow control through a receive window, and congestion control.
  topic: network
  tags:
  - tcp
  - networking
  - transport-layer
  explanation: '## In plain words

    IP can lose or shuffle packets. TCP is the careful courier on top: it numbers every piece, waits for
    the receiver to confirm, resends what got lost, and hands the data over in the right order. The application
    just sees a clean stream of bytes.


    ## How it works

    - **Handshake**: client sends SYN, server replies SYN-ACK, client sends ACK. This costs one round
    trip before data flows.

    - **Sequence numbers and ACKs**: every byte is numbered; the receiver acknowledges what it has. Missing
    data is resent after a timeout or after duplicate ACKs (fast retransmit).

    - **Ordering**: out-of-order segments are buffered until the gap is filled.

    - **Flow control**: the receiver advertises a window so a fast sender does not overflow it.

    - **Congestion control**: the sender adjusts its rate (slow start, then congestion avoidance with
    algorithms such as CUBIC or BBR) to avoid overloading the network.

    - **Teardown**: FIN and ACK from each side; the side that closes first sits in TIME_WAIT for a while.

    - Compared with UDP: TCP adds reliability and order at the cost of latency and head-of-line blocking.


    ## Example

    ```python

    import socket

    s = socket.create_connection(("example.com", 80))  # handshake happens here

    s.sendall(b"GET / HTTP/1.1\r\nHost: example.com\r\nConnection: close\r\n\r\n")

    print(s.recv(100))

    s.close()

    ```


    ## Common mistakes

    - Thinking TCP preserves message boundaries; it is a byte stream, so applications must frame messages.

    - Confusing flow control (receiver) with congestion control (network).

    - Ignoring handshake latency when explaining slow first requests.


    ## In the interview

    Cover handshake, reliability, ordering, flow and congestion control, then compare with UDP. Follow-ups:
    why HTTP/3 moved to QUIC, TIME_WAIT on busy servers, Nagle''s algorithm and `TCP_NODELAY`, and how
    keep-alive reuses connections.

    '
