- id: kb-e4c307967e3f
  question: What is a recursive DNS resolver?
  answer: A recursive resolver is the DNS server clients ask first. It does the full lookup on their behalf,
    querying root, TLD and authoritative servers as needed, caches the answers for their TTL and returns
    the final result to the client.
  topic: network
  tags:
  - dns
  - networking
  - caching
  explanation: '## In plain words

    Your device does not want to walk the whole DNS tree itself, so it asks one helper, the recursive
    resolver, to "find this for me". The helper does the legwork and remembers answers so the next person
    asking gets them instantly.


    ## How it works

    - The client''s stub resolver sends one recursive query ("give me the final answer").

    - The resolver checks its cache. On a miss, it makes iterative queries: root server, then TLD server,
    then authoritative server, following each referral.

    - It caches every answer, including referrals and negative answers (NXDOMAIN), for their TTL.

    - It may validate DNSSEC signatures and may filter known malicious domains.

    - Examples: your ISP''s resolver, a company resolver, or public ones such as 1.1.1.1 and 8.8.8.8.
    Many support encrypted DNS (DoH or DoT).


    ## Example

    ```text

    client -> resolver:   www.example.com A?   (recursive)

    resolver -> root:     referral to .com

    resolver -> .com:     referral to ns1.example-dns.net

    resolver -> ns1:      A 203.0.113.10 (a documentation-only address) (TTL 300)

    resolver -> client:   203.0.113.10

    ```

    For the next 300 seconds, other clients get the answer from the cache in about a millisecond.


    ## Common mistakes

    - Mixing it up with an authoritative server.

    - Assuming a DNS change is seen everywhere at once; resolvers serve cached data until the TTL expires.

    - Running an open resolver on the internet, which can be abused for amplification attacks.


    ## In the interview

    Explain recursive versus iterative queries and the role of caching. Follow-ups: cache poisoning and
    DNSSEC, privacy (resolvers see every domain you visit), and how a CDN may use the resolver''s location
    to pick a nearby server.

    '
