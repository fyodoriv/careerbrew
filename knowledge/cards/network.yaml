- id: kb-22be664f1c15
  question: What is DNS, and how is a domain name resolved into an IP address?
  answer: DNS is the internet's distributed directory that maps names to records such as IP addresses.
    A recursive resolver checks its cache, then asks a root server, a TLD server and finally the domain's
    authoritative server, caching each answer for its TTL.
  topic: network
  tags:
  - dns
  - networking
  - caching
  explanation: '## In plain words

    Computers talk using numeric IP addresses, but people remember names. DNS (Domain Name System) is
    the system that translates one into the other. It is not one big server: it is a tree of servers,
    each responsible for a part of the name space.


    ## How it works

    1. The app asks the operating system, which checks its local cache and the hosts file.

    2. If needed, it asks a **recursive resolver** (from your ISP, company, or a public one).

    3. The resolver checks its cache. On a miss, it asks a **root server**, which refers it to the servers
    for the top-level domain (`.com`).

    4. A **TLD server** refers it to the **authoritative servers** for `example.com`.

    5. The authoritative server returns the record, for example an A record with the IPv4 address.

    6. The resolver caches the answer for its TTL and returns it to the client.

    Queries normally use UDP port 53 and fall back to TCP for large answers. Encrypted variants include
    DNS over HTTPS and DNS over TLS.


    ## Example

    ```text

    $ dig +short www.example.com

    203.0.113.10 (a documentation-only address)

    $ dig +trace www.example.com   # shows root -> .com -> authoritative

    ```

    With warm caches the lookup takes a few milliseconds; a cold lookup can take 100 ms or more.


    ## Common mistakes

    - Saying the browser asks the root server directly; the recursive resolver does the walking.

    - Forgetting caching at every level (browser, OS, resolver).

    - Mixing up recursive resolvers and authoritative servers.

    - Ignoring TTL when planning a migration.


    ## In the interview

    Describe the chain clearly and stress caching, because that is why DNS scales. Follow-ups: DNS-based
    load balancing and failover, why low TTLs cost more queries, DNS spoofing and DNSSEC, and how DNS
    fits into page-load latency (and `dns-prefetch` hints).

    '
