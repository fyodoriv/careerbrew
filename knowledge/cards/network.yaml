- id: kb-17e5456c66a4
  question: What is an authoritative name server?
  answer: An authoritative name server holds the actual DNS records for a zone, such as example.com, and
    gives final answers for it. Resolvers reach it after the root and TLD servers refer them there, and
    its answers are marked authoritative rather than cached.
  topic: network
  tags:
  - dns
  - networking
  - name-servers
  explanation: '## In plain words

    If DNS is a phone book, the authoritative server is the original book kept by the owner of the domain.
    Other servers may keep copies (caches), but this one is the source of truth.


    ## How it works

    - A zone owner publishes records (A, AAAA, MX, TXT and others) on one or more authoritative servers,
    usually a managed DNS provider.

    - The parent TLD lists these servers in NS records, so resolvers can find them.

    - When a resolver asks for a name in the zone, the server replies from its own data and sets the "authoritative
    answer" flag. If the name does not exist, it returns NXDOMAIN.

    - There are normally at least two servers for redundancy. Copies stay in sync by zone transfer or
    by the provider''s own replication.

    - Each answer has a TTL that tells resolvers how long they may cache it.


    ## Example

    ```text

    $ dig @ns1.example-dns.net www.example.com

    ;; flags: qr aa rd; ...

    www.example.com. 300 IN A 203.0.113.10 (a documentation-only address)

    ```

    The `aa` flag shows that the answer comes from an authoritative server, not from a cache.


    ## Common mistakes

    - Confusing it with a recursive resolver, which only looks things up on behalf of clients.

    - Running a single authoritative server, which makes the whole domain a single point of failure.

    - Changing records and forgetting that resolvers keep old answers until the TTL runs out.


    ## In the interview

    Contrast it with the recursive resolver and place it at the end of the lookup chain. Follow-ups: why
    use anycast for authoritative DNS (lower latency and resilience to attacks), how DNSSEC signs its
    answers, and how you would plan a low-risk DNS change.

    '
