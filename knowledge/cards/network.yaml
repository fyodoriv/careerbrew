- id: kb-21b8f759b42e
  question: What is the Internet Protocol (IP)?
  answer: IP is the network-layer protocol that gives every host an address and moves packets from source
    to destination across many networks. It is connectionless and best effort; reliability and ordering
    come from protocols above it, such as TCP or QUIC.
  topic: network
  tags:
  - ip
  - networking
  - routing
  explanation: '## In plain words

    IP is the addressing and delivery system of the internet. It decides how to label each piece of data
    with where it comes from and where it goes, and lets routers pass it along. It does not promise that
    the piece arrives.


    ## How it works

    - **Addressing**: IPv4 uses 32-bit addresses (about 4.3 billion); IPv6 uses 128-bit addresses. Addresses
    are grouped into prefixes (CIDR, like `10.0.0.0/8`) so routers can store routes for ranges, not single
    hosts.

    - **Routing**: each router looks up the longest matching prefix for the destination and forwards the
    packet to the next hop. Routing protocols (OSPF inside a network, BGP between networks) build these
    tables.

    - **Connectionless**: there is no setup; each packet is handled on its own.

    - **Best effort**: packets may be dropped, duplicated or reordered. TCP adds reliability; UDP does
    not, and leaves it to the application.

    - **Helpers**: ICMP reports errors (and powers `ping`), ARP or IPv6 neighbour discovery map IP addresses
    to hardware addresses on a local network, and NAT lets many private addresses share one public IPv4
    address.


    ## Example

    Your laptop at `192.168.1.20` sends a packet to `203.0.113.10 (a documentation-only address)`. The
    home router sees it is not local, rewrites the source with NAT to its public address, and sends it
    to the ISP. About ten routers later it reaches the server''s network. `traceroute 203.0.113.10` lists
    those hops.


    ## Common mistakes

    - Saying IP guarantees delivery.

    - Confusing IP addresses with MAC addresses.

    - Forgetting NAT when explaining why private addresses work on the internet.


    ## In the interview

    Give the role (addressing and routing), the "best effort" property, and how TCP and UDP sit on top.
    Follow-ups: IPv4 versus IPv6, CIDR subnetting, NAT, and what `ping` and `traceroute` show.

    '
