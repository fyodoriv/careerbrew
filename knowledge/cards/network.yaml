- id: kb-15fc9f717d93
  question: What is a root name server?
  answer: Root name servers sit at the top of the DNS tree. They do not know the address of any website;
    they answer with referrals to the name servers for each top-level domain such as .com or .org. There
    are 13 named root server identities, each served by many machines via anycast.
  topic: network
  tags:
  - dns
  - networking
  - name-servers
  explanation: '## In plain words

    The root servers are the first page of the DNS directory. They only say which directory to open next:
    "for anything ending in `.com`, ask these servers". Everything else is handled further down the tree.


    ## How it works

    - The root zone lists every top-level domain and its name servers.

    - There are 13 root server names, `a.root-servers.net` to `m.root-servers.net`, run by a dozen organisations.
    Each name is served by many physical servers around the world using anycast (the same IP announced
    from many places; routing picks the nearest).

    - Resolvers ship with a "root hints" file listing these addresses.

    - Because TLD referrals have long TTLs and are cached, resolvers rarely need to ask the root at all.

    - The root zone is signed with DNSSEC, which makes it the anchor of the chain of trust.


    ## Example

    ```text

    $ dig @a.root-servers.net www.example.com

    ;; AUTHORITY SECTION:

    com.  172800 IN NS a.gtld-servers.net.

    ...

    ```

    The root does not return an address; it refers the resolver to the `.com` servers, and that referral
    may be cached for two days.


    ## Common mistakes

    - Saying there are only 13 physical root servers; there are hundreds of instances.

    - Thinking every lookup hits the root; caching avoids most of that.

    - Confusing root servers with TLD servers.


    ## In the interview

    Place the root in the resolution chain, mention anycast and caching as the reasons it handles global
    load, and mention DNSSEC as the trust anchor. A follow-up may ask what would happen if roots went
    down: cached referrals keep most lookups working for a while.

    '
