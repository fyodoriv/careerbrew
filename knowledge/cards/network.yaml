- id: kb-6f8489e13bc6
  question: What is an IP packet?
  answer: 'An IP packet is the unit of data the Internet Protocol carries: a header with source and destination
    addresses, TTL or hop limit, protocol and other fields, followed by a payload such as a TCP segment
    or UDP datagram. Routers forward each packet independently based on its destination.'
  topic: network
  tags:
  - ip
  - networking
  - packets
  explanation: '## In plain words

    An IP packet is an envelope. The outside has the sender''s and receiver''s addresses plus a few handling
    instructions; the inside holds a chunk of the actual message. Big messages are split across many envelopes
    that may take different routes.


    ## How it works

    - **IPv4 header fields**: version, header length, total length, identification and fragmentation fields,
    TTL, protocol (6 for TCP, 17 for UDP), header checksum, source and destination addresses.

    - **IPv6** uses a simpler fixed 40-byte header with a hop limit, a "next header" field and 128-bit
    addresses; routers do not fragment IPv6 packets.

    - **Forwarding**: each router reads the destination, picks the next hop, decrements the TTL, and drops
    the packet if TTL reaches zero (this stops loops and is how `traceroute` works).

    - **Size**: limited by the link''s MTU, often 1500 bytes on Ethernet. Larger data is split by the
    sender (TCP segments) or, in IPv4, fragmented.

    - IP is best effort: packets can be lost, duplicated or arrive out of order; higher layers deal with
    that.


    ## Example

    A 1500-byte Ethernet frame often carries a 20-byte IPv4 header, a 20-byte TCP header and 1460 bytes
    of data. Sending a 1 MB file therefore takes about 720 packets, each routed on its own.


    ## Common mistakes

    - Saying IP guarantees delivery or order.

    - Confusing a packet (layer 3) with a frame (layer 2) or a segment (TCP).

    - Forgetting that TTL counts hops, not seconds, in practice.


    ## In the interview

    Describe the header''s key fields and what routers do with them. Follow-ups: MTU and path MTU discovery,
    fragmentation problems, IPv4 versus IPv6, and how TCP rebuilds a reliable stream on top of unreliable
    packets.

    '
