- id: kb-bf82a8cb4069
  question: How does HTTP/2 differ from HTTP/1.1?
  answer: 'HTTP/2 keeps the same methods, headers and semantics but changes the wire format: a binary
    framing layer multiplexes many requests as streams over one TCP connection and compresses headers
    with HPACK. This removes HTTP-level head-of-line blocking, though TCP-level blocking remains.'
  topic: network
  tags:
  - http
  - http2
  - performance
  explanation: '## In plain words

    HTTP/1.1 is like a single-lane shop counter: one customer is served at a time per connection, so browsers
    open several connections to go faster. HTTP/2 lets many customers be served at the same counter at
    once by chopping each order into small labelled pieces and interleaving them.


    ## How it works

    - **Binary framing**: messages are split into frames (HEADERS, DATA and others), each tagged with
    a stream ID.

    - **Multiplexing**: many requests and responses share one TCP connection at the same time; a slow
    response no longer blocks the others at the HTTP layer.

    - **Header compression (HPACK)**: repeated headers such as cookies are sent once and then referenced,
    which saves a lot of bytes.

    - **Flow control** per stream. The original stream-priority tree was deprecated in RFC 9113 (2022)
    because few servers implemented it well; the simpler `Priority` header (RFC 9218) replaces it.

    - **Server push** existed but browsers have largely removed support; `103 Early Hints` is used instead.

    - In practice, browsers only use HTTP/2 over TLS (negotiated with ALPN).

    - **Limit**: everything still rides one TCP connection, so one lost packet stalls every stream until
    it is resent (TCP head-of-line blocking).


    ## Example

    A page needs 60 small files. Over HTTP/1.1 the browser opens about 6 connections per host and queues
    the rest. Over HTTP/2 it sends all 60 requests at once on one connection, and responses arrive interleaved.
    Tricks such as domain sharding and huge bundles become less useful.


    ## Common mistakes

    - Saying HTTP/2 changes the API or status codes; the semantics are the same.

    - Claiming it solves all head-of-line blocking; TCP still has it.

    - Keeping HTTP/1.1 workarounds such as domain sharding, which hurt HTTP/2.


    ## In the interview

    Lead with multiplexing, binary frames and HPACK, then mention the TCP head-of-line limit, which leads
    naturally to HTTP/3 and QUIC. Mention that you would measure with real-user metrics before and after,
    since gains depend on the page.

    '
