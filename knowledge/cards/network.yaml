- id: kb-d2e73bb5a4ba
  question: What is HTTP (Hypertext Transfer Protocol)?
  answer: HTTP is the stateless request-response protocol of the web. A client sends a request with a
    method, a path, headers and an optional body; the server answers with a status code, headers and a
    body. It runs over TCP (HTTP/1.1 and HTTP/2) or QUIC (HTTP/3), usually inside TLS as HTTPS.
  topic: network
  tags:
  - http
  - web
  - networking
  explanation: '## In plain words

    HTTP is the language browsers and servers use to talk. The browser asks for something ("give me this
    page"), and the server answers with a status and the content. Each request stands alone: the server
    does not remember earlier ones unless you add something like a cookie.


    ## How it works

    - **Request**: method (`GET`, `POST`, `PUT`, `PATCH`, `DELETE`), target path, headers (`Host`, `Accept`,
    `Authorization`, `Cookie`), optional body.

    - **Response**: status code, headers (`Content-Type`, `Cache-Control`, `Set-Cookie`), body.

    - **Status classes**: 1xx informational, 2xx success, 3xx redirect, 4xx client error, 5xx server error.

    - **Method semantics**: `GET` is safe (no side effects) and idempotent; `PUT` and `DELETE` are idempotent;
    `POST` is neither.

    - **Statelessness**: state comes from cookies, tokens or the URL.

    - **Versions**: HTTP/1.1 is text over TCP with keep-alive; HTTP/2 multiplexes binary frames over one
    connection; HTTP/3 runs over QUIC on UDP.


    ## Example

    ```http

    GET /api/users/42 HTTP/1.1

    Host: example.com

    Accept: application/json


    HTTP/1.1 200 OK

    Content-Type: application/json

    Cache-Control: max-age=60


    {"id": 42, "name": "Ada"}

    ```


    ## Common mistakes

    - Using `GET` for actions that change data.

    - Returning 200 with an error message in the body instead of a proper 4xx or 5xx.

    - Confusing 401 (not authenticated) with 403 (authenticated but not allowed).

    - Calling HTTP and HTTPS different protocols; HTTPS is HTTP inside TLS.


    ## In the interview

    Cover the request and response shape, methods, status codes and statelessness. Follow-ups: idempotency
    and retries, caching headers, how cookies add state, and the differences between HTTP/1.1, HTTP/2
    and HTTP/3.

    '
