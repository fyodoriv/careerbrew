- id: kb-53fc647327ba
  question: What are examples of multipart MIME types?
  answer: Multipart MIME types carry several parts, each with its own headers, in one body separated by
    a boundary string. Common ones are multipart/form-data for HTML form uploads, multipart/mixed and
    multipart/alternative for email, and multipart/byteranges for HTTP range responses.
  topic: network
  tags:
  - http
  - mime
  - file-upload
  explanation: "## In plain words\nA MIME type (also called a media type) labels what kind of data a body\
    \ holds, such as `text/html` or `image/png`. A multipart type is like an envelope holding several\
    \ letters: one message contains several separate parts, each with its own type.\n\n## How it works\n\
    - The `Content-Type` header names the subtype and a `boundary` parameter, a random string that never\
    \ appears in the data.\n- Each part starts with `--boundary`, then its own headers, a blank line,\
    \ and its content. The body ends with `--boundary--`.\n- Common subtypes:\n  - `multipart/form-data`:\
    \ a form with fields and file uploads.\n  - `multipart/mixed`: an email with attachments of different\
    \ types.\n  - `multipart/alternative`: the same content in several formats (plain text and HTML);\
    \ the client shows the best one it supports.\n  - `multipart/related`: parts that belong together,\
    \ such as HTML plus its inline images.\n  - `multipart/byteranges`: a server answering a request for\
    \ several byte ranges of a file.\n\n## Example\n```http\nPOST /upload HTTP/1.1\nContent-Type: multipart/form-data;\
    \ boundary=XyZ\n\n--XyZ\nContent-Disposition: form-data; name=\"title\"\n\nHoliday\n--XyZ\nContent-Disposition:\
    \ form-data; name=\"photo\"; filename=\"a.png\"\nContent-Type: image/png\n\n<binary bytes>\n--XyZ--\n\
    ```\n\n## Common mistakes\n- Setting the `Content-Type` header by hand in `fetch` when sending `FormData`;\
    \ the browser must add the boundary itself.\n- Using `application/x-www-form-urlencoded` for file\
    \ uploads; it cannot carry binary files efficiently.\n- Forgetting the closing `--boundary--` when\
    \ building a body manually.\n\n## In the interview\nName `multipart/form-data` first, since it is\
    \ what web developers meet most, then the email types. Follow-ups: how to stream large uploads on\
    \ the server (parse parts as a stream, not into memory), size limits, and validating the declared\
    \ type of an uploaded file instead of trusting it.\n"
