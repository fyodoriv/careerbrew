- id: kb-0ea2fe8f38fb
  question: What is Nginx?
  answer: Nginx is an open-source, event-driven web server commonly used as a reverse proxy, load balancer,
    TLS terminator and static file server. A small number of worker processes handle many thousands of
    connections with non-blocking I/O.
  topic: network
  tags:
  - nginx
  - web-server
  - reverse-proxy
  explanation: "## In plain words\nNginx is the front door many websites put in front of their applications.\
    \ It hands out static files itself, and passes other requests to the right backend, much like a receptionist\
    \ who answers easy questions and routes the rest.\n\n## How it works\n- **Architecture**: one master\
    \ process and a few worker processes (often one per CPU core). Each worker runs an event loop over\
    \ non-blocking sockets, so it can juggle many connections without a thread per connection.\n- **Common\
    \ roles**:\n  - Serving static files fast.\n  - Reverse proxying to app servers (`proxy_pass`).\n\
    \  - Load balancing across upstreams (round robin, least connections, IP hash).\n  - Terminating TLS\
    \ and HTTP/2.\n  - Caching responses, compressing, rate limiting, rewriting URLs.\n- **Configuration**\
    \ is declarative: `http`, `server` and `location` blocks. `nginx -t` checks it and `nginx -s reload`\
    \ applies it without dropping connections.\n\n## Example\n```nginx\nupstream app { server 10.0.0.11:8443;\
    \ server 10.0.0.12:8443; }\nserver {\n  listen 443 ssl;\n  server_name example.com;\n  location /static/\
    \ { root /var/www; }\n  location / {\n    proxy_pass https://app;   # re-encrypts traffic to the backends\n\
    \    proxy_set_header Host $host;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \  }\n}\n```\n\n## Common mistakes\n- Forgetting to pass `Host` and `X-Forwarded-For`, so the app\
