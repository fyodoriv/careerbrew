- id: kb-08be7c74d599
  question: What is edge computing?
  answer: Edge computing runs code and stores data close to where users or devices are, such as CDN points
    of presence or on-site gateways, instead of only in a central data centre. It lowers latency and bandwidth
    use, at the cost of a more distributed, more constrained environment.
  topic: network
  tags:
  - edge
  - cdn
  - latency
  - architecture
  explanation: '## In plain words

    Instead of sending every question to a head office far away, you put a small, capable branch office
    in every city. Simple questions get answered locally and quickly; only hard ones go to the head office.


    ## How it works

    - **Where the edge is.** CDN PoPs (edge functions or workers), telecom base stations, factory gateways,
    or the devices themselves.

    - **What runs there.** Request routing, authentication checks, A/B test assignment, personalisation,
    image resizing, caching API responses, filtering IoT sensor data before upload.

    - **Why.** Fewer long round trips mean lower latency; less raw data shipped to the cloud saves bandwidth;
    local processing can keep working when the link is down and keep data in a region.

    - **Limits.** Small CPU and memory budgets, short execution times, limited or eventually consistent
    storage, and harder debugging across many locations.


    ## Example

    An online shop runs an edge function that reads the user''s country from the request and redirects
    to the right locale, and checks a signed session cookie before the request goes further. A user in
    Sydney gets the redirect in about 15 ms from a local PoP instead of about 250 ms from a server in
    the US.


    ## Common mistakes

    - Moving logic that needs strongly consistent data (like stock counts) to the edge without a plan
    for consistency.

    - Treating the edge as a full server; runtime and API limits are real.

    - Calling it a replacement for the cloud; it complements central services.


    ## In the interview

    Define it with a concrete example and a latency number. Name the trade-offs: speed and resilience
    versus consistency, observability and deployment complexity. Good follow-ups: what you would keep
    central (writes, transactions), and how you would roll out and monitor code across hundreds of locations.

    '
