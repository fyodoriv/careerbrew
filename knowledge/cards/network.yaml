- id: kb-7aa8c12d2351
  question: What is latency, and how can you reduce it?
  answer: Latency is the delay for data to get from one point to another, often measured as round-trip
    time. It comes from distance, routing hops, queuing and processing. Reduce it by moving content closer
    (CDN, edge, regions), cutting round trips (connection reuse, HTTP/2 or HTTP/3, TLS 1.3, fewer requests),
    caching and speeding up server work.
  topic: network
  tags:
  - latency
  - performance
  - networking
  explanation: "## In plain words\nLatency is how long you wait between asking and starting to get an\
    \ answer. Even with a wide pipe, if the other end is far away, each question takes time to cross the\
    \ distance. Light in fibre covers about 200 km per millisecond, so physics sets a floor.\n\n## How\
    \ it works\n- **Sources**: propagation (distance), transmission (pushing bits on the wire), queuing\
    \ in routers, and processing on servers.\n- **Round trips add up**: DNS lookup, TCP handshake, TLS\
    \ handshake and the request itself can be four round trips before the first byte.\n- **Ways to reduce\
    \ it**:\n  - Move closer: CDNs, edge functions, servers in more regions.\n  - Fewer round trips: keep\
    \ connections alive, HTTP/2 or HTTP/3, TLS 1.3, `preconnect` and `dns-prefetch` hints.\n  - Fewer\
    \ requests: bundle critical resources, inline small ones, avoid chains of dependent calls.\n  - Cache\
    \ at every layer: browser, CDN, application, database.\n  - Faster servers: better queries, indexes,\
    \ async work moved off the request path.\n- Measure percentiles (p50, p95, p99), not just averages.\n\
    \n## Example\nA user is 100 ms round trip from the server. Cold HTTPS fetch: DNS (1 RTT) + TCP (1)\
    \ + TLS 1.2 (2) + request (1) = 500 ms. With a CDN 10 ms away, TLS 1.3, and a cached DNS answer: 3\
    \ × 10 = 30 ms.\n\n## Common mistakes\n- Fixing bandwidth when the problem is round trips.\n- Reporting\
    \ only averages and hiding a painful p99.\n- Forgetting dependent request chains (waterfalls) in the\
    \ front end.\n\n## In the interview\nBreak latency into its sources and show how you would find the\
    \ biggest one (browser waterfall, tracing). Then propose fixes with trade-offs: caching versus freshness,\
    \ more regions versus consistency and cost.\n"
