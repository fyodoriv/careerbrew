- id: kb-8c47082fa7c0
  question: What is a hot spot in load balancing?
  answer: A hot spot is a server, shard or partition that receives far more load than the others, often
    because of a popular key, skewed hashing, or sticky sessions. It becomes the bottleneck even when
    the overall system has spare capacity.
  topic: network
  tags:
  - load-balancing
  - scalability
  - system-design
  explanation: "## In plain words\nImagine a supermarket with ten tills where everyone queues at till\
    \ three because it is near the entrance. The shop has plenty of capacity, but one till is overwhelmed.\
    \ That till is a hot spot.\n\n## How it works\n- **Causes**:\n  - Skewed data: one key (a celebrity\
    \ account, a viral product) gets most of the traffic.\n  - Poor partitioning: sharding by time or\
    \ by a low-cardinality field puts all new writes in one place.\n  - Sticky sessions or long-lived\
    \ connections that pile up on one server.\n  - Naive hashing (`hash % N`) that remaps badly when servers\
    \ change.\n- **Fixes**:\n  - Better balancing: least-connections, or \"power of two choices\" (pick\
    \ two random servers, use the less busy).\n  - Consistent hashing with virtual nodes for smoother\
    \ spread.\n  - Split hot keys: add a random suffix to spread writes, or replicate hot reads.\n  -\
    \ Cache popular items in front of the store.\n  - Rate limit or queue requests for a single key.\n\
    \n## Example\nA key-value store is sharded by user ID. A celebrity with 50 million followers lives\
    \ on shard 7, which reaches 95% CPU while the others sit at 20%. Caching the celebrity's profile at\
    \ the edge and keeping read replicas for that shard bring shard 7 down to normal load.\n\n## Common\
    \ mistakes\n- Looking only at average utilisation and missing a hot shard.\n- Using a sequential or\
    \ time-based key as a partition key.\n- Adding more servers, which does not help if one key is the\
    \ problem.\n\n## In the interview\nDefine it, give a cause, then offer several mitigations with trade-offs\
    \ (key splitting complicates reads; replication adds consistency questions). Interviewers like hearing\
    \ that you would detect it with per-node and per-key metrics, not just averages.\n"
