- id: kb-5acb1349ad6d
  question: What is a CDN (content delivery network)?
  answer: A CDN is a network of servers spread around the world that caches content close to users. Requests
    go to a nearby edge server, which serves cached files or fetches them from the origin, reducing latency,
    origin load and the impact of traffic spikes.
  topic: network
  tags:
  - cdn
  - caching
  - performance
  - networking
  explanation: '## In plain words

    Instead of every customer driving to one central warehouse, a CDN puts small shops in every town.
    Users get files from the shop nearest to them, so pages load faster and the warehouse (your origin
    server) is not overwhelmed.


    ## How it works

    - The CDN runs many points of presence (PoPs). DNS or anycast routes each user to a nearby one.

    - On a request, the edge checks its cache. A hit is served immediately; a miss is fetched from the
    origin, stored and returned.

    - Cache behaviour is controlled by headers such as `Cache-Control` and `ETag`, and by CDN rules. Files
    are often given long lifetimes with versioned names (`app.3f9a.js`).

    - Extra features: TLS termination near the user, compression, HTTP/2 and HTTP/3, image resizing, protection
    against DDoS attacks, and running small functions at the edge.

    - Content can be removed early with a purge or invalidation.


    ## Example

    A user in Tokyo loads `https://cdn.example.com/app.3f9a.js`. The Tokyo PoP has it cached, so the response
    takes about 20 ms instead of about 150 ms from an origin in Europe. The response carries:

    ```http

    Cache-Control: public, max-age=31536000, immutable

    ```


    ## Common mistakes

    - Caching personalised responses (for example, pages with a session cookie) and showing one user''s
    data to another.

    - Not versioning file names, then fighting stale caches after a deploy.

    - Thinking a CDN only helps static files; it also speeds up TLS setup and can cache some API responses.

    - Ignoring the cost of a low cache-hit ratio.


    ## In the interview

    Explain hit versus miss, cache keys and invalidation. Mention metrics such as cache-hit ratio and
    origin offload. Trade-offs: freshness versus speed, cost, vendor lock-in, and debugging through an
    extra layer. A common follow-up asks how you would cache an API safely: short TTLs, `Vary` headers
    and never caching per-user data in a shared cache.

    '
