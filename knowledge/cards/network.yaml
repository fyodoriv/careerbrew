- id: kb-74ce2414b546
  question: What is bandwidth, and how can you improve it?
  answer: Bandwidth is the maximum rate a link can carry data, measured in bits per second; throughput
    is the rate you actually achieve. To get more, upgrade or add links, and to need less, compress, cache,
    use efficient formats and send only the data you need.
  topic: network
  tags:
  - bandwidth
  - performance
  - networking
  explanation: "## In plain words\nBandwidth is the width of a pipe: how much water can flow through it\
    \ each second. A wider pipe moves more water at once, but it does not make any single drop arrive\
    \ sooner; that is latency.\n\n## How it works\n- **Units**: bits per second (Mbps, Gbps). File sizes\
    \ are usually in bytes, so divide by 8.\n- **Throughput** is what you really get, limited by the slowest\
    \ link, congestion, protocol overhead and TCP window size versus round-trip time (the bandwidth-delay\
    \ product).\n- **Increase capacity**: faster plans or links, more links bonded together, a CDN to\
    \ spread delivery, servers closer to users.\n- **Reduce demand**:\n  - Compress text with gzip or\
    \ Brotli.\n  - Use efficient media: WebP or AVIF images, right-sized images, modern video codecs.\n\
    \  - Cache with HTTP headers and CDNs, so repeat data is not sent.\n  - Send less: pagination, field\
    \ selection, deltas instead of full payloads.\n- **Prioritise**: quality of service rules and traffic\
    \ shaping keep important traffic flowing.\n\n## Example\nA 5 MB page over a 10 Mbps link takes about\
    \ 5 × 8 / 10 = 4 seconds of transfer. Converting images to AVIF and compressing scripts brings it\
    \ to 1.5 MB, about 1.2 seconds, without touching the network.\n\n## Common mistakes\n- Mixing up bits\
    \ and bytes.\n- Treating bandwidth and latency as the same thing.\n- Buying a faster link when the\
    \ bottleneck is TCP windowing or a slow server.\n\n## In the interview\nDefine bandwidth versus throughput,\
    \ then split improvements into \"more capacity\" and \"less data\". Show you would measure first (where\
    \ the bottleneck really is) and mention that for small web requests, latency usually matters more\
    \ than bandwidth.\n"
