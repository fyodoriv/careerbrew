- id: kb-5de2a63a8205
  question: What is the difference between bandwidth and latency?
  answer: Bandwidth is how much data a link can carry per second; latency is how long one piece of data
    takes to travel. Bandwidth matters for large transfers, while latency dominates for small, chatty
    requests. Raising one does not fix the other.
  topic: network
  tags:
  - bandwidth
  - latency
  - performance
  explanation: '## In plain words

    Picture a motorway. Bandwidth is the number of lanes: how many cars can pass per minute. Latency is
    how long one car takes to drive from one city to the other. Adding lanes does not shorten the trip,
    and a shorter road does not let more cars through at once.


    ## How it works

    - **Bandwidth**: capacity in bits per second. Limits how fast large files stream.

    - **Latency**: delay in milliseconds, often measured as round-trip time (RTT). Limited by distance,
    routing and queuing.

    - **Transfer time ≈ latency × round trips + size / bandwidth.** For a small API call, the first part
    dominates; for a large video, the second does.

    - **They interact**: TCP needs about bandwidth × RTT of data in flight to fill a link (the bandwidth-delay
    product), so high latency can stop you from using all your bandwidth.

    - **Fixes differ**: bandwidth through compression, caching and bigger links; latency through proximity
    (CDN), fewer round trips, and connection reuse.


    ## Example

    Two links: A is 1 Gbps with 150 ms RTT (intercontinental), B is 50 Mbps with 10 ms RTT (fibre). A
    web page with 30 small dependent requests loads much faster on B. Downloading a 10 GB file is faster
    on A.


    ## Common mistakes

    - Using the words interchangeably ("my internet is slow").

    - Assuming more bandwidth speeds up page loads that are bound by round trips.

    - Forgetting jitter (variation in latency), which matters for calls and games.


    ## In the interview

    Use the motorway analogy and the formula, then give a case where each one dominates. Interviewers
    like the bandwidth-delay product and a concrete web example such as reducing round trips with HTTP/2
    or a CDN.

    '
