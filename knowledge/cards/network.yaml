- id: kb-ac9dbc43f049
  question: What is a reverse proxy?
  answer: A reverse proxy sits in front of servers and receives client requests on their behalf, then
    forwards them to a backend. Clients see only the proxy. It is used for load balancing, TLS termination,
    caching, compression, security filtering and hiding the internal layout.
  topic: network
  tags:
  - proxy
  - load-balancing
  - networking
  explanation: "## In plain words\nA reverse proxy is the receptionist of a company: visitors talk to\
    \ the front desk, which decides which employee should handle each request. Visitors never need to\
    \ know who sits where. It works for the servers, while a forward proxy works for the clients.\n\n\
    ## How it works\n- DNS for `example.com` points at the proxy.\n- The proxy accepts the connection,\
    \ often terminates TLS, inspects the request, and picks a backend by path, host header or load-balancing\
    \ rule.\n- It forwards the request, adding headers such as `X-Forwarded-For` and `X-Forwarded-Proto`\
    \ so the backend knows the real client.\n- It can also cache responses, compress them, enforce rate\
    \ limits, run a web application firewall, and retry or fail over when a backend is unhealthy.\n- Examples:\
    \ Nginx, HAProxy, Envoy, Traefik, cloud load balancers and CDNs.\n\n## Example\n```text\nclient --HTTPS-->\
    \ proxy (example.com)\n                    |-- /api/*    -> api-1, api-2 (round robin)\n         \
    \           |-- /static/* -> served from cache\n                    '-- /         -> web-1\n```\n\
    Deploying a new version: drain `api-1`, update it, add it back, then repeat for `api-2`, with no downtime\
    \ visible to users.\n\n## Common mistakes\n- Confusing it with a forward proxy.\n- Trusting `X-Forwarded-For`\
    \ from any source; only trust it when set by your own proxy.\n- Making the proxy a single point of\
    \ failure with no redundancy.\n\n## In the interview\nContrast it with a forward proxy, then list\
    \ its jobs. Follow-ups: layer 4 versus layer 7 load balancing, health checks, sticky sessions, and\
    \ the extra hop's latency and complexity. Mentioning how it enables zero-downtime deploys is a strong\
    \ signal.\n"
