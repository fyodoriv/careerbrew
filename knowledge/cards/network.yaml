- id: kb-1a338a47afcf
  question: What is an access control list (ACL)?
  answer: An ACL is a list of rules attached to a resource that says which subjects may do which actions
    on it. In networking, ACLs on routers, firewalls or cloud subnets allow or deny traffic by source,
    destination, port and protocol; in file systems they grant users or groups read, write or execute
    rights.
  topic: network
  tags:
  - security
  - networking
  - authorization
  explanation: '## In plain words

    An ACL is a guest list at the door. Each line says who is allowed (or refused) and what they may do.
    The door checks every visitor against the list before letting them in.


    ## How it works

    - Each entry has a subject (user, group, IP range), an action or permission, and a decision (allow
    or deny).

    - **Network ACLs** match packets on fields such as source IP, destination IP, protocol and port. Rules
    are usually evaluated in order, and the first match wins; an implicit "deny all" often sits at the
    end.

    - **Stateless vs stateful.** A stateless ACL (for example, a cloud subnet network ACL) needs rules
    for both directions, including return traffic. A stateful firewall or security group remembers connections
    and allows replies automatically.

    - **File and object ACLs** list users or groups with permissions such as read and write.

    - ACLs answer "who can access this resource"; role-based access control groups permissions by role
    instead of listing people one by one.


    ## Example

    A router ACL that lets only the office network reach SSH:

    ```text

    10 permit tcp 10.0.0.0/24 any eq 22

    20 deny   tcp any any eq 22

    30 permit ip any any

    ```

    Rule order matters: if rule 30 came first, rule 20 would never be reached.


    ## Common mistakes

    - Wrong rule order, so a broad allow shadows a specific deny.

    - Forgetting return traffic on stateless ACLs.

    - Relying on ACLs alone instead of combining them with authentication.

    - Letting lists grow without review until nobody knows why a rule exists.


    ## In the interview

    Define it, then give one network and one file-system example. Mention first-match ordering, implicit
    deny, and stateless versus stateful filtering. Trade-off to raise: ACLs are simple and precise, but
    they get hard to manage at scale, which is why roles or policies are often layered on top.

    '
