- id: kb-92841c6b9fef
  question: How do you build trust with your team and peers?
  answer: 'Trust grows from consistency over time: keep promises, be honest including about bad news,
    show you care about people''s interests, admit your mistakes, and protect confidences. Competence
    matters, but reliability and care matter more.'
  topic: leadership
  tags:
  - trust
  - relationships
  - psychological-safety
  - leadership
  explanation: '## In plain words

    Trust is the belief that someone will act in your interest even when you are not watching. It is built
    in small deposits (kept promises, honest answers) and lost quickly by one betrayal.


    ## How it works

    - **Reliability**: do what you said, when you said; if you cannot, say so early.

    - **Candour**: share context and bad news openly; do not spin.

    - **Care**: know people''s goals and situations; defend them when they are absent.

    - **Vulnerability**: admit mistakes and say "I don''t know".

    - **Confidentiality**: never repeat what was shared privately.

    - **Fairness**: apply the same rules to everyone.

    A common model is trust = (credibility + reliability + intimacy) / self-orientation: the more it looks
    like you serve yourself, the less people trust you.


    ## Example

    Fictional sample answer: "When budget cuts were rumoured, I told my team what I knew and what I didn''t,
    and promised to tell them within a day of any decision. Two weeks later I did, before the all-hands.
    Later, one engineer said that was why she believed me during the next reorg."


    ## Common mistakes

    - Trying to earn trust with words or team events instead of actions.

    - Hiding bad news to "protect" the team.

    - Taking credit and sharing blame downward.

    - Being friendly but unreliable.


    ## In the interview

    Interviewers score concrete behaviours, not slogans. Name a model, give a story where trust was tested,
    and explain how you repair it after a mistake (own it, fix it, change behaviour). Mention psychological
    safety: people speak up when they trust it is safe.

    '
