- id: kb-0628ef23ca21
  question: How do you organize people in a large engineering group?
  answer: Split the group into small, long-lived, cross-functional teams of about five to nine people,
    each owning a clear domain or product area with minimal dependencies. Group teams into areas with
    shared leadership, add platform support for common needs, and align the structure with the architecture.
  topic: leadership
  tags:
  - org-design
  - team-size
  - conways-law
  - scaling
  explanation: '## In plain words

    Large groups slow down because communication paths grow quickly with each person. The fix is small
    teams with clear ownership and few dependencies, grouped so related teams coordinate easily.


    ## How it works

    - **Team size**: five to nine people; communication paths grow as n(n-1)/2, so 9 people have 36.

    - **Ownership**: each team owns a domain, user journey, or service end to end.

    - **Conway''s law**: system design mirrors team communication; design teams around the architecture
    you want.

    - **Grouping**: related teams form an area or tribe with a shared leader and planning.

    - **Shared needs**: platform teams provide tooling as a service.

    - **Coordination**: architecture forums, written RFCs, and a shared roadmap.

    - **Management spans**: about five to eight reports per manager.


    ## Example

    Fictional reorganisation: one 30-person team where everyone touched everything becomes four teams
    (search, listings, payments, platform) of six to eight people, each with a tech lead, a PM, and clear
    service ownership. Cross-team work goes through short RFCs.


    ## Common mistakes

    - Organising by technical layer (frontend, backend, database), which forces handoffs.

    - Reorganising often, which destroys team stability.

    - Ignoring how the architecture will need to change.

    - Giant spans of control for managers.


    ## In the interview

    Scored signals: understanding of team size, ownership, and Conway''s law. Mention Team Topologies.
    Expect "how do you handle a shared component that many teams change?"

    '
