    events.
  topic: leadership
  tags:
  - ddd
  - architecture
  - bounded-context
  - modeling
  explanation: "## In plain words\nDDD, from Eric Evans's 2003 book, says the hardest part of software\
    \ is understanding the business. So developers and domain experts build a shared model and language,\
    \ and the code mirrors it.\n\n## How it works\n**Strategic design**\n- **Ubiquitous language**: the\
    \ same terms in conversations, docs, and code.\n- **Bounded context**: a boundary inside which a model\
    \ and its terms have one meaning (\"customer\" in billing differs from \"customer\" in support).\n\
    - **Context map**: how contexts relate (shared kernel, customer-supplier, anti-corruption layer).\n\
    - **Subdomains**: core (your advantage), supporting, generic.\n**Tactical design**\n- **Entity**:\
    \ has identity over time (Order #42).\n- **Value object**: defined by its values, immutable (Money\
    \ 10 EUR).\n- **Aggregate**: a cluster changed together through one root that enforces rules.\n- **Repository**:\
    \ loads and saves aggregates.\n- **Domain event**: something that happened (\"OrderPaid\").\n\n##\
    \ Example\n```python\nfrom dataclasses import dataclass, field\n\n@dataclass(frozen=True)\nclass Money:\
    \  # value object\n    amount: int\n    currency: str\n\n@dataclass\nclass Order:  # aggregate root\n\
    \    id: int\n    lines: list = field(default_factory=list)\n    paid: bool = False\n\n    def add_line(self,\
    \ price: Money):\n        if self.paid:\n            raise ValueError(\"cannot change a paid order\"\
    )\n        self.lines.append(price)\n\no = Order(1)\no.add_line(Money(500, \"EUR\"))\nprint(len(o.lines))\
    \  # 1\n```\n\n## Common mistakes\n- Applying all tactical patterns to simple CRUD apps.\n- Ignoring\
    \ the strategic part, which matters most.\n- One giant shared model for the whole company.\n- Designing\
    \ without talking to domain experts.\n\n## In the interview\nExplain bounded contexts first, then\
    \ a few tactical terms. Leaders often link DDD to team boundaries and microservices: one team per\
    \ bounded context. Expect \"when is DDD overkill?\" (simple domains with little business logic).\n"
