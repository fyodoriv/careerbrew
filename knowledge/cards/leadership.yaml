- id: kb-eb3fc8fc9b06
  question: How do you set goals for an engineering team?
  answer: Derive goals from company strategy and user needs, involve the team in setting them, and express
    them as a small number of measurable outcomes with clear owners, often as OKRs. Balance product goals
    with reliability and tech health, and review progress regularly.
  topic: leadership
  tags:
  - goals
  - okrs
  - planning
  - alignment
  explanation: '## In plain words

    Good team goals connect daily work to what the company needs, are few enough to focus on, and are
    measurable so everyone knows if they are winning.


    ## How it works

    - **Inputs**: company strategy, product roadmap, user and system data, team''s own ideas.

    - **Draft together**: the team proposes; the leader aligns with stakeholders.

    - **Form**: outcomes with metrics (SMART: specific, measurable, achievable, relevant, time-bound,
    or OKRs).

    - **Balance**: product impact, reliability, developer productivity, people growth.

    - **Few**: two or three per quarter.

    - **Owners and milestones** for each goal.

    - **Review**: weekly or biweekly check, quarter-end retro.


    ## Example

    Fictional quarter goals for a payments team:

    - Increase successful first-try payments from 92% to 95%.

    - Reach 99.9% availability for the payment API (SLO).

    - Cut time to add a payment method from 6 weeks to 3 by improving the integration layer.


    ## Common mistakes

    - Goals that are just a feature list.

    - Setting goals without the team.

    - Ignoring reliability and debt until they become crises.

    - Too many goals.


    ## In the interview

    Scored signals: alignment, outcome orientation, and involvement of the team. Mention OKRs or SMART.
    Expect "how do you handle a goal that becomes irrelevant mid-quarter?" (change it openly).

