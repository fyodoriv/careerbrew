- id: kb-729dbe5d75d1
  question: How do you handle a team member who is not a team player?
  answer: 'First understand why: unclear expectations, frustration, personal issues, or incentives that
    reward solo work. Then give specific, behaviour-based feedback with its impact, agree on expectations,
    support the change, and escalate to formal performance management if it continues.'
  topic: leadership
  tags:
  - collaboration
  - feedback
  - behavior
  - performance
  explanation: '## In plain words

    "Not a team player" is a label, not a fact. Your job is to turn it into specific behaviours, find
    the cause, and make clear that collaboration is part of the job, not optional.


    ## How it works

    - Gather specifics: what happened, when, and the impact (for example, skipping reviews, hoarding knowledge,
    dismissing others).

    - Talk privately and ask questions before judging.

    - Give feedback with a model like SBI: Situation, Behaviour, Impact.

    - Agree on concrete expectations and how you will check progress.

    - Check the system: do incentives or promotion criteria reward solo heroics?

    - If behaviour does not change, move to a formal plan; strong individual output does not excuse damaging
    the team.


    ## Example

    Fictional sample answer: "A strong engineer kept merging large changes without review. In a 1:1 I
    said: ''In the last two sprints, three big PRs were merged without review, and two caused incidents
    others had to fix.'' He said reviews were too slow. We agreed he would request reviews, and I set
    a 24-hour review norm for the team. Within a month the issue stopped."


    ## Common mistakes

    - Labelling the person instead of describing behaviour.

    - Ignoring it because they are productive.

    - Raising it in public.

    - Not checking whether the process causes the behaviour.


    ## In the interview

    Scored signals: curiosity before judgment, direct feedback, and willingness to escalate. Mention SBI
    and checking systemic causes. Expect "what if they are your top performer?" (answer: the team''s output
    matters more than one person''s).

    '
