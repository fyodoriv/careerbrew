  - hr
  explanation: '## In plain words

    Firing is the last step of performance management, not a sudden event. Done well, it protects the
    team''s standards and treats the departing person with dignity.


    ## How it works

    **Why**: a persistent low performer or a toxic behaviour drains the team, lowers the bar, and blocks
    better hires. Avoiding it is unfair to everyone else.

    **When**: after clear expectations, specific feedback, support, and a time-boxed improvement plan
    have not worked; immediately for serious misconduct (harassment, fraud, security breach).

    **How**:

    - Document feedback and agreed goals along the way.

    - Involve HR and legal early; follow local law.

    - Hold a short, private meeting: state the decision, do not debate it, explain logistics, be kind.

    - Plan access removal, handover, and the announcement.

    - Tell the team promptly, briefly, and without private details; then reassign work.


    ## Example

    Fictional outline: Month 1, specific feedback in 1:1s. Month 2, written plan with three measurable
