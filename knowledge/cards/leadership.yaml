  question: How should a leader help team members who are struggling, without taking over?
  answer: 'Ask what kind of help they want before acting: listening, advice, a decision, or removing a
    blocker. Default to questions that let them solve it, step in directly only when risk is high, and
    follow up so the help actually worked.'
  topic: leadership
  tags:
  - coaching
  - support
  - servant-leadership
  - management
  explanation: '## In plain words

    Good help builds capability; bad help creates dependence. Leaders often jump in and solve the problem,
    which feels kind but teaches the person to wait for rescue.


    ## How it works

    - **Notice**: watch for signs (missed updates, silence, long cycle times) and ask privately.

    - **Ask what help means**: "Do you want me to listen, give ideas, or unblock something?"

    - **Coach first**: open questions ("What have you tried? What options do you see?").

    - **Act when needed**: remove blockers only you can remove (access, priorities, other teams).

    - **Step in directly** for high risk: incidents, customer impact, someone''s well-being.

    - **Follow up**: did it help? What will they do next time?


    ## Example

    Fictional sample answer: "A new engineer had been stuck on a bug for two days. Instead of fixing it,
