    the director runs the crew that makes it.


    ## How it works

    **Engineering manager (EM)**

    - People: hiring, 1:1s, feedback, career growth, performance management.

    - Delivery: planning, estimates, process, removing blockers, cross-team dependencies.

    - Technical health: quality, reliability, on-call, tech debt balance (often with a tech lead).

