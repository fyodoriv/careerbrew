- id: kb-a5a06f5815d5
  question: How do you prevent burnout on your team?
  answer: Watch workload and warning signs, keep a sustainable pace by limiting work in progress and overtime,
    make on-call fair and humane, and protect focus time. Talk about well-being in 1:1s, model healthy
    behaviour, and fix systemic causes like constant urgency instead of only suggesting vacations.
  topic: leadership
  tags:
  - burnout
  - well-being
  - sustainable-pace
  - team-health
  explanation: '## In plain words

    Burnout is long-term exhaustion and detachment caused by chronic work stress. It is usually caused
    by the work system (overload, lack of control, unfairness), so the leader''s main lever is the system,
    not resilience tips.


    ## How it works

    - **Watch signals**: longer hours, cynicism, missed 1:1s, more mistakes, withdrawal.

    - **Control load**: plan to around 70 to 80 percent capacity; limit work in progress.

    - **Protect time**: meeting-free blocks; discourage after-hours messages.

    - **Fair on-call**: enough people in the rotation, time off after bad nights, fix noisy alerts.

    - **Autonomy and clarity**: unclear priorities and no control are major stressors.

    - **Model it**: take your own vacations; do not send midnight emails.

    - **Recover**: after a crunch, schedule real recovery time.


    ## Example

    Fictional sample answer: "After a big launch I noticed two engineers working weekends for a month.
    I moved one low-priority project to next quarter, cut alerting noise by half with the team, and gave
    both a week of recovery time. I also made ''how is your energy?'' a regular 1:1 question."


    ## Common mistakes

    - Treating burnout as a personal weakness.

    - Celebrating heroic overtime.

    - Crunch that never ends.

    - Offering wellness apps while keeping the overload.


    ## In the interview

    Scored signals: noticing early, fixing causes, and modelling. Mention sustainable pace and on-call
    health. Expect "what if leadership demands overtime for a deadline?" (time-box it, negotiate scope,
    plan recovery).

    '
