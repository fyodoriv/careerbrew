- id: kb-222ed9d40479
  question: How do you handle conflict or disagreement with a colleague or your manager?
  answer: Address it early and privately, separate the people from the problem, and understand the other
    side's goals before arguing yours. Use data and shared goals to decide, escalate together if needed,
    and once decided, commit fully even if you disagreed.
  topic: leadership
  tags:
  - conflict
  - disagreement
  - communication
  - behavioral
  explanation: '## In plain words

    Disagreement is healthy; unresolved conflict is not. A good answer shows you can disagree respectfully,
    find the shared goal, and move on without damage to the relationship.


    ## How it works

    - **Early and private**: talk directly instead of complaining to others.

    - **Understand first**: ask what they are optimising for; restate their view until they agree you
    got it.

    - **Shared goal**: find what you both want (users served, reliability).

    - **Options and data**: compare options on evidence, prototype if cheap.

    - **Decide**: agree who decides; escalate together as a joint question, not a complaint.

    - **Disagree and commit**: once decided, support the decision fully.

    - **Repair**: follow up on the relationship.

    Use STAR and end with what you learned.


    ## Example

    Fictional sample answer: "A peer lead wanted to rewrite a shared service; I wanted incremental fixes.
    In a 1:1 I asked about his concerns: the code was blocking his roadmap. We agreed the goal was to
    unblock his team in a quarter. We ran a two-week spike on both approaches. The incremental path met
    his need, and he led it. I learned to ask about the underlying need before defending my plan."


    ## Common mistakes

    - Telling a story where you were simply right and the other person wrong.

    - Avoiding conflict until it explodes.

    - Escalating before talking to the person.

    - Making it personal.


    ## In the interview

    Scored signals: empathy, maturity, focus on outcomes, and ability to commit. For conflict with a manager,
    show respect plus courage: you raised it clearly, then accepted the decision. Expect "what if you
    still think they were wrong?"

    '
