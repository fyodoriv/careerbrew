- id: kb-2d25b56ed9d6
  question: Tell me about a time you failed as a people manager.
  answer: Choose a real, meaningful failure that affected someone, own it without excuses, explain what
    you did to repair it, and show the specific change in your behaviour since then. Interviewers care
    most about self-awareness and learning.
  topic: leadership
  tags:
  - failure
  - self-awareness
  - behavioral
  - management
  explanation: '## In plain words

    Every manager fails sometimes. This question checks whether you can see your own mistakes, take responsibility,
    and improve, which is what makes people trust a leader.


    ## How it works

    Shape:

    - **Situation**: what happened, briefly.

    - **Your mistake**: be specific and own it.

    - **Impact**: on the person, team, or results.

    - **Repair**: what you did once you realised.

    - **Learning**: the concrete habit or rule you now follow, with evidence you follow it.

    Avoid fake failures like "I cared too much".


    ## Example

    Fictional sample answer: "I promoted a strong engineer into a tech lead role without checking whether
    he wanted to handle people topics. I assumed the move was a reward. Within months he was unhappy and
    his code work suffered. I talked with him, we agreed he would return to a senior engineer track, and
    I apologised for not asking. Since then, I discuss role expectations in detail and offer trial periods
    before role changes."


    ## Common mistakes

    - Choosing a trivial or disguised-strength failure.

    - Blaming others or circumstances.

    - No lasting change in behaviour.

    - Oversharing private details about the person.


    ## In the interview

    Scored signals: honesty, ownership, empathy, and growth. Expect "how did the person react?" and "how
    do you know you''ve really changed?" Keep the story short and leave time for the learning.

    '
