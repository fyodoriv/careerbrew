- id: kb-6d724132938a
  question: What are the four team types in Team Topologies, and when do you use each?
  answer: Team Topologies defines stream-aligned teams that deliver a flow of value, enabling teams that
    coach others, complicated-subsystem teams that own deep specialist parts, and platform teams that
    provide self-service internal products. The goal is to reduce cognitive load on stream-aligned teams.
  topic: leadership
  tags:
  - team-topologies
  - org-design
  - platform
  - cognitive-load
  explanation: '## In plain words

    Team Topologies is a book and model for organising software teams. It says most teams should deliver
    features end to end, and a few other team types exist only to make those teams faster. Like a restaurant:
    cooks serve dishes, and a few support roles keep the kitchen running.


    ## How it works

    - **Stream-aligned**: owns a flow of work for a product, user journey, or domain, from idea to production.
    Most teams should be this type.

    - **Enabling**: specialists who help stream-aligned teams learn a new skill (for example testing or
    security), then step away.

    - **Complicated-subsystem**: owns a part that needs rare expertise, such as a video codec or a pricing
    engine.

    - **Platform**: builds internal services offered as a self-service product (deploy pipelines, observability).

    - Three interaction modes connect them: collaboration, X-as-a-service, and facilitating.

    - The guiding idea is to limit each team''s cognitive load (how much it must know to do its work).


    ## Example

    A fictional shop with 40 engineers: four stream-aligned teams (search, checkout, catalogue, accounts),
    one platform team that runs CI and Kubernetes as a service, one complicated-subsystem team for fraud
    scoring, and a two-person enabling team that spends a quarter helping each team adopt contract testing.


    ## Common mistakes

    - Turning every shared component into a platform team, which creates handoffs.

    - Enabling teams that never leave and become a permanent dependency.

    - Ignoring Conway''s law: the team structure shapes the architecture.

    - Treating the model as a reorg checklist instead of a way to reduce load.


    ## In the interview

    Name the four types and the three interaction modes, then explain the goal: fast flow and low cognitive
    load. Interviewers like a concrete example of when you would create a platform team (several teams
    solving the same infra problem badly) and how you would measure that it helps (lead time, adoption).

    '
