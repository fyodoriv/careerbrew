- id: kb-f072229cb8f2
  question: How do you retain good people on your team?
  answer: People stay for growth, meaningful work, a good manager, fair pay, and a healthy team. Know
    each person's goals, give them growth and recognition, keep pay competitive, remove frustrations early,
    and hold regular "stay conversations" rather than waiting for exit interviews.
  topic: leadership
  tags:
  - retention
  - engagement
  - growth
  - management
  explanation: '## In plain words

    Most people who leave a job leave because of their manager, lack of growth, or unfairness. Retention
    is the result of many small things done well, long before anyone gets an offer elsewhere.


    ## How it works

    - **Stay conversations**: ask "What keeps you here? What might make you leave?"

    - **Growth**: clear career paths, stretch work, promotions when earned.

    - **Meaningful work**: connect work to impact; rotate people off stale projects.

    - **Recognition**: specific and timely.

    - **Fair pay**: check market data and internal equity; flag risks early.

    - **Environment**: good tooling, reasonable on-call, a respectful team.

    - **Flexibility**: hours and location where possible.

    - **Watch signals**: disengagement, fewer questions, long silences.


    ## Example

    Fictional sample answer: "A strong engineer seemed less engaged. In a stay conversation she said she
    felt stuck maintaining the same service. I moved her to lead a new project and found someone to grow
    into her old area. She stayed and later became a tech lead."


    ## Common mistakes

    - Relying on counter-offers, which often only delay departure.

    - Treating everyone the same.

    - Waiting for exit interviews to learn what went wrong.

    - Trying to retain everyone, including poor fits.


    ## In the interview

    Scored signals: proactive attention, individualised approach, and systemic thinking. Mention regretted
    versus non-regretted attrition. Expect "what do you do when someone tells you they have an offer?"

    '
