- id: kb-27f025be9f6d
  question: How do you build credibility with a team you inherited rather than built yourself?
  answer: 'Listen first: hold 1:1s, learn the history and the system, and avoid early big changes. Then
    earn trust with small, visible wins such as removing a real blocker, keep every promise, give credit,
    and explain decisions. Credibility comes from being useful and consistent, not from your title.'
  topic: leadership
  tags:
  - new-team
  - credibility
  - trust
  - onboarding
  explanation: '## In plain words

    An inherited team has its own history, loyalties, and maybe doubts about you. You cannot demand trust;
    you earn it by understanding them and then visibly making their work better.


    ## How it works

    - **First 30 days, listen**: 1:1s with everyone; ask what works, what hurts, what they would change.
    Read past decisions and incidents.

    - **Respect the past**: assume past choices had reasons.

    - **Quick wins**: fix one painful, visible problem the team named.

    - **Be consistent**: do what you say, communicate decisions and reasons, give credit publicly.

    - **Show competence**: understand the system enough to ask good questions; you do not need to be the
    best coder.

    - **Then change**: introduce bigger changes once you have context and allies.


    ## Example

    Fictional sample answer: "I took over a team whose previous manager was loved. I spent four weeks
    in 1:1s and reading the backlog. Everyone mentioned a release process that took a day. I got approval
    and two weeks to automate it with the team''s own design. Releases dropped to an hour. After that,
    people started bringing me problems instead of working around me."


    ## Common mistakes

    - Arriving with a reorg or new process in week one.

    - Criticising the previous manager or decisions.

    - Trying to prove yourself by being the strongest engineer.

    - Promising fixes you cannot deliver.


    ## In the interview

    Interviewers score humility, listening, and the ability to deliver. Mention a 30-60-90 day plan and
    how you know trust is growing (people raise problems early, disagree openly). Expect "what if a senior
    person wanted your job?"

    '
