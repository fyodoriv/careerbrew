- id: kb-b13ea0eef7c7
  question: How do you handle a toxic team member who is hurting the whole team?
  answer: 'Act quickly: collect specific examples, give direct private feedback on the behaviour and its
    impact, set clear expectations with a short deadline, and document. If it continues, start formal
    action with HR, because tolerating it signals the behaviour is acceptable and drives good people away.'
  topic: leadership
  tags:
  - toxic-behavior
  - feedback
  - culture
  - performance
  explanation: '## In plain words

    One person who belittles others or creates fear can lower the output of a whole team. Their individual
    skill rarely makes up for the damage, so leaders must treat it as a serious performance issue.


    ## How it works

    - **Gather facts**: specific incidents, dates, and impact; talk to affected people privately.

    - **Direct conversation**: use Situation-Behaviour-Impact; be clear the behaviour must stop.

    - **Expectations**: concrete behaviours and a short time frame; document the meeting.

    - **Protect the team**: support those affected; stop the person from controlling key decisions meanwhile.

    - **Follow up** often; praise real change.

    - **Escalate**: if it continues, a formal plan or termination with HR. Harassment or discrimination
    goes to HR immediately.


    ## Example

    Fictional sample answer: "A senior engineer mocked junior people in code reviews, and two of them
    stopped asking questions. I showed him three review comments and explained how they affected the team.
    He said he was ''just being direct''. I set a clear standard (critique code, not people) and reviewed
    his comments weekly. He improved within a month. Had he not, I was ready to start a formal process."


    ## Common mistakes

    - Waiting because the person is a high performer.

    - Vague feedback such as "be nicer".

    - Discussing it in front of the team.

    - Not checking on the people who were hurt.


    ## In the interview

    Scored signals: courage, speed, fairness, and care for the team. Mention that the worst behaviour
    you tolerate sets your culture. Expect "what if your manager wants to keep them?" (present the cost
    with evidence).

    '
