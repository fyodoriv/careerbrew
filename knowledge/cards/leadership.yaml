- id: kb-b074ad8b6d94
  question: How do you delegate effectively?
  answer: 'Delegate outcomes, not just tasks: explain the goal, context, constraints, and how much authority
    the person has, then agree check-ins and let them choose the approach. Match the level of support
    to their experience, accept that it will be done differently, and give credit.'
  topic: leadership
  tags:
  - delegation
  - empowerment
  - management
  - growth
  explanation: '## In plain words

    Delegating means handing someone the responsibility for a result, not only the work. Done well, it
    frees the leader and grows the team; done badly, it is either dumping or micromanaging.


    ## How it works

    - **Choose what**: delegate work that grows someone or that you should not be doing; keep only what
    only you can do.

    - **Choose who**: match to skill and growth goals.

    - **Explain**: the goal, why it matters, constraints, deadline, and what "done" looks like.

    - **Set authority level**: for example, "research and recommend", "decide and tell me", or "decide
    on your own".

    - **Agree check-ins**: more for new tasks, fewer for familiar ones.

    - **Support, don''t take back**: ask questions instead of giving answers; step in only when risk is
    high.

    - **Credit** the person publicly.


    ## Example

    Fictional sample answer: "I delegated our quarterly planning to a senior engineer. I shared the company
    goals and the capacity, said she could decide the plan within those limits, and we met twice. Her
    plan was different from mine but better on testing time. I presented it with her name on it."


    ## Common mistakes

    - Delegating only boring tasks.

    - Unclear authority, so the person keeps asking permission.

    - Taking the work back at the first problem.

    - Delegating without the context needed to succeed.


    ## In the interview

    Scored signals: clarity, trust, and growth mindset. Mention levels of delegation and how you handle
    a delegated task that is going wrong. Expect "what do you never delegate?" (performance conversations,
    hard decisions you own).

    '
