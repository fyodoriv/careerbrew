  - delivery
  - planning
  explanation: '## In plain words

    Estimates are forecasts, not promises, and they are always uncertain. Meeting deadlines is less about
    perfect estimates and more about seeing slippage early and making trade-offs on purpose.


    ## How it works

    - **Know which deadlines are real**: fixed dates (a contract, an event) versus internal targets.

    - **Decompose**: tasks of a few days are easier to estimate than months-long blobs.

    - **Estimate together**: the people doing the work estimate; use ranges.

    - **Buffer and risk**: list unknowns; spike the riskiest ones first.

    - **Track**: milestones and burn-up charts; review weekly.

    - **Early warning**: report "at risk" as soon as you see it, with options.

    - **Levers**: cut scope first, then move dates, add people last (adding people late often slows a
    project down, known as Brooks''s law).

    - **Retro**: compare estimates to actuals.


    ## Example

    Fictional plan: an eight-week project split into four two-week milestones, each with a demo. After
    milestone one, the team is a week behind. The lead tells stakeholders immediately and proposes dropping
    a reporting feature to a later release. The fixed date holds.


    ## Common mistakes

    - Treating an estimate as a commitment the team never agreed to.

    - Hiding slippage until the last week.

    - Cutting testing to hit the date.

    - Adding many people late.


    ## In the interview

    Scored signals: realism, early communication, and scope management. Mention ranges, milestones, and
    Brooks''s law. Expect "what do you do when leadership sets a date before any estimate?" (explain trade-offs,
    offer a smaller scope that fits).

