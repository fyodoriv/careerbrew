cards:
- id: kb-62b561edc282
  question: As a manager, how do you handle trade-offs?
  answer: 'Make trade-offs explicit: name the options, the cost of each against the goals, who decides,
    and how reversible the choice is. Decide quickly on reversible choices, carefully on irreversible
    ones, write the decision down, and revisit it when the facts change.'
  topic: leadership
  tags:
  - decision-making
  - trade-offs
  - prioritization
  - management
  explanation: '## In plain words

    Every manager trades scope, time, quality, and people''s energy against each other. Handling trade-offs
    well means making those costs visible and choosing on purpose, instead of letting the loudest request
    or the default win.


    ## How it works

    - Clarify the goal and the constraint that actually binds (date, budget, reliability target).

    - List two or three real options, with the cost and risk of each.

    - Ask how reversible the decision is: a "two-way door" can be decided fast, a "one-way door" deserves
    more data.

    - Involve the people who own the consequences and agree who makes the final call.

    - Write the decision and the reasoning down, and say what would make you revisit it.

    A strong answer follows STAR (situation, task, action, result) and ends with what you learned.


    ## Example

    Fictional sample answer: "We had a launch date tied to a marketing event and a growing list of bugs.
    I laid out three options for the product lead: slip two weeks, cut two features, or ship with known
    bugs behind a flag. We chose to cut features because the date was fixed and the bugs touched payments.
    We shipped on time, delivered the features three weeks later, and I learned to show these options
    a month earlier next time."


    ## Common mistakes

    - Pretending there is no trade-off and promising everything.

    - Quietly cutting quality (tests, on-call health) without telling anyone.

    - Deciding alone on things others must live with.

    - Never revisiting a decision once it is clearly wrong.


    ## In the interview

    Interviewers score clarity of reasoning, stakeholder communication, and ownership of the outcome.
    Mention a framework (reversibility, cost of delay, impact versus effort) but keep the story concrete.
    Expect follow-ups such as "what did you say no to?" and "how did the team feel about it?"

    '
