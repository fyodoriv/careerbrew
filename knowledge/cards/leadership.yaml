- id: kb-9225c3222fe7
  question: How should you measure developer productivity?
  answer: 'Measure team-level outcomes and flow, not individual output: delivery metrics such as DORA,
    quality, and developer experience surveys, framed by models like SPACE. Use metrics to find bottlenecks
    and improve the system, never to rank individuals by lines of code or tickets.'
  topic: leadership
  tags:
  - developer-productivity
  - dora
  - space
  - metrics
  explanation: '## In plain words

    Developer productivity is hard to measure because the work is creative and team-based. Simple counts
    (lines of code, commits) are easy to game and miss what matters, so leaders use several views together.


    ## How it works

    - **DORA metrics** (team delivery): deployment frequency, lead time for changes, change failure rate,
    time to restore service (DORA''s current reports also add deployment rework rate and call the last
    one failed deployment recovery time).

    - **SPACE framework**: Satisfaction and well-being, Performance (outcomes), Activity, Communication
    and collaboration, Efficiency and flow; pick metrics from several dimensions.

    - **Developer experience**: surveys on build times, review waits, interruptions, and tooling.

    - **Outcomes**: did shipped work move user or business goals?

    - **Use**: look at trends, find bottlenecks, run experiments; share data with the team.


    ## Example

    Fictional finding: surveys show developers lose hours waiting for CI; data confirms median build time
    of 25 minutes and lead time of 4 days. The team invests in test parallelisation. Build time drops
    to 8 minutes and lead time to 2 days, with satisfaction scores up.


    ## Common mistakes

    - Ranking individuals by commits or story points.

    - One metric as a target (Goodhart''s law).

    - Ignoring developer experience and burnout.

    - Comparing teams with different contexts.


    ## In the interview

    Scored signals: nuance, knowledge of DORA and SPACE, and focus on improving the system. Expect "how
    would you spot a low performer, then?" (through managers'' observation, peer feedback, and outcomes,
    not dashboards).

    '
