- id: kb-25d7bb539449
  question: How do you choose the right priorities for a team?
  answer: Start from the company and team goals, list candidate work, and compare it by impact, cost,
    risk, and urgency, for example with cost of delay or an impact-versus-effort view. Pick a few things,
    say no or later to the rest explicitly, and revisit priorities on a regular cadence.
  topic: leadership
  tags:
  - prioritization
  - planning
  - strategy
  - trade-offs
  explanation: '## In plain words

    Teams always have more ideas than capacity. Prioritising means choosing the few things that matter
    most for the goal, and being honest about what will not get done.


    ## How it works

    - **Anchor on goals**: what the company and team must achieve this quarter.

    - **Collect work**: features, bugs, tech debt, operational work.

    - **Estimate value and cost**: rough impact, effort, risk, and urgency.

    - **Use a simple model**: impact versus effort; RICE (Reach, Impact, Confidence, Effort); or cost
    of delay (how much value is lost per week of waiting).

    - **Reserve capacity** for unplanned work and tech health (often 20 to 30 percent).

    - **Decide and communicate**: a ranked list, with explicit "not now" items and reasons.

    - **Revisit** monthly or when facts change.


    ## Example

    Fictional RICE comparison:

    ```text

    Item             Reach  Impact Conf  Effort  Score

    Faster checkout  8000   2      0.8   4       3200

    Dark mode        3000   0.5    0.9   2        675

    Fix flaky CI     40     3      1.0   1        120 (but unblocks all work)

    ```

    The team picks checkout and the CI fix (a multiplier for every engineer), and defers dark mode.


    ## Common mistakes

    - Prioritising by who asks loudest.

    - Treating scoring models as exact truth.

    - No capacity left for maintenance.

    - Not telling stakeholders what was deprioritised.


    ## In the interview

    Scored signals: goal alignment, structured thinking, and communication. Mention a framework but explain
    you use judgment too. Expect "two executives want conflicting things, what do you do?" (make the trade-off
    visible and let the shared leader decide).

    '
