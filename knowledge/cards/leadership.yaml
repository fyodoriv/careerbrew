- id: kb-f293acca5804
  question: How do you run performance reviews and calibration?
  answer: Collect evidence through the period, write reviews against the role's published expectations
    with concrete examples, then calibrate with other managers to apply the same bar and reduce bias.
    Deliver the result with no surprises, clear reasoning, and a growth plan.
  topic: leadership
  tags:
  - performance-review
  - calibration
  - bias
  - management
  explanation: '## In plain words

    A performance review summarises how someone did against what their role expects. Calibration is a
    meeting where managers compare their ratings so the same work gets the same rating across teams.


    ## How it works

    **Before**

    - Keep notes and examples all period; ask for peer feedback and a self-review.

    - Compare evidence to the career ladder, not to other people.

    **Writing**

    - Impact, how they worked, and growth areas, each with examples.

    **Calibration**

    - Managers present ratings with evidence; peers challenge outliers.

    - Watch for bias: recency, halo effect, similarity, visibility of loud people, and different standards
    for remote staff.

    **Delivery**

    - No surprises: the person should already know the main points.

    - Explain the rating, discuss growth, agree the next goals.


    ## Example

    Fictional calibration moment: a manager proposes "exceeds" for an engineer who shipped a visible feature.
    Another asks for examples beyond the last month. The evidence shows the first half of the period was
    weak, so the group settles on "meets, strong finish" and records that the manager should raise the
    earlier gap sooner.


    ## Common mistakes

    - Writing from memory of the last few weeks.

    - Rating personality instead of behaviour and impact.

    - Letting the loudest manager win calibration.

    - First-time feedback in the review itself.


    ## In the interview

    Interviewers score fairness, evidence, and bias awareness. Mention self-reviews, peer input, and that
    calibration protects people from a single manager''s view. Expect "how do you tell someone their rating
    is lower than they expected?"

    '
