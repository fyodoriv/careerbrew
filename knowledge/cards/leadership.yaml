  question: What are the key Agile terms an engineering leader should know?
  answer: Agile is a set of values favouring working software, collaboration, and responding to change.
    Key terms include sprint, backlog, user story, story points, velocity, standup, retrospective, sprint
    review, Scrum roles, Kanban, work in progress limits, and definition of done.
  topic: leadership
  tags:
  - agile
  - scrum
  - kanban
  - process
  explanation: '## In plain words

    Agile is an approach to building software in small, frequent steps with constant feedback, defined
    by the Agile Manifesto (2001). Scrum and Kanban are the two most common ways to practise it.


    ## How it works

    - **Backlog**: ordered list of work; owned by the product owner.

    - **User story**: a small piece of value from a user''s view ("As a buyer, I want...").

    - **Sprint**: a fixed time box, often two weeks, in Scrum.

    - **Sprint planning, daily standup, sprint review (demo), retrospective**: the Scrum events.

    - **Scrum roles**: product owner (what), scrum master (process coach), developers (how).

    - **Story points**: relative estimate of effort and complexity.

    - **Velocity**: points completed per sprint; for the team''s planning only.

    - **Kanban**: continuous flow on a board with WIP (work in progress) limits.

    - **Definition of done**: shared checklist for "finished" (tested, reviewed, deployed).

    - **Epic**: a large story split into smaller ones.

    - **Increment**: usable product at the end of a sprint.


    ## Example

    Fictional sprint: planning picks 30 points from the backlog; daily 15-minute standups; a mid-sprint
    blocker is raised and removed; Friday review demos two stories to stakeholders; the retro decides
    to split stories smaller next time.


    ## Common mistakes

    - Using velocity to compare teams.

    - Doing the ceremonies without the values ("cargo-cult agile").

    - Treating story points as hours.

    - Thinking agile means no planning or documentation.


    ## In the interview

    Interviewers check fluency and judgment. Define terms briefly, then say how you adapt the process
    to the team. Expect "Scrum or Kanban, when?" (Scrum for planned product work, Kanban for interrupt-driven
    work like operations).

    '
