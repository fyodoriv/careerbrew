    - **Early warning**: frustration, burnout, or a job search usually shows up in 1:1s long before a
    resignation.

    - **Growth**: a place to discuss career goals, give feedback, and track progress over months.

    - **Unblocking**: small problems get solved before they become team problems.

    - **Two-way feedback**: the manager learns how their own decisions land.

