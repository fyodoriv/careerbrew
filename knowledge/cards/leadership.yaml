- id: kb-111e3e120d6c
  question: How do you run an effective one-on-one?
  answer: 'Keep it regular and protected, let the report own a shared agenda, and spend the time on them:
    blockers, feelings, career, and feedback in both directions. Ask open questions, listen more than
