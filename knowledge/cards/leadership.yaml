  question: What is the software development life cycle (SDLC)?
  answer: 'The SDLC is the series of phases software goes through: planning, requirements, design, implementation,
    testing, deployment, and maintenance. Models such as waterfall run them once in sequence, while agile
    and DevOps run them in small, frequent loops.'
  topic: leadership
  tags:
  - sdlc
  - process
  - waterfall
  - agile
  explanation: '## In plain words

    The SDLC (systems or software development life cycle) is the full path from an idea to running software
    and its upkeep. Every project goes through these steps; methods differ in how big and how sequential
    each step is.


    ## How it works

    Phases:

    - **Planning**: goals, scope, cost, feasibility.

    - **Requirements**: what users and the business need.

    - **Design**: architecture, data, interfaces.

    - **Implementation**: writing code, code review.

    - **Testing**: unit, integration, end-to-end, security.

    - **Deployment**: release to users, often gradually.

    - **Maintenance**: bug fixes, monitoring, improvements, eventual retirement.

    Models:

    - **Waterfall**: each phase once, in order; suits fixed, well-understood requirements.

    - **Iterative / agile**: short cycles that repeat all phases.

    - **V-model, spiral**: variants emphasising testing or risk.

    - **DevOps**: automates build, test, and deploy so the loop runs many times a day.


    ## Example

    Fictional comparison: a regulated medical device firmware project uses a waterfall-like process with
    formal sign-offs per phase. A consumer web app runs two-week sprints, each covering planning to deployment,
    with continuous delivery to production several times a day.


    ## Common mistakes

    - Thinking agile skips design or testing.

    - Treating maintenance as an afterthought, though it is often the longest phase.

    - Forgetting security across all phases ("shift left").

    - Assuming one model fits all projects.


    ## In the interview

    Name the phases, then compare models and when each fits. Leaders should mention how they shorten the
    loop (automation, small batches) and where quality gates belong. Expect "where do most defects come
    from?" (often unclear requirements).

    '
