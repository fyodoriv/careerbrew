- id: kb-f258d0d2215e
  question: How do you recruit and hire good engineers?
  answer: Define the role and what success looks like, source widely, and run a structured process with
    job-relevant exercises, trained interviewers, and a consistent rubric. Decide with evidence in a debrief,
    sell the role honestly, and keep the bar high even under pressure.
  topic: leadership
  tags:
  - hiring
  - recruiting
  - interviewing
  - team-building
  explanation: '## In plain words

    Hiring is the most lasting decision a leader makes. A good process predicts job performance, treats
    candidates well, and reduces bias.


    ## How it works

    - **Define the role**: the problems this person will solve in the first year, and must-have versus
    nice-to-have skills.

    - **Source**: referrals, communities, and outreach to widen the pool; write an honest job post.

    - **Structured interviews**: same questions and rubric per role; work-sample tasks close to the real
    job (debugging, design, code review).

    - **Interviewers**: trained, each owning distinct signals.

    - **Debrief**: everyone writes feedback before discussing to avoid groupthink; decide on evidence.

    - **Candidate experience**: fast replies, clear expectations, honest feedback.

    - **Close**: sell the mission, team, and growth; never oversell.

    - **Review**: track how hires perform after a year.


    ## Example

    Fictional loop for a backend role: 30-minute recruiter screen, 60-minute practical coding on a small
    service, 60-minute system design, 45-minute behavioural on collaboration, 30-minute chat with the
    manager. Each interviewer scores two or three signals on a 1-4 scale before the debrief.


    ## Common mistakes

    - Hiring for "culture fit" in a way that means "like us".

    - Puzzle questions unrelated to the job.

    - Lowering the bar to fill seats fast.

    - Slow processes that lose good candidates.


    ## In the interview

    Scored signals: structure, fairness, and a high bar. Mention rubrics, independent feedback, and measuring
    hiring quality. Expect "how do you decide between two strong candidates?" and "how do you improve
    diversity in the pipeline?"

    '
