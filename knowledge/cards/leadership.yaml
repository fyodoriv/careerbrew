- id: kb-cc9700525526
  question: How do you handle raises and compensation for your team?
  answer: 'Base raises on a transparent framework: role level, market data, and calibrated performance,
    within the budget you are given. Advocate with evidence for your people, explain decisions clearly,
    flag retention risks early, and fix unfair gaps instead of rewarding whoever asks loudest.'
  topic: leadership
  tags:
  - compensation
  - raises
  - fairness
  - retention
  explanation: '## In plain words

    Pay decisions affect trust more than almost anything else. People accept many outcomes if the process
    is fair and explained; they leave when it feels random.


    ## How it works

    - **Know the system**: salary bands per level, the budget, and the review cycle.

    - **Inputs**: performance rating, level, position in band, market data, internal equity.

    - **Advocate**: build a written case with impact and market evidence for each person.

    - **Equity check**: compare people at the same level and performance; look for gaps by gender, tenure,
    or negotiation skill.

    - **Communicate**: explain the number, the reasons, and what would lead to more (often a promotion).

    - **Off-cycle**: raise retention risks early rather than after a competing offer.


    ## Example

    Fictional sample answer: "During the review cycle I saw that two engineers at the same level and rating
    had a 15% pay gap because one had negotiated harder at hiring. I brought the data to HR and got an
    equity adjustment for the lower-paid engineer. I told her it was about fairness, not a reward for
    asking."


    ## Common mistakes

    - Promising raises you do not control.

    - Rewarding only those who threaten to leave.

    - Vague explanations ("budget was tight").

    - Ignoring pay equity.


    ## In the interview

    Scored signals: fairness, advocacy, and honest communication. Expect "what do you tell someone who
    is unhappy with their raise?" (listen, explain, show a path, never lie about bands). Mention that
    promotions, not raises, usually drive large pay jumps.

    '
