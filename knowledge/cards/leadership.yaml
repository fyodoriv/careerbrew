- id: kb-7883ca1387da
  question: How do you cultivate a healthy culture in a team?
  answer: Culture is what people do when no one is watching, shaped by what leaders reward, tolerate,
    and model. Define a few explicit values with behaviours, model them yourself, hire and promote for
    them, build rituals that reinforce them, and act quickly when someone violates them.
  topic: leadership
  tags:
  - culture
  - values
  - team-health
  - leadership
  explanation: '## In plain words

    Culture is the team''s habits: how decisions get made, how mistakes are treated, how people talk to
    each other. It forms whether you shape it or not, so a leader should shape it on purpose.


    ## How it works

    - **Name it**: agree three to five values with concrete behaviours (for example "we write blameless
    postmortems").

    - **Model it**: people copy what leaders do, not what they say.

    - **Reward it**: praise, promote, and hire for the behaviours.

    - **Rituals**: retrospectives, demos, postmortems, onboarding buddies.

    - **Correct it**: the worst behaviour you tolerate sets the culture; address violations fast, even
    from top performers.

    - **Listen**: surveys and retros show the gap between stated and real culture.


    ## Example

    Fictional sample answer: "Our team blamed individuals after incidents, so people hid mistakes. I introduced
    blameless postmortems, wrote the first one about my own error, and thanked people publicly for reporting
    problems early. Within two quarters, near-miss reports doubled and repeat incidents fell."


    ## Common mistakes

    - Values on a slide with no behaviour change.

    - Tolerating a brilliant but toxic person.

    - Confusing culture with perks or social events.

    - Imposing values without the team''s input.


    ## In the interview

    Scored signals: understanding that culture is behaviour, and a concrete example of changing it. Mention
    psychological safety and how you would measure progress. Expect "how do you keep culture in a fast-growing
    or remote team?"

    '
