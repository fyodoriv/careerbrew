  question: What are squads, tribes, chapters, and guilds in an agile engineering organization?
  answer: Squads are small cross-functional teams owning a mission; tribes group related squads; chapters
    connect people with the same skill across squads under a line manager; guilds are voluntary communities
    of interest. The model trades some consistency for autonomy.
  topic: leadership
  tags:
  - org-design
  - agile
  - squads
  - autonomy
  explanation: '## In plain words

    This is a way to organise many small autonomous teams while still sharing knowledge. Picture a school:
    classes (squads) do the work, a year group (tribe) holds related classes, subject departments (chapters)
    keep teaching consistent, and clubs (guilds) are open to anyone interested. Some versions add "alliances"
    as a group of tribes.


    ## How it works

    - **Squad**: 5 to 9 people, cross-functional, with a long-lived mission and a product owner.

    - **Tribe**: several squads in one area, usually under 100 people so people can know each other.

    - **Chapter**: people with the same craft (for example backend) across squads; the chapter lead is
    often their line manager.

    - **Guild**: an open community of practice across tribes, such as an accessibility guild.

    - **Alliance**: a group of tribes that must coordinate on a larger goal.

    - The matrix splits "what to build" (squad) from "how to grow and do the craft well" (chapter).


    ## Example

    A fictional 60-person product group: two tribes (buying and selling), each with four squads. Backend
    engineers from all squads form a chapter that meets every two weeks to agree on API standards. A testing
    guild open to anyone runs a monthly session on flaky tests.


    ## Common mistakes

    - Copying the labels without giving squads real autonomy or clear missions.

    - Assuming the model removes the need for coordination and architecture.

    - Chapter leads with too many reports across too many squads.

    - Presenting it as a universal best practice; its well-known originators said it kept evolving.


    ## In the interview

    Define each term, then talk about trade-offs: autonomy and speed versus consistency and duplicated
    work. Interviewers look for judgment: when you would use it (many teams, independent missions) and
    when it is overkill (a 15-person company). Mention matrix management tension and how you would handle
    it.

    '
