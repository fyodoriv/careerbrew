- id: kb-8aaa33e7b414
  question: How do you define good metrics for a team or product?
  answer: Start from the goal and ask what observable change would prove progress. Choose a few metrics
    that are tied to outcomes, measurable, hard to game, and that the team can influence; pair a leading
    indicator with a lagging one and add a guardrail metric to catch harm.
  topic: leadership
  tags:
  - metrics
  - okrs
  - measurement
  - goals
  explanation: '## In plain words

    A metric is a number that tells you whether you are getting closer to a goal. Good metrics change
    behaviour in the right direction; bad ones get gamed or ignored.


    ## How it works

    - **Start with the goal**: "users find what they need faster", not "add filters".

    - **Find the signal**: what would change if the goal were met (time to first result, search success
    rate)?

    - **Leading and lagging**: lagging metrics (retention) confirm results late; leading ones (weekly
    active searches) move quickly.

    - **Guardrails**: metrics that must not get worse (latency, error rate, support tickets).

    - **Check quality**: is it measurable today, influenced by the team, hard to game, understandable?

    - **Set baseline and target**, then review regularly.


    ## Example

    Fictional example: Goal: make onboarding easier. North-star metric: percentage of new users who complete
    setup within one day (baseline 40%, target 55%). Leading: drop-off at each setup step. Guardrail:
    support tickets per new user must not rise.


    ## Common mistakes

    - Vanity metrics such as total sign-ups or lines of code.

    - Too many metrics, so none get attention.

    - Metrics the team cannot influence.

    - Forgetting Goodhart''s law: a target that is gamed stops measuring anything.


    ## In the interview

    Interviewers score whether you start from outcomes and think about gaming and guardrails. Mention
    leading versus lagging indicators and a baseline. Expect "how do you measure something fuzzy like
    developer experience?" (combine surveys with system data).

    '
