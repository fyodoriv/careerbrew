- id: kb-0fd6c3d31a72
  question: How should a manager handle layoffs?
  answer: 'Be honest, humane, and fast: follow legal and HR guidance, tell affected people privately and
    first, with clear details on support and next steps, then tell the remaining team the reasons and
    the plan. Help those leaving find jobs and rebuild trust and focus with those who stay.'
  topic: leadership
  tags:
  - layoffs
  - communication
  - change-management
  - empathy
  explanation: '## In plain words

    Layoffs are among the hardest things a manager does. Usually the decision comes from above, but how
    it is carried out strongly affects the dignity of people leaving and the trust of those who stay.


    ## How it works

    **Before**

    - Understand the reasons and the criteria; push back if criteria seem unfair.

    - Prepare with HR: severance, benefits, timeline, access, and legal requirements.

    **Telling affected people**

    - In person or by video, privately, before any public announcement.

    - Be direct and brief; explain support available; do not debate.

    **Telling the team**

    - Same day: what happened, why, how work changes, and what you do not know.

    - Expect grief, anger, and fear; give time and 1:1s.

    **After**

    - Help leavers with references and introductions.

    - Re-plan work for the smaller team; drop work rather than overload people.


    ## Example

    Fictional sample answer: "Two of my eight engineers were affected. I met each privately at 9 a.m.
    with HR, kept it to 15 minutes, and offered references. At 10 a.m. I told the remaining team, explained
    the business reasons, and held 1:1s that week. We cut two projects from the roadmap so no one inherited
    double work."


    ## Common mistakes

    - Learning about it by email or a revoked login.

    - Promising "no more layoffs" when you cannot know.

    - Keeping the old roadmap with fewer people.

    - Disappearing from the team afterwards.


    ## In the interview

    Scored signals: empathy, honesty, and practical planning. Mention survivor guilt and re-planning.
    Expect "what if you disagreed with the decision?" (raise it internally, then carry it out respectfully).

    '
