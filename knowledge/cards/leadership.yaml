    she spotted the wrong config herself. I then asked a senior engineer to pair with her once a week
    for a month."


    ## Common mistakes

    - Grabbing the keyboard.

    - Giving advice when the person needed to vent.

    - Helping once and never checking back.

    - Waiting too long because you do not want to micromanage.


    ## In the interview

    Scored signals: coaching mindset, judgment about when to intervene, and follow-through. Mention the
    difference between mentoring, coaching, and directing. Expect "how do you help someone who will not
    ask for help?"

