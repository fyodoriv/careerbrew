- id: kb-50be6bf0e065
  question: How do you help your team members grow?
  answer: Learn each person's goals, map them to skills and opportunities, then give stretch work with
    support, frequent feedback, and visibility. Write a simple growth plan, review it regularly, and sponsor
    people for opportunities they cannot reach alone.
  topic: leadership
  tags:
  - growth
  - career-development
  - coaching
  - management
  explanation: '## In plain words

    People grow mostly from doing harder work with good feedback, not from courses. A manager''s job is
    to find the right next challenge for each person and make it safe to attempt.


    ## How it works

    - **Understand goals**: ask where they want to be in one to three years.

    - **Assess gaps**: use the career ladder to name two or three skills to build.

    - **Choose experiences**: the 70-20-10 idea says most growth comes from work (70%), some from people
    (20%), little from courses (10%).

    - **Feedback**: frequent and specific, not saved for reviews.

    - **Sponsor**: put their name forward for projects, talks, or leadership roles.

    - **Review**: check progress every month or quarter and adjust.


    ## Example

    Fictional growth plan: "Goal: senior engineer in 12 months. Gaps: system design, cross-team influence.
    Actions: own the design of the notification service (Q1), run the team''s design reviews (Q2), mentor
    the new hire (Q2). Check-in: monthly in 1:1s."


    ## Common mistakes

    - One growth path for everyone (not everyone wants management).

    - Only sending people to training.

    - Giving stretch work with no support, so people fail.

