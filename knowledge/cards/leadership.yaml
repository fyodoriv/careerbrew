  explanation: '## In plain words

    Interviewers ask this to see if you can make a hard call fairly and humanely. A good story shows the
    person was not surprised, the process was fair, and the team was looked after.


    ## How it works

    Shape of a strong answer (STAR plus learning):

    - **Situation**: the gap in performance or behaviour, without naming or blaming.

    - **Task**: your responsibility as the manager.

    - **Action**: clear feedback early, a written improvement plan with measurable goals, support (mentoring,
    pairing), regular check-ins, involving HR, then a short, kind, final meeting.

    - **Result**: the outcome for the person, the team, and the work.

    - **Learning**: what you would do earlier next time.


    ## Example

    Fictional sample answer: "An engineer kept missing commitments and code reviews showed repeated basic
    bugs. I gave specific feedback for two months, then agreed a six-week plan with three clear goals
    and weekly check-ins. Progress stalled. With HR, I held a 15-minute meeting, explained the decision,
    covered next steps and severance, and thanked them for their work. I told the team the same day without
    details. My lesson: I waited too long to give the first direct feedback."


    ## Common mistakes

    - Making it a surprise for the person.

    - Sharing private details with the team.

    - Sounding cold or, the opposite, unable to make the call.

    - Skipping documentation or HR.


    ## In the interview

    Signals scored: fairness, clarity, empathy, and ownership. Keep it anonymous and short. Expect follow-ups:
    "would you do anything differently?" and "how did the team react?" If you have never fired anyone,
    say so and explain how you would do it.

