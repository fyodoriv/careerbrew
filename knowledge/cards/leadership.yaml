- id: kb-7548535e2238
  question: How do you write and run OKRs well?
  answer: Write a few inspiring Objectives, each with two to four measurable Key Results that describe
    outcomes, not tasks. Set them together with the team, align with company goals, check progress regularly,
    and treat about 70 percent achievement on ambitious OKRs as success.
  topic: leadership
  tags:
  - okrs
  - goals
  - planning
  - metrics
  explanation: '## In plain words

    OKRs (Objectives and Key Results) are a goal-setting method. The Objective says where you want to
    go in words; the Key Results are numbers that show you got there.


    ## How it works

    - **Objective**: qualitative, motivating, time-bound ("Make search delightfully fast").

    - **Key Results**: two to four, measurable outcomes ("p95 search latency from 900 ms to 300 ms").

    - **Not tasks**: "build a cache" is an initiative, not a KR.

    - **Few**: two or three objectives per team per quarter.

    - **Alignment**: link to company goals, but let teams propose their own.

    - **Ambition**: separate committed OKRs (must hit) from aspirational ones (around 70% is good).

    - **Cadence**: weekly or biweekly confidence check; quarter-end scoring and lessons.

    - **Not for performance reviews**: tying OKRs to pay makes people sandbag.


    ## Example

    Fictional OKR:

    ```text

    Objective: New users succeed in their first week

    KR1: Day-7 retention from 35% to 45%

    KR2: Setup completion within 24 h from 50% to 70%

    KR3: Onboarding support tickets per 100 users from 8 to 4

    ```


    ## Common mistakes

    - Key results that are a to-do list.

    - Too many OKRs.

    - Setting and forgetting until quarter end.

    - Punishing missed aspirational OKRs.


    ## In the interview

    Scored signals: outcome thinking, focus, and cadence. Mention committed versus aspirational OKRs and
    why not to tie them to compensation. Expect "rewrite this task-based OKR into an outcome" as a quick
    exercise.

    '
