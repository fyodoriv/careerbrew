- id: kb-bb0e49381394
  question: How do you balance empowering your reports with demanding strong results?
  answer: 'Give autonomy over the how, but be explicit about the what and the bar: clear goals, quality
    standards, and check-in points. Match autonomy to the person''s experience with the task, give fast
    feedback when results slip, and treat high standards as a form of respect.'
  topic: leadership
  tags:
  - empowerment
  - accountability
  - autonomy
  - management
  explanation: '## In plain words

    Empowerment and high standards are not opposites. The trick is to be strict about outcomes and flexible
    about methods, like a coach who sets the target time but lets the runner choose the training plan
    within limits.


    ## How it works

    - Agree on the outcome, the quality bar, and the deadline in writing.

    - Set autonomy by task maturity: more check-ins for new territory, fewer for proven skills.

    - Agree on check-in points and early warning signs up front.

    - When results slip, give specific feedback quickly and ask what support is needed.

    - Celebrate results publicly; address gaps privately.

    A strong answer uses one concrete STAR story.


    ## Example

    Fictional sample answer: "I gave a senior engineer full ownership of a search latency project with
    one goal: p95 under 200 ms by quarter end. We agreed on biweekly demos. At the second demo it was
    clear the approach would not hit the target. I did not take over; I asked what options she saw, and
    she chose to add a cache layer. She hit 180 ms. The checkpoints let me stay hands-off without losing
    the result."


    ## Common mistakes

    - Confusing empowerment with absence ("do whatever").

    - Micromanaging as soon as there is any risk.

    - Vague standards, then disappointment at the end.

    - Rescuing people instead of coaching them.


    ## In the interview

    Scored signals: clarity of expectations, trust, and how you react to misses. Mention situational leadership
    and "disagree and commit". Expect "what do you do when someone keeps missing the bar?", which leads
    into performance management.

    '
