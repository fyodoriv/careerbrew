  topic: leadership
  tags:
  - estimation
  - planning
  - forecasting
  - agile
  explanation: '## In plain words

    An estimate is a forecast of how much effort something will take. It is useful even when wrong, because
    it lets the business compare options and plan around uncertainty.


    ## How it works

    Why estimate:

    - **Prioritisation**: value divided by cost needs a cost.

    - **Planning**: marketing, sales, and other teams depend on dates.

    - **Scope decisions**: big estimates prompt "what is the smaller version?"

    - **Risk discovery**: discussing estimates surfaces unknowns early.

    - **Learning**: comparing estimates with actuals improves future planning.

    How to do it well:

    - Use ranges or confidence levels.

    - Estimate small items; break down large ones.

    - Let the people doing the work estimate.

    - Re-estimate as you learn.

    - Consider forecasting from history (throughput) instead of detailed task estimates.

    The "#NoEstimates" movement argues that small, similarly sized items plus historical throughput can
    replace detailed estimates.


    ## Example

    Fictional forecast: the team finishes 6 to 9 similar-sized stories per week. A feature split into
    30 stories should take about 3.5 to 5 weeks (30 / 9 ≈ 3.3, 30 / 6 = 5). The PM uses this range to
    decide the launch fits before the conference.


    ## Common mistakes

    - Treating estimates as commitments and punishing misses.

    - Single-point estimates with no uncertainty.

    - Estimating huge items without breaking them down.

    - Spending more time estimating than it saves.


    ## In the interview

    Scored signals: understanding the purpose, not just the mechanics. Mention ranges, re-estimation,
    and throughput forecasting. Expect "what do you do when a stakeholder takes an estimate as a deadline?"
    (restate the range and confidence in writing).

