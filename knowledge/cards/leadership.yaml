  topic: leadership
  tags:
  - one-on-ones
  - coaching
  - feedback
  - management
  explanation: '## In plain words

    An effective 1:1 is the report''s meeting, not the manager''s. It works when it is reliable, private,
    and focused on things that do not fit anywhere else.


    ## How it works

    - **Cadence**: weekly or biweekly, 30 minutes, rarely cancelled; reschedule instead.

    - **Shared doc**: running agenda both people add to, with notes and actions.

    - **Order**: their topics first, then yours.

    - **Topic mix**: blockers, how they feel, career goals, feedback both ways, team dynamics.

    - **Questions**: "What is on your mind?", "What is slowing you down?", "What could I do better?"

    - **Follow-up**: review last time''s actions at the start.

    - **Adapt**: more structure for new hires, more career focus for senior people.


    ## Example

    Fictional 30-minute agenda:

    - 5 min: actions from last week (manager got the test environment fixed).

    - 15 min: report''s topic: frustration with unclear requirements on a project.

    - 5 min: career: progress on leading the next design review.

    - 5 min: manager''s feedback: strong incident write-up; ask for more detail on root cause.


    ## Common mistakes

    - Turning it into a status update.

    - The manager talking 80% of the time.

    - No notes, so nothing gets followed up.

    - Only meeting when there is a problem.


    ## In the interview

    Scored signals: listening, structure, and follow-through. Mention good questions, the shared doc,
    and how you handle a report who says "nothing to discuss". Expect "how do you give hard feedback in
    a 1:1?"

