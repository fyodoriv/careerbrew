  - pip
  - management
  explanation: '## In plain words

    Poor performance has a cause: unclear expectations, missing skills, personal problems, wrong role,
    or low motivation. Find it first, then help, and be honest about consequences if nothing changes.


    ## How it works

    - **Confirm the gap**: specific examples versus role expectations.

    - **Talk early**: share the examples and impact; ask for their view.

    - **Find the cause**: clarity, skill, will, fit, or life circumstances.

    - **Plan**: two or three measurable goals, support (pairing, training), and a time frame, written
    down.

    - **Check weekly** and give feedback.

    - **Outcomes**: improvement (great, recognise it), a better-fit role, or a formal performance improvement
    plan (PIP) with HR, with exit only if it fails.

    - **Fairness**: document throughout; no surprises.


    ## Example

    Fictional sample answer: "An engineer''s PRs often needed several review rounds and missed estimates.
    In our talk, he said he was unsure about the new framework. We set a four-week plan: pairing twice
    a week, smaller PRs, and a target of at most two review rounds. By week four he met it."


    ## Common mistakes

    - Waiting months hoping it fixes itself.

    - Vague feedback.

    - Skipping the cause and going straight to a PIP.

    - Ignoring the impact on the rest of the team.


    ## In the interview

    Scored signals: timeliness, empathy, clarity, and willingness to make hard calls. Expect "how long
    do you give them?" (weeks, not quarters, depending on the gap).

