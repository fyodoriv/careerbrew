- id: kb-292d4beb6808
  question: What is convergence in operational transformation?
  answer: Convergence means that after all clients have received and applied the same set of operations,
    every copy of the document is identical, even though each client applied the operations in a different
    order. OT's transformation functions are designed to guarantee this property.
  topic: system design
  tags:
  - operational-transformation
  - consistency
  - collaboration
  - distributed-systems
  explanation: '## In plain words

    In a shared editor, each person sees their own edits first and others'' edits a bit later, so everyone
    applies the changes in a different order. Convergence is the promise that, once the edits stop and
    all messages arrive, everyone is looking at exactly the same text.


    ## How it works

    - Each client applies its local operation at once, then receives remote ones.

    - Applying raw operations in different orders gives different results, because positions shift. OT
    transforms each incoming operation against the concurrent ones already applied.

    - **Transformation property 1 (TP1)**: for two concurrent operations `a` and `b`, applying `a` then
    `T(b, a)` must give the same document as applying `b` then `T(a, b)`. This guarantees convergence
    for two operations.

    - **TP2** extends this to three or more concurrent operations in any order; it is hard to satisfy,
    which is why practical systems use a central server to fix one order, so only TP1 is needed.

    - **Causality preservation**: an operation is applied only after the operations it depends on.

    - **Intention preservation**: each edit should still do what the user meant, which is a separate goal
    from convergence.

    - CRDTs reach the same goal (often called strong eventual consistency) through data structures that
    merge in any order.


    ## Example

    1. Document "cat". Alice deletes the "c" (position 0). Bob inserts "s" at position 3.

    2. Alice receives Bob''s insert; transformed against her delete, it moves to position 2. Her text:
    "at" -> "ats".

    3. Bob receives Alice''s delete at 0; it is unaffected by his later-position insert. His text: "cats"
    -> "ats".

    4. Both show "ats": they converged.


    ## Common mistakes

    - Assuming convergence also means the result is what both users intended.

    - Forgetting tie-breaking rules for inserts at the same position, which breaks TP1.

    - Thinking convergence holds while messages are still in flight.


    ## In the interview

    Define convergence, show a two-edit example, and explain TP1 and why a central server avoids TP2.
    Contrast with CRDTs.

    '
