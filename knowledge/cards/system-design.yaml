- id: kb-b06aabaebbb7
  question: How do you identify scaling bottlenecks in a service architecture?
  answer: 'Measure before guessing: watch latency, throughput, errors, and saturation for every component,
    use distributed traces to see where time goes, and load test to find the first resource that saturates
    (CPU, memory, database connections, locks, network, or a downstream dependency).'
  topic: system design
  tags:
  - scalability
  - performance
  - observability
  - load-testing
  explanation: '## In plain words

    A system is only as fast as its slowest step under load. Finding the bottleneck means locating the
    one resource that fills up first when traffic grows, because improving anything else will not help.


    ## How it works

    - **Map the request path**: client, load balancer, services, caches, databases, queues, third parties.

    - **Watch the right metrics**: for services, RED (rate, errors, duration as percentiles like p99);
    for resources, USE (utilization, saturation, errors) for CPU, memory, disk, network, connection pools,
    threads.

    - **Tracing**: distributed traces show which span takes the time, and reveal fan-out and N+1 query
    patterns.

    - **Load test**: increase traffic step by step in a production-like environment and watch which metric
    bends first: latency rising while CPU is low often means a lock, pool, or downstream limit.

    - **Common bottlenecks**: a single database primary, missing indexes, connection pool limits, synchronous
    calls in series, hot partitions or keys, shared locks, garbage collection pauses, rate limits of external
    APIs.

    - **Little''s law**: concurrency = throughput x latency; it tells you how many workers or connections
    you need.


    ## Example

    1. An API handles 500 requests per second at p99 120 ms. At 800, p99 jumps to 2 seconds.

    2. CPU on app servers is 40%, but the database connection pool shows 100% in use with many waiting.

    3. Traces show each request makes 12 sequential queries; batching them into 2 cuts database time by
    70%.

    4. The next load test reaches 1,500 requests per second before the database CPU saturates.


    ## Common mistakes

    - Scaling app servers when the database is the bottleneck.

    - Looking at averages instead of tail latency.

    - Load testing with unrealistic data or cache hit rates.


    ## In the interview

    Explain your method: observe, form a hypothesis, test, fix, repeat. Give concrete signals for each
    type of bottleneck and the usual fixes (caching, indexing, async work, sharding, batching).

    '
