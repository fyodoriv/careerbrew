- id: kb-8a5cab21f285
  question: What is compute scaling?
  answer: 'Compute scaling means changing the processing capacity available to a workload: scaling up
    or down (bigger or smaller machines) and scaling out or in (more or fewer instances). It is often
    automated with autoscaling based on metrics like CPU, request rate, or queue length.'
  topic: system design
  tags:
  - scalability
  - autoscaling
  - cloud
  - infrastructure
  explanation: "## In plain words\nCompute is the CPU and memory that run your code. Compute scaling is\
    \ adjusting how much of it you have, so you can handle busy periods without paying for idle machines\
    \ during quiet ones.\n\n## How it works\n- **Vertical (up/down)**: change instance size, for example\
    \ 4 to 16 cores. Simple, often needs a restart, limited by the largest machine.\n- **Horizontal (out/in)**:\
    \ change the number of instances behind a load balancer. Needs stateless services; nearly unlimited.\n\
    - **Autoscaling**:\n  - *Reactive*: rules such as \"keep average CPU near 60%\" or \"one worker per\
    \ 100 queued messages\".\n  - *Scheduled*: add capacity before known peaks.\n  - *Predictive*: forecast\
    \ from historical patterns.\n- **Signals**: CPU, memory, request rate, latency, queue depth, custom\
    \ business metrics.\n- **Constraints**: instance start time (a minute or more for VMs, seconds for\
    \ containers), cool-down periods to avoid flapping, minimum and maximum counts, cost limits.\n- **Serverless**:\
    \ functions scale per request automatically, with cold starts as a trade-off.\n- **Downstream limits**:\
    \ more app instances can overload the database or a third-party API.\n\n## Example\n1. A video service\
    \ needs 20 transcoding workers at night and 200 during the evening peak.\n2. Scaling on queue depth:\
    \ target 50 jobs per worker.\n3. At 18:00 the queue reaches 6,000 jobs, so the autoscaler grows to\
    \ 120 workers.\n4. If the fleet averages about 65 workers over a day, running 200 all day would cost\
    \ about 3 times more, since on-demand instances cost the same per hour.\n\n## Common mistakes\n- Scaling\
    \ on CPU for workloads limited by I/O or queue length.\n- Not accounting for startup time, so new\
    \ instances arrive after the spike.\n- Forgetting a maximum, leading to runaway cost during a bug\
    \ or attack.\n\n## In the interview\nExplain vertical vs horizontal, the metrics you would scale on,\
    \ and the trade-offs: warm-up time, cost, statelessness, and downstream bottlenecks.\n"
