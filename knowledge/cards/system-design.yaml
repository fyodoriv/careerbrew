- id: kb-1f4d8ed8987b
  question: What is the CAP theorem?
  answer: The CAP theorem says that when a network partition splits a distributed data store, it must
    choose between consistency (every read sees the latest write or fails) and availability (every request
    gets a non-error answer). Without a partition you can have both; PACELC adds the latency versus consistency
    trade-off during normal operation.
  topic: system design
  tags:
  - distributed-systems
  - cap-theorem
  - consistency
  - availability
  explanation: "## In plain words\nImagine two bank branches that keep copies of your balance and the\
    \ phone line between them breaks. Either a branch refuses to serve you until the line is back (consistent\
    \ but unavailable), or it serves you with possibly stale numbers (available but inconsistent). It\
    \ cannot do both while cut off.\n\n## How it works\n- **C - Consistency** (here meaning linearizability):\
    \ every read returns the most recent write, as if there were one copy.\n- **A - Availability**: every\
    \ request to a working node gets a response that is not an error.\n- **P - Partition tolerance**:\
    \ the system keeps operating when messages between nodes are lost.\n- In a real network, partitions\
    \ happen, so P is not optional. The real choice is **CP or AP during a partition**.\n  - *CP*: refuse\
    \ some requests to stay correct (for example ZooKeeper, etcd, a single-leader database that rejects\
    \ writes without a quorum).\n  - *AP*: answer from any replica and reconcile later (for example Cassandra\
    \ or DynamoDB-style stores in default settings).\n- **PACELC**: if Partition, choose A or C; Else,\
    \ choose Latency or Consistency. Even without failures, waiting for replicas costs latency.\n- Many\
    \ systems are tunable per request (quorum reads and writes).\n\n## Example\n1. A store with 3 replicas,\
    \ quorum writes (W=2) and quorum reads (R=2): since R + W > N, reads see the latest write.\n2. A partition\
    \ isolates one replica; the other two still form a quorum, so the majority side keeps serving.\n3.\
    \ Clients that can only reach the isolated replica get errors: the system chose consistency.\n4. A\
    \ shopping cart might instead accept writes on both sides and merge them later: it chose availability.\n\
    \n## Common mistakes\n- Saying \"pick any two\" as if you could drop partition tolerance.\n- Confusing\
    \ CAP consistency with ACID consistency.\n- Labelling a whole product CP or AP when it is configurable.\n\
    \n## In the interview\nDefine each letter precisely, explain that the choice applies during partitions,\
    \ then map business needs: payments and inventory lean CP; feeds, carts, and likes lean AP. Mention\
    \ PACELC and quorum tuning.\n"
  match:
