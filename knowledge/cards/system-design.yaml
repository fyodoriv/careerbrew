- id: kb-c6ce93bd9bb2
  question: What are message queues and why are they used?
  answer: A message queue is a buffer where producers put messages and consumers take them off later,
    so the two do not need to be available or equally fast at the same time. Queues decouple services,
    absorb traffic spikes, enable retries and background work, and let you scale consumers independently.
  topic: system design
  tags:
  - message-queues
  - asynchronous
  - decoupling
  - kafka
  explanation: "## In plain words\nA message queue is like a mailbox between two services. The sender\
    \ drops off a letter and goes on with its day; the receiver picks it up when it is ready. If the receiver\
    \ is busy or down, letters wait in the mailbox instead of getting lost.\n\n## How it works\n- **Producer**\
    \ sends a message (for example \"resize image 123\"); the **broker** stores it durably; a **consumer**\
    \ receives it, processes it, and **acknowledges** it. Unacknowledged messages are redelivered.\n-\
    \ **Patterns**:\n  - *Work queue*: many consumers share the load, each message handled once.\n  -\
    \ *Publish/subscribe*: each subscriber gets its own copy (fan-out).\n- **Delivery guarantees**: at-most-once,\
    \ at-least-once (most common; make consumers **idempotent**), and effectively-once with deduplication\
    \ or transactions.\n- **Ordering**: often only within a partition or group key.\n- **Failure handling**:\
    \ retries with backoff, and a **dead-letter queue** for messages that keep failing.\n- **Tools**:\
    \ RabbitMQ and SQS (classic queues), Kafka and Pulsar (durable, replayable logs).\n- **Benefits**:\
    \ decoupling, spike buffering, background processing, independent scaling. **Costs**: eventual consistency,\
    \ harder debugging, more infrastructure.\n\n## Example\n1. A sign-up request saves the user and publishes\
    \ `UserSignedUp`.\n2. An email service, an analytics service, and a CRM sync each consume it.\n3.\
    \ A marketing blast causes 20,000 sign-ups in a minute; the queue buffers them and 10 email workers\
    \ send at their own pace.\n4. One email provider call fails; the message is retried 3 times, then\
    \ sent to the dead-letter queue for inspection.\n\n## Common mistakes\n- Assuming exactly-once delivery\
    \ and writing non-idempotent consumers.\n- No dead-letter queue, so one bad message blocks the queue\
    \ forever.\n- Using a queue for a call that needs an immediate answer.\n\n## In the interview\nExplain\
    \ why you add a queue (spikes, decoupling, slow work) and the guarantees you need. Compare a queue\
    \ (SQS, RabbitMQ) with a log (Kafka), and discuss ordering, retries, and monitoring queue depth.\n"
