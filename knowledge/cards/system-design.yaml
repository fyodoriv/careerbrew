- id: kb-0756002257b4
  question: What is OAuth and how does it work?
  answer: OAuth 2.0 is an authorization framework that lets an application access a user's resources at
    another service without getting the user's password. The user approves access at the authorization
    server, which gives the app a limited, expiring access token (scoped to specific permissions) that
    it presents to the resource server's API.
  topic: system design
  tags:
  - oauth
  - authorization
  - security
  - api
  explanation: "## In plain words\nOAuth is like a hotel key card. Instead of handing the cleaning service\
    \ your master key (your password), the front desk gives them a card that opens only your room, only\
    \ for today. If something goes wrong, the card is cancelled and your master key is safe.\n\n## How\
    \ it works\n- **Roles**:\n  - *Resource owner*: the user.\n  - *Client*: the app wanting access.\n\
    \  - *Authorization server*: authenticates the user and issues tokens.\n  - *Resource server*: the\
    \ API holding the data.\n- **Authorization code flow with PKCE** (the standard for web and mobile\
    \ apps):\n  1. The client creates a random `code_verifier` and sends its hash (`code_challenge`) when\
    \ redirecting the user to the authorization server with the requested `scope`.\n  2. The user logs\
    \ in and approves.\n  3. The server redirects back with a short-lived **authorization code**.\n  4.\
    \ The client exchanges the code plus the `code_verifier` for an **access token** (and maybe a **refresh\
    \ token**).\n  5. The client calls the API with `Authorization: Bearer <access token>`.\n- **Other\
    \ flows**: client credentials (machine to machine), device code (TVs and command-line tools).\n- **Tokens**:\
    \ access tokens are short-lived; refresh tokens get new ones without asking the user again.\n- **OpenID\
    \ Connect** adds an ID token so apps can also learn who the user is (login).\n\n## Example\n1. A calendar\
    \ app wants to read your email to find flight bookings.\n2. It sends you to the email provider, asking\
    \ for `scope=mail.read`.\n3. You approve; the app gets a token that can read mail but not send it,\
    \ valid for 1 hour.\n4. Later you revoke the app's access in your account settings; its refresh token\
    \ stops working.\n\n## Common mistakes\n- Treating OAuth as authentication by itself.\n- Skipping\
    \ the `state` parameter (CSRF protection) or PKCE.\n- Requesting broad scopes when narrow ones would\
    \ do.\n\n## In the interview\nName the four roles, walk through the authorization code flow with PKCE,\
    \ and explain scopes and token lifetimes. Expect follow-ups on refresh token rotation, JWT vs opaque\
    \ tokens, and OIDC.\n"
