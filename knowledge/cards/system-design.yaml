  question: How would you design a web crawler?
  answer: Start from seed URLs in a URL frontier queue; workers fetch pages while respecting robots.txt
    and per-host politeness limits, parse out links and content, deduplicate URLs and content with hashes
    or Bloom filters, store pages, and add new URLs back to the frontier with priorities.
