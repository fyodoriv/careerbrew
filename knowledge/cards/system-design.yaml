- id: kb-0ba6eeda293d
  question: What are the write-through and write-back cache patterns?
  answer: Write-through writes to the cache and the database together, so the cache is always fresh and
    data is safe, but every write pays both latencies. Write-back (write-behind) writes to the cache and
    acknowledges at once, flushing to the database later, which makes writes fast but risks data loss
    if the cache fails before flushing.
  topic: system design
  tags:
  - caching
  - write-through
  - write-back
  - consistency
  explanation: "## In plain words\nThese patterns decide what happens when data is written and a cache\
    \ sits in front of the database. Write-through updates both right away; write-back updates the cache\
    \ now and the database later, like jotting notes on a whiteboard and copying them into a notebook\
    \ at the end of the day.\n\n## How it works\n- **Write-through**:\n  - Write goes to the cache, which\
    \ synchronously writes to the database (or the app writes both in sequence).\n  - Reads after writes\
    \ hit a fresh cache.\n  - Writes are slower; the cache fills with data that may never be read.\n-\
    \ **Write-back (write-behind)**:\n  - Write goes to the cache and is acknowledged; dirty entries are\
    \ flushed in batches or on eviction.\n  - Very fast writes; many updates to the same key collapse\
    \ into one database write.\n  - Risk: losing unflushed writes if the cache node crashes, unless the\
    \ cache is replicated or persistent. Database is temporarily stale for other readers.\n- **Write-around**:\
    \ write only to the database and let the cache fill on read; avoids polluting the cache with write-once\
    \ data.\n- **Related**: cache-aside is the common read pattern; these are write patterns.\n- CPU caches\
    \ use the same ideas.\n\n## Example\n1. A game stores player scores that change 50 times a minute.\n\
    2. With write-through, that is 50 database writes per minute per player.\n3. With write-back flushing\
    \ every 10 seconds, it is 6 writes per minute, an 88% reduction, at the risk of losing up to 10 seconds\
    \ of score on a crash.\n4. Account balances should use write-through (or no write caching), because\
    \ losing a write is unacceptable.\n\n## Common mistakes\n- Using write-back for data that must never\
    \ be lost.\n- Assuming write-through gives transactional consistency; if the database write fails\
    \ after the cache write, they diverge.\n- Forgetting eviction policies and TTLs.\n\n## In the interview\n\
    Compare latency, durability, and consistency, and match each to a use case. Mention write-around and\
    \ cache-aside, and how replication or a persistent log reduces write-back risk.\n"
