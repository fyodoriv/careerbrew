- id: kb-d35ed06f10c5
  question: How would you design a text-sharing service like Pastebin?
  answer: Generate a short unique key per paste, store the text in object storage (or a key-value store
    for small pastes) and metadata such as expiry and visibility in a database, serve reads through a
    cache or CDN, and delete expired pastes with a background job.
  topic: system design
  tags:
  - key-value
  - url-shortener
  - caching
  - system-design-interview
  explanation: '## In plain words

    Pastebin lets you save a block of text and get a short link to share. It is close to a URL shortener,
    except the thing behind the link is a piece of text you store yourself.


    ## How it works

    - **Requirements**: create a paste, read by link, optional expiry, public or unlisted, size limit
    (for example 1 MB). Read-heavy.

    - **Key generation**: a random 7-8 character base62 string (62^8 is about 218 trillion), checked for
    collision on insert; or a counter encoded in base62; or a pre-generated key pool.

    - **Storage**: metadata (key, owner, created, expires_at, size, visibility) in a database; content
    in object storage keyed by paste id, or inline in a key-value store if pastes are small.

    - **Reads**: `GET /p/{key}` checks the cache, then metadata, then content. Popular pastes sit in a
    CDN.

    - **Expiry**: a job deletes expired pastes; reads also check `expires_at` so expired content is never
    served.

    - **Abuse**: rate limits, spam and malware scanning, takedown flow.


    ## Example

    1. 1 million new pastes a day, 10 KB average: 10 GB a day, about 3.6 TB a year.

    2. Read ratio 10:1: 10 million reads a day, about 120 per second, peak maybe 1,000.

    3. A 7-character key gives 62^7, about 3.5 trillion options, plenty for decades.


    ## Common mistakes

    - Sequential ids, which let anyone enumerate unlisted pastes.

    - Storing large text blobs in the relational database.

    - Forgetting expiry and cleanup.


    ## In the interview

    Do the capacity estimate, explain key generation and collision handling, and separate metadata from
    content. Mention caching hot pastes and abuse prevention.

    '
