- id: kb-cdd3e6b71ee5
  question: How would you design a microblogging service like Twitter?
  answer: Store tweets in a sharded store, keep the follow graph separately, and precompute home timelines
    in a cache by fanning out new tweets to followers, except for accounts with huge follower counts whose
    tweets are merged in at read time. Add search and trends via asynchronous pipelines.
  topic: system design
  tags:
  - timeline
  - fan-out
  - caching
  - system-design-interview
  explanation: '## In plain words

    Twitter is mostly reading: people scroll timelines far more than they post. So the design spends work
    at write time to make reads cheap, by placing each new tweet into the cached timelines of the author''s
    followers.


    ## How it works

    - **Requirements**: post short tweets, follow, home timeline, user timeline, likes, search. Timeline
    load under about 200 ms. Eventual consistency is fine.

    - **Tweet service**: writes tweets to a sharded store keyed by tweet id (ids that sort by time, such
    as Snowflake ids).

    - **Graph service**: who follows whom.

    - **Fan-out service**: on a new tweet, a queue worker pushes the tweet id into each follower''s timeline
    list in Redis, capped at a few hundred entries.

    - **Celebrities**: accounts with millions of followers skip fan-out; their recent tweets are merged
    at read time (**hybrid** approach).

    - **Reads**: fetch the id list from cache, hydrate tweets from a tweet cache.

    - **Search and trends**: consume the tweet stream into a search index and a counting job.


    ## Example

    1. 200 million daily users, 2 tweets per day each: 400 million tweets per day, about 4,600 per second.

    2. Average 200 followers: fan-out is about 1 million cache writes per second.

    3. Timeline reads at 50 per user per day: about 115,000 per second, all from cache.


    ## Common mistakes

    - Building every timeline at read time with a big join.

    - Pure fan-out on write for celebrity accounts.

    - Using timestamps from many machines as ids without ordering guarantees.


    ## In the interview

    Do the math to justify fan-out on write, then explain the hybrid. Expect follow-ups on deleting tweets,
    ranking, inactive users (do not fan out to them), and cache memory sizing.

    '
