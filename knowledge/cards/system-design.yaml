- id: kb-0440c237106d
  question: How would you design a unique ID generator for a distributed system?
  answer: Common options are UUIDs (random, no coordination, not sortable), a database sequence or ticket
    server (simple, a bottleneck), and Snowflake-style 64-bit ids combining a timestamp, machine id, and
    per-millisecond counter, which are unique and roughly time-ordered without coordination.
  topic: system design
  tags:
  - distributed-systems
  - ids
  - snowflake
  - uuid
  explanation: "## In plain words\nMany servers need to create ids at the same time without ever producing\
    \ the same one, and ideally the ids should sort by creation time. You can get uniqueness by randomness,\
    \ by a central counter, or by giving each machine its own slice of the id space.\n\n## How it works\n\
    - **UUID v4**: 128 random bits. No coordination; collisions are practically impossible. Downsides:\
    \ large and random, which hurts database index locality. UUID v7 adds a time prefix to fix ordering.\n\
    - **Database auto-increment / ticket server**: one counter hands out ids. Simple and dense, but a\
    \ single point of failure and a throughput limit. Fetching ranges (for example 1,000 at a time) helps.\n\
    - **Snowflake-style**: 64 bits = 1 sign bit + 41 bits milliseconds since a custom epoch (about 69\
    \ years) + 10 bits machine id (1,024 machines) + 12 bits sequence (4,096 ids per millisecond per machine).\n\
    \n## Example\n```python\nimport time\n\nclass Snowflake:\n    def __init__(self, machine_id, epoch_ms=1_600_000_000_000):\n\
    \        self.machine, self.epoch, self.last, self.seq = machine_id, epoch_ms, -1, 0\n\n    def next_id(self):\n\
    \        now = int(time.time() * 1000)\n        if now == self.last:\n            self.seq = (self.seq\
    \ + 1) & 0xFFF\n            if self.seq == 0:\n                while now <= self.last:\n         \
    \           now = int(time.time() * 1000)\n        else:\n            self.seq = 0\n        self.last\
    \ = now\n        return ((now - self.epoch) << 22) | (self.machine << 12) | self.seq\n\nprint(Snowflake(7).next_id())\n\
    ```\n\n## Common mistakes\n- Ignoring clock skew: if the clock moves backwards, a Snowflake generator\
    \ must wait or fail.\n- Assigning machine ids by hand without a registry, causing duplicates.\n- Exposing\
    \ sequential ids publicly, which leaks business volume.\n\n## In the interview\nAsk about required\
    \ size, ordering, and throughput. Compare the three options in a table, then pick Snowflake for sortable\
    \ 64-bit ids. Discuss clock skew and machine id assignment.\n"
