- id: kb-435e8a267974
  question: What are the main methods for scaling a system?
  answer: Scale vertically (bigger machines) and horizontally (more machines behind a load balancer, with
    stateless services). Reduce load with caching and CDNs, move slow work to queues, replicate and shard
    data, partition by function into services, and use autoscaling. Measure to find the actual bottleneck
    first.
  topic: system design
  tags:
  - scalability
  - caching
  - sharding
  - horizontal-scaling
  explanation: '## In plain words

    Scaling means handling more users without getting slower. You either make one machine stronger, add
    more machines, or make each request cheaper so the same machines go further.


    ## How it works

    - **Vertical scaling**: more CPU, RAM, or faster disks. Simple, but there is a ceiling and a single
    point of failure.

    - **Horizontal scaling**: more instances behind a load balancer. Needs **stateless** services (sessions
    in a shared store).

    - **Caching**: in-memory caches (Redis), HTTP caching, and CDNs for static and edge content.

    - **Asynchronous processing**: put slow tasks (emails, image processing) on a queue and let workers
    handle them; the request returns quickly.

    - **Database scaling**: indexes, read replicas, connection pooling, sharding, and choosing the right
    store for each workload.

    - **Functional decomposition**: split heavy domains into their own services so each scales independently.

    - **Autoscaling**: add and remove instances based on metrics.

    - **Geographic distribution**: multiple regions closer to users.

    - **Efficiency**: better algorithms, batching, compression, and pagination.


    ## Example

    1. An app serves 1,000 requests per second on 4 servers at 70% CPU.

    2. Traffic is expected to triple.

    3. Adding a cache for product pages with an 80% hit rate removes most database reads.

    4. Making servers stateless allows autoscaling from 4 to 12 instances.

    5. Image resizing moves to a queue, cutting request latency from 900 ms to 150 ms.


    ## Common mistakes

    - Adding servers without checking whether the database is the bottleneck.

    - Keeping sessions in server memory, which breaks horizontal scaling.

    - Premature sharding.


    ## In the interview

    List the methods, then show how you would choose: measure, find the bottleneck, apply the cheapest
    fix. Mention trade-offs: cache staleness, eventual consistency with queues, and operational cost.

    '
