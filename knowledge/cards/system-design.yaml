- id: kb-b9435cf3cadc
  question: How can snapshots be used in system design?
  answer: A snapshot is a point-in-time copy of state. Systems use them for backups and restores, to speed
    up recovery by replaying only the log after the last snapshot, to compact event or operation logs,
    to clone environments, and to give consistent reads (as in MVCC databases).
  topic: system design
  tags:
  - snapshots
  - backups
  - event-sourcing
  - recovery
  explanation: '## In plain words

    A snapshot is a photo of your data at one moment. If something breaks later, you can go back to the
    photo instead of rebuilding everything from scratch, and you only need to replay what happened after
    it was taken.


    ## How it works

    - **Backups**: disk or database snapshots taken on a schedule let you restore after corruption or
    deletion. Copy-on-write makes them fast: only blocks changed later are stored again.

    - **Log compaction**: in event sourcing or replicated logs (Raft), state = snapshot + log entries
    after it. Periodic snapshots let you delete old log entries and recover quickly.

    - **Consistent reads**: databases with MVCC give each transaction a snapshot of committed data, so
    long reports do not block writers.

    - **Collaboration tools**: documents store a snapshot every N operations so loading a document does
    not replay its whole history.

    - **Environments**: clone a production snapshot (anonymized) into staging for testing.


    ## Example

    1. A service rebuilds its state from 50 million events; replaying takes 40 minutes.

    2. It writes a snapshot every 100,000 events.

    3. On restart, it loads the latest snapshot (seconds) and replays at most 100,000 events (a few seconds).

    4. Events older than the last two snapshots move to cheap archive storage.


    ## Common mistakes

    - Taking a snapshot of a running database without making it consistent (no flush or freeze).

    - Never testing restores; an untested backup is not a backup.

    - Keeping snapshots in the same region or account as the data they protect.


    ## In the interview

    Name the use case first (backup, recovery speed, isolation). Discuss snapshot frequency vs recovery
    time (RTO) and data loss (RPO), storage cost, and consistency across several services.

    '
