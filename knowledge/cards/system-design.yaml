- id: kb-0b508771dfe9
  question: How would you design an online store, such as a bookstore?
  answer: Split it into catalog and search, cart, order, inventory, and payment services. Serve the read-heavy
    catalog from cache and a search index, reserve inventory when an order is placed, take payment with
    idempotency keys, and handle fulfilment and emails asynchronously through events.
  topic: system design
  tags:
  - e-commerce
  - inventory
  - payments
  - system-design-interview
  explanation: '## In plain words

    An online shop lets people browse products, put them in a cart, and pay. Browsing is huge and must
    be fast; checkout is small but must be correct, so you design those two paths differently.


    ## How it works

    - **Requirements**: browse and search, product pages, cart, checkout, order history, inventory, shipping
    updates.

    - **Catalog**: products in a relational database, cached and indexed in a search engine for full-text
    and filters. Images on a CDN.

    - **Cart**: per user, in a key-value store or the database; guest carts in a cookie or session.

    - **Checkout**: the order service creates an order, the inventory service **reserves** stock (decrement
    available count with a condition `available >= qty`), the payment service charges with an idempotency
    key. On failure, release the reservation.

    - **After payment**: publish an `OrderPaid` event; fulfilment, email, and analytics consume it asynchronously.

    - **Consistency**: use a database transaction where possible, or a saga (a series of steps with compensating
    actions) across services.


    ## Example

    1. 1 million daily visitors, 20 page views each: 20 million views, about 230 per second average, 2,000
    at peak.

    2. A 2% conversion is 20,000 orders a day, under 1 per second: one primary database handles orders
    easily.

    3. Two buyers want the last copy: the conditional decrement succeeds for one; the other sees "out
    of stock".


    ## Common mistakes

    - Microservices from day one for a small shop; a modular monolith is often better.

    - Decrementing stock when items enter the cart.

    - Sending emails inside the checkout transaction.


    ## In the interview

    Ask about scale and features first. Separate read and write paths, show the checkout sequence, and
    discuss overselling, flash sales, and how search stays in sync with the catalog.

    '
