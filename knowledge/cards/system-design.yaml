  prompt: 1f344914
- id: kb-6187000e356f
  question: What is the data layer in a system's architecture?
  answer: 'The data layer is the part of the system responsible for storing and retrieving data: the databases,
    caches, and file stores, plus the code that accesses them (repositories, data access objects, ORMs).
    It hides storage details from business logic behind clear interfaces.'
  topic: system design
  tags:
  - architecture
  - layers
  - databases
  - repository-pattern
  explanation: "## In plain words\nIn a layered application, the data layer is the bottom floor where\
    \ information is kept. The rest of the application asks it for data through a few well-defined doors\
    \ and does not need to know whether the data lives in PostgreSQL, Redis, or a file.\n\n## How it works\n\
    - **Typical layers**: presentation (UI or API handlers), business or domain logic, data layer.\n-\
    \ **Data layer parts**:\n  - Storage systems: relational databases, NoSQL stores, caches, object storage,\
    \ search indexes.\n  - Data access code: repositories or data access objects (DAOs) with methods like\
    \ `get_order(id)` and `save(order)`; ORMs; query builders.\n  - Concerns: connection pooling, transactions,\
    \ migrations, caching, retries.\n- **Why separate it**:\n  - Business logic stays testable (swap a\
    \ real repository for an in-memory fake).\n  - You can change storage technology or add caching in\
    \ one place.\n  - Data rules (validation, constraints, access control on rows) are enforced consistently.\n\
    - **At system scale**: the data layer may be a set of data services that own databases, with others\
    \ calling their APIs instead of reading tables directly.\n\n## Example\n```python\nclass OrderRepository:\n\
    \    def __init__(self, conn):\n        self.conn = conn\n\n    def get(self, order_id):\n       \
    \ row = self.conn.execute(\"SELECT id, total FROM orders WHERE id = ?\", (order_id,)).fetchone()\n\
    \        return {\"id\": row[0], \"total\": row[1]} if row else None\n\nimport sqlite3\nconn = sqlite3.connect(\"\
    :memory:\")\nconn.execute(\"CREATE TABLE orders (id INTEGER PRIMARY KEY, total INTEGER)\")\nconn.execute(\"\
    INSERT INTO orders VALUES (1, 4999)\")\nprint(OrderRepository(conn).get(1))  # {'id': 1, 'total':\
    \ 4999}\n```\nThe order service calls `repo.get(1)` and never writes SQL itself.\n\n## Common mistakes\n\
    - Business rules scattered inside SQL queries and controllers.\n- Several services reading and writing\
    \ the same tables directly, which couples them tightly.\n- Leaky abstractions that hide expensive\
    \ queries (N+1 problems through an ORM).\n\n## In the interview\nDescribe the layer's responsibilities,\
    \ the benefits of separation, and its scaling concerns: caching, replicas, sharding, and data ownership\
    \ between services.\n"
