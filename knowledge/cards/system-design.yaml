- id: kb-e57821cdf763
  question: How does a load balancer choose which server gets a request?
  answer: 'It first filters to healthy servers using health checks, then applies an algorithm: round robin
    or weighted round robin, least connections, least response time, random with two choices, or hashing
    (IP or consistent hashing) when the same client or key must reach the same server.'
  topic: system design
  tags:
  - load-balancing
  - algorithms
  - consistent-hashing
  explanation: '## In plain words

    A load balancer looks at the servers that are currently healthy and uses a simple rule to pick one,
    aiming to keep every server equally busy. Some rules ignore load and just take turns; others look
    at how busy each server is right now.


    ## How it works

    - **Round robin**: next server in order. Simple; good when requests and servers are similar.

    - **Weighted round robin**: bigger servers get proportionally more turns.

    - **Least connections**: send to the server with the fewest open connections; good for long or uneven
    requests.

    - **Least response time**: combine connections and measured latency.

    - **Power of two random choices**: pick two servers at random, send to the less loaded one. Nearly
    as good as checking all, with little coordination.

    - **IP hash / sticky sessions**: the same client always goes to the same server (useful for in-memory
    sessions, but uneven).

    - **Consistent hashing**: map servers and keys onto a ring; a key goes to the next server clockwise.
    Adding or removing a server moves only about 1/N of keys, which matters for caches.

    - **Health first**: every algorithm only considers servers that pass health checks.


    ## Example

    1. Three servers: A (8 cores), B (8 cores), C (16 cores). Weighted round robin with weights 1, 1,
    2 sends 25%, 25%, 50%.

    2. With least connections, if A holds 40 slow uploads and B holds 5, the next request goes to B.

    3. With consistent hashing for a cache tier of 10 nodes, removing one node remaps about 10% of keys,
    not almost all of them.


    ## Common mistakes

    - Using round robin when request costs vary a lot.

    - Sticky sessions that create hot servers; better to keep servers stateless.

    - Forgetting slow start: a newly added server gets flooded under least connections.


    ## In the interview

    Name two or three algorithms and when each fits. Mention health checks, L4 vs L7 balancing, and consistent
    hashing for stateful backends such as caches.

    '
