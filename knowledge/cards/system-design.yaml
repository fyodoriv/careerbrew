- id: kb-e4e10a15d8ad
  question: How would you design an inventory management system?
  answer: Track stock per item per location as an append-only ledger of movements plus a materialized
    on-hand count, reserve stock atomically for orders, and publish events so other systems stay in sync.
    Reconcile with physical counts and alert on low stock.
  topic: system design
  tags:
  - inventory
  - consistency
  - event-driven
  - system-design-interview
  explanation: '## In plain words

    Inventory management answers "how many of this item do we have, where, and how many are promised already?"
    It must stay correct while orders, deliveries, and returns change stock at the same time.


    ## How it works

    - **Requirements**: items (SKUs), warehouses, receive stock, reserve for orders, ship, return, transfer,
    reports, low-stock alerts.

    - **Data model**: `stock(sku, location, on_hand, reserved)` plus a `movements` ledger (`receive`,
    `reserve`, `ship`, `return`, `adjust`) with quantities and reasons. Available = on_hand - reserved.

    - **Reservation**: one atomic conditional update: `UPDATE stock SET reserved = reserved + :q WHERE
    sku = :s AND location = :l AND on_hand - reserved >= :q`. Zero rows updated means not enough stock.

    - **Shipping**: decrement both `on_hand` and `reserved`; record a movement.

    - **Events**: publish `StockChanged` so the storefront, search, and analytics update.

    - **Reconciliation**: physical counts create `adjust` movements; the ledger explains every change.

    - **Scale**: partition by SKU or location; hot items may need sharded counters.


    ## Example

    1. 1 million SKUs across 20 warehouses: 20 million stock rows, a few GB.

    2. 50,000 orders per hour with 3 lines each: about 40 reservation updates per second.

    3. A flash sale on one SKU: split its stock into 10 buckets and reserve from any bucket to spread
    lock contention.


    ## Common mistakes

    - Updating a single count without a history, so errors cannot be traced.

    - Read-then-write reservations that oversell.

    - Not expiring reservations from abandoned orders.


    ## In the interview

    Clarify single vs multi-warehouse and whether you must never oversell. Discuss the ledger, atomic
    reservation, eventual consistency with the storefront, and how to handle hot SKUs.

    '
