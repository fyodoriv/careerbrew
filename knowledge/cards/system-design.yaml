- id: kb-9fb565a239a8
  question: What is a fleet in system design and operations?
  answer: 'A fleet is a group of identical, interchangeable machines or instances (servers, containers,
    devices) that run the same service and are managed together: provisioned from one image, scaled as
    a group, deployed in waves, and monitored in aggregate rather than one by one.'
  topic: system design
  tags:
  - operations
  - infrastructure
  - autoscaling
  - deployments
  explanation: '## In plain words

    A fleet is a herd of identical workers. Instead of caring for each server by name, you manage the
    whole group: if one gets sick you replace it, and if work grows you add more. This is the "cattle,
    not pets" idea.


    ## How it works

    - **Identical members**: built from the same machine image or container image and configuration, so
    any one can serve any request.

    - **Group management**: an autoscaling group or orchestrator (Kubernetes deployment, cloud instance
    group) keeps the desired count, replaces unhealthy members, and scales on metrics such as CPU or queue
    length.

    - **Deployments**: roll out in waves (for example 1%, 10%, 50%, 100%) or blue/green, watching health
    metrics, so a bad build reaches only part of the fleet.

    - **Spread**: members across availability zones so one zone failure does not take the service down.

    - **Monitoring**: aggregate metrics for the fleet plus per-host outlier detection (one host with high
    errors is drained and replaced).

    - **Fleet operations**: patching operating systems, rotating certificates, and configuration changes
    are done as automated campaigns across the fleet.

    - The term is also used for device fleets (IoT sensors, delivery vehicles, employee laptops) managed
    centrally.


    ## Example

    1. A web service runs a fleet of 60 instances across 3 zones, 20 per zone.

    2. Traffic doubles in the evening; the autoscaler adds 40 instances when CPU stays above 65%.

    3. A new release goes to 6 instances first; their error rate rises, so the deploy halts and those
    6 roll back automatically.


    ## Common mistakes

    - Hand-configured "snowflake" servers that drift from the image.

    - Deploying to the whole fleet at once.

    - Storing state on instances, which makes them non-interchangeable.


    ## In the interview

    Use the word to show you think about operating many hosts: immutable images, health-based replacement,
    zone spread, and staged deploys.

    '
