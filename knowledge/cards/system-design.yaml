  question: How would you design a video platform like YouTube?
  answer: Upload raw video to object storage, transcode it asynchronously into several resolutions and
    small segments for adaptive bitrate streaming, and serve segments from a CDN. Store metadata in a
    database, and keep view counts, comments, and recommendations in separate services.
  topic: system design
  tags:
  - video
  - cdn
  - transcoding
  - system-design-interview
  explanation: '## In plain words

    YouTube stores huge video files once and streams them to millions of viewers on all kinds of networks.
    Each video is converted into many qualities and cut into small pieces, so the player can switch quality
    as the connection changes.


    ## How it works

    - **Requirements**: upload, watch, search, comments, view counts. Very read-heavy; smooth playback
    worldwide.

    - **Upload**: resumable upload to object storage; then a message triggers the **transcoding pipeline**.

    - **Transcoding**: a DAG of jobs splits the video, encodes each part into several resolutions and
    codecs in parallel, generates thumbnails, and writes **segments** of 2-10 seconds plus a manifest
    (HLS or DASH).

    - **Playback**: the player downloads the manifest, then segments from the nearest CDN edge, choosing
    quality based on bandwidth (**adaptive bitrate**).

    - **Metadata**: titles, owners, and stats in a sharded database; view counts aggregated in batches.

    - **Cost**: popular videos stay on CDN edges; rarely watched ones are served from origin or colder
    storage.


    ## Example

    1. 500 hours of video uploaded per minute.

    2. One hour of video at several qualities is about 3 GB, so storage grows by about 1.5 TB per minute.

    3. A 10-minute video split into 4-second segments is 150 segments per quality.


    ## Common mistakes

    - Serving the original file directly instead of segmented streams.

    - Transcoding synchronously during upload.

    - Counting views with one database row update per view.


    ## In the interview

    Separate the upload path from the watch path. Discuss CDN cost, storage tiers for the long tail, transcoding
    parallelism, and how you would deduplicate or moderate uploads.

