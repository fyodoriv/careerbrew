    \ to your servers even on bad networks, and storing it so it can be played or analysed later. Sending\
    \ small pieces as you go means a crash loses seconds, not the whole recording.\n\n## How it works\n\
    - **Capture**: the browser (MediaRecorder API) or mobile app records in a compressed format such as\
    \ Opus or AAC (around 32-64 kbps for speech).\n- **Transport**:\n  - Chunked upload: every few seconds,\
    \ upload a chunk with a sequence number; retry failures; finalize at the end.\n  - Live streaming:\
    \ WebSocket or WebRTC when the server must process audio in real time (live captions).\n- **Storage**:\
    \ chunks or the assembled file in object storage; metadata (owner, duration, codec, status) in a database.\n\
    - **Processing**: a queue triggers workers to merge chunks, normalize volume, transcode to a playback\
