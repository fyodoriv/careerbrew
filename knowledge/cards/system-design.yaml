- id: kb-a859e789aa2f
  question: How would you design a document storage and retrieval system?
  answer: Store document contents in object storage and metadata (owner, name, version, tags, permissions)
    in a database. Upload and download through pre-signed URLs, index text in a search engine for retrieval,
    and add versioning, access control, and caching or a CDN for hot documents.
  topic: system design
  tags:
  - object-storage
  - metadata
  - search
  - system-design-interview
  explanation: '## In plain words

    A document system keeps files and lets people find them again. The key idea is to split the heavy
    bytes (stored cheaply in object storage) from the small facts about each file (stored in a database
    you can query and search).


    ## How it works

    - **Requirements**: upload, download, list, search by name and content, versions, sharing and permissions.
    Durability matters most.

    - **Content**: object storage (S3-like) keyed by a generated id, with replication across zones. Upload
    and download with pre-signed URLs so bytes skip the app servers.

    - **Metadata**: a relational database with documents, versions, owners, and access rules. A new version
    adds a row and a new object; old ones stay for history.

    - **Search**: after upload, a queue worker extracts text (and runs OCR for scans) and indexes it in
    a search engine such as Elasticsearch, along with permissions so results are filtered.

    - **Access control**: every request checks the metadata service; links can be time-limited.

    - **Lifecycle**: move old versions to colder storage tiers.


    ## Example

    1. 10 million documents a day at 500 KB average: about 5 TB a day.

    2. Metadata is about 1 KB per document: 10 GB a day, fine for a sharded SQL database.

    3. A user searches "invoice 2024"; the search index returns ids, and the metadata service checks permissions
    before showing them.


    ## Common mistakes

    - Storing blobs in the relational database.

    - Indexing search synchronously in the upload request.

    - Forgetting permission filtering in search results, which leaks documents.


    ## In the interview

    Clarify document sizes, read/write ratio, and search needs. Discuss consistency between the metadata
    row and the object (write object first, then metadata), virus scanning, and retention or legal hold.

    '
