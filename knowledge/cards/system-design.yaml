- id: kb-0bc34605363c
  question: What is the cache-aside pattern?
  answer: In cache-aside (lazy loading), the application checks the cache first; on a miss it reads from
    the database, stores the result in the cache with a TTL, and returns it. On writes it updates the
    database and deletes (invalidates) the cache entry so the next read reloads fresh data.
  topic: system design
  tags:
  - caching
  - cache-aside
  - redis
  - consistency
  explanation: "## In plain words\nCache-aside means the application is in charge of the cache. It looks\
    \ in the fast cache first and only goes to the slower database when the data is not there, saving\
    \ a copy for next time.\n\n## How it works\n- **Read**:\n  1. Look up the key in the cache.\n  2.\
    \ Hit: return it.\n  3. Miss: read from the database, write it into the cache with a TTL, return it.\n\
    - **Write**: update the database, then **delete** the cache key (rather than updating it, which avoids\
    \ races that leave stale values).\n- **TTL**: a time-to-live limits how long stale data can survive\
    \ if an invalidation is missed.\n- **Pros**: only requested data is cached; the cache can fail without\
    \ losing data; simple.\n- **Cons**: the first request after a miss is slow; short windows of stale\
    \ data; a hot key expiring can cause a **stampede** of database reads.\n- **Stampede fixes**: a lock\
    \ so only one request reloads, early refresh before expiry, or random jitter on TTLs.\n\n## Example\n\
    ```python\nimport json\n\ndef get_user(user_id, cache, db, ttl=300):\n    key = f\"user:{user_id}\"\
    \n    cached = cache.get(key)\n    if cached is not None:\n        return json.loads(cached)\n   \
    \ user = db.fetch_user(user_id)\n    if user is not None:\n        cache.set(key, json.dumps(user),\
    \ ex=ttl)\n    return user\n\ndef update_user(user_id, fields, cache, db):\n    db.update_user(user_id,\
    \ fields)\n    cache.delete(f\"user:{user_id}\")\n```\nWith a 95% hit rate, a database that handled\
    \ 10,000 reads per second now sees about 500.\n\n## Common mistakes\n- Updating the cache before the\
    \ database, so a failed write leaves wrong data cached.\n- No TTL, so missed invalidations live forever.\n\
    - Caching \"not found\" results without a short TTL, or not caching them at all and getting hammered\
    \ by lookups for missing keys.\n\n## In the interview\nWalk through read and write paths, explain\
    \ why you delete rather than update on write, and cover TTLs, stampedes, and when you would choose\
    \ write-through instead.\n"
  match:
  - b10aed8b819d
