- id: kb-ed31bfcf98b7
  question: How would you design a reservation and payment system for a parking garage?
  answer: Model garages, spots by type, and reservations with time ranges; prevent double booking with
    a database constraint or transactional check on overlapping times; take payment with an idempotent
    call to a payment processor; and let entry gates verify reservations by plate or QR code.
  topic: system design
  tags:
  - booking
  - payments
  - concurrency
  - system-design-interview
  explanation: '## In plain words

    Drivers book a parking spot for a time window and pay in advance. The system must never give one spot
    to two cars at the same time, and the gate must know who is allowed in.


    ## How it works

    - **Requirements**: search availability by garage and time, reserve, pay, cancel and refund, enter
    and exit. Consistency for bookings; modest scale.

    - **Data model**: `garages`, `spots(id, garage_id, type)`, `reservations(id, spot_id, user_id, start,
    end, status)`, `payments`.

    - **Availability**: a spot is free if no active reservation overlaps the window: `start < requested_end
    AND end > requested_start`.

    - **No double booking**: in PostgreSQL, an exclusion constraint on `(spot_id, time range)` rejects
    overlaps. Otherwise lock the spot row (`SELECT ... FOR UPDATE`) inside the transaction.

    - **Flow**: create reservation as `PENDING` with a short hold, call the processor with an idempotency
    key, mark `CONFIRMED` on success, release on failure or timeout.

    - **Gate**: a camera reads the plate or the driver scans a QR code; the gate service checks for a
    confirmed reservation; overstays are charged on exit.

    - **Pricing**: by hour, spot type, and demand.


    ## Example

    1. A city has 200 garages with 500 spots each: 100,000 spots.

    2. 3 reservations per spot per day: 300,000 per day, about 4 per second, so one relational database
    is enough.

    3. Two users try to book spot 42 from 9:00 to 11:00; the exclusion constraint accepts one insert and
    rejects the other.


    ## Common mistakes

    - Checking availability and inserting in separate transactions.

    - Booking a specific spot when booking a spot type in a garage would be more flexible.

    - Forgetting no-shows, overstays, and refunds.


    ## In the interview

    Show the overlap query and how you enforce it. Mention idempotent payments, gate offline mode (cache
    today''s reservations locally), and reporting.

    '
