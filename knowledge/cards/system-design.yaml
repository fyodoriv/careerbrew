- id: kb-beb63d0b59d9
  question: What is the difference between OAuth 1.0 and OAuth 2.0?
  answer: OAuth 1.0 required each request to be cryptographically signed with shared secrets, which was
    secure without HTTPS but complex to implement. OAuth 2.0 relies on TLS and bearer tokens, splits roles
    into an authorization server and a resource server, and defines several grant types (flows) for web,
    mobile, and machine clients. It is simpler but depends on correct configuration.
  topic: system design
  tags:
  - oauth
  - security
  - authorization
  - api
  explanation: "## In plain words\nBoth versions let an app act on your behalf at another service without\
    \ getting your password. OAuth 1.0 made every request carry a signature; OAuth 2.0 trusts HTTPS to\
    \ protect tokens and is much easier to use, which is why almost everyone uses 2.0 today.\n\n## How\
    \ it works\n- **OAuth 1.0 / 1.0a**:\n  - Every API request signed with HMAC using the client secret\
    \ and token secret.\n  - Worked even over plain HTTP; replay protection via nonces and timestamps.\n\
    \  - Hard to implement correctly (exact parameter ordering and encoding for signatures).\n  - One\
    \ main flow, awkward for mobile and single-page apps.\n- **OAuth 2.0**:\n  - **Bearer tokens**: whoever\
    \ holds the token can use it, so HTTPS is mandatory.\n  - Separate **authorization server** (issues\
    \ tokens) and **resource server** (the API).\n  - Short-lived access tokens plus **refresh tokens**.\n\
    \  - **Grant types**: authorization code (with PKCE for mobile and browser apps), client credentials\
    \ (service to service), device code (TVs), refresh token. Implicit and password grants are now discouraged.\n\
    \  - **Scopes** limit what a token can do.\n  - Extensions: OpenID Connect adds login identity on\
    \ top; OAuth 2.1 consolidates best practices.\n\n## Example\n1. A photo-printing app wants to read\
    \ your cloud photos.\n2. With OAuth 2.0, it redirects you to the photo service's authorization server\
    \ with `scope=photos.read` and a PKCE challenge.\n3. You approve; the app receives a code, exchanges\
    \ it (with the PKCE verifier) for an access token valid one hour, and calls the photo API with `Authorization:\
    \ Bearer <token>`.\n4. With OAuth 1.0, each of those API calls would also need a computed signature.\n\
    \n## Common mistakes\n- Saying OAuth 2.0 is an authentication protocol; it is authorization. OpenID\
    \ Connect handles authentication.\n- Using the implicit flow or skipping PKCE in public clients.\n\
    - Storing bearer tokens insecurely, since they are as good as keys.\n\n## In the interview\nSummarize:\
    \ signatures vs bearer tokens over TLS, one flow vs many grant types, and the separation of servers.\
    \ Mention PKCE, scopes, refresh tokens, and OpenID Connect.\n"
