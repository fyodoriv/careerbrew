- id: kb-4e02b4c8a066
  question: How would you design a payment system for buying digital books?
  answer: Separate the order service from a payment service that talks to an external payment processor.
    Use idempotency keys, a double-entry ledger, and a state machine per payment, deliver the book only
    after payment is confirmed, and reconcile daily with the processor.
  topic: system design
  tags:
  - payments
  - idempotency
  - ledger
  - system-design-interview
  explanation: '## In plain words

    A payment system moves money exactly once and keeps a record you can trust. The hard part is not charging
    a card; it is staying correct when networks fail, users click twice, or the processor answers late.


    ## How it works

    - **Requirements**: buy a book in one click, saved cards, refunds, receipts, purchase history. Non-functional:
    never double charge, never lose a payment, high availability, compliance (card data stays with a tokenizing
    processor, so you stay out of most PCI scope).

    - **Components**: catalog, order service, payment service, external processor (Stripe-like), ledger
    database, entitlement service (who owns which book), notification service.

    - **Flow**: client sends a purchase with an **idempotency key** (a unique id per attempt). Order is
    created as `PENDING`. Payment service calls the processor with the same key. On success, write ledger
    entries and move the order to `PAID`, then grant the entitlement and deliver the book.

    - **Correctness**: a payment state machine (`CREATED -> AUTHORIZED -> CAPTURED`, then optionally `REFUNDED`;
    `CREATED` or `AUTHORIZED` can move to `FAILED` or `CANCELED`), a **double-entry ledger** (every movement
    is a debit and a credit that sum to zero), processor **webhooks** for async results, retries with
    backoff, and a daily **reconciliation** job.


    ## Example

    1. 10 million purchases a day is about 115 per second on average, maybe 1,000 at peak. A relational
    database handles that.

    2. Each ledger row is about 200 bytes; two rows per purchase is about 4 GB per day, roughly 1.5 TB
    per year, so plan partitioning and archiving of old ledger data.

    3. User double-clicks: both requests carry the same idempotency key, so the second returns the first
    result.


    ## Common mistakes

    - Using floats for money instead of integer minor units (cents).

    - No idempotency, so retries cause double charges.

    - Granting the book before the payment is confirmed, or never granting it if the webhook is lost.


    ## In the interview

    Clarify scope first (one-time purchases vs subscriptions, currencies). Stress consistency over availability
    for the ledger. Expect follow-ups on refunds, partial failures, fraud checks, and how reconciliation
    finds mismatches.

    '
