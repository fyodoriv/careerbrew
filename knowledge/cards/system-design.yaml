- id: kb-2460f4b35313
  question: What is a data warehouse?
  answer: 'A data warehouse is a central database optimized for analytics: it collects data from many
    operational systems through ETL or ELT pipelines, stores history in a structured, query-friendly model
    (often star schemas), and uses columnar storage so large aggregate queries are fast. Examples include
    Snowflake, BigQuery, and Redshift.'
  topic: system design
  tags:
  - data-warehouse
  - analytics
  - etl
  - olap
  explanation: '## In plain words

    Your app''s database is built to handle many small, fast transactions. A data warehouse is a separate
    place where copies of data from all your systems are gathered so analysts can ask big questions, like
    "revenue per country per month for five years", without slowing the app down.


    ## How it works

    - **OLTP vs OLAP**: operational databases serve OLTP (online transaction processing: many small reads
    and writes). Warehouses serve OLAP (online analytical processing: few, large scans and aggregations).

    - **Ingestion**: ETL (extract, transform, load) or, more commonly now, ELT (load raw data, then transform
    inside the warehouse with SQL tools). Batch or streaming.

    - **Modelling**: **star schema** with **fact tables** (events or transactions, such as order lines)
    and **dimension tables** (descriptions, such as customers, products, dates).

    - **Storage**: **columnar** format, so a query reading 3 of 50 columns reads only those, plus heavy
    compression. Massively parallel processing splits queries across nodes. Many separate storage and
    compute.

    - **History**: keeps past states (slowly changing dimensions), unlike operational tables that overwrite.

    - **Related**: data lake (cheap raw files of any format), lakehouse (warehouse features on lake storage),
    data marts (subject-specific subsets).


    ## Example

    1. A shop''s orders database has 500 million order lines.

    2. Nightly ELT copies new rows into the warehouse''s `fact_order_line` table, joined with `dim_product`
    and `dim_date`.

    3. An analyst runs `SELECT country, month, SUM(revenue)` across five years.

    4. Because it scans only three compressed columns in parallel, it returns in seconds and the app database
    is untouched.


    ## Common mistakes

    - Running analytics queries on the production database.

    - Copying data without a clear model, creating a "data swamp".

    - Ignoring data quality checks and freshness monitoring in pipelines.


    ## In the interview

    Contrast OLTP and OLAP, explain columnar storage and star schemas, and cover ingestion choices (batch
    vs streaming, ETL vs ELT) and freshness requirements.

    '
