  explanation: '## In plain words

    A crawler starts with a few web addresses, downloads each page, finds the links on it, and adds new
    ones to a to-do list. Repeated across many machines, this discovers billions of pages, but it must
    be polite to websites and avoid fetching the same thing twice.


    ## How it works

    - **URL frontier**: a prioritized queue of URLs to fetch, split per host so each host is fetched at
    a polite rate (for example one request per second).

    - **Fetchers**: download pages with timeouts; cache DNS lookups; obey `robots.txt` and crawl delays.

    - **Parser**: extract links and text; normalize URLs (lower-case host, remove fragments, resolve relative
    paths).

    - **Dedup**: a "seen URLs" set (a Bloom filter or a key-value store) prevents re-queuing; a content
    hash (or SimHash for near duplicates) avoids storing mirrors.

    - **Storage**: raw pages in object storage; metadata (URL, fetch time, status, hash) in a database.

    - **Recrawl**: schedule revisits based on how often a page changes.

    - **Traps**: limit URL length and depth per host to avoid infinite calendars or session-id loops.


    ## Example

    1. Goal: 1 billion pages per month: about 400 pages per second.

    2. 100 KB per page: 100 TB per month of raw storage before compression.

    3. With 1-second politeness per host, you need many hosts in parallel: the frontier keeps thousands
    of per-host queues active.


    ## Common mistakes

    - Ignoring robots.txt or hammering one host.

    - No URL normalization, so the same page is fetched many times.

    - A single global queue that lets one big site starve others.


    ## In the interview

    Ask about scale, freshness, and content types. Draw frontier, fetchers, parser, dedup, and storage.
    Discuss politeness, prioritization, traps, and distributing hosts across workers by hashing the hostname.

    '
