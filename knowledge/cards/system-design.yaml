- id: kb-01534cb1e6c1
  question: What is availability in system design?
  answer: 'Availability is the fraction of time a system is working and able to serve requests, often
    written in nines: 99.9% allows about 8.8 hours of downtime per year and 99.99% about 53 minutes. It
    is improved by removing single points of failure through redundancy, failover, health checks, and
    spreading across zones and regions.'
  topic: system design
  tags:
  - availability
  - reliability
  - sla
  - high-availability
  explanation: "## In plain words\nAvailability answers \"when a user tries to use the service, does it\
    \ work?\" A service that is down 1 hour a month is less available than one that is down 1 minute a\
    \ month. Each extra \"nine\" is roughly ten times harder to achieve.\n\n## How it works\n- **Measure**:\
    \ uptime / total time, or successful requests / total requests (the request-based view counts partial\
    \ outages better).\n- **Nines**:\n  - 99% is about 3.65 days of downtime per year.\n  - 99.9% is about\
    \ 8.8 hours.\n  - 99.99% is about 53 minutes.\n  - 99.999% is about 5 minutes.\n- **Dependencies multiply**:\
    \ if a request needs three services each at 99.9%, the combined availability is about 0.999^3, which\
    \ is 99.7%.\n- **Redundancy adds**: two independent replicas each at 99% give about 1 - 0.01^2 = 99.99%,\
    \ if failover works and failures are independent.\n- **Techniques**: no single points of failure,\
    \ load balancing, replication, automatic failover, multiple zones and regions, graceful degradation\
    \ (serve cached or partial results), timeouts, retries, and circuit breakers, safe deploys with quick\
    \ rollback.\n- **SLA, SLO, SLI**: the SLI is the measurement, the SLO the internal target, and the\
    \ SLA the contractual promise with penalties.\n- **Trade-off**: CAP shows that during network partitions,\
    \ strict consistency can cost availability.\n\n## Example\n1. A checkout flow calls an API (99.95%),\
    \ a database (99.99%), and a payment provider (99.9%).\n2. Combined: 0.9995 x 0.9999 x 0.999 is about\
    \ 99.84%, roughly 14 hours of downtime a year.\n3. Adding a fallback payment provider raises the payment\
    \ step to about 99.9999%, lifting the whole flow to about 99.94%.\n\n## Common mistakes\n- Promising\
    \ more nines than your dependencies allow.\n- Forgetting planned maintenance and partial outages.\n\
    - Redundant components that share one hidden dependency (same power, same config push).\n\n## In the\
    \ interview\nDefine it with numbers, show the serial and parallel math, and list techniques. Connect\
    \ it to SLOs, error budgets, and the cost of each extra nine.\n"
