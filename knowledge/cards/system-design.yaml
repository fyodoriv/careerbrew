- id: kb-7bb24dfba68c
  question: What is a heartbeat in distributed systems?
  answer: A heartbeat is a small periodic message a node sends to show it is alive. If a monitor or peer
    misses several heartbeats within a timeout, it suspects the node has failed and reacts, for example
    by removing it from a load balancer, electing a new leader, or reassigning its work.
  topic: system design
  tags:
  - distributed-systems
  - failure-detection
  - health-checks
  - leader-election
  explanation: "## In plain words\nA heartbeat is a regular \"I'm still here\" signal, like a pulse. When\
    \ the signal stops for long enough, the rest of the system assumes that node is gone and moves its\
    \ work elsewhere.\n\n## How it works\n- **Push**: each node sends a heartbeat every interval (for\
    \ example every 1 second) to a coordinator or to peers.\n- **Pull**: a monitor polls each node's health\
    \ endpoint instead.\n- **Timeout**: after several missed heartbeats (for example 3-5 intervals), the\
    \ node is marked suspect or dead. A short timeout detects failures fast but causes false alarms during\
    \ brief network glitches or garbage collection pauses; a long one is safer but slower.\n- **Uses**:\n\
    \  - Leader election (Raft followers start an election if the leader's heartbeats stop).\n  - Cluster\
    \ membership (Kafka consumers, Kubernetes nodes).\n  - Load balancer health.\n  - Distributed locks\
    \ and leases (the holder must renew before expiry).\n- **Gossip protocols**: nodes share heartbeat\
    \ counters with random peers, so membership spreads without a central coordinator.\n- **Adaptive detectors**:\
    \ the phi accrual detector adjusts suspicion based on observed delays.\n\n## Example\n1. A cluster\
    \ leader sends heartbeats every 150 ms.\n2. Followers use an election timeout randomly chosen between\
    \ 300 and 600 ms.\n3. The leader's machine freezes; after about 400 ms one follower times out first,\
    \ starts an election, wins, and starts sending its own heartbeats.\n4. When the old leader recovers,\
    \ it sees a higher term number and steps down.\n\n## Common mistakes\n- Treating a missed heartbeat\
    \ as certain death; it may be a slow network (a \"zombie\" node). Use leases and fencing tokens so\
    \ a paused old leader cannot keep writing.\n- Timeouts shorter than normal pause times.\n- Sending\
    \ heartbeats on a different path than real traffic, hiding real failures.\n\n## In the interview\n\
    Explain the interval and timeout trade-off, give a use (leader election or membership), and mention\
    \ false positives and how fencing protects against them.\n"
