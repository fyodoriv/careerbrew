- id: kb-b7650b59665a
  question: What is the MTTR metric?
  answer: 'MTTR usually means mean time to recover (or restore): the average time from when an incident
    starts or is detected until service is working again. Some teams use it for mean time to repair or
    resolve, which can include the full fix, so define it clearly. It is lowered by fast rollbacks, runbooks,
    automation, and good observability.'
  topic: system design
  tags:
  - incident-response
  - metrics
  - reliability
  - dora
  explanation: "## In plain words\nMTTR measures how quickly you get things working again after something\
    \ breaks. Failures will happen; teams that recover in minutes rather than hours keep users happy,\
    \ so MTTR is one of the most useful reliability numbers.\n\n## How it works\n- **Formula**: MTTR =\
    \ total downtime across incidents / number of incidents.\n- **Variants**: the R can mean recover,\
    \ restore, repair, respond, or resolve. \"Recover\" usually stops when users are no longer affected;\
    \ \"resolve\" can include the permanent fix. Pick one and state it.\n- **Breakdown**: detect (MTTD),\
    \ acknowledge (MTTA), diagnose, mitigate. Measuring each step shows where time goes.\n- **DORA metrics**:\
    \ failed deployment recovery time (earlier called time to restore service) is one of DORA's key software\
    \ delivery metrics, alongside deployment frequency, lead time for changes, and change failure rate.\n\
    - **Ways to lower it**:\n  - One-click rollbacks and feature flags to disable a change.\n  - Runbooks\
    \ linked from alerts.\n  - Automated failover.\n  - Good dashboards, traces, and logs.\n  - Clear\
    \ on-call roles and incident commander practice.\n  - Small, frequent deploys, so the bad change is\
    \ easy to find.\n\n## Example\nThree outages last month lasted 12, 30, and 90 minutes from start to\
    \ recovery.\n1. MTTR = (12 + 30 + 90) / 3 = 44 minutes.\n2. The 90-minute incident spent 60 minutes\
    \ on diagnosis because a database failover had no runbook.\n3. After adding automated failover and\
    \ a runbook, a similar incident takes 8 minutes.\n\n## Common mistakes\n- Mixing definitions across\
    \ teams so numbers cannot be compared.\n- Focusing only on preventing failures (MTBF) while recovery\
    \ stays slow.\n- Letting one huge outage hide in an average; report the distribution too.\n\n## In\
    \ the interview\nDefine which MTTR you mean, connect it to MTTD and DORA, and give practical levers.\
    \ Strong answers stress \"mitigate first, root-cause later\".\n"
