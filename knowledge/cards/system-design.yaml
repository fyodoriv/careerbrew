- id: kb-8cedf9df1c47
  question: What techniques resolve conflicts from concurrent edits?
  answer: Options include last-writer-wins by timestamp, optimistic locking that rejects stale writes,
    manual merge by the user, three-way merge against a common ancestor, operational transformation, and
    CRDTs that merge automatically. Version vectors detect true concurrency so you know when merging is
    needed.
  topic: system design
  tags:
  - concurrency
  - crdt
  - operational-transformation
  - distributed-systems
  explanation: '## In plain words

    When two people change the same thing at the same time, the system must decide what the result is.
    Some approaches pick a winner, some ask a human, and some merge both changes automatically.


    ## How it works

    - **Detect the conflict**: a version number or ETag shows a write is based on stale data; **version
    vectors** (one counter per replica) tell whether two versions are concurrent or one came after the
    other.

    - **Last-writer-wins (LWW)**: keep the write with the latest timestamp. Simple, but silently drops
    data and depends on clocks.

    - **Reject and retry (optimistic locking)**: the second writer gets a conflict error and must reload.

    - **Manual merge**: keep both versions and show them to the user (like a "conflicted copy").

    - **Three-way merge**: compare both versions with their common ancestor; non-overlapping changes combine
    automatically (how Git works).

    - **Operational transformation (OT)**: adjust each operation against concurrent ones so they apply
    cleanly; needs a central ordering server in practice.

    - **CRDTs**: data types designed so concurrent updates always merge to the same result, such as counters,
    sets, and sequences for text.

    - **Field-level merge**: treat each field separately, so edits to different fields both survive.


    ## Example

    1. Profile `{name: "Ann", city: "Oslo"}` at version 5.

    2. Phone sets `city: "Bergen"`; laptop, offline, sets `name: "Anna"`. Both based on version 5.

    3. LWW on the whole record loses one change.

    4. Field-level merge gives `{name: "Anna", city: "Bergen"}`.

    5. If both changed `city`, the app needs a rule: LWW for that field, or ask the user.


    ## Common mistakes

    - Defaulting to LWW for data users care about.

    - Trusting device clocks for ordering.

    - Thinking CRDTs remove all semantic conflicts (two people can still write contradictory text).


    ## In the interview

    Ask how often conflicts happen and how costly data loss is. Match the technique to the data: LWW for
    presence, optimistic locking for records, OT or CRDTs for text, manual merge for files.

    '
