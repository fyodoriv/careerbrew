  question: How would you design a tic-tac-toe game?
  answer: Model a Board (3x3 grid), Players with symbols, and a Game that validates moves, alternates
    turns, and checks for a win or draw after each move. Keep the game logic independent of the UI, and
    for an online version store game state on the server and push moves to both players.
  topic: system design
  tags:
  - object-oriented-design
  - game
  - low-level-design
  explanation: "## In plain words\nTic-tac-toe is a small object-oriented design question. The interviewer\
    \ wants to see clean separation: a board that holds marks, a game that enforces the rules, and a winner\
    \ check that is simple and correct.\n\n## How it works\n- **Classes**: `Board` (grid, place a mark,\
    \ is full), `Player` (name, symbol), `Game` (current player, status, `play(row, col)`).\n- **Rules**:\
    \ a move must be inside the grid, on an empty cell, by the current player, while the game is in progress.\n\
    - **Win check**: after a move, check only the row, column, and diagonals through that cell. For an\
    \ N x N board, keep counters per row, column, and diagonal for O(1) checks.\n- **Status**: `IN_PROGRESS`,\
    \ `X_WON`, `O_WON`, `DRAW`.\n- **Extensions**: N x N board, K in a row to win, AI opponent (minimax),\
    \ undo, online play with a server holding the state and WebSockets pushing moves.\n\n## Example\n\
    ```python\nclass Game:\n    def __init__(self, n=3):\n        self.n, self.board, self.turn, self.status\
    \ = n, [[None] * n for _ in range(n)], \"X\", \"IN_PROGRESS\"\n\n    def play(self, r, c):\n     \
    \   if self.status != \"IN_PROGRESS\" or self.board[r][c] is not None:\n            raise ValueError(\"\
    invalid move\")\n        self.board[r][c] = self.turn\n        b, p, n = self.board, self.turn, self.n\n\
    \        lines = [b[r], [b[i][c] for i in range(n)], [b[i][i] for i in range(n)], [b[i][n - 1 - i]\
    \ for i in range(n)]]\n        if any(all(x == p for x in line) for line in lines):\n            self.status\
    \ = p + \"_WON\"\n        elif all(x is not None for row in b for x in row):\n            self.status\
    \ = \"DRAW\"\n        self.turn = \"O\" if p == \"X\" else \"X\"\n        return self.status\n\ng\
    \ = Game()\nfor m in [(0, 0), (1, 0), (0, 1), (1, 1), (0, 2)]:\n    print(g.play(*m))  # last line:\
    \ X_WON\n```\nEach move check is O(n) time; the board uses O(n^2) space.\n\n## Common mistakes\n-\
    \ Checking the whole board for every possible line after each move.\n- Mixing input and printing code\
    \ into the game rules.\n- Accepting moves after the game has already been won.\n\n## In the interview\n\
    Clarify size and features, sketch classes, write the move and win logic, then discuss extensions:\
    \ larger boards, an AI with minimax, and online multiplayer.\n"
