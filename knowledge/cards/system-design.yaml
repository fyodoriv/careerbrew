- id: kb-e1958de44d2e
  question: How would you design file upload and download to cloud storage?
  answer: Let clients upload directly to object storage using short-lived pre-signed URLs, with multipart
    and resumable uploads for large files, then record metadata after the upload is confirmed. Serve downloads
    through pre-signed URLs or a CDN, and run virus scanning and processing asynchronously.
  topic: system design
  tags:
  - object-storage
  - uploads
  - cdn
  - presigned-url
  explanation: '## In plain words

    Big files should not pass through your application servers. Instead, your server gives the client
    a temporary signed permission slip, and the client talks to the storage service directly. Your server
    only keeps track of what was uploaded.


    ## How it works

    - **Upload request**: client asks the API for an upload; the API checks permissions and size limits,
    creates a metadata row with status `PENDING`, and returns a **pre-signed URL** valid for a few minutes.

    - **Transfer**: client PUTs the bytes to object storage. For large files, use **multipart upload**:
    split into parts (for example 8-100 MB), upload in parallel, retry failed parts, then complete.

    - **Confirm**: storage sends an event (or the client calls back); the API marks the file `UPLOADED`,
    checks size and checksum, and queues scanning or thumbnail jobs.

    - **Download**: the API checks access and returns a short-lived pre-signed GET URL, or serves public
    files through a CDN.

    - **Lifecycle**: delete abandoned multipart uploads and pending rows; move old files to colder tiers.


    ## Example

    1. A user uploads a 2 GB video over mobile.

    2. The client splits it into 20 parts of 100 MB and uploads 4 at a time.

    3. The connection drops after part 13; on resume, the client lists finished parts and uploads only
    parts 14 to 20.

    4. The app servers handled only three small JSON requests.


    ## Common mistakes

    - Streaming uploads through app servers, which wastes bandwidth and memory.

    - Trusting the client''s file type and size; verify after upload.

    - Long-lived or reusable signed URLs.


    ## In the interview

    Draw the three-step flow (request, direct upload, confirm). Discuss resumability, checksums, malware
    scanning, quotas, and CDN caching with access control for private files.

    '
