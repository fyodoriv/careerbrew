- id: kb-ef5064abeedc
  question: How do you design a good API?
  answer: Start from the clients' use cases, model resources with consistent names, use HTTP methods and
    status codes correctly, and define requests, responses, and errors in a spec such as OpenAPI. Plan
    for pagination, filtering, versioning, idempotency, authentication, rate limits, and backward compatibility.
  topic: system design
  tags:
  - api-design
  - rest
  - http
  - versioning
  explanation: '## In plain words

    An API is a contract other people build on, so changing it later is expensive. A good API is predictable:
    once you learn one endpoint, you can guess how the others work.


    ## How it works

    - **Use cases first**: list what clients need to do, then design resources (nouns) such as `/orders`
    and `/orders/{id}/items`.

    - **HTTP semantics**: `GET` reads (safe), `POST` creates, `PUT` replaces, `PATCH` updates part, `DELETE`
    removes. Return correct codes: 200, 201, 204, 400, 401, 403, 404, 409, 429, 500.

    - **Consistent shapes**: same naming style, same error format (code, message, details), ISO 8601 timestamps,
    money in minor units with currency.

    - **Lists**: pagination (cursor-based for large data), filtering, sorting, and a maximum page size.

    - **Safety**: authentication (OAuth 2.0 tokens), authorization per resource, rate limits, input validation.

    - **Reliability**: `Idempotency-Key` for POSTs that create payments or orders; ETags for caching and
    concurrency control.

    - **Evolution**: additive changes only within a version; version in the path or header; deprecate
    with notice.

    - **Documentation**: an OpenAPI spec with examples, generated SDKs.


    ## Example

    ```http

    POST /v1/orders

    Idempotency-Key: 7f1c...

    {"items": [{"sku": "BOOK-1", "qty": 2}]}


    201 Created

    Location: /v1/orders/ord_123

    {"id": "ord_123", "status": "pending", "total": {"amount": 3998, "currency": "USD"}}

    ```


    ## Common mistakes

    - Verbs in URLs (`/getOrders`) and inconsistent naming.

    - Returning 200 with an error in the body.

    - Breaking changes without a new version.

    - Offset pagination on huge, fast-changing tables.


    ## In the interview

    Walk through resources, endpoints, request and response examples, and errors. Mention REST vs GraphQL
    vs gRPC trade-offs, and how you would keep old clients working.

    '
