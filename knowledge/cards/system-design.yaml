- id: kb-af0491df4060
  question: How would you build a system to run A/B tests on a landing page?
  answer: Assign each visitor to a variant deterministically (hash of a stable user or cookie id with
    the experiment id), serve the variant, log exposure and conversion events, and analyse results with
    a pre-chosen metric, sample size, and statistical test. Manage experiments with config or feature
    flags.
  topic: system design
  tags:
  - experimentation
  - ab-testing
  - feature-flags
  - analytics
  explanation: '## In plain words

    An A/B test shows two versions of a page to random groups of visitors and measures which one gets
    more sign-ups. The system must split traffic fairly, keep each visitor in the same group, and record
    what happened so the result can be trusted.


    ## How it works

    - **Experiment config**: id, variants and traffic split (for example 50/50), target audience, primary
    metric, start and end, stored in a config service or feature-flag tool.

    - **Assignment**: `bucket = hash(experiment_id + visitor_id) % 100`. Deterministic, so the visitor
    sees the same variant on every visit without storing anything. Visitor id comes from a first-party
    cookie or the logged-in user id.

    - **Rendering**: server-side or at the CDN edge to avoid page flicker; client-side is simpler but
    can flash the original.

    - **Events**: log an **exposure** event when the variant is shown, and conversion events (clicked
    sign-up, completed purchase) with the visitor id.

    - **Analysis**: compare conversion rates with a proper test (for example a two-proportion z-test),
    using the sample size calculated beforehand. Check sample ratio mismatch (did traffic really split
    50/50?).

    - **Guardrails**: monitor page speed and errors per variant.


    ## Example

    1. Baseline conversion 5%; you want to detect a lift to 5.5% with 80% power at 5% significance.

    2. That needs about 31,000 visitors per variant.

    3. With 10,000 visitors a day split in two, the test runs about a week (a full week also covers weekday
    effects).


    ## Common mistakes

    - Stopping the test as soon as it looks significant (peeking).

    - Assigning by random number on each visit, so users switch variants.

    - Testing many metrics and declaring a win on whichever moved.


    ## In the interview

    Cover assignment, exposure logging, and analysis. Mention flicker, bots, novelty effects, multiple
    experiments at once (layering), and why you choose the metric and sample size before starting.

    '
