- id: kb-530801522922
  question: What is horizontal scaling?
  answer: Horizontal scaling (scaling out) means adding more machines or instances and spreading load
    across them, usually behind a load balancer. It offers near-unlimited capacity and fault tolerance,
    but requires stateless services or partitioned data and adds coordination complexity.
  topic: system design
  tags:
  - scalability
  - horizontal-scaling
  - load-balancing
  - distributed-systems
  explanation: "## In plain words\nHorizontal scaling is hiring more cashiers instead of training one\
    \ cashier to work faster. Each new machine takes part of the work, and if one goes home sick, the\
    \ others keep serving.\n\n## How it works\n- **Add instances** of the same service and put a load\
    \ balancer in front.\n- **Statelessness**: any instance must be able to serve any request. Move sessions,\
    \ uploads, and caches to shared stores (Redis, object storage, the database).\n- **Data tier**: harder\
    \ to scale out. Use read replicas for reads and **sharding** (partitioning data by a key across servers)\
    \ for writes and size.\n- **Autoscaling**: add or remove instances based on load.\n- **Pros**:\n \
    \ - Capacity grows almost linearly with commodity machines.\n  - No single machine is critical; failures\
    \ reduce capacity rather than causing an outage.\n  - Rolling deploys with no downtime.\n- **Cons**:\n\
    \  - Distributed system problems: network failures, consistency, coordination.\n  - More components\
    \ to operate and monitor.\n  - Some workloads do not split easily (one big transaction, a single hot\
    \ key).\n\n## Example\n1. One API server handles 2,000 requests per second; traffic is 15,000 at peak.\n\
    2. With 10 identical stateless servers behind a load balancer, each handles 1,500 with 25% headroom.\n\
    3. One server crashes; the other 9 handle about 1,670 each while the autoscaler replaces it.\n4. Sessions\
    \ survive because they live in Redis, not in server memory.\n\n## Common mistakes\n- Scaling out app\
    \ servers while one database remains the bottleneck.\n- Local state (in-memory sessions, local file\
    \ uploads) that breaks when requests land on another instance.\n- Ignoring that more instances means\
    \ more connections to the database; use connection pooling.\n\n## In the interview\nContrast with\
    \ vertical scaling, explain the statelessness requirement, and describe how the data layer scales\
    \ (replicas, sharding). Mention cost, operational complexity, and when vertical scaling is good enough.\n"
