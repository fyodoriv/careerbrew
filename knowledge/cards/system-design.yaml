- id: kb-82c640c7f2e2
  question: What is a sandbox and why is it needed?
  answer: A sandbox is an isolated environment where code or users can act without affecting real systems
    or data. It is used to run untrusted code safely (browser tabs, containers, WebAssembly), and to give
    developers or API customers a test environment with fake data and no real money or side effects.
  topic: system design
  tags:
  - security
  - isolation
  - testing
  - environments
  explanation: "## In plain words\nA sandbox is a play area with walls. Whatever happens inside, such\
    \ as buggy code, malicious code, or test payments, cannot reach out and damage the real world.\n\n\
    ## How it works\nTwo common meanings:\n- **Security sandbox** (isolating code):\n  - Restrict what\
    \ a program can access: files, network, system calls, memory.\n  - Mechanisms: OS process isolation,\
    \ containers with seccomp profiles, virtual machines and microVMs, language runtimes (WebAssembly,\
    \ JavaScript in browsers), browser site isolation.\n  - Used for running user-submitted code (online\
    \ judges, plugins), opening email attachments, and browser tabs.\n- **Environment sandbox** (isolating\
    \ effects):\n  - A copy of a service with fake or test data, such as a payment provider's test mode\
    \ where card numbers are fake and no money moves.\n  - Lets customers integrate with an API safely\
    \ and lets developers experiment.\n  - Separate credentials and endpoints so test traffic never touches\
    \ production.\n- **Design points**: strong isolation boundaries, resource limits (CPU, memory, time)\
    \ to stop runaway code, clear separation of keys, and resetting state.\n\n## Example\n1. An online\
    \ coding platform runs a submitted program.\n2. It starts a microVM with no network, a read-only file\
    \ system, 256 MB memory, and a 2-second CPU limit.\n3. The program tries to open a network socket;\
    \ the call is denied.\n4. Another program loops forever; it is killed at 2 seconds and reported as\
    \ \"time limit exceeded\".\n\n## Common mistakes\n- Treating plain containers as a strong security\
    \ boundary for hostile code without extra hardening.\n- Sandbox environments that share databases\
    \ or secrets with production.\n- Test data so unlike real data that integrations break in production.\n\
    \n## In the interview\nClarify which kind of sandbox you mean, then discuss isolation strength vs\
    \ startup cost (process, container, microVM, VM), resource limits, and how a test sandbox stays separate\
    \ from production.\n"
