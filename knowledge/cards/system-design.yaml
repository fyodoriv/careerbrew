- id: kb-a372a61f4401
  question: What is the MTTD metric?
  answer: MTTD, mean time to detect, is the average time between when an incident starts and when the
    team becomes aware of it, usually through an alert. Lower MTTD means problems are noticed before many
    users are affected; it is improved with better monitoring, symptom-based alerts, and synthetic checks.
  topic: system design
  tags:
  - incident-response
  - metrics
  - monitoring
  - reliability
  explanation: "## In plain words\nMTTD measures how long problems go unnoticed. If your site breaks at\
    \ 2:00 and the first alert fires at 2:20, detection took 20 minutes. Averaged over many incidents,\
    \ that is your MTTD.\n\n## How it works\n- **Formula**: MTTD = sum of (detection time - start time)\
    \ / number of incidents.\n- **Start time** is usually found afterwards from metrics (when errors started\
    \ rising), not from when someone noticed.\n- **Detection** is when an alert fired or a human was made\
    \ aware, whichever came first.\n- **Part of a family**:\n  - MTTA: mean time to acknowledge (alert\
    \ to a human responding).\n  - MTTR: mean time to recover or resolve.\n  - MTBF: mean time between\
    \ failures.\n- **Ways to lower MTTD**:\n  - Alert on user-facing symptoms (error rate, latency, SLO\
    \ burn rate).\n  - Synthetic monitoring that simulates user actions every minute.\n  - Anomaly detection\
    \ for metrics without fixed thresholds.\n  - Shorter alert evaluation windows for critical paths.\n\
    \  - Monitoring of business metrics (orders per minute dropping).\n- **Watch for**: incidents first\
    \ reported by customers mean a monitoring gap.\n\n## Example\nFour incidents last quarter:\n1. Started\
    \ 10:00, alert at 10:04: 4 minutes.\n2. Started 14:10, customer report at 14:55: 45 minutes.\n3. Started\
    \ 03:00, alert at 03:06: 6 minutes.\n4. Started 18:30, alert at 18:35: 5 minutes.\nMTTD = (4 + 45\
    \ + 6 + 5) / 4 = 15 minutes. The outlier (incident 2) shows a missing alert, so the action item is\
    \ a new check on that flow.\n\n## Common mistakes\n- Reporting only the mean; a median plus the worst\
    \ cases tells more.\n- Lowering MTTD with noisy alerts that cause fatigue.\n- Measuring start time\
    \ inconsistently between incidents.\n\n## In the interview\nDefine it, relate it to MTTA and MTTR,\
    \ and give concrete ways to reduce it. Mention that detection speed matters most for high-impact flows\
    \ and that customer-reported incidents should trigger new alerts.\n"
