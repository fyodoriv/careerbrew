- id: kb-318a376d9c38
  question: How would you design a photo sharing service like Instagram?
  answer: Upload photos to object storage via pre-signed URLs, process them asynchronously into several
    sizes served by a CDN, store metadata and the follow graph in databases, and build home feeds with
    fan-out on write for most users and fan-out on read for celebrities.
  topic: system design
  tags:
  - feed
  - cdn
  - object-storage
  - system-design-interview
  explanation: '## In plain words

    Instagram is two problems: storing and serving lots of images quickly, and building each user''s feed
    of posts from people they follow. Images go to cheap storage behind a CDN; the feed is precomputed
    so opening the app is fast.


    ## How it works

    - **Requirements**: upload photos, follow users, home feed, likes and comments. Read-heavy (maybe
    100 reads per write), feed load under 200 ms.

    - **Upload**: client gets a pre-signed URL, uploads to object storage, then calls the post service
    with metadata. A queue triggers workers that create thumbnails and several sizes.

    - **Serving**: images through a CDN; metadata (posts, users, likes) in a sharded database keyed by
    user id.

    - **Feed**: **fan-out on write** pushes a new post id into each follower''s feed list in a cache (Redis).
    For accounts with millions of followers, use **fan-out on read**: merge their recent posts at read
    time.

    - **Counters**: likes counted in a cache and flushed in batches.


    ## Example

    1. 500 million daily users, 2 photo uploads per 10 users per day: 100 million photos a day.

    2. Average stored size with all variants 2 MB: 200 TB per day, so tiered storage matters.

    3. Feed reads: 500 million users times 10 opens is 5 billion per day, about 58,000 per second, served
    from cache.


    ## Common mistakes

    - Serving images from app servers instead of a CDN.

    - Pure fan-out on write, which explodes for celebrity accounts.

    - Synchronous image processing in the upload request.


    ## In the interview

    State the read/write ratio early. Discuss the hybrid feed, ranking vs chronological order, cache invalidation
    when a post is deleted, and sharding by user id (and the hot-shard problem).

