- id: kb-828d559d0c3b
  question: What is a fire drill in software operations?
  answer: A fire drill is a planned practice exercise where a team simulates an incident, such as a server,
    database, or region failure, to test that alerts, runbooks, failover, and people respond as expected.
    It finds gaps before a real outage. The term is also used informally for an urgent, unplanned task
    that interrupts normal work.
  topic: system design
  tags:
  - incident-response
  - reliability
  - game-day
  - chaos-engineering
  explanation: '## In plain words

    Like a fire drill in a building, a software fire drill is a rehearsal of an emergency. You break something
    on purpose, in a controlled way, and see whether the team and the systems react correctly, so the
    real emergency is less chaotic.


    ## How it works

    - **Plan**: choose a scenario (primary database fails, a region goes dark, a key dependency slows
    down), the environment (staging or carefully in production), the expected outcome, and a way to abort.

    - **Announce or not**: announced drills test the mechanics; unannounced ones also test detection and
    paging.

    - **Run**: inject the failure (kill instances, block network traffic, revoke a credential). Observe:
    did the alert fire? Did on-call find the runbook? Did automatic failover work, and how long did it
    take?

    - **Measure**: time to detect, time to mitigate, data lost, customer impact.

    - **Review**: a short write-up with gaps and action items, like a postmortem.

    - **Related practices**: game days (team-wide drills), chaos engineering (automated, continuous fault
    injection), disaster recovery tests (restore from backup), tabletop exercises (talk through a scenario
    without touching systems).


    ## Example

    1. Scenario: the primary database instance is terminated at 11:00 on a Tuesday.

    2. Expected: failover within 60 seconds, alert to on-call within 2 minutes.

    3. Observed: failover took 45 seconds, but the alert went to an old rotation and nobody was paged.

    4. Action items: fix the paging route, add a drill every quarter.


    ## Common mistakes

    - Running drills with no abort plan or during peak traffic.

    - Only drilling the technology, not communication and decision-making.

    - Never repeating the drill after fixing the gaps.


    ## In the interview

    Show you value practising recovery: describe scenario choice, blast radius control, measurements,
    and follow-up. Connect it to MTTD, MTTR, and disaster recovery objectives.

    '
