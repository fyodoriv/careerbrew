- id: kb-44f972ce8008
  question: How would you design a ride-hailing service like Uber?
  answer: Drivers stream locations every few seconds into an in-memory geospatial index; a matching service
    finds nearby available drivers for a ride request and offers the trip. Trips are a state machine in
    a durable store, and real-time updates flow over WebSockets.
  topic: system design
  tags:
  - geospatial
  - matching
  - real-time
  - system-design-interview
  explanation: '## In plain words

    Uber connects a rider with a nearby driver within seconds. The core is knowing where every available
    driver is right now and quickly finding the closest few, then tracking the trip until payment.


    ## How it works

    - **Requirements**: request a ride, match a driver, live map, fare estimate, payment, ratings. Matching
    in a few seconds; location data is high volume and short-lived.

    - **Location service**: drivers send GPS updates every 4 seconds. Store the latest position in memory,
    indexed by a **geospatial cell** (geohash, S2, or H3 hexagons) so "drivers near me" is a lookup of
    a few cells.

    - **Matching service**: on request, look up drivers in nearby cells, rank by estimated time of arrival,
    offer the trip to one driver with a short timeout, then try the next.

    - **Trip service**: a state machine (`REQUESTED -> ACCEPTED -> ARRIVED -> IN_PROGRESS -> COMPLETED`)
    in a durable database.

    - **Real-time**: WebSockets push driver location to the rider.

    - **Partitioning**: shard by city or region, since most queries are local.


    ## Example

    1. 1 million active drivers each sending an update every 4 seconds: 250,000 writes per second, which
    is why the index lives in memory and is not a relational table.

    2. Each update is about 100 bytes, so the live state for all drivers is around 100 MB.

    3. A rider in a busy cell sees 30 drivers; the matcher ranks the closest 5 by road ETA.


    ## Common mistakes

    - Querying a SQL table with latitude/longitude ranges for every request.

    - Offering one trip to many drivers at once without a lock, causing double acceptance.

    - Ignoring surge pricing and supply/demand per area.


    ## In the interview

    Spend most time on the geospatial index and matching. Discuss consistency of driver assignment, what
    happens when a driver goes offline, and how to shard by geography with hot cities.

    '
