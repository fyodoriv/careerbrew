- id: kb-7b74ef682aa6
  question: How would you design a comment system with nested replies for a social media platform?
  answer: 'Store comments with a parent_id and post_id, and choose a tree representation that fits the
    reads: adjacency list with recursive queries, materialized path, or closure table. Load top-level
    comments with pagination and fetch replies lazily, cap display depth, and keep counts denormalized.'
  topic: system design
  tags:
  - data-modeling
  - trees
  - pagination
  - system-design-interview
  explanation: "## In plain words\nNested comments form a tree: each reply points to the comment it answers.\
    \ The design challenge is reading a big tree quickly, so the page loads the first few top comments\
    \ and lets people expand replies on demand.\n\n## How it works\n- **Data model**: `comments(id, post_id,\
    \ parent_id, author_id, body, created_at, score, reply_count)`.\n- **Tree representations**:\n  -\
    \ *Adjacency list* (`parent_id`): simple writes; read a subtree with a recursive CTE.\n  - *Materialized\
    \ path*: store the path like `0001.0004.0012`; a subtree is a prefix match, and sorting by path gives\
    \ thread order.\n  - *Closure table*: a row for every ancestor-descendant pair; fast subtree queries,\
    \ more storage.\n- **Reads**: page top-level comments (cursor pagination, sorted by score or time),\
    \ include the first 2-3 replies each, and load more replies on click.\n- **Writes**: insert the comment,\
    \ increment `reply_count` on the parent and the post's comment count (or update counts asynchronously).\n\
    - **Scale**: partition by `post_id`; cache the first page of hot posts; push new comments to viewers\
    \ over WebSocket.\n- **Moderation**: soft delete keeps the tree shape (\"[deleted]\").\n\n## Example\n\
    1. A viral post gets 200,000 comments.\n2. The page loads 20 top-level comments with 3 replies each:\
    \ 80 rows, one indexed query on `(post_id, parent_id, score)`.\n3. Clicking \"show 45 more replies\"\
    \ loads that subtree with a cursor.\n4. Display depth is capped at 6; deeper replies open a \"continue\
    \ thread\" view.\n\n## Common mistakes\n- Loading the whole tree on page open.\n- Recursive queries\
    \ from application code (one query per level per comment).\n- Hard deleting a comment and orphaning\
    \ its replies.\n\n## In the interview\nPick a tree model and justify it from the read pattern. Discuss\
    \ sorting (top, newest), pagination inside the tree, counts, hot posts, and moderation.\n"
