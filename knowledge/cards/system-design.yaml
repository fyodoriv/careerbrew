  question: How would you design a ticket booking system like Ticketmaster?
  answer: Model each seat with a state (available, held, sold), hold seats with a short time-limited reservation
    using atomic updates or locks, take payment, then confirm. Protect popular on-sales with a virtual
    waiting room and rate limiting, and serve the event catalog from cache.
  topic: system design
  tags:
  - booking
  - concurrency
  - locking
  - system-design-interview
  explanation: '## In plain words

    Selling concert tickets means many people want the same seat at the same second. The system must never
    sell one seat twice, and must survive a huge spike when sales open.


    ## How it works

    - **Requirements**: browse events, view seat map, reserve seats, pay, get a ticket. Strong consistency
    for seat sales; huge read spikes.

    - **Seat state**: each seat row has `status` and `hold_expires_at`. A hold is an atomic conditional
    update: `UPDATE seats SET status=''HELD'', holder=?, hold_expires_at=now()+10min WHERE id=? AND status=''AVAILABLE''`.
    If zero rows changed, someone else got it.

    - **Hold expiry**: a short TTL (for example 10 minutes); expired holds become available again, either
    lazily on read or by a sweeper job. A Redis lock with TTL is an alternative.

    - **Payment**: with an idempotency key; on success mark seats `SOLD` in the same transaction as the
    order.

    - **Spikes**: a **virtual waiting room** queues users and admits them at a controlled rate; seat maps
    are cached and refreshed every few seconds.


    ## Example

    1. A stadium has 50,000 seats and 2 million fans arrive at 10:00.

    2. The waiting room admits 5,000 users per minute, so the booking database sees a manageable load.

    3. Two users click seat A12 together; only one conditional update succeeds, the other sees "seat taken".


    ## Common mistakes

    - Read-then-write without a condition or lock, which double-sells seats.

    - Holding seats forever when a user abandons checkout.

    - Trying to scale the database for the spike instead of shaping the traffic.


    ## In the interview

    Focus on the seat contention and the spike. Compare pessimistic locking, optimistic conditional updates,
    and distributed locks. Mention fairness, bots, and idempotent payment retries.

    '
