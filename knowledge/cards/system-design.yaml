- id: kb-dd1bd8948692
  question: What is the difference between batch processing and stream processing?
  answer: Batch processing runs a job over a large, bounded set of stored data at intervals, favouring
    throughput. Stream processing handles each event (or small window) continuously as it arrives, favouring
    low latency. Many systems combine both.
  topic: system design
  tags:
  - data-processing
  - streaming
  - batch
  - latency
  explanation: '## In plain words

    Batch processing is doing the laundry once a week: you collect everything, then process it all in
    one run. Stream processing is washing each cup as soon as you use it. Batch is simple and efficient
    for big volumes; streaming gives fresh results within seconds.


    ## How it works

    - **Batch**: input is bounded (for example, yesterday''s logs). A scheduler starts a job (Spark, MapReduce,
    a SQL query) that reads everything, computes, and writes results. Latency is minutes to hours. Failures
    are easy to handle: rerun the job.

    - **Stream**: input is unbounded. Events flow through a log such as Kafka into a processor (Flink,
    Kafka Streams) that keeps state and emits results continuously.

    - Streaming needs extra concepts: **windows** (group events by time, such as 1-minute counts), **event
    time vs processing time** (when it happened vs when you saw it), **late events**, **watermarks** (how
    long to wait for late data), and **checkpoints** for recovery.

    - **Lambda architecture** runs both paths; **Kappa architecture** uses only a replayable stream and
    reprocesses by replaying it.


    ## Example

    An online shop:

    1. Fraud check on each payment must answer in under 200 ms, so it is a stream job reading payment
    events.

    2. The daily revenue report needs all orders and exact totals, so a nightly batch job reads the warehouse.

    3. A "trending products in the last 10 minutes" widget uses a stream job with sliding windows.


    ## Common mistakes

    - Choosing streaming when nobody needs results faster than daily; it costs more to run and operate.

    - Ignoring late or duplicate events, which makes streaming counts wrong.

    - Forgetting that exactly-once results need idempotent sinks or transactional writes.


    ## In the interview

    Start from the freshness requirement: "How stale can the result be?" Then mention trade-offs: throughput
    and simplicity (batch) vs latency and complexity (stream). Expect follow-ups on windowing, handling
    late data, backfills, and how to reprocess history after a bug fix.

    '
