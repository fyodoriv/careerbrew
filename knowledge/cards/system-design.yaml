- id: kb-13a2f88cf8df
  question: Your backend must read and write data in a huge JSON file. How do you speed it up?
  answer: 'Stop rewriting and reparsing the whole file: stream-parse it instead of loading it all, keep
    it in memory or cache if reads dominate, split it into smaller files or use line-delimited JSON for
    appends, add an index of offsets, and ideally move the data into a real database (or SQLite) that
    supports indexed queries and partial updates.'
  topic: system design
  tags:
  - performance
  - json
  - streaming
  - storage
  explanation: "## In plain words\nA single big JSON file is like a notebook where you must reread every\
    \ page to find one line and rewrite the whole notebook to change one word. The fix is to stop treating\
    \ the file as the database: read it in pieces, index it, or move the data into something built for\
    \ lookups and updates.\n\n## How it works\n- **Measure first**: is the time spent on disk reads, parsing,\
    \ serialization, or locks between writers?\n- **Reading faster**:\n  - Stream-parse (for example `ijson`\
    \ in Python) to process items without loading everything into memory.\n  - Use a faster parser (`orjson`,\
    \ `simdjson`).\n  - Parse once at startup and keep it in memory or a cache, reloading only when the\
    \ file changes.\n  - Build an index of byte offsets for each record to jump straight to it.\n- **Writing\
    \ faster**:\n  - Use **JSON Lines** (one object per line): appends are cheap; no need to rewrite the\
    \ file.\n  - Batch writes; write to a temp file and rename atomically to avoid corruption.\n  - Shard\
    \ into many smaller files by key.\n- **Best long-term fix**: load the data into SQLite, PostgreSQL\
    \ (with JSONB columns), or a key-value store. You get indexes, partial updates, transactions, and\
    \ concurrency control.\n- **Compression**: if disk I/O dominates, compress (gzip or zstd) at some\
    \ CPU cost.\n\n## Example\n1. A 2 GB JSON array of 5 million orders takes 25 seconds to parse and\
    \ 4 GB of memory.\n2. Converting it to JSON Lines lets a writer append a new order in microseconds.\n\
    3. Importing it into SQLite with an index on `order_id` makes a lookup take under 1 ms, and an update\
    \ changes one row instead of rewriting 2 GB.\n\n## Common mistakes\n- Loading the whole file on every\
    \ request.\n- Concurrent writers overwriting each other's changes with no locking.\n- Writing in place,\
    \ so a crash leaves a half-written, invalid file.\n\n## In the interview\nAsk about size, access pattern,\
    \ and who writes. Offer quick wins (caching, streaming, faster parser, JSON Lines) and the real fix\
    \ (a database), and mention atomic writes and concurrency.\n"
