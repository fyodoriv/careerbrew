- id: kb-d39a64689e3c
  question: What is distributed tracing?
  answer: Distributed tracing follows one request across many services. Each service records spans (timed
    operations) that share a trace id passed in request headers, so you can see the full call tree, where
    time is spent, and where errors happen. OpenTelemetry is the common standard.
  topic: system design
  tags:
  - observability
  - tracing
  - opentelemetry
  - microservices
  explanation: '## In plain words

    In a system of many services, one click might touch ten of them. Distributed tracing gives that click
    a unique id and records every step it takes, so you can see the whole journey on one timeline, like
    tracking a parcel through every depot.


    ## How it works

    - **Trace**: the full journey of one request, identified by a **trace id**.

    - **Span**: one timed operation within it (an HTTP call, a database query), with a span id, parent
    span id, start, duration, status, and attributes.

    - **Context propagation**: the trace id and parent span id travel with each call, typically in the
    W3C `traceparent` header, and in message metadata for queues.

    - **Instrumentation**: libraries (OpenTelemetry SDKs) create spans automatically for common frameworks;
    you add custom spans for important work.

    - **Collection**: spans are exported to a collector and stored in a backend (Jaeger, Tempo, Zipkin,
    or a vendor tool) that shows a waterfall view.

    - **Sampling**: tracing every request is expensive; sample a percentage (head sampling) or keep the
    interesting ones such as slow or failed requests (tail sampling).

    - **Correlation**: put the trace id in logs so you can jump between logs and traces.


    ## Example

    1. A checkout request takes 2.4 seconds.

    2. The trace shows: API gateway 10 ms, cart service 80 ms, pricing service 150 ms, inventory service
    2.1 seconds.

    3. Inside inventory, a span shows 40 sequential database queries of 50 ms each.

    4. Batching them into one query brings checkout down to about 400 ms (2.4 s minus about 2 s of queries).


    ## Common mistakes

    - Not propagating context through queues or thread pools, which breaks traces into fragments.

    - Sampling only 0.1% uniformly and missing rare errors.

    - Putting personal data in span attributes.


    ## In the interview

    Define trace, span, and propagation, and contrast tracing with metrics (aggregate health) and logs
    (event details). Mention sampling trade-offs and using traces to find latency bottlenecks.

    '
