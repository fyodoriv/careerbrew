- id: kb-a94c75bdc43e
  question: How would you design a search system for a website or app?
  answer: Ingest documents through a pipeline that tokenizes text into an inverted index, shard and replicate
    the index, and answer queries by looking up terms, scoring matches (for example BM25 plus signals
    like popularity), and returning the top results. Add autocomplete, typo tolerance, and caching.
  topic: system design
  tags:
  - search
  - inverted-index
  - ranking
  - system-design-interview
  explanation: '## In plain words

    Search works like the index at the back of a book: for each word, a list of pages where it appears.
    To answer a query, you look up each word''s list, combine them, and sort the results by how relevant
    they are.


    ## How it works

    - **Ingestion**: when a document changes, an event feeds an indexing pipeline that normalizes text
    (lower case, remove punctuation), splits it into **tokens**, applies stemming, and updates the **inverted
    index** (term to list of document ids and positions).

    - **Query**: parse the query, apply the same text processing, fetch postings lists, intersect or union
    them, then **score** each match. BM25 is a standard text relevance score; add signals such as recency,
    popularity, or personalization.

    - **Scale**: shard the index by document; each query goes to all shards, each returns its top-k, and
    a coordinator merges them. Replicas handle read load.

    - **Extras**: autocomplete with a prefix structure (trie or edge n-grams), typo tolerance with edit
    distance, filters and facets, query result caching.

    - **Tooling**: Elasticsearch or OpenSearch for most teams.


    ## Example

    1. 100 million products, 2 KB of text each: 200 GB raw; the index is a similar size.

    2. 10 shards of 20 GB, each with 2 replicas.

    3. 5,000 queries per second: each hits 10 shards, so 50,000 shard queries per second across 30 nodes.


    ## Common mistakes

    - Using SQL `LIKE ''%term%''`, which scans every row.

    - Indexing synchronously in the write path.

    - Ignoring relevance evaluation; measure click-through and zero-result rate.


    ## In the interview

    Clarify what is searched and how fresh results must be. Explain the inverted index, sharding and merging,
    then ranking. Expect follow-ups on reindexing without downtime and personalization.

    '
