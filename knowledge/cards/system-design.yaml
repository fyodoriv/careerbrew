- id: kb-88ad589ffb52
  question: How would you design a chat messenger like WhatsApp or Facebook Messenger?
  answer: Clients keep a persistent WebSocket to a gateway; a chat service stores each message with a
    per-conversation sequence number and routes it to recipients' connections or to push notifications
    if offline. Delivery and read receipts are acknowledgements, and presence is tracked with heartbeats.
  topic: system design
  tags:
  - messaging
  - websockets
  - real-time
  - system-design-interview
  explanation: '## In plain words

    A messenger is a post office that must deliver instantly when the recipient is online and hold the
    letter when they are not. Each phone keeps an open connection to the servers so messages can be pushed
    without polling.


    ## How it works

    - **Requirements**: one-to-one and group chat, delivery and read receipts, online status, history
    across devices, push notifications. Low latency (under a few hundred ms).

    - **Connection gateways**: hold millions of WebSocket connections. A session registry (for example
    Redis) maps user to gateway.

    - **Chat service**: assigns each message a per-conversation sequence number, writes it to a message
    store (a wide-column store such as Cassandra, partitioned by conversation id), then routes it.

    - **Routing**: if the recipient is online, send through their gateway; otherwise queue it and send
    a push notification. On reconnect, the client asks for messages after its last sequence number.

    - **Receipts**: "delivered" and "read" are small acknowledgement messages.

    - **Groups**: fan out to each member; for very large groups, members pull instead.


    ## Example

    1. 500 million daily users, 40 messages each: 20 billion messages a day, about 230,000 per second
    on average.

    2. 100 bytes per message: about 2 TB per day of storage.

    3. Not all daily users are online at once: if 100 million are connected at peak and one gateway holds
    500,000 connections, you need about 200 gateways, plus spare capacity.


    ## Common mistakes

    - Ordering by server timestamp across machines; use per-conversation sequence numbers.

    - Losing messages when the recipient is offline because there is no durable store before delivery.

    - Forgetting that a user has several devices.


    ## In the interview

    Clarify group size, history retention, and end-to-end encryption. Talk about at-least-once delivery
    with client-side dedup by message id, presence via heartbeats, and the cost of fan-out for large groups.

    '
