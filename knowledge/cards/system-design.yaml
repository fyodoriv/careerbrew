- id: kb-7ebb454572df
  question: How would you design a file sync and storage service like Dropbox?
  answer: Clients split files into chunks, hash them, and upload only new chunks to object storage; a
    metadata service stores file versions as lists of chunk hashes. A notification service tells other
    devices to sync, and conflicts create a conflicted copy.
  topic: system design
  tags:
  - file-storage
  - sync
  - chunking
  - system-design-interview
  explanation: '## In plain words

    Dropbox keeps a folder identical on all your devices. The trick is to avoid re-uploading whole files:
    split each file into chunks, send only the chunks that changed, and keep a small metadata record that
    says which chunks make up each version.


    ## How it works

    - **Requirements**: upload, download, sync across devices, share, version history. Large files, unreliable
    networks, many reads.

    - **Client**: watches the folder, splits files into chunks (for example 4 MB), hashes each chunk,
    and asks the server which hashes it lacks.

    - **Block storage**: chunks stored in object storage (S3-like), keyed by hash, which also gives **deduplication**.

    - **Metadata service**: a database with users, files, versions, and the ordered list of chunk hashes
    per version. Needs strong consistency.

    - **Sync**: after a commit, a notification service (long polling or WebSocket) tells other devices;
    they fetch the new metadata and download missing chunks.

    - **Conflicts**: two devices edit the same base version; the server accepts the first commit and the
    second gets saved as a "conflicted copy".


    ## Example

    1. 50 million users, 10 GB each: 500 PB raw; dedup and compression reduce it.

    2. Editing one line in a 100 MB file changes one 4 MB chunk, so the upload is 4 MB, not 100 MB.

    3. Uploads go directly to storage using pre-signed URLs, so app servers stay light.


    ## Common mistakes

    - Storing files in the relational database.

    - Ignoring resumable uploads on mobile networks.

    - Forgetting the notification path and having clients poll the database constantly.


    ## In the interview

    Draw client, metadata service, block store, and notification service. Discuss chunk size trade-offs,
    consistency of metadata vs eventual consistency of blobs, dedup across users (and its privacy risk),
    and how you would handle offline edits.

    '
