- id: kb-2c4b9a30e365
  question: What is the best strategy for cache invalidation?
  answer: 'There is no single best strategy: combine a TTL as a safety net with explicit invalidation
    on writes (delete the key after the database update, or publish change events, for example from change
    data capture), and use versioned keys for content that changes atomically. Choose by how stale data
    may be and how write-heavy the data is.'
  topic: system design
  tags:
  - caching
  - cache-invalidation
  - consistency
  - cdc
  explanation: '## In plain words

    Cache invalidation means making sure the cache stops serving old data after the real data changes.
    It is famously hard because the cache and the database are separate systems, and any gap between them
    can show users stale data.


    ## How it works

    - **TTL (time to live)**: every entry expires after a set time. Simple and self-healing; data can
    be stale for up to the TTL.

    - **Delete on write** (with cache-aside): update the database, then delete the key; the next read
    reloads it. Deleting is safer than updating the cache, since two concurrent updates can leave the
    older value cached.

    - **Event-driven invalidation**: services publish change events, or **change data capture (CDC)**
    reads the database''s log and invalidates keys. Catches writes from any path, including scripts.

    - **Versioned keys**: include a version in the key (`product:42:v17`) or in asset file names (`app.3f9c.js`).
    New version means a new key; old entries simply expire. Ideal for CDNs.

    - **Write-through**: update cache and database together, so the cache is always fresh for that writer.

    - **Race protections**: delayed double delete, or leases where the cache rejects a stale fill after
    a delete.

    - **Stampede protection**: when a hot key expires, let one request reload while others wait or get
    the old value.


    ## Example

    1. A product price changes from 20 to 18.

    2. The service updates the database, then deletes `product:42` in Redis.

    3. A CDC consumer also deletes it, in case the delete in step 2 failed.

    4. TTL of 10 minutes caps staleness if both fail.

    5. Product images use versioned URLs, so the CDN never needs purging.


    ## Common mistakes

    - Relying on TTL alone for data like prices or permissions.

    - Updating the cache before the database write commits.

    - Forgetting other writers (admin tools, batch jobs) that bypass the invalidation code.


    ## In the interview

    Start by asking how stale data may be. Then combine TTL with explicit invalidation, explain the delete-vs-update
    race, and mention CDC and versioned keys for CDNs.

    '
