  question: How would you design a URL shortener like TinyURL?
  answer: Map a short key to a long URL in a key-value store. Generate keys by encoding a unique counter
    or id in base62, or by random keys with collision checks. Redirect with HTTP 301 or 302, cache hot
    keys, and collect click analytics asynchronously.
  topic: system design
  tags:
  - url-shortener
  - base62
  - caching
  - system-design-interview
  explanation: "## In plain words\nA URL shortener turns a long link into a short one and sends anyone\
    \ who opens the short link to the original. It is a giant lookup table that must be very fast for\
    \ reads and must never hand out the same short key twice.\n\n## How it works\n- **Write**: `POST /shorten\
    \ {url}` validates the URL, creates a key, stores `key -> long_url` (plus owner and expiry), returns\
    \ `https://sho.rt/{key}`.\n- **Key options**:\n  - Counter or unique id (for example from a Snowflake\
    \ generator or ranges handed to each server) encoded in **base62** (0-9, a-z, A-Z). No collisions;\
    \ keys are guessable.\n  - Random 7 characters, insert with \"if not exists\", retry on collision.\n\
    \  - Hash of the URL truncated, which handles duplicates but still needs collision checks.\n- **Read**:\
    \ `GET /{key}` looks up the cache, then the store, then responds with a redirect. 301 lets browsers\
    \ cache it (fewer hits, less analytics); 302 always comes back to you.\n- **Analytics**: log click\
    \ events to a queue; aggregate later.\n\n## Example\n```python\nALPHABET = \"0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\"\
    \n\ndef base62(n):\n    s = \"\"\n    while True:\n        n, r = divmod(n, 62)\n        s = ALPHABET[r]\
    \ + s\n        if n == 0:\n            return s\n\nprint(base62(125))  # 21\n```\nEstimate: 100 million\
    \ new links a month is about 40 writes per second; with 100:1 reads, 4,000 redirects per second, mostly\
    \ served from cache. 7 base62 characters give about 3.5 trillion keys.\n\n## Common mistakes\n- Using\
    \ 301 when the business needs click analytics.\n- A single counter in one database as an unprotected\
    \ bottleneck.\n- Allowing redirects to malicious sites with no checks.\n\n## In the interview\nEstimate\
    \ traffic and key space, compare key strategies, and show the read path with caching. Discuss custom\
    \ aliases, expiry, and abuse protection.\n"
