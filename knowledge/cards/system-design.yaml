- id: kb-194a2b75154a
  question: How do you guarantee a unique username when two users in different regions register the same
    name at the same moment?
  answer: 'Uniqueness needs a single authority per username: route each username to one owner (a global
    strongly consistent store, or a home region chosen by hashing the name) and claim it with an atomic
    conditional write. The second request fails and is asked to choose another name.'
  topic: system design
  tags:
  - distributed-systems
  - consistency
  - uniqueness
  - multi-region
  explanation: "## In plain words\nIf two data centres each check \"is this name free?\" and both say\
    \ yes, you get two accounts with the same name. To prevent that, every claim for a given name must\
    \ go to the same place, which decides who was first.\n\n## How it works\n- **Single authority per\
    \ key**: pick one of:\n  - A globally consistent database (Spanner-style, or a consensus-based store)\
    \ where a unique constraint holds across regions.\n  - **Home-region by hash**: hash the username\
    \ to choose a region that owns it; all claims for that name go there, even from far away. Most names\
    \ are short writes, so the extra latency is acceptable at sign-up.\n- **Atomic claim**: `INSERT INTO\
    \ usernames(name, user_id) ...` with a unique key, or a conditional put (`if not exists`). Exactly\
    \ one succeeds.\n- **Reservation then commit**: reserve the name with a short TTL while the rest of\
    \ sign-up completes; release it if sign-up fails.\n- **Normalize first**: lower case and Unicode normalization\
    \ so `John` and `john` collide; block confusable characters.\n\n## Example\n1. A user in Europe and\
    \ a user in Asia both request `alex.dev` at 10:00:00.\n2. Hashing `alex.dev` maps it to the US-East\
    \ shard.\n3. Both requests send a conditional insert there; the one that arrives first wins.\n4. The\
    \ other gets \"username taken\" and suggestions like `alex.dev7`.\n\n## Common mistakes\n- Checking\
    \ availability in a local replica and then writing asynchronously.\n- Last-writer-wins replication,\
    \ which silently overwrites one account.\n- Forgetting case and Unicode normalization.\n\n## In the\
    \ interview\nName it as a uniqueness problem that eventual consistency cannot solve. Compare global\
    \ consensus vs key-based ownership, mention latency costs at sign-up, and cover the reservation TTL.\n"
