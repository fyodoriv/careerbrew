- id: kb-6c81e967fa06
  question: How would you design a load balancer?
  answer: A load balancer accepts client connections on a virtual IP and spreads them across healthy backends
    using an algorithm such as round robin, least connections, or consistent hashing. It runs health checks,
    is itself redundant (active-passive with a floating IP or anycast), and works at layer 4 or layer
    7.
  topic: system design
  tags:
  - load-balancing
  - networking
  - high-availability
  explanation: '## In plain words

    A load balancer is a host at a restaurant door who seats each new guest at a table that is free, and
    stops seating guests at a table whose waiter is sick. Clients see one address; behind it, many servers
    share the work.


    ## How it works

    - **Layer 4** (TCP/UDP): forwards connections based on IP and port. Very fast, no knowledge of HTTP.

    - **Layer 7** (HTTP): reads requests, so it can route by path or header, terminate TLS, add retries,
    and do sticky sessions with cookies.

    - **Algorithms**: round robin, weighted round robin, least connections, least response time, and consistent
    hashing (same key goes to the same server, useful for caches).

    - **Health checks**: probe each backend (for example `GET /health` every 5 seconds); remove it after
    a few failures and add it back after successes.

    - **Redundancy**: the balancer must not be a single point of failure: run a pair with a floating virtual
    IP (keepalived, VRRP), or several behind DNS or anycast.

    - **Extras**: connection draining during deploys, rate limiting, observability.


    ## Example

    1. 50,000 requests per second across 20 app servers: about 2,500 each.

    2. One server''s health check fails three times; the balancer stops sending it traffic within 15 seconds.

    3. A layer 7 rule sends `/api/*` to the API pool and `/static/*` to a cache pool.


    ## Common mistakes

    - Forgetting the balancer itself needs redundancy.

    - Sticky sessions everywhere, which unbalance load; prefer stateless servers.

    - Health checks that only test that the process is up, not that its dependencies work.


    ## In the interview

    Ask whether it is L4 or L7 and the traffic volume. Discuss algorithm choice, health checks, TLS termination,
    and how you scale the balancer layer (DNS round robin or anycast in front).

    '
