  question: How would you design a system that records and stores user audio?
  answer: Capture audio on the client in a compressed codec, upload it in small chunks (or stream over
    WebSocket or WebRTC) to object storage with resumable uploads, record metadata in a database, and
    process it asynchronously for transcoding, transcription, or analysis. Handle consent, permissions,
    and retention.
