- id: kb-5f099919150a
  question: What types of pagination exist, and when should you use each?
  answer: Offset pagination (LIMIT and OFFSET, or page numbers) is simple and allows jumping to a page
    but gets slow and inconsistent on large, changing data. Cursor or keyset pagination continues after
    the last seen sort key, which is fast and stable but only moves forward or back. Time-based and token-based
    pagination are variants of cursors.
  topic: system design
  tags:
  - pagination
  - api-design
  - databases
  - performance
  explanation: "## In plain words\nPagination splits a long list into pages. The simple way says \"skip\
    \ 1,000 rows, give me 20\". The scalable way says \"give me 20 rows after the last one I saw\", which\
    \ stays fast no matter how deep you go.\n\n## How it works\n- **Offset pagination**: `LIMIT 20 OFFSET\
    \ 1000`, or `?page=51`.\n  - Pros: easy; can jump to any page; easy to show total pages.\n  - Cons:\
    \ the database still reads and discards the skipped rows, so deep pages are slow. If rows are inserted\
    \ or deleted while browsing, users see duplicates or miss items.\n- **Keyset (cursor) pagination**:\
    \ `WHERE (created_at, id) < (:last_created_at, :last_id) ORDER BY created_at DESC, id DESC LIMIT 20`.\n\
    \  - Pros: uses an index, constant time per page; stable under inserts.\n  - Cons: no jumping to page\
    \ 51; needs a unique, sortable key (add `id` as a tie-breaker).\n- **Opaque cursor tokens**: encode\
    \ the last key (base64 JSON) and return `next_cursor`; clients just pass it back. Lets you change\
    \ internals later.\n- **Time-based**: `?since=timestamp`, good for feeds and sync.\n- **API responses**\
    \ usually include `items`, `next_cursor` (or null), and sometimes an approximate total.\n\n## Example\n\
    ```sql\n-- first page\nSELECT id, created_at, title FROM posts\nORDER BY created_at DESC, id DESC\
    \ LIMIT 20;\n\n-- next page, using the last row of the previous page\nSELECT id, created_at, title\
    \ FROM posts\nWHERE (created_at, id) < ('2024-05-01 10:00:00', 9123)\nORDER BY created_at DESC, id\
    \ DESC LIMIT 20;\n```\nWith 10 million posts, `OFFSET 5000000` may take seconds; the keyset query\
    \ stays in milliseconds with an index on `(created_at, id)`.\n\n## Common mistakes\n- Sorting by a\
    \ non-unique column without a tie-breaker, which skips or repeats rows.\n- Exposing raw offsets in\
    \ public APIs for huge datasets.\n- Counting all rows on every request to show total pages.\n\n##\
    \ In the interview\nCompare offset and cursor approaches on speed, consistency, and UX. Recommend\
    \ cursors for infinite scroll and APIs, offsets for small admin tables, and mention opaque tokens.\n"
