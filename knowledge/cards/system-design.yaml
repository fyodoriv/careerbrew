- id: kb-8937bc93f595
  question: How can a server detect and handle concurrent operations on the same data?
  answer: Use optimistic concurrency control (a version number or ETag checked on write, rejecting stale
    updates with a conflict) or pessimistic locking (row locks or distributed locks). Databases add transactions
    and isolation levels; collaborative tools use operational transformation or CRDTs to merge edits.
  topic: system design
  tags:
  - concurrency
  - optimistic-locking
  - transactions
  - etag
  explanation: "## In plain words\nTwo people edit the same record at the same time. Without care, the\
    \ second save silently erases the first: a **lost update**. The server needs a way to notice that\
    \ the data changed since the client read it.\n\n## How it works\n- **Optimistic concurrency**: every\
    \ record has a `version` (or `updated_at`, or an ETag). A client sends the version it read; the server\
    \ updates only if it still matches:\n  `UPDATE docs SET body=?, version=version+1 WHERE id=? AND version=?`.\
    \ Zero rows means a conflict; return HTTP 409 or 412 and let the client merge or retry. Best when\
    \ conflicts are rare.\n- **Pessimistic locking**: lock before reading (`SELECT ... FOR UPDATE`) or\
    \ take a distributed lock (with a TTL and a fencing token). Best when conflicts are frequent and retries\
    \ are expensive.\n- **Atomic operations**: let the database do the change in one step (`SET stock\
    \ = stock - 1 WHERE stock > 0`), avoiding read-modify-write.\n- **Isolation levels**: serializable\
    \ transactions detect some conflicts automatically, at a cost.\n- **Merging**: real-time editors use\
    \ OT or CRDTs so both edits survive.\n- **HTTP**: `If-Match: <etag>` on PUT gives optimistic control\
    \ over REST.\n\n## Example\n1. Alice and Bob both load document 7 at version 3.\n2. Alice saves: the\
    \ update with `version=3` succeeds; the document is now version 4.\n3. Bob saves with `version=3`:\
    \ zero rows updated, the server returns 409.\n4. Bob's client fetches version 4, shows the differences,\
    \ and Bob saves again.\n\n## Common mistakes\n- Checking the version in application code and writing\
    \ in a separate statement.\n- Distributed locks without expiry or fencing, so a paused process corrupts\
    \ data.\n- Using pessimistic locks across user think time.\n\n## In the interview\nName the lost update\
    \ problem, then compare optimistic and pessimistic approaches with when each fits. Mention ETags with\
    \ `If-Match` for APIs and merge strategies for collaborative editing.\n"
  match:
