  topic: system design
  tags:
  - rate-limiting
  - redis
  - api
  - system-design-interview
  explanation: "## In plain words\nA rate limiter is a bouncer that lets each client in only so often,\
    \ so one noisy client cannot overload the service or run up costs. It needs to decide in about a millisecond,\
    \ for every request, across many servers.\n\n## How it works\n- **Where**: in an API gateway or as\
    \ middleware before business logic.\n- **Key**: what to limit by: user id, API key, IP, or endpoint.\n\
    - **Algorithms**:\n  - *Fixed window*: count per minute; simple but allows bursts at window edges.\n\
    \  - *Sliding window log or counter*: smoother, a bit more memory.\n  - *Token bucket*: tokens refill\
    \ at a steady rate up to a capacity; each request takes one. Allows short bursts. Most common.\n \
    \ - *Leaky bucket*: queue drained at a fixed rate; smooths output.\n- **Distributed state**: store\
    \ counters in Redis and update them atomically (a Lua script or `INCR` with `EXPIRE`). For speed,\
    \ some systems keep local counters and sync periodically, accepting slight overshoot.\n- **Response**:\
    \ HTTP 429 with `Retry-After`, plus headers showing remaining quota.\n\n## Example\n```python\nimport\
    \ time\n\nclass TokenBucket:\n    def __init__(self, rate, capacity):\n        self.rate, self.capacity\
    \ = rate, capacity\n        self.tokens, self.last = capacity, time.monotonic()\n\n    def allow(self):\n\
    \        now = time.monotonic()\n        self.tokens = min(self.capacity, self.tokens + (now - self.last)\
    \ * self.rate)\n        self.last = now\n        if self.tokens >= 1:\n            self.tokens -=\
    \ 1\n            return True\n        return False\n\nb = TokenBucket(rate=5, capacity=10)\nprint(sum(b.allow()\
    \ for _ in range(20)))  # about 10\n```\nEach check is O(1) time and O(1) space per key.\n\n## Common\
    \ mistakes\n- Read-then-write on Redis without atomicity, which lets bursts through.\n- Failing closed\
    \ when Redis is down and blocking everyone; decide fail-open vs fail-closed deliberately.\n- One global\
    \ limit instead of per-client limits.\n\n## In the interview\nClarify the limits and scale, pick token\
    \ bucket, and explain the shared store. Discuss multi-region limits, clock issues, and returning useful\
    \ headers to clients.\n"
