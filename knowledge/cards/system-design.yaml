- id: kb-416f856ba371
  question: How do you scale a database?
  answer: 'In rough order: optimize queries and indexes, add caching, scale up the machine, add read replicas
    for read traffic, split by function into separate databases, then shard (partition data across many
    primaries by a key). Each step adds operational complexity, so take the simplest one that meets the
    need.'
  topic: system design
  tags:
  - databases
  - sharding
  - replication
  - scalability
  explanation: '## In plain words

    A database slows down when it has too many reads, too many writes, or too much data for one machine.
    You fix the cheap things first and only split data across many machines when you have to, because
    that makes everything harder.


    ## How it works

    - **Query tuning**: add the right indexes, remove N+1 queries, avoid `SELECT *`, use `EXPLAIN`.

    - **Connection pooling**: so thousands of app threads share a few hundred connections.

    - **Caching**: Redis or Memcached in front of hot reads.

    - **Vertical scaling**: a bigger machine; easy but has a ceiling.

    - **Read replicas**: copies that serve reads; the primary handles writes. Replication lag means a
    user may not see their own write unless you read from the primary for that case.

    - **Functional partitioning**: move different domains (users, orders, analytics) to separate databases.

    - **Sharding**: split rows across many primaries by a **shard key** (user id, tenant id). Use hash-based
    or range-based partitioning, or a directory. Cross-shard joins and transactions become hard.

    - **Different stores**: move analytics to a warehouse, search to a search engine, time series to a
    specialized store.


    ## Example

    1. A database at 20,000 reads and 2,000 writes per second, CPU at 85%.

    2. A cache with a 90% hit rate cuts reads to 2,000 per second.

    3. Two replicas absorb the remaining reads.

    4. Years later writes reach 30,000 per second; shard by `user_id` into 16 shards, about 2,000 writes
    each.


    ## Common mistakes

    - Sharding first, before indexes and caching.

    - A shard key that creates hot shards (for example, date).

    - Forgetting replication lag in read-after-write flows.


    ## In the interview

    Ask about the read/write ratio and data size. Walk the ladder from cheapest to most complex, and discuss
    shard key choice, resharding, and cross-shard queries.

    '
