- id: kb-1ec57824f149
  question: How would you design the backend of a music streaming service like Spotify?
  answer: Store encoded audio files in object storage served via a CDN, keep catalog and playlist metadata
    in databases, stream audio in small chunks with adaptive quality, and run play-event pipelines that
    feed royalties, analytics, and recommendations.
  topic: system design
  tags:
  - streaming
  - cdn
  - recommendations
  - system-design-interview
  explanation: '## In plain words

    A music service stores a large but fairly stable catalog of songs and plays them instantly for many
    listeners. Popular songs are cached close to users, and every play is recorded because it drives payments
    to artists and recommendations.


    ## How it works

    - **Requirements**: search, play songs with little delay, playlists, offline downloads, recommendations,
    royalties reporting.

    - **Audio**: each track encoded at several bitrates (for example 96, 160, 320 kbps), stored in object
    storage, served by a CDN. The client fetches small chunks and can switch bitrate.

    - **Catalog service**: artists, albums, tracks, licensing per country, in a relational store with
    caches; search via a search engine.

    - **Playlists**: a user-owned list of track ids in a key-value or document store; collaborative playlists
    need ordering and conflict handling.

    - **Play events**: clients send events (started, 30 seconds reached, skipped) to a log such as Kafka.
    Consumers compute royalties, charts, and features for recommendation models.

    - **Offline**: encrypted downloads with licence checks.


    ## Example

    1. 100 million tracks, 4 minutes average, 3 bitrates totalling about 20 MB per track: about 2 PB.

    2. 50 million concurrent listeners at 160 kbps: about 8 Tbps, which is why the CDN carries almost
    everything.

    3. 1 billion play events a day: about 12,000 per second into the event log.


    ## Common mistakes

    - Treating audio like video; tracks are small enough to prefetch the next song.

    - Forgetting licensing by region.

    - Writing play counts directly into the main database.


    ## In the interview

    Separate the playback path, the metadata path, and the event pipeline. Discuss caching popular tracks,
    prefetching, royalties accuracy (no double counting), and recommendation freshness.

    '
