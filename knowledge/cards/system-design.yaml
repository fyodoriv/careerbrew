- id: kb-7be6c4127f0e
  question: How do you monitor the operational health of services?
  answer: Collect metrics, logs, and traces; define SLIs such as availability and latency with SLO targets;
    alert on symptoms users feel (error rate, latency, burn rate of the error budget) rather than every
    cause; and keep dashboards, health checks, and runbooks so on-call engineers can act quickly.
  topic: system design
  tags:
  - observability
  - monitoring
  - slo
  - alerting
  explanation: "## In plain words\nMonitoring tells you whether your service is working for users right\
    \ now and warns you before it breaks. You measure a few key signals, set targets for them, and get\
    \ paged only when users are actually affected.\n\n## How it works\n- **Three pillars**:\n  - *Metrics*:\
    \ numbers over time (request rate, error rate, latency percentiles, CPU, queue depth).\n  - *Logs*:\
    \ structured events with details for debugging.\n  - *Traces*: the path of one request across services.\n\
    - **Golden signals**: latency, traffic, errors, saturation. RED for services, USE for resources.\n\
    - **SLIs and SLOs**: an SLI is a measured indicator (\"percentage of requests under 300 ms\"); an\
    \ SLO is the target (\"99.9% over 30 days\"). The remaining 0.1% is the **error budget**.\n- **Alerting**:\
    \ page on symptoms and fast budget burn; send lower-urgency tickets for slow burns and causes like\
    \ disk at 80%.\n- **Health checks**: liveness (is the process alive) and readiness (can it serve),\
    \ used by load balancers and orchestrators.\n- **Synthetic checks**: scripted requests from outside,\
    \ to catch DNS or certificate problems.\n- **Runbooks and dashboards** linked from each alert.\n\n\
    ## Example\n1. SLO: 99.9% of checkout requests succeed over 30 days, so the budget is about 43 minutes\
    \ of failure.\n2. An alert fires if the last hour burned more than 2% of the monthly budget.\n3. The\
    \ alert links to a dashboard showing errors by endpoint and region, and to a runbook.\n\n## Common\
    \ mistakes\n- Alerting on every CPU spike, which causes alert fatigue.\n- Watching averages instead\
    \ of p95 and p99 latency.\n- Logs with no request id, making cross-service debugging painful.\n\n\
    ## In the interview\nExplain SLIs, SLOs, and error budgets, and symptom-based alerting. Mention the\
    \ tools you would use (Prometheus, Grafana, OpenTelemetry) and how monitoring connects to incident\
    \ response.\n"
