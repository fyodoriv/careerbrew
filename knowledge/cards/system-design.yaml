- id: kb-c320dd23194e
  question: What is the write-ahead logging (WAL) pattern?
  answer: Write-ahead logging means every change is first appended to a durable, sequential log and flushed
    to disk before it is applied to the main data structures. After a crash, the system replays the log
    to redo committed changes (and undo incomplete ones), so committed data is never lost. Databases,
    file systems, and consensus systems use it.
  topic: system design
  tags:
  - durability
  - databases
  - logging
  - crash-recovery
  explanation: '## In plain words

    Before a shop owner moves goods between shelves, they write the plan in a notebook. If they faint
    halfway, someone can read the notebook and finish the job. WAL is that notebook: write down the change
    first, then do it.


    ## How it works

    - **Append first**: a change (for example "set row 7 balance to 90") is appended to the log with a
    sequence number (LSN).

    - **Flush**: the log is forced to disk (`fsync`) before the transaction is reported as committed.
    Sequential appends are much faster than random writes to data pages.

    - **Apply later**: the actual data pages are updated in memory and written to disk lazily.

    - **Checkpoints**: periodically flush dirty pages and record a checkpoint, so recovery only replays
    the log after it, and older log segments can be deleted or archived.

    - **Recovery**: after a crash, read the log from the last checkpoint and **redo** committed changes;
    **undo** changes from transactions that never committed.

    - **Bonus uses**: replication (ship the log to replicas), point-in-time recovery (replay archived
    logs up to a moment), change data capture.

    - **Group commit**: batch several transactions into one flush to raise throughput.


    ## Example

    1. A transaction transfers 10 from account A to B.

    2. The database appends two log records (A -10, B +10) and a commit record, then calls fsync: about
    1 ms on an SSD.

    3. It replies "committed". The data pages are still only in memory.

    4. Power fails. On restart, recovery replays the log from the last checkpoint and reapplies both changes.
    No money is lost.


    ## Common mistakes

    - Acknowledging writes before the log is flushed (fast, but loses data on crash).

    - Letting the log grow forever without checkpoints and archiving.

    - Confusing WAL with application logs, which are for humans, not recovery.


    ## In the interview

    Explain why sequential log writes are fast and why the log makes recovery possible. Mention checkpoints,
    replication from the log, the fsync latency trade-off, and that Kafka and Raft are built around the
    same idea.

    '
