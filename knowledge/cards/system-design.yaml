- id: kb-013665d3ae4a
  question: How do you answer "What's the largest system you've worked on?"
  answer: Describe one system's scale in numbers (traffic, data, team, components), your specific role
    in it, one hard trade-off you handled, and what you learned.
  topic: system design
  tags:
  - system-design
  - scale
  - experience
  - behavioural
  explanation: '## In plain words

    This question checks how much real scale you have seen and how well you understand it. The interviewer
    is less interested in a big number than in whether you know how the system works and what part you
    owned.


    ## How it works

    - Scale: give concrete numbers, such as requests per second, data size, users, number of services,
    or team size.

    - Architecture: a short sketch of the main components and how data flows.

    - Your role: what you designed, built, or operated.

    - A challenge: one bottleneck or failure and how it was solved (caching, sharding, queues, back-pressure).

    - Lessons: what you would change now.


    ## Example

    A fictional answer: "I worked on an order-processing platform handling about 3,000 requests per second
    at peak, with a sharded relational database and a message queue between checkout and fulfilment. I
    owned the inventory service. During a sale, lock contention on hot items caused timeouts, so we moved
    to reservation records with a short expiry, which cut p99 latency from 2s to 200ms. Today I would
    add load tests for hot keys earlier."


    ## Common mistakes

    - Inflating numbers you cannot explain under follow-up.

    - Describing the whole company architecture without saying what you did.

    - No trade-offs, only a list of technologies.

    - Picking a big system you barely touched over a smaller one you deeply owned.


    ## In the interview

    Expect follow-ups: "Where was the bottleneck?", "How did you monitor it?", "What happens if this component
    fails?". Interviewers score depth of understanding, ownership, and honest estimates. If your experience
    is small-scale, say so and explain how you would scale it.

    '
