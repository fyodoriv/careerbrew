- id: kb-75f4f7d2bf2c
  question: How would you design an authentication platform?
  answer: Store credentials as salted slow hashes (bcrypt, scrypt, Argon2), support MFA and SSO via OAuth
    2.0 and OpenID Connect, issue short-lived access tokens with refresh tokens, and keep sessions revocable.
    Add rate limiting, audit logs, and key rotation.
  topic: system design
  tags:
  - authentication
  - security
  - oauth
  - system-design-interview
  explanation: '## In plain words

    An auth platform answers "who is this?" for many apps. It checks a password or another factor once,
    then hands out a token that other services can verify quickly without asking for the password again.


    ## How it works

    - **Requirements**: sign up, log in, MFA, social and enterprise login, password reset, sessions across
    devices, logout everywhere. Security and availability first.

    - **Credentials**: never store passwords; store a hash from a slow algorithm (Argon2, bcrypt) with
    a per-user salt.

    - **Login flow**: verify password, then a second factor (TOTP app, WebAuthn passkey). Rate-limit attempts
    per account and IP.

    - **Tokens**: short-lived **access token** (often a signed JWT, 5-15 minutes) that services verify
    with the platform''s public key; long-lived **refresh token** stored server-side so it can be revoked.

    - **Federation**: act as an OpenID Connect provider so apps use standard flows (authorization code
    with PKCE).

    - **Keys**: publish public keys (JWKS) and rotate signing keys regularly.

    - **Audit**: log login events, failures, and token revocations (no secrets in logs).


    ## Example

    1. 10 million users, 2 logins per day each: about 230 logins per second; Argon2 at 50 ms per hash
    needs roughly 12 CPU cores.

    2. Services verify JWTs locally: no call to the auth server on every request.

    3. A stolen laptop: the user clicks "log out everywhere", refresh tokens are revoked, and access tokens
    expire within 15 minutes.


    ## Common mistakes

    - Fast hashes like SHA-256 for passwords.

    - Long-lived JWTs with no way to revoke them.

    - Different error messages for "no such user" and "wrong password", which leaks which accounts exist.


    ## In the interview

    Separate authentication (who) from authorization (what they may do). Discuss token lifetimes, revocation,
    MFA recovery, account takeover protections, and multi-region availability of the auth service.

    '
