- id: kb-8ed77d60e4f4
  question: How would you design a package dependency system like npm?
  answer: A registry stores immutable, versioned package tarballs and metadata. The client resolves the
    dependency graph using semantic version ranges, picks versions that satisfy all constraints, writes
    a lockfile with exact versions and integrity hashes, and installs from a content-addressed cache.
  topic: system design
  tags:
  - dependency-resolution
  - graphs
  - semver
  - system-design-interview
  explanation: '## In plain words

    A package manager answers "which exact versions of which libraries do I need?" and then downloads
    them. Packages depend on other packages, so this is a graph problem, and a lockfile freezes the answer
    so every machine installs the same thing.


    ## How it works

    - **Registry**: an API with package metadata (versions, dependencies, checksums) in a database and
    tarballs in object storage behind a CDN. Published versions are immutable.

    - **Versions**: semantic versioning `MAJOR.MINOR.PATCH`; ranges like `^1.2.0` (any 1.x at least 1.2.0)
    or `~1.2.0` (1.2.x).

    - **Resolution**: starting from the project''s direct dependencies, fetch metadata, pick the highest
    version that satisfies the range, and recurse. npm allows several versions of the same package in
    different parts of the tree; stricter resolvers (like pip''s) must find one version for all, which
    can need backtracking.

    - **Lockfile**: exact versions, resolved URLs, and integrity hashes, so installs are reproducible.

    - **Install**: a content-addressed cache keyed by hash; install order follows a topological sort;
    detect cycles.

    - **Security**: signatures or provenance, integrity checks, and audits for known vulnerabilities.


    ## Example

    1. App depends on `A ^1.0` and `B ^2.0`; `B 2.3.0` depends on `A ^1.4`.

    2. The resolver picks `A 1.6.2`, which satisfies both ranges, so one copy is installed.

    3. If B instead needed `A ^2.0`, npm would nest `A 2.x` under B while the app keeps `A 1.6.2`.


    ## Common mistakes

    - Allowing republishing over an existing version.

    - Not committing the lockfile.

    - Ignoring install scripts, a common supply-chain attack path.


    ## In the interview

    Separate the registry (storage, CDN, metadata API) from the client (resolution, lockfile, cache).
    Discuss conflict handling, reproducibility, scale of downloads, and supply-chain security.

    '
