- id: kb-2a447a1eb251
  question: What is a load balancer?
  answer: A load balancer sits in front of a group of servers and distributes incoming requests among
    them, sending traffic only to healthy servers. It improves availability and lets you scale horizontally;
    it can work at layer 4 (TCP) or layer 7 (HTTP), where it can also terminate TLS and route by path.
  topic: system design
  tags:
  - load-balancing
  - networking
  - scalability
  - high-availability
  explanation: '## In plain words

    A load balancer is a traffic officer at a junction. Clients connect to one address, and the officer
    sends each request down a road to a server that is open and not too busy. If one server breaks, traffic
    goes around it.


    ## How it works

    - **Single entry point**: clients use one DNS name or IP; the balancer forwards requests to a pool
    of backends.

    - **Health checks**: periodically probe each backend; failing ones stop receiving traffic.

    - **Algorithms**: round robin, weighted, least connections, hashing (for stickiness or caches).

    - **Layer 4**: works on TCP/UDP connections; very fast, protocol-agnostic.

    - **Layer 7**: understands HTTP: route `/api` and `/images` to different pools, terminate TLS, add
    headers, compress, retry, rate limit.

    - **Benefits**: horizontal scaling, no single server as a point of failure, zero-downtime deploys
    (drain connections from a server before updating it).

    - **Placement**: in front of web servers, between internal services, and in front of databases or
    caches (proxies).

    - **Global load balancing**: DNS-based or anycast routing sends users to the nearest healthy region.

    - **Examples**: NGINX, HAProxy, Envoy, cloud load balancers.


    ## Example

    1. A site gets 12,000 requests per second; each server handles about 1,500 comfortably.

    2. Behind a load balancer, 10 servers share the traffic with headroom.

    3. During a deploy, the balancer drains server 3, the new version is installed, health checks pass,
    and it rejoins the pool.

    4. Users never see an error.


    ## Common mistakes

    - Forgetting the balancer itself needs redundancy.

    - Keeping user sessions in server memory, so balancing breaks logins.

    - Shallow health checks that pass while the app cannot reach its database.


    ## In the interview

    Give the definition, then L4 vs L7, algorithms, and health checks. Mention TLS termination, sticky
    sessions trade-offs, and global load balancing across regions.

    '
