- id: kb-bf5600b16f01
  question: What is vertical scaling?
  answer: Vertical scaling (scaling up) means giving a single machine more resources, such as more CPU
    cores, memory, faster disks, or network bandwidth, so it can handle more load. It is simple and needs
    no code changes, but it has a hardware ceiling, gets expensive, often needs downtime, and leaves a
    single point of failure.
  topic: system design
  tags:
  - scalability
  - vertical-scaling
  - infrastructure
  - trade-offs
  explanation: "## In plain words\nVertical scaling is replacing your car with a bigger truck instead\
    \ of buying a second car. Everything stays in one place, so nothing about how you work changes; you\
    \ just have a more powerful machine.\n\n## How it works\n- **Resize the machine**: move to an instance\
    \ type with more vCPUs, RAM, faster SSDs, or better networking. On physical servers, add hardware.\n\
    - **Pros**:\n  - No architecture change: no sharding, no distributed coordination.\n  - Strong consistency\
    \ and simple transactions stay easy.\n  - Often the fastest fix for a database under pressure.\n-\
    \ **Cons**:\n  - **Ceiling**: the largest available machine is the limit.\n  - **Cost**: prices often\
    \ rise faster than capacity at the top end.\n  - **Downtime**: resizing usually means a restart or\
    \ failover.\n  - **Single point of failure**: one big machine is still one machine.\n  - Diminishing\
    \ returns if the software cannot use more cores (locks, single-threaded parts).\n- **When it fits**:\
    \ early-stage products, relational databases, workloads that are hard to partition, and as a quick\
    \ buy-time step before horizontal scaling.\n\n## Example\n1. A PostgreSQL server with 8 vCPUs and\
    \ 32 GB RAM runs at 90% CPU, and the working set (about 50 GB) no longer fits in memory, so disk reads\
    \ spike.\n2. Moving to 32 vCPUs and 128 GB RAM puts the whole working set in memory and drops CPU\
    \ to 35%.\n3. The change takes a 2-minute failover to a pre-resized replica.\n4. That buys perhaps\
    \ a year before read replicas or sharding are needed.\n\n## Common mistakes\n- Assuming more cores\
    \ always help; check whether the workload is CPU, memory, I/O, or lock bound.\n- Forgetting a standby,\
    \ so the one big server is still a single point of failure.\n- Never planning for when the largest\
    \ machine is not enough.\n\n## In the interview\nContrast with horizontal scaling, list pros and cons,\
    \ and say when you would pick it (databases, simplicity, early stage). Show you know it buys time\
    \ and does not remove the need for redundancy.\n"
