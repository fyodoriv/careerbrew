- id: kb-25434df15249
  question: What is failover?
  answer: Failover is automatically (or manually) switching work from a failed component to a standby
    or another healthy one, such as promoting a database replica to primary or moving traffic to another
    region. It relies on failure detection, a ready backup, and redirecting clients, and it must avoid
    two components acting as primary at once.
  topic: system design
  tags:
  - high-availability
  - failover
  - replication
  - reliability
  explanation: "## In plain words\nFailover is the spare tyre of a system. When the main component stops\
    \ working, a backup takes over its job so users can carry on, ideally without noticing.\n\n## How\
    \ it works\n- **Detect**: health checks or heartbeats notice the primary is down (after several missed\
    \ checks, to avoid false alarms).\n- **Decide**: an orchestrator or a consensus group decides to fail\
    \ over. Requiring a majority vote prevents a single confused node from acting alone.\n- **Promote**:\
    \ a standby becomes the new primary. For databases, choose the replica with the most up-to-date data.\n\
    - **Redirect**: update DNS, move a virtual IP, or update service discovery so clients reach the new\
    \ primary.\n- **Fence the old primary**: make sure it cannot accept writes if it comes back (revoke\
    \ its lease, shut it off, use fencing tokens). Otherwise you get **split brain**: two primaries with\
    \ diverging data.\n- **Standby types**:\n  - *Active-passive*: standby is idle until needed (hot,\
    \ warm, or cold depending on readiness).\n  - *Active-active*: all nodes serve traffic; failover just\
    \ removes the dead one.\n- **Failback**: returning to the original primary later, carefully, after\
    \ it catches up.\n\n## Example\n1. A PostgreSQL primary in zone A has a synchronous replica in zone\
    \ B.\n2. Zone A loses power; health checks fail 3 times in 15 seconds.\n3. The orchestrator promotes\
    \ the zone B replica and updates the DNS record with a 30-second TTL.\n4. Total disruption: about\
    \ 45 seconds, with no lost committed transactions because replication was synchronous.\n5. With asynchronous\
    \ replication, the last second or so of writes could be lost.\n\n## Common mistakes\n- No fencing,\
    \ leading to split brain.\n- Long DNS TTLs, so clients keep calling the dead primary.\n- Never testing\
    \ failover, so it fails when needed.\n\n## In the interview\nWalk through detect, decide, promote,\
    \ redirect, fence. Discuss synchronous vs asynchronous replication (data loss vs latency), split brain,\
    \ and RTO/RPO targets.\n"
  match:
  - 25434df15249
  prompt: 1f344914
- id: kb-7170f02909c8
  question: What is HADR (high availability and disaster recovery)?
  answer: HADR combines high availability, which keeps a service running through local failures using
    redundancy and automatic failover, with disaster recovery, which restores service after a large-scale
    loss such as a whole region going down, using backups and replicas in another location. They are measured
    by uptime targets and by RTO and RPO.
  topic: system design
  tags:
  - high-availability
  - disaster-recovery
  - rto
  - rpo
  explanation: "## In plain words\nHigh availability is about surviving small, frequent failures (a server\
    \ dies) without users noticing. Disaster recovery is about coming back after rare, big failures (a\
    \ data centre floods). HADR is planning for both.\n\n## How it works\n- **High availability (HA)**:\n\
    \  - Remove single points of failure: multiple instances, load balancers, database replicas, spread\
    \ across availability zones.\n  - Automatic **failover**: health checks detect failure and traffic\
    \ moves to a healthy copy in seconds.\n  - Measured as uptime (99.9% is about 8.8 hours of downtime\
    \ per year; 99.99% about 53 minutes).\n- **Disaster recovery (DR)**:\n  - Copies in another region:\
    \ backups, replicated databases, infrastructure as code to rebuild.\n  - **RTO** (recovery time objective):\
    \ how long until service is back.\n  - **RPO** (recovery point objective): how much recent data you\
    \ can afford to lose.\n  - Strategies from cheap to expensive: backup and restore (hours), pilot light\
    \ (minimal standby), warm standby (scaled-down copy running), multi-site active-active (near zero).\n\
    - **Testing**: regular failover and restore drills.\n\n## Example\n1. An order database has a synchronous\
    \ replica in a second zone: if the primary fails, failover takes about 30 seconds with no data loss\
    \ (HA).\n2. It also replicates asynchronously to another region with about 5 seconds of lag and nightly\
    \ backups to separate storage (DR).\n3. If the whole primary region fails, the team promotes the remote\
    \ replica: RTO 30 minutes, RPO about 5 seconds.\n\n## Common mistakes\n- Treating replicas as backups;\
    \ a bad delete replicates instantly.\n- Never testing restores or region failover.\n- Choosing targets\
