- id: kb-c80e9ac3a864
  question: What is the pattern of separating data and metadata storage?
  answer: The pattern stores large content (files, images, video, blobs) in a cheap, scalable blob or
    object store, and keeps small descriptive metadata (owner, name, size, location, permissions, versions)
    in a database that supports queries and transactions. Each store does what it is good at.
  topic: system design
  tags:
  - storage
  - object-storage
  - metadata
  - architecture
  explanation: '## In plain words

    A library keeps books on shelves and a catalogue of cards that say what each book is and where it
    sits. Searching the catalogue is quick; you only walk to the shelf when you need the book. Systems
    do the same with big files and their descriptions.


    ## How it works

    - **Data store**: object or blob storage (S3-like, a distributed file system). Cheap per byte, very
    durable, scales to petabytes, but only supports simple get and put by key.

    - **Metadata store**: a relational or key-value database with rows such as `id, owner, filename, size,
    content_type, checksum, storage_key, version, created_at, acl`. Supports queries ("all files of user
    7 sorted by date"), indexes, and transactions.

    - **Write flow**: upload content first, then create the metadata row pointing to it (so metadata never
    points to missing data). A cleanup job removes orphaned objects.

    - **Read flow**: query metadata, check permissions, then fetch the content (often by redirecting the
    client to a signed URL or CDN).

    - **Benefits**: each tier scales independently; listing and searching never touch big blobs; content
    can move between storage tiers without changing ids.

    - **Examples**: file sync services, photo apps, video platforms, distributed file systems (a name
    node or metadata server plus data nodes).


    ## Example

    1. A photo app stores 2 billion photos averaging 3 MB: about 6 PB in object storage.

    2. Metadata is about 500 bytes per photo: about 1 TB in a sharded database.

    3. "Show my 50 latest photos" is one indexed query on 1 TB of metadata, then 50 thumbnail fetches
    from a CDN.


    ## Common mistakes

    - Storing blobs in database rows, which bloats backups and slows queries.

    - Writing metadata before the upload succeeds, leaving broken references.

    - Forgetting that metadata becomes the bottleneck at scale and needs its own sharding.


    ## In the interview

    Name the pattern when designing any file-heavy system, explain the write order and orphan cleanup,
    and discuss scaling the metadata tier.

    '
