- id: kb-6afaa2c8c8d5
  question: How would you design a collaborative document editor like Google Docs?
  answer: Each document has a session server that receives edit operations over WebSockets, orders them,
    transforms concurrent ones with operational transformation (or merges with CRDTs), persists them to
    an operation log with periodic snapshots, and broadcasts them to all editors along with cursors and
    presence.
  topic: system design
  tags:
  - collaboration
  - operational-transformation
  - websockets
  - system-design-interview
  explanation: '## In plain words

    Several people type in the same document at once and all see the same text within a moment. Each keystroke
    is sent as a small operation like "insert ''a'' at position 10"; a server orders the operations and
    adjusts them so everyone ends with an identical document.


    ## How it works

    - **Client**: applies edits locally at once, sends operations with the document version it is based
    on, and receives others'' operations.

    - **Session server**: one per active document (chosen by consistent hashing on document id). It assigns
    each operation a sequence number. If an operation was based on an older version, it is **transformed**
    against the operations that came in between (OT), then broadcast.

    - **CRDT alternative**: each character gets a unique, ordered id so edits merge in any order without
    a central transformer; good for offline and peer-to-peer, but more metadata.

    - **Storage**: append operations to a log; save a snapshot every few hundred operations; loading =
    snapshot + later operations. This also powers version history.

    - **Presence**: cursors and selections are sent as lightweight, non-persisted messages.

    - **Other services**: permissions, comments, export, search indexing from snapshots.


    ## Example

    1. Text is "cat". Alice inserts "s" at position 3; Bob, at the same time, inserts "the " at position
    0.

    2. The server receives Bob''s first. Alice''s insert at 3 is transformed to position 7 because 4 characters
    were added before it.

    3. Everyone sees "the cats".

    4. Sizing: most documents are idle at any moment. If 100,000 documents are open at once with 3 editors
    each typing 2 operations per second, that is 600,000 small operations per second; at a few thousand
    active documents per session server, about 50 servers are needed.


    ## Common mistakes

    - Sending the full document on each change.

    - Last-writer-wins on the whole document.

    - No plan for when the session server fails (clients reconnect and resend unacknowledged operations).


    ## In the interview

    Explain why a single ordering point per document simplifies OT, then compare with CRDTs. Discuss offline
    editing, failover of session servers, history, and access control.

    '
