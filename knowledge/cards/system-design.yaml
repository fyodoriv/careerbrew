- id: kb-9993af5d8c04
  question: How do you debug and resolve operational events such as outages, slowdowns, or error spikes?
  answer: 'First mitigate: confirm impact, communicate, and restore service (roll back, fail over, scale,
    or shed load). Then diagnose with metrics, logs, and traces by narrowing scope and checking recent
    changes. Afterwards, write a blameless postmortem with root cause and action items.'
  topic: system design
  tags:
  - incident-response
  - observability
  - on-call
  - debugging
  explanation: "## In plain words\nWhen production breaks, the first job is to stop the bleeding, not\
    \ to find the perfect root cause. Restore service quickly, keep people informed, then investigate\
    \ calmly and make sure it does not happen again.\n\n## How it works\n- **Detect and declare**: an\
    \ alert or report arrives; check dashboards to confirm user impact; declare an incident with a severity\
    \ and an incident commander.\n- **Mitigate**: the fastest safe action. Roll back the last deploy,\
    \ turn off a feature flag, fail over to another region, scale up, or shed non-critical traffic.\n\
    - **Diagnose** using a narrowing approach:\n  - What changed? Deploys, config, traffic, dependencies.\n\
    \  - Where? One region, one host, one endpoint, one customer?\n  - Use **RED** metrics (rate, errors,\
    \ duration) per service, traces to find the slow hop, and logs for error details.\n  - Check saturation:\
    \ CPU, memory, connection pools, queue depth, disk.\n- **Communicate**: regular status updates internally\
    \ and on a status page.\n- **Learn**: a blameless postmortem with timeline, root cause, contributing\
    \ factors, and owned action items.\n\n## Example\n1. Alert: checkout error rate is 8% (normal 0.2%).\n\
    2. Dashboard shows errors started at 14:02; a deploy finished at 14:00.\n3. Roll back at 14:10; errors\
    \ drop back to normal.\n4. Traces show a new query timing out against the payments database; the fix\
    \ adds an index, and a test and a canary stage are added to the deploy pipeline.\n\n## Common mistakes\n\
    - Debugging for an hour before rolling back an obvious suspect.\n- Several people changing things\
    \ at once without coordination.\n- Postmortems that blame a person instead of fixing the system.\n\
    \n## In the interview\nStructure your answer as detect, mitigate, diagnose, communicate, learn. Mention\
    \ MTTD and MTTR, runbooks, and examples of systemic fixes such as canaries, better alerts, and timeouts.\n"
