- id: kb-083ae91cc956
  question: How would you implement ETag caching on a backend when the data can change in the database?
  answer: Compute an ETag from a version of the resource (a version column, updated_at, or a hash of the
    response) and send it with the response. On a later request with If-None-Match, compare it to the
    current version and return 304 Not Modified if it matches. Updating the data changes the version,
    which automatically invalidates the ETag.
  topic: system design
  tags:
  - http-caching
  - etag
  - conditional-requests
  - api
  explanation: "## In plain words\nAn ETag is a fingerprint of a response. The client says \"I have the\
    \ version with fingerprint X\"; if the data has not changed, the server answers \"still good\" with\
    \ no body, saving bandwidth and work.\n\n## How it works\n- **Generate**: cheapest is from a version\
    \ you already have: a `version` integer incremented on each update, or `updated_at`. Alternatively\
    \ hash the serialized response (correct but you must build the response first).\n- **Send**: `ETag:\
    \ \"v42\"` along with `Cache-Control: no-cache` (which means \"revalidate each time\", not \"do not\
    \ store\").\n- **Revalidate**: the client sends `If-None-Match: \"v42\"`. The server reads only the\
    \ current version (a small, indexed query), and if it matches returns **304 Not Modified**.\n- **Invalidation**:\
    \ any write bumps the version in the same transaction, so the next request sees a different ETag.\
    \ No separate cache purge needed.\n- **Collections**: for list endpoints, combine the max `updated_at`\
    \ and the row count, or keep a collection-level version.\n- **Concurrency bonus**: `If-Match` on PUT\
    \ lets you reject stale writes with 412.\n\n## Example\n```python\nfrom flask import Flask, request,\
    \ jsonify, make_response\n\napp = Flask(__name__)\nDB = {\"1\": {\"name\": \"Book\", \"version\":\
    \ 42}}\n\n@app.get(\"/items/<item_id>\")\ndef get_item(item_id):\n    item = DB[item_id]\n    etag\
    \ = f'\"v{item[\"version\"]}\"'\n    if request.headers.get(\"If-None-Match\") == etag:\n        return\
    \ \"\", 304\n    resp = make_response(jsonify(item))\n    resp.headers[\"ETag\"] = etag\n    resp.headers[\"\
    Cache-Control\"] = \"no-cache\"\n    return resp\n```\n\n## Common mistakes\n- Hashing the full response\
    \ but still running every expensive query, which saves bandwidth but not server time.\n- Forgetting\
    \ that permissions or language change the response; include them in the ETag or use `Vary`.\n- Weak\
    \ vs strong ETags confusion with byte-range requests.\n\n## In the interview\nExplain the request\
    \ flow with headers, how writes invalidate naturally, and how this works with CDNs. Compare with `Last-Modified`\
    \ and with time-based caching.\n"
