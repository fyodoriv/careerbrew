  question: What is the difference between REST and RPC?
  answer: REST models an API as resources addressed by URLs and manipulated with standard HTTP methods,
    which is uniform and cache-friendly. RPC models it as calling remote functions (for example gRPC with
    Protocol Buffers), which is efficient and strongly typed, suits internal service-to-service calls,
    but is less uniform and harder to cache.
  topic: system design
  tags:
  - api-design
  - rest
  - grpc
  - rpc
  explanation: "## In plain words\nREST thinks in nouns: \"here is an order; GET it, PATCH it\". RPC thinks\
    \ in verbs: \"call `cancelOrder(id)` on that server\". Both send requests over the network; they differ\
    \ in how you shape and describe the API.\n\n## How it works\n- **REST**:\n  - Resources (`/orders/42`),\
    \ HTTP methods (GET, POST, PUT, PATCH, DELETE), status codes, usually JSON.\n  - Stateless requests;\
    \ GET responses can be cached by browsers and CDNs.\n  - Easy to explore with curl; great for public\
    \ APIs.\n  - Awkward for actions that are not CRUD.\n- **RPC**:\n  - Methods with typed inputs and\
    \ outputs (`CancelOrder(CancelOrderRequest)`).\n  - gRPC uses HTTP/2 and Protocol Buffers: compact\
    \ binary, generated clients, streaming in both directions, deadlines.\n  - Great for internal microservice\
    \ calls with high volume and strict contracts.\n  - Harder for browsers (needs gRPC-Web) and generic\
    \ caching.\n- **Others**: GraphQL lets clients ask for exactly the fields they need; JSON-RPC is a\
    \ simple RPC over JSON.\n\n## Example\nREST:\n```http\nPOST /orders/42/cancellation\n```\ngRPC (Protocol\
    \ Buffers definition):\n```proto\nservice Orders {\n  rpc CancelOrder(CancelOrderRequest) returns\
    \ (Order);\n}\nmessage CancelOrderRequest { string order_id = 1; }\n```\nA public partner API might\
    \ use REST; the order service calling inventory 20,000 times a second might use gRPC for lower payload\
    \ size and latency.\n\n## Common mistakes\n- Calling any JSON over HTTP \"REST\" even when it is RPC\
    \ style (`/doThing`).\n- Picking gRPC for a public browser API without considering clients.\n- Ignoring\
    \ versioning and backward compatibility in either style.\n\n## In the interview\nCompare on coupling,\
    \ performance, tooling, caching, and audience. A common answer: REST (or GraphQL) at the edge for\
    \ external clients, gRPC between internal services.\n"
