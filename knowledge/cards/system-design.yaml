- id: kb-5aa48c2acaa0
  question: What are the trade-offs between a monolith and microservices?
  answer: 'A monolith is one deployable application: simple to build, test, and debug, with in-process
    calls and one database, but harder to scale teams and parts independently. Microservices split by
    business capability into separately deployed services: independent scaling and releases, at the cost
    of network calls, distributed data, and heavy operational overhead.'
  topic: system design
  tags:
  - architecture
  - microservices
  - monolith
  - trade-offs
  explanation: "## In plain words\nA monolith is one big program; microservices are many small programs\
    \ that talk over the network. Splitting helps large organizations move independently, but it turns\
    \ simple function calls into network calls that can fail, so it adds a lot of complexity.\n\n## How\
    \ it works\n- **Monolith**:\n  - One codebase, one deploy, usually one database.\n  - Pros: easy local\
    \ development, simple transactions, fast calls, simple debugging.\n  - Cons: one deploy for everything,\
    \ a bug can take down the whole app, scaling means scaling all of it, teams step on each other.\n\
    - **Modular monolith**: one deploy, but strict internal modules with clear interfaces. A good middle\
    \ ground.\n- **Microservices**:\n  - Each service owns its data and is deployed alone, often by one\
    \ team.\n  - Pros: independent releases and scaling, fault isolation, freedom of technology.\n  -\
    \ Cons: network latency and failures, distributed transactions (sagas), data consistency, versioned\
    \ APIs, service discovery, tracing, many pipelines.\n- **When to split**: when team size, deploy contention,\
    \ or very different scaling needs justify the overhead. Split along business boundaries (bounded contexts).\n\
    \n## Example\n1. A startup with 8 engineers ships faster with a modular monolith and one PostgreSQL\
    \ database.\n2. At 150 engineers, the payments team needs stricter reliability and a different release\
    \ rhythm, so payments becomes its own service with its own database.\n3. The video transcoding part\
    \ needs GPUs and bursty scaling, so it also becomes a separate service fed by a queue.\n\n## Common\
    \ mistakes\n- Starting with microservices before knowing the domain boundaries.\n- A \"distributed\
    \ monolith\": services that share a database or must deploy together.\n- Too-fine services that chat\
    \ constantly.\n\n## In the interview\nAvoid a one-sided answer. Tie the choice to team size, domain\
    \ clarity, scaling needs, and operational maturity, and mention migrating gradually (the strangler\
    \ fig pattern).\n"
