- id: kb-bedefa8da0c0
  question: How would you design a collaborative spreadsheet like Google Sheets?
  answer: Store the sheet as cells plus a formula dependency graph, send edits as small operations over
    WebSockets to a per-document session server that orders them, and resolve concurrent edits with operational
    transformation or CRDTs. Recalculate only cells that depend on the changed ones.
  topic: system design
  tags:
  - collaboration
  - real-time
  - crdt
  - system-design-interview
  explanation: '## In plain words

    A shared spreadsheet is a grid many people edit at once. Every keystroke becomes a small operation
    ("set B2 to 5"), which is sent to a server that puts all operations in one order and forwards them
    to everyone, so all screens end up showing the same sheet.


    ## How it works

    - **Data model**: a sheet is a sparse map of cell id to value or formula, plus formatting. Formulas
    form a **dependency graph** (C1 depends on A1 and B1).

    - **Edit path**: the client applies the edit locally right away (optimistic), sends the operation
    over a WebSocket to the **session server** that owns the document, which assigns a version number,
    persists it to an operation log, and broadcasts it.

    - **Concurrency**: cell edits rarely conflict; when two users edit the same cell, last-writer-wins
    by server order is usually fine. Structural edits (inserting a row) shift references, so they need
    operational transformation or a CRDT.

    - **Recalculation**: when a cell changes, walk the dependency graph in topological order and recompute
    only affected cells; detect cycles and show an error.

    - **Storage**: periodic snapshots plus the operation log since the snapshot, which also gives version
    history.


    ## Example

    1. User A types `=A1+B1` in C1. The client shows the result immediately.

    2. User B inserts a row above row 1 at the same moment. The server transforms A''s operation so C1
    becomes C2 and its formula becomes `=A2+B2`.

    3. A sheet with 1 million cells at 50 bytes each is about 50 MB, so it can stay in the session server''s
    memory.


    ## Common mistakes

    - Sending the whole sheet on every change.

    - Recalculating every formula instead of the dependents.

    - Forgetting offline edits and reconnection.


    ## In the interview

    Explain why one server per document simplifies ordering, then discuss how you shard documents across
    servers, presence cursors, permissions, and OT vs CRDT trade-offs.

    '
