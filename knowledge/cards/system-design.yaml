- id: kb-2b1ba4c1ced3
  question: What is rate limiting?
  answer: Rate limiting caps how many requests a client can make in a time period, such as 100 per minute
    per API key. It protects services from overload and abuse, keeps usage fair between clients, and controls
    cost. Excess requests are rejected (HTTP 429), delayed, or queued.
  topic: system design
  tags:
  - rate-limiting
  - api
  - reliability
  - security
  explanation: "## In plain words\nRate limiting is a speed limit for requests. Each client may only send\
    \ so many in a period, so one buggy script or attacker cannot crowd out everyone else or knock the\
    \ service over.\n\n## How it works\n- **Identify the client**: API key, user id, IP address, or a\
    \ combination; limits can differ per plan or endpoint.\n- **Algorithms**:\n  - *Fixed window*: count\
    \ per calendar minute; simple, allows double bursts at window edges.\n  - *Sliding window*: counts\
    \ over the last 60 seconds; smoother.\n  - *Token bucket*: a bucket refills at a steady rate; each\
    \ request spends a token; allows short bursts up to the bucket size.\n  - *Leaky bucket*: processes\
    \ at a constant rate, queueing extras.\n- **Where**: API gateway, reverse proxy, service middleware,\
    \ or in the client (self-throttling).\n- **Shared state**: in a cluster, counters live in a fast store\
    \ such as Redis, updated atomically.\n- **Response**: HTTP 429 Too Many Requests with `Retry-After`,\
    \ plus headers such as remaining quota.\n- **Related**: load shedding (drop low-priority work when\
    \ overloaded) and backpressure.\n- **Uses**: login attempts (brute force protection), public APIs,\
    \ expensive endpoints, outgoing calls to a third party with its own limits.\n\n## Example\n1. A public\
    \ API allows 1,000 requests per hour per key, with bursts up to 50.\n2. A customer's script loops\
    \ by mistake and sends 300 requests per second.\n3. After 50 burst requests, the gateway returns 429\
    \ with `Retry-After: 4`.\n4. Other customers see no slowdown.\n\n## Common mistakes\n- Limiting only\
    \ by IP, which punishes users behind a shared corporate network and misses distributed attackers.\n\
    - Non-atomic counters that let bursts through.\n- No clear headers, so clients cannot back off properly.\n\
    \n## In the interview\nExplain the purpose, compare two or three algorithms, and say where state lives\
    \ in a distributed setup. Mention fail-open vs fail-closed when the limiter's store is down.\n"
