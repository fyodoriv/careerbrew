- id: kb-0d5f3c79fd5c
  question: What is operational transformation (OT)?
  answer: 'Operational transformation is a technique for real-time collaborative editing: each edit is
    an operation such as insert or delete at a position, and when two operations happen concurrently,
    one is transformed against the other (for example, shifting its position) so that applying them in
    any order gives the same document on every client.'
  topic: system design
  tags:
  - operational-transformation
  - collaboration
  - real-time
  - concurrency
  explanation: "## In plain words\nWhen two people type in the same document at once, their edits refer\
    \ to positions in a document that the other person is changing. OT fixes this by adjusting each edit\
    \ to account for the other one, so both edits survive and everyone ends up with the same text.\n\n\
    ## How it works\n- **Operations**: `insert(pos, text)` and `delete(pos, length)`, applied to a specific\
    \ document version.\n- **Transform function**: `T(a, b)` returns a version of `a` that can be applied\
    \ after `b`. For two inserts: if `b` inserts before `a`'s position, shift `a` right by `b`'s length.\
    \ Ties (same position) need a rule such as client id order.\n- **Server ordering**: in most production\
    \ systems (Google Docs style), a central server orders operations. A client sends an operation tagged\
    \ with the version it saw; the server transforms it against operations it has applied since, assigns\
    \ the next version, and broadcasts it.\n- **Client side**: the client applies its own edits immediately,\
    \ keeps a queue of unacknowledged ones, and transforms incoming server operations against them.\n\
    - **Correctness properties**: convergence (all copies end equal) and intention preservation (each\
    \ edit keeps its meaning).\n\n## Example\n```python\ndef transform_insert(op, other):\n    # op and\
    \ other are (pos, text) inserts made on the same version\n    pos, text = op\n    opos, otext = other\n\
    \    if opos < pos or (opos == pos and otext < text):\n        return (pos + len(otext), text)\n \
    \   return op\n\ndoc = \"abc\"\na = (1, \"X\")  # Alice: insert X at 1\nb = (3, \"Y\")  # Bob: insert\
    \ Y at 3\nafter_b = doc[:3] + \"Y\" + doc[3:]\na2 = transform_insert(a, b)\nprint(after_b[:a2[0]]\
    \ + a2[1] + after_b[a2[0]:])  # aXbcY\n```\n\n## Common mistakes\n- Thinking OT works peer-to-peer\
    \ easily; without a central server the transform rules get very hard to prove correct.\n- Ignoring\
    \ tie-breaking at equal positions.\n- Confusing OT with CRDTs, which avoid transformation by giving\
    \ each character a unique ordered id.\n\n## In the interview\nExplain the position-shift idea with\
    \ a tiny example, the role of the server in ordering, and compare with CRDTs (offline support, metadata\
    \ cost). Mention undo and cursor positions as follow-ups.\n"
