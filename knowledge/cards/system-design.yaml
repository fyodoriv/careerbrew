- id: kb-9113b81d3969
  question: How do you optimize an app that relies heavily on maps and geographic data?
  answer: Serve map tiles (ideally vector tiles) from a CDN with long caching, load only the visible area,
    cluster dense markers, index locations with geohashes or a spatial index for nearby queries, throttle
    location updates, and cache geocoding results. Precompute heavy layers offline.
  topic: system design
  tags:
  - geospatial
  - performance
  - caching
  - maps
  explanation: '## In plain words

    Map apps can be slow because they show lots of images, many points, and frequent location changes.
    The fix is to only fetch what is on screen, reuse what you already fetched, and let the server answer
    "what is near here?" with a spatial index instead of scanning everything.


    ## How it works

    - **Tiles**: the map is cut into tiles per zoom level. Use vector tiles (smaller, styled on the client),
    serve them from a CDN, and cache them on the device.

    - **Viewport loading**: request points only for the visible bounding box and current zoom; debounce
    requests while the user pans.

    - **Clustering**: group nearby markers into one bubble at low zoom (server-side or with a client library),
    so you never draw 50,000 pins.

    - **Spatial indexing**: store locations with a geohash, S2, or H3 cell id, or use PostGIS with a GiST
    index; "nearby" becomes a lookup of a few cells.

    - **Location updates**: send updates only when the user moved meaningfully or every few seconds; batch
    them.

    - **Geocoding**: cache address lookups; they are slow and often rate-limited or billed.

    - **Precompute**: heatmaps and heavy overlays offline into tiles.


    ## Example

    1. A store locator has 200,000 stores.

    2. At city zoom the viewport has 3,000 stores; the server returns 40 clusters instead.

    3. Zooming in to street level returns the 60 individual stores in view.

    4. Nearby search uses a geohash prefix of 6 characters (cells about 1 km wide) and checks the 8 neighbour
    cells.


    ## Common mistakes

    - Fetching all points at app start.

    - Using latitude and longitude range queries without a spatial index.

    - Forgetting that geohash cells near boundaries need neighbour checks.


    ## In the interview

    Split the problem into rendering (tiles, clustering) and querying (spatial index). Mention bandwidth
    on mobile, battery use from GPS, and caching with a CDN.

    '
