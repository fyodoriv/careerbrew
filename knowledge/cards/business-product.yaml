- id: kb-b8c4fad54a6f
  question: What makes a product AI-native?
  answer: An AI-native product is designed around what models can do, so the core value would not exist
    without AI, rather than adding a chat box to an existing app. It typically centres on intent instead
    of manual steps, improves with data and feedback, handles uncertainty in its UX, and is built to evolve
    as models improve.
  topic: business/product
  tags:
  - ai
  - product-strategy
  - ux
  explanation: '## In plain words

    An "AI-added" product bolts a feature onto an old workflow. An AI-native product starts from a new
    question: if software could read, write and reason a little, what would the workflow look like? The
    answer usually removes steps rather than speeding them up.


    ## How it works

    - **Core value depends on AI**: remove the model and the product no longer works.

    - **Intent-first interaction**: users state goals ("draft the quarterly report from these files"),
    and the product plans and executes, with the user reviewing.

    - **Designed for uncertainty**: shows sources and confidence, makes outputs editable, keeps a human
    in control of risky actions.

    - **Feedback loops**: user edits, ratings and outcomes feed evaluation and improvement.

    - **Context and data**: connects to the user''s own content and tools, with clear privacy controls.

    - **Built for change**: model-agnostic architecture, evaluation suites and cost controls so better
    or cheaper models can be swapped in.

    - **Different economics**: cost per task (inference) matters, unlike most traditional software.


    ## Example

    A fictional comparison. A traditional note app adds an "AI summarise" button: AI-added. An AI-native
    notes product listens to a meeting, writes the summary, extracts action items, files them in the team''s
    task tracker and drafts follow-up emails, asking the user to approve each. Without the model, the
    product has no reason to exist.


    ## Common mistakes

    - Calling any product with a chatbot AI-native.

    - Ignoring failure handling and trust.

    - Forgetting inference costs in the business model.

    - Locking into one model provider with no evaluation to compare alternatives.


    ## In the interview

    Give a crisp definition, contrast it with AI-added, and name a few traits. Interviewers look for product
    judgment: when AI should be central versus a helper, how to earn user trust, and how to measure value
    (task completion, time saved), not just usage.

    '
  match:
