- id: kb-bc8a10357b01
  question: What is an SLO (service level objective)?
  answer: An SLO is an internal reliability target for a service, defined on a measured indicator (SLI)
    over a time window, such as 99.9% of requests succeeding within 300 ms over 28 days. The gap between
    the target and 100% is the error budget, which guides how fast teams can ship versus when to focus
    on reliability.
  topic: business/product
  tags:
  - slo
  - reliability
  - sre
  - error-budget
  explanation: '## In plain words

    An SLO is the team''s own goal for "reliable enough". Aiming for 100% is too expensive and slows everything
    down, so you pick a target that keeps users happy and treat the small remainder as a budget you are
    allowed to spend on change and risk.


    ## How it works

    - **Pick an SLI** that reflects user experience: availability (good requests / total), latency (share
    under a threshold), freshness or correctness.

    - **Set the target and window**: for example 99.9% over a rolling 28 days.

    - **Error budget** = 1 − SLO. At 99.9% with 10 million requests a month, 10,000 may fail.

    - **Use the budget**: when there is budget left, ship features; when it is spent, slow releases and
    prioritise reliability work.

    - **Alert on burn rate**: how fast the budget is being used, rather than on every error.

    - **Review** targets with product and users; SLOs are usually stricter than any external SLA.


    ## Example

    An API''s SLO: 99.9% of requests return non-5xx within 500 ms over 28 days. In week two, a bad deploy
    fails 0.4% of requests for a day. Assuming steady traffic, the budget is 0.1% of requests across 28
    days; failing 0.4% for one day uses 0.4 ÷ (0.1 × 28) ≈ 14% of it, so they keep shipping but add a
    canary stage.


    ## Common mistakes

    - Choosing internal metrics like CPU instead of user-facing ones.

    - Setting 100% or too many nines.

    - Defining an SLO and never using the error budget in decisions.

    - Alerting on every blip instead of burn rate.


    ## In the interview

    Explain SLI, SLO, SLA and the error budget in one breath, then show how the budget drives decisions.
    Follow-ups: choosing good SLIs, multi-window burn-rate alerts, and getting product teams to agree
    on targets.

    '
