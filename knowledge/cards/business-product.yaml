- id: kb-172d6cc19a66
  question: What is your favourite product, and why?
  answer: Pick a product you know well, name who it is for and the problem it solves, explain the specific
    design or business choices that make it work, back them with evidence, and finish with one thoughtful
    improvement and how you would measure it.
  topic: business/product
  tags:
  - product-sense
  - behavioral
  - interviews
  explanation: '## In plain words

    This question tests product sense, not taste. The interviewer wants to see that you can explain why
    something works for its users, think about trade-offs, and suggest improvements like a product-minded
    engineer.


    ## How it works

    A strong answer follows this shape:

    - **Pick well**: a product you use often and can discuss in depth; it does not need to be famous.

    - **Users and problem**: who uses it and what job it does for them.

    - **Why it works**: two or three specific choices, such as an onboarding flow, a default, performance,
    pricing, or a network effect.

    - **Evidence**: your own behaviour, observed behaviour, or public facts you are sure of.

    - **Trade-offs**: what the product gave up to be good at its main job.

    - **Improvement**: one concrete change, who it helps, the risk, and the metric you would watch.

    - Keep it to about two minutes, then invite questions.


    ## Example

    A fictional sample answer: "I like a particular offline maps app. It''s built for hikers who lose
    signal. Its best choice is downloading regions by default before a trip, so the main failure, getting
    lost without data, just doesn''t happen. It also keeps the map screen uncluttered, at the cost of
    hiding advanced features. One improvement: warn when a downloaded region is out of date before a planned
    route. I''d measure it by the share of trips started with fresh maps and by support tickets about
    wrong trails."


    ## Common mistakes

    - Choosing a product only because it is popular, then giving generic praise ("it''s easy to use").

    - No user or problem in the answer.

    - Suggesting a big feature without trade-offs or metrics.

    - Talking for too long.


    ## In the interview

    Signals scored: clear user focus, specific insights, structured thinking, and data-driven improvement
    ideas. Expect follow-ups: "How would you grow it?", "What would you remove?", "How would you measure
    success?". Prepare two products in different categories.

    '
