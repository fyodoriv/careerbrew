- id: kb-efbd841bd566
  question: What is an SLA (service level agreement)?
  answer: An SLA is a formal agreement between a provider and a customer that promises a level of service,
    such as 99.9% monthly availability, and states the consequences, usually service credits, when it
    is missed. It is built on internal measures (SLIs) and targets (SLOs) that are usually stricter than
    the promise.
  topic: business/product
  tags:
  - sla
  - reliability
  - sre
  - contracts
  explanation: "## In plain words\nAn SLA is a written promise with a penalty. The provider says \"we\
    \ will be available this much of the time\", and if they fall short, the customer gets something back,\
    \ such as a discount.\n\n## How it works\n- **Contents**: what is covered, how it is measured (and\
    \ from where), the target (for example 99.9% uptime per month), exclusions (planned maintenance, customer\
    \ errors), the claim process, and credits.\n- **Relationship to SLIs and SLOs**:\n  - SLI (service\
    \ level indicator): the measurement, for example the share of successful requests.\n  - SLO (service\
    \ level objective): the internal target, for example 99.95%.\n  - SLA: the external commitment, often\
    \ looser than the SLO so the team has a buffer.\n- **Downtime budgets**: 99.9% allows about 43 minutes\
    \ per 30-day month; 99.99% about 4.3 minutes.\n- **Composition**: a service that depends on several\
    \ others in series cannot exceed the product of their availabilities.\n\n## Example\nA fictional cloud\
    \ database SLA: 99.95% monthly availability. Below 99.95%, a 10% credit; below 99%, a 25% credit.\
    \ One month has 60 minutes of downtime out of 43,200: availability is 1 − 60/43,200 ≈ 99.86%, so customers\
    \ can claim the 10% credit.\n\n## Common mistakes\n- Using SLA and SLO as synonyms.\n- Promising externally\
    \ the same number you aim for internally, leaving no buffer.\n- Promising more nines than your dependencies\
    \ can support.\n- Not defining how availability is measured.\n\n## In the interview\nDefine it, contrast\
    \ it with SLO and SLI, and show the downtime arithmetic. Follow-ups: how you would choose the target\
    \ (user needs and cost of each extra nine), and how an SLA shapes engineering work such as redundancy\
    \ and on-call.\n"
