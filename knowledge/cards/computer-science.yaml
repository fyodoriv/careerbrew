- id: kb-2758cebcc744
  question: What is linear time complexity, O(n)?
  answer: 'An algorithm is O(n), or linear, when its running time grows in direct proportion to the input
    size: double the input and the work roughly doubles. Typical examples are a single pass over an array,
    such as summing values or linear search.'
  topic: computer science
  tags:
  - complexity
  - big-o
  - algorithms
  explanation: "## In plain words\nLinear time means \"touch each item a constant number of times\". If\
    \ reading 1,000 names takes one second, reading 2,000 takes about two. It is often the best you can\
    \ do when you must look at every input element at least once.\n\n## How it works\n- Big O describes\
    \ how the cost grows as the input size n grows, ignoring constant factors and lower-order terms.\n\
    - O(n): cost is at most c * n for some constant c once n is large enough.\n- A loop that does constant\
    \ work per element is O(n). Two separate loops in a row are still O(n) (2n becomes n). A loop inside\
    \ a loop over the same input is O(n^2).\n- Common O(n) work: summing, finding a max, counting with\
    \ a hash map, one pass of two pointers, BFS on a graph is O(V + E), which is linear in the graph's\
    \ size.\n- For comparison: O(1) constant, O(log n), O(n log n) (good sorting), O(n^2) (all pairs),\
    \ O(2^n) (all subsets).\n\n## Example\n```python\ndef find_max(nums):\n    best = nums[0]\n    for\
    \ x in nums:          # n iterations, O(1) each\n        if x > best:\n            best = x\n    return\
    \ best\n\nprint(find_max([3, 8, 1, 9, 4]))  # 9\n```\nWith n = 1,000,000, an O(n) pass is about a\
    \ million steps; an O(n^2) all-pairs check would be about a trillion.\n\n## Common mistakes\n- Hiding\
    \ O(n) operations inside a loop, such as `x in list`, `list.pop(0)`, or string concatenation in some\
    \ languages, which makes the whole thing O(n^2).\n- Thinking O(2n) is different from O(n).\n- Forgetting\
    \ space complexity: an O(n) time algorithm might also use O(n) memory.\n\n## In the interview\nState\
    \ complexity for every solution you write, for both time and space, and explain the reason (\"one\
    \ pass, constant work per element\"). When asked to optimize, a common goal is moving from O(n^2)\
    \ or O(n log n) to O(n) with a hash map or two pointers. Mention that Big O hides constants, so a\
    \ simpler O(n log n) can beat a complicated O(n) on small inputs.\n"
