  explanation: '## In plain words

    There is no best database, only the best fit for how your data is read and written. Picking storage
    is like picking a container in a kitchen: a fridge, a spice rack, and a pantry all store food, but
    each suits different items and different ways of reaching them.


    ## How it works

    Ask these questions in order:

    - **Shape**: tabular with relations, nested documents, blobs (images, video), graphs, or time-stamped
    metrics?

    - **Access pattern**: lookups by key, range scans, ad-hoc queries, full-text search, aggregations?

    - **Consistency**: do you need ACID transactions (money, inventory) or is eventual consistency fine
    (likes, feeds)?

    - **Scale**: reads vs writes per second, total size, growth.


    Typical matches:

    - Relational (PostgreSQL, MySQL): structured data, joins, transactions.

    - Key-value (Redis, DynamoDB): sessions, caches, lookups by id.

    - Document (MongoDB): flexible schemas, whole-object reads.

    - Wide-column (Cassandra): very high write volume, known query patterns.

    - Object storage (S3-style): files and backups, cheap and durable.

    - Search index (Elasticsearch): full-text and faceted search.

    - Time-series and graph databases for metrics and relationship queries.


    ## Example

    Designing a photo-sharing app: user accounts and follows in PostgreSQL; photo files in object storage
    behind a CDN; a feed cache in Redis; captions in a search index. Each store does what it is good at,
    and the relational database stays the source of truth.


    ## Common mistakes

    - Choosing NoSQL "because it scales" without naming the access pattern.

    - Storing large files inside the database instead of object storage.

    - Ignoring consistency requirements for money or inventory.

    - Adding many specialised stores early, which multiplies operational cost.


    ## In the interview

    Think aloud: state the read/write ratio, the main queries, and the consistency need, then pick and
    justify. Mention that a relational database is a strong default and scales far with indexes, replicas,
    and partitioning. Expect follow-ups on sharding keys, replication, caching, and how to keep a search
    index in sync (change data capture or a queue).

    '
