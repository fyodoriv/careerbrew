  question: How do you implement a queue?
  answer: A queue is first-in, first-out. Implement it with a linked list (enqueue at tail, dequeue at
    head), a circular array with head and tail indexes, or two stacks. All give O(1) enqueue and dequeue
    (amortised for two stacks). In Python, use collections.deque.
  topic: computer science
  tags:
  - queue
  - data-structures
  - fifo
  explanation: "## In plain words\nA queue works like a line at a shop: people join at the back and leave\
    \ from the front. The first one in is the first one out (FIFO). The challenge is making both ends\
    \ fast.\n\n## How it works\n- **Linked list:** keep `head` and `tail` pointers. Enqueue creates a\
    \ node after `tail`; dequeue removes `head`. Both `O(1)`.\n- **Circular buffer:** a fixed-size array\
    \ plus `head` index and `size`. The tail position is `(head + size) % capacity`. Grow by copying when\
    \ full. Cache-friendly.\n- **Two stacks:** push onto `inbox`; to dequeue, if `outbox` is empty move\
    \ everything from `inbox` to `outbox`, then pop `outbox`. Each element moves once, so amortised `O(1)`.\n\
    - Avoid a plain dynamic array with removal from index 0; that shifts every element, `O(n)`.\n\n##\
    \ Example\n```python\nclass Queue:\n    def __init__(self):\n        self.inbox, self.outbox = [],\
    \ []\n    def enqueue(self, x):\n        self.inbox.append(x)\n    def dequeue(self):\n        if\
    \ not self.outbox:\n            while self.inbox:\n                self.outbox.append(self.inbox.pop())\n\
    \        if not self.outbox:\n            raise IndexError(\"empty queue\")\n        return self.outbox.pop()\n\
    \nq = Queue()\nfor x in (1, 2, 3):\n    q.enqueue(x)\nprint(q.dequeue(), q.dequeue())  # 1 2\n```\n\
    \n## Common mistakes\n- Using `list.pop(0)` in Python and calling it `O(1)`.\n- Forgetting to handle\
    \ dequeue on an empty queue.\n- In the two-stack version, refilling `outbox` while it still has items,\
    \ which breaks the order.\n- Off-by-one errors with wrap-around in a circular buffer.\n\n## In the\
    \ interview\nSay which implementation you choose and why, and give complexities, including the amortised\
    \ argument for two stacks. Mention real uses: BFS, task scheduling, buffering between producer and\
    \ consumer. Follow-ups may ask for a bounded blocking queue (needs locks or condition variables) or\
    \ a queue that also returns the max.\n"
