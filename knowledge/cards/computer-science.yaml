  question: What is a graph data structure, and what are its pros and cons?
  answer: A graph is a set of nodes (vertices) connected by edges, which may be directed or undirected
    and weighted or unweighted. It models networks such as roads, social links, and dependencies, and
    is stored as an adjacency list (good for sparse graphs) or an adjacency matrix (good for dense graphs
    and O(1) edge checks).
  topic: computer science
  tags:
  - data-structures
  - graphs
  - adjacency-list
  - algorithms
  explanation: "## In plain words\nA graph is dots and lines: cities and roads, people and friendships,\
    \ tasks and \"must happen before\" arrows. Trees and linked lists are special graphs. Whenever a problem\
    \ talks about connections, routes, or dependencies, it is probably a graph problem.\n\n## How it works\n\
    - **Vertices (V)** and **edges (E)**. Edges can be directed (one-way) or undirected, and weighted\
    \ (a cost or distance) or not.\n- **Adjacency list**: each node maps to a list of neighbours. Space\
    \ O(V + E); listing neighbours is fast; checking one edge costs O(degree).\n- **Adjacency matrix**:\
    \ a V x V grid of booleans or weights. Space O(V^2); edge check O(1); listing neighbours O(V).\n-\
    \ **Edge list**: just the pairs; handy for algorithms like Kruskal's.\n- Core algorithms: BFS and\
    \ DFS in O(V + E), Dijkstra for weighted shortest paths, topological sort for DAGs (directed acyclic\
    \ graphs), and union-find for connectivity.\n\n## Example\n```python\nfrom collections import defaultdict,\
    \ deque\n\ngraph = defaultdict(list)\nfor u, v in [(\"A\", \"B\"), (\"A\", \"C\"), (\"B\", \"D\")]:\n\
    \    graph[u].append(v)\n    graph[v].append(u)\n\ndef reachable(start):\n    seen, q = {start}, deque([start])\n\
    \    while q:\n        for nxt in graph[q.popleft()]:\n            if nxt not in seen:\n         \
    \       seen.add(nxt)\n                q.append(nxt)\n    return seen\n\nprint(sorted(reachable(\"\
    D\")))  # ['A', 'B', 'C', 'D']\n```\n\n**Pros:** models almost any relationship; rich, well-known\
    \ algorithms.\n**Cons:** more memory and complexity than lists or trees; cycles require a visited\
    \ set; many problems on general graphs (such as the travelling salesman problem) are NP-hard.\n\n\
