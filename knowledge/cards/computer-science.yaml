  question: What is a database?
  answer: A database is an organized, persistent collection of data managed by a database management system
    (DBMS) that handles storing, querying, updating, and protecting it. Relational databases use tables
    and SQL with strong transactions; NoSQL databases use documents, key-value pairs, wide columns, or
    graphs to suit other scaling and data-shape needs.
  topic: computer science
  tags:
  - databases
  - sql
  - nosql
  - storage
  explanation: "## In plain words\nA database is a well-run library for data. You hand data to the librarian\
    \ (the DBMS); it stores it safely on disk, finds what you ask for quickly, stops two people from scribbling\
    \ over the same page at once, and keeps everything after a power cut.\n\n## How it works\n- **DBMS\
    \ duties**: storage on disk, indexing for fast lookup, a query language, concurrency control, crash\
    \ recovery (often with a write-ahead log), access control, and backup.\n- **Relational (SQL)**: PostgreSQL,\
    \ MySQL. Data in tables with a schema; joins; ACID transactions (atomic, consistent, isolated, durable).\n\
    - **NoSQL families**:\n  - Key-value (Redis, DynamoDB): simple, fast lookups by key.\n  - Document\
    \ (MongoDB): JSON-like records with flexible fields.\n  - Wide-column (Cassandra): huge write volumes\
    \ spread over many nodes.\n  - Graph (Neo4j): relationships as first-class data.\n- **Other kinds**:\
    \ time-series, search engines, and analytical column stores (data warehouses).\n- **Scaling**: indexes,\
    \ read replicas, caching, partitioning (sharding).\n\n## Example\nAn online store keeps users, orders,\
    \ and products in PostgreSQL because orders need transactions: decrementing stock and creating the\
    \ order must both succeed or both fail. It also caches product pages in Redis and sends search queries\
    \ to Elasticsearch.\n```sql\nBEGIN;\nUPDATE products SET stock = stock - 1 WHERE id = 7 AND stock\
    \ > 0;\nINSERT INTO orders (user_id, product_id) VALUES (42, 7);\nCOMMIT;\n```\nIn a real app, check\
    \ that the update changed one row before inserting the order, and roll back if not.\n\n## Common mistakes\n\
    - Picking NoSQL \"for scale\" when data is relational and fits on one server.\n- Treating a cache\
    \ as the database of record.\n- Forgetting indexes, or adding so many that writes slow down.\n- Assuming\
    \ a database is backed up because it is replicated; replication copies mistakes too.\n\n## In the\
    \ interview\nChoose a database by access patterns, consistency needs, data shape, and scale, and say\
    \ why. Expect follow-ups on ACID versus eventual consistency, indexing, replication, sharding, and\
    \ the CAP trade-off during network partitions.\n"
