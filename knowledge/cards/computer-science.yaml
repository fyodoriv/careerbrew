  answer: A stack is last-in, first-out. Implement it with a dynamic array (push and pop at the end) or
    a singly linked list (push and pop at the head). Push, pop, and peek are O(1), amortised for the array.
  topic: computer science
  tags:
  - stack
  - data-structures
  - lifo
  explanation: "## In plain words\nA stack is like a pile of plates: you add to the top and take from\
    \ the top. The last plate put on is the first one taken off (LIFO). Function calls, undo history,\
    \ and bracket matching all work this way.\n\n## How it works\n- **Dynamic array:** append to push,\
    \ remove the last element to pop, read the last element to peek. Amortised `O(1)` because occasional\
    \ resizing copies the array.\n- **Linked list:** the head is the top. Push creates a new node pointing\
    \ to the old head; pop moves head to `head.next`. Strict `O(1)`, but more memory per item.\n- Track\
    \ size if you need `len` in `O(1)`.\n- A min-stack (get the minimum in `O(1)`) stores, with each item,\
    \ the minimum so far.\n\n## Example\nChecking balanced brackets:\n```python\ndef balanced(s):\n  \
    \  pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if\
    \ ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack\
    \ or stack.pop() != pairs[ch]:\n                return False\n    return not stack\n\nprint(balanced(\"\
    {[()]}\"), balanced(\"(]\"))  # True False\n```\nTime `O(n)`, space `O(n)`.\n\n## Common mistakes\n\
    - Popping from an empty stack without a check.\n- Forgetting to verify the stack is empty at the end\
    \ (unclosed brackets).\n- Inserting at the front of an array, which is `O(n)`.\n\n## In the interview\n\
    Give both implementations and their trade-offs: arrays are compact and cache-friendly; linked lists\
    \ avoid resize spikes. Mention the call stack and recursion connection: any recursive algorithm can\
    \ be rewritten with an explicit stack. Expect follow-ups such as min-stack, evaluating expressions,\
    \ monotonic stacks for \"next greater element\", or implementing a stack with queues.\n"
