- id: kb-c697e89b9c8e
  question: What is the balance factor of a node in a tree?
  answer: The balance factor of a node is the height of its left subtree minus the height of its right
    subtree (some texts use right minus left). AVL trees require every node's balance factor to be -1,
    0, or 1, and rotate when an update pushes it to -2 or 2.
  topic: computer science
  tags:
  - data-structures
  - trees
  - avl-tree
  - balancing
  explanation: "## In plain words\nThe balance factor is a quick lean-o-meter for a node. If the left\
    \ side is taller, it leans left (positive); if the right side is taller, it leans right (negative).\
    \ An AVL tree allows only a small lean everywhere, which keeps the whole tree short.\n\n## How it\
    \ works\n- `bf(node) = height(left) - height(right)`, with the height of an empty subtree defined\
    \ as -1 if a leaf has height 0 (or 0 if a leaf has height 1; be consistent).\n- AVL invariant: `bf`\
    \ is in {-1, 0, 1} for every node, which guarantees height O(log n).\n- After an insert or delete,\
    \ walk back up updating heights. At the first node with `bf` of +2 or -2, rotate:\n  - **Left-Left**\
    \ (bf +2, left child bf >= 0): one right rotation.\n  - **Right-Right** (bf -2, right child bf <=\
    \ 0): one left rotation.\n  - **Left-Right** (bf +2, left child bf -1): rotate the left child left,\
    \ then the node right.\n  - **Right-Left**: the mirror image.\n- Storing each node's height makes\
    \ `bf` an O(1) calculation.\n\n## Example\nInsert 30, 20, 10 into an AVL tree. After inserting 10,\
    \ node 30 has left height 1 and right height -1 (empty), so `bf(30) = 2`, and its left child 20 has\
    \ `bf = 1`. That is the Left-Left case: rotate right at 30, making 20 the root with children 10 and\
    \ 30, and every balance factor becomes 0.\n```python\ndef bf(node):\n    h = lambda n: n.height if\
    \ n else -1\n    return h(node.left) - h(node.right)\n```\n\n## Common mistakes\n- Mixing sign conventions\
    \ within one solution.\n- Recomputing subtree heights recursively at each node, which costs O(n) per\
    \ check instead of O(1).\n- Picking a single rotation for the Left-Right or Right-Left case, which\
    \ leaves the tree unbalanced.\n\n## In the interview\nDefine it, state the AVL rule, and walk through\
    \ one rotation case. Mention that red-black trees use colours instead of balance factors and tolerate\
    \ more imbalance, so they rotate less on writes, while AVL trees stay shorter and are slightly faster\
    \ to search.\n"
