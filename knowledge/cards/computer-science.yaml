  question: What is a linked list, and what are its pros and cons?
  answer: A linked list stores elements in nodes where each node points to the next (and, in a doubly
    linked list, the previous). It gives O(1) insertion and removal at a known node or at the head, but
    O(n) access by index and poor cache locality compared with arrays.
  topic: computer science
  tags:
  - data-structures
  - linked-list
  - pointers
  explanation: "## In plain words\nA linked list is a treasure hunt: each clue tells you where the next\
    \ one is. Elements can live anywhere in memory, joined by pointers. That makes adding or removing\
    \ a link easy, but finding the 500th item means following 499 clues.\n\n## How it works\n- **Node**:\
    \ a value plus a `next` pointer (and `prev` in a doubly linked list). The list keeps a `head`, and\
    \ often a `tail`.\n- **Access by index**: O(n), walk from the head.\n- **Search**: O(n).\n- **Insert\
    \ or delete at head**: O(1).\n- **Insert or delete after a node you already hold**: O(1), just relink\
    \ pointers. Deleting a given node in a singly linked list needs its predecessor; a doubly linked list\
    \ avoids that.\n- **Append at tail**: O(1) if a tail pointer is kept.\n- **Space**: O(n), plus one\
    \ or two pointers per node.\n\n## Example\n```python\nclass Node:\n    def __init__(self, val, nxt=None):\n\
    \        self.val, self.next = val, nxt\n\nhead = Node(1, Node(2, Node(4)))\ntwo = head.next\ntwo.next\
    \ = Node(3, two.next)      # insert 3 after 2 in O(1)\n\nnode, out = head, []\nwhile node:\n    out.append(node.val)\n\
    \    node = node.next\nprint(out)  # [1, 2, 3, 4]\n```\n\n**Pros:** O(1) inserts and deletes at known\
    \ positions, no resizing, easy to splice lists together, a basis for queues, stacks, and LRU caches.\n\
    **Cons:** no random access, extra memory for pointers, scattered nodes cause cache misses, so iteration\
    \ is much slower than over an array in practice.\n\n## Common mistakes\n- Losing the rest of the list\
    \ by overwriting `next` before saving it.\n- Forgetting edge cases: empty list, one node, changing\
    \ the head.\n- Claiming insert is O(1) when you first have to search for the position (that is O(n)).\n\
    \n## In the interview\nUse a dummy head node to simplify edge cases, and draw pointers before you\
    \ change them. Common questions: reverse a list, detect a cycle with fast and slow pointers, merge\
    \ two sorted lists, find the middle. Mention that dynamic arrays usually win in real programs because\
    \ of cache locality.\n"
