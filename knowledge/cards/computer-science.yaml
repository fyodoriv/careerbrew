- id: kb-ee29c67f0d74
  question: Why can deep recursion cause a stack overflow when an explicit stack or queue does not?
  answer: Each recursive call adds a frame to the thread's call stack, which has a small fixed size (often
    around 1 to 8 MB), so very deep recursion exhausts it. An explicit stack or queue lives on the heap,
    which can grow to use most available memory and stores only the data you choose.
  topic: computer science
  tags:
  - recursion
  - stack-overflow
  - memory
  - call-stack
  explanation: "## In plain words\nThe call stack is a small notepad the runtime gives each thread for\
    \ remembering function calls. Every recursive call writes a new page: arguments, local variables,\
    \ and where to return. With a million nested calls, the notepad runs out. An explicit stack is a list\
    \ you keep yourself in the much larger heap memory, so it can hold far more entries.\n\n## How it\
    \ works\n- **Call stack**: a fixed-size region per thread. Typical defaults are around 8 MB for the\
    \ main thread on Linux and 1 MB on Windows; extra threads often get less.\n- **Frame contents**: return\
    \ address, saved registers, parameters, and locals. Frames can be tens to hundreds of bytes each,\
    \ more in interpreters.\n- **Language limits**: Python caps recursion depth at about 1,000 by default\
    \ (`RecursionError`) to avoid crashing the interpreter; Java throws `StackOverflowError`; C may just\
    \ crash with a segmentation fault.\n- **Heap**: dynamic memory shared by the process, limited only\
    \ by available RAM and address space. A list used as a stack grows there, storing just the values\
    \ you push, not full frames.\n- Both approaches use O(depth) memory; the difference is which memory\
    \ pool, how big it is, and how much each entry costs.\n- An explicit structure can still run out of\
    \ memory if it grows without bound, but at a far larger size.\n\n## Example\n```python\nimport sys\n\
    \ndef depth_rec(n):\n    return 0 if n == 0 else 1 + depth_rec(n - 1)\n\ndef depth_iter(n):\n    stack,\
    \ count = [n], 0\n    while stack:\n        k = stack.pop()\n        if k > 0:\n            count\
    \ += 1\n            stack.append(k - 1)\n    return count\n\nprint(sys.getrecursionlimit())   # usually\
    \ 1000\nprint(depth_iter(1_000_000))     # 1000000, works fine\n# depth_rec(1_000_000) raises RecursionError\n\
    ```\n\n## Common mistakes\n- Raising Python's recursion limit very high, which can crash the interpreter\
    \ with a real C-level stack overflow.\n- Saying the iterative version uses no memory; it uses O(depth)\
    \ heap space.\n- Assuming tail recursion is optimized in languages that do not do it.\n\n## In the\
    \ interview\nExplain the stack versus heap distinction, give typical limits, and show the conversion\
    \ to an explicit stack. Mention options: iterative rewrite, tail call optimization where supported,\
    \ larger thread stacks, or reducing depth (for example, recursing into the smaller half first in quicksort).\n"
