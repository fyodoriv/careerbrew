- id: kb-4bebfe4f5f9d
  question: What is a quadtree?
  answer: A quadtree is a tree that splits a 2D area into four quadrants recursively, subdividing a node
    only when it holds too many points. It makes spatial queries like 'what is near this point' or 'what
    lies in this rectangle' much faster than scanning everything.
  topic: computer science
  tags:
  - data-structures
  - spatial-index
  - trees
  - geometry
  explanation: '## In plain words

    Think of a map. If one area has too many restaurants to scan quickly, cut it into four smaller squares,
    and keep cutting the crowded ones. Empty countryside stays as one big square while a busy downtown
    is split many times. Searching then only looks at squares that overlap the area you care about.


    ## How it works

    - Each node covers a rectangle and has either up to `k` points (a leaf) or exactly four children:
    NW, NE, SW, SE.

    - **Insert**: walk down to the leaf that contains the point; if the leaf exceeds capacity, split it
    into four and redistribute its points.

    - **Range query**: start at the root, skip any child whose rectangle does not intersect the query,
    and check points in the leaves that do.

    - With evenly spread data, depth is about O(log n), and a range query costs roughly O(log n + m) for
    m results. Clustered data can make the tree deep.

    - The 3D version is the octree.


    ## Example

    A ride app stores driver locations in a quadtree with capacity 100 per leaf. To find drivers within
    1 km of a rider, it visits only the handful of leaves whose squares touch that circle, instead of
    checking 50,000 drivers.


    ## Common mistakes

    - Forgetting points that lie exactly on a boundary, so they are lost or stored twice.

    - Not handling many identical points, which makes a leaf split forever; cap the depth.

    - Assuming it stays balanced for clustered data.


    ## In the interview

    It is a common answer to "design a proximity service" (nearby restaurants or drivers). Compare it
    with geohashing, which encodes locations as strings so a normal database index can search prefixes,
    and with R-trees, which index rectangles. Mention trade-offs: quadtrees adapt to density but are usually
    kept in memory, and moving points require delete plus reinsert.

    '
