- id: kb-1d0cf0a868fc
  question: What is tail call optimization?
  answer: Tail call optimization (TCO) reuses the current stack frame when a function's last action is
    to call another function and return its result, so tail-recursive code runs in constant stack space
    like a loop. Scheme guarantees it and many functional language compilers do it, but Python, Java,
    and most JavaScript engines do not.
  topic: computer science
  tags:
  - recursion
  - compilers
  - stack
  - functional-programming
  explanation: "## In plain words\nNormally every function call adds a frame to the call stack, and deep\
    \ recursion can overflow it. If a call is the very last thing a function does, there is nothing left\
    \ to come back for, so the language can replace the current frame instead of stacking a new one. Recursion\
    \ then behaves like a loop.\n\n## How it works\n- A **tail call** is a call whose result is returned\
    \ directly, with no work after it: `return f(x)`.\n- Not a tail call: `return n * fact(n - 1)`, because\
    \ the multiplication happens after the call returns.\n- With TCO, the compiler or runtime turns the\
    \ tail call into a jump, reusing the frame: O(1) stack space instead of O(n).\n- To make a function\
    \ tail recursive, carry the pending work in an **accumulator** parameter.\n- Support: guaranteed in\
    \ Scheme; common in Haskell, OCaml, Erlang, and Elixir; Scala has `@tailrec` for self-recursion; Kotlin\
    \ has `tailrec`. Python deliberately does not do it (to keep full tracebacks), the JVM does not do\
    \ it in general, and among JavaScript engines essentially only Safari implements the ES2015 proper\
    \ tail calls.\n\n## Example\n```python\ndef fact(n):                 # not a tail call\n    return\
    \ 1 if n == 0 else n * fact(n - 1)\n\ndef fact_acc(n, acc=1):      # tail call, but Python still uses\
    \ O(n) stack\n    return acc if n == 0 else fact_acc(n - 1, acc * n)\n\ndef fact_loop(n):        \
    \    # what TCO would effectively produce\n    acc = 1\n    while n > 0:\n        n, acc = n - 1,\
    \ acc * n\n    return acc\n\nprint(fact_acc(10), fact_loop(10))  # 3628800 3628800\n```\nIn Python,\
    \ `fact_acc(100000)` still raises `RecursionError`; in Scheme the same shape runs in constant space.\n\
    \n## Common mistakes\n- Assuming your language does TCO because it allows recursion.\n- Thinking `return\
    \ 1 + f(x)` is a tail call.\n- Losing debugging information: optimized frames disappear from stack\
    \ traces.\n\n## In the interview\nDefine a tail call, show the accumulator rewrite, and name which\
    \ languages guarantee it. In languages without TCO, convert deep recursion to a loop or an explicit\
    \ stack.\n"
