- id: kb-6702bb59e419
  question: What is Dijkstra's algorithm?
  answer: Dijkstra's algorithm finds the shortest paths from one source node to all others in a graph
    with non-negative edge weights. It repeatedly finalises the unvisited node with the smallest known
    distance and relaxes its outgoing edges. With a binary heap it runs in O((V + E) log V).
  topic: computer science
  tags:
  - graphs
  - shortest-path
  - dijkstra
  - greedy
  explanation: '## In plain words

    Dijkstra is the classic answer to "what is the cheapest way to get from here to everywhere else?"
    when roads have lengths or costs. It grows a region of nodes whose shortest distance is known, always
    adding the closest node next, like a flood spreading outward through pipes of different lengths.


    ## How it works

    - Set the source distance to 0 and all others to infinity.

    - Use a min-priority queue keyed by tentative distance.

    - Repeatedly take the node u with the smallest distance; its distance is now final.

    - For each edge `u -> v` with weight w, if `dist[u] + w < dist[v]`, update `dist[v]` and record u
    as v''s parent (relaxation).

    - Stop when the queue is empty, or early once the target is finalised.

    - **Why it is correct:** with non-negative weights, no later path can make an already-smallest distance
    shorter. This is a greedy algorithm.

    - **Complexity:** `O((V + E) log V)` with a binary heap; `O(V^2)` with a simple array, which can be
    better for dense graphs.

    - **Limits:** negative edges break it (use Bellman-Ford); for many sources, consider Floyd-Warshall
    or repeated runs.


    ## Example

    Graph: A-B (4), A-C (1), C-B (2), B-D (1).

    - Start: A = 0. Pop A; relax: C = 1, B = 4.

    - Pop C (1); relax C-B: 1 + 2 = 3 < 4, so B = 3.

    - Pop B (3); relax B-D: D = 4.

    - Pop D (4). Final: A 0, C 1, B 3, D 4. The shortest path to D is A -> C -> B -> D.


    ## Common mistakes

    - Applying it to graphs with negative weights.

    - Treating a node as final when it is first discovered rather than when it is popped.

    - Not skipping stale queue entries in lazy implementations.

    - Using it on unweighted graphs where BFS is simpler and faster.


    ## In the interview

    State the precondition (non-negative weights), the greedy idea, and complexity. Interviewers often
    ask why negative weights break it, how to reconstruct the path (parent pointers), and how it relates
    to A* (Dijkstra plus a heuristic) and BFS (Dijkstra with all weights equal). Real uses include route
    planning and network routing protocols such as OSPF.

    '
