- id: kb-70d44c16aceb
  question: What is the Liskov Substitution Principle in SOLID?
  answer: Objects of a subtype must be usable anywhere the base type is expected without breaking the
    program. A subclass may not strengthen preconditions, weaken postconditions, or break the base type's
    invariants.
  topic: computer science
  tags:
  - solid
  - oop
  - design-principles
  - inheritance
  explanation: "## In plain words\nIf code works with a `Bird`, it should keep working when you hand it\
    \ any specific bird. Inheritance is a promise: \"I behave like my parent\". The principle, named after\
    \ Barbara Liskov, says a subclass must keep that promise, not just have the same method names.\n\n\
    ## How it works\nA subtype must honor the base type's contract:\n- **Preconditions** cannot be stronger:\
    \ it must accept every input the base accepts.\n- **Postconditions** cannot be weaker: it must deliver\
    \ at least what the base promises.\n- **Invariants** must hold: rules that are always true for the\
    \ base stay true.\n- It must not throw new kinds of exceptions that callers of the base do not expect.\n\
    - Signs of a violation: `isinstance` checks in callers, overrides that raise \"not supported\", and\
    \ surprising behaviour after substitution.\n\n## Example\nThe classic case is `Square` inheriting\
    \ from `Rectangle`:\n```python\nclass Rectangle:\n    def __init__(self, w, h): self.w, self.h = w,\
    \ h\n    def set_width(self, w): self.w = w\n    def area(self): return self.w * self.h\n\nclass Square(Rectangle):\n\
    \    def __init__(self, s): super().__init__(s, s)\n    def set_width(self, w): self.w = self.h =\
    \ w\n\ndef stretch(r: Rectangle):\n    r.set_width(10)\n    return r.area()\n\nprint(stretch(Rectangle(2,\
    \ 5)))  # 50\nprint(stretch(Square(5)))        # 100, not the 50 a Rectangle user expects\n```\nA\
    \ fix: do not make `Square` a subtype of a mutable `Rectangle`; make both implement a read-only `Shape`.\n\
    \n## Common mistakes\n- Using \"is-a\" in plain English (\"a square is a rectangle\") as proof that\
    \ inheritance fits.\n- Overriding a method to do nothing or raise an error.\n- Thinking matching signatures\
    \ is enough; the principle is about behaviour.\n\n## In the interview\nState it in one line, give\
    \ the rectangle-square or \"penguin cannot fly\" example, and show the fix (split interfaces or use\
    \ composition). Connect it to polymorphism: dispatch only works safely when every subtype keeps the\
    \ contract.\n"
