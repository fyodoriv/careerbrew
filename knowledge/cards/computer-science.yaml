- id: kb-ac6e4dc0e3b7
  question: What are the common building blocks and patterns in system design?
  answer: 'Most designs combine a few patterns: load balancing and horizontal scaling, caching, database
    replication and sharding, asynchronous work through message queues, CDNs for static content, rate
    limiting, and resilience patterns such as retries with backoff, circuit breakers, and idempotent operations.'
  topic: computer science
  tags:
  - system-design
  - scalability
  - architecture
  explanation: '## In plain words

    System design interviews reuse the same set of building blocks, much as houses reuse doors, windows,
    and stairs. Knowing what each block solves lets you assemble a design quickly and explain why each
    piece is there.


    ## How it works

    - **Load balancer:** spreads requests across stateless app servers so you can scale horizontally.

    - **Caching:** in-memory caches (Redis) and CDNs cut latency and load; decide on cache-aside vs write-through
    and an eviction policy.

    - **Database scaling:** read replicas for read-heavy loads, sharding (partition by key) for large
    data or write volume, indexes for query speed.

    - **Asynchronous processing:** message queues and event streams decouple producers from slow consumers
    and smooth traffic spikes.

    - **Consistency choices:** strong vs eventual consistency, guided by the CAP trade-off during network
    partitions.

    - **Resilience:** timeouts, retries with exponential backoff and jitter, circuit breakers, bulkheads,
    idempotency keys.

    - **API patterns:** API gateway, rate limiting, pagination.

    - **Data flow:** fan-out on write vs fan-out on read for feeds; CQRS to separate read and write models.

    - **Observability:** metrics, logs, traces, and alerts.


    ## Example

    A URL shortener at a glance:

    - Clients hit a load balancer in front of stateless API servers.

    - Short codes are generated from a counter encoded in base62 or from random IDs with a uniqueness
    check.

    - Mappings live in a key-value store, sharded by code.

    - A cache in front serves popular redirects; reads vastly outnumber writes.

    - Click analytics are sent to a queue and processed asynchronously so redirects stay fast.

    - Rate limiting protects the create endpoint from abuse.


    ## Common mistakes

    - Adding every pattern regardless of requirements.

    - Using caching without discussing invalidation or staleness.

    - Sharding without choosing a key or discussing hot spots.

    - Forgetting failure modes: what happens when a component goes down?


    ## In the interview

    Clarify requirements and scale first, sketch a simple design, then add patterns only to fix a specific
    bottleneck you name. Interviewers score trade-off reasoning, back-of-envelope numbers, and handling
    of failure. Expect deep dives into one component, such as how the cache stays consistent or how the
    queue handles duplicate messages.

    '
