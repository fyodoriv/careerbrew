  prompt: 1f344914
- id: kb-89f9123f9c63
  question: What is an idempotent operation, and why does idempotency matter?
  answer: 'An operation is idempotent if performing it several times has the same effect as performing
    it once. In distributed systems it makes retries safe: a request that might have succeeded can be
    resent without double charging or duplicate records. HTTP GET, PUT, and DELETE are defined as idempotent;
    POST generally is not.'
  topic: computer science
  tags:
  - idempotency
  - distributed-systems
  - api-design
  - system-design
  explanation: "## In plain words\nPressing a lift's call button five times does not summon five lifts;\
    \ pressing it once has the same effect. That is idempotency. It matters because networks are unreliable:\
    \ when a request times out, you often cannot tell whether it went through, so the safest design is\
    \ one where trying again does no harm.\n\n## How it works\n- **Idempotent examples:** setting a value\
    \ (`status = \"complete\"`), deleting by id, `PUT` replacing a resource, `abs(abs(x)) == abs(x)`.\n\
    - **Not idempotent:** incrementing a counter, appending to a list, charging a card, `POST /orders`\
    \ that creates a new order each time.\n- **Making operations idempotent:**\n  - Idempotency keys:\
    \ the client sends a unique key with the request; the server stores the result for that key and returns\
    \ it on repeats instead of redoing the work.\n  - Natural keys and upserts: insert-or-update by a\
    \ unique business key.\n  - Conditional writes: only apply if the version matches.\n  - Deduplicate\
    \ messages by id in consumers, since queues often deliver at least once.\n- Idempotency is about the\
    \ server-side effect, not the response; a repeated `DELETE` might return 404 the second time and still\
    \ be idempotent.\n\n## Example\n```python\nprocessed = {}   # idempotency key -> result (a database\
    \ table in practice)\n\ndef charge(idempotency_key, amount):\n    if idempotency_key in processed:\n\
    \        return processed[idempotency_key]   # repeat: return the stored result\n    result = f\"\
    charged {amount}\"            # the real side effect happens once\n    processed[idempotency_key]\
    \ = result\n    return result\n\nprint(charge(\"k-123\", 50))\nprint(charge(\"k-123\", 50))   # retry\
    \ after a timeout: no double charge\nprint(len(processed))        # 1\n```\nThis sketch is single-threaded.\
    \ In production, claim the key atomically before the side effect (for example, insert it under a unique\
    \ constraint), so two concurrent retries cannot both charge.\n\n## Common mistakes\n- Confusing idempotent\
    \ with safe: `DELETE` is idempotent but not safe (it changes state); `GET` is both.\n- Storing the\
    \ idempotency key only after performing the side effect, leaving a race window.\n- Assuming exactly-once\
    \ delivery from a queue; design consumers to tolerate duplicates.\n- Expiring idempotency keys too\
    \ early, before clients stop retrying.\n\n## In the interview\nDefine it, give one idempotent and\
    \ one non-idempotent example, and explain why retries make it essential. Interviewers in system design\
    \ look for idempotency keys on payment or order APIs, deduplication in message consumers, and awareness\
    \ of races (use a unique constraint or atomic insert for the key). Mention at-least-once delivery\
    \ plus idempotent consumers as the practical alternative to exactly-once.\n"
  match:
  - 09f9d4f992dd
  prompt: 1f344914
- id: kb-7266fd5e688c
  question: What is an idempotent operation?
  answer: An operation is idempotent if doing it once or many times has the same effect on the system.
    In APIs, GET, PUT, and DELETE are meant to be idempotent while POST is not; idempotency keys let clients
    retry non-idempotent requests (like payments) safely after timeouts.
  topic: computer science
  tags:
  - system-design
  - apis
  - idempotency
  - reliability
  explanation: "## In plain words\nPressing a lift button five times calls the lift once; pressing \"\
    pay\" five times should not charge you five times. Idempotent operations are safe to repeat, which\
    \ matters because networks fail and clients retry when they do not know whether the first attempt\
    \ worked.\n\n## How it works\n- Formally: applying f twice equals applying it once, `f(f(x)) = f(x)`\
    \ in maths, or \"same final state\" for systems.\n- **Idempotent**: set a value (`balance = 100`),\
    \ delete a record (already deleted stays deleted), HTTP PUT replacing a resource, upserts keyed by\
    \ id.\n- **Not idempotent**: increment a counter, append to a list, create a new order with a fresh\
    \ id, HTTP POST by default.\n- The response can differ (a second DELETE may return 404) while the\
    \ state stays the same.\n- Making writes idempotent:\n  - the client sends a unique **idempotency\
    \ key** per logical request;\n  - the server stores the key with the result; a repeated key returns\
    \ the stored result instead of acting again;\n  - use database unique constraints or conditional writes\
    \ to enforce it.\n- Why it matters: retries after timeouts, at-least-once message delivery in queues,\
    \ and replayed webhooks all deliver duplicates.\n\n## Example\n```python\nprocessed = {}\n\ndef charge(idempotency_key,\
    \ amount, ledger):\n    if idempotency_key in processed:\n        return processed[idempotency_key]\
    \   # replay: no second charge\n    ledger.append(amount)\n    result = {\"status\": \"charged\",\
    \ \"amount\": amount}\n    processed[idempotency_key] = result\n    return result\n\nledger = []\n\
    charge(\"req-123\", 40, ledger)\ncharge(\"req-123\", 40, ledger)   # client retried after a timeout\n\
    print(ledger)  # [40]\n```\nIn production, store keys durably with an expiry, and handle two concurrent\
    \ requests with the same key (for example with a unique constraint).\n\n## Common mistakes\n- Confusing\
    \ idempotent with \"safe\" (no side effects at all); DELETE is idempotent but not safe.\n- Assuming\
    \ retries are harmless without idempotency.\n- Generating a new idempotency key on each retry, which\
    \ defeats it.\n- Ignoring concurrent duplicates arriving at the same moment.\n\n## In the interview\n\
    Define it, give the HTTP method table, and walk through a payment retry with an idempotency key. Expect\
    \ follow-ups on exactly-once versus at-least-once delivery, deduplication in consumers, and how long\
    \ to keep keys. Interviewers look for awareness that duplicates are normal in distributed systems.\n"
