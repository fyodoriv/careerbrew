- id: kb-b78a77f8d157
  question: What is the Mediator pattern, and how does middleware relate to it?
  answer: 'The Mediator pattern routes communication between components through one central object, so
    components do not reference each other directly. Middleware is a related idea: a request passes through
    a chain of functions that each can inspect, modify, or stop it before the final handler, as in Express
    or Redux.'
  topic: computer science
  tags:
  - design-patterns
  - behavioral
  - middleware
  explanation: "## In plain words\nPicture an air traffic control tower: planes do not talk to each other,\
    \ they all talk to the tower, which coordinates them. That is a mediator. Middleware is like airport\
    \ security: every passenger passes through a fixed series of checkpoints, each of which can wave them\
    \ on or stop them.\n\n## How it works\n**Mediator**\n- Components (colleagues) know only the mediator\
    \ and send it events.\n- The mediator decides who should react, which removes many-to-many links between\
    \ components.\n- Common in UI forms (a dialog coordinating fields), chat rooms, and event buses.\n\
    \n**Middleware**\n- An ordered pipeline of functions with the same signature, for example `(req, res,\
    \ next)`.\n- Each function does its job (logging, auth, parsing) and either calls `next()` or ends\
    \ the request.\n- Adds cross-cutting behaviour without changing the core handler; this is close to\
    \ the Chain of Responsibility pattern.\n\n## Example\n```javascript\n// Minimal middleware pipeline\n\
    function run(middlewares, ctx) {\n  let i = 0;\n  const next = () => {\n    const fn = middlewares[i++];\n\
    \    if (fn) fn(ctx, next);\n  };\n  next();\n}\n\nconst log = (ctx, next) => { ctx.trail.push(\"\
    log\"); next(); };\nconst auth = (ctx, next) => { if (ctx.user) { ctx.trail.push(\"auth\"); next();\
    \ } };\nconst handler = (ctx) => ctx.trail.push(\"handler\");\n\nconst ctx = { user: \"demo\", trail:\
    \ [] };\nrun([log, auth, handler], ctx);\nconsole.log(ctx.trail); // [\"log\", \"auth\", \"handler\"\
    ]\n```\n\n## Common mistakes\n- Letting the mediator become a \"god object\" that holds all business\
    \ logic.\n- Calling middleware in the wrong order (auth after the handler).\n- Forgetting to call\
    \ `next()`, which hangs the request.\n- Treating mediator and observer as the same; observer broadcasts\
    \ to subscribers, mediator coordinates specific interactions.\n\n## In the interview\nExplain the\
    \ coupling problem both solve and give one concrete example from a framework you know. Interviewers\
    \ look for trade-offs: fewer direct dependencies and easier changes, but a central point that can\
    \ grow complex and be harder to trace. Mention testing benefits: each middleware is a small function\
    \ you can test alone.\n"
