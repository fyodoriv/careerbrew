- id: kb-cabf8d9a8848
  question: What is a process in an operating system?
  answer: 'A process is a running program: its code plus its own private memory address space, open files,
    and other resources, managed by the operating system. A process contains one or more threads, which
    share its memory, while separate processes are isolated and must communicate through IPC such as pipes
    or sockets.'
  topic: computer science
  tags:
  - operating-systems
  - processes
  - threads
  - concurrency
  explanation: "## In plain words\nA program is a recipe on paper. A process is that recipe being cooked\
    \ right now, with its own kitchen: ingredients, pots, and progress. Two people cooking the same recipe\
    \ are two processes, each with a separate kitchen.\n\n## How it works\n- The OS tracks each process\
    \ in a **process control block**: process id (PID), state, registers, memory mappings, open file descriptors,\
    \ and owner.\n- **Memory layout**: code (text), static data, heap (grows with allocations), and a\
    \ stack per thread.\n- **States**: new, ready, running, waiting (blocked on I/O), terminated.\n- **Scheduling**:\
    \ the OS switches the CPU between processes; a **context switch** saves one process's registers and\
    \ restores another's.\n- **Creation**: on Unix, `fork()` copies the current process (using copy-on-write)\
    \ and `exec()` replaces it with a new program.\n- **Isolation**: one process cannot read another's\
    \ memory, so a crash is contained.\n- **Threads vs processes**: threads in the same process share\
    \ memory, which makes communication cheap but needs locks; processes are isolated and communicate\
    \ by IPC (pipes, sockets, shared memory, signals).\n\n## Example\n```python\nimport os\nfrom multiprocessing\
    \ import Process\n\ndef work():\n    print(\"child pid\", os.getpid())\n\nif __name__ == \"__main__\"\
    :\n    p = Process(target=work)\n    p.start()\n    p.join()\n    print(\"parent pid\", os.getpid())\n\
    ```\nEach print shows a different PID. In CPython, separate processes also sidestep the global interpreter\
    \ lock (GIL) for CPU-heavy work.\n\n## Common mistakes\n- Using \"process\" and \"thread\" interchangeably.\n\
    - Assuming a global variable changed in a child process changes in the parent.\n- Spawning a process\
    \ per tiny task; creation and context switches are relatively expensive.\n- Leaving zombie processes\
    \ by not waiting for children.\n\n## In the interview\nCompare processes and threads on isolation,\
    \ cost, and communication. Mention when to use each: processes for isolation and CPU parallelism in\
    \ languages with a GIL, threads for shared-memory work, async I/O for many waiting connections. Expect\
    \ follow-ups on context switching, fork and exec, and IPC.\n"
