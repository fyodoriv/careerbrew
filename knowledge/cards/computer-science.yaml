  question: How does prototypal inheritance differ from class-based inheritance?
  answer: In class-based inheritance, classes are blueprints and objects are instances of a class hierarchy
    fixed at definition. In prototypal inheritance (JavaScript), objects inherit directly from other objects
    through a prototype link, and property lookups walk that chain at runtime. JavaScript's class syntax
    is a cleaner way to set up prototype chains.
  topic: computer science
  tags:
  - javascript
  - oop
  - inheritance
  - prototypes
  explanation: "## In plain words\nIn a class-based language such as Java, you design a blueprint and\
    \ stamp out objects from it. In JavaScript, every object has a hidden link to another object, its\
    \ prototype. If you ask an object for a property it does not have, JavaScript asks its prototype,\
    \ then the prototype's prototype, and so on.\n\n## How it works\n**Class-based (Java, C#, C++)**\n\
    - Classes define structure and behaviour; objects are instances.\n- Inheritance relationships are\
    \ set when classes are defined.\n- Methods live in the class; the type system checks them.\n\n**Prototypal\
    \ (JavaScript)**\n- Each object has an internal `[[Prototype]]` link (`Object.getPrototypeOf(obj)`).\n\
    - Property lookup walks the chain until found or it reaches `null`.\n- You can create an object inheriting\
    \ from another directly with `Object.create(proto)`.\n- Prototypes can be changed at runtime, and\
    \ every object sharing the prototype sees the change.\n- `class` and `extends` in JavaScript are syntax\
    \ over this mechanism: methods go on `Class.prototype`.\n\n## Example\n```javascript\nconst animal\
    \ = {\n  speak() { return `${this.name} makes a sound`; },\n};\nconst dog = Object.create(animal);\n\
    dog.name = \"Rex\";\nconsole.log(dog.speak()); // \"Rex makes a sound\" (found on the prototype)\n\
    \nclass Cat {\n  constructor(name) { this.name = name; }\n  speak() { return `${this.name} meows`;\
    \ }\n}\nconst c = new Cat(\"Tom\");\nconsole.log(Object.getPrototypeOf(c) === Cat.prototype); // true\n\
    ```\n\n## Common mistakes\n- Saying JavaScript classes are \"real classes\" like Java's; they are\
    \ prototype chains underneath.\n- Modifying built-in prototypes such as `Array.prototype`, which affects\
    \ all code.\n- Putting methods on every instance inside the constructor, wasting memory.\n- Confusing\
    \ `__proto__` (an object's link) with `prototype` (a function's property used by `new`).\n\n## In\
    \ the interview\nExplain the lookup chain and show that `class` is syntax over prototypes. Interviewers\
    \ often follow with \"what does `new` do?\" (creates an object linked to `Constructor.prototype`,\
    \ runs the constructor with `this` bound to it, returns it) and with how `this` is determined. Mention\
    \ trade-offs: prototypes are flexible and memory-efficient but runtime changes can be surprising;\
    \ prefer composition for code reuse.\n"
