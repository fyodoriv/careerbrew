  question: How do you convert an array into an object in JavaScript?
  answer: Use Object.fromEntries on an array of [key, value] pairs, or reduce over the array to build
    an object keyed by some property. For an array of values, Object.assign({}, arr) or a spread gives
    index keys.
  topic: computer science
  tags:
  - javascript
  - arrays
  - objects
  explanation: "## In plain words\nJavaScript arrays hold ordered values; objects map keys to values.\
    \ Converting means deciding what the keys should be: positions, a property of each item, or the first\
    \ element of each pair.\n\n## How it works\n- **Pairs to object:** `Object.fromEntries([[\"a\", 1],\
    \ [\"b\", 2]])` gives `{ a: 1, b: 2 }`. This also turns a `Map` into an object.\n- **Index keys:**\
    \ `Object.assign({}, [\"x\", \"y\"])` or `{ ...[\"x\", \"y\"] }` gives `{ 0: \"x\", 1: \"y\" }`.\n\
    - **Keyed by a property:** `arr.reduce((acc, item) => { acc[item.id] = item; return acc; }, {})`,\
    \ or `Object.fromEntries(arr.map(u => [u.id, u]))`.\n- **Grouping:** newer runtimes provide `Object.groupBy(arr,\
    \ fn)`, which returns an object of arrays; a `reduce` works everywhere.\n- All of these are `O(n)`\
    \ time and space.\n- The reverse direction: `Object.entries(obj)`, `Object.keys`, and `Object.values`.\n\
    \n## Example\n```javascript\nconst users = [\n  { id: \"u1\", name: \"Ada\" },\n  { id: \"u2\", name:\
    \ \"Lin\" },\n];\n\nconst byId = Object.fromEntries(users.map(u => [u.id, u]));\nconsole.log(byId.u2.name);\
    \ // \"Lin\"\n\nconst counts = [\"a\", \"b\", \"a\"].reduce((acc, ch) => {\n  acc[ch] = (acc[ch] ||\
    \ 0) + 1;\n  return acc;\n}, {});\nconsole.log(counts); // { a: 2, b: 1 }\n```\n\n## Common mistakes\n\
    - Forgetting to return the accumulator in `reduce`, which yields `undefined`.\n- Using spread inside\
    \ `reduce` (`{ ...acc, [k]: v }`), which copies the object on each step and becomes `O(n^2)`.\n- Expecting\
    \ object keys to keep non-string types; keys become strings (use a `Map` to keep them).\n- Overwriting\
    \ entries silently when keys are duplicated.\n\n## In the interview\nAsk what the keys should be,\
    \ then pick `Object.fromEntries` for readability. Mention the spread-in-reduce performance trap and\
    \ when a `Map` is better (non-string keys, frequent additions, preserving insertion order explicitly).\
    \ Interviewers look for idiomatic modern JavaScript and awareness of edge cases like duplicate keys.\n"
