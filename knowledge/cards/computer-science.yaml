- id: kb-748cca4907bc
  question: What is a hash collision in a hash map, and how is it resolved?
  answer: A collision happens when two different keys map to the same bucket. The main fixes are separate
    chaining, where each bucket holds a list or tree of entries, and open addressing, where the map probes
    other slots (linear, quadratic, or double hashing). Good hash functions and resizing at a load-factor
    threshold keep collisions rare.
  topic: computer science
  tags:
  - hash-map
  - hash-table
  - collisions
  - data-structures
  explanation: "## In plain words\nA hash map has fewer buckets than possible keys, so sometimes two keys\
    \ get the same bucket number, like two guests assigned the same hotel room. Collisions cannot be avoided\
    \ entirely; the map just needs a fair rule for where the second guest goes.\n\n## How it works\n-\
    \ **Separate chaining:**\n  - Each bucket holds a small collection (linked list, or a balanced tree\
    \ when it grows; Java's `HashMap` switches long chains to trees).\n  - Lookup hashes to the bucket,\
    \ then scans it, comparing keys with equality.\n  - Simple and degrades gracefully; extra memory for\
    \ nodes.\n- **Open addressing:**\n  - All entries live in the array itself. On a collision, probe\
    \ a sequence of other slots.\n  - Linear probing (next slot, cache-friendly but forms clusters), quadratic\
    \ probing, double hashing (step size from a second hash).\n  - Deletion needs tombstones so later\
    \ probes do not stop early.\n  - Must keep the load factor lower (often under about 0.7).\n- **Keeping\
    \ collisions rare:** a hash function that spreads keys evenly, resizing and rehashing when the load\
    \ factor passes a threshold, and randomised seeds against deliberate collision attacks.\n\n## Example\n\
    Capacity 5, hash is `key % 5`. Insert 12, 7, 17 (all land in bucket 2).\n- Chaining: bucket 2 holds\
    \ `[12, 7, 17]`; looking up 17 scans three entries.\n- Linear probing: 12 goes in slot 2, 7 probes\
    \ to slot 3, 17 probes to slot 4.\n```python\ncap = 5\ntable = [None] * cap\nfor k in (12, 7, 17):\n\
    \    i = k % cap\n    while table[i] is not None:\n        i = (i + 1) % cap     # linear probing\n\
    \    table[i] = k\nprint(table)  # [None, None, 12, 7, 17]\n```\n\n## Common mistakes\n- Thinking\
    \ a good hash function eliminates collisions; it only makes them rare and even.\n- Deleting from an\
    \ open-addressing table by emptying the slot, which breaks later lookups.\n- Ignoring the worst case\
    \ `O(n)` when all keys collide.\n- Forgetting that equality, not just hash equality, decides whether\
    \ two keys match.\n\n## In the interview\nName both families, explain one in detail, and mention load\
    \ factor and resizing. Interviewers like real-world details: Java's tree bins for long chains, Python's\
    \ open addressing, and hash-flooding attacks prevented by randomised seeds. Be ready to compare memory\
    \ use and cache behaviour of chaining versus probing.\n"
