  question: How do you insert an element into a heap?
  answer: 'Append the new element at the end of the array, which keeps the tree complete, then sift it
    up: while it is smaller than its parent (in a min-heap), swap the two. It takes O(log n) time because
    the tree height is log n.'
  topic: computer science
  tags:
  - data-structures
  - heaps
  - sift-up
  - priority-queue
  explanation: '## In plain words

    A heap must stay both complete (no gaps) and ordered (parents beat children). Adding at the end keeps
    it complete; then the new item "bubbles up" like a light bubble in water until it sits under a parent
    that is no larger than it.


    ## How it works

    - Place the item at index `n` (the first free slot).

    - Its parent is at `(i - 1) // 2` for a 0-based array.

    - While `i > 0` and `a[i] < a[parent]`: swap, then set `i = parent`.

    - Stop when the parent is smaller or equal, or the item reaches the root.

    - At most one swap per level, so O(log n) time and O(1) extra space.

    - For a max-heap, flip the comparison.


    ## Example

    Min-heap array `[1, 3, 2, 7, 4]`. Insert 0:

    - Append: `[1, 3, 2, 7, 4, 0]`, index 5, parent index 2 (value 2).

    - 0 < 2, swap: `[1, 3, 0, 7, 4, 2]`, now index 2, parent index 0 (value 1).

    - 0 < 1, swap: `[0, 3, 1, 7, 4, 2]`. Root reached; done.

    ```python

    import heapq

    h = [1, 3, 2, 7, 4]

    heapq.heappush(h, 0)

    print(h)  # [0, 3, 1, 7, 4, 2]

    ```


    ## Common mistakes

    - Inserting at the front and shifting, which breaks the shape and costs O(n).

    - Using the child formula instead of the parent formula.

    - Continuing to swap after the order is restored.

    - Saying insertion is O(1); it is O(log n) worst case (O(1) on average for random input, a detail
    worth knowing but not leading with).


    ## In the interview

    Draw the tree and the array side by side; it shows you understand the mapping. Mention that inserting
    n items one by one costs O(n log n), while heapify on an existing array is O(n). Follow-up: how a
    priority queue handles ties or updates priorities (push a new entry and skip stale ones).

    '
