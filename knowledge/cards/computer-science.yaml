- id: kb-be5451f25c16
  question: What is the Proxy design pattern?
  answer: A proxy is an object that stands in for another object with the same interface and controls
    access to it. It can add lazy loading, caching, access checks, logging, or remote calls without changing
    the real object or its callers.
  topic: computer science
  tags:
  - design-patterns
  - structural
  - proxy
  explanation: "## In plain words\nA proxy is like a receptionist in front of a busy manager: visitors\
    \ talk to the receptionist as if they were the manager, and the receptionist decides whether to forward\
    \ the request, answer from notes, or turn them away.\n\n## How it works\n- The proxy implements the\
    \ same interface as the real subject, so callers cannot tell the difference.\n- It holds a reference\
    \ to the real object (or creates it later) and forwards calls, adding behaviour before or after.\n\
    - Common kinds:\n  - Virtual proxy: delays creating an expensive object until first use.\n  - Protection\
    \ proxy: checks permissions.\n  - Caching proxy: returns stored results for repeated requests.\n \
    \ - Remote proxy: hides network communication (RPC stubs).\n  - Logging or metrics proxy.\n- JavaScript\
    \ has a built-in `Proxy` object that intercepts property access with handler traps.\n- Similar to\
    \ Decorator in structure; the intent differs: a decorator adds features, a proxy controls access.\n\
    \n## Example\n```python\nclass Database:\n    def query(self, sql):\n        print(\"running\", sql)\n\
    \        return [1, 2, 3]\n\nclass CachingProxy:\n    def __init__(self, real):\n        self.real,\
    \ self.cache = real, {}\n    def query(self, sql):\n        if sql not in self.cache:\n          \
    \  self.cache[sql] = self.real.query(sql)\n        return self.cache[sql]\n\ndb = CachingProxy(Database())\n\
    db.query(\"SELECT 1\")  # prints \"running SELECT 1\"\ndb.query(\"SELECT 1\")  # served from cache,\
    \ prints nothing\n```\n\n## Common mistakes\n- Changing the interface, so the proxy is no longer a\
    \ drop-in replacement.\n- Caching without an invalidation plan.\n- Hiding slow remote calls behind\
    \ what looks like a cheap local call, surprising callers.\n- Mixing up proxy, decorator, and adapter\
    \ (adapter changes the interface).\n\n## In the interview\nGive one concrete example from real systems:\
    \ ORM lazy loading, API gateways, reverse proxies such as Nginx at the infrastructure level, or the\
    \ JavaScript `Proxy` used by reactive frameworks. Interviewers like a crisp comparison with Decorator\
    \ and Adapter and an honest note on the costs: extra indirection and harder debugging.\n"
