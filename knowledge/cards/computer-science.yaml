- id: kb-2ed6bfb36717
  question: What is a priority queue?
  answer: A priority queue is an abstract data type where each element has a priority and you always remove
    the highest-priority (or lowest-value) element first. It is usually implemented with a binary heap,
    giving O(log n) insert and remove and O(1) peek.
  topic: computer science
  tags:
  - priority-queue
  - heap
  - data-structures
  explanation: "## In plain words\nA normal queue serves people in arrival order. A priority queue serves\
    \ the most urgent first, like an emergency room where a serious case jumps ahead of a sprained ankle,\
    \ no matter who arrived first.\n\n## How it works\n- Operations: `insert(item, priority)`, `pop()`\
    \ the best item, `peek()` at it, and sometimes `decrease_key`.\n- Implementations:\n  - Binary heap:\
    \ insert and pop `O(log n)`, peek `O(1)`. The usual choice.\n  - Sorted array: pop `O(1)` but insert\
    \ `O(n)`.\n  - Unsorted array: insert `O(1)` but pop `O(n)`.\n  - Balanced BST: `O(log n)` for all,\
    \ plus ordered iteration.\n- Libraries: Python `heapq` (min-heap on a list), Java `PriorityQueue`,\
    \ C++ `std::priority_queue` (max-heap by default).\n- Ties: add a counter to the tuple so equal priorities\
    \ keep insertion order and never compare the payloads.\n\n## Example\n```python\nimport heapq\nfrom\
    \ itertools import count\n\ntasks, order = [], count()\nheapq.heappush(tasks, (2, next(order), \"\
    write report\"))\nheapq.heappush(tasks, (1, next(order), \"fix outage\"))\nheapq.heappush(tasks, (3,\
    \ next(order), \"tidy desk\"))\n\nwhile tasks:\n    priority, _, name = heapq.heappop(tasks)\n   \
    \ print(priority, name)\n# 1 fix outage\n# 2 write report\n# 3 tidy desk\n```\n\n## Common mistakes\n\
    - Thinking a priority queue is sorted; only the top is guaranteed.\n- Forgetting the default direction\
    \ (min vs max) of the library.\n- Comparing payloads on ties and crashing on uncomparable objects.\n\
    - Updating a priority in place without re-heapifying.\n\n## In the interview\nSeparate the abstract\
    \ type from the heap implementation; interviewers notice. List real uses: Dijkstra, schedulers, event\
    \ simulation, top-k, merging sorted streams. Expect a question on changing priorities: use lazy deletion\
    \ (push a new entry, skip stale ones) or an indexed heap.\n"
