  question: What is a log-structured merge tree (LSM tree)?
  answer: An LSM tree buffers writes in a sorted in-memory table, flushes it to disk as immutable sorted
    files, and merges those files in the background through compaction. This makes writes fast and sequential
    at the cost of reads that may check several files, which Bloom filters help limit.
  topic: computer science
  tags:
  - data-structures
  - databases
  - storage-engines
  - lsm-tree
  explanation: '## In plain words

    Disks and SSDs are much faster at writing in long sequential runs than at updating random spots. An
    LSM tree never edits data in place. It collects writes in memory, writes them out in sorted batches,
    and tidies up those batches later. Cassandra, RocksDB, LevelDB, and many other stores use it.


    ## How it works

    - **Write-ahead log (WAL)**: each write is appended to a log first, so a crash cannot lose it.

    - **Memtable**: an in-memory sorted structure (often a skip list) holds recent writes.

    - **Flush**: when the memtable is full, it is written to disk as an immutable sorted file, an SSTable
    (sorted string table).

    - **Reads**: check the memtable, then SSTables from newest to oldest. A per-file Bloom filter skips
    files that surely lack the key, and a sparse index finds the block inside a file.

    - **Deletes**: write a tombstone marker; the data disappears during compaction.

    - **Compaction**: merge SSTables, keep the newest version of each key, and drop tombstoned data. Leveled
    compaction favours reads and space; size-tiered favours writes.


    ## Example

    Write `user42 = "Ana"`, later `user42 = "Ana B"`. Both versions may sit in different SSTables until
    compaction. A read finds the newer value first because it searches newest to oldest, and compaction
    later keeps only "Ana B".


    ## Common mistakes

    - Claiming reads are as cheap as in a B-tree; a miss may touch several levels.

    - Ignoring write amplification (data rewritten many times by compaction) and compaction spikes that
    hurt latency.

    - Forgetting that deleted data uses space until tombstones are compacted.


    ## In the interview

    Frame it as a trade-off with B+ trees: LSM trees win on write-heavy workloads and compress well; B+
    trees give more predictable reads and in-place updates. Mention read, write, and space amplification
    as the three costs that tuning moves between.

    '
