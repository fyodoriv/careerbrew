- id: kb-2505e68d1a85
  question: What is the difference between prototypal inheritance and class inheritance?
  answer: In class inheritance (Java, C#), classes are blueprints and objects are instances that get their
    behaviour from a fixed class hierarchy. In prototypal inheritance (JavaScript), objects inherit directly
    from other objects through a prototype chain that is looked up at runtime. JavaScript's class syntax
    is a cleaner way to write prototype-based code.
  topic: computer science
  tags:
  - javascript
  - oop
  - inheritance
  - prototypes
  explanation: '## In plain words

    Class inheritance is like a cookie cutter: you design the cutter first, then stamp out cookies. Prototypal
    inheritance is like asking a colleague: if an object does not know something, it asks its prototype,
    which may ask its own prototype, and so on up the chain.


    ## How it works

    Class-based:

    - Classes are defined before use; objects are instances of exactly one class.

    - Methods are resolved through the class hierarchy, usually fixed at compile time.


    Prototype-based (JavaScript):

    - Every object has an internal link (`[[Prototype]]`) to another object or `null`.

    - Property lookup walks the chain: own properties first, then the prototype, then its prototype.

    - Methods are shared by putting them on the prototype, so instances do not copy them.

    - The chain can be changed at runtime and objects can be created with `Object.create(proto)` without
    any class.

    - `class` and `extends` in JavaScript set up the same prototype links: `Child.prototype` delegates
    to `Parent.prototype`.


    ## Example

    ```javascript

    const animal = { speak() { return `${this.name} makes a sound`; } };

    const dog = Object.create(animal);

    dog.name = "Rex";

    console.log(dog.speak());                          // "Rex makes a sound"

    console.log(Object.getPrototypeOf(dog) === animal); // true


    class Cat { constructor(n) { this.name = n; } speak() { return "meow"; } }

    console.log(Object.getPrototypeOf(new Cat("Tom")) === Cat.prototype); // true

    ```


    ## Common mistakes

    - Saying JavaScript classes are "real classes" like Java''s; they are syntax over prototypes.

    - Mixing up `__proto__` (an object''s link) with `prototype` (a constructor function''s property).

    - Putting methods inside the constructor, which creates a new function per instance.

    - Forgetting that changing a prototype affects all objects that delegate to it.


    ## In the interview

    Explain the lookup chain with a two-level example. Mention that both models suffer from deep hierarchies,
    and that composition is often preferred. Expect follow-ups: `this` binding, `Object.create(null)`
    for dictionary objects, `instanceof` walking the chain, and performance of prototype changes.

    '
