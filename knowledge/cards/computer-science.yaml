  explanation: "## In plain words\nTwo runners on a track: if the track is a straight road, the fast one\
    \ simply reaches the end. If the track is a loop, the fast one keeps going round and must eventually\
    \ catch the slow one from behind. That meeting proves a loop exists.\n\n## How it works\n- `slow =\
    \ fast = head`.\n- While `fast` and `fast.next` are not null: `slow = slow.next`, `fast = fast.next.next`;\
    \ if `slow is fast`, return true.\n- If the loop ends, return false.\n- Why they must meet: once both\
    \ are inside the cycle, the gap between them shrinks by one each step, so it reaches zero within one\
    \ lap.\n- Time O(n), space O(1).\n- Simple alternative: store visited nodes in a hash set; O(n) space.\n\
    - Extension: after meeting, reset one pointer to the head and move both one step at a time to find\
    \ where the cycle starts.\n\n## Example\n```python\nclass Node:\n    def __init__(self, val):\n  \
    \      self.val, self.next = val, None\n\ndef has_cycle(head):\n    slow = fast = head\n    while\
    \ fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n        if slow is fast:\n\
    \            return True\n    return False\n\na, b, c = Node(1), Node(2), Node(3)\na.next, b.next,\
    \ c.next = b, c, a\nprint(has_cycle(a))  # True\n```\n\n## Common mistakes\n- Comparing values instead\
    \ of node identity; duplicate values cause false positives.\n- Checking `slow == fast` before moving,\
    \ so they \"meet\" at the start.\n- Null-pointer errors from not checking `fast.next`.\n- Not knowing\
    \ the hash-set alternative or the follow-up to find the start.\n\n## In the interview\nStart with\
    \ the hash-set idea, then optimise to O(1) space. Give the one-line argument for why they meet. The\
