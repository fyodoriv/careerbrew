  question: What is selection sort, and how do you implement it?
  answer: Selection sort repeatedly finds the smallest element in the unsorted part and swaps it to the
    front of that part. It always takes O(n^2) comparisons and O(1) extra space, makes at most n - 1 swaps,
    and is not stable.
  topic: computer science
  tags:
  - algorithms
  - sorting
  - selection-sort
  explanation: "## In plain words\nLay out cards face up. Find the smallest, move it to position one.\
    \ Find the smallest of the rest, move it to position two. Keep going. The left side grows into a sorted\
    \ list one element at a time.\n\n## How it works\n- For each position `i` from 0 to n - 2:\n  - Scan\
    \ positions `i..n-1` to find the index of the minimum.\n  - Swap that minimum into position `i`.\n\
    - After pass `i`, the first `i + 1` elements are sorted and final.\n- Comparisons: about n^2 / 2 in\
    \ every case, even if the input is already sorted, so time is O(n^2) best, average, and worst.\n-\
    \ Swaps: at most n - 1, which is its one strength when writes are expensive.\n- Space: O(1). Not stable,\
    \ because a long-distance swap can jump an element past an equal one.\n\n## Example\n```python\ndef\
    \ selection_sort(a):\n    n = len(a)\n    for i in range(n - 1):\n        m = i\n        for j in\
    \ range(i + 1, n):\n            if a[j] < a[m]:\n                m = j\n        a[i], a[m] = a[m],\
    \ a[i]\n    return a\n\nprint(selection_sort([64, 25, 12, 22, 11]))  # [11, 12, 22, 25, 64]\n```\n\
    Trace: pass 1 swaps 11 to the front, pass 2 brings 12, and so on.\n\n## Common mistakes\n- Swapping\
    \ every time a smaller element is found instead of once per pass; that becomes a clumsy bubble sort.\n\
    - Claiming it is adaptive; it does the same work on sorted input.\n- Calling it stable.\n\n## In the\
    \ interview\nImplement it quickly, state O(n^2) time, O(1) space, unstable, and minimal swaps. Compare\
    \ with insertion sort, which is also O(n^2) but runs in O(n) on nearly sorted data and is stable,\
    \ so it is usually preferred for small arrays. Mention that heapsort is selection sort with a heap\
    \ to find the minimum, which brings it to O(n log n).\n"
