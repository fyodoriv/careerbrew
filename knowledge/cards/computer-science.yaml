  question: How do you reverse a singly linked list?
  answer: 'Walk the list once with three pointers (previous, current, next): save current.next, point
    current.next at previous, then advance both. When current is empty, previous is the new head. O(n)
    time and O(1) space; the recursive version uses O(n) stack.'
  topic: computer science
  tags:
  - linked-list
  - pointers
  - in-place
  explanation: "## In plain words\nEach node in a singly linked list points forward to the next. Reversing\
    \ means turning every arrow around. You walk along the list and flip one arrow at a time, carefully\
    \ remembering where you were going before you flip it.\n\n## How it works\n- `prev = None`, `cur =\
    \ head`.\n- While `cur` is not empty:\n  - `nxt = cur.next` (remember the rest of the list),\n  -\
    \ `cur.next = prev` (flip the arrow),\n  - `prev = cur`, `cur = nxt` (move forward).\n- Return `prev`,\
    \ the old tail and new head.\n- Recursive version: reverse the rest of the list, then set `head.next.next\
    \ = head` and `head.next = None`. Elegant, but it uses `O(n)` call-stack space.\n\n## Example\n```python\n\
    class Node:\n    def __init__(self, val, next=None):\n        self.val, self.next = val, next\n\n\
    def reverse(head):\n    prev, cur = None, head\n    while cur:\n        nxt = cur.next\n        cur.next\
    \ = prev\n        prev, cur = cur, nxt\n    return prev\n\nh = reverse(Node(1, Node(2, Node(3))))\n\
    out = []\nwhile h:\n    out.append(h.val)\n    h = h.next\nprint(out)  # [3, 2, 1]\n```\n\n## Common\
    \ mistakes\n- Overwriting `cur.next` before saving it, losing the rest of the list.\n- Returning `head`\
    \ (now the tail) instead of `prev`.\n- Forgetting to set the old head's `next` to empty in the recursive\
    \ version, leaving a cycle.\n- Not handling an empty list or a single node.\n\n## In the interview\n\
    Draw three boxes and the arrows before coding; it prevents pointer bugs and shows a clear method.\
    \ Give both versions and their space costs. Common follow-ups: reverse a sub-range between positions\
    \ m and n, reverse in groups of k, and check whether a list is a palindrome.\n"
