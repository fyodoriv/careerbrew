  question: When is it a good idea to extend a global or built-in object, such as a JavaScript prototype?
  answer: Almost never in shared or library code, because changes to built-ins like Array.prototype affect
    every script on the page and can clash with other code or future standards. The accepted exception
    is a careful, spec-compliant polyfill that adds a standard feature only when it is missing.
  topic: computer science
  tags:
  - javascript
  - monkey-patching
  - best-practices
  - polyfills
  explanation: "## In plain words\nBuilt-in objects like `Array`, `Object`, or `String` are shared by\
    \ every piece of code in the program. Adding your own method to them is like rewiring the building's\
    \ main fuse box for your apartment: it may work for you, but it can surprise every other tenant.\n\
    \n## How it works\n- In JavaScript you can add methods to `Array.prototype` or properties to `window`\
    \ (or `globalThis`). Changing shared built-ins like this is called **monkey patching**. (Do not confuse\
    \ it with **prototype pollution**, a security bug where attacker-controlled input such as a `__proto__`\
    \ key modifies `Object.prototype`.)\n- **Risks**:\n  - Name clashes with other libraries that add\
    \ the same name with different behaviour.\n  - Clashes with future language features. A famous case:\
    \ a popular old library added `Array.prototype.flatten`, so the standard method had to be named `flat`,\
    \ and `contains` became `includes` for similar reasons.\n  - Enumerable additions show up in `for...in`\
    \ loops.\n  - Hidden behaviour that makes code harder to read and debug.\n- **When it is acceptable**:\n\
    \  - **Polyfills**: add a standard method in older environments, matching the specification exactly,\
    \ and only if it does not already exist.\n  - Code you fully control, such as a small application\
    \ with no third-party scripts, and even then with caution.\n  - Test setups that patch globals temporarily\
    \ and restore them.\n- **Better options**: utility functions, subclasses, wrapper objects, or modules.\n\
    \n## Example\n```javascript\n// Acceptable: a guarded polyfill matching the standard\nif (!Array.prototype.at)\
    \ {\n  Object.defineProperty(Array.prototype, \"at\", {\n    value: function (i) {\n      const n\
    \ = Math.trunc(i) || 0;\n      return this[n < 0 ? this.length + n : n];\n    },\n    writable: true,\
    \ configurable: true, enumerable: false,\n  });\n}\n\n// Preferred for your own helpers: a plain function\n\
    const last = (arr) => arr[arr.length - 1];\nconsole.log([1, 2, 3].at(-1), last([1, 2, 3])); // 3 3\n\
    ```\n\n## Common mistakes\n- Shipping prototype extensions in a library that others import.\n- Writing\
    \ a \"polyfill\" that differs from the spec.\n- Adding enumerable properties that break `for...in`\
    \ loops.\n\n## In the interview\nSay \"avoid it, except for spec-compliant polyfills\", explain the\
    \ reasons (shared global state, naming clashes, future standards), and offer alternatives. The same\
    \ reasoning applies to monkey patching in Python or Ruby.\n"
