  question: What is a divide and conquer algorithm?
  answer: Divide and conquer splits a problem into smaller independent subproblems of the same kind, solves
    them recursively, and combines their answers. Merge sort, quicksort, and binary search follow it,
    and the Master Theorem gives their running times, such as O(n log n) for T(n) = 2T(n/2) + O(n).
  topic: computer science
  tags:
  - algorithms
  - divide-and-conquer
  - recursion
  explanation: "## In plain words\nToo big to solve at once? Cut it into pieces, solve each piece the\
    \ same way, then glue the answers together. Sorting a huge pile of exam papers is easier if you split\
    \ it between friends, each sorts a stack, and you merge the stacks.\n\n## How it works\nThree steps:\n\
    1. **Divide**: split the input into subproblems, usually halves.\n2. **Conquer**: solve each subproblem\
    \ recursively; tiny ones are solved directly (the base case).\n3. **Combine**: merge the sub-answers.\n\
    \nAnalyzing it: write a recurrence `T(n) = a T(n/b) + f(n)` and apply the Master Theorem.\n- Merge\
    \ sort: `2T(n/2) + O(n)` gives O(n log n).\n- Binary search: `T(n/2) + O(1)` gives O(log n).\n- Karatsuba\
    \ multiplication: `3T(n/2) + O(n)` gives about O(n^1.585).\n\nSubproblems should be independent; if\
    \ they overlap heavily, dynamic programming is the better tool. Independent parts also run well in\
    \ parallel.\n\n## Example\nMaximum of an array, divide-and-conquer style:\n```python\ndef max_dc(a,\
    \ lo, hi):\n    if lo == hi:\n        return a[lo]\n    mid = (lo + hi) // 2\n    return max(max_dc(a,\
    \ lo, mid), max_dc(a, mid + 1, hi))\n\nnums = [3, 9, 2, 7, 5]\nprint(max_dc(nums, 0, len(nums) - 1))\
    \  # 9\n```\nThis is O(n) time and O(log n) stack space; a loop would do the same work, but the shape\
    \ is what matters for harder problems such as counting inversions or finding the closest pair of points.\n\
    \n## Common mistakes\n- Missing or wrong base cases, causing infinite recursion.\n- Slicing arrays\
    \ at every level (`a[:mid]`), which adds O(n) copying per level; pass indexes instead.\n- Using it\
    \ when subproblems overlap, which repeats work exponentially.\n\n## In the interview\nName the three\
    \ steps, write the recurrence, and solve it. Compare with dynamic programming (overlapping subproblems)\
    \ and greedy (one choice, no recursion into alternatives). Mention parallelism as a bonus, as in MapReduce.\n"
