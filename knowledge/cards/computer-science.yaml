- id: kb-9d00b682eeee
  question: What is the Provider pattern?
  answer: The Provider pattern makes a value or service available to a whole subtree of components without
    passing it through every level manually. In React, a Context Provider wraps part of the tree and any
    descendant reads the value with useContext, avoiding prop drilling.
  topic: computer science
  tags:
  - design-patterns
  - react
  - frontend
  - dependency-injection
  explanation: "## In plain words\nPassing the same prop down through five layers of components that do\
    \ not use it (prop drilling) is tedious and fragile. A provider is like Wi-Fi in a building: set it\
    \ up once at the top and every room can connect, without running a cable through every wall.\n\n##\
    \ How it works\n- Create a context with a default value: `const ThemeContext = createContext(\"light\"\
    )`.\n- Wrap part of the component tree in `<ThemeContext.Provider value={theme}>`.\n- Any descendant\
    \ calls `useContext(ThemeContext)` to read the nearest provider's value.\n- When the value changes,\
    \ consumers re-render.\n- Typical uses: theme, current user, locale, feature flags, and injecting\
    \ services such as an API client.\n- The general idea is a form of dependency injection: components\
    \ declare what they need and the environment supplies it.\n- Many libraries use it (state managers,\
    \ routers, data-fetching clients wrap your app in a provider).\n\n## Example\n```jsx\nimport { createContext,\
    \ useContext, useState } from \"react\";\n\nconst ThemeContext = createContext(\"light\");\n\nfunction\
    \ Button() {\n  const theme = useContext(ThemeContext);\n  return <button className={theme}>Save</button>;\n\
    }\n\nexport default function App() {\n  const [theme, setTheme] = useState(\"dark\");\n  return (\n\
    \    <ThemeContext.Provider value={theme}>\n      <Button />\n      <button onClick={() => setTheme(t\
    \ => (t === \"dark\" ? \"light\" : \"dark\"))}>Toggle</button>\n    </ThemeContext.Provider>\n  );\n\
    }\n```\n\n## Common mistakes\n- Putting rapidly changing state in a single big context, causing many\
    \ unnecessary re-renders.\n- Passing a new object literal as `value` on every render; memoise it.\n\
    - Using context for everything, when local state or props would be clearer.\n- Forgetting the provider,\
    \ so consumers silently get the default value.\n\n## In the interview\nExplain the problem (prop drilling)\
    \ and how the pattern solves it. Interviewers look for awareness of re-render costs: split contexts\
    \ by concern, memoise values, or use a state library with selectors. Mention testing: wrapping a component\
    \ in a provider with a fake value makes it easy to test.\n"
