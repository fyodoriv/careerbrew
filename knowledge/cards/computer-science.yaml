  question: What is the index of the last non-leaf node in a binary heap?
  answer: In a 0-based array of size n, the last non-leaf node is at index n // 2 - 1 (the parent of the
    last element, (n - 1 - 1) // 2). Every index after it is a leaf. Heapify starts there and sifts down
    toward index 0.
  topic: computer science
  tags:
  - data-structures
  - heaps
  - heapify
  - arrays
  explanation: "## In plain words\nA heap stored in an array is a complete tree, so all the leaves are\
    \ packed at the end. The last node with a child is simply the parent of the very last element. Everything\
    \ after it has no children.\n\n## How it works\n- Children of index `i` are `2i + 1` and `2i + 2`;\
    \ the parent of `i` is `(i - 1) // 2`.\n- The last element is at `n - 1`, so its parent is `(n - 2)\
    \ // 2`, which equals `n // 2 - 1` for n >= 2.\n- Indices `n // 2` to `n - 1` are leaves: about half\
    \ the nodes.\n- 1-based arrays: children `2i`, `2i + 1`; the last non-leaf is `n // 2`.\n- Bottom-up\
    \ heapify loops `i` from `n // 2 - 1` down to `0`, sifting each down. That costs O(n) total, because\
    \ most nodes are near the bottom and sift only a short distance.\n\n## Example\nArray of size 7: `[9,\
    \ 4, 7, 1, 2, 6, 3]`.\n- Last non-leaf: `7 // 2 - 1 = 2` (value 7, children at 5 and 6).\n- Leaves:\
    \ indices 3, 4, 5, 6.\n```python\ndef heapify(a):\n    n = len(a)\n    for i in range(n // 2 - 1,\
    \ -1, -1):\n        j = i\n        while 2 * j + 1 < n:\n            c = 2 * j + 1\n            if\
    \ c + 1 < n and a[c + 1] < a[c]:\n                c += 1\n            if a[j] <= a[c]:\n         \
    \       break\n            a[j], a[c] = a[c], a[j]\n            j = c\n    return a\n\nprint(heapify([9,\
    \ 4, 7, 1, 2, 6, 3]))  # [1, 2, 3, 4, 9, 6, 7]\n```\n\n## Common mistakes\n- Mixing 0-based and 1-based\
    \ formulas.\n- Starting heapify at index 0 and moving up, which does not produce a valid heap.\n-\
    \ Starting at `n - 1`, which wastes time on leaves (correct but sloppy).\n- Claiming heapify is O(n\
    \ log n).\n\n## In the interview\nDerive the formula from the parent formula rather than reciting\
    \ it; it shows understanding. Expect a follow-up on why bottom-up heapify is O(n): the sum of node\
    \ heights in a complete tree is linear. Mention heap sort, which heapifies once and then pops n times.\n"
