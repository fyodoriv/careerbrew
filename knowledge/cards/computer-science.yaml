- id: kb-403de09d43bf
  question: What is the Chain of Responsibility design pattern?
  answer: Chain of Responsibility passes a request along a linked series of handlers; each handler either
    processes it, stops it, or forwards it to the next one. The sender does not need to know which handler
    will deal with the request.
  topic: computer science
  tags:
  - design-patterns
  - behavioral
  - oop
  - middleware
  explanation: "## In plain words\nChain of Responsibility is a behavioral design pattern: it is about\
    \ how objects pass work between them. A request travels down a line of handlers, like a support ticket\
    \ that goes from a chatbot to a first-line agent to an engineer. Each one decides whether to handle\
    \ it, reject it, or pass it on.\n\n## How it works\n- Define a common handler interface with a method\
    \ such as `handle(request)` and a reference to the next handler.\n- Each concrete handler does one\
    \ job. It can:\n  - process the request and stop,\n  - reject it and stop (for example, a failed validation),\
    \ or\n  - do some work and call the next handler.\n- The client builds the chain once (A then B then\
    \ C) and sends every request to the first handler.\n- Benefits: the sender is decoupled from receivers;\
    \ you can add, remove, or reorder steps without changing other handlers (open/closed principle).\n\
    - Costs: a request may fall off the end unhandled, and long chains are harder to debug.\n- Real uses:\
    \ HTTP middleware (Express, ASP.NET), servlet filters, logging levels, input validation pipelines,\
    \ and event bubbling in the DOM.\n\n## Example\n```python\nclass Handler:\n    def __init__(self,\
    \ nxt=None):\n        self.nxt = nxt\n    def handle(self, req):\n        return self.nxt.handle(req)\
    \ if self.nxt else \"ok\"\n\nclass Auth(Handler):\n    def handle(self, req):\n        if not req.get(\"\
    user\"):\n            return \"401\"\n        return super().handle(req)\n\nclass RateLimit(Handler):\n\
    \    def handle(self, req):\n        if req.get(\"calls\", 0) > 100:\n            return \"429\"\n\
    \        return super().handle(req)\n\nchain = Auth(RateLimit())\nprint(chain.handle({\"user\": \"\
    u1\", \"calls\": 5}))  # ok\nprint(chain.handle({}))                          # 401\n```\n\n## Common\
    \ mistakes\n- Forgetting a default for when no handler takes the request.\n- Making handlers depend\
    \ on each other's order without documenting it.\n- Confusing it with Decorator: a decorator always\
    \ delegates and adds behavior; a chain handler may stop the request.\n\n## In the interview\nDefine\
    \ it in one sentence, then name a familiar example like web middleware. Discuss order sensitivity,\
    \ what happens when nothing handles the request, and testing each handler alone. A good trade-off:\
    \ flexibility and loose coupling versus less obvious control flow.\n"
