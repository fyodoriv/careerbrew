- id: kb-497fc1057c47
  question: What is dependency injection (DI)?
  answer: Dependency injection means an object receives the things it needs (its dependencies) from outside,
    usually through its constructor, instead of creating them itself. This decouples it from concrete
    implementations, makes it easy to swap in fakes for tests, and centralises wiring in one place or
    a DI container.
  topic: computer science
  tags:
  - design-patterns
  - dependency-injection
  - testing
  - decoupling
  explanation: "## In plain words\nA chef who grows their own vegetables is stuck with that garden. A\
    \ chef who is handed ingredients can cook with whatever arrives, including test ingredients. DI hands\
    \ an object its collaborators instead of letting it build them, so you control what it works with.\n\
    \n## How it works\n- Without DI: `class Service: def __init__(self): self.db = PostgresDB()`. The\
    \ class is welded to Postgres and hard to test.\n- With DI: `def __init__(self, db): self.db = db`.\
    \ Callers decide which database object to pass.\n- Forms:\n  - **constructor injection** (preferred;\
    \ dependencies are required and visible);\n  - **setter or property injection** (optional dependencies);\n\
    \  - **parameter injection** (pass per call).\n- **Composition root**: one place, near program start,\
    \ that builds real objects and wires them together.\n- **DI containers** (Spring, .NET's built-in\
    \ container, Angular's injector) automate the wiring from configuration or type hints.\n- Related\
    \ principle: dependency inversion (the D in SOLID) says to depend on abstractions; DI is a common\
    \ way to do that.\n\n## Example\n```python\nclass EmailSender:\n    def send(self, to, msg):\n   \
    \     raise NotImplementedError\n\nclass FakeSender(EmailSender):\n    def __init__(self):\n     \
    \   self.sent = []\n    def send(self, to, msg):\n        self.sent.append((to, msg))\n\nclass SignupService:\n\
    \    def __init__(self, sender: EmailSender):\n        self.sender = sender\n    def signup(self,\
    \ email):\n        self.sender.send(email, \"Welcome!\")\n\nfake = FakeSender()\nSignupService(fake).signup(\"\
