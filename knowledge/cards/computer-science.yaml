  question: What does a complexity like O(n log k) mean?
  answer: O(n log k) means you do n operations that each cost O(log k), typically pushing n items through
    a heap or balanced tree that never holds more than k elements. When k is much smaller than n it is
    close to linear and beats O(n log n) sorting; top-k and k-way merge are typical examples.
  topic: computer science
  tags:
  - big-o
  - complexity
  - heap
  - logarithm
  explanation: "## In plain words\nBig O expressions with two variables tell you which part of the input\
    \ drives which cost. In `O(n log k)`, the n says you touch every item once; the `log k` says each\
    \ touch costs a small logarithmic amount because the structure you are maintaining has only k items.\n\
    \n## How it works\n- Each heap or balanced-tree operation costs `O(log size)`. If you cap the size\
    \ at k, each operation is `O(log k)`.\n- Doing that for all n items gives `O(n log k)`.\n- Compare\
    \ with sorting everything, `O(n log n)`: if k = 10 and n = 10^9, `log k` is about 3.3 while `log n`\
    \ is about 30, so the capped heap is roughly 9 times less work, and it uses only `O(k)` memory.\n\
    - Space is usually `O(k)`, which is the real win for streams that do not fit in memory.\n- Typical\
    \ sources:\n  - Top-k largest with a min-heap of size k.\n  - Merging k sorted lists with N total\
    \ items: `O(N log k)`.\n  - Sliding window of size k with a balanced tree or heap.\n\n## Example\n\
    Top 3 largest numbers in a stream:\n```python\nimport heapq\n\ndef top_k(stream, k):\n    heap = []\n\
    \    for x in stream:              # n iterations\n        if len(heap) < k:\n            heapq.heappush(heap,\
    \ x)   # O(log k)\n        elif x > heap[0]:\n            heapq.heapreplace(heap, x)  # O(log k)\n\
    \    return sorted(heap, reverse=True)\n\nprint(top_k([5, 1, 9, 3, 7, 2, 8], 3))  # [9, 8, 7]\n```\n\
    Time `O(n log k)`, space `O(k)`.\n\n## Common mistakes\n- Simplifying `O(n log k)` to `O(n log n)`\
    \ and losing the point of the optimisation.\n- Mixing up which variable is which; define n and k out\
    \ loud.\n- Letting the heap grow beyond k, which silently turns it into `O(n log n)`.\n\n## In the\
    \ interview\nDefine every variable before stating a multi-variable complexity. Interviewers like hearing\
    \ the comparison with sorting and with quickselect (average `O(n)` but needs all data in memory).\
    \ Point out when the `O(k)` memory bound matters, such as streaming or distributed data.\n"
