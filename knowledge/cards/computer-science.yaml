  question: What is a binary tree, and what are its pros and cons?
  answer: A binary tree is a hierarchical structure where each node has at most two children, called left
    and right. It models hierarchical data and underlies binary search trees, heaps, and expression trees.
    Without extra rules it has no ordering, so searching is O(n), and its height ranges from log n to
    n depending on shape.
  topic: computer science
  tags:
  - trees
  - binary-tree
  - data-structures
  explanation: "## In plain words\nA binary tree looks like an upside-down family tree where every parent\
    \ has at most two children. On its own it is just a shape; adding rules on top (ordered keys, heap\
    \ order, balance) turns it into powerful structures such as search trees and priority queues.\n\n\
    ## How it works\n- **Terms:** root (top node), leaf (no children), height (longest root-to-leaf path),\
    \ depth (distance from the root).\n- **Shapes:**\n  - Full: every node has 0 or 2 children.\n  - Complete:\
    \ all levels full except possibly the last, which fills left to right (heaps use this).\n  - Perfect:\
    \ all levels completely full; it has `2^(h+1) - 1` nodes.\n  - Balanced: heights of subtrees differ\
    \ by a small bound, so height is `O(log n)`.\n  - Degenerate: every node has one child, effectively\
    \ a linked list.\n- **Traversals:** preorder, inorder, postorder (DFS) and level order (BFS), all\
    \ `O(n)`.\n\n**Pros:** natural for hierarchical data and recursive algorithms; the base for BSTs,\
    \ heaps, tries (generalised), and syntax trees.\n**Cons:** a plain binary tree gives no fast search\
    \ (`O(n)`); pointer-based nodes use extra memory and have poor cache locality; unbalanced trees lose\
    \ their speed advantage.\n\n## Example\nAn expression tree for `(2 + 3) * 4`: the root is `*`, its\
    \ left child is `+` with leaves 2 and 3, and its right child is 4.\n```python\nclass N:\n    def __init__(self,\
    \ v, l=None, r=None):\n        self.v, self.l, self.r = v, l, r\n\ndef evaluate(n):\n    if n.l is\
    \ None:\n        return n.v\n    a, b = evaluate(n.l), evaluate(n.r)\n    return a + b if n.v == \"\
    +\" else a * b\n\nprint(evaluate(N(\"*\", N(\"+\", N(2), N(3)), N(4))))  # 20\n```\nThis uses a postorder\
    \ traversal: children are evaluated before their parent.\n\n## Common mistakes\n- Assuming every binary\
    \ tree is a binary search tree.\n- Confusing complete, full, and perfect trees.\n- Stating `O(log\
    \ n)` height without a balance guarantee.\n- Forgetting the empty tree as a base case in recursion.\n\
    \n## In the interview\nDefine it, list the shape terms precisely, and connect it to the structures\
    \ built on it. Interviewers expect clean recursive solutions on binary trees (height, mirror, path\
    \ sum) with `O(n)` time and `O(h)` space. Mention the array representation for complete trees, which\
    \ is why heaps need no pointers.\n"
