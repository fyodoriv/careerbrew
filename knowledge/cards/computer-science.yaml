- id: kb-e146cc3f0f10
  question: What are the core software engineering principles worth following?
  answer: Widely used principles include KISS (keep it simple), DRY (do not repeat knowledge), YAGNI (do
    not build what is not needed yet), SOLID for object-oriented design, separation of concerns, composition
    over inheritance, and writing tests. They guide trade-offs rather than acting as strict rules.
  topic: computer science
  tags:
  - design-principles
  - solid
  - clean-code
  explanation: '## In plain words

    Principles are rules of thumb that help code stay easy to read, change, and trust as it grows. None
    of them are laws; each one prevents a common kind of pain, and good engineers know when one should
    yield to another.


    ## How it works

    - **KISS:** the simplest design that works is easiest to understand and debug.

    - **DRY:** each piece of knowledge (a rule, a formula) should live in one place. Duplicate code that
    changes for different reasons is fine.

    - **YAGNI:** do not build features or abstractions for imagined future needs.

    - **SOLID:** single responsibility, open-closed, Liskov substitution, interface segregation, dependency
    inversion.

    - **Separation of concerns:** keep UI, business logic, and data access apart.

    - **Composition over inheritance:** combine small parts instead of building deep class trees.

    - **Fail fast and loudly:** validate inputs early, surface errors clearly.

    - **Least surprise:** names and behaviour should do what a reader expects.

    - **Test what matters:** automated tests make change safe.


    ## Example

    Picking a favourite and defending it (a fictional sample answer):


    "My go-to is YAGNI paired with KISS. On a past team we were asked for a CSV export. Someone proposed
    a plug-in system for any format. We shipped a single CSV function in a day instead. Six months later
    we needed JSON, and by then we knew the real shape of the problem, so the abstraction we added fitted
    reality. The lesson: simplicity first, then generalise from at least two real cases."


    ## Common mistakes

    - Reciting acronyms without examples.

    - Applying DRY so aggressively that unrelated code becomes coupled through a shared helper.

    - Treating principles as absolutes instead of trade-offs.

    - Naming SOLID letters but not being able to explain one.


    ## In the interview

    Pick two or three principles you genuinely use and give a short real or illustrative example for each.
    Interviewers score judgment: when you broke a principle on purpose and why. Expect follow-ups such
    as "when is duplication better than abstraction?" or "explain dependency inversion".

    '
