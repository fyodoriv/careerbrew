  question: How does binary search work?
  answer: Binary search finds a target in a sorted array by comparing it with the middle element and discarding
    the half that cannot contain it, repeating until it is found or the range is empty. It runs in O(log
    n) time and O(1) space when written iteratively.
  topic: computer science
  tags:
  - algorithms
  - binary-search
  - searching
  - arrays
  explanation: "## In plain words\nBinary search is how you look up a word in a paper dictionary: open\
    \ near the middle, see whether your word comes before or after, and throw away the other half. Each\
    \ step halves what is left, so even a billion items need only about 30 steps. It only works when the\
    \ data is sorted.\n\n## How it works\n- Keep two indexes, `lo` and `hi`, that bound the part of the\
    \ array that might still hold the target.\n- While `lo <= hi`:\n  - Compute `mid = lo + (hi - lo)\
    \ // 2` (this form avoids integer overflow in languages with fixed-size integers).\n  - If `a[mid]`\
    \ equals the target, return `mid`.\n  - If `a[mid]` is smaller, the target can only be to the right:\
    \ `lo = mid + 1`.\n  - Otherwise it can only be to the left: `hi = mid - 1`.\n- If the loop ends,\
    \ the range is empty and the target is absent.\n- Time is `O(log n)` because the range halves each\
    \ step. The iterative version uses `O(1)` extra space; a recursive version uses `O(log n)` stack space.\n\
    \n## Example\n```python\ndef binary_search(a, target):\n    lo, hi = 0, len(a) - 1\n    while lo <=\
    \ hi:\n        mid = lo + (hi - lo) // 2\n        if a[mid] == target:\n            return mid\n \
    \       if a[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n \
    \   return -1\n\nprint(binary_search([1, 3, 5, 7, 9, 11], 7))  # 3\n```\n\n## Common mistakes\n- Using\
    \ it on unsorted data.\n- Off-by-one errors: mixing `lo < hi` with `hi = mid - 1`, or writing `lo\
    \ = mid`, which can loop forever.\n- Not handling an empty array or duplicates when the question asks\
    \ for the first or last occurrence.\n- Overflow from `(lo + hi) / 2` in Java or C++.\n\n## In the\
    \ interview\nExplain the invariant (\"if the target exists, it is between `lo` and `hi`\") before\
    \ coding; it makes the boundaries easy to defend. Expect variants: first position not less than the\
    \ target (lower bound), searching a rotated sorted array, or \"binary search on the answer\" for problems\
    \ like minimum capacity to ship packages in D days. Mention that sorting first costs `O(n log n)`,\
    \ so it only pays off when you search many times.\n"
