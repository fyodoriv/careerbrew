- id: kb-9e3420dd2d77
  question: What is an adjacency matrix?
  answer: An adjacency matrix represents a graph with V nodes as a V x V grid where cell [i][j] holds
    1 (or the edge weight) if there is an edge from i to j, and 0 otherwise. Edge lookup is O(1), but
    it always uses O(V^2) space and listing a node's neighbours costs O(V), so it suits small or dense
    graphs.
  topic: computer science
  tags:
  - graphs
  - adjacency-matrix
  - data-structures
  explanation: "## In plain words\nAn adjacency matrix is like a mileage chart in a road atlas: every\
    \ city is listed along both the top and the side, and the cell where two cities meet tells you whether\
    \ they are connected and how far apart they are.\n\n## How it works\n- Number the nodes 0 to V-1 and\
    \ allocate a V x V array filled with 0 (or infinity for weighted graphs without an edge).\n- For an\
    \ edge `u -> v` with weight w, set `m[u][v] = w` (or 1). For undirected graphs also set `m[v][u]`,\
    \ so the matrix is symmetric.\n- **Costs:**\n  - Check if an edge exists: `O(1)`.\n  - List neighbours\
    \ of a node: `O(V)` (scan a row).\n  - Space: `O(V^2)` regardless of how many edges exist.\n  - BFS\
    \ or DFS over the whole graph: `O(V^2)`.\n- Good for dense graphs, small V, and algorithms that are\
    \ naturally matrix-based, such as Floyd-Warshall all-pairs shortest paths.\n- Matrix powers count\
    \ walks: entry [i][j] of `A^k` is the number of walks of length k from i to j.\n\n## Example\n```python\n\
    V = 4\nedges = [(0, 1), (0, 2), (1, 2), (2, 3)]\nm = [[0] * V for _ in range(V)]\nfor u, v in edges:\n\
    \    m[u][v] = m[v][u] = 1\n\nfor row in m:\n    print(row)\n# [0, 1, 1, 0]\n# [1, 0, 1, 0]\n# [1,\
    \ 1, 0, 1]\n# [0, 0, 1, 0]\nprint(m[2][3] == 1)  # True: edge check in O(1)\n```\n\n## Common mistakes\n\
    - Using a matrix for a large sparse graph (a million nodes would need 10^12 cells).\n- Building rows\
    \ with `[[0] * V] * V` in Python, which shares one row.\n- Forgetting the symmetric entry for undirected\
    \ graphs.\n- Using 0 to mean \"no edge\" when 0 is also a valid weight.\n\n## In the interview\nCompare\
    \ it with adjacency lists and state when each wins: matrices for dense graphs and constant-time edge\
    \ checks, lists for sparse graphs and fast neighbour iteration. Interviewers like the space calculation\
    \ and the note that grids given as 2D arrays are not adjacency matrices, but implicit graphs.\n"
