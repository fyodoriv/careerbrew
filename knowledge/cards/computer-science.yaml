- id: kb-038a5d89a45c
  question: What is the Dependency Inversion Principle in SOLID?
  answer: High-level modules should not depend on low-level modules; both should depend on abstractions,
    and the abstractions should be owned by the high-level policy. In practice you code against interfaces
    and inject the concrete implementation.
  topic: computer science
  tags:
  - solid
  - oop
  - design-principles
  - dependency-injection
  explanation: "## In plain words\nYour business logic should not be glued to a particular database, email\
    \ service, or file format. Instead, it states what it needs as an interface (\"something that can\
    \ save an order\"), and the detailed code plugs into that interface. A lamp depends on the shape of\
    \ a wall socket, not on a specific power plant.\n\n## How it works\n- Normal layering: `OrderService`\
    \ imports and creates `MySqlOrderRepo`. The high-level code now depends on a detail.\n- Inverted:\
    \ `OrderService` depends on an `OrderRepo` interface that it defines. `MySqlOrderRepo` implements\
    \ that interface. The source-code dependency now points from the detail toward the policy.\n- The\
    \ concrete class is supplied from outside, usually by constructor injection or a dependency-injection\
    \ container.\n- Benefits: swap implementations, test with fakes, and keep business rules stable when\
    \ infrastructure changes.\n\n## Example\n```python\nfrom typing import Protocol\n\nclass Notifier(Protocol):\n\
    \    def send(self, to: str, text: str) -> None: ...\n\nclass SignupService:\n    def __init__(self,\
    \ notifier: Notifier):\n        self.notifier = notifier\n    def register(self, email: str):\n  \
    \      self.notifier.send(email, \"Welcome!\")\n\nclass FakeNotifier:\n    def __init__(self): self.sent\
    \ = []\n    def send(self, to, text): self.sent.append(to)\n\nfake = FakeNotifier()\nSignupService(fake).register(\"\
    a@example.com\")\nprint(fake.sent)  # ['a@example.com']\n```\n\n## Common mistakes\n- Treating dependency\
    \ inversion and dependency injection as the same thing; injection is one technique for applying the\
    \ principle.\n- Creating an interface for every class even when only one implementation will ever\
    \ exist.\n- Letting the low-level module define the interface, so the high-level code still depends\
    \ on it.\n\n## In the interview\nState the two rules, show a before and after, and name the testing\
    \ benefit. Mention trade-offs: more indirection and files, so apply it at real boundaries (storage,\
    \ network, clock, third-party APIs). Expect a follow-up connecting it to hexagonal (\"ports and adapters\"\
    ) architecture.\n"
