  question: What is heapsort?
  answer: Heapsort builds a max-heap from the array in O(n), then repeatedly swaps the largest element
    to the end and restores the heap on the remaining part. It runs in O(n log n) time in every case with
    O(1) extra space, but it is not stable and is usually slower in practice than quicksort.
  topic: computer science
  tags:
  - algorithms
  - sorting
  - heap
  - heapsort
  explanation: "## In plain words\nA max-heap always keeps its largest item on top. Heapsort turns the\
    \ array into a max-heap, takes the top item and puts it at the end, shrinks the heap by one, fixes\
    \ it, and repeats. The sorted part grows from the back.\n\n## How it works\n- The array is viewed\
    \ as a binary tree: the children of index `i` are `2i + 1` and `2i + 2`.\n- **Build heap**: call `sift_down`\
    \ on every non-leaf node from index `n // 2 - 1` down to 0. This costs O(n) total, not O(n log n),\
    \ because most nodes are near the bottom.\n- **Sort phase**: for `end` from `n - 1` down to 1:\n \
    \ - Swap `a[0]` (the max) with `a[end]`.\n  - `sift_down(0)` within `a[0:end]` to restore the heap,\
    \ O(log n).\n- Total: O(n log n) best, average, and worst. Space O(1). Not stable.\n\n## Example\n\
    ```python\ndef heapsort(a):\n    def sift_down(i, size):\n        while True:\n            big, l,\
    \ r = i, 2 * i + 1, 2 * i + 2\n            if l < size and a[l] > a[big]: big = l\n            if\
    \ r < size and a[r] > a[big]: big = r\n            if big == i:\n                return\n        \
    \    a[i], a[big] = a[big], a[i]\n            i = big\n\n    n = len(a)\n    for i in range(n // 2\
    \ - 1, -1, -1):\n        sift_down(i, n)\n    for end in range(n - 1, 0, -1):\n        a[0], a[end]\
    \ = a[end], a[0]\n        sift_down(0, end)\n    return a\n\nprint(heapsort([4, 10, 3, 5, 1]))  #\
    \ [1, 3, 4, 5, 10]\n```\n\n## Common mistakes\n- Using a min-heap for an in-place ascending sort;\
    \ the max-heap puts each largest item in its final slot.\n- Sifting down over the whole array instead\
    \ of only the unsorted prefix.\n- Saying building the heap is O(n log n); bottom-up building is O(n).\n\
    - Calling it stable.\n\n## In the interview\nCompare the three O(n log n) sorts: heapsort has a guaranteed\
    \ worst case and O(1) space; merge sort is stable but uses O(n) space; quicksort is usually fastest\
    \ thanks to cache-friendly access. Heapsort jumps around memory, so it has poorer cache behaviour.\
    \ Mention introsort, which falls back to heapsort when quicksort recurses too deep.\n"
