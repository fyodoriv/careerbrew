    \ speed.\n\n## How it works\n- **Adjacency list**: `graph[u] = [v1, v2, ...]`. Space O(V + E). Iterating\
    \ neighbours is fast; checking \"is there an edge u-v?\" costs O(degree) unless you use sets.\n- **Adjacency\
    \ matrix**: a V x V grid where `m[u][v]` is 1 or the weight. Space O(V^2). Edge check O(1), but listing\
    \ neighbours costs O(V).\n- **Edge list**: a list of `(u, v, w)` tuples. Compact and easy to sort\
    \ by weight.\n- Directed graphs store each edge once; undirected graphs store it in both directions.\n\
    - Weighted graphs store `(neighbour, weight)` pairs.\n\n## Example\n```python\nfrom collections import\
    \ defaultdict\n\nclass Graph:\n    def __init__(self, directed=False):\n        self.adj = defaultdict(list)\n\
    \        self.directed = directed\n\n    def add_edge(self, u, v, w=1):\n        self.adj[u].append((v,\
    \ w))\n        if not self.directed:\n            self.adj[v].append((u, w))\n\ng = Graph()\ng.add_edge(\"\
