  question: What is the pointer-switching technique for finding the intersection of two linked lists?
  answer: Walk one pointer down each list; when a pointer reaches the end, restart it at the head of the
    other list. Both pointers then travel the same total distance, so they meet at the intersection node,
    or both reach null together if there is none. It runs in O(m + n) time and O(1) space.
  topic: computer science
  tags:
  - linked-list
  - two-pointers
  - algorithms
  explanation: "## In plain words\nTwo lists may merge into a shared tail, like two roads joining into\
    \ one. If you walk each road and then switch to the start of the other road, both walkers cover exactly\
    \ the same total distance, so they reach the junction at the same moment.\n\n## How it works\n- Let\
    \ list A have `a` nodes before the shared part, list B have `b` nodes before it, and the shared tail\
    \ have `c` nodes.\n- Pointer `p` walks A, then B. Pointer `q` walks B, then A.\n- Before the junction,\
    \ `p` covers `a + c + b` steps and `q` covers `b + c + a`. These are equal, so they arrive at the\
    \ junction together.\n- If the lists do not intersect, both walk `a + b` steps and become null at\
    \ the same time, ending the loop.\n- Each pointer switches at most once. Time O(m + n), space O(1).\n\
    - Compare with alternatives: store A's nodes in a hash set (O(m) extra space), or compute both lengths\
    \ and advance the longer list by the difference first (also O(1) space, more code).\n- The intersection\
    \ is by node identity, not by equal values.\n\n## Example\n```python\nclass Node:\n    def __init__(self,\
    \ v, nxt=None):\n        self.v, self.next = v, nxt\n\nshared = Node(8, Node(9))\na = Node(1, Node(2,\
    \ shared))\nb = Node(5, shared)\n\ndef intersection(h1, h2):\n    p, q = h1, h2\n    while p is not\
    \ q:\n        p = p.next if p else h2\n        q = q.next if q else h1\n    return p\n\nprint(intersection(a,\
    \ b).v)  # 8\n```\n\n## Common mistakes\n- Comparing values instead of node references.\n- Switching\
    \ on `p.next is None` instead of when `p` becomes None, which can loop forever when the lists do not\
    \ intersect.\n- Modifying the lists (for example, marking nodes) when the question forbids it.\n\n\
    ## In the interview\nExplain why the distances match, state O(m + n) time and O(1) space, and mention\
    \ the length-difference and hash-set alternatives. Clarify whether lists may contain cycles; this\
    \ method assumes they do not.\n"
