  question: What is dynamic programming?
  answer: Dynamic programming solves a problem by breaking it into overlapping subproblems, solving each
    once, and storing the results, either top-down with memoization or bottom-up with a table. It applies
    when the problem has optimal substructure and repeated subproblems, and it often turns exponential
    brute force into polynomial time.
  topic: computer science
  tags:
  - algorithms
  - dynamic-programming
  - memoization
  - optimization
  explanation: "## In plain words\nIf you keep solving the same small question again and again, write\
    \ the answer down the first time. Dynamic programming (DP) is recursion plus a notebook. The art is\
    \ choosing what the small questions (states) are.\n\n## How it works\n1. **Define the state**: what\
    \ does `dp[i]` (or `dp[i][j]`) mean? For example, \"the fewest coins to make amount i\".\n2. **Write\
    \ the transition**: how a state is built from smaller ones.\n3. **Set base cases**: `dp[0] = 0`.\n\
    4. **Choose an order**: top-down (recursion plus memoization) or bottom-up (loops filling a table\
    \ so dependencies are ready first).\n5. **Read the answer** from the right state.\n\nComplexity is\
    \ (number of states) times (work per state). Often you can keep only the last row or two to cut space.\n\
    \nRequirements: **optimal substructure** (the best answer is built from best sub-answers) and **overlapping\
    \ subproblems** (the same states recur).\n\n## Example\nFewest coins to make an amount:\n```python\n\
    def min_coins(coins, amount):\n    INF = float(\"inf\")\n    dp = [0] + [INF] * amount\n    for a\
    \ in range(1, amount + 1):\n        for c in coins:\n            if c <= a and dp[a - c] + 1 < dp[a]:\n\
    \                dp[a] = dp[a - c] + 1\n    return dp[amount] if dp[amount] != INF else -1\n\nprint(min_coins([1,\
    \ 3, 4], 6))  # 2 (3 + 3); greedy would give 3 coins\n```\nTime O(amount * len(coins)), space O(amount).\n\
    \n## Common mistakes\n- Jumping to code before writing the state in words.\n- Wrong iteration order,\
    \ so a state reads a value not yet computed.\n- Off-by-one errors in table sizes and base cases.\n\
    - Using DP when a greedy rule is provably correct and simpler.\n\n## In the interview\nTalk through\
    \ brute-force recursion first, point out the repeated subproblems, then add memoization and finally\
    \ a bottom-up table with reduced space. State the state, transition, base case, and complexity out\
    \ loud. Common families: knapsack, longest common subsequence, edit distance, grid paths, and interval\
    \ DP.\n"
