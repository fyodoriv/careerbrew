- id: kb-6fc252e9f37d
  question: What is throughput, and how does it differ from latency?
  answer: 'Throughput is how much work a system completes per unit of time, such as requests per second
    or megabytes per second. Latency is how long one unit of work takes. They are related but different:
    batching and parallelism can raise throughput while making individual requests slower.'
  topic: computer science
  tags:
  - performance
  - system-design
  - throughput
  - latency
  explanation: '## In plain words

    Think of a motorway. Latency is how long one car takes to drive from A to B. Throughput is how many
    cars pass a point per hour. Adding lanes raises throughput without making any single car faster.


    ## How it works

    - **Throughput**: completed operations per unit time (requests/s, transactions/s, MB/s).

    - **Latency**: time for a single operation, usually reported as percentiles (p50, p95, p99) because
    averages hide slow outliers.

    - **Little''s law**: average items in the system = throughput x average latency. With 100 requests
    in flight and 50 ms latency, throughput is 100 / 0.05 = 2,000 requests/s.

    - **Ways to raise throughput**: more parallel workers or servers, batching, pipelining, async I/O,
    removing the bottleneck resource (CPU, disk, network, locks).

    - **Trade-offs**: batching and queueing raise throughput but add waiting time; near full utilization,
    queueing delay grows sharply, so latency spikes as throughput approaches capacity.

    - Bandwidth is the maximum possible rate of a link; throughput is the rate actually achieved.


    ## Example

    A database handles 1 write per 2 ms when each write commits on its own: about 500 writes/s. Grouping
    50 writes per commit takes 10 ms per batch, giving 5,000 writes/s, but each write may wait up to 10
    ms instead of 2 ms. Throughput rose 10x; latency rose too.


    ## Common mistakes

    - Using throughput and latency as synonyms.

    - Reporting only average latency.

    - Load testing at low concurrency and assuming the numbers hold near capacity.

    - Optimizing a component that is not the bottleneck, which changes nothing.


    ## In the interview

    In system design, estimate throughput needs early (daily active users x actions per user / 86,400
    seconds, times a peak factor) and set latency targets as percentiles. Discuss what limits throughput,
    how to scale horizontally, and how to protect latency with back-pressure, rate limiting, and capacity
    headroom.

    '
