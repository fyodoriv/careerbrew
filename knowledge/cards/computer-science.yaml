- id: kb-cb282f43dd97
  question: How do you choose the right kind of storage in a system design interview?
  answer: 'Start from the data shape and access patterns: relational databases for structured data with
    joins and transactions, key-value or document stores for simple lookups at scale, object storage for
    large blobs, search indexes for text search, and caches for hot reads. Then weigh consistency, scale,
    and cost.'
  topic: computer science
  tags:
  - system-design
  - databases
  - storage
  explanation: '## In plain words

    There is no best database, only one that fits how your data is read and written. Choosing storage
    is like choosing a container for moving house: boxes for books, a wardrobe box for suits, a fridge
    for food. Ask what the data looks like and how it will be used before naming a product.


    ## How it works

    Ask these questions in order:

    - **Shape:** structured with relations (SQL), flexible documents (document store), simple key to value
    (key-value store), large files (object storage such as S3), time-stamped metrics (time-series DB),
    connections between entities (graph DB).

    - **Access pattern:** reads vs writes, point lookups vs range scans vs full-text search, read latency
    needs.

    - **Consistency:** do you need ACID transactions (payments, inventory) or is eventual consistency
    fine (likes, feeds)?

    - **Scale:** data size and QPS; can one primary plus replicas cope, or do you need horizontal sharding
    (Cassandra, DynamoDB)?

    - **Extras:** add a cache (Redis) for hot keys, a search index (Elasticsearch) for text, a CDN for
    static media.


    ## Example

    Designing a photo-sharing app:

    - User accounts and follows: PostgreSQL (relations, transactions).

    - Photos: object storage, served through a CDN; the database only stores the object key.

    - Feed timelines: a wide-column or key-value store keyed by user id, precomputed.

    - Captions search: a search index.

    - Session data and counters: Redis.


    ## Common mistakes

    - Naming a trendy database without tying it to an access pattern.

    - Storing large binary files in a relational database.

    - Picking NoSQL "for scale" when the data is small and relational.

    - Ignoring how data will be queried, then needing joins the store cannot do.


    ## In the interview

    Talk through requirements first, then justify each store in one sentence linked to a requirement.
    Interviewers score the reasoning and trade-offs: SQL gives strong consistency and flexible queries
    but is harder to shard; NoSQL scales writes but pushes query design up front. Expect follow-ups on
    indexing, replication, sharding keys, and what happens when a node fails.

    '
