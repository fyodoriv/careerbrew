- id: kb-89ec7bc08399
  question: What are streams in programming?
  answer: A stream is a sequence of data processed piece by piece as it becomes available, rather than
    loaded all at once. Streams keep memory use small for large or endless data, let processing start
    early, and can be chained into pipelines; backpressure stops a fast producer from overwhelming a slow
    consumer.
  topic: computer science
  tags:
  - streams
  - io
  - nodejs
  - data-processing
  explanation: "## In plain words\nDrinking from a water fountain is a stream; filling a bathtub first\
    \ and then drinking is not. Streams let a program handle data one chunk at a time, so a 50 GB file\
    \ or an endless feed of events can be processed with a small, fixed amount of memory.\n\n## How it\
    \ works\n- **Readable:** a source that produces chunks (a file, an HTTP response, a socket).\n- **Writable:**\
    \ a destination that consumes chunks (a file, a network connection).\n- **Transform:** reads chunks,\
    \ changes them, and passes them on (compression, parsing, encryption).\n- **Piping:** connect them\
    \ into a pipeline: read file, gunzip, parse lines, write results.\n- **Backpressure:** when the consumer\
    \ is slower, it signals the producer to pause, keeping buffers bounded.\n- Examples: Node.js streams,\
    \ Java `InputStream` and the separate `java.util.stream` API (a lazy pipeline over collections), Python\
    \ generators and file iteration, Unix pipes (`cat log | grep ERROR | wc -l`).\n- Event streams at\
    \ system scale (Kafka) apply the same idea across services.\n\n## Example\nCounting error lines in\
    \ a huge log with constant memory:\n```python\ndef error_count(path):\n    count = 0\n    with open(path)\
    \ as f:\n        for line in f:          # reads one line at a time\n            if \"ERROR\" in line:\n\
    \                count += 1\n    return count\n```\n```javascript\n// Node.js: compress a large file\
    \ without loading it into memory\nconst fs = require(\"fs\");\nconst zlib = require(\"zlib\");\nconst\
    \ { pipeline } = require(\"stream\");\npipeline(fs.createReadStream(\"big.log\"), zlib.createGzip(),\
    \ fs.createWriteStream(\"big.log.gz\"),\n  (err) => console.log(err ? \"failed\" : \"done\"));\n```\n\
    \n## Common mistakes\n- Calling `read()` on a huge file and loading it all into memory.\n- Ignoring\
    \ backpressure and letting buffers grow without bound.\n- Not handling errors on every stage of a\
    \ pipeline.\n- Assuming a chunk boundary aligns with a record boundary (a line can be split across\
    \ chunks).\n\n## In the interview\nExplain the memory and latency benefits and give one concrete example.\
    \ Interviewers look for backpressure, error handling, and chunk-boundary awareness. In system design,\
    \ connect streams to stream processing (Kafka, Flink) versus batch processing, and mention trade-offs:\
    \ harder ordering, exactly-once delivery, and state management.\n"
