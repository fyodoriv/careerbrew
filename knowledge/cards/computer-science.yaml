- id: kb-423c83049cf5
  question: What is the difference between an array's capacity and its length?
  answer: Length is the number of elements actually stored; capacity is how many the underlying memory
    block can hold before it must grow. Dynamic arrays grow capacity geometrically (often 1.5x or 2x)
    when full, which keeps appends O(1) amortized.
  topic: computer science
  tags:
  - data-structures
  - arrays
  - dynamic-array
  - amortized-analysis
  explanation: '## In plain words

    A dynamic array (Python list, Java `ArrayList`, C++ `vector`, Go slice) reserves more seats than it
    currently uses. Length counts the people sitting down. Capacity counts all the seats. When every seat
    is taken, it books a bigger room and moves everyone.


    ## How it works

    - **Length (size)**: the number of valid elements. Indexing past it is an error.

    - **Capacity**: the size of the allocated buffer, always at least the length.

    - **Append**: if length < capacity, write into the next slot in O(1). If full, allocate a new buffer
    (typically 1.5x or 2x larger), copy all elements, free the old one; that one append costs O(n).

    - **Amortized O(1)**: with doubling, the total copying for n appends is at most about 2n, so each
    append averages O(1).

    - **Shrinking**: many implementations shrink only when the array becomes much emptier, to avoid thrashing.

    - Many languages let you control capacity: C++ `reserve`, Java `new ArrayList<>(n)`, Go `make([]int,
    0, n)`.


    ## Example

    ```go

    // inside func main, with "fmt" imported

    s := make([]int, 0, 4)

    fmt.Println(len(s), cap(s)) // 0 4

    s = append(s, 1, 2, 3, 4, 5)

    fmt.Println(len(s), cap(s)) // 5 8 (exact growth is a runtime detail)

    ```

    Appending 1,000,000 items with doubling causes only about 20 reallocations.


    ## Common mistakes

    - Thinking every append is O(n), or that every append is truly O(1) (one is O(n); the average is O(1)).

    - Growing by a constant amount (say, +10), which makes n appends cost O(n^2).

    - Keeping pointers or references into the old buffer after a reallocation (dangling pointers in C++,
    stale shared slices in Go).

    - Confusing capacity with a maximum size; dynamic arrays grow past it.


    ## In the interview

    Use it to explain amortized analysis: show the doubling sum 1 + 2 + 4 + ... + n < 2n. Mention pre-sizing
    when you know the final count, the memory overhead of unused capacity, and why growth factors around
    1.5 can allow memory reuse.

    '
