- id: kb-f20de698d355
  question: What is quicksort, and how does it work?
  answer: Quicksort picks a pivot, partitions the array so smaller elements go left and larger go right,
    then sorts each side recursively. It averages O(n log n) time with O(log n) stack space, but degrades
    to O(n^2) with consistently bad pivots.
  topic: computer science
  tags:
  - algorithms
  - sorting
  - divide-and-conquer
  - quicksort
  explanation: "## In plain words\nPick one element, the pivot. Put everything smaller before it and everything\
    \ larger after it; now the pivot is in its final place. Repeat on the left part and the right part.\
    \ It is divide and conquer where the hard work happens before the recursion.\n\n## How it works\n\
    - Choose a pivot (random, the middle element, or median of three).\n- Partition: one pass that rearranges\
    \ elements around the pivot. Lomuto's scheme is simple; Hoare's does fewer swaps.\n- Recurse on the\
    \ two sides. Base case: zero or one element.\n- Time: O(n log n) on average; O(n^2) worst case when\
    \ pivots are always the smallest or largest (for example, a sorted array with \"first element\" as\
    \ pivot).\n- Space: in place, O(log n) average stack depth; the worst case is O(n) deep unless you\
    \ recurse into the smaller side and loop (instead of recursing) over the larger side, which guarantees\
    \ O(log n).\n- Not stable: equal elements can change order.\n\n## Example\n```python\ndef quicksort(a,\
    \ lo=0, hi=None):\n    if hi is None:\n        hi = len(a) - 1\n    if lo >= hi:\n        return a\n\
    \    pivot, i = a[hi], lo          # Lomuto partition\n    for j in range(lo, hi):\n        if a[j]\
    \ < pivot:\n            a[i], a[j] = a[j], a[i]\n            i += 1\n    a[i], a[hi] = a[hi], a[i]\n\
    \    quicksort(a, lo, i - 1)\n    quicksort(a, i + 1, hi)\n    return a\n\nprint(quicksort([5, 2,\
    \ 9, 1, 5, 6]))  # [1, 2, 5, 5, 6, 9]\n```\n\n## Common mistakes\n- Always picking the first or last\
    \ element as pivot on input that may be sorted.\n- Many duplicates: two-way partitioning becomes slow;\
    \ three-way partitioning (less, equal, greater) fixes it.\n- Off-by-one errors in the partition bounds.\n\
    - Calling it stable.\n\n## In the interview\nCompare with merge sort: quicksort is usually faster\
    \ in practice (in place, cache friendly) but has a bad worst case and is unstable; merge sort guarantees\
    \ O(n log n) and is stable but needs O(n) extra space. Mention that randomized pivots make the worst\
    \ case very unlikely, and that libraries use hybrids such as introsort, which falls back to heapsort.\n"
