- id: kb-f6072e196a4f
  question: What is decoupling in software design?
  answer: Decoupling means reducing how much components depend on each other's internals, so each can
    change, be tested, deployed, or scaled independently. It is achieved with clear interfaces, dependency
    injection, events and message queues, and well-defined API boundaries, at the cost of more indirection.
  topic: computer science
  tags:
  - design-principles
  - architecture
  - coupling
  explanation: "## In plain words\nTwo parts of a system are tightly coupled when changing one forces\
    \ you to change the other, like two gears welded together. Decoupling puts a clean connector between\
    \ them, such as a standard plug and socket, so you can swap one side without touching the other.\n\
    \n## How it works\n- **Coupling** is how much one module knows about or depends on another. **Cohesion**\
    \ is how focused a module is on one job. Aim for low coupling and high cohesion.\n- **Code-level techniques:**\n\
    \  - Depend on interfaces, not concrete classes (dependency inversion).\n  - Inject dependencies instead\
    \ of constructing them inside.\n  - Keep modules behind small, stable APIs and hide internals.\n-\
    \ **System-level techniques:**\n  - Message queues and events: producers do not need consumers to\
    \ be online or even known.\n  - Versioned APIs and contracts between services.\n  - Separate databases\
    \ per service, so schemas evolve independently.\n- **Kinds of decoupling:** in space (who talks to\
    \ whom), in time (asynchronous processing), and in deployment (independent releases).\n\n## Example\n\
    Tightly coupled: the order service calls the email service directly and fails if email is down.\n\n\
    Decoupled: the order service publishes an `OrderPlaced` event to a queue. The email, analytics, and\
    \ loyalty services each subscribe. Adding a new consumer requires no change to the order service,\
    \ and an email outage only delays emails.\n```python\nclass Notifier:                     # interface\n\
    \    def send(self, msg): ...\n\nclass OrderService:\n    def __init__(self, notifier):   # injected,\
    \ so tests can pass a fake\n        self.notifier = notifier\n    def place(self, order_id):\n   \
    \     self.notifier.send(f\"order {order_id} placed\")\n```\n\n## Common mistakes\n- Adding layers\
    \ and abstractions everywhere, making simple code hard to follow.\n- Splitting into microservices\
    \ that still share one database, which keeps them coupled.\n- Ignoring that asynchronous decoupling\
    \ brings eventual consistency and harder debugging.\n\n## In the interview\nDefine coupling and cohesion,\
    \ then give one code example and one architecture example. Interviewers look for trade-offs: decoupling\
    \ improves change safety, testing, and scaling but adds indirection, latency, and operational complexity.\
    \ Mention how you would decide where the boundaries go (parts that change for different reasons or\
    \ at different rates).\n"
