  question: What is functional programming?
  answer: Functional programming builds software from pure functions (same input, same output, no side
    effects), immutable data, and functions as values that can be passed, returned, and composed. It makes
    code easier to test, reason about, and run in parallel, while side effects are pushed to the edges
    of the program.
  topic: computer science
  tags:
  - functional-programming
  - paradigms
  - immutability
  explanation: "## In plain words\nIn functional programming, functions behave like mathematical functions:\
    \ give them the same inputs and you always get the same output, and they do not change anything else\
    \ in the world. Programs are built by combining small functions, like snapping Lego bricks together,\
    \ rather than by changing shared variables step by step.\n\n## How it works\n- **Pure functions:**\
    \ no hidden inputs (globals, clocks) and no side effects (mutation, I/O). Easy to test and cache.\n\
    - **Immutability:** data is not changed in place; you create new versions. This removes whole classes\
    \ of bugs, especially with concurrency.\n- **First-class and higher-order functions:** functions can\
    \ be stored, passed, and returned; `map`, `filter`, and `reduce` take functions as arguments.\n- **Composition:**\
    \ build complex behaviour by chaining small functions.\n- **Declarative style:** describe what to\
    \ compute rather than how to loop.\n- **Recursion** often replaces loops; some languages optimise\
    \ tail calls.\n- Languages: Haskell, Clojure, Elixir, F#, plus functional features in JavaScript,\
    \ Python, Java streams, Kotlin, Rust, and Scala.\n\n## Example\nImperative vs functional total of\
    \ squares of even numbers:\n```python\nnums = [1, 2, 3, 4, 5, 6]\n\n# Imperative: mutate an accumulator\n\
    total = 0\nfor n in nums:\n    if n % 2 == 0:\n        total += n * n\n\n# Functional: compose pure\
    \ operations\nfrom functools import reduce\ntotal_fp = reduce(lambda acc, x: acc + x, map(lambda n:\
    \ n * n, filter(lambda n: n % 2 == 0, nums)), 0)\n\nprint(total, total_fp)  # 56 56\n```\nIn idiomatic\
    \ Python, `sum(n * n for n in nums if n % 2 == 0)` expresses the same idea more readably.\n\n## Common\
    \ mistakes\n- Claiming FP means no side effects at all; real programs need I/O, which FP isolates\
    \ at the edges.\n- Copying large structures repeatedly without persistent data structures, hurting\
    \ performance.\n- Writing unreadable chains of lambdas in a language where a loop is clearer.\n- Confusing\
    \ \"uses map and filter\" with functional design.\n\n## In the interview\nDefine the core ideas (purity,\
    \ immutability, higher-order functions) and give a benefit for each. Interviewers often ask about\
    \ trade-offs: easier testing and concurrency vs performance overhead and a learning curve. Mention\
    \ practical uses: React's pure components and reducers, data pipelines, and the \"functional core,\
    \ imperative shell\" architecture.\n"
