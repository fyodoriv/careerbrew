    \            stack.append(node)\n            node = node.left\n        node = stack.pop()\n      \
    \  out.append(node.val)\n        node = node.right\n    return out\n```\nFor a BST with root 4, children\
    \ 2 and 6, and leaves 1, 3, 5, 7 the result is `[1, 2, 3, 4, 5, 6, 7]`.\n\n## Common mistakes\n- Mixing\
    \ up in-order with preorder (node first) or postorder (node last).\n- In the iterative version, forgetting\
    \ to move to `node.right` after popping.\n- Stating `O(log n)` space for any tree; it is the height.\n\
    - Collecting all values when the problem only needs the k-th, which can stop early.\n\n## In the interview\n\
