  question: What counts as extra space in Big O space complexity?
  answer: 'Auxiliary (extra) space is memory the algorithm allocates beyond its input: new arrays, hash
    maps, recursion stack frames, and queues. The input itself and, by common convention, the required
    output are usually not counted. A few scalar variables are O(1); a structure that grows with n is
    O(n).'
  topic: computer science
  tags:
  - big-o
  - space-complexity
  - complexity
  explanation: "## In plain words\nSpace complexity asks how much extra memory your algorithm needs as\
    \ the input grows. If you only keep a few counters, it is constant. If you build something whose size\
    \ depends on the input, such as a copy of the array or a set of seen values, it grows with n.\n\n\
    ## How it works\n- **Counts as extra space:**\n  - New data structures sized by the input (copies,\
    \ hash sets, DP tables, output buffers you build for intermediate work).\n  - Recursion depth: each\
    \ active call keeps a stack frame, so recursion of depth d costs `O(d)` space.\n  - Queues and stacks\
    \ in BFS or DFS.\n- **Usually not counted:** the input, and the output when the problem requires returning\
    \ it (state your convention).\n- **Constant space `O(1)`:** a fixed number of variables, regardless\
    \ of n.\n- **In-place:** modifies the input directly, using `O(1)` extra space (sometimes `O(log n)`\
    \ for recursion is still called in-place, as in quicksort).\n- Watch hidden costs: slicing `a[1:]`\
    \ in Python copies; string concatenation creates new strings; sorting may allocate.\n\n## Example\n\
    ```python\ndef has_duplicate_set(nums):      # O(n) extra space: the set grows with n\n    seen =\
    \ set()\n    for x in nums:\n        if x in seen:\n            return True\n        seen.add(x)\n\
    \    return False\n\ndef has_duplicate_sort(nums):     # O(1) extra if sorted in place (input is modified)\n\
    \    nums.sort()                    # Python's sort itself may use up to O(n) temporary space\n  \
    \  return any(nums[i] == nums[i + 1] for i in range(len(nums) - 1))\n\ndef total(nums):          \
    \        # O(n) stack: recursion depth n\n    return 0 if not nums else nums[0] + total(nums[1:])\
    \  # slicing also copies\n```\n\n## Common mistakes\n- Forgetting recursion stack space.\n- Counting\
    \ the input as extra space, or forgetting to say whether the output counts.\n- Calling slicing or\
    \ string building \"free\".\n- Claiming `O(1)` space for a solution that modifies the input without\
    \ mentioning it.\n\n## In the interview\nState time and space separately, and say what you are counting\
    \ (\"auxiliary space, excluding the output\"). Interviewers often ask, \"can you do it in constant\
    \ space?\" so know common moves: two pointers, in-place swaps, reusing the input as a marker array.\
    \ Mention the trade-off between memory and time, such as a hash set buying `O(n)` time for `O(n)`\
    \ space.\n"
