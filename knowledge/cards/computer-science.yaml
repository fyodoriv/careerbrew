- id: kb-f7d3431c2ad0
  question: What is a network port on a server?
  answer: A port is a 16-bit number (0 to 65535) that, together with an IP address and protocol, identifies
    which process on a machine should receive network traffic. The IP address picks the machine and the
    port picks the service, such as 443 for HTTPS or 22 for SSH.
  topic: computer science
  tags:
  - networking
  - tcp
  - ports
  - servers
  explanation: '## In plain words

    An IP address is like a building''s street address; a port is the apartment number. Many programs
    on one server can use the network at once, and the port tells the operating system which program a
    packet is meant for.


    ## How it works

    - Ports are 16-bit numbers, 0 to 65535, and exist separately for TCP and UDP.

    - **Well-known ports** (0 to 1023): 22 SSH, 53 DNS, 80 HTTP, 443 HTTPS. Binding below 1024 usually
    needs elevated privileges on Unix.

    - **Registered** (1024 to 49151, such as 5432 for PostgreSQL) and **ephemeral** (typically 49152 to
    65535, varies by OS): the OS assigns a temporary ephemeral port to the client side of each outgoing
    connection.

    - A server process **binds** and **listens** on a port. A TCP connection is identified by the 4-tuple:
    source IP, source port, destination IP, destination port. That is how one server port can handle thousands
    of clients at once.

    - Firewalls and cloud security groups allow or block traffic by port.


    ## Example

    ```python

    import socket


    srv = socket.socket()

    srv.bind(("127.0.0.1", 0))      # 0 asks the OS for any free port

    print(srv.getsockname()[1])     # e.g. 54213

    srv.close()

    ```

    When your browser opens `https://example.com`, it connects from an ephemeral port such as 51834 on
    your machine to port 443 on the server.


    ## Common mistakes

    - Thinking a port is a physical thing; it is just a number the OS uses for routing.

    - Believing a server port is "used up" by one client; connections are distinguished by the full 4-tuple.

    - Binding to `127.0.0.1` and wondering why other machines cannot connect; bind to `0.0.0.0` to listen
    on all interfaces.


    ## In the interview

    Explain IP plus port, give common port numbers, and describe the 4-tuple. Expect follow-ups on "address
    already in use" errors (often a socket in TIME_WAIT), ephemeral port exhaustion under many outgoing
    connections, and how load balancers and NAT rewrite ports.

    '
