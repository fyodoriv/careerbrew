    \ in rows)\n\nclass JsonExporter:\n    def export(self, rows):\n        import json\n        return\
    \ json.dumps(rows)\n\nEXPORTERS = {\"csv\": CsvExporter, \"json\": JsonExporter}\n\ndef make_exporter(kind):\n\
    \    try:\n        return EXPORTERS[kind]()\n    except KeyError:\n        raise ValueError(f\"unknown\
    \ format: {kind}\")\n\nprint(make_exporter(\"csv\").export([[1, 2], [3, 4]]))\n```\n\n## Common mistakes\n\
    - Using a factory where a plain constructor would do; it adds indirection with no benefit.\n- Letting\
    \ the factory grow into a giant `if/else` instead of a registry.\n- Returning objects that do not\
    \ share an interface, so callers still need type checks.\n- Confusing a simple factory with the Factory\
    \ Method and Abstract Factory patterns.\n\n## In the interview\nSay what problem it solves: decoupling\
    \ callers from concrete classes when the type is chosen at runtime. Give a real use case such as parsers\
