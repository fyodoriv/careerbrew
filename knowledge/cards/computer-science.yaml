  question: What is breadth-first search (BFS) on a graph or tree?
  answer: 'BFS explores a graph level by level: it visits the start node, then all its neighbours, then
    their neighbours, using a queue. In an unweighted graph it finds the shortest path in edges, in O(V
    + E) time and O(V) space.'
  topic: computer science
  tags:
  - algorithms
  - graphs
  - bfs
  - trees
  explanation: "## In plain words\nBFS is like ripples spreading from a stone dropped in water: first\
    \ everything one step away, then everything two steps away, and so on. Because it reaches nodes in\
    \ order of distance, the first time it touches a node is along a shortest path (counting edges).\n\
    \n## How it works\n- Put the start node in a queue and mark it as visited.\n- While the queue is not\
    \ empty: take the node at the front, process it, and add every unvisited neighbour to the back of\
    \ the queue, marking each as visited when it is added.\n- A FIFO queue is what makes the order level\
    \ by level.\n- On a tree you do not need a visited set (there are no cycles); on a general graph you\
    \ do, or you loop forever.\n- Time is O(V + E): each vertex enters the queue once and each edge is\
    \ checked once (twice if undirected). Space is O(V) for the queue and visited set; on a tree it is\
    \ O(width).\n\n## Example\nLevel-order traversal of a tree:\n```\n        1\n       / \\\n      2\
    \   3\n     / \\   \\\n    4   5   6\n```\nBFS visits 1, then 2, 3, then 4, 5, 6. On a grid maze,\
    \ BFS from the entrance gives the minimum number of moves to every cell.\n\n## Common mistakes\n-\
    \ Marking nodes visited when they are popped instead of when they are pushed, which can enqueue the\
    \ same node many times.\n- Using a list's `pop(0)` in Python, which is O(n); use `collections.deque`.\n\
    - Using BFS for shortest paths on weighted graphs; that needs Dijkstra.\n- Forgetting disconnected\
    \ components when the task is to visit every node.\n\n## In the interview\nPick BFS when the question\
    \ says \"shortest\", \"minimum steps\", or \"level\". Mention multi-source BFS (start with several\
    \ nodes in the queue, as in \"rotting oranges\") and bidirectional BFS for large search spaces. Compare\
    \ with DFS: BFS uses more memory on wide graphs but guarantees shortest paths in unweighted graphs.\n"
