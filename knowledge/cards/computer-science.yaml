  question: What are the common file size units and how do they relate to each other?
  answer: 'In SI (decimal) units, each step is 1000x: 1 kB = 1000 bytes, then MB, GB, TB, PB. In binary
    units, each step is 1024x: 1 KiB = 1024 bytes, then MiB, GiB, TiB, PiB. A byte is 8 bits.'
  topic: computer science
  tags:
  - units
  - storage
  - estimation
  explanation: '## In plain words

    Data sizes climb in steps, like metres to kilometres. The confusing part is that two systems exist:
    the decimal one (powers of 1000) that disk makers and network speeds use, and the binary one (powers
    of 1024) that memory and many operating systems use.


    ## How it works

    - 1 byte (B) = 8 bits (b). Network speeds are usually in bits per second, so 100 Mb/s is about 12.5
    MB/s.

    - Decimal (SI): kilo 10^3, mega 10^6, giga 10^9, tera 10^12, peta 10^15.

    - Binary (IEC): kibi 2^10 = 1024, mebi 2^20, gibi 2^30, tebi 2^40, pebi 2^50.

    - The gap grows with size: 1 GiB is about 7% larger than 1 GB, 1 TiB about 10% larger than 1 TB.

    - For back-of-envelope estimates, treat 1 KB ~ 10^3, 1 MB ~ 10^6, 1 GB ~ 10^9 and so on; the error
    does not matter at that precision.


    ## Example

    Estimating storage for 100 million users with a 2 KB profile each:


    - 100 x 10^6 x 2 x 10^3 bytes = 2 x 10^11 bytes = 200 GB.

    - With 3x replication: 600 GB, which fits on a single modern disk, but you would still shard for throughput.


    A "1 TB" drive holds 10^12 bytes, which an OS reporting in binary units shows as about 931 GiB.


    ## Common mistakes

    - Mixing up bits and bytes, especially with bandwidth.

    - Insisting on 1024 during an estimate; it slows you down and adds nothing.

    - Forgetting replication, indexes, and metadata when sizing storage.

    - Writing "kb" when you mean kilobytes.


    ## In the interview

    In system design interviews, state your units out loud and round aggressively to powers of ten. Interviewers
    check that you can move between per-item size, item count, and total storage or bandwidth per second
    without losing a factor of 1000. Know a few anchors: a day has about 86,400 seconds (round to 10^5),
    and 1 million requests a day is roughly 12 per second.

    '
