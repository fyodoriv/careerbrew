- id: kb-404b89678996
  question: What are the pros and cons of arrays?
  answer: Arrays store elements in contiguous memory, which gives O(1) access by index, low overhead,
    and excellent cache locality. The downsides are O(n) insertion and deletion in the middle (elements
    must shift) and, for fixed-size arrays, a capacity chosen up front; dynamic arrays fix that with amortised
    O(1) appends.
  topic: computer science
  tags:
  - arrays
  - data-structures
  - complexity
  explanation: '## In plain words

    An array is a row of numbered boxes placed side by side in memory. Because the boxes are equal size
    and contiguous, the computer can jump straight to box number i. But inserting a new box in the middle
    means sliding every later box along by one.


    ## How it works

    **Pros**

    - Access by index in `O(1)`: address = start + i x element size.

    - Cache-friendly: neighbouring elements are loaded together, so scans are very fast in practice.

    - Compact: no per-element pointers, unlike linked lists.

    - Binary search works on sorted arrays in `O(log n)`.


    **Cons**

    - Insert or delete at the front or middle is `O(n)` because of shifting.

    - Fixed-size arrays need the size up front; dynamic arrays (Python list, Java ArrayList, C++ vector)
    double their capacity when full, giving amortised `O(1)` append but occasional `O(n)` copies and some
    wasted space.

    - Searching an unsorted array is `O(n)`.

    - Large contiguous blocks can be hard to allocate.


    ## Example

    | Operation | Array | Linked list |

    |---|---|---|

    | Access i-th | `O(1)` | `O(n)` |

    | Append at end | `O(1)` amortised | `O(1)` with tail pointer |

    | Insert at front | `O(n)` | `O(1)` |

    | Search (unsorted) | `O(n)` | `O(n)` |


    ```python

    a = [10, 20, 30]

    a.append(40)      # amortised O(1)

    a.insert(0, 5)    # O(n): every element shifts

    print(a[2])       # 20, O(1)

    ```


    ## Common mistakes

    - Calling insertion at the front `O(1)`.

    - Ignoring amortisation when discussing dynamic array appends.

    - Assuming linked lists are faster in practice for most workloads; arrays often win thanks to the
    cache.

    - Forgetting the cost of resizing when memory is tight.


    ## In the interview

    Give a balanced answer and compare with linked lists and hash maps. Interviewers like the cache-locality
    point and the amortised doubling argument (total copy cost is at most 2n). Mention when you would
    pick something else: frequent middle insertions (linked list or balanced tree) or lookup by key (hash
    map).

    '
