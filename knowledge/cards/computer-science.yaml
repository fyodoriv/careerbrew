  question: When should you use recursion, and when an explicit stack or queue?
  answer: Use recursion when the problem is naturally self-similar, such as trees, divide and conquer,
    or backtracking, and the depth is safely bounded. Use an explicit stack or queue when depth could
    be large, when you need BFS order, or when you want control over pausing, memory, and performance.
  topic: computer science
  tags:
  - recursion
  - stack
  - queue
  - algorithms
  explanation: "## In plain words\nRecursion lets the language's call stack remember where you were. That\
    \ is elegant for nested structures. But the call stack is small and hidden. An explicit stack or queue\
    \ is the same bookkeeping done by hand: more code, but you control its size and order.\n\n## How it\
    \ works\n**Prefer recursion when**\n- The structure is recursive: tree traversals, nested JSON, divide\
    \ and conquer (merge sort), backtracking (permutations, N-queens).\n- Depth is small and bounded,\
    \ such as O(log n) for balanced trees.\n- Clarity matters more than the last bit of speed.\n\n**Prefer\
    \ an explicit stack or queue when**\n- Depth may be large: a skewed tree or a long linked chain. Python's\
    \ default recursion limit is about 1,000 frames; other languages have fixed stack sizes too.\n- You\
    \ need BFS: recursion is inherently LIFO, so level order needs a queue.\n- You want to pause, resume,\
    \ or limit memory, or run on a system with small thread stacks.\n- Function-call overhead matters\
    \ in a hot loop.\n\nAny recursion can be converted: push the state you would pass as arguments, pop\
    \ it to continue.\n\n## Example\n```python\ndef sum_tree_recursive(node):\n    if node is None:\n\
    \        return 0\n    return node[\"val\"] + sum_tree_recursive(node.get(\"left\")) + sum_tree_recursive(node.get(\"\
    right\"))\n\ndef sum_tree_iterative(root):\n    total, stack = 0, [root]\n    while stack:\n     \
    \   node = stack.pop()\n        if node:\n            total += node[\"val\"]\n            stack.append(node.get(\"\
    left\"))\n            stack.append(node.get(\"right\"))\n    return total\n\nt = {\"val\": 1, \"left\"\
    : {\"val\": 2}, \"right\": {\"val\": 3}}\nprint(sum_tree_recursive(t), sum_tree_iterative(t))  # 6\
    \ 6\n```\nBoth are O(n) time; recursion uses O(h) call-stack space, the iterative version O(h) heap\
    \ space for the stack list in this depth-first order.\n\n## Common mistakes\n- Recursion without a\
    \ correct base case.\n- Converting to an explicit stack but pushing children in the wrong order, which\
    \ changes traversal order.\n- Assuming the language optimizes tail recursion when it does not.\n\n\
    ## In the interview\nWrite the recursive solution first if it is clearer, then say \"for deep inputs\
    \ I would switch to an explicit stack\" and show how. Mention stack overflow limits and that BFS needs\
    \ a queue.\n"
