- id: kb-681cdbbf2011
  question: What is consistent hashing?
  answer: Consistent hashing places both servers and keys on a hash ring and assigns each key to the next
    server clockwise. When a server joins or leaves, only about 1/n of the keys move, instead of almost
    all of them as with hash(key) mod n; virtual nodes even out the load.
  topic: computer science
  tags:
  - system-design
  - distributed-systems
  - hashing
  - sharding
  explanation: "## In plain words\nWith `hash(key) % n`, adding one server changes n, so almost every\
    \ key maps to a different server, which would empty every cache at once. Consistent hashing arranges\
    \ servers around a circle so that adding or removing one only affects its neighbours' keys.\n\n##\
    \ How it works\n- Map the hash space (for example 0 to 2^32 - 1) onto a ring.\n- Hash each server's\
    \ id to a point on the ring.\n- To place a key, hash it and walk clockwise to the first server point;\
    \ that server owns the key.\n- **Add a server**: it takes only the keys between its predecessor and\
    \ itself.\n- **Remove a server**: its keys go to the next server clockwise.\n- On average only about\
    \ K / n keys move (K keys, n servers).\n- **Virtual nodes**: give each server many points (say 100\
    \ to 200) so load evens out and a failed server's keys spread across many servers, not one. Stronger\
    \ machines can get more virtual nodes.\n- **Lookup**: keep the points sorted and binary search, O(log(n\
    \ * v)).\n- **Replication**: store a key on the next r distinct servers clockwise.\n\n## Example\n\
    ```python\nimport bisect, hashlib\n\ndef h(s):\n    return int(hashlib.md5(s.encode()).hexdigest(),\
    \ 16)\n\nclass Ring:\n    def __init__(self, nodes, vnodes=100):\n        self.points = sorted((h(f\"\
    {n}#{i}\"), n) for n in nodes for i in range(vnodes))\n        self.keys = [p for p, _ in self.points]\n\
    \n    def owner(self, key):\n        i = bisect.bisect(self.keys, h(key)) % len(self.points)\n   \
    \     return self.points[i][1]\n\nring = Ring([\"cache-a\", \"cache-b\", \"cache-c\"])\nprint(ring.owner(\"\
    user:42\"))  # one of the three nodes\n```\nGoing from 3 to 4 servers moves about a quarter of the\
    \ keys, versus about three quarters with modulo hashing.\n\n## Common mistakes\n- Forgetting virtual\
    \ nodes, leading to very uneven load.\n- Wrapping around the ring incorrectly at the end.\n- Saying\
    \ no keys move; about 1/n still do.\n\n## In the interview\nMention real users: Dynamo-style stores\
    \ such as Cassandra, distributed caches, and load balancers. Discuss hot keys (consistent hashing\
    \ does not fix a single very popular key), and alternatives such as rendezvous hashing or a directory\
    \ service that maps ranges to servers.\n"
