  explanation: "## In plain words\nA graph is a set of nodes and the connections (edges) between them,\
    \ like cities and roads. To store it, you either give each city a list of roads leaving it (adjacency\
    \ list) or draw a big table with every city on both axes and tick the pairs that are connected (adjacency\
    \ matrix).\n\n## How it works\n- **Adjacency list:** `dict[node] -> list of neighbours` (or `(neighbour,\
    \ weight)` pairs). Space `O(V + E)`. Iterating neighbours is fast; checking a specific edge is `O(degree)`\
    \ unless you use sets.\n- **Adjacency matrix:** `matrix[i][j] = 1` (or a weight). Space `O(V^2)`.\
    \ Edge check is `O(1)`; listing neighbours is `O(V)`.\n- **Edge list:** a plain list of `(u, v, w)`\
    \ tuples, handy for Kruskal's algorithm or input parsing.\n- For undirected graphs add each edge in\
    \ both directions. For directed graphs add it once.\n- Most interview problems give an edge list;\
