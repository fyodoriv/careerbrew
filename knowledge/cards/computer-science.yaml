  question: What is bubble sort, and how do you implement it?
  answer: Bubble sort repeatedly walks the array, swapping adjacent elements that are out of order, so
    the largest remaining element bubbles to the end each pass. It is O(n^2) time in the average and worst
    case, O(n) on already sorted input with an early-exit flag, uses O(1) space, and is stable. It is
    mainly a teaching example.
  topic: computer science
  tags:
  - sorting
  - algorithms
  - bubble-sort
  explanation: "## In plain words\nBubble sort works like bubbles rising in water: on each pass, bigger\
    \ values drift toward the end by swapping with smaller neighbours. After the first pass the largest\
    \ value is in its final place, after the second pass the second largest, and so on.\n\n## How it works\n\
    - Repeat passes over the array:\n  - Compare each pair `a[j]` and `a[j+1]`; swap if `a[j] > a[j+1]`.\n\
    \  - After pass i, the last i elements are in final position, so the next pass can stop earlier.\n\
    - Track whether any swap happened; if a whole pass makes no swaps, the array is sorted and you can\
    \ stop.\n- Complexity: worst and average `O(n^2)` comparisons and swaps; best `O(n)` with the early\
    \ exit; space `O(1)`.\n- Stable: equal elements are never swapped, so their relative order is kept.\n\
    - In practice, insertion sort is a better simple sort, and libraries use `O(n log n)` algorithms such\
    \ as Timsort or introsort.\n\n## Example\n```python\ndef bubble_sort(a):\n    n = len(a)\n    for\
    \ i in range(n - 1):\n        swapped = False\n        for j in range(n - 1 - i):\n            if\
    \ a[j] > a[j + 1]:\n                a[j], a[j + 1] = a[j + 1], a[j]\n                swapped = True\n\
    \        if not swapped:\n            break\n    return a\n\nprint(bubble_sort([5, 1, 4, 2, 8])) \
    \ # [1, 2, 4, 5, 8]\n```\nFirst pass on `[5, 1, 4, 2, 8]`: `[1, 5, 4, 2, 8]` -> `[1, 4, 5, 2, 8]`\
    \ -> `[1, 4, 2, 5, 8]` -> no swap for (5, 8).\n\n## Common mistakes\n- Running the inner loop to `n\
    \ - 1` every pass instead of shrinking it.\n- Using `>=` in the comparison, which swaps equal items\
    \ and breaks stability.\n- Forgetting the early exit, so best case stays `O(n^2)`.\n- Suggesting bubble\
    \ sort for real workloads.\n\n## In the interview\nCode it quickly and state complexity, stability,\
    \ and the early-exit best case. Interviewers mostly use it to check fundamentals, then ask how you\
    \ would sort for real: merge sort, quicksort, or the language's built-in sort, and which is stable.\
    \ Comparing it with insertion sort (also `O(n^2)` but faster on nearly sorted data) is a good bonus.\n"
