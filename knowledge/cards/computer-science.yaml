- id: kb-8c49eeb17f74
  question: What is a queue, and what are its pros and cons?
  answer: 'A queue is a first-in, first-out (FIFO) collection: you add at the back (enqueue) and remove
    from the front (dequeue), both in O(1). It models waiting lines and drives breadth-first search, task
    scheduling, and buffering between producers and consumers.'
  topic: computer science
  tags:
  - data-structures
  - queue
  - fifo
  - bfs
  explanation: "## In plain words\nA queue is a line at a ticket counter: whoever arrived first is served\
    \ first. New people join at the back; service happens at the front. No cutting in line.\n\n## How\
    \ it works\n- **Enqueue** (add to back) and **dequeue** (remove from front): O(1).\n- **Peek** at\
    \ the front: O(1). **Search**: O(n).\n- **Implementations**:\n  - Linked list with head and tail pointers.\n\
    \  - Ring buffer (circular array) with head and tail indexes.\n  - Python's `collections.deque`. A\
    \ plain Python list is a bad queue because `pop(0)` is O(n).\n  - Two stacks: push onto an \"in\"\
    \ stack, pop from an \"out\" stack, refilling it when empty; amortized O(1).\n- **Variants**: deque\
    \ (both ends), priority queue (by priority, not arrival), blocking queue (for threads), and distributed\
    \ message queues.\n\n## Example\nBFS visits nodes level by level thanks to FIFO order:\n```python\n\
    from collections import deque\n\ndef bfs_order(graph, start):\n    seen, q, order = {start}, deque([start]),\
    \ []\n    while q:\n        u = q.popleft()\n        order.append(u)\n        for v in graph[u]:\n\
    \            if v not in seen:\n                seen.add(v)\n                q.append(v)\n    return\
    \ order\n\ng = {1: [2, 3], 2: [4], 3: [4], 4: []}\nprint(bfs_order(g, 1))  # [1, 2, 3, 4]\n```\n\n\
    **Pros:** fair processing order, O(1) operations, natural for scheduling, buffering, and level-order\
    \ traversal.\n**Cons:** no fast access to the middle, fixed-size array queues can fill up, and unbounded\
    \ queues can grow until memory runs out if consumers are slow.\n\n## Common mistakes\n- Using a list\
    \ with `pop(0)`, making BFS O(n^2).\n- Marking nodes visited when dequeued instead of when enqueued,\
    \ which adds duplicates.\n- Ignoring back-pressure in producer-consumer designs.\n\n## In the interview\n\
    Say when to use it: BFS and shortest paths in unweighted graphs, task schedulers, rate limiting buffers,\
    \ and message queues between services. Compare with a stack (LIFO, used for DFS and undo) and a priority\
    \ queue (by importance). Mention bounding the queue and what to do when it is full.\n"
