  question: What is the Singleton pattern?
  answer: 'A singleton ensures a class has exactly one instance and gives global access to it, for things
    like a configuration object, a connection pool, or a logger. It is easy to misuse: it is global state,
    it hides dependencies, and it makes testing and concurrency harder.'
  topic: computer science
  tags:
  - design-patterns
  - creational
  - singleton
  - global-state
  explanation: "## In plain words\nSome things should exist only once in a program, like the single settings\
    \ panel for the whole app. A singleton makes the class itself guard that rule: every request for an\
    \ instance returns the same one.\n\n## How it works\n- Make the constructor private or guarded.\n\
    - Keep a static field holding the one instance.\n- Provide `get_instance()` that creates it on first\
    \ call (lazy) or at load time (eager) and then returns it.\n- In multi-threaded code, guard creation\
    \ (a lock, double-checked locking, or eager initialisation) so two threads do not create two instances.\n\
    - Simpler alternatives: in Python and JavaScript, a module-level object is already created once and\
    \ shared by every importer; dependency injection can supply one shared instance without making the\
    \ class enforce it.\n- Downsides: hidden global state, tight coupling, hard-to-reset state between\
    \ tests.\n\n## Example\n```python\nclass Config:\n    _instance = None\n\n    def __new__(cls):\n\
    \        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n           \
    \ cls._instance.values = {}\n        return cls._instance\n\na, b = Config(), Config()\na.values[\"\
    mode\"] = \"debug\"\nprint(b.values[\"mode\"], a is b)  # debug True\n```\nThis version is not thread-safe;\
    \ add a lock if threads may create it at the same time.\n\n## Common mistakes\n- Using a singleton\
    \ as a convenient global variable for everything.\n- Ignoring thread safety in lazy initialisation.\n\
    - Making tests depend on each other through shared state.\n- Assuming one instance per machine; it\
    \ is one per process (or per class loader).\n\n## In the interview\nDefine it, give a reasonable use\
    \ (a logger, a pool), then criticise it: interviewers want to hear about testability and coupling.\
    \ Offer dependency injection with one shared instance as the usual better design. Expect a follow-up\
    \ on thread-safe implementation.\n"
