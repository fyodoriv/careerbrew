  question: What are prefix and suffix products, and how are they used?
  answer: A prefix product array stores, at each index, the product of all elements before it; a suffix
    product array stores the product of all elements after it. Multiplying the two gives the product of
    every element except the current one in O(n) time without division, the classic 'product of array
    except self' problem.
  topic: computer science
  tags:
  - arrays
  - prefix-sums
  - problem-solving
  explanation: "## In plain words\nA prefix product is a running product from the left; a suffix product\
    \ is a running product from the right. If you know \"everything to my left multiplied together\" and\
    \ \"everything to my right multiplied together\", their product is \"everything except me\", which\
    \ is useful when division is not allowed or a zero would break it.\n\n## How it works\n- `prefix[i]`\
    \ = product of `nums[0..i-1]`, with `prefix[0] = 1`.\n- `suffix[i]` = product of `nums[i+1..n-1]`,\
    \ with `suffix[n-1] = 1`.\n- `answer[i] = prefix[i] * suffix[i]`.\n- Space optimisation: store prefix\
    \ products in the output array, then sweep from the right with a single running variable for the suffix.\
    \ That uses `O(1)` extra space beyond the output.\n- The same idea works for sums (prefix sums give\
    \ range sums in `O(1)`), maximums, and other associative operations.\n- Time `O(n)`.\n\n## Example\n\
    ```python\ndef product_except_self(nums):\n    n = len(nums)\n    out = [1] * n\n    for i in range(1,\
    \ n):\n        out[i] = out[i - 1] * nums[i - 1]\n    right = 1\n    for i in range(n - 1, -1, -1):\n\
    \        out[i] *= right\n        right *= nums[i]\n    return out\n\nprint(product_except_self([1,\
    \ 2, 3, 4]))  # [24, 12, 8, 6]\n```\nFor `[1, 2, 3, 4]`: prefixes are `[1, 1, 2, 6]`, suffixes are\
    \ `[24, 12, 4, 1]`.\n\n## Common mistakes\n- Dividing the total product by each element, which fails\
    \ with zeros and is often forbidden.\n- Off-by-one errors: including the current element in its own\
    \ prefix.\n- Using two extra arrays when the follow-up asks for constant space.\n- Ignoring overflow\
    \ in fixed-width integer languages.\n\n## In the interview\nStart by explaining why division is a\
    \ bad idea (zeros), then build the two-pass solution. Interviewers want correct boundaries and the\
    \ space optimisation. Link it to the broader prefix-sum family (range sum queries, subarray sum equals\
    \ k with a hash map) to show pattern recognition.\n"
