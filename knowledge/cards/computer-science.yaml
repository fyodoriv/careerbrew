- id: kb-24f395b8f36a
  question: What is persistent storage?
  answer: Persistent storage keeps data after a process ends or the power goes off, unlike RAM. Examples
    are SSDs, hard disks, network block volumes, and object storage; it is slower than memory, so systems
    combine it with caches and use techniques such as write-ahead logs and fsync to make writes durable.
  topic: computer science
  tags:
  - storage
  - durability
  - databases
  - infrastructure
  explanation: "## In plain words\nPersistent storage is the filing cabinet that survives the night. Whatever\
    \ is in RAM disappears when a program crashes or the machine reboots; whatever reached persistent\
    \ storage is still there afterwards.\n\n## How it works\n- **Media**: SSDs (flash, fast random access),\
    \ hard disk drives (spinning, cheap, slow seeks), and tape for archives.\n- **How it is exposed**:\n\
    \  - Block storage: a raw disk or a cloud volume, formatted with a file system.\n  - File storage:\
    \ shared network file systems.\n  - Object storage: files stored as objects by key over an HTTP API\
    \ (Amazon S3 style), cheap and very durable but higher latency.\n- **Durability**: a `write` usually\
    \ lands in the OS page cache first. Only after `fsync` (or similar) is it guaranteed on disk. Databases\
    \ append to a write-ahead log and fsync it before confirming a commit.\n- **Protection**: replication\
    \ across disks or machines, RAID, snapshots, and off-site backups.\n- **Containers**: a container's\
    \ own file system is temporary; data that must survive restarts goes on a mounted volume, such as\
    \ a Kubernetes persistent volume.\n\n## Example\nA Redis server keeps data in RAM for speed. With\
    \ persistence off, a restart loses everything. With append-only file mode it logs every write to disk\
    \ and, with an fsync every second, a crash loses at most about one second of writes. That is the classic\
    \ trade-off between speed and durability.\n\n## Common mistakes\n- Assuming a successful `write` call\
    \ means the data is safe on disk.\n- Storing important data inside a container's writable layer.\n\
    - Treating replication as a backup; it also copies deletions and corruption.\n- Forgetting that local\
    \ instance disks in the cloud may be wiped when the instance stops.\n\n## In the interview\nIn design\
    \ discussions, say where each kind of data lives: hot data in memory, records in a database on durable\
    \ volumes, large files in object storage, with backups and a recovery plan. Expect follow-ups on durability\
    \ guarantees, fsync costs, replication factor, and recovery point and recovery time objectives (how\
    \ much data you may lose and how fast you must restore).\n"
