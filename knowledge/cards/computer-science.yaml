- id: kb-cc83dfd33714
  question: What is SQL?
  answer: SQL (Structured Query Language) is the standard declarative language for defining, querying,
    and changing data in relational databases. You describe what data you want, and the database's query
    planner decides how to fetch it.
  topic: computer science
  tags:
  - databases
  - sql
  - relational
  - queries
  explanation: '## In plain words

    SQL is how you talk to a relational database, where data lives in tables of rows and columns. Instead
    of writing loops, you state the result you want ("customers in Paris, newest first"), and the database
    figures out an efficient way to produce it.


    ## How it works

    - **Data definition (DDL)**: `CREATE TABLE`, `ALTER TABLE`, `CREATE INDEX`.

    - **Data manipulation (DML)**: `SELECT`, `INSERT`, `UPDATE`, `DELETE`.

    - **Transactions**: `BEGIN`, `COMMIT`, `ROLLBACK`, giving ACID guarantees (atomic, consistent, isolated,
    durable).

    - A `SELECT` is evaluated logically in this order: `FROM` and `JOIN`, `WHERE`, `GROUP BY`, `HAVING`,
    `SELECT`, `ORDER BY`, `LIMIT`.

    - Joins combine tables on matching keys: inner, left, right, and full outer.

    - The query planner uses indexes and statistics to pick an execution plan; `EXPLAIN` shows it.


    ## Example

    ```sql

    SELECT c.name, COUNT(o.id) AS orders

    FROM customers c

    LEFT JOIN orders o ON o.customer_id = c.id

    WHERE c.city = ''Paris''

    GROUP BY c.id, c.name

    HAVING COUNT(o.id) > 2

    ORDER BY orders DESC;

    ```

    This lists Paris customers with more than two orders, busiest first. Grouping by `c.id` keeps two
    customers who share a name apart.


    ## Common mistakes

    - Using `WHERE` to filter on an aggregate; that belongs in `HAVING`.

    - Building queries by string concatenation, which allows SQL injection; use parameterized queries.

    - Comparing with `= NULL` instead of `IS NULL`.

    - Selecting `*` and fetching columns you do not need.


    ## In the interview

    Expect to write a join with grouping, explain the difference between `WHERE` and `HAVING`, and discuss
    indexes (they speed reads, slow writes, and help only when the query can use them). Be ready to compare
    SQL databases with NoSQL stores: SQL gives joins, a schema, and strong transactions; NoSQL often trades
    those for flexible schemas and easier horizontal scaling.

    '
