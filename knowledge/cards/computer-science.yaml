- id: kb-570c072e1688
  question: What is the Command design pattern?
  answer: The Command pattern turns a request into an object that holds everything needed to perform it,
    usually with an execute method and often an undo method. That lets you queue, log, retry, schedule,
    or undo operations.
  topic: computer science
  tags:
  - design-patterns
  - behavioral
  - oop
  - undo
  explanation: "## In plain words\nThe Command pattern is a behavioral design pattern that wraps an action\
    \ in an object. Think of a restaurant order slip: the waiter writes it down, the slip can wait in\
    \ a queue, be handed to any cook, or be cancelled. The slip is the command; it separates who asks\
    \ from who does the work.\n\n## How it works\n- **Command**: an interface with `execute()` and, when\
    \ needed, `undo()`.\n- **Concrete command**: stores the target and the arguments, and implements `execute`\
    \ and `undo`.\n- **Receiver**: the object that actually does the work (a document, a bank account).\n\
    - **Invoker**: triggers commands without knowing what they do (a button, a job queue, a history manager).\n\
    - **Client**: creates commands and hands them to the invoker.\n- Because a command is a plain object,\
    \ you can push it onto a history stack for undo/redo, put it on a queue for background workers, serialize\
    \ it to a log for auditing or replay, or batch several into a macro.\n\n## Example\n```python\nclass\
    \ Deposit:\n    def __init__(self, account, amount):\n        self.account, self.amount = account,\
    \ amount\n    def execute(self):\n        self.account[\"balance\"] += self.amount\n    def undo(self):\n\
    \        self.account[\"balance\"] -= self.amount\n\nclass History:\n    def __init__(self):\n   \
    \     self.done = []\n    def run(self, cmd):\n        cmd.execute()\n        self.done.append(cmd)\n\
    \    def undo(self):\n        if self.done:\n            self.done.pop().undo()\n\nacct = {\"balance\"\
    : 0}\nh = History()\nh.run(Deposit(acct, 50))\nh.run(Deposit(acct, 20))\nh.undo()\nprint(acct[\"balance\"\
    ])  # 50\n```\n\n## Common mistakes\n- Putting business logic in the invoker instead of the command\
    \ or receiver.\n- Writing an `undo` that cannot truly reverse the effect (for example, after sending\
    \ an email); such commands need a compensating action or must be marked irreversible.\n- Using it\
    \ where a plain function or callback would do; in languages with first-class functions a closure is\
    \ often enough unless you need undo or serialization.\n\n## In the interview\nName the roles, then\
    \ give the classic uses: undo/redo in editors, task queues, and transactional logs. Expect follow-ups\
    \ on how redo works (a second stack), how to make commands idempotent for retries, and how it relates\
    \ to event sourcing. Trade-off: more classes and indirection in exchange for decoupling and history.\n"
