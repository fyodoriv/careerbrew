  question: What is a directed acyclic graph (DAG)?
  answer: 'A DAG is a directed graph with no cycles: following edges you can never return to where you
    started. DAGs model dependencies and ordering, such as build systems, task schedulers, course prerequisites,
    and version history. Every DAG has at least one topological order, and many problems such as longest
    path become easy on them.'
  topic: computer science
  tags:
  - graphs
  - dag
  - topological-sort
  explanation: '## In plain words

    A DAG is a set of one-way arrows that never loop back. Think of a recipe: chop vegetables before cooking,
    cook before serving. Steps can branch and join, but you can never end up needing to do a step before
    itself.


    ## How it works

    - **Directed:** every edge has a direction, `u -> v`.

    - **Acyclic:** there is no path that starts and ends at the same node.

    - **Topological order:** a linear order where every edge goes forward. It exists if and only if the
    graph is a DAG. Find it with Kahn''s algorithm or DFS finish order in `O(V + E)`.

    - **Cycle detection:** Kahn''s algorithm leaves some nodes unprocessed, or DFS finds a back edge (an
    edge to a node still on the current path).

    - **DAG-specific algorithms:** shortest and longest paths in `O(V + E)` by relaxing edges in topological
    order (longest path is hard on general graphs); counting paths with dynamic programming.

    - **Examples in practice:** build tools and package managers, workflow engines (such as Airflow),
    spreadsheet recalculation, Git commit history, compiler data-flow graphs.


    ## Example

    Course prerequisites: `intro -> data structures -> algorithms`, and `intro -> discrete maths -> algorithms`.

    - This is a DAG; one valid order is intro, data structures, discrete maths, algorithms.

    - If someone adds `algorithms -> intro`, a cycle appears and no valid order exists.

    ```python

    from graphlib import TopologicalSorter


    ts = TopologicalSorter({"ds": {"intro"}, "maths": {"intro"}, "algo": {"ds", "maths"}})

    print(list(ts.static_order()))  # e.g. [''intro'', ''ds'', ''maths'', ''algo'']

    ```


    ## Common mistakes

    - Confusing a DAG with a tree; DAG nodes can have multiple parents.

    - Assuming the topological order is unique.

    - Using undirected cycle detection logic on a directed graph.

    - Forgetting that the "acyclic" property must be checked, not assumed, for user-provided data.


    ## In the interview

    Define it, give two real examples, and connect it to topological sort and cycle detection. Interviewers
    like candidates who mention DP on DAGs (longest path, number of paths) and real systems that rely
    on them. Expect a coding follow-up such as course schedule or alien dictionary.

    '
