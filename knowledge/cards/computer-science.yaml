- id: kb-9d1e04bcdb3f
  question: What is the difference between authentication and authorization?
  answer: Authentication proves who a user or service is, for example with a password, a passkey, or a
    signed token. Authorization decides what that proven identity is allowed to do, and it always runs
    after authentication.
  topic: computer science
  tags:
  - security
  - authentication
  - authorization
  - access-control
  explanation: "## In plain words\nAuthentication (often shortened to \"authn\") answers \"who are you?\"\
    . Authorization (\"authz\") answers \"what may you do?\". Think of a hotel: showing your ID at the\
    \ front desk is authentication; the key card that opens only your room and the gym is authorization.\n\
    \n## How it works\n- **Authentication**: the client presents credentials (password, one-time code,\
    \ passkey, client certificate). The server checks them and issues proof of identity, such as a session\
    \ cookie or a signed token.\n- **Authorization**: on every request, the server looks at that identity\
    \ and checks a policy before acting. Common models:\n  - Role-based access control (RBAC): permissions\
    \ attach to roles like \"admin\" or \"viewer\".\n  - Attribute-based access control (ABAC): rules\
    \ use attributes such as owner, department, or time of day.\n  - Access control lists (ACLs): each\
    \ resource lists who may do what.\n- Standards split the same way: OpenID Connect handles authentication;\
    \ OAuth 2.0 handles delegated authorization (granting an app limited access).\n- HTTP status codes\
    \ reflect the split: 401 Unauthorized really means \"not authenticated\"; 403 Forbidden means \"authenticated,\
    \ but not allowed\".\n\n## Example\n```python\ndef delete_post(request, post):\n    user = request.user\
    \            # set by authentication middleware\n    if user is None:\n        return 401        \
    \         # who are you?\n    if post.author_id != user.id and \"admin\" not in user.roles:\n    \
    \    return 403                 # you may not do this\n    post.delete()\n    return 204\n```\n\n\
    ## Common mistakes\n- Using the two words as synonyms.\n- Checking permissions only in the user interface\
    \ (hiding a button) and not on the server.\n- Authorizing once at login and never again, so revoked\
    \ rights still work until the session ends.\n- Saying \"OAuth is a login protocol\"; plain OAuth is\
    \ about authorization, and login is usually built on top with OpenID Connect.\n\n## In the interview\n\
    Give the one-line definitions, then the order: authenticate first, authorize on every request. Mention\
    \ 401 versus 403 and RBAC versus ABAC. Expect follow-ups on sessions versus tokens (JWT), multi-factor\
    \ authentication, and the principle of least privilege. A good trade-off to raise: centralizing authorization\
    \ in a policy service keeps rules consistent but adds a network hop to each request.\n"
