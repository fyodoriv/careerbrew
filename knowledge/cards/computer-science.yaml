  question: What is the degree of a graph node, and what are indegree and outdegree?
  answer: In an undirected graph, a node's degree is the number of edges touching it. In a directed graph,
    indegree counts edges coming in and outdegree counts edges going out. The degrees always sum to twice
    the number of edges.
  topic: computer science
  tags:
  - graphs
  - algorithms
  - degree
  - topological-sort
  explanation: "## In plain words\nDegree measures how connected a node is. In a friendship graph, your\
    \ degree is how many friends you have. On a follower network the edges have direction: your indegree\
    \ is how many people follow you, and your outdegree is how many you follow.\n\n## How it works\n-\
    \ **Undirected**: `degree(v)` = number of edges at v (a self-loop counts twice).\n- **Directed**:\
    \ `indegree(v)` = edges ending at v; `outdegree(v)` = edges starting at v.\n- **Handshake lemma**:\
    \ in an undirected graph, the sum of all degrees is `2 * E`, so the number of odd-degree nodes is\
    \ even. In a directed graph, total indegree equals total outdegree equals `E`.\n- Computing all degrees\
    \ from an edge list or adjacency list takes O(V + E).\n- **Sources** have indegree 0 and **sinks**\
    \ have outdegree 0.\n\n## Example\n```python\nfrom collections import defaultdict\n\nedges = [(\"\
    a\", \"b\"), (\"a\", \"c\"), (\"b\", \"c\"), (\"c\", \"d\")]\nindeg, outdeg = defaultdict(int), defaultdict(int)\n\
    for u, v in edges:\n    outdeg[u] += 1\n    indeg[v] += 1\nprint(indeg[\"c\"], outdeg[\"c\"])  # 2\
    \ 1\nprint(indeg[\"a\"])               # 0, so \"a\" is a source\n```\n\n## Common mistakes\n- Counting\
    \ an undirected edge once in the total; each edge adds 1 to both endpoints.\n- Forgetting nodes with\
    \ no edges, which have degree 0 but never appear in the edge list.\n- Mixing up which end of a directed\
    \ edge gets the indegree.\n\n## In the interview\nIndegree is central to Kahn's algorithm for topological\
    \ sort: start with all indegree-0 nodes, remove them, and lower their neighbours' indegrees. Degrees\
    \ also show up in \"find the town judge\" (indegree n - 1, outdegree 0), Euler path checks (zero or\
    \ two odd-degree nodes in an undirected graph), and in spotting hubs in social graphs. State the O(V\
    \ + E) cost to compute them.\n"
