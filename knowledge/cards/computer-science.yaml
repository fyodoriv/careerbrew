  question: How do you implement DFS in code?
  answer: Write DFS recursively (visit a node, mark it, recurse into unvisited neighbours) or iteratively
    with an explicit stack. Both run in O(V + E) time and O(V) space; the iterative form avoids recursion-depth
    limits.
  topic: computer science
  tags:
  - dfs
  - graphs
  - implementation
  - stack
  explanation: "## In plain words\nDFS needs a way to remember where to come back to. Recursion gives\
    \ you that for free through the call stack; an explicit stack does the same job by hand. Either way,\
    \ a visited set stops you from going round in circles.\n\n## How it works\n- Recursive: `visit(node)`\
    \ marks `node`, processes it, then calls `visit` on each unvisited neighbour.\n- Iterative: push the\
    \ start onto a stack. While the stack is non-empty, pop a node; if already seen, skip it; otherwise\
    \ mark it, process it, and push its neighbours (in reverse order if you want the same order as recursion).\n\
    - Common uses build on this skeleton: counting connected components (start a DFS from every unvisited\
    \ node), flood fill on grids, and cycle detection.\n- Time `O(V + E)`; space `O(V)`.\n\n## Example\n\
    Counting islands in a grid of `\"1\"` (land) and `\"0\"` (water):\n```python\ndef count_islands(grid):\n\
    \    rows, cols = len(grid), len(grid[0])\n    seen = set()\n    def sink(r, c):\n        stack =\
    \ [(r, c)]\n        while stack:\n            r, c = stack.pop()\n            if (r, c) in seen or\
    \ not (0 <= r < rows and 0 <= c < cols) or grid[r][c] != \"1\":\n                continue\n      \
