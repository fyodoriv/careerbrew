  question: What is modular arithmetic?
  answer: Modular arithmetic works with remainders after division by a fixed number m, so values wrap
    around like a clock. Addition, subtraction, and multiplication can be reduced mod m at every step,
    which keeps numbers small; it underlies hashing, cyclic indexing, and 'answer modulo 10^9 + 7' problems.
  topic: computer science
  tags:
  - math
  - modular-arithmetic
  - number-theory
  - algorithms
  explanation: "## In plain words\nOn a 12-hour clock, 3 hours after 11 is 2, not 14. That is arithmetic\
    \ modulo 12: you keep only the remainder after dividing by 12. Numbers wrap around after reaching\
    \ the modulus.\n\n## How it works\n- `a mod m` is the remainder r with `0 <= r < m` and `a = q*m +\
    \ r`.\n- `a` and `b` are **congruent mod m** (`a ≡ b (mod m)`) when they have the same remainder.\n\
    - Safe to reduce at each step:\n  - `(a + b) mod m = ((a mod m) + (b mod m)) mod m`\n  - `(a * b)\
    \ mod m = ((a mod m) * (b mod m)) mod m`\n  - Subtraction works too, but add m to avoid negative results\
    \ in languages where `%` can return negatives.\n- **Division** is not direct: multiply by the modular\
    \ inverse, which exists when `gcd(b, m) = 1`. If m is prime, the inverse is `b^(m-2) mod m` (Fermat's\
    \ little theorem).\n- **Fast power**: `pow(base, exp, m)` uses repeated squaring in O(log exp).\n\n\
    ## Example\n```python\nMOD = 10**9 + 7\n\ndef count_paths(n):            # 2^n mod MOD, step by step\n\
    \    r = 1\n    for _ in range(n):\n        r = (r * 2) % MOD\n    return r\n\nprint(count_paths(100)\
    \ == pow(2, 100, MOD))  # True\nprint(-7 % 3)                                # 2 in Python; C and\
    \ Java give -1\ni, size = 5, 4\nprint((i + 1) % size)                        # 2, wrap-around index\n\
    ```\n\n## Common mistakes\n- Reducing only at the end, after the number has overflowed a 64-bit integer.\n\
    - Dividing directly instead of using the modular inverse.\n- Negative remainders in C, C++, Java,\
    \ and JavaScript: use `((a % m) + m) % m`.\n- Multiplying two values near 10^9 in 32-bit types, which\
    \ overflows before the `%`.\n\n## In the interview\nIt shows up in counting problems with large answers,\
    \ circular arrays and ring buffers, hash functions, \"is n divisible by k\" tricks, and cryptography\
    \ (RSA relies on modular exponentiation). Explain why 10^9 + 7 is common: it is prime (so inverses\
    \ exist) and products of two reduced values fit in 64 bits.\n"
