  question: What is merge sort, and how do you implement it?
  answer: Merge sort splits the array in half, sorts each half recursively, and merges the two sorted
    halves in linear time. It runs in O(n log n) in every case, is stable, and needs O(n) extra space;
    it is the standard choice for linked lists and external sorting.
  topic: computer science
  tags:
  - algorithms
  - sorting
  - merge-sort
  - divide-and-conquer
  explanation: "## In plain words\nSorting is hard, but merging two already sorted piles is easy: keep\
    \ taking the smaller top card. Merge sort keeps splitting until each pile has one card (already sorted),\
    \ then merges piles back together, two at a time.\n\n## How it works\n- **Divide**: split the array\
    \ at the middle.\n- **Conquer**: recursively merge sort each half. Base case: zero or one element.\n\
    - **Merge**: walk both halves with two indexes, always copying the smaller current element; when one\
    \ half runs out, copy the rest of the other.\n- **Recurrence**: T(n) = 2T(n/2) + O(n), so O(n log\
    \ n): there are about log2(n) levels and each level does O(n) merging.\n- **Space**: O(n) for the\
    \ merge buffer, plus O(log n) recursion stack.\n- **Stable** if, on ties, you take from the left half\
    \ first.\n\n## Example\n```python\ndef merge_sort(a):\n    if len(a) <= 1:\n        return a\n   \
    \ mid = len(a) // 2\n    left, right = merge_sort(a[:mid]), merge_sort(a[mid:])\n    out, i, j = [],\
    \ 0, 0\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:      # <= keeps\
    \ it stable\n            out.append(left[i]); i += 1\n        else:\n            out.append(right[j]);\
    \ j += 1\n    out.extend(left[i:])\n    out.extend(right[j:])\n    return out\n\nprint(merge_sort([38,\
    \ 27, 43, 3, 9, 82, 10]))  # [3, 9, 10, 27, 38, 43, 82]\n```\nSlicing copies data, which is fine for\
    \ clarity; an index-based version with one shared buffer is faster.\n\n## Common mistakes\n- Forgetting\
    \ to copy the leftovers after one half is exhausted.\n- Using `<` instead of `<=` on ties, which breaks\
    \ stability.\n- Claiming it sorts in place; standard array merge sort needs O(n) extra memory.\n\n\
    ## In the interview\nCompare with quicksort: merge sort has a guaranteed O(n log n) and is stable,\
    \ but uses extra memory; quicksort is in place and usually faster on arrays. Merge sort suits linked\
    \ lists (merging needs no extra array) and data too big for memory (external sort: sort chunks, then\
    \ k-way merge). Its merge step also solves \"count inversions\" and \"merge k sorted lists\".\n"
