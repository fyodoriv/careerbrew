  question: How do you do an in-order depth-first traversal of a binary tree?
  answer: In-order traversal visits the left subtree, then the node, then the right subtree. Recursively
    it is three lines; iteratively you push left children onto a stack, pop to visit, then move to the
    right child. On a binary search tree it yields values in sorted order, in O(n) time and O(h) space.
  topic: computer science
  tags:
  - algorithms
  - trees
  - dfs
  - traversal
  explanation: "## In plain words\nIn-order means \"left, me, right\". Picture the tree squashed flat\
    \ onto a line from left to right: in-order reads the nodes in that left-to-right order. On a binary\
    \ search tree, where smaller values live on the left, that order is sorted.\n\n## How it works\n-\
    \ Recursive: `inorder(node.left)`, visit `node`, `inorder(node.right)`; stop at `None`.\n- Iterative\
    \ with a stack:\n  - Start with `cur = root`.\n  - While `cur` exists, push it and go to `cur.left`.\n\
    \  - Pop a node, visit it, then set `cur = node.right` and repeat.\n- Time O(n): every node is pushed\
    \ and popped once. Space O(h), where h is the height: O(log n) for a balanced tree, O(n) for a skewed\
    \ one.\n- Morris traversal achieves O(1) extra space by temporarily threading right pointers, at the\
    \ cost of complexity.\n\n## Example\n```python\ndef inorder(root):\n    out, stack, cur = [], [],\
    \ root\n    while cur or stack:\n        while cur:\n            stack.append(cur)\n            cur\
    \ = cur.left\n        cur = stack.pop()\n        out.append(cur.val)\n        cur = cur.right\n  \
    \  return out\n```\nFor a BST with root 4, left 2 (children 1, 3) and right 6, the result is `[1,\
    \ 2, 3, 4, 6]`.\n\n## Common mistakes\n- Visiting the node before the left subtree (that is pre-order).\n\
    - Forgetting to move to the right child after popping, which loops or skips nodes.\n- Claiming O(1)\
    \ space for the recursive version; the call stack is O(h).\n- Assuming sorted output for any binary\
    \ tree, not just a BST.\n\n## In the interview\nWrite the recursive version first, then offer the\
    \ iterative one, which interviewers often ask for. Mention typical uses: validating a BST (values\
    \ must increase), finding the k-th smallest element, and a BST iterator. Be ready to compare with\
    \ pre-order (copying a tree) and post-order (deleting or computing heights).\n"
