  question: How do you increment or decrement a number so it wraps around like a wheel?
  answer: 'Use modular arithmetic: next = (i + 1) % n and previous = (i - 1 + n) % n, so the index cycles
    through 0 to n-1. Adding n before the modulo keeps the result non-negative in languages where % can
    return negative values.'
  topic: computer science
  tags:
  - modular-arithmetic
  - arrays
  - circular-buffer
  explanation: '## In plain words

    Think of a clock face numbered 0 to 11: after 11 comes 0 again, not 12. Wrapping a counter means that
    when you go past the last position you land back on the first, and going backwards from the first
    lands on the last. The modulo operator (`%`, the remainder after division) does this for you.


    ## How it works

    - For positions `0..n-1`, step forward with `(i + 1) % n`.

    - Step backward with `(i - 1 + n) % n`. In Python `(i - 1) % n` already gives a non-negative result,
    but in C, C++, Java, and JavaScript `-1 % 5` is `-1`, so add `n` first.

    - For a jump of `k` steps in either direction: `((i + k) % n + n) % n` is safe in every language.

    - If the range does not start at zero, shift it: for `lo..hi`, compute `lo + ((x - lo) % size)` with
    `size = hi - lo + 1`.


    ## Example

    ```python

    days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]

    n = len(days)

    i = 6                      # Sun

    print(days[(i + 1) % n])   # Mon

    i = 0                      # Mon

    print(days[(i - 1 + n) % n])  # Sun

    print(days[(3 + 10) % n])  # Thu + 10 days -> Sun

    ```

    Each operation is `O(1)` time and space.


    ## Common mistakes

    - Forgetting that `%` can be negative in many languages.

    - Using `if` chains to reset the counter, which breaks for steps larger than one.

    - Mixing 1-based and 0-based positions (a 12-hour clock shows 1-12, not 0-11).


    ## In the interview

    This shows up in circular buffers, round-robin scheduling, rotating arrays, the "house robber in a
    circle" problem, and Caesar ciphers. Mention the negative-modulo pitfall unprompted; it signals experience
    across languages. If asked about performance, note that when n is a power of two, `i & (n - 1)` replaces
    the modulo cheaply.

    '
