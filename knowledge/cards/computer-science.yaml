- id: kb-5cffec51a61c
  question: What is a commutative operation?
  answer: 'An operation is commutative when swapping its operands does not change the result: a op b =
    b op a. Addition and multiplication of numbers are commutative; subtraction, division, string concatenation,
    and matrix multiplication are not.'
  topic: computer science
  tags:
  - math
  - algebra
  - distributed-systems
  - properties
  explanation: '## In plain words

    Commutative means "order of the two inputs does not matter". 3 + 5 and 5 + 3 are both 8. But 5 - 3
    is not 3 - 5. Knowing whether an operation is commutative tells you whether you may reorder work freely.


    ## How it works

    - **Commutative**: `a * b = b * a`. Examples: integer addition and multiplication, max, min, set union
    and intersection, bitwise AND, OR, and XOR.

    - **Not commutative**: subtraction, division, string concatenation (`"ab" + "c"` differs from `"c"
    + "ab"`), matrix multiplication, function composition.

    - **Associative** is a different property: grouping does not matter, `(a * b) * c = a * (b * c)`.
    Concatenation is associative but not commutative.

    - An operation that is both commutative and associative can combine items in any order and grouping,
    which is what parallel reduce needs.


    ## Example

    Summing a list across 4 machines: each sums its own chunk, then the partial sums are added in whatever
    order they arrive. That works because addition is commutative and associative. Floating-point addition
    is only approximately associative, so the result can differ in the last few digits depending on order.


    A coding trick: because XOR is commutative and associative and `x ^ x = 0`, XOR-ing all numbers in
    a list where every value appears twice except one leaves that single value.

    ```python

    from functools import reduce

    print(reduce(lambda a, b: a ^ b, [4, 1, 2, 1, 2]))  # 4

    ```


    ## Common mistakes

    - Mixing up commutative and associative.

    - Assuming floating-point sums are order independent.

    - Assuming string or list concatenation can be reordered.


    ## In the interview

    It comes up in distributed systems: commutative updates (increment a counter, add to a set) can be
    applied in any order on replicas and still converge, which is the idea behind CRDTs (conflict-free
    replicated data types). It also comes up in MapReduce combiners and parallel reductions, and in bit-manipulation
    puzzles. Mention that "last write wins" on a single value is not commutative, which is why it needs
    timestamps.

    '
