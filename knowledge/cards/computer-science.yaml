  question: How do you detect a cycle in a linked list using Floyd's tortoise and hare (fast and slow
    pointers)?
  answer: Move a slow pointer one node at a time and a fast pointer two nodes at a time. If the list has
    a cycle, the fast pointer eventually meets the slow one; if it reaches the end, there is no cycle.
    O(n) time and O(1) space.
  topic: computer science
  tags:
  - linked-list
  - two-pointers
  - floyd
  - cycle-detection
  explanation: "## In plain words\nOn a straight road, a fast runner simply finishes first. On a circular\
    \ track, the fast runner will lap the slow one and they meet. Floyd's algorithm uses that to tell\
    \ whether a linked list loops back on itself, without remembering any visited nodes.\n\n## How it\
    \ works\n- Start `slow` and `fast` at the head.\n- Each step: `slow = slow.next`, `fast = fast.next.next`.\n\
    - If `fast` or `fast.next` becomes empty, the list ends: no cycle.\n- If `slow is fast`, there is\
    \ a cycle.\n- Why they must meet: once both are in the cycle, the gap between them shrinks by one\
    \ node each step, so it reaches zero within one lap.\n- Time `O(n)`, space `O(1)`. The alternative,\
    \ a set of seen nodes, is also `O(n)` time but uses `O(n)` memory.\n\n## Example\n```python\nclass\
    \ Node:\n    def __init__(self, val):\n        self.val, self.next = val, None\n\ndef has_cycle(head):\n\
    \    slow = fast = head\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n\
    \        if slow is fast:\n            return True\n    return False\n\na, b, c = Node(1), Node(2),\
    \ Node(3)\na.next, b.next, c.next = b, c, b   # 3 points back to 2\nprint(has_cycle(a))  # True\n\
    ```\n\n## Common mistakes\n- Checking `fast.next.next` without first checking `fast.next`.\n- Comparing\
    \ values instead of node identity; values can repeat.\n- Checking for a meeting before moving the\
    \ pointers, so they \"meet\" at the head immediately.\n\n## In the interview\nStart with the hash-set\
    \ approach, then improve to Floyd's for constant space, and explain the closing-gap argument. Be ready\
    \ for the follow-ups: find where the cycle starts (reset one pointer to the head and move both one\
    \ step at a time) and find the cycle length. The same pattern applies to \"happy number\" and \"find\
    \ the duplicate number\" problems.\n"
