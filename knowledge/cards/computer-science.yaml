  question: What is a node's in-degree in a graph?
  answer: In a directed graph, a node's in-degree is the number of edges pointing into it, and its out-degree
    is the number pointing out. In-degree 0 means no prerequisites, which is why Kahn's topological sort
    starts from those nodes.
  topic: computer science
  tags:
  - graphs
  - in-degree
  - topological-sort
  - fundamentals
  explanation: "## In plain words\nThink of a social app: your in-degree is how many people follow you,\
    \ your out-degree is how many you follow. In a task graph, in-degree counts how many things must finish\
    \ before this task can start.\n\n## How it works\n- For each directed edge `u -> v`, `outdeg[u] +=\
    \ 1` and `indeg[v] += 1`.\n- Computing all in-degrees takes O(V + E).\n- In an undirected graph there\
    \ is just \"degree\": the number of edges touching the node; the sum of all degrees is 2E.\n- Uses:\n\
    \  - **Topological sort**: start with in-degree 0 nodes, remove them, and decrement neighbours.\n\
    \  - **Find the source or sink**: in-degree 0 is a source; out-degree 0 is a sink.\n  - **\"Find the\
    \ town judge\"**: the judge has in-degree n - 1 and out-degree 0.\n  - **Eulerian paths**: a directed\
    \ graph has one only if in- and out-degrees balance (with at most one start and one end exception)\
    \ and the graph is connected.\n\n## Example\nEdges: a -> b, a -> c, b -> c.\n- in-degree: a = 0, b\
    \ = 1, c = 2.\n- out-degree: a = 2, b = 1, c = 0.\n```python\nfrom collections import Counter\nedges\
    \ = [(\"a\", \"b\"), (\"a\", \"c\"), (\"b\", \"c\")]\nindeg = Counter(v for _, v in edges)\nprint(indeg[\"\
    a\"], indeg[\"b\"], indeg[\"c\"])  # 0 1 2\n```\nSo a is the only possible first task, and c must\
    \ come last.\n\n## Common mistakes\n- Counting the wrong end of the edge (prerequisite vs dependent).\n\
    - Forgetting nodes that have no incoming edges, so they never appear in the counter.\n- Applying in-degree\
    \ reasoning to an undirected graph.\n- Forgetting to decrement in-degrees during Kahn's algorithm.\n\
    \n## In the interview\nDefine it in one sentence and connect it to an algorithm, usually topological\
    \ sort or cycle detection: if no node has in-degree 0 at some point, the remaining graph has a cycle.\
    \ Expect quick puzzles like the town judge, or questions on building in-degree counts from an edge\
    \ list.\n"
