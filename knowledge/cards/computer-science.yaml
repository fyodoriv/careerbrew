- id: kb-520b21168a65
  question: What is a set data structure, and what are its pros and cons?
  answer: A set stores unique values and answers 'is x present?' quickly. Hash sets give O(1) average
    add, remove, and lookup but no order; tree sets keep elements sorted with O(log n) operations.
  topic: computer science
  tags:
  - data-structures
  - set
  - hashing
  explanation: "## In plain words\nA set is a bag that never holds duplicates and is built for one question:\
    \ \"is this item in here?\" A guest list at a party is a set: a name is either on it or not, and writing\
    \ it twice changes nothing.\n\n## How it works\n- **Hash set**: usually a hash map with keys only.\
    \ Add, remove, and contains are O(1) on average, O(n) worst case with many collisions.\n- **Tree set**:\
    \ a balanced binary search tree. Operations are O(log n), and it supports sorted iteration, min, max,\
    \ and \"next larger\" queries.\n- **Set algebra**: union, intersection, and difference. For hash sets,\
    \ intersection costs about O(min(|A|, |B|)).\n- Elements must be hashable (hash set) or comparable\
    \ (tree set), and should not change after insertion.\n- Variants: a bitset for small integer ranges,\
    \ and a Bloom filter for approximate membership with tiny memory.\n\n## Example\n```python\ndef has_duplicate(nums):\n\
    \    seen = set()\n    for x in nums:\n        if x in seen:\n            return True\n        seen.add(x)\n\
    \    return False\n\nprint(has_duplicate([3, 1, 4, 1]))  # True\nprint({1, 2, 3} & {2, 3, 4})    \
    \      # {2, 3}\n```\nThis runs in O(n) time instead of O(n^2) for comparing every pair.\n\n**Pros:**\
    \ fast membership tests, automatic deduplication, clean set operations.\n**Cons:** no index access,\
    \ no duplicates or counts (use a map or counter), hash sets have no order and use more memory than\
    \ a plain array.\n\n## Common mistakes\n- Checking membership in a list inside a loop, giving O(n^2)\
    \ where a set gives O(n).\n- Expecting a hash set to iterate in sorted or insertion order.\n- Putting\
    \ mutable objects in a set and then changing them.\n\n## In the interview\nReach for a set for \"\
    seen before?\", deduplication, and graph visited markers. Say which kind you mean and why, and mention\
    \ the memory cost. For very large data where some false positives are acceptable, mention a Bloom\
    \ filter.\n"
