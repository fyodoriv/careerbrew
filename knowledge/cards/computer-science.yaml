  question: How do you solve topological sort problems?
  answer: 'Topological sort orders the nodes of a directed acyclic graph so every edge goes from earlier
    to later. Use Kahn''s algorithm: compute in-degrees, queue nodes with in-degree zero, pop and append
    them, and decrement neighbours'' in-degrees. If not every node is output, the graph has a cycle. O(V
    + E).'
  topic: computer science
  tags:
  - graphs
  - topological-sort
  - dag
  - problem-solving
  explanation: "## In plain words\nTopological sort answers \"in what order can I do these tasks, given\
    \ that some must come before others?\" Think of getting dressed: socks before shoes, shirt before\
    \ jacket. Any order that respects every \"before\" rule is valid, and if the rules contain a loop,\
    \ no order exists.\n\n## How it works\n- Model each task as a node and each rule \"a before b\" as\
    \ an edge `a -> b`.\n- **Kahn's algorithm (BFS):**\n  - Count in-degrees (incoming edges) for every\
    \ node.\n  - Put all nodes with in-degree 0 in a queue.\n  - Pop a node, add it to the order, and\
    \ decrement the in-degree of its neighbours; enqueue any that reach 0.\n  - If the order has fewer\
    \ nodes than the graph, there is a cycle.\n- **DFS alternative:** run DFS and add each node to a list\
    \ after visiting all its descendants; reverse the list at the end. Use three colours to detect cycles.\n\
    - Time `O(V + E)`, space `O(V + E)`.\n- Typical problems: course schedule, build order, alien dictionary\
    \ (derive edges from adjacent words), parallel job scheduling (count levels).\n\n## Example\n```python\n\
    from collections import deque\n\ndef topo_order(n, edges):\n    g, indeg = [[] for _ in range(n)],\
    \ [0] * n\n    for a, b in edges:\n        g[a].append(b)\n        indeg[b] += 1\n    q = deque(i\
    \ for i in range(n) if indeg[i] == 0)\n    order = []\n    while q:\n        u = q.popleft()\n   \
    \     order.append(u)\n        for v in g[u]:\n            indeg[v] -= 1\n            if indeg[v]\
    \ == 0:\n                q.append(v)\n    return order if len(order) == n else []\n\nprint(topo_order(4,\
    \ [(0, 1), (0, 2), (1, 3), (2, 3)]))  # [0, 1, 2, 3]\n```\n\n## Common mistakes\n- Reversing edge\
    \ direction by accident (prerequisite pairs are often given as `[course, prereq]`).\n- Forgetting\
    \ cycle detection.\n- Forgetting nodes with no edges at all.\n- Claiming the order is unique; usually\
    \ many valid orders exist.\n\n## In the interview\nClarify the edge direction from the input format\
    \ first. State that it only works on DAGs and how you detect a cycle. Interviewers score the modelling\
    \ and the in-degree bookkeeping. Follow-ups: return any valid order, the lexicographically smallest\
    \ order (use a min-heap instead of a queue), or the minimum number of semesters.\n"
