  question: How do you find the node where a cycle begins in a linked list?
  answer: 'Use Floyd''s algorithm: move a slow pointer one step and a fast pointer two steps until they
    meet inside the cycle. Then reset one pointer to the head and move both one step at a time; they meet
    at the start of the cycle. O(n) time, O(1) space.'
  topic: computer science
  tags:
  - linked-list
  - two-pointers
  - floyd
  explanation: "## In plain words\nImagine two runners on a track shaped like the number 6: a straight\
    \ path leading into a loop. The fast runner laps the slow one somewhere in the loop. A neat bit of\
    \ arithmetic then shows that the distance from the start of the path to the loop entrance equals the\
    \ distance from the meeting point to the entrance (going forward, modulo the loop length).\n\n## How\
    \ it works\n- Phase 1: `slow` moves 1 step, `fast` moves 2. If `fast` reaches the end, there is no\
    \ cycle. If they meet, there is one.\n- Why phase 2 works: let `a` be the distance from head to cycle\
    \ start, `b` from cycle start to meeting point, `c` the cycle length. Slow walked `a + b`; fast walked\
    \ twice that, so `a + b` is a multiple of `c`. Hence walking `a` more steps from the meeting point\
    \ lands exactly on the cycle start.\n- Phase 2: put one pointer at the head, keep the other at the\
    \ meeting point, move both one step at a time; where they meet is the cycle start.\n- Time `O(n)`,\
    \ space `O(1)`.\n\n## Example\n```python\ndef cycle_start(head):\n    slow = fast = head\n    while\
    \ fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n        if slow is fast:\n\
    \            p = head\n            while p is not slow:\n                p, slow = p.next, slow.next\n\
    \            return p\n    return None\n```\nA simpler alternative stores visited nodes in a set and\
    \ returns the first repeat, at `O(n)` extra space.\n\n## Common mistakes\n- Comparing node values\
    \ instead of node identity.\n- Not checking `fast.next` before taking two steps.\n- Starting phase\
    \ 2 from the wrong place or moving the pointers at different speeds.\n- Not being able to explain\
    \ why the second phase works.\n\n## In the interview\nOffer the hash-set version first as the obvious\
    \ approach, then improve to Floyd's for constant space. Sketch the `a + b` argument briefly; interviewers\
    \ value the proof more than memorised code. Related follow-ups: cycle length (keep one pointer fixed\
    \ and count until the other returns) and the \"find the duplicate number\" array problem, which uses\
    \ the same trick.\n"
