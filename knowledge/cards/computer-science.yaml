  question: What is memoization?
  answer: Memoization caches a function's results by its arguments so a repeated call returns the stored
    result instead of recomputing it. It turns exponential recursive solutions with overlapping subproblems,
    like naive Fibonacci, into polynomial ones.
  topic: computer science
  tags:
  - dynamic-programming
  - recursion
  - caching
  - optimization
  explanation: "## In plain words\nMemoization means \"remember answers you already worked out\". If a\
    \ function is pure (same input always gives the same output), you can store each result in a table\
    \ and look it up next time. It trades memory for speed.\n\n## How it works\n- Before computing, check\
    \ a cache keyed by the arguments.\n- If the key is present, return the cached value.\n- Otherwise\
    \ compute, store the result, and return it.\n- It is the top-down form of dynamic programming. The\
    \ bottom-up form (tabulation) fills a table in order with loops instead.\n- It only helps when subproblems\
    \ repeat. Running time becomes roughly (number of distinct states) times (work per state).\n\n## Example\n\
    ```python\nfrom functools import lru_cache\n\n@lru_cache(maxsize=None)\ndef fib(n):\n    if n < 2:\n\
    \        return n\n    return fib(n - 1) + fib(n - 2)\n\nprint(fib(80))  # 23416728348467685\n```\n\
    Without the cache, `fib(80)` makes about 10^17 calls (the count grows like O(1.6^n)). With it, each\
    \ `n` is computed once: O(n) time and O(n) space.\n\n## Common mistakes\n- Memoizing a function with\
    \ side effects or one that depends on global state; cached results become wrong.\n- Using mutable\
    \ arguments (lists) as cache keys.\n- Forgetting the recursion depth: deep memoized recursion can\
    \ still overflow the stack, where a bottom-up loop would not.\n- Calling it \"memorization\".\n\n\
    ## In the interview\nShow the naive recursion, point out the repeated subproblems, then add a cache\
    \ and state the new complexity. Expect the follow-up \"can you do it bottom-up and reduce space?\"\
    \ (for Fibonacci, keep only the last two values, O(1) space). Mention the trade-off: memoization is\
    \ easy to add and computes only the states you need, while tabulation avoids recursion overhead and\
    \ makes space optimization easier.\n"
