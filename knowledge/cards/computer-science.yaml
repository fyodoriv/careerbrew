  question: What is the Observer design pattern?
  answer: Observer is a behavioural pattern where a subject keeps a list of observers and notifies them
    automatically when its state changes. It decouples the source of events from the code that reacts
    to them, and is the basis of event listeners and reactive UIs.
  topic: computer science
  tags:
  - design-patterns
  - observer
  - events
  - oop
  explanation: "## In plain words\nSubscribing to a channel: you register once, and whenever something\
    \ new is posted, you get notified. The channel does not need to know what you do with it. In code,\
    \ one object (the subject) broadcasts changes to any number of listeners (observers).\n\n## How it\
    \ works\n- **Subject**: holds state and a list of observers; offers `subscribe`, `unsubscribe`, and\
    \ `notify`.\n- **Observer**: an object or callback with an `update` method.\n- When the subject's\
    \ state changes, it calls `update` on every registered observer, either pushing the new data or letting\
    \ observers pull it.\n- The subject depends only on the observer interface, so new reactions can be\
    \ added without changing it (open-closed principle).\n- **Relation to pub/sub**: Observer is usually\
    \ in-process and direct; pub/sub adds a broker between publishers and subscribers, often across a\
    \ network.\n\n## Example\n```python\nclass Stock:\n    def __init__(self):\n        self._observers,\
    \ self._price = [], 0\n\n    def subscribe(self, fn):\n        self._observers.append(fn)\n\n    def\
    \ set_price(self, price):\n        self._price = price\n        for fn in list(self._observers):\n\
    \            fn(price)\n\ns = Stock()\ns.subscribe(lambda p: print(\"chart updated to\", p))\ns.subscribe(lambda\
    \ p: print(\"ALERT\") if p > 100 else None)\ns.set_price(120)   # chart updated to 120, then ALERT\n\
    ```\nBrowser `addEventListener`, React state subscriptions, and RxJS observables follow the same idea.\n\
    \n## Common mistakes\n- Forgetting to unsubscribe, which leaks memory and calls handlers on dead objects\
    \ (a classic problem in UI code).\n- Observers that modify the subject during notification, causing\
    \ loops or skipped observers; iterate over a copy.\n- Relying on notification order.\n- Slow observers\
    \ blocking the subject; dispatch asynchronously if needed.\n\n## In the interview\nDraw the subject\
    \ and observer roles, give a UI or event example, and name the trade-offs: loose coupling and easy\
    \ extension versus harder-to-follow control flow, memory leaks, and cascades of updates. Compare with\
    \ pub/sub and mention weak references or explicit dispose methods to avoid leaks.\n"
