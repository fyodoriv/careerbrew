  explanation: "## In plain words\nA BST is like a decision game: at each node you ask \"is my key smaller\
    \ or larger than this?\" and go left or right. Because every comparison throws away one side, finding\
    \ a key in a balanced tree of a million entries takes only about 20 steps.\n\n## How it works\n- **Search:**\
    \ start at the root; go left if the key is smaller, right if larger; stop when equal or at an empty\
    \ spot.\n- **Insert:** search for the key and attach a new node where the search falls off the tree.\n\
    - **Delete:**\n  - Leaf: remove it.\n  - One child: replace the node with its child.\n  - Two children:\
    \ replace its key with its in-order successor (smallest key in the right subtree), then delete that\
    \ successor.\n- **In-order traversal** returns keys in sorted order.\n\n**Pros:** sorted order, min\
    \ and max, floor and ceiling, range queries, all in `O(h)`.\n**Cons:** no balance guarantee: inserting\
    \ sorted data gives height n. Use a self-balancing tree (AVL, red-black) for guarantees. For plain\
    \ lookups, hash maps are faster on average.\n\n## Example\n```python\nclass Node:\n    def __init__(self,\
    \ key):\n        self.key, self.left, self.right = key, None, None\n\ndef insert(root, key):\n   \
    \ if root is None:\n        return Node(key)\n    if key < root.key:\n        root.left = insert(root.left,\
