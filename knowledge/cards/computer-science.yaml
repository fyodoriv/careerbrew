- id: kb-f985a2d75c3d
  question: What is the Singleton pattern, and what are its drawbacks?
  answer: 'A Singleton ensures a class has only one instance and gives global access to it, for example
    a configuration object or connection pool. It is easy to misuse: it acts like a global variable, hides
    dependencies, complicates testing, and needs care with threads.'
  topic: computer science
  tags:
  - design-patterns
  - creational
  - singleton
  explanation: "## In plain words\nSome things should exist only once in a program, such as the application's\
    \ settings or a logger. A Singleton guarantees that: no matter how many times you ask for it, you\
    \ get the same object back.\n\n## How it works\n- Make the constructor private (or guard it) and expose\
    \ a static accessor such as `getInstance()` that creates the instance on first use and returns it\
    \ afterwards.\n- In multi-threaded code, guard first creation with a lock, or create the instance\
    \ eagerly at startup.\n- Language shortcuts: a Python module is effectively a singleton; an ES module's\
    \ exported object is shared by all importers; in Java, an `enum` with one value is a robust singleton.\n\
    - Modern alternative: create one instance at startup and pass it to the code that needs it (dependency\
    \ injection). You keep \"only one\" without global access.\n\n## Example\n```python\nimport threading\n\
    \nclass Config:\n    _instance = None\n    _lock = threading.Lock()\n\n    def __new__(cls):\n   \
    \     if cls._instance is None:\n            with cls._lock:\n                if cls._instance is\
    \ None:\n                    cls._instance = super().__new__(cls)\n                    cls._instance.values\
