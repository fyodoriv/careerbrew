  question: What counts as extra space in Big O analysis?
  answer: 'Auxiliary (extra) space is memory the algorithm allocates beyond its input: new arrays, hash
    maps, stacks, queues, and the recursion call stack. The input itself is usually not counted, and the
    output is often excluded too, but say which convention you use. A fixed number of variables is O(1).'
  topic: computer science
  tags:
  - algorithms
  - big-o
  - space-complexity
  - fundamentals
  explanation: "## In plain words\nSpace complexity asks: as the input grows, how much more memory does\
    \ my algorithm need? You count the scratch paper, not the question sheet. A few counters are constant\
    \ scratch paper; a copy of the whole input grows with n.\n\n## How it works\nCounts as extra space:\n\
    - New data structures sized by the input: a copy of the array, a hash set of seen values, a DP table.\n\
    - The recursion stack: depth d means O(d) space, even if each frame is small.\n- Queues and stacks\
    \ used for BFS or DFS.\n- Strings built in languages where they are immutable (each concatenation\
    \ may create new memory).\n\nUsually not counted:\n- The input itself (unless you modify it in place\
    \ and the question forbids that).\n- The returned output, by many conventions (\"O(1) extra space\
    \ excluding the output array\").\n\nO(1) space: a constant number of variables, regardless of n. Sorting\
    \ in place, two pointers, and reversing a list in place are typical. Note that some built-in sorts\
    \ use extra memory (Python's Timsort uses up to O(n)).\n\n## Example\n- Two-sum with a hash map: O(n)\
    \ extra space.\n- Two-sum on a sorted array with two pointers: O(1) extra space.\n- Recursive DFS\
    \ on a skewed tree of n nodes: O(n) stack space.\n```python\ndef reverse_in_place(a):   # O(1) extra\
    \ space\n    i, j = 0, len(a) - 1\n    while i < j:\n        a[i], a[j] = a[j], a[i]\n        i, j\
    \ = i + 1, j - 1\n    return a\n```\n\n## Common mistakes\n- Forgetting the recursion stack and claiming\
    \ O(1).\n- Counting the output when the problem says it is excluded, or the reverse.\n- Assuming slicing\
    \ is free (`a[1:]` copies in Python).\n- Calling a library sort O(1) space without checking.\n\n##\
    \ In the interview\nState space alongside time every time. Make the convention explicit (\"O(1) extra,\
    \ not counting the output\"). Interviewers often ask for a space-optimised follow-up, such as rolling\
    \ DP rows or in-place marking, so mention them when relevant.\n"
  match:
