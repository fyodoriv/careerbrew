  question: What is a hash collision in a hash map, and how do you resolve it?
  answer: A collision happens when two different keys map to the same bucket. It is resolved by separate
    chaining (each bucket holds a list or tree of entries) or open addressing (probe for another slot
    with linear probing, quadratic probing, or double hashing). A good hash function and resizing keep
    collisions rare, preserving O(1) average time.
  topic: computer science
  tags:
  - data-structures
  - hash-map
  - collisions
  - hashing
  explanation: "## In plain words\nThere are far more possible keys than buckets, so some keys must share\
    \ a bucket, like two guests given the same locker number. Collision handling is the house rule for\
    \ where the second guest's things go and how to find them later.\n\n## How it works\n**Separate chaining**:\n\
    - Each bucket holds a small list of (key, value) pairs.\n- Insert appends; lookup scans that list\
    \ comparing keys.\n- Simple and tolerant of high load factors. Java's HashMap turns long chains into\
    \ balanced trees to cap the worst case at O(log n).\n\n**Open addressing**:\n- All entries live in\
    \ the array itself.\n- On collision, probe a sequence of other slots:\n  - linear probing: i, i+1,\
    \ i+2, ... (cache-friendly but forms clusters);\n  - quadratic probing: i + 1, i + 4, i + 9, ...;\n\
    \  - double hashing: step size from a second hash.\n- Deletion needs \"tombstones\" so probe chains\
    \ are not broken.\n- Needs a lower load factor (often at most about 0.7). Python's dict uses a form\
    \ of open addressing.\n\n**Prevention**: a well-distributed hash function, resizing when the load\
    \ factor grows, and randomised seeds against crafted inputs.\n\n## Example\nCapacity 8, `index = key\
    \ % 8`. Keys 3 and 11 both map to bucket 3.\n- Chaining: bucket 3 holds [(3, \"a\"), (11, \"b\")].\n\
    - Linear probing: 3 goes in slot 3, 11 finds slot 3 taken and goes to slot 4.\n```python\nbuckets\
    \ = [[] for _ in range(8)]\nfor k, v in [(3, \"a\"), (11, \"b\")]:\n    buckets[k % 8].append((k,\
    \ v))\nprint(buckets[3])  # [(3, 'a'), (11, 'b')]\n```\n\n## Common mistakes\n- Comparing only hashes\
    \ during lookup, not keys; different keys can share a hash.\n- Deleting in open addressing by simply\
    \ emptying the slot.\n- Letting the load factor grow without resizing.\n- Overriding equality without\
    \ overriding the hash function (Java's `equals` and `hashCode`).\n\n## In the interview\nName both\
    \ strategies with their trade-offs (chaining: simple and robust; open addressing: cache-friendly and\
    \ compact). Mention the load factor and worst cases. Expect follow-ups on the `equals`/`hashCode`\
    \ contract, Java's treeified buckets, and hash flooding attacks.\n"
