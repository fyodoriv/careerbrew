- id: kb-c1c2f411bfed
  question: What is insertion sort?
  answer: Insertion sort builds a sorted prefix one element at a time, shifting larger elements right
    and inserting the new element into its place. It is O(n^2) in the worst and average case but O(n)
    on nearly sorted input, stable, in place, and fast for small arrays.
  topic: computer science
  tags:
  - algorithms
  - sorting
  - insertion-sort
  explanation: "## In plain words\nThis is how many people sort playing cards in their hand. Pick up cards\
    \ one at a time, and slide each new card left past the bigger ones until it sits in the right place.\
    \ The cards already in your hand are always sorted.\n\n## How it works\n- For `i` from 1 to n - 1:\n\
    \  - Save `key = a[i]`.\n  - Move left with `j`, shifting every element larger than `key` one step\
    \ right.\n  - Put `key` in the gap.\n- **Time**: O(n^2) worst case (reverse sorted) and average; O(n)\
    \ best case (already sorted), because each element needs one comparison. More precisely, it is O(n\
    \ + inversions), where an inversion is a pair out of order.\n- **Space**: O(1). **Stable**: equal\
    \ elements keep their order because we only shift strictly larger ones.\n- **Online**: it can sort\
    \ items as they arrive.\n\n## Example\n```python\ndef insertion_sort(a):\n    for i in range(1, len(a)):\n\
    \        key, j = a[i], i - 1\n        while j >= 0 and a[j] > key:\n            a[j + 1] = a[j]\n\
    \            j -= 1\n        a[j + 1] = key\n    return a\n\nprint(insertion_sort([5, 2, 4, 6, 1,\
    \ 3]))  # [1, 2, 3, 4, 5, 6]\n```\nOn `[1, 2, 3, 5, 4]` it does only one shift.\n\n## Common mistakes\n\
    - Using `>=` in the comparison, which breaks stability.\n- Swapping at each step instead of shifting,\
    \ which does extra writes (still correct, just slower).\n- Saying it is always O(n^2); its best case\
    \ is O(n).\n\n## In the interview\nExplain why it still matters: production hybrids such as Timsort\
    \ (Python, Java for objects) and introsort switch to insertion sort for small runs (around 16 to 64\
    \ elements) because its low overhead beats the O(n log n) sorts there. Compare with selection sort\
    \ (always O(n^2), unstable, fewer writes) and bubble sort (also adaptive, but slower in practice).\n"
