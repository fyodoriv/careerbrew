  question: What is a cache miss?
  answer: A cache miss happens when requested data is not in the cache, so it must be fetched from the
    slower source and usually stored in the cache afterwards. Misses are classified as compulsory (first
    access), capacity (cache too small), and conflict (mapping collisions in hardware caches); too many
    misses can overload the backing store.
  topic: computer science
  tags:
  - caching
  - performance
  - system-design
  explanation: "## In plain words\nA cache miss is opening the fridge and finding no milk: now you must\
    \ go to the shop, which is slow. You buy some and put it in the fridge so the next time is quick.\
    \ Every cache has misses; the goal is to keep them rare and harmless.\n\n## How it works\n- On a miss,\
    \ the system reads from the source (database, disk, main memory), returns the result, and typically\
    \ fills the cache (cache-aside or read-through).\n- **Types of miss:**\n  - Compulsory (cold): the\
    \ first request for a key, unavoidable without pre-warming.\n  - Capacity: the cache is too small\
    \ for the working set, so useful items were evicted.\n  - Conflict: in hardware caches, two addresses\
    \ compete for the same slot.\n- **Miss penalty** is the extra time a miss costs; latency spikes when\
    \ many misses happen together.\n- **Dangers:**\n  - Cache stampede: a popular key expires and thousands\
    \ of requests hit the database at once.\n  - Penetration: repeated requests for keys that do not exist\
    \ always miss.\n- **Mitigations:** request coalescing or locks so only one request refills a key,\
    \ staggered (jittered) TTLs, caching negative results briefly, Bloom filters for non-existent keys,\
    \ pre-warming.\n\n## Example\n```python\nimport time\n\ncache = {}\n\ndef slow_lookup(user_id):\n\
    \    time.sleep(0.02)          # stand-in for a database query\n    return {\"id\": user_id}\n\ndef\
    \ get_user(user_id):\n    if user_id in cache:\n        return cache[user_id], \"hit\"\n    value\
    \ = slow_lookup(user_id)   # miss: go to the source\n    cache[user_id] = value         # fill so\
    \ next time is a hit\n    return value, \"miss\"\n\nprint(get_user(7)[1], get_user(7)[1])  # miss\
    \ hit\n```\n\n## Common mistakes\n- Ignoring the stampede problem when a hot key expires.\n- Not caching\
    \ \"not found\" results, so missing keys hammer the database.\n- Increasing cache size blindly without\
    \ checking whether misses are compulsory or capacity misses.\n\n## In the interview\nDefine it, give\
    \ the types, and spend most of the answer on how misses hurt in production and how you would mitigate\
    \ them. Interviewers like stampede protection and negative caching. For low-level roles, mention CPU\
    \ cache lines and why sequential memory access has fewer misses than random access.\n"
