  question: What is a stack, and what are its pros and cons?
  answer: 'A stack is a last-in, first-out (LIFO) collection: push adds to the top and pop removes from
    the top, both O(1). It powers function calls, undo, expression parsing, bracket matching, and depth-first
    search.'
  topic: computer science
  tags:
  - data-structures
  - stack
  - lifo
  - dfs
  explanation: "## In plain words\nA stack of plates: you put new plates on top and take from the top.\
    \ The last plate added is the first one used. You cannot pull from the middle without lifting the\
    \ ones above.\n\n## How it works\n- **Push**, **pop**, and **peek** at the top: O(1) (amortized O(1)\
    \ with a dynamic array).\n- **Search**: O(n).\n- **Implementations**: a dynamic array (Python list\
    \ with `append` and `pop`) or a linked list with a head pointer.\n- **The call stack**: each function\
    \ call pushes a frame with its local variables and return address; returning pops it. Too many nested\
    \ calls cause a stack overflow.\n- **Monotonic stack**: keeps elements in increasing or decreasing\
    \ order to answer \"next greater element\" questions in O(n).\n\n## Example\nCheck balanced brackets:\n\
    ```python\ndef balanced(s):\n    pairs, stack = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}, []\n \
    \   for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n\
    \            if not stack or stack.pop() != pairs[ch]:\n                return False\n    return not\
    \ stack\n\nprint(balanced(\"{[()]}\"), balanced(\"([)]\"))  # True False\n```\nO(n) time, O(n) space.\n\
    \n**Pros:** very simple, O(1) operations, matches nested structure naturally, cache friendly when\
    \ array based.\n**Cons:** only the top is accessible, and searching is O(n); a deep recursion-based\
    \ stack can overflow.\n\n## Common mistakes\n- Popping from an empty stack; check first.\n- Forgetting\
    \ to verify the stack is empty at the end (unclosed brackets).\n- Using `list.insert(0, x)` instead\
    \ of `append`, which is O(n).\n\n## In the interview\nRecognize stack problems: matching pairs, undo/redo,\
    \ evaluating expressions (reverse Polish notation), backtracking, iterative DFS, and monotonic-stack\
    \ questions like daily temperatures. Compare with a queue (FIFO, used for BFS). Mention that any recursion\
    \ can be rewritten with an explicit stack to avoid call-stack limits.\n"
