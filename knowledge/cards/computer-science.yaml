  question: What is encapsulation?
  answer: Encapsulation bundles data with the methods that operate on it and hides internal details behind
    a public interface. Outside code interacts only through that interface, so the object can protect
    its invariants and change its internals without breaking callers.
  topic: computer science
  tags:
  - oop
  - encapsulation
  - design-principles
  explanation: "## In plain words\nA car's driver uses the steering wheel and pedals without touching\
    \ the engine's internals. Encapsulation gives objects the same arrangement: a small set of controls\
    \ on the outside, and the messy details hidden inside where nobody can break them by accident.\n\n\
    ## How it works\n- **Bundle** state and behaviour in one unit (a class, module, or closure).\n- **Hide**\
    \ internal state with access control: `private` and `protected` in Java or C#, `#private` fields in\
    \ JavaScript, and the leading-underscore convention in Python.\n- **Expose** operations that keep\
    \ the object valid, instead of raw setters for every field.\n- **Protect invariants:** for example,\
    \ a bank account's balance can only change through `deposit` and `withdraw`, which validate amounts.\n\
    - **Benefits:** fewer ways to misuse an object, freedom to refactor internals, and easier reasoning.\n\
    - Related but different: abstraction (showing only essential features) and information hiding (the\
    \ design principle encapsulation implements).\n\n## Example\n```python\nclass Account:\n    def __init__(self):\n\
    \        self._balance = 0          # internal by convention\n\n    @property\n    def balance(self):\
    \             # read-only view\n        return self._balance\n\n    def deposit(self, amount):\n \
    \       if amount <= 0:\n            raise ValueError(\"amount must be positive\")\n        self._balance\
    \ += amount\n\n    def withdraw(self, amount):\n        if amount <= 0:\n            raise ValueError(\"\
    amount must be positive\")\n        if amount > self._balance:\n            raise ValueError(\"insufficient\
    \ funds\")\n        self._balance -= amount\n\na = Account()\na.deposit(50)\na.withdraw(20)\nprint(a.balance)\
    \  # 30\n```\n\n## Common mistakes\n- Making every field private and then adding a public getter and\
    \ setter for each, which hides nothing.\n- Returning internal mutable collections directly, letting\
    \ callers change them.\n- Confusing encapsulation with abstraction or with security; access modifiers\
    \ prevent mistakes, not attacks.\n\n## In the interview\nDefine it with a concrete invariant, such\
    \ as a balance that must never go negative. Interviewers like the \"tell, don't ask\" idea (ask an\
    \ object to do something rather than pulling its data out) and the pitfall of getter-setter pairs.\
    \ Mention that encapsulation also applies beyond classes: modules, services, and APIs hide internals\
    \ the same way.\n"
