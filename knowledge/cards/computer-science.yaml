  question: What are the sliding window and two pointers techniques?
  answer: Both scan a sequence with two indexes instead of nested loops. Two pointers move from the ends
    or at different speeds to find pairs or partitions; a sliding window keeps a contiguous range that
    grows on the right and shrinks on the left while tracking a running state. Both usually turn O(n^2)
    into O(n).
  topic: computer science
  tags:
  - algorithms
  - two-pointers
  - sliding-window
  - arrays
  explanation: "## In plain words\nMany array and string problems look like they need checking every pair\
    \ or every subarray. Often you can instead keep two markers and move them cleverly, so each element\
    \ is visited only a few times. A sliding window is a frame you slide along the data, stretching and\
    \ shrinking it as you go.\n\n## How it works\n**Two pointers**\n- Opposite ends: on a sorted array,\
    \ `left` starts at 0 and `right` at the end. If the pair sum is too small, move `left` up; if too\
    \ large, move `right` down.\n- Same direction: a slow pointer writes and a fast pointer reads, as\
    \ in removing duplicates in place.\n- Fast and slow: one moves twice as fast, for cycle detection\
    \ or finding a middle node.\n\n**Sliding window**\n- Expand `right` one step at a time and add `a[right]`\
    \ to the window state (a sum, a count map).\n- While the window breaks the rule, remove `a[left]`\
    \ and move `left` forward.\n- Record the best answer after each step.\n- Each index enters and leaves\
    \ once, so time is O(n); space is O(1) or O(k) for the state.\n\n## Example\nLongest substring without\
    \ repeating characters:\n```python\ndef longest_unique(s):\n    last, left, best = {}, 0, 0\n    for\
    \ right, ch in enumerate(s):\n        if ch in last and last[ch] >= left:\n            left = last[ch]\
    \ + 1\n        last[ch] = right\n        best = max(best, right - left + 1)\n    return best\n\nprint(longest_unique(\"\
    abcabcbb\"))  # 3 (\"abc\")\n```\n\n## Common mistakes\n- Using a variable window when values can\
    \ be negative and the rule is a sum limit; shrinking no longer works, so use prefix sums instead.\n\
    - Forgetting to update the state when the left side shrinks.\n- Off-by-one errors in the window length\
    \ (`right - left + 1`).\n- Applying opposite-end two pointers to an unsorted array.\n\n## In the interview\n\
    Signals: \"contiguous subarray or substring\", \"longest or shortest with a condition\", \"pair in\
    \ a sorted array\". State the invariant of your window, prove each pointer only moves forward, and\
    \ give O(n) time.\n"
