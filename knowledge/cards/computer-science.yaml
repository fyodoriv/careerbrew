  question: What is two-way data binding, and how does it compare with one-way data flow?
  answer: With two-way binding, a change in the model updates the view and a user edit in the view updates
    the model automatically. With one-way data flow, data goes down from state to view and changes go
    back up only through explicit events or actions, which is more predictable and easier to debug.
  topic: computer science
  tags:
  - frontend
  - data-binding
  - state-management
  - ui
  explanation: "## In plain words\nTwo-way binding is like a mirror wired in both directions: type in\
    \ the input box and the variable changes; change the variable and the box changes. One-way flow is\
    \ a one-way street: state draws the screen, and the screen can only ask for changes by sending messages\
    \ back.\n\n## How it works\n**Two-way binding**\n- The framework links a model property and a UI element\
    \ and syncs both directions.\n- Examples: Angular's `[(ngModel)]`, Vue's `v-model` (sugar over a value\
    \ prop plus an input event), and older AngularJS, Knockout.\n- Pros: very little code for forms.\n\
    - Cons: in large apps, changes can come from many places, causing hard-to-trace cascades.\n\n**One-way\
    \ data flow**\n- State is the single source of truth; the view is a function of state.\n- User actions\
    \ call handlers that update state explicitly, and the view re-renders.\n- Examples: React (controlled\
    \ components), Redux, Elm.\n- Pros: predictable, easy to log and test, time-travel debugging.\n- Cons:\
    \ more boilerplate for simple forms.\n\n## Example\nReact one-way flow:\n```jsx\nfunction NameField()\
    \ {\n  const [name, setName] = React.useState(\"\");\n  return (\n    <input value={name} onChange={e\
    \ => setName(e.target.value)} />\n  );\n}\n```\nThe input shows `name`; typing calls `setName`, which\
    \ updates state and re-renders. In Vue, `<input v-model=\"name\">` does the same in one attribute,\
    \ and that is two-way binding.\n\n## Common mistakes\n- Saying React has no way to sync inputs; it\
    \ does, explicitly through handlers.\n- Thinking two-way binding is always bad; for local form state\
    \ it is convenient.\n- Mutating shared state from many components with two-way bindings, so nobody\
    \ knows what changed it.\n\n## In the interview\nDefine both, give a framework example of each, and\
    \ discuss trade-offs: convenience versus predictability. Mention that many frameworks mix them: one-way\
    \ flow for application state, and two-way sugar for form inputs. Expect follow-ups on unidirectional\
    \ architectures (Flux, Redux) and how they make debugging easier.\n"
