- id: kb-388d603634cc
  question: What is linear search?
  answer: Linear search checks each element in order until it finds the target or reaches the end. It
    takes O(n) time and O(1) space, works on unsorted data and any sequence, and is the right choice for
    small or one-off searches.
  topic: computer science
  tags:
  - algorithms
  - searching
  - linear-search
  explanation: "## In plain words\nLooking for your keys by checking every pocket, one after another,\
    \ until they turn up. No preparation is needed, and it works on anything you can walk through in order.\n\
    \n## How it works\n- Start at the first element.\n- Compare each element with the target; return its\
    \ index when it matches.\n- If you reach the end, return \"not found\" (for example -1).\n- **Time**:\
    \ best O(1) (first element), worst and average O(n).\n- **Space**: O(1).\n- Works on unsorted arrays,\
    \ linked lists, and streams. Binary search needs sorted, random-access data.\n\n## Example\n```python\n\
    def linear_search(a, target):\n    for i, x in enumerate(a):\n        if x == target:\n          \
    \  return i\n    return -1\n\nprint(linear_search([7, 3, 9, 3], 3))  # 1, the first match\nprint(linear_search([7,\
    \ 3, 9], 5))     # -1\n```\nA \"sentinel\" variant places the target at the end of the array so the\
    \ loop does not need a separate bounds check, a micro-optimization from low-level languages.\n\n##\
    \ Common mistakes\n- Sorting the data just to binary search it once: sorting costs O(n log n), which\
    \ is more than one linear scan.\n- Running a linear search inside a loop over the same data, which\
    \ becomes O(n^2); build a hash set or map first for O(1) average lookups.\n- Returning the wrong value\
    \ for \"not found\", or forgetting duplicates when the question asks for all matches or the last match.\n\
    \n## In the interview\nState when it is the right tool: small arrays (it is cache friendly and often\
    \ faster than fancier methods for tens of items), unsorted data searched once, or linked lists. When\
    \ many searches are needed, compare the options: sort once and binary search (O(n log n) plus O(log\
    \ n) per query) or a hash set (O(n) build, O(1) average per query).\n"
