- id: kb-7be5dd3334c7
  question: What is a trie data structure?
  answer: A trie (prefix tree) stores strings as paths of characters from the root, with a flag marking
    where a word ends, so words sharing a prefix share nodes. Insert, search, and prefix lookup run in
    O(L) for a word of length L, which makes it ideal for autocomplete and word-search problems.
  topic: computer science
  tags:
  - data-structures
  - trie
  - strings
  - autocomplete
  explanation: "## In plain words\nA trie is a tree of letters. Each path from the root spells the start\
    \ of some word, and a marker says \"a word ends here\". It is the same structure as a prefix tree;\
    \ the name comes from \"retrieval\". It shines whenever you need everything that starts with some\
    \ prefix.\n\n## How it works\n- Node: a dictionary or fixed array of children plus `is_end`.\n- **Insert(word)**:\
    \ for each character, move to that child, creating it if needed; mark the last node. O(L).\n- **Search(word)**:\
    \ follow the characters; succeed only if the path exists and the last node is marked. O(L).\n- **Prefix\
    \ query**: follow the prefix, then collect words below by DFS. O(P + output size).\n- **Delete**:\
    \ unmark the end node and prune nodes that no longer lead to any word.\n- **Space**: up to O(total\
    \ characters), plus per-node overhead. Radix trees compress chains of single children.\n\n## Example\n\
    Autocomplete for \"ca\" over the words car, cat, and dog:\n```python\ndef build(words):\n    root\
    \ = {}\n    for w in words:\n        node = root\n        for ch in w:\n            node = node.setdefault(ch,\
    \ {})\n        node[\"$\"] = w\n    return root\n\ndef complete(root, prefix):\n    node = root\n\
    \    for ch in prefix:\n        if ch not in node:\n            return []\n        node = node[ch]\n\
    \    out, stack = [], [node]\n    while stack:\n        n = stack.pop()\n        for k, v in n.items():\n\
    \            if k == \"$\":\n                out.append(v)\n            else:\n                stack.append(v)\n\
    \    return sorted(out)\n\nprint(complete(build([\"car\", \"cat\", \"dog\"]), \"ca\"))  # ['car',\
    \ 'cat']\n```\n\n## Common mistakes\n- Missing the end-of-word marker, so prefixes are reported as\
    \ words.\n- Allocating a 26-slot array per node for Unicode text.\n- Rebuilding the trie per query\
    \ instead of once.\n\n## In the interview\nUse it for autocomplete, \"word search II\" on a grid (prune\
    \ DFS paths that match no prefix), replacing words by their shortest root, and longest-prefix matching\
    \ in routers. Compare with a hash set: equal for exact lookups, but only a trie answers prefix queries\
    \ without scanning everything. Mention the memory cost.\n"
