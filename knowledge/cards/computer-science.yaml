  question: How do you solve the k-way merge problem?
  answer: Put the first element of each of the k sorted lists into a min-heap with its list index. Repeatedly
    pop the smallest, append it to the output, and push the next element from the same list. With N total
    elements this is O(N log k) time and O(k) extra space.
  topic: computer science
  tags:
  - heap
  - merge
  - k-way-merge
  - sorting
  explanation: "## In plain words\nYou have k sorted piles and want one sorted pile. At any moment the\
    \ next smallest item must be at the top of one of the piles, so you only ever need to compare k candidates.\
    \ A min-heap keeps those k candidates ready and tells you the smallest one quickly.\n\n## How it works\n\
    - Push `(value, list_index, element_index)` for the first element of each non-empty list.\n- Loop:\
    \ pop the smallest tuple, append its value, and if that list has another element, push it.\n- The\
    \ heap never holds more than k items, so each operation is `O(log k)`, and all N elements pass through\
    \ once: `O(N log k)`.\n- Alternative: divide and conquer, merging lists in pairs (like merge sort's\
    \ merge step) also gives `O(N log k)`.\n- Merging one list at a time into a growing result is `O(N\
    \ k)`; avoid it.\n- Patterns that reduce to k-way merge: merge k sorted linked lists, smallest range\
    \ covering k lists, k-th smallest element in a sorted matrix.\n\n## Example\n```python\nimport heapq\n\
    \ndef merge_k(lists):\n    heap = [(lst[0], i, 0) for i, lst in enumerate(lists) if lst]\n    heapq.heapify(heap)\n\
    \    out = []\n    while heap:\n        val, i, j = heapq.heappop(heap)\n        out.append(val)\n\
    \        if j + 1 < len(lists[i]):\n            heapq.heappush(heap, (lists[i][j + 1], i, j + 1))\n\
    \    return out\n\nprint(merge_k([[1, 4, 7], [2, 5], [3, 6, 9]]))  # [1, 2, 3, 4, 5, 6, 7, 9]\n```\n\
    \n## Common mistakes\n- Pushing nodes that cannot be compared (such as linked-list nodes in Python)\
    \ without a tie-breaking index.\n- Concatenating all lists and sorting: `O(N log N)`, which misses\
    \ the point.\n- Forgetting empty input lists.\n- Stating the complexity as `O(N log N)` instead of\
    \ `O(N log k)`.\n\n## In the interview\nExplain why only k candidates matter, then code the heap version.\
    \ Mention the divide-and-conquer alternative and the external-sort use case: merging sorted chunks\
    \ of a file too large for memory. Expect a question on the tie-breaker in the heap tuple.\n"
