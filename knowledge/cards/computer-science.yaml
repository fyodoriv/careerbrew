  question: What is method overloading, and how does it differ from method overriding?
  answer: Overloading defines several methods with the same name but different parameter lists in the
    same scope, and the compiler picks one at compile time. Overriding redefines an inherited method with
    the same signature in a subclass, and the version runs based on the object's runtime type.
  topic: computer science
  tags:
  - oop
  - polymorphism
  - overloading
  - overriding
  explanation: "## In plain words\nOverloading is one name, several recipes, chosen by what ingredients\
    \ you pass in: `print(int)` versus `print(String)`. Overriding is a child class replacing a parent's\
    \ recipe with its own version of the same dish. The first is decided when the code compiles; the second\
    \ when it runs.\n\n## How it works\n**Overloading (ad hoc, compile-time polymorphism)**\n- Same method\
    \ name, different number or types of parameters.\n- The compiler resolves the call from the static\
    \ argument types.\n- Return type alone cannot distinguish overloads in Java or C++.\n- Python and\
    \ JavaScript do not support it directly; a later `def` with the same name replaces the earlier one.\
    \ Use default arguments or `functools.singledispatch` instead.\n\n**Overriding (subtype, runtime polymorphism)**\n\
    - A subclass method with the same name and compatible signature as the parent's.\n- Dispatch happens\
    \ at runtime based on the actual object type (dynamic dispatch).\n- Use `@Override` in Java so the\
    \ compiler checks you really override something.\n\n## Example\n```java\nclass Shape {\n    double\
    \ area() { return 0; }\n}\nclass Circle extends Shape {\n    double r = 1;\n    @Override double area()\
    \ { return Math.PI * r * r; }  // overriding\n}\nclass Printer {\n    void show(int x)    { System.out.println(\"\
    int \" + x); }      // overloading\n    void show(String s) { System.out.println(\"string \" + s);\
    \ }\n}\n// Shape s = new Circle(); s.area() runs Circle's version at runtime.\n// new Printer().show(5)\
    \ picks show(int) at compile time.\n```\n\n## Common mistakes\n- Thinking overloads are chosen by\
    \ runtime type; Java chooses by the declared type of the argument.\n- Accidentally overloading when\
    \ you meant to override (a slightly different parameter type), so the parent's method still runs.\n\
    - Claiming Python supports classic overloading.\n- Overriding a method and changing its contract,\
    \ which breaks Liskov substitution.\n\n## In the interview\nGive a two-line definition of each, say\
    \ \"compile time versus runtime\", and show a short example. Expect follow-ups on static methods (they\
    \ are hidden, not overridden, in Java), how dynamic dispatch works through a virtual method table,\
    \ and the `final` keyword to prevent overriding.\n"
