  question: What is a binary search tree (BST), what are its pros and cons, and how do you implement one?
  answer: 'A BST is a binary tree where every node''s left subtree holds smaller keys and its right subtree
    larger keys. Search, insert, and delete follow one path from the root, so they cost O(h): O(log n)
    when balanced, O(n) when it degenerates into a chain. In-order traversal yields sorted keys.'
  topic: computer science
  tags:
  - data-structures
  - trees
  - bst
