  question: What is SHA (Secure Hash Algorithm)?
  answer: SHA is a family of cryptographic hash functions standardized by NIST that map any input to a
    fixed-size digest, such as 256 bits for SHA-256. They are designed so the output cannot be reversed
    and collisions cannot practically be found; SHA-1 is broken for collisions, while SHA-2 and SHA-3
    are current.
  topic: computer science
  tags:
  - security
  - cryptography
  - hashing
  - sha
  explanation: "## In plain words\nA cryptographic hash is a fingerprint for data. Feed in a file of any\
    \ size and get a short, fixed-length string. Change one bit of the input and the fingerprint changes\
    \ completely. SHA is the best-known family of these functions.\n\n## How it works\n- The family: SHA-1\
    \ (160-bit output), SHA-2 (SHA-224, SHA-256, SHA-384, SHA-512), and SHA-3 (built on a different design\
    \ called Keccak).\n- Properties a cryptographic hash should have:\n  - **Preimage resistance**: given\
    \ a digest, you cannot find an input that produces it.\n  - **Second-preimage resistance**: given\
    \ an input, you cannot find another with the same digest.\n  - **Collision resistance**: you cannot\
    \ find any two inputs with the same digest.\n- SHA-2 processes input in fixed-size blocks, mixing\
    \ each into an internal state; the final state is the digest.\n- Status: SHA-1 has practical collision\
    \ attacks and should not be used for signatures. SHA-256 is widely used (TLS certificates, Git's newer\
    \ object format, Bitcoin).\n\n## Example\n```python\nimport hashlib\n\nprint(hashlib.sha256(b\"hello\"\
    ).hexdigest()[:16])  # 2cf24dba5fb0a30e\nprint(hashlib.sha256(b\"hellp\").hexdigest()[:16])  # a totally\
    \ different value\n```\n\n## Common mistakes\n- Calling hashing \"encryption\"; a hash cannot be decrypted.\n\
    - Storing passwords as plain SHA-256: it is fast, so attackers can try billions of guesses per second.\
    \ Use a slow, salted password hash such as bcrypt, scrypt, or Argon2.\n- Using a bare hash to authenticate\
    \ a message; use HMAC, which mixes in a secret key and avoids length-extension attacks on SHA-2.\n\
    \n## In the interview\nDefine the three resistance properties and give uses: file integrity checks,\
    \ digital signatures (sign the hash, not the file), content-addressed storage, and deduplication.\
    \ Expect a follow-up about password storage and why speed is bad there. Mention that non-cryptographic\
    \ hashes (used in hash maps) are faster but give no security guarantees.\n"
