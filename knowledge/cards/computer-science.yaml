- id: kb-31a25fa71d8a
  question: What is a data ingestion pipeline in system design?
  answer: A data ingestion system collects data from many sources, buffers it, validates and transforms
    it, and loads it into storage for processing or analysis. A typical design is producers, a durable
    queue or log such as Kafka, stateless workers, and a sink, built for back-pressure, retries, and idempotent
    writes.
  topic: computer science
  tags:
  - system-design
  - data-pipelines
  - ingestion
  - streaming
  explanation: '## In plain words

    An ingestor is the front door for data: logs, clicks, sensor readings, or partner files. Its job is
    to accept everything reliably, even during spikes, clean it up, and hand it to storage, without losing
    or doubling records.


    ## How it works

    - **Sources and collectors**: clients or agents send data through an API endpoint, an SDK, file drops,
    or change data capture from databases.

    - **Buffer**: a durable log or queue (Kafka, Kinesis, Pub/Sub) absorbs bursts and decouples producers
    from consumers.

    - **Processing workers**: validate against a schema, enrich, deduplicate, and transform. Stateless
    workers scale horizontally by partition.

    - **Sinks**: a data lake (object storage), a warehouse, a search index, or a time-series database.

    - **Reliability**: at-least-once delivery plus idempotent writes (dedupe by an event id), retries
    with backoff, and a dead-letter queue for bad records.

    - **Batch vs streaming**: batch loads on a schedule are simpler and cheaper; streaming gives fresh
    data in seconds.


    ## Example

    A mobile app sends 50,000 events per second. An ingest API checks auth and size, then writes to a
    64-partition topic keyed by user id. Workers validate each event against a schema, drop duplicates
    by event id, and write compressed files to object storage every minute; a warehouse loads those files.
    Malformed events go to a dead-letter topic with an alert.


    ## Common mistakes

    - Writing straight from the API to the database, so a traffic spike or a slow database causes data
    loss.

    - Assuming exactly-once delivery without designing idempotent sinks.

    - No schema versioning, so a producer change silently breaks consumers.

    - Ignoring late and out-of-order events in time-based aggregation.


    ## In the interview

    Clarify volume, latency needs, ordering, and retention first. Draw the source, buffer, worker, sink
    chain, then discuss partitioning, back-pressure, monitoring of consumer lag, replay from the log after
    a bug, and cost (compression, columnar formats such as Parquet).

    '
