- id: kb-1375de2430ef
  question: What is the Decorator design pattern?
  answer: The Decorator pattern wraps an object in another object with the same interface, adding behavior
    before or after delegating to the wrapped one. It extends individual objects at runtime without changing
    their class or creating many subclasses.
  topic: computer science
  tags:
  - design-patterns
  - structural
  - oop
  - composition
  explanation: "## In plain words\nDecorator is a structural design pattern: it is about how objects are\
    \ composed. You wrap an object in a layer that looks the same from outside but adds something extra,\
    \ like putting a phone in a case that adds a battery. You can stack wrappers, and each wrapper only\
    \ knows about the one inside it.\n\n## How it works\n- Define a component interface, for example `read()`.\n\
    - A concrete component implements it (a file reader).\n- A decorator implements the same interface\
    \ and holds a reference to another component.\n- Each decorator method calls the wrapped object and\
    \ adds its own behavior before or after: compression, caching, logging, retries.\n- Because every\
    \ layer shares the interface, clients cannot tell how many wrappers there are, and you can combine\
    \ them in any order at runtime.\n- Benefits: follows the open/closed principle (extend without editing)\
    \ and single responsibility (one concern per wrapper); avoids a subclass for every combination.\n\
    - Costs: many small objects, order-dependent behavior, and harder debugging through deep stacks.\n\
    - Note that Python's `@decorator` syntax wraps functions; it is related in spirit but is a language\
    \ feature, not the object pattern itself.\n\n## Example\n```python\nclass Source:\n    def read(self):\n\
    \        return \"hello\"\n\nclass Upper:\n    def __init__(self, inner):\n        self.inner = inner\n\
    \    def read(self):\n        return self.inner.read().upper()\n\nclass Exclaim:\n    def __init__(self,\
    \ inner):\n        self.inner = inner\n    def read(self):\n        return self.inner.read() + \"\
    !\"\n\nprint(Exclaim(Upper(Source())).read())  # HELLO!\n```\nJava's `new BufferedReader(new InputStreamReader(stream))`\
    \ is the same idea in a standard library.\n\n## Common mistakes\n- Changing the interface in the decorator;\
    \ then it is an Adapter, not a Decorator.\n- Confusing it with Proxy: a proxy controls access to an\
    \ object, a decorator adds behavior.\n- Relying on object identity or type checks, which break once\
    \ an object is wrapped.\n\n## In the interview\nGive the one-sentence definition and a real example\
    \ such as I/O streams or HTTP client middleware. Compare it with inheritance (static, combinatorial\
    \ explosion) and with Proxy and Adapter. Mention the trade-off: flexible composition versus more objects\
    \ and order sensitivity.\n"
