- id: kb-f9ba30d7b25c
  question: What is the Factory design pattern and when should you use it?
  answer: The Factory pattern moves object creation into a dedicated function or class, so callers ask
    for an object by intent and do not need to know the concrete class. It helps when the type to create
    depends on input or configuration, at the cost of an extra layer of indirection.
  topic: computer science
  tags:
  - design-patterns
  - creational
  - oop
  explanation: "## In plain words\nA factory is a place whose only job is to build objects. Instead of\
    \ writing `new PdfExporter()` all over your code, you call `make_exporter(\"pdf\")` and get back something\
    \ that behaves like an exporter. It is like ordering \"a coffee\" at a counter: you do not need to\
    \ know which machine makes it.\n\n## How it works\n- Define a common interface (for example, an `Exporter`\
    \ with an `export` method).\n- Write several concrete classes that implement it.\n- Write one factory\
    \ function or class that decides which concrete class to build, based on arguments, configuration,\
    \ or environment.\n- Callers depend only on the interface and the factory, so adding a new type means\
    \ adding a class and one branch (or registry entry) in the factory.\n- Variants: a simple factory\
    \ function, the Factory Method pattern (subclasses override a creation method), and Abstract Factory\
    \ (a family of related objects, such as all widgets for one UI theme).\n\n## Example\n```python\n\
