  question: What are the first powers of two worth memorising?
  answer: '2^0 = 1 up to 2^10 = 1024, plus landmarks: 2^16 = 65,536, 2^20 is about a million, 2^30 about
    a billion, 2^31 - 1 = 2,147,483,647 (max signed 32-bit int), 2^32 about 4.3 billion, and 2^64 about
    1.8 x 10^19. They help with bit manipulation, limits, and quick estimates.'
  topic: computer science
  tags:
  - math
  - powers-of-two
  - estimation
  - bit-manipulation
  explanation: '## In plain words

    Computers count in binary, so powers of two appear everywhere: memory sizes, integer limits, hash
    table capacities, and the number of subsets of a set. Knowing a few by heart makes estimates and bit
    tricks fast.


    ## How it works

    - Small powers: 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024 (2^0 to 2^10).

    - 2^10 = 1024, about one thousand. So 2^20 is about a million, 2^30 about a billion, 2^40 about a
    trillion.

    - Byte and integer limits: 2^8 = 256 values in a byte; 2^16 = 65,536; signed 32-bit integers range
    from -2^31 to 2^31 - 1 (about plus or minus 2.1 billion); 2^32 is about 4.3 billion (IPv4 address
    count); 2^63 - 1 is about 9.2 x 10^18 (max signed 64-bit).

    - In algorithms: a set of n items has 2^n subsets, so brute force over subsets is fine up to about
    n = 20 (about a million) and painful past 30.

    - Bit tricks: `1 << k` equals 2^k; `x & (x - 1) == 0` tests whether a positive x is a power of two.


    ## Example

    ```python

    print([2 ** i for i in range(11)])

    # [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]

    print(2 ** 31 - 1)       # 2147483647

    x = 64

    print(x > 0 and x & (x - 1) == 0)  # True

    ```

    Estimating: binary search over 1 billion items takes about log2(10^9), which is about 30 steps, because
    2^30 is about 10^9.


    ## Common mistakes

    - Off-by-one on integer limits (2^31 vs 2^31 - 1).

    - Forgetting signed integers lose one bit to the sign.

    - Mixing 2^10 = 1024 with exactly 1000 when precision matters.

    - Writing `2 ^ 10` in languages where `^` is XOR.


    ## In the interview

    Use these numbers out loud during estimates ("about 2^30, so 30 levels"). Mention integer overflow
    when values can exceed 2^31. Expect quick follow-ups on bit manipulation, such as counting set bits
    or checking a power of two.

    '
