  question: How does breadth-first search (BFS) traverse a graph or tree?
  answer: 'BFS visits nodes level by level: first the start node, then all its neighbours, then their
    neighbours, using a FIFO queue and a visited set. It runs in O(V + E) time and finds shortest paths
    in unweighted graphs.'
  topic: computer science
  tags:
  - graphs
  - trees
  - bfs
  - traversal
  explanation: "## In plain words\nBFS explores like ripples on a pond: everything one step away, then\
    \ everything two steps away, and so on. Because it always finishes a distance before moving further,\
    \ the first time it reaches a node is along a shortest path (counting edges).\n\n## How it works\n\
    - Put the start node in a queue and mark it visited.\n- While the queue is not empty: pop the front\
    \ node, process it, and push every unvisited neighbour, marking each visited when it is pushed (not\
    \ when popped, or a node can be queued twice).\n- For trees you can skip the visited set, since there\
    \ are no cycles.\n- To work level by level, record the queue length at the start of each round and\
    \ pop exactly that many nodes.\n- Time `O(V + E)`; space `O(V)` for the queue and visited set (for\
    \ a tree, `O(w)` where w is the widest level).\n\n## Example\n```python\nfrom collections import deque\n\
    \ndef bfs_order(graph, start):\n    seen, order = {start}, []\n    q = deque([start])\n    while q:\n\
    \        node = q.popleft()\n        order.append(node)\n        for nxt in graph[node]:\n       \
    \     if nxt not in seen:\n                seen.add(nxt)\n                q.append(nxt)\n    return\
    \ order\n\ng = {\"A\": [\"B\", \"C\"], \"B\": [\"D\"], \"C\": [\"D\"], \"D\": []}\nprint(bfs_order(g,\
    \ \"A\"))  # ['A', 'B', 'C', 'D']\n```\n\n## Common mistakes\n- Using a Python list with `pop(0)`,\
    \ which is O(n) per pop; use `collections.deque`.\n- Marking nodes visited only when popped, causing\
    \ duplicates in the queue.\n- Using BFS for shortest paths in weighted graphs (that needs Dijkstra).\n\
    - Forgetting disconnected components when the task asks about the whole graph.\n\n## In the interview\n\
    Say when BFS is the right choice: shortest path by edge count, level-order output, \"minimum number\
    \ of steps\" puzzles, and multi-source spreading problems (such as rotting oranges). Contrast it with\
    \ DFS: BFS uses more memory on wide graphs but guarantees shortest paths. Expect follow-ups on bidirectional\
    \ BFS and on modelling grids as graphs.\n"
