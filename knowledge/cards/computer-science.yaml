  question: What is a map (dictionary) data structure, and what are its pros and cons?
  answer: A map stores key-value pairs with unique keys and lets you look up, insert, and delete by key.
    Hash maps do this in O(1) average time but are unordered; tree maps keep keys sorted at O(log n) per
    operation.
  topic: computer science
  tags:
  - data-structures
  - hash-map
  - map
  - dictionary
  explanation: "## In plain words\nA map is like a phone book: you look up a name (the key) and get a\
    \ number (the value). Each key appears once. It is the go-to structure when you need to find something\
    \ by an identifier rather than by position.\n\n## How it works\n- **Hash map**: a hash function turns\
    \ the key into an array index. Collisions are handled by chaining (a list per bucket) or open addressing\
    \ (probe for the next free slot). When the table gets too full it resizes, usually doubling.\n  -\
    \ get, put, delete: O(1) average, O(n) worst case when many keys collide.\n- **Tree map** (for example\
    \ a red-black tree): keys stay sorted.\n  - get, put, delete: O(log n); supports ordered iteration,\
    \ min, max, and range queries.\n- Space is O(n) for both, with some extra for empty buckets or tree\
    \ pointers.\n\n## Example\n```python\ncounts = {}\nfor word in \"the cat and the hat\".split():\n\
    \    counts[word] = counts.get(word, 0) + 1\nprint(counts[\"the\"])  # 2\n```\n\n**Pros:** fast lookup\
    \ by key, natural for counting, grouping, caching, and indexing.\n**Cons:** hash maps have no order\
    \ (Python dicts keep insertion order, but not sorted order), use more memory than arrays, need keys\
    \ that are hashable and immutable, and can degrade with a bad hash function.\n\n## Common mistakes\n\
    - Using a mutable object (like a list) as a key.\n- Claiming O(1) worst case; it is O(1) on average.\n\
    - Iterating a hash map and expecting sorted keys.\n- Changing a key's fields after insertion so its\
    \ hash no longer matches.\n\n## In the interview\nSay which kind you mean and why: hash map for speed,\
    \ tree map when you need order or ranges. Expect follow-ups on collision handling, load factor and\
    \ resizing (amortized O(1) insert), and how you would implement `equals` and `hashCode` consistently\
    \ in Java.\n"
