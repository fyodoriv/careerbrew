  question: What is a logarithmic scale, and what does logarithmic growth mean?
  answer: On a logarithmic scale, equal steps represent equal multiplications (1, 10, 100, 1000) rather
    than equal additions. Logarithmic growth, O(log n), means the cost goes up by a constant each time
    the input multiplies, as in binary search, which needs about 30 steps for a billion items.
  topic: computer science
  tags:
  - math
  - complexity
  - logarithms
  - big-o
  explanation: "## In plain words\nA logarithm answers \"how many times must I multiply the base to reach\
    \ this number?\" log2(8) = 3 because 2 x 2 x 2 = 8. A log scale on a chart spaces 1, 10, 100, and\
    \ 1000 evenly, so data that spans huge ranges fits on one picture. In algorithms, logarithmic means\
    \ \"each step cuts the problem by a constant factor\".\n\n## How it works\n- `log_b(n) = k` means\
    \ `b^k = n`.\n- Base changes only a constant factor (`log2 n` is about `3.32 * log10 n`), so Big O\
    \ drops the base: O(log n).\n- **O(log n) algorithms** halve (or divide) the remaining work each step:\
    \ binary search, balanced BST operations, heap push and pop, exponentiation by squaring.\n- Growth\
    \ is very slow: n = 1,000 needs about 10 halvings, 1,000,000 about 20, 1,000,000,000 about 30.\n-\
    \ **Log scales in charts**: useful for latency percentiles, data covering several orders of magnitude,\
    \ or exponential growth (which becomes a straight line).\n- Related: O(n log n) is the cost of efficient\
    \ comparison sorting.\n\n## Example\n```python\nn, steps = 1_000_000_000, 0\nwhile n > 1:\n    n //=\
    \ 2\n    steps += 1\nprint(steps)  # 29\n```\nDoubling the input from one to two billion adds only\
    \ one more step.\n\n## Common mistakes\n- Thinking O(log n) and O(n) are close; for a billion items\
    \ it is 30 versus a billion.\n- Worrying about the log base in Big O.\n- Reading a log-scale chart\
    \ as linear and misjudging how big the differences are.\n- Calling an algorithm O(log n) when each\
    \ step only removes one element, which is O(n).\n\n## In the interview\nRecognize the pattern \"the\
    \ search space shrinks by a constant fraction each step\" and say O(log n). Be ready to explain why\
    \ a balanced tree has height about log2(n) and why binary search on a range of answers is O(log(range)).\
    \ When discussing metrics, mention log scales for latency distributions.\n"
