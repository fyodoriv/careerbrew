  question: What is the order of common Big O complexities from fastest to slowest?
  answer: 'From best to worst scaling: O(1), O(log n), O(sqrt n), O(n), O(n log n), O(n^2), O(n^3), O(2^n),
    O(n!). Algorithms on the left scale well; those on the right become unusable even for modest n.'
  topic: computer science
  tags:
  - big-o
  - complexity
  - algorithms
  explanation: '## In plain words

    Big O describes how running time or memory grows as the input grows. Ordering the common classes tells
    you at a glance whether an approach will survive a million items or choke at thirty.


    ## How it works

    Best to worst, with typical examples:

    - `O(1)` constant: array index, hash-map lookup on average.

    - `O(log n)` logarithmic: binary search, balanced-tree operations.

    - `O(sqrt n)`: trial-division primality check.

    - `O(n)` linear: one pass over the data.

    - `O(n log n)`: efficient comparison sorts (merge sort, heap sort).

    - `O(n^2)` quadratic: nested loops over all pairs, bubble sort.

    - `O(n^3)` cubic: naive matrix multiplication, Floyd-Warshall.

    - `O(2^n)` exponential: all subsets, naive recursive Fibonacci.

    - `O(n!)` factorial: all permutations, brute-force travelling salesman.


    Rough limits for about one second of work (around 10^8 simple steps): n up to about 10^7-10^8 for
    `O(n)`, about 10^6 for `O(n log n)`, about 10^4 for `O(n^2)`, about 25 for `O(2^n)`, about 11 for
    `O(n!)`.


    ## Example

    For n = 1,000,000:

    - `O(log n)`: about 20 steps.

    - `O(n)`: 10^6 steps.

    - `O(n log n)`: about 2 x 10^7 steps.

    - `O(n^2)`: 10^12 steps, which is hours of compute.


    That gap is why replacing a nested loop with a hash map or a sort often turns a timeout into a pass.


    ## Common mistakes

    - Treating Big O as exact time; constants and hardware matter for small n.

    - Saying `O(n log n)` is "between `O(n)` and `O(n^2)`" without knowing it is much closer to linear
    in practice.

    - Forgetting that hash lookups are `O(1)` average but `O(n)` worst case.

    - Multiplying when you should add (two separate loops are `O(n + m)`, not `O(nm)`).


    ## In the interview

    Use the input size limits to guess the target complexity: if n is up to 10^5, aim for `O(n log n)`
    or better. Interviewers like candidates who state the brute-force complexity, then improve it step
    by step. Be ready to explain amortised costs (dynamic array append) and the difference between average
    and worst case.

    '
