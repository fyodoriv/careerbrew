  question: What does O(log n) mean?
  answer: 'O(log n) means the work grows with the logarithm of the input size: each step cuts the remaining
    problem by a constant factor, usually half. Doubling n adds only one more step, so a billion items
    need about 30 steps. Binary search and balanced tree operations are O(log n).'
  topic: computer science
