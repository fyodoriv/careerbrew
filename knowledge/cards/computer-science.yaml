  question: What is a greedy algorithm?
  answer: A greedy algorithm builds a solution step by step, always taking the choice that looks best
    right now and never revisiting it. It is fast and simple, but it is only correct when the problem
    has the greedy-choice property and optimal substructure, which you should prove or check.
  topic: computer science
  tags:
  - algorithms
  - greedy
  - optimization
  explanation: "## In plain words\nGreedy means \"take the best-looking option at each step and move on\"\
    . Giving change with as few coins as possible, you take the largest coin that fits, then repeat. Sometimes\
    \ this local thinking gives the best overall answer; sometimes it does not.\n\n## How it works\n-\
    \ Define what \"best now\" means (largest value, earliest end time, cheapest edge).\n- Often sort\
    \ the input by that rule first, so the algorithm costs O(n log n).\n- Make the choice, shrink the\
    \ problem, repeat; no backtracking.\n- It is correct when:\n  - **Greedy-choice property**: some optimal\
    \ solution starts with the greedy choice.\n  - **Optimal substructure**: after that choice, the rest\
    \ is a smaller version of the same problem.\n- The usual proof is an exchange argument: take any optimal\
    \ solution and show you can swap in the greedy choice without making it worse.\n- Classic correct\
    \ greedy algorithms: interval scheduling by earliest end time, Huffman coding, Dijkstra (non-negative\
    \ weights), Prim and Kruskal for minimum spanning trees.\n\n## Example\nPick the most non-overlapping\
    \ meetings:\n```python\ndef max_meetings(intervals):\n    count, end = 0, float(\"-inf\")\n    for\
    \ s, e in sorted(intervals, key=lambda x: x[1]):\n        if s >= end:\n            count, end = count\
    \ + 1, e\n    return count\n\nprint(max_meetings([(1, 4), (3, 5), (0, 6), (5, 7), (8, 9)]))  # 3\n\
    ```\nCounterexample for coins: with coins 1, 3, 4 and amount 6, greedy picks 4 + 1 + 1 (three coins),\
    \ but 3 + 3 uses two. That problem needs dynamic programming.\n\n## Common mistakes\n- Assuming greedy\
    \ works without checking a counterexample.\n- Sorting by the wrong key, such as start time or length\
    \ instead of end time for interval scheduling.\n- Confusing greedy with dynamic programming, which\
    \ considers all choices for each subproblem.\n\n## In the interview\nState the greedy rule, then justify\
    \ it briefly with an exchange argument, or test small cases to find a counterexample. If greedy fails,\
    \ say so and move to dynamic programming. Give time complexity, usually dominated by the sort.\n"
