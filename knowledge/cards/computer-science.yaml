  question: What makes a good hash function?
  answer: A good hash function is deterministic, fast, and spreads keys uniformly across the output range
    so similar keys land far apart, with few collisions. For security uses it also must be hard to invert
    or to find collisions for, which is a separate and slower class of functions.
  topic: computer science
  tags:
  - hashing
  - data-structures
  - hash-map
  - algorithms
  explanation: "## In plain words\nA hash function turns a key into a number. For a hash table, the ideal\
    \ function behaves like a fair random assignment: every bucket gets about the same number of keys,\
    \ and keys that look alike (such as \"user1\" and \"user2\") end up in unrelated buckets.\n\n## How\
    \ it works\nProperties to aim for:\n- **Deterministic**: the same key always gives the same hash,\
    \ including across runs if hashes are stored.\n- **Uniform**: outputs are spread evenly, so buckets\
    \ fill evenly.\n- **Avalanche effect**: changing one input bit flips about half the output bits.\n\
    - **Fast**: computed in time proportional to the key length.\n- **Uses the whole key**: hashing only\
    \ the first few characters makes keys with common prefixes collide.\n- **Consistent with equality**:\
    \ if `a == b`, then `hash(a) == hash(b)`.\n- For tables exposed to untrusted input, a seeded hash\
    \ (such as SipHash) prevents attackers from crafting many colliding keys.\n- Cryptographic hashes\
    \ (SHA-256) add preimage and collision resistance but are slower than needed for a hash table.\n\n\
    ## Example\nA bad hash for strings is the sum of character codes: \"abc\" and \"cba\" collide, and\
    \ so do all anagrams. A better simple choice is a polynomial hash:\n```python\ndef poly_hash(s, base=31,\
    \ mod=2**61 - 1):\n    h = 0\n    for ch in s:\n        h = (h * base + ord(ch)) % mod\n    return\
    \ h\n\nprint(poly_hash(\"abc\") == poly_hash(\"cba\"))  # False\n```\n\n## Common mistakes\n- Overriding\
    \ equality without overriding the hash, so equal objects land in different buckets.\n- Using a table\
    \ size that shares factors with a pattern in the keys (for example, a size of 100 when keys are multiples\
    \ of 10); prime sizes or good mixing avoid this.\n- Using a fast non-cryptographic hash for passwords\
    \ or signatures.\n\n## In the interview\nList the properties, show a weak and a better example, and\
    \ separate hash-table hashes (MurmurHash, xxHash, SipHash) from cryptographic hashes (SHA-2, SHA-3).\
    \ Expect follow-ups on collision handling and load factor, and on hash-flooding attacks.\n"
