  question: What is depth-first search (DFS) on a graph or tree?
  answer: DFS explores as far as possible along one branch before backtracking, using recursion or an
    explicit stack. It visits every reachable node in O(V + E) time and is the basis for cycle detection,
    topological sort, connected components, and backtracking.
  topic: computer science
  tags:
  - algorithms
  - graphs
  - dfs
  - trees
  explanation: '## In plain words

    DFS is how you would explore a maze with one hand on the wall: keep walking down a corridor until
    you hit a dead end, then go back to the last junction and try the next unexplored path. It goes deep
    first, wide later.


    ## How it works

    - Start at a node and mark it visited.

    - For each unvisited neighbour, recursively run DFS on it.

    - When a node has no unvisited neighbours, return (backtrack) to the caller.

    - The call stack (or an explicit stack) remembers where to come back to.

    - On trees, DFS has three classic orders: pre-order (node, left, right), in-order (left, node, right),
    post-order (left, right, node).

    - Time is O(V + E). Space is O(V) for the visited set plus O(depth) for the stack, which can be O(V)
    on a long chain.


    ## Example

    Counting islands in a grid of `1` (land) and `0` (water): loop over cells; when you find unvisited
    land, increment the count and DFS to mark the whole island visited. Each cell is visited once, so
    it is O(rows x cols).


    For the graph A-B, A-C, B-D, DFS from A might visit A, B, D, then backtrack and visit C.


    ## Common mistakes

    - Forgetting the visited set on graphs with cycles, which causes infinite recursion.

    - Deep recursion overflowing the stack (Python''s default limit is about 1000 frames); switch to an
    explicit stack.

    - Assuming DFS gives shortest paths; it does not.

    - Mixing up the tree traversal orders.


    ## In the interview

    Explain why you chose DFS: you need to explore all paths, detect cycles, compute something bottom-up
    (post-order), or backtrack (permutations, N-Queens). Mention both recursive and iterative forms and
    the stack-depth risk. Expect follow-ups on detecting cycles in a directed graph with three colours
    (unvisited, in progress, done).

    '
