- id: kb-aefdda5cb383
  question: What is caching?
  answer: Caching keeps copies of frequently used or expensive-to-get data in a faster layer, such as
    memory, close to where it is needed, so repeated reads skip the slow source. The trade-offs are freshness
    (stale data), memory cost, and the complexity of invalidation and eviction.
  topic: computer science
  tags:
  - caching
  - performance
  - system-design
  explanation: "## In plain words\nA cache is a small, fast shelf next to you holding the things you use\
    \ most, so you do not walk to the warehouse every time. CPUs, browsers, CDNs, databases, and applications\
    \ all use caches at different layers.\n\n## How it works\n- **Hit**: the data is in the cache and\
    \ returns quickly. **Miss**: fetch from the source, then usually store it.\n- **Hit ratio** = hits\
    \ / total reads; it decides how much the cache helps.\n- **Read patterns**:\n  - Cache-aside: the\
    \ app checks the cache, and on a miss reads the database and fills the cache.\n  - Read-through: the\
    \ cache itself loads from the database on a miss.\n- **Write patterns**:\n  - Write-through: write\
    \ to cache and database together (consistent, slower writes).\n  - Write-back: write to cache, flush\
    \ later (fast, risk of loss).\n  - Write-around: write to the database only and let reads fill the\
    \ cache.\n- **Freshness**: a TTL (time to live) expires entries; explicit invalidation deletes them\
    \ on change.\n- **Eviction** when full: LRU, LFU, FIFO, or random.\n\n## Example\n```python\nimport\
    \ time\ncache = {}\n\ndef get_user(uid, ttl=60):\n    hit = cache.get(uid)\n    if hit and time.time()\
    \ - hit[1] < ttl:\n        return hit[0]\n    user = {\"id\": uid}            # stand-in for a slow\
    \ database read\n    cache[uid] = (user, time.time())\n    return user\n```\nIf a database read takes\
    \ 20 ms and a cache read 0.5 ms, a 90% hit ratio cuts average latency to about 0.9 * 0.5 + 0.1 * 20.5\
    \ = 2.5 ms.\n\n## Common mistakes\n- Caching without an invalidation plan, then serving stale data.\n\
    - **Cache stampede**: a popular key expires and thousands of requests hit the database at once; use\
    \ locking, request coalescing, or jittered TTLs.\n- Caching data that is rarely reused, wasting memory.\n\
    - Caching per-user private data under a shared key.\n\n## In the interview\nState where the cache\
    \ sits (client, CDN, app memory, Redis), the read and write pattern, TTL and invalidation, eviction,\
    \ and what happens on a cache failure. Mention the well-known saying that cache invalidation is one\
    \ of the hard problems in computing.\n"
