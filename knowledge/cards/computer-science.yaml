- id: kb-b874e326f910
  question: What is the LRU (least recently used) cache eviction policy?
  answer: When a cache is full, LRU evicts the entry that was used longest ago, betting that recently
    used data will be used again soon. A hash map plus a doubly linked list gives O(1) get and put.
  topic: computer science
  tags:
  - caching
  - lru
  - eviction
  - data-structures
  explanation: "## In plain words\nA cache has limited room. When it is full and a new item arrives, something\
    \ must go. LRU (least recently used) throws out the item nobody has touched for the longest time,\
    \ like clearing the dusty books off your desk first.\n\n## How it works\n- Keep a hash map from key\
    \ to a node in a doubly linked list.\n- The list is ordered by recency: most recently used at the\
    \ front, least recently used at the back.\n- `get(key)`: look up the node in the map, move it to the\
    \ front, return its value.\n- `put(key, value)`: update or insert the node at the front; if the size\
    \ exceeds capacity, remove the back node and delete its key from the map.\n- Both operations are O(1)\
    \ time; space is O(capacity).\n\n## Example\n```python\nfrom collections import OrderedDict\n\nclass\
    \ LRUCache:\n    def __init__(self, capacity):\n        self.cap, self.data = capacity, OrderedDict()\n\
    \n    def get(self, key):\n        if key not in self.data:\n            return -1\n        self.data.move_to_end(key)\n\
    \        return self.data[key]\n\n    def put(self, key, value):\n        self.data[key] = value\n\
    \        self.data.move_to_end(key)\n        if len(self.data) > self.cap:\n            self.data.popitem(last=False)\n\
    \nc = LRUCache(2)\nc.put(1, \"a\"); c.put(2, \"b\"); c.get(1); c.put(3, \"c\")\nprint(c.get(2))  #\
    \ -1, key 2 was least recently used\n```\n\n## Common mistakes\n- Using a plain list and scanning\
    \ it, which makes every access O(n).\n- Forgetting that a `get` also counts as a use and must update\
    \ recency.\n- Removing the node from the list but not from the map (or the reverse).\n\n## In the\
    \ interview\nName the two structures and why each is needed: the map for O(1) lookup, the list for\
    \ O(1) reordering and eviction. Expect follow-ups: thread safety (a lock or sharded caches), LFU (least\
    \ frequently used) as an alternative, and approximate LRU as used by Redis, which samples a few keys\
    \ instead of keeping an exact list. Mention that LRU does badly on one-off scans that flush useful\
    \ data.\n"
