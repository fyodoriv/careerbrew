- id: kb-1bd65dbd1c29
  question: What is a cache hit?
  answer: A cache hit happens when requested data is found in the cache, so it is served quickly without
    going to the slower source such as a database or main memory. The hit rate (hits divided by total
    requests) is the key measure of how well a cache works.
  topic: computer science
  tags:
  - caching
  - performance
  - system-design
  explanation: '## In plain words

    A cache hit is when the thing you need is already within arm''s reach. Like finding milk in your own
    fridge instead of walking to the shop, it saves the trip to the slow, distant source.


    ## How it works

    - A request first checks the cache using a key.

    - If the key is present (and not expired), that is a hit: return the cached value immediately.

    - Otherwise it is a miss: fetch from the source, return it, and usually store it for next time.

    - **Hit rate** = hits / (hits + misses). Average access time is approximately `hit_rate x cache_time
    + (1 - hit_rate) x source_time`.

    - Hit rate depends on cache size, eviction policy, TTLs, key design, and how skewed the access pattern
    is (a few hot keys get most traffic).

    - The idea applies at every level: CPU caches, OS page cache, application caches such as Redis, CDNs,
    and browser caches.


    ## Example

    Suppose a Redis read takes 1 ms and a database query takes 20 ms.

    - At a 90% hit rate: `0.9 x 1 + 0.1 x 20 = 2.9 ms` average.

    - At a 99% hit rate: `0.99 x 1 + 0.01 x 20 = 1.19 ms` average.

    Going from 90% to 99% cuts average latency by more than half and reduces database load tenfold (from
    10% of requests to 1%).


    ## Common mistakes

    - Reporting only hit rate while ignoring stale data served on hits.

    - Measuring hit rate on a warm-up period and assuming it holds in production.

    - Forgetting that a hit on stale data can be worse than a miss for correctness-critical reads.


    ## In the interview

    Define it in one sentence, then talk about hit rate as the metric that matters and how you would raise
    it: bigger cache, better keys, longer TTLs, pre-warming. Interviewers in system design want the link
    between hit rate, latency, and load on the backing store, plus the staleness trade-off.

    '
