  answer: 'Write a recursive function that marks a node visited and recurses into each unvisited neighbour,
    or use an explicit stack: push the start, then pop, skip if visited, mark, and push its neighbours.
    Both run in O(V + E) time and O(V) space.'
  topic: computer science
