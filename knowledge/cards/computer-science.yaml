  question: How do you find the middle node of a linked list?
  answer: 'Use slow and fast pointers: move slow one step and fast two steps; when fast reaches the end,
    slow is at the middle. This takes one pass, O(n) time and O(1) space.'
  topic: computer science
  tags:
  - linked-list
  - two-pointers
  explanation: "## In plain words\nIf two people walk the same corridor and one walks twice as fast, when\
    \ the fast one reaches the end the slow one is halfway. The fast and slow pointer trick uses exactly\
    \ that idea, so you do not need to count the list first.\n\n## How it works\n- Start both `slow` and\
    \ `fast` at the head.\n- While `fast` and `fast.next` exist, move `slow = slow.next` and `fast = fast.next.next`.\n\
    - When the loop ends, `slow` is the middle.\n- With an even number of nodes this returns the second\
    \ of the two middle nodes; start `fast` at `head.next` to get the first one instead.\n- Alternative:\
    \ count the length in one pass, then walk `length // 2` steps in a second pass. Same complexity, two\
    \ passes.\n- Time `O(n)`, space `O(1)`.\n\n## Example\n```python\nclass Node:\n    def __init__(self,\
    \ val, next=None):\n        self.val, self.next = val, next\n\ndef middle(head):\n    slow = fast\
    \ = head\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n    return\
    \ slow\n\nlst = Node(1, Node(2, Node(3, Node(4, Node(5)))))\nprint(middle(lst).val)  # 3\n```\n\n\
    ## Common mistakes\n- Not deciding which middle to return for even-length lists.\n- Dereferencing\
    \ `fast.next.next` without checking `fast.next`.\n- Copying the list into an array, which uses `O(n)`\
    \ extra space.\n\n## In the interview\nClarify the even-length case before coding. This is often a\
    \ building block: splitting a list for merge sort, checking whether a list is a palindrome (find middle,\
    \ reverse second half, compare), or reordering a list. Mentioning those links shows you see the pattern,\
    \ not just the puzzle.\n"
