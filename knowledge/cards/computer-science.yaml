- id: kb-49b69168fd8d
  question: What is the Mixin pattern?
  answer: A mixin is a reusable bundle of methods that is copied or composed into a class to add behaviour,
    without being a parent in a single-inheritance chain. It enables sharing features across unrelated
    classes, at the risk of name clashes and unclear origins of methods.
  topic: computer science
  tags:
  - design-patterns
  - oop
  - composition
  - javascript
  explanation: "## In plain words\nInheritance says \"a Dog is an Animal\". A mixin says \"this class\
    \ can also do X\", like adding a flavour to ice cream. You can stir several mixins into one class,\
    \ which is handy when the same ability (serialising, emitting events) is needed by classes that are\
    \ otherwise unrelated.\n\n## How it works\n- A mixin defines methods but is not meant to be used on\
    \ its own.\n- **JavaScript:** copy methods onto a prototype with `Object.assign(Target.prototype,\
    \ mixin)`, or use a function that takes a base class and returns a subclass: `const Serializable =\
    \ Base => class extends Base { ... }`.\n- **Python:** mixins are small classes used with multiple\
    \ inheritance, for example `class Report(JsonMixin, Base)`; method resolution order decides which\
    \ method wins.\n- Many languages have a built-in form: Ruby modules, Scala and Rust traits, PHP traits.\n\
    - The goal is horizontal reuse without deep class hierarchies.\n\n## Example\n```python\nimport json\n\
    \nclass JsonMixin:\n    def to_json(self):\n        return json.dumps(self.__dict__)\n\nclass Point(JsonMixin):\n\
    \    def __init__(self, x, y):\n        self.x, self.y = x, y\n\nclass Color(JsonMixin):\n    def\
    \ __init__(self, name):\n        self.name = name\n\nprint(Point(1, 2).to_json())    # {\"x\": 1,\
    \ \"y\": 2}\nprint(Color(\"red\").to_json())  # {\"name\": \"red\"}\n```\n\n## Common mistakes\n-\
    \ Mixins that keep their own state and depend on hidden attributes of the target class.\n- Name collisions\
    \ between mixins, silently resolved by order.\n- Overusing mixins until it is hard to know where a\
    \ method comes from.\n- Confusing mixins with plain inheritance or with composition through fields.\n\
    \n## In the interview\nExplain the use case (shared behaviour across unrelated classes) and the risks\
    \ (collisions, implicit coupling). Interviewers like a comparison with composition (\"has-a\" with\
    \ a helper object), which is often clearer, and with interfaces or traits in typed languages. In React\
    \ history, mention that mixins were replaced by higher-order components and then hooks because of\
    \ these problems.\n"
