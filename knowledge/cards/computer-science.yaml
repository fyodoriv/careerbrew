    ## Common mistakes\n- Using a matrix for a large sparse graph (a million nodes need 10^12 cells).\n\
    - Adding undirected edges in one direction only.\n- Forgetting isolated nodes that never appear in\
    \ an edge.\n- Writing a heavy class when a dictionary is enough in an interview.\n\n## In the interview\n\
    Say which representation you chose and why, in one sentence: \"sparse graph, so an adjacency list.\"\
    \ In LeetCode problems the input is often an edge list or a grid; build the adjacency list first.\
