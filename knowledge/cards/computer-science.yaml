- id: kb-080e9b1b2a58
  question: What is the Module pattern?
  answer: The Module pattern groups related code into a unit with a private inner scope and a small public
    interface. In older JavaScript it used an immediately invoked function returning an object; today,
    ES modules provide the same encapsulation with import and export.
  topic: computer science
  tags:
  - design-patterns
  - javascript
  - encapsulation
  - modules
  explanation: "## In plain words\nA module is like a vending machine: you see the buttons (public interface)\
    \ but not the gears inside (private state). The Module pattern lets you hide helper variables and\
    \ functions so other code cannot depend on them or change them by accident.\n\n## How it works\n-\
    \ **Classic JavaScript (before ES2015):** wrap code in a function that runs immediately (an IIFE).\
    \ Variables inside are private through closures; return an object exposing only chosen functions.\n\
    - **Revealing module:** define everything privately, then return an object that maps public names\
    \ to private functions.\n- **ES modules:** each file has its own scope; only `export`ed names are\
    \ visible, and consumers use `import`. Modules are singletons: the file runs once and every importer\
    \ shares the same instance.\n- Benefits: encapsulation, namespacing (no global pollution), clearer\
    \ dependencies.\n- Other languages have equivalents: Python modules, Java packages with access modifiers.\n\
    \n## Example\n```javascript\n// Classic module with a closure\nconst counter = (function () {\n  let\
    \ count = 0;               // private\n  function change(by) { count += by; }\n  return {\n    inc:\
    \ () => change(1),\n    value: () => count,\n  };\n})();\n\ncounter.inc();\ncounter.inc();\nconsole.log(counter.value());\
    \ // 2\nconsole.log(counter.count);   // undefined\n```\nWith ES modules the same idea is a file with\
    \ `let count = 0;` and `export function inc() { ... }`.\n\n## Common mistakes\n- Thinking private\
    \ closure state is shared per import call; module state is shared by everyone.\n- Exposing internals\
    \ \"just for tests\", which breaks encapsulation.\n- Confusing CommonJS (`require`) and ES modules\
    \ semantics, such as live bindings.\n- Creating circular imports that see partially initialised modules.\n\
    \n## In the interview\nDescribe both the historical IIFE form and modern ES modules, and why the pattern\
    \ existed (no block scope or module system in early JavaScript). Interviewers check understanding\
    \ of closures and encapsulation. Mention trade-offs: hidden state is harder to test or reset, and\
    \ module-level singletons can surprise people in tests.\n"
