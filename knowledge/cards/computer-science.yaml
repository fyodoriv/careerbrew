  question: Why is Floyd's tortoise and hare algorithm useful?
  answer: It detects a cycle in a linked list or any sequence generated by repeatedly applying a function,
    using two pointers moving at speeds one and two, in O(n) time and O(1) extra memory. After they meet,
    resetting one pointer to the start and moving both one step at a time finds where the cycle begins.
  topic: computer science
  tags:
  - algorithms
  - linked-list
  - cycle-detection
  - two-pointers
  explanation: "## In plain words\nTwo runners on a track, one twice as fast as the other. If the track\
    \ is a straight road, the fast one reaches the end. If it loops, the fast one eventually laps the\
    \ slow one and they meet. That is how you can tell a loop exists without remembering every place you\
    \ have been.\n\n## How it works\n- **Why it is needed**: the simple approach stores every visited\
    \ node in a hash set, which costs O(n) memory. Floyd's method uses two pointers and O(1) memory.\n\
    - **Phase 1, detect**: `slow` moves one step, `fast` two. If `fast` reaches null, there is no cycle.\
    \ If they meet, there is a cycle. Inside the cycle the gap closes by one each step, so they meet within\
    \ one lap.\n- **Phase 2, find the start**: put one pointer back at the head, leave the other at the\
    \ meeting point, and move both one step at a time. They meet at the first node of the cycle. Reason:\
    \ if the distance from head to cycle start is `mu` and the cycle length is `lam`, the meeting point\
    \ sits a distance from the start that is congruent to `-mu` modulo `lam`.\n- **Cycle length**: from\
    \ the meeting point, count steps until returning to it.\n- Time O(n), space O(1).\n\n## Example\n\
    ```python\nclass Node:\n    def __init__(self, v):\n        self.v, self.next = v, None\n\nnodes =\
    \ [Node(i) for i in range(6)]\nfor a, b in zip(nodes, nodes[1:]):\n    a.next = b\nnodes[-1].next\
    \ = nodes[2]           # 5 -> 2 makes a cycle\n\ndef cycle_start(head):\n    slow = fast = head\n\
    \    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n        if slow is\
    \ fast:\n            slow = head\n            while slow is not fast:\n                slow, fast\
    \ = slow.next, fast.next\n            return slow\n    return None\n\nprint(cycle_start(nodes[0]).v)\
    \  # 2\n```\n\n## Common mistakes\n- Checking `fast.next.next` without first checking `fast` and `fast.next`,\
    \ causing a null error.\n- Comparing node values instead of node identity.\n- Starting phase 2 from\
    \ the wrong place.\n\n## In the interview\nIt shows up as \"linked list cycle\", \"find the duplicate\
    \ number\" (treat array values as next pointers), and \"happy number\" (repeat a function until it\
    \ reaches 1 or loops). Explain the meeting argument briefly, and compare with the hash-set approach:\
    \ simpler, but O(n) memory. Brent's algorithm is a faster alternative with the same memory.\n"
