- id: kb-9378a7961fba
  question: What is the Open-Closed Principle in SOLID?
  answer: 'The Open-Closed Principle says software entities should be open for extension but closed for
    modification: you add new behaviour by adding code (new classes or functions behind an abstraction)
    rather than editing existing, tested code. It is usually achieved with polymorphism, strategies, or
    plug-in registries.'
  topic: computer science
  tags:
  - solid
  - oop
  - design-principles
  explanation: "## In plain words\nWhen a new requirement arrives, the safest change is one that does\
    \ not touch code that already works. The Open-Closed Principle asks you to design so that new cases\
    \ slot in like new apps on a phone: you install them, you do not rewrite the operating system.\n\n\
    ## How it works\n- Identify the part that varies (payment methods, export formats, discount rules).\n\
    - Put it behind an abstraction: an interface, a base class, or a function type.\n- Existing code depends\
    \ on the abstraction, not on concrete cases.\n- To add a case, write a new implementation and register\
    \ it; the core logic stays untouched.\n- Signals of a violation: a growing `if/elif` or `switch` on\
    \ type that you must edit for every new case.\n- Do not over-apply it: only add the abstraction when\
    \ variation is real or clearly coming, otherwise it is speculative complexity.\n\n## Example\nBefore\
    \ (must edit for every shape):\n```python\ndef area(shape):\n    if shape[\"type\"] == \"circle\"\
    :\n        return 3.14159 * shape[\"r\"] ** 2\n    if shape[\"type\"] == \"square\":\n        return\
    \ shape[\"side\"] ** 2\n```\nAfter (add shapes without editing existing code):\n```python\nclass Circle:\n\
    \    def __init__(self, r): self.r = r\n    def area(self): return 3.14159 * self.r ** 2\n\nclass\
    \ Square:\n    def __init__(self, side): self.side = side\n    def area(self): return self.side **\
    \ 2\n\ndef total_area(shapes):\n    return sum(s.area() for s in shapes)\n\nprint(total_area([Circle(1),\
    \ Square(2)]))  # 7.14159\n```\n\n## Common mistakes\n- Reading it as \"never change existing code\"\
    ; bug fixes and refactors are fine.\n- Creating interfaces for everything up front.\n- Confusing it\
    \ with the Liskov Substitution Principle (subtypes must be usable wherever the base type is).\n\n\
    ## In the interview\nDefine it in one sentence, then show the switch-statement example and its refactor.\
    \ Interviewers like nuance: the principle reduces regression risk but adds indirection, so apply it\
    \ where change is likely. Connect it to related patterns: Strategy, plug-ins, and the other SOLID\
    \ principles.\n"
