  question: What is a Bloom filter?
  answer: 'A Bloom filter is a compact probabilistic set that answers ''definitely not present'' or ''probably
    present''. It uses a bit array and k hash functions: adding sets k bits, and a lookup checks them.
    It has no false negatives, a tunable false-positive rate, and standard versions cannot delete items.'
  topic: computer science
  tags:
  - bloom-filter
  - probabilistic
  - data-structures
  - system-design
  explanation: "## In plain words\nA Bloom filter is a quick bouncer at the door who can say \"you are\
    \ definitely not on the list\" with certainty, but can only say \"you are probably on the list\".\
    \ In exchange for that small uncertainty it uses far less memory than storing the actual list.\n\n\
    ## How it works\n- Start with an array of m bits, all 0, and choose k independent hash functions.\n\
    - **Add x:** compute the k hashes, map each to a position in the array, and set those bits to 1.\n\
    - **Check x:** if any of the k bits is 0, x was never added. If all are 1, x was probably added; the\
    \ bits might have been set by other items (a false positive).\n- The false-positive rate grows as\
    \ the filter fills. For n items, a good choice is `k = (m / n) ln 2`, giving about 1% false positives\
    \ at roughly 10 bits per item.\n- Deleting is not supported, because clearing a bit could remove other\
    \ items; counting Bloom filters use small counters instead.\n- Time `O(k)` per operation; space `O(m)`\
    \ bits, independent of item size.\n\n## Example\n```python\nimport hashlib\n\nclass Bloom:\n    def\
    \ __init__(self, m=1000, k=3):\n        self.m, self.k, self.bits = m, k, [0] * m\n    def _positions(self,\
    \ item):\n        for i in range(self.k):\n            h = hashlib.sha256(f\"{i}:{item}\".encode()).hexdigest()\n\
    \            yield int(h, 16) % self.m\n    def add(self, item):\n        for p in self._positions(item):\n\
    \            self.bits[p] = 1\n    def might_contain(self, item):\n        return all(self.bits[p]\
    \ for p in self._positions(item))\n\nb = Bloom()\nb.add(\"alice\")\nprint(b.might_contain(\"alice\"\
    ), b.might_contain(\"bob\"))  # True False (almost certainly)\n```\n\n## Common mistakes\n- Saying\
    \ Bloom filters can have false negatives; they cannot.\n- Trying to delete items from a standard Bloom\
    \ filter.\n- Not sizing the filter for the expected number of items, so false positives explode.\n\
    - Using it where an exact answer is required without a fallback check.\n\n## In the interview\nGive\
    \ practical uses: databases and LSM-tree storage engines skip disk reads for keys that are definitely\
    \ absent; caches avoid lookups for unknown keys; web crawlers track seen URLs. Interviewers like the\
    \ trade-off (memory vs a small, tunable error) and the pattern \"check the Bloom filter first, then\
    \ the real store only on a maybe\".\n"
