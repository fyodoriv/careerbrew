- id: kb-cb88e4831740
  question: What is a hash function?
  answer: A hash function maps input of any size to a fixed-size value, deterministically. Hash tables
    use fast, well-spread hashes to pick a bucket; cryptographic hashes such as SHA-256 add one-way and
    collision-resistance guarantees for integrity checks and signatures.
  topic: computer science
  tags:
  - hashing
  - data-structures
  - cryptography
  explanation: "## In plain words\nA hash function is a machine that turns any data into a short fixed-size\
    \ number, like a fingerprint. The same data always gives the same fingerprint. Different data usually\
    \ gives different fingerprints, but since there are infinitely many inputs and only finitely many\
    \ outputs, some inputs must share one (a collision).\n\n## How it works\n- **Deterministic**: same\
    \ input, same output.\n- **Fixed output size**: for example 64 bits, or 256 bits for SHA-256.\n- **Uses**:\n\
    \  - Hash tables: `index = hash(key) % table_size` gives O(1) average lookup.\n  - Checksums and integrity:\
    \ compare hashes to detect changed files.\n  - Deduplication and content addressing: Git names objects\
    \ by their hash.\n  - Sharding: route a key to a server, often with consistent hashing.\n  - Bloom\
    \ filters: several hashes mark bits for fast membership tests.\n- **Two families**:\n  - Non-cryptographic\
    \ (MurmurHash, xxHash): very fast, good spread, no security.\n  - Cryptographic (SHA-256, SHA-3):\
    \ hard to reverse and to find collisions for; slower.\n\n## Example\n```python\nimport hashlib\n\n\
    table_size = 8\nfor key in [\"apple\", \"banana\", \"cherry\"]:\n    h = int(hashlib.md5(key.encode()).hexdigest(),\
    \ 16)\n    print(key, h % table_size)  # each key gets a bucket from 0 to 7\n```\nMD5 is used here\
    \ only to get a hash that is stable across runs; it is broken for security uses.\n\n## Common mistakes\n\
    - Calling hashing encryption; you cannot decrypt a hash.\n- Believing a hash is unique; collisions\
    \ always exist and must be handled.\n- Using fast hashes such as plain SHA-256 or MD5 to store passwords;\
    \ use bcrypt, scrypt, or Argon2 with a salt.\n- Relying on Python's built-in `hash()` for strings\
    \ across processes; it is randomized per run.\n\n## In the interview\nDefine it, give two or three\
    \ uses, and separate the two families. Expect follow-ups on collision handling in hash maps, what\
    \ makes a hash function good (uniform, fast, avalanche), and password storage.\n"
