  question: What is a hash map (hash table), and what are its pros and cons?
  answer: A hash map stores key-value pairs in an array of buckets, using a hash function to turn each
    key into a bucket index. Lookups, inserts, and deletes are O(1) on average. The trade-offs are no
    ordering, extra memory, O(n) worst case when many keys collide, and occasional resize costs.
  topic: computer science
  tags:
  - hash-map
  - hash-table
  - data-structures
  explanation: "## In plain words\nA hash map is like a coat check: you hand over a coat, get a ticket\
    \ number computed from it, and later use the number to go straight to the right hook. A hash function\
    \ computes that number from the key, so you skip searching through everything.\n\n## How it works\n\
    - Compute `hash(key)` and map it to a bucket: `index = hash % capacity`.\n- Store the pair in that\
    \ bucket. If two keys land in the same bucket (a collision), resolve it with chaining (a list per\
    \ bucket) or open addressing (probe for another slot).\n- **Load factor** = items / buckets. When\
    \ it passes a threshold (often around 0.75), resize to about double and rehash everything. Each resize\
    \ is `O(n)`, but amortised over inserts it stays `O(1)`.\n- Keys must be hashable and immutable in\
    \ practice, with `equals` and `hashCode` consistent (equal keys must have equal hashes).\n\n**Pros:**\
    \ average `O(1)` operations; flexible keys; the go-to tool for counting, deduplication, caching, and\
    \ indexing.\n**Cons:** no sorted order (use a tree map for that); worst case `O(n)` with bad hashes\
    \ or adversarial input; memory overhead from empty buckets; iteration order may be arbitrary depending\
    \ on the language.\n\n## Example\nTwo-sum in `O(n)` with a hash map:\n```python\ndef two_sum(nums,\
    \ target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target - x in seen:\n    \
    \        return [seen[target - x], i]\n        seen[x] = i\n    return None\n\nprint(two_sum([2, 7,\
    \ 11, 15], 9))  # [0, 1]\n```\nWithout the map, checking every pair would be `O(n^2)`.\n\n## Common\
    \ mistakes\n- Saying lookups are always `O(1)`; it is average, not worst case.\n- Using mutable objects\
    \ as keys and then changing them.\n- Overriding equality without overriding the hash function (Java's\
    \ `equals` and `hashCode` contract).\n- Relying on iteration order where the language does not guarantee\
    \ it.\n\n## In the interview\nExplain the mechanism (hash, bucket, collision handling, resizing) and\
    \ give average and worst-case complexity. Interviewers like knowing when to choose a tree map instead\
    \ (ordered keys, range queries) and how attackers can cause collisions (hash flooding), which is why\
    \ many languages use randomised hash seeds.\n"
