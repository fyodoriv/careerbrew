  - 372e7b83f1a4
  prompt: 1f344914
- id: kb-bbaa86c92ca2
  question: What is the Interface Segregation Principle in SOLID?
  answer: Clients should not be forced to depend on methods they do not use. Prefer several small, focused
    interfaces over one large one, so changes to unrelated methods do not ripple into every implementer
    and caller.
  topic: computer science
  tags:
  - solid
  - oop
  - design-principles
  - interfaces
  explanation: "## In plain words\nA big \"do everything\" interface forces every class that implements\
    \ it to provide methods it does not need, often as empty stubs that throw errors. Interface segregation\
    \ says: split it into small interfaces by role, and let each class implement only the roles it actually\
    \ plays.\n\n## How it works\n- Look at who calls an interface and which methods each caller uses.\n\
    - Group methods by those callers into role interfaces (for example `Readable`, `Writable`).\n- A class\
    \ may implement several small interfaces; a caller depends only on the one it needs.\n- Result: fewer\
    \ forced stubs, smaller recompile or redeploy blast radius, and easier fakes in tests.\n- It is closely\
    \ related to the Single Responsibility Principle, applied to interfaces.\n\n## Example\n```python\n\
    from typing import Protocol\n\nclass Printer(Protocol):\n    def print_doc(self, doc: str) -> None:\
    \ ...\n\nclass Scanner(Protocol):\n    def scan(self) -> str: ...\n\nclass SimplePrinter:\n    def\
    \ print_doc(self, doc): print(\"printing\", doc)\n\nclass OfficeMachine:\n    def print_doc(self,\
    \ doc): print(\"printing\", doc)\n    def scan(self): return \"scanned page\"\n\ndef print_report(p:\
    \ Printer):\n    p.print_doc(\"report\")\n\nprint_report(SimplePrinter())  # no fake scan() needed\n\
    ```\nWith a single `Machine` interface holding `print_doc`, `scan`, and `fax`, `SimplePrinter` would\
    \ need two methods that just raise errors.\n\n## Common mistakes\n- Splitting too far, into one-method\
    \ interfaces that nobody uses as a group.\n- Implementing unused methods with `raise NotImplementedError`,\
    \ which also breaks Liskov substitution.\n- Designing interfaces around the implementing class instead\
    \ of around what callers need.\n\n## In the interview\nGive the \"fat interface\" example and the\
    \ split version. Name the signals of a violation: empty or throwing method bodies, and clients that\
    \ import an interface but call one method. Mention the trade-off: too many tiny interfaces add noise,\
    \ so split along real usage.\n"
