  answer: A prefix product array stores, at each index, the product of all elements before it; a suffix
    product array stores the product of all elements after it. Multiplying the two at index i gives the
    product of everything except a[i], in O(n) time and without division.
  topic: computer science
  tags:
  - algorithms
  - arrays
  - prefix-sums
  - leetcode
  explanation: "## In plain words\nIt is the multiplication version of a running total. If you know the\
    \ product of everything to your left and everything to your right, you know the product of everything\
    \ but you, without ever dividing (which would fail on zeros).\n\n## How it works\n- `prefix[i] = a[0]\
    \ * a[1] * ... * a[i - 1]`, with `prefix[0] = 1`.\n- `suffix[i] = a[i + 1] * ... * a[n - 1]`, with\
    \ `suffix[n - 1] = 1`.\n- Answer for \"product except self\": `prefix[i] * suffix[i]`.\n- Space trick:\
    \ write prefixes into the output array in a left-to-right pass, then multiply in suffixes with a single\
    \ running variable in a right-to-left pass. O(n) time, O(1) extra space beyond the output.\n- The\
    \ same idea works for sums (prefix sums give O(1) range-sum queries), max or min (best on the left\
    \ and right of each index, as in \"trapping rain water\"), and XOR.\n\n## Example\n```python\ndef\
    \ product_except_self(nums):\n    n = len(nums)\n    out = [1] * n\n    left = 1\n    for i in range(n):\n\
    \        out[i] = left\n        left *= nums[i]\n    right = 1\n    for i in range(n - 1, -1, -1):\n\
    \        out[i] *= right\n        right *= nums[i]\n    return out\n\nprint(product_except_self([1,\
    \ 2, 3, 4]))  # [24, 12, 8, 6]\n```\nFor index 2: prefix is 1 x 2 = 2, suffix is 4, so 8.\n\n## Common\
    \ mistakes\n- Computing the total product and dividing, which breaks with zeros (and is often disallowed).\n\
    - Including `a[i]` itself in its prefix or suffix (off-by-one).\n- Using two extra arrays when the\
    \ question asks for O(1) extra space.\n- Ignoring overflow in fixed-width integer languages.\n\n##\
    \ In the interview\nMention the division approach and why it fails, then present prefix and suffix\
    \ passes. State O(n) time and the space trick. Interviewers may generalise: range product queries,\
    \ or \"maximum product subarray\", which instead tracks both the running max and min because negatives\
    \ flip signs.\n"
