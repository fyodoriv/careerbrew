  explanation: "## In plain words\nA logarithm answers \"how many times can I halve this before reaching\
    \ 1?\" For 8 that is 3 (8, 4, 2, 1). An O(log n) algorithm throws away a big fraction of the work\
    \ at each step, so it barely slows down as data grows.\n\n## How it works\n- `log2(n)` = number of\
    \ halvings from n to 1. log2(1,000) is about 10; log2(1,000,000) about 20; log2(10^9) about 30.\n\
    - In Big O the base does not matter, because logs in different bases differ by a constant factor.\n\
    - Where it shows up:\n  - binary search over a sorted array;\n  - search, insert, delete in a balanced\
    \ BST;\n  - heap push and pop (height of the tree);\n  - exponentiation by squaring;\n  - the number\
    \ of digits of n (log base 10).\n- O(n log n) means doing O(log n) work for each of n items, or log\
    \ n levels of O(n) work each (merge sort).\n\n## Example\nBinary search over 16 sorted items checks\
    \ at most about 4-5 elements: 16 -> 8 -> 4 -> 2 -> 1.\n```python\ndef halvings(n):\n    steps = 0\n\
    \    while n > 1:\n        n //= 2\n        steps += 1\n    return steps\n\nprint(halvings(1_000_000))\
    \  # 19\n```\n\n## Common mistakes\n- Thinking log n is \"a bit less than n\"; it is dramatically\
    \ smaller.\n- Claiming O(log n) for an algorithm that only removes a constant number of items per\
    \ step (that is O(n)).\n- Forgetting that the data must be sorted or structured to allow halving.\n\
    - Worrying about the log base.\n\n## In the interview\nExplain it with halving and give the \"30 steps\
    \ for a billion\" fact. Recognise it in loops where the index doubles or halves (`i *= 2`). Expect\
    \ follow-ups asking why a balanced tree is O(log n) and an unbalanced one O(n).\n"
