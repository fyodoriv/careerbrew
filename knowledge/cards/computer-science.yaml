  question: What are the ways to traverse a tree to print its values?
  answer: Depth-first orders are preorder (node, left, right), inorder (left, node, right), and postorder
    (left, right, node); breadth-first level order prints row by row with a queue. All are O(n) time;
    DFS uses O(h) space and BFS uses O(w), the maximum width.
  topic: computer science
  tags:
  - trees
  - traversal
  - dfs
  - bfs
  explanation: "## In plain words\nThere are two families. Depth-first goes down one branch fully before\
    \ the next, and the three variants differ only in when you print the current node. Breadth-first prints\
    \ the tree like reading a book: top row, then the next row, left to right.\n\n## How it works\n- **Preorder\
    \ (node, left, right):** good for copying or serialising a tree, because parents come before children.\n\
    - **Inorder (left, node, right):** gives sorted order for a binary search tree.\n- **Postorder (left,\
    \ right, node):** good for deleting a tree or computing sizes and heights, because children are handled\
    \ before parents.\n- **Level order (BFS):** use a queue; good for \"print by level\", right-side view,\
    \ or minimum depth.\n- Variations: zigzag level order, vertical order, boundary traversal.\n- Each\
    \ is `O(n)` time. Recursion uses `O(h)` stack space; level order holds up to one full level in the\
    \ queue.\n\n## Example\nFor the tree with root 1, children 2 and 3, and 2's children 4 and 5:\n- Preorder:\
    \ 1 2 4 5 3\n- Inorder: 4 2 5 1 3\n- Postorder: 4 5 2 3 1\n- Level order: 1 2 3 4 5\n```python\nfrom\
    \ collections import deque\n\nclass N:\n    def __init__(self, v, l=None, r=None):\n        self.v,\
    \ self.l, self.r = v, l, r\n\nt = N(1, N(2, N(4), N(5)), N(3))\n\ndef pre(n):  return [] if not n\
    \ else [n.v] + pre(n.l) + pre(n.r)\ndef ino(n):  return [] if not n else ino(n.l) + [n.v] + ino(n.r)\n\
    def post(n): return [] if not n else post(n.l) + post(n.r) + [n.v]\ndef level(n):\n    out, q = [],\
    \ deque([n])\n    while q:\n        x = q.popleft()\n        out.append(x.v)\n        q.extend(c for\
    \ c in (x.l, x.r) if c)\n    return out\n\nprint(pre(t), ino(t), post(t), level(t))\n```\n\n## Common\
    \ mistakes\n- Mixing up the three DFS orders.\n- Using a stack for level order, which gives a different\
    \ order.\n- Forgetting null checks for missing children.\n- Claiming inorder is sorted for any binary\
    \ tree; only for a BST.\n\n## In the interview\nRemember the rule \"the name tells you where the node\
    \ goes\". Interviewers often ask for an iterative version of one order or for level order grouped\
    \ by depth. Mention which order suits which task, such as postorder for freeing memory or preorder\
    \ for serialisation.\n"
