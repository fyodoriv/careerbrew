  question: What is a prefix tree?
  answer: A prefix tree, or trie, stores strings character by character along paths from the root, so
    words that share a prefix share nodes. Lookup, insert, and prefix search take O(L) time for a string
    of length L, independent of how many words are stored.
  topic: computer science
  tags:
  - data-structures
  - trie
  - strings
  - prefix-tree
  explanation: "## In plain words\nPicture a tree where each edge is a letter. Spelling a word means walking\
    \ down from the root one letter at a time. \"car\", \"cart\", and \"cat\" all share the path c-a,\
    \ then split. Because shared beginnings are stored once, finding every word that starts with \"ca\"\
    \ is just a walk to that node and a look underneath it. \"Prefix tree\" and \"trie\" are two names\
    \ for the same structure.\n\n## How it works\n- Each node holds a map from character to child node\
    \ and a flag `is_end` that marks a complete word.\n- **Insert**: walk or create a child for each character,\
    \ then set `is_end` on the last node. O(L).\n- **Search**: walk the characters; the word exists if\
    \ the path exists and the last node has `is_end`. O(L).\n- **Starts with**: walk the prefix; if the\
    \ path exists, at least one word has that prefix. O(L).\n- **Space**: O(total characters stored) in\
    \ the worst case, with overhead per node for the child map.\n- Variants: a compressed trie (radix\
    \ tree) merges single-child chains to save memory.\n\n## Example\n```python\nclass Trie:\n    def\
    \ __init__(self):\n        self.root = {}\n\n    def insert(self, word):\n        node = self.root\n\
    \        for ch in word:\n            node = node.setdefault(ch, {})\n        node[\"$\"] = True\n\
    \n    def starts_with(self, prefix):\n        node = self.root\n        for ch in prefix:\n      \
    \      if ch not in node:\n                return False\n            node = node[ch]\n        return\
    \ True\n\nt = Trie()\nfor w in [\"car\", \"cart\", \"cat\"]:\n    t.insert(w)\nprint(t.starts_with(\"\
    ca\"), t.starts_with(\"co\"))  # True False\n```\n\n## Common mistakes\n- Forgetting the end-of-word\
    \ flag, so \"car\" seems present after only inserting \"cart\".\n- Using a 26-slot array per node\
    \ when the alphabet is large, wasting memory.\n- Claiming lookup is O(log n); it depends on word length,\
    \ not word count.\n\n## In the interview\nMention uses: autocomplete, spell check, word search on\
    \ a grid, and IP routing with longest-prefix match. Compare with a hash set, which checks whole words\
    \ in O(L) average time but cannot answer prefix queries efficiently.\n"
