- id: kb-9071a71b095e
  question: What is an AVL tree, and what are its pros and cons?
  answer: An AVL tree is a self-balancing binary search tree in which the heights of every node's two
    subtrees differ by at most one. Rotations after inserts and deletes keep its height O(log n), so search,
    insert, and delete are all O(log n). It is more strictly balanced than a red-black tree, so lookups
    are slightly faster but updates do more rebalancing.
  topic: computer science
  tags:
  - trees
  - avl
  - bst
  - balancing
  explanation: "## In plain words\nA plain binary search tree can degrade into a long chain if you insert\
    \ sorted data, turning fast lookups into slow scans. An AVL tree checks its balance after every change\
    \ and tilts itself back with rotations, so it always stays close to perfectly balanced.\n\n## How\
    \ it works\n- Each node stores its height. The **balance factor** is `height(left) - height(right)`\
    \ and must be -1, 0, or 1.\n- After an insert or delete, walk back up the path, updating heights.\
    \ At the first node whose balance factor is +2 or -2, rotate:\n  - Left-left case: single right rotation.\n\
    \  - Right-right case: single left rotation.\n  - Left-right case: rotate the left child left, then\
    \ the node right.\n  - Right-left case: the mirror.\n- Height is at most about `1.44 log2(n)`, so\
    \ all operations are `O(log n)`.\n\n**Pros:** guaranteed `O(log n)` operations; very fast lookups\
    \ because the tree is tightly balanced; sorted iteration and range queries.\n\n**Cons:** more rotations\
    \ on writes than red-black trees; extra memory for the height; more complex code than a hash map,\
    \ which gives `O(1)` average lookups when order is not needed.\n\n## Example\nInserting 10, 20, 30\
    \ into an empty AVL tree:\n- After 10 and 20: 10 is root with right child 20 (balance -1, fine).\n\
    - After 30: the root's balance becomes -2 (right-right case).\n- A left rotation at 10 makes 20 the\
    \ root with children 10 and 30.\n\nA plain BST would have become a chain 10 -> 20 -> 30 of height\
    \ 3; the AVL tree has height 2.\n\n## Common mistakes\n- Forgetting to update heights after rotations.\n\
    - Applying a single rotation to a left-right or right-left case.\n- Claiming AVL trees beat hash maps\
    \ for lookups in general.\n- Confusing the AVL balance rule with \"complete tree\" (that is heaps).\n\
    \n## In the interview\nDefine the balance invariant, name the four cases, and state the complexity.\
    \ Interviewers rarely want full code but often ask for a comparison with red-black trees: AVL for\
    \ read-heavy workloads, red-black for write-heavy ones (many standard library ordered maps use red-black\
    \ trees). Mention that ordered maps are the practical way to get these guarantees.\n"
