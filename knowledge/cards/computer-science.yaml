  question: What is the difference between a stack overflow and an out-of-memory error?
  answer: A stack overflow happens when the call stack, a small fixed-size region per thread, runs out,
    usually from too-deep or infinite recursion. An out-of-memory error happens when the heap, where dynamically
    allocated objects live, cannot satisfy an allocation, usually from holding too much data or leaking
    references.
  topic: computer science
  tags:
  - memory
  - runtime
  - recursion
  - debugging
  explanation: "## In plain words\nA program uses two main memory areas. The stack is a small notepad\
    \ for function calls: each call adds a page, and the page is torn off when the call returns. The heap\
    \ is a large warehouse for objects that live longer. Fill the notepad and you get a stack overflow;\
    \ fill the warehouse and you get an out-of-memory error.\n\n## How it works\n**Stack overflow**\n\
    - Each function call pushes a frame (arguments, local variables, return address).\n- Stack size is\
    \ limited per thread (often around 1 MB to 8 MB by default).\n- Causes: infinite recursion, very deep\
    \ recursion on large inputs, huge local arrays.\n- Examples: `StackOverflowError` in Java, `RecursionError`\
    \ in Python (its own depth limit), \"Maximum call stack size exceeded\" in JavaScript.\n- Fix: add\
    \ or fix the base case, convert recursion to iteration with an explicit stack, or increase the stack\
    \ size.\n\n**Out of memory**\n- Objects created with `new`, lists, maps, and buffers live on the heap.\n\
    - Causes: loading too much data at once, unbounded caches, memory leaks (references kept forever).\n\
    - Fix: stream or paginate data, bound caches, find leaks with a heap profiler, raise limits as a last\
    \ resort.\n\n## Example\n```python\nimport sys\n\ndef depth(n):\n    return 0 if n == 0 else 1 + depth(n\
    \ - 1)\n\nprint(sys.getrecursionlimit())  # often 1000\ntry:\n    depth(100_000)\nexcept RecursionError:\n\
    \    print(\"stack too deep\")\n\n# Iterative version uses constant stack space\ndef depth_iter(n):\n\
    \    count = 0\n    while n:\n        n, count = n - 1, count + 1\n    return count\nprint(depth_iter(100_000))\
    \  # 100000\n```\n\n## Common mistakes\n- Calling every memory crash a \"stack overflow\".\n- Raising\
    \ stack or heap limits without finding the cause.\n- Assuming garbage collection prevents leaks; reachable\
    \ but unused objects are never freed.\n- Forgetting that each thread has its own stack.\n\n## In the\
    \ interview\nExplain the two memory regions and give a typical cause and fix for each. Interviewers\
    \ like a production angle: how you would diagnose an OOM (heap dumps, memory graphs over time) versus\
    \ a stack overflow (a stack trace with a repeating frame). Mention tail-call optimisation and that\
    \ most mainstream runtimes do not rely on it.\n"
