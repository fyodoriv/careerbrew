  question: How do you find the index of the last non-leaf node in an array-based binary heap?
  answer: In a 0-based array of n elements, the last non-leaf node is at index n // 2 - 1, the parent
    of the last element (index n - 1). Every index after it is a leaf. Bottom-up heapify starts there
    and walks back to 0.
  topic: computer science
  tags:
  - heap
  - heapify
  - arrays
  explanation: "## In plain words\nIn a heap stored as an array, the leaves are all bunched at the end.\
    \ The last node that still has a child is simply the parent of the very last element. Finding it tells\
    \ you where to start fixing the heap when building it from an unsorted array.\n\n## How it works\n\
    - In a 0-based array, the parent of index `i` is `(i - 1) // 2`.\n- The last element is at `n - 1`,\
    \ so its parent is `(n - 2) // 2`, which equals `n // 2 - 1` for every `n >= 2`.\n- Indexes `n //\
    \ 2` through `n - 1` are leaves: roughly half of a complete binary tree's nodes are leaves.\n- In\
    \ a 1-based array, the parent of `i` is `i // 2`, so the last non-leaf is `n // 2`.\n- Bottom-up heapify:\
    \ for `i` from `n // 2 - 1` down to `0`, sift `a[i]` down. Total cost is `O(n)` because most nodes\
    \ are near the bottom and only move a short distance.\n\n## Example\nArray `[9, 4, 7, 1, 2, 6, 3]`\
    \ has n = 7:\n- Last non-leaf: `7 // 2 - 1 = 2` (value 7, children at 5 and 6).\n- Leaves: indexes\
    \ 3, 4, 5, 6.\n```python\nimport heapq\n\ndef last_non_leaf(n):\n    return n // 2 - 1\n\na = [9,\
    \ 4, 7, 1, 2, 6, 3]\nprint(last_non_leaf(len(a)))  # 2\nheapq.heapify(a)              # sifts down\
    \ from index 2 to 0\nprint(a[0])                   # 1\n```\n\n## Common mistakes\n- Mixing up 0-based\
    \ and 1-based formulas.\n- Starting heapify at index 0 and going forward, which does not produce a\
    \ valid heap.\n- Starting from `n - 1`, which works but wastes time on leaves.\n- Claiming heapify\
    \ costs `O(n log n)`.\n\n## In the interview\nDerive the formula from the parent formula rather than\
    \ reciting it; interviewers want to see the reasoning. Mention why bottom-up heapify is linear (the\
    \ sum of heights is `O(n)`), and that heapsort starts with exactly this step before repeatedly extracting\
    \ the top.\n"
