  explanation: '## In plain words

    Computers count in bits (0 or 1); eight bits make a byte, enough for one ASCII character. Bigger units
    are just bytes multiplied up. Two systems exist: the decimal one used by disk makers and networks
    (powers of 1000) and the binary one used by memory and many operating systems (powers of 1024).


    ## How it works

    - 1 byte (B) = 8 bits (b). Network speeds are usually in bits per second, so 100 Mbps is about 12.5
    MB/s.

    - Decimal (SI): 1 kB = 1000 B, 1 MB = 10^6 B, 1 GB = 10^9 B, 1 TB = 10^12 B, 1 PB = 10^15 B.

    - Binary (IEC): 1 KiB = 1024 B, 1 MiB = 2^20 B (about 1.05 million), 1 GiB = 2^30 B (about 1.07 billion),
    1 TiB = 2^40 B.

    - The gap grows with each step: about 2.4% at kilo, 4.9% at mega, 7.4% at giga, 10% at tera.

    - Rules of thumb: a character is 1 byte in ASCII (1-4 in UTF-8), an integer is 4 or 8 bytes, a small
    photo is a few hundred kB, a minute of HD video is tens of MB.


    ## Example

    Estimate storage for 10 million users with a 1 kB profile each:

    10,000,000 x 1,000 B = 10^10 B = 10 GB.

    A "1 TB" drive holds 10^12 bytes, which an OS counting in binary shows as about 931 GiB, so it looks
    "smaller" than advertised.


    ## Common mistakes

    - Mixing bits and bytes (Mb vs MB), an error of 8x.

    - Assuming 1 KB is always 1024 bytes; the standard name for that is KiB.

    - Dropping a factor of 1000 when moving from MB to GB in estimates.

    - Over-precise maths in a design interview where round numbers are fine.


    ## In the interview

    In system design, use round powers of ten and say so: "about 1 kB per record, so 1 billion records
    is about 1 TB." Interviewers score speed and sanity, not exact numbers. Mention replication (often
    3x) and indexes when sizing storage, and convert bandwidth from bits to bytes explicitly.

    '
