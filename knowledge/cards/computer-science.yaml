  explanation: "## In plain words\nA BST is a decision tree for numbers: at each node you ask \"smaller\
    \ or bigger?\" and go left or right. Like guessing a number with hints, each question rules out a\
    \ whole side, as long as the tree stays bushy rather than stretched into a line.\n\n## How it works\n\
    - **Search**: start at the root; go left if the key is smaller, right if larger; stop when found or\
    \ at null.\n- **Insert**: search until you hit null, then attach a new node there.\n- **Delete**:\
    \ three cases:\n  - leaf: remove it;\n  - one child: replace the node with its child;\n  - two children:\
    \ copy the in-order successor (smallest in the right subtree) into the node, then delete that successor.\n\
    - **Pros**: sorted order for free, range queries, floor and ceiling, min and max in O(h).\n- **Cons**:\
    \ unbalanced inserts (such as sorted input) make it O(n); self-balancing versions (AVL, red-black)\
    \ fix this at the cost of complexity; hash maps are faster for plain lookups.\n\n## Example\n```python\n\
    class Node:\n    def __init__(self, key):\n        self.key, self.left, self.right = key, None, None\n\
    \ndef insert(root, key):\n    if root is None:\n        return Node(key)\n    if key < root.key:\n\
    \        root.left = insert(root.left, key)\n    elif key > root.key:\n        root.right = insert(root.right,\
    \ key)\n    return root\n\ndef contains(root, key):\n    while root and root.key != key:\n       \
    \ root = root.left if key < root.key else root.right\n    return root is not None\n\nroot = None\n\
    for k in (8, 3, 10, 1, 6):\n    root = insert(root, k)\nprint(contains(root, 6), contains(root, 7))\
    \  # True False\n```\n\n## Common mistakes\n- Validating a BST by checking only direct children instead\
    \ of passing min and max bounds down.\n- Forgetting the two-children delete case.\n- Claiming O(log\
    \ n) without saying \"if balanced\".\n- Not deciding how to handle duplicate keys.\n\n## In the interview\n\
    Give the property, the operations with O(h), and the balance caveat. Expect follow-ups: validate a\
    \ BST, k-th smallest element, lowest common ancestor using the ordering, and when you would choose\
    \ a hash map or a sorted array instead.\n"
