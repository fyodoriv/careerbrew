- id: kb-32eb0e940e2d
  question: What is the publish-subscribe (pub/sub) messaging model?
  answer: In pub/sub, publishers send messages to a topic without knowing who receives them, and every
    subscriber of that topic gets a copy. A broker sits between them, which decouples senders from receivers
    in time, space, and scale.
  topic: computer science
  tags:
  - system-design
  - messaging
  - pub-sub
  - distributed-systems
  explanation: '## In plain words

    Pub/sub works like a newsletter. Writers publish to a topic, readers subscribe to topics they care
    about, and a post office (the broker) delivers a copy to each subscriber. Writers never need a list
    of readers.


    ## How it works

    - **Publisher**: sends a message to a named topic.

    - **Broker**: stores and routes messages (examples: Kafka, Google Pub/Sub, Redis Pub/Sub, SNS).

    - **Subscriber**: registers interest in a topic and receives every message published to it (fan-out).

    - Compare with a point-to-point queue, where each message goes to exactly one consumer from a pool.

    - Delivery guarantees vary: at-most-once, at-least-once (most common; consumers must be idempotent),
    or effectively-once with extra machinery.

    - Some brokers keep a log so new subscribers can replay history; others drop messages for subscribers
    that are offline.


    ## Example

    An online shop publishes `order_placed` events. Three services subscribe: email sends a receipt, inventory
    reserves stock, and analytics records the sale. Adding a fraud-check service later means adding one
    subscriber; the order service does not change.


    ## Common mistakes

    - Assuming messages arrive exactly once and in global order; most systems only guarantee order within
    a partition.

    - Not making consumers idempotent, so a redelivered message charges a card twice.

    - Using pub/sub when the caller needs an immediate answer; that is a request-response job.

    - Ignoring slow subscribers, which build up backlog.


    ## In the interview

    Explain the decoupling benefit, then the costs: eventual consistency, harder debugging and tracing,
    and the need for schemas and versioning of events. Expect questions on ordering (partition by key),
    back-pressure, dead-letter queues for poison messages, and the difference between pub/sub fan-out
    and a work queue.

    '
