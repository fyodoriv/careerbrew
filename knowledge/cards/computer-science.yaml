- id: kb-d141e7a0237a
  question: What is the Law of Demeter?
  answer: The Law of Demeter, or principle of least knowledge, says a method should only call methods
    on itself, its parameters, objects it creates, and its own fields, not on objects returned by those.
    Avoiding chains like a.getB().getC().doThing() reduces coupling to other classes' internal structure.
  topic: computer science
  tags:
  - oop
  - design-principles
  - coupling
  - law-of-demeter
  explanation: "## In plain words\n\"Talk only to your immediate friends.\" When you pay at a shop, you\
    \ hand over money; the cashier does not reach into your pocket, open your wallet, and take the cash.\
    \ Code should likewise ask an object to do something rather than digging through its insides.\n\n\
    ## How it works\nA method `m` of object `O` may call methods of:\n- `O` itself,\n- `m`'s parameters,\n\
    - objects created inside `m`,\n- `O`'s direct fields (components).\n\nIt should not call methods on\
    \ objects returned by those calls. Long chains of getters are the usual symptom, sometimes called\
    \ \"train wrecks\".\n\nFix with **tell, don't ask**: add a method on the nearby object that does the\
    \ job, so internal structure can change without breaking callers.\n\n## Example\nBefore:\n```python\n\
    def charge(customer, amount):\n    customer.wallet.balance -= amount   # reaches into the wallet\n\
    ```\nAfter:\n```python\nclass Wallet:\n    def __init__(self, balance): self.balance = balance\n \
    \   def debit(self, amount):\n        if amount > self.balance:\n            raise ValueError(\"insufficient\
    \ funds\")\n        self.balance -= amount\n\nclass Customer:\n    def __init__(self, wallet): self.wallet\
    \ = wallet\n    def pay(self, amount): self.wallet.debit(amount)\n\nc = Customer(Wallet(50))\nc.pay(20)\n\
    print(c.wallet.balance)  # 30\n```\nNow the rule for paying lives in one place, and `charge` code\
    \ only calls `customer.pay`.\n\n## Common mistakes\n- Counting dots mechanically: fluent builders\
    \ and data pipelines (`items.filter(...).map(...)`) return the same kind of object and are usually\
    \ fine.\n- Fixing violations by adding dozens of forwarding methods that only pass calls through,\
    \ which bloats classes.\n- Applying it to plain data structures (DTOs), where reading nested fields\
    \ is expected.\n\n## In the interview\nDefine it in one line, show a chain and the refactor, and name\
    \ the benefit: callers depend on fewer classes, so changes stay local and testing needs fewer mocks.\
    \ Mention the trade-off with wrapper bloat, and connect it to encapsulation and \"tell, don't ask\"\
    .\n"
