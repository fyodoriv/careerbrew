- id: kb-bfb54c8c89cb
  question: What is a tree data structure?
  answer: A tree is a hierarchical structure of nodes where each node has one parent (except the root)
    and any number of children, with no cycles. A tree with n nodes has n - 1 edges, and trees model hierarchies
    such as file systems, the DOM, and search indexes.
  topic: computer science
  tags:
  - data-structures
  - trees
  - hierarchy
  explanation: "## In plain words\nA tree looks like a family tree or a folder structure: one top item\
    \ (the root) that branches into children, which branch into their own children. Every item except\
    \ the root has exactly one parent, and you can never loop back to where you started.\n\n## How it\
    \ works\nKey terms:\n- **Root**: the top node. **Leaf**: a node with no children.\n- **Edge**: a parent-child\
    \ link. A tree with n nodes has n - 1 edges.\n- **Depth** of a node: edges from the root. **Height**\
    \ of the tree: the longest root-to-leaf path.\n- **Subtree**: a node and all its descendants, itself\
    \ a tree.\n\nCommon kinds:\n- **Binary tree**: at most two children per node.\n- **Binary search tree\
    \ (BST)**: left subtree smaller, right subtree larger, giving O(h) search.\n- **Balanced trees** (AVL,\
    \ red-black): keep height O(log n).\n- **Heap**: parent is smaller (or larger) than its children.\n\
    - **Trie**, **B-tree**, **segment tree**: specialized for strings, disks, and range queries.\n\nTraversals:\
    \ depth-first (pre-order, in-order, post-order) and breadth-first (level order), each O(n).\n\n##\
    \ Example\n```python\nclass Node:\n    def __init__(self, val, children=None):\n        self.val,\
    \ self.children = val, children or []\n\ndef height(node):\n    if not node.children:\n        return\
    \ 0\n    return 1 + max(height(c) for c in node.children)\n\nroot = Node(\"/\", [Node(\"home\", [Node(\"\
    ana\")]), Node(\"etc\")])\nprint(height(root))  # 2\n```\n\n## Common mistakes\n- Mixing up depth\
    \ and height, or counting nodes versus edges.\n- Assuming every tree is binary or every binary tree\
    \ is a BST.\n- Recursing on a very deep, skewed tree and overflowing the stack.\n\n## In the interview\n\
    Most tree questions are solved by recursion: define what a function returns for a subtree, handle\
    \ the empty case, and combine the children's answers. State complexity in terms of n and height h,\
    \ noting h is O(log n) when balanced and O(n) when skewed. Mention that a tree is a connected graph\
    \ with no cycles.\n"
