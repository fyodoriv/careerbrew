- id: kb-564107f9eeb9
  question: What is polymorphism in object-oriented programming?
  answer: Polymorphism lets code call the same operation on objects of different types and have each type
    respond in its own way. The common forms are subtype polymorphism (overriding through inheritance
    or interfaces), ad hoc polymorphism (overloading), and parametric polymorphism (generics).
  topic: computer science
  tags:
  - oop
  - polymorphism
  - inheritance
  - design
  explanation: "## In plain words\nPolymorphism means \"many forms\". You write code against a general\
    \ idea, like \"a shape that can compute its area\", and each concrete shape supplies its own version.\
    \ The caller does not need to know which shape it has.\n\n## How it works\n- **Subtype (runtime) polymorphism**:\
    \ a subclass overrides a method of a base class or implements an interface. The method chosen depends\
    \ on the object's actual type at runtime (dynamic dispatch, often through a virtual method table).\n\
    - **Ad hoc polymorphism**: overloading, where several functions share a name but take different parameter\
    \ types; the compiler picks one at compile time.\n- **Parametric polymorphism**: generics, such as\
    \ `List<T>`, where one piece of code works for any type.\n- Dynamic languages also use duck typing:\
    \ any object with the right method works, with no shared base class.\n\n## Example\n```python\nimport\
    \ math\n\nclass Circle:\n    def __init__(self, r): self.r = r\n    def area(self): return math.pi\
    \ * self.r ** 2\n\nclass Square:\n    def __init__(self, s): self.s = s\n    def area(self): return\
    \ self.s ** 2\n\nfor shape in [Circle(1), Square(2)]:\n    print(round(shape.area(), 2))  # 3.14,\
    \ then 4\n```\nThe loop calls `area()` without checking types.\n\n## Common mistakes\n- Replacing\
    \ polymorphism with long `if type == ...` chains, which must change every time a type is added.\n\
    - Confusing overloading (compile time, different signatures) with overriding (runtime, same signature).\n\
    - Building deep inheritance trees only to share code; composition is often better.\n\n## In the interview\n\
    Give a short definition, name the forms, and show a two-class example. Connect it to the Open-Closed\
    \ Principle: new behaviour comes from adding a class, not editing callers. Expect follow-ups on how\
    \ dynamic dispatch works, the cost of virtual calls, and the Liskov Substitution Principle, which\
    \ says subtypes must keep the base type's promises.\n"
