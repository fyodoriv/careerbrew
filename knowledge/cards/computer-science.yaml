  explanation: "## In plain words\nSome problems have two sizes: the data (n) and something smaller you\
    \ track, like the top k results or k sorted lists. If each of the n steps touches a structure of size\
    \ k that answers in log k time, the total is n times log k.\n\n## How it works\n- Recognise the shape:\
    \ a loop over n items, and inside it an operation on a heap or tree of size at most k.\n- Examples:\n\
    \  - top k largest of n numbers with a min-heap of size k: O(n log k);\n  - merging k sorted lists\
