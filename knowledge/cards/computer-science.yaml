  question: What is the Strategy design pattern?
  answer: The Strategy pattern defines a family of interchangeable algorithms behind a common interface
    and lets the caller pick one at runtime. It replaces conditionals on behaviour with separate, testable
    classes or functions and makes adding a new behaviour a matter of adding a new strategy.
  topic: computer science
  tags:
  - design-patterns
  - behavioral
  - strategy
  explanation: "## In plain words\nA navigation app can route you by car, by bike, or on foot. The app\
    \ does the same thing either way (show a route), but the routing method changes. Strategy is that\
    \ idea in code: keep the \"how\" swappable while the \"what\" stays fixed.\n\n## How it works\n- Define\
    \ the interface every strategy follows, such as `calculate(order) -> price`.\n- Implement each variant\
    \ separately (regular, sale, member discount).\n- The context object (for example a checkout) holds\
    \ a reference to a strategy and calls it, without knowing which one it is.\n- Pick or swap the strategy\
    \ at runtime from configuration or user choice.\n- In languages with first-class functions, a strategy\
    \ can simply be a function passed as an argument; `sorted(items, key=...)` is the Strategy pattern\
    \ in miniature.\n- It supports the Open-Closed Principle: new strategies are added without editing\
    \ the context.\n\n## Example\n```python\ndef regular(total):\n    return total\n\ndef sale(total):\n\
    \    return total * 0.8\n\ndef member(total):\n    return max(total - 10, 0)\n\nclass Checkout:\n\
    \    def __init__(self, pricing):\n        self.pricing = pricing\n    def pay(self, total):\n   \
    \     return self.pricing(total)\n\nprint(Checkout(sale).pay(100))    # 80.0\nprint(Checkout(member).pay(100))\
    \  # 90\n```\n\n## Common mistakes\n- Creating a class hierarchy when a simple function would do.\n\
    - Leaking strategy-specific details into the context, which defeats the purpose.\n- Using it for only\
    \ one or two fixed cases that will never grow.\n- Confusing it with State (state objects change themselves;\
    \ strategies are chosen from outside).\n\n## In the interview\nName a real use case: pricing rules,\
    \ compression algorithms, authentication methods, retry policies. Interviewers look for the contrast\
    \ with a growing `if/else` and for awareness of trade-offs: more small units and indirection, but\
    \ easier testing and extension. Mention how dependency injection supplies the chosen strategy.\n"
