- id: kb-79c3314fc59a
  question: What is RAM?
  answer: RAM (random-access memory) is a computer's fast, volatile working memory, where running programs
    keep their code and data. Any address can be read in roughly the same time, it is much faster than
    disk but slower than CPU caches, and its contents vanish when power is lost.
  topic: computer science
  tags:
  - hardware
  - memory
  - operating-systems
  - performance
  explanation: '## In plain words

    RAM is the desk you work on; the disk is the filing cabinet. Things you are using right now sit on
    the desk where you can grab them fast. When you go home (power off), the desk is cleared, and only
    the cabinet keeps its contents.


    ## How it works

    - **Random access**: any byte can be reached directly by its address, unlike reading a tape from the
    start.

    - **Volatile**: data is lost without power. Main memory is usually DRAM (dynamic RAM), which stores
    bits in tiny capacitors that must be refreshed; CPU caches use faster, costlier SRAM (static RAM).

    - **Memory hierarchy** (rough orders of magnitude): CPU registers and L1 cache about 1 ns, main memory
    about 100 ns, NVMe SSD about 10 to 100 microseconds, spinning disk about 10 ms.

    - The OS gives each process **virtual memory**: its own address space, mapped onto physical RAM in
    pages (often 4 KB). When RAM runs low, pages can be swapped to disk, which is very slow.

    - Programs use RAM for the stack (function frames), the heap (dynamically allocated objects), and
    their code.


    ## Example

    Reading 1 GB sequentially from RAM takes well under a second; reading it with random seeks from a
    spinning disk could take hours. That gap is why databases cache hot data in memory (a buffer pool)
    and why Redis keeps everything in RAM.


    ## Common mistakes

    - Confusing RAM with storage: "my laptop has 512 GB of RAM" usually means disk.

    - Assuming "random access" means every access is equally fast in practice; sequential access is much
    faster thanks to caches and prefetching.

    - Forgetting that in-memory data must be persisted somewhere if it matters.


    ## In the interview

    Use it in performance and system design talks: keep hot data in memory, estimate capacity (100 million
    items x 1 KB = 100 GB, so shard or use disk), and mention latency numbers. Expect follow-ups on caches,
    virtual memory and paging, stack versus heap, and what happens to an in-memory store on a crash.

    '
