- id: kb-4a3f0e13e674
  question: What is a weighted graph?
  answer: A weighted graph attaches a number, such as distance, cost, time, or capacity, to each edge.
    Path problems then minimize total weight rather than edge count, so you use Dijkstra (non-negative
    weights), Bellman-Ford (negative weights), or minimum spanning tree algorithms instead of plain BFS.
  topic: computer science
  tags:
  - graphs
  - algorithms
  - shortest-path
  - dijkstra
  explanation: "## In plain words\nIn an ordinary graph every connection is equal. In a weighted graph\
    \ each connection has a price: kilometres between cities, milliseconds between servers, or dollars\
    \ per flight. The \"shortest\" route now means the cheapest total, which might use more hops.\n\n\
    ## How it works\n- **Storage**: an adjacency list of `(neighbour, weight)` pairs, or a matrix holding\
    \ weights, with infinity for no edge.\n- **Shortest path from one source**:\n  - Non-negative weights:\
    \ Dijkstra with a min-heap, O((V + E) log V).\n  - Negative weights allowed: Bellman-Ford, O(V * E);\
    \ it also detects negative cycles.\n  - Weights of only 0 and 1: 0-1 BFS with a deque, O(V + E).\n\
    \  - All pairs: Floyd-Warshall, O(V^3).\n- **Minimum spanning tree** (connect all nodes with the least\
    \ total weight, undirected): Kruskal or Prim, O(E log V).\n- Plain BFS finds the fewest edges, which\
    \ is the shortest path only when all weights are equal.\n\n## Example\n```python\nimport heapq\n\n\
    def dijkstra(graph, src):\n    dist, heap = {src: 0}, [(0, src)]\n    while heap:\n        d, u =\
    \ heapq.heappop(heap)\n        if d > dist[u]:\n            continue\n        for v, w in graph[u]:\n\
    \            if d + w < dist.get(v, float(\"inf\")):\n                dist[v] = d + w\n          \
    \      heapq.heappush(heap, (d + w, v))\n    return dist\n\ng = {\"A\": [(\"B\", 4), (\"C\", 1)],\
    \ \"C\": [(\"B\", 2)], \"B\": []}\nprint(dijkstra(g, \"A\"))  # {'A': 0, 'B': 3, 'C': 1}\n```\nThe\
    \ two-hop path A-C-B (cost 3) beats the direct edge A-B (cost 4).\n\n## Common mistakes\n- Using BFS\
    \ for weighted shortest paths.\n- Running Dijkstra with negative edges, which can give wrong answers.\n\
    - Not skipping stale heap entries, which wastes time.\n\n## In the interview\nClarify whether the\
    \ graph is directed, whether weights can be negative, and how large V and E are, then choose the algorithm\
    \ and state its complexity. Variants include \"cheapest flight within k stops\" (Bellman-Ford limited\
    \ to k rounds, or BFS by level) and \"network delay time\" (Dijkstra).\n"
