  question: What are tree rotations?
  answer: A rotation is a local restructuring of a binary search tree that changes which node is the parent
    of a subtree while keeping the in-order (sorted) order intact. Left and right rotations run in O(1)
    and are how self-balancing trees such as AVL and red-black trees fix their height after inserts and
    deletes.
  topic: computer science
  tags:
  - trees
  - bst
  - balancing
  - avl
  explanation: "## In plain words\nA binary search tree can become lopsided, like a leaning tower, which\
    \ makes searches slow. A rotation is a small pivot around one node that lifts a child up and pushes\
    \ the parent down, making the tree shallower without breaking the sorted order.\n\n## How it works\n\
    - **Right rotation at node y** (y has left child x):\n  - x becomes the new root of this subtree.\n\
    \  - y becomes x's right child.\n  - x's old right subtree becomes y's left subtree.\n- **Left rotation**\
    \ is the mirror image.\n- Only three pointers change, so a rotation is `O(1)`.\n- The in-order sequence\
    \ is unchanged, so the tree is still a valid BST.\n- **Double rotations** fix zig-zag shapes: left-right\
    \ (rotate the child left, then the node right) and right-left.\n- AVL trees rotate when a node's subtree\
    \ heights differ by more than 1; red-black trees rotate and recolour to keep their colour rules.\n\
    \n## Example\nRight rotation at 30:\n```text\n      30              20\n     /  \\            /  \\\
    \n    20   40   ->    10   30\n   /  \\                 /  \\\n  10   25              25   40\n```\n\
    ```python\nclass Node:\n    def __init__(self, key, left=None, right=None):\n        self.key, self.left,\
    \ self.right = key, left, right\n\ndef rotate_right(y):\n    x = y.left\n    y.left = x.right\n  \
    \  x.right = y\n    return x  # new subtree root\n\nroot = rotate_right(Node(30, Node(20, Node(10),\
    \ Node(25)), Node(40)))\nprint(root.key, root.right.left.key)  # 20 25\n```\n\n## Common mistakes\n\
    - Losing the middle subtree (x's right child) during the rotation.\n- Forgetting to update the parent's\
    \ pointer to the new subtree root.\n- Not updating stored heights or sizes after rotating.\n- Using\
    \ a single rotation on a zig-zag case that needs a double rotation.\n\n## In the interview\nDraw the\
    \ before and after with the three subtrees labelled; that is what interviewers want to see. Explain\
    \ why the in-order sequence is preserved and that rotations are `O(1)`. Expect follow-ups on when\
    \ AVL and red-black trees rotate and why that keeps height `O(log n)`.\n"
