- id: kb-82e88e9b7b1f
  question: What is service-oriented architecture (SOA)?
  answer: Service-oriented architecture builds a system from independent services that expose business
    capabilities through well-defined network interfaces. Services are loosely coupled, reusable, and
    communicate through contracts, classically via an enterprise service bus.
  topic: computer science
  tags:
  - system-design
  - architecture
  - soa
  - microservices
  explanation: '## In plain words

    Instead of one big program, you split the system into services such as "billing", "customers", and
    "inventory". Each one does one business job and offers it to others through an agreed interface, the
    way departments in a company handle requests from other departments.


    ## How it works

    - **Service**: a self-contained unit that owns a business capability and exposes it through a contract
    (historically SOAP with WSDL; today often REST, gRPC, or messages).

    - **Loose coupling**: callers depend on the contract, not the implementation, so a service can change
    internally without breaking clients.

    - **Reuse and composition**: larger business processes are built by combining services.

    - **Enterprise service bus (ESB)**: in classic SOA, a central middleware layer that routes, transforms,
    and orchestrates messages between services.

    - **Microservices** grew out of SOA: smaller services, each with its own database, "smart endpoints
    and dumb pipes" instead of a heavy ESB, and independent deployment.


    ## Example

    An insurance company exposes `CustomerService`, `PolicyService`, and `PaymentService`. A new web portal
    and an old call-center app both call the same `PolicyService` to issue a policy, instead of each holding
    a copy of the policy logic.


    ## Common mistakes

    - Treating SOA and microservices as exact synonyms; they share ideas but differ in service size, data
    ownership, and use of central middleware.

    - Putting business logic into the ESB, which turns it into a new monolith.

    - Splitting services by technical layer rather than business capability, so every feature needs changes
    in many services.


    ## In the interview

    Explain the benefits (independent teams, reuse, separate scaling, technology choice per service) and
    the costs (network latency and failures, distributed transactions, versioning, monitoring and tracing).
    Expect a comparison with a monolith: a well-structured monolith is often the right start, and services
    are extracted when team or scaling pressure justifies the operational cost.

    '
