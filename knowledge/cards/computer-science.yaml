  explanation: "## In plain words\nThink of an air-traffic control tower: planes do not negotiate with\
    \ each other; they all talk to the tower, which coordinates them. That tower is a mediator. Middleware\
    \ is like an airport security line: each checkpoint inspects the passenger and either sends them on\
    \ or stops them.\n\n## How it works\nMediator:\n- Components (colleagues) hold a reference to the\
    \ mediator, not to each other.\n- They notify the mediator of events; the mediator decides who else\
    \ reacts.\n- Benefit: fewer direct links, so changing one component affects only the mediator. Risk:\
    \ the mediator becomes a large \"god object\".\n- Examples: a chat room relaying messages, a form\
    \ controller enabling a button when fields are valid.\n\nMiddleware:\n- An ordered pipeline; each\
    \ function receives the request (and response) and a `next` callback.\n- It can modify the request,\
    \ stop the chain (for example, return 401), or call `next()`.\n- Used for logging, authentication,\
    \ parsing, compression, rate limiting, and error handling.\n\n## Example\n```javascript\nfunction\
    \ compose(middlewares, handler) {\n  return (req) => {\n    let i = 0;\n    const next = () => (i\
    \ < middlewares.length ? middlewares[i++](req, next) : handler(req));\n    return next();\n  };\n\
    }\n\nconst log = (req, next) => { console.log(\"->\", req.path); return next(); };\nconst auth = (req,\
    \ next) => (req.user ? next() : \"401 Unauthorized\");\nconst app = compose([log, auth], (req) =>\
    \ `hello ${req.user}`);\n\nconsole.log(app({ path: \"/me\", user: \"ada\" })); // \"hello ada\"\n\
    console.log(app({ path: \"/me\" }));              // \"401 Unauthorized\"\n```\n\n## Common mistakes\n\
    - Letting the mediator absorb all business logic.\n- Confusing a mediator with an observer: observers\
    \ broadcast to anyone subscribed; a mediator coordinates specific components.\n- Middleware order\
    \ bugs, such as checking auth before parsing the body it needs.\n- Forgetting to call `next`, which\
    \ hangs the request.\n\n## In the interview\nGive a concrete example and the trade-off: looser coupling\
    \ between components, but a central point that can grow complex. For middleware, explain order and\
    \ short-circuiting, and mention Express, Koa, or Redux middleware as familiar cases. Expect a follow-up\
    \ comparing with Observer and with the Chain of Responsibility pattern, which middleware closely resembles.\n"
