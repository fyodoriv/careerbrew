- id: kb-d3ad66818850
  question: When should you use a stack, and when a queue?
  answer: 'Use a stack (last in, first out) when the most recent item must be handled first: undo, matching
    brackets, backtracking, DFS, and parsing nested structure. Use a queue (first in, first out) when
    items must be handled in arrival order: BFS, task scheduling, buffering, and fair processing.'
  topic: computer science
  tags:
  - data-structures
  - stack
  - queue
  - algorithms
  explanation: "## In plain words\nA stack is a pile of plates: last on, first off. A queue is a line\
    \ at a shop: first in, first served. Ask yourself, \"should the newest item or the oldest item go\
    \ next?\"\n\n## How it works\nBoth give O(1) add and remove at their access points.\n\n**Stack (LIFO)**\n\
    - Undo/redo history: the latest action is undone first.\n- Matching brackets and tags: the most recent\
    \ opener must close first.\n- Depth-first search and backtracking: go deep, then back up.\n- Expression\
    \ evaluation and parsing; the function call stack.\n- Monotonic stack problems (\"next greater element\"\
    ).\n\n**Queue (FIFO)**\n- Breadth-first search: process nodes in distance order, giving shortest paths\
    \ in unweighted graphs.\n- Job and print queues, request buffers, producer-consumer pipelines.\n-\
    \ Rate limiting and sliding windows over time (drop the oldest timestamps).\n- Fairness: whoever waits\
    \ longest goes next.\n\nRelated: a **deque** supports both ends (sliding window maximum), and a **priority\
    \ queue** orders by importance instead of arrival.\n\n## Example\nSame graph, different order:\n```python\n\
    from collections import deque\n\ng = {\"A\": [\"B\", \"C\"], \"B\": [\"D\"], \"C\": [\"E\"], \"D\"\
    : [], \"E\": []}\n\ndef traverse(use_stack):\n    box, seen, order = deque([\"A\"]), {\"A\"}, []\n\
    \    while box:\n        u = box.pop() if use_stack else box.popleft()\n        order.append(u)\n\
    \        for v in g[u]:\n            if v not in seen:\n                seen.add(v)\n            \
    \    box.append(v)\n    return order\n\nprint(traverse(False))  # ['A', 'B', 'C', 'D', 'E']  queue:\
