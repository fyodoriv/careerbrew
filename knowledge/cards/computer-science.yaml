  question: In JavaScript, how do you convert an array into an object?
  answer: For an array of [key, value] pairs, use Object.fromEntries(arr). For an array of records, map
    each to a pair first, or use reduce to build an object keyed by a field. Object.assign({}, arr) or
    spreading {...arr} gives an object keyed by index.
  topic: computer science
  tags:
  - javascript
  - arrays
  - objects
  - data-transformation
  explanation: "## In plain words\nJavaScript objects are maps from string keys to values. Converting\
    \ an array means deciding what the keys should be: the array indices, a field of each item, or the\
    \ first element of each pair.\n\n## How it works\n- **Pairs to object**: `Object.fromEntries([[\"\
    a\", 1], [\"b\", 2]])` gives `{ a: 1, b: 2 }`. It also accepts a `Map`.\n- **Records keyed by a field**:\
    \ `Object.fromEntries(users.map(u => [u.id, u]))`.\n- **With reduce**: `arr.reduce((acc, x) => { acc[x.id]\
    \ = x; return acc; }, {})`, handy when you also aggregate (for example counting).\n- **Index as key**:\
    \ `{ ...arr }` or `Object.assign({}, arr)` gives `{ 0: \"a\", 1: \"b\" }`.\n- Keys are converted to\
    \ strings, so `1` and `\"1\"` collide. If you need non-string keys or insertion-order guarantees for\
    \ numeric-like keys, use a `Map`.\n- Each approach is O(n).\n\n## Example\n```javascript\nconst users\
    \ = [\n  { id: \"u1\", name: \"Ada\" },\n  { id: \"u2\", name: \"Linus\" },\n];\nconst byId = Object.fromEntries(users.map((u)\
    \ => [u.id, u]));\nconsole.log(byId.u2.name); // \"Linus\"\n\nconst counts = [\"a\", \"b\", \"a\"\
    ].reduce((acc, ch) => {\n  acc[ch] = (acc[ch] || 0) + 1;\n  return acc;\n}, {});\nconsole.log(counts);\
    \ // { a: 2, b: 1 }\n\nconsole.log({ ...\"xy\".split(\"\") }); // { 0: \"x\", 1: \"y\" }\n```\n\n\
    ## Common mistakes\n- Forgetting to return the accumulator from the `reduce` callback.\n- Spreading\
    \ the accumulator on every step (`{...acc, [k]: v}`), which makes it O(n^2).\n- Assuming keys keep\
    \ their type; they become strings.\n- Silently overwriting entries when keys repeat.\n\n## In the\
    \ interview\nShow `Object.fromEntries` as the modern, readable choice and `reduce` for aggregation.\
    \ Mention `Map` when keys are not strings or when you add and remove often. Follow-ups: the reverse\
    \ (`Object.entries`), grouping (`Object.groupBy` in newer runtimes), and the quadratic-spread pitfall.\n"
