- id: kb-d5ba41d9b4f7
  question: What is quickselect?
  answer: Quickselect finds the k-th smallest element by partitioning around a pivot like quicksort, then
    recursing only into the side that contains position k. It runs in O(n) average time and O(n^2) worst
    case.
  topic: computer science
  tags:
  - algorithms
  - selection
  - quickselect
  - partitioning
  explanation: "## In plain words\nIf you only need the k-th smallest item (say, the median), you do not\
    \ need to sort everything. Partition around a pivot: the pivot lands in its final sorted position.\
    \ If that position is k, you are done; otherwise look only on the side where k lives.\n\n## How it\
    \ works\n- Pick a pivot, ideally at random.\n- Partition the range so smaller items are left of the\
    \ pivot and larger items right.\n- Let `p` be the pivot's final index.\n  - If `p == k`, return `a[p]`.\n\
    \  - If `k < p`, repeat on the left part; else on the right part.\n- Each step discards one side,\
    \ so the expected work is n + n/2 + n/4 + ... = O(n).\n- Worst case O(n^2) when pivots are bad every\
    \ time. Median-of-medians picks a pivot that guarantees O(n), but it is slower in practice.\n- Space:\
    \ O(1) extra when written as a loop. It reorders the input.\n\n## Example\n```python\nimport random\n\
    \ndef quickselect(a, k):          # k is 0-based\n    lo, hi = 0, len(a) - 1\n    while True:\n  \
    \      r = random.randint(lo, hi)\n        a[r], a[hi] = a[hi], a[r]\n        pivot, i = a[hi], lo\n\
    \        for j in range(lo, hi):\n            if a[j] < pivot:\n                a[i], a[j] = a[j],\
    \ a[i]\n                i += 1\n        a[i], a[hi] = a[hi], a[i]\n        if i == k:\n          \
    \  return a[i]\n        if k < i:\n            hi = i - 1\n        else:\n            lo = i + 1\n\
    \nprint(quickselect([7, 2, 9, 4, 1], 2))  # 4, the third smallest\n```\n\n## Common mistakes\n- Recursing\
    \ into both sides, which turns it back into quicksort.\n- Mixing 0-based and 1-based k, or \"k-th\
    \ largest\" with \"k-th smallest\" (k-th largest is index n - k).\n- Forgetting that it mutates the\
    \ array.\n\n## In the interview\nFor \"k-th largest element\" or \"top k\", offer two answers: a size-k\
    \ heap in O(n log k), which works on streams and is simple, and quickselect in O(n) average, which\
    \ is faster for one array in memory. Mention random pivots to avoid adversarial inputs, and three-way\
    \ partitioning when there are many duplicates.\n"
