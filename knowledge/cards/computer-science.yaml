  explanation: '## In plain words

    Removing from a heap must keep two promises: no gaps in the tree and every parent no larger than its
    children (min-heap). Filling the hole with the last element fixes the gaps; sifting that element to
    its proper level fixes the order.


    ## How it works

    Remove the minimum (the usual operation):

    - Save `a[0]`. Move `a[-1]` to index 0 and shrink the array.

    - Sift down: compare with both children, swap with the smaller one if it is smaller than the current
    node, repeat.

    - O(log n).


    Remove an arbitrary index `i`:

    - Replace `a[i]` with the last element and shrink.

    - The new value may be smaller than its parent (sift up) or larger than a child (sift down); only
    one applies.

    - Finding `i` is O(n) unless you keep a map from item to index.

    - Alternative: lazy deletion. Mark the item as removed and skip it when it reaches the top.


    ## Example

    Min-heap `[1, 3, 2, 7, 4]`, pop the minimum:

    - Move 4 to the root: `[4, 3, 2, 7]`.

    - Children 3 and 2; smaller is 2 and 4 > 2, swap: `[2, 3, 4, 7]`.

    - Index 2 has no children; done. Returned 1.

    ```python

    import heapq

    h = [1, 3, 2, 7, 4]

    print(heapq.heappop(h), h)  # 1 [2, 3, 4, 7]

    ```


    ## Common mistakes

    - Swapping with the larger child in a min-heap.

    - Removing the root by shifting the whole array left (O(n) and breaks the structure).

    - Only sifting down after an arbitrary delete, missing the sift-up case.

    - Forgetting the empty-heap case.


