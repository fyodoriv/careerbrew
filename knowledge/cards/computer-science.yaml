  question: How does depth-first search (DFS) traverse a graph or tree?
  answer: DFS follows one path as deep as possible before backtracking to try the next branch, using recursion
    or an explicit stack plus a visited set. It runs in O(V + E) time and suits cycle detection, topological
    sort, and exploring all paths.
  topic: computer science
  tags:
  - graphs
  - trees
  - dfs
  - traversal
  explanation: "## In plain words\nDFS explores like walking a maze with one hand on the wall: keep going\
    \ forward until you hit a dead end, then step back to the last junction and try another way. It finishes\
    \ one branch completely before starting the next.\n\n## How it works\n- Start at a node, mark it visited,\
    \ and process it.\n- For each unvisited neighbour, recurse (or push it on a stack) and continue from\
    \ there.\n- When a node has no unvisited neighbours, return; this is the backtracking step.\n- On\
    \ trees, the moment you process the node gives preorder, inorder, or postorder.\n- Time `O(V + E)`;\
    \ space `O(V)` for the visited set plus the recursion depth, which is `O(h)` for a tree of height\
    \ h.\n- Track three states (unvisited, in progress, done) to detect cycles in directed graphs.\n\n\
    ## Example\n```python\ndef dfs_order(graph, start):\n    seen, order = set(), []\n    def visit(node):\n\
    \        seen.add(node)\n        order.append(node)\n        for nxt in graph[node]:\n           \
    \ if nxt not in seen:\n                visit(nxt)\n    visit(start)\n    return order\n\ng = {\"A\"\
    : [\"B\", \"C\"], \"B\": [\"D\"], \"C\": [], \"D\": []}\nprint(dfs_order(g, \"A\"))  # ['A', 'B',\
    \ 'D', 'C']\n```\n\n## Common mistakes\n- Forgetting the visited set on graphs, which loops forever\
    \ on cycles.\n- Recursing on very deep inputs and hitting the recursion limit; switch to an explicit\
    \ stack.\n- Claiming DFS finds shortest paths; it does not.\n- Treating an iterative stack version\
    \ as producing the same order as recursion without pushing neighbours in reverse.\n\n## In the interview\n\
    Name its typical uses: connected components, number of islands, cycle detection, topological sort,\
    \ path existence, and backtracking problems such as permutations. Mention the recursion-depth trade-off\
    \ and offer the iterative version. Interviewers like hearing you compare it with BFS on memory (DFS\
    \ holds one path, BFS holds a whole frontier).\n"
