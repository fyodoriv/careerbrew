- id: kb-1252d7a25181
  question: What is a race condition?
  answer: A race condition is a bug where the result depends on the unpredictable timing or ordering of
    concurrent operations on shared state. The classic case is a read-modify-write, such as count += 1,
    interleaving between threads and losing updates; fix it with locks, atomic operations, transactions,
    or by not sharing mutable state.
  topic: computer science
  tags:
  - concurrency
  - threads
  - synchronization
  - bugs
  explanation: "## In plain words\nTwo people share one bank account with 100 in it. Both check the balance\
    \ at the same moment, both see 100, both withdraw 80, and the bank allows both. The result depends\
    \ on who got there when. In code, a race condition appears when two threads or processes touch shared\
    \ data without coordination.\n\n## How it works\n- **Read-modify-write**: `count += 1` is really read,\
    \ add, write. Two threads can both read 5 and both write 6, losing one increment.\n- **Check-then-act**:\
    \ \"if the file does not exist, create it\" can be broken by another process acting between the check\
    \ and the act (time-of-check to time-of-use, TOCTOU).\n- Races appear with threads, processes, async\
    \ tasks, and distributed services sharing a database.\n- **Fixes**:\n  - Mutual exclusion: a lock\
    \ or mutex around the critical section.\n  - Atomic operations: compare-and-swap, atomic counters,\
    \ `INCR` in Redis.\n  - Database tools: transactions with suitable isolation, `SELECT ... FOR UPDATE`,\
    \ or optimistic locking with a version column.\n  - Design: immutable data, message passing, or confining\
    \ state to one thread.\n- A **data race** is a narrower term: two threads access the same memory without\
    \ synchronization and at least one writes.\n\n## Example\n```python\nimport threading\n\ncount, lock\
    \ = 0, threading.Lock()\n\ndef work():\n    global count\n    for _ in range(100_000):\n        with\
    \ lock:            # remove the lock and the total can come out below 400000\n            count +=\
    \ 1\n\nthreads = [threading.Thread(target=work) for _ in range(4)]\nfor t in threads: t.start()\n\
    for t in threads: t.join()\nprint(count)  # 400000\n```\n\n## Common mistakes\n- Assuming a test that\
    \ passes once proves there is no race; races are timing dependent and intermittent.\n- Locking reads\
    \ but not writes, or using different locks for the same data.\n- Holding locks too long, or taking\
    \ several locks in different orders, which can deadlock.\n\n## In the interview\nDefine it, give the\
    \ counter or bank example, and name several fixes with trade-offs (locks are simple but limit parallelism;\
    \ atomics are fast but narrow; optimistic locking suits low contention). Mention tools such as thread\
    \ sanitizers and stress tests.\n"
