  question: What is Big O notation and why is it used?
  answer: Big O describes an upper bound on how an algorithm's time or memory grows as the input size
    grows, ignoring constant factors and smaller terms. It lets you compare algorithms by how they scale,
    usually for the worst case.
  topic: computer science
  tags:
  - algorithms
  - complexity
  - big-o
  explanation: "## In plain words\nBig O tells you how the cost of an algorithm grows when the input gets\
    \ bigger, not how many seconds it takes. If you double the input, does the work stay the same, double,\
    \ or quadruple? It is like asking how a commute grows with distance rather than timing one trip.\n\
    \n## How it works\n- Count the basic steps (or memory cells) as a function of the input size `n`.\n\
    - Keep only the fastest-growing term and drop constants: `3n² + 5n + 2` becomes `O(n²)`.\n- Formally,\
    \ `f(n) = O(g(n))` means that for large enough `n`, `f(n) <= c * g(n)` for some constant `c`. It is\
    \ an upper bound.\n- Related terms: Omega (Ω) is a lower bound; Theta (Θ) is a tight bound (both upper\
    \ and lower). In everyday interviews people say \"Big O\" and mean the tight worst-case bound.\n-\
    \ Common classes from fast to slow: `O(1)`, `O(log n)`, `O(n)`, `O(n log n)`, `O(n²)`, `O(2^n)`, `O(n!)`.\n\
    - You can analyze worst, average, or best case, and time or space, separately. Amortized analysis\
    \ averages cost over a sequence of operations (for example, appends to a dynamic array are amortized\
    \ `O(1)`).\n\n## Example\n```python\ndef has_duplicate(xs):          # O(n^2) time, O(1) extra space\n\
    \    for i in range(len(xs)):\n        for j in range(i + 1, len(xs)):\n            if xs[i] == xs[j]:\n\
    \                return True\n    return False\n\ndef has_duplicate_fast(xs):     # O(n) average time,\
    \ O(n) space\n    return len(set(xs)) != len(xs)\n```\nFor one million items, the first does about\
    \ 5 × 10¹¹ comparisons; the second about 10⁶ hash operations.\n\n## Common mistakes\n- Keeping constants\
    \ or lower terms, like `O(2n + 1)`.\n- Forgetting that two different inputs need two variables: looping\
    \ over `a` then `b` is `O(a + b)`, not `O(n)`.\n- Ignoring space complexity, including recursion stack\
    \ depth.\n- Assuming a better Big O is always faster; for small inputs constants and cache behaviour\
    \ matter.\n\n## In the interview\nState time and space for every solution you write, and say which\
    \ case you mean. Be ready to explain why a hash lookup is average `O(1)` but worst case `O(n)`, and\
    \ why sorting-based solutions are `O(n log n)`. Trade time for space out loud: \"I can get `O(n)`\
    \ time by spending `O(n)` memory on a set.\"\n"
