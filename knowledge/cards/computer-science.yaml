- id: kb-67f89e40b966
  question: What is composition in object-oriented design?
  answer: Composition builds a class by holding other objects as fields and delegating work to them, a
    'has-a' relationship, instead of inheriting from them, an 'is-a' relationship. It keeps classes loosely
    coupled and lets behaviour be swapped at runtime, which is why designers often favour composition
    over inheritance.
  topic: computer science
  tags:
  - oop
  - composition
  - design-principles
  - inheritance
  explanation: "## In plain words\nA car has an engine, wheels, and a radio. It does not inherit from\
    \ Engine. Composition means assembling an object out of parts and asking those parts to do their jobs.\
    \ Swap the petrol engine for an electric one and the car still works.\n\n## How it works\n- A class\
    \ keeps references to collaborator objects (often received through the constructor).\n- Its methods\
    \ delegate: `self.engine.start()`.\n- Parts usually depend on interfaces, so different implementations\
    \ can be plugged in.\n- **Composition vs aggregation**: in strict UML terms, composition means the\
    \ whole owns the part's lifetime; aggregation means the part can live on its own. In everyday talk\
    \ \"composition\" covers both.\n- **Why prefer it**:\n  - Inheritance ties a subclass to its parent's\
    \ internals (the \"fragile base class\" problem).\n  - A class can combine many parts but usually\
    \ inherits from one parent.\n  - Behaviour can change at runtime by replacing a part.\n- Patterns\
    \ built on it: Strategy, Decorator, and Adapter.\n\n## Example\n```python\nclass EmailSender:\n  \
    \  def send(self, msg): return f\"email: {msg}\"\n\nclass SmsSender:\n    def send(self, msg): return\
    \ f\"sms: {msg}\"\n\nclass Notifier:\n    def __init__(self, sender):\n        self.sender = sender\
    \          # has-a sender\n    def alert(self, msg):\n        return self.sender.send(msg)\n\nprint(Notifier(SmsSender()).alert(\"\
    disk full\"))  # sms: disk full\n```\nWith inheritance you would need `EmailNotifier`, `SmsNotifier`,\
    \ and soon `UrgentSmsNotifier` and more, a class explosion.\n\n## Common mistakes\n- Inheriting just\
    \ to reuse a few methods when there is no true \"is-a\" relationship.\n- Exposing internal parts publicly\
    \ so callers reach through them (this breaks the Law of Demeter).\n- Saying inheritance is always\
    \ wrong; it fits real, stable type hierarchies.\n\n## In the interview\nGive the \"has-a vs is-a\"\
    \ test, a short example, and the benefits: flexibility, testability with fakes, and less coupling.\
    \ Mention the costs: more small objects and forwarding code. Connect it to the Strategy pattern and\
    \ dependency injection.\n"
