  question: What is a circuit breaker?
  answer: 'A circuit breaker is a resilience pattern that wraps calls to a remote service and stops calling
    it after repeated failures. It has three states: closed (calls flow), open (calls fail fast for a
    cool-down period), and half-open (a few trial calls test recovery). It prevents cascading failures
    and gives the failing service room to recover.'
  topic: computer science
  tags:
  - system-design
  - resilience
  - microservices
  - fault-tolerance
  explanation: "## In plain words\nLike the electrical breaker in your home: when something goes wrong,\
    \ it trips and cuts the circuit instead of letting the fault spread. In software, if a service keeps\
    \ failing, the breaker stops sending it requests for a while, so callers fail fast instead of piling\
    \ up waiting threads.\n\n## How it works\n- **Closed**: requests pass through; failures (errors or\
    \ timeouts) are counted in a rolling window.\n- When failures cross a threshold (for example 50% of\
    \ the last 20 calls), switch to **open**.\n- **Open**: requests fail immediately or return a fallback\
    \ (cached data, default value, degraded feature) without calling the service.\n- After a timeout,\
    \ switch to **half-open**: let a few trial requests through.\n  - If they succeed, close the breaker.\n\
    \  - If they fail, open it again.\n- Pair it with timeouts (a breaker cannot count a call that never\
    \ ends), retries with exponential backoff and jitter, and bulkheads (separate resource pools per dependency).\n\
    - Expose metrics and alerts for state changes.\n\n## Example\n```python\nimport time\n\nclass Breaker:\n\
    \    def __init__(self, limit=3, cooldown=10):\n        self.limit, self.cooldown = limit, cooldown\n\
    \        self.fails, self.opened_at = 0, None\n\n    def call(self, fn):\n        if self.opened_at\
    \ and time.time() - self.opened_at < self.cooldown:\n            raise RuntimeError(\"circuit open\"\
    )\n        try:\n            result = fn()\n        except Exception:\n            self.fails += 1\n\
    \            if self.fails >= self.limit:\n                self.opened_at = time.time()\n        \
    \    raise\n        self.fails, self.opened_at = 0, None\n        return result\n```\nAfter the cooldown,\
    \ the next call acts as the half-open trial.\n\n## Common mistakes\n- Using retries alone, which multiplies\
    \ load on a struggling service.\n- No timeouts, so the breaker never sees failures.\n- One global\
    \ breaker for many unrelated endpoints.\n- No fallback, so an open breaker becomes a user-facing outage\
    \ anyway.\n\n## In the interview\nExplain the three states and the cascading-failure problem it prevents.\
    \ Mention concrete numbers for thresholds and cool-down and that they need tuning. Expect follow-ups\
    \ on retries with backoff, idempotency, bulkheads, and how a service mesh or library can provide breakers\
    \ without custom code.\n"
