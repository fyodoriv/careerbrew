- id: kb-cd63af335151
  question: What is the circuit breaker pattern?
  answer: A circuit breaker wraps calls to a remote service and stops making them after failures cross
    a threshold, failing fast instead of waiting on timeouts. After a cool-down it lets a few trial requests
    through (half-open); if they succeed it closes again. It prevents cascading failures and gives the
    failing service room to recover.
  topic: computer science
  tags:
  - system-design
  - resilience
  - microservices
  - circuit-breaker
  explanation: "## In plain words\nIt works like the electrical breaker in your house: when something\
    \ goes wrong, it trips and cuts the connection so the problem does not spread. In software, if a downstream\
    \ service keeps failing, the breaker stops sending it requests for a while instead of letting every\
    \ caller hang and pile up.\n\n## How it works\n- **Closed (normal):** calls go through; the breaker\
    \ counts failures and timeouts.\n- **Open (tripped):** once failures exceed a threshold (for example\
    \ 50% of the last 20 calls), calls fail immediately or return a fallback, without contacting the service.\n\
    - **Half-open (testing):** after a cool-down period, a few requests are allowed. Success closes the\
    \ breaker; failure opens it again.\n- Pair it with timeouts (so failures are detected quickly), retries\
    \ with backoff (for brief errors), bulkheads (separate resource pools), and fallbacks (cached data,\
    \ default values, degraded features).\n- Libraries: Resilience4j (Java), Polly (.NET); service meshes\
    \ such as Istio offer similar behaviour at the network level.\n\n## Example\n```python\nimport time\n\
    \nclass CircuitBreaker:\n    def __init__(self, threshold=3, cooldown=5.0):\n        self.threshold,\
    \ self.cooldown = threshold, cooldown\n        self.failures, self.opened_at = 0, None\n\n    def\
    \ call(self, fn, fallback):\n        if self.opened_at is not None:\n            if time.monotonic()\
    \ - self.opened_at < self.cooldown:\n                return fallback()          # open: fail fast\n\
    \            self.opened_at = None          # half-open: try once\n        try:\n            result\
    \ = fn()\n            self.failures = 0\n            return result\n        except Exception:\n  \
    \          self.failures += 1\n            if self.failures >= self.threshold:\n                self.opened_at\
    \ = time.monotonic()\n            return fallback()\n```\n\n## Common mistakes\n- Retrying aggressively\
    \ without a breaker, which amplifies load on a struggling service.\n- Thresholds so sensitive that\
    \ normal noise trips the breaker.\n- No fallback, so an open breaker just turns into user-facing errors.\n\
    - One shared breaker for unrelated endpoints, so one bad endpoint blocks healthy ones.\n\n## In the\
    \ interview\nExplain the three states and the problem it solves: cascading failures and exhausted\
    \ threads or connections. Interviewers like hearing how you would tune thresholds, what the fallback\
    \ is, and how you would monitor breaker state with metrics and alerts. Mention it alongside timeouts,\
    \ retries with jitter, and idempotency as the standard resilience toolkit.\n"
