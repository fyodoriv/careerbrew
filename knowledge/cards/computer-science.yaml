  question: What is the in-degree of a node in a graph?
  answer: 'In a directed graph, a node''s in-degree is the number of edges pointing into it, and its out-degree
    is the number of edges leaving it. In-degrees drive Kahn''s topological sort: nodes with in-degree
    zero have no unmet prerequisites.'
  topic: computer science
  tags:
  - graphs
  - topological-sort
  - dag
  explanation: "## In plain words\nIf a graph's edges are arrows, a node's in-degree counts the arrows\
    \ pointing at it. In a task graph where an arrow means \"must happen before\", the in-degree is the\
    \ number of things still blocking that task.\n\n## How it works\n- Compute in-degrees in one pass\
    \ over the edges: for each edge `u -> v`, add 1 to `indeg[v]`. Time `O(E)`.\n- Out-degree is the count\
    \ of edges leaving a node, which is the length of its adjacency list.\n- In an undirected graph there\
    \ is just \"degree\" (number of incident edges); the sum of all degrees is `2E`.\n- Uses:\n  - Topological\
    \ sort: start with in-degree-zero nodes, remove them, and decrement neighbours.\n  - Find sources\
    \ (in-degree 0) and sinks (out-degree 0).\n  - Find the town judge: a node with in-degree `n - 1`\
    \ and out-degree 0.\n  - Detect cycles: if Kahn's algorithm cannot reduce every node to zero, a cycle\
    \ exists.\n\n## Example\nEdges: `A -> B`, `A -> C`, `B -> C`.\n- In-degrees: A = 0, B = 1, C = 2.\n\
    - Out-degrees: A = 2, B = 1, C = 0.\n```python\nfrom collections import Counter\n\nedges = [(\"A\"\
    , \"B\"), (\"A\", \"C\"), (\"B\", \"C\")]\nindeg = Counter(v for _, v in edges)\nnodes = {\"A\", \"\
    B\", \"C\"}\nprint({n: indeg.get(n, 0) for n in sorted(nodes)})  # {'A': 0, 'B': 1, 'C': 2}\n```\n\
    \n## Common mistakes\n- Forgetting nodes that have no incoming edges, so they never appear in the\
    \ count.\n- Mixing up edge direction from the input format.\n- Applying in-degree reasoning to undirected\
    \ graphs.\n\n## In the interview\nDefine it quickly, then connect it to an algorithm: interviewers\
    \ usually ask about in-degrees as part of course-schedule or build-order problems. Mention that computing\
    \ them is `O(V + E)` and that the \"remove zero in-degree nodes\" process both orders the graph and\
    \ detects cycles.\n"
