- id: kb-ffde63312ab2
  question: What is a tuple?
  answer: A tuple is an ordered, fixed-size collection of values, often of different types, accessed by
    position. In Python tuples are immutable, which makes them hashable (when their items are) and usable
    as dictionary keys or set members.
  topic: computer science
  tags:
  - data-structures
  - python
  - immutability
  - types
  explanation: "## In plain words\nA tuple is a small bundle of values that belong together, like a point\
    \ `(x, y)` or a record `(\"Ana\", 34)`. Its size is fixed, and in Python you cannot change it after\
    \ creating it. Think of it as a lightweight, read-only record.\n\n## How it works\n- **Ordered**:\
    \ items keep their positions; access by index, `t[0]`.\n- **Fixed size and, in Python, immutable**:\
    \ no append, no item assignment. A new tuple must be built to \"change\" one.\n- **Hashable** if all\
    \ its items are hashable, so it can be a dict key or set element. A list cannot.\n- **Unpacking**:\
    \ `x, y = point` assigns each item to a variable.\n- **Mathematics and databases**: an n-tuple is\
    \ an ordered list of n elements; a row in a relational table is called a tuple.\n- **Other languages**:\
    \ TypeScript tuple types (`[string, number]`), C++ `std::tuple`, Rust `(i32, f64)`. In some languages\
    \ tuples are fixed-length but their parts are not frozen; check the language.\n- **Named tuples**\
    \ and data classes add field names for readability.\n\n## Example\n```python\ndef min_max(nums):\n\
    \    return min(nums), max(nums)   # returns a tuple\n\nlo, hi = min_max([4, 9, 1])\nprint(lo, hi)\
    \  # 1 9\n\nvisited = {(0, 0), (0, 1)}      # grid cells as set members\nprint((0, 1) in visited)\
    \        # True\n```\n\n## Common mistakes\n- Writing `(5)` for a one-item tuple; that is just 5.\
    \ Use `(5,)`.\n- Assuming immutability is deep: a tuple holding a list cannot have its slots reassigned,\
    \ but the list inside can still change, and such a tuple is never hashable (`hash((1, [2]))` raises\
    \ `TypeError`).\n- Using long tuples where field names would make code clearer.\n\n## In the interview\n\
    Compare with lists: tuples for fixed, heterogeneous records and hashable keys; lists for growing,\
    \ homogeneous collections. In coding rounds, tuples are handy for grid coordinates in visited sets,\
    \ for heap entries like `(priority, item)`, and for returning several values. Mention that tuples\
    \ are slightly smaller and faster to create than lists.\n"
