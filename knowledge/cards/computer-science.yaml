  question: What is a heap, and what are its pros and cons?
  answer: 'A heap is a complete binary tree stored in an array where every parent is ordered relative
    to its children: smaller in a min-heap, larger in a max-heap. It gives O(1) access to the minimum
    or maximum, O(log n) insert and remove, and O(n) build. It does not support fast search for arbitrary
    values or sorted iteration.'
  topic: computer science
  tags:
  - heap
  - priority-queue
  - data-structures
  explanation: "## In plain words\nA heap is a partially sorted pile that always keeps the most important\
    \ item on top. It does not bother sorting everything, which is exactly why it is fast: it only guarantees\
    \ that each parent beats its children, which is enough to find the top item instantly.\n\n## How it\
    \ works\n- **Structure:** a complete binary tree, so it fits in an array: children of i are `2i +\
    \ 1` and `2i + 2`, parent is `(i - 1) // 2`.\n- **Heap property:** each parent is at most (min-heap)\
    \ or at least (max-heap) its children.\n- **Operations:**\n  - Peek top: `O(1)`.\n  - Push: append\
    \ and sift up, `O(log n)`.\n  - Pop top: move the last item to the root and sift down, `O(log n)`.\n\
    \  - Build from n items: `O(n)` bottom-up.\n- **Uses:** priority queues, Dijkstra and Prim, top-k,\
    \ merge k sorted lists, running median, heap sort, schedulers.\n\n**Pros:** fast min or max, simple\
    \ array storage with no pointers, efficient for streaming top-k.\n**Cons:** searching for a value\
    \ is `O(n)`; no sorted iteration without popping everything (`O(n log n)`); updating an arbitrary\
    \ element's priority needs its index; heap sort is not stable and has poorer cache behaviour than\
    \ quicksort.\n\n## Example\n```python\nimport heapq\n\nnums = [7, 2, 9, 4, 1]\nheapq.heapify(nums)\
    \            # O(n)\nprint(nums[0])                 # 1, the minimum\nheapq.heappush(nums, 0)    \
    \    # O(log n)\nprint([heapq.heappop(nums) for _ in range(3)])  # [0, 1, 2]\n```\nFor a max-heap\
    \ in Python, push negated values and negate them again on the way out.\n\n## Common mistakes\n- Thinking\
    \ the array is sorted.\n- Confusing the heap data structure with the \"heap\" memory region.\n- Saying\
    \ build-heap is `O(n log n)`.\n- Using a heap when you need sorted iteration or fast lookups by key.\n\
    \n## In the interview\nExplain the property and the array layout, then the complexities. Interviewers\
    \ love the comparison: a heap versus a sorted array versus a balanced BST for a priority queue. Mention\
    \ typical interview patterns (top-k, k-way merge, two heaps for a median) and how to handle priority\
    \ updates with lazy deletion.\n"
