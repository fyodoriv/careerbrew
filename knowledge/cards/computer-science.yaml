- id: kb-d52d9fdcc655
  question: What is an unbalanced tree, and why does it matter?
  answer: A tree is unbalanced when some branches are much deeper than others, so its height grows far
    beyond O(log n). In the worst case a binary search tree degenerates into a linked list and search,
    insert, and delete become O(n) instead of O(log n).
  topic: computer science
  tags:
  - data-structures
  - trees
  - balanced-bst
  - complexity
  explanation: "## In plain words\nTree operations cost time proportional to the tree's height. A bushy,\
    \ balanced tree of a million nodes is about 20 levels tall. If you insert already sorted data into\
    \ a plain binary search tree, every new node goes to the right, and you get a million-level \"tree\"\
    \ that is really a list.\n\n## How it works\n- **Height** h is the longest path from root to leaf.\
    \ BST search, insert, and delete cost O(h).\n- **Balanced**: h is O(log n). Definitions vary: AVL\
    \ trees require subtree heights to differ by at most 1 at every node; red-black trees allow the longest\
    \ path to be up to twice the shortest.\n- **Unbalanced**: h can approach n. Common cause: inserting\
    \ keys in sorted or nearly sorted order into a BST that never rebalances.\n- **Fixes**:\n  - Self-balancing\
    \ trees (AVL, red-black, B-trees) rotate or split nodes on each update to keep h at O(log n).\n  -\
    \ Randomization (treaps, or shuffling input before building).\n  - Rebuilding the tree from a sorted\
    \ list by picking middle elements as roots.\n\n## Example\n```python\ndef check_balanced(node):\n\
    \    # returns height, or -1 if any subtree is unbalanced\n    if node is None:\n        return 0\n\
    \    lh = check_balanced(node.left)\n    rh = check_balanced(node.right)\n    if lh == -1 or rh ==\
    \ -1 or abs(lh - rh) > 1:\n        return -1\n    return 1 + max(lh, rh)\n```\nInserting 1, 2, 3,\
    \ 4, 5 into a plain BST gives height 5 (counting nodes); a balanced version has height 3.\n\n## Common\
    \ mistakes\n- Checking balance only at the root; the rule must hold at every node.\n- Computing height\
    \ separately for every node, making the check O(n^2) instead of the O(n) single pass above.\n- Assuming\
    \ all BSTs give O(log n) operations.\n\n## In the interview\nExplain why balance matters through the\
    \ O(h) cost, give the sorted-input example, and name the fixes. \"Check if a binary tree is height-balanced\"\
    \ is a common coding question; return height and a failure signal in one pass. Mention that libraries\
    \ use red-black trees (Java `TreeMap`) and databases use B+ trees.\n"
