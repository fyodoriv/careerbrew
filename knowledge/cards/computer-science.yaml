- id: kb-50c67ccba5d9
  question: What is a B+ tree?
  answer: A B+ tree is a balanced, wide search tree in which internal nodes hold only keys for routing
    and all records live in the leaves, which are linked in sorted order. Its high fan-out keeps it shallow,
    so lookups need few disk reads, and the linked leaves make range scans fast; most relational database
    indexes use it.
  topic: computer science
  tags:
  - data-structures
  - databases
  - indexes
  - b-plus-tree
  explanation: '## In plain words

    A binary tree with a billion keys is about 30 levels deep, which is 30 slow disk reads. A B+ tree
    puts hundreds of keys in each node, sized to a disk page, so the same billion keys fit in 3 or 4 levels.
    It is the structure behind most database indexes.


    ## How it works

    - Every node holds up to `m` keys (the order); every node except the root is at least half full.

    - **Internal nodes** store keys and child pointers only. They guide the search.

    - **Leaves** store the keys plus the records or pointers to them, and each leaf links to the next
    leaf.

    - All leaves are at the same depth, so the tree is always balanced.

    - **Search**: from the root, pick the child whose key range contains the target; O(log_m n) node reads.

    - **Insert**: add to the right leaf; if it overflows, split it and push a separator key up, which
    may split parents, and rarely the root.

    - **Range query**: find the first key, then walk the linked leaves.

    - Compared with a B-tree, which stores records in internal nodes too, B+ trees fit more keys per internal
    node and scan ranges faster.


    ## Example

    With 4 KB pages and about 400 keys per node, three levels index 400 x 400 x 400 = 64 million keys.
    A lookup reads three pages, and the top levels are usually cached in memory, so often only one disk
    read is needed. `WHERE age BETWEEN 30 AND 40` finds 30 once and then walks leaves.


    ## Common mistakes

    - Confusing it with a binary search tree; nodes have many children, not two.

    - Saying B-tree and B+ tree are identical.

    - Forgetting writes cost: random inserts split pages and cause write amplification.


    ## In the interview

    Explain why it suits disks (high fan-out, page-sized nodes, sequential leaf scans). Contrast with
    LSM trees: B+ trees favour reads and in-place updates; LSM trees favour heavy write loads. Mention
    that a clustered index stores the rows in leaf order (as in InnoDB), so primary-key range scans are
    cheap.

    '
