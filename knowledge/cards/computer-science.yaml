  explanation: '## In plain words

    System design interviews reuse the same set of Lego bricks. Once you know what each brick is for and
    what it costs, designing a URL shortener or a chat app becomes a question of which bricks to combine
    and why.


    ## How it works

    Building blocks:

    - **Load balancer**: spreads traffic across servers; enables horizontal scaling and health checks.

    - **Cache** (in-memory store, CDN at the edge): cuts latency and database load; needs an eviction
    and invalidation plan.

    - **Database**: relational or NoSQL; scale reads with replicas, scale writes and size with sharding
    (partitioning by a key).

    - **Message queue / log**: decouples producers and consumers, absorbs spikes, enables retries.

    - **Object storage**: files and media.

    - **Search index**, **time-series store**, **API gateway**.


    Patterns:

    - Stateless services behind a load balancer.

    - Cache-aside: read the cache, fall back to the database, then fill the cache.

    - Async processing: return quickly and do heavy work in background workers.

    - Fan-out on write vs on read (news feeds).

    - Rate limiting (token bucket), circuit breakers, retries with backoff and idempotency keys.

    - Event sourcing and CQRS: separate write and read models.

    - Consistent hashing for distributing keys across nodes.


    ## Example

    Design a URL shortener at a glance: stateless API servers behind a load balancer; a key-value store
    mapping short code to URL; a cache in front because reads far outnumber writes; codes generated from
    a counter encoded in base 62; analytics events sent to a queue and aggregated asynchronously.


    ## Common mistakes

    - Naming components without saying why each is needed.

    - Adding microservices, queues, and caches before estimating load.

    - Ignoring failure modes: what happens when the cache or a replica is down?

    - Forgetting consistency questions introduced by caching and replication.


    ## In the interview

    Structure the interview: clarify requirements, estimate scale, sketch a simple design, then scale
    the bottleneck. For each block you add, state the problem it solves and the trade-off (cost, staleness,
    complexity). Expect deep dives on one component, such as sharding keys or cache invalidation.

    '
