  question: How do you implement a heap or priority queue?
  answer: 'Store a complete binary tree in an array: the children of index i are 2i+1 and 2i+2, and the
    parent is (i-1)//2. Insert by appending and sifting up; remove the top by moving the last element
    to the root and sifting down. Both are O(log n); peeking is O(1).'
  topic: computer science
  tags:
  - heap
  - priority-queue
  - data-structures
  explanation: "## In plain words\nA priority queue always hands you the most important item next, like\
    \ a hospital triage desk. A binary heap is the usual way to build one: a tree where every parent is\
    \ smaller than its children (min-heap), so the smallest item sits at the top.\n\n## How it works\n\
    - The heap property: in a min-heap, each parent is less than or equal to its children. The tree is\
    \ complete (filled level by level, left to right), so it fits in an array with no gaps.\n- **Push:**\
    \ append at the end, then sift up: while the item is smaller than its parent, swap them.\n- **Pop:**\
    \ save the root, move the last element to the root, then sift down: swap with the smaller child while\
    \ a child is smaller.\n- **Heapify** an existing array in `O(n)` by sifting down from the last non-leaf\
    \ node to the root.\n- Costs: push and pop `O(log n)`, peek `O(1)`, space `O(n)`.\n\n## Example\n\
    ```python\nclass MinHeap:\n    def __init__(self):\n        self.a = []\n    def push(self, x):\n\
    \        a = self.a\n        a.append(x)\n        i = len(a) - 1\n        while i > 0 and a[(i - 1)\
    \ // 2] > a[i]:\n            p = (i - 1) // 2\n            a[i], a[p] = a[p], a[i]\n            i\
    \ = p\n    def pop(self):\n        a = self.a\n        top, last = a[0], a.pop()\n        if a:\n\
    \            a[0], i = last, 0\n            while True:\n                l, r, s = 2 * i + 1, 2 *\
    \ i + 2, i\n                if l < len(a) and a[l] < a[s]: s = l\n                if r < len(a) and\
    \ a[r] < a[s]: s = r\n                if s == i: break\n                a[i], a[s] = a[s], a[i]\n\
    \                i = s\n        return top\n\nh = MinHeap()\nfor x in (5, 1, 4, 2):\n    h.push(x)\n\
    print([h.pop() for _ in range(4)])  # [1, 2, 4, 5]\n```\n\n## Common mistakes\n- Swapping with the\
    \ larger child when sifting down a min-heap.\n- Thinking a heap is sorted; only the root is guaranteed\
    \ to be the minimum.\n- Claiming heapify is `O(n log n)`; bottom-up heapify is `O(n)`.\n- Forgetting\
    \ that Python's `heapq` is a min-heap; negate values for a max-heap.\n\n## In the interview\nIn most\
    \ interviews you can use the library (`heapq`, Java's `PriorityQueue`) but should be able to explain\
    \ sift up and sift down. Mention typical uses: top-k elements, merging k sorted lists, Dijkstra, and\
    \ scheduling. Expect a question on why a heap beats a sorted array for frequent inserts.\n"
