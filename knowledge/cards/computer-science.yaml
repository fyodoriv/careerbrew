  question: What is the Dependency Injection pattern?
  answer: Dependency injection (DI) means an object receives the things it depends on (database clients,
    loggers, services) from the outside, usually through its constructor, instead of creating them itself.
    This decouples code from concrete implementations, makes testing with fakes easy, and centralises
    configuration.
  topic: computer science
  tags:
  - design-patterns
  - dependency-injection
  - testing
  - solid
  explanation: "## In plain words\nIf a class builds its own database connection inside its constructor,\
    \ you cannot test it without a real database. With dependency injection, the class just says \"give\
    \ me something that can store data\", and whoever creates it decides what to hand over: the real database\
    \ in production, a fake in tests.\n\n## How it works\n- **Constructor injection (preferred):** dependencies\
    \ are passed as constructor arguments, so the object is fully ready once created.\n- **Setter or property\
    \ injection:** dependencies are set after creation; useful for optional ones.\n- **Method injection:**\
    \ pass the dependency to the single method that needs it.\n- **Composition root:** one place at startup\
    \ (often `main`) wires real implementations together.\n- **DI containers** (Spring, .NET's built-in\
    \ container, Angular's injector, NestJS) automate wiring and lifetimes (singleton, per-request). They\
    \ are optional; plain constructor arguments are DI too.\n- DI is a technique for the dependency inversion\
    \ principle: high-level code depends on abstractions.\n\n## Example\n```python\nclass Clock:\n   \
    \ def now(self):\n        import datetime\n        return datetime.datetime.now()\n\nclass FixedClock:\n\
    \    def __init__(self, hour): self.hour = hour\n    def now(self):\n        import datetime\n   \
    \     return datetime.datetime(2024, 1, 1, self.hour)\n\nclass Greeter:\n    def __init__(self, clock):\
    \        # dependency injected\n        self.clock = clock\n    def greet(self):\n        return \"\
    Good morning\" if self.clock.now().hour < 12 else \"Good afternoon\"\n\nprint(Greeter(FixedClock(9)).greet())\
    \   # Good morning (deterministic test)\nprint(Greeter(FixedClock(15)).greet())  # Good afternoon\n\
    ```\n\n## Common mistakes\n- Equating DI with using a framework; passing arguments is enough.\n- Using\
    \ a service locator (pulling from a global registry), which hides dependencies.\n- Injecting too many\
    \ dependencies into one class, a sign it does too much.\n- Over-abstracting with interfaces that have\
    \ only one implementation forever.\n\n## In the interview\nExplain the testability benefit with a\
    \ concrete fake (a clock, an email sender). Interviewers like the distinction between DI (technique),\
    \ dependency inversion (principle), and DI containers (tools). Mention trade-offs: more wiring code\
    \ and indirection, and container magic can make startup errors harder to trace.\n"
