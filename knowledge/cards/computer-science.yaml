- id: kb-163b42089fe4
  question: When should you choose BFS versus DFS?
  answer: Use BFS when you need the shortest path in an unweighted graph or want to explore level by level,
    accepting memory proportional to the widest level. Use DFS for exhaustive exploration, backtracking,
    cycle detection, topological sort, and connected components, where memory grows with depth. Both run
    in O(V + E).
  topic: computer science
  tags:
  - graphs
  - algorithms
  - bfs
  - dfs
  explanation: '## In plain words

    BFS (breadth-first search) spreads out like ripples in a pond: first all neighbours, then their neighbours.
    DFS (depth-first search) follows one path as far as it goes, then backs up and tries another, like
    exploring a maze with one hand on the wall.


    ## How it works

    **BFS**

    - Uses a queue. Visits nodes in order of distance (number of edges) from the start.

    - Finds shortest paths in unweighted graphs, and the minimum number of moves in puzzles.

    - Memory: O(width), which can be huge for wide graphs.


    **DFS**

    - Uses recursion or an explicit stack.

    - Natural for backtracking (permutations, sudoku), cycle detection, topological order, finding connected
    components, and path existence.

    - Memory: O(depth); deep graphs can overflow the call stack if recursive.


    Both visit each vertex and edge once: O(V + E) time, O(V) for the visited set.


    ## Example

    Rules of thumb:

    - "Minimum number of steps for a knight to reach a square": BFS.

    - "Does a path exist from A to B?": either; DFS is often simpler.

    - "List all paths" or "all combinations": DFS with backtracking.

    - "Course schedule order": DFS post-order or BFS with indegrees (Kahn).

    - "Nearest exit in a grid": BFS, possibly multi-source BFS from all exits at once.

    - Huge or infinite search space with a shallow target: BFS or iterative deepening DFS, which combines
    DFS''s small memory with BFS''s shortest-depth guarantee.


    ## Common mistakes

    - Using DFS for shortest paths; the first path found is not necessarily the shortest.

    - Using BFS for weighted shortest paths; that needs Dijkstra.

    - Recursive DFS on a 1,000,000-node chain overflowing the stack.

    - Forgetting the visited set on graphs with cycles.


    ## In the interview

    Name the deciding question: "do I need the shortest or nearest result?" If yes, BFS; if you need to
    explore all options or work with structure (order, components, cycles), DFS. State the time and memory
    trade-offs, and mention you can convert recursive DFS to an iterative stack.

    '
