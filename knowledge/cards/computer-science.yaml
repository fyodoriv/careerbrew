- id: kb-f6618deefe25
  question: What is Manhattan (L1, taxicab) distance?
  answer: Manhattan distance between two points is the sum of the absolute differences of their coordinates,
    |x1 - x2| + |y1 - y2|. It is the distance you travel on a grid where you can only move along the axes.
  topic: computer science
  tags:
  - math
  - distance
  - geometry
  - grids
  explanation: "## In plain words\nImagine walking in a city laid out in a perfect grid. You cannot cut\
    \ diagonally through buildings, so the distance between two corners is the blocks you walk east-west\
    \ plus the blocks you walk north-south. That is Manhattan distance, also called L1 or taxicab distance.\n\
    \n## How it works\n- For points `(x1, y1)` and `(x2, y2)`: `d = |x1 - x2| + |y1 - y2|`.\n- In n dimensions,\
    \ sum the absolute difference in every coordinate.\n- Compare with Euclidean (L2) distance, the straight\
    \ line: `sqrt((x1-x2)^2 + (y1-y2)^2)`. Manhattan is always greater than or equal to Euclidean.\n-\
    \ Chebyshev (L-infinity) distance takes the maximum coordinate difference; it fits a king on a chessboard\
    \ that can move diagonally.\n- Computing it is O(d) for d dimensions and needs no square root.\n\n\
    ## Example\n```python\ndef manhattan(p, q):\n    return sum(abs(a - b) for a, b in zip(p, q))\n\n\
    print(manhattan((1, 2), (4, 6)))  # 3 + 4 = 7\n```\nThe Euclidean distance between the same points\
    \ is 5.\n\n## Common mistakes\n- Forgetting the absolute value, so differences cancel out.\n- Using\
    \ it as an A* heuristic on a grid that allows diagonal moves: it then overestimates and A* may return\
    \ a non-shortest path.\n- Mixing it up with Euclidean distance when the problem says \"grid steps\"\
    .\n\n## In the interview\nIt appears in grid problems (shortest path with only four moves, \"k closest\
    \ points\" variants) and as the standard admissible heuristic for A* on four-direction grids. A useful\
    \ trick: the point minimizing the total Manhattan distance to a set of points is the median in each\
    \ coordinate, found separately for x and y. Mention it is also used in machine learning as the L1\
    \ norm, which is less sensitive to outliers than L2.\n"
