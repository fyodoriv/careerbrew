  explanation: "## In plain words\nDFS needs two things: a way to remember where to come back to (the\
    \ call stack, or your own stack), and a visited set so cycles do not trap you. The recursive version\
    \ is shortest; the iterative one avoids running out of stack on deep graphs.\n\n## How it works\n\
    - Recursive: `def dfs(u): visited.add(u); for v in graph[u]: if v not in visited: dfs(v)`.\n- Iterative:\
    \ `stack = [start]`; while the stack is not empty, pop `u`; if visited, continue; mark it; push its\
    \ neighbours.\n- The iterative order differs slightly from the recursive one (neighbours come off\
    \ in reverse). Push them reversed if order matters.\n- Hooks: do work before the loop (pre-order)\
    \ or after it (post-order, used for topological sort and subtree sums).\n- Time O(V + E); space O(V)\
    \ for visited plus the stack.\n\n## Example\n```python\ndef count_components(n, edges):\n    graph\
    \ = {i: [] for i in range(n)}\n    for a, b in edges:\n        graph[a].append(b)\n        graph[b].append(a)\n\
    \    seen, count = set(), 0\n    for s in range(n):\n        if s in seen:\n            continue\n\
    \        count += 1\n        stack = [s]\n        while stack:\n            u = stack.pop()\n    \
    \        if u in seen:\n                continue\n            seen.add(u)\n            stack.extend(graph[u])\n\
    \    return count\n\nprint(count_components(5, [(0, 1), (1, 2), (3, 4)]))  # 2\n```\n\n## Common mistakes\n\
    - No visited set on a cyclic graph.\n- Recursion depth errors on graphs with thousands of nodes in\
    \ a chain.\n- Marking visited too late in the iterative version without the \"skip if seen\" check,\
    \ causing repeat work.\n- Building the adjacency list for an undirected graph in one direction only.\n\
    \n## In the interview\nOffer the recursive version, then mention when you would switch to iterative.\
    \ Expect variants: detect a cycle (track nodes on the current path), find connected components, flood\
    \ fill, and backtracking where you un-mark a node on the way out. Compare with BFS on memory and on\
    \ what each guarantees.\n"
