- id: kb-b40c537b4626
  question: What is the client-server model?
  answer: In the client-server model, clients send requests over a network and a server, which owns shared
    resources or data, processes them and sends responses. It centralizes data and control, making it
    easier to secure and update, at the cost of a central bottleneck and single point of failure unless
    the server side is scaled.
  topic: computer science
  tags:
  - networking
  - architecture
  - client-server
  - system-design
  explanation: '## In plain words

    A restaurant: customers (clients) place orders, the kitchen (server) prepares them and sends back
    food. Many customers share one kitchen. The web works this way: your browser asks, a server answers.


    ## How it works

    - **Client**: starts the conversation, sends a request, and shows or uses the response. Examples:
    browsers, mobile apps, command-line tools.

    - **Server**: waits for requests on a known address and port, applies business rules, reads or writes
    data, and responds.

    - **Protocol**: an agreed format such as HTTP, gRPC, SQL wire protocols, or SMTP.

    - Usually stateless request-response; state lives in a database or is carried in tokens and cookies.

    - **Tiers**: two-tier (client talks to database server) or three-tier (client, application server,
    database).

    - **Scaling the server side**: load balancers, many server instances, caches, and replicated databases.

    - **Contrast**: peer-to-peer, where every node is both client and server (BitTorrent).


    ## Example

    Loading a profile page:

    1. The app sends `GET /users/42` with an auth token.

    2. A load balancer forwards it to one of several API servers.

    3. The server checks the token, reads user 42 from the database, and returns JSON with status 200.

    4. The app renders it. The client never touches the database directly.


    ## Common mistakes

    - Trusting the client: validation in the browser is for convenience; the server must validate everything
    again.

    - Treating "server" as one machine; it is a role that many machines can fill.

    - Ignoring network failure: requests time out, retry, and may arrive twice, so servers should make
    retried operations idempotent.


    ## In the interview

    Name the pros (central control of data, security, easier updates, thin clients) and cons (bottleneck,
    single point of failure, latency for distant users). Expect follow-ups on statelessness and horizontal
    scaling, how HTTP fits, and when peer-to-peer or edge computing is a better fit.

    '
