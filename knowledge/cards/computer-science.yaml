- id: kb-f2816d085767
  question: How can you tell that a program is stuck in an endless loop, and how do you prevent it?
  answer: Signs are a process pinned near 100% CPU with no progress, output that repeats or never arrives,
    and a stack sample that always shows the same code. Confirm with a debugger, profiler, or logs, and
    prevent it with loop variants that always shrink, iteration limits or timeouts, visited sets on graphs,
    and tests on edge cases.
  topic: computer science
  tags:
  - debugging
  - loops
  - reliability
  - algorithms
  explanation: "## In plain words\nAn endless (infinite) loop is code that never meets its exit condition.\
    \ In general no tool can decide for every program whether it will stop (that is the halting problem),\
    \ so in practice you look for symptoms, inspect where the program is, and write loops that clearly\
    \ make progress.\n\n## How it works\n**Spot it**\n- CPU near 100% on one core while nothing finishes,\
    \ or a request that never returns.\n- Logs repeating the same lines, or memory growing steadily as\
    \ a loop keeps appending.\n- Take stack samples: attach a debugger, use `py-spy dump`, `jstack`, or\
    \ send a signal for a thread dump. If every sample shows the same loop, you have found it.\n- Add\
    \ progress logging or counters around suspect loops.\n\n**Prevent it**\n- Make sure each iteration\
    \ moves toward the exit: a loop variant, such as `hi - lo` strictly shrinking in binary search.\n\
    - Mark visited nodes in graph traversal so cycles do not repeat forever.\n- Cap iterations or retries,\
    \ and put timeouts on network calls and jobs.\n- Test edge cases: empty input, one element, equal\
    \ values, cycles.\n\n## Example\n```python\ndef find(a, target):\n    lo, hi = 0, len(a) - 1\n   \
    \ while lo <= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == target:\n            return\
    \ mid\n        if a[mid] < target:\n            lo = mid + 1      # writing lo = mid here can loop\
    \ forever\n        else:\n            hi = mid - 1\n    return -1\n\nprint(find([1, 3, 5], 4))  #\
    \ -1, and it terminates\n```\n\n## Common mistakes\n- Forgetting to update the loop variable (for\
    \ example, a `while` loop with no increment).\n- Floating-point conditions like `while x != 1.0` that\
    \ never hit exactly.\n- Retry loops without a limit or backoff.\n- Concluding \"infinite loop\" when\
    \ the code is just very slow, such as an accidental O(n^2) on a big input.\n\n## In the interview\n\
    Describe the debugging steps (reproduce, sample the stack, inspect the loop state) and the preventive\
    \ habits. Expect a follow-up on cycle detection in linked lists or graphs, and a mention of the halting\
    \ problem.\n"
  match:
