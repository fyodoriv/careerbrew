  question: What is the Factory design pattern?
  answer: A factory is a function or method that creates objects for you, so callers ask for what they
    need instead of calling a specific constructor. It hides which concrete class is built and keeps creation
    logic in one place.
  topic: computer science
  tags:
  - design-patterns
  - creational
  - factory
  - oop
  explanation: "## In plain words\nInstead of writing `new PdfExporter()` all over your code, you call\
    \ `createExporter(\"pdf\")` and let one place decide which class to build. Think of ordering at a\
    \ restaurant counter: you ask for \"a coffee\", and the kitchen decides which machine and cup to use.\
    \ The caller depends on an interface, not on concrete classes.\n\n## How it works\n- Define a common\
    \ interface (for example `Exporter` with `export(data)`).\n- Write several concrete classes that implement\
    \ it.\n- Write a factory: a function or static method that takes a parameter (type, config, environment)\
    \ and returns an instance of the right class.\n- Callers use only the interface and the factory.\n\
    - Variants: a *simple factory* (one function with a switch), a *factory method* (subclasses override\
    \ a `create` method), and an *abstract factory* (an object that creates a whole family of related\
    \ objects, such as light-theme or dark-theme widgets).\n\n## Example\n```python\nclass JsonExporter:\n\
    \    def export(self, data): return str(data)\n\nclass CsvExporter:\n    def export(self, data): return\
    \ \",\".join(map(str, data))\n\ndef make_exporter(kind):\n    makers = {\"json\": JsonExporter, \"\
    csv\": CsvExporter}\n    if kind not in makers:\n        raise ValueError(f\"unknown exporter: {kind}\"\
    )\n    return makers[kind]()\n\nprint(make_exporter(\"csv\").export([1, 2, 3]))  # 1,2,3\n```\nA dictionary\
    \ of constructors avoids a long `if/elif` chain and makes adding a new type a one-line change.\n\n\
    ## Common mistakes\n- Adding a factory where a plain constructor would do; it adds indirection for\
    \ no gain.\n- Letting the factory grow into a huge switch that must be edited for every new type (a\
    \ registry helps).\n- Returning objects that do not share an interface, so callers still need type\
    \ checks.\n- Confusing the simple factory with the Factory Method and Abstract Factory patterns.\n\
    \n## In the interview\nSay what problem it solves: decoupling callers from concrete classes and centralising\
    \ creation (configuration, caching, validation). Give a real case such as choosing a storage driver\
    \ or payment provider from config. Expect follow-ups on the difference from Builder (step-by-step\
    \ construction of one complex object) and from Dependency Injection, and on testing: a factory makes\
    \ it easy to swap in a fake. Trade-off: more flexibility, one more layer to read.\n"
