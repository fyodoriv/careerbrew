  question: How do you implement BFS in code?
  answer: Use a FIFO queue seeded with the start node and a visited set. Repeatedly pop from the front,
    process the node, and enqueue each unvisited neighbour while marking it visited. O(V + E) time and
    O(V) space.
  topic: computer science
  tags:
  - bfs
  - graphs
  - implementation
  - queue
  explanation: "## In plain words\nImplementing BFS is mostly about using the right container. A queue\
    \ keeps nodes in the order they were discovered, so nearer nodes are always processed before farther\
    \ ones. Add a set so you never process the same node twice.\n\n## How it works\n- Represent the graph\
    \ as an adjacency list: a dict from node to a list of neighbours.\n- Create `deque([start])` and `seen\
    \ = {start}`.\n- Loop while the queue is non-empty: `node = q.popleft()`, handle it, then for each\
    \ neighbour not in `seen`, add it to `seen` and append it to the queue.\n- To get distances, store\
    \ `dist[neighbour] = dist[node] + 1` when you enqueue.\n- To reconstruct a path, store `parent[neighbour]\
    \ = node` and walk back from the target.\n- For grids, neighbours are the four (or eight) adjacent\
    \ cells that are in bounds and passable.\n\n## Example\nShortest number of moves in a grid from top-left\
    \ to bottom-right (`1` is a wall):\n```python\nfrom collections import deque\n\ndef shortest(grid):\n\
    \    n, m = len(grid), len(grid[0])\n    q, dist = deque([(0, 0)]), {(0, 0): 0}\n    while q:\n  \
    \      r, c = q.popleft()\n        if (r, c) == (n - 1, m - 1):\n            return dist[(r, c)]\n\
    \        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nr, nc = r + dr, c + dc\n\
    \            if 0 <= nr < n and 0 <= nc < m and grid[nr][nc] == 0 and (nr, nc) not in dist:\n    \
    \            dist[(nr, nc)] = dist[(r, c)] + 1\n                q.append((nr, nc))\n    return -1\n\
    \nprint(shortest([[0, 0, 0], [1, 1, 0], [0, 0, 0]]))  # 4\n```\n\n## Common mistakes\n- Using a list\
    \ as a queue with `pop(0)`.\n- Marking visited on pop, not on push.\n- Forgetting bounds checks on\
    \ grids.\n- Returning as soon as the target is enqueued without storing its distance correctly.\n\n\
    ## In the interview\nState the complexity and why BFS gives the shortest path in unweighted graphs.\
    \ Expect follow-ups: multi-source BFS (seed the queue with several starts), 0-1 BFS with a deque for\
    \ weights 0 and 1, and bidirectional BFS to cut the search space.\n"
