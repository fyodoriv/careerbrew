  question: What is bucket sort?
  answer: Bucket sort spreads elements into buckets by value range, sorts each bucket (often with insertion
    sort), and concatenates the buckets in order. With input spread evenly over a known range it runs
    in O(n + k) average time, but it degrades to the inner sort's worst case when values cluster in one
    bucket.
  topic: computer science
  tags:
  - algorithms
  - sorting
  - bucket-sort
  - non-comparison-sort
  explanation: "## In plain words\nSorting mail by postcode: first drop each letter into the bin for its\
    \ region, then sort each small bin, then stack the bins in region order. If letters spread evenly,\
    \ each bin is tiny and quick to sort.\n\n## How it works\n- Choose k buckets covering the value range,\
    \ for example `[0, 1)` split into k equal slices.\n- Put each element into bucket `floor(value * k)`\
    \ (adjusted for your range).\n- Sort each bucket with a simple sort.\n- Concatenate the buckets in\
    \ order.\n- **Time**: O(n + k) on average for uniformly distributed input; O(n^2) worst case if everything\
    \ lands in one bucket and insertion sort is used.\n- **Space**: O(n + k).\n- Stable if the inner sort\
    \ is stable and elements are appended in input order.\n- It is not limited by the O(n log n) bound\
    \ on comparison sorts because it uses the values to compute positions.\n\n## Example\n```python\n\
    def bucket_sort(a, k=10):          # values in [0, 1)\n    buckets = [[] for _ in range(k)]\n    for\
    \ x in a:\n        buckets[int(x * k)].append(x)\n    out = []\n    for b in buckets:\n        out.extend(sorted(b))\n\
    \    return out\n\nprint(bucket_sort([0.42, 0.32, 0.23, 0.52, 0.25, 0.47]))\n# [0.23, 0.25, 0.32,\
    \ 0.42, 0.47, 0.52]\n```\nA related interview trick: \"top k frequent elements\" uses buckets indexed\
    \ by frequency (0 to n), giving O(n) without a heap.\n\n## Common mistakes\n- Using it on skewed data\
    \ without thinking about bucket sizes.\n- Computing a bucket index outside the array for the maximum\
    \ value (for example, value 1.0 when the range is `[0, 1)`).\n- Confusing it with counting sort (one\
    \ bucket per exact key) or radix sort (digit by digit).\n\n## In the interview\nSay when it fits:\
    \ known range and roughly uniform distribution, such as floats in `[0, 1)` or scores 0 to 100. Compare\
    \ with counting sort and radix sort, state average and worst-case complexity, and note the extra memory.\n"
