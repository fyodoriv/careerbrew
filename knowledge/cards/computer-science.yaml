  question: What is the Prototype design pattern?
  answer: The Prototype pattern creates new objects by cloning an existing, configured instance instead
    of building them from scratch with a constructor. It helps when construction is expensive or complex,
    or when the exact class is not known at compile time; the main care point is shallow versus deep copying.
  topic: computer science
  tags:
  - design-patterns
  - creational
  - cloning
  explanation: "## In plain words\nInstead of filling out a long form every time, you photocopy one that\
    \ is already filled out and change a couple of fields. The Prototype pattern does this with objects:\
    \ keep a ready-made example and clone it whenever you need a similar one.\n\n## How it works\n- Give\
    \ objects a `clone()` method (or use a language feature such as Python's `copy.deepcopy` or JavaScript's\
    \ `structuredClone`).\n- Keep a registry of prototypes, for example preset configurations keyed by\
    \ name.\n- To create an object, look up the prototype, clone it, and adjust the fields that differ.\n\
    - Decide on copy depth: a shallow copy shares nested objects with the original, so changing a nested\
    \ list in the clone also changes the prototype; a deep copy duplicates everything.\n- Different from\
    \ JavaScript's prototype chain, which is about inheritance through delegation, though the names are\
    \ related.\n\n## Example\n```python\nimport copy\n\nclass Shape:\n    def __init__(self, kind, color,\
    \ points):\n        self.kind, self.color, self.points = kind, color, points\n    def clone(self):\n\
    \        return copy.deepcopy(self)\n\nprototypes = {\"red-triangle\": Shape(\"triangle\", \"red\"\
    , [(0, 0), (1, 0), (0, 1)])}\n\nt = prototypes[\"red-triangle\"].clone()\nt.color = \"blue\"\nt.points.append((1,\
    \ 1))\nprint(prototypes[\"red-triangle\"].color, len(prototypes[\"red-triangle\"].points))  # red\
    \ 3\n```\n\n## Common mistakes\n- Using a shallow copy and accidentally sharing mutable nested state.\n\
    - Cloning objects that hold resources (open files, sockets) that cannot be duplicated safely.\n- Using\
    \ the pattern when a constructor or factory is simpler.\n- Confusing it with JavaScript prototypal\
    \ inheritance.\n\n## In the interview\nGive a realistic use case: game entities, document templates,\
    \ or preconfigured test fixtures. Interviewers want you to raise the shallow versus deep copy question\
    \ unprompted and discuss cost (deep copies can be slow for big graphs). Compare with Factory: a factory\
    \ decides which class to build; a prototype copies an existing instance.\n"
