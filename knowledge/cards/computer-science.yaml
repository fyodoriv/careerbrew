- id: kb-113b45abaa90
  question: What is a red-black tree?
  answer: A red-black tree is a self-balancing binary search tree where each node is red or black and
    coloring rules keep the longest root-to-leaf path at most twice the shortest. That guarantees O(log
    n) search, insert, and delete, fixed with recoloring and at most a few rotations per update.
  topic: computer science
  tags:
  - data-structures
  - trees
  - balanced-bst
  - red-black-tree
  explanation: '## In plain words

    A plain binary search tree can become a long chain if you insert sorted data, making searches O(n).
    A red-black tree adds a color to each node and a few rules that stop any path from getting too long.
    It is not perfectly balanced, just balanced enough, which keeps updates cheap.


    ## How it works

    The rules:

    1. Every node is red or black.

    2. The root is black.

    3. Empty leaves (null children) count as black.

    4. A red node cannot have a red child.

    5. Every path from a node down to its empty leaves has the same number of black nodes (the black-height).


    Rules 4 and 5 mean the longest path (alternating red and black) is at most twice the shortest (all
    black), so height is at most 2 log2(n + 1).

    - **Insert**: add as in a BST and color it red. If its parent is red, fix it: recolor when the uncle
    is red, otherwise rotate (one or two rotations) and recolor.

    - **Delete**: harder; may need several recolorings but at most three rotations.

    - All operations: O(log n) time.


    ## Example

    Insert 10, 20, 30 into a plain BST and you get a chain. In a red-black tree, inserting 30 makes a
    red child of a red parent with no red uncle, so the tree does one left rotation at 10 and recolors:
    20 becomes the black root with red children 10 and 30.


    ## Common mistakes

    - Saying it is perfectly balanced; it allows paths to differ by a factor of two.

    - Forgetting that null leaves count as black.

    - Trying to memorize every delete case instead of the invariants.


    ## In the interview

    You are rarely asked to code it. Explain the rules, why they bound the height, and where it is used:
    Java''s `TreeMap`, C++ `std::map`, and the Linux scheduler. Compare with AVL trees, which are more
    strictly balanced (faster lookups) but rotate more on updates.

    '
