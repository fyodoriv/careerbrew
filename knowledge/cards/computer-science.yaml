  question: What is SOAP, and how does it compare with REST?
  answer: SOAP (Simple Object Access Protocol) is an XML-based messaging protocol for web services, with
    a strict envelope format, a WSDL contract, and standards for security and transactions. REST is a
    lighter architectural style that uses plain HTTP methods and usually JSON.
  topic: computer science
  tags:
  - apis
  - soap
  - rest
  - web-services
  explanation: "## In plain words\nSOAP is a formal way for programs to call each other over a network.\
    \ Every message is an XML document wrapped in an \"envelope\", and a contract file describes exactly\
    \ what operations exist and what data they take. It is strict and verbose, and it was common in enterprise\
    \ systems before REST became popular.\n\n## How it works\n- **Envelope**: the root XML element, containing\
    \ an optional `Header` (security tokens, routing, transactions) and a `Body` (the call or the response).\n\
    - **Fault**: a standard element for errors.\n- **WSDL** (Web Services Description Language): an XML\
    \ contract listing operations, inputs, and outputs. Tools generate client code from it.\n- **Transport**:\
    \ usually HTTP POST, but SOAP can also run over other protocols such as SMTP or message queues.\n\
    - **WS-* standards**: add-ons such as WS-Security (message-level signing and encryption) and WS-ReliableMessaging.\n\
    \n## Example\n```xml\n<!-- namespace declaration omitted -->\n<soap:Envelope>\n  <soap:Body>\n   \
    \ <GetPrice><Item>book</Item></GetPrice>\n  </soap:Body>\n</soap:Envelope>\n```\nThe REST equivalent\
    \ might be `GET /items/book/price`, returning `{\"price\": 12}`.\n\n## Common mistakes\n- Saying SOAP\
    \ only works over HTTP.\n- Calling REST a protocol; it is an architectural style with no single standard\
    \ message format.\n- Claiming SOAP is always worse: its strict contract and built-in standards still\
    \ suit banking, telecom, and legacy enterprise integrations.\n\n## In the interview\nCompare on a\
    \ few axes. SOAP: strict typed contract, message-level security, heavier payloads, harder to cache,\
    \ tooling-heavy. REST: resource-oriented URLs, HTTP verbs and status codes, cacheable GETs, lighter\
    \ JSON, looser contracts (often added with OpenAPI). Mention gRPC as the modern choice for typed,\
    \ fast service-to-service calls, and say you would pick SOAP mainly when integrating with a system\
    \ that already uses it.\n"
