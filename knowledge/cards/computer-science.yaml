  question: How do you implement Dijkstra's algorithm?
  answer: Keep a min-heap of (distance, node) starting with (0, source) and a distance map. Pop the closest
    node, skip it if its distance is stale, and relax each edge, pushing improved distances. With a binary
    heap it runs in O((V + E) log V).
  topic: computer science
  tags:
  - graphs
  - shortest-path
  - dijkstra
  - heap
  explanation: "## In plain words\nDijkstra finds the cheapest route from one start to every other node\
    \ when edge weights are non-negative. It always expands the closest unfinished node next, like water\
    \ spreading through pipes and reaching nearby junctions first.\n\n## How it works\n- `dist[source]\
    \ = 0`; every other node is infinity.\n- Push `(0, source)` onto a min-heap.\n- Pop `(d, u)`. If `d\
    \ > dist[u]`, it is an outdated entry; skip it.\n- For each edge `u -> v` with weight `w`: if `d +\
    \ w < dist[v]`, set `dist[v] = d + w` and push `(dist[v], v)`. This is called relaxing the edge.\n\
    - When the heap is empty, `dist` holds the shortest distances. Store a `prev` map to rebuild paths.\n\
    - Complexity `O((V + E) log V)` time and `O(V + E)` space with a binary heap and lazy deletion.\n\n\
    ## Example\n```python\nimport heapq\n\ndef dijkstra(graph, src):\n    dist = {src: 0}\n    heap =\
    \ [(0, src)]\n    while heap:\n        d, u = heapq.heappop(heap)\n        if d > dist.get(u, float(\"\
    inf\")):\n            continue\n        for v, w in graph[u]:\n            nd = d + w\n          \
    \  if nd < dist.get(v, float(\"inf\")):\n                dist[v] = nd\n                heapq.heappush(heap,\
    \ (nd, v))\n    return dist\n\ng = {\"A\": [(\"B\", 1), (\"C\", 4)], \"B\": [(\"C\", 2)], \"C\": []}\n\
    print(dijkstra(g, \"A\"))  # {'A': 0, 'B': 1, 'C': 3}\n```\n\n## Common mistakes\n- Using it with\
    \ negative edge weights (use Bellman-Ford instead).\n- Not skipping stale heap entries, which re-relaxes\
    \ edges from outdated distances and wastes time.\n- Marking nodes final when pushed instead of when\
    \ popped.\n- Using a plain FIFO queue: it no longer pops the closest node first, so nodes are processed\
    \ many times and the greedy guarantee (and running time) is lost.\n\n## In the interview\nExplain\
    \ why the greedy choice is safe: with non-negative weights, the smallest tentative distance cannot\
    \ be improved later. Mention you can stop early when the target is popped. Expect follow-ups on A*\
    \ (Dijkstra plus a heuristic), on problems with constraints such as \"at most k stops\", and on how\
    \ complexity changes with a dense graph and an array instead of a heap (`O(V^2)`).\n"
