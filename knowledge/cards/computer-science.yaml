  question: What do node, instance, and host mean in computing infrastructure?
  answer: A host is a machine, physical or virtual, with a network address that runs software. An instance
    is one running copy of something, such as a cloud virtual machine or one process of a service. A node
    is a member of a cluster or network, usually one machine that participates in a distributed system.
  topic: computer science
  tags:
  - infrastructure
  - distributed-systems
  - cloud
  - terminology
  explanation: "## In plain words\nThese words overlap a lot and depend on context. Roughly: a host is\
    \ \"a computer on the network\", an instance is \"one running copy\", and a node is \"one member of\
    \ a group of machines working together\". The same machine can be all three at once.\n\n## How it\
    \ works\n- **Host**: any device with an IP address that runs services; the word stresses \"it hosts\
    \ things\". A physical server can host many virtual machines or containers. In networking, \"host\"\
    \ means an endpoint as opposed to a router.\n- **Instance**:\n  - In the cloud, a virtual machine\
    \ (an AWS EC2 instance).\n  - In software, one running copy of a program or service; \"scale to 10\
    \ instances\" means run 10 copies behind a load balancer.\n  - In OOP, an object created from a class.\n\
    - **Node**:\n  - In a cluster, one machine (physical or virtual) that participates, like a Kubernetes\
    \ node that runs pods, or a Cassandra node that stores part of the data.\n  - In graphs and trees,\
    \ a vertex; in networks, any connected device.\n- Typical stack: a physical host runs a hypervisor\
    \ with several VM instances; each VM is a Kubernetes node; each node runs several container instances\
    \ of services.\n\n## Example\n\"Our search service runs 6 instances across 3 nodes in two availability\
    \ zones.\" That means 6 copies of the service, spread over 3 machines in the cluster, so losing one\
    \ machine still leaves 4 copies running.\n\n## Common mistakes\n- Assuming instance means a physical\
    \ server.\n- Putting all replicas of a service on one host or node, so one hardware failure takes\
    \ everything down.\n- Mixing up the graph meaning of node with the infrastructure meaning in a design\
    \ discussion.\n\n## In the interview\nDefine terms when you use them in a design discussion. Talk\
    \ about failure domains (host, rack, zone, region), spreading instances across them, and stateless\
    \ instances that can be added or removed freely. Expect follow-ups about containers versus virtual\
    \ machines and how orchestration schedules instances onto nodes.\n"
