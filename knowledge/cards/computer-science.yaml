- id: kb-c99f5668d067
  question: How do you approach dynamic programming problems in coding interviews?
  answer: 'Define the state (what a subproblem is), write the recurrence (how a state depends on smaller
    ones), set the base cases, and choose an order: top-down recursion with memoisation or bottom-up tabulation.
    Then reduce memory if only a few previous states are needed.'
  topic: computer science
  tags:
  - dynamic-programming
  - algorithms
  - problem-solving
  explanation: "## In plain words\nDynamic programming (DP) solves a big problem by solving smaller versions\
    \ of it and remembering their answers, so nothing is computed twice. It applies when the problem has\
    \ overlapping subproblems (the same small question comes up repeatedly) and optimal substructure (the\
    \ best answer is built from best answers to smaller parts).\n\n## How it works\n- **Recognise it:**\
    \ words like \"number of ways\", \"minimum cost\", \"longest\", \"can you reach\", with choices at\
    \ each step.\n- **Define the state:** for example `dp[i]` = best answer for the first i items, or\
    \ `dp[i][j]` for two indices.\n- **Write the recurrence:** how `dp[i]` comes from earlier states,\
    \ by trying each choice.\n- **Base cases:** the smallest inputs, such as `dp[0]`.\n- **Compute:**\
    \ top-down (recursion plus a cache) is easy to write; bottom-up (loops over a table) avoids recursion\
    \ limits.\n- **Optimise space:** if `dp[i]` only needs `dp[i-1]` and `dp[i-2]`, keep two variables.\n\
    - Common families: 1D (climbing stairs, house robber), knapsack, grid paths, longest common subsequence,\
    \ interval DP.\n\n## Example\nMinimum coins to make an amount:\n```python\ndef min_coins(coins, amount):\n\
    \    INF = float(\"inf\")\n    dp = [0] + [INF] * amount\n    for a in range(1, amount + 1):\n   \
    \     for c in coins:\n            if c <= a and dp[a - c] + 1 < dp[a]:\n                dp[a] = dp[a\
    \ - c] + 1\n    return dp[amount] if dp[amount] != INF else -1\n\nprint(min_coins([1, 3, 4], 6)) \
    \ # 2 (3 + 3)\n```\nTime `O(amount x len(coins))`, space `O(amount)`. A greedy approach would pick\
    \ 4 + 1 + 1 and be wrong.\n\n## Common mistakes\n- Jumping into code before the state is written down\
    \ in words.\n- Wrong or missing base cases.\n- Filling the table in an order where a needed state\
    \ is not ready yet.\n- Using greedy where DP is required, without a counterexample check.\n\n## In\
    \ the interview\nSay the state and recurrence out loud before coding; interviewers grade that more\
    \ than the code. Start with a brute-force recursion, add memoisation, then convert to bottom-up if\
    \ asked. Always state time (number of states x work per state) and space, and offer the space optimisation.\n"
  match:
  - 8e9c296cf506
  prompt: 1f344914
- id: kb-da5c74f4c77f
  question: How do you approach graph problems in coding interviews?
  answer: 'Model the input as nodes and edges, build an adjacency list, then choose the traversal by question
    type: BFS for shortest steps, DFS for reachability and components, topological sort for ordering with
    dependencies, Dijkstra for weighted shortest paths, and union-find for grouping. Track visited nodes
    to avoid cycles.'
  topic: computer science
  tags:
  - graphs
  - problem-solving
  - bfs
  - dfs
  explanation: "## In plain words\nMany problems are graphs in disguise: grids, word ladders, course prerequisites,\
    \ friend networks. Once you see the nodes and edges, most graph questions come down to a handful of\
    \ standard tools, and the skill is choosing the right one.\n\n## How it works\n- **Spot the graph:**\
    \ what is a node (a cell, a word, a course)? What makes an edge (adjacent cells, one-letter difference,\
    \ a prerequisite)?\n- **Build it:** convert edge lists into an adjacency list; for grids, compute\
    \ neighbours on the fly.\n- **Pick the tool:**\n  - Fewest steps, unweighted: BFS.\n  - Connected\
    \ parts, flood fill, any path: DFS or BFS.\n  - Dependencies and order, cycle detection in directed\
    \ graphs: topological sort (Kahn's algorithm).\n  - Weighted shortest path, non-negative weights:\
    \ Dijkstra.\n  - Dynamic connectivity, \"are these in the same group\": union-find.\n  - Minimum spanning\
    \ tree: Kruskal or Prim.\n- **Always:** keep a visited set, handle disconnected graphs, state `O(V\
    \ + E)`.\n\n## Example\n\"Can all courses be finished given prerequisite pairs?\" Nodes are courses,\
    \ an edge `a -> b` means a before b. Run Kahn's algorithm:\n```python\nfrom collections import deque\n\
    \ndef can_finish(n, pairs):\n    g, indeg = [[] for _ in range(n)], [0] * n\n    for a, b in pairs:\n\
    \        g[a].append(b)\n        indeg[b] += 1\n    q = deque(i for i in range(n) if indeg[i] == 0)\n\
    \    done = 0\n    while q:\n        u = q.popleft()\n        done += 1\n        for v in g[u]:\n\
    \            indeg[v] -= 1\n            if indeg[v] == 0:\n                q.append(v)\n    return\
    \ done == n\n\nprint(can_finish(3, [(0, 1), (1, 2)]), can_finish(2, [(0, 1), (1, 0)]))  # True False\n\
    ```\n\n## Common mistakes\n- Not recognising a grid or word problem as a graph.\n- Forgetting visited\
    \ tracking or marking it at the wrong time.\n- Using DFS for shortest paths.\n- Ignoring disconnected\
    \ components.\n\n## In the interview\nSay the modelling step explicitly (\"each cell is a node, edges\
    \ go to four neighbours\"). Interviewers score the choice of algorithm and its justification, then\
    \ clean code and complexity. Expect variants such as multi-source BFS, bipartite checking with two\
    \ colours, and clone-a-graph with a hash map.\n"
  match:
  - dcdcbf4b997a
  prompt: 1f344914
- id: kb-039af28936e2
  question: How do you approach heap problems in coding interviews?
  answer: 'Reach for a heap when you repeatedly need the smallest or largest item from a changing set:
    top-k, k-th largest, merging sorted streams, scheduling, and running medians. Use a size-k heap for
    top-k (O(n log k)), and two heaps for medians.'
  topic: computer science
  tags:
  - heap
  - priority-queue
  - problem-solving
  - top-k
  explanation: "## In plain words\nA heap is a structure that always knows its smallest (or largest) item\
    \ and can add or remove items in logarithmic time. Whenever a problem says \"k largest\", \"closest\"\
    , \"next earliest\", or \"median of a stream\", a heap is usually the cleanest tool.\n\n## How it\
    \ works\n- **Top-k largest:** keep a min-heap of size k; push each item and pop when size exceeds\
    \ k. The heap holds the k largest; its root is the k-th largest. `O(n log k)`.\n- **Top-k smallest:**\
    \ the mirror image with a max-heap (negate values in Python).\n- **Merge k sorted lists:** heap of\
    \ the current head of each list.\n- **Scheduling / intervals:** a min-heap of end times tells you\
    \ when the next room or worker frees up.\n- **Running median:** a max-heap for the lower half and\
    \ a min-heap for the upper half, kept balanced in size.\n- **Greedy plus heap:** task scheduler, reorganise\
    \ string, IPO: always pick the best available option.\n- Know the library: Python `heapq` (min-heap),\
    \ Java `PriorityQueue`.\n\n## Example\nK-th largest element:\n```python\nimport heapq\n\ndef kth_largest(nums,\
    \ k):\n    heap = []\n    for x in nums:\n        heapq.heappush(heap, x)\n        if len(heap) >\
    \ k:\n            heapq.heappop(heap)\n    return heap[0]\n\nprint(kth_largest([3, 2, 1, 5, 6, 4],\
    \ 2))  # 5\n```\nTime `O(n log k)`, space `O(k)`. Quickselect gives average `O(n)` as an alternative.\n\
    \n## Common mistakes\n- Using a max-heap of all n items for top-k when a size-k min-heap is cheaper.\n\
    - Forgetting Python's `heapq` is min-only.\n- Pushing tuples whose second element cannot be compared\
    \ on ties.\n- Unbalanced heaps in the median problem.\n\n## In the interview\nName the pattern (\"\
    this is top-k, so a size-k heap\") before coding. Compare with sorting (`O(n log n)`) and quickselect\
    \ (average `O(n)`, but not streaming). Interviewers check heap direction, size control, and complexity.\
    \ Be ready to explain why a heap fits streaming data better than sorting.\n"
  match:
  - 6a2bb8980d28
  prompt: 1f344914
- id: kb-997c57b7c93f
  question: How do you approach interval problems in coding interviews?
  answer: 'Sort intervals by start time, then sweep left to right comparing each interval with the last
    one kept: overlap when the next start is at or before the current end. Use a min-heap of end times
    when you need to count simultaneous intervals, such as meeting rooms. Sorting dominates at O(n log
    n).'
  topic: computer science
  tags:
  - intervals
  - sorting
  - sweep-line
  - problem-solving
  explanation: "## In plain words\nInterval problems are about ranges on a line, like meetings on a calendar.\
    \ Once intervals are sorted by start time, the only interesting question at each step is whether the\
    \ next one overlaps the current one, which turns a messy problem into a single pass.\n\n## How it\
    \ works\n- Two intervals `[a, b]` and `[c, d]` overlap when `a <= d and c <= b` (decide whether touching\
    \ ends count).\n- **Merge overlapping:** sort by start; if the next start is at most the last end,\
    \ extend the end to `max(end, next_end)`; otherwise start a new interval.\n- **Insert an interval:**\
    \ add the ones ending before it, merge the overlapping ones, add the rest.\n- **Minimum rooms / max\
    \ overlap:** sort by start, keep a min-heap of end times; pop ends that are finished before the new\
    \ start; the heap size is the number of rooms in use. Or sort start and end times separately and sweep.\n\
    - **Remove fewest to avoid overlap:** sort by end time and greedily keep the earliest-ending interval.\n\
    - Complexity: `O(n log n)` for sorting, `O(n)` for the sweep.\n\n## Example\n```python\ndef merge(intervals):\n\
    \    out = []\n    for s, e in sorted(intervals):\n        if out and s <= out[-1][1]:\n         \
    \   out[-1][1] = max(out[-1][1], e)\n        else:\n            out.append([s, e])\n    return out\n\
    \nprint(merge([[1, 3], [8, 10], [2, 6], [15, 18]]))  # [[1, 6], [8, 10], [15, 18]]\n```\n\n## Common\
    \ mistakes\n- Forgetting to sort first.\n- Replacing the end instead of taking the maximum, which\
    \ breaks when one interval contains another.\n- Not clarifying whether `[1, 2]` and `[2, 3]` overlap.\n\
    - Sorting by start when the greedy proof needs sorting by end.\n\n## In the interview\nAsk about inclusive\
    \ ends and whether input is already sorted. Draw a timeline; it makes the overlap rule obvious. State\
    \ the sort cost and the sweep. Common follow-ups: meeting rooms II, employee free time (merge, then\
    \ look at gaps), and interval intersections between two sorted lists with two pointers.\n"
  match:
  - ab700e984a95
  prompt: 1f344914
- id: kb-c7caf5788bab
  question: How do you approach linked list problems in coding interviews?
  answer: 'Most linked list problems use a few patterns: a dummy head node to simplify edge cases, fast
    and slow pointers for middles and cycles, in-place reversal by flipping next pointers, and two-pointer
    gaps for the n-th node from the end. Draw the pointers before coding and check empty and one-node
    lists.'
  topic: computer science
  tags:
  - linked-list
  - two-pointers
  - problem-solving
  explanation: "## In plain words\nA linked list is a chain of nodes where each points to the next. You\
    \ cannot jump to the middle, so every solution is about walking the chain cleverly and rewiring pointers\
    \ without losing track of the rest of the list.\n\n## How it works\n- **Dummy node:** create a fake\
    \ node before the head so inserting or deleting the first real node needs no special case; return\
    \ `dummy.next`.\n- **Fast and slow pointers:** find the middle, detect cycles, find the cycle start.\n\
    - **Gap pointers:** move one pointer n steps ahead, then move both; when the front hits the end, the\
    \ back is just before the n-th node from the end.\n- **Reversal:** three pointers (prev, cur, next).\
    \ Building block for palindrome checks and reversing in groups.\n- **Merging:** compare heads of two\
    \ sorted lists and append the smaller to a tail pointer.\n- Combine patterns: reorder list = find\
    \ middle + reverse second half + merge alternately.\n- Most solutions are `O(n)` time and `O(1)` extra\
    \ space.\n\n## Example\nRemove the n-th node from the end:\n```python\nclass Node:\n    def __init__(self,\
    \ val, next=None):\n        self.val, self.next = val, next\n\ndef remove_nth_from_end(head, n):\n\
    \    dummy = Node(0, head)\n    fast = slow = dummy\n    for _ in range(n):\n        fast = fast.next\n\
    \    while fast.next:\n        fast, slow = fast.next, slow.next\n    slow.next = slow.next.next\n\
    \    return dummy.next\n\nh = remove_nth_from_end(Node(1, Node(2, Node(3, Node(4)))), 2)\nvals = []\n\
    while h:\n    vals.append(h.val)\n    h = h.next\nprint(vals)  # [1, 2, 4]\n```\n\n## Common mistakes\n\
    - Losing the rest of the list by overwriting `next` before saving it.\n- Special-casing the head instead\
    \ of using a dummy node.\n- Not handling empty lists or a list of one node.\n- Converting to an array,\
    \ which works but usually misses the `O(1)` space goal.\n\n## In the interview\nDraw boxes and arrows,\
    \ and trace your code on a three-node list before saying you are done. Interviewers value correct\
    \ pointer updates and edge cases more than speed. Mention the space trade-off whenever you use extra\
    \ memory such as a hash set.\n"
