  question: What is the Single Responsibility Principle in SOLID?
  answer: A class or module should have one reason to change, meaning it serves one actor or concern.
    Mixing concerns such as business rules, persistence, and formatting in one class means a change for
    one stakeholder can break another.
  topic: computer science
  tags:
  - solid
  - oop
  - design-principles
  - cohesion
  explanation: "## In plain words\nEach piece of code should have one job. If the finance team's change\
    \ and the design team's change both require editing the same class, that class does two jobs, and\
    \ one team's change can break the other's feature.\n\n## How it works\n- Ask \"who would ask for this\
    \ code to change?\" Each distinct answer is a responsibility.\n- Split code so each module answers\
    \ to one of them. Typical seams: business rules, storage, presentation, and external integrations.\n\
    - Keep cohesive things together: SRP is not \"one method per class\".\n- Benefits: smaller, easier-to-test\
    \ units, fewer merge conflicts, and changes that stay local.\n\n## Example\nBefore:\n```python\nclass\
    \ Invoice:\n    def total(self): ...           # business rule\n    def save_to_db(self): ...    \
    \  # persistence\n    def to_pdf(self): ...          # presentation\n```\nAfter: `Invoice` computes\
    \ totals, `InvoiceRepository` saves it, and `InvoicePdfRenderer` formats it. A new PDF layout now\
    \ touches only the renderer, and tests for totals need no database.\n\n## Common mistakes\n- Reading\
    \ it as \"a class should do only one thing\", then producing dozens of tiny classes with no clear\
    \ home for logic.\n- Splitting by technical layer only, while one business change still requires edits\
    \ in five places.\n- Applying it before the code shows any sign of conflicting change; premature splitting\
    \ adds indirection.\n\n## In the interview\nUse Robert C. Martin's framing: one reason to change,\
    \ or one actor. Give a concrete split like the invoice. Say how you spot violations: long classes,\
    \ names with \"And\" or \"Manager\", unrelated imports, and tests that need heavy setup. Mention the\
    \ trade-off between cohesion and too much fragmentation, and that SRP applies to functions and services\
    \ too.\n"
