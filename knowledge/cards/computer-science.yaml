  question: What is a doubly linked list?
  answer: A doubly linked list is a linked list whose nodes point both to the next and the previous node.
    It allows traversal in both directions and O(1) removal of a node you already hold, at the cost of
    an extra pointer per node and more pointer updates on every change.
  topic: computer science
  tags:
  - data-structures
  - linked-list
  - pointers
  - lru
  explanation: "## In plain words\nIn a singly linked list, each person in a line only knows who stands\
    \ behind them. In a doubly linked list, each person also knows who stands in front. That makes it\
    \ easy to step out of the line: tell your two neighbours to hold hands, and you are gone.\n\n## How\
    \ it works\n- **Node**: `val`, `prev`, `next`. The list keeps `head` and `tail`, often as **sentinel**\
    \ (dummy) nodes so every real node has both neighbours.\n- **Insert after node x**: O(1), set four\
    \ pointers.\n- **Remove node x**: O(1): `x.prev.next = x.next` and `x.next.prev = x.prev`. A singly\
    \ linked list needs the predecessor, which may take O(n) to find.\n- **Push or pop at either end**:\
    \ O(1), so it works as a deque.\n- **Access by index or search**: O(n), as with any linked list.\n\
    - **Space**: two pointers per node.\n\n## Example\n```python\nclass Node:\n    def __init__(self,\
    \ val=None):\n        self.val, self.prev, self.next = val, None, None\n\nhead, tail = Node(), Node()\
    \        # sentinels\nhead.next, tail.prev = tail, head\n\ndef insert_front(node):\n    node.prev,\
    \ node.next = head, head.next\n    head.next.prev = node\n    head.next = node\n\ndef remove(node):\n\
    \    node.prev.next = node.next\n    node.next.prev = node.prev\n\na, b = Node(\"a\"), Node(\"b\"\
    )\ninsert_front(a); insert_front(b)   # b <-> a\nremove(a)\nprint(head.next.val, head.next.next is\
    \ tail)  # b True\n```\n\n## Common mistakes\n- Updating pointers in the wrong order and losing a\
    \ reference.\n- Forgetting one of the four pointer updates, leaving a broken backward chain.\n- Special-casing\
    \ empty lists and ends instead of using sentinels.\n\n## In the interview\nThe key use is the LRU\
    \ cache: a hash map finds the node in O(1), and the doubly linked list moves or evicts it in O(1).\
    \ Also mention browser history navigation, deques, and text editors. Compare with a singly linked\
    \ list (less memory, one-way only) and with arrays (fast index access, slow middle inserts).\n"
