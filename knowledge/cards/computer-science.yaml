  question: How do you approach trie (prefix tree) problems in coding interviews?
  answer: 'Use a trie when the problem is about prefixes of many strings: autocomplete, word search on
    a board, longest common prefix, or replacing words with roots. Each node maps a character to a child
    and marks whether a word ends there; insert and lookup cost O(L) for a word of length L.'
  topic: computer science
  tags:
  - trie
  - strings
  - problem-solving
  - data-structures
  explanation: "## In plain words\nA trie stores words by sharing their beginnings. \"car\", \"cart\"\
    , and \"care\" share the path c-a-r, then branch. That makes it very fast to ask \"which words start\
    \ with this prefix?\", something a hash set cannot answer without scanning every word.\n\n## How it\
    \ works\n- **Node:** a dict (or array of 26) from character to child, plus an `end` flag (or the stored\
    \ word).\n- **Insert:** walk from the root, creating children as needed; set `end` on the last node.\n\
    - **Search word:** walk the characters; succeed if every step exists and the last node has `end`.\n\
    - **Starts with:** same walk, but ignore `end`.\n- **Board word search:** build a trie of all target\
    \ words, then DFS the board while walking the trie; prune when no child matches. Much faster than\
    \ searching each word separately.\n- **Wildcards:** on `.` try every child recursively.\n- Costs:\
    \ insert and search `O(L)`; space `O(total characters)` in the worst case.\n\n## Example\n```python\n\
    class Trie:\n    def __init__(self):\n        self.root = {}\n    def insert(self, word):\n      \
    \  node = self.root\n        for ch in word:\n            node = node.setdefault(ch, {})\n       \
    \ node[\"$\"] = True\n    def starts_with(self, prefix):\n        node = self.root\n        for ch\
    \ in prefix:\n            if ch not in node:\n                return False\n            node = node[ch]\n\
    \        return True\n    def search(self, word):\n        node = self.root\n        for ch in word:\n\
    \            if ch not in node:\n                return False\n            node = node[ch]\n     \
    \   return \"$\" in node\n\nt = Trie()\nfor w in (\"car\", \"cart\", \"care\"):\n    t.insert(w)\n\
    print(t.search(\"car\"), t.search(\"ca\"), t.starts_with(\"ca\"))  # True False True\n```\n\n## Common\
    \ mistakes\n- Forgetting the end-of-word marker, so prefixes count as words.\n- Using a trie when\
    \ a hash set is enough (no prefix queries).\n- In board search, not removing found words or not pruning\
    \ dead branches.\n- Ignoring memory: arrays of 26 per node can be large for sparse data.\n\n## In\
    \ the interview\nExplain why a trie beats a hash set for prefix queries and state `O(L)` operations.\
    \ Interviewers look for clean insert and search code and smart pruning in word-search-on-a-board.\
    \ Mention trade-offs: memory use, and compressed tries (radix trees) as an optimisation.\n"
