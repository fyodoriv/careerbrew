- id: kb-94e33389c1b4
  question: What is a cache eviction policy?
  answer: A cache eviction policy decides which item to remove when the cache is full. Common policies
    are LRU (least recently used), LFU (least frequently used), FIFO, random, and TTL-based expiry. The
    right choice depends on the access pattern; LRU is the common default because recently used data tends
    to be used again.
  topic: computer science
  tags:
  - caching
  - system-design
  - lru
  explanation: "## In plain words\nA cache is a small, fast store with limited room, like the few books\
    \ on your desk versus the whole library. When the desk is full and you need a new book, you must put\
    \ one back. The eviction policy is the rule for choosing which one.\n\n## How it works\n- **LRU (least\
    \ recently used):** evict the item not touched for the longest time. Implemented with a hash map plus\
    \ a doubly linked list for `O(1)` get and put.\n- **LFU (least frequently used):** evict the item\
    \ used least often; good for stable popularity, but slow to adapt when popularity shifts.\n- **FIFO:**\
    \ evict the oldest inserted item regardless of use; simple but often worse.\n- **Random:** surprisingly\
    \ decent and cheap; useful when tracking order is expensive.\n- **TTL (time to live):** items expire\
    \ after a set time, which bounds staleness; often combined with LRU.\n- Real systems use variants:\
    \ Redis offers approximate LRU and LFU modes; CPU caches use pseudo-LRU.\n- Measure with hit rate:\
    \ the share of reads served from the cache.\n\n## Example\nLRU cache with capacity 2:\n```python\n\
    from collections import OrderedDict\n\nclass LRU:\n    def __init__(self, cap):\n        self.cap,\
    \ self.d = cap, OrderedDict()\n    def get(self, k):\n        if k not in self.d:\n            return\
    \ None\n        self.d.move_to_end(k)\n        return self.d[k]\n    def put(self, k, v):\n      \
    \  self.d[k] = v\n        self.d.move_to_end(k)\n        if len(self.d) > self.cap:\n            self.d.popitem(last=False)\n\
    \nc = LRU(2)\nc.put(\"a\", 1); c.put(\"b\", 2); c.get(\"a\"); c.put(\"c\", 3)\nprint(list(c.d))  #\
    \ ['a', 'c'] ('b' was least recently used)\n```\n\n## Common mistakes\n- Confusing eviction (cache\
    \ is full) with invalidation (data changed at the source).\n- Implementing LRU with a list scan, making\
    \ each access `O(n)`.\n- Choosing LFU for workloads with shifting hot keys.\n- Ignoring that large\
    \ scans can flush an LRU cache (scan pollution).\n\n## In the interview\nName the main policies and\
    \ pick one with a reason tied to the access pattern. Interviewers commonly ask you to implement an\
    \ LRU cache in `O(1)`, so know the hash map plus doubly linked list design. In system design, combine\
    \ eviction with TTLs and discuss hit rate, memory size, and what happens on a cold start.\n"
