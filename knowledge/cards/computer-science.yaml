- id: kb-b31228be3014
  question: What is topological sorting of a directed acyclic graph (DAG)?
  answer: A topological sort orders the nodes of a DAG so that every edge u to v puts u before v, such
    as ordering tasks so prerequisites come first. Kahn's algorithm (repeatedly take nodes with indegree
    0) or DFS post-order both do it in O(V + E), and both detect cycles.
  topic: computer science
  tags:
  - graphs
  - algorithms
  - topological-sort
  - dag
  explanation: "## In plain words\nYou have tasks with \"must happen before\" rules: put on socks before\
    \ shoes, install dependencies before building. A topological order is any to-do list that never breaks\
    \ a rule. It exists only when there is no cycle, since a cycle means some task would have to come\
    \ before itself.\n\n## How it works\n**Kahn's algorithm (BFS style)**\n- Compute the indegree of every\
    \ node.\n- Put every node with indegree 0 in a queue.\n- Pop a node, append it to the result, and\
    \ lower the indegree of each neighbour; when a neighbour hits 0, enqueue it.\n- If the result has\
    \ fewer than V nodes, the graph has a cycle.\n\n**DFS approach**\n- Run DFS; when a node finishes\
    \ (all its descendants are done), push it to a list.\n- Reverse the list. A back edge to a node still\
    \ \"in progress\" means a cycle.\n\nBoth run in O(V + E) time and O(V) space. The order is usually\
    \ not unique.\n\n## Example\n```python\nfrom collections import deque\n\ndef topo(n, edges):\n   \
    \ graph, indeg = [[] for _ in range(n)], [0] * n\n    for u, v in edges:\n        graph[u].append(v)\n\
    \        indeg[v] += 1\n    q = deque(i for i in range(n) if indeg[i] == 0)\n    order = []\n    while\
    \ q:\n        u = q.popleft()\n        order.append(u)\n        for v in graph[u]:\n            indeg[v]\
    \ -= 1\n            if indeg[v] == 0:\n                q.append(v)\n    return order if len(order)\
    \ == n else None  # None means a cycle\n\nprint(topo(4, [(0, 1), (0, 2), (1, 3), (2, 3)]))  # [0,\
    \ 1, 2, 3]\n```\n\n## Common mistakes\n- Forgetting cycle detection and returning a partial order.\n\
    - Reversing the edge direction (for \"a depends on b\", the edge is b to a).\n- Forgetting isolated\
    \ nodes with no edges.\n\n## In the interview\nClassic prompts: course schedule, build systems, package\
    \ installation, spreadsheet recalculation. Say which algorithm you choose, how you detect cycles,\
    \ and the O(V + E) cost. A follow-up may ask for the lexicographically smallest order: use a min-heap\
    \ instead of a queue.\n"
