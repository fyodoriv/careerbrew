  question: What is a circular queue (ring buffer)?
  answer: A ring buffer is a fixed-size array used as a queue whose head and tail indexes wrap around
    to the start when they reach the end. It gives O(1) enqueue and dequeue with no shifting and no allocation,
    which suits streaming data, I/O buffers, and producer-consumer queues.
  topic: computer science
  tags:
  - data-structures
  - queue
  - ring-buffer
  - arrays
  explanation: "## In plain words\nPicture a round table with numbered seats. People join at one point\
    \ and leave at another, and both points move clockwise around the table. When you reach the last seat\
    \ you continue from the first. No one ever has to shuffle down, and the table never grows.\n\n## How\
    \ it works\n- A fixed array of capacity `n`, plus a `head` index (next item to read) and either a\
    \ `tail` index or a `count`.\n- **Enqueue**: write at `(head + count) % n`, then increase `count`.\
    \ If `count == n`, the buffer is full: reject, block, or overwrite the oldest, depending on the design.\n\
    - **Dequeue**: read at `head`, set `head = (head + 1) % n`, decrease `count`.\n- Both are O(1) time,\
    \ and space is O(n) fixed.\n- Telling full from empty: keep a count, or leave one slot always empty\
    \ so `head == tail` means empty.\n- With power-of-two capacity, `% n` can be replaced by `& (n - 1)`,\
    \ which is faster.\n\n## Example\n```python\nclass RingBuffer:\n    def __init__(self, n):\n     \
    \   self.buf, self.head, self.count = [None] * n, 0, 0\n\n    def push(self, x):\n        if self.count\
    \ == len(self.buf):\n            raise OverflowError(\"full\")\n        self.buf[(self.head + self.count)\
    \ % len(self.buf)] = x\n        self.count += 1\n\n    def pop(self):\n        if self.count == 0:\n\
    \            raise IndexError(\"empty\")\n        x = self.buf[self.head]\n        self.head = (self.head\
    \ + 1) % len(self.buf)\n        self.count -= 1\n        return x\n\nr = RingBuffer(3)\nr.push(1);\
    \ r.push(2); r.pop(); r.push(3); r.push(4)  # wraps around\nprint(r.pop(), r.pop(), r.pop())  # 2\
    \ 3 4\n```\n\n## Common mistakes\n- Confusing full and empty when both are signalled by `head == tail`.\n\
    - Removing from the front of a plain array, which is O(n) per dequeue.\n- Sharing it between threads\
    \ without proper synchronization or atomic indexes.\n\n## In the interview\nMention uses: audio and\
    \ network buffers, logging the last N events, and lock-free single-producer single-consumer queues.\
    \ Discuss the policy when full (drop new, overwrite old, or block) and compare with a linked-list\
    \ queue, which grows but allocates on every push.\n"
