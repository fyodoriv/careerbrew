  question: How do you insert an element into a binary heap?
  answer: 'Append the new element at the end of the array (the next free leaf), then sift it up: swap
    it with its parent while it violates the heap order. This takes O(log n) time because the tree height
    is log n.'
  topic: computer science
  tags:
  - heap
  - priority-queue
  - sift-up
  explanation: "## In plain words\nA heap must stay a complete tree and keep every parent ahead of its\
    \ children. So a new item first takes the only free seat that keeps the tree complete (the end of\
    \ the array), then bubbles upward until it sits below someone more important than itself.\n\n## How\
    \ it works\n- Append `x`; its index is `i = len(a) - 1`.\n- Parent index is `(i - 1) // 2`.\n- Min-heap:\
    \ while `i > 0` and `a[i] < a[parent]`, swap them and set `i = parent`. For a max-heap, use `>`.\n\
    - Stop when the parent is not larger, or the element reaches the root.\n- At most one swap per level,\
    \ so `O(log n)` time and `O(1)` extra space.\n- Inserting n items one by one costs `O(n log n)`; if\
    \ you have them all up front, bottom-up heapify is `O(n)`.\n\n## Example\nInsert 1 into min-heap `[2,\
    \ 5, 3, 7, 6]`:\n- Append: `[2, 5, 3, 7, 6, 1]`, index 5, parent index 2 (value 3). 1 < 3, swap: `[2,\
    \ 5, 1, 7, 6, 3]`.\n- Index 2, parent index 0 (value 2). 1 < 2, swap: `[1, 5, 2, 7, 6, 3]`.\n- Index\
    \ 0: done.\n```python\ndef heap_push(a, x):\n    a.append(x)\n    i = len(a) - 1\n    while i > 0\
    \ and a[i] < a[(i - 1) // 2]:\n        p = (i - 1) // 2\n        a[i], a[p] = a[p], a[i]\n       \
    \ i = p\n\nh = [2, 5, 3, 7, 6]\nheap_push(h, 1)\nprint(h)  # [1, 5, 2, 7, 6, 3]\n```\n\n## Common\
    \ mistakes\n- Using `i // 2` as the parent in a 0-based array (that formula is for 1-based arrays).\n\
    - Sifting down instead of up after an insert.\n- Re-sorting the whole array after each insert, which\
    \ is `O(n log n)`.\n\n## In the interview\nWalk through a tiny example on the whiteboard; it proves\
    \ you know the index maths. Mention the 0-based vs 1-based parent formulas and the `O(n)` heapify\
    \ alternative for bulk loads. Expect a natural follow-up on removal (sift down) and on how `heapq.heappush`\
    \ does exactly this.\n"
