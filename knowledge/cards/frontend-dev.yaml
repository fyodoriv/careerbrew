  question: When does an updated state value become readable in React after calling setState?
  answer: Not immediately. setState schedules a re-render; the current render's variable keeps its old
    value (it is a snapshot). The new value is visible in the next render, and you can compute from the
    latest value with the updater form setX(prev => ...).
  topic: frontend dev
  tags:
  - react
  - state
  - hooks
  explanation: "## In plain words\nState in a React render is like a photo: calling `setCount` does not\
    \ change the photo you are holding; it asks React to take a new photo. Your code sees the new value\
    \ only when React renders again.\n\n## How it works\n- `setState` queues an update. React 18+ batches\
    \ all updates in the same event, timeout, or promise, then re-renders once.\n- Within the current\
    \ function call, `count` is a constant from that render's closure.\n- In the next render, `useState`\
    \ returns the new value.\n- To base an update on the latest queued value, pass a function: `setCount(c\
    \ => c + 1)`.\n- Effects (`useEffect` with `[count]`) see the new value after commit.\n- `flushSync`\
    \ forces a synchronous render, rarely needed (for example before measuring the DOM).\n\n## Example\n\
    ```jsx\nfunction Counter() {\n  const [count, setCount] = React.useState(0);\n  function handle()\
    \ {\n    setCount(count + 1);\n    setCount(count + 1);\n    console.log(count);          // 0: old\
    \ snapshot\n  }                              // result after render: 1, not 2\n  function handleRight()\
    \ {\n    setCount((c) => c + 1);\n    setCount((c) => c + 1);      // result: 2\n  }\n  return <button\
    \ onClick={handle}>{count}</button>;\n}\n```\n\n## Common mistakes\n- Logging state right after setting\
    \ it and thinking the update failed.\n- Using the stale value twice instead of the updater form.\n\
    - Reading state in a long-lived closure (an interval set up once) and getting the initial value forever.\n\
    \n## In the interview\nSay \"state is a snapshot per render\", show the double-increment example,\
    \ and mention automatic batching in React 18. Follow-ups: stale closures in timers (fix with updater\
    \ or a ref), and class components' `setState` callback.\n"
