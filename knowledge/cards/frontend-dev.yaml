  question: Implement throttle
  answer: '`throttle(fn, wait)` returns a wrapper that runs `fn` at most once per `wait` ms. A common
    version runs immediately on the first call, ignores or remembers calls during the wait, and then runs
    once more with the latest arguments when the wait ends (trailing call).'
  topic: frontend dev
  tags:
  - javascript
  - throttle
  - implementation
  - performance
  explanation: "## In plain words\nThrottling is a speed limit for a function. If an event fires 100 times\
    \ a second, like scroll or mousemove, a throttled handler might run only every 100 ms. Unlike debounce,\
    \ it keeps running during a long burst, just less often.\n\n## How it works\n- State: `lastArgs`,\
    \ `lastThis`, and a `timer` (whether we are in a cooldown).\n- On call:\n  - If not cooling down:\
    \ run `fn` now (leading edge) and start a `wait` ms timer.\n  - If cooling down: store the latest\
    \ arguments (trailing call).\n- When the timer ends: if there are stored arguments, run `fn` with\
    \ them and start a new cooldown; otherwise clear the timer.\n- This guarantees at most one call per\
    \ `wait` and that the final state is not lost.\n- Complexity: O(1) per call.\n- Alternative for visual\
    \ updates: `requestAnimationFrame` throttles to the frame rate.\n\n## Example\n```js\nfunction throttle(fn,\
    \ wait) {\n  let timer = null;\n  let lastArgs = null;\n  let lastThis = null;\n\n  function onTimer()\
    \ {\n    if (lastArgs) {\n      fn.apply(lastThis, lastArgs);\n      lastArgs = lastThis = null;\n\
    \      timer = setTimeout(onTimer, wait);\n    } else {\n      timer = null;\n    }\n  }\n\n  return\
    \ function throttled(...args) {\n    if (timer) {\n      lastArgs = args;\n      lastThis = this;\n\
    \      return;\n    }\n    fn.apply(this, args);\n    timer = setTimeout(onTimer, wait);\n  };\n}\n\
    ```\nFive quick calls run the first one at once and the fifth one after `wait` ms.\n\n## Common mistakes\n\
    - Dropping the trailing call, so the last scroll position is never handled.\n- Using `Date.now()`\
    \ checks only, which never fires the trailing call.\n- Mixing up throttle with debounce.\n- Creating\
    \ a new throttled function on each React render.\n\n## In the interview\nDraw a timeline comparing\
    \ throttle and debounce, then code. Mention leading and trailing options as in lodash. Use cases:\
    \ scroll position, drag, resize, rate-limited APIs. Follow-ups: add `cancel`, implement with timestamps,\
    \ or explain why `requestAnimationFrame` is better for animations.\n"
