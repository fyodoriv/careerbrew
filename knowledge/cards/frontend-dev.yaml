- id: kb-a353c5e19647
  question: How do you build a plain JavaScript component that responds to browser events?
  answer: Select or create the DOM element, attach handlers with `addEventListener`, keep the component's
    state in variables or a class, and update the DOM when state changes. Provide a way to tear it down
    (`removeEventListener` or an `AbortController` signal) and use event delegation for dynamic children.
  topic: frontend dev
  tags:
  - javascript
  - dom
  - events
  - components
  explanation: "## In plain words\nWithout a framework you are the framework: you find the element, listen\
    \ for events, change state, and update the DOM yourself. A small class or factory function keeps that\
    \ logic in one place, so the \"component\" can be created, used, and destroyed cleanly.\n\n## How\
    \ it works\n- **Mount**: receive a root element (or create one) and render initial HTML using `textContent`\
    \ or `createElement` rather than unsafe `innerHTML` with user data.\n- **State**: plain fields on\
    \ a class or variables in a closure.\n- **Events**: `addEventListener` on the root; use delegation\
    \ with `event.target.closest()` for child elements that come and go.\n- **Update**: a `render()` method\
    \ that writes the new state into the DOM.\n- **Cleanup**: a `destroy()` that removes listeners. Passing\
    \ `{ signal }` from an `AbortController` lets one `abort()` remove them all.\n- **Accessibility**:\
    \ use real `<button>` elements so keyboard and screen readers work for free.\n- For reuse across frameworks,\
    \ Web Components (`customElements.define`) package this pattern with lifecycle callbacks.\n\n## Example\n\
    ```js\nfunction createCounter(root) {\n  let count = 0;\n  const controller = new AbortController();\n\
    \  root.innerHTML = '<button type=\"button\">Clicked 0 times</button>';\n  const button = root.querySelector(\"\
    button\");\n\n  button.addEventListener(\"click\", () => {\n    count += 1;\n    button.textContent\
    \ = `Clicked ${count} times`;\n  }, { signal: controller.signal });\n\n  return { destroy: () => controller.abort()\
    \ };\n}\n\nconst counter = createCounter(document.querySelector(\"#app\"));\n```\n\n## Common mistakes\n\
    - Putting user input into `innerHTML`, which allows XSS.\n- Attaching listeners to each child instead\
    \ of delegating.\n- Never removing listeners, leaking memory when the component is removed.\n- Using\
    \ a clickable `div` instead of a `button`.\n\n## In the interview\nShow mount, state, events, render,\
    \ destroy. Mention delegation and the `signal` cleanup trick. Follow-ups: how this compares with React\
    \ (manual DOM updates versus declarative rendering), how to make it a Web Component, and how to avoid\
    \ layout thrashing when updating many nodes.\n"
