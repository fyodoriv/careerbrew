- id: kb-28602b8d60f0
  question: What is Context in React?
  answer: Context passes a value down the component tree without threading props through every level.
    You create it with createContext, provide it with a Provider, and read it with useContext; every consumer
    re-renders when the provided value changes.
  topic: frontend dev
  tags:
  - react
  - context
  - state
  explanation: "## In plain words\nPassing the same prop through five components that do not need it is\
    \ called prop drilling. Context is a broadcast channel: a parent puts a value on air, and any descendant\
    \ can tune in.\n\n## How it works\n- `const ThemeContext = createContext(\"light\")` sets a default\
    \ used when there is no provider.\n- Wrap a subtree: `<ThemeContext.Provider value={theme}>` (React\
    \ 19 also allows `<ThemeContext value={theme}>`).\n- Read it: `useContext(ThemeContext)` (or `use(ThemeContext)`\
    \ in React 19).\n- When the value changes (by `Object.is`), all consumers below re-render, even if\
    \ they use only part of it.\n- Good for slow-changing, widely needed data: theme, locale, current\
    \ user, a store instance.\n\n## Example\n```jsx\nconst ThemeContext = React.createContext(\"light\"\
    );\nfunction App() {\n  const [theme, setTheme] = React.useState(\"dark\");\n  return (\n    <ThemeContext.Provider\
    \ value={theme}>\n      <Toolbar />\n      <button onClick={() => setTheme(t => t === \"dark\" ? \"\
    light\" : \"dark\")}>Toggle</button>\n    </ThemeContext.Provider>\n  );\n}\nfunction Toolbar() {\
    \ return <Button />; }\nfunction Button() { return <button className={React.useContext(ThemeContext)}>OK</button>;\
    \ }\n```\n\n## Common mistakes\n- Passing a new object literal as `value` each render, which re-renders\
    \ every consumer; memoise it.\n- Using one giant context for fast-changing state.\n- Treating context\
    \ as a state manager; it only transports values.\n\n## In the interview\nSay context solves prop drilling,\
    \ not state management. Mention splitting contexts, `useMemo` on the value, and libraries (Zustand,\
    \ Redux) with selectors when updates are frequent. Follow-up: component composition (passing children)\
    \ as an alternative to context.\n"
