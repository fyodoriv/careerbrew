  question: How does Promise.all work?
  answer: '`Promise.all(iterable)` returns a promise that fulfils with an array of results, in input order,
    once every input fulfils. It rejects as soon as any input rejects, with that reason. The other promises
    keep running; their results are just ignored.'
  topic: frontend dev
  tags:
  - javascript
  - promises
  - async
  - concurrency
  explanation: "## In plain words\n`Promise.all` is \"wait for all of these, or fail fast\". You start\
    \ several async tasks at the same time, and it gives you back one promise for the whole group. It\
    \ is like waiting for every friend to arrive before dinner, but cancelling the dinner the moment one\
    \ friend says they cannot come.\n\n## How it works\n- Accepts any iterable; non-promise values are\
    \ treated as already fulfilled.\n- Results are stored by index, so the output order matches the input\
    \ order, not completion order.\n- If any input rejects, the returned promise rejects immediately with\
    \ the first rejection reason.\n- It does not cancel the other operations; use `AbortController` if\
    \ you need that.\n- An empty input fulfils immediately with `[]`.\n- Related methods:\n\n| Method\
    \ | Fulfils when | Rejects when |\n|---|---|---|\n| `all` | every input fulfils (array of values)\
    \ | the first input rejects |\n| `allSettled` | every input settles (array of outcome objects) | never\
    \ |\n| `any` | the first input fulfils | every input rejects (`AggregateError`) |\n| `race` | the\
    \ first input settles, if it fulfilled | the first input settles, if it rejected |\n\n## Example\n\
    ```js\nconst [user, posts] = await Promise.all([\n  fetch(\"/api/user\").then((r) => r.json()),\n\
    \  fetch(\"/api/posts\").then((r) => r.json()),\n]);\n```\nBoth requests run in parallel; total time\
    \ is roughly the slower one, not the sum.\n\n## Common mistakes\n- Awaiting in a loop (`for ... await`)\
    \ when the tasks are independent, making them sequential.\n- Assuming results come back in completion\
    \ order.\n- Thinking a rejection stops the other requests.\n- Using `all` when partial success is\
    \ acceptable; `allSettled` fits better.\n\n## In the interview\nState the two outcomes (all fulfil,\
    \ or first rejection) and the ordering guarantee. Compare with `allSettled`, `any`, and `race` using\
    \ the table. A common follow-up is to implement it yourself, or to limit concurrency to N at a time\
    \ for large lists.\n"
