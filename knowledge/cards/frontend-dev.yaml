  question: How do you change state in React?
  answer: 'Call the setter from `useState` (or `dispatch` from `useReducer`) with a new value; never mutate
    state directly. For objects and arrays, create a new copy with the change (`{ ...prev, key: value
    }`). React then re-renders the component with the new state.'
  topic: frontend dev
  tags:
  - react
  - state
  - hooks
  - immutability
  explanation: "## In plain words\nState is the component's memory. You cannot just assign to it, because\
    \ React would not know anything changed. Instead you ask React for a change through the setter, and\
    \ React re-runs the component with the new value. Treat state as read-only, like a photo of the moment.\n\
    \n## How it works\n- `const [value, setValue] = useState(initial)`.\n- Replace primitives: `setCount(5)`.\n\
    - Derive from the previous value: `setCount(c => c + 1)`.\n- Objects: copy and change, `setUser(u\
    \ => ({ ...u, name: \"Ana\" }))`. Nested objects need copying at each level, or a helper like Immer.\n\
    - Arrays: use non-mutating methods: `[...a, x]` to add, `filter` to remove, `map` to update, `toSorted()`\
    \ instead of `sort()`.\n- React compares old and new with `Object.is`; same reference means no update.\n\
    - Complex related updates are easier with `useReducer`.\n- Do not store values you can compute from\
    \ props or other state; compute them during render.\n\n## Example\n```jsx\nfunction Profile() {\n\
    \  const [user, setUser] = useState({ name: \"Sam\", address: { city: \"Oslo\" } });\n  function moveTo(city)\
    \ {\n    setUser((u) => ({ ...u, address: { ...u.address, city } }));\n  }\n  return <button onClick={()\
    \ => moveTo(\"Lima\")}>{user.address.city}</button>;\n}\n```\n\n## Common mistakes\n- `user.name =\
    \ \"Ana\"; setUser(user)`: same reference, no re-render.\n- Shallow-copying only the top level when\
    \ the change is nested.\n- Using `push` or `sort` on state arrays.\n- Expecting the new state to be\
    \ readable right after calling the setter.\n\n## In the interview\nState the rule (setter plus immutable\
    \ update) and show an object and an array update. Mention updater functions and batching. Follow-ups:\
    \ when to choose `useReducer`, when to lift state up or use context, and why immutability makes `memo`\
    \ and effect dependency checks work.\n"
