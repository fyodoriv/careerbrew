  question: What are the steps of the browser's rendering process (the critical rendering path)?
  answer: The browser parses HTML into the DOM and CSS into the CSSOM, combines them into a render tree,
    computes layout (geometry), paints pixels into layers, and composites the layers to the screen. The
    critical rendering path is the minimum work needed for the first paint.
  topic: frontend dev
  tags:
  - browser
  - rendering
  - performance
  - crp
  explanation: "## In plain words\nTurning HTML into pixels is like building a house from plans: read\
    \ the plans (parse), decide which rooms exist and how they look (style), measure each room (layout),\
    \ paint the walls (paint), and assemble the floors (composite).\n\n## How it works\n1. **Parse HTML\
    \ → DOM.** Synchronous `<script>` tags pause parsing.\n2. **Parse CSS → CSSOM.** CSS is render-blocking:\
    \ nothing paints until it is ready.\n3. **Render tree**: visible nodes with computed styles (`display:\
    \ none` is left out).\n4. **Layout (reflow)**: compute position and size of every box.\n5. **Paint**:\
    \ record drawing commands for text, colours, borders, images into layers.\n6. **Composite**: the GPU\
    \ combines layers into the final frame.\nChanging geometry re-runs layout → paint → composite; changing\
    \ `transform` or `opacity` can skip to composite.\n\n## Example\nSpeeding up first paint:\n```html\n\
    <head>\n  <style>/* small critical CSS inline */</style>\n  <link rel=\"preload\" href=\"/hero.avif\"\
    \ as=\"image\">\n  <link rel=\"stylesheet\" href=\"/rest.css\" media=\"print\" onload=\"this.media='all'\"\
    >\n  <script src=\"/app.js\" defer></script>\n</head>\n```\n`defer` keeps the parser running; the\
    \ critical CSS lets the first screen paint early.\n\n## Common mistakes\n- Forgetting that CSS blocks\
    \ rendering and synchronous JS blocks parsing.\n- Mixing up paint and composite.\n- Reading layout\
    \ (`offsetHeight`) right after writing styles in a loop: forced synchronous layout (\"layout thrashing\"\
    ).\n\n## In the interview\nWalk the six steps, then name optimisations: minimise critical resources,\
    \ inline critical CSS, `defer`/`async` scripts, preload key assets, animate with `transform`. Follow-ups:\
    \ what triggers reflow vs repaint, and how this maps to LCP.\n"
