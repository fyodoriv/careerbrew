  - inputs
  explanation: "## In plain words\nA controlled input is a puppet: React holds the strings and decides\
    \ what it shows. An uncontrolled input is independent: the browser keeps the value, and React only\
    \ asks for it when it needs it.\n\n## How it works\n- **Controlled**: `value={state}` plus `onChange={e\
    \ => setState(e.target.value)}`. Each keystroke re-renders. Easy to validate, format, or disable a\
