- id: kb-150525827ad1
  question: What is a canonical tag?
  answer: A canonical tag, <link rel="canonical" href="...">, tells search engines which URL is the preferred
    version of a page when the same content is reachable at several URLs, so ranking signals are merged
    and duplicates are not indexed separately.
  topic: frontend dev
  tags:
  - seo
  - html
  explanation: '## In plain words

    The same product page might live at `/shoes`, `/shoes?ref=ad`, and `/Shoes/`. To a search engine those
    look like three pages competing with each other. The canonical tag says "this one is the original".


    ## How it works

    - Place in `<head>`: `<link rel="canonical" href="https://shop.example/shoes">`.

    - Use an absolute URL, one per page. A page can point to itself (self-referencing canonical), which
    is a good default.

    - It is a strong hint, not a command; search engines may pick another URL if signals conflict.

    - Can also be sent as an HTTP `Link` header for non-HTML files such as PDFs.

    - Keep it consistent with redirects, sitemaps, and internal links.


    ## Example

    Pages with tracking parameters and sorting:

    ```html

    <!-- on https://shop.example/shoes?sort=price&utm_source=mail -->

    <link rel="canonical" href="https://shop.example/shoes">

    ```

    Search engines index `/shoes` and credit links to the variants to it.


    ## Common mistakes

    - Pointing every paginated page to page 1, which can drop later pages from the index.

    - Relative or wrong-protocol URLs.

    - Canonical pointing to a URL that redirects or returns 404.

    - Using it instead of a 301 when a page has truly moved.


    ## In the interview

    Mention when to use canonical vs 301 redirects vs `noindex`, and that SPAs must render the right canonical
    per route (SSR or prerendering). Follow-ups: `hreflang` for language variants, and how frameworks
    like Next.js set metadata.

    '
