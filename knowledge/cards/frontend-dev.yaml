  question: What does translate do in CSS?
  answer: 'translate moves an element along the X, Y (and Z) axes visually, via transform: translate()
    or the standalone translate property, without affecting layout. Other elements do not move, and the
    change can be animated on the compositor.'
  topic: frontend dev
  tags:
  - css
  - transform
  - animation
  explanation: "## In plain words\n`translate` slides an element as if you shifted a sticker on top of\
    \ the page: it moves where it is drawn, but the space it originally occupied stays reserved, and nothing\
    \ around it reflows.\n\n## How it works\n- Syntax: `transform: translate(20px, 10px)`, `translateX(-50%)`,\
    \ `translate3d(x, y, z)`; or the newer individual property `translate: 20px 10px;`.\n- Percentages\
    \ refer to the element's own size, not the parent's. That makes `translate(-50%, -50%)` useful for\
    \ centring.\n- It creates a new stacking context and a containing block for fixed-position children.\n\
    - Animating it avoids layout and paint, so it is smooth.\n- Order matters when combined: `rotate(45deg)\
    \ translateX(100px)` differs from the reverse.\n\n## Example\n```css\n.modal {\n  position: fixed;\
    \ top: 50%; left: 50%;\n  transform: translate(-50%, -50%);   /* centre regardless of size */\n}\n\
    .toast { translate: 0 100%; transition: translate 200ms; }\n.toast.show { translate: 0 0; }\n```\n\
    \n## Common mistakes\n- Expecting siblings to move; layout is unchanged.\n- Thinking percentages are\
    \ of the parent.\n- Being surprised that `position: fixed` children now stick to the transformed parent,\
    \ not the viewport.\n\n## In the interview\nExplain the difference from changing `left`/`top` (layout\
    \ vs compositor). Mention the centring trick and the individual `translate`, `rotate`, `scale` properties.\
    \ Follow-up: why transforms make animations smoother.\n"
