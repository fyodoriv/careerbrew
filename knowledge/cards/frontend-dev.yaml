  question: How do you handle rendering errors in React with error boundaries?
  answer: An error during rendering unmounts the whole React tree, so you wrap parts of the UI in error
    boundaries. An error boundary is a class component with `getDerivedStateFromError` (to show a fallback)
    and `componentDidCatch` (to log). It does not catch errors in event handlers, async code, or itself.
  topic: frontend dev
  tags:
  - react
  - error-handling
  - error-boundary
  - reliability
  explanation: "## In plain words\nIf a component throws while rendering, React cannot know what to show,\
    \ so since React 16 it removes the whole app rather than leave a half-broken screen. An error boundary\
    \ is a safety net you place around a section: when something inside breaks, only that section shows\
    \ a fallback message and the rest of the page keeps working.\n\n## How it works\n- Write a class component\
    \ with:\n  - `static getDerivedStateFromError(error)`: return state such as `{ hasError: true }` so\
    \ the next render shows a fallback.\n  - `componentDidCatch(error, info)`: report to logging; `info.componentStack`\
    \ shows where it broke.\n- Wrap risky areas: routes, widgets, third-party embeds.\n- It catches errors\
    \ thrown during rendering, in lifecycle methods, and in constructors of its children.\n- It does **not**\
    \ catch errors in event handlers, `setTimeout`, promises, server-side rendering, or in the boundary\
    \ itself. Use `try/catch` there, or rethrow into render via state.\n- Many teams use the `react-error-boundary`\
    \ library, which adds `resetKeys` and a hook to show errors from async code.\n\n## Example\n```jsx\n\
    class ErrorBoundary extends React.Component {\n  state = { hasError: false };\n  static getDerivedStateFromError()\
    \ {\n    return { hasError: true };\n  }\n  componentDidCatch(error, info) {\n    logError(error,\
    \ info.componentStack);\n  }\n  render() {\n    return this.state.hasError ? this.props.fallback :\
    \ this.props.children;\n  }\n}\n\n<ErrorBoundary fallback={<p>Could not load comments.</p>}>\n  <Comments\
    \ />\n</ErrorBoundary>\n```\n\n## Common mistakes\n- Expecting a boundary to catch a failed `fetch`\
    \ or a click-handler error.\n- Wrapping the whole app in one boundary, so any error blanks the whole\
    \ page.\n- Not providing a way to retry or reset after the error.\n- Saying there is a hook equivalent\
    \ built into React (there is not yet; boundaries are class components).\n\n## In the interview\nExplain\
    \ why React unmounts the tree, then show the two lifecycle methods and the list of what is not caught.\
    \ Talk about granularity: one boundary per independent area. Follow-ups: logging and monitoring, resetting\
    \ after navigation, and how Suspense and error boundaries work together for data loading.\n"
