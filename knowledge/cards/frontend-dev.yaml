  - interview
  explanation: "## In plain words\nThis open question tests two things: whether you understand hooks beyond\
    \ the basics, and whether you can write a small, correct custom hook under pressure. Choose one you\
    \ can code without notes.\n\n## How it works\nA strong answer:\n1. **Name and motivation**: what problem\
    \ the hook solves (one or two sentences).\n2. **API**: inputs and return value.\n3. **Implementation**:\
    \ built from built-in hooks, with cleanup and correct deps.\n4. **Edge cases**: unmount, changing\
    \ inputs, SSR, Strict Mode double effects.\n5. **Trade-offs**: when not to use it, alternatives.\n\
    Good options: `useDebounce`, `usePrevious`, `useLocalStorage`, `useEventListener`, `useOnClickOutside`.\n\
    \n## Example\nSample answer: \"I like `useDebounce`, because search boxes should not hit the API on\
    \ every key.\"\n```jsx\nfunction useDebounce(value, delay = 300) {\n  const [debounced, setDebounced]\
    \ = React.useState(value);\n  React.useEffect(() => {\n    const id = setTimeout(() => setDebounced(value),\
    \ delay);\n    return () => clearTimeout(id);   // reset timer when value changes or on unmount\n\
    \  }, [value, delay]);\n  return debounced;\n}\n// usage\nconst q = useDebounce(input, 400);\nReact.useEffect(()\
    \ => { if (q) search(q); }, [q]);\n```\n\"Each change clears the old timer, so only the last value\
    \ after a 400 ms pause gets through.\"\n\n## Common mistakes\n- Naming `useState` and stopping there,\
    \ with no depth.\n- Forgetting cleanup, causing timers or listeners to leak.\n- Calling hooks conditionally\
    \ inside the custom hook.\n\n## In the interview\nInterviewers score clarity of motivation, correctness\
    \ (deps, cleanup), and awareness of edge cases. Expect follow-ups: \"make it a debounced callback\
    \ instead\", \"how would you test it\" (fake timers with React Testing Library's `renderHook`), and\
    \ \"what does `useDeferredValue` do differently\".\n"
