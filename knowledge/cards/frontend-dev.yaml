  question: What does stopImmediatePropagation() do?
  answer: 'event.stopImmediatePropagation() stops the event from reaching any other listener: both the
    remaining listeners on the current element and all elements further along the propagation path. stopPropagation()
    only stops the path, letting other listeners on the same element run.'
  topic: frontend dev
  tags:
  - javascript
  - dom
  - events
  explanation: "## In plain words\nAn event travels through the DOM and may have several listeners on\
    \ each element. `stopPropagation` says \"do not go to the next element\". `stopImmediatePropagation`\
    \ says \"stop right here, do not even run the other listeners on this element\".\n\n## How it works\n\
    - Listeners on one element run in the order they were added.\n- Calling `stopImmediatePropagation()`\
    \ in a listener:\n  - skips later listeners on the same element;\n  - stops capture/bubbling to further\
    \ elements.\n- `stopPropagation()` does only the second part.\n- Neither cancels the default action;\
    \ that is `preventDefault()`.\n\n## Example\n```js\nbtn.addEventListener(\"click\", (e) => {\n  if\
    \ (!user.canEdit) {\n    e.stopImmediatePropagation();\n    alert(\"Read-only\");\n  }\n});\nbtn.addEventListener(\"\
    click\", () => saveDocument()); // skipped when read-only\ndocument.addEventListener(\"click\", ()\
    \ => console.log(\"bubbled\")); // also skipped\n```\n\n## Common mistakes\n- Expecting it to prevent\
    \ the default action such as following a link.\n- Using it widely, which breaks delegated listeners,\
    \ analytics, and libraries.\n- Registering the guard after the other listener; order matters.\n\n\
    ## In the interview\nExplain the difference with a two-listener example. Say you would use it rarely,\
    \ for guards or overriding third-party handlers. Follow-ups: capture vs bubble phases, `once` and\
    \ `signal` options, and how React's synthetic events relate.\n"
