- id: kb-75d94ea46307
  question: How do you add an event listener for only the capturing or the bubbling phase?
  answer: 'Pass a third argument to `addEventListener`: `{ capture: true }` (or `true`) registers the
    listener for the capture phase; the default `false` registers it for the bubbling phase. The same
    flag must be passed to `removeEventListener` to remove it.'
  topic: frontend dev
  tags:
  - dom
  - events
  - javascript
  explanation: '## In plain words

    Events travel down the tree (capture), hit the target, then travel back up (bubble). Each listener
    chooses one of the two trips. By default you listen on the way up; asking for capture lets an ancestor
    see the event before the target does.


    ## How it works

    - `el.addEventListener(type, handler, { capture: true })` or `el.addEventListener(type, handler, true)`:
    runs while the event travels down.

    - `el.addEventListener(type, handler)` or `{ capture: false }`: runs while the event bubbles up.

    - On the target element itself, both kinds run; capture listeners first (in modern browsers).

    - `removeEventListener` must use the same `capture` value, or nothing is removed.

    - Other useful options: `once: true` (auto-remove), `passive: true` (promise not to call `preventDefault`,
    good for scroll performance), `signal` (remove with an `AbortController`).

    - `event.eventPhase` tells you the current phase: 1 capturing, 2 at target, 3 bubbling.


    ## Example

    ```js

    const outer = document.querySelector("#outer");

    const inner = document.querySelector("#inner");


    outer.addEventListener("click", () => console.log("outer capture"), { capture: true });

    outer.addEventListener("click", () => console.log("outer bubble"));

    inner.addEventListener("click", () => console.log("inner"));


    // Clicking #inner logs: outer capture, inner, outer bubble

    ```


    ## Common mistakes

    - Removing a capture listener without `{ capture: true }`.

    - Passing a new arrow function to `removeEventListener`; it needs the same function reference.

    - Expecting non-bubbling events (`focus`) to reach bubble listeners on ancestors.

    - Using capture without a reason; it is mainly for intercepting events early (for example closing
    menus on outside clicks).


    ## In the interview

    Give the API, the log-order example, and the removal gotcha. Mention the `once`, `passive`, and `signal`
    options to show you know modern usage. A follow-up may ask when capture is useful (global shortcuts,
    analytics, blocking clicks during a drag) or how React exposes it with `onClickCapture`.

    '
