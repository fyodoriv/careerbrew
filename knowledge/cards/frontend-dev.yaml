  question: How do you select elements by attribute in CSS?
  answer: 'Use attribute selectors in square brackets: `[attr]` for presence, `[attr="v"]` for an exact
    value, `^=` starts with, `$=` ends with, `*=` contains, `~=` a word in a space-separated list, and
    `|=` the value or the value followed by a hyphen. Add ` i` before `]` for case-insensitive matching.'
  topic: frontend dev
  tags:
  - css
  - selectors
  - html
  explanation: '## In plain words

    Besides tags, classes, and ids, CSS can match elements by any attribute and its value. That is handy
    for styling links by destination, inputs by type, or components by `data-*` and `aria-*` state without
    adding extra classes.


    ## How it works

    - `[disabled]`: the attribute exists, any value.

    - `[type="email"]`: exact match.

    - `[href^="https:"]`: value starts with.

    - `[href$=".pdf"]`: value ends with.

    - `[class*="icon"]`: value contains the substring.

    - `[rel~="noopener"]`: one of the space-separated words equals.

    - `[lang|="en"]`: equals `en` or starts with `en-`.

    - `[data-state="open" i]`: case-insensitive.

    - Combine with tags and each other: `a[target="_blank"][rel~="noopener"]`.

    - Specificity is the same as a class (0,1,0).

    - Also usable in JavaScript: `document.querySelectorAll(''[data-role="tab"]'')`.


    ## Example

    ```css

    a[href$=".pdf"]::after { content: " (PDF)"; }

    input[type="checkbox"]:checked + label { font-weight: bold; }

    button[aria-expanded="true"] .chevron { transform: rotate(180deg); }

    [data-variant="danger"] { color: crimson; }

    ```

    Styling by `aria-expanded` keeps visual state in sync with accessible state.


    ## Common mistakes

    - Forgetting quotes around values that contain spaces or special characters.

    - Using `*=` where `~=` is meant, matching partial words (for example `icon` inside `bicon`).

    - Assuming attribute selectors are slow; in modern browsers the difference is negligible.

    - Styling by `class*=` patterns that break when class names change.


    ## In the interview

    List the operators with one example each and mention specificity. Point out practical uses: `data-*`
    variants and `aria-*` states. Follow-ups: pseudo-classes like `:has()`, specificity calculation, and
    performance of selectors (generally not a concern compared with layout and paint).

    '
