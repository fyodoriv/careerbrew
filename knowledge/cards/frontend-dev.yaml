- id: kb-b573aa2598a0
  question: How do you build a Holy Grail layout with CSS?
  answer: 'The Holy Grail layout is a header, a footer, and a middle row with a main column between two
    sidebars, where the footer sits at the bottom even on short pages. With CSS Grid: `grid-template-rows:
    auto 1fr auto`, three columns like `200px 1fr 200px`, and `min-height: 100dvh` on the container.'
  topic: frontend dev
  tags:
  - css
  - grid
  - layout
  - responsive-design
  explanation: "## In plain words\nThe name comes from how hard this layout used to be with floats. Modern\
    \ CSS Grid makes it a few lines: you describe rows and columns, name the areas, and place each part.\
    \ A media query then stacks everything in one column on small screens.\n\n## How it works\n- Write\
    \ semantic HTML: `header`, `nav`, `main`, `aside`, `footer` inside one container.\n- On the container:\n\
    \  - `display: grid`.\n  - `grid-template-rows: auto 1fr auto` so the middle row absorbs leftover\
    \ height.\n  - `grid-template-columns: 200px 1fr 200px` (or `minmax()` values).\n  - `grid-template-areas`\
    \ to name the cells.\n  - `min-height: 100dvh` (with `100vh` fallback) so the footer reaches the bottom.\n\
    - Assign `grid-area` to each child.\n- Add a media query that switches to one column and reorders\
    \ areas for mobile.\n- Flexbox can do it too (column flex for the page, row flex for the middle),\
    \ but Grid is clearer for two dimensions.\n\n## Example\n```css\n.page {\n  display: grid;\n  min-height:\
    \ 100dvh;\n  grid-template-rows: auto 1fr auto;\n  grid-template-columns: 200px 1fr 200px;\n  grid-template-areas:\n\
    \    \"header header header\"\n    \"nav    main   aside\"\n    \"footer footer footer\";\n}\nheader\
    \ { grid-area: header; } nav { grid-area: nav; }\nmain { grid-area: main; } aside { grid-area: aside;\
    \ } footer { grid-area: footer; }\n\n@media (max-width: 700px) {\n  .page {\n    grid-template-columns:\
    \ 1fr;\n    grid-template-rows: auto auto 1fr auto auto;\n    grid-template-areas: \"header\" \"nav\"\
    \ \"main\" \"aside\" \"footer\";\n  }\n}\n```\n\n## Common mistakes\n- Using `height: 100vh` instead\
    \ of `min-height`, which cuts off long content.\n- Forgetting the mobile layout.\n- Reordering visually\
    \ in a way that confuses keyboard and screen-reader order.\n- Using fixed pixel widths for the main\
    \ column.\n\n## In the interview\nStart with the requirements (sticky footer, fluid main, fixed sidebars,\
    \ responsive), then write the grid. Mention why `1fr` and `min-height` matter. Follow-ups: doing it\
    \ with flexbox, accessibility of source order, and using `minmax()` or `clamp()` for flexible sidebars.\n"
