  question: How do you solve prop drilling in React?
  answer: Prop drilling is passing props through many intermediate components that do not use them. Fix
    it by composing with `children` or slot props so data skips the middle, by using Context for widely
    shared values like theme or user, or by using a state library with selectors for app-wide state that
    changes often.
  topic: frontend dev
  tags:
  - react
  - context
  - state-management
  - composition
  explanation: "## In plain words\nImagine passing a note through five people to reach the last one, and\
    \ none of the middle people care about it. Every one of them now has to know about the note. Prop\
    \ drilling makes components harder to change and reuse; the goal is to let data reach the component\
    \ that needs it more directly.\n\n## How it works\n- **Is it a problem?** Two or three levels of explicit\
    \ props is fine and easy to follow.\n- **Composition first**: have the parent render the deep child\
    \ itself and pass it down as `children` or a prop like `sidebar={<UserMenu user={user} />}`. The middle\
    \ components no longer see `user`.\n- **Context**: for values used in many places (theme, locale,\
    \ auth). Create a context, provide it high, read it with `useContext` where needed. Watch re-render\
    \ cost when the value changes.\n- **State libraries**: Redux Toolkit, Zustand, Jotai for large, frequently\
    \ updated shared state, with selectors to limit re-renders.\n- **Server-state libraries**: TanStack\
    \ Query or SWR so components fetch cached data by key instead of receiving it via props.\n- Co-locate\
    \ state: move it down to the lowest common parent.\n\n## Example\n```jsx\n// Before: Layout and Header\
    \ pass `user` they never use.\n// After: composition\nfunction App({ user }) {\n  return <Layout header={<Header\
