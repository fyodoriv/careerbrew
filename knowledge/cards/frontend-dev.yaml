  question: What is your favourite React hook, and how would you implement it?
  answer: Pick a hook you know deeply, explain why it is useful, and implement it live. A strong choice
    is a custom hook such as useDebounce or usePrevious built on useState, useEffect, and useRef, with
    correct cleanup and dependencies.
  topic: frontend dev
  tags:
  - react
  - hooks
