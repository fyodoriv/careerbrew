  question: How do you reduce unnecessary re-renders caused by React Context?
  answer: Every component that reads a context re-renders when the provider's value changes. Keep the
    value stable with `useMemo`, split one big context into smaller ones (for example state and dispatch
    separately), keep fast-changing state local, and memoize heavy subtrees. For high-frequency global
    state, use a store with selectors.
  topic: frontend dev
  tags:
  - react
  - context
  - performance
  - state-management
  explanation: "## In plain words\nContext is a broadcast channel. When the provider sends a new value,\
    \ every listener re-renders, even if it only cares about a part that did not change. The fixes are\
    \ about sending fewer, smaller, more targeted broadcasts.\n\n## How it works\n- **Stable value**:\
    \ `value={{ user, setUser }}` creates a new object each render, so all consumers re-render whenever\
    \ the provider re-renders. Wrap it in `useMemo`.\n- **Split contexts**: separate rarely changing data\
    \ (theme, user) from frequently changing data (cursor position), and separate state from setters or\
    \ `dispatch` (which are stable), so components that only update never re-render on reads.\n- **Keep\
    \ state local** when only one subtree needs it.\n- **Children pattern**: have the provider render\
    \ `children` passed from above, so the provider's own re-render does not re-create those elements.\n\
    - **Memoize consumers' heavy children** with `React.memo`.\n- **Selectors**: Context has no built-in\
    \ selectors; libraries like Zustand, Redux, or `useSyncExternalStore`-based stores let components\
    \ subscribe to slices.\n\n## Example\n```jsx\nconst CountContext = createContext(0);\nconst SetCountContext\
    \ = createContext(() => {});\n\nfunction CountProvider({ children }) {\n  const [count, setCount]\
    \ = useState(0);\n  return (\n    <SetCountContext.Provider value={setCount}>\n      <CountContext.Provider\
    \ value={count}>{children}</CountContext.Provider>\n    </SetCountContext.Provider>\n  );\n}\n// A\
    \ button that only calls setCount reads SetCountContext and never re-renders on count changes.\n```\n\
    \n## Common mistakes\n- Passing an inline object as `value`.\n- Putting all app state in one context.\n\
    - Assuming `React.memo` stops re-renders from context; a memoized component still re-renders if it\
    \ reads the changed context.\n- Using context for very frequent updates such as animation or form\
    \ typing.\n\n## In the interview\nExplain the propagation rule, then list fixes from simplest (memoize\
    \ value) to structural (split, local state, store with selectors). Mention you would confirm with\
    \ the Profiler. Follow-ups: Context versus Redux or Zustand, and how `use(Context)` in React 19 differs\
    \ from `useContext` (it can be called conditionally).\n"
