  question: Which client-side storage APIs can a service worker access?
  answer: 'Service workers can use asynchronous storage: the Cache API and IndexedDB, plus the Storage
    Manager and OPFS file system. They cannot use synchronous localStorage or sessionStorage, and cannot
    read cookies directly except through the async Cookie Store API in some browsers.'
  topic: frontend dev
  tags:
  - service-workers
  - storage
  - pwa
  explanation: "## In plain words\nA service worker runs in the background with no page and no DOM, and\
    \ it must never block. So it only gets storage APIs that are asynchronous; the old synchronous ones\
    \ are off limits.\n\n## How it works\nAvailable:\n- **Cache API** (`caches`): Request/Response pairs,\
    \ for offline assets and API responses.\n- **IndexedDB**: structured data, queues of pending writes,\
    \ blobs.\n- **StorageManager** (`navigator.storage.estimate()`, `persist()`): quota and persistence.\n\
    - **Origin Private File System** via `navigator.storage.getDirectory()` (async access).\n- **Cookie\
    \ Store API** (`cookieStore`): async cookie reads and change events, where supported (not yet in every\
    \ browser).\nNot available:\n- `localStorage`, `sessionStorage` (synchronous, window-only).\n- `document.cookie`\
    \ (no document).\nTo share data with pages, use IndexedDB, the Cache API, or `postMessage`/`BroadcastChannel`.\n\
    \n## Example\nQueueing a form post while offline:\n```js\nimport { openDB } from \"idb\";\nself.addEventListener(\"\
    fetch\", (e) => {\n  if (e.request.method !== \"POST\") return;\n  e.respondWith(fetch(e.request.clone()).catch(async\
    \ () => {\n    const db = await openDB(\"outbox\", 1, { upgrade: (d) => d.createObjectStore(\"q\"\
    , { autoIncrement: true }) });\n    await db.add(\"q\", { url: e.request.url, body: await e.request.text()\
    \ });\n    return new Response(JSON.stringify({ queued: true }), { status: 202 });\n  }));\n});\n\
    ```\n\n## Common mistakes\n- Trying `localStorage` in a service worker; it is not defined there, so\
    \ the code throws a `ReferenceError`.\n- Keeping important state in global variables; the worker can\
    \ be stopped at any time.\n- Forgetting that all these share one origin quota.\n\n## In the interview\n\
    Explain why only async APIs are allowed. Mention the worker's short lifetime and `event.waitUntil`.\
    \ Follow-ups: syncing the outbox later with Background Sync, and which storage survives \"clear site\
    \ data\".\n"
