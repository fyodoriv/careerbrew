- id: kb-48dfbd7bc7a7
  question: How can you optimise saving data after input changes?
  answer: 'Do not save on every keystroke: debounce saves until typing pauses, batch or coalesce changes,
    cancel or ignore stale requests, save optimistically with rollback, and flush pending changes on blur
    or page hide.'
  topic: frontend dev
  tags:
  - javascript
  - performance
  - debounce
  - autosave
  explanation: "## In plain words\nAutosave that fires on every key press floods the server and can save\
    \ out of order. The goal is to save the latest value, soon enough to feel safe, with as few requests\
    \ as possible.\n\n## How it works\n- **Debounce**: wait until no change for, say, 500 ms, then save\
    \ once.\n- **Throttle** or a max wait: also save at least every few seconds during long typing.\n\
    - **Coalesce**: keep only the latest pending value per field; send a diff or patch.\n- **Ordering**:\
    \ abort the previous request (`AbortController`) or attach a version number and ignore older responses.\n\
    - **Optimistic UI**: show \"saved\" state locally, roll back on error.\n- **Flush**: save on `blur`\
    \ and on `visibilitychange` to hidden, using `fetch(..., { keepalive: true })` or `navigator.sendBeacon`.\n\
    - **Offline**: queue in IndexedDB and retry.\n\n## Example\n```js\nfunction debounce(fn, ms) {\n \
    \ let t;\n  const d = (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };\n\
    \  d.flush = (...args) => { clearTimeout(t); fn(...args); };\n  return d;\n}\nlet ctrl;\nconst save\
    \ = debounce(async (text) => {\n  ctrl?.abort();\n  ctrl = new AbortController();\n  await fetch(\"\
    /api/note\", { method: \"PUT\", body: text, signal: ctrl.signal });\n}, 500);\ninput.addEventListener(\"\
    input\", (e) => save(e.target.value));\ninput.addEventListener(\"blur\", (e) => save.flush(e.target.value));\n\
    ```\n\n## Common mistakes\n- Debouncing without a final flush, so the last edit is lost when the tab\
    \ closes.\n- Responses arriving out of order and overwriting newer data.\n- Creating a new debounced\
    \ function on every React render; wrap it in `useMemo` or `useRef`.\n\n## In the interview\nMention\
    \ the trade-off between server load and data-loss risk, and show a \"Saving… / Saved\" indicator.\
    \ Follow-ups: conflict handling with ETags, CRDTs for collaborative editing, and idempotent PUT endpoints.\n"
  match:
