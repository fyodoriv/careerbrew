- id: kb-6d6e0ebf5dcd
  question: Why do React lists need a key prop? Give an example where a bad key causes a bug.
  answer: Keys give each list item a stable identity so React can match items between renders and keep
    the right state and DOM node with the right data. Bad keys, like array indexes in a list that changes
    order, attach state to the wrong item.
  topic: frontend dev
  tags:
  - react
  - keys
  - lists
  - reconciliation
  explanation: "## In plain words\nWithout names, a teacher calling the register by seat number gets confused\
    \ when students change seats. Keys are the students' names: React uses them to recognise each item\
    \ even after the list changes.\n\n## How it works\n- During reconciliation, React compares children\
    \ with the same key; matching keys keep their component instance, state, and DOM node.\n- New keys\
    \ mount new items; missing keys unmount.\n- Keys must be unique among siblings and stable across renders.\n\
    - Good keys: database ids, slugs. Bad keys: array index in a changing list, `Math.random()`, values\
    \ that can repeat.\n- Without keys, React falls back to index and logs a warning.\n\n## Example\n\
    Bug with index keys:\n```jsx\nfunction Todos() {\n  const [todos, setTodos] = React.useState([{ id:\
    \ 1, t: \"A\" }, { id: 2, t: \"B\" }]);\n  return (\n    <>\n      <button onClick={() => setTodos([{\
    \ id: 3, t: \"New\" }, ...todos])}>Add on top</button>\n      {todos.map((todo, i) => (\n        <label\
    \ key={i}><input type=\"checkbox\" /> {todo.t}</label>\n      ))}\n    </>\n  );\n}\n```\nTick \"\
    A\", then add on top: the tick now appears next to \"New\", because the checkbox state stayed with\
    \ index 0. Using `key={todo.id}` fixes it.\n\n## Common mistakes\n- Thinking the key only silences\
    \ a console warning.\n- Generating keys during render with random values, which remounts everything\
    \ and loses focus.\n- Expecting `key` to be readable as a prop inside the child; it is not passed\
    \ down.\n\n## In the interview\nExplain identity and reconciliation, then show the bug and fix. Mention\
    \ that changing `key` intentionally resets a component. Follow-ups: when index keys are acceptable,\
    \ and performance cost of remounting large lists.\n"
