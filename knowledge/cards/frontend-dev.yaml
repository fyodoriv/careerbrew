  explanation: '## In plain words

    Zebra-striped tables and alternating list rows use the `odd` and `even` keywords inside `:nth-child()`.
    They are shortcuts for simple counting formulas.


    ## How it works

    - `:nth-child(odd)` = `:nth-child(2n+1)`: positions 1, 3, 5…

    - `:nth-child(even)` = `:nth-child(2n)`: positions 2, 4, 6…

