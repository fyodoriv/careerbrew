  question: Implement a function that runs an async operation for each array element in sequence
  answer: Loop with `for...of` and `await` each call before starting the next, pushing results into an
    array; or chain with `reduce` over a promise. Sequential processing is right when each step depends
    on the previous one, or when you must limit load on a server or API.
  topic: frontend dev
  tags:
  - javascript
  - promises
  - async
  - implementation
  explanation: "## In plain words\nSometimes you must not start everything at once: maybe each request\
    \ needs the previous answer, or the server allows only one request at a time. Running in sequence\
    \ means start one, wait for it, then start the next, like a single checkout lane.\n\n## How it works\n\
    - `async function mapSeries(items, fn)`:\n  - Create `results = []`.\n  - `for (const [i, item] of\
    \ items.entries())`: `results.push(await fn(item, i))`.\n  - Return `results`.\n- Errors: the first\
    \ rejection stops the loop and rejects the returned promise; use `try/catch` per item to continue\
    \ instead.\n- `forEach` with an async callback does **not** wait; it fires everything in parallel\
    \ and returns immediately.\n- Total time is the sum of each step, versus roughly the maximum for `Promise.all`.\n\
    - Middle ground: a concurrency limit (run up to N at a time) keeps order of results while improving\
    \ speed.\n- Complexity: O(n) calls, O(n) space for results.\n\n## Example\n```js\nasync function mapSeries(items,\
    \ fn) {\n  const results = [];\n  for (const [i, item] of items.entries()) {\n    results.push(await\
    \ fn(item, i));\n  }\n  return results;\n}\n\nconst wait = (ms, v) => new Promise((r) => setTimeout(()\
    \ => r(v), ms));\nmapSeries([30, 10, 20], (ms) => wait(ms, ms)).then(console.log); // [30, 10, 20]\
    \ after ~60ms\n```\n\n## Common mistakes\n- Using `array.forEach(async ...)` and expecting it to wait.\n\
    - Calling all functions first (`items.map(fn)`) and then awaiting them in a loop; they already started\
    \ in parallel.\n- Using sequence when tasks are independent, making the code much slower than needed.\n\
    - Swallowing errors silently.\n\n## In the interview\nShow the `for...of` solution, explain why `forEach`\
    \ fails, and compare timing with `Promise.all`. Mention a concurrency-limited pool as an improvement.\
