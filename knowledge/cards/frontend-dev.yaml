  question: How is the React event system different from native DOM events?
  answer: React wraps native events in `SyntheticEvent` objects with a consistent API, and attaches listeners
    at the root container instead of on each element (delegation). Handlers use camelCase props, receive
    the wrapper, and must call `preventDefault()` explicitly; returning `false` does nothing.
  topic: frontend dev
  tags:
  - react
  - events
  - dom
  - javascript
  explanation: "## In plain words\nWhen you write `onClick` in JSX, React does not call `addEventListener`\
    \ on that button. Instead it listens once at the root of your app and, when an event bubbles up, works\
    \ out which components should get it. It hands your handler a wrapper object that looks and behaves\
    \ the same in every browser.\n\n## How it works\n- **Delegation**: since React 17, listeners are attached\
    \ to the root container (the element passed to `createRoot`), not `document`. This lets several React\
    \ apps or versions coexist on one page.\n- **SyntheticEvent**: a wrapper with the standard API (`target`,\
    \ `stopPropagation`, `preventDefault`). The real event is in `e.nativeEvent`. Event pooling was removed\
    \ in React 17, so you can read the event asynchronously.\n- **Naming**: camelCase props (`onClick`,\
    \ `onChange`) that take functions, not strings.\n- **Phases**: handlers run in the bubble phase; add\
    \ `Capture` (`onClickCapture`) for the capture phase.\n- **Differences in behavior**: `onChange` fires\
    \ on every keystroke (like native `input`); `onFocus`/`onBlur` bubble in React (they use `focusin`/`focusout`);\
    \ `onScroll` does not bubble in React 17+.\n- **Default action**: you must call `e.preventDefault()`;\
    \ `return false` is ignored.\n\n## Example\n```jsx\nfunction Form() {\n  function handleSubmit(e)\
    \ {\n    e.preventDefault();          // stop the page reload\n    console.log(e.nativeEvent);  //\
    \ the browser's SubmitEvent\n  }\n  return <form onSubmit={handleSubmit}><button>Send</button></form>;\n\
    }\n```\n\n## Common mistakes\n- Saying React adds a listener to every element.\n- Mixing native `addEventListener`\
    \ and React handlers and being surprised by ordering with `stopPropagation`.\n- Using `return false`\
    \ to prevent default.\n- Saying events are still pooled (true only before React 17).\n\n## In the\
    \ interview\nCover three points: root-level delegation, the SyntheticEvent wrapper, and API differences.\
    \ Mentioning the React 17 change from `document` to the root container shows depth. Follow-ups: how\
    \ to listen to `window` events (use `useEffect` with `addEventListener` and clean up), and why stopping\
    \ propagation in a native listener can hide events from React.\n"
