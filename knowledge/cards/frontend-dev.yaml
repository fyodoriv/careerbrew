  question: How do you cancel or abort a fetch request?
  answer: Create an `AbortController`, pass its `signal` to `fetch`, and call `controller.abort()` when
    the request is no longer needed. The fetch promise rejects with an `AbortError` DOMException, which
    you handle separately from real errors. `AbortSignal.timeout(ms)` gives a ready-made timeout signal.
  topic: frontend dev
  tags:
  - javascript
  - fetch
  - abortcontroller
  - networking
  explanation: "## In plain words\nOnce a request is sent you cannot un-send it, but you can tell the\
    \ browser to stop waiting and drop the response. `AbortController` is a remote control: you give its\
    \ signal to `fetch`, and pressing \"abort\" ends that request. This matters when a user types fast\
    \ or leaves a page before data arrives.\n\n## How it works\n1. `const controller = new AbortController();`\n\
    2. `fetch(url, { signal: controller.signal })`.\n3. Later, `controller.abort()` (optionally with a\
    \ reason).\n4. The promise rejects with an error whose `name` is `\"AbortError\"` (or your reason\
    \ if you passed one); check it and ignore it if the abort was intentional.\n- One signal can cancel\
    \ several requests at once.\n- A controller cannot be reused after aborting; create a new one per\
    \ request.\n- `AbortSignal.timeout(5000)` aborts automatically with a `TimeoutError`; `AbortSignal.any([a,\
    \ b])` combines signals.\n- The same signal works with `addEventListener` (`{ signal }`) and many\
    \ libraries.\n- In React, abort in the effect cleanup so stale responses never update state.\n\n##\
    \ Example\n```js\nuseEffect(() => {\n  const controller = new AbortController();\n  fetch(`/api/items?q=${encodeURIComponent(query)}`,\
    \ { signal: controller.signal })\n    .then((r) => r.json())\n    .then(setItems)\n    .catch((err)\
    \ => {\n      if (err.name !== \"AbortError\") setError(err);\n    });\n  return () => controller.abort();\n\
    }, [query]);\n```\n\n## Common mistakes\n- Treating an intentional abort as an error and showing an\
    \ error message.\n- Reusing one controller after it has aborted.\n- Assuming the server stops processing;\
    \ aborting only affects the client.\n- Forgetting to abort in effect cleanup, causing race conditions.\n\
    \n## In the interview\nWalk through the four steps and the React cleanup pattern. Mention timeouts\
    \ with `AbortSignal.timeout`. Follow-ups: how libraries like TanStack Query or axios handle cancellation,\
    \ why aborted requests may still change server state, and how to cancel the previous search request\
    \ in a typeahead.\n"
