- id: kb-c00321017978
  question: What does the content property do in CSS pseudo-elements?
  answer: 'content sets what ::before and ::after generate: a string, an image url(), counters, attribute
    values with attr(), quotes, or empty string for purely decorative boxes. Without content, the pseudo-element
    is not rendered at all.'
  topic: frontend dev
  tags:
  - css
  - pseudo-elements
  explanation: '## In plain words

    `::before` and `::after` let CSS add an extra box at the start or end of an element''s content. The
    `content` property is the switch that creates it and says what goes inside.


    ## How it works

    - Required: `content: none` (default) means no box. Use `content: ""` for decoration only.

    - Values: strings (`"→ "`), `url(icon.svg)`, `counter(step)`, `attr(data-label)`, `open-quote` / `close-quote`,
    combined in one list.

    - Generated content is not in the DOM and cannot be selected by JS; screen readers may or may not
    read it. Newer syntax allows alt text: `content: "★" / "Featured"`.

    - `::before`/`::after` do not work on replaced elements such as `<img>` and `<input>`.


    ## Example

    ```css

    .required::after { content: " *"; color: crimson; }

    a[href^="http"]::after { content: " ↗"; }

    ol.steps { counter-reset: step; }

    ol.steps li::before { counter-increment: step; content: "Step " counter(step) ": "; }

    .badge::before { content: attr(data-count); }

    ```


    ## Common mistakes

    - Forgetting `content: ""` and wondering why the decoration is missing.

    - Putting meaningful text in CSS, which hurts accessibility and translation.

    - Trying to add `::before` to an `<input>`.


    ## In the interview

    Mention single vs double colon (`::` for pseudo-elements, `:` for pseudo-classes) and accessibility
    of generated content. Follow-ups: CSS counters, and when an extra element is better than a pseudo-element.

    '
