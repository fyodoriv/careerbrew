  question: In React, what is the difference between a ref and a module-level variable?
  answer: 'A `useRef` value belongs to one component instance: each mounted copy gets its own, it persists
    across that instance''s renders, and it is discarded on unmount. A variable outside the component
    lives in the module, is shared by every instance, and survives unmounts (and on the server, across
    requests). Neither triggers a re-render.'
  topic: frontend dev
  tags:
  - react
  - refs
  - hooks
  - scope
  explanation: "## In plain words\nBoth a ref and an outside variable can remember something between renders\
    \ without causing renders. The difference is ownership. A ref is a personal notebook for each component\
    \ instance; a module variable is a whiteboard on the wall that every instance reads and writes.\n\n\
    ## How it works\n- **useRef**:\n  - Created per instance on mount; reset when the component remounts.\n\
    \  - Ideal for per-instance values: DOM nodes, timer ids, previous values, \"has mounted\" flags.\n\
    - **Module variable** (declared outside the component):\n  - One copy for the whole app (per JavaScript\
    \ module instance).\n  - Shared by all instances and kept after they unmount.\n  - In server rendering\
    \ it is shared across users' requests, which can leak data between them.\n  - Fine for true constants\
    \ and configuration, or deliberate shared caches.\n- **Variable inside the component body**: recreated\
    \ on every render, so it cannot remember anything.\n- None of the three causes a re-render; use state\
    \ for values shown on screen.\n\n## Example\n```jsx\nlet clicksEverywhere = 0;       // shared by\
    \ every Counter\n\nfunction Counter() {\n  const clicksHere = useRef(0); // separate for each Counter\n\
    \  return (\n    <button onClick={() => {\n      clicksEverywhere += 1;\n      clicksHere.current\
    \ += 1;\n      console.log(clicksHere.current, clicksEverywhere);\n    }}>\n      Click\n    </button>\n\
    \  );\n}\n// Two Counters: clicking each once logs \"1 1\" then \"1 2\".\n```\n\n## Common mistakes\n\
    - Using a module variable for per-instance data, causing bugs when the component is used twice.\n\
    - Storing user-specific data in module scope in server-rendered apps.\n- Declaring a plain variable\
    \ in the body and expecting it to persist.\n- Using refs or module variables for rendered values and\
    \ wondering why the UI does not update.\n\n## In the interview\nFrame it as scope and lifetime: per\
    \ instance versus per module. Mention the SSR leak risk, which shows production awareness. Follow-ups:\
    \ when state is the right choice, how module-level caches interact with hot reloading, and how this\
