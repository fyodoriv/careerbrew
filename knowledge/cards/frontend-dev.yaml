  question: How would you improve frontend performance for a widget embedded in many web products?
  answer: 'Treat it as a third-party script: measure first (load size, time to interactive, impact on
    the host''s Core Web Vitals), set a performance budget, then load it lazily and asynchronously, keep
    a small loader with code-split features, share one build across hosts, isolate it (iframe or Shadow
    DOM), and monitor real-user metrics per host.'
  topic: frontend dev
  tags:
  - performance
  - web-vitals
  - system-design
  - third-party
  explanation: '## In plain words

    An embedded widget, like a chat bubble or a feedback button, runs on pages you do not own. Every kilobyte
    and every millisecond it uses slows down someone else''s product. The goal is to be invisible until
    needed: tiny at first, fast when opened, and never in the way of the host page.


    ## How it works

    - **Measure**: define metrics such as loader size, time from script start to interactive widget, long
    tasks caused, and effect on host LCP, INP, and CLS. Collect lab data (Lighthouse) and real-user data
    per host.

    - **Budget**: set limits (for example loader under a small gzip size) and fail CI when they are exceeded.

    - **Loading**: a tiny async loader that renders only the launcher button; fetch the full chat bundle
    on interaction or idle (`requestIdleCallback`); preconnect to the API origin.

    - **Code**: one shared codebase and build for all hosts; tree-shaking, code splitting, modern syntax
    builds, no heavy dependencies.

    - **Isolation**: iframe or Shadow DOM to avoid CSS clashes and protect the host from expensive style
    recalculation.

    - **Runtime**: avoid layout shifts (reserve space), break up long tasks, virtualize long message lists,
    and lazy-load images.

    - **Caching**: versioned, long-cached assets on a CDN.


    ## Example

    A sample plan: "Week 1: add RUM for widget load and interaction timings per host. Week 2: split the
    bundle so the launcher is loaded first and the conversation UI only on click. Week 3: add a CI size
    budget. Re-measure; target: no measurable change to the host''s LCP and a faster open-to-interactive
    time."


    ## Common mistakes

    - Optimizing before measuring, or measuring only on a fast laptop.

    - Loading the whole widget eagerly on every page view.

    - Forgetting the widget''s effect on host metrics, not just its own.

    - Letting each product fork its own build, so fixes never reach everyone.


    ## In the interview

    Structure the answer as measure, budget, optimize, monitor. Name the trade-offs: iframe isolation
    costs some memory and complicates communication, lazy loading adds a short delay on first open. Expect
    follow-ups on Core Web Vitals definitions, how to detect regressions automatically, and how to roll
    out changes safely across many hosts.

    '
