- id: kb-a943f20e0ed8
  question: What is hardware acceleration when rendering a web page?
  answer: Hardware acceleration means the browser hands parts of rendering, mainly rasterising and compositing
    layers, to the GPU. It makes transforms, opacity changes, video, and canvas fast and keeps animations
    smooth, at the cost of GPU memory.
  topic: frontend dev
  tags:
  - browser
  - rendering
  - gpu
  - performance
  explanation: '## In plain words

    The CPU is good at varied tasks; the GPU is great at pushing lots of pixels in parallel. Hardware
    acceleration lets the browser give pixel-heavy work to the GPU so the main thread stays free for your
    JavaScript.


    ## How it works

    - The browser splits the page into layers (see compositing).

    - Layers are rasterised (often by the GPU) into textures.

    - The GPU moves, scales, rotates, and blends textures each frame, so `transform` and `opacity` animations
    avoid layout and paint.

    - Triggers for a layer include `will-change: transform`, 3D transforms, `<video>`, `<canvas>` (WebGL),
    and CSS filters in some cases. The old hack `transform: translateZ(0)` does the same.

