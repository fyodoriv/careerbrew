    every frame.


    ## Common mistakes

    - Sprinkling `translateZ(0)` everywhere and running out of GPU memory on phones.

    - Assuming any CSS property is accelerated; `width`, `top`, `box-shadow` are not.

    - Leaving `will-change` on permanently.


