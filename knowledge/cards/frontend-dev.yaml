  explanation: "## In plain words\n`fetch` is the browser's built-in way to make HTTP requests. It works\
    \ in two steps: the first promise resolves when headers arrive, and a second promise reads the body.\
    \ The surprise for many people is that a 404 or 500 still counts as a \"successful\" fetch.\n\n##\
    \ How it works\n- `const res = await fetch(url, { method, headers, body, signal })`.\n- The promise\
    \ rejects only for network errors, CORS failures, or aborts.\n- Check `res.ok` (status 200-299) or\
    \ `res.status`; throw your own error otherwise.\n- Read the body once: `res.json()`, `res.text()`,\
    \ `res.blob()`, or `res.formData()`.\n- For JSON requests: `method: \"POST\"`, `headers: { \"Content-Type\"\
    : \"application/json\" }`, `body: JSON.stringify(data)`.\n- Cookies: same-origin by default; use `credentials:\
    \ \"include\"` for cross-origin cookies (requires server CORS settings).\n- Cancel or time out with\
    \ `AbortController` or `AbortSignal.timeout(ms)`.\n- Encode query values with `URLSearchParams` or\
    \ `encodeURIComponent`.\n\n## Example\n```js\nasync function createItem(item) {\n  try {\n    const\
    \ res = await fetch(\"/api/items\", {\n      method: \"POST\",\n      headers: { \"Content-Type\"\
    : \"application/json\" },\n      body: JSON.stringify(item),\n      signal: AbortSignal.timeout(5000),\n\
    \    });\n    if (!res.ok) throw new Error(`HTTP ${res.status}`);\n    return await res.json();\n\
    \  } catch (err) {\n    console.error(\"createItem failed:\", err.message);\n    throw err;\n  }\n\
    }\n```\n\n## Common mistakes\n- Not checking `res.ok`, so error pages are parsed as data.\n- Forgetting\
    \ `await` on `res.json()`.\n- Reading the body twice (it is a stream; use `res.clone()` if needed).\n\
    - Sending an object as `body` without `JSON.stringify` and the header.\n\n## In the interview\nShow\
