- id: kb-35b8055c7fcd
  question: What is box-sizing in CSS?
  answer: box-sizing decides what width and height measure. With content-box (the default) they size only
    the content, so padding and border are added on top; with border-box they include padding and border,
    which makes layouts easier to reason about.
  topic: frontend dev
  tags:
  - css
  - box-model
  - layout
  explanation: '## In plain words

    If you order a 200 px box, should padding and border be inside or outside those 200 px? `content-box`
    puts them outside, so the box ends up bigger. `border-box` keeps the total at 200 px and shrinks the
    content area instead.


    ## How it works

    - `content-box`: rendered width = width + padding-left + padding-right + border-left + border-right.

    - `border-box`: rendered width = width; content width = width − padding − border.

    - Margins are never included in either mode.

    - A common global reset applies `border-box` to everything:

    ```css

    *, *::before, *::after { box-sizing: border-box; }

    ```


    ## Example

    ```css

    .a { width: 200px; padding: 20px; border: 5px solid; box-sizing: content-box; } /* 250px wide */

    .b { width: 200px; padding: 20px; border: 5px solid; box-sizing: border-box; }  /* 200px wide */

    ```

    Two `.b` boxes at `width: 50%` fit side by side; two `.a` boxes with padding would wrap.


    ## Common mistakes

    - Thinking `border-box` includes margin.

    - Forgetting pseudo-elements in the reset.

    - Being confused when inputs and buttons already use `border-box` by default in some browsers.


    ## In the interview

    Tie it to the box model (content, padding, border, margin) and explain why most teams use the global
    reset. Follow-ups: margin collapsing, and how `box-sizing` interacts with `min-width` and flex basis.

    '
