- id: kb-c518d98023d7
  question: What are the HTTP caching directives that control how browsers cache a page and its assets?
  answer: 'Caching is controlled mainly by the Cache-Control response header: max-age, no-cache, no-store,
    public, private, immutable, s-maxage, and stale-while-revalidate, plus validators ETag and Last-Modified
    for revalidation. The old HTML meta http-equiv tags are unreliable.'
  topic: frontend dev
  tags:
  - http
  - caching
  - performance
  explanation: '## In plain words

    Caching tells the browser and CDNs: "you may reuse this copy for this long, and here is how to check
    if it changed." It is set by the server in HTTP headers, not really in HTML.


    ## How it works

    Key `Cache-Control` directives:

    - `max-age=N`: fresh for N seconds; reuse without asking.

    - `s-maxage=N`: the same, but for shared caches like CDNs.

    - `no-cache`: you may store it, but revalidate before every use.

    - `no-store`: never store it (sensitive data).

    - `public` / `private`: may a shared cache keep it, or only the browser?

    - `immutable`: will never change during its lifetime; skip revalidation on reload.

    - `stale-while-revalidate=N`: serve stale for N seconds while fetching a fresh copy in the background.

    Revalidation: the server sends `ETag` or `Last-Modified`; the browser asks with `If-None-Match` /
    `If-Modified-Since`; a `304 Not Modified` means reuse.


    ## Example

    A common setup:

    - `index.html`: `Cache-Control: no-cache` plus an `ETag`, so new deploys appear at once.

    - `app.3f9a2c.js` (hashed filename): `Cache-Control: public, max-age=31536000, immutable`.

    - `/api/me`: `Cache-Control: private, no-store`.


    ## Common mistakes

    - Thinking `no-cache` means "do not cache"; that is `no-store`.

    - Long `max-age` on files without content hashes, so users keep old code.

    - Relying on `<meta http-equiv="Cache-Control">`; browsers mostly ignore it.


    ## In the interview

    Explain the hashed-assets plus revalidated-HTML strategy. Follow-ups: CDN purging, `Vary` header,
    service worker caches on top of HTTP cache, and bfcache being blocked by `no-store` in some browsers.

    '
