  question: Implement debounce
  answer: '`debounce(fn, wait)` returns a wrapper that resets a timer on every call and runs `fn` only
    after `wait` ms pass with no new calls, using the latest arguments and `this`. Typical uses: search-as-you-type,
    resize handlers, and autosave.'
  topic: frontend dev
  tags:
  - javascript
  - debounce
  - implementation
  - performance
  explanation: "## In plain words\nDebouncing is like an elevator door: every time someone new arrives,\
    \ the door waits a bit longer, and it only closes after nobody has come for a while. A debounced function\
    \ ignores bursts of calls and runs once after the burst ends.\n\n## How it works\n- Keep a `timeoutId`\
    \ in a closure shared by all calls.\n- On each call:\n  - `clearTimeout(timeoutId)` to cancel the\
    \ pending run.\n  - Start a new timer for `wait` ms that calls `fn.apply(this, args)` with the latest\
    \ arguments.\n- Use a regular `function` for the wrapper so `this` is the caller's `this`; capture\
    \ `args` with rest parameters.\n- Optional features: `cancel()` to drop a pending call, `flush()`\
    \ to run it now, and a leading-edge option that runs on the first call of a burst.\n- Complexity:\
    \ O(1) per call; one timer at a time.\n\n## Example\n```js\nfunction debounce(fn, wait) {\n  let timeoutId;\n\
    \  function debounced(...args) {\n    clearTimeout(timeoutId);\n    timeoutId = setTimeout(() => fn.apply(this,\
    \ args), wait);\n  }\n  debounced.cancel = () => clearTimeout(timeoutId);\n  return debounced;\n}\n\
    \nconst log = debounce((q) => console.log(\"search\", q), 300);\nlog(\"r\"); log(\"re\"); log(\"rea\"\
    ); // after 300ms: \"search rea\"\n```\n\n## Common mistakes\n- Creating the debounced function inside\
    \ a React render, so each render gets a new timer and nothing is debounced (use `useMemo` or `useRef`).\n\
    - Losing `this` by using an arrow function for the wrapper.\n- Confusing debounce (wait for quiet)\
    \ with throttle (at most once per interval).\n- Not cancelling on unmount, so the call fires after\
    \ the component is gone.\n\n## In the interview\nExplain the behavior with a timeline, write the code,\
    \ then add `cancel` and a leading option if asked. Compare with throttle and give use cases for each.\
    \ Follow-ups: use it correctly in React, return a promise from the debounced function, or test it\
    \ with fake timers.\n"
