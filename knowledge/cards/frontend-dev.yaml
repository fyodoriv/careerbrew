  question: What is the layout step in the browser rendering process?
  answer: Layout (also called reflow) computes the exact position and size of every box in the render
    tree, based on styles, the viewport, and content. It runs after style calculation and before paint,
    and changing geometry or reading layout values can force it to run again.
  topic: frontend dev
  tags:
  - browser
  - rendering
  - performance
  - reflow
  explanation: '## In plain words

    Once the browser knows what to draw and how it should look, it must work out where everything goes
    and how big it is. That measuring step is layout.


    ## How it works

    - Starts from the root with the viewport size and walks the tree: block boxes stack, inline content
    wraps into lines, flex and grid run their algorithms.

    - Output: geometry (x, y, width, height) for each box.

    - **Triggers**: changing `width`, `height`, `margin`, `font-size`, adding or removing nodes, changing
    text, resizing the window.

    - Layout is often scoped, but a change can ripple to parents and siblings.

    - **Forced synchronous layout**: reading `offsetHeight`, `getBoundingClientRect()` after a style write
    makes the browser lay out immediately. Doing write-read-write-read in a loop is "layout thrashing".


    ## Example

    ```js

    // thrashing: one layout per item

    items.forEach((el) => { el.style.width = box.offsetWidth + "px"; });

    // better: read once, then write

    const w = box.offsetWidth;

    items.forEach((el) => { el.style.width = w + "px"; });

    ```


    ## Common mistakes

    - Mixing up layout (geometry) and paint (pixels).

    - Animating `top`/`left`/`width` instead of `transform`.

    - Not realising reads can be as expensive as writes.


    ## In the interview

    Explain the pipeline position, triggers, and how to avoid thrashing (batch reads, then writes; `requestAnimationFrame`).
    Mention CSS `contain` and `content-visibility` to limit layout scope. Follow-up: how to spot it in
    the Performance panel (purple "Layout" blocks).

    '
