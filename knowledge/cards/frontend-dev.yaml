  question: How do you use the previous state value when calling a React state setter?
  answer: 'Pass an updater function instead of a value: `setCount(prev => prev + 1)`. React queues it
    and calls it with the latest pending state, so several updates in a row and updates from stale closures
    work correctly. The updater must be pure and return the next state.'
  topic: frontend dev
  tags:
  - react
  - hooks
  - usestate
  - state
  explanation: "## In plain words\nThe `count` variable in your component is a snapshot from the current\
    \ render. If you compute the next value from it, several quick updates can all start from the same\
    \ old snapshot. An updater function says \"whatever the value is when you apply this, add one\", so\
    \ React always uses the freshest value.\n\n## How it works\n- `setX(value)` replaces state with `value`.\n\
    - `setX(fn)` enqueues `fn`; during the next render React runs queued updaters in order, each receiving\
    \ the result of the previous one.\n- Use the updater when the next state depends on the previous one,\
    \ especially:\n  - multiple updates in one handler,\n  - updates in `setTimeout`, intervals, or async\
    \ callbacks where the closure may be stale,\n  - effects that should not list the state as a dependency.\n\
    - The updater must be pure: no side effects, no mutation; Strict Mode calls it twice to check.\n-\
    \ Naming convention: use the first letter or `prev` (`n => n + 1`).\n\n## Example\n```jsx\nfunction\
    \ Timer() {\n  const [seconds, setSeconds] = useState(0);\n  useEffect(() => {\n    const id = setInterval(()\
    \ => {\n      setSeconds((s) => s + 1); // always fresh, no dependency on `seconds`\n    }, 1000);\n\
    \    return () => clearInterval(id);\n  }, []);\n  return <p>{seconds}s</p>;\n}\n```\nWith `setSeconds(seconds\
    \ + 1)` and an empty dependency list, the timer would stick at 1.\n\n## Common mistakes\n- Using `setX(x\
    \ + 1)` several times and expecting several increments.\n- Putting side effects (API calls, logging)\
    \ inside the updater.\n- Mutating `prev` and returning it.\n- Thinking the updater runs immediately\
    \ and returns the new value to the caller.\n\n## In the interview\nExplain snapshot semantics, show\
    \ the interval example, and state the purity rule. Follow-ups: why React batches updates, how `useReducer`\
    \ generalizes updaters, and what happens to updaters in Strict Mode (run twice, result of one is used).\n"
