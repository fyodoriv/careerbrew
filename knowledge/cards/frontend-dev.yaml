  explanation: "## In plain words\nCSS Grid lets you draw a table-like structure for layout: you decide\
    \ the rows and columns first, then drop items into cells. Unlike flexbox, which handles one direction\
    \ at a time, grid controls rows and columns together, which makes page layouts and card galleries\
    \ simple.\n\n## How it works\n- **Container**: `display: grid` (or `inline-grid`).\n- **Tracks**:\
