  question: What is the CSS box model, and which properties are part of it?
  answer: 'Every element is a rectangular box made of four layers from inside out: content (width/height),
    padding, border, and margin. box-sizing decides whether width and height include padding and border.'
  topic: frontend dev
  tags:
  - css
  - box-model
  - layout
  explanation: '## In plain words

    Picture a framed photo on a wall: the photo is the content, the mat around it is padding, the frame
    is the border, and the empty wall space to the next frame is margin.


    ## How it works

    - **Content**: sized by `width`, `height`, `min-*`, `max-*`.

    - **Padding**: `padding`, `padding-top`…; inside the border, shows the element''s background.

    - **Border**: `border`, `border-width`, `border-style`, `border-color`; `border-radius` rounds it.

    - **Margin**: `margin`…; outside the border, transparent, can be negative.

    - `box-sizing: content-box` (default) adds padding and border to `width`; `border-box` includes them.

    - Vertical margins of adjacent blocks can **collapse** into the larger of the two; this does not happen
    in flex or grid containers.

    - `outline` and `box-shadow` are drawn outside but do not take up space.


    ## Example

    ```css

    .box { width: 200px; padding: 10px; border: 2px solid; margin: 20px; }

    ```

    With `content-box`: visible width = 200 + 2×10 + 2×2 = 224 px; it takes 264 px of horizontal space
    including margins. With `border-box`: visible width = 200 px.


    ## Common mistakes

    - Forgetting margin collapsing between paragraphs.

    - Thinking `outline` changes layout.

    - Mixing up padding (inside, has background) and margin (outside, transparent).


    ## In the interview

    Draw the four boxes and do the width maths for both `box-sizing` values. Mention DevTools'' box model
    panel. Follow-ups: margin collapse rules, inline elements ignoring vertical margins, and logical properties
    (`margin-inline`).

    '
