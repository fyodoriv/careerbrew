  question: How do you optimize the performance of a React application?
  answer: 'Measure first with the React DevTools Profiler and browser performance tools. Then reduce work:
    avoid unnecessary re-renders (keep state close to where it is used, split contexts, `memo`/`useMemo`/`useCallback`
    where measurements justify it), virtualize long lists, code-split heavy routes, defer non-urgent updates
    with `useTransition`, and cut bundle size.'
  topic: frontend dev
  tags:
  - react
  - performance
  - profiling
  - optimization
  explanation: "## In plain words\nReact is usually fast enough; slow apps typically do too much work:\
    \ rendering big trees too often, loading too much JavaScript, or blocking the main thread. Optimizing\
    \ means finding which of these is happening with a profiler and then fixing that specific cause.\n\
    \n## How it works\n- **Measure**: React Profiler (which components render and why), Chrome Performance\
    \ panel (long tasks), Lighthouse and Web Vitals for loading.\n- **Fewer renders**:\n  - Move state\
    \ down to the component that needs it; lift expensive children out via `children` props.\n  - Split\
    \ contexts or memoize context values so updates touch fewer consumers.\n  - `React.memo` for expensive\
    \ pure components, with stable props via `useMemo`/`useCallback`. React Compiler can do this automatically.\n\
    - **Cheaper renders**: avoid heavy computation in render (memoize), virtualize long lists (react-window),\
    \ keep keys stable.\n- **Responsiveness**: `useTransition` or `useDeferredValue` for non-urgent updates\
    \ like filtering a big list.\n- **Loading**: `React.lazy` and route splitting, tree-shaking, removing\
    \ large dependencies, server rendering or streaming, image optimization.\n- **Verify**: re-measure\
    \ after each change.\n\n## Example\n```jsx\nfunction SearchPage({ items }) {\n  const [query, setQuery]\
    \ = useState(\"\");\n  const deferredQuery = useDeferredValue(query);\n  const visible = useMemo(\n\
    \    () => items.filter((i) => i.name.includes(deferredQuery)),\n    [items, deferredQuery]\n  );\n\
    \  return (\n    <>\n      <input value={query} onChange={(e) => setQuery(e.target.value)} />\n  \
    \    <List rows={visible} />\n    </>\n  );\n}\nconst List = React.memo(function List({ rows }) {\
    \ /* render rows */ });\n```\n\n## Common mistakes\n- Wrapping everything in `memo` and `useCallback`\
    \ without measuring, adding complexity and memory.\n- Passing new object or function props that defeat\
    \ `memo`.\n- Ignoring bundle size and network, which often dominate.\n- Testing only in development\
    \ mode, which is much slower than production.\n\n## In the interview\nLead with \"measure, then fix\
    \ the biggest cause\". Group fixes into render count, render cost, responsiveness, and loading. Follow-ups:\
    \ how `memo` compares props, when `useCallback` is useless, what React Compiler changes, and a time\
    \ you found a real bottleneck (describe a generic, measurable story).\n"
