- id: kb-aa5d2b22505e
  question: What is reconciliation in React?
  answer: 'Reconciliation is how React compares the new element tree from a render with the previous one
    and decides the minimal changes. Its heuristics: elements of different types are replaced, elements
    of the same type are updated in place, and list children are matched by key.'
  topic: frontend dev
  tags:
  - react
  - reconciliation
  - rendering
  explanation: "## In plain words\nAfter every state change React has an old picture of the UI and a new\
    \ one. Reconciliation is the \"spot the difference\" step that finds what changed so React touches\
    \ only those parts of the DOM and keeps component state where it should.\n\n## How it works\n- A general\
    \ tree diff is O(n³); React uses O(n) heuristics:\n  1. **Different type** at the same position (`<div>`\
    \ → `<span>`, `CompA` → `CompB`): unmount the old subtree (losing state) and mount a new one.\n  2.\
    \ **Same type**: keep the DOM node or component instance, update changed props, and recurse into children.\n\
    \  3. **Lists**: children are matched by `key`; without keys, by index.\n- The work is done by the\
    \ Fiber reconciler, which can pause and resume rendering, enabling concurrent features like transitions.\n\
    - The result is a list of effects applied in the commit phase.\n\n## Example\n```jsx\n{isEditing ?\
    \ <input defaultValue={name} /> : <span>{name}</span>}\n```\nToggling swaps the element type, so the\
    \ input is recreated each time. And:\n```jsx\n<Profile key={userId} />\n```\nChanging `key` forces\
    \ React to treat it as a new component, resetting its state — a useful trick when switching users.\n\
    \n## Common mistakes\n- Defining a component inside another component's body: its type changes each\
    \ render, so it remounts and loses state.\n- Using array index as key in reorderable lists.\n- Saying\
    \ reconciliation is the same thing as the virtual DOM; it is the algorithm that compares virtual DOM\
    \ trees.\n\n## In the interview\nList the three heuristics and give the `key` reset trick. Mention\
    \ Fiber and concurrent rendering. Follow-ups: how `React.memo` skips reconciling a subtree, and why\
    \ state is tied to position in the tree.\n"
