- id: kb-3cc3fe81739b
  question: How do you auto-focus an input when a React component renders?
  answer: Attach a ref to the input and call `ref.current.focus()` in a `useEffect` with an empty dependency
    array, so it runs once after mount. For a simple case, the `autoFocus` prop also works. Use focus
    deliberately because moving focus affects screen-reader and keyboard users.
  topic: frontend dev
  tags:
  - react
  - refs
  - accessibility
  - forms
  explanation: "## In plain words\nFocusing is a DOM action, and React only gives you DOM nodes after\
    \ they are on the page. So you keep a ref to the input and focus it in an effect, which runs after\
    \ React has committed the DOM. It is like waiting until the furniture is delivered before putting\
    \ a cushion on the chair.\n\n## How it works\n- `const inputRef = useRef(null)` and `<input ref={inputRef}\
    \ />`.\n- `useEffect(() => { inputRef.current?.focus(); }, [])` runs once after the first commit.\n\
    - `autoFocus` on the element also works; React calls `focus()` on mount for it.\n- For focusing when\
    \ something opens later (a modal, an edit mode), run the effect when that flag changes, or use a callback\
    \ ref that focuses when the node appears.\n- `useLayoutEffect` can be used if focusing must happen\
    \ before paint to avoid flicker, but `useEffect` is usually fine.\n- Accessibility: auto-focus is\
    \ appropriate in dialogs and search pages, but avoid stealing focus on normal page loads.\n\n## Example\n\
    ```tsx\nimport { useEffect, useRef } from \"react\";\n\nfunction SearchBox() {\n  const inputRef =\
    \ useRef<HTMLInputElement>(null);\n  useEffect(() => {\n    inputRef.current?.focus();\n  }, []);\n\
    \  return <input ref={inputRef} type=\"search\" aria-label=\"Search\" />;\n}\n```\n\n## Common mistakes\n\
    - Calling `focus()` during render, when the node does not exist yet.\n- Forgetting the dependency\
    \ array, so focus is stolen on every render.\n- Not using optional chaining when the input may be\
    \ conditionally rendered.\n- Auto-focusing on page load and confusing screen-reader users.\n\n## In\
    \ the interview\nShow the ref plus effect pattern and mention `autoFocus` as the shortcut. Explain\
    \ why it must happen after commit. Follow-ups: focusing inside a modal and returning focus when it\
    \ closes (focus trap), and how `forwardRef` or a React 19 `ref` prop lets a parent focus a custom\
    \ input component.\n"
