  question: What are the rules of React hooks?
  answer: Call hooks only at the top level of a React function component or a custom hook, never inside
    conditions, loops, nested functions, or after an early return; and call them only from React functions,
    not from regular JavaScript. React identifies each hook's state by call order, so the order must be
    the same every render.
  topic: frontend dev
  tags:
  - react
  - hooks
  - rules
  - linting
  explanation: "## In plain words\nReact does not know your hooks by name. It keeps a list of hook slots\
    \ for each component and hands them out in order: first `useState` gets slot 1, the second gets slot\
    \ 2, and so on. If a hook is skipped in one render, every later hook gets the wrong slot and the wrong\
    \ state.\n\n## How it works\n- **Rule 1: top level only.**\n  - Not inside `if`, loops, `try`/`catch`,\
    \ callbacks, or after a conditional `return`.\n  - Put the condition inside the hook instead (for\
    \ example inside the effect).\n- **Rule 2: only from React functions.**\n  - Function components and\
    \ custom hooks (whose names start with `use`).\n  - Not from class components, event handlers, or\
    \ plain utility functions.\n- The `eslint-plugin-react-hooks` rules (`rules-of-hooks` and `exhaustive-deps`)\
    \ check these and the dependency arrays.\n- Exception: React 19's `use()` can be called conditionally,\
    \ because it is not stored in the ordered list the same way.\n- Custom hooks let you share stateful\
    \ logic; each call gets its own state.\n\n## Example\n```jsx\n// Wrong: the hook count changes between\
    \ renders\nfunction Profile({ id }) {\n  if (!id) return null;\n  const [user, setUser] = useState(null);\
    \ // after an early return\n}\n\n// Right\nfunction Profile({ id }) {\n  const [user, setUser] = useState(null);\n\
    \  useEffect(() => {\n    if (!id) return;\n    fetchUser(id).then(setUser);\n  }, [id]);\n  if (!id)\
    \ return null;\n  return <p>{user?.name}</p>;\n}\n```\n\n## Common mistakes\n- Early returns before\
    \ hooks.\n- Calling a hook in a loop over a dynamic list (render a child component per item instead).\n\
    - Naming a helper `useSomething` that calls no hooks, or calling hooks from a helper not named `use...`.\n\
    - Disabling the lint rule.\n\n## In the interview\nState both rules and explain the call-order reason;\
    \ that explanation is what interviewers listen for. Mention the lint plugin. Follow-ups: how to conditionally\
    \ fetch, how custom hooks share logic but not state, and what `use()` changes in React 19.\n"
