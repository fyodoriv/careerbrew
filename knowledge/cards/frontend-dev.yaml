- id: kb-86a8befb5a3a
  question: What does JavaScript Array.prototype.pop() do?
  answer: '`pop()` removes the last element of an array, returns it, and decreases `length` by one. It
    mutates the original array, returns `undefined` for an empty array, and runs in O(1) time.'
  topic: frontend dev
  tags:
  - javascript
  - arrays
  - mutation
  explanation: "## In plain words\nAn array can be used like a stack of plates. `push` puts a plate on\
    \ top and `pop` takes the top plate off and hands it to you. Because it works at the end, nothing\
    \ else needs to move.\n\n## How it works\n- Reads the element at `length - 1`, deletes it, sets `length`\
    \ to `length - 1`, and returns the element.\n- Empty array: returns `undefined` and leaves `length`\
    \ at 0.\n- Mutates in place; any other reference to the same array sees the change.\n- Time O(1),\
    \ space O(1).\n- Related methods:\n  - `push(x)`: add to the end, O(1) amortized, returns the new\
    \ length.\n  - `shift()` / `unshift(x)`: remove or add at the start; O(n) because indexes shift.\n\
    \  - `at(-1)`: read the last item without removing it.\n  - `slice(0, -1)` or `toSpliced(-1, 1)`:\
    \ a copy without the last item, for immutable code.\n- `pop` together with `push` gives a stack (last\
    \ in, first out).\n\n## Example\n```js\nconst stack = [1, 2, 3];\nconst top = stack.pop();\nconsole.log(top);\
    \          // 3\nconsole.log(stack);        // [1, 2]\nconsole.log([].pop());     // undefined\n\n\
    // Immutable alternative for React state\nconst items = [\"a\", \"b\", \"c\"];\nconst withoutLast\
    \ = items.slice(0, -1); // [\"a\", \"b\"], items unchanged\n```\n\n## Common mistakes\n- Expecting\
    \ it to return the new array or the new length.\n- Using it on React or Redux state, mutating it.\n\
    - Confusing `pop` (end) with `shift` (start) and their very different costs.\n- Not handling the `undefined`\
    \ result when the array may be empty (an element could also be `undefined`, so check `length` when\
    \ that matters).\n\n## In the interview\nGive the behavior, return value, mutation, and complexity\
    \ in one breath. Mention `shift` being O(n) and the immutable alternatives. Follow-ups: implement\
    \ a stack or a queue efficiently in JavaScript, or the valid-parentheses problem, which uses `push`\
    \ and `pop`.\n"
