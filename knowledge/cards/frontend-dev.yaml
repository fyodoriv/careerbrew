  question: How does rendering work in React?
  answer: Rendering happens in two phases. In the render phase React calls your components to get a new
    element tree and compares it with the previous one (reconciliation). In the commit phase it applies
    the minimal DOM changes and then runs effects. A render is triggered by the initial mount or a state
    update.
  topic: frontend dev
  tags:
  - react
  - rendering
  - reconciliation
  - virtual-dom
  explanation: "## In plain words\nIn React, \"render\" means \"call the component to find out what the\
    \ UI should look like\", not \"paint the screen\". React then works out the difference from last time\
    \ and changes only what is needed in the real DOM. Think of an architect drawing a new plan, comparing\
    \ it with the old one, and sending builders to change only the differing rooms.\n\n## How it works\n\
    1. **Trigger**: the first `root.render()`, or a state update (`setState`, `dispatch`, context change).\
    \ A parent re-render also re-renders its children by default.\n2. **Render phase**: React calls components\
    \ top-down. JSX compiles to `React.createElement` / `jsx()` calls that return plain objects (elements).\
    \ This phase must be pure and can be paused or restarted (concurrent rendering).\n3. **Reconciliation**:\
    \ the new tree is diffed against the previous one using type and key heuristics.\n4. **Commit phase**:\
    \ React applies DOM insertions, updates, and removals, attaches refs, then runs `useLayoutEffect`\
    \ synchronously, always before the browser paints. `useEffect` usually runs after paint, but since\
    \ React 18, when an update comes from a discrete input event such as a click, React flushes the effects\
    \ before the browser paints.\n5. **Browser paint**: the browser lays out and paints the changed pixels.\n\
    - Several updates in one event (and, since React 18, in timeouts and promises) are batched into one\
    \ render.\n\n## Example\n```jsx\nfunction Counter() {\n  const [n, setN] = useState(0);\n  console.log(\"\
    render\", n);           // render phase\n  useEffect(() => console.log(\"committed\", n)); // after\
    \ commit\n  return <button onClick={() => setN(n + 1)}>{n}</button>;\n}\n```\nClicking logs `render\
    \ 1`, then React updates just the button's text node, then logs `committed 1`.\n\n## Common mistakes\n\
    - Equating a re-render with a DOM update; many renders change no DOM at all.\n- Putting side effects\
    \ in the component body instead of effects or handlers.\n- Believing a component re-renders only when\
    \ its props change (a parent render re-renders children unless memoized).\n- Calling the virtual DOM\
    \ a copy of the real DOM rather than a tree of element objects.\n\n## In the interview\nWalk through\
    \ trigger, render, commit, paint. Mention batching and that Strict Mode double-calls render to catch\
    \ impurity. Follow-ups: how to avoid unnecessary renders (`memo`, moving state down), the difference\
    \ between `useEffect` and `useLayoutEffect`, and what concurrent features like `useTransition` change.\n"
