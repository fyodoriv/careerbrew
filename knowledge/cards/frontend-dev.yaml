- id: kb-2b7413c2b5c1
  question: What does rel="noreferrer" do on a link?
  answer: rel="noreferrer" tells the browser not to send the Referer header when following the link, so
    the destination does not learn which page the user came from. It also implies noopener, so window.opener
    is null.
  topic: frontend dev
  tags:
  - html
  - privacy
  - security
  - links
  explanation: '## In plain words

    Normally when you click a link, the browser tells the next site where you came from (the Referer header).
    `noreferrer` says "do not tell them", and as a bonus it also blocks the new page from controlling
    yours.


    ## How it works

    - Removes the `Referer` request header for that navigation and makes `document.referrer` empty on
    the destination.

    - Implies `noopener`.

    - Analytics on the destination see the visit as direct traffic.

    - Site-wide control is done with the `Referrer-Policy` header or `<meta name="referrer">`; the default
    in modern browsers is `strict-origin-when-cross-origin` (send only the origin to other sites, nothing
    on HTTPS→HTTP).

    - Per link, the `referrerpolicy` attribute offers finer choices.


    ## Example

    ```html

    <a href="https://partner.example" target="_blank" rel="noreferrer">Partner</a>

    <!-- or keep the origin but not the full path -->

    <a href="https://partner.example" referrerpolicy="origin">Partner</a>

    ```

    A private dashboard URL like `/admin/report?id=42` is not leaked to the partner.


    ## Common mistakes

    - Confusing it with `nofollow`, which is an SEO hint about link endorsement.

    - Adding it to affiliate links and breaking attribution.

    - Assuming it is needed for security when `noopener` alone would do and keeping the referrer helps
    partners.


    ## In the interview

    Explain the privacy use case (do not leak URLs with tokens or IDs) and that it implies `noopener`.
    Mention `Referrer-Policy` for site-wide control. Follow-up: the difference between `noopener`, `noreferrer`,
    and `nofollow`.

    '
