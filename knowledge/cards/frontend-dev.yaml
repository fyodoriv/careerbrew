  question: What is the useTransition hook?
  answer: useTransition lets you mark a state update as non-urgent. It returns [isPending, startTransition];
    updates inside startTransition can be interrupted by urgent ones such as typing, and isPending lets
    you show that background work is in progress.
  topic: frontend dev
  tags:
  - react
  - hooks
  - concurrency
  - performance
  explanation: "## In plain words\nNot all updates are equally urgent. A keystroke must show instantly;\
    \ switching to a heavy tab can wait a moment. `useTransition` labels the second kind so React keeps\
    \ the app responsive.\n\n## How it works\n- `const [isPending, startTransition] = useTransition()`.\n\
    - `startTransition(() => setTab(\"posts\"))`: React renders this update with low priority and can\
    \ abandon it if something urgent happens.\n- While it is pending, the old UI stays on screen (no Suspense\
    \ fallback flicker for already shown content), and `isPending` is true.\n- In React 19, the callback\
    \ can be async; state updates after an `await` need their own `startTransition` wrap.\n- You cannot\
    \ use it for controlled input values; those must update synchronously.\n- `startTransition` is also\
    \ available as a standalone import when you do not need `isPending`.\n\n## Example\n```jsx\nfunction\
    \ Tabs() {\n  const [tab, setTab] = React.useState(\"about\");\n  const [isPending, startTransition]\
    \ = React.useTransition();\n  return (\n    <>\n      {[\"about\", \"posts\"].map((t) => (\n     \
    \   <button key={t} onClick={() => startTransition(() => setTab(t))}>{t}</button>\n      ))}\n   \
    \   {isPending && <span>Loading…</span>}\n      {tab === \"posts\" ? <SlowPosts /> : <About />}\n\
    \    </>\n  );\n}\n```\n\n## Common mistakes\n- Wrapping a text input's state in a transition, which\
    \ makes typing lag.\n- Expecting it to make slow code faster; it only reschedules it.\n- Confusing\
    \ it with `useDeferredValue`.\n\n## In the interview\nExplain urgent vs transition updates, show `isPending`,\
    \ and compare with `useDeferredValue`. Follow-ups: how it integrates with Suspense and routers, and\
    \ Actions in React 19 being built on transitions.\n"
