- id: kb-5e5ba402fab7
  question: What are the Core Web Vitals metrics?
  answer: 'Core Web Vitals are Google''s three user-centred page metrics: Largest Contentful Paint (loading,
    good under 2.5 s), Interaction to Next Paint (responsiveness, good under 200 ms), and Cumulative Layout
    Shift (visual stability, good under 0.1), measured at the 75th percentile of real visits.'
  topic: frontend dev
  tags:
  - performance
  - web-vitals
  - seo
  explanation: '## In plain words

    Core Web Vitals answer three questions a user feels: did the main content show up fast, does the page
    react quickly when I tap, and does stuff jump around while I read? Google uses them as a search ranking
    signal.


    ## How it works

    - **LCP, Largest Contentful Paint**: time until the largest image or text block in the viewport is
    painted. Good ≤ 2.5 s.

    - **INP, Interaction to Next Paint**: for clicks, taps and key presses, the delay until the next frame
    is painted; the page''s score is roughly its worst interaction. Good ≤ 200 ms. It replaced First Input
    Delay (FID) in 2024.

    - **CLS, Cumulative Layout Shift**: a score for unexpected movement of visible content. Good ≤ 0.1.

    - Each is judged at the 75th percentile of real user data (field data, for example the Chrome UX Report).
    Lab tools like Lighthouse estimate them.


    ## Example

    Fixes by metric:

    - LCP 4 s → preload the hero image, serve it in AVIF/WebP at the right size, cut render-blocking CSS.

    - INP 400 ms → split a long click handler, move heavy work to a Web Worker, yield with `setTimeout`
    or `scheduler.yield()`.

    - CLS 0.25 → set `width`/`height` on images, reserve space for ads, use `font-display: optional` or
    matched fallback fonts.


    ## Common mistakes

    - Still naming FID as a Core Web Vital.

    - Quoting Lighthouse scores as if they were field data.

    - Confusing LCP with First Contentful Paint (FCP).


    ## In the interview

    Name all three, their thresholds, and one fix each. Mention the `web-vitals` library or `PerformanceObserver`
    to collect field data. Follow-ups: how to debug INP (Long Animation Frames API, Performance panel),
    and how SSR or image CDNs help LCP.

    '
