- id: kb-3f1be6ccecf2
  question: Can you dispatch an action inside a reducer?
  answer: 'No. A reducer must be a pure function of state and action: it only computes and returns the
    next state. Dispatching is a side effect, so it belongs in event handlers, effects, or middleware
    such as thunks, sagas, or listeners.'
  topic: frontend dev
  tags:
  - redux
  - reducers
  - state-management
  - react
  explanation: "## In plain words\nA reducer is like a calculator: you give it the current state and an\
    \ action, and it returns the new state. It must not do anything else, such as calling an API, starting\
    \ a timer, or dispatching another action. Redux even throws an error (\"Reducers may not dispatch\
    \ actions\") if you try during a reducer call.\n\n## How it works\n- Pure means: same inputs give\
    \ the same output, no mutation of inputs, no side effects.\n- Purity enables time-travel debugging,\
    \ replay, predictable tests, and React's ability to call `useReducer` reducers twice in Strict Mode.\n\
    - If one action should cause more state changes, handle it in more than one reducer (several slices\
    \ can respond to the same action).\n- If it should cause a follow-up async action, use middleware:\n\
    \  - Thunks: dispatch, await, dispatch again.\n  - Listener middleware or sagas: react to an action\
    \ after the reducer runs.\n- In React `useReducer`, call `dispatch` from event handlers or `useEffect`,\
    \ never inside the reducer.\n\n## Example\n```js\n// Wrong: side effect inside the reducer\nfunction\
    \ reducer(state, action) {\n  if (action.type === \"saved\") store.dispatch({ type: \"toast\" });\n\
    \  return state;\n}\n\n// Right: a thunk coordinates the steps\nconst save = (item) => async (dispatch)\
    \ => {\n  await api.save(item);\n  dispatch({ type: \"saved\", item });\n  dispatch({ type: \"toast\"\
    , text: \"Saved\" });\n};\n```\n\n## Common mistakes\n- Calling APIs or `Math.random()` / `Date.now()`\
    \ inside reducers.\n- Mutating the incoming state object instead of returning a new one (Redux Toolkit's\
    \ Immer hides this, plain Redux does not).\n- Chaining many dispatches when one action handled by\
    \ several reducers would be simpler.\n\n## In the interview\nAnswer \"no, reducers must be pure\"\
    \ and give the reason (predictability, devtools, replay). Then show where the logic should go: middleware,\
    \ thunks, listeners, or effects. Expect a follow-up on how you would derive data instead of storing\
    \ it, or on how Redux Toolkit's `createSlice` and `extraReducers` let several slices respond to one\
    \ action.\n"
