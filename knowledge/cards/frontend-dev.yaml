    \ keeps the same function until its inputs change.\n\n## How it works\n- `const fn = useCallback(callback,\
    \ [deps])`.\n- React stores the function and returns the stored one while the deps are equal (`Object.is`).\n\
    - Equivalent to `useMemo(() => callback, deps)`.\n- Useful when:\n  - passing callbacks to `React.memo`\
