  question: What are micro-frontends?
  answer: Micro-frontends split one web app's UI into independently built and deployed pieces, each owned
    by a team, and compose them at build time, on the server, or in the browser. They trade team autonomy
    for extra complexity, duplicated dependencies, and consistency risks.
  topic: frontend dev
  tags:
  - architecture
  - micro-frontends
  - frontend
  explanation: "## In plain words\nMicro-frontends apply the microservices idea to the browser. Instead\
    \ of one big front-end codebase, the checkout team ships the checkout UI, the search team ships search,\
    \ and a shell app stitches them together on one page.\n\n## How it works\n- **Split** by business\
    \ domain (search, cart, account), not by technical layer.\n- **Compose** in one of several ways:\n\
    \  - build time: each part is an npm package (simple, but deploys are coupled);\n  - server side:\
    \ edge or server includes assemble HTML fragments;\n  - run time: a shell loads remote bundles, for\
    \ example Webpack Module Federation, or uses Web Components / iframes.\n- **Share** a design system\
    \ and a few singletons (React, router) to avoid duplicate downloads.\n- **Communicate** through URLs,\
    \ custom events, or a small shared contract, not shared global state.\n\n## Example\nA shell app owns\
    \ the header and routes. `/search/*` loads `search@https://cdn.example.com/remoteEntry.js` via Module\
    \ Federation; `/cart` loads the cart remote. The cart team can deploy a fix at noon without the search\
    \ team rebuilding.\n\n## Common mistakes\n- Adopting them for a small team; the overhead only pays\
    \ off with many teams.\n- Shipping three copies of React and two versions of the design system.\n\
    - Tight coupling through shared global stores, which removes the independence you paid for.\n- Ignoring\
    \ consistent UX, performance budgets, and end-to-end testing across parts.\n\n## In the interview\n\
    Frame it as an organisational tool: it solves deployment and ownership bottlenecks, not technical\
    \ ones. Trade-offs to mention: bundle size, version skew, cross-app routing, shared auth, and observability.\
    \ Expect \"how would you share state?\" and \"when would you not do this?\".\n"
