  question: What is IndexedDB?
  answer: IndexedDB is the browser's built-in transactional database for storing large amounts of structured
    data, including files and blobs, as key-value object stores with indexes. It is asynchronous, same-origin,
    and available in pages, workers, and service workers.
  topic: frontend dev
  tags:
  - browser
  - storage
  - indexeddb
  - offline
  explanation: "## In plain words\n`localStorage` is a tiny notebook of strings. IndexedDB is a real filing\
    \ cabinet in the browser: it stores objects, blobs and lots of them, lets you search by indexes, and\
    \ does not block the page while it works.\n\n## How it works\n- **Database** with a version; schema\
    \ changes happen in `onupgradeneeded`.\n- **Object stores** (like tables) hold values by key; keys\
    \ can be in-line (`keyPath`) or auto-incremented.\n- **Indexes** let you query by other fields.\n\
    - **Transactions** (`readonly` / `readwrite`) group operations; they auto-commit when no requests\
    \ are pending.\n- The raw API is event-based; small wrappers like `idb` add promises.\n- Quota is\
    \ a share of disk; data can be evicted unless `navigator.storage.persist()` is granted.\n\n## Example\n\
    ```js\nimport { openDB } from \"idb\";\nconst db = await openDB(\"notes\", 1, {\n  upgrade(db) {\n\
    \    const s = db.createObjectStore(\"notes\", { keyPath: \"id\" });\n    s.createIndex(\"byDate\"\
    , \"updated\");\n  },\n});\nawait db.put(\"notes\", { id: 1, text: \"Hello\", updated: Date.now()\
    \ });\nconst recent = await db.getAllFromIndex(\"notes\", \"byDate\");\n```\n\n## Common mistakes\n\
    - Awaiting unrelated async work inside a transaction, which lets it auto-commit and then fail.\n-\
    \ Forgetting version upgrades when adding stores.\n- Storing sensitive data unencrypted and assuming\
    \ it is private from browser extensions or other users of the device.\n\n## In the interview\nCompare\
    \ with localStorage (sync, strings, about 5 MB) and the Cache API (Request/Response pairs). Use cases:\
    \ offline-first apps, queued writes, large datasets. Follow-ups: syncing with a server and handling\
    \ multiple tabs (`versionchange` events).\n"
