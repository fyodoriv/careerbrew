  question: What are refs in React and why are they useful?
  answer: A ref is a mutable box (`{ current }`) that survives re-renders without causing one. Refs give
    you direct access to DOM nodes (focus, measuring, third-party widgets) and let you keep values like
    timer ids or the previous value that should not trigger a render.
  topic: frontend dev
  tags:
  - react
  - refs
  - hooks
  - dom
  explanation: "## In plain words\nReact normally owns the DOM: you describe UI and React updates it.\
    \ Sometimes you need to reach past that, for example to focus an input or hand a DOM node to a charting\
    \ library. A ref is a small object whose `current` property you can read and write freely, and changing\
    \ it never re-renders the component. Think of it as a pocket the component carries between renders.\n\
    \n## How it works\n- `useRef(initial)` returns the same object on every render of that component instance.\n\
    - Attach it to an element with `ref={myRef}`; after commit, `myRef.current` is the DOM node, and it\
    \ is set back to `null` when the node is removed.\n- Writing `myRef.current = x` does not schedule\
    \ a render, so do not use refs for values shown on screen.\n- Typical uses: focus and scroll, measuring\
    \ size, integrating non-React libraries, storing interval ids, uncontrolled form inputs, and remembering\
    \ the previous value.\n- Callback refs (`ref={node => ...}`) run when the node is attached and detached.\
    \ In React 19 a callback ref can return a cleanup function, which runs when the node is removed.\n\
    - In React 19 function components can receive `ref` as a normal prop; older code uses `forwardRef`.\n\
    \n## Example\n```jsx\nimport { useRef } from \"react\";\n\nfunction Search() {\n  const inputRef =\
    \ useRef(null);\n  return (\n    <>\n      <input ref={inputRef} />\n      <button onClick={() =>\
    \ inputRef.current.focus()}>Focus</button>\n    </>\n  );\n}\n```\n\n## Common mistakes\n- Reading\
    \ or writing `ref.current` during render, which makes output unpredictable.\n- Storing UI data in\
    \ a ref and wondering why the screen does not update.\n- Expecting `ref.current` to be set before\
    \ the first commit (it is `null` during the first render).\n- Reaching for refs to change DOM that\
    \ React also manages, causing conflicts.\n\n## In the interview\nSay \"a ref is an escape hatch: mutable,\
    \ persistent, and not reactive\". Contrast it with state (triggers a render) and with a module-level\
    \ variable (shared by all instances). Expect follow-ups on `forwardRef`, `useImperativeHandle`, callback\
