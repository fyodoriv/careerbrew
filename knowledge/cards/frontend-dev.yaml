  question: In vanilla JavaScript, what are the pros and cons of handling all events at the body level
    (event delegation)?
  answer: Putting one listener on a high ancestor and checking event.target saves memory, works for elements
    added later, and centralises logic. The costs are events that do not bubble, stopPropagation calls
    that block it, more work per event, and harder-to-read code.
  topic: frontend dev
  tags:
  - javascript
  - dom
  - events
  - delegation
  explanation: "## In plain words\nInstead of giving every button its own doorbell, you put one doorbell\
    \ at the front door and ask \"who rang?\" each time. Because most DOM events bubble up from the clicked\
    \ element to its ancestors, one listener high up can handle events for many children.\n\n## How it\
    \ works\n- An event fires on the target, then bubbles through each ancestor up to `document`.\n- A\
    \ single listener on `document.body` reads `event.target` and uses `closest(selector)` to find the\
    \ element it cares about.\n\n**Pros**\n\n- One listener instead of thousands: less memory and faster\
    \ setup.\n- Works for elements added later without re-binding.\n- One place for logic and teardown.\n\
    \n**Cons**\n\n- Some events do not bubble (`focus`, `blur`, `mouseenter`); use `focusin`/`focusout`\
    \ or the capture phase.\n- Any code that calls `stopPropagation()` hides events from you.\n- Every\
    \ click on the page runs your handler, so keep it cheap.\n- Handlers grow into a big switch; behaviour\
    \ is far from the markup.\n\n## Example\n```js\ndocument.body.addEventListener(\"click\", (e) => {\n\
    \  const btn = e.target.closest(\"button[data-action]\");\n  if (!btn) return;\n  if (btn.dataset.action\
    \ === \"delete\") btn.closest(\"li\").remove();\n});\n```\nThis handles delete buttons in a list,\
    \ including rows added after the listener.\n\n## Common mistakes\n- Comparing `e.target` directly\
    \ when the click lands on an icon inside the button; use `closest`.\n- Forgetting non-bubbling events.\n\
    - Delegating everything to `body` when a nearer container would scope it better.\n\n## In the interview\n\
    Mention that React historically used delegation at the root for the same reasons. Trade-off: delegate\
    \ to the nearest stable container, not always `body`. Follow-ups: capture vs bubble phase, `stopPropagation`\
    \ vs `stopImmediatePropagation`, and passive listeners for scroll and touch.\n"
