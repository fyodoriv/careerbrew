- id: kb-f2f9236c0c74
  question: How can React enforce prop types or require certain props?
  answer: 'Today you type props with TypeScript, which checks them at compile time and marks required
    versus optional (`name?: string`). The older runtime option is the `prop-types` package with `.isRequired`;
    React 19 removed `propTypes` checking entirely (it is silently ignored), so TypeScript is the standard.'
  topic: frontend dev
  tags:
  - react
  - typescript
  - props
  - prop-types
  explanation: "## In plain words\nProps are a component's inputs, so it helps to say what shape they\
    \ must have. TypeScript does this before the code runs: the editor and build fail if a required prop\
    \ is missing or has the wrong type. `prop-types` did a similar check at runtime and printed warnings\
    \ in the console during development.\n\n## How it works\n- **TypeScript**:\n  - Declare a `Props`\
    \ type or interface; a property without `?` is required.\n  - Use unions for allowed values (`size:\
    \ \"sm\" | \"md\"`), `React.ReactNode` for children, and function types for callbacks.\n  - Default\
    \ values come from destructuring defaults.\n- **prop-types** (legacy):\n  - `MyComp.propTypes = {\
    \ name: PropTypes.string.isRequired }`.\n  - Checks only in development, only at runtime, and only\
    \ warns.\n  - React 19 removed `propTypes` checking for all components (the property is silently ignored)\
    \ and removed `defaultProps` for function components.\n- **Runtime data from outside** (API responses,\
    \ URL params) is not checked by TypeScript; validate it with a schema library such as Zod at the boundary.\n\
    \n## Example\n```tsx\ntype ButtonProps = {\n  label: string;                 // required\n  variant?:\
    \ \"primary\" | \"ghost\"; // optional, limited values\n  onClick: () => void;\n};\n\nfunction Button({\
    \ label, variant = \"primary\", onClick }: ButtonProps) {\n  return <button className={variant} onClick={onClick}>{label}</button>;\n\
    }\n\n<Button label=\"Save\" onClick={save} />; // ok\n// <Button onClick={save} />           // compile\
    \ error: label is missing\n```\n\n## Common mistakes\n- Thinking TypeScript validates data at runtime.\n\
    - Typing everything as `any` or using broad `object` types.\n- Still relying on `defaultProps` for\
    \ function components.\n- Making props optional just to silence errors instead of fixing callers.\n\
    \n## In the interview\nSay \"TypeScript at compile time, schema validation at runtime boundaries,\
    \ `prop-types` only in legacy code\". Mention the React 19 change. Follow-ups: typing `children`,\
    \ generic components, discriminated unions for mutually exclusive props, and `ComponentProps<typeof\
    \ X>` for reuse.\n"
