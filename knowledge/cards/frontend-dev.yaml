  question: What is the back/forward cache (bfcache)?
  answer: 'bfcache is a browser optimisation that keeps a complete snapshot of a page, including its JavaScript
    heap, in memory when you navigate away, so going back or forward restores it instantly. Some things,
    like unload handlers or Cache-Control: no-store, can make a page ineligible.'
  topic: frontend dev
  tags:
  - browser
  - performance
  - navigation
  explanation: "## In plain words\nWithout bfcache, pressing Back reloads the previous page from scratch.\
    \ With bfcache, the browser pauses the page like a game on standby and resumes it in an instant, with\
    \ scroll position and JS state intact.\n\n## How it works\n- When leaving, the page fires `pagehide`\
    \ with `event.persisted === true` if it is being cached, then it is frozen: timers and JS stop.\n\
    - On return, `pageshow` fires with `event.persisted === true`; `DOMContentLoaded` and `load` do not\
    \ fire again.\n- Common blockers: `unload` event listeners, open IndexedDB transactions or WebSocket\
    \ connections in some browsers, `Cache-Control: no-store` (historically), pages opened with `window.opener`\
    \ references.\n- Chrome DevTools > Application > Back/forward cache tests a page and lists blockers.\n\
    \n## Example\n```js\nwindow.addEventListener(\"pageshow\", (e) => {\n  if (e.persisted) {\n    //\
    \ restored from bfcache: refresh things that may be stale\n    refreshCartCount();\n  }\n});\nwindow.addEventListener(\"\
    pagehide\", () => socket.close());\n```\n\n## Common mistakes\n- Using `unload` for cleanup; use `pagehide`\
    \ or `visibilitychange`.\n- Analytics counting page views only on `load`, missing restores.\n- Showing\
    \ stale data (cart, login state) after a restore without refreshing.\n\n## In the interview\nMention\
    \ it is one of the biggest free speed-ups for back navigation and helps Core Web Vitals. Follow-ups:\
    \ how to test eligibility, `notRestoredReasons` API, and differences from the HTTP cache.\n"
