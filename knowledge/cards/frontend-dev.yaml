  question: How do you build a React component that responds to browser events such as resize or keydown?
  answer: Subscribe to the browser event in `useEffect` with `window.addEventListener`, store what you
    need in state, and remove the listener in the effect's cleanup. Wrapping this in a custom hook (for
    example `useWindowSize`) keeps components clean; `useSyncExternalStore` is the most robust option
    for external sources.
  topic: frontend dev
  tags:
  - react
  - hooks
  - events
  - useeffect
  explanation: "## In plain words\nJSX props like `onClick` only cover events on elements React renders.\
    \ Events on `window` or `document`, such as resizing, scrolling, online/offline, or global shortcuts,\
    \ need a manual subscription. The effect is where you connect to the outside world, and its cleanup\
    \ is where you disconnect.\n\n## How it works\n- In `useEffect`, define a handler and call `window.addEventListener(type,\
    \ handler)`.\n- Return a cleanup that calls `removeEventListener` with the same handler, so you do\
    \ not leak listeners or update unmounted components.\n- Keep the dependency array honest; if the handler\
    \ uses props, either include them or read the latest value from a ref.\n- Throttle high-frequency\
    \ events (scroll, resize, mousemove) or batch them with `requestAnimationFrame`.\n- Mark scroll and\
    \ touch listeners `passive: true` when you do not call `preventDefault`.\n- Extract a custom hook\
    \ for reuse and testing.\n- For values that can be read synchronously (window width, online status),\
    \ `useSyncExternalStore(subscribe, getSnapshot)` avoids tearing in concurrent rendering.\n\n## Example\n\
    ```jsx\nfunction useWindowWidth() {\n  const [width, setWidth] = useState(() => window.innerWidth);\n\
    \  useEffect(() => {\n    const onResize = () => setWidth(window.innerWidth);\n    window.addEventListener(\"\
    resize\", onResize);\n    return () => window.removeEventListener(\"resize\", onResize);\n  }, []);\n\
    \  return width;\n}\n\nfunction Layout() {\n  const width = useWindowWidth();\n  return <p>{width\
    \ < 600 ? \"Mobile\" : \"Desktop\"} layout</p>;\n}\n```\n\n## Common mistakes\n- Forgetting the cleanup,\
    \ so listeners pile up on every mount.\n- Passing a new inline function to `removeEventListener`.\n\
    - Reading `window` during server-side rendering.\n- Updating state on every scroll pixel without throttling.\n\
    \n## In the interview\nDescribe subscribe, update state, clean up, then wrap in a hook. Mention throttling\
    \ and SSR safety. Follow-ups: stale closures in handlers, using `useSyncExternalStore`, and how you\
    \ would test the hook (fire a `resize` event in a test environment).\n"
