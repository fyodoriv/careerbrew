  answer: '`Promise.allSettled(iterable)` waits until every input has either fulfilled or rejected and
    never rejects itself. It fulfils with an array, in input order, of `{ status: ''fulfilled'', value
    }` or `{ status: ''rejected'', reason }` objects.'
