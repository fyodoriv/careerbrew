  question: What is the difference between script, script async, and script defer?
  answer: A plain `<script>` stops HTML parsing while it downloads and runs. `async` downloads in parallel
    and runs as soon as it arrives, in any order. `defer` downloads in parallel and runs in document order
    after parsing finishes, just before `DOMContentLoaded`.
  topic: frontend dev
  tags:
  - html
  - performance
  - javascript
  - loading
  explanation: "## In plain words\nThe browser reads HTML from top to bottom. When it meets a normal script,\
    \ it pauses reading, fetches the script, runs it, and only then continues. `async` and `defer` tell\
    \ the browser it can keep reading while the file downloads; they differ in when the script actually\
    \ runs.\n\n## How it works\n- `<script src>`: blocks parsing during download and execution. Runs in\
    \ order. Needed only when later markup depends on it right away (rare today).\n- `<script async src>`:\
    \ downloads in parallel, then pauses parsing briefly to run as soon as it is ready. Order between\
    \ async scripts is not guaranteed. Good for independent scripts such as analytics.\n- `<script defer\
    \ src>`: downloads in parallel, runs after the document is parsed, in the order the tags appear, before\
    \ `DOMContentLoaded`. Good for app code that needs the DOM.\n- `type=\"module\"` scripts are deferred\
    \ by default; adding `async` makes them run as soon as ready.\n- `async` and `defer` only affect external\
    \ scripts (with `src`), not inline classic scripts.\n\n## Example\n```html\n<head>\n  <script defer\
    \ src=\"vendor.js\"></script>\n  <script defer src=\"app.js\"></script>   <!-- runs after vendor.js\
    \ -->\n  <script async src=\"analytics.js\"></script> <!-- runs whenever ready -->\n</head>\n```\n\
