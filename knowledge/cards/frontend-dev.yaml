- id: kb-598914b91106
  question: What happens to running async JavaScript work when the browser tab is closed?
  answer: 'When a page is unloaded, its JavaScript stops: pending promises, timers, and in-flight fetches
    are dropped and never resolve. To send last data reliably, use navigator.sendBeacon or fetch with
    keepalive, and for longer work use a service worker or background sync.'
  topic: frontend dev
  tags:
  - javascript
  - browser
  - lifecycle
  explanation: "## In plain words\nAsync code does not run \"somewhere else\"; it runs inside the page's\
    \ event loop. When the tab closes, that event loop is gone, so anything still waiting simply never\
    \ finishes.\n\n## How it works\n- On close or navigation the browser fires `visibilitychange` (to\
    \ hidden) and `pagehide`; `beforeunload` and `unload` are unreliable, especially on mobile.\n- After\
    \ that, timers are cleared and normal `fetch` requests are cancelled; the server may or may not have\
    \ received them.\n- `navigator.sendBeacon(url, data)` queues a small POST that the browser finishes\
    \ after unload.\n- `fetch(url, { keepalive: true })` does the same with fetch options (body limit\
    \ about 64 KB in total).\n- Service workers live outside the page and can finish work started with\
    \ `event.waitUntil`; Background Sync can retry when the device is back online (Chromium only).\n-\
    \ If the page enters bfcache instead, it is frozen, not destroyed, and resumes on back navigation.\n\
    \n## Example\n```js\ndocument.addEventListener(\"visibilitychange\", () => {\n  if (document.visibilityState\
    \ === \"hidden\") {\n    navigator.sendBeacon(\"/analytics\", JSON.stringify({ t: Date.now() }));\n\
    \  }\n});\n```\nThis reports analytics even if the user closes the tab next.\n\n## Common mistakes\n\
    - Saving data in `unload` with a normal fetch and assuming it arrives.\n- Using a synchronous XHR\
    \ in unload, which browsers now block.\n- Expecting a `setTimeout` to fire after the tab closes.\n\
    \n## In the interview\nMention `visibilitychange` as the last reliable moment, and the bfcache interaction\
    \ (`unload` listeners block bfcache). Follow-ups: how analytics libraries batch events, and storing\
    \ drafts in IndexedDB as they are typed.\n"
