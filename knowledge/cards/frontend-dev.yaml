- id: kb-146d386d3fbe
  question: What does the plus sign (+) do in CSS selectors?
  answer: 'The + is the adjacent sibling combinator: A + B matches a B element that comes immediately
    after A and shares the same parent. Only the very next element sibling counts.'
  topic: frontend dev
  tags:
  - css
  - selectors
  explanation: '## In plain words

    `A + B` means "a B that sits right after an A, as its next-door neighbour". It is useful for styling
    something based on the element just before it.


    ## How it works

    - Both elements must have the same parent.

    - B must be the next element sibling of A; text nodes and comments in between are ignored, other elements
    are not.

    - It only looks forward: there is no "previous sibling" combinator, although `:has()` now covers that
    case (`A:has(+ B)` selects the A).

    - Related: `A ~ B` (general sibling) matches any B after A with the same parent; `A > B` is direct
    child; `A B` is any descendant.


    ## Example

    ```css

    /* space between stacked items, but not before the first */

    .item + .item { margin-top: 12px; }


    /* style a label that follows a checked checkbox */

    input[type="checkbox"]:checked + label { text-decoration: line-through; }

    ```

    ```html

    <input type="checkbox" id="t" checked><label for="t">Buy milk</label>

    ```


    ## Common mistakes

    - Expecting `+` to match all following siblings; that is `~`.

    - Expecting it to match a nested element.

    - Forgetting that an element in between (even a hidden one) breaks the match.


    ## In the interview

    Give the "lobotomised owl" style example (`* + *`) for spacing, and mention `gap` in flex/grid as
    the modern alternative. Follow-ups: specificity of combinators (they add none themselves) and `:has()`
    for parent or previous-sibling selection.

    '
