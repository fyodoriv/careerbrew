  question: How do you implement a modal dialog in React?
  answer: 'Control it from the parent with `isOpen` and `onClose` props, render it into `document.body`
    with `createPortal` so it escapes parent overflow and z-index, and make it accessible: `role="dialog"`,
    `aria-modal`, a label, focus moved in and trapped, Escape to close, and focus returned on close. The
    native `<dialog>` element handles much of this for you.'
  topic: frontend dev
  tags:
  - react
  - modal
  - accessibility
  - portals
  explanation: "## In plain words\nA modal is a box that appears above the page and blocks it until you\
    \ close it. The visual part is easy; the hard parts are layering (it must not be clipped by its parent)\
    \ and accessibility (keyboard and screen-reader users must be able to use and leave it).\n\n## How\
    \ it works\n- **State**: the parent owns `isOpen`; the modal calls `onClose`.\n- **Portal**: `createPortal(jsx,\
    \ document.body)` renders outside the parent DOM node while keeping React context and event bubbling\
    \ through the React tree.\n- **Accessibility**:\n  - `role=\"dialog\"`, `aria-modal=\"true\"`, `aria-labelledby`\
    \ pointing to the title.\n  - Move focus into the dialog on open; trap Tab inside; restore focus to\
    \ the trigger on close.\n  - Close on Escape and, optionally, on backdrop click.\n  - Make the background\
    \ inert (`inert` attribute) and stop body scrolling.\n- **Native option**: `<dialog>` with `showModal()`\
    \ gives top-layer rendering, Escape handling, focus management, and a `::backdrop`.\n\n## Example\n\
    ```jsx\nimport { createPortal } from \"react-dom\";\nimport { useEffect, useRef } from \"react\";\n\
    \nfunction Modal({ isOpen, onClose, title, children }) {\n  const ref = useRef(null);\n  useEffect(()\
    \ => {\n    const d = ref.current;\n    if (isOpen && !d.open) d.showModal();\n    if (!isOpen &&\
