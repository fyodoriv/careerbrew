  question: What does the :nth-last-child(n) selector do in CSS?
  answer: '`:nth-last-child(An+B)` matches elements by their position among siblings counted from the
    end. `:nth-last-child(1)` is the last child, `:nth-last-child(-n+3)` the last three.'
  topic: frontend dev
  tags:
  - css
  - selectors
  - pseudo-classes
  explanation: '## In plain words

    It is `:nth-child` read backwards. Instead of counting siblings from the first one, it counts from
    the last one, so you can target "the last two items" without knowing how many there are.


    ## How it works

    - Argument forms: a number (`2`), keywords `odd` / `even`, or a formula `An+B`, where n = 0, 1, 2,
    …

    - Position 1 is the last child, 2 the second to last, and so on.

    - It counts all element siblings, whatever their type; `:nth-last-of-type` counts only same-type siblings.

    - Selectors Level 4 adds `of S` filtering: `:nth-last-child(2 of .active)`.

    - Combining with `:nth-child` gives quantity queries.


    ## Example

    ```css

    li:nth-last-child(1)     { font-weight: bold; }   /* last item */

    li:nth-last-child(-n+3)  { color: gray; }         /* last three */

    /* only when the list has exactly 4 items, style all of them */

    li:first-child:nth-last-child(4),

    li:first-child:nth-last-child(4) ~ li { width: 25%; }

    ```


    ## Common mistakes

    - Thinking counting starts at 0; it starts at 1.

    - Expecting `p:nth-last-child(1)` to match the last `<p>` when the last child is a `<div>`; use `:nth-last-of-type`.

    - Writing `n-3` and expecting "last three"; the formula is `-n+3`.


    ## In the interview

    Explain the formula with a quick table of n values. Mention the quantity-query trick and that these
    selectors have the specificity of a class. Follow-up: difference between `:last-child` and `:last-of-type`.

    '
