  question: How does React compare elements when diffing two trees during reconciliation?
  answer: 'React assumes two heuristics: elements of a different type produce different trees, so it tears
    the old subtree down and builds a new one; elements of the same type are kept and only their changed
    props are updated. For lists, `key` tells React which child is which across renders.'
  topic: frontend dev
  tags:
  - react
  - reconciliation
  - virtual-dom
  - keys
  explanation: '## In plain words

    Comparing two arbitrary trees perfectly is expensive (roughly cubic time). React trades perfection
    for speed: it compares the trees level by level with two simple rules, which makes diffing linear
    in the number of elements. Knowing these rules explains many "why did my state reset?" bugs.


    ## How it works

    - **Different type** (`<div>` to `<span>`, or `ComponentA` to `ComponentB`): unmount the old subtree,
    destroying its DOM and state, and mount the new one.

    - **Same DOM type**: keep the DOM node, update only changed attributes and styles, then recurse into
    children.

    - **Same component type**: keep the instance and its state, pass new props, re-render it.

    - **Children lists**: by default React matches children by position. Inserting at the front then shifts
    everything. With `key`, React matches by identity, so it can move, insert, or remove items efficiently.

    - **Changing a key** on purpose forces a remount, which resets state.

    - Keys only need to be unique among siblings and stable across renders.


    ## Example

    ```jsx

    // Index keys: deleting the first row moves its input text to the next row.

    {items.map((item, i) => <Row key={i} item={item} />)}


    // Stable ids: each Row keeps its own state.

    {items.map((item) => <Row key={item.id} item={item} />)}

    ```


    ## Common mistakes

    - Using array indexes as keys for lists that reorder, filter, or insert.

    - Generating keys with `Math.random()`, which remounts every item every render.

    - Defining a component inside another component, creating a new type each render and resetting state.

    - Thinking React diffs the real DOM; it diffs element trees.


    ## In the interview

    Name the two heuristics and the role of keys, and mention that it makes the algorithm O(n). Show the
    index-key bug as evidence. Follow-ups: how to reset a form with a `key`, what the Fiber architecture
    adds (interruptible work), and how `React.memo` lets React skip a subtree.

    '
