  question: What are Higher-Order Components (HOCs) in React?
  answer: A higher-order component is a function that takes a component and returns a new component that
    wraps it, adding props or behaviour such as data loading or auth checks. Hooks have mostly replaced
    HOCs for sharing logic.
  topic: frontend dev
  tags:
  - react
  - patterns
  - hoc
  explanation: "## In plain words\nA HOC is like a gift wrapper: you hand it a component and get back\
    \ the same component wrapped with something extra. The name comes from higher-order functions, which\
    \ take or return functions.\n\n## How it works\n- Signature: `const Enhanced = withSomething(Wrapped)`.\n\
    - The returned component renders `<Wrapped {...props} extra={...} />`.\n- Common uses: injecting data\
    \ (`connect` from older Redux), guarding routes, adding logging or theming.\n- Rules: pass through\
    \ unrelated props, do not mutate the wrapped component, set a `displayName` for DevTools, and create\
    \ HOCs outside render so the component identity stays stable.\n\n## Example\n```jsx\nfunction withUser(Wrapped)\
    \ {\n  function WithUser(props) {\n    const user = useCurrentUser();          // any hook\n    if\
    \ (!user) return <p>Please log in</p>;\n    return <Wrapped {...props} user={user} />;\n  }\n  WithUser.displayName\
    \ = `withUser(${Wrapped.name})`;\n  return WithUser;\n}\nconst Profile = withUser(({ user }) => <h1>{user.name}</h1>);\n\
    ```\n\n## Common mistakes\n- Calling the HOC inside a render, which creates a new component type each\
    \ time and unmounts the subtree.\n- Prop name collisions when several HOCs inject the same prop.\n\
    - \"Wrapper hell\": deep trees that are hard to debug.\n- Forgetting to forward refs (`forwardRef`)\
    \ and static methods.\n\n## In the interview\nExplain the pattern, then say that a custom hook (`useCurrentUser`)\
    \ is usually simpler today because it avoids wrappers and naming clashes. HOCs still fit cross-cutting\
    \ wrapping such as error boundaries or `React.memo` (which is itself a HOC). Compare with render props\
    \ if asked.\n"
