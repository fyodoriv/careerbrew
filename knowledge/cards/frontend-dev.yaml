- id: kb-e85367f648fb
  question: How can you show multiple borders around an element in CSS?
  answer: Use stacked `box-shadow` values with zero blur and growing spread (`0 0 0 4px red, 0 0 0 8px
    blue`). Other options are `border` plus `outline` (two lines), or `::before`/`::after` pseudo-elements
    with their own borders. Shadows and outlines do not change layout size.
  topic: frontend dev
  tags:
  - css
  - borders
  - box-shadow
  - pseudo-elements
  explanation: "## In plain words\nAn element has only one `border`. To get several rings around it you\
    \ borrow other properties that also draw around the box. `box-shadow` is the most flexible: a shadow\
    \ with no blur and no offset is just a solid ring, and you can list as many as you like.\n\n## How\
    \ it works\n- **box-shadow**: each comma-separated shadow is drawn behind the previous one. With `0\
    \ 0 0 Npx color`, spread `N` sets the ring's outer edge, so increase it for each ring. Follows `border-radius`.\
    \ Does not take layout space. Add `inset` for rings inside.\n- **border + outline**: gives exactly\
    \ two lines. `outline-offset` adds a gap. Outlines follow `border-radius` in modern browsers but do\
    \ not take space and are often used for focus, so be careful.\n- **Pseudo-elements**: position `::before`\
    \ absolutely with `inset: -8px` and its own border. Most control (dashed, gradients) but needs `position:\
    \ relative` on the parent.\n- **border-image** or gradient backgrounds for fancy patterns.\n\n## Example\n\
    ```css\n.badge {\n  border: 2px solid black;\n  border-radius: 8px;\n  box-shadow:\n    0 0 0 4px\
    \ gold,     /* ring from 0 to 4px outside the border */\n    0 0 0 8px crimson;  /* ring from 4px\
    \ to 8px */\n  margin: 8px;          /* leave room, since shadows take no space */\n}\n```\n\n## Common\
    \ mistakes\n- Forgetting that shadows and outlines do not take space, so they overlap neighbours.\n\
    - Giving every shadow the same spread, so only one ring shows.\n- Replacing the focus `outline` and\
    \ hurting keyboard accessibility.\n- Using extra wrapper `div`s when CSS alone is enough.\n\n## In\
    \ the interview\nList two or three techniques with one trade-off each: shadows are flexible and cheap,\
    \ outline is simple but limited to one extra line, pseudo-elements give full control. Mention that\
    \ none of them affect layout except real borders. A follow-up may ask about the box model, or how\
    \ to add a visible focus ring without breaking design.\n"
  match:
