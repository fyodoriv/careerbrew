  question: What are the CSS font-display strategies?
  answer: 'font-display controls what text does while a web font loads: auto, block (hide text briefly
    then swap), swap (show fallback immediately, swap when loaded), fallback (short block, short swap
    window), and optional (very short block, use the font only if it is ready fast).'
  topic: frontend dev
  tags:
  - css
  - fonts
  - performance
  explanation: "## In plain words\nWeb fonts download after the page starts. The browser must choose:\
    \ hide text until the font arrives (flash of invisible text) or show a fallback font and switch later\
    \ (flash of unstyled text). `font-display` lets you choose.\n\n## How it works\nEach value combines\
    \ a **block period** (text invisible) and a **swap period** (fallback shown, swap allowed):\n- `auto`:\
    \ browser default, usually like `block`.\n- `block`: about 3 s invisible, then swap any time. For\
    \ icon fonts.\n- `swap`: almost no block, unlimited swap. Text always readable, but may jump.\n- `fallback`:\
    \ about 100 ms block, about 3 s swap; after that the fallback stays.\n- `optional`: about 100 ms block,\
    \ no swap; the browser may skip the font on slow networks. Best for layout stability.\n\n## Example\n\
