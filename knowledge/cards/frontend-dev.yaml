  question: How would you measure and improve a custom "page ready" metric in a React app?
  answer: 'Browser events such as `DOMContentLoaded` and `load` fire before a single-page app has fetched
    data and shown real content, so you define a custom mark: the moment the key content is rendered and
    usable. Record it with `performance.mark` from the app, send it with real-user monitoring, then improve
    it by shortening the critical path: smaller bundles, parallel data fetching, server rendering, and
    caching.'
  topic: frontend dev
  tags:
  - performance
  - react
  - metrics
  - monitoring
  explanation: "## In plain words\nIn a React app the HTML often arrives empty, then JavaScript loads,\
    \ then data loads, then the real page appears. The standard browser events miss most of that. A custom\
    \ \"page ready\" metric captures what users care about: when the main content they came for is visible\
    \ and works.\n\n## How it works\n- **Define it** per page: for example, \"main list rendered with\
    \ data and handlers attached\". Write the definition down so teams agree.\n- **Measure**:\n  - Call\
    \ `performance.mark(\"page-ready\")` in an effect once the key data has rendered; the mark's `startTime`\
    \ is measured from navigation start.\n  - Send the value with a beacon (`navigator.sendBeacon`) to\
    \ analytics, with page, device, and release tags.\n  - Look at percentiles (p50, p75, p95), not averages;\
    \ compare with standard metrics like LCP and INP.\n- **Improve the critical path**:\n  - Ship less\
    \ JavaScript (code splitting, route-level lazy loading).\n  - Start data fetching early and in parallel,\
    \ not in waterfalls of nested effects.\n  - Server rendering or streaming so content arrives in HTML.\n\
    \  - Cache API responses and assets.\n- **Guard**: dashboards and alerts on regressions per release.\n\
    \n## Example\n```jsx\nfunction OrdersPage() {\n  const { data } = useOrders();\n  useEffect(() =>\
    \ {\n    if (!data) return;\n    performance.mark(\"page-ready\");\n    const [m] = performance.getEntriesByName(\"\
    page-ready\");\n    navigator.sendBeacon(\"/rum\", JSON.stringify({ page: \"orders\", ms: Math.round(m.startTime)\
    \ }));\n  }, [data]);\n  return data ? <OrdersTable rows={data} /> : <Spinner />;\n}\n```\n\n## Common\
    \ mistakes\n- Using `load` or `DOMContentLoaded` as the SPA ready signal.\n- Reporting averages, which\
    \ hide slow users.\n- Marking ready when a spinner appears instead of real content.\n- Not handling\
    \ client-side navigations, which have no new navigation start.\n\n## In the interview\nExplain why\
    \ a custom metric is needed, how you would define and collect it, and two or three concrete improvements.\
    \ Mention percentiles and segmenting by device. Follow-ups: measuring soft navigations, how this relates\
