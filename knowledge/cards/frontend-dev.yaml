  question: How do you optimize CSS for different media and devices?
  answer: Use media queries (`@media`) for screen size, orientation, resolution, and user preferences
    such as dark mode or reduced motion. Load non-critical styles with a `media` attribute on `<link>`
    (for example `media="print"`) so they do not block rendering, and serve right-sized images with `srcset`.
    Write mobile-first CSS and use container queries for component-level responsiveness.
  topic: frontend dev
  tags:
  - css
  - media-queries
  - performance
  - responsive-design
  explanation: "## In plain words\nDifferent devices need different styles: a phone, a wide monitor, a\
    \ printer, or a user who prefers less motion. Media queries let CSS apply rules only when conditions\
    \ match. Loading only the CSS a device needs also speeds up the first render.\n\n## How it works\n\
    - **Media queries**: `@media (min-width: 768px) { ... }`, `(orientation: landscape)`, `(min-resolution:\
    \ 2dppx)`, `(hover: hover)`, `(prefers-color-scheme: dark)`, `(prefers-reduced-motion: reduce)`, and\
    \ `print`.\n- **Mobile-first**: base styles for small screens, then add `min-width` queries; less\
    \ to override.\n- **Non-blocking stylesheets**: `<link rel=\"stylesheet\" href=\"print.css\" media=\"\
    print\">` is downloaded at low priority and does not block rendering of the screen.\n- **Critical\
    \ CSS**: inline the small set of styles needed above the fold; load the rest asynchronously.\n- **Images**:\
    \ `srcset` and `sizes` or `<picture>` so devices download appropriate sizes and formats.\n- **Container\
    \ queries**: `@container (min-width: 400px)` adapts a component to its container, not the viewport.\n\
    - **Fluid values**: `clamp()` for type and spacing reduces breakpoints.\n\n## Example\n```html\n<link\
    \ rel=\"stylesheet\" href=\"main.css\">\n<link rel=\"stylesheet\" href=\"print.css\" media=\"print\"\
    >\n\n<style>\n  .grid { display: grid; gap: 1rem; }\n  @media (min-width: 768px) { .grid { grid-template-columns:\
    \ 1fr 1fr; } }\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }\n\
    </style>\n```\n\n## Common mistakes\n- Desktop-first CSS with many overrides for mobile.\n- Shipping\
    \ one huge stylesheet that blocks rendering on every device.\n- Forgetting the viewport meta tag,\
    \ so media queries do not behave on phones.\n- Ignoring user preference queries such as reduced motion.\n\
    \n## In the interview\nMention both correctness (responsive design, user preferences, print) and performance\
