  question: What are the CSS viewport units vh, vw, vmin, vmax, and dvh?
  answer: 'Viewport units are percentages of the viewport: `1vw` is 1% of its width, `1vh` 1% of its height,
    `vmin` and `vmax` use the smaller or larger side. On mobile, `vh` ignores the moving browser toolbars,
    so `100dvh` (dynamic) is the safer choice for full-height layouts.'
  topic: frontend dev
  tags:
  - css
  - viewport
  - responsive-design
  - units
  explanation: "## In plain words\nThe viewport is the visible area of the page. Viewport units let you\
    \ size things relative to it, so a hero section can be exactly one screen tall no matter the device.\
    \ Mobile browsers complicate this because their address bar grows and shrinks while you scroll, which\
    \ changes the visible height.\n\n## How it works\n- `vw` / `vh`: 1% of viewport width / height.\n\
    - `vmin` / `vmax`: 1% of the smaller / larger dimension; handy for squares that fit in both orientations.\n\
    - On mobile, classic `vh` is based on the largest viewport (toolbar hidden), so `100vh` can overflow\
    \ under the toolbar.\n- Newer units fix this:\n  - `svh` (small): height with toolbars shown.\n  -\
    \ `lvh` (large): height with toolbars hidden.\n  - `dvh` (dynamic): follows the current state and\
    \ updates as toolbars move.\n- The same prefixes exist for width and min/max (`dvw`, `svmin`, and\
    \ so on).\n- `vw` includes the vertical scrollbar width on desktop, so `100vw` can cause horizontal\
    \ scroll.\n\n## Example\n```css\n.hero {\n  min-height: 100vh;   /* fallback for old browsers */\n\
    \  min-height: 100dvh;  /* follows mobile toolbars */\n}\n.square {\n  width: 50vmin;\n  height: 50vmin;\
    \      /* always fits on screen */\n}\n```\n\n## Common mistakes\n- Using `100vh` on mobile and getting\
    \ content hidden under the browser toolbar.\n- Using `width: 100vw` and causing a horizontal scrollbar\
    \ on desktop.\n- Using `height` instead of `min-height`, so content gets cut off when it is longer\
    \ than the screen.\n- Using `dvh` for things that should not jump while scrolling; `svh` is more stable.\n\
    \n## In the interview\nDefine each unit in one line, then explain the mobile toolbar problem and the\
    \ `svh`/`lvh`/`dvh` family; that shows real-world experience. Mention a fallback line for older browsers\
    \ and the scrollbar issue with `vw`. A follow-up may ask when to prefer percentages or container query\
