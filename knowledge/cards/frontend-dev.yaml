- id: kb-0c57d329f5c0
  question: How do generators work in JavaScript?
  answer: A generator function (`function*`) returns an iterator. Each `next()` runs the body until the
    next `yield`, returns `{ value, done }`, and pauses. The value passed to `next(x)` becomes the result
    of the paused `yield` expression, so data flows both ways.
  topic: frontend dev
  tags:
  - javascript
  - generators
  - iterators
  - es6
  explanation: "## In plain words\nA normal function runs from start to end in one go. A generator can\
    \ pause in the middle and resume later, keeping its local variables. It is like a bookmark in a story:\
    \ each time you ask for more, it reads up to the next `yield` and stops there.\n\n## How it works\n\
    - Calling a generator function runs nothing; it returns a generator object.\n- `gen.next(arg)`:\n\
    \  - Resumes execution. On the first call, `arg` is ignored because no `yield` is waiting yet.\n \
    \ - On later calls, `arg` becomes the value of the `yield` expression that paused.\n  - Returns `{\
    \ value, done }`: `value` is the yielded value, or the `return` value when `done` is `true`.\n- `gen.return(v)`\
    \ ends it early; `gen.throw(err)` throws at the paused `yield`.\n- Generators are iterable, so `for...of`\
    \ and spread work (they ignore the final `return` value).\n- `yield*` delegates to another iterable.\n\
    - Uses: lazy or infinite sequences, custom iterators, and (historically) async flow libraries such\
    \ as redux-saga.\n\n## Example\n```js\nfunction* talk() {\n  const reply = yield \"question\";\n \
    \ console.log(\"got:\", reply);\n  return \"done\";\n}\nconst it = talk();\nconsole.log(it.next());\
    \        // { value: 'question', done: false }\nconsole.log(it.next(\"hello\")); // logs \"got: hello\"\
    , then { value: 'done', done: true }\nconsole.log(it.next());        // { value: undefined, done:\
    \ true }\n```\n\n## Common mistakes\n- Expecting the generator body to run when the function is called.\n\
    - Expecting the first `next(x)` argument to be received.\n- Forgetting that `for...of` skips the `return`\
    \ value.\n- Confusing generators with async functions; async generators (`async function*`) are a\
    \ separate feature used with `for await`.\n\n## In the interview\nExplain pause and resume, the `{\
    \ value, done }` shape, and two-way data flow with the trace above; interviewers often ask exactly\
    \ \"when does the log run?\". Mention practical uses: lazy ranges, tree traversal, and sagas. A follow-up\
    \ may ask you to implement a `range` generator or make an object iterable with `[Symbol.iterator]`.\n"
  match:
