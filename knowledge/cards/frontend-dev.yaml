- id: kb-1fcabd156268
  question: What does rel="noopener" do on a link?
  answer: rel="noopener" stops a page opened with target="_blank" from getting a reference to the opening
    page through window.opener. This prevents the new page from redirecting the original tab (reverse
    tabnabbing) and lets the browser run it in a separate process.
  topic: frontend dev
  tags:
  - html
  - security
  - links
  explanation: '## In plain words

    When a link opens a new tab, the new page can normally reach back to your tab through `window.opener`.
    A malicious page could use it to swap your tab for a fake login page. `noopener` cuts that link.


    ## How it works

    - With `target="_blank"` and no `noopener`, the new page gets `window.opener` and can call `window.opener.location
    = "https://evil.example/login"`.

    - With `noopener`, `window.opener` is `null`.

    - Modern browsers treat `target="_blank"` as `noopener` by default, but setting it explicitly is still
    good practice for older browsers.

    - `noreferrer` implies `noopener` and also hides the Referer header.

    - In JS: `window.open(url, "_blank", "noopener")`.

    - If you need the opener on purpose (OAuth popups), use `rel="opener"` and trust the target.


    ## Example

    ```html

    <a href="https://other.example" target="_blank" rel="noopener">Docs</a>

    ```

    ```js

    window.open("https://other.example", "_blank", "noopener,noreferrer");

    ```


    ## Common mistakes

    - Thinking `noopener` hides the referrer; that is `noreferrer`.

    - Assuming it is only cosmetic; it is a security and performance setting.

    - Breaking OAuth popups by adding it where the opener is needed.


    ## In the interview

    Name the attack (reverse tabnabbing) and the fix. Mention browser defaults changed around 2021. Follow-ups:
    Cross-Origin-Opener-Policy (COOP) header as the site-wide version, and the difference from `noreferrer`.

    '
