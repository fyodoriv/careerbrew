  question: How do you correctly update an array in React state?
  answer: 'Treat the array as immutable: create a new array for every change and pass it to the setter.
    Add with spread (`[...arr, x]`), remove with `filter`, change items with `map`, and sort with `toSorted()`
    or a copy. Mutating methods like `push`, `splice`, or `sort` keep the same reference, so React may
    skip the update.'
  topic: frontend dev
  tags:
  - react
  - state
  - arrays
  - immutability
  explanation: "## In plain words\nReact decides whether state changed by checking if it is the same object\
    \ (`Object.is`). If you change an item inside the array, the array itself is the same object, so React\
    \ may not re-render. Making a new array each time gives React a clear signal and keeps old renders'\
    \ data intact.\n\n## How it works\n| Goal | Avoid (mutates) | Use (new array) |\n|---|---|---|\n|\
    \ Add | `push`, `unshift` | `[...arr, x]`, `[x, ...arr]` |\n| Remove | `splice`, `pop` | `arr.filter(i\
    \ => i.id !== id)` |\n| Replace or update | `arr[i] = x` | `arr.map(i => i.id === id ? { ...i, done:\
    \ true } : i)` |\n| Insert at index | `splice` | `[...arr.slice(0, i), x, ...arr.slice(i)]` or `toSpliced`\
    \ |\n| Sort or reverse | `sort`, `reverse` | `toSorted()`, `toReversed()`, or `[...arr].sort()` |\n\
    \n- Objects inside the array must also be copied when changed; `[...arr]` is shallow.\n- Use the updater\
    \ form `setItems(prev => ...)` when the new array depends on the old one.\n- Immer (`useImmer` or\
    \ Redux Toolkit) lets you write mutating-style code that produces new arrays.\n\n## Example\n```jsx\n\
    function Todos() {\n  const [todos, setTodos] = useState([{ id: 1, text: \"Write\", done: false }]);\n\
    \  const toggle = (id) =>\n    setTodos((prev) => prev.map((t) => (t.id === id ? { ...t, done: !t.done\
    \ } : t)));\n  const remove = (id) => setTodos((prev) => prev.filter((t) => t.id !== id));\n  const\
    \ add = (text) => setTodos((prev) => [...prev, { id: Date.now(), text, done: false }]);\n  return\
    \ null; // render omitted\n}\n```\n\n## Common mistakes\n- `todos.push(x); setTodos(todos)`: same\
    \ reference, no re-render.\n- Copying the array but mutating an object inside it, which breaks memoized\
    \ children and old snapshots.\n- Using `sort()` directly on state.\n- Using indexes as keys after\
    \ reordering.\n\n## In the interview\nGive the add, remove, update table and explain reference equality.\
    \ Mention the ES2023 non-mutating methods and Immer. Follow-ups: why immutability helps `memo` and\
    \ undo history, and the cost of copying large arrays (O(n) per update, usually fine).\n"
