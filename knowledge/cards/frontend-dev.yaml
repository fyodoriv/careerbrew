  question: What is the Cache API in service workers?
  answer: The Cache API is a promise-based store of Request/Response pairs, available to pages and service
    workers, that lets you cache network responses yourself. A service worker uses it in its fetch handler
    to serve assets offline and implement strategies like cache-first or stale-while-revalidate.
  topic: frontend dev
  tags:
  - service-workers
  - pwa
  - caching
  - offline
  explanation: "## In plain words\nThe browser's HTTP cache is automatic and you cannot fully control\
    \ it. The Cache API is a cache you manage in code: you decide what to store, when to update it, and\
    \ what to serve, which is how offline web apps work.\n\n## How it works\n- Open a named cache: `caches.open(\"\
    v1\")`.\n- Store: `cache.add(url)`, `cache.addAll([...])`, or `cache.put(request, response)`.\n- Read:\
    \ `cache.match(request)` or `caches.match(request)` across all caches.\n- Remove: `cache.delete(request)`,\
    \ `caches.delete(name)`.\n- Typical flow: precache app shell in `install`, delete old cache versions\
    \ in `activate`, answer requests in `fetch` with `event.respondWith(...)`.\n- Strategies: cache-first\
    \ (static assets), network-first (HTML, API), stale-while-revalidate (things that can be slightly\
    \ old).\n- Nothing expires automatically; you must clean up. Storage counts against the origin quota.\n\
    \n## Example\n```js\nself.addEventListener(\"install\", (e) => {\n  e.waitUntil(caches.open(\"v1\"\
    ).then((c) => c.addAll([\"/\", \"/app.js\", \"/app.css\"])));\n});\nself.addEventListener(\"fetch\"\
    , (e) => {\n  e.respondWith(caches.match(e.request).then((hit) => hit || fetch(e.request)));\n});\n\
    ```\n\n## Common mistakes\n- Never deleting old caches, so users keep stale files.\n- Caching opaque\
    \ cross-origin responses whose status you cannot check.\n- Forgetting a response body can be read\
    \ only once; use `response.clone()` before caching.\n\n## In the interview\nExplain the lifecycle\
    \ (install, activate, fetch) and pick a strategy per resource type. Mention Workbox as the usual library.\
    \ Follow-ups: how to update an app (new SW version, `skipWaiting`), and the difference from the HTTP\
    \ cache.\n"
