    \ return resolve(results);\n\n    items.forEach((item, i) => {\n      Promise.resolve(item).then((value)\
    \ => {\n        results[i] = value;\n        remaining -= 1;\n        if (remaining === 0) resolve(results);\n\
    \      }, reject);\n    });\n  });\n}\n\npromiseAll([1, Promise.resolve(2), new Promise((r) => setTimeout(()\
