  question: What are Web Workers for, and how can you run code in parallel on the front end?
  answer: Web Workers run JavaScript on a background thread so heavy work does not block the main thread
    that handles rendering and input. They talk to the page by postMessage, cannot touch the DOM, and
    receive data as copies (structured clone) or transferred buffers; only SharedArrayBuffer gives truly
    shared memory.
  topic: frontend dev
  tags:
  - javascript
  - web-workers
  - performance
  - concurrency
  explanation: "## In plain words\nThe page has one main thread that runs your JS, layout and painting.\
    \ A long calculation there freezes the UI. A Web Worker is a second thread you can hand the heavy\
    \ job to, like a kitchen assistant chopping vegetables while the chef keeps serving.\n\n## How it\
    \ works\n- Create with `new Worker(\"worker.js\", { type: \"module\" })`.\n- Communicate with `postMessage`\
    \ and `onmessage`; data is copied with the structured clone algorithm.\n- Pass large `ArrayBuffer`s\
    \ as transferables to move them without copying.\n- No DOM, no `window`; you get `fetch`, timers,\
    \ IndexedDB, `OffscreenCanvas`.\n- Variants: dedicated workers (one page), shared workers (several\
    \ tabs), service workers (a network proxy, not for computation).\n- Libraries such as Comlink make\
    \ a worker look like an async function call.\n\n## Example\n```js\n// main.js\nconst w = new Worker(new\
    \ URL(\"./sum.js\", import.meta.url), { type: \"module\" });\nw.onmessage = (e) => console.log(\"\
    sum\", e.data);\nw.postMessage(50_000_000);\n// sum.js\nonmessage = (e) => {\n  let s = 0;\n  for\
    \ (let i = 0; i < e.data; i++) s += i;\n  postMessage(s);\n};\n```\nThe UI stays responsive while\
    \ the loop runs.\n\n## Common mistakes\n- Expecting async/await alone to make code parallel; promises\
    \ still run on the main thread.\n- Sending huge objects each message and paying the copy cost.\n-\
    \ Spawning a worker per task instead of reusing one or a small pool.\n\n## In the interview\nGood\
    \ use cases: parsing big files, image processing, search indexing, crypto. Mention that it improves\
    \ INP. Trade-offs: startup cost, message overhead, harder debugging. Follow-ups: `SharedArrayBuffer`\
    \ needs cross-origin isolation headers; `Atomics` for synchronisation.\n"
