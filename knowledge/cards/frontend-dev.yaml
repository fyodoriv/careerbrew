  topic: frontend dev
  tags:
  - system-design
  - autocomplete
  - debounce
  - accessibility
  - react
  explanation: "## In plain words\nA typeahead suggests completions while you type, like a search engine's\
    \ dropdown. It looks small, but it touches many frontend skills at once: state, networking, performance,\
    \ keyboard handling, and accessibility. Interviewers use it to see whether you think beyond the happy\
    \ path.\n\n## How it works\n- **Requirements**: min characters, number of results, highlight of the\
    \ matched text, keyboard support, mobile, offline or slow network.\n- **Components**: `Input` (controlled\
    \ value), `SuggestionList`, `SuggestionItem`; state for `query`, `results`, `activeIndex`, `status`.\n\
    - **Data flow**: input change, then debounce (about 200-300 ms), then fetch `/suggest?q=`.\n- **Correctness**:\
    \ cancel the previous request with `AbortController` or ignore responses whose query is outdated,\
    \ so old answers never overwrite new ones.\n- **Caching**: keep a small LRU map from query to results;\
    \ prefix results can also be filtered on the client.\n- **UX**: loading, empty, and error states;\
    \ close on Escape or blur; select with Enter or click.\n- **Accessibility**: `role=\"combobox\"`,\
    \ `aria-expanded`, `aria-controls`, `role=\"listbox\"` and `role=\"option\"`, and `aria-activedescendant`\
    \ for the highlighted item.\n- **Server side** (if asked): a prefix index such as a trie, ranking\
    \ by popularity.\n\n## Example\n```jsx\nfunction useSuggestions(query) {\n  const [items, setItems]\
    \ = useState([]);\n  useEffect(() => {\n    if (query.length < 2) return setItems([]);\n    const\
    \ ctrl = new AbortController();\n    const t = setTimeout(() => {\n      fetch(`/suggest?q=${encodeURIComponent(query)}`,\
    \ { signal: ctrl.signal })\n        .then((r) => r.json()).then(setItems).catch(() => {});\n    },\
    \ 250);\n    return () => { clearTimeout(t); ctrl.abort(); };\n  }, [query]);\n  return items;\n}\n\
    ```\n\n## Common mistakes\n- Firing a request on every keystroke with no debounce or cancellation\
    \ (race conditions).\n- Forgetting keyboard navigation and ARIA roles.\n- Not encoding the query string.\n\
    - Jumping into code before agreeing on requirements and scope.\n\n## In the interview\nStructure the\
    \ answer: requirements, component tree and state, data fetching, performance, accessibility, then\
    \ edge cases. Trade-offs to mention: debounce delay versus responsiveness, client cache size, and\
    \ client-side filtering versus server ranking. Common follow-ups: how to highlight matches safely\
    \ without `innerHTML`, how to handle very large lists (virtualization), and how to test it.\n"
