  question: What are controlled and uncontrolled inputs in React?
  answer: A controlled input gets its value from React state and reports changes through onChange, so
    React is the single source of truth. An uncontrolled input keeps its own value in the DOM, and you
    read it with a ref or FormData when needed.
  topic: frontend dev
  tags:
