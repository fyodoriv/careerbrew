- id: kb-e8547f524a7a
  question: What is CORS, and how do you handle CORS errors when fetching from another domain?
  answer: CORS (Cross-Origin Resource Sharing) is how a server tells the browser which other origins may
    read its responses, using Access-Control-Allow-* headers. A CORS error is fixed on the server (or
    a same-origin proxy), not in front-end code.
  topic: frontend dev
  tags:
  - http
  - security
  - cors
  - browser
  explanation: "## In plain words\nBrowsers follow the same-origin policy: a page from `app.com` cannot\
    \ read responses from `api.other.com` unless that server says it is allowed. CORS is the set of HTTP\
    \ headers the server uses to give that permission. The request often reaches the server; the browser\
    \ just hides the response.\n\n## How it works\n- Origin = scheme + host + port.\n- **Simple requests**\
    \ (GET/POST with basic headers): the browser sends `Origin`; the response must include `Access-Control-Allow-Origin`\
    \ matching it (or `*`).\n- **Preflight**: for other methods, JSON content type, or custom headers,\
    \ the browser first sends `OPTIONS` with `Access-Control-Request-Method/Headers`. The server answers\
    \ with `Allow-Methods`, `Allow-Headers`, and optionally `Max-Age` to cache it.\n- **Credentials**\
    \ (cookies): need `credentials: \"include\"` on fetch, `Access-Control-Allow-Credentials: true`, and\
    \ an explicit origin, not `*`.\n- Fixes: configure the API to send the headers, or call it through\
    \ your own backend or dev-server proxy so it becomes same-origin.\n\n## Example\nServer (Express)\
    \ allowing one origin with cookies:\n```js\napp.use((req, res, next) => {\n  res.set(\"Access-Control-Allow-Origin\"\
    , \"https://app.example.com\");\n  res.set(\"Access-Control-Allow-Credentials\", \"true\");\n  res.set(\"\
    Access-Control-Allow-Headers\", \"Content-Type\");\n  res.set(\"Vary\", \"Origin\");\n  if (req.method\
    \ === \"OPTIONS\") return res.sendStatus(204);\n  next();\n});\n```\n\n## Common mistakes\n- Using\
    \ `mode: \"no-cors\"`, which gives an opaque response you cannot read.\n- Thinking CORS protects the\
    \ server; it protects users' data in the browser. curl ignores it.\n- Combining `*` with credentials.\n\
    - Reflecting any `Origin` back blindly, which defeats the point.\n\n## In the interview\nExplain same-origin\
    \ policy first, then preflight. Mention dev proxies (Vite `server.proxy`) and that CORS is not CSRF\
    \ protection. Follow-ups: why a preflight fails with 404 on OPTIONS, and caching preflights with `Access-Control-Max-Age`.\n"
