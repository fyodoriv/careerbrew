  question: How do you get the previous value of props or state with React hooks?
  answer: Store the value in a ref and update the ref in an effect after every commit (no dependency array);
    during render the ref still holds the previous value. A `usePrevious` custom hook packages this. If
    you need the previous value to compute state, the React docs suggest tracking it in state during render
    instead.
  topic: frontend dev
  tags:
  - react
  - hooks
  - useref
  - state
  explanation: "## In plain words\nReact gives you only the current props and state. To compare with the\
    \ last render, you need somewhere to remember the old value that survives renders but does not cause\
    \ new ones. A ref is that place: you read the old value during render and write the new one after\
    \ the render commits.\n\n## How it works\n- `const ref = useRef()` creates a persistent box.\n- During\
    \ render, `ref.current` still contains the value from the previous commit.\n- `useEffect(() => { ref.current\
    \ = value; })` (no dependency array) updates it after every commit, so it always holds the last committed\
    \ value.\n- Wrap it in `usePrevious(value)` for reuse.\n- Caveat: reading refs during render is discouraged\
    \ in strict modern React, because concurrent rendering may render without committing. For logic that\
    \ changes output, store the previous value in state and update it during render:\n  - `const [prev,\
    \ setPrev] = useState(value); if (prev !== value) { setPrev(value); /* derive */ }`.\n- Often you\
    \ can avoid the need entirely by comparing in the event handler that causes the change.\n\n## Example\n\
    ```jsx\nfunction usePrevious(value) {\n  const ref = useRef(undefined);\n  useEffect(() => {\n   \
    \ ref.current = value;\n  });\n  return ref.current;\n}\n\nfunction Price({ amount }) {\n  const prev\
    \ = usePrevious(amount);\n  const trend =\n    prev === undefined || prev === amount ? \"\" : amount\
    \ > prev ? \"up\" : \"down\";\n  return <span>{amount} {trend}</span>;\n}\n```\n\n## Common mistakes\n\
    - Updating the ref during render, so it already holds the new value.\n- Storing the previous value\
    \ in state through an effect, which causes an extra render.\n- Expecting the previous *different*\
    \ value: after a re-render for another reason, `prev` equals the current value, so handle the equal\
    \ case. Adding `[value]` as dependencies does not fix this; it makes `prev` equal the current value\
    \ on unrelated re-renders.\n- Forgetting the first render, when the previous value is `undefined`.\n\
    \n## In the interview\nShow `usePrevious` and explain why it works (effects run after render). Mention\
    \ the state-during-render alternative recommended by the React docs, which shows you know current\
    \ guidance. Follow-ups: why refs do not trigger renders, and how class components did this with `componentDidUpdate(prevProps)`.\n"
