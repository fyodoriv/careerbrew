  question: How do you correctly update an object in React state?
  answer: 'Create a new object with the change instead of modifying the existing one: `setUser(u => ({
    ...u, name }))`. For nested data, copy every level along the path you change. Mutating the object
    keeps the same reference, so React may not re-render and older snapshots get corrupted.'
  topic: frontend dev
  tags:
  - react
  - state
  - objects
  - immutability
  explanation: "## In plain words\nState in React should be treated like a photograph: you do not edit\
    \ the photo, you take a new one. React checks whether the state is the same object as before; a modified\
    \ object is still the same object, so React may think nothing changed.\n\n## How it works\n- Spread\
    \ the old object and override fields: `{ ...prev, field: value }`.\n- `useState` setters replace the\
    \ whole value (unlike class `setState`, which merged), so always spread the rest.\n- Nested update:\
    \ copy each level on the path, for example `{ ...p, address: { ...p.address, city } }`.\n- Computed\
    \ keys help with forms: `{ ...form, [e.target.name]: e.target.value }`.\n- Use the updater form when\
    \ based on previous state.\n- For deep structures, flatten (normalize) state or use Immer to write\
    \ `draft.address.city = city` safely.\n- Copying is shallow and cheap; unchanged nested objects are\
    \ shared, which is fine because they are never mutated.\n\n## Example\n```jsx\nfunction Form() {\n\
    \  const [form, setForm] = useState({ name: \"\", email: \"\" });\n  function handleChange(e) {\n\
    \    const { name, value } = e.target;\n    setForm((prev) => ({ ...prev, [name]: value }));\n  }\n\
    \  return (\n    <>\n      <input name=\"name\" value={form.name} onChange={handleChange} />\n   \
    \   <input name=\"email\" value={form.email} onChange={handleChange} />\n    </>\n  );\n}\n```\n\n\
    ## Common mistakes\n- `form.name = \"x\"; setForm(form)`.\n- Forgetting to spread, which drops other\
    \ fields.\n- Copying only the top level when the change is nested.\n- Deep-cloning the whole object\
    \ on each change, which wastes work and breaks memoization of untouched parts.\n\n## In the interview\n\
    Show the spread pattern, a nested update, and explain reference equality. Mention Immer and normalization\
    \ for deep state. Follow-ups: when to split one object into several `useState` calls, when to use\
    \ `useReducer`, and how this matters for `React.memo` and effect dependencies.\n"
