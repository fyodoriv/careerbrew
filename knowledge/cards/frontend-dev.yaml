- id: kb-1504c223ad53
  question: What is the paint step in the browser rendering process?
  answer: 'Paint turns the laid-out boxes into drawing instructions for pixels: backgrounds, borders,
    text, shadows, and images, recorded per layer in stacking order. It runs after layout and before compositing;
    changing colours or shadows triggers paint without layout.'
  topic: frontend dev
  tags:
  - browser
  - rendering
  - performance
  - paint
  explanation: '## In plain words

    Layout decides where boxes go. Paint decides what they look like: it fills in colours, draws text
    and borders, and places images, like painting each sheet of an animation cel.


    ## How it works

    - The browser walks the layout tree in **stacking order** (z-index, positioned elements, stacking
    contexts).

    - It records a list of draw commands ("display list") for each layer.

    - **Rasterisation** turns those commands into pixels, often in tiles and on the GPU.

    - Then **compositing** combines layers.

    - Paint-only changes: `color`, `background`, `box-shadow`, `visibility`, `outline`. Expensive effects:
    large blurs, big shadows, filters on large areas.

    - Changes to `transform` / `opacity` on their own layer skip paint.


    ## Example

    ```css

    /* repaints the button on hover: fine, it is small */

    .btn:hover { background: #0057d9; }

    /* repaints a full-screen area every frame: costly */

    .hero { animation: glow 1s infinite; }

    @keyframes glow { to { box-shadow: 0 0 80px gold; } }

    ```

    Animating the opacity of a pre-drawn glow layer would avoid repainting.


    ## Common mistakes

    - Treating paint and composite as the same step.

    - Animating paint-heavy properties on large regions.

    - Ignoring that large paints hurt INP when they follow an interaction.


    ## In the interview

    Place paint in the pipeline and give examples of what triggers it. Mention DevTools "Paint flashing"
    to find repaints. Follow-ups: stacking contexts, `will-change`, and how `content-visibility: auto`
    skips painting off-screen content.

    '
