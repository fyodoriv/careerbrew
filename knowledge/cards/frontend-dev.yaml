  prompt: 1f344914
- id: kb-aab08b5a458c
  question: How do PureComponent and React.memo differ from normal components?
  answer: '`React.memo` (for function components) and `PureComponent` (for classes) skip re-rendering
    when the new props (and, for `PureComponent`, state) are shallowly equal to the previous ones. Normal
    components re-render whenever their parent re-renders. They are an optimization, useful only when
    renders are expensive and props are stable.'
  topic: frontend dev
  tags:
  - react
  - performance
  - memo
  - rendering
  explanation: "## In plain words\nBy default, when a parent re-renders, React re-renders all its children,\
    \ even if their props did not change. Memoized components put a guard at the door: \"same props as\
    \ last time? then reuse the previous result.\" The guard checks props quickly but only one level deep.\n\
    \n## How it works\n- `const Fast = React.memo(Comp)` compares each prop with `Object.is`. If all are\
    \ equal, React reuses the last output.\n- Optional second argument: a custom `arePropsEqual(prev,\
    \ next)` function.\n- `PureComponent` implements `shouldComponentUpdate` with a shallow comparison\
    \ of props and state.\n- They still re-render when their own state changes or a context they read\
    \ changes.\n- Shallow comparison means new objects, arrays, or functions created by the parent each\
    \ render break the memo. Stabilize them with `useMemo` and `useCallback`, or pass primitives.\n- Costs:\
    \ the comparison itself and extra memory; on cheap components it can be slower.\n- React Compiler\
    \ can apply memoization automatically.\n\n## Example\n```jsx\nconst Row = React.memo(function Row({\
    \ item, onSelect }) {\n  return <li onClick={() => onSelect(item.id)}>{item.name}</li>;\n});\n\nfunction\
    \ List({ items }) {\n  const [selected, setSelected] = useState(null);\n  const onSelect = useCallback((id)\
    \ => setSelected(id), []);\n  return <ul>{items.map((i) => <Row key={i.id} item={i} onSelect={onSelect}\
    \ />)}</ul>;\n}\n```\nWithout `useCallback`, a new `onSelect` each render would make every `Row` re-render.\n\
    \n## Common mistakes\n- Wrapping everything in `memo` without measuring.\n- Passing inline objects\
    \ or arrow functions to memoized children.\n- Thinking `memo` prevents re-renders from context or\
    \ internal state.\n- Using `memo` to fix correctness problems; it is only an optimization and React\
    \ may ignore it in future.\n\n## In the interview\nExplain shallow comparison and when memo helps.\
    \ Show the stable-callback pairing. Follow-ups: `memo` versus `useMemo`, writing a custom comparator,\
    \ alternatives like moving state down, and how you would use the Profiler to prove the gain.\n"
