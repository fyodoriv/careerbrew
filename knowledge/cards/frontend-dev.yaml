    \ React decides which to do from the component's type, position, and key.\n\n## How it works\n- **Re-render**:\
    \ triggered by state, props, or context changes. Hooks keep their values; effects re-run only if dependencies\
    \ changed.\n- **Remount**: happens when the component type at a position changes, when it is removed\
    \ and added back, or when its `key` changes.\n  - Unmount: effect cleanups run, state and refs are\
