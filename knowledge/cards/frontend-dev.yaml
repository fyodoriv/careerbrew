  question: How do you make sure useEffect or useMemo re-runs when an array or object dependency changes?
  answer: React compares dependencies with `Object.is`, so it only sees a change when the reference changes.
    Update arrays and objects immutably (create new ones) so changes are detected, and avoid creating
    new objects on every render when nothing changed, which would re-run the effect every time.
  topic: frontend dev
  tags:
  - react
  - hooks
  - useeffect
  - immutability
  explanation: "## In plain words\nReact does not look inside arrays or objects in the dependency list;\
    \ it only checks \"is this the same object as last time?\". If you change an array in place, it is\
    \ still the same object, so React thinks nothing happened. If you create a fresh object every render,\
    \ React thinks something always changed.\n\n## How it works\n- Dependencies are compared one by one\
    \ with `Object.is` (reference equality for objects).\n- **Missed updates**: mutating (`arr.push(x)`)\
    \ keeps the reference. Fix by replacing: `setArr([...arr, x])`.\n- **Too many runs**: an object literal\
    \ or array created in the component body is new each render. Fixes:\n  - Depend on primitive fields\
    \ instead (`user.id` rather than `user`).\n  - Memoize the object with `useMemo`, or functions with\
    \ `useCallback`.\n  - Move constants outside the component.\n  - Create the object inside the effect\
    \ itself.\n- Let the `react-hooks/exhaustive-deps` lint rule list the dependencies; do not silence\
    \ it.\n- Deep comparison hooks exist but are a last resort; they are slower and hide design problems.\n\
    \n## Example\n```jsx\nfunction Results({ filters }) {\n  // Re-runs only when a filter value changes,\
    \ not when the object is recreated\n  const { query, page } = filters;\n  useEffect(() => {\n    fetchResults({\
    \ query, page });\n  }, [query, page]);\n}\n\n// Parent: replace, do not mutate\nsetFilters((f) =>\
    \ ({ ...f, page: f.page + 1 }));\n```\n\n## Common mistakes\n- Mutating state and expecting effects\
    \ to fire.\n- Putting an inline object or function in the dependency list and creating an infinite\
    \ fetch loop.\n- Using `JSON.stringify(obj)` as a dependency on large objects.\n- Disabling the lint\
    \ rule instead of fixing the dependency.\n\n## In the interview\nExplain reference equality, then\
