    \ one failure ruining the rest. `allSettled` is a report card: it waits for everyone to finish and\
    \ then tells you who passed and who failed.\n\n## How it works\n- Each input is wrapped; when it settles,\
    \ its outcome object is stored at its index.\n- When all inputs have settled, the returned promise\
    \ fulfils with the full array.\n- It never rejects because of an input, so you must inspect `status`\
    \ yourself.\n- Good for independent work where partial success is fine: loading several widgets, sending\
    \ analytics batches, or bulk uploads with a per-item result.\n- Comparison:\n\n| Method | Fulfils\
    \ when | Rejects when |\n|---|---|---|\n| `all` | every input fulfils (array of values) | the first\
    \ input rejects |\n| `allSettled` | every input settles (array of outcome objects) | never |\n| `any`\
    \ | the first input fulfils | every input rejects (`AggregateError`) |\n| `race` | the first input\
    \ settles, if it fulfilled | the first input settles, if it rejected |\n\n## Example\n```js\nconst\
