  question: What are event capturing, bubbling, and event delegation?
  answer: 'A DOM event travels in three phases: capture (from `window` down to the target), target, and
    bubble (back up to `window`). Event delegation uses bubbling: you attach one listener to a parent
    and use `event.target` to handle events from many children, including ones added later.'
  topic: frontend dev
  tags:
  - dom
  - events
  - javascript
  - event-delegation
  explanation: "## In plain words\nWhen you click a button inside a list inside a page, you also clicked\
    \ the list and the page. The browser models this by sending the event down the tree first (capturing),\
    \ then delivering it to the button (target), then sending it back up (bubbling). Delegation means\
    \ letting a parent handle clicks for all its children instead of giving every child its own listener.\n\
    \n## How it works\n- **Capture phase**: listeners registered with `{ capture: true }` run on ancestors,\
    \ outermost first.\n- **Target phase**: listeners on the element itself run.\n- **Bubble phase**:\
    \ normal listeners run on ancestors, innermost first. Most events bubble; some, like `focus`, `blur`,\
    \ `mouseenter`, do not (use `focusin`/`focusout` instead).\n- `event.target` is the element where\
    \ the event started; `event.currentTarget` is the element whose listener is running.\n- `stopPropagation()`\
    \ stops further travel; `preventDefault()` only cancels the browser default action.\n- **Delegation**:\
    \ one listener on a container; use `event.target.closest(selector)` to find the relevant child. Benefits:\
    \ fewer listeners, and it works for elements added later.\n\n## Example\n```js\nconst list = document.querySelector(\"\
    #todo\");\nlist.addEventListener(\"click\", (e) => {\n  const btn = e.target.closest(\"button.delete\"\
    );\n  if (!btn || !list.contains(btn)) return;\n  btn.closest(\"li\").remove();\n});\n```\nOne listener\
    \ handles delete buttons in every row, even rows created after this code ran.\n\n## Common mistakes\n\
    - Confusing `target` with `currentTarget`.\n- Using `e.target.matches(...)` when the click lands on\
    \ a child icon inside the button; `closest` fixes this.\n- Calling `stopPropagation()` casually, which\
    \ breaks delegation and analytics higher up.\n- Expecting non-bubbling events such as `focus` to delegate.\n\
    \n## In the interview\nDraw the three phases, then give delegation as the practical payoff. Mention\
    \ trade-offs: delegation saves memory and handles dynamic content, but handlers become slightly more\
    \ complex. Expect follow-ups on how React attaches its listeners at the root, and on `stopPropagation`\
    \ versus `preventDefault`.\n"
