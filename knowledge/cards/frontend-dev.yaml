  question: When is the cleanup function of useEffect called?
  answer: React calls an effect's cleanup before running that effect again with new dependencies, and
    when the component unmounts. In development Strict Mode it also runs once right after the first mount,
    to check that cleanup is correct.
  topic: frontend dev
  tags:
  - react
  - hooks
  - effects
  explanation: "## In plain words\nAn effect that starts something (a timer, a subscription) should stop\
    \ it. The function you return from `useEffect` is that \"stop\" step, and React calls it whenever\
    \ the effect's old version is about to be replaced or removed.\n\n## How it works\nSequence for `useEffect(()\
    \ => { start(); return stop; }, [id])`:\n1. Mount: `start()` with id = 1.\n2. Re-render with id =\
    \ 2: after commit, React runs `stop()` from the id = 1 effect, then `start()` with id = 2.\n3. Re-render\
    \ with the same id: nothing runs.\n4. Unmount: `stop()` from the last effect.\n- The cleanup closes\
    \ over the values from its own render, so it stops the right thing.\n- Strict Mode (development only):\
    \ mount → cleanup → mount, to surface missing cleanups.\n- `useLayoutEffect` cleanups follow the same\
    \ rules but run synchronously before paint.\n\n## Example\n```jsx\nfunction Status({ userId }) {\n\
    \  const [online, setOnline] = React.useState(false);\n  React.useEffect(() => {\n    const unsubscribe\
    \ = presence.subscribe(userId, setOnline);\n    return () => unsubscribe();        // runs when userId\
    \ changes or on unmount\n  }, [userId]);\n  return <span>{online ? \"online\" : \"offline\"}</span>;\n\
    }\n```\n\n## Common mistakes\n- Thinking cleanup runs only on unmount.\n- Missing cleanup for timers,\
    \ listeners, or fetches, causing leaks or state updates on unmounted components.\n- Assuming the Strict\
    \ Mode double run happens in production.\n\n## In the interview\nWalk the sequence with dependencies\
    \ changing. Mention aborting fetches with `AbortController` in cleanup to avoid races. Follow-ups:\
    \ why the cleanup sees old props, and the order of cleanups between parent and child.\n"
