- id: kb-a8a7454b7323
  question: What is CSS flexbox?
  answer: 'Flexbox is a one-dimensional CSS layout model: a flex container lays its children out along
    a main axis (row or column), and properties like justify-content, align-items, flex-grow, flex-shrink,
    flex-basis, and gap control spacing, alignment, and how items share space.'
  topic: frontend dev
  tags:
  - css
  - layout
  - flexbox
  explanation: '## In plain words

    Flexbox arranges items in a line, either across or down, and decides how they stretch, shrink, and
    align. It made things like vertical centring and equal-height columns simple.


    ## How it works

    - Turn it on with `display: flex` on the parent; children become flex items.

    - **Axes**: `flex-direction` sets the main axis (`row` default, `column`); the cross axis is perpendicular.

    - **Main axis alignment**: `justify-content` (start, center, space-between…).

    - **Cross axis alignment**: `align-items` for all, `align-self` for one item.

    - **Wrapping**: `flex-wrap: wrap`; then `align-content` aligns the lines.

    - **Sizing**: `flex: <grow> <shrink> <basis>`; `flex: 1` means grow equally from a basis of 0.

    - `gap` adds space between items; `order` changes visual order only.


    ## Example

    ```css

    .toolbar { display: flex; align-items: center; gap: 8px; }

    .toolbar .spacer { flex: 1; }          /* pushes later items to the right */

    .center { display: flex; justify-content: center; align-items: center; height: 100vh; }

    ```

    ```html

    <div class="toolbar"><button>Back</button><span class="spacer"></span><button>Save</button></div>

    ```


    ## Common mistakes

    - Mixing up `justify-content` and `align-items` after switching to `flex-direction: column`.

    - Text overflowing because flex items default to `min-width: auto`; set `min-width: 0`.

    - Using flexbox for two-dimensional grids where CSS Grid fits better.

    - Relying on `order`, which breaks keyboard and screen reader order.


    ## In the interview

    Contrast with Grid: flexbox is content-out and one-dimensional, Grid is layout-in and two-dimensional.
    Expect a live "centre this" or "build a navbar" task and questions on `flex: 1` vs `flex: auto`.

    '
