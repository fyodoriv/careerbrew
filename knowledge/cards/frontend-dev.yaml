  question: When is it acceptable to use an array index as a React key?
  answer: 'An index key is fine only when the list is static: items are never reordered, inserted, or
    removed except at the end, and items have no state or uncontrolled inputs. Otherwise use a stable
    unique id from the data.'
  topic: frontend dev
  tags:
  - react
  - keys
  - lists
  explanation: "## In plain words\nKeys tell React which item is which between renders. An index says\
    \ \"the first one is still the first one\", which is true only if the list never shifts. When items\
    \ move, index keys make React attach the wrong state to the wrong item.\n\n## How it works\n- React\
    \ matches old and new children by key and reuses the component instance and DOM node for equal keys.\n\
    - With index keys, inserting at the top gives every item a new index, so each instance receives a\
    \ different item's props while keeping its old internal state.\n- Safe when all of these hold:\n \
    \ - the list is static or only appended to;\n  - it is never sorted or filtered;\n  - items have no\
    \ local state, focus, or uncontrolled inputs.\n- Otherwise, use ids from the data, or generate them\
    \ once when items are created (not during render).\n\n## Example\nSafe:\n```jsx\n{[\"Mon\", \"Tue\"\
    , \"Wed\"].map((d, i) => <th key={i}>{d}</th>)}\n```\nRisky: a todo list with `<input defaultValue={todo.text}\
    \ />` keyed by index. Delete the first todo and the first input now shows the old first text next\
    \ to the second todo's label.\n\n## Common mistakes\n- Using `Math.random()` as a key, which remounts\
    \ every item on every render.\n- Thinking keys only silence a warning.\n- Using index keys for sortable\
    \ tables.\n\n## In the interview\nGive the three conditions and the input-state bug. Mention that\
    \ keys must be unique among siblings only. Follow-ups: what happens without a key (React uses index\
    \ and warns), and using `key` to reset a component.\n"
