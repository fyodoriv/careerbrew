  question: How does CSS position work (static, relative, absolute, fixed, sticky)?
  answer: '`static` is the default and ignores offsets. `relative` shifts an element from its normal spot
    while keeping its space. `absolute` removes it from the flow and places it relative to the nearest
    positioned ancestor. `fixed` positions it relative to the viewport. `sticky` acts relative until a
    scroll threshold, then sticks.'
  topic: frontend dev
  tags:
  - css
  - layout
  - positioning
  explanation: '## In plain words

    Normally elements are laid out one after another, like words on a page. The `position` property lets
    you nudge or lift an element out of that flow. The key question for each value is: "relative to what
    do `top`, `left`, `right`, and `bottom` measure?"


    ## How it works

    - `static`: normal flow; `top`/`left` and `z-index` have no effect.

    - `relative`: stays in the flow (its original space is kept) but is drawn offset by `top`/`left`.
    Often used only to become the containing block for absolute children.

    - `absolute`: removed from the flow (others close the gap). Offsets are measured from the nearest
    ancestor whose `position` is not `static`, otherwise from the initial containing block.

    - `fixed`: removed from the flow and placed relative to the viewport, so it stays put while scrolling.
    A `transform` or `filter` on an ancestor changes this and makes it act like absolute.

    - `sticky`: behaves as relative until the element would scroll past an offset (such as `top: 0`),
    then sticks within its parent. It needs an offset and fails if an ancestor has `overflow: hidden`.

    - Positioned elements create stacking contexts with `z-index`.


    ## Example

    ```css

    .card { position: relative; }

    .badge { position: absolute; top: 8px; right: 8px; } /* corner of .card */

    .header { position: sticky; top: 0; }                /* sticks while scrolling */

    .toast { position: fixed; bottom: 16px; right: 16px; }

    ```


    ## Common mistakes

    - Forgetting `position: relative` on the parent, so an absolute child jumps to the page corner.

    - Expecting `sticky` to work without `top` or inside an `overflow: hidden` ancestor.

    - Being surprised that a `transform` on an ancestor breaks `position: fixed`.

    - Fighting `z-index` without understanding stacking contexts.


    ## In the interview

    Answer by giving, for each value, whether it stays in the flow and what it is positioned against.
    Show the badge-in-card example; it is the most common real use. Follow-ups: stacking contexts and
    `z-index`, why a sticky header does not stick, and when to prefer flexbox or grid for layout instead
    of positioning.

    '
