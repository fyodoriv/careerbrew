- id: kb-c5ad9e691b01
  question: What is CSS selector specificity, and how does it work?
  answer: Specificity decides which rule wins when several match the same element. It is compared as a
    tuple (IDs, classes/attributes/pseudo-classes, elements/pseudo-elements); higher wins, ties go to
    the rule that appears later. Inline styles and !important override it.
  topic: frontend dev
  tags:
  - css
  - specificity
  - cascade
  explanation: '## In plain words

    When two CSS rules disagree about a property, the browser needs a tie-breaker. Specificity is a score
    for how precisely a selector targets an element; the more precise selector wins.


    ## How it works

    Count three columns (A, B, C) and compare left to right:

    - **A**: ID selectors (`#nav`).

    - **B**: classes (`.btn`), attributes (`[type=text]`), pseudo-classes (`:hover`).

    - **C**: type selectors (`p`) and pseudo-elements (`::before`).

    - `*` and combinators add nothing. `:where()` adds zero; `:is()`, `:not()`, `:has()` take the specificity
    of their most specific argument.

    Order of the cascade, roughly: origin and `!important` → cascade layers (`@layer`) → specificity →
    source order. Inline `style=""` beats any selector; `!important` beats normal declarations.


    ## Example

    ```css

    #main .card p    { color: red;  }  /* (1,1,1) */

    .page .card p    { color: blue; }  /* (0,2,1) */

    p.highlight      { color: green;}  /* (0,1,1) */

    ```

    A `<p class="highlight">` inside `#main .card` is red: one ID beats any number of classes.


    ## Common mistakes

    - Adding numbers as decimals ("11 classes beat 1 ID"); columns never carry over.

    - Fixing conflicts with `!important`, which starts an arms race.

    - Forgetting that later rules win only when specificity ties.


    ## In the interview

    Show the tuple method and a quick example. Mention keeping specificity low and flat (BEM, utility
    classes), `:where()` for zero-specificity resets, and `@layer` for ordering libraries vs app styles.
    Follow-up: how inheritance differs from the cascade.

    '
