  question: Implement a classnames utility function
  answer: 'Accept any number of arguments and build a space-separated string: keep truthy strings and
    numbers, include object keys whose values are truthy, flatten arrays recursively, and skip everything
    falsy. The result has no extra spaces.'
  topic: frontend dev
  tags:
  - javascript
  - implementation
  - css
  - utilities
  explanation: "## In plain words\n`classnames` (or `clsx`) is a tiny helper that builds a `className`\
    \ string from conditions, so you can write `cx(\"btn\", { active: isActive })` instead of messy string\
    \ concatenation. Implementing it tests careful type checks and recursion.\n\n## How it works\n- Collect\
    \ parts in an array, then `join(\" \")` at the end; this avoids leading or double spaces.\n- For each\
    \ argument:\n  - Falsy (`false`, `null`, `undefined`, `0`, `\"\"`): skip.\n  - String or number: push\
    \ it.\n  - Array: recurse and push the result if not empty.\n  - Object: for each own key with a truthy\
    \ value, push the key.\n- Complexity: O(n) in the total number of values, including nested ones; O(n)\
    \ extra space for the parts.\n- Optional extras: dedupe classes, or support objects with a custom\
    \ `toString`.\n\n## Example\n```js\nfunction classNames(...args) {\n  const out = [];\n  for (const\
    \ arg of args) {\n    if (!arg) continue;\n    if (typeof arg === \"string\" || typeof arg === \"\
    number\") {\n      out.push(arg);\n    } else if (Array.isArray(arg)) {\n      const inner = classNames(...arg);\n\
    \      if (inner) out.push(inner);\n    } else if (typeof arg === \"object\") {\n      for (const\
    \ key of Object.keys(arg)) {\n        if (arg[key]) out.push(key);\n      }\n    }\n  }\n  return\
    \ out.join(\" \");\n}\n\nconsole.log(classNames(\"btn\", { active: true, hidden: false }, [\"lg\"\
    , [null, \"x\"]]));\n// \"btn active lg x\"\n```\n\n## Common mistakes\n- Concatenating strings and\
    \ leaving trailing or double spaces.\n- Treating arrays as objects (`typeof [] === \"object\"`), so\
    \ array indexes become class names.\n- Iterating inherited keys with `for...in` without checking ownership.\n\
    - Forgetting deep nesting of arrays.\n\n## In the interview\nClarify the expected behavior with examples\
    \ first (numbers, nested arrays, falsy values), then code. State the complexity and write a few quick\
    \ test calls. Follow-ups: deduplication with a `Set`, TypeScript types for the arguments, or performance\
    \ when called on every render.\n"
