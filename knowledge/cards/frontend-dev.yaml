    \ `repeat(3, 1fr)` repeats.\n- **Responsive without media queries**: `repeat(auto-fill, minmax(200px,\
    \ 1fr))` creates as many columns as fit.\n- **Gaps**: `gap: 1rem` (or `row-gap`, `column-gap`).\n\
    - **Placement**: `grid-column: 1 / 3` (from line 1 to line 3), `grid-column: span 2`, or named areas\
