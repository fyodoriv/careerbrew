- id: kb-9bd0b9ccce0a
  question: What is compositing in the browser rendering pipeline?
  answer: 'Compositing is the last rendering step: the page is split into layers that are painted separately,
    and the compositor (usually on the GPU and its own thread) combines them into the final frame. Changes
    to transform and opacity can be applied here without re-running layout or paint.'
  topic: frontend dev
  tags:
  - browser
  - rendering
  - performance
  - gpu
  explanation: '## In plain words

    Think of animation cels: each layer is a transparent sheet. Compositing stacks the sheets in the right
    order and position to make the picture. Moving a sheet is cheap; redrawing its contents is not.


    ## How it works

    - After layout and paint, some elements get their own **compositor layer**: ones with 3D transforms,
    `will-change: transform`, video, canvas, fixed elements, animated `opacity` or `transform`, and more.

    - Layers are rasterised into textures (often on the GPU).

    - The **compositor thread** positions, scales, and blends these textures every frame, separately from
    the main thread.

    - So animating `transform` / `opacity` stays smooth even when the main thread is busy; animating `top`,
    `width`, or `box-shadow` forces layout or paint on the main thread.


    ## Example

    ```css

    .drawer { transform: translateX(-100%); transition: transform 200ms ease; will-change: transform;
    }

    .drawer.open { transform: translateX(0); }

    ```

    Compare with animating `left: -300px → 0`, which runs layout on every frame and can drop frames on
    slow phones.


    ## Common mistakes

    - Adding `will-change` to everything; each layer costs GPU memory ("layer explosion").

    - Thinking all CSS animations are GPU-accelerated.

    - Forgetting that overlapping elements can be promoted to layers implicitly.


    ## In the interview

    Describe the pipeline order (style, layout, paint, composite) and say you animate compositor-only
    properties. Mention DevTools Layers and Rendering panels (paint flashing). Follow-ups: what triggers
    layer creation, and how this affects INP and battery.

    '
