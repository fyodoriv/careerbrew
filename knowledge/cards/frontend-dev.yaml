    \ onto the stage for the first time: the result is actually put into the page.\n\n## How it works\n\
    - **Render**: React calls the component function (or a class's `render`) and gets React elements.\
    \ This is pure computation, and React may do it many times, or even throw the result away (Strict\
    \ Mode renders twice in development).\n- **Commit**: React compares the new elements to the previous\
    \ ones and applies the minimal DOM changes.\n- **Mount**: the first commit for a component instance.\
    \ DOM nodes are created, refs are attached, then effects run (`useLayoutEffect`, then `useEffect`).\n\
    - **Update**: later renders that commit changes to an already-mounted instance.\n- **Unmount**: the\
