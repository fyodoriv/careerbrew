    \      {shown.map((m, i) => <p key={i} style={{ opacity: m.sending ? 0.5 : 1 }}>{m.text}</p>)}\n \
    \     <input name=\"text\" />\n    </form>\n  );\n}\n```\n\n## Common mistakes\n- Calling the setter\
    \ outside an action or transition: React logs a warning, and the optimistic value is dropped at once\
    \ instead of staying while the work runs.\n- Forgetting to update the real state, so the item vanishes\
    \ after success.\n- No error message when the optimistic value is rolled back.\n\n## In the interview\n\
    Explain the UX benefit and the rollback behaviour. Mention it fits likes, chat messages, and toggles\
    \ but not payments. Follow-ups: how libraries like TanStack Query do optimistic updates, and conflict\
