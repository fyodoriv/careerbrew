  question: How does the setter from useState work?
  answer: The setter schedules a re-render with a new state value; it does not change the variable in
    the current render. You can pass a value or an updater function `prev => next`. React batches updates,
    skips the render if the new value is identical (`Object.is`), and the setter's identity is stable.
  topic: frontend dev
  tags:
  - react
  - hooks
  - usestate
  - state
  explanation: "## In plain words\n`useState` returns a snapshot: the value for this render plus a function\
    \ to request a different value next time. Calling the setter is like dropping a note in React's inbox\
    \ saying \"next render, use this\". The current render keeps the old snapshot until it finishes.\n\
    \n## How it works\n- `setX(value)` replaces the state (no merging, unlike class `setState`). For objects,\
    \ spread the old fields yourself.\n- `setX(prev => next)` queues an updater; React runs queued updaters\
    \ in order with the latest pending value. Use it when the next state depends on the previous.\n- Updates\
    \ are batched: several calls in one event produce one render. Since React 18 this also applies inside\
    \ promises and timeouts.\n- If the new value is the same as the current one by `Object.is`, React\
    \ can bail out without re-rendering children.\n- The setter function is stable, so it is safe to omit\
    \ from effect dependencies.\n- Initial value: `useState(() => expensive())` runs the initializer only\
    \ once.\n\n## Example\n```jsx\nfunction Counter() {\n  const [n, setN] = useState(0);\n  function\
    \ addThree() {\n    setN(n + 1); setN(n + 1); setN(n + 1);    // ends at 1\n  }\n  function addThreeCorrectly()\
    \ {\n    setN((p) => p + 1); setN((p) => p + 1); setN((p) => p + 1); // ends at 3\n  }\n  return <button\
    \ onClick={addThreeCorrectly}>{n}</button>;\n}\n```\n\n## Common mistakes\n- Reading the state right\
    \ after setting it and expecting the new value.\n- Mutating an object or array and calling the setter\
    \ with the same reference (no re-render).\n- Passing `useState(expensive())` instead of a lazy initializer.\n\
    - Storing a function in state with `setFn(myFn)`, which React treats as an updater; use `setFn(()\
    \ => myFn)`.\n\n## In the interview\nExplain snapshot semantics and the updater form with the \"add\
    \ three\" example. Mention batching and `Object.is` bail-out. Expect follow-ups on why state looks\
    \ stale in closures (timers, effects), when to use `useReducer` instead, and how `flushSync` forces\
    \ a synchronous update.\n"
