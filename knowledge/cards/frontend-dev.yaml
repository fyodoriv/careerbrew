- id: kb-0f5616aba531
  question: What is the virtual DOM?
  answer: The virtual DOM is a lightweight in-memory tree of plain objects describing the UI. On each
    update a library like React builds a new tree, diffs it against the previous one, and applies only
    the needed changes to the real DOM.
  topic: frontend dev
  tags:
  - react
  - virtual-dom
  - rendering
  explanation: '## In plain words

    Editing the real DOM by hand for every change is error-prone. With a virtual DOM you describe the
    whole UI for the current state, and the library works out the smallest set of real DOM edits, like
    a diff tool for the page.


    ## How it works

    1. A render produces a tree of elements, for example `{ type: "li", props: { children: "Milk" } }`.

    2. On state change, a new tree is produced.

    3. **Diffing (reconciliation)** compares old and new trees with heuristics: different element types
    mean replace the subtree; same type means update attributes and recurse; `key`s match list items.

    4. The **commit** applies the minimal DOM operations in a batch.

    The benefit is a simple declarative model with reasonable performance, not speed beyond hand-written
    DOM code.


    ## Example

    State changes from `["Milk", "Eggs"]` to `["Milk", "Bread"]`:

    ```jsx

    <ul>{items.map(i => <li key={i}>{i}</li>)}</ul>

    ```

    React sees the `Milk` item unchanged, removes the `Eggs` `<li>`, and inserts a `Bread` `<li>`; it
    does not rebuild the list.


    ## Common mistakes

    - Claiming the virtual DOM is always faster than direct DOM manipulation.

    - Confusing it with the Shadow DOM, which is about style and markup encapsulation.

    - Ignoring that the diff itself costs CPU on large trees.


    ## In the interview

    Explain declarative UI plus diffing, and the O(n) heuristics. Mention that Svelte and Solid skip the
    virtual DOM by compiling or using fine-grained signals. Follow-ups: keys, `React.memo`, and Fiber''s
    ability to split work into chunks.

    '
