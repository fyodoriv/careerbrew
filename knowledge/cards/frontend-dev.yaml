- id: kb-046839fbaceb
  question: Are invisible elements still part of the DOM tree?
  answer: 'Yes. Elements hidden with `display: none`, `visibility: hidden`, `opacity: 0`, or the `hidden`
    attribute stay in the DOM and can be queried by JavaScript. What differs is layout, painting, interaction,
    and whether assistive technology sees them.'
  topic: frontend dev
  tags:
  - dom
  - css
  - accessibility
  - rendering
  explanation: "## In plain words\nThe DOM is the tree of nodes built from your HTML; CSS only decides\
    \ how each node is drawn. Hiding something with CSS is like turning off a lamp: the lamp is still\
    \ in the room. Only removing the node (for example `element.remove()` or not rendering it in React)\
    \ takes it out of the tree.\n\n## How it works\n- `display: none` (also the `hidden` attribute): the\
    \ node is in the DOM but not in the render tree. It takes no space, gets no clicks, and is hidden\
    \ from screen readers.\n- `visibility: hidden`: the box keeps its space in the layout but is not painted,\
    \ cannot be clicked, and is hidden from screen readers. A child can override it with `visibility:\
    \ visible`.\n- `opacity: 0`: fully laid out and still interactive; it can receive clicks and focus,\
    \ and screen readers still read it.\n- Off-screen tricks (a \"visually hidden\" class) hide content\
    \ from the eye but keep it for screen readers.\n- All of these nodes can still be found with `querySelector`\
    \ and changed by scripts.\n\n## Example\n```html\n<p id=\"a\" style=\"display:none\">A</p>\n<p id=\"\
    b\" style=\"visibility:hidden\">B</p>\n<p id=\"c\" style=\"opacity:0\">C</p>\n<script>\n  console.log(document.querySelectorAll(\"\
    p\").length); // 3\n</script>\n```\nOnly `#c` can still be clicked; `#b` and `#c` still take up space.\n\
    \n## Common mistakes\n- Saying hidden elements are removed from the DOM.\n- Using `opacity: 0` to\
    \ hide a button and leaving it clickable and focusable.\n- Hiding labels with `display: none` when\
    \ they should stay available to screen readers.\n- Forgetting that `display: none` content is not\
    \ measured, so `offsetHeight` returns 0.\n\n## In the interview\nSeparate the DOM tree, the render\
    \ tree, and the accessibility tree; that framing answers most follow-ups. Mention which option keeps\
    \ layout space, which keeps interaction, and the visually-hidden pattern for accessible text. You\
    \ may be asked about performance: toggling `display` causes layout, while animating `opacity` is cheap\
    \ because it can run on the compositor.\n"
