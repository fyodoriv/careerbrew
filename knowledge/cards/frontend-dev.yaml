  question: How do you read and control the value of an input in React?
  answer: 'In a controlled input, React state is the source of truth: you pass `value={state}` and update
    it in `onChange` with `e.target.value`. The current value is therefore always in state. For checkboxes
    use `e.target.checked`; for uncontrolled inputs, read the DOM value through a ref or `FormData`.'
  topic: frontend dev
  tags:
  - react
  - forms
  - controlled-components
  - events
  explanation: "## In plain words\nA controlled input is like a puppet: it shows whatever value React\
    \ gives it, and each keystroke asks React to update that value. Because the value lives in state,\
    \ you can validate, format, or reset it at any time.\n\n## How it works\n- `const [text, setText]\
    \ = useState(\"\")`.\n- `<input value={text} onChange={(e) => setText(e.target.value)} />`.\n- React's\
    \ `onChange` fires on every keystroke (like the native `input` event).\n- Checkboxes and radios use\
    \ `checked` and `e.target.checked`.\n- `e.target.value` is always a string; convert numbers with `Number()`\
    \ or use `valueAsNumber`.\n- If you pass `value` without `onChange`, the input becomes read-only and\
    \ React warns.\n- Switching between `undefined` and a defined `value` causes the \"uncontrolled to\
    \ controlled\" warning; initialize with `\"\"`.\n- Uncontrolled alternative: `defaultValue` plus a\
    \ ref, or read values with `new FormData(form)` on submit (also how React 19 form actions work).\n\
    \n## Example\n```jsx\nfunction NameForm() {\n  const [name, setName] = useState(\"\");\n  function\
    \ handleSubmit(e) {\n    e.preventDefault();\n    console.log(\"Submitting\", name.trim());\n  }\n\
    \  return (\n    <form onSubmit={handleSubmit}>\n      <input value={name} onChange={(e) => setName(e.target.value)}\
    \ />\n      <button disabled={!name.trim()}>Save</button>\n    </form>\n  );\n}\n```\n\n## Common\
    \ mistakes\n- Reading `e.target.value` later in an async callback instead of saving it first; by then\
    \ the input may hold a newer value (and before React 17, pooled events were already cleared).\n- Initializing\
    \ state as `undefined` or `null`.\n- Using `value` for checkboxes.\n- Forgetting that the value is\
    \ a string.\n\n## In the interview\nShow the controlled pattern and explain the single source of truth.\
    \ Mention when uncontrolled inputs are better (large forms, file inputs, form libraries like React\
