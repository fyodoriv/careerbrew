  question: How do you deep copy an object in JavaScript?
  answer: Use `structuredClone(obj)`, which copies nested objects, arrays, `Date`, `Map`, `Set`, and circular
    references. `JSON.parse(JSON.stringify(obj))` is the old trick but loses functions, `undefined`, `Date`
    types, `Map`/`Set`, and fails on cycles. Spread and `Object.assign` are only shallow copies.
  topic: frontend dev
  tags:
  - javascript
  - objects
  - cloning
  - immutability
  explanation: "## In plain words\nA shallow copy duplicates the outer box but still shares every box\
    \ inside it, so changing a nested value changes both. A deep copy duplicates every level, so the two\
    \ objects are fully independent.\n\n## How it works\n- **Shallow**: `{ ...obj }`, `Object.assign({},\
    \ obj)`, `[...arr]`, `arr.slice()`. Fast, but nested objects are shared.\n- **`structuredClone`**\
    \ (built into browsers and Node 17+):\n  - Copies plain objects, arrays, `Date`, `RegExp`, `Map`,\
    \ `Set`, typed arrays, and handles circular references.\n  - Throws on functions, DOM nodes, and some\
    \ class instances; class prototypes are not kept (you get plain objects).\n- **JSON round trip**:\n\
    \  - Drops functions, `undefined`, and symbols; turns `Date` into strings, `NaN`/`Infinity` into `null`;\
    \ throws on cycles and `BigInt`.\n- **Libraries**: lodash `cloneDeep` handles more edge cases.\n-\
    \ Often you do not need a deep copy at all: in immutable updates, copy only the path you change.\n\
    \n## Example\n```js\nconst original = { when: new Date(0), tags: new Set([\"a\"]), nested: { n: 1\
    \ } };\noriginal.self = original;\n\nconst copy = structuredClone(original);\ncopy.nested.n = 2;\n\
    \nconsole.log(original.nested.n);      // 1\nconsole.log(copy.when instanceof Date); // true\nconsole.log(copy.self\
    \ === copy);     // true\n```\n\n## Common mistakes\n- Calling spread a deep copy.\n- Using the JSON\
    \ trick on data with dates or `undefined` and silently losing data.\n- Deep-copying large state trees\
    \ on every update instead of copying only the changed path.\n- Expecting class methods to survive\
    \ `structuredClone`.\n\n## In the interview\nContrast shallow and deep, recommend `structuredClone`,\
    \ and list what the JSON trick loses. Complexity is O(n) in the size of the object for any deep copy.\
    \ Follow-ups: write a recursive deep clone that handles cycles with a `WeakMap`, or explain why immutable\
    \ updates copy only what changes.\n"
