- id: kb-430a9967be2c
  question: Do you enjoy solving problems more, or pushing the discussion forward?
  answer: 'Name your honest preference, show you can do both, and explain how each helps the team. For
    example: you love solving hard problems, and you have learned to drive discussions to decisions because
    solved problems are useless without alignment.'
  topic: behavioural
  tags:
  - self-awareness
  - working-style
  - fit
  explanation: '## In plain words

    This question explores your working style. Problem solvers go deep; discussion drivers create alignment
    and momentum. Teams need both, so the interviewer wants honesty plus evidence you can stretch to the
    other side.


    ## How it works

    - Answer directly: say which one energizes you more.

    - Give a short example of you doing that well.

    - Give a short example of you doing the other one when the team needed it.

    - Link your preference to the role you are applying for.


    ## Example

    *Fictional sample:* "I enjoy solving problems more; I like the moment a confusing bug finally makes
    sense. But I learned that a solution nobody agrees on goes nowhere. In one design review, the debate
    was looping, so I wrote the three options and their costs on one slide, asked each owner for their
    main concern, and we chose in 20 minutes. I now do that on purpose when discussions stall."


    ## Common mistakes

    - Treating it as a trick and refusing to choose.

    - Dismissing the other side as unimportant.

    - Answering with no example.

    - Picking the answer you think they want instead of the true one.


    ## In the interview

    Signals scored: self-awareness, flexibility, and fit with the role''s level. For senior roles, show
    that you can drive decisions. Expect "Tell me about a discussion you moved forward" as a follow-up,
    so have a short STAR story ready.

    '
