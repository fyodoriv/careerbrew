  - star
  explanation: '## In plain words

    Giving honest feedback is hard, so many people avoid it. The interviewer wants proof that you can
    say difficult things kindly and usefully, which helps teammates grow.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    A simple model: SBI, which stands for **Situation** (when and where), **Behavior** (what you observed),
    **Impact** (the effect). Then ask questions, listen, and agree on next steps. Private, timely, and
    specific beats saved-up or public feedback.


    ## Example

    *Fictional sample:* "A peer''s demos to stakeholders often ran over time and skipped the key decision.
    After one demo I asked for five minutes and said: ''In today''s demo, we spent 25 minutes on setup,
    and the product team left before deciding on the launch scope. That cost us a week.'' She agreed and
    said she was unsure what to cut. We drafted a three-slide format together. Her next demo took 15 minutes
    and ended with a decision. She later gave me useful feedback on my design docs."


    ## Common mistakes

    - Feedback about personality ("you are disorganized").

    - Saving it for a performance review.

    - Sandwiching the message so it disappears between compliments.

    - Not following up.


    ## In the interview

    Signals scored: courage, empathy, clarity, and coaching. Expect "What if they got defensive?" A good
    answer: stay calm, return to the specific facts, and ask what support would help.

