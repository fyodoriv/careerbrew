  question: What makes good-quality software?
  answer: Good software does what users need correctly and reliably, is easy to understand and change,
    is tested, secure, and performant enough for its purpose, and can be operated and debugged in production.
    Quality is fitness for purpose, not perfection.
  topic: behavioural
  tags:
  - quality
  - engineering-values
  - maintainability
  explanation: '## In plain words

    Quality means software that serves its users well today and can be changed safely tomorrow. The interviewer
    wants to hear a balanced view: correctness and user value, plus maintainability and operability.


    ## How it works

    Group the qualities:

    - **For users**: correct, reliable, fast enough, secure, accessible, usable.

    - **For engineers**: readable, simple, modular, well tested, documented where needed, easy to change.

    - **For operations**: observable (logs, metrics, traces), easy to deploy and roll back, fails gracefully.

    Then add the key idea: quality is fit for purpose. A prototype and a payments system need different
    bars. Also, quality is built by habits (review, tests, monitoring), not added at the end.


    ## Example

    *Fictional sample:* "To me good software is software I can trust and change. For example, on my last
    team the payment service had 90% test coverage but nobody could understand it, so every change took
    weeks. We simplified the main flow, added clear names and a short architecture note, and kept tests
    on the critical paths. Changes dropped from weeks to days, with no rise in incidents. That balance
    is what I aim for."


    ## Common mistakes

    - Equating quality with test coverage alone.

