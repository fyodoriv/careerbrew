- id: kb-cf135b9acc92
  question: Describe the best team you ever worked with. What made that experience stand out?
  answer: Name concrete traits of a great team, such as clear goals, psychological safety, honest feedback,
    and shared ownership, with one short example of each, then show how you helped create them and would
    bring them to the new team.
  topic: behavioural
  tags:
  - teamwork
  - culture
  - collaboration
  explanation: '## In plain words

    This question reveals what you value in a team and whether you help build a good culture or only enjoy
    it. Interviewers also check fit: the traits you praise should match how their team works.


    ## How it works

    - Pick two or three specific traits, not "everyone was nice".

    - Give one short, concrete example for each trait.

    - Say what you personally contributed to that culture.

    - Close with how you would bring it to the new role.

    A light STAR shape works: the situation, what the team did, your part, and the result.


    ## Example

    *Fictional sample:* "The best team I worked on had three things. First, a clear goal: we owned one
    metric, checkout conversion, and everyone knew it. Second, safety to disagree: in design reviews,
    juniors challenged the lead and were thanked for it. Third, shared ownership: whoever was free picked
    up the on-call bug. I helped by starting short written design notes so quiet people could comment.
    We raised conversion 8% in two quarters, and I want to build that same habit here."


    ## Common mistakes

    - Vague praise with no examples.

    - Describing a team where you were passive.

    - Criticizing your current team by contrast.

    - Listing traits that clash with how the hiring team works.


    ## In the interview

    Signals scored: self-awareness, collaboration, culture building, and fit. Expect "What made it fall
    apart, if it did?" and "How would you create that here?". Mention a research-backed term like psychological
    safety only if you can explain it in plain words.

    '
