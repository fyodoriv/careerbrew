- id: kb-2a6326f2d131
  question: How do you hand over work to someone else?
  answer: Write a handover doc covering status, context, open risks, contacts, and where things live;
    walk through it live; transfer access and ownership explicitly; pair on a real task; and stay reachable
    for a short overlap period.
  topic: behavioural
  tags:
  - handover
  - documentation
  - collaboration
  explanation: '## In plain words

    A handover moves knowledge, not just tickets. When it goes badly, work stalls and mistakes repeat.
    Interviewers want to see that you make the next person successful, whether you are leaving, going
    on vacation, or changing teams.


    ## How it works

    - **Write it down**: current status, decisions made and why, open issues, risks, next steps.

    - **Point to the sources**: repos, dashboards, runbooks, tickets, key contacts.

    - **Walk through it live**: a call to answer questions; record it if useful.

    - **Transfer ownership explicitly**: access, on-call rotation, alerts, announcements to stakeholders.

    - **Pair on a real task**: the receiver drives while you watch.

    - **Overlap**: stay reachable for a week or two, then step back.


    ## Example

    *Fictional sample:* "Before moving teams, I handed over our billing service. I wrote a two-page doc:
    architecture sketch, the three alerts that fire most and what to do, two half-finished tasks with
    notes, and the finance contact who reports issues. We did a one-hour walkthrough, then my successor
    handled the next deploy while I watched. I told stakeholders who the new owner was, and answered questions
    for two weeks. There were no gaps in support."


    ## Common mistakes

    - Handing over only a ticket list without context.

    - Forgetting access, alerts, and on-call.

    - Not telling stakeholders who the new owner is.

    - Disappearing immediately.


    ## In the interview

    Signals scored: ownership, empathy for the receiver, documentation habits, and reliability. Expect
    "How do you take over work from someone else?" Mirror the same checklist and add: "I ask what they
    would worry about if they were staying."

    '
