- id: kb-c27f147e7844
  question: How do you prioritize, especially when several things are all marked high priority?
  answer: 'Make the trade-off explicit: compare tasks by impact, urgency, cost of delay, and effort; check
    them against team goals; agree on the order with stakeholders or your manager; communicate what moves
    down; and revisit as things change.'
  topic: behavioural
  tags:
  - prioritization
  - stakeholders
  - decision-making
  explanation: '## In plain words

    When everything is "high priority", nothing is. The interviewer wants to see a clear method for ordering
    work and the courage to make trade-offs visible rather than trying to do everything at once.


    ## How it works

    - **List everything** in one place.

    - **Score each item**: impact (who and how much), urgency or cost of delay, effort, risk. Simple frameworks
    help: an urgent/important grid, or value divided by effort.

    - **Align with goals**: what supports this quarter''s objectives?

    - **Escalate the conflict, not the work**: ask the stakeholders or your manager to rank items when
    they conflict.

    - **Communicate**: say what is now and what is later, and why.

    - **Limit work in progress**: finish before starting new things.


    ## Example

    *Fictional sample:* "Three requests arrived marked urgent: a sales demo fix, a security patch, and
    a reporting bug. The patch had a known exploit, so it went first. The demo was in two days and blocked
    a deal, so it went second. The reporting bug affected one internal team and had a workaround. I posted
    the order in our channel with reasons and asked my manager to confirm. Everyone knew when to expect
    their fix."


    ## Common mistakes

    - Working on all of them at once.

    - Choosing by who shouts loudest.

    - Not telling people their item moved down.

    - No criteria, only gut feeling.


    ## In the interview

    Signals scored: judgment, transparency, stakeholder management, and focus. Expect "What if two executives
    disagree?" Answer: bring both into one conversation with the trade-offs on the table.

    '
