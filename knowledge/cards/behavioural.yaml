- id: kb-b86970840f11
  question: Describe your ideal manager.
  answer: Describe concrete manager behaviors that help you do your best work, such as clear goals, regular
    honest feedback, trust with autonomy, and support for growth, and show that you also adapt to different
    styles.
  topic: behavioural
  tags:
  - management
  - working-style
  - fit
  explanation: '## In plain words

    This question tests self-awareness and fit. The interviewer learns what you need to thrive and whether
    you might clash with their manager. They also check that you are not demanding a perfect boss.


    ## How it works

    - Name two or three behaviors, not personality traits.

    - Tie each to how it helps you do better work.

    - Give a short example from a past manager (no names needed).

    - Add how you adapt when a manager works differently.


    ## Example

    *Fictional sample:* "My ideal manager does three things. They make the goal clear and then trust me
    with the how. They give feedback often, including the uncomfortable kind; one manager told me my design
    docs were too long, and fixing that changed how people read my work. And they push for my growth,
    for example by giving me a stretch project. When a manager is more hands-off, I adapt by asking for
    a short feedback chat every two weeks."


    ## Common mistakes

    - Describing a manager who leaves you completely alone.

    - Criticizing current or past managers.

    - Asking for traits that clash with the team''s culture.

    - No sign that you take responsibility for the relationship.


    ## In the interview

    Signals scored: self-awareness, coachability, and fit. Expect "How do you handle a manager you disagree
    with?". It is fine to ask the interviewer later how their manager works; it shows the question matters
    to you.

    '
