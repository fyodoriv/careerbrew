  explanation: '## In plain words

    This tests self-awareness and a growth mindset. The interviewer wants to see that you notice good
    practices in others, know your gaps, and plan to close them, not just wish to improve.


    ## How it works

    - Name one specific skill (for example, writing concise design docs, running effective meetings, or
    debugging distributed systems).

    - Describe what you observed and why it impressed you.

    - Explain your current gap honestly.

    - Give a concrete plan and how you will know you improved.


    ## Example

    *Fictional sample:* "A senior engineer on my team is excellent at running design reviews: she states
    the decision needed in the first minute, timeboxes debate, and ends with owners and next steps. My
    reviews tend to drift. Over the next six months I plan to use a short template before each review,
    ask her to observe two of mine and give feedback, and track how many reviews end with a clear decision.
    Right now it is about half; I want it above 80%."


    ## Common mistakes

    - A vague skill like "leadership" with no detail.

    - A skill unrelated to the job.

    - No plan or measure.

    - A skill you clearly already have, as a humble brag.


    ## In the interview

    Signals scored: self-awareness, coachability, and initiative. Expect "What have you done so far?"
    Have one small step you already took. It is fine to keep the peer anonymous.

