  question: How do you stay productive as a developer?
  answer: Protect focus time, keep work small and visible, prioritize by impact, automate repetitive tasks,
    master your tools, unblock others quickly, and reflect regularly on what slowed you down.
  topic: behavioural
  tags:
  - productivity
  - habits
  - self-management
  explanation: '## In plain words

    Productivity is about delivering valuable outcomes, not typing faster or working longer. The interviewer
    wants to hear concrete habits that show you manage your time, focus, and energy.


    ## How it works

    Name a few concrete habits and why each helps:

    - **Focus blocks**: two or more hours without meetings or chat for deep work.

    - **Small batches**: small pull requests that are easier to review and ship.

    - **Prioritize by impact**: ask "what is the most valuable thing I can finish today?".

    - **Automate and learn tools**: scripts, shortcuts, a fast debugger setup.

    - **Unblock others first**: a quick review can save a teammate a day.

    - **Reflect**: a weekly look at what slowed you down.


    ## Example

    *Fictional sample:* "I block 9 to 11 every morning for coding with notifications off. I review teammates''
    pull requests right after lunch so nobody waits more than half a day. I noticed I lost an hour a week
    setting up test data, so I wrote a script that seeds it in ten seconds and shared it with the team.
    On Fridays I spend ten minutes noting what blocked me that week."


    ## Common mistakes

    - Equating productivity with long hours.

    - Listing tools with no habits behind them.

    - Ignoring team productivity.

    - Measuring output by lines of code.


    ## In the interview

    Signals scored: self-management, impact focus, and team awareness. Expect "How do you handle interruptions?"
    and "How do you measure your productivity?". Mention outcomes (features shipped, problems solved)
    rather than activity.

    '
