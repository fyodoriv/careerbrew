  question: Have you ever had to make an unpopular decision? How did you handle it?
  answer: Describe a decision you made for a good reason despite pushback, how you gathered input, explained
    the trade-off openly, and supported people through it. End with the outcome and how trust held up.
  topic: behavioural
  tags:
  - decision-making
  - leadership
  - communication
  - star
  explanation: '## In plain words

    This question tests whether you can make a call that some people dislike, and still keep their trust.
    Good engineers do not chase consensus forever, and they do not bulldoze either. The interviewer wants
    to see judgment plus empathy.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Explain why the decision was unpopular and who was affected.

    - Show that you listened first, then decided with clear reasoning.

    - Describe how you communicated it and what you did to reduce the pain.


    ## Example

    *Fictional sample:* "Our team wanted to keep adding features to a legacy service, but incidents were
    rising. As tech lead I decided on a two-sprint feature freeze to fix reliability. Product was unhappy.
    I shared incident data, showed the cost of on-call time, and offered to ship one small feature that
    blocked a sales deal. After the freeze, incidents dropped by 60% and the product manager later asked
    for a similar freeze on another service."


    ## Common mistakes

    - Choosing a decision that was unpopular only because it was wrong.

    - Painting the people who disagreed as foolish.

    - Skipping how you communicated; that is the heart of the question.

    - No reflection on what you would do differently.


    ## In the interview

    Signals scored: judgment, courage, stakeholder management, empathy, and follow-through. Expect "Who
    disagreed most and how did you handle them?" and "Would you make the same decision today?". Mention
    that you would revisit the decision if new data appeared; it shows you are firm but not stubborn.

    '
