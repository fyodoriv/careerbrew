  explanation: '## In plain words

    Interviewers want to know whether you can take sensible risks, and how you think when the outcome
    is uncertain. A calculated risk with a clear rationale scores far better than a reckless gamble that
    happened to work.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Explain the options and what made the choice risky.

    - Show how you decided: data you gathered, people you asked, how you capped the downside.

    - End with how it changed your approach to later decisions.


    ## Example

    *Fictional sample:* "Three years in, I left a stable backend role to join a five-person team building
    a new product inside the company. If the product failed, the team would be dissolved. I talked to
