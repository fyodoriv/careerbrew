  explanation: '## In plain words

    The interviewer checks ambition, self-awareness, and whether you are likely to stay and grow with
    them. They do not expect a precise plan, but they want a direction that fits the role.


    ## How it works

    - Describe the direction: deeper technical expertise, broader architecture scope, or people leadership.

    - Explain the motivation behind it.

    - Show how the next two to three years in this role help.

    - Stay flexible: say what you will learn along the way may adjust the path.


    ## Example

    *Fictional sample:* "In five years I see myself as a staff engineer: someone who shapes the architecture
    of a large system and helps several teams make good technical decisions. I enjoy both deep technical
    work and mentoring, and that role combines them. This position gives me a chance to own a core service
    and lead cross-team projects, which are the skills I need. In ten years, I am open to either a principal
    role or management, depending on what I learn I enjoy most."


    ## Common mistakes

    - "In your job" or other answers that sound threatening.

    - No plan at all.

    - Goals unrelated to the role, like starting your own unrelated business next year.

    - A rigid title-focused plan.


    ## In the interview

    Signals scored: ambition, self-awareness, and fit. Expect "How will you get there?" and "What support
    would you need?". Be honest; companies prefer realistic plans to flattering ones.

