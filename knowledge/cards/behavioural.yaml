- id: kb-7cdb5e71da1d
  question: Describe a time you convinced a manager or senior colleague that a change in process or approach
    was needed.
  answer: Show how you spotted the problem, gathered evidence, framed the change in terms of what the
    senior person cared about, proposed a small low-risk trial, and won agreement. Give the result.
  topic: behavioural
  tags:
  - influence
  - managing-up
  - process
  - star
  explanation: '## In plain words

    This tests influence when you have less authority. Good answers show respect, evidence, and a low-risk
    path, not pushing until people give up.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Describe the current process and its cost.

    - Show how you learned what the senior person cared about.

    - Explain your pitch: data, a small pilot, a clear way to measure.

    - Give the outcome and what changed afterwards.


    ## Example

    *Fictional sample:* "Our team released once a month, and each release took a full day of manual testing.
    My manager worried that faster releases would mean more bugs. I counted the bugs from the last six
    releases and showed most came from large batches of changes. I proposed a one-month pilot of weekly
    releases for one service, with automated smoke tests. Bugs per release fell and lead time dropped
    from four weeks to one. My manager then rolled it out to the other services."


    ## Common mistakes

    - Going around the manager instead of to them.

    - Arguing from opinion with no evidence.

    - Asking for a big change all at once.

    - Treating the manager''s concerns as obstacles instead of input.


    ## In the interview

    Signals scored: influence, data use, empathy for the other side, and pragmatism. Expect "What if they
    had said no?" and a good answer is "I would accept it, keep measuring, and raise it again with new
    data."

    '
