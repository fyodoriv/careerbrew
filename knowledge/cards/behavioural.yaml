- id: kb-bb07d9438a83
  question: Describe a time your communication skills made a difference. What did you do that helped?
  answer: 'Tell a story where clear communication changed the outcome, and name the specific technique:
    adapting to the audience, writing things down, using a picture, or summarizing decisions. Give the
    measurable result.'
  topic: behavioural
  tags:
  - communication
  - influence
  - clarity
  - star
  explanation: '## In plain words

    Engineers spend much of their time explaining, aligning, and writing. The interviewer wants evidence
    that you can do it well, and that you know why it worked, not just that it went well.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Describe the communication problem (confusion, conflict, a non-technical audience).

    - Name the technique you used and why you chose it.

    - Show the change in outcome.


    ## Example

    *Fictional sample:* "Two teams had argued for weeks about who owned a failing data job. Meetings kept
    looping. I drew a one-page diagram of the pipeline, marked each handoff, and wrote one question per
    arrow: who is paged when this breaks? In a 30-minute meeting we assigned an owner to each arrow. The
    job''s failures were fixed within two weeks, and the diagram became the team''s onboarding page."


    ## Common mistakes

    - Saying you are "a good communicator" without showing it.

    - A story where the skill was just talking more or louder.

    - Not naming the technique, so the interviewer cannot judge it.

    - No result.


    ## In the interview

    Signals scored: clarity, audience awareness, influence, and impact. Expect "How do you adapt for executives
    vs. engineers?". Mention one written habit (design docs, decision logs); interviewers value writing
    highly.

    '
