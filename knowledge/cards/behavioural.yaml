  question: How did you overcome a project delay?
  answer: Explain how you spotted the delay early, found its root cause, communicated the impact with
    options, re-planned by cutting scope or adding focus, and delivered, plus what you changed to plan
    better next time.
  topic: behavioural
  tags:
  - delivery
  - project-management
  - communication
  - star
  explanation: '## In plain words

    Delays are normal. The interviewer is checking whether you notice them early, communicate honestly,
    and act with sensible options rather than heroics or silence.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - How you noticed (tracking, a missed milestone).

    - The cause (estimate, dependency, unknown complexity).

    - Options you offered: cut scope, move date, add help.

    - The decision and result, plus the lesson.


    ## Example

    *Fictional sample:* "Two weeks into a six-week project, we were already a week behind because the
    legacy data was messier than expected. I raised it at the weekly sync with three options: drop the
    export feature, move the date by two weeks, or borrow an engineer. Product chose to drop export for
    launch. We shipped on the original date, and export followed two weeks later. I now add a data-quality
    spike to the start of any migration project."


    ## Common mistakes

    - Hiding the delay until the deadline.

    - Only working overtime as the fix.

    - Blaming another team.

    - No change in future planning.


    ## In the interview

    Signals scored: early detection, transparency, problem solving, and learning. Expect "How did stakeholders
    react?" and "What signals do you watch now?". Mention that adding people late can slow a project down,
    so you weigh it carefully.

    '
