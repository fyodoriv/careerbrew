- id: kb-84cecbcf2ffc
  question: How did you act when something did not go as planned?
  answer: Show that you stayed calm, quickly assessed the impact, informed the right people, chose a new
    plan, and delivered, then reflected on what to change so the plan holds better next time.
  topic: behavioural
  tags:
  - adaptability
  - resilience
  - problem-solving
  - star
  explanation: '## In plain words

    Plans fail constantly in software. The interviewer wants to see adaptability: how fast you notice,
    how calmly you re-plan, and whether you keep people informed.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Describe the plan and what broke it.

    - Show your first moves: assess, communicate, re-plan.

    - Show the new plan and the outcome.

    - End with what you changed in how you plan.


    ## Example

    *Fictional sample:* "We planned to launch a feature using a partner''s new API, but a week before
    launch the partner delayed it by a month. I listed what we could still ship without it, told product
    the same day, and proposed launching with manual data import for the first month. We launched on time
    to 20% of users, then switched to the API when it arrived. Since then, I list external dependencies
    and a fallback for each at project kickoff."


    ## Common mistakes

    - Blaming the change on others and stopping there.

    - Showing panic or freezing.

    - No communication to stakeholders.

    - No lesson for future planning.


    ## In the interview

    Signals scored: adaptability, composure, communication, and learning. Expect "How did the team feel?"
    and "What would you do if the fallback also failed?".

    '
