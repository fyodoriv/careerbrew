- id: kb-636461d3f084
  question: Your manager calls to say a client is complaining that your service is not working. What do
    you do?
  answer: Acknowledge and gather facts, confirm the issue with monitoring or a reproduction, mitigate
    quickly (roll back, fail over, or workaround), communicate status and next update times, fix the root
    cause, and follow up with the client and a blameless postmortem.
  topic: behavioural
  tags:
  - incident-response
  - customer-focus
  - communication
  explanation: '## In plain words

    This is a hypothetical situational question. The interviewer wants a calm, ordered incident-response
    approach that balances fixing the problem with keeping the client and manager informed.


    ## How it works

    Talk through clear steps:

    - **Listen and clarify**: what is failing, since when, for which users, any error messages.

    - **Confirm**: check dashboards, logs, and recent deploys; try to reproduce.

    - **Assess impact**: one client or everyone? Declare an incident if it is widespread.

    - **Mitigate first**: roll back, toggle a flag, fail over, or give a workaround.

    - **Communicate**: update the manager and client with what you know and when the next update comes.

    - **Fix the root cause** and verify with the client.

    - **Follow up**: blameless postmortem, action items, and a thank-you to the client.


    ## Example

    *Fictional sample answer:* "I would ask my manager for the client''s exact symptoms and when it started.
    While on the call, I would open our dashboards; say I see errors rising since a deploy 30 minutes
    ago. I would roll it back, confirm errors drop, and tell my manager we have a fix in place and an
    update in 30 minutes. Then I would find the bug, fix it with a test, and join a short call with the
    client to explain what happened and what we changed."


    ## Common mistakes

    - Jumping into code before confirming the problem.

    - Getting defensive ("it works for me").

    - Forgetting to communicate while fixing.

    - Stopping at mitigation with no root cause or postmortem.


    ## In the interview

    Signals scored: composure, structured problem solving, customer empathy, and communication. Expect
    "What if you cannot reproduce it?" and "What if it is another team''s service?". Mention escalation
    and involving the owning team quickly.

    '
