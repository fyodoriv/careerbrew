    Think of them as the grading rubric: each question checks whether you have shown a principle in real
    work.


    ## How it works

    - The list (as published; it has grown over time) includes: Customer Obsession, Ownership, Invent
    and Simplify, Are Right A Lot, Learn and Be Curious, Hire and Develop the Best, Insist on the Highest
    Standards, Think Big, Bias for Action, Frugality, Earn Trust, Dive Deep, Have Backbone; Disagree and
