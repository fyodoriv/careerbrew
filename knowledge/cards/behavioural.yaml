- id: kb-182800cfcc4c
  question: How do you answer "Why this company?" in an interview?
  answer: Connect specific, public facts about the company's products and values to your own skills and
    goals, and to the team you are interviewing for; avoid generic praise.
  topic: behavioural
  tags:
  - motivation
  - why-company
  - behavioural
  explanation: '## In plain words

    "Why this company?" is a motivation question. The interviewer wants to know that you chose this
    company on purpose, that you understand what the team builds, and that you will be engaged. Generic
    praise ("great products") does not stand out.


    ## How it works

    - Product: name a specific product or platform you use and what you value about it.

    - Values: tie to something the company says publicly, such as a value it lists on its careers page
    or a choice it explains in its engineering blog.

    - Team fit: explain why this role and team, based on the job description.

    - You: link your skills and goals to that work.

    - Research the company''s careers and news pages, and the job posting itself.


    ## Example

    A fictional answer: "I build developer tools, and I like how your public API docs treat clear error
    messages as a product feature. This role works on an SDK used by many developers, and my experience
    building SDKs fits that. I want to work where small details in an API affect many users."


    ## Common mistakes

    - Only talking about the brand or perks.

    - Being a fan with no link to the actual role.

    - Claiming facts about internal teams you cannot know.

    - A long answer; keep it under a minute.


    ## In the interview

    Expect "What would you improve in our product?" or "Which team interests you most?". Interviewers
    score genuine motivation, research depth, and role fit. Prepare one answer per company; the structure
    stays the same and the facts change.

    '
