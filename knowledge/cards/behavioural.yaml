- id: kb-73e2c443c4e7
  question: How do you ensure quality and stability in your own and your team's work?
  answer: 'Combine layers: clear requirements, code review, automated tests at the right levels, CI that
    blocks bad changes, safe releases (flags, canaries, rollback), monitoring and alerts, and blameless
    postmortems that feed improvements back.'
  topic: behavioural
  tags:
  - quality
  - testing
  - reliability
  - process
  explanation: '## In plain words

    No single practice guarantees quality; it comes from several layers that each catch different problems.
    The interviewer wants to see that you think in systems, not only "I write tests".


    ## How it works

    Structure the answer as layers from idea to production:

    - **Before code**: clear acceptance criteria, small design docs for risky changes.

    - **While coding**: tests (mostly unit, some integration, a few end-to-end), linters, type checks.

    - **Review**: code review with a checklist; small pull requests.

    - **Release**: CI gate, feature flags, canary releases (to a small share of traffic first), fast rollback.

    - **In production**: metrics, alerts on user-facing symptoms, error tracking.

    - **Learning**: blameless postmortems, with action items tracked.


    ## Example

    *Fictional sample:* "On my last team, bugs reached users about twice a month. I added a CI rule requiring
    tests for bug fixes, introduced canary releases to 5% of traffic for 30 minutes, and set alerts on
    error rate. Over a quarter, production incidents fell from eight to two, and both were caught by the
    canary before most users saw them."


    ## Common mistakes

    - Naming only one practice.

    - Claiming 100% coverage as the goal; coverage is not quality.

    - Ignoring production monitoring.

    - Adding heavy process that slows everything.


    ## In the interview

    Signals scored: systems thinking, pragmatism, ownership of production, and team habits. Expect "How
    do you balance speed and quality?" and "What would you do on a team with no tests?". Answer the second
    with "start with tests on the riskiest paths and every bug fix".

    '
