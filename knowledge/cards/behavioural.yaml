- id: kb-e866cff6f791
  question: Describe a time you fixed a tricky bug in production. How did you approach it?
  answer: 'Walk through a calm, methodical process: stop the bleeding first, gather evidence from logs
    and metrics, form and test hypotheses, find the root cause, fix it safely, and add tests and monitoring
    so it cannot recur.'
  topic: behavioural
  tags:
  - debugging
  - incident
  - production
  - star
  explanation: '## In plain words

    This question mixes technical skill and behavior. The interviewer checks your debugging method, how
    you act under pressure, how you communicate during an incident, and whether you prevent repeats.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    Inside Action, show a debugging method:

    - Mitigate first (roll back, turn off a flag, scale up).

    - Reproduce or narrow down using logs, metrics, and traces.

    - Form a hypothesis, test it, repeat.

    - Fix the root cause, add a regression test, write a short postmortem.


    ## Example

    *Fictional sample:* "Users reported random logouts. I rolled back the last deploy, but logouts continued,
    so the deploy was not the cause. Metrics showed logouts only on two of eight servers. Those two had
    a clock drift of 90 seconds, so session tokens looked expired. I fixed time sync, added a clock-drift
    alert, and wrote a test for token checks with clock skew. Logouts went to zero, and the postmortem
    led to time-sync checks on all hosts."


    ## Common mistakes

    - Jumping to a fix before mitigating user impact.

    - Guessing instead of using evidence.

    - Stopping at the symptom, not the root cause.

    - Forgetting tests, monitoring, and a postmortem.


    ## In the interview

    Signals scored: structured debugging, calm under pressure, communication during incidents, and prevention.
    Expect "How did you keep stakeholders updated?" and "What monitoring would have caught it sooner?".
    Mention blameless postmortems.

    '
