    the learning was worth it. The product reached 50,000 users in a year, and I learned to own a system
    end to end. Since then, I ask two questions before any big choice: what is the worst case, and can
    I survive it?"


    ## Common mistakes

    - A risk with no thought behind it, or one that put others in danger.

    - A personal risk with no link to work skills.

    - Glossing over what could have gone wrong.

    - No lesson, only a happy ending.


    ## In the interview

    Signals scored: judgment, courage, self-awareness, and learning. Expect "Would you do it again?" and
    "What risk did you decide not to take?". Keep personal-life stories short and focused on how you decide.

