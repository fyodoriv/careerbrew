- id: kb-9ddf44af7345
  question: Describe a time when you were under a lot of pressure at work. How did you react?
  answer: Pick a real high-stakes moment, show that you stayed calm, triaged what mattered, communicated
    early, and delivered. Close with the result and what you changed afterwards so the pressure was lower
    next time.
  topic: behavioural
  tags:
  - pressure
  - stress
  - prioritization
  - star
  explanation: '## In plain words

    The interviewer wants to know how you behave when things get hard: do you freeze, panic, cut corners,
    or stay methodical? Pressure is normal in engineering (outages, deadlines, launches), so they are
    checking your coping habits, not whether you ever felt stress.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Name the source of pressure precisely (a deadline, an outage, a demanding stakeholder).

    - Show the habits that helped: breaking the problem down, saying what you would drop, asking for help,
    protecting quality.


    ## Example

    *Fictional sample:* "Two days before a public launch, load tests showed our checkout API timing out.
    I owned the API. I split the work: I profiled the slow query while a teammate prepared a feature flag
    to fall back to the old flow. I posted a short status every four hours so product could plan. We found
    a missing index, cut p95 latency from 4 s to 300 ms, and launched on time. Afterwards I added load
    tests to CI so we would catch this a week earlier."


    ## Common mistakes

    - Claiming you never feel pressure; it sounds untrue.

    - A story where the pressure was self-inflicted by poor planning, with no lesson.

    - Describing the team''s work with "we" so your role is invisible.

    - No result, or a result with no number.


    ## In the interview

    Keep it to about two minutes, spending most of it on Action. Interviewers score composure, prioritization,
    communication with stakeholders, ownership, and learning. Expect follow-ups such as "What would you
    do differently?", "How did you take care of yourself and the team?", and "What did you drop to make
    room?".

    '
