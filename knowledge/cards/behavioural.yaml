- id: kb-e9443bc88937
  question: Describe a time when you had to deliver bad news. How did you do it?
  answer: Tell a story where you shared bad news early and directly, gave the facts and impact, owned
    your part, and came with options or a plan. Close with how the relationship and outcome turned out.
  topic: behavioural
  tags:
  - communication
  - transparency
  - stakeholders
  - star
  explanation: '## In plain words

    Bad news gets worse with age. The interviewer wants to see that you raise problems early, speak plainly,
    and bring solutions, instead of hiding issues until a deadline passes.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Show the timing: when you knew, and how soon you told people.

    - Show the structure: what happened, impact, cause, options, recommendation.

    - Show empathy for the listener and follow-up after the conversation.


    ## Example

    *Fictional sample:* "Midway through a migration, I found that our data-copy job would take three weeks,
    not three days. I told my manager and the product owner the same afternoon. I explained the cause
    (the source database throttled reads), the impact on the launch date, and two options: delay a week,
    or launch with read-only history for old records. They chose the second. We launched on time, and
    the full history arrived ten days later with no customer complaints."


    ## Common mistakes

    - Waiting until the last moment to speak up.

    - Softening the message until it is unclear.

    - Bringing only the problem and no options.

    - Blaming others instead of explaining causes.


    ## In the interview

    Signals scored: transparency, courage, ownership, and problem solving. Expect "How did they react?"
    and "What would you do if they were angry?". A strong phrase to use: "I lead with the impact, then
    the cause, then the options."

    '
