- id: kb-28031c9dee8f
  question: How do you deal with a difficult person on your team or have a difficult conversation?
  answer: Assume good intent, find the cause of the behavior, give specific private feedback about impact
    using facts, agree on concrete next steps, follow up, and escalate fairly if nothing changes.
  topic: behavioural
  tags:
  - conflict
  - feedback
  - difficult-conversations
  - star
  explanation: '## In plain words

    Every team has friction. The interviewer wants to know whether you address it directly and kindly,
    or avoid it, gossip, or escalate too fast. For leads, it also tests performance management.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    A simple feedback model inside Action is SBI: **Situation** (when), **Behavior** (what you saw, factual),
    **Impact** (its effect). Then:

    - Ask for their view and listen.

    - Agree on a specific change.

    - Follow up; escalate with documentation if it continues.


    ## Example

    *Fictional sample:* "A teammate often rejected pull requests with one-word comments, and juniors stopped
    asking him for reviews. I asked him for a coffee chat. I said: ''In last week''s reviews, several
    comments were just "no". Two people told me they now avoid sending you code.'' He was surprised; he
    was overloaded and rushing. We agreed he would review fewer PRs but explain each comment. Within a
    month, juniors were asking him for reviews again."


    ## Common mistakes

    - Labeling the person ("he is toxic") instead of describing behavior.

    - Going to the manager before talking to the person.

    - Making it public.

    - No follow-up.


    ## In the interview

    Signals scored: emotional maturity, directness with kindness, fairness, and follow-through. Expect
    "What if they did not change?" and "How did you document it?". Avoid any detail that could identify
    a real person.

    '
