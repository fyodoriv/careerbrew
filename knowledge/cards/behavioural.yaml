  - star
  explanation: '## In plain words

    Real work rarely comes with clear specs, especially at senior levels. The interviewer wants to see
    that you create clarity yourself instead of waiting, and that you move forward while staying flexible.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    A simple method for the Action part:

    - Clarify the goal: what problem, for whom, and how will we know it worked?

    - Split into knowns, assumptions, and unknowns.

    - Rank unknowns by risk and spike the riskiest.

    - Write the assumptions down and share them for correction.

    - Deliver in small steps and revisit.


    ## Example

    *Fictional sample:* "My manager asked me to ''make onboarding better'' with no other details. I interviewed
    five new users and checked the funnel data, which showed 40% of users dropped at email verification.
    I wrote a one-page brief with that finding, my assumptions, and three ideas, and shared it with product.
    We tested a magic-link login with 10% of users. Drop-off fell to 15%, and we rolled it out."


    ## Common mistakes

    - Waiting for someone else to define everything.

    - Charging ahead on unspoken assumptions.

    - Trying to remove all ambiguity before starting.

    - No evidence of adjusting as you learned.


    ## In the interview

    Signals scored: initiative, structured thinking, communication, and comfort with uncertainty. Expect
    "What did you do when an assumption proved wrong?".

    '
