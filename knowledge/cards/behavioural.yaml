- id: kb-67225964129b
  question: How do you communicate about estimates?
  answer: Give estimates as ranges with confidence and assumptions, separate estimates from commitments,
    flag the biggest unknowns, update early when things change, and explain trade-offs between scope,
    time, and quality.
  topic: behavioural
  tags:
  - estimation
  - communication
  - stakeholders
  explanation: '## In plain words

    An estimate is a guess with uncertainty, but people often hear it as a promise. Good communication
    makes the uncertainty visible so others can plan, and keeps trust when reality changes.


    ## How it works

    - **Use ranges**: "three to five days", not "four days".

    - **State confidence and assumptions**: "if the API works as documented".

    - **Name the unknowns**: and offer a short spike to reduce them.

    - **Separate estimate from commitment**: a commitment is a date you agree to after adding buffer.

    - **Update early**: share changes as soon as you know.

    - **Offer trade-offs**: less scope, more time, or more people (with caveats).


    ## Example

    *Fictional sample:* "When product asked how long a payment refund feature would take, I said: ''Two
    to four weeks. The low end assumes the payment provider''s refund API works like the docs say. I can
    confirm that with a two-day spike. If you need a fixed date, I would commit to four weeks, or three
    weeks without partial refunds.'' The spike found a gap, and I updated the estimate the same day."


    ## Common mistakes

    - A single number with no uncertainty.

    - Padding secretly instead of explaining risk.

    - Updating only at the deadline.

    - Treating estimates as fixed promises under pressure.


    ## In the interview

    Signals scored: honesty, clarity, stakeholder management, and planning maturity. Expect "What if your
    manager pushes for a shorter estimate?" A good answer: "I explain what we would cut or risk to get
    there, and let them choose."

    '
