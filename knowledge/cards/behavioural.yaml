  question: How do you give a strong example of Amazon's "Are Right, A Lot" Leadership Principle?
  answer: 'Tell one specific STAR story about a time your judgment proved right, ideally because you sought
    other views and tested your own assumption before deciding: brief context, your own actions, a measurable
    result, and what you learned.'
  topic: behavioural
  tags:
  - leadership-principles
  - star
  - behavioural
  - amazon
  explanation: '## In plain words

    Amazon publishes a list of Leadership Principles and uses them in behavioural interviews. "Are
    Right, A Lot" asks for sound judgment: you listen to people who see it differently and test your
    own view before you decide. This is a short summary in our own words; the official wording is on
    Amazon''s Leadership Principles page:
    https://www.amazon.jobs/content/en/our-workplace/leadership-principles . When asked for an
    example, the interviewer wants one real story that shows this behaviour, told clearly and with
    measurable results.


    ## How it works

    - Pick a story about a time your judgment was right when data was incomplete, or when you changed
    your mind after seeking other views.

    - Use STAR: Situation (one or two sentences of context), Task (your goal), Action (what *you* did,
    in detail), Result (numbers if possible).

    - Add what you learned and what you would do differently.

    - Keep it to about two minutes, and spend most of the time on Action.

    - Prepare two stories per principle; interviewers often ask for a second example.


    ## Example

    A fictional sample answer:


    "I picked a cache library for a new service. Two teammates preferred another one, so I asked each
    to list failure cases, ran a one-day benchmark on our real traffic shape, and found my choice used
    30% less memory but had a weaker eviction policy. We went with it plus a size cap. Six months later
    it had caused no incidents. I learned to treat my first instinct as a hypothesis to test."


    ## Common mistakes

    - Saying "we" for everything, so the interviewer cannot tell what you did.

    - No measurable result, or a result that is vague ("it went well").

    - Picking a story that fits a different principle better.

    - Reciting the principle''s wording instead of showing it through actions.


    ## In the interview

    Expect follow-ups like "What data did you have?", "What would you do differently?", and "What was
    the hardest part?". Interviewers score ownership of actions, the size and clarity of impact, the judgment
    behind trade-offs, and self-awareness. Check the current wording of the principles on Amazon''s careers
    site before the interview, since the list has changed over time.

    '
