- id: kb-6fb6f19389ab
  question: Describe a project where you needed help from other teams. How did you realize it, and how
    did you organize them and get buy-in from leadership?
  answer: Explain how you spotted a dependency on other teams, mapped the stakeholders, made the shared
    goal and benefit clear to each team, set up a lightweight way to work together, and won leadership
    support with a short, data-backed case.
  topic: behavioural
  tags:
  - cross-team
  - influence
  - collaboration
  - star
  explanation: '## In plain words

    Big projects rarely fit inside one team. This question checks whether you notice cross-team dependencies
    early and can lead people who do not report to you. It is about influence without authority.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Describe the moment you realized you needed others (a blocker, a risk, missing skills).

    - Show how you got buy-in: what each team gained, and the cost of doing nothing.

    - Describe the working setup: owners, a shared tracker, a regular short sync.


    ## Example

    *Fictional sample:* "I was building a new sign-up flow and found that the fraud team''s rules would
    block 10% of new users. I met their lead, showed the numbers, and proposed a shared goal: fewer fake
    accounts and fewer false blocks. I wrote a one-page plan for our directors with the expected gain
    in sign-ups. They approved two engineers from fraud for a month. We ran a weekly 20-minute sync. False
    blocks fell to 2% and sign-ups rose 6%."


    ## Common mistakes

    - Realizing the dependency too late and presenting it as a crisis.

    - Asking for help without showing what the other team gains.

    - Escalating to leadership before talking to the team itself.

    - Taking all the credit at the end.


    ## In the interview

    Signals scored: influence, stakeholder mapping, planning, and shared credit. Expect "What if the other
    team said no?" and "How did you keep momentum?". Mention that you credited the other team publicly
    at the end.

    '
