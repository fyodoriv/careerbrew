  explanation: '## In plain words

    This tests flexibility with judgment. Interviewers want people who can switch gears when needed, but
    who also protect important work and do not drop commitments silently.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Describe the surprise and why it mattered.

    - Show how you weighed it against existing work.

    - Explain what you paused or handed off and who you told.

    - Give the result and how you returned to the original work.


    ## Example

    *Fictional sample:* "During a sprint, a security scan flagged a vulnerable library used across our
    services. My task was a new report page. I judged the fix more urgent, told my product manager the
    report would slip three days, and paired with a teammate to upgrade the library in twelve services
    in two days. No services were exposed, and the report shipped three days late as promised."


    ## Common mistakes

    - Saying yes to everything with no thought about cost.

    - Refusing to adapt because "it was not in the plan".

    - Silently dropping other commitments.

    - No result.


    ## In the interview

    Signals scored: flexibility, prioritization, communication, and reliability. Expect "How do you decide
    when to push back?". A good line: "I ask what the cost of delay is for each task."

    '
