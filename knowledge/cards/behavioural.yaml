  explanation: '## In plain words

    The interviewer is checking whether you can turn an intention into a plan and finish it. They look
    for goals that are specific and measurable, not vague wishes, and for the discipline to track progress.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - State the goal in a measurable way (for example, "cut build time from 20 to 8 minutes by the end
    of the quarter").

    - Explain why you picked it and how you broke it into milestones.

    - Mention one obstacle and how you adjusted.


    ## Example

    *Fictional sample:* "Our mobile app''s crash-free rate was 97%, and reviews complained. I set a goal
    to reach 99.5% within two months. I grouped crashes by root cause, fixed the top eight, which caused
    85% of crashes, and added a weekly dashboard review with the team. A third-party SDK update set us
    back in week five, so I pinned its version and reported the bug. We hit 99.6% in seven weeks, and
    the app''s rating went from 3.9 to 4.4."


    ## Common mistakes

    - A goal with no number, so success cannot be judged.

    - A goal set by someone else with no personal ownership.

    - Skipping the plan and jumping straight to "and we achieved it".

    - Hiding setbacks; a small one makes the story credible.


    ## In the interview

    Signals scored: ownership, planning, persistence, and measurable impact. Expect "How did you choose
    that target?", "What if you had missed it?", and "Do you still track it?". A good closing line connects
    the goal to team or business value, not only to your own growth.

