- id: kb-1fc752a01796
  question: Describe a risk you took that went badly. How did you recover?
  answer: 'Tell a story of a risk that failed: why it seemed reasonable, what went wrong, how you contained
    the damage and owned it, how you recovered, and what you now do differently.'
  topic: behavioural
  tags:
  - risk
  - failure
  - resilience
  - star
  explanation: '## In plain words

    This is a failure question. The interviewer wants to see resilience and ownership: you acted quickly
    to limit harm, were honest about it, and learned something specific.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Explain why the risk looked reasonable at the time.

    - Describe the moment it went wrong and your first steps to contain it.

    - Describe how you told others and rebuilt trust.

    - End with the lesson and how you apply it.


    ## Example

    *Fictional sample:* "To speed up a release, I skipped the staging soak and shipped a caching change
    straight to production behind a flag. A cache key bug showed some users stale prices. I turned the
    flag off within ten minutes, wrote an incident note, and called the support lead to prepare a reply.
    The fix took a day. I learned that ''behind a flag'' is not a substitute for staging, and I added
    a check that blocks skipping it for changes that touch pricing."


    ## Common mistakes

    - A failure that was not really a failure.

    - Blaming others or bad luck.

    - No containment steps; only the happy recovery.

    - A lesson that is too vague ("be more careful").


    ## In the interview

    Signals scored: ownership, resilience, crisis handling, and learning. Expect "Would you take that
    risk again?" and "How did your manager react?". Show that the failure did not make you afraid of all
    risk.

    '
