- id: kb-59f84094c0f4
  question: How do you handle a disagreement about which technology to choose?
  answer: 'Move the debate from opinions to criteria: agree on requirements and constraints, compare options
    against them, run a small proof of concept if needed, write the decision down with trade-offs, and
    then commit as a team.'
  topic: behavioural
  tags:
  - decision-making
  - technology-choice
  - conflict
  explanation: '## In plain words

    Technology debates get emotional because people have favorites. The fix is to agree on what matters
    first (the criteria), then let the options compete fairly against them.


    ## How it works

    - **Agree on the problem and constraints**: scale, team skills, budget, timeline, maintenance.

    - **Agree on criteria and weights** before discussing options.

    - **Compare options** in a simple table; include "do nothing" or "use what we have".

    - **Prototype** when the facts are unclear: a time-boxed proof of concept.

    - **Decide and record**: write an architecture decision record (ADR), a short doc stating the context,
    decision, and consequences.

    - **Disagree and commit**: once decided, everyone supports it; revisit only with new evidence.


    ## Example

    *Fictional sample:* "Our team split between two message queues. I asked us to list criteria first:
    delivery guarantees, operational cost, and team experience. In a scoring table, one queue won on guarantees
    but needed a dedicated operator; the other was managed by our cloud provider. A two-day test showed
    the managed one met our throughput with room to spare. We chose it, wrote an ADR, and the engineer
    who preferred the other option led the rollout."


    ## Common mistakes

    - Arguing from personal taste or hype.

    - Letting the loudest or most senior voice decide.

    - No written record, so the debate repeats months later.

    - Choosing new technology the team cannot operate.


    ## In the interview

    Signals scored: objectivity, facilitation, pragmatism, and team cohesion. Expect "What if your choice
    lost?" Show that you would commit fully. Mention total cost of ownership: learning, hiring, and operations,
    not just features.

    '
