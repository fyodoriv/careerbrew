- id: kb-443ae5b5a2ad
  question: How do you communicate with non-technical colleagues?
  answer: Start from what they care about, such as outcomes, risks, time, and money; avoid jargon or define
    it; use analogies and visuals; check understanding; and give clear options and recommendations rather
    than raw technical detail.
  topic: behavioural
  tags:
  - communication
  - stakeholders
  - non-technical
  explanation: '## In plain words

    Product managers, sales, support, and executives need to make decisions based on technical work, but
    they do not need the internals. Good engineers translate: they explain what it means for them.


    ## How it works

    - **Start with their goal**: what decision do they need to make?

    - **Lead with impact**: users affected, time, cost, risk.

    - **Drop or define jargon**: say "the system that stores logins" before "the auth service".

    - **Use analogies and pictures**: a simple diagram beats a paragraph.

    - **Offer options**: two or three choices with a recommendation.

    - **Check understanding**: ask them to repeat the key point or the next step.


    ## Example

    *Fictional sample:* A support lead asks why a fix takes two weeks. A weak reply: "We need to refactor
    the ORM layer and migrate the schema." A strong reply: "The bug sits in the part of the system that
    saves orders. Fixing it safely means changing how old orders are stored too, like renovating a room
    while people still use it. We can ship a quick patch in two days that stops new cases, then the full
    fix in two weeks. I recommend both."


    ## Common mistakes

    - Talking down to people or oversimplifying until it is wrong.

    - Burying the decision under technical detail.

    - Using acronyms without explaining them.

    - Not checking whether the message landed.


    ## In the interview

    Signals scored: empathy, clarity, business awareness, and influence. Expect "Give an example of explaining
    a technical trade-off to a stakeholder" so have a short STAR story ready. Mention that you also listen:
    non-technical colleagues often know users best.

    '
