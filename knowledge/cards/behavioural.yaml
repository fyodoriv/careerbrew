- id: kb-95fdcb90b433
  question: Describe a time you communicated poorly. What went wrong, and what would you change?
  answer: Own a real communication failure, explain its impact and root cause, describe how you repaired
    it, and the concrete habit you changed so it does not happen again.
  topic: behavioural
  tags:
  - communication
  - failure
  - learning
  - star
  explanation: '## In plain words

    This tests self-awareness. Everyone miscommunicates sometimes; interviewers want to see that you can
    own it without excuses and that you learned a lasting habit.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Choose a real mistake with real but recoverable impact.

    - Name the root cause (wrong channel, assumptions, too much jargon, too late).

    - Show the repair and the habit you changed.


    ## Example

    *Fictional sample:* "I announced an API change in a chat channel and assumed everyone read it. Two
    client teams missed it, and their apps broke on release day. I apologized, helped them patch it the
    same day, and found the root cause: I relied on one channel with no confirmation. Now I send API changes
    as a written notice, tag the owner of every affected service, and ask for an explicit acknowledgement.
    We have had no surprise breakages since."


    ## Common mistakes

    - Picking a fake failure ("I was too detailed").

    - Blaming the listener.

    - Skipping the impact.

    - No concrete change in behavior.


    ## In the interview

    Signals scored: ownership, self-awareness, learning, and communication maturity. Expect "How did the
    affected team react?" and "How do you check you were understood now?". A short, honest story beats
    a polished one.

    '
