- id: kb-9789f325754e
  question: How do you estimate software work?
  answer: Break the work into small pieces, estimate each using past data or comparison with similar tasks,
    add explicit time for unknowns, testing, and review, express the total as a range, and refine as you
    learn.
  topic: behavioural
  tags:
  - estimation
  - planning
  - project-management
  explanation: '## In plain words

    Estimating is hard because software work hides unknowns. A good method reduces surprise: split the
    work, compare with things you have done before, and be honest about uncertainty.


    ## How it works

    - **Decompose**: tasks small enough to estimate (one to three days).

    - **Use reference points**: compare with similar past tasks; use the team''s historical speed if you
    track it.

    - **Include everything**: tests, review, deployment, documentation, meetings.

    - **Account for unknowns**: spike risky parts first, or add a buffer sized to the risk.

    - **Use ranges**: best and likely cases; techniques like three-point estimates (optimistic, likely,
    pessimistic) help.

    - **Compare with others**: team estimation (like planning poker) exposes hidden assumptions.

    - **Track actuals**: compare estimates with reality to improve.


    ## Example

    *Fictional sample:* A three-point estimate for a task: optimistic 2 days, likely 4, pessimistic 9.
    A common formula (PERT) is (O + 4L + P) / 6 = (2 + 16 + 9) / 6, about 4.5 days. You would say "about
    four to six days, up to nine if the legacy code fights back", and track the actual time to calibrate
    next time.


    ## Common mistakes

    - Estimating only coding time.

    - One number with false precision.

    - Estimating alone when the team will do the work.

    - Never comparing estimates to actuals.


    ## In the interview

    Signals scored: structured thinking, honesty about uncertainty, and learning from data. Expect "Story
    points or hours?" Say both work if the team is consistent; points measure relative size, hours are
    easier for outsiders. Mention that big tasks are where estimates fail most.

    '
