  - star
  explanation: '## In plain words

    Waiting for perfect data is often the worst choice. The interviewer wants to see that you can decide
    quickly and sensibly when time is short, and that you own the outcome either way.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    A useful idea: **two-way doors** (reversible decisions, which you can make fast) versus **one-way
    doors** (hard to undo, which deserve more care). Show:

    - Why waiting was costly.

    - What little data you used and who you asked.

    - How you reduced risk (a flag, a time limit, a check-in point).

    - What happened, and how you adjusted.


    ## Example

    *Fictional sample:* "During a traffic spike, our database was close to its connection limit and we
    had minutes to act. I could not tell whether it was a bot or real users. I decided to enable rate
    limiting per IP at a generous level, because I could undo it instantly. It stopped the overload. Later
    data showed it was a misbehaving partner integration, and about 1% of real users had been slowed.
    I apologized to them via support, and we added per-partner quotas."


    ## Common mistakes

    - Treating every decision as irreversible and freezing.

    - Making a fast call on a truly irreversible decision without care.

    - Hiding the downsides of the result.

    - No follow-up once data arrived.


    ## In the interview

    Signals scored: bias for action, judgment, ownership, and learning. Expect "What would have made you
    wait?" and "What if you had been wrong?".

