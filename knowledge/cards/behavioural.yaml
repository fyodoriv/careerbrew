cards:
- id: kb-9ef45ec68995
  question: Describe a new strategy or idea you tested. How did you pitch it, and what were the results?
  answer: Explain an idea you proposed, how you framed the pitch around the audience's goals, how you
    tested it cheaply and measured it, and the honest results, good or bad, with what you learned.
  topic: behavioural
  tags:
  - innovation
  - experimentation
  - influence
  - star
  explanation: '## In plain words

    The interviewer wants to see initiative, experimentation, and honesty about results. They like people
    who test ideas small and measure them, and who report failures as openly as wins.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Describe the idea and the problem it solved.

    - Show the pitch: who you convinced and how.

    - Show the experiment: scope, metric, duration.

    - Report results honestly and what happened next.


    ## Example

    *Fictional sample:* "Code reviews were slowing our team: the median pull request waited two days.
    I proposed a ''review first'' rule: every morning, each engineer reviews before starting new code.
    I pitched it to the team as a two-week experiment with a clear metric. Median wait dropped to five
    hours, but larger reviews still lagged. We kept the rule and added a soft size limit of 400 lines.
    The team still uses both."


    ## Common mistakes

    - An idea with no test or metric.

    - Hiding that the result was mixed.

    - A pitch that was just "I told them".

    - Taking sole credit for team work.


    ## In the interview

    Signals scored: initiative, experimental thinking, influence, and honesty. Expect "What would you
    change about the experiment?" and "How did you get skeptics on board?". A mixed result with a clear
    lesson often scores better than a perfect win.

    '
