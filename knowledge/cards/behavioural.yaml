- id: kb-8e22e850f267
  question: What is the STAR framework for behavioural questions?
  answer: 'STAR stands for Situation, Task, Action, Result. It is a structure for telling a work story:
    brief context, your responsibility, the specific steps you took, and the measurable outcome, often
    followed by what you learned.'
  topic: behavioural
  tags:
  - star
  - interview-technique
  - storytelling
  explanation: '## In plain words

    Behavioural questions ask about past behavior because it predicts future behavior. STAR is a simple
    template that keeps your story short, clear, and focused on what you did, so the interviewer can score
    it.


    ## How it works

    - **Situation**: the context in one or two sentences: where, when, what was at stake.

    - **Task**: your specific responsibility or goal.

    - **Action**: what you did, step by step. Use "I", not "we". This should be the longest part, about
    half the time.

    - **Result**: the outcome, with numbers where possible, plus what you learned.

    Many people add **L** for Learning (STARL) or **R** for Reflection. Aim for about two minutes per
    story. Prepare six to eight stories that each cover several themes (conflict, failure, leadership,
    ambiguity) and adapt them to each question.


    ## Example

    *Fictional sample, labelled:*

    - S: "Our checkout page had a 5% error rate after a release."

    - T: "I was on call and owned the fix."

    - A: "I rolled back, found a null-handling bug in logs, wrote a failing test, fixed it, and redeployed
    with a canary."

    - R: "Errors fell to 0.1% within an hour. I added that test pattern to our review checklist."


    ## Common mistakes

    - Spending most of the time on the situation.

    - Saying "we" so your role is unclear.

    - No result, or no numbers.

    - Telling a story that does not answer the question asked.


    ## In the interview

    Interviewers often score each part: was the context clear, was your role clear, were the actions specific,
    was the result measurable? Expect follow-ups that dig into Action ("why that step?"). Practise telling
    stories aloud and timing them.

    '
