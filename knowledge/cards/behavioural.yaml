  question: How do you give a strong example of Amazon's "Bias for Action" Leadership Principle?
  answer: 'Tell one specific STAR story about a time you acted quickly on a reversible decision instead
    of waiting for perfect information, while limiting the risk: brief context, your own actions, a measurable
    result, and what you learned.'
  topic: behavioural
  tags:
