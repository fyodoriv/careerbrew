- id: kb-aa7187d55527
  question: Explain a situation where you used data or logic to make a recommendation.
  answer: Describe a decision where you gathered the right data, analyzed it honestly, made a clear recommendation
    with trade-offs, and persuaded others. Give the measurable result.
  topic: behavioural
  tags:
  - data-driven
  - decision-making
  - influence
  - star
  explanation: '## In plain words

    The interviewer wants proof that you base decisions on evidence, not opinions or habits. They also
    check whether you can explain data simply to people who must act on it.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Say what question you were answering and why gut feeling was not enough.

    - Describe how you got the data (logs, metrics, an experiment) and its limits.

    - Show the recommendation, the trade-offs, and how others reacted.


    ## Example

    *Fictional sample:* "Our team debated rewriting our search service because it ''felt slow''. I pulled
    a week of latency traces and found 80% of slow requests came from one unindexed filter. I recommended
    adding the index and a cache instead of a rewrite, and estimated two days versus three months. The
    team agreed. p95 latency fell from 1.2 s to 250 ms, and the rewrite was dropped from the roadmap."


    ## Common mistakes

    - Presenting data with no decision attached.

    - Cherry-picking numbers that support a view you already had.

    - Ignoring the data''s limits or sample size.

    - Too much jargon for the audience.


    ## In the interview

    Signals scored: analytical thinking, intellectual honesty, clear communication, and impact. Expect
    "What if the data had said the opposite?" and "How confident were you?". Mention one thing the data
    could not tell you and how you handled that uncertainty.

    '
  match:
  - 94231f6e2208
  prompt: 1f344914
- id: kb-5a43cfe7a26d
  question: Give an example of a time you exceeded customer expectations.
  answer: Describe a customer (external or internal) with a clear need, how you understood their real
    problem, what you did beyond the request, and the measurable effect on their experience or the business.
  topic: behavioural
  tags:
  - customer-focus
  - ownership
  - impact
  - star
  explanation: '## In plain words

    Engineers serve customers directly or through other teams. The interviewer wants evidence that you
    care about the user''s real problem, not just the ticket, and that you go further when it makes sense.


    ## How it works

    - **Situation**: one or two sentences of context: team, stakes, timeline.

    - **Task**: what you personally were responsible for.

    - **Action**: the specific steps you took, in order, using "I" not "we".

    - **Result**: a measurable outcome, then what you learned and would repeat.

    - Define the customer and what they originally asked for.

    - Show how you discovered the deeper need (asking, watching, data).

    - Describe the extra step and why it was worth the cost.

    - Quantify the result.


    ## Example

    *Fictional sample:* "An internal finance team asked for a CSV export of monthly payments. When I asked
    how they used it, I learned they spent two days each month reconciling it by hand against bank statements.
    I shipped the export, then spent three more days building an automatic match report that flagged mismatches.
    Their month-end close went from two days to two hours, and they asked us to present the tool to two
    other teams."


    ## Common mistakes

    - Gold-plating: extra features nobody needed, delivered late.

    - No evidence the customer actually valued the extra work.

    - Treating "customer" as only external users.

    - No result.


    ## In the interview

    Signals scored: customer empathy, ownership, judgment about scope, and impact. Expect "How did you
    decide it was worth the extra time?" Show that you checked priorities with your manager before going
    beyond the ask.

    '
