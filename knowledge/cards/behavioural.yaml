- id: kb-1e54fd29dbfa
  question: How do you break a complicated project into well-defined tasks?
  answer: Start from the goal and the definition of done, split the work into thin end-to-end slices that
    each deliver value, identify unknowns and spike them first, map dependencies, and make each task small,
    testable, and ownable.
  topic: behavioural
  tags:
  - planning
  - decomposition
  - project-management
  explanation: '## In plain words

    A big project feels impossible until it is broken into pieces you can finish in a day or two. The
    interviewer wants to see a repeatable method, not "I just start coding".


    ## How it works

    - **Clarify the outcome**: what does done look like, and how will you measure it?

    - **Find the unknowns**: list risky parts and plan short spikes (time-boxed experiments) first.

    - **Slice vertically**: prefer thin end-to-end slices (UI to database) over layers, so each slice
    can ship and be tested.

    - **Map dependencies**: what blocks what; which work can run in parallel.

    - **Make tasks small**: each fits in one to three days, has an owner and acceptance criteria.

    - **Re-plan**: revisit the breakdown as you learn.


    ## Example

    *Fictional sample:* "To build ''export reports as PDF'', I first agreed on done: any report under
    50 pages exports in under ten seconds. The unknown was the PDF library, so I ran a two-day spike.
    Then I sliced it: (1) export one simple report end to end, (2) add charts, (3) add a background job
    for long reports, (4) add email delivery. Each slice shipped behind a flag, and users got value after
    week one."


    ## Common mistakes

    - Splitting by layer (all backend, then all frontend), so nothing works until the end.

    - Ignoring unknowns until they explode late.

    - Tasks so big nobody knows when they are done.

    - No acceptance criteria.


    ## In the interview

    Signals scored: structured thinking, risk awareness, and delivery mindset. Expect "How do you estimate
    those tasks?" and "What if a spike shows the plan is wrong?". Mention that you share the breakdown
    with the team for feedback.

    '
