  topic: behavioural
  tags:
  - communication
  - executives
  - delivery
  explanation: '## In plain words

    Executives need to plan around reality. They dislike surprises more than delays. The goal is a short,
    honest message that helps them decide, not a long defense.


    ## How it works

    Use a bottom-line-up-front structure (state the conclusion first):

    - **Headline**: "Project X will be about three weeks late; new date is ..."

    - **Impact**: what this changes for customers, revenue, or other teams.

    - **Cause**: one or two sentences, owned, no blame.

    - **Options**: for example, cut scope, add people, or accept the new date, each with trade-offs.

    - **Recommendation and ask**: what you suggest and the decision or help you need.

    - **Next update**: when they will hear from you again.


    ## Example

    *Fictional sample (written update):* "Summary: the full customer portal is now expected on May 20,
    three weeks after plan. Impact: the two pilot customers start later; no revenue effect this quarter.
    Cause: data migration from the old system is harder than estimated. Options: (a) launch on time without
    historical invoices, (b) launch May 20 with everything. Recommendation: (a), with historical invoices
    following on May 20. Decision needed by Friday. Next update: Monday."


    ## Common mistakes

    - Waiting until the deadline.

    - A long technical story before the bottom line.

    - Blaming another team in front of executives.

    - Presenting a problem with no options.


    ## In the interview

    Signals scored: transparency, executive communication, ownership, and judgment. Expect "How would
    you prevent it next time?" and "What if they demand the original date?" For the latter, explain what
    would have to be cut or risked to meet it.

