  question: What is a palindrome, and how do you check for one?
  answer: A palindrome reads the same forwards and backwards, like "racecar". Check it with two pointers
    moving inward from both ends and comparing characters, which is O(n) time and O(1) space; for sentence
    variants, skip non-alphanumeric characters and compare case-insensitively.
  topic: leetcode
  tags:
  - strings
  - two-pointers
  - palindrome
  explanation: "## In plain words\nA palindrome is symmetric: the first character matches the last, the\
    \ second matches the second-to-last, and so on. So you only need to compare pairs from the outside\
    \ in until the pointers meet.\n\n## How it works\n- Set `i = 0` and `j = len(s) - 1`.\n- While `i\
    \ < j`: compare `s[i]` and `s[j]`; if they differ, it is not a palindrome; otherwise move both inward.\n\
    - For phrases (\"A man, a plan, a canal: Panama\"), skip characters that are not letters or digits\
    \ and compare in lower case.\n- O(n) time, O(1) space. Reversing and comparing (`s == s[::-1]`) is\
    \ also O(n) but uses O(n) extra space.\n- Related problems:\n  - Valid palindrome with one deletion:\
    \ on the first mismatch, try skipping either side.\n  - Longest palindromic substring: expand around\
    \ each centre (2n − 1 centres), O(n²).\n  - Palindrome number: reverse half of the digits.\n\n## Example\n\
    ```python\ndef is_palindrome(s):\n    i, j = 0, len(s) - 1\n    while i < j:\n        if not s[i].isalnum():\n\
    \            i += 1\n        elif not s[j].isalnum():\n            j -= 1\n        elif s[i].lower()\
    \ != s[j].lower():\n            return False\n        else:\n            i += 1\n            j -=\
    \ 1\n    return True\n\nprint(is_palindrome(\"A man, a plan, a canal: Panama\"))  # True\nprint(is_palindrome(\"\
    race a car\"))                       # False\n```\n\n## Common mistakes\n- Forgetting to normalise\
    \ case or skip punctuation when the problem asks for it.\n- Off-by-one: using `i <= j` is fine but\
    \ unnecessary; the middle character never needs a check.\n- Building cleaned copies of huge strings\
    \ when two pointers avoid it.\n\n## In the interview\nAsk what counts as a character (case, spaces,\
    \ Unicode). Give the two-pointer solution and its complexity. Follow-ups: the one-deletion variant\
    \ and the longest palindromic substring with centre expansion.\n"
