- id: kb-b23c19693e30
  question: How can you remove an element from the middle of an array in O(1) when order does not matter?
  answer: Overwrite the element with the last element, then remove the last element (swap and pop). Nothing
    has to shift, so it is O(1) time and O(1) extra space, at the cost of changing the order.
  topic: leetcode
  tags:
  - arrays
  - swap-and-pop
  - time-complexity
  explanation: "## In plain words\nRemoving from the middle of an array normally means sliding every later\
    \ element one step left, which is O(n). If you do not care about order, you can fill the hole with\
    \ the last element instead, like moving the last person in a queue into an empty seat.\n\n## How it\
    \ works\n- Find the index `i` you want to remove (if you already know it).\n- Copy the last element\
    \ into position `i`.\n- Remove the last element with `pop()`, which is O(1) for dynamic arrays.\n\
    - If `i` is already the last index, just pop.\n- If you also keep a map from value to index (as in\
    \ an O(1) \"random set\"), update the moved element's index in the map.\n- Time O(1), extra space\
    \ O(1). Finding the index first, if you do not have it, is still O(n).\n\n## Example\n```python\n\
    def remove_at(a, i):\n    a[i] = a[-1]\n    a.pop()\n\nnums = [10, 20, 30, 40, 50]\nremove_at(nums,\
    \ 1)\nprint(nums)  # [10, 50, 30, 40]\n```\nThis trick powers the classic \"insert, delete and get\
    \ random in O(1)\" design problem, combined with a hash map from value to index.\n\n## Common mistakes\n\
    - Using it when the problem requires stable order.\n- Forgetting to update an index map after moving\
    \ the last element.\n- Claiming O(1) overall when you still search for the element in O(n).\n- In\
    \ JavaScript, using `splice(i, 1)`, which shifts elements and is O(n).\n\n## In the interview\nState\
    \ the trade-off out loud: constant time in exchange for order. Expect the follow-up design question\
    \ (random set with O(1) operations) and edge cases: removing the last element, an empty array, and\
    \ duplicates in the index map.\n"
