- id: kb-4e77f868fa81
  question: How do you generate a random integer from 0 up to, but not including, X in JavaScript?
  answer: Use Math.floor(Math.random() * x). Math.random() returns a float in [0, 1), multiplying scales
    it to [0, x), and Math.floor maps it to an integer from 0 to x - 1 with roughly equal probability.
  topic: leetcode
  tags:
  - javascript
  - random
  - math
  explanation: "## In plain words\n`Math.random()` gives a decimal number that is at least 0 and less\
    \ than 1. Stretch that range to the size you need and chop off the decimals, and you get a whole number\
    \ in the range you want.\n\n## How it works\n- `Math.random()` returns a value in `[0, 1)`: 0 is possible,\
    \ 1 is not.\n- Multiply by `x`: the result is in `[0, x)`.\n- `Math.floor` rounds down, giving an\
    \ integer from `0` to `x - 1`.\n- Each integer gets an equal slice of the range, so the distribution\
    \ is (close to) uniform.\n- `Math.random()` is not cryptographically secure. For tokens or anything\
    \ security related, use `crypto.getRandomValues` or Node's `crypto.randomInt(x)`.\n\n## Example\n\
    ```js\nfunction randInt(x) {\n  return Math.floor(Math.random() * x);\n}\nconsole.log(randInt(6));\
    \  // 0..5, like a zero-based die\nconst items = [\"a\", \"b\", \"c\"];\nconsole.log(items[randInt(items.length)]);\
    \  // random element\n```\n\n## Common mistakes\n- Using `Math.round`, which makes 0 and x - 1 half\
    \ as likely and can produce x.\n- Using `Math.ceil`, which shifts the range to 1..x: it returns x,\
    \ and returns 0 only when the random value is exactly 0.\n- Using `Math.random` for security tokens.\n\
    - Using `parseInt` on a float instead of `Math.floor`.\n\n## In the interview\nExplain the half-open\
    \ ranges step by step. Follow-ups: a range `[a, b]` inclusive, a random element, shuffling (Fisher–Yates),\
    \ and when you need a cryptographic random source.\n"
