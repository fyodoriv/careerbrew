  question: How do you replace recursion with an explicit stack?
  answer: 'Simulate the call stack yourself: push the starting state, then loop while the stack is not
    empty, pop a state, process it and push the states the recursive calls would have handled. This avoids
    stack overflow on deep inputs; for post-order work, push a marker or a visited flag to process a node
    after its children.'
  topic: leetcode
  tags:
  - recursion
  - stack
  - dfs
  - iteration
  explanation: "## In plain words\nEvery recursive call is the computer quietly pushing a frame onto its\
    \ call stack and popping it when the call returns. You can do the same thing with your own list, which\
    \ you control and which does not have the language's depth limit.\n\n## How it works\n- Decide what\
    \ a \"frame\" needs: usually the node or the arguments, sometimes partial results.\n- Push the initial\
    \ frame.\n- Loop: pop a frame, do the work the function body did, push frames for each \"recursive\
    \ call\".\n- **Order**: a stack is last-in, first-out, so push children in reverse if you want left\
    \ before right.\n- **Post-order** (work after children, such as computing sizes): push `(node, False)`;\
    \ when popped with `False`, push `(node, True)` and then the children; when popped with `True`, do\
    \ the work.\n- Complexity is unchanged: O(n) time and O(depth) or O(n) extra space, but on the heap\
    \ instead of the call stack.\n- Using a queue instead of a stack turns DFS into BFS.\n\n## Example\n\
    ```python\ndef dfs_iterative(graph, start):\n    seen, order, stack = set(), [], [start]\n    while\
    \ stack:\n        node = stack.pop()\n        if node in seen:\n            continue\n        seen.add(node)\n\
    \        order.append(node)\n        for nxt in reversed(graph[node]):\n            stack.append(nxt)\n\
    \    return order\n\ng = {\"A\": [\"B\", \"C\"], \"B\": [\"D\"], \"C\": [], \"D\": []}\nprint(dfs_iterative(g,\
    \ \"A\"))  # ['A', 'B', 'D', 'C']\n```\n\n## Common mistakes\n- Pushing children in the wrong order\
    \ and getting a different traversal.\n- Marking nodes visited at the wrong time, which causes duplicates\
    \ in graphs.\n- Forgetting the post-order case, where work must wait for children.\n\n## In the interview\n\
    Explain why: recursion depth limits (Python's default is about 1000) and control. Show a DFS example,\
    \ then mention post-order with markers. Follow-up: iterative in-order traversal of a binary tree.\n"
