- id: kb-7caf6118545f
  question: How do you approach LeetCode array problems?
  answer: 'Match the problem to a known pattern: two pointers for sorted data or in-place rewriting, sliding
    window for contiguous subarrays, prefix sums for range sums, hash maps for lookups and counts, sorting
    plus a scan, binary search on sorted data or on the answer, and Kadane for maximum subarray. Start
    from brute force, then remove repeated work.'
  topic: leetcode
  tags:
  - arrays
  - patterns
  - two-pointers
  - sliding-window
  - prefix-sum
  explanation: "## In plain words\nMost array problems are variations of a small set of patterns. The\
    \ skill is recognising the clue in the problem statement (sorted? contiguous? count pairs?) and picking\
    \ the pattern that turns an O(n²) idea into O(n) or O(n log n).\n\n## How it works\n- **Two pointers**:\
    \ sorted input, pairs, palindromes, removing items in place. One pointer reads, one writes; or pointers\
    \ move inward from both ends.\n- **Sliding window**: \"longest/shortest contiguous subarray with property\
    \ X\". Grow the right edge, shrink the left while the window is invalid.\n- **Prefix sums**: many\
    \ range-sum queries, or \"subarray sums to k\" with a hash map of prefix counts.\n- **Hash map or\
    \ set**: seen-before checks, counting frequencies, complements.\n- **Sort first**: intervals, grouping,\
    \ greedy choices.\n- **Binary search**: sorted arrays, rotated arrays, or searching the smallest feasible\
    \ answer.\n- **Kadane's algorithm**: maximum subarray sum in O(n).\n- Process: clarify input size\
    \ and edge cases, write brute force, find repeated work, apply the pattern, test with small cases.\n\
    \n## Example\nMaximum subarray sum with Kadane's algorithm:\n```python\ndef max_subarray(a):\n   \
    \ best = cur = a[0]\n    for x in a[1:]:\n        cur = max(x, cur + x)   # extend the run or restart\
    \ at x\n        best = max(best, cur)\n    return best\n\nprint(max_subarray([-2, 1, -3, 4, -1, 2,\
    \ 1, -5, 4]))  # 6\n```\nO(n) time, O(1) space.\n\n## Common mistakes\n- Jumping into code without\
    \ asking about empty arrays, negatives or duplicates.\n- Using a sliding window when values can be\
    \ negative and the condition is not monotonic (prefix sums fit better).\n- Off-by-one errors in window\
    \ bounds.\n- Not stating time and space complexity.\n\n## In the interview\nTalk through the pattern\
    \ you recognise and why it fits. Interviewers score communication, correct complexity, edge cases\
    \ and testing on a small example. Keep a short checklist of the patterns above to scan through when\
    \ stuck.\n"
  match:
  - a011074cf93c
  prompt: 1f344914
- id: kb-b56d0df6e682
  question: How do you approach LeetCode hash table problems?
  answer: 'Use a hash map or set whenever you need O(1) average lookups: checking whether you have seen
    something, counting frequencies, mapping a value to an index, or grouping by a computed key. It usually
    trades O(n) extra memory to turn an O(n²) search into O(n).'
  topic: leetcode
  tags:
  - hash-map
  - hash-set
  - patterns
  - counting
  explanation: "## In plain words\nA hash table is a set of labelled drawers: give it a key and it jumps\
    \ straight to the right drawer. Whenever a brute-force solution has an inner loop that searches for\
    \ something, ask whether a hash table could remember it instead.\n\n## How it works\n- **Seen set**:\
    \ duplicates, cycle detection, \"does the complement exist?\" (Two Sum).\n- **Frequency map**: anagrams,\
    \ top-k frequent elements, majority element, first unique character.\n- **Value to index**: Two Sum,\
    \ O(1) delete from a list with swap-and-pop.\n- **Group by key**: group anagrams by sorted letters\
    \ or letter counts; group points by slope.\n- **Prefix-sum counts**: \"number of subarrays summing\
    \ to k\" stores how often each prefix sum appeared.\n- **Costs**: average O(1) insert and lookup,\
    \ worst case O(n) with many collisions; O(n) extra space; keys must be hashable (use tuples, not lists,\
    \ in Python).\n\n## Example\nCount subarrays whose sum equals k:\n```python\nfrom collections import\
    \ defaultdict\n\ndef subarray_sum(nums, k):\n    count, prefix = 0, 0\n    seen = defaultdict(int)\n\
    \    seen[0] = 1\n    for x in nums:\n        prefix += x\n        count += seen[prefix - k]\n   \
    \     seen[prefix] += 1\n    return count\n\nprint(subarray_sum([1, 1, 1], 2))  # 2\n```\nO(n) time\
    \ and O(n) space, compared with O(n²) for checking every subarray.\n\n## Common mistakes\n- Forgetting\
    \ the base case (`seen[0] = 1` above).\n- Using mutable values as keys.\n- Assuming ordered iteration\
    \ in languages where maps are unordered.\n- Ignoring the memory cost when the input is huge.\n\n##\
    \ In the interview\nSay why a hash table helps (it removes an inner search loop) and state the space\
    \ trade-off. Follow-ups: how hash tables work (hashing, buckets, collision handling, resizing), and\
    \ when sorting plus two pointers is better because it uses O(1) extra space.\n"
