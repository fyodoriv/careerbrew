- id: kb-fa7edcffb266
  question: How do you build a stack or queue that can return its minimum or maximum in O(1)?
  answer: 'For a stack, keep a second stack whose top is the current minimum; push and pop it in step
    with the main stack. For a queue, keep a monotonic deque of candidates: drop smaller (for max) values
    from its back on push and pop its front when that value leaves the queue. Every operation is O(1)
    or amortised O(1).'
  topic: leetcode
  tags:
  - stack
  - queue
  - monotonic-deque
  - design
  explanation: "## In plain words\nThe trick is to store extra information at the moment you add an element,\
    \ so you never have to scan everything to answer \"what is the smallest right now?\".\n\n## How it\
    \ works\n**Min stack**\n- Main stack holds values; helper stack holds the minimum so far at each depth.\n\
    - Push `x`: push `x`, and push `min(x, helper.top)` onto the helper.\n- Pop: pop both. `getMin` is\
    \ `helper.top`. All O(1), O(n) extra space.\n\n**Max queue (monotonic deque)**\n- Main queue holds\
    \ values; a deque holds candidates in decreasing order.\n- Push `x`: while the deque's back is smaller\
    \ than `x`, pop it (it can never be the max again); then append `x`.\n- Pop: remove from the main\
    \ queue; if that value equals the deque's front, pop the front too.\n- `getMax` is the deque's front.\
    \ Each value enters and leaves the deque once, so operations are amortised O(1).\n- The same deque\
    \ idea solves \"sliding window maximum\".\n\n## Example\n```python\nclass MinStack:\n    def __init__(self):\n\
    \        self.s, self.m = [], []\n    def push(self, x):\n        self.s.append(x)\n        self.m.append(x\
    \ if not self.m else min(x, self.m[-1]))\n    def pop(self):\n        self.m.pop()\n        return\
    \ self.s.pop()\n    def get_min(self):\n        return self.m[-1]\n\nst = MinStack()\nfor x in [5,\
    \ 3, 7, 2]:\n    st.push(x)\nprint(st.get_min())  # 2\nst.pop()\nprint(st.get_min())  # 3\n```\n\n\
    ## Common mistakes\n- Storing only one \"current min\" variable, which is lost when that element is\
    \ popped.\n- In the deque, using `<=` versus `<` incorrectly so duplicates are dropped too early.\n\
    - Claiming strict O(1) for the deque instead of amortised O(1).\n\n## In the interview\nExplain the\
    \ invariant of each helper structure before coding. Follow-ups: do it with O(1) extra space (store\
    \ differences), a queue built from two min-stacks, and sliding window maximum in O(n).\n"
  match:
