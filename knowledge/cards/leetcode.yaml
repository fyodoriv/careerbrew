- id: kb-1d108a2f7d6c
  question: How do you invert (mirror) a binary tree?
  answer: Swap the left and right child of every node, recursively or with a queue. Each node is visited
    once, so it runs in O(n) time with O(h) stack space recursively (h is the tree height) or O(w) queue
    space iteratively.
  topic: leetcode
  tags:
  - binary-tree
  - recursion
  - dfs
  - bfs
  explanation: "## In plain words\nMirroring a tree is like holding it up to a mirror: everything on the\
    \ left ends up on the right. If you swap the two children of every node, the whole tree is mirrored.\n\
    \n## How it works\n- **Recursive (DFS)**: for a node, invert its left and right subtrees, then swap\
    \ them. The base case is an empty node.\n- **Iterative (BFS)**: put the root in a queue; pop a node,\
    \ swap its children, push the non-empty children; repeat.\n- Both visit every node once: O(n) time.\n\
    - Space: recursion uses O(h), up to O(n) for a skewed tree (watch for stack overflow); BFS uses O(w),\
    \ the widest level.\n- The operation is done in place.\n\n## Example\n```python\nclass Node:\n   \
    \ def __init__(self, val, left=None, right=None):\n        self.val, self.left, self.right = val,\
    \ left, right\n\ndef invert(root):\n    if root is None:\n        return None\n    root.left, root.right\
    \ = invert(root.right), invert(root.left)\n    return root\n\nt = invert(Node(4, Node(2, Node(1),\
    \ Node(3)), Node(7, Node(6), Node(9))))\nprint(t.left.val, t.right.val, t.left.left.val)  # 7 2 9\n\
    ```\n\n## Common mistakes\n- Swapping before recursing using already overwritten references (in languages\
    \ without tuple assignment, use a temp variable).\n- Forgetting the null base case.\n- Returning nothing\
    \ when the caller expects the root.\n- Not mentioning the stack depth risk for very deep trees.\n\n\
    ## In the interview\nGive the recursive version first, then offer the iterative one. State complexity.\
    \ Follow-ups: check whether a tree is symmetric (compare left and right mirrors), and iterative traversal\
    \ with an explicit stack.\n"
