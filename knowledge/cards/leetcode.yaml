  question: How do you solve k-sum problems such as Two Sum?
  answer: 'Two Sum on unsorted input uses a hash map of seen values: for each number check whether target
    minus it was seen, giving O(n) time and space. On sorted input, two pointers from both ends give O(n)
    time and O(1) space. For k-sum, sort, fix elements in loops or recursion down to a two-pointer 2-sum,
    skipping duplicates; it costs O(n^(k-1)).'
  topic: leetcode
  tags:
  - two-sum
  - hash-map
  - two-pointers
  - k-sum
  explanation: "## In plain words\nTwo Sum asks for two numbers that add up to a target. Instead of trying\
    \ every pair, you remember what you have already seen, or you use sorted order to move toward the\
    \ target. Bigger k-sum problems peel off one number at a time until only Two Sum is left.\n\n## How\
    \ it works\n- **Hash map 2-sum**: walk the array; for each `x`, if `target - x` is in the map, you\
    \ found a pair; otherwise store `x` with its index. O(n) time, O(n) space.\n- **Two pointers 2-sum**\
    \ (sorted): `lo` at the start, `hi` at the end. If the sum is too small, move `lo` right; too big,\
    \ move `hi` left; equal, record it.\n- **3-sum**: sort, then for each `i`, run two pointers on the\
    \ rest with target `target - a[i]`. Skip equal `a[i]` values to avoid duplicate triplets. O(n²).\n\
    - **k-sum**: recursively reduce to (k-1)-sum until 2-sum. O(n^(k-1)) after an O(n log n) sort.\n\n\
    ## Example\n```python\ndef two_sum(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n\
    \        if target - x in seen:\n            return [seen[target - x], i]\n        seen[x] = i\n \
    \   return []\n\nprint(two_sum([2, 7, 11, 15], 9))  # [0, 1]\n```\n\n## Common mistakes\n- Storing\
    \ the current value before checking, which can pair an element with itself.\n- Forgetting duplicate-skipping\
    \ in 3-sum, producing repeated triplets.\n- Sorting when the answer needs original indices (sort index\
    \ pairs instead, or use the hash map).\n- Integer overflow on sums in fixed-size integer languages.\n\
    \n## In the interview\nState the brute force O(n²), then improve. Ask whether the input is sorted,\
    \ whether indices or values are needed, and whether duplicates matter, because these decide hash map\
    \ versus two pointers. Follow-ups: 3-sum closest, 4-sum, and counting pairs.\n"
