  prompt: 1f344914
- id: kb-a7de72e281e2
  question: How do you check whether a value is a function in JavaScript?
  answer: Use typeof value === "function". It returns true for regular functions, arrow functions, classes,
    async functions, generators and bound functions, and is safe on undeclared or null values.
  topic: leetcode
  tags:
  - javascript
  - type-checking
  - functions
  explanation: '## In plain words

    In JavaScript, functions are objects that can be called. The `typeof` operator has a special result,
    `"function"`, for exactly those callable objects, so it is the simplest and most reliable check.


    ## How it works

    - `typeof fn === "function"` is true for anything with an internal call method: declarations, expressions,
    arrows, `async` functions, generator functions, bound functions and classes.

    - It works across frames and realms, unlike `instanceof Function`, which fails for functions from
    another iframe.

    - `typeof null` is `"object"`, so there is no false positive for null.

    - If you need to exclude classes (which throw when called without `new`), there is no perfect check;
    avoid relying on it.

    - In TypeScript, `typeof x === "function"` also narrows the type.


    ## Example

    ```js

    const isFunction = (v) => typeof v === "function";

    console.log(isFunction(() => {}));        // true

    console.log(isFunction(async () => {}));  // true

    console.log(isFunction(class A {}));      // true

    console.log(isFunction({}));              // false

    console.log(isFunction(null));            // false

    ```


    ## Common mistakes

    - Using `instanceof Function`, which breaks across realms.

    - Using `Object.prototype.toString.call(v) === "[object Function]"`, which returns `"[object AsyncFunction]"`
    for async functions.

    - Forgetting that classes count as functions.


    ## In the interview

    Give the one-liner and explain why it beats `instanceof`. Mention the class edge case. A follow-up
    might ask for an `isObject` or `isArray` helper, or why `typeof null` is `"object"` (a historic bug
    kept for compatibility).

    '
