  question: What is an anagram, and how do you check for one?
  answer: Two strings are anagrams when they contain the same characters with the same counts in any order,
    like "listen" and "silent". Compare character counts with a hash map or a fixed 26-slot array in O(n)
    time, or compare sorted strings in O(n log n).
  topic: leetcode
  tags:
  - strings
  - hash-map
  - counting
  - anagram
  explanation: "## In plain words\nAn anagram is a rearrangement: same letters, same number of each, different\
    \ order. So the question is really \"do these two strings have identical letter counts?\".\n\n## How\
    \ it works\n- If lengths differ, return false immediately.\n- **Counting**: add 1 for each character\
    \ in the first string, subtract 1 for each in the second; all counts must end at zero. O(n) time,\
    \ O(1) space for a fixed alphabet (26 letters), O(k) for k distinct characters in general.\n- **Sorting**:\
    \ sort both strings and compare. O(n log n) time, simpler to write.\n- Clarify case sensitivity, spaces\
    \ and Unicode.\n- Related problems:\n  - Group anagrams: use the sorted string or a tuple of 26 counts\
    \ as a hash map key.\n  - Find all anagram positions of a pattern in a text: a sliding window of fixed\
    \ length with a running count, O(n).\n\n## Example\n```python\nfrom collections import Counter\n\n\
    def is_anagram(a, b):\n    return len(a) == len(b) and Counter(a) == Counter(b)\n\ndef group_anagrams(words):\n\
    \    groups = {}\n    for w in words:\n        groups.setdefault(\"\".join(sorted(w)), []).append(w)\n\
    \    return list(groups.values())\n\nprint(is_anagram(\"listen\", \"silent\"))  # True\nprint(group_anagrams([\"\
    eat\", \"tea\", \"tan\", \"ate\", \"nat\"]))\n# [['eat', 'tea', 'ate'], ['tan', 'nat']]\n```\n\n##\
    \ Common mistakes\n- Comparing sets of characters, which ignores counts (\"aab\" and \"abb\").\n-\
    \ Forgetting the length check.\n- Using a list as a dictionary key in Python instead of a tuple or\
    \ string.\n\n## In the interview\nGive both approaches and their complexities, then pick counting\
    \ for speed. Follow-ups: group anagrams, the sliding-window \"find all anagrams\" problem, and handling\
    \ Unicode.\n"
