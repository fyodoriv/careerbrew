  question: How does Array.prototype.push work in JavaScript?
  answer: push(...items) appends one or more items to the end of the array in place and returns the new
    length. It is amortised O(1) per item because the engine grows the backing storage in chunks.
  topic: leetcode
  tags:
  - javascript
  - arrays
  - push
  explanation: '## In plain words

    `push` adds items to the end of an array, like placing books on the end of a shelf. It changes the
    original array and tells you how many items it now holds.


    ## How it works

    - `arr.push(a, b, c)` appends the arguments in order.

    - It returns the new `length`, not the array, so `arr.push(x).push(y)` does not work.

    - It mutates the array. In immutable code, such as React state, use `[...arr, x]` instead.

    - Engines over-allocate capacity and copy when full, so a single push is occasionally O(n) but amortised
    O(1).

    - `push(...other)` spreads another array as arguments; very large arrays can exceed the argument limit.

    - Pairs: `pop` removes from the end (O(1)); `unshift` and `shift` work at the front and are O(n) because
    elements move.


    ## Example

    ```js

    const stack = [1, 2];

    const len = stack.push(3, 4);

    console.log(len);    // 4

    console.log(stack);  // [1, 2, 3, 4]

    console.log(stack.pop());  // 4

    const next = [...stack, 5];  // non-mutating append

    console.log(stack, next);    // [1, 2, 3] [1, 2, 3, 5]

    ```


    ## Common mistakes

    - Expecting `push` to return the array.

    - Mutating state directly in frameworks that need new references to re-render.

    - Using `unshift` in a loop for large arrays and getting O(n²).

    - Pushing an array when you meant to push its items (`push(arr)` versus `push(...arr)`).


    ## In the interview

    Cover the return value, mutation and amortised cost. Mention that `push` and `pop` make arrays good
    stacks, while queues need a different structure or an index pointer because `shift` is O(n).

    '
