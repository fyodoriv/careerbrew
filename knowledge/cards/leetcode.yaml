  question: What is the rolling array technique in dynamic programming?
  answer: When each DP row depends only on the previous row (or a few earlier states), keep just those
    rows instead of the whole table, reusing them as you go. This cuts space from O(n·m) to O(m), or from
    O(n) to O(1), without changing the time.
  topic: leetcode
  tags:
  - dynamic-programming
  - space-optimization
  - arrays
  explanation: "## In plain words\nMany DP tables are filled row by row, and each row only looks at the\
    \ row above it. Keeping the whole table is like keeping every page of a calculation when you only\
    \ need the last one. A rolling array keeps only what the next step needs.\n\n## How it works\n- Look\
    \ at the recurrence and find how far back it reaches: `dp[i]` uses `dp[i-1]` and `dp[i-2]`? Keep two\
    \ variables.\n- For 2D tables where row `i` uses only row `i-1`, keep two rows and swap them, or use\
    \ one row and update it carefully.\n- **Update order matters** with a single row:\n  - 0/1 knapsack:\
    \ loop capacity from high to low, so each item is used once.\n  - Unbounded knapsack: loop low to\
    \ high, so an item can be reused.\n- Indexing by `i % 2` is a common way to alternate two rows.\n\
    - Trade-off: you lose the full table, so reconstructing the actual solution path needs extra bookkeeping.\n\
    \n## Example\nClimbing stairs (ways to reach step n with 1 or 2 steps), O(1) space:\n```python\ndef\
    \ climb_stairs(n):\n    prev, cur = 1, 1          # ways to reach step 0 and step 1\n    for _ in\
    \ range(n - 1):\n        prev, cur = cur, prev + cur\n    return cur\n\nprint(climb_stairs(5))  #\
    \ 8\n```\nThe full table would need O(n) space; the rolling version keeps two numbers.\n\n## Common\
    \ mistakes\n- Updating a single row in the wrong direction and reusing values from the current step.\n\
    - Applying it when the recurrence needs more than the previous row.\n- Losing the information needed\
    \ to rebuild the chosen items or path.\n\n## In the interview\nWrite the full DP first, then point\
    \ out which states each cell uses and shrink the storage. Interviewers like seeing the knapsack loop-direction\
    \ argument. Mention that the time complexity stays the same.\n"
