  question: What is a two-pass (or multiple-pass) array traversal?
  answer: It means scanning the array more than once, where an early pass computes information (totals,
    counts, prefix or suffix values) that a later pass uses. Each pass is O(n), so a constant number of
    passes is still O(n) and often replaces an O(n²) nested loop.
  topic: leetcode
  tags:
  - arrays
  - prefix-suffix
  - patterns
  explanation: "## In plain words\nSometimes you cannot answer a question about an element until you know\
    \ something about the whole array, or about everything to its right. Do one walk to collect that information,\
    \ then a second walk to use it.\n\n## How it works\n- **Pass 1 gathers, pass 2 answers**: count frequencies,\
    \ then find the first unique element; sum the array, then find the pivot index where left sum equals\
    \ right sum.\n- **Left and right passes**: compute a prefix value from the left and a suffix value\
    \ from the right, then combine. Examples: product of array except self, trapping rain water, candy\
    \ distribution.\n- **Complexity**: k passes of O(n) is O(k · n) = O(n) for constant k. Space is O(1)\
    \ to O(n) depending on what you store.\n- Many two-pass solutions can be squeezed into one pass with\
    \ running variables, but two clear passes are often easier to get right in an interview.\n\n## Example\n\
    Product of array except self without division:\n```python\ndef product_except_self(a):\n    n = len(a)\n\
    \    out = [1] * n\n    left = 1\n    for i in range(n):            # pass 1: product of everything\
    \ to the left\n        out[i] = left\n        left *= a[i]\n    right = 1\n    for i in range(n -\
    \ 1, -1, -1):  # pass 2: multiply by everything to the right\n        out[i] *= right\n        right\
    \ *= a[i]\n    return out\n\nprint(product_except_self([1, 2, 3, 4]))  # [24, 12, 8, 6]\n```\nO(n)\
    \ time, O(1) extra space besides the output.\n\n## Common mistakes\n- Thinking two passes means O(n²);\
    \ it is still linear.\n- Off-by-one errors in the right-to-left loop.\n- Including the current element\
    \ in the prefix or suffix when it should be excluded.\n\n## In the interview\nSay \"I will do one\
    \ pass to gather X, then one to compute the answer\", and state that it stays O(n). Follow-up: can\
