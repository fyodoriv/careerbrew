- id: kb-189682a9c1a8
  question: How do you generate a random integer between a and b, inclusive, in JavaScript?
  answer: Use Math.floor(Math.random() * (b - a + 1)) + a. The range has b - a + 1 possible values; scaling
    and flooring picks one of them, and adding a shifts it to start at a.
  topic: leetcode
  tags:
  - javascript
  - random
  - math
  explanation: "## In plain words\nFirst count how many integers you want to choose from: from `a` to\
    \ `b` inclusive there are `b - a + 1`. Pick a random number in `0` to that count minus one, then slide\
    \ it up so it starts at `a`.\n\n## How it works\n- `Math.random()` is in `[0, 1)`.\n- Multiply by\
    \ `b - a + 1`: now in `[0, b - a + 1)`.\n- `Math.floor`: an integer from `0` to `b - a`.\n- Add `a`:\
    \ an integer from `a` to `b`, each roughly equally likely.\n- Assumes `a` and `b` are integers with\
    \ `a <= b`; round them first (`Math.ceil(a)`, `Math.floor(b)`) if they might not be.\n- For security-sensitive\
    \ values use Node's `crypto.randomInt(a, b + 1)` (its upper bound is exclusive) or `crypto.getRandomValues`.\n\
    \n## Example\n```js\nfunction randBetween(a, b) {\n  return Math.floor(Math.random() * (b - a + 1))\
    \ + a;\n}\nconsole.log(randBetween(1, 6));    // dice roll: 1..6\nconsole.log(randBetween(-3, 3));\
    \   // -3..3, works with negatives\n```\n\n## Common mistakes\n- Forgetting the `+ 1`, which makes\
    \ `b` impossible.\n- Using `Math.round`, which skews the ends.\n- Applying `Math.floor` after adding\
    \ a non-integer `a`.\n- Using `Math.random` where unpredictability matters.\n\n## In the interview\n\
    Derive the formula from the count of values, which shows you understand rather than memorise it. Mention\
    \ the inclusive versus exclusive convention, and test the edges mentally (when `Math.random()` is\
    \ 0 you get `a`; just under 1 you get `b`).\n"
