  question: When should you use a greedy algorithm, and when dynamic programming?
  answer: Use greedy when a locally best choice can be proven to lead to a global optimum (greedy-choice
    property), as in interval scheduling or Huffman coding. Use dynamic programming when choices interact
    and subproblems overlap, so you must compare options, as in 0/1 knapsack or coin change with arbitrary
    coins.
  topic: leetcode
  tags:
  - greedy
  - dynamic-programming
  - algorithm-design
  explanation: "## In plain words\nA greedy algorithm grabs the best-looking option at each step and never\
    \ looks back. Dynamic programming (DP) considers every relevant option for each subproblem, remembers\
    \ the results, and builds the best answer from them. Greedy is faster but only correct for problems\
    \ with the right structure.\n\n## How it works\n- **Both need optimal substructure**: an optimal solution\
    \ contains optimal solutions to subproblems.\n- **Greedy also needs the greedy-choice property**:\
    \ some locally best choice is always part of an optimal solution. Prove it with an exchange argument\
    \ (swap any optimal solution's first choice for the greedy one without making it worse).\n- **DP fits\
    \ when**:\n  - Subproblems overlap (the same state is reached many ways).\n  - The best choice depends\
    \ on future consequences.\n  - You need to count ways or check feasibility, not just optimise.\n-\
    \ **Practical test**: try to find a counterexample to the greedy rule on small inputs. If one exists,\
    \ use DP.\n- Greedy is usually O(n log n) after sorting; DP is often O(n · state size).\n\n## Example\n\
    Coin change with coins `[1, 3, 4]` and amount `6`: greedy takes 4 + 1 + 1 (three coins), but the best\
    \ is 3 + 3 (two coins). DP fixes it:\n```python\ndef min_coins(coins, amount):\n    dp = [0] + [float(\"\
    inf\")] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <=\
    \ a:\n                dp[a] = min(dp[a], dp[a - c] + 1)\n    return dp[amount] if dp[amount] != float(\"\
    inf\") else -1\n\nprint(min_coins([1, 3, 4], 6))  # 2\n```\nO(amount × coins) time, O(amount) space.\
    \ With standard coin systems such as `[1, 5, 10, 25]`, greedy happens to be optimal.\n\n## Common\
    \ mistakes\n- Assuming greedy works because it passed one example.\n- Using DP where a simple greedy\
    \ rule is provably optimal, wasting time and memory.\n- Picking the wrong greedy key (for interval\
    \ scheduling, sort by end time, not start or length).\n\n## In the interview\nName the two properties\
    \ and show a counterexample-driven decision. Interviewers like hearing \"let me check a small counterexample\
    \ before committing to greedy\". Classic greedy cases: activity selection, jump game, gas station.\
    \ Classic DP: knapsack, edit distance, longest increasing subsequence.\n"
