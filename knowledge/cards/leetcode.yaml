  question: How do you solve merge intervals problems?
  answer: 'Sort intervals by start, then scan once: if the current interval starts at or before the end
    of the last merged one, extend that end to the larger of the two ends; otherwise start a new merged
    interval. It runs in O(n log n) time for the sort and O(n) for the output.'
  topic: leetcode
  tags:
  - intervals
  - sorting
  - greedy
  explanation: "## In plain words\nThink of meetings on a calendar. Once they are sorted by start time,\
    \ any overlapping meetings sit next to each other, so you can sweep from left to right and glue together\
    \ the ones that touch.\n\n## How it works\n- Sort by start time.\n- Keep a result list. For each interval\
    \ `[s, e]`:\n  - If the result is empty or `s > last_end`, append it as a new block.\n  - Otherwise\
    \ they overlap: set `last_end = max(last_end, e)`.\n- Decide whether touching intervals (`[1, 2]`\
    \ and `[2, 3]`) count as overlapping; the usual problem says yes.\n- Related problems:\n  - Insert\
    \ an interval into a sorted list: add the ones before, merge the overlapping ones, add the rest. O(n).\n\
    \  - Meeting rooms (minimum rooms): sort starts and ends separately, or use a min-heap of end times.\n\
    \  - Non-overlapping intervals (fewest removals): sort by end and greedily keep the earliest finishing\
    \ ones.\n\n## Example\n```python\ndef merge(intervals):\n    intervals.sort(key=lambda iv: iv[0])\n\
    \    out = []\n    for s, e in intervals:\n        if out and s <= out[-1][1]:\n            out[-1][1]\
    \ = max(out[-1][1], e)\n        else:\n            out.append([s, e])\n    return out\n\nprint(merge([[1,\
    \ 3], [8, 10], [2, 6], [15, 18]]))  # [[1, 6], [8, 10], [15, 18]]\n```\n\n## Common mistakes\n- Forgetting\
    \ to sort first.\n- Setting the end to `e` instead of `max(last_end, e)`, which breaks when one interval\
    \ contains another.\n- Mishandling touching intervals.\n- Mutating the caller's input without saying\
    \ so.\n\n## In the interview\nClarify whether touching intervals merge and whether input is sorted.\
    \ State the O(n log n) complexity and why sorting is the key step. Follow-ups: insert interval, meeting\
    \ rooms II with a heap, and interval intersection with two pointers.\n"
