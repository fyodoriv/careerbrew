  question: How do you merge two arrays in JavaScript?
  answer: Use [...a, ...b] or a.concat(b); both return a new array and leave the originals unchanged in
    O(n + m). To append in place, use a.push(...b) for small arrays or a loop for very large ones. For
    merging two sorted arrays into sorted order, use two pointers.
  topic: leetcode
  tags:
  - javascript
  - arrays
  - concat
  - spread
  explanation: "## In plain words\n\"Merge\" can mean two things: glue one array onto another, or combine\
    \ two sorted arrays into one sorted array. JavaScript has built-ins for the first; the second is a\
    \ classic two-pointer exercise.\n\n## How it works\n- **Concatenate (new array)**: `a.concat(b)` or\
    \ `[...a, ...b]`. O(n + m) time and space; originals untouched. `concat` also flattens array arguments\
    \ one level.\n- **Append in place**: `a.push(...b)`. Spreading passes every element as an argument,\
    \ so huge arrays (hundreds of thousands) can hit the argument limit; use a loop then.\n- **Merge sorted\
    \ arrays**: walk both with pointers `i` and `j`, always take the smaller current element, then append\
    \ the leftovers. O(n + m) time.\n- **Unique merge**: `[...new Set([...a, ...b])]`.\n\n## Example\n\
    ```js\nconst a = [1, 4, 7], b = [2, 3, 9];\nconsole.log([...a, ...b]);  // [1, 4, 7, 2, 3, 9]\n\n\
    function mergeSorted(x, y) {\n  const out = [];\n  let i = 0, j = 0;\n  while (i < x.length && j <\
    \ y.length) out.push(x[i] <= y[j] ? x[i++] : y[j++]);\n  while (i < x.length) out.push(x[i++]);\n\
    \  while (j < y.length) out.push(y[j++]);\n  return out;\n}\nconsole.log(mergeSorted(a, b));  // [1,\
    \ 2, 3, 4, 7, 9]\n```\n\n## Common mistakes\n- Using `a + b`, which produces a string.\n- Sorting\
    \ the concatenation for sorted inputs: O((n + m) log(n + m)) instead of linear.\n- `push(...huge)`\
    \ causing a \"Maximum call stack size exceeded\" error.\n- Forgetting the leftover elements in the\
    \ two-pointer merge.\n\n## In the interview\nAsk which meaning they want. Show both the built-in and\
    \ the sorted merge. Follow-ups: merging in place into the first array from the end (the classic \"\
