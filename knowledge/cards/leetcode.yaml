- id: kb-4268df2b4d56
  question: How do you approach LeetCode recursion problems?
  answer: Define what the function returns for a given input, write the base cases, and express the answer
    for a bigger input in terms of smaller calls, trusting the recursive call. Add memoization when subproblems
    repeat, and use backtracking (choose, explore, undo) to enumerate combinations.
  topic: leetcode
  tags:
  - recursion
  - backtracking
  - memoization
  - divide-and-conquer
  explanation: "## In plain words\nRecursion solves a problem by solving smaller copies of it. You do\
    \ not need to trace every call in your head: if the function is correct for smaller inputs and the\
    \ base case is right, it is correct for bigger ones, just like induction in maths.\n\n## How it works\n\
    - **Define the contract**: \"`f(node)` returns the height of the subtree at `node`\".\n- **Base case**:\
    \ the smallest input with a direct answer (empty node, empty string, n == 0).\n- **Recursive case**:\
    \ combine results of smaller calls.\n- **Patterns**:\n  - Tree recursion: answers built from children\
    \ (height, path sums).\n  - Divide and conquer: split, solve halves, merge (merge sort).\n  - Backtracking:\
    \ build a partial solution, recurse, then undo the choice (subsets, permutations, N-Queens).\n  -\
    \ Memoization: cache results of repeated subproblems; this is top-down dynamic programming.\n- **Cost**:\
    \ count calls times work per call; space is the recursion depth plus any cache.\n\n## Example\nAll\
    \ subsets with backtracking:\n```python\ndef subsets(nums):\n    out, path = [], []\n    def go(i):\n\
    \        if i == len(nums):\n            out.append(path[:])\n            return\n        go(i + 1)\
    \              # skip nums[i]\n        path.append(nums[i])   # choose nums[i]\n        go(i + 1)\n\
    \        path.pop()             # undo\n    go(0)\n    return out\n\nprint(subsets([1, 2]))  # [[],\
    \ [2], [1], [1, 2]]\n```\nO(n · 2ⁿ) time, O(n) recursion depth.\n\n## Common mistakes\n- Missing or\
    \ wrong base cases, causing infinite recursion.\n- Appending `path` instead of a copy in backtracking.\n\
    - Exponential time from repeated subproblems with no memoization (naive Fibonacci).\n- Ignoring recursion\
    \ depth limits on large inputs.\n\n## In the interview\nState the function's contract and base case\
    \ aloud before coding. Analyse complexity with the recursion tree. Follow-ups: convert to memoized\
    \ or bottom-up DP, or to an iterative version with a stack.\n"
  match:
  - d9edd4ff25ca
  prompt: 1f344914
- id: kb-d65d717c7707
  question: How do you approach LeetCode stack problems?
  answer: 'Reach for a stack when the most recent unfinished item matters: matching brackets, undo, evaluating
    expressions, iterative DFS, and "next greater or smaller element" problems, which use a monotonic
    stack to get O(n) time.'
  topic: leetcode
  tags:
  - stack
  - monotonic-stack
  - patterns
  explanation: "## In plain words\nA stack is a pile of plates: you only touch the top one. It fits any\
    \ problem where the thing you opened last must be closed first, or where you need to remember earlier\
    \ items until something resolves them.\n\n## How it works\n- **Matching pairs**: push opening brackets,\
    \ pop on a closing one and check it matches; valid if the stack is empty at the end.\n- **Expression\
    \ evaluation**: operands and operators on stacks (calculator problems, Reverse Polish Notation).\n\
    - **Monotonic stack**: keep indexes whose values are in increasing or decreasing order. When a new\
    \ value breaks the order, pop items; the new value is their \"next greater\" (or smaller) element.\
    \ Each index is pushed and popped once, so O(n). Used for daily temperatures, largest rectangle in\
    \ a histogram, and trapping rain water.\n- **Simulating recursion**: iterative DFS and tree traversals.\n\
    - **Undo and history**: browser back, text editor undo, simplifying paths.\n\n## Example\nDays until\
    \ a warmer temperature (next greater element):\n```python\ndef daily_temperatures(t):\n    ans = [0]\
    \ * len(t)\n    stack = []                      # indexes with no warmer day found yet\n    for i,\
    \ x in enumerate(t):\n        while stack and t[stack[-1]] < x:\n            j = stack.pop()\n   \
    \         ans[j] = i - j\n        stack.append(i)\n    return ans\n\nprint(daily_temperatures([73,\
    \ 74, 75, 71, 69, 72, 76, 73]))\n# [1, 1, 4, 2, 1, 1, 0, 0]\n```\nO(n) time, O(n) space.\n\n## Common\
    \ mistakes\n- Popping from an empty stack.\n- Storing values when you need indexes (to compute distances).\n\
    - Choosing the wrong comparison (`<` versus `<=`) with duplicates.\n- Calling the monotonic stack\
    \ O(n²) because of the inner `while`; it is amortised O(n).\n\n## In the interview\nName the clue\
    \ (\"most recent\", \"next greater\", \"nested\") and the invariant the stack keeps. Explain the amortised\
    \ argument for the monotonic stack. Follow-ups: largest rectangle in a histogram, min stack, and implementing\
    \ a queue with two stacks.\n"
