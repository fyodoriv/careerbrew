- id: kb-832aa15af761
  question: How do you check whether a value is an object in JavaScript?
  answer: For "any non-null object", use value !== null && typeof value === "object" (add typeof value
    === "function" if functions count). For a plain object literal, also check that its prototype is Object.prototype
    or null.
  topic: leetcode
  tags:
  - javascript
  - type-checking
  - objects
  explanation: "## In plain words\nJavaScript's `typeof` says `\"object\"` for many things: plain objects,\
    \ arrays, dates, maps and, by a historic bug, `null`. So \"is it an object?\" first needs a clear\
    \ meaning: any object, or a plain `{}`-style object.\n\n## How it works\n- **Any object (not null)**:\
    \ `v !== null && typeof v === \"object\"`. This includes arrays, dates and maps.\n- **Including functions**:\
    \ also accept `typeof v === \"function\"`, since functions are objects too.\n- **Plain object**: check\
    \ the prototype:\n  - `Object.getPrototypeOf(v) === Object.prototype` (object literals, `new Object()`),\
    \ or\n  - `=== null` (from `Object.create(null)`).\n- **Exclude arrays** explicitly with `!Array.isArray(v)`\
    \ if you use the first form.\n- `Object.prototype.toString.call(v)` returns tags like `\"[object Date]\"\
    ` and can help with built-ins.\n\n## Example\n```js\nconst isObject = (v) => v !== null && typeof\
    \ v === \"object\";\nconst isPlainObject = (v) => {\n  if (!isObject(v)) return false;\n  const proto\
    \ = Object.getPrototypeOf(v);\n  return proto === Object.prototype || proto === null;\n};\nconsole.log(isObject([]));\
    \             // true\nconsole.log(isPlainObject([]));        // false\nconsole.log(isPlainObject({\
    \ a: 1 }));  // true\nconsole.log(isObject(null));           // false\n```\n\n## Common mistakes\n\
    - Forgetting that `typeof null === \"object\"`.\n- Treating arrays as \"not objects\" without checking.\n\
    - Using `v.constructor === Object`, which breaks for `Object.create(null)` and across realms.\n\n\
    ## In the interview\nClarify which definition the caller needs, then give the matching check. This\
    \ shows care with edge cases. Follow-ups: deep clone or deep equality helpers, which need exactly\
    \ this distinction.\n"
