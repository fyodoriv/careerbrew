  question: How do you remove a single element from an array when you do not know its index?
  answer: Find the index first with indexOf (or findIndex for a condition), check it is not -1, then remove
    it with splice(index, 1). That is O(n). To remove all matches without mutating, use filter.
  topic: leetcode
  tags:
  - javascript
  - arrays
  - search
  explanation: "## In plain words\nYou cannot remove something you have not found. So the job has two\
    \ steps: search for the position, then cut it out. Both steps are linear in the array's length.\n\n\
    ## How it works\n- `indexOf(value)` finds the first index using strict equality (`===`); it returns\
    \ `-1` if absent.\n- `findIndex(fn)` finds the first index matching a condition, useful for objects.\n\
    - `splice(i, 1)` removes one element in place and shifts the rest left.\n- Always guard against `-1`:\
    \ `splice(-1, 1)` would remove the last element by mistake.\n- `filter` returns a new array without\
    \ every match; prefer it in immutable code such as React state updates.\n- If order does not matter,\
    \ swap the found element with the last one and `pop()` to avoid shifting.\n\n## Example\n```js\nfunction\
    \ removeFirst(arr, value) {\n  const i = arr.indexOf(value);\n  if (i !== -1) arr.splice(i, 1);\n\
    \  return arr;\n}\nconsole.log(removeFirst([3, 5, 7, 5], 5));          // [3, 7, 5]\nconsole.log([3,\
    \ 5, 7, 5].filter((x) => x !== 5));   // [3, 7]\nconst users = [{ id: 1 }, { id: 2 }];\nusers.splice(users.findIndex((u)\
    \ => u.id === 2), 1);\nconsole.log(users);                                 // [{ id: 1 }]\n```\n\n\
    ## Common mistakes\n- Skipping the `-1` check.\n- Using `indexOf` to find objects by content; it compares\
    \ references.\n- `indexOf(NaN)` is always `-1`; use `findIndex(Number.isNaN)` or `includes`.\n- Using\
    \ `delete arr[i]`, which leaves a hole instead of removing.\n\n## In the interview\nGive search plus\
    \ splice, mention the `-1` trap, and contrast mutating and immutable approaches. Follow-up: if you\
    \ remove often, a `Set` or a map from value to index gives O(1) removal.\n"
