- id: kb-11f97ba46170
  question: How does Array.prototype.splice work in JavaScript?
  answer: 'splice(start, deleteCount, ...items) changes the array in place: it removes deleteCount elements
    starting at start, inserts the given items there, and returns an array of the removed elements. It
    runs in O(n) because later elements shift.'
  topic: leetcode
  tags:
  - javascript
  - arrays
  - splice
  explanation: '## In plain words

    `splice` is a cut-and-paste tool for arrays. You say where to cut, how many items to remove, and what
    (if anything) to paste in their place. Unlike `slice`, it edits the original array.


    ## How it works

    - Signature: `arr.splice(start, deleteCount?, ...items)`.

    - `start` can be negative to count from the end (`-1` is the last element).

    - If `deleteCount` is omitted, everything from `start` to the end is removed. If it is `0`, nothing
    is removed (pure insert).

    - Items after the cut shift to close the gap or make room, so the cost is O(n) in the number of elements
    moved.

    - Returns a new array of the removed elements (empty if none).

    - Non-mutating alternative: `toSpliced` (ES2023) returns a new array and leaves the original alone.


    ## Example

    ```js

    const a = ["a", "b", "c", "d", "e"];

    const removed = a.splice(1, 2, "X");  // remove 2 at index 1, insert "X"

    console.log(removed);  // ["b", "c"]

    console.log(a);        // ["a", "X", "d", "e"]

    a.splice(1, 0, "Y");   // insert only

    console.log(a);        // ["a", "Y", "X", "d", "e"]

    a.splice(-1);          // remove the last element

    console.log(a);        // ["a", "Y", "X", "d"]

    ```


    ## Common mistakes

    - Confusing `splice` (mutates) with `slice` (copies).

    - Expecting it to return the new array; it returns the removed items.

    - Calling `splice` inside a forward `for` loop while removing, which skips elements; loop backwards
    or use `filter`.

    - Assuming it is O(1).


    ## In the interview

    Show the three uses: remove, insert, replace. Mention its O(n) cost and immutability concerns in frameworks
    such as React, where `toSpliced`, `filter` or spread syntax are preferred over mutation.

    '
