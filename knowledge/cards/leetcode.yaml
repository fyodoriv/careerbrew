  question: What is the most efficient way to remove the last elements from an array in JavaScript?
  answer: To remove one element, use pop(), which is O(1). To drop the last k elements in place, set arr.length
    = arr.length - k, which truncates in one step; use splice(-k) if you also need the removed items,
    or slice(0, -k) for a new array without mutating.
  topic: leetcode
  tags:
  - javascript
  - arrays
  - performance
  explanation: '## In plain words

    Removing from the end of an array is cheap because nothing has to move: the other elements keep their
    positions. JavaScript gives several ways to do it, depending on whether you want the removed items
    back and whether you may change the original array.


    ## How it works

    - `arr.pop()`: removes and returns the last element. O(1).

    - `arr.length = arr.length - k`: truncates the array in place; the removed items are discarded. Setting
    `length` to `0` empties it.

    - `arr.splice(-k)`: removes the last `k` in place and returns them as a new array. Cost is O(k) for
    building the result.

    - `arr.slice(0, -k)`: returns a new array without the last `k`; the original stays the same. O(n)
    copy, but safe for immutable code.

    - Avoid `shift`/`unshift` style operations at the front for this; they move every element.

    - Guard against `k` larger than the length (`Math.max(0, arr.length - k)`).


    ## Example

    ```js

    const a = [1, 2, 3, 4, 5, 6];

    a.pop();                       // a = [1, 2, 3, 4, 5]

    a.length -= 2;                 // a = [1, 2, 3]

    const removed = a.splice(-1);  // removed = [3], a = [1, 2]

    const b = [1, 2, 3, 4].slice(0, -2);  // b = [1, 2]

    console.log(a, removed, b);

    ```


    ## Common mistakes

    - Calling `pop()` in a loop `k` times when one `length` assignment does it.

    - `slice(0, -0)` returns an empty array and `splice(-0)` empties the whole array, because `-0` is
    `0`; handle `k = 0` separately.

    - Mutating arrays held in framework state instead of creating new ones.


    ## In the interview

    Ask whether they need the removed items and whether mutation is allowed, then pick the matching method.
    Mention that removal at the end is O(1) per element and at the front is O(n), which is why stacks
    use the end of an array.

    '
