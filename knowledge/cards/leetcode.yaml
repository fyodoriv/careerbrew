- id: kb-fa29a6c69c61
  question: In a sorted array with duplicates, what should two pointers do after finding a matching pair?
  answer: Record the pair, then move both pointers inward and keep moving each one past values equal to
    the ones just used. This avoids reporting the same pair twice and still finds all distinct pairs in
    O(n).
  topic: leetcode
  tags:
  - two-pointers
  - duplicates
  - sorted-arrays
  explanation: "## In plain words\nWith duplicates, the same pair of values can appear many times. Once\
    \ you have counted a pair of values, there is nothing new to find by pairing those same values again,\
    \ so both pointers should skip past their repeats.\n\n## How it works\n- Pointers `lo` at the start,\
    \ `hi` at the end of the sorted array.\n- If `a[lo] + a[hi] < target`, move `lo` right; if greater,\
    \ move `hi` left.\n- If equal:\n  - Record `(a[lo], a[hi])`.\n  - Move `lo` right while the next value\
    \ equals the one just used; do the same leftward for `hi`.\n  - Then step both once more so they point\
    \ at new values.\n- Why both move: keeping `lo` and moving only `hi` would need a smaller partner\
    \ for the same `a[lo]`, which would be too small (or a repeat), and similarly the other way.\n- If\
    \ the problem asks to **count** pairs including duplicates, instead count the runs: when values differ,\
    \ add `run_lo * run_hi`; when `a[lo] == a[hi]`, add `m * (m - 1) / 2` for that run.\n\n## Example\n\
    ```python\ndef unique_pairs(a, target):\n    lo, hi, out = 0, len(a) - 1, []\n    while lo < hi:\n\
    \        s = a[lo] + a[hi]\n        if s < target:\n            lo += 1\n        elif s > target:\n\
    \            hi -= 1\n        else:\n            out.append((a[lo], a[hi]))\n            lo += 1\n\
    \            hi -= 1\n            while lo < hi and a[lo] == a[lo - 1]:\n                lo += 1\n\
    \            while lo < hi and a[hi] == a[hi + 1]:\n                hi -= 1\n    return out\n\nprint(unique_pairs([1,\
    \ 1, 2, 2, 3, 3, 4], 5))  # [(1, 4), (2, 3)]\n```\n\n## Common mistakes\n- Moving only one pointer\
    \ and producing duplicate pairs.\n- Skipping duplicates without the `lo < hi` guard and running past\
    \ each other.\n- Using the unique-pairs logic when the problem wants counts with multiplicity.\n\n\
    ## In the interview\nAsk whether they want distinct value pairs or all index pairs; the handling differs.\
    \ This is the core step in 3-sum and 4-sum, so mention that.\n"
