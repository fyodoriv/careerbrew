- id: kb-bd11599fd796
  question: How do you check whether a value is an array in JavaScript?
  answer: Use Array.isArray(value). It returns true only for real arrays, works across iframes and realms,
    and is false for array-like objects such as arguments or NodeList.
  topic: leetcode
  tags:
  - javascript
  - type-checking
  - arrays
  explanation: '## In plain words

    `typeof []` returns `"object"`, so `typeof` cannot tell arrays apart from other objects. `Array.isArray`
    was added to answer exactly this question reliably.


    ## How it works

    - `Array.isArray(v)` checks an internal marker that only real arrays have.

    - It works for arrays created in another frame, where `v instanceof Array` would be false because
    each frame has its own `Array` constructor.

    - It is false for array-like objects (`arguments`, `NodeList`, strings, typed arrays); convert them
    with `Array.from` if you need a real array.

    - It is true for arrays created with `new Array(3)` or subclasses of `Array`.

    - In TypeScript, it narrows the type to an array.


    ## Example

    ```js

    console.log(Array.isArray([1, 2]));              // true

    console.log(Array.isArray(new Array(3)));        // true

    console.log(Array.isArray({ length: 2 }));       // false

    console.log(Array.isArray("abc"));               // false

    console.log(Array.isArray(new Uint8Array(2)));   // false

    console.log(typeof []);                          // "object"

    ```


    ## Common mistakes

    - Using `typeof v === "object"`, which is also true for plain objects and `null`.

    - Using `instanceof Array`, which fails across realms.

    - Checking `v.length !== undefined`, which matches strings and array-likes.


    ## In the interview

    Give `Array.isArray` and explain why the alternatives fail. Follow-ups: how to convert array-likes,
    what typed arrays are, and how to write a general type-check helper.

    '
