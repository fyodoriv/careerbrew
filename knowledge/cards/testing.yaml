- id: kb-823bda9779d9
  question: How do you improve a project's test coverage?
  answer: 'Measure coverage to find untested code, then add tests where risk is highest: critical paths,
    recent bugs and code that changes often. Make code testable by isolating side effects, write a failing
    test for every bug fix, and add a coverage check to CI that blocks drops, while remembering coverage
    shows what ran, not what was verified.'
  topic: testing
  tags:
  - testing
  - test-coverage
  - quality
  explanation: '## In plain words

    Coverage tells you which lines or branches your tests executed. It is a map of blind spots, not a
    score of quality. The goal is to cover the code that would hurt most if it broke, with tests that
    actually check behaviour.


    ## How it works

    - **Measure**: run a coverage tool (for example `coverage.py`, `pytest-cov`, Istanbul/`c8`, JaCoCo)
    and look at line and branch coverage per module.

    - **Prioritise by risk**: payments, auth, data migrations, complex logic, code with many past bugs,
    and frequently changed files.

    - **Make code testable**: pull pure logic out of I/O, inject dependencies, avoid hidden global state.

    - **Pick the right level**: many fast unit tests, fewer integration tests, a handful of end-to-end
    tests for key journeys.

    - **Habits**: every bug fix starts with a failing test; new code ships with tests in the same PR.

    - **Guardrails**: a CI check that fails if coverage drops (a ratchet), and coverage of changed lines
    in PRs.

    - **Check test quality**: mutation testing reveals tests that run code without asserting anything.


    ## Example

    ```bash

    pytest --cov=app --cov-branch --cov-report=term-missing

    ```

    A fictional team sees `billing.py` at 35% branch coverage with the most production incidents. They
    extract the price calculation into a pure function, add table-driven tests for discounts and rounding,
    and add a CI rule that coverage of changed lines must be at least 80%. Coverage rises to 85% and the
    next refactor ships with no billing bugs.


    ## Common mistakes

    - Chasing 100% and writing tests for trivial getters.

    - Tests with no assertions that inflate the number.

    - Testing implementation details, making refactors painful.

    - Big one-off "coverage sprints" instead of steady habits.


    ## In the interview

    Say that coverage is a tool for finding gaps, then describe a risk-based plan and CI guardrails. Interviewers
    like mention of branch coverage, mutation testing, and making code testable. Trade-off: test maintenance
    cost versus confidence.

    '
