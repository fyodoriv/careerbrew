- id: kb-ae2372db8602
  question: What is your preferred testing methodology, and why?
  answer: 'Name an approach, such as test-driven development for logic-heavy code combined with a test
    pyramid and a few end-to-end tests, then justify it with outcomes: faster feedback, safer refactors,
    fewer regressions. Show you adapt it to context, for example spikes or UI work, rather than following
    it dogmatically.'
  topic: testing
  tags:
  - testing
  - tdd
  - behavioral
  - methodology
  explanation: '## In plain words

    There is no single right answer. The interviewer wants to hear a clear opinion, the reasons behind
    it, and evidence that you adjust to the situation. Pick something you actually practise and can defend.


    ## How it works

    A strong answer has this shape:

    - **The approach**: for example TDD (write a failing test, make it pass, refactor), behaviour-driven
    tests for user flows, or "test after, but before merge".

    - **Why**: concrete benefits such as design pressure toward small units, regression safety, documentation
    of intent, and confidence to refactor.

    - **Where it fits and where it does not**: TDD shines for business rules and bug fixes; exploratory
    spikes or fast-changing UI may get tests after the design settles.

    - **Supporting practices**: test pyramid, CI on every change, contract tests for services, and a failing
    test for every bug.

    - **Result**: a short story with an outcome.


    ## Example

    A fictional sample answer: "I default to TDD for domain logic and bug fixes. Writing the test first
    forces me to define the behaviour and keeps functions small. For a pricing engine I worked on, we
    started every rule with a table-driven test; when we later rewrote the engine for performance, the
    300 tests caught two rounding regressions before release. For UI prototypes I write tests after the
    design settles, and I keep end-to-end tests for the five most important user journeys only, because
    they are slow and more fragile."


    ## Common mistakes

    - Claiming one method for every situation.

    - Naming a methodology without saying why it helps.

    - Describing only unit tests and ignoring integration.

    - Criticising other approaches without nuance.


    ## In the interview

    Signals scored: clear reasoning, pragmatism, team awareness (how you bring others along), and results.
    Expect follow-ups: "How do you handle flaky tests?", "How would you test legacy code with no tests?",
    "What is your view on coverage targets?".

    '
