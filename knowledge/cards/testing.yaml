- id: kb-3c6b0357745c
  question: What are testing best practices?
  answer: Test behaviour rather than implementation, keep tests fast, independent and deterministic, follow
    arrange-act-assert with one clear reason to fail, use a test pyramid of many unit tests and fewer
    integration and end-to-end tests, run them in CI on every change, and write a failing test before
    fixing a bug.
  topic: testing
  tags:
  - testing
  - best-practices
  - unit-tests
  - ci
  explanation: "## In plain words\nGood tests let you change code with confidence. They fail when behaviour\
    \ breaks, pass when it does not, and run fast enough that people actually run them.\n\n## How it works\n\
    - **Behaviour over implementation**: assert on outputs and visible effects, not private calls, so\
    \ refactors do not break tests.\n- **F.I.R.S.T.**: fast, independent (no shared order-dependent state),\
    \ repeatable (no real clock, randomness or network without control), self-validating (pass or fail,\
    \ no manual reading), timely (written with the code).\n- **Arrange, act, assert**: one scenario per\
    \ test, with a descriptive name.\n- **Test pyramid**: most tests at unit level, some integration tests\
    \ against real databases or containers, few end-to-end tests for critical flows.\n- **Test doubles\
    \ with care**: mock only slow or external boundaries.\n- **Edge cases**: empty input, limits, errors,\
    \ concurrency, time zones.\n- **CI**: every push runs the suite; flaky tests are fixed or quarantined\
    \ quickly.\n- **Bugs**: reproduce with a failing test first, then fix.\n\n## Example\n```python\n\
    import pytest\n\ndef apply_discount(price, percent):\n    if not 0 <= percent <= 100:\n        raise\
    \ ValueError(\"percent must be 0-100\")\n    return round(price * (1 - percent / 100), 2)\n\n@pytest.mark.parametrize(\"\
    price,percent,expected\", [(100, 10, 90.0), (19.99, 0, 19.99), (50, 100, 0.0)])\ndef test_apply_discount(price,\
    \ percent, expected):\n    assert apply_discount(price, percent) == expected\n\ndef test_rejects_invalid_percent():\n\
    \    with pytest.raises(ValueError):\n        apply_discount(100, 120)\n```\n\n## Common mistakes\n\
    - Tests that depend on each other's order or on shared data.\n- Over-mocking, so tests pass while\
    \ the real integration breaks.\n- Ignoring flaky tests until nobody trusts the suite.\n- Asserting\
    \ too much in one test, which hides the real failure.\n\n## In the interview\nGive a few principles\
    \ with reasons, then an example. Signals: pragmatism (what not to test), awareness of flakiness and\
    \ speed, and how tests fit into CI and code review. Follow-ups: TDD, contract tests between services,\
    \ and testing legacy code.\n"
