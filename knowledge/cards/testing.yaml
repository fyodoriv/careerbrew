- id: kb-3f8cb0aa04f8
  question: What is the difference between a mock and a stub?
  answer: Both are test doubles that replace a real dependency. A stub returns canned answers so the code
    under test can run, and you assert on the result (state). A mock is set up with expectations about
    how it should be called, and the test verifies those interactions (behaviour).
  topic: testing
  tags:
  - testing
  - test-doubles
  - mocking
  explanation: "## In plain words\nWhen code depends on something slow or unpredictable, such as a payment\
    \ API, tests swap in a stand-in called a test double. A stub is an actor who reads fixed lines. A\
    \ mock is an actor who also takes notes, so afterwards you can check what was said to them.\n\n##\
    \ How it works\n- **Stub**: provides fixed responses (\"`get_rate()` returns 1.1\"). You check the\
    \ output or state of the code under test. Used for queries.\n- **Mock**: records calls and is verified\
    \ (\"`send_email` was called once with this address\"). Used for commands whose only effect is the\
    \ call itself.\n- **Other doubles**:\n  - Dummy: passed but never used.\n  - Fake: a working light\
    \ implementation, such as an in-memory database.\n  - Spy: a real or stub object that records calls\
    \ for later checks.\n- In practice, libraries such as `unittest.mock` or Jest create objects that\
    \ can act as both; the difference is in how the test uses them.\n- **Guideline**: stub queries, mock\
    \ commands, and do not mock what you do not own; wrap third-party APIs behind your own adapter and\
    \ double that.\n\n## Example\n```python\nfrom unittest.mock import Mock\n\ndef checkout(cart_total,\
    \ rates, mailer, email):\n    total = round(cart_total * rates.get_rate(\"EUR\"), 2)\n    mailer.send(email,\
    \ f\"Total: {total}\")\n    return total\n\nrates = Mock()\nrates.get_rate.return_value = 1.1    \
    \                 # stub behaviour\nmailer = Mock()                                        # used\
    \ as a mock\nassert checkout(100, rates, mailer, \"a@example.com\") == 110.0\nmailer.send.assert_called_once_with(\"\
    a@example.com\", \"Total: 110.0\")\n```\n\n## Common mistakes\n- Mocking everything, which ties tests\
    \ to implementation details.\n- Verifying calls on a stub when only the result matters.\n- Mocking\
    \ the code under test itself.\n- Doubles that drift from the real dependency's behaviour.\n\n## In\
    \ the interview\nDefine both with a concrete example and name the state-versus-behaviour distinction.\
    \ Follow-ups: when you would use a fake instead (databases), contract tests to keep doubles honest,\
    \ and the \"London versus Detroit\" (mockist versus classicist) testing styles.\n"
