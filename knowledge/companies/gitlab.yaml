remote_policy:
  text: 'All-remote: 100% remote workforce in 65+ countries, async-first.'
  sources:
  - handbook-gitlab-handbook-guide-to-all-re
loop:
- step: recruiter-screen
  notes: Screening call, 30-40 minutes. Covers why GitLab, past roles, location, visa, notice period, and the salary range. Offers use market pay, not pay history (official).
  sources: &id001
  - handbook-gitlab-candidate-handbook-scree
  - handbook-gitlab-handbook-technical-inter
  - handbook-gitlab-handbook-values-credit
  - handbook-gitlab-handbook-ai-native-hirin
- step: online-assessment
  notes: An assessment is required for certain roles (official).
  sources: *id001
- step: take-home
  notes: 'Technical interview part 1: an async review of a self-contained merge request, sent at least 72 hours ahead. Spend up to an hour and finish 24 hours before the call (official).'
  sources: *id001
- step: pair-programming
  notes: 'Technical interview part 2: a 90-minute video call where you walk through your review and write code to improve the MR. AI use is encouraged (official).'
  sources: *id001
- step: behavioral
  notes: 'Team interviews: behavioral, panel, and/or technical, depending on the role (official).'
  sources: *id001
- step: reference-check
  notes: References stage, with an optional chat with a Team Member Resource Group member (official).
  sources: *id001
- step: offer-negotiation
  notes: Offer and background screening (official).
  sources: *id001
company_tips:
- text: Write clear, kind MR comments. Async written communication is a core signal.
  sources: *id001
- text: Map your stories to the CREDIT values.
  sources: *id001
- text: After rejection for qualifications, wait 6 months to reapply for the same role. Technical feedback stays valid 6 months for the same job family.
  sources: *id001
- text: A 2026 working group proposed redesigning the technical interview for AI-assisted work, so ask the recruiter for the current format.
  sources: *id001
values_or_principles:
- Collaboration
- Results for Customers
- Efficiency
- Diversity, Inclusion & Belonging
- Iteration
- Transparency
ai_policy:
  allowed: partial
  summary: (official) AI is allowed for the resume, take-home research (cite it), and technical assessments (disclose it and explain your prompts). In interviews, do not read AI-produced answers.
  rounds:
    take-home: 'yes'
    assessment: 'yes'
  checked: '2026-10-18'
