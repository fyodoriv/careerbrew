  - stripe-stripe-jobs-culture-how-we-operat
  - stripe-stripe-jobs
  - interviewing-interviewing-io-stripe-inte
- step: technical-phone-screen
  notes: 'Third-party: 1 hour in your own IDE or CoderPad; not standard LeetCode-style.'
  sources: *id001
- step: coding-onsite
  notes: 'Third-party: 1-hour practical coding focused on decisions and issues that affect client integrations.'
  sources: *id001
- step: coding-onsite
  notes: 'Third-party: ''Bug bash'' / bug squash, 1 hour finding bugs in given code. A methodical approach matters.'
  sources: *id001
- step: coding-onsite
  notes: 'Third-party: ''Integrations'', 1 hour using the Stripe API for merchant scenarios (below Staff). Staff and above present a written one-pager instead.'
  sources: *id001
- step: system-design
  notes: 'Third-party: 1 hour on scalability, reliability, and usability.'
  sources: *id001
- step: behavioral
  notes: 'Third-party: 1 hour with a hiring manager or ''Leveler'', often referencing Stripe''s operating principles.'
  sources: *id001
company_tips:
- text: AI use in interviews is prohibited (third-party).
  sources: *id001
- text: Practice reading and debugging unfamiliar code and calling real APIs, not only LeetCode.
  sources: *id001
- text: Explain why you chose an approach. Reasoning and trade-offs are scored.
  sources: *id001
values_or_principles:
- Users first
- Create with craft and beauty
- Move with urgency and focus
- Collaborate egolessly
- Stay curious
- Obsess over talent
