ai_shared_patterns:
- text: 'The most common official rule: AI is fine for preparation and polishing a resume, but not during live interviews or assessments unless the company says so.'
  sources:
  - careers-interviewing-at-datadog-ai-guide
  - about-gitlab-using-ai-in-the-interview-p
- text: A growing model is a separate, labeled AI round next to classic no-AI rounds. The candidate is told in advance which round allows AI.
  sources:
  - careers-interviewing-at-datadog-ai-guide
- text: Where AI is allowed, companies expect disclosure and want you to explain your prompts, choices, and how you checked the output.
  sources:
  - about-gitlab-using-ai-in-the-interview-p
- text: Using AI to invent experience or skills is a disqualifier everywhere it is mentioned.
  sources:
  - about-gitlab-using-ai-in-the-interview-p
