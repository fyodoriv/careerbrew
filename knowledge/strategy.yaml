  - interviewing-interviewing-io-how-do-i-kn
  - interviewing-interviewing-io-we-analyzed
- id: expected-value
  text: 'Inside a tier, rank applications by expected value: P(offer) x Want.'
  sources:
  - sep-expected-utility
- id: drill-retrieval
  text: 'Drills ask before they show: retrieval practice beats re-reading.'
  sources:
  - doi-roediger-butler-2011-the-critical-ro
  - doi-roediger-karpicke-2006-test-enhanced
- id: drill-spacing
  text: Reviews are spaced over days, not massed.
