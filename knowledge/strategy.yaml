rules:
- id: want-learning
  text: Want weights are refit to your ratings and kept only if rank agreement (Spearman) does not drop.
  sources:
  - spearman-1904
- id: season-tiers
  text: Apply to practice companies before target and dream companies; practice loops raise later pass rates.
  sources:
  - interviewing-interviewing-io-how-do-i-kn
  - interviewing-interviewing-io-we-analyzed
- id: one-loop-per-season
  text: Each company gives about one loop per season; reapply cooldowns are 6-12 months or more, so a used company leaves the plan.
  sources:
  - google-google-careers-our-hiring-process
  - handbook-gitlab-candidate-handbook-scree
- id: readiness-gates
  text: Move from practice to target to dream only when drill readiness and practice pass rate clear their gates.
  sources:
  - doi-roediger-butler-2011-the-critical-ro
