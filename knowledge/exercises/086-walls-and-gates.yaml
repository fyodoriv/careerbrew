id: walls-and-gates
order: 86
pattern: graphs
difficulty: medium
title: Distance to the nearest exit
leetcode: walls-and-gates
lesson: 'Run one breadth-first search starting from every gate at once. The first time BFS reaches a room
  is along a shortest path, so each room is set once.

  '
statement: 'A grid holds -1 for a wall, 0 for a gate and 2147483647 for an empty room. Replace each empty
  room with its distance (number of up/down/left/right steps) to the nearest gate; rooms that cannot reach
  a gate keep 2147483647. Return the grid.

  '
function: walls_and_gates
signature: 'def walls_and_gates(rooms: list[list[int]]) -> list[list[int]]:'
starter: "def walls_and_gates(rooms: list[list[int]]) -> list[list[int]]:\n    pass\n"
