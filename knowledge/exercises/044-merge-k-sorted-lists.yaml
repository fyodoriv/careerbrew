id: merge-k-sorted-lists
order: 44
pattern: linked list
difficulty: hard
title: Merge many sorted chains
leetcode: merge-k-sorted-lists
lesson: |
  A min-heap of the current front node of each list always yields the smallest remaining node. Pop it, attach it, and push its successor. With N nodes and k lists this is O(N log k). Put an index in each heap entry so ties never compare nodes.
statement: |
  Your function receives `k` ascending linked lists as separate arguments (`merge_k_lists(*lists)`; `k` may be 0). Merge all their nodes into one ascending list and return its head.
function: merge_k_lists
signature: 'def merge_k_lists(*lists: ListNode | None) -> ListNode | None:'
starter: |
  def merge_k_lists(*lists):
      pass
tests:
- args:
  - list:
    - 1
    - 4
    - 5
  - list:
