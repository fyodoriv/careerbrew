scale:
  generator: |
    def make(n):
        lists = []
        for k in range(10):
            head = None
            for v in range(n // 10, 0, -1):
                head = ListNode(v * 10 + k, head)
            lists.append(head)
        return lists
  sizes:
  - 20000
  - 200000
  expected: O(n log n)
hints:
- How do you find the smallest front among k lists quickly?
- Keep a heap of (value, list index, node).
- Pop the smallest, attach it, push (node.next.val, i, node.next) if it exists.
solution: |
  import heapq


  def merge_k_lists(*lists):
      heap = [(node.val, i, node) for i, node in enumerate(lists) if node]
      heapq.heapify(heap)
      dummy = tail = ListNode()
      while heap:
          _, i, node = heapq.heappop(heap)
          tail.next = tail = node
          if node.next:
              heapq.heappush(heap, (node.next.val, i, node.next))
      return dummy.next
pitfalls:
  edge-case: An empty list of lists, or lists that are all empty like [[], []], returns None.
  timeout: Merging lists one by one into a growing result is O(k * N); a heap of list heads, or pairwise
    merging, gives O(N log k).
  wrong-answer: Pushing only the first node of each list and never the next one drops nodes; after popping
    a node, push its node.next.
  exception: Without the index in the tuple, equal values make the heap compare ListNode objects and crash
    with TypeError; push (val, i, node), and skip None heads.
