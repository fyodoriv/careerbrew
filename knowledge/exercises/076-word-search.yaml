id: word-search
order: 76
pattern: backtracking
difficulty: medium
title: Spell it on the grid
leetcode: word-search
lesson: 'Depth-first search from each cell, matching one letter per step and marking the current path
  so a cell isn''t reused. Undo the mark on the way back so other paths can use it.

  '
statement: 'Given a grid of letters `board` and a string `word`, return True if the word can be traced
  through a chain of horizontally or vertically adjacent cells, using each cell at most once in that chain.

  '
function: exist
signature: 'def exist(board: list[list[str]], word: str) -> bool:'
starter: "def exist(board: list[list[str]], word: str) -> bool:\n    pass\n"
tests:
- args:
  - - - A
      - B
      - C
      - E
    - - S
      - F
      - C
      - S
    - - A
      - D
      - E
      - E
  - ABCCED
  expected: true
- args:
  - - - A
      - B
      - C
      - E
    - - S
      - F
      - C
      - S
    - - A
      - D
      - E
      - E
  - SEE
  expected: true
- args:
