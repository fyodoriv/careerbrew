id: clone-graph
order: 81
pattern: graphs
difficulty: medium
title: Copy a graph
leetcode: clone-graph
lesson: 'Cloning a graph means a map from each original node to its copy, filled during a traversal; the
  map also stops cycles from looping forever. Here nodes are given as an adjacency list so the copy is
  checked structurally.

  '
statement: 'A connected undirected graph has nodes labelled 1..n and is given as `adj`, where `adj[i]`
  lists the labels of node i+1''s neighbours. Starting from node 1, build a deep copy of the graph using
  node objects of your own (or dicts), then return the copy serialized back to the same adjacency-list
  form: entry i lists node i+1''s neighbours in the same order as the input. An empty graph is `[]`.

  '
function: clone_graph
signature: 'def clone_graph(adj: list[list[int]]) -> list[list[int]]:'
starter: "def clone_graph(adj: list[list[int]]) -> list[list[int]]:\n    pass\n"
tests:
- args:
  - - - 2
      - 4
    - - 1
      - 3
    - - 2
      - 4
    - - 1
      - 3
  expected:
  - - 2
    - 4
  - - 1
    - 3
  - - 2
    - 4
  - - 1
    - 3
- args:
  - - []
  expected:
  - []
  note: single node, no edges
- args:
  - []
  expected: []
  note: empty graph
- args:
  - - - 2
    - - 1
  expected:
  - - 2
  - - 1
  note: two nodes
- args:
  - - - 2
      - 3
    - - 1
      - 3
    - - 1
