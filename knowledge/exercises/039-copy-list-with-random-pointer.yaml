id: copy-list-with-random-pointer
order: 39
pattern: linked list
difficulty: medium
title: Clone a list with extra links
leetcode: copy-list-with-random-pointer
lesson: |
  A random link can point forward to a node you have not copied yet, so copy in two passes: first create a clone for every original and remember the mapping, then wire next and random through that map. O(n) time and space.
statement: |
  Each `Node` has `val`, `next`, and `random` (any node in the list, or `None`). Write `copy_random_list(head)` that returns a deep copy: brand-new nodes whose `next` and `random` links mirror the original, with no link pointing back into the original list.

  The starter includes a provided wrapper `copy_random_encoded(pairs)`, which the tests call. It builds the list from `[val, random_index]` pairs (`None` means no random link), calls your function, fails if any original node is reused, and returns the copy in the same encoding. Keep the wrapper as it is.
function: copy_random_encoded
signature: 'def copy_random_list(head: Node | None) -> Node | None:'
starter: |
  class Node:
      def __init__(self, val, next=None, random=None):
          self.val, self.next, self.random = val, next, random


  def copy_random_list(head):
      """Return a deep copy of the list starting at head. Write this."""
      pass


  # Provided: turns [val, random_index] pairs into nodes, runs your copy, checks it, and encodes the result.
  def copy_random_encoded(pairs: list[list]) -> list[list]:
      nodes = [Node(v) for v, _ in pairs]
      for i, (_, r) in enumerate(pairs):
          nodes[i].next = nodes[i + 1] if i + 1 < len(nodes) else None
          nodes[i].random = nodes[r] if r is not None else None
      copy = copy_random_list(nodes[0] if nodes else None)
      originals = {id(x) for x in nodes}
      out, index, cur = [], {}, copy
      while cur:
          if id(cur) in originals:
              raise AssertionError("the copy reuses an original node")
          index[id(cur)] = len(out)
          out.append(cur)
          cur = cur.next
      return [[x.val, index[id(x.random)] if x.random else None] for x in out]
