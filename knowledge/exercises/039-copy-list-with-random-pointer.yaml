hints:
- Why can't you set random while creating the copies in a single pass?
- Map each original node to its clone in a dictionary.
- 'Pass 1: clone[node] = Node(node.val). Pass 2: clone[node].next = clone[node.next]; clone[node].random = clone[node.random] (with clone[None] = None).'
solution: |
  class Node:
      def __init__(self, val, next=None, random=None):
          self.val, self.next, self.random = val, next, random


  def copy_random_list(head):
      clone = {None: None}
      cur = head
      while cur:
          clone[cur] = Node(cur.val)
          cur = cur.next
      cur = head
      while cur:
          clone[cur].next = clone[cur.next]
          clone[cur].random = clone[cur.random]
          cur = cur.next
      return clone[head]


  # Provided: turns [val, random_index] pairs into nodes, runs your copy, checks it, and encodes the result.
  def copy_random_encoded(pairs: list[list]) -> list[list]:
      nodes = [Node(v) for v, _ in pairs]
      for i, (_, r) in enumerate(pairs):
          nodes[i].next = nodes[i + 1] if i + 1 < len(nodes) else None
          nodes[i].random = nodes[r] if r is not None else None
      copy = copy_random_list(nodes[0] if nodes else None)
      originals = {id(x) for x in nodes}
      out, index, cur = [], {}, copy
      while cur:
          if id(cur) in originals:
              raise AssertionError("the copy reuses an original node")
          index[id(cur)] = len(out)
          out.append(cur)
          cur = cur.next
      return [[x.val, index[id(x.random)] if x.random else None] for x in out]
pitfalls:
  edge-case: An empty list returns None, and a random pointer can be None or point back to its own node.
  timeout: Searching the copy list for each random target is O(n^2); a map from old node to new node,
    or interleaving copies, is O(n).
  wrong-answer: Keying the map by value breaks when values repeat; key it by the node.
  exception: Looking up old_to_new[node.random] when random is None raises KeyError; map None to None
    or check before the lookup.
