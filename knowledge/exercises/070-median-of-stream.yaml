id: median-of-stream
order: 70
pattern: heap
difficulty: hard
title: Running middle value
leetcode: find-median-from-data-stream
lesson: 'Split the numbers into a lower half (max-heap) and an upper half (min-heap), keeping sizes within
  one. The median lives at the heap tops, so add is O(log n) and median is O(1).

  '
statement: 'Build a class `MedianFinder()` with `add_num(num)` (returns None) and `find_median()` that
  returns the median of all numbers added so far as a float (the mean of the two middle values when the
  count is even). find_median is only called after at least one add.

  '
function: MedianFinder
signature: "class MedianFinder:\n    def __init__(self): ...\n    def add_num(self, num: int) -> None:\
  \ ...\n    def find_median(self) -> float: ...\n"
starter: "class MedianFinder:\n    def __init__(self):\n        pass\n    def add_num(self, num: int)\
  \ -> None:\n        pass\n    def find_median(self) -> float:\n        pass\n"
