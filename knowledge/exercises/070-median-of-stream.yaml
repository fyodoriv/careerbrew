hints:
- What do you need to know about the numbers below and above the middle?
- Keep a max-heap for the lower half and a min-heap for the upper half, balanced in size.
- Push into low, move low's top to high, and if high grows larger move its top back; median from the tops.
solution: "import heapq\n\nclass MedianFinder:\n    def __init__(self):\n        self.low = []\n     \
  \   self.high = []\n\n    def add_num(self, num: int) -> None:\n        heapq.heappush(self.low, -num)\n\
  \        heapq.heappush(self.high, -heapq.heappop(self.low))\n        if len(self.high) > len(self.low):\n\
  \            heapq.heappush(self.low, -heapq.heappop(self.high))\n\n    def find_median(self) -> float:\n\
  \        if len(self.low) > len(self.high):\n            return float(-self.low[0])\n        return\
  \ (-self.low[0] + self.high[0]) / 2\n"
pitfalls:
  timeout: Sorting on every find_median call is O(n log n) each time; two heaps give O(log n) add and
    O(1) median.
  edge-case: With an even count the median is the average of the two middle values, returned as a float;
    one value returns itself.
  wrong-answer: Not rebalancing so one heap is more than one bigger, or forgetting to negate values in
    the max-heap.
  exception: Reading the top of an empty heap on the first add; push into the low heap first, then balance.
