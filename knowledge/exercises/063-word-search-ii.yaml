id: word-search-ii
order: 63
pattern: tries
difficulty: hard
title: Find many words in a grid
leetcode: word-search-ii
lesson: 'Searching the grid once per word repeats the same walks. Put all words in a trie, then run one
  DFS from each cell that follows the trie as it moves, abandoning a path as soon as no word has that
  prefix. Removing words once found and pruning empty trie branches keeps later searches fast.

  '
statement: 'Given a grid of lowercase letters `board` and a list of distinct words `words`, return every
  word that can be spelled by a path of horizontally or vertically adjacent cells, using each cell at
  most once per word. Order does not matter.

  '
function: find_words
signature: 'def find_words(board: list[list[str]], words: list[str]) -> list[str]:'
compare: sorted
starter: "def find_words(board: list[list[str]], words: list[str]) -> list[str]:\n    pass\n"
tests:
- args:
  - - - o
      - a
      - a
      - n
    - - e
      - t
      - a
      - e
    - - i
      - h
      - k
      - r
    - - i
      - f
      - l
      - v
  - - oath
    - pea
    - eat
    - rain
  expected:
  - eat
  - oath
- args:
  - - - a
      - b
    - - c
      - d
  - - abcb
  expected: []
  note: a cell may not be reused
- args:
  - - - a
  - - a
    - b
  expected:
  - a
  note: single cell
- args:
  - - - a
      - a
  - - aaa
    - aa
  expected:
  - aa
  note: repeated letters
- args:
  - - - a
      - b
    - - c
