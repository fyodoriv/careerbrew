id: rotate-image
order: 136
pattern: math and geometry
difficulty: medium
title: Quarter turn
leetcode: rotate-image
lesson: 'A clockwise quarter turn equals a transpose followed by reversing each row. Both steps work in
  place, so no second grid is needed.

  '
statement: 'Rotate the square matrix `matrix` 90 degrees clockwise, in place, and return it.

  '
function: rotate
signature: 'def rotate(matrix: list[list[int]]) -> list[list[int]]:'
starter: "def rotate(matrix: list[list[int]]) -> list[list[int]]:\n    pass\n"
