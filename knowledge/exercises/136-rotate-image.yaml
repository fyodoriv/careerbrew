hints:
- Can you decompose a rotation into two simpler flips?
- Transpose (swap m[i][j] and m[j][i]), then mirror left-right.
- 'for i: for j in range(i+1, n): swap; then for row: row.reverse(); return matrix.'
solution: "def rotate(matrix: list[list[int]]) -> list[list[int]]:\n    n = len(matrix)\n    for i in\
  \ range(n):\n        for j in range(i + 1, n):\n            matrix[i][j], matrix[j][i] = matrix[j][i],\
  \ matrix[i][j]\n    for row in matrix:\n        row.reverse()\n    return matrix\n"
pitfalls:
  edge-case: A 1x1 matrix stays the same; an odd size has a centre cell that must not move.
  timeout: Building a new matrix is fine for time but breaks the in-place rule; transpose then reverse
    each row is O(n^2) and in place.
  wrong-answer: Reversing rows before transposing turns it counter-clockwise; transpose first, then reverse
    each row.
  exception: Swapping in the transpose over the full square swaps every pair twice back; only loop j >
    i.
