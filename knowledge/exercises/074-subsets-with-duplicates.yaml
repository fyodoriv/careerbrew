hints:
- Why would plain subset generation produce [1,2] twice?
- Sort, then at each level skip nums[i] when it equals nums[i-1] and i is past the level's start.
- 'go(start): record path; for i in range(start, n): if i > start and nums[i] == nums[i-1]: continue;
  push, go(i+1), pop'
solution: "def subsets_with_dup(nums: list[int]) -> list[list[int]]:\n    nums = sorted(nums)\n    out,\
  \ path = [], []\n\n    def go(start):\n        out.append(path[:])\n        for i in range(start, len(nums)):\n\
  \            if i > start and nums[i] == nums[i - 1]:\n                continue\n            path.append(nums[i])\n\
  \            go(i + 1)\n            path.pop()\n\n    go(0)\n    return out\n"
pitfalls:
  edge-case: All-equal input like [2, 2] must give [[], [2], [2, 2]], not two [2] subsets.
  timeout: Generating all 2^n subsets and deduplicating with a set of tuples works but wastes time; sort
    and skip equal values at the same depth.
  wrong-answer: Skipping duplicates without sorting first, or skipping with `i > 0` instead of `i > start`,
    which drops valid subsets.
  exception: Putting lists into a set raises TypeError (unhashable); convert to tuples or avoid the set.
