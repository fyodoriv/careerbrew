id: subsets-with-duplicates
order: 74
pattern: backtracking
difficulty: medium
title: Subsets without repeats
leetcode: subsets-ii
lesson: 'Sort first so equal values sit together. At each recursion level, skip a value equal to the previous
  one at that same level; that removes duplicate subsets without a set.

  '
statement: 'Given a list of integers `nums` that may contain repeats, return every distinct subset. Subsets
  that contain the same values with the same multiplicities count once. Any order is accepted.

  '
function: subsets_with_dup
signature: 'def subsets_with_dup(nums: list[int]) -> list[list[int]]:'
starter: "def subsets_with_dup(nums: list[int]) -> list[list[int]]:\n    pass\n"
compare: set
tests:
- args:
  - - 1
    - 2
    - 2
  expected:
  - []
  - - 1
  - - 1
    - 2
  - - 1
    - 2
    - 2
  - - 2
  - - 2
    - 2
- args:
  - - 0
  expected:
  - []
  - - 0
  note: single element
