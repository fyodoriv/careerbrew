id: lru-cache
order: 43
pattern: linked list
difficulty: medium
title: Evict the stalest entry
leetcode: lru-cache
lesson: |
  An LRU cache needs O(1) lookup and O(1) "move to most recent", which a hash map plus a doubly linked list provide. In Python, OrderedDict is exactly that pair: move_to_end on each use and popitem(last=False) to evict.
statement: |
  Design `LRUCache(capacity)` with `get(key)` (return the value or `-1`) and `put(key, value)` (insert or update). Both `get` and `put` count as using a key. When an insert would exceed `capacity`, first remove the key that was used least recently. Both operations must be O(1). Tests call the constructor first and compare every return value (`None` for put).
