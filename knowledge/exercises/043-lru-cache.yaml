hints:
- Which two operations must be O(1), and which structures give each?
- Map key -> node for lookup; a doubly linked list orders keys by recency.
- 'With OrderedDict: on get/put move_to_end(key); after put, if len > capacity: popitem(last=False).'
solution: |
  from collections import OrderedDict


  class LRUCache:
      def __init__(self, capacity: int):
          self.cap = capacity
          self.data = OrderedDict()

      def get(self, key: int) -> int:
          if key not in self.data:
              return -1
          self.data.move_to_end(key)
          return self.data[key]

      def put(self, key: int, value: int) -> None:
          self.data[key] = value
          self.data.move_to_end(key)
          if len(self.data) > self.cap:
              self.data.popitem(last=False)
pitfalls:
  edge-case: A capacity of 1 evicts on every new key, and putting an existing key must update it and mark
    it most recent without evicting.
  timeout: Keeping recency in a plain list makes each move O(n); a dict plus a doubly linked list, or
    OrderedDict with move_to_end, is O(1).
  wrong-answer: Forgetting that get also counts as a use, so the wrong key is evicted; move the key to
    the most recent end on every get and put.
  exception: Reading self.cache[key] for a missing key raises KeyError; return -1 when the key is absent,
    and pop the oldest only when the size goes over capacity.
