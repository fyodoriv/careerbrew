id: powx-n
order: 141
pattern: math and geometry
difficulty: medium
title: Fast power
leetcode: powx-n
lesson: 'Square-and-multiply: x^n = (x^2)^(n/2), with one extra factor of x when n is odd. That halves
  n each step, so O(log n) multiplications. A negative exponent means invert x first.

  '
statement: 'Compute `x` raised to the integer power `n` (which may be negative or zero) without using
  `**` or `pow`. Return a float.

  '
function: my_pow
signature: 'def my_pow(x: float, n: int) -> float:'
starter: "def my_pow(x: float, n: int) -> float:\n    pass\n"
compare: float
tests:
- args:
  - 2.0
  - 10
  expected: 1024.0
- args:
  - 2.1
  - 3
  expected: 9.261
- args:
  - 2.0
  - -2
  expected: 0.25
  note: negative exponent
- args:
  - 5.0
  - 0
  expected: 1.0
  note: zero exponent
- args:
  - 1.0
  - 2147483647
  expected: 1.0
  note: huge exponent must be fast
- args:
  - -2.0
  - 3
  expected: -8.0
  note: negative base, odd power
- args:
  - 0.5
  - -1
  expected: 2.0
hints:
- Multiplying n times is too slow for big n.
- 'Use the binary form of n: square x each step and multiply it into the result when the low bit is 1.'
- 'if n < 0: x, n = 1/x, -n; while n: if n & 1: r *= x; x *= x; n >>= 1.'
solution: "def my_pow(x: float, n: int) -> float:\n    if n < 0:\n        x, n = 1 / x, -n\n    result\
  \ = 1.0\n    while n:\n        if n & 1:\n            result *= x\n        x *= x\n        n >>= 1\n\
  \    return result\n"
pitfalls:
  edge-case: n=0 returns 1.0 even when x is 0, and a negative n means 1 / x^|n|.
  timeout: A loop of n multiplications times out on n near 2^31; square-and-multiply is O(log n).
  wrong-answer: Applying the negative sign by negating the result instead of inverting gives -x^n instead
    of 1/x^n.
  exception: x=0 with negative n raises ZeroDivisionError; guard it, and recursion on n-1 hits RecursionError
    so halve n instead.
