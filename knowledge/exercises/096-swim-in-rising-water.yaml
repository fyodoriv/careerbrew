id: swim-in-rising-water
order: 96
pattern: advanced graphs
difficulty: hard
title: Wait for the flood
leetcode: swim-in-rising-water
lesson: 'The cost of a path is its highest cell, not its sum. A min-heap ordered by the bottleneck so
  far (a Dijkstra variant) always expands the cell reachable at the lowest water level; the first time
  the corner is popped, that level is the answer.

  '
statement: '`grid` is an `n x n` matrix of distinct heights. At time `t` the water level is `t`, and you
  may move between 4-directionally adjacent cells only if both are at most `t` high. Starting at the top-left,
  return the earliest time you can reach the bottom-right.

  '
function: swim_in_water
signature: 'def swim_in_water(grid: list[list[int]]) -> int:'
starter: "def swim_in_water(grid: list[list[int]]) -> int:\n    pass\n"
