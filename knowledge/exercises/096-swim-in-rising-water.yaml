hints:
- The time to finish a path is the maximum height along it. Minimise that maximum.
- Use a min-heap keyed by max height so far; expand the lowest frontier cell first.
- heap=[(grid[0][0],0,0)]; pop (t,r,c); if corner return t; push neighbours with max(t, grid[nr][nc])
  once each.
solution: "import heapq\n\ndef swim_in_water(grid: list[list[int]]) -> int:\n    n = len(grid)\n    heap\
  \ = [(grid[0][0], 0, 0)]\n    seen = {(0, 0)}\n    while heap:\n        t, r, c = heapq.heappop(heap)\n\
  \        if r == n - 1 and c == n - 1:\n            return t\n        for nr, nc in ((r + 1, c), (r\
  \ - 1, c), (r, c + 1), (r, c - 1)):\n            if 0 <= nr < n and 0 <= nc < n and (nr, nc) not in\
  \ seen:\n                seen.add((nr, nc))\n                heapq.heappush(heap, (max(t, grid[nr][nc]),\
  \ nr, nc))\n    return -1\n"
pitfalls:
  edge-case: A 1x1 grid returns grid[0][0]; the start cell's height already sets the minimum time.
  timeout: Trying every t and running BFS each time is O(n^4); Dijkstra on max height along the path,
    or binary search plus BFS, is O(n^2 log n).
  wrong-answer: Summing heights along the path instead of taking the maximum.
  exception: Moving outside the grid on neighbours; bounds-check before reading.
