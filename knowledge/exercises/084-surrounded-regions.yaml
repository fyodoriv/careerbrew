id: surrounded-regions
order: 84
pattern: graphs
difficulty: medium
title: Capture enclosed regions
leetcode: surrounded-regions
lesson: 'An ''O'' survives only if it connects to the border. Mark everything reachable from border ''O''s
  first, then flip every unmarked ''O'' to ''X''.

  '
statement: 'Given a board of ''X'' and ''O'', flip every ''O'' that is not connected (up/down/left/right
  through other ''O''s) to an ''O'' on the board''s edge into ''X''. Return the resulting board (you may
  modify the input).

  '
function: solve
signature: 'def solve(board: list[list[str]]) -> list[list[str]]:'
starter: "def solve(board: list[list[str]]) -> list[list[str]]:\n    pass\n"
