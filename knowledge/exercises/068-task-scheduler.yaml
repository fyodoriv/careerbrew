id: task-scheduler
order: 68
pattern: heap
difficulty: medium
title: CPU cooldown schedule
leetcode: task-scheduler
lesson: 'Only the most frequent task shapes the schedule: it creates (maxcount - 1) gaps of length n +
  1, plus a final row of every task tied for the max. If there are more tasks than that frame, no idling
  is needed and the answer is just the task count.

  '
statement: 'A CPU runs one task per time unit, or idles. `tasks` is a list of single-letter task labels;
  the same label must be separated by at least `n` time units. Tasks may run in any order. Return the
  minimum number of time units needed to finish all tasks.

  '
function: least_interval
signature: 'def least_interval(tasks: list[str], n: int) -> int:'
starter: "def least_interval(tasks: list[str], n: int) -> int:\n    pass\n"
tests:
- args:
  - - A
    - A
    - A
    - B
    - B
    - B
  - 2
  expected: 8
- args:
