scale:
  generator: "def make(n):\n    return [[chr(65 + i % 26) for i in range(n)], 3]\n"
  sizes:
  - 20000
  - 200000
  expected: O(n)
hints:
- Which task limits how short the schedule can be?
- Lay out the most frequent task with n slots between each copy; count how many tasks tie for the max.
- max(len(tasks), (top - 1) * (n + 1) + number_of_tasks_with_count_top)
solution: "from collections import Counter\n\ndef least_interval(tasks: list[str], n: int) -> int:\n \
  \   counts = Counter(tasks).values()\n    top = max(counts)\n    ties = sum(1 for c in counts if c ==\
  \ top)\n    return max(len(tasks), (top - 1) * (n + 1) + ties)\n"
pitfalls:
  wrong: 'Forgetting the max with len(tasks): when there are many distinct tasks, there is no idle time.'
  edge-case: When there are many distinct tasks and n is small, there is no idle time and the answer is
    len(tasks); n = 0 also gives len(tasks).
  timeout: Simulating every time unit with a re-sorted list is slow for big inputs; the formula (max_count
    - 1) * (n + 1) + number_of_tasks_with_max_count is O(n).
  wrong-answer: 'Forgetting the max with len(tasks): when there are many distinct tasks, there is no idle
    time.'
  exception: Calling max() on an empty Counter crashes if tasks is empty; return 0 first.
