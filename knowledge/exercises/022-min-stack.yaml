hints:
- What would you need to remember to know the old minimum after a pop?
- Keep a second stack (or pairs) holding the running minimum.
- On push append (x, min(x, current_min)); get_min reads the second item of the top pair.
solution: |
  class MinStack:
      def __init__(self):
          self.items = []

      def push(self, x: int) -> None:
          m = min(x, self.items[-1][1]) if self.items else x
          self.items.append((x, m))

      def pop(self) -> None:
          self.items.pop()

      def top(self) -> int:
          return self.items[-1][0]

      def get_min(self) -> int:
          return self.items[-1][1]
pitfalls:
  edge-case: getMin after pushing the same minimum twice and popping one must still return that minimum;
    keep duplicates in the min stack.
  timeout: Scanning for the minimum on each getMin call is O(n), not O(1); push the current minimum alongside
    every value.
  wrong-answer: Only pushing to the min stack when a value is strictly smaller loses track of duplicates;
    push when value <= current min, or store pairs.
  exception: Reading min_stack[-1] on the first push raises IndexError; compare against the new value
    when the stack is empty.
