id: min-stack
order: 22
pattern: stack
difficulty: medium
title: Stack with a minimum
leetcode: min-stack
lesson: |
  Store, next to every pushed value, the minimum of the stack at that moment. Popping then restores the previous minimum for free, so every operation stays O(1).
statement: |
  Design a class `MinStack` with `push(x)`, `pop()`, `top()` (returns the top value), and `get_min()` (returns the smallest value currently on the stack). Every method must run in O(1). `pop`, `top`, and `get_min` are only called on a non-empty stack. Tests call the constructor first, then the listed methods, and compare each return value (`None` for push and pop).
