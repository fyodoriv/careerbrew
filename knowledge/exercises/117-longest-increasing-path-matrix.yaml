id: longest-increasing-path-matrix
order: 117
pattern: 2-d dynamic programming
difficulty: hard
title: Climb the grid
leetcode: longest-increasing-path-in-a-matrix
lesson: 'State: best[r][c] is the longest strictly increasing path starting at (r, c). Transition: 1 +
  the max best of any larger neighbour. Strict increase means no cycles, so memoised DFS computes each
  cell once. Base case: a cell with no larger neighbour has length 1.

  '
statement: 'Given an integer grid `matrix`, return the length of the longest path that moves up, down,
  left, or right and strictly increases at every step.

  '
function: longest_increasing_path
signature: 'def longest_increasing_path(matrix: list[list[int]]) -> int:'
starter: "def longest_increasing_path(matrix: list[list[int]]) -> int:\n    pass\n"
tests:
- args:
