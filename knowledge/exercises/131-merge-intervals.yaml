id: merge-intervals
order: 131
pattern: intervals
difficulty: medium
title: Fuse overlaps
leetcode: merge-intervals
lesson: 'Sort by start; then any interval overlapping the last merged one must start before that one ends.
  Extend or append. Sorting dominates at O(n log n).

  '
statement: 'Given a list of `[start, end]` intervals in any order, merge all that overlap (touching counts)
  and return the result sorted by start.

  '
function: merge
signature: 'def merge(intervals: list[list[int]]) -> list[list[int]]:'
starter: "def merge(intervals: list[list[int]]) -> list[list[int]]:\n    pass\n"
tests:
- args:
  - - - 1
      - 3
    - - 2
      - 6
    - - 8
      - 10
    - - 15
      - 18
  expected:
  - - 1
    - 6
  - - 8
    - 10
  - - 15
    - 18
- args:
  - - - 1
      - 4
    - - 4
      - 5
  expected:
  - - 1
    - 5
  note: touching
- args:
  - - - 1
      - 4
  expected:
  - - 1
    - 4
  note: single
