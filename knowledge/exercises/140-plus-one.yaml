id: plus-one
order: 140
pattern: math and geometry
difficulty: easy
title: Increment a digit list
leetcode: plus-one
lesson: 'Add from the right like on paper. A digit below 9 absorbs the carry and you are done; a 9 becomes
  0 and passes the carry on. Only all-nines needs a new leading 1.

  '
statement: 'A non-negative integer is given as a list of decimal `digits`, most significant first, with
  no leading zeros (except the number 0). Return the digits of that number plus one.

  '
function: plus_one
signature: 'def plus_one(digits: list[int]) -> list[int]:'
starter: "def plus_one(digits: list[int]) -> list[int]:\n    pass\n"
tests:
- args:
  - - 1
    - 2
    - 3
  expected:
  - 1
  - 2
  - 4
- args:
  - - 4
    - 3
    - 2
    - 1
  expected:
  - 4
  - 3
  - 2
  - 2
- args:
  - - 9
  expected:
  - 1
  - 0
  note: single nine
- args:
  - - 9
    - 9
    - 9
  expected:
  - 1
  - 0
  - 0
  - 0
  note: all nines grow
- args:
  - - 0
  expected:
  - 1
  note: zero
- args:
  - - 1
    - 9
    - 9
  expected:
  - 2
  - 0
  - 0
  note: carry chain
hints:
- Where does the carry stop?
- Walk from the last digit; turn 9s into 0s until you find a digit you can bump.
- 'for i reversed: if d[i] < 9: d[i] += 1; return d; d[i] = 0. return [1] + d.'
solution: "def plus_one(digits: list[int]) -> list[int]:\n    digits = digits[:]\n    for i in range(len(digits)\
  \ - 1, -1, -1):\n        if digits[i] < 9:\n            digits[i] += 1\n            return digits\n\
  \        digits[i] = 0\n    return [1] + digits\n"
pitfalls:
  edge-case: All nines like [9,9,9] must become [1,0,0,0]; [0] becomes [1].
  timeout: Converting to int, adding one and splitting back is fine in Python but O(n) anyway; the expected
    idea is one backward pass with a carry.
  wrong-answer: Stopping at the first digit without adding the leading 1 after a full carry returns [0,0,0].
  exception: Inserting at index -1 instead of 0 puts the new 1 at the wrong end; use [1] + digits.
