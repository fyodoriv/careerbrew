id: longest-consecutive-sequence
order: 9
pattern: arrays and hashing
difficulty: medium
title: Longest unbroken run
leetcode: longest-consecutive-sequence
lesson: |
  Put every value in a set, then only start counting from values that begin a run (x - 1 is absent). Each run is walked once from its start, so the total work is O(n) even though there is an inner loop.
statement: |
  Given an unsorted list of integers `nums`, return the length of the longest stretch of consecutive integers (like 4, 5, 6, 7) whose values all appear in the list. Order in the list does not matter. Aim for O(n).
function: longest_consecutive
signature: "def longest_consecutive(nums: list[int]) -> int:"
starter: |
  def longest_consecutive(nums: list[int]) -> int:
      pass
tests:
  - {args: [[100, 4, 200, 1, 3, 2]], expected: 4}
  - {args: [[]], expected: 0, note: empty list}
  - {args: [[9]], expected: 1, note: single element}
  - {args: [[1, 2, 2, 3]], expected: 3, note: duplicates do not extend a run}
  - {args: [[-3, -1, -2, 5, 0]], expected: 4, note: negatives}
  - {args: [[10, 30, 20]], expected: 1, note: no neighbours}
scale:
  generator: |
    def make(n):
        return [list(range(n, 0, -1))]
  sizes: [20000, 200000]
  expected: O(n)
hints:
  - Sorting works but costs O(n log n). Which structure lets you ask "is x + 1 present?" instantly?
  - Use a set, and only begin counting at a value whose predecessor is missing.
  - "for x in s: if x - 1 not in s: y = x; while y + 1 in s: y += 1; best = max(best, y - x + 1)"
solution: |
  def longest_consecutive(nums: list[int]) -> int:
      s = set(nums)
      best = 0
      for x in s:
          if x - 1 not in s:
              y = x
              while y + 1 in s:
                  y += 1
              best = max(best, y - x + 1)
      return best
pitfalls:
  edge-case: An empty list has a longest run of 0, and duplicates like [1, 2, 2, 3] still give a run of
    3, not 4.
  timeout: Sorting is O(n log n) and counting forward from every value is O(n^2) on a long run; put values
    in a set and start counting only where v - 1 is missing.
  wrong-answer: Counting duplicates as extra steps, or forgetting to compare the last run with the best;
    loop over the set, not the list, and update best after each run.
  exception: Calling max() on an empty list of run lengths raises ValueError; return 0 when nums is empty.
