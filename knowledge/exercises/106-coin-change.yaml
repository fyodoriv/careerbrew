id: coin-change
order: 106
pattern: 1-d dynamic programming
difficulty: medium
title: Fewest coins for a sum
leetcode: coin-change
lesson: 'State: best[a] is the fewest coins summing to a. Transition: best[a] = 1 + min(best[a - c]) over
  coins c <= a. Base case: best[0] = 0, and unreachable amounts stay at infinity, reported as -1.

  '
statement: 'Given coin values `coins` (unlimited supply of each) and a target `amount`, return the fewest
  coins that add up to exactly `amount`, or `-1` if it cannot be done.

  '
function: coin_change
signature: 'def coin_change(coins: list[int], amount: int) -> int:'
starter: "def coin_change(coins: list[int], amount: int) -> int:\n    pass\n"
tests:
- args:
  - - 1
    - 2
    - 5
  - 11
  expected: 3
- args:
  - - 2
  - 3
  expected: -1
  note: unreachable
- args:
  - - 1
  - 0
  expected: 0
  note: zero amount
- args:
  - - 1
    - 3
    - 4
  - 6
  expected: 2
  note: greedy fails
- args:
  - - 186
    - 419
    - 83
    - 408
  - 6249
  expected: 20
scale:
  generator: "def make(n):\n    return [[3, 7, 11], n]\n"
  sizes:
  - 10000
  - 100000
  expected: O(n)
hints:
- Greedy by largest coin can fail. Build up from smaller amounts.
- best[a] = 1 + min(best[a-c]).
- 'best=[0]+[inf]*amount; for a in 1..amount: for c in coins: if c<=a: best[a]=min(best[a], best[a-c]+1)'
solution: "def coin_change(coins: list[int], amount: int) -> int:\n    inf = amount + 1\n    best = [0]\
  \ + [inf] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <=\
  \ a and best[a - c] + 1 < best[a]:\n                best[a] = best[a - c] + 1\n    return -1 if best[amount]\
  \ == inf else best[amount]\n"
pitfalls:
  edge-case: amount=0 needs 0 coins, and an unreachable amount like coins=[2], amount=3 must return -1,
    not infinity.
  timeout: Recursion over every coin without memo is exponential; a bottom-up dp array over amounts 0..amount
    is O(amount * len(coins)).
  wrong-answer: Taking the biggest coin first fails for coins like [1, 3, 4] with amount 6 (greedy gives
    3, best is 2).
  exception: dp[a-c] with a<c reads a negative index silently or crashes; skip coins larger than the current
    amount.
