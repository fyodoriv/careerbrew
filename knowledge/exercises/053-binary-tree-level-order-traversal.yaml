id: binary-tree-level-order-traversal
order: 53
pattern: trees
difficulty: medium
title: Row by row
leetcode: binary-tree-level-order-traversal
lesson: 'Breadth-first search with a queue visits nodes in order of depth. Snapshot the queue length at
  the start of each round: exactly that many nodes form the current row. Each node enters and leaves the
  queue once.

  '
statement: 'Given the root of a binary tree, return its values grouped by depth: a list of rows, top row
  first, each row listed from left to right. An empty tree gives an empty list.

  '
function: level_order
signature: 'def level_order(root: Optional[TreeNode]) -> list[list[int]]:'
starter: "def level_order(root: Optional[TreeNode]) -> list[list[int]]:\n    pass\n"
tests:
- args:
  - tree:
    - 3
    - 9
    - 20
    - null
    - null
    - 15
    - 7
  expected:
  - - 3
  - - 9
    - 20
  - - 15
    - 7
- args:
  - tree:
    - 1
  expected:
  - - 1
  note: single node
- args:
  - tree: []
  expected: []
  note: empty tree
- args:
  - tree:
    - 1
    - 2
    - null
    - 3
    - null
    - 4
  expected:
  - - 1
  - - 2
  - - 3
  - - 4
  note: skewed tree
- args:
  - tree:
    - 1
    - 1
    - 1
    - 1
  expected:
  - - 1
  - - 1
    - 1
  - - 1
  note: duplicate values
scale:
  generator: "def make(n):\n    def b(lo, hi):\n        if lo > hi:\n            return None\n       \
    \ m = (lo + hi) // 2\n        return TreeNode(m, b(lo, m - 1), b(m + 1, hi))\n    return [b(1, n)]\n"
  sizes:
  - 10000
  - 100000
  expected: O(n)
hints:
- Which traversal naturally visits shallow nodes before deep ones?
- Use a deque; at the start of each round, record its length and pop exactly that many nodes.
- 'for _ in range(len(q)): node = q.popleft(); row.append(node.val); push its children'
solution: "def level_order(root: Optional[TreeNode]) -> list[list[int]]:\n    from collections import\
  \ deque\n    if not root:\n        return []\n    out, q = [], deque([root])\n    while q:\n       \
  \ row = []\n        for _ in range(len(q)):\n            node = q.popleft()\n            row.append(node.val)\n\
  \            if node.left:\n                q.append(node.left)\n            if node.right:\n      \
  \          q.append(node.right)\n        out.append(row)\n    return out\n"
pitfalls:
  timeout: list.pop(0) is O(n) per pop, making BFS O(n^2); use collections.deque.popleft() for O(n).
  edge-case: An empty tree must return [], not [[]].
  wrong-answer: Not snapshotting `len(queue)` before the row loop, so children of this row leak into the
    same row.
  exception: Appending None children to the queue and then reading `.val`; only enqueue children that
    exist.
