hints:
- Timestamps per key only grow. What does that give you for free?
- Store a list of (timestamp, value) per key and binary search it.
- Use bisect_right on the timestamps; the answer is the entry just before that position, if any.
solution: |
  from bisect import bisect_right


  class TimeMap:
      def __init__(self):
          self.times = {}
          self.values = {}

      def set(self, key: str, value: str, timestamp: int) -> None:
          self.times.setdefault(key, []).append(timestamp)
          self.values.setdefault(key, []).append(value)

      def get(self, key: str, timestamp: int) -> str:
          i = bisect_right(self.times.get(key, []), timestamp)
          return self.values[key][i - 1] if i else ""
pitfalls:
  edge-case: A get with a timestamp earlier than every set for that key returns "", and so does a get
    for a key never set.
  timeout: Scanning a key's whole history on each get is O(n); timestamps already arrive sorted, so binary
    search them in O(log n).
  wrong-answer: Returning the value at the first timestamp greater than the query instead of the last
    one at or below it; use bisect_right(times, t) - 1.
  exception: Reading self.store[key] for an unknown key raises KeyError, and index -1 after bisect wraps
    to the newest value; use .get(key, []) and check the index >= 0.
