id: time-based-key-value-store
order: 33
pattern: binary search
difficulty: medium
title: Versioned key-value store
leetcode: time-based-key-value-store
lesson: |
  Writes for a key arrive with increasing timestamps, so each key's history is already sorted. A read is then a binary search for the last timestamp not after the query; bisect_right minus one finds it.
statement: |
  Design `TimeMap` with `set(key, value, timestamp)` and `get(key, timestamp)`. `get` returns the value stored for `key` at the largest timestamp less than or equal to `timestamp`, or `""` if there is none. For each key, `set` is called with strictly increasing timestamps. Tests call the constructor first and compare every return value (`None` for set).
