id: car-fleet
order: 26
pattern: stack
difficulty: medium
title: Convoys to the finish
leetcode: car-fleet
lesson: |
  Sort cars by starting position, closest to the target first, and compute each one's arrival time alone. A car behind that would arrive no later than the convoy ahead catches it and joins; a slower one starts a new convoy. Count the convoys.
statement: |
  Cars on a one-lane road drive toward mile `target`. Car `i` starts at `position[i]` (all distinct) with constant `speed[i]`. A faster car that catches a slower one cannot pass; they continue together at the slower speed as one fleet. Catching up exactly at the target also counts as joining. Return how many fleets reach the target.
function: car_fleet
signature: 'def car_fleet(target: int, position: list[int], speed: list[int]) -> int:'
