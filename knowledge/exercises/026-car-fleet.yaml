scale:
  generator: |
    def make(n):
        return [10 * n + 1, list(range(n)), [1 + i % 7 for i in range(n)]]
  sizes:
  - 20000
  - 200000
  expected: O(n log n)
hints:
- Which car decides the speed of a fleet?
- Process cars from closest to the target to farthest, using time = (target - pos) / speed.
- Keep the arrival time of the current lead fleet; a car with a larger time starts a new fleet.
solution: |
  def car_fleet(target: int, position: list[int], speed: list[int]) -> int:
      fleets, lead = 0, 0.0
      for p, s in sorted(zip(position, speed), reverse=True):
          t = (target - p) / s
          if t > lead:
              fleets += 1
              lead = t
      return fleets
pitfalls:
  edge-case: Cars that reach the target at exactly the same time form one fleet, and one car alone is
    one fleet.
  timeout: Simulating the road step by step is slow and imprecise; sort by position and compare arrival
    times in O(n log n).
  wrong-answer: Sorting by position ascending instead of from the car closest to the target, or comparing
    with < instead of <=; walk from the front and start a new fleet only when a car's time is strictly
    greater than the fleet ahead.
  exception: Integer division for time makes different speeds look equal and dividing by speed 0 would
    crash; use (target - pos) / speed as a float.
