id: minimum-interval-to-include-each-query
order: 135
pattern: intervals
difficulty: hard
title: Smallest cover per query
leetcode: minimum-interval-to-include-each-query
lesson: 'Answer queries offline in sorted order. Push every interval that has started onto a heap keyed
  by size, pop ones that already ended, and the top is the answer. Each interval enters and leaves the
  heap once.

  '
statement: 'Given intervals `[l, r]` (size `r - l + 1`) and a list of integer `queries`, return for each
  query the size of the smallest interval containing it, or -1 if none does. Answers follow the original
  query order.

  '
function: min_interval
signature: 'def min_interval(intervals: list[list[int]], queries: list[int]) -> list[int]:'
starter: "def min_interval(intervals: list[list[int]], queries: list[int]) -> list[int]:\n    pass\n"
