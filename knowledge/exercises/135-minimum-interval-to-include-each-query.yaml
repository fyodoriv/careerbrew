scale:
  generator: "def make(n):\n    return [[[i, i + 10] for i in range(n)], list(range(n))]\n"
  sizes:
  - 20000
  - 200000
  expected: O(n log n)
hints:
- Sorting queries lets you reuse work between them.
- Sort intervals by left end; as the query grows, add started intervals to a min-heap of (size, right).
- pop while heap top's right < q; answer is heap top size or -1; store by original index.
solution: "import heapq\n\ndef min_interval(intervals: list[list[int]], queries: list[int]) -> list[int]:\n\
  \    iv = sorted(intervals)\n    heap, i, ans = [], 0, {}\n    for q in sorted(set(queries)):\n    \
  \    while i < len(iv) and iv[i][0] <= q:\n            l, r = iv[i]\n            heapq.heappush(heap,\
  \ (r - l + 1, r)); i += 1\n        while heap and heap[0][1] < q:\n            heapq.heappop(heap)\n\
  \        ans[q] = heap[0][0] if heap else -1\n    return [ans[q] for q in queries]\n"
pitfalls:
  edge-case: A query no interval covers must give -1, and duplicate queries must each get an answer in
    input order.
  timeout: Scanning every interval for every query is O(n*q); sort both, push intervals into a min-heap
    by size as queries rise, O((n+q) log n).
  wrong-answer: Answering in sorted query order and returning that list scrambles the order; map each
    answer back to its original index.
  exception: heap[0] on an empty heap after popping expired intervals raises IndexError; check before
    peeking and answer -1.
