id: unique-paths
order: 111
pattern: 2-d dynamic programming
difficulty: medium
title: Robot on a grid
leetcode: unique-paths
lesson: 'State: ways[r][c] is the number of routes to cell (r, c). Transition: ways[r][c] = ways[r-1][c]
  + ways[r][c-1]. Base case: the top row and left column have one route each; one row of storage suffices.

  '
statement: 'A robot starts at the top-left of an `m x n` grid and may only move right or down. Return
  how many distinct routes reach the bottom-right.

  '
function: unique_paths
signature: 'def unique_paths(m: int, n: int) -> int:'
starter: "def unique_paths(m: int, n: int) -> int:\n    pass\n"
tests:
- args:
  - 3
  - 7
  expected: 28
- args:
  - 3
  - 2
  expected: 3
- args:
  - 1
  - 1
  expected: 1
  note: single cell
- args:
  - 1
  - 10
  expected: 1
  note: single row
- args:
  - 10
  - 10
  expected: 48620
scale:
  generator: "def make(n):\n    return [n, n]\n"
  sizes:
  - 100
  - 1000
  expected: O(n^2)
hints:
- How can you arrive at a cell?
- 'From above or from the left: add those counts.'
- 'row=[1]*n; repeat m-1: for c in 1..n-1: row[c] += row[c-1]'
solution: "def unique_paths(m: int, n: int) -> int:\n    row = [1] * n\n    for _ in range(m - 1):\n \
  \       for c in range(1, n):\n            row[c] += row[c - 1]\n    return row[-1]\n"
pitfalls:
  edge-case: A 1 x n or m x 1 grid has exactly 1 path; do not return 0 for a single row.
  timeout: Recursion paths(r,c)=paths(r-1,c)+paths(r,c-1) without memo is exponential; a row dp is O(m*n),
    or use the binomial C(m+n-2, m-1).
  wrong-answer: Starting the first row or column at 0 instead of 1 makes every count 0.
  exception: Reading dp[r-1][c] with r=0 wraps to the last row in Python; fill the first row and column
    before the double loop.
