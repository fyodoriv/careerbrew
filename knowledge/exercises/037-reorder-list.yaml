id: reorder-list
order: 37
pattern: linked list
difficulty: medium
title: Fold the chain
leetcode: reorder-list
lesson: |
  Three linked-list basics combine here: find the middle with slow and fast pointers, reverse the second half, then interleave the two halves. Each step is O(n) and uses O(1) extra space.
statement: |
  Given the head of a list L0 -> L1 -> ... -> Ln, rearrange its nodes in place into L0 -> Ln -> L1 -> Ln-1 -> L2 -> ... and return the head. Change links, not values.
function: reorder_list
signature: 'def reorder_list(head: ListNode | None) -> ListNode | None:'
starter: |
  def reorder_list(head):
      pass
tests:
- args:
  - list:
    - 1
    - 2
    - 3
    - 4
  expected:
    list:
    - 1
    - 4
    - 2
    - 3
- args:
  - list:
    - 1
    - 2
    - 3
    - 4
    - 5
  expected:
    list:
    - 1
    - 5
    - 2
    - 4
    - 3
  note: odd length
- args:
  - list:
    - 1
  expected:
    list:
    - 1
  note: single node
- args:
  - list: []
  expected:
    list: []
  note: empty
- args:
  - list:
    - 1
    - 2
  expected:
    list:
    - 1
    - 2
  note: two nodes stay put
- args:
  - list:
    - 1
    - 2
    - 3
  expected:
    list:
    - 1
    - 3
    - 2
scale:
  generator: |
    def make(n):
        head = None
        for v in range(n, 0, -1):
            head = ListNode(v, head)
        return [head]
  sizes:
  - 20000
  - 200000
  expected: O(n)
hints:
- 'Can you split the job into: find middle, reverse, merge?'
- Slow/fast pointers stop slow at the end of the first half; cut there.
- Reverse the half after slow, set slow.next = None, then alternate nodes from the two halves.
solution: |
  def reorder_list(head):
      if not head or not head.next:
          return head
      slow = fast = head
      while fast.next and fast.next.next:
          slow, fast = slow.next, fast.next.next
      second, slow.next = slow.next, None
      prev = None
      while second:
          second.next, prev, second = prev, second, second.next
      first, second = head, prev
      while second:
          n1, n2 = first.next, second.next
          first.next, second.next = second, n1
          first, second = n1, n2
      return head
pitfalls:
  edge-case: Lists of length 1 or 2 are unchanged, and an odd length leaves the middle node last; check
    both.
  timeout: Walking to the tail for every node is O(n^2); find the middle, reverse the second half, and
    merge for O(n).
  wrong-answer: Forgetting to cut the first half (slow.next = None) leaves a loop.
  exception: Calling fast.next.next when fast.next is None raises AttributeError; loop while fast and
    fast.next, and guard a None or one-node head.
