id: median-of-two-sorted-arrays
order: 34
pattern: binary search
difficulty: hard
title: Middle of two sorted lists
leetcode: median-of-two-sorted-arrays
lesson: |
  Binary search a cut in the shorter list; the cut in the longer one follows so that both left sides together hold half the elements. The cut is right when every left value is at most every right value; then the median comes from the four values beside the cuts. That is O(log(min(m, n))).
statement: |
  Given two ascending lists `a` and `b` (not both empty), return the median of all their values combined as a float. Aim for better than merging: O(log(min(m, n))).
function: find_median_sorted_arrays
signature: 'def find_median_sorted_arrays(a: list[int], b: list[int]) -> float:'
starter: |
  def find_median_sorted_arrays(a: list[int], b: list[int]) -> float:
      pass
compare: float
tests:
- args:
  - - 1
    - 3
  - - 2
  expected: 2.0
- args:
  - - 1
    - 2
  - - 3
    - 4
  expected: 2.5
- args:
  - []
  - - 1
  expected: 1.0
  note: one list empty
- args:
  - - 2
  - []
  expected: 2.0
  note: other list empty
- args:
  - - 1
    - 1
  - - 1
    - 1
  expected: 1.0
  note: all equal
- args:
  - - 1
    - 2
    - 3
  - - 10
    - 11
    - 12
    - 13
  expected: 10.0
  note: no overlap
- args:
  - - -5
    - 3
    - 6
    - 12
    - 15
  - - -12
    - -10
    - -6
    - -3
    - 4
    - 10
  expected: 3.0
hints:
- Merging works but is O(m + n). What if you only choose how many items come from each list?
- Binary search i in the shorter list; set j = (m + n + 1) // 2 - i in the other.
- 'Valid when a[i-1] <= b[j] and b[j-1] <= a[i] (use -inf/inf at the ends). Odd total: max of lefts; even: average of max left and min right.'
solution: |
  def find_median_sorted_arrays(a: list[int], b: list[int]) -> float:
      if len(a) > len(b):
          a, b = b, a
      m, n = len(a), len(b)
      half = (m + n + 1) // 2
      lo, hi = 0, m
      inf = float("inf")
      while True:
          i = (lo + hi) // 2
          j = half - i
          al = a[i - 1] if i > 0 else -inf
          ar = a[i] if i < m else inf
          bl = b[j - 1] if j > 0 else -inf
          br = b[j] if j < n else inf
          if al <= br and bl <= ar:
              if (m + n) % 2:
                  return float(max(al, bl))
              return (max(al, bl) + min(ar, br)) / 2
          if al > br:
              hi = i - 1
          else:
              lo = i + 1
pitfalls:
  edge-case: One list can be empty, like [] and [2, 3]; the median then comes from the other list alone.
  timeout: Merging both lists is O(m + n); binary search the partition of the shorter list for O(log(min(m,
    n))).
  wrong-answer: Returning an int for an even total; the median of [1, 2] and [3, 4] is 2.5, so average
    the two middles with / 2.
  exception: Reading A[i - 1] or B[j] at the partition edges raises IndexError; use -inf and +inf when
    the cut is at either end.
