hints:
- Start from a trie. What changes when a character can be any letter?
- Write a recursive search(node, i); on '.', try every child at position i + 1.
- 'if ch == ''.'': return any(dfs(child, i + 1) for child in node.children.values())'
solution: "class WordDictionary:\n    def __init__(self):\n        self.root = {}\n\n    def add_word(self,\
  \ word: str) -> None:\n        node = self.root\n        for ch in word:\n            node = node.setdefault(ch,\
  \ {})\n        node[\"$\"] = True\n\n    def search(self, pattern: str) -> bool:\n        def dfs(node,\
  \ i):\n            if i == len(pattern):\n                return \"$\" in node\n            ch = pattern[i]\n\
  \            if ch == \".\":\n                return any(dfs(child, i + 1) for key, child in node.items()\
  \ if key != \"$\")\n            return ch in node and dfs(node[ch], i + 1)\n\n        return dfs(self.root,\
  \ 0)\n"
pitfalls:
  prefix_match: A pattern must match a whole word, not just its beginning; check the end flag.
  edge-case: A pattern of all dots must match a word of exactly that length only, e.g. '..' does not match
    'a' or 'abc'.
  timeout: Scanning every stored word with a regex per search is O(words*length); a trie with branching
    only on '.' is much faster.
  wrong-answer: A pattern must match a whole word, not just its beginning; check the end flag.
  exception: Recursing past the end of the pattern or indexing a missing child; check `i == len(pattern)`
    first and use .get().
