id: design-add-and-search-words-data-structure
order: 62
pattern: tries
difficulty: medium
title: Word lookup with wildcards
leetcode: design-add-and-search-words-data-structure
lesson: 'Store words in a trie. A plain letter follows one child; a wildcard has to try every child, which
  is a small DFS. Exact lookups stay O(length), and wildcard lookups only branch where a dot appears.

  '
statement: 'Build a class `WordDictionary` with:

  - `add_word(word)`: store a lowercase word.

  - `search(pattern)`: return `True` if some stored word has the same length as `pattern` and matches
  it letter for letter, where a `.` in the pattern matches any single letter.

  '
function: WordDictionary
signature: 'class WordDictionary:  # add_word(word) -> None; search(pattern) -> bool'
starter: "class WordDictionary:\n    def __init__(self):\n        pass\n\n    def add_word(self, word:\
  \ str) -> None:\n        pass\n\n    def search(self, pattern: str) -> bool:\n        pass\n"
