hints:
- Running a search from every cell is slow. What if you start from the oceans instead?
- From each ocean's border cells, walk to neighbours that are at least as high.
- pac = reach(top+left edges); atl = reach(bottom+right edges); answer sorted(pac & atl)
solution: "def pacific_atlantic(heights: list[list[int]]) -> list[list[int]]:\n    rows, cols = len(heights),\
  \ len(heights[0])\n\n    def reach(starts):\n        seen = set(starts)\n        stack = list(starts)\n\
  \        while stack:\n            r, c = stack.pop()\n            for a, b in ((r + 1, c), (r - 1,\
  \ c), (r, c + 1), (r, c - 1)):\n                if 0 <= a < rows and 0 <= b < cols and (a, b) not in\
  \ seen and heights[a][b] >= heights[r][c]:\n                    seen.add((a, b))\n                 \
  \   stack.append((a, b))\n        return seen\n\n    pac = reach([(0, c) for c in range(cols)] + [(r,\
  \ 0) for r in range(rows)])\n    atl = reach([(rows - 1, c) for c in range(cols)] + [(r, cols - 1) for\
  \ r in range(rows)])\n    return sorted([r, c] for r, c in pac & atl)\n"
pitfalls:
  edge-case: A single cell touches both oceans and must be in the result; equal heights let water flow.
  timeout: Running a flood from every cell is O((rows*cols)^2); flood uphill once from each ocean's edges
    and intersect, O(rows*cols).
  wrong-answer: Using > instead of >= when climbing from the ocean, which blocks flow across flat ground.
  exception: Recursive DFS on a big grid hits the recursion limit; use BFS with a deque.
