id: pacific-atlantic
order: 83
pattern: graphs
difficulty: medium
title: Water reaching both oceans
leetcode: pacific-atlantic-water-flow
lesson: 'Flip the direction: instead of asking where water from each cell can go, spread uphill from each
  ocean''s border. Cells reached from both oceans are the answer, and each search is O(rows * cols).

  '
statement: 'A grid `heights` sits between two oceans: one touches the top and left edges, the other the
  bottom and right edges. Rain flows from a cell to a neighbour (up/down/left/right) whose height is less
  than or equal to it, and from edge cells into the adjacent ocean. Return the `[row, col]` of every cell
  from which water can reach both oceans, sorted ascending.

  '
function: pacific_atlantic
signature: 'def pacific_atlantic(heights: list[list[int]]) -> list[list[int]]:'
starter: "def pacific_atlantic(heights: list[list[int]]) -> list[list[int]]:\n    pass\n"
