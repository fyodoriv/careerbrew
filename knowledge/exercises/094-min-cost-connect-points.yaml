id: min-cost-connect-points
order: 94
pattern: advanced graphs
difficulty: medium
title: Wire up every point cheaply
leetcode: min-cost-to-connect-all-points
lesson: 'Connecting all points as cheaply as possible is a minimum spanning tree. On a dense graph, Prim''s
  algorithm with an array of best-known distances runs in O(n^2) without building all edges.

  '
statement: 'You get `points`, a list of `[x, y]` integer coordinates. Linking two points costs their Manhattan
  distance `|x1 - x2| + |y1 - y2|`. Return the smallest total cost that links every point into one connected
  network.

  '
function: min_cost_connect_points
signature: 'def min_cost_connect_points(points: list[list[int]]) -> int:'
starter: "def min_cost_connect_points(points: list[list[int]]) -> int:\n    pass\n"
tests:
- args:
  - - - 0
      - 0
    - - 2
      - 2
    - - 3
      - 10
    - - 5
      - 2
    - - 7
      - 0
  expected: 20
- args:
  - - - 3
      - 12
    - - -2
      - 5
    - - -4
      - 1
  expected: 18
- args:
  - - - 0
      - 0
  expected: 0
  note: single point costs nothing
- args:
  - - - 0
      - 0
    - - 1
      - 1
  expected: 2
  note: two points
- args:
  - - - -1000000
      - -1000000
    - - 1000000
      - 1000000
  expected: 4000000
  note: large coordinates
- args:
  - - - 1
      - 1
    - - 1
