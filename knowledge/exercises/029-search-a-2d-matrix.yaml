hints:
- Can you read the grid as one long sorted list?
- Index k corresponds to row k // cols and column k % cols.
- Run a normal binary search from 0 to rows*cols - 1 using that mapping.
solution: |
  def search_matrix(matrix: list[list[int]], target: int) -> bool:
      if not matrix or not matrix[0]:
          return False
      rows, cols = len(matrix), len(matrix[0])
      lo, hi = 0, rows * cols - 1
      while lo <= hi:
          mid = (lo + hi) // 2
          v = matrix[mid // cols][mid % cols]
          if v == target:
              return True
          if v < target:
              lo = mid + 1
          else:
              hi = mid - 1
      return False
pitfalls:
  edge-case: The target can be smaller than the first cell or larger than the last; return False, and
    handle a 1 x 1 grid.
  timeout: Scanning every cell is O(m*n); treat the grid as one sorted list and binary search it in O(log(m*n)).
  wrong-answer: Mapping the flat index back with the wrong divisor; row is mid // cols and column is mid
    % cols, not divided by rows.
  exception: Reading matrix[0] on an empty grid raises IndexError; return False when the matrix or its
    first row is empty.
