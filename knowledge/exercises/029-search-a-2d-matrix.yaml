id: search-a-2d-matrix
order: 29
pattern: binary search
difficulty: medium
title: Lookup in a sorted grid
leetcode: search-a-2d-matrix
lesson: |
  When each row is sorted and each row starts after the previous one ends, the grid is one sorted list read row by row. Binary search over indexes 0..m*n-1 and map index k to cell (k // n, k % n).
statement: |
  `matrix` has rows sorted ascending, and the first value of each row is larger than the last value of the row above. Return whether `target` is in the matrix, in O(log(m*n)).
function: search_matrix
signature: 'def search_matrix(matrix: list[list[int]], target: int) -> bool:'
starter: |
  def search_matrix(matrix: list[list[int]], target: int) -> bool:
      pass
