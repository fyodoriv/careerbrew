  note: single column
hints:
- Why can't you zero rows as soon as you find a zero?
- 'First pass: collect zero rows and zero columns. Second pass: write.'
- rows = {i}, cols = {j} for zeros; then m[i][j] = 0 if i in rows or j in cols.
solution: "def set_zeroes(matrix: list[list[int]]) -> list[list[int]]:\n    rows, cols = set(), set()\n\
  \    for i, row in enumerate(matrix):\n        for j, v in enumerate(row):\n            if v == 0:\n\
  \                rows.add(i); cols.add(j)\n    for i, row in enumerate(matrix):\n        for j in range(len(row)):\n\
  \            if i in rows or j in cols:\n                row[j] = 0\n    return matrix\n"
pitfalls:
  edge-case: A zero in the first row or column must be remembered separately before you use them as markers.
  timeout: Copying the matrix or zeroing rows on the fly can cost O(m*n*(m+n)); two passes with marker
    row/column are O(m*n).
  wrong-answer: Zeroing while scanning makes freshly written zeros trigger more rows; record first, zero
    after.
  exception: Using matrix[0] on an empty matrix raises IndexError; return early if there are no rows.
