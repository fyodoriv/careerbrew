id: set-matrix-zeroes
order: 138
pattern: math and geometry
difficulty: medium
title: Spread the zeros
leetcode: set-matrix-zeroes
lesson: 'Record which rows and columns hold a zero before writing anything, or new zeros will cascade.
  Sets cost O(m+n); the O(1) trick reuses the first row and column as the markers.

  '
statement: 'In the `m x n` matrix, whenever a cell is 0, set its whole row and column to 0. Do it in place
  and return the matrix.

  '
function: set_zeroes
signature: 'def set_zeroes(matrix: list[list[int]]) -> list[list[int]]:'
starter: "def set_zeroes(matrix: list[list[int]]) -> list[list[int]]:\n    pass\n"
tests:
- args:
