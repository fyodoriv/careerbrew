id: implement-trie-prefix-tree
order: 61
pattern: tries
difficulty: medium
title: A prefix tree
leetcode: implement-trie-prefix-tree
lesson: 'A trie stores words character by character along paths from a root, so words that share a prefix
  share nodes. Each node holds a dict of children and a flag marking that a word ends there. Insert, search,
  and prefix checks all cost O(length of the word), independent of how many words are stored.

  '
statement: 'Build a class `Trie` with:

  - `insert(word)`: store the word.

  - `search(word)`: return `True` if exactly this word was stored.

  - `starts_with(prefix)`: return `True` if any stored word begins with `prefix`.


  Words use lowercase letters. The empty prefix matches as soon as anything (or nothing) is stored.

  '
function: Trie
signature: 'class Trie:  # insert(word) -> None; search(word) -> bool; starts_with(prefix) -> bool'
starter: "class Trie:\n    def __init__(self):\n        pass\n\n    def insert(self, word: str) -> None:\n\
  \        pass\n\n    def search(self, word: str) -> bool:\n        pass\n\n    def starts_with(self,\
  \ prefix: str) -> bool:\n        pass\n"
