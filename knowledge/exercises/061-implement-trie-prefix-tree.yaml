hints:
- Think of each node as a map from the next letter to a child node.
- Add an end-of-word flag on nodes; search needs it, starts_with does not.
- 'node = root; for ch in word: node = node.children.setdefault(ch, Node()); node.end = True'
solution: "class Trie:\n    def __init__(self):\n        self.root = {}\n\n    def insert(self, word:\
  \ str) -> None:\n        node = self.root\n        for ch in word:\n            node = node.setdefault(ch,\
  \ {})\n        node[\"$\"] = True\n\n    def _walk(self, s):\n        node = self.root\n        for\
  \ ch in s:\n            if ch not in node:\n                return None\n            node = node[ch]\n\
  \        return node\n\n    def search(self, word: str) -> bool:\n        node = self._walk(word)\n\
  \        return node is not None and \"$\" in node\n\n    def starts_with(self, prefix: str) -> bool:\n\
  \        return self._walk(prefix) is not None\n"
pitfalls:
  prefix_as_word: Returning True from search for a stored prefix like "app" of "apple" forgets the end
    flag.
  edge-case: search('app') after inserting only 'apple' is False, but starts_with('app') is True; the
    empty prefix is always True.
  timeout: Storing words in a list and scanning is O(total words) per call; trie walks are O(length of
    word).
  wrong-answer: Returning True from search for a stored prefix like "app" of "apple" forgets the end flag.
  exception: children[ch] raises KeyError on a missing letter; use `.get(ch)` and return False on None.
