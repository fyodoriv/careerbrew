scale:
  generator: "def make(n):\n    return [[[1, 1, 1]] * n, [2, 2, 2]]\n"
  sizes:
  - 20000
  - 200000
  expected: O(n)
hints:
- 'Maxima never decrease: what does that say about a triplet bigger than the target anywhere?'
- Ignore triplets with any value above the target; the rest can be merged freely.
- 'found = set(); for t in safe: for i in 0..2: if t[i] == target[i]: found.add(i); return len(found)
  == 3.'
solution: "def merge_triplets(triplets: list[list[int]], target: list[int]) -> bool:\n    found = set()\n\
  \    for t in triplets:\n        if all(t[i] <= target[i] for i in range(3)):\n            for i in\
  \ range(3):\n                if t[i] == target[i]:\n                    found.add(i)\n    return len(found)\
  \ == 3\n"
pitfalls:
  edge-case: A triplet equal to the target alone is enough; a list where no triplet passes the filter
    returns False.
  timeout: Trying every subset of triplets to merge is exponential; keep only triplets with no value above
    the target and check each slot once, O(n).
  wrong-answer: Merging a triplet that has any value greater than the target ruins that slot forever;
    skip those before merging.
  exception: Unpacking a triplet with the wrong length crashes; assume exactly three values and compare
    index by index.
