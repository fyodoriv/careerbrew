id: merge-triplets-to-form-target-triplet
order: 127
pattern: greedy
difficulty: medium
title: Build the target triple
leetcode: merge-triplets-to-form-target-triplet
lesson: 'Merging takes element-wise maximums, so any triplet with a value above the target is poison and
  must be skipped. Among the safe ones, check that each coordinate of the target is hit exactly by someone.

  '
statement: 'You have a list of integer triplets. Merging two triplets replaces one with their element-wise
  maximum. Return `True` if, by merging some of them, you can produce exactly `target`.

  '
function: merge_triplets
signature: 'def merge_triplets(triplets: list[list[int]], target: list[int]) -> bool:'
starter: "def merge_triplets(triplets: list[list[int]], target: list[int]) -> bool:\n    pass\n"
tests:
- args:
  - - - 2
      - 5
      - 3
    - - 1
      - 8
      - 4
    - - 1
      - 7
      - 5
  - - 2
    - 7
    - 5
  expected: true
- args:
  - - - 3
      - 4
      - 5
    - - 4
