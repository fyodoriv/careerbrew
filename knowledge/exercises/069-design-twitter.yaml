hints:
- What order are a single user's posts already in?
- Use a global counter as a timestamp; merge followees' lists with a heap keyed by newest time.
- Seed heap with each followee's latest (-time, id, user, index); pop 10 times, pushing that user's previous
  post.
solution: "import heapq\nfrom collections import defaultdict\n\nclass Twitter:\n    def __init__(self):\n\
  \        self.time = 0\n        self.posts = defaultdict(list)\n        self.following = defaultdict(set)\n\
  \n    def post_tweet(self, user_id: int, tweet_id: int) -> None:\n        self.time += 1\n        self.posts[user_id].append((self.time,\
  \ tweet_id))\n\n    def get_news_feed(self, user_id: int) -> list[int]:\n        heap = []\n       \
  \ for u in self.following[user_id] | {user_id}:\n            if self.posts[u]:\n                i =\
  \ len(self.posts[u]) - 1\n                t, tid = self.posts[u][i]\n                heap.append((-t,\
  \ tid, u, i))\n        heapq.heapify(heap)\n        feed = []\n        while heap and len(feed) < 10:\n\
  \            _, tid, u, i = heapq.heappop(heap)\n            feed.append(tid)\n            if i > 0:\n\
  \                t, nid = self.posts[u][i - 1]\n                heapq.heappush(heap, (-t, nid, u, i\
  \ - 1))\n        return feed\n\n    def follow(self, follower_id: int, followee_id: int) -> None:\n\
  \        if follower_id != followee_id:\n            self.following[follower_id].add(followee_id)\n\n\
  \    def unfollow(self, follower_id: int, followee_id: int) -> None:\n        self.following[follower_id].discard(followee_id)\n"
pitfalls:
  edge-case: A user's feed must include their own tweets, and following yourself or unfollowing someone
    you never followed must not break anything.
  timeout: Merging and sorting every followee's whole tweet list is O(total tweets); merge only the last
    10 per user with a heap.
  wrong-answer: Sorting by tweet_id instead of by a global post counter, which is wrong when ids are not
    increasing.
  exception: set.remove on a followee that is not there raises KeyError; use discard, and use defaultdict
    for users never seen.
