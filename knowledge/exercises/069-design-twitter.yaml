id: design-twitter
order: 69
pattern: heap
difficulty: medium
title: Mini social feed
leetcode: design-twitter
lesson: 'Each user''s posts are already in time order, so building a feed is merging a few sorted lists
  and taking the top 10. A heap seeded with each followee''s newest post does that without touching every
  post.

  '
statement: 'Build a class `Twitter()` with: `post_tweet(user_id, tweet_id)` records a new post; `get_news_feed(user_id)`
  returns up to 10 most recent tweet ids from the user and everyone they follow, newest first; `follow(follower_id,
  followee_id)` and `unfollow(follower_id, followee_id)` change who a user follows (following yourself
  or unfollowing someone not followed are no-ops). Methods other than get_news_feed return None.

  '
function: Twitter
