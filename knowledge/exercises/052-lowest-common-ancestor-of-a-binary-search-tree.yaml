id: lowest-common-ancestor-of-a-binary-search-tree
order: 52
pattern: trees
difficulty: medium
title: Where two BST paths split
leetcode: lowest-common-ancestor-of-a-binary-search-tree
lesson: 'In a BST the ordering tells you which way both targets lie. While both are smaller go left, while
  both are larger go right; the first node where they fall on different sides (or one equals the node)
  is the answer. That is O(h) time and O(1) space.

  '
statement: 'Given the root of a binary search tree with distinct values and two values `p` and `q` that
  both exist in it, return the value of their lowest common ancestor: the deepest node that has both of
  them in its subtree. A node counts as being in its own subtree.

  '
function: lca_bst
signature: 'def lca_bst(root: TreeNode, p: int, q: int) -> int:'
starter: "def lca_bst(root: TreeNode, p: int, q: int) -> int:\n    pass\n"
