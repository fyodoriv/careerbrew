scale:
  generator: "def make(n):\n    def b(lo, hi):\n        if lo > hi:\n            return None\n       \
    \ m = (lo + hi) // 2\n        return TreeNode(m, b(lo, m - 1), b(m + 1, hi))\n    return [b(1, n),\
    \ 1, 2]\n"
  sizes:
  - 10000
  - 100000
  expected: O(log n)
hints:
- Compare p and q with the current node's value. What does each comparison tell you?
- If both are smaller, go left; if both are larger, go right; otherwise you have found the split.
- 'while True: if p < node.val and q < node.val: node = node.left elif p > node.val and q > node.val:
  node = node.right else: return node.val'
solution: "def lca_bst(root: TreeNode, p: int, q: int) -> int:\n    node = root\n    while node:\n   \
  \     if p < node.val and q < node.val:\n            node = node.left\n        elif p > node.val and\
  \ q > node.val:\n            node = node.right\n        else:\n            return node.val\n    return\
  \ -1\n"
pitfalls:
  timeout: Searching the whole tree ignores the BST order; walk down from the root, going left when both
    are smaller and right when both are bigger, O(h).
  edge-case: When p or q is itself the ancestor of the other, the answer is that node, not its parent.
  wrong-answer: Using <= or >= in the go-left/go-right tests so the walk moves past the split node when
    it equals p or q.
  exception: Walking into a None child because the comparisons are flipped; with the right tests the loop
    always stops at a real node.
