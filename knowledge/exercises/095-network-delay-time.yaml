id: network-delay-time
order: 95
pattern: advanced graphs
difficulty: medium
title: When does everyone hear it?
leetcode: network-delay-time
lesson: 'Dijkstra''s algorithm finds shortest times from one source when all edge weights are non-negative:
  pop the closest unsettled node from a min-heap and relax its edges. The answer is the largest shortest
  time, or -1 if some node is never reached.

  '
statement: 'There are `n` nodes labeled `1` to `n`. `times` holds directed edges `[u, v, w]`: a signal
  sent from `u` reaches `v` after `w` time units. A signal starts at node `k`. Return how long it takes
  until every node has received it, or `-1` if some node never does.

  '
function: network_delay_time
signature: 'def network_delay_time(times: list[list[int]], n: int, k: int) -> int:'
starter: "def network_delay_time(times: list[list[int]], n: int, k: int) -> int:\n    pass\n"
