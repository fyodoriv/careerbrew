scale:
  generator: "def make(n):\n    return [[[3 * i, 3 * i + 1] for i in range(n)], [n, n + 5]]\n"
  sizes:
  - 20000
  - 200000
  expected: O(n)
hints:
- Which existing intervals can the new one possibly touch?
- Append those ending before new starts; merge those starting at or before new ends; append the rest.
- 'while a[i][1] < s: keep; while a[i][0] <= e: s=min, e=max; then append [s,e] and the tail.'
solution: "def insert(intervals: list[list[int]], new: list[int]) -> list[list[int]]:\n    s, e = new\n\
  \    out, i, n = [], 0, len(intervals)\n    while i < n and intervals[i][1] < s:\n        out.append(intervals[i]);\
  \ i += 1\n    while i < n and intervals[i][0] <= e:\n        s, e = min(s, intervals[i][0]), max(e,\
  \ intervals[i][1]); i += 1\n    out.append([s, e])\n    out.extend(intervals[i:])\n    return out\n"
pitfalls:
  edge-case: An empty interval list returns [new], and a new interval past every other one is appended
    at the end.
  timeout: Appending new and re-sorting everything is O(n log n); one linear pass with three phases (before,
    overlap, after) is O(n).
  wrong-answer: Merging with min of starts but forgetting max of ends shrinks a covering interval; and
    touching intervals like [1,2] and [2,3] must merge.
  exception: Indexing intervals[i] after the while loop finished reads past the end; check i < len(intervals)
    in every loop.
