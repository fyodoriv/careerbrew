id: insert-interval
order: 130
pattern: intervals
difficulty: medium
title: Slot in an interval
leetcode: insert-interval
lesson: 'Because the list is sorted and disjoint, it splits into three zones: intervals fully left of
  the new one, ones that overlap it, and ones fully right. Copy the first, fold the middle into one, copy
  the last.

  '
statement: '`intervals` is a sorted list of non-overlapping `[start, end]` pairs. Insert `new` and return
  the list, still sorted and with overlaps merged.

  '
function: insert
signature: 'def insert(intervals: list[list[int]], new: list[int]) -> list[list[int]]:'
starter: "def insert(intervals: list[list[int]], new: list[int]) -> list[list[int]]:\n    pass\n"
