id: search-in-rotated-sorted-array
order: 32
pattern: binary search
difficulty: medium
title: Search a rotated list
leetcode: search-in-rotated-sorted-array
lesson: |
  At any midpoint of a rotated sorted list, at least one half is in order. Check whether the target falls inside that ordered half's range; if yes search there, otherwise search the other half. Still O(log n).
statement: |
  `nums` is an ascending list of distinct integers that may have been rotated. Return the index of `target` or `-1` if it is missing, in O(log n).
function: search_rotated
signature: 'def search_rotated(nums: list[int], target: int) -> int:'
starter: |
  def search_rotated(nums: list[int], target: int) -> int:
      pass
tests:
- args:
  - - 4
    - 5
    - 6
    - 7
    - 0
    - 1
    - 2
  - 0
  expected: 4
- args:
  - - 4
    - 5
    - 6
    - 7
    - 0
    - 1
    - 2
  - 3
  expected: -1
  note: absent
- args:
  - - 1
  - 0
  expected: -1
  note: single miss
- args:
  - - 1
  - 1
  expected: 0
  note: single hit
- args:
  - - 1
    - 3
  - 3
  expected: 1
  note: two, not rotated
- args:
  - - 3
