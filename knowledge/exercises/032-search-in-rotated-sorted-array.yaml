hints:
- Which side of mid is sorted?
- If nums[lo] <= nums[mid], the left half is sorted.
- 'If left sorted and nums[lo] <= target < nums[mid]: hi = mid - 1, else lo = mid + 1; mirror for the right half.'
solution: |
  def search_rotated(nums: list[int], target: int) -> int:
      lo, hi = 0, len(nums) - 1
      while lo <= hi:
          mid = (lo + hi) // 2
          if nums[mid] == target:
              return mid
          if nums[lo] <= nums[mid]:
              if nums[lo] <= target < nums[mid]:
                  hi = mid - 1
              else:
                  lo = mid + 1
          else:
              if nums[mid] < target <= nums[hi]:
                  lo = mid + 1
              else:
                  hi = mid - 1
      return -1
pitfalls:
  edge-case: A target that is missing returns -1, and a one- or two-element list must still work, like
    [3, 1] with target 1.
  timeout: A linear scan is O(n); at each step one half is sorted, so decide which half and binary search
    in O(log n).
  wrong-answer: Using < instead of <= when testing whether the left half is sorted (nums[lo] <= nums[mid])
    breaks when lo == mid.
  exception: Reading nums[mid + 1] to find the pivot raises IndexError at the end; compare only nums[lo],
    nums[mid], and nums[hi].
