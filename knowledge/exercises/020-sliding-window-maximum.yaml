id: sliding-window-maximum
order: 20
pattern: sliding window
difficulty: hard
title: Peak of every window
leetcode: sliding-window-maximum
lesson: |
  Keep a deque of indices whose values are decreasing from front to back. A new value pops every smaller value off the back (they can never be a maximum again), and the front drops off once it leaves the window. Every index enters and leaves once, so the whole run is O(n).
statement: |
  Given a list of integers `nums` and a window size `k` (1 <= k <= len(nums)), slide a window of `k` consecutive values from left to right one step at a time. Return the list of each window's largest value.
function: max_sliding_window
signature: "def max_sliding_window(nums: list[int], k: int) -> list[int]:"
starter: |
  def max_sliding_window(nums: list[int], k: int) -> list[int]:
      pass
tests:
  - {args: [[1, 3, -1, -3, 5, 3, 6, 7], 3], expected: [3, 3, 5, 5, 6, 7]}
  - {args: [[4], 1], expected: [4], note: single element}
  - {args: [[2, 1, 5], 1], expected: [2, 1, 5], note: window of one}
  - {args: [[2, 1, 5], 3], expected: [5], note: window covers everything}
  - {args: [[-7, -8, -3, -9], 2], expected: [-7, -3, -3], note: negatives}
  - {args: [[3, 3, 3, 3], 2], expected: [3, 3, 3], note: duplicates}
scale:
  generator: |
    def make(n):
        return [list(range(n, 0, -1)), n // 10]
  sizes: [20000, 200000]
  expected: O(n)
hints:
  - When a bigger value arrives, can any smaller value before it still be a window's maximum?
  - Keep a deque of indices with decreasing values; drop the front when it falls out of the window.
  - "for i, x: pop back while nums[dq[-1]] <= x; append i; if dq[0] <= i - k: popleft; if i >= k - 1: out.append(nums[dq[0]])"
solution: |
  from collections import deque


  def max_sliding_window(nums: list[int], k: int) -> list[int]:
      dq = deque()
      out = []
      for i, x in enumerate(nums):
          while dq and nums[dq[-1]] <= x:
              dq.pop()
          dq.append(i)
          if dq[0] <= i - k:
              dq.popleft()
          if i >= k - 1:
              out.append(nums[dq[0]])
      return out
pitfalls:
  edge-case: When k is 1 the answer is the list itself, and when k equals the length the answer is one
    value, the overall max.
  timeout: Taking max() of every window is O(n*k); a monotonic deque of indexes gives O(n).
  wrong-answer: Storing values instead of indexes in the deque, so you cannot tell when the front has
    left the window; store indexes and pop the front when it is <= i - k.
  exception: Reading dq[0] when the deque is empty raises IndexError; only record an answer once i >=
    k - 1, after pushing the current index.
