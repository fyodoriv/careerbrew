pattern: math and geometry
difficulty: medium
title: Count axis squares
leetcode: detect-squares
lesson: 'Store a count of every point. For a query, each stored point on a diagonal (same distance in
  x and y, nonzero) fixes a square; multiply the counts of the other two corners. Work is proportional
  to distinct points.

  '
statement: 'Build a class `DetectSquares` with `add(point)`, which stores an `[x, y]` point (duplicates
  allowed), and `count(point)`, which returns how many ways to pick three stored points that form an axis-aligned
  square of positive area together with the query point.

  '
