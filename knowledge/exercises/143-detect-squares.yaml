hints:
- Which stored point, together with the query, pins down a whole square?
- A diagonal partner (x2, y2) with |x2-x| == |y2-y| > 0 fixes the other corners.
- 'for (px,py),c in counts: if abs(px-x)==abs(py-y)!=0: total += c * counts[(x,py)] * counts[(px,y)].'
solution: "from collections import Counter\n\nclass DetectSquares:\n    def __init__(self):\n        self.pts\
  \ = Counter()\n\n    def add(self, point: list[int]) -> None:\n        self.pts[tuple(point)] += 1\n\
  \n    def count(self, point: list[int]) -> int:\n        x, y = point\n        total = 0\n        for\
  \ (px, py), c in list(self.pts.items()):\n            if abs(px - x) == abs(py - y) and px != x:\n \
  \               total += c * self.pts.get((x, py), 0) * self.pts.get((px, y), 0)\n        return total\n"
pitfalls:
  edge-case: Duplicate points count separately, and a query point equal to a stored point must not form
    a zero-size square.
  timeout: Checking every pair of stored points per count is O(n^2); loop over points sharing the query's
    x (or diagonal points) with a Counter, O(n) per count.
  wrong-answer: Forgetting to multiply the counts of the three corner points undercounts when duplicates
    exist.
  exception: Reading counts[(x, y)] on a plain dict raises KeyError; use a Counter or defaultdict(int).
