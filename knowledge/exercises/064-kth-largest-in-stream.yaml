id: kth-largest-in-stream
order: 64
pattern: heap
difficulty: easy
title: Running k-th best score
leetcode: kth-largest-element-in-a-stream
lesson: 'Keep only the k largest values seen so far in a min-heap. The smallest of those k sits at the
  root, and it is exactly the k-th largest overall; each new value costs O(log k).

  '
statement: 'Build a class `KthLargest(k, nums)` that tracks a growing collection of integers. Its method
  `add(val)` inserts `val` and returns the k-th largest value in the collection after the insertion. It
  is guaranteed that at least `k` values exist whenever `add` is called.

  '
function: KthLargest
signature: "class KthLargest:\n    def __init__(self, k: int, nums: list[int]): ...\n    def add(self,\
  \ val: int) -> int: ...\n"
starter: "class KthLargest:\n    def __init__(self, k: int, nums: list[int]):\n        pass\n    def add(self,\
  \ val: int) -> int:\n        pass\n"
