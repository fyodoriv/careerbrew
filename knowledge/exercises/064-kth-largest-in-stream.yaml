hints:
- Do you need to remember values that can never be the k-th largest again?
- Keep a min-heap of size at most k; its root is the answer.
- 'heapify nums, pop until size k; in add: heappush, pop if size > k, return heap[0]'
solution: "import heapq\n\nclass KthLargest:\n    def __init__(self, k: int, nums: list[int]):\n     \
  \   self.k = k\n        self.heap = nums[:]\n        heapq.heapify(self.heap)\n        while len(self.heap)\
  \ > k:\n            heapq.heappop(self.heap)\n\n    def add(self, val: int) -> int:\n        heapq.heappush(self.heap,\
  \ val)\n        if len(self.heap) > self.k:\n            heapq.heappop(self.heap)\n        return self.heap[0]\n"
pitfalls:
  timeout: Sorting the whole collection on every add is O(n log n) per call; a min-heap kept at size k
    is O(log k).
  edge-case: nums may start with fewer than k values; the heap fills up through add before it is full
    size.
  wrong-answer: Keeping a max-heap of everything and popping k times, or pushing without popping back
    down to k items.
  exception: Reading heap[0] on an empty heap raises IndexError; push the new value before trimming and
    reading.
