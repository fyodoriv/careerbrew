id: maximum-subarray
order: 122
pattern: greedy
difficulty: medium
title: Best contiguous run
leetcode: maximum-subarray
lesson: 'Kadane''s idea: a running sum that has gone negative can only hurt whatever comes next, so drop
  it and restart. Track the best running sum seen; one pass, O(1) memory.

  '
statement: 'Given a non-empty list of integers `nums`, return the largest sum you can get from a contiguous,
  non-empty slice of it.

  '
function: max_subarray
signature: 'def max_subarray(nums: list[int]) -> int:'
starter: "def max_subarray(nums: list[int]) -> int:\n    pass\n"
tests:
- args:
  - - -2
    - 1
    - -3
    - 4
    - -1
    - 2
    - 1
    - -5
    - 4
  expected: 6
- args:
  - - 5
    - 4
    - -1
    - 7
    - 8
  expected: 23
- args:
  - - 1
  expected: 1
  note: single element
- args:
  - - -3
    - -1
    - -2
  expected: -1
  note: 'all negative: pick the largest single value'
- args:
  - - 0
    - 0
    - 0
  expected: 0
  note: zeros
- args:
  - - 2
    - -1
    - 2
  expected: 3
  note: dip worth keeping
scale:
  generator: "def make(n):\n    return [[(i * 37) % 21 - 10 for i in range(n)]]\n"
  sizes:
  - 20000
  - 200000
  expected: O(n)
hints:
- Think about the best slice that ends exactly at index i.
- The best slice ending at i is either nums[i] alone or nums[i] plus the best slice ending at i-1.
- cur = max(x, cur + x); best = max(best, cur) for each x, starting both at nums[0].
solution: "def max_subarray(nums: list[int]) -> int:\n    best = cur = nums[0]\n    for x in nums[1:]:\n\
  \        cur = max(x, cur + x)\n        best = max(best, cur)\n    return best\n"
pitfalls:
  edge-case: When every value is negative, like [-3, -1, -2], return the largest single value -1, not
    0.
  timeout: Trying every start and end is O(n^2) or worse; Kadane's running sum is O(n).
  wrong-answer: Starting best at 0 returns 0 when every value is negative; start both best and current
    at nums[0].
  exception: max() of an empty slice or indexing nums[0] on empty input crashes; the list is non-empty,
    so loop from index 1.
