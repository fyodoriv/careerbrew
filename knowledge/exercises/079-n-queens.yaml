id: n-queens
order: 79
pattern: backtracking
difficulty: hard
title: Peaceful queens
leetcode: n-queens
lesson: 'Place one queen per row, tracking used columns and both diagonal families (r - c and r + c) in
  sets. That makes each safety check O(1) and prunes almost every branch.

  '
statement: 'Place `n` chess queens on an n x n board so no two share a row, column, or diagonal. Return
  every solution as a list of n strings, row by row, using ''Q'' for a queen and ''.'' for empty. Any
  order of solutions is accepted.

  '
function: solve_n_queens
signature: 'def solve_n_queens(n: int) -> list[list[str]]:'
