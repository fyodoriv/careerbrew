hints:
- How many queens can each row hold?
- Go row by row; keep sets of used columns, r - c diagonals, and r + c anti-diagonals.
- 'go(r): for c: skip if attacked; add to the three sets; go(r+1); remove'
solution: "def solve_n_queens(n: int) -> list[list[str]]:\n    out, cols = [], []\n    used_c, used_d,\
  \ used_a = set(), set(), set()\n\n    def go(r):\n        if r == n:\n            out.append([\".\"\
  \ * c + \"Q\" + \".\" * (n - c - 1) for c in cols])\n            return\n        for c in range(n):\n\
  \            if c in used_c or r - c in used_d or r + c in used_a:\n                continue\n     \
  \       used_c.add(c); used_d.add(r - c); used_a.add(r + c); cols.append(c)\n            go(r + 1)\n\
  \            used_c.discard(c); used_d.discard(r - c); used_a.discard(r + c); cols.pop()\n\n    go(0)\n\
  \    return out\n"
pitfalls:
  edge-case: n = 2 and n = 3 have no solutions and must return []; n = 1 returns [['Q']].
  timeout: Checking the whole board for attacks at each placement is O(n^2) per step; keep sets for columns,
    r - c and r + c diagonals for O(1) checks.
  wrong-answer: 'Mixing up the two diagonals: one is r - c, the other r + c.'
  exception: Building row strings by mutating Python strings fails; build a list of chars and join.
