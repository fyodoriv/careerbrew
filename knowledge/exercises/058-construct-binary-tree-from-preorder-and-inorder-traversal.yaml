scale:
  generator: "def make(n):\n    pre, ino = [], list(range(n))\n    def walk(lo, hi):\n        if lo >\
    \ hi:\n            return\n        m = (lo + hi) // 2\n        pre.append(m)\n        walk(lo, m -\
    \ 1)\n        walk(m + 1, hi)\n    walk(0, n - 1)\n    return [pre, ino]\n"
  sizes:
  - 10000
  - 100000
  expected: O(n)
hints:
- Which list tells you the root? Which tells you what goes left and right of it?
- Map each value to its inorder index; recurse on inorder index ranges while a pointer walks preorder.
- 'def b(lo, hi): if lo > hi: return None; v = preorder[i]; i += 1; m = pos[v]; return TreeNode(v, b(lo,
  m - 1), b(m + 1, hi))'
solution: "def build_tree(preorder: list[int], inorder: list[int]) -> Optional[TreeNode]:\n    pos = {v:\
  \ i for i, v in enumerate(inorder)}\n    nxt = 0\n\n    def build(lo, hi):\n        nonlocal nxt\n \
  \       if lo > hi:\n            return None\n        val = preorder[nxt]\n        nxt += 1\n      \
  \  mid = pos[val]\n        node = TreeNode(val)\n        node.left = build(lo, mid - 1)\n        node.right\
  \ = build(mid + 1, hi)\n        return node\n\n    return build(0, len(inorder) - 1)\n"
pitfalls:
  timeout: Slicing lists and calling inorder.index at each node is O(n^2); build a value-to-index dict
    once and pass index ranges, O(n).
  edge-case: A single-node tree, and trees that are pure left or right chains, must rebuild correctly.
  wrong-answer: Building the right subtree before the left while consuming preorder, which assigns values
    to the wrong side.
  exception: Recursing with an empty range and indexing past the end; return None when left > right.
