id: construct-binary-tree-from-preorder-and-inorder-traversal
order: 58
pattern: trees
difficulty: medium
title: Rebuild from two walks
leetcode: construct-binary-tree-from-preorder-and-inorder-traversal
lesson: 'The first preorder value is the root; its position in the inorder list splits the remaining values
  into left and right subtrees. Store inorder positions in a dict and consume preorder with a moving index,
  so each node costs O(1) and the build is O(n) instead of O(n^2) from slicing and searching.

  '
statement: 'You are given two lists of distinct integers, `preorder` and `inorder`, which are the preorder
  and inorder traversals of the same binary tree. Rebuild that tree and return its root.

  '
function: build_tree
signature: 'def build_tree(preorder: list[int], inorder: list[int]) -> Optional[TreeNode]:'
starter: "def build_tree(preorder: list[int], inorder: list[int]) -> Optional[TreeNode]:\n    pass\n"
