hints:
- Plain Dijkstra ignores the stop limit. Think in rounds of flights.
- Run Bellman-Ford for k+1 rounds; relax from a snapshot of the previous round.
- 'prices=[inf]*n; prices[src]=0; repeat k+1: tmp=prices[:]; for u,v,w: tmp[v]=min(tmp[v], prices[u]+w);
  prices=tmp.'
solution: "def find_cheapest_price(n: int, flights: list[list[int]], src: int, dst: int, k: int) -> int:\n\
  \    inf = float(\"inf\")\n    prices = [inf] * n\n    prices[src] = 0\n    for _ in range(k + 1):\n\
  \        tmp = prices[:]\n        for u, v, w in flights:\n            if prices[u] + w < tmp[v]:\n\
  \                tmp[v] = prices[u] + w\n        prices = tmp\n    return -1 if prices[dst] == inf else\
  \ prices[dst]\n"
pitfalls:
  wrong: Relaxing in place lets one round use several flights and breaks the stop limit.
  edge-case: src equal to dst costs 0, and k = 0 allows only direct flights; return -1 if unreachable.
  timeout: Trying all paths with DFS is exponential; Bellman-Ford limited to k + 1 rounds is O(k * E).
  wrong-answer: Relaxing in place lets one round use several flights and breaks the stop limit.
  exception: Plain Dijkstra with a visited set drops a cheaper-but-longer path; track stops in the state.
