id: cheapest-flights-k-stops
order: 98
pattern: advanced graphs
difficulty: medium
title: Cheap fare, few layovers
leetcode: cheapest-flights-within-k-stops
lesson: 'Bellman-Ford limited to k+1 rounds finds the cheapest price using at most k+1 flights. Each round
  relaxes every edge from a copy of the previous round''s prices, so a single round never chains two flights.

  '
statement: 'There are `n` cities numbered `0` to `n - 1` and `flights` given as `[from, to, price]`. Return
  the cheapest price from `src` to `dst` using at most `k` intermediate stops, or `-1` if no such trip
  exists.

  '
function: find_cheapest_price
signature: 'def find_cheapest_price(n: int, flights: list[list[int]], src: int, dst: int, k: int) -> int:'
starter: "def find_cheapest_price(n: int, flights: list[list[int]], src: int, dst: int, k: int) -> int:\n\
  \    pass\n"
