id: gas-station
order: 125
pattern: greedy
difficulty: medium
title: Fuel loop start
leetcode: gas-station
lesson: 'If total fuel is less than total cost, no start works. Otherwise, whenever the running tank drops
  below zero, no station from the current start up to here can be the answer, so restart after it.

  '
statement: 'Stations sit on a circular road. At station `i` you can fill `gas[i]` units, and driving to
  station `i+1` burns `cost[i]`. Starting with an empty tank, return the index of the station from which
  you can drive one full lap, or -1 if none. The answer is unique when it exists.

  '
function: can_complete_circuit
signature: 'def can_complete_circuit(gas: list[int], cost: list[int]) -> int:'
starter: "def can_complete_circuit(gas: list[int], cost: list[int]) -> int:\n    pass\n"
tests:
- args:
  - - 1
    - 2
    - 3
    - 4
    - 5
  - - 3
    - 4
    - 5
    - 1
    - 2
  expected: 3
- args:
  - - 2
    - 3
    - 4
  - - 3
    - 4
    - 3
  expected: -1
  note: not enough total fuel
- args:
  - - 5
  - - 4
  expected: 0
  note: single station
- args:
  - - 1
  - - 2
  expected: -1
  note: single station, too costly
- args:
  - - 3
    - 1
    - 1
  - - 1
    - 2
    - 2
  expected: 0
- args:
  - - 0
    - 0
    - 5
  - - 1
    - 1
    - 3
  expected: 2
  note: start near the end
scale:
  generator: "def make(n):\n    return [[2] * n, [1] * (n - 1) + [n + 5]]\n"
  sizes:
  - 20000
  - 200000
  expected: O(n)
hints:
- First decide whether any answer exists at all.
- If you fail between start s and station j, every station between s and j would fail too.
- Track total and tank; when tank < 0, set start = i + 1 and tank = 0. Return start if total >= 0 else
  -1.
solution: "def can_complete_circuit(gas: list[int], cost: list[int]) -> int:\n    total = tank = start\
  \ = 0\n    for i, (g, c) in enumerate(zip(gas, cost)):\n        total += g - c\n        tank += g -\
  \ c\n        if tank < 0:\n            start, tank = i + 1, 0\n    return start if total >= 0 else -1\n"
pitfalls:
  edge-case: If sum(gas) < sum(cost) return -1 even if some prefix looks fine; a single station with gas
    >= cost returns 0.
  timeout: Simulating a full lap from every station is O(n^2); one pass that resets the start when the
    tank goes negative is O(n).
  wrong-answer: Resetting the start to i instead of i+1 when the tank dips below zero picks a station
    that cannot work.
  exception: Wrapping with gas[i+1] runs past the end; use the one-pass method or index with % n.
