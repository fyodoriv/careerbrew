id: combination-sum
order: 72
pattern: backtracking
difficulty: medium
title: Reusable coins to a target
leetcode: combination-sum
lesson: 'Backtrack over candidates in a fixed order and only move forward (or stay) in that order; that
  avoids producing the same multiset twice. Stop a branch once the remaining target goes negative.

  '
statement: 'Given distinct positive integers `candidates` and a positive `target`, return every unique
  combination of candidates that sums to target. A candidate may be used any number of times. Two combinations
  are the same if they use the same counts of each value; order does not matter.

  '
function: combination_sum
signature: 'def combination_sum(candidates: list[int], target: int) -> list[list[int]]:'
starter: "def combination_sum(candidates: list[int], target: int) -> list[list[int]]:\n    pass\n"
