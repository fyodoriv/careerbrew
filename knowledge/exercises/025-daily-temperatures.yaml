scale:
  generator: |
    def make(n):
        return [list(range(n, 0, -1)) + [n + 1]]
  sizes:
  - 20000
  - 200000
  expected: O(n)
hints:
- For each day, the answer is the next greater element to the right.
- Keep a stack of indexes whose answer is not known yet.
- 'For each i, while temps[i] > temps[stack[-1]]: j = pop, ans[j] = i - j. Then push i.'
solution: |
  def daily_temperatures(temps: list[int]) -> list[int]:
      ans = [0] * len(temps)
      stack = []
      for i, t in enumerate(temps):
          while stack and temps[stack[-1]] < t:
              j = stack.pop()
              ans[j] = i - j
          stack.append(i)
      return ans
pitfalls:
  edge-case: The last day, and any day with no warmer day after it, gets 0; equal temperatures are not
    warmer.
  timeout: Scanning forward from every day is O(n^2) on a falling sequence; a stack of unresolved day
    indexes is O(n).
  wrong-answer: Popping on >= instead of >, so a day of equal temperature counts as warmer; pop only while
    today is strictly warmer.
  exception: Reading temps[stack[-1]] on an empty stack raises IndexError; check `while stack and ...`.
