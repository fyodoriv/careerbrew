id: daily-temperatures
order: 25
pattern: stack
difficulty: medium
title: Wait for warmer
leetcode: daily-temperatures
lesson: |
  A monotonic stack keeps the indexes of days still waiting for a warmer one, coldest on top. Each new day pops and answers every colder day it beats, so each index is pushed and popped once: O(n).
statement: |
  `temps[i]` is the temperature on day `i`. Return a list where position `i` holds how many days you must wait after day `i` for a strictly warmer day, or `0` if none comes.
function: daily_temperatures
signature: 'def daily_temperatures(temps: list[int]) -> list[int]:'
starter: |
  def daily_temperatures(temps: list[int]) -> list[int]:
      pass
