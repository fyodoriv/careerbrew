id: combination-sum-once
order: 75
pattern: backtracking
difficulty: medium
title: Use each card once to hit a target
leetcode: combination-sum-ii
lesson: 'Sort, then each element is used at most once by recursing from i + 1, and equal neighbours at
  the same level are skipped to avoid duplicate combinations. Sorting also lets you stop as soon as a
  value exceeds what''s left.

  '
statement: 'Given a list of positive integers `candidates` (may contain repeats) and a `target`, return
  every distinct combination whose values sum to target, where each list position may be used at most
  once. Combinations with the same multiset of values count once. Any order is accepted.

  '
function: combination_sum2
signature: 'def combination_sum2(candidates: list[int], target: int) -> list[list[int]]:'
