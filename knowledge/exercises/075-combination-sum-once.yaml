hints:
- How does this differ from the version where values are reusable?
- Recurse from i + 1, and skip a value equal to the previous one at the same depth.
- 'sorted; go(start, left): for i from start: break if too big; skip if i > start and equal to previous;
  push, go(i+1, ...), pop'
solution: "def combination_sum2(candidates: list[int], target: int) -> list[list[int]]:\n    nums = sorted(candidates)\n\
  \    out, path = [], []\n\n    def go(start, left):\n        if left == 0:\n            out.append(path[:])\n\
  \            return\n        for i in range(start, len(nums)):\n            if nums[i] > left:\n   \
  \             break\n            if i > start and nums[i] == nums[i - 1]:\n                continue\n\
  \            path.append(nums[i])\n            go(i + 1, left - nums[i])\n            path.pop()\n\n\
  \    go(0, target)\n    return out\n"
pitfalls:
  edge-case: Repeated candidates must not produce the same combination twice, e.g. [1,1,2] target 3 gives
    [1,2] once.
  timeout: Generating all subsets and deduplicating is O(2^n); sort, skip equal values at the same depth,
    and break when a value exceeds the remainder.
  wrong-answer: Recursing with i instead of i + 1, which reuses the same card.
  exception: Using a set of lists to dedupe raises TypeError; use tuples or the skip rule.
