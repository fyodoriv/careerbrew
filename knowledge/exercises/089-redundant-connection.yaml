scale:
  generator: "def make(n):\n    return [[[i, i + 1] for i in range(1, n)] + [[1, n]]]\n"
  sizes:
  - 20000
  - 200000
  expected: O(n)
hints:
- When does adding an edge create a cycle?
- 'Union-find: if both endpoints already share a root, that edge is redundant.'
- 'for u, v: if find(u) == find(v): return [u, v]; else union'
solution: "def find_redundant_connection(edges: list[list[int]]) -> list[int]:\n    parent = list(range(len(edges)\
  \ + 1))\n\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n\
  \            x = parent[x]\n        return x\n\n    for u, v in edges:\n        ru, rv = find(u), find(v)\n\
  \        if ru == rv:\n            return [u, v]\n        parent[ru] = rv\n    return []\n"
pitfalls:
  edge-case: When several edges could be removed, return the one that appears last in the input.
  timeout: Removing each edge and running a full connectivity check is O(n^2); union-find returns the
    first edge whose ends are already joined in near O(n).
  wrong-answer: Returning the first cycle edge found by DFS instead of the last in input order.
  exception: Union-find arrays sized n with 1-based labels raise IndexError; size them n + 1.
