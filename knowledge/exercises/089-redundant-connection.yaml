id: redundant-connection
order: 89
pattern: graphs
difficulty: medium
title: The extra edge
leetcode: redundant-connection
lesson: 'A tree plus one edge has exactly one cycle. Union-find adds edges one by one; the first edge
  whose endpoints are already connected closes the cycle.

  '
statement: 'A graph started as a tree with nodes 1..n and then got one extra edge, so it has n edges given
  in `edges` as `[u, v]` pairs. Return an edge whose removal leaves a tree; if several qualify, return
  the one that appears last in the input.

  '
function: find_redundant_connection
signature: 'def find_redundant_connection(edges: list[list[int]]) -> list[int]:'
starter: "def find_redundant_connection(edges: list[list[int]]) -> list[int]:\n    pass\n"
