id: two-sum-ii-input-array-is-sorted
order: 11
pattern: two pointers
difficulty: medium
title: Pair sum in a sorted list
leetcode: two-sum-ii-input-array-is-sorted
lesson: |
  When the input is sorted, a pointer at each end decides every step: if the sum is too small, move the left pointer right; if too big, move the right pointer left. Each move discards a whole row of pairs, giving O(n) time and O(1) space.
statement: |
  Given a list `numbers` sorted in non-decreasing order and an integer `target`, exactly one pair of different positions sums to `target`. Return their positions as `[i, j]` counted from 1, with `i < j`. Use only constant extra space.
function: two_sum_sorted
signature: "def two_sum_sorted(numbers: list[int], target: int) -> list[int]:"
starter: |
  def two_sum_sorted(numbers: list[int], target: int) -> list[int]:
      pass
tests:
  - {args: [[1, 3, 4, 8, 11], 7], expected: [2, 3]}
  - {args: [[2, 3, 4], 6], expected: [1, 3]}
  - {args: [[-5, -1, 0, 7], -6], expected: [1, 2], note: negatives}
  - {args: [[4, 4], 8], expected: [1, 2], note: duplicate values}
  - {args: [[0, 0, 3, 9], 12], expected: [3, 4], note: pair at the end}
scale:
  generator: |
    def make(n):
        return [list(range(n)), 1]
  sizes: [20000, 200000]
  expected: O(n)
hints:
  - Look at the smallest and largest values. What does their sum tell you?
  - Start pointers at both ends; move the left one up if the sum is too small, the right one down if too large.
  - "while l < r: s = numbers[l] + numbers[r]; if s == target: return [l + 1, r + 1]; elif s < target: l += 1; else: r -= 1"
solution: |
  def two_sum_sorted(numbers: list[int], target: int) -> list[int]:
      l, r = 0, len(numbers) - 1
      while l < r:
          s = numbers[l] + numbers[r]
          if s == target:
              return [l + 1, r + 1]
          if s < target:
              l += 1
          else:
              r -= 1
      return []
pitfalls:
  edge-case: The answer pair can be the two ends, or two equal values like [2, 2] with target 4; do not
    skip duplicates.
  timeout: A dictionary works but uses O(n) space and nested loops are O(n^2); the sorted order lets two
    pointers solve it in O(n) time and O(1) space.
  wrong-answer: Positions are counted from 1, not 0, and the pointer to move is the left one when the
    sum is too small, the right one when it is too big.
  exception: Moving a pointer past the other in a `while True` loop raises IndexError; loop while left
    < right.
