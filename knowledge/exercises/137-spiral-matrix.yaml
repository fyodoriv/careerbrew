hints:
- Simulate the walk layer by layer.
- Use top/bottom/left/right bounds and shrink one after each side.
- After the top row and right column, only read bottom if top <= bottom and left if left <= right.
solution: "def spiral_order(matrix: list[list[int]]) -> list[int]:\n    out = []\n    top, bottom, left,\
  \ right = 0, len(matrix) - 1, 0, len(matrix[0]) - 1\n    while top <= bottom and left <= right:\n  \
  \      out.extend(matrix[top][left:right + 1]); top += 1\n        out.extend(matrix[r][right] for r\
  \ in range(top, bottom + 1)); right -= 1\n        if top <= bottom:\n            out.extend(matrix[bottom][c]\
  \ for c in range(right, left - 1, -1)); bottom -= 1\n        if left <= right:\n            out.extend(matrix[r][left]\
  \ for r in range(bottom, top - 1, -1)); left += 1\n    return out\n"
pitfalls:
  edge-case: A single row or single column must be read once, not forward and back; an empty matrix returns
    [].
  timeout: Marking visited cells in a set is fine, but direction-turn simulation with checks per cell
    adds overhead; four shrinking boundaries are O(m*n).
  wrong-answer: Without the crossing checks a single middle row or column is read forward and back; check
    top <= bottom and left <= right before the bottom and left passes.
  exception: matrix[0] on an empty matrix raises IndexError; return [] when there are no rows.
