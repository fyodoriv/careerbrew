id: spiral-matrix
order: 137
pattern: math and geometry
difficulty: medium
title: Read in a spiral
leetcode: spiral-matrix
lesson: 'Keep four shrinking walls: top, bottom, left, right. Walk each side and pull its wall in; check
  the walls have not crossed before the bottom and left passes so single rows or columns are not read
  twice.

  '
statement: 'Given an `m x n` matrix, return all its values read clockwise in a spiral, starting at the
  top-left corner.

  '
function: spiral_order
signature: 'def spiral_order(matrix: list[list[int]]) -> list[int]:'
starter: "def spiral_order(matrix: list[list[int]]) -> list[int]:\n    pass\n"
