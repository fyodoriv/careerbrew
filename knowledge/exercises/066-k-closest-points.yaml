id: k-closest-points
order: 66
pattern: heap
difficulty: medium
title: Nearest k to the origin
leetcode: k-closest-points-to-origin
lesson: 'Compare squared distances; the square root never changes the order. A heap (or heapq.nsmallest)
  picks the k smallest in O(n log k).

  '
statement: 'Given a list of points `[x, y]` on a plane and an integer `k`, return the `k` points closest
  to the origin (Euclidean distance). Any order is accepted. Tests guarantee there are no ties at the
  boundary.

  '
function: k_closest
signature: 'def k_closest(points: list[list[int]], k: int) -> list[list[int]]:'
starter: "def k_closest(points: list[list[int]], k: int) -> list[list[int]]:\n    pass\n"
compare: sorted
tests:
- args:
  - - - 1
      - 3
    - - -2
      - 2
  - 1
  expected:
  - - -2
    - 2
- args:
  - - - 3
      - 3
    - - 5
      - -1
    - - -2
      - 4
  - 2
  expected:
  - - 3
    - 3
  - - -2
    - 4
- args:
  - - - 0
      - 0
  - 1
  expected:
  - - 0
    - 0
  note: point at the origin
- args:
  - - - 1
      - 1
    - - 2
      - 2
    - - 3
      - 3
  - 3
  expected:
  - - 1
    - 1
  - - 2
    - 2
  - - 3
    - 3
  note: k equals n
- args:
  - - - -5
      - 0
    - - 0
      - 1
    - - 4
      - 4
  - 1
  expected:
  - - 0
    - 1
  note: negative coordinates
scale:
  generator: "def make(n):\n    return [[[(i * 31) % 1000 - 500, (i * 17) % 1000 - 500] for i in range(n)],\
    \ 10]\n"
  sizes:
  - 10000
  - 100000
  expected: O(n log n)
hints:
- Do you need the actual distance, or just something that orders the same way?
- Keep a max-heap of size k on squared distance, or use heapq.nsmallest with a key.
- 'heapq.nsmallest(k, points, key=lambda p: p[0]**2 + p[1]**2)'
solution: "import heapq\n\ndef k_closest(points: list[list[int]], k: int) -> list[list[int]]:\n    return\
  \ heapq.nsmallest(k, points, key=lambda p: p[0] * p[0] + p[1] * p[1])\n"
pitfalls:
  edge-case: k equal to len(points) should return every point; points tied in distance may come back in
    any order.
  timeout: Sorting all points is O(n log n), fine, but for huge n keep a max-heap of size k for O(n log
    k).
  wrong-answer: Comparing x + y or abs values instead of x*x + y*y.
  exception: Pushing [dist, point] lists into a heap compares the lists on ties, which works, but pushing
    raw tuples with unorderable objects crashes; push (dist, i).
