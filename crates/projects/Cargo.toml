[package]
name = "careerbrew-projects"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
careerbrew-vault = { path = "../vault" }
careerbrew-setup = { path = "../setup" }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
regex = "=1.13.2"
glob = "=0.3.4"
sha2 = "=0.10.9"
uuid = { version = "=1.29.3", features = ["v4"] }

[[bin]]
name = "projects-component"
path = "src/bin/projects-component.rs"
