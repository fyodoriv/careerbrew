[package]
name = "careerbrew-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# rust-25: the native localhost front for the unchanged web UI. It owns auth,
# cookies, the host check, response headers, the change version and static
# files, and forwards every other route to the Python handler through an
# explicit per-route table. Opt-in only (`careerbrew config set web_server native`).

[dependencies]
careerbrew-vault = { path = "../vault" }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "=0.10.4"
sha2 = "=0.10.9"
base64 = "=0.22.1"
libc = "=0.2.191"
num-bigint = "=0.5.1"

[dev-dependencies]
tempfile = "=3.23.0"

[[bin]]
name = "web-component"
path = "src/bin/web-component.rs"
