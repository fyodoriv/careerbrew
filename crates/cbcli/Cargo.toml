[package]
name = "careerbrew-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "careerbrew_cli"
path = "src/lib.rs"

[[bin]]
name = "careerbrew-native"
path = "src/main.rs"

[dependencies]
careerbrew-setup = { path = "../setup" }
careerbrew-vault = { path = "../vault" }

[dev-dependencies]
tempfile = "=3.23.0"
