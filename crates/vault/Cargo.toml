[package]
name = "careerbrew-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto", "fernet_danger_timestamps"] }
base64 = "=0.22.1"
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
yaml-rust2 = { version = "=0.13.0", default-features = false }
num-bigint = "=0.5.1"
careerbrew-policy = { path = "../policy" }
libc = "=0.2.191"
sha2 = "=0.10.9"

# Synthetic-only cross-engine transport for the key provider and the
# atomic write (rust-05d, tests/unit/test_rust05d_key_interop.py).
[[bin]]
name = "vault-store"
path = "src/bin/vault-store.rs"

[[bin]]
name = "careerbrew-vault"
path = "src/main.rs"
