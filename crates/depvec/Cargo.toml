[package]
name = "careerbrew-depvec"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
fsrs = "=7.0.0"
http = "=1.5.0"
rlimit = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wait-timeout = "=0.2.1"
yaml-rust2 = { version = "=0.13.0", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "=0.10.4"
icalendar = { version = "=0.17.17", default-features = false, features = ["parser"] }
rrule = "=0.14.0"
oxc_allocator = "=0.159.0"
oxc_parser = "=0.159.0"
oxc_semantic = "=0.159.0"
oxc_span = "=0.159.0"
ruff_python_ast = "=0.0.22"
ruff_python_parser = "=0.0.22"
careerbrew-vault = { path = "../vault" }
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto", "fernet_danger_timestamps"] }
base64 = "=0.22.1"
