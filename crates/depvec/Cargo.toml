[package]
name = "careerbrew-depvec"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
yaml-rust2 = { version = "=0.13.0", default-features = false }
careerbrew-vault = { path = "../vault" }
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto"] }
base64 = "=0.22.1"
