[package]
name = "careerbrew-jobs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
careerbrew-vault = { path = "../vault" }
careerbrew-setup = { path = "../setup" }
careerbrew-projects = { path = "../projects" }
careerbrew-policy = { path = "../policy" }
careerbrew-tutor = { path = "../tutor" }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
regex = "=1.13.2"

[[bin]]
name = "jobs-component"
path = "src/bin/jobs-component.rs"
