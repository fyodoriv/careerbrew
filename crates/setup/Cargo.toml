[package]
name = "careerbrew-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
careerbrew-vault = { path = "../vault" }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
glob = "=0.3.4"
libc = "=0.2.191"
tempfile = "=3.23.0"

[[bin]]
name = "setup-component"
path = "src/bin/setup-component.rs"
