[package]
name = "careerbrew-day"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
careerbrew-vault = { path = "../vault" }
careerbrew-setup = { path = "../setup" }
careerbrew-projects = { path = "../projects" }
careerbrew-feed = { path = "../feed" }
careerbrew-memory = { path = "../memory" }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
regex = "=1.13.2"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.23.0"

[[bin]]
name = "day-component"
path = "src/bin/day-component.rs"
