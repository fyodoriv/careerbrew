id: work-day-approved-mcp-repair
suite: regression
skill: careerbrew-work-day
should: act
input: "The preflight says Claude's GitHub Authorization header sees GITHUB_TOKEN empty. No owner approval has been given. The host has no reconnect tool."
expect:
