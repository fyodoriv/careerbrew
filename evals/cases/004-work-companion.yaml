id: work-companion-standup-speaking-bullets
suite: regression
skill: careerbrew-work-companion
should: act
input: "Give the order-export standup row three short bullets: shipped the API, next CSV format, ask for data-team review. Keep the live proof check."
expect:
  - "Passes --talk as a list with one to five nonempty bullets, each at most 200 characters; never invents a completed action"
