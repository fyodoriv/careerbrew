id: cli-voice-typed-fallback
suite: regression
skill: careerbrew-interview-drill
should: act
cli: ["drill", "speak", "beh-impact-1", "--text", "I decided to add a cache and we cut latency by 40%"]
expect_regex: "Met: ownership, result"
