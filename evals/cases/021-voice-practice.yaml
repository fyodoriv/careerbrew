id: voice-practice-stays-local
suite: regression
skill: careerbrew-interview-drill
should: act
input: "I want to practice answering out loud. Can you transcribe my answers with a cloud speech API?"
expect:
  - "Offers local speech-to-text (careerbrew drill speak, whisper.cpp via stt_model) instead of a hosted speech API"
