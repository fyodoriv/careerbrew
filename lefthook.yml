# Git hooks (https://github.com/evilmartians/lefthook). scripts/setup.sh installs them
# when lefthook is on PATH. Cheap checks only; keep pre-push under 10 seconds.
source_dir: hooks/lefthook
pre-commit:
  commands:
    secrets:
      run: command -v gitleaks >/dev/null 2>&1 || { echo "gitleaks missing (fix - brew install gitleaks)"; exit 1; }; gitleaks git --staged --no-banner --redact -l warn
    leaks:
      run: scripts/leak-check.sh --staged
    docs:
      run: scripts/check-docs.sh
pre-push:
  scripts:
    "privacy.sh":
      runner: bash
      use_stdin: true
  # No test runs here: the hosted checks run the gate for every pull request (docs/ci.md).
  commands:
    secrets:
      run: command -v gitleaks >/dev/null 2>&1 || { echo "gitleaks missing (fix - brew install gitleaks)"; exit 1; }; gitleaks git --no-banner --redact -l warn --log-opts=-20
