# Agent dependencies for careerbrew. Preview: `agentbrew sync --dry-run`. Apply: `agentbrew sync`.
# Generated per-agent files (.claude/, .codex/) are outputs; edit this file instead.
skills:
  - test-driven-development
  - verification-before-completion
  - writing-plans
  - next-task
  - report-upstream   # offers safe upstream issue reports (CONTRIBUTING.md)

skillDirectories:
  - ./skills

# Slash commands (/careerbrew-corporate, /careerbrew-checkup, /careerbrew-grind) deploy from here.
commands:
  - ./commands

# Tests run on hosted CI only (docs/ci.md). agentbrew copies the command as is,
# so it names the main checkout's stable path; the hook itself checks that the
# command runs inside a careerbrew checkout. A missing file does nothing.
hooks:
  - event: PreToolUse
    matcher: Bash
    command: 'f="$HOME/apps/careerbrew/hooks/block-local-tests.sh"; [ ! -f "$f" ] || bash "$f"'
